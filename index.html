  tag:`2026-11-04`,
  label:`2026년 11월 4일 (수)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`10월 한국 외환보유액이 반등하며 증가세로 전환된 가운데, 반도체 중심의 수출이 3분기 성장을 견인하고 있습니다.`,
  metrics:[`외환보유액 4,431.6억 달러 기록`,`월간 약 26억 달러 증가`],
  summary:`한국은행에 따르면 지난달 말 기준 우리나라의 외환보유액은 4,431억 6,000만 달러로 집계되었습니다. 이는 전월 대비 약 26억 달러 증가한 수치로, 최근의 감소세를 끊고 반등에 성공한 것입니다. 이러한 반등의 주된 원인은 글로벌 달러화 약세와 함께 외화자산 운용수익이 증가했기 때문입니다. 더불어 AI 인프라 수요 지속으로 메모리 반도체 수출이 견조한 흐름을 유지하며 전체 무역수지 흑자를 뒷받침하고 있습니다. 하지만 수출 호조와 달리 내수와 건설업 침체가 길어지면서 체감 경기와의 괴리가 여전히 큰 상황입니다. 한국은행은 안정적인 외환보유액을 바탕으로 외부 충격에 대비할 수 있는 기초체력은 확인했다고 평가했습니다. 전문가들은 내수 활성화를 위한 추가적인 정책적 지원이 절실한 시점이라고 지적합니다.`,
  keyTerms:[{term:`외환보유액`,explanation:`한 국가가 비상사태에 대비해 비축하고 있는 외화 자금으로, 국가 경제의 안전판 역할을 합니다.`}],
  history:`한국은 과거 1997년 외환위기 당시 달러 고갈로 뼈아픈 구조조정을 겪은 바 있습니다. 이후 꾸준히 달러 자산을 축적해 왔으며, 최근 글로벌 고금리와 강달러 기조 속에서 환율 방어를 위해 일부 자산을 소모하기도 했습니다. 하지만 최근 다시 반등하며 안정적인 궤도에 올랐습니다.`,
  players:`주요 행위자는 외환시장을 관리하는 한국은행과 기획재정부입니다. 또한 수출 실적을 주도하는 삼성전자, SK하이닉스 등 국내 핵심 반도체 기업들이 무역수지 흑자에 기여하고 있습니다. 반면 내수 부진을 겪고 있는 소상공인과 건설업계는 정책적 배려를 요구하고 있습니다.`,
  current:`현재 외환보유액 반등은 글로벌 달러화 지수 하락과 맞물려 한국 경제의 대외 건전성 우려를 완화시켜주고 있습니다. 수출과 내수 간의 극명한 양극화 현상이 하반기 경제 정책의 최대 화두가 되었습니다.`,
  outlook:`향후 미국의 금리 인하 속도와 글로벌 무역 환경 변화가 환율의 주요 변수가 될 것입니다. 정부는 수출 호조세를 내수 시장으로 파급시키기 위한 부양책 마련에 집중할 것으로 예상됩니다.`,
  sources:[{title:`외환보유액 다시 증가세 전환 - 한국경제`,url:`https://www.hankyung.com/economy/1`},{title:`반도체 수출 호조 속 내수 부진 - 매일경제`,url:`https://www.mk.co.kr/news/economy/1`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 중심의 고율 관세 압박과 무역 정책 재편 움직임이 가속화되면서 글로벌 공급망 비용 상승 우려가 커지고 있습니다.`,
  metrics:[`일부 품목 최대 60% 고율 관세 예고`,`글로벌 물류 비용 지수 15% 상승`],
  summary:`최근 미국은 자국 산업 보호를 명분으로 주요 수입품에 대해 대규모 고율 관세 부과를 예고하며 이른바 보호무역 2.0 시대를 열고 있습니다. 특히 중국산 첨단 제품과 우회 수출품을 겨냥한 강도 높은 무역 장벽이 세워지고 있어 글로벌 무역 시장이 요동치고 있습니다. 이러한 조치는 전 세계적인 공급망 재편을 강제하며 다국적 기업들의 물류비용과 생산 단가를 급격히 끌어올리고 있습니다. 한국의 배터리 및 자동차 기업들 역시 미국 현지 생산 압박을 받으며 투자 전략을 전면 수정해야 하는 상황에 직면했습니다. 시장 전문가들은 보호무역 강화가 단기적으로는 미국 내 일자리를 보호할 수 있지만, 장기적으로는 심각한 인플레이션 압력을 가중시킬 것이라고 경고합니다. 현재 주요국들은 미국의 관세 폭탄에 대응하기 위해 세계무역기구(WTO) 제소 및 보복 관세 카드를 만지작거리고 있습니다.`,
  keyTerms:[{term:`보호무역 2.0`,explanation:`단순한 관세 부과를 넘어 동맹국 간의 공급망 재편과 첨단 기술 통제까지 포함하는 더욱 강력하고 포괄적인 자국 중심의 경제 정책입니다.`}],
  history:`과거 미중 무역 전쟁에서 촉발된 관세 인상 조치가 이제는 전면적인 공급망 분리로 진화했습니다. 팬데믹 이후 자국 내 필수 물자 생산 역량의 중요성이 부각되면서 각국은 경제 안보를 최우선 가치로 내세우기 시작했습니다. 이는 수십 년간 이어져 온 자유무역주의 패러다임의 중대한 퇴조를 의미합니다.`,
  players:`자국 중심주의를 강력히 추진하는 미국 정부와 이에 맞대응하는 중국 상무부가 핵심 행위자입니다. 그 사이에 끼인 유럽연합(EU)과 한국, 일본 등 동맹국들은 자국의 실익을 지키기 위해 아슬아슬한 줄타기 외교를 벌이고 있습니다. 비용 증가에 직면한 다국적 기업들도 주요 이해관계자입니다.`,
  current:`현재 글로벌 기업들은 관세 리스크를 회피하기 위해 생산 기지를 다변화하는 차이나 플러스 원 전략을 서두르고 있습니다. 주요국 간의 무역 갈등 긴장감이 그 어느 때보다 고조된 상태입니다.`,
  outlook:`미국 중간선거 결과에 따라 이러한 보호무역 기조의 강도와 속도가 한층 더 가팔라질 수 있습니다. 향후 글로벌 무역 환경은 경제 블록화와 함께 극심한 불확실성 시대로 접어들 전망입니다.`,
  sources:[{title:`미국 보호무역 강화 현황 - Bloomberg`,url:`https://www.bloomberg.com/news/1`},{title:`글로벌 관세 전쟁의 나비효과 - 조선일보`,url:`https://www.chosun.com/economy/1`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`막대한 AI 인프라 투자 대비 실제 수익화 속도에 대한 시장의 의구심이 번지며 주요 빅테크 종목들의 주가 변동성이 확대되고 있습니다.`,
  metrics:[`빅테크 4사 AI 설비투자 연간 2,000억 달러 돌파`,`AI 서비스 관련 직접 매출 비중 5% 미만`],
  summary:`마이크로소프트, 구글, 아마존 등 주요 빅테크 기업들이 AI 데이터센터와 GPU 확보를 위해 천문학적인 자본적지출(CAPEX)을 단행하고 있습니다. 올해 이들의 AI 설비투자 규모는 연간 2,000억 달러를 넘어설 것으로 전망되지만, 시장의 시선은 싸늘해지고 있습니다. 천문학적인 투자 비용 대비 실제 AI 서비스를 통한 수익 창출 속도가 현저히 느리다는 AI 수익성 회의론이 확산되고 있기 때문입니다. 월스트리트 투자자들은 단순한 사용자 증가를 넘어 기업 고객들의 실질적인 매출 기여도를 증명할 것을 요구하고 있습니다. 이로 인해 최근 실적 발표 이후 주요 빅테크 종목들의 주가가 큰 폭으로 출렁이며 나스닥 지수의 변동성을 키우고 있습니다. 기업들은 장기적인 승자가 되기 위해 단기적인 마진 하락을 감수해야 한다고 항변하고 있습니다. 시장은 향후 1~2년 내에 AI 킬러 애플리케이션의 등장 여부가 생존을 가를 것으로 보고 있습니다.`,
  keyTerms:[{term:`자본적지출(CAPEX)`,explanation:`기업이 미래의 이윤을 창출하거나 가치를 유지하기 위해 장비, 토지, 건물 등 물리적 자산에 투자하는 비용을 뜻합니다.`}],
  history:`챗GPT 등장 이후 글로벌 IT 기업들은 AI 주도권을 잡기 위해 경쟁적으로 인프라 투자에 뛰어들었습니다. 초기에는 투자의 규모 자체가 기업의 미래 가치로 직결되며 주가 상승을 이끌었습니다. 하지만 최근 들어 고비용 구조에 대한 우려가 투자 심리를 압박하기 시작했습니다.`,
  players:`엔비디아를 필두로 하는 AI 반도체 공급 기업들과 이들의 주요 고객인 클라우드 서비스 제공자(CSP)들이 핵심 주체입니다. 또한 거대한 자금을 굴리는 월가 헤지펀드와 기관 투자자들의 평가가 시장의 방향성을 결정짓고 있습니다. AI를 도입해 생산성을 높이려는 일반 기업 고객들도 중요한 역할을 합니다.`,
  current:`현재 AI 인프라 구축의 병목 현상은 완화되고 있으나, 이를 활용한 B2B 수익 모델의 한계가 명확히 드러나고 있습니다. 시장 참가자들은 투자에서 회수의 단계로 검증의 기준을 이동시켰습니다.`,
  outlook:`내년 상반기까지 빅테크 기업들이 유의미한 AI 구독 매출 궤적을 증명하지 못할 경우 대규모 주가 조정이 불가피할 수 있습니다. 반대로 확실한 수익 모델을 선점하는 기업은 차세대 플랫폼의 절대 강자로 군림할 것입니다.`,
  sources:[{title:`빅테크 AI 투자 딜레마 - FT`,url:`https://www.ft.com/tech/1`},{title:`AI 수익성 논란 점화 - Reuters`,url:`https://www.reuters.com/tech/1`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`대통령의 집값 하락 관련 발언을 두고 여야가 현실 인식의 차이를 드러내며 거센 정치적 공방을 벌이고 있습니다.`,
  metrics:[`서울 주요 아파트 거래량 전월 대비 12% 감소`,`야당 지지율 2.5%p 하락`],
  summary:`최근 이재명 대통령이 주요 지역의 집값이 하락세를 보이고 있으며 투기공화국 탈출을 위한 폭락 대비책을 강구 중이라고 밝히면서 정치권에 파장이 일고 있습니다. 대통령실은 억제된 가계대출 규제 효과가 본격화되며 주택 시장이 안정화되고 있다는 긍정적인 평가를 내놓았습니다. 그러나 야당은 이러한 발언이 무주택 서민들이 체감하는 부동산 현실 인식과 동떨어져 있다고 강하게 비판하며 대여 공세의 수위를 높였습니다. 특히 야당 지도부는 청년층의 주거 불안이 여전한 상황에서 섣부른 자화자찬은 정책 실패를 가리려는 꼼수라고 지적했습니다. 반면 여당은 부동산 시장의 연착륙을 유도하기 위한 선제적 신호라며 대통령을 적극 옹호하고 나섰습니다. 양측의 팽팽한 기싸움 속에서 향후 금리 인하 여부와 맞물린 후속 부동산 정책이 연말 정국의 최대 쟁점으로 부상할 전망입니다.`,
  keyTerms:[{term:`부동산 현실 인식`,explanation:`정부의 거시적인 통계 데이터와 일반 국민들이 일상에서 체감하는 주거 비용 및 집값 불안 사이의 체감 차이를 의미합니다.`}],
  history:`과거 정부부터 부동산 문제는 정권의 지지율을 좌우하는 가장 민감한 뇌관이었습니다. 수차례의 규제와 완화 정책이 반복되면서 시장의 피로도가 극에 달했습니다. 최근 고금리 장기화로 인해 거래 절벽 현상이 나타나며 새로운 국면을 맞이했습니다.`,
  players:`정책을 입안하고 집행하는 국토교통부와 대통령실이 여당과 함께 한 축을 형성하고 있습니다. 이에 맞서 정부의 정책 실패를 부각시켜 여론을 주도하려는 거대 야당이 맹렬히 대립 중입니다. 혼란스러운 정책 시그널에 불안해하는 실수요자와 투자자들도 핵심 이해관계자입니다.`,
  current:`현재 가계부채 관리라는 명분 아래 대출 규제가 강화되면서 매수 심리가 크게 위축된 상태입니다. 여야는 이를 서로 유리하게 해석하며 주도권 싸움을 벌이고 있습니다.`,
  outlook:`연말 다가올 추가 금리 인하 기대감이 시장에 미칠 파장이 주목됩니다. 여야는 다가오는 재보궐 선거를 겨냥해 각기 다른 맞춤형 주거 안정 대책을 쏟아낼 것으로 보입니다.`,
  sources:[{title:`대통령 부동산 발언 후폭풍 - 중앙일보`,url:`https://www.joongang.co.kr/politics/1`},{title:`여야 엇갈린 집값 해석 - KBS`,url:`https://news.kbs.co.kr/politics/1`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`야당이 이른바 조작기소 특검법을 본회의에서 강행 처리하려는 움직임을 보이면서 국회의 긴장감이 최고조에 달하고 있습니다.`,
  metrics:[`야당 본회의 의석수 170석 이상 확보`,`대통령 거부권 행사 시점 15일 이내`],
  summary:`국회에서는 현재 야당 주도로 특정 정치적 사건에 대한 검찰의 수사가 조작되었다는 의혹을 규명하기 위한 조작기소 특검법이 쟁점으로 떠올랐습니다. 야당은 다수 의석을 앞세워 이번 주 본회의에서 해당 법안을 단독으로라도 상정하여 통과시키겠다는 강경한 입장을 고수하고 있습니다. 이에 여당은 명백한 정치 공세이자 헌정 질서를 훼손하는 입법 폭주라며 필리버스터(무제한 토론)를 포함한 모든 수단을 동원해 저지하겠다고 맞서고 있습니다. 만약 특검법이 본회의를 통과할 경우, 대통령의 재의요구권(거부권) 행사가 기정사실화되고 있어 극한의 여야 대립이 불가피합니다. 정국이 특검 정국으로 급속히 빨려 들어가면서 민생 법안과 내년도 예산안 심사 일정마저 파행을 겪을 위기에 처했습니다. 시민사회 일각에서는 정쟁에 매몰된 국회를 향한 비판의 목소리도 커지고 있습니다.`,
  keyTerms:[{term:`조작기소 특검법`,explanation:`검찰이 정치적 의도를 가지고 증거를 조작하여 기소했다는 의혹을 조사하기 위해, 독립적인 특별검사를 임명하도록 요구하는 법안입니다.`}],
  history:`한국 정치사에서 특검법은 주로 권력형 비리나 대형 스캔들이 터질 때마다 진상 규명을 명분으로 발의되었습니다. 최근 수년간 검찰 수사의 중립성을 둘러싼 여야의 갈등이 심화되면서 특검법 발의와 거부권 행사가 쳇바퀴처럼 반복되는 양상을 보이고 있습니다. 이는 진영 간의 극심한 양극화를 보여주는 단면입니다.`,
  players:`수사를 주도한 검찰 조직과 이를 비판하며 특검을 추진하는 야당 지도부가 최전선에서 충돌하고 있습니다. 여당은 정부를 방어하며 입법 강행을 비판하는 방패 역할을 맡고 있습니다. 최종적으로 법안 수용 여부를 결정할 대통령실의 결단이 남아있습니다.`,
  current:`현재 여야는 한 치의 양보 없는 강대강 대치를 이어가며 타협의 여지를 찾지 못하고 있습니다. 본회의 표결 결과에 따라 정국의 주도권이 크게 요동칠 전망입니다.`,
  outlook:`대통령의 거부권 행사 이후 국회에서 재표결 절차가 진행될 경우 여당 내 이탈표 발생 여부가 핵심 변수가 될 것입니다. 특검 정국은 내년 초까지 정치권의 블랙홀 역할을 할 가능성이 높습니다.`,
  sources:[{title:`조작기소 특검법 전운 고조 - 한겨레`,url:`https://www.hani.co.kr/politics/1`},{title:`민생 실종된 여야 대치 - 연합뉴스`,url:`https://www.yna.co.kr/politics/1`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`2026년 미국 중간선거가 코앞으로 다가온 가운데, 베팅 사이트에 수십억 달러의 판돈이 몰리며 전 세계적 이목이 쏠리고 있습니다.`,
  metrics:[`폴리마켓 등 예측 시장 판돈 20억 달러 돌파`,`경합주 여론조사 오차범위 내 1%p 접전`],
  summary:`미국의 향후 2년간 정치 지형을 결정지을 2026년 미국 중간선거 레이스가 막바지에 접어들면서 선거 판세가 안갯속으로 빠져들고 있습니다. 주요 정치 베팅 시장에서는 어느 당이 의회의 주도권을 잡을지를 두고 무려 20억 달러가 넘는 막대한 판돈이 몰리며 과열 양상을 보이고 있습니다. 여론조사 기관들은 펜실베이니아, 미시간 등 핵심 경합주에서 양당 후보가 1%p 미만의 초박빙 접전을 벌이고 있다고 발표했습니다. 민주당은 낙태권 보호와 민주주의 수호를 내세우며 지지층 결집에 나선 반면, 공화당은 인플레이션과 이민자 문제를 집중 공격하며 심판론을 점화하고 있습니다. 이번 선거 결과에 따라 글로벌 통상 정책, 우크라이나 지원 등 미국의 핵심 대외 정책이 급변할 수 있습니다. 전 세계 동맹국과 시장 투자자들은 숨을 죽인 채 미국 유권자들의 최종 선택을 주시하고 있습니다.`,
  keyTerms:[{term:`미국 중간선거`,explanation:`대통령 임기 4년 중 2년 차에 치러지는 선거로, 연방 하원 전체와 상원의 3분의 1을 새로 선출하여 현직 대통령에 대한 중간 평가 성격을 가집니다.`}],
  history:`미국의 중간선거는 전통적으로 집권 여당의 무덤으로 불리며, 야당이 다수당을 차지하는 경우가 많았습니다. 지난 수차례의 선거에서 나타난 극심한 정치 양극화는 유권자들의 이념적 분열을 심화시켰습니다. 이번 선거 역시 대선의 연장선상에서 치열한 진영 대결이 펼쳐지고 있습니다.`,
  players:`의회 수성을 노리는 현직 대통령과 민주당, 그리고 탈환을 벼르는 공화당 지도부가 주요 행위자입니다. 거액의 후원금을 쏟아붓는 정치활동위원회와 베팅 시장의 큰손 투자자들도 무시할 수 없는 세력입니다. 결과를 좌우할 부동층 유권자들이 최종 캐스팅보트를 쥐고 있습니다.`,
  current:`현재 선거를 불과 며칠 앞두고 가짜 뉴스와 흑색선전이 난무하며 선거판이 혼탁해지고 있습니다. 양당은 핵심 지지층의 투표율을 최대한 끌어올리기 위해 총력전을 전개하고 있습니다.`,
  outlook:`선거 결과가 확정되기까지 우편투표 개표 지연 등으로 인해 수일이 소요될 수 있으며, 박빙 지역에서는 재검표 논란이 일어날 소지가 다분합니다. 결과에 따라 글로벌 금융시장에 일시적인 충격파가 닥칠 수 있습니다.`,
  sources:[{title:`미국 중간선거 초박빙 승부 - NYT`,url:`https://www.nytimes.com/politics/1`},{title:`베팅 시장으로 본 미 의회 판세 - WSJ`,url:`https://www.wsj.com/politics/1`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`한국이 세계에서 가장 빠른 속도로 초고령사회에 진입하면서 법정 정년 연장과 노동 유연화 논의가 뜨거운 감자로 떠올랐습니다.`,
  metrics:[`65세 이상 인구 비율 21% 돌파`,`국민연금 수급 연령과 정년 간 격차 5년`],
  summary:`최근 한국의 65세 이상 노인 인구 비율이 21%를 넘어서며 공식적인 초고령사회에 진입함에 따라 노동 시장의 근본적인 체질 개선이 요구되고 있습니다. 가장 시급한 현안으로 대두된 것은 현재 60세인 법정 정년을 65세로 연장하는 방안입니다. 노동계는 은퇴 이후 국민연금을 받기 전까지 발생하는 소득 공백기를 메우기 위해 정년 연장이 필수적이라고 주장하고 있습니다. 반면 재계는 청년 고용 위축과 인건비 부담 증가를 이유로 호봉제 폐지 및 임금피크제 도입 등 노동 유연화가 선행되어야 한다고 맞서고 있습니다. 정부는 노사정 대화 채널을 통해 점진적이고 자율적인 계속고용 제도를 안착시키려 하지만 양측의 입장 차이가 워낙 커 난항을 겪고 있습니다. 인구 구조 붕괴가 현실화된 지금, 세대 간 갈등을 최소화하며 사회적 합의를 이끌어내는 것이 국가적 과제가 되었습니다.`,
  keyTerms:[{term:`초고령사회`,explanation:`전체 인구 중 65세 이상 노령 인구가 차지하는 비율이 20%를 초과하는 사회로, 심각한 노동력 부족과 복지 비용 급증을 초래합니다.`}],
  history:`한국은 유례없이 빠른 저출산과 기대수명 연장을 동시에 경험하며 초스피드로 노령화가 진행되었습니다. 과거 생산가능인구의 풍부함이 경제 성장을 이끌었던 인구 보너스 시대는 끝나고, 이제는 부양 부담이 폭증하는 인구 오너스 시대의 부작용을 마주하고 있습니다. 이미 수년 전부터 연금 고갈 경고음이 지속해서 울렸습니다.`,
  players:`퇴직을 앞둔 베이비부머 세대와 일자리 경쟁을 우려하는 청년층 간의 이해관계가 첨예하게 대립하고 있습니다. 정책을 조율하는 고용노동부와 비용 부담을 안아야 하는 경영계, 그리고 노동자의 권익을 대변하는 노동조합이 협상 테이블의 주역들입니다.`,
  current:`현재 국회에서는 정년 연장을 의무화하는 법안 발의가 줄을 잇고 있으나, 기업들의 거센 반발에 부딪혀 국회 문턱을 넘지 못하고 있습니다. 각 기업 단위별로 촉탁직 형태의 편법적인 재고용만 늘어나는 추세입니다.`,
  outlook:`내년 상반기 노사정 위원회의 타협안 도출 여부가 최대 분수령이 될 것입니다. 장기적으로는 외국인 이민 정책 개편과 묶어 국가 단위의 거시적인 인력 수급 계획이 새롭게 짜여질 전망입니다.`,
  sources:[{title:`초고령사회 진입과 정년 연장 딜레마 - 조선일보`,url:`https://www.chosun.com/society/1`},{title:`청년 일자리와 노인 빈곤 사이 - SBS`,url:`https://news.sbs.co.kr/society/1`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`스스로 계획하고 실행하는 추론형 AI 에이전트가 대세로 자리 잡은 가운데, 딥시크 발 오픈소스 쇼크가 빅테크 생태계를 흔들고 있습니다.`,
  metrics:[`추론형 AI 기반 업무 자동화 도입 기업 35% 증가`,`딥시크 모델 오픈소스 다운로드 1억 건 돌파`],
  summary:`인공지능 업계의 패러다임이 단순 챗봇 모델에서 벗어나, 인간의 개입 없이 스스로 목표를 세우고 복잡한 작업을 수행하는 추론형 AI 에이전트 중심으로 급속히 재편되고 있습니다. 특히 코딩, 데이터 분석 등 논리적 사고가 필요한 분야에서 혁신적인 생산성 향상이 보고되면서 많은 기업들이 AI 에이전트를 실무에 빠르게 투입하고 있습니다. 이와 동시에 중국의 딥시크가 엄청난 가성비와 추론 성능을 앞세운 오픈소스 모델을 배포하면서 글로벌 AI 지형에 지각변동을 일으켰습니다. 딥시크의 등장은 막대한 비용을 들여 폐쇄형 모델을 고집하던 핵심 빅테크 기업들의 독점 체제에 치명적인 타격을 입혔습니다. 전 세계 스타트업과 개발자들은 저렴한 고성능 모델을 환영하고 있지만, 서방 국가들은 안보 유출 및 AI 패권 상실을 크게 우려하고 있습니다. 바야흐로 AI 기술의 성능 향상과 민주화가 동시에 폭발하는 중대한 변곡점에 서 있습니다.`,
  keyTerms:[{term:`추론형 AI`,explanation:`주어진 질문에 단순히 답변만 하는 것을 넘어, 문제 해결을 위해 스스로 여러 단계의 논리적 사고와 계획을 세우고 실행할 수 있는 차세대 인공지능입니다.`}],
  history:`생성형 AI의 붐을 일으킨 초기 거대언어모델들은 환각 현상과 논리력 부재라는 명확한 한계를 보였습니다. 이를 극복하기 위해 연구자들은 모델이 출력하기 전에 내면적으로 사고의 사슬을 형성하도록 훈련시켰고, 최근 들어 이 기술이 상용화 단계에 이르렀습니다.`,
  players:`시장을 선도하려는 전통적 빅테크가 한 진영을 이룹니다. 맞은편에는 무서운 속도로 기술 격차를 좁힌 중국의 딥시크 연구진과, 이들의 오픈소스를 기반으로 생태계를 확장하는 전 세계 독립 개발자들이 거대한 커뮤니티를 형성하고 있습니다.`,
  current:`현재 AI 기업들은 모델의 파라미터 크기 경쟁을 멈추고, 추론의 효율성과 에이전트의 안정성을 입증하는 지능형 최적화 경쟁에 사활을 걸고 있습니다. 미국 정부는 자국 기술 우위를 지키기 위한 수출 통제와 규제 카드를 고심 중입니다.`,
  outlook:`앞으로 AI 에이전트 간의 통신과 자율 협업 기술이 표준화될 것으로 예상됩니다. 더불어 국가 간 AI 칩 확보전과 알고리즘 보안 장벽은 한층 험악해질 가능성이 높습니다.`,
  sources:[{title:`추론형 AI의 비약적 발전 - AP`,url:`https://apnews.com/tech/1`},{title:`딥시크 쇼크와 무너지는 빅테크 독점 - ZDNet`,url:`https://zdnet.co.kr/it/1`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`주사제 방식이 주도하던 비만 치료제 시장에서, 복용 편의성을 획기적으로 높인 경구용 신약의 글로벌 임상 경쟁이 격화되고 있습니다.`,
  metrics:[`글로벌 비만 치료제 시장 규모 2030년 1천억 달러 전망`,`알약 형태 신약 임상 2상 체중 감량률 15% 달성`],
  summary:`위고비와 젭바운드로 대변되는 글로벌 비만 치료제 시장의 패권 경쟁이 기존의 피하주사 방식에서 알약 형태인 경구용 치료제로 빠르게 옮겨가고 있습니다. 최근 다국적 제약사들이 진행 중인 경구용 비만 치료제 임상시험에서 주사제와 맞먹는 15% 이상의 놀라운 체중 감량 효과가 연이어 발표되면서 의료계의 찬사를 받고 있습니다. 매일 또는 매주 주사를 맞아야 하는 환자들의 고통과 번거로움을 덜어주는 경구용 신약은 향후 비만 시장의 게임 체인저가 될 것으로 평가받습니다. 글로벌 선두 주자들은 물론, 한국을 포함한 후발 바이오 벤처기업들까지 알약 개발에 천문학적인 자금을 쏟아부으며 참전했습니다. 다만 주사제에 비해 위장관 흡수율이 낮아 원료가 많이 소모된다는 점에서, 높은 생산 단가와 심각한 공급 부족 문제가 해결해야 할 최우선 과제로 지목됩니다. 시장 분석가들은 경구용 치료제의 성공적인 상용화가 미용과 헬스케어 산업의 경계를 완전히 허물 것이라고 내다보고 있습니다.`,
  keyTerms:[{term:`경구용 치료제`,explanation:`주삿바늘을 사용하지 않고 입으로 삼켜서 복용하는 알약이나 캡슐 형태의 약물로, 환자의 복용 편의성을 크게 높여줍니다.`}],
  history:`비만 치료제는 본래 당뇨병 치료 목적으로 개발되었으나, 탁월한 체중 감량 효과가 입증되면서 전 세계적인 품귀 현상을 빚었습니다. 그러나 기존 약물들은 모두 환자가 직접 찔러 넣어야 하는 주사제 방식이어서 주사 공포증이나 감염 우려 등 접근성에 큰 제약이 있었습니다.`,
  players:`시장을 양분하고 있는 글로벌 거대 제약사들이 차세대 신약 개발을 주도하고 있습니다. 이 독점 체제를 깨기 위해 다른 글로벌 제약사들과 국내 굴지의 바이오 기업들이 도전장을 내밀며 치열한 연구개발 각축전을 벌이고 있습니다.`,
  current:`현재 여러 경구용 신약 후보 물질들이 임상 2상과 3상을 숨 가쁘게 통과하며 유효성을 입증하고 있습니다. 시장의 기대감이 커지면서 관련 제약사들의 주가는 연일 신고가를 경신하는 중입니다.`,
  outlook:`빠르면 1~2년 내에 최초의 고효율 경구용 비만 치료제가 시장에 정식 출시될 전망입니다. 이는 약가 인하 경쟁을 촉발하여 비만 치료의 대중화를 앞당기는 기폭제가 될 것입니다.`,
  sources:[{title:`알약 비만 치료제 임상 성공 연발 - Reuters`,url:`https://www.reuters.com/health/1`},{title:`글로벌 제약사 경구용 신약 전쟁 - 매일경제`,url:`https://www.mk.co.kr/science/1`}]
}]

  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`정부, 역대 최대 규모인 820조 9,000억 원의 2027년도 예산안 국회 시정연설 제출`,
  metrics:[`820조 9,000억 원`,`전년 대비 4.5% 증가`],
  summary:`정부가 2027년도 국가 예산안을 820조 9,000억 원 규모로 확정하고 국회에 시정연설을 통해 제출했습니다. 이는 전년 대비 약 4.5% 증가한 역대 최대 규모입니다. 경기 둔화 우려 속에 민생 안정과 첨단 산업 투자를 늘리겠다는 의도로 풀이됩니다. 그러나 세수 펑크 우려가 여전한 상황에서 정부는 엄격한 건전재정 기조를 지키며 예산을 짰다고 강조했습니다. 국회 심의 과정에서 복지 예산과 SOC 예산을 둘러싼 여야의 치열한 공방이 예상됩니다. 현재 예산안은 각 상임위와 예결위의 심사를 앞두고 있습니다.`,
  keyTerms:[{term:`건전재정`,explanation:`국가 채무를 적정 수준으로 관리하며 수입 범위 내에서 지출을 통제하려는 재정 운용 기조를 말합니다.`}],
  history:`최근 수년간 세수 부족 사태를 겪으며 정부는 지출 증가율을 최대한 억제해 왔습니다.`,
  players:`기획재정부와 정부 여당은 재정 건전성을, 야당은 적극적 재정 역할을 주장하고 있습니다.`,
  current:`예산안 국회 제출로 본격적인 심의 정국이 막을 올렸습니다.`,
  outlook:`법정 처리 시한인 12월 2일 이내에 예산안이 통과될 수 있을지 귀추가 주목됩니다.`,
  sources:[{title:`내년도 예산안 820.9조 원 확정 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`정부, 국회 시정연설서 예산안 협조 당부 - KBS`,url:`https://news.kbs.co.kr/`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국 연간 수출액, 사상 최초로 9,000억 달러 돌파가 유력시되며 무역 흑자 기대`,
  metrics:[`9,000억 달러`,`반도체 수출 20% 증가`],
  summary:`올해 한국의 연간 총수출액이 사상 처음으로 9,000억 달러를 넘어설 것으로 관측되고 있습니다. 주력 산업인 반도체 수요가 전 세계적으로 폭증하면서 전체 수출을 강력하게 견인했습니다. 자동차와 2차전지 분야 역시 북미 시장을 중심으로 견조한 실적을 냈습니다. 이에 따라 만성적인 적자 우려를 털어내고 대규모 무역수지 흑자가 기대되는 상황입니다. 11월과 12월의 연말 수출 성수기까지 고려하면 연간 최대 실적 경신은 기정사실화되고 있습니다. 정부는 수출 호조세가 내수 소비로 이어질 수 있도록 지원책을 마련 중입니다.`,
  keyTerms:[{term:`무역수지`,explanation:`일정 기간 동안 한 국가의 상품 수출액과 수입액의 차이를 의미하며, 수출이 많으면 흑자, 수입이 많으면 적자로 기록됩니다.`}],
  history:`2024~2025년 글로벌 고금리 환경에서 한국 수출은 일시적 침체를 겪었으나, 최근 빅테크 투자 확대로 급반등했습니다.`,
  players:`삼성전자와 SK하이닉스 등 주요 반도체 기업과 자동차 완성차 업계가 실적을 주도하고 있습니다.`,
  current:`10월 말까지 누적 수출 데이터가 호조를 보이며 올해 9,000억 달러 돌파 가시권에 들어섰습니다.`,
  outlook:`내년에도 AI 반도체 수요가 이어질 것으로 보여 수출 상승세가 당분간 지속될 전망입니다.`,
  sources:[{title:`연간 수출액 사상 첫 9,000억 불 돌파 기대 - 한국경제`,url:`https://www.hankyung.com/`},{title:`반도체가 이끈 수출, 무역 흑자 견인 - 매일경제`,url:`https://www.mk.co.kr/`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미·이란 간 군사적 긴장 지속으로 국제 유가 급등 등 글로벌 원자재 시장 요동`,
  metrics:[`배럴당 85달러 돌파`,`천연가스 5% 상승`],
  summary:`미국과 이란 사이의 군사적 긴장이 다시 고조되면서 글로벌 에너지 시장이 크게 출렁이고 있습니다. 중동 지역의 무력 충돌 우려로 인해 브렌트유 등 국제 유가는 단숨에 배럴당 85달러 선을 돌파했습니다. 천연가스 가격도 공급망 차질 우려로 하루 만에 5% 이상 상승했습니다. 이러한 심각한 지정학적 리스크는 전 세계 인플레이션을 다시 자극할 수 있어 각국 중앙은행들을 긴장시키고 있습니다. 다만, 물밑에서 외교적 협상 시도도 계속되고 있어 가격 방향성은 예측하기 어려운 혼조세입니다. 투자자들은 중동 발 뉴스 속보에 민감하게 반응하며 안전 자산에 자금을 옮기고 있습니다.`,
  keyTerms:[{term:`지정학적 리스크`,explanation:`국가 간의 분쟁, 전쟁, 혹은 외교적 마찰 등 지리적·정치적 요인으로 인해 세계 경제나 금융 시장에 발생하는 위험을 뜻합니다.`}],
  history:`미국과 이란은 오랫동안 핵 합의 및 중동 내 무장단체 지원 문제를 두고 팽팽한 갈등을 이어왔습니다.`,
  players:`미국 연방정부, 이란 혁명수비대(IRGC), 그리고 석유수출국기구(OPEC) 등 주요 산유국들이 얽혀 있습니다.`,
  current:`최근 호르무즈 해협 인근에서의 무력시위 정황이 포착되면서 원유 수급 불안감이 고조되었습니다.`,
  outlook:`무력 충돌이 실제 발생할 경우 유가가 100달러를 넘을 수 있다는 경고와 함께 외교적 타결 가능성도 제기됩니다.`,
  sources:[{title:`Middle East Tensions Drive Oil Prices Past \$85 - Bloomberg`,url:`https://www.bloomberg.com/`},{title:`Global Commodities Fluctuate on US-Iran Stand-off - Reuters`,url:`https://www.reuters.com/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`11월 3일 미국 중간선거를 이틀 앞두고 연방 상·하원 주도권을 향한 양당의 막판 유세 최고조`,
  metrics:[`연방 하원 435석`,`상원 34석`],
  summary:`2026년 11월 3일 치러지는 미국 중간선거가 이틀 앞으로 다가온 가운데, 민주당과 공화당이 펜실베이니아 등 핵심 경합주에서 총력 유세를 펼치고 있습니다. 이번 선거에서는 연방 하원 435석 전체와 상원 34석, 그리고 다수의 주지사가 교체될 예정입니다. 바이든 행정부 후반부의 국정 동력을 결정지을 중요한 선거로, 공화당이 대대적인 승리를 거두는 레드 웨이브가 일어날지, 아니면 민주당이 예상 밖 선전을 거둘지가 초미의 관심사입니다. 연방수사국(FBI) 등 보안 당국은 선거 개입을 막기 위해 사이버 보안 경계 태세를 최고 수준으로 끌어올렸습니다. 투표 결과는 글로벌 무역 및 기후 정책에도 막대한 영향을 미칠 전망입니다.`,
  keyTerms:[{term:`레드 웨이브`,explanation:`미국 선거에서 공화당(상징색: 빨간색)이 압도적인 표차로 승리하여 의회 다수당을 차지하는 돌풍 현상을 비유하는 말입니다.`}],
  history:`역대 미국 중간선거에서는 통상적으로 집권 여당이 패배하고 야당이 의회 다수당을 차지하는 경향이 짙었습니다.`,
  players:`행정부를 사수하려는 민주당 지지층과, 정권 심판론을 앞세우는 도널드 트럼프 및 공화당 지지층이 결집 중입니다.`,
  current:`사전 투표율이 역대 최고치를 기록하는 등 양 진영의 정치적 양극화와 선거 열기가 극에 달해 있습니다.`,
  outlook:`선거 당일 자정부터 윤곽이 드러나겠지만, 우편 투표 개표 지연 시 최종 결과 확정까지 며칠이 소요될 수 있습니다.`,
  sources:[{title:`US Midterm Elections D-2: Candidates make final push - AP News`,url:`https://apnews.com/`},{title:`Control of Congress hinges on key battleground states - NYT`,url:`https://www.nytimes.com/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`에르도안 튀르키예 대통령, 시노프 제2원전 건설 파트너로 한국을 유력하게 검토 중이라 시사`,
  metrics:[`예상 사업비 300억 달러`,`원자로 4기 규모`],
  summary:`에르도안 튀르키예 대통령이 최근 인터뷰에서 흑해 연안 시노프 지역의 제2원자력발전소 건설 사업 협력국으로 한국을 가장 유력하게 검토하고 있다고 밝혔습니다. 이번 프로젝트는 총 4기의 원자로를 건설하는 대규모 사업으로, 예상 사업비만 300억 달러에 달합니다. 튀르키예 정부는 한국의 뛰어난 원전 시공 능력과 납기 준수 실적을 높이 평가한 것으로 전해졌습니다. 본격적인 계약이 성사된다면 체코, 폴란드에 이어 한국의 K-원전 수출 르네상스가 더욱 가속화될 것입니다. 양국 정부 실무진은 자금 조달 방안 등 구체적인 조건에 대한 막바지 조율에 들어간 상태입니다.`,
  keyTerms:[{term:`원전 수출`,explanation:`국내 기술로 개발한 원자력 발전소의 설계, 시공, 운영 능력을 해외 국가에 판매하여 대규모 외화를 창출하는 산업 활동입니다.`}],
  history:`튀르키예는 2010년대 초반부터 시노프 원전 사업을 추진해왔으며, 일본, 중국 등과 협상했으나 비용 문제로 무산된 바 있습니다.`,
  players:`한국수력원자력(한수원)을 비롯한 팀코리아 컨소시엄과 튀르키예 에너지부가 협상의 주체입니다.`,
  current:`최근 글로벌 탈탄소 기조에 맞춰 튀르키예가 원전 확보에 다시 속도를 내면서 한국이 최적의 파트너로 부상했습니다.`,
  outlook:`내년 상반기 중으로 정부 간 협정(IGA) 체결 및 우선협상대상자 선정이 가시화될 것으로 예상됩니다.`,
  sources:[{title:`에르도안 '한국과 시노프 원전 협력 유력 검토' - 조선일보`,url:`https://www.chosun.com/`},{title:`Turkey leans toward South Korea for Sinop nuclear plant - FT`,url:`https://www.ft.com/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`2027년도 예산안 심사를 위한 국회 예결특위 가동 개시, '삭감 vs 원안' 여야 극한 대립 예고`,
  metrics:[`삭감 목표 최소 5조 원`,`법정 시한 12월 2일`],
  summary:`정부가 제출한 821조 원 규모의 내년도 예산안을 심사하기 위해 국회 예산결산특별위원회가 본격 가동되었습니다. 여당은 경제 활성화와 민생 지원을 위해 원안 고수가 필수적이라는 입장인 반면, 야당은 불필요한 사업 예산을 최소 5조 원 이상 삭감하겠다고 벼르고 있습니다. 특히 권력기관의 특수활동비와 일부 국책 사업 예산을 두고 팽팽한 줄다리기가 이어지고 있습니다. 이 과정에서 각 부처의 예산을 깎고 늘리는 예산결산특별위원회 본회의장에서는 치열한 삿대질과 고성이 오갔습니다. 여야의 입장 차이가 워낙 커서 12월 2일 법정 처리 시한을 지킬 수 있을지는 불투명한 상황입니다.`,
  keyTerms:[{term:`예산결산특별위원회`,explanation:`정부가 편성한 국가 예산안과 기금 운용안을 최종적으로 심사하고 확정하기 위해 국회 내에 설치된 핵심 특별 위원회입니다.`}],
  history:`매년 연말마다 정부 예산안을 두고 여야는 삭감과 증액을 둘러싸고 물리적 충돌 직전까지 가는 파행을 반복해 왔습니다.`,
  players:`정부 예산안을 방어하려는 집권 여당과, 송곳 검증을 통해 주도권을 쥐려는 야당 예결위원들이 대립하고 있습니다.`,
  current:`상임위별 예비 심사가 끝나고 예결위 예산안조정소위에서 본격적인 세부 항목 칼질이 시작되었습니다.`,
  outlook:`법정 기한을 넘겨 연말 임시국회 막판까지 밀실 타협(소소위)이 이어지는 구태가 재연될 우려가 제기됩니다.`,
  sources:[{title:`국회 예결위 가동... '821조' 예산 삭감 공방전 - MBC`,url:`https://imnews.imbc.com/`},{title:`여야 예결위서 특활비 예산 놓고 강경 대치 - SBS`,url:`https://news.sbs.co.kr/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`미국 나스닥 빅테크 기업들의 막대한 AI 설비투자 비용 대비 저조한 수익성 우려로 증시 관망세 확산`,
  metrics:[`AI 설비투자 400억 달러 초과`,`나스닥 1.2% 하락 마감`],
  summary:`최근 실적을 발표한 미국의 주요 빅테크 기업들이 인공지능(AI) 인프라 구축에만 400억 달러가 넘는 천문학적 자본을 쏟아부은 것으로 나타났습니다. 투자 규모는 급증했지만, 정작 AI 서비스를 통한 가시적인 현금 창출 능력이 시장의 기대에 미치지 못하면서 투자자들의 실망감이 커졌습니다. 막대한 데이터센터 구축 비용이 영업이익률을 압박하고 있다는 점이 부각되자 뉴욕 증시의 기술주들은 약세를 면치 못했고 나스닥 지수는 1.2% 하락했습니다. 월가에서는 기업들이 확실한 AI 수익화 모델을 증명하기 전까지는 당분간 기술주 전반에 걸쳐 신중한 관망세가 이어질 것으로 분석하고 있습니다. 한국의 반도체 및 부품 관련 주식들도 이러한 글로벌 기류의 영향을 받아 혼조세를 보였습니다.`,
  keyTerms:[{term:`AI 수익화`,explanation:`기업이 인공지능 기술과 인프라에 투자한 막대한 비용을 회수하기 위해, 실제 사용자나 기업에게 요금을 받고 서비스를 팔아 돈을 버는 과정을 뜻합니다.`}],
  history:`2023년부터 이어진 생성형 AI 열풍 속에서 구글, MS, 메타 등은 시장 선점을 위해 경쟁적으로 데이터센터와 GPU 확보에 나섰습니다.`,
  players:`월스트리트 투자 은행들과 빅테크 경영진 사이에서 투자 속도 조절론과 장기 투자 불가피론이 맞서고 있습니다.`,
  current:`이번 3분기 실적 발표 시즌을 기점으로 AI 투자의 '가성비'에 대한 시장의 의구심이 본격적으로 표출되었습니다.`,
  outlook:`향후 출시될 기업용 AI 소프트웨어 구독 서비스의 실제 성과가 테크 기업들의 주가 반등을 결정지을 핵심 변수가 될 것입니다.`,
  sources:[{title:`Big Tech's AI Spending Spree Spooks Wall Street - WSJ`,url:`https://www.wsj.com/`},{title:`Nasdaq dips as investors question AI profitability - CNBC`,url:`https://www.cnbc.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`세계 최대 가상자산 거래소 바이낸스 사이버 공격 피해액 2억 달러 발생, 자체 비상 펀드로 전액 보전 발표`,
  metrics:[`피해 추정액 2억 달러`,`비트코인 일시적 3% 급락`],
  summary:`세계 최대 가상자산 거래소인 바이낸스가 어제 새벽 조직적인 사이버 해킹 공격을 받아 거액의 가상자산이 유출되는 사고가 발생했습니다. 보안 전문가들에 따르면 이번 공격으로 유출된 피해액은 약 2억 달러에 달하는 것으로 추산됩니다. 해킹 소식이 전해지자 비트코인을 비롯한 주요 가상자산 가격이 일시적으로 3% 이상 급락하며 시장이 크게 출렁였습니다. 다행히 바이낸스 측은 즉각 입출금을 통제하고, 해킹된 자산은 오프라인 보관소인 콜드 월릿에 있던 자산이 아니라고 해명했습니다. 또한 거래소가 자체 조성해둔 비상 안전 펀드(SAFU)를 동원해 사용자 피해를 전액 보전하겠다고 발표하면서 시장의 충격을 빠르게 수습했습니다.`,
  keyTerms:[{term:`콜드 월릿`,explanation:`인터넷과 연결되지 않은 오프라인 상태의 물리적 저장 매체에 가상자산을 보관하여 해킹의 위험을 원천적으로 차단하는 안전한 지갑입니다.`}],
  history:`가상자산 시장은 과거 마운트곡스나 FTX 사태 등 대형 거래소의 해킹 및 파산으로 인해 보안 신뢰도에 치명타를 입어왔습니다.`,
  players:`북한 연계 해커 조직이나 다국적 사이버 범죄 그룹이 이번 공격의 배후로 의심받고 있어 국제 공조 수사가 진행 중입니다.`,
  current:`바이낸스의 신속한 전액 보상 약속 덕분에 과거와 같은 대규모 뱅크런(대량 인출 사태)은 발생하지 않았습니다.`,
  outlook:`이번 사태를 계기로 주요 국가의 금융 당국들이 가상자산 거래소의 사이버 보안 및 지급 준비금 규제를 한층 강화할 것으로 보입니다.`,
  sources:[{title:`Binance hit by \$200m hack, promises full refund - CoinDesk`,url:`https://www.coindesk.com/`},{title:`Crypto market shakes after Binance cyber attack - BBC`,url:`https://www.bbc.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`가을비 이후 전국적 '영하권 초겨울 추위' 예보 속 산불방지대책본부 조기 가동`,
  metrics:[`아침 최저 기온 영하 2도`,`건조주의보 발령 30% 증가`],
  summary:`주말 동안 내린 가을비가 그친 직후, 북서쪽에서 찬 공기가 강하게 남하하면서 전국적으로 기온이 급격히 떨어지고 있습니다. 기상청은 내륙 산간 지방의 아침 최저 기온이 영하 2도까지 떨어지는 등 때 이른 초겨울 추위가 찾아올 것이라고 예보했습니다. 기온 하강과 함께 대기가 빠르게 메말라가면서 산림청은 전국에 산불 재난 국가위기경보를 상향 발령했습니다. 가을철 건조주의보가 발령된 지역이 예년보다 30% 이상 증가함에 따라 중앙 및 지역 산불방지대책본부도 예년보다 앞당겨 비상 체제 가동에 돌입했습니다. 소방 당국은 입산자들의 화기 소지 단속을 강화하고 헬기 출동 태세를 점검하는 등 피해 예방에 만전을 기하고 있습니다.`,
  keyTerms:[{term:`건조주의보`,explanation:`공기 중의 습도가 매우 낮아져 화재 발생 위험이 커질 때 기상청에서 발령하는 기상 특보로, 실효습도 35% 이하가 지속될 때 내려집니다.`}],
  history:`최근 몇 년간 극단적인 기후 변화로 인해 봄철뿐만 아니라 가을과 겨울철에도 대형 산불이 빈번하게 발생하고 있습니다.`,
  players:`산림청, 소방청, 그리고 전국 지방자치단체들이 공조하여 24시간 산불 감시 및 초동 진화 체계를 구축하고 있습니다.`,
  current:`강한 바람과 함께 습도가 급격히 낮아지면서 작은 불씨도 대형 산불로 번질 수 있는 위험한 조건이 형성되었습니다.`,
  outlook:`추위와 건조한 날씨는 이달 중순까지 지속될 것으로 보여, 당분간 화재 예방에 대한 각별한 주의가 요구됩니다.`,
  sources:[{title:`때 이른 영하권 추위... 산불방지대책본부 조기 가동 - 중앙일보`,url:`https://www.joongang.co.kr/`},{title:`가을비 끝 초겨울 시작, 전국 산불 위기경보 상향 - YTN`,url:`https://www.ytn.co.kr/`}]
}]

  tag:`2026-11-02`,
  label:`2026년 11월 2일 (월)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 10월 비농업 고용 증가 폭이 예상치를 크게 밑돌며 고용 시장 둔화 신호가 강해지고 있습니다.`,
  metrics:[`10월 신규 고용 11만 명으로 예상치 하회`,`미 10년물 국채 금리 4.3% 돌파하며 변동성 확대`],
  summary:`미국의 10월 비농업 부문 고용 증가세가 시장의 예상치를 크게 밑돌면서 고용 시장 둔화 우려가 커지고 있습니다. 미국 노동부 발표에 따르면 신규 일자리 창출이 급격히 축소되어 경제 둔화의 명확한 신호로 해석되고 있습니다. 이에 따라 연방준비제도의 향후 금리 인하 속도와 폭을 둘러싸고 월스트리트 전문가들의 전망이 엇갈리는 상황입니다. 일각에서는 경기 침체 방어를 위해 더욱 공격적인 금리 인하가 필요하다고 주장합니다. 반면, 다른 한편에서는 인플레이션 불씨가 완전히 꺼지지 않았다며 신중론을 펴고 있습니다. 이러한 엇갈린 전망 속에 미 국채 금리 변동성이 크게 확대되며 금융 시장이 출렁이고 있습니다. 투자자들은 다가오는 연방공개시장위원회(FOMC) 정례회의에서 나올 제롬 파월 의장의 발언에 촉각을 곤두세우고 있습니다.`,
  keyTerms:[{term:`비농업 부문 고용`,explanation:`농축산업을 제외한 산업에서 창출된 일자리 수로, 미국 실물 경제의 활력을 보여주는 가장 핵심적인 지표 중 하나입니다.`}],
  history:`미국은 팬데믹 이후 극심한 인플레이션을 잡기 위해 고강도 긴축을 이어왔으며, 최근 물가 안정과 고용 유지를 동시에 달성하려 노력해왔습니다. 최근 물가 오름세가 꺾이면서 시장의 초점은 물가에서 고용으로 점차 이동했습니다. 그러나 이번 지표 발표로 고용 시장 연착륙에 대한 확신이 흔들리고 있습니다.`,
  players:`미국의 통화 정책을 결정하는 연방준비제도(Fed)와 이에 민감하게 반응하는 글로벌 투자은행들이 핵심 주체입니다. 바이든 행정부 역시 선거를 앞두고 일자리 지표에 촉각을 세우고 있습니다.`,
  current:`시장의 금리 인하 기대감이 선반영된 상태에서 예상치 못한 고용 둔화는 투자 심리를 급격히 위축시키고 있습니다. 특히 채권 시장에서 수익률 불확실성을 피하려는 자금 이동이 가속화되는 중입니다.`,
  outlook:`다가오는 연방공개시장위원회(FOMC)에서의 기준금리 결정이 가장 중요한 이벤트입니다. 연준 위원들의 금리 전망 점도표 변화와 파월 의장의 기자회견이 단기적인 글로벌 증시 방향성을 결정할 것입니다.`,
  sources:[{title:`미국 10월 고용지표 둔화, 연준 금리 경로 안갯속 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`U.S. Payrolls Grow Slower Than Expected in October - Reuters`,url:`https://www.reuters.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`중국의 10월 구매관리자지수(PMI)가 50선 부근에서 등락하며 대규모 부양책의 효과에 시선이 쏠리고 있습니다.`,
  metrics:[`중국 10월 제조업 PMI 50.1 기록`,`5개월 만에 경기 확장 국면 턱걸이 진입`],
  summary:`중국 국가통계국이 발표한 10월 제조업 구매관리자지수가 50.1을 기록하며 간신히 확장 국면으로 진입했습니다. 이는 지난 5개월 간 이어지던 수축 국면을 벗어난 수치로, 시장에서는 긍정적인 초기 신호로 평가하고 있습니다. 최근 중국 정부가 연이어 내놓은 지급준비율 인하와 부동산 규제 완화 등 대규모 경기 부양책이 일부 실물 경제에 반영되기 시작한 것으로 분석됩니다. 그러나 지수가 경기 확장과 수축을 가르는 경계선인 50선에 턱걸이 수준으로 머물고 있어 본격적인 경기 회복세로 단정하기는 아직 이릅니다. 내수 침체와 청년 실업 문제 등 중국 경제의 구조적인 난관이 여전히 산적해 있기 때문입니다. 전문가들은 재정 지출 확대를 동반한 추가적인 실물 경제 지원책 없이는 단기 반등에 그칠 수 있다고 경고합니다. 전 세계 금융시장은 세계 최대 소비 시장인 중국의 실물경기 회복 여부가 글로벌 경제에 미칠 파급 효과를 예의주시하고 있습니다.`,
  keyTerms:[{term:`제조업 구매관리자지수`,explanation:`기업의 구매 담당자들을 상대로 신규 주문, 생산, 재고 등을 설문 조사해 수치화한 것으로, 50보다 높으면 경기 확장, 낮으면 경기 수축을 의미합니다.`}],
  history:`중국 경제는 방역 해제 이후에도 심각한 부동산 침체와 고질적인 내수 부진으로 인해 좀처럼 과거의 성장 활력을 찾지 못했습니다. 디플레이션 진입 우려까지 겹치면서 시장 전반의 비관론이 팽배했습니다. 이를 타개하기 위해 당국은 최근 유동성 공급과 규제 완화 카드를 총동원했습니다.`,
  players:`중국의 중앙은행인 인민은행과 거시경제를 총괄하는 국가발전개혁위원회 등 경제 정책을 지휘하는 국가 기관들이 핵심입니다. 이에 영향을 받는 외국인 투자자들과 수출 주도 다국적 기업들도 사태를 주시하고 있습니다.`,
  current:`정부의 대규모 부양책 발표 이후 주식 시장이 단기적으로 급등했으나, 실물 경제 지표의 실질적인 뒷받침 여부가 가장 중요한 관건이 된 상황입니다. 이번 PMI 수치 개선이 일시적 현상이 아닌 장기 추세로 자리잡을지가 핵심 쟁점입니다.`,
  outlook:`다가오는 전국인민대표대회 상무위원회에서 지방정부 부채 탕감 등을 포함한 추가 재정 부양책 규모가 얼마나 발표될지가 시장의 최대 관심사입니다. 부양책의 실제 집행 강도에 따라 향후 중국의 성장률 전망치가 크게 요동칠 것입니다.`,
  sources:[{title:`중국 10월 제조업 PMI 50.1…5개월만에 확장 국면 - 한국경제`,url:`https://www.hankyung.com/`},{title:`China's factory activity expands in October after massive stimulus - Bloomberg`,url:`https://www.bloomberg.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국의 10월 반도체 수출이 40%대 증가율을 보이며 급증해 사상 첫 연간 수출 1조 달러 달성 기대감이 커지고 있습니다.`,
  metrics:[`10월 반도체 수출 전년 대비 40.3% 증가`,`총수출 누적 달성률 역대 최고치 기록`],
  summary:`대한민국의 10월 전체 수출액이 반도체 부문의 강력한 호조에 힘입어 전년 동기 대비 큰 폭으로 증가했습니다. 특히 전 세계적인 인공지능(AI) 열풍에 따른 고대역폭 메모리(HBM)와 고부가가치 인프라용 반도체 수요가 10월 수출 실적을 강력하게 견인한 것으로 나타났습니다. 최근 미국발 기술주 주가 조정 여파로 금융 시장의 불안감이 컸으나, 한국 주요 반도체 기업들의 이익 창출 펀더멘털은 여전히 견고함이 입증되었습니다. 이러한 고성장세가 연말까지 유지된다면 올해 한국 경제는 사상 최초로 연간 수출 1조 달러라는 금자탑을 세울 수 있을 것으로 전망됩니다. 정부와 업계는 현재의 수출 호조세가 주요 IT 기업들의 신제품 출시 효과와 맞물려 4분기 내내 지속될 것으로 조심스럽게 예측하고 있습니다. 다만 글로벌 경제 둔화 리스크와 미국 대선에 따른 환율 변동성이 하반기 막판 변수로 작용할 수 있어 당국이 시장 상황을 예의주시하고 있습니다. 경제 전문가들은 반도체 중심의 이 긍정적 흐름이 국내 제조업 전반과 고용 활력으로 이어질지 분석하고 있습니다.`,
  keyTerms:[{term:`고대역폭 메모리(HBM)`,explanation:`여러 개의 메모리 칩을 수직으로 쌓아 올려 데이터 처리 속도를 혁신적으로 끌어올린 첨단 반도체로, 인공지능 연산에 필수적으로 사용됩니다.`}],
  history:`한국 수출은 과거 수차례 반도체 사이클 하락과 글로벌 공급망 차질로 심각한 위기를 겪었습니다. 최근 몇 년간은 강력한 미중 무역 갈등 속에서 중간재 수출이 고전하기도 했습니다. 하지만 최근 인공지능 산업이 폭발적으로 성장하면서 다시 강력한 중장기 상승 모멘텀을 맞이했습니다.`,
  players:`삼성전자와 SK하이닉스 등 전 세계 메모리 시장을 주도하는 국내 핵심 반도체 제조사들과 이들의 최대 고객사인 글로벌 빅테크 기업들이 중심에 있습니다. 무역 정책과 인프라 지원을 담당하는 산업통상자원부의 조율 역할도 중요합니다.`,
  current:`빅테크 기업들의 AI 서버 투자 수요가 폭발적으로 증가하며 메모리 반도체, 특히 최첨단 제품군에 대한 공급 부족 현상까지 발생하고 있습니다. 이는 단기적으로는 물론 중기적인 한국 수출 지표를 끌어올리는 가장 강력한 원동력입니다.`,
  outlook:`11월 말 블랙 프라이데이로 다가오는 미국의 쇼핑 시즌 등 연말 특수가 일반 IT 부품 수요를 얼마나 더 자극할지 지켜보아야 합니다. 차세대 반도체 공정 개발 경쟁에서의 승패가 향후 몇 년간의 대한민국의 수출 물량을 쥐고 흔들 것입니다.`,
  sources:[{title:`10월 반도체 수출 40% 급증…연간 수출 1조 달러 눈앞 - 매일경제`,url:`https://www.mk.co.kr/`},{title:`AI boom pushes South Korea tech exports to record high - FT`,url:`https://www.ft.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`국정감사가 마무리되면서 국회는 정부가 제출한 820조 원 규모의 내년도 예산안 심사 정국에 본격적으로 돌입했습니다.`,
  metrics:[`2027년도 정부 총지출 예산안 820조 원 편성`,`야당 핵심 국책 사업 예산 대폭 삭감 경고`],
  summary:`제22대 국회의 국정감사가 막을 내리면서 여야 정치권의 시선은 내년도 슈퍼 예산안 심사로 집중되고 있습니다. 정부가 국회에 제출한 820조 원 규모의 매머드급 예산안을 두고 본격적인 예산 정국이 막을 올린 것입니다. 정부와 집권 여당은 장기 저성장 국면 돌파와 서민 민생 안정을 위해 팽창적 확장 재정이 불가피하다는 입장을 굽히지 않고 있습니다. 반면 거대 야당은 국가 채무의 가파른 증가와 재정 건전성 악화를 강하게 우려하며, 불필요하다고 판단되는 정부 예산의 대폭 삭감을 벼르고 있습니다. 특히 과학기술 R&D 예산 복원 규모와 현 정부의 역점 국책 사업 예산을 두고 상임위 곳곳에서 팽팽한 힘겨루기가 진행 중입니다. 양측은 예산안 처리 법정 시한을 앞두고 예산결산특별위원회에서 한 치의 양보 없는 치열한 공방을 벌일 것으로 예상됩니다. 민생 지원이라는 명분 뒤에 숨은 당파적 주도권 다툼과 총선용 선심성 예산 확보전이 이번 정국의 핵심 쟁점으로 떠올랐습니다.`,
  keyTerms:[{term:`예산결산특별위원회`,explanation:`정부가 짜온 한 해 나라 살림(예산안)이 적절한지 최종적으로 검토하고 삭감이나 증액을 심사하는 국회의 특별 위원회입니다.`}],
  history:`역대 국회마다 내년도 예산안 심사는 쟁점 법안 강행 처리와 맞물려 혹독한 파행을 겪어왔습니다. 특히 팬데믹 이후 국가 부채가 급증하면서 재정 건전성과 재정 확대를 둘러싼 여야의 이념적 대립은 매년 더욱 격화되었습니다. 헌법에 명시된 법정 시한을 넘기는 늑장 처리가 어느덧 고질적인 관행으로 굳어졌습니다.`,
  players:`예산안 원안을 수성하려는 기획재정부 및 여당 지도부와, 송곳 검증과 대규모 삭감을 벼르는 더불어민주당 등 야당 원내 지도부가 충돌하는 주체입니다.`,
  current:`야당은 정부의 특정 사업 예산을 전액 삭감하겠다며 강경한 태도로 기선을 제압하려 하고 있으며, 여당은 이를 국정 운영의 발목을 잡는 다수의 횡포로 규정하고 강하게 맞서고 있습니다.`,
  outlook:`헌법상 예산안 법정 처리 시한인 12월 2일까지 여야 간 극적인 타협이 이루어질지, 아니면 사상 초유의 예산안 야당 단독 처리 혹은 준예산 사태라는 파국으로 이어질지가 초미의 관심사입니다.`,
  sources:[{title:`국감 끝, 820조 '슈퍼 예산' 정국 돌입…R&D 쟁점 예고 - KBS`,url:`https://news.kbs.co.kr/`},{title:`여야 820조 예산안 전쟁 시작…건전재정 vs 민생확장 충돌 - 조선일보`,url:`https://www.chosun.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`정부가 소수자 보호 명분 아래 발생한 내국인 역차별 논란을 해소하기 위해 다문화 가구 우대 정책을 소득 기준으로 대폭 개편합니다.`,
  metrics:[`상위 20% 고소득 다문화 가구 무상 혜택 제한`,`주택 청약 특별공급 기준 소득 연계 대폭 강화`],
  summary:`정부가 현행 다문화 가구 지원 정책의 전면적인 기준 개편을 예고하며 정치권과 시민사회에 파장이 일고 있습니다. 대통령실과 소관 부처는 부분적인 불공정을 소수자 보호라는 낡은 명분 아래 계속 방치할 수 없다며 혜택 재조정의 당위성을 거듭 강조했습니다. 특히 고소득 다문화 가구에까지 무분별하게 제공되던 주택 청약 우선권 및 무상 교육 혜택이 일반 내국인 가정과의 심각한 역차별 논란을 낳았다는 점을 지적했습니다. 앞으로 마련될 새 지침에서는 다문화 가정이라 하더라도 가구의 실질 소득 수준과 구체적 필요에 따라 혜택이 철저히 차등 적용될 예정입니다. 이러한 조치는 국가의 한정된 복지 재원을 경제적으로 더 어려운 진짜 취약 계층에게 집중하겠다는 윤석열 정부의 복지 기조로 해석됩니다. 반면 야당 일각에서는 이를 두고 이주민에 대한 사회적 갈등과 편견을 부추기는 갈라치기 포퓰리즘 정책이라며 비판의 목소리를 높이고 있습니다. 이 민감한 정책 변화가 향후 입법 과정에서 여야 간 새로운 이념 논쟁으로 격렬하게 비화될 조짐을 보이고 있습니다.`,
  keyTerms:[{term:`현행 다문화 가구 지원 정책`,explanation:`결혼 이민자나 귀화자 등으로 이루어진 가족이 한국 사회에 잘 정착할 수 있도록 교육, 주거, 의료 등 다양한 분야에서 제공하는 정부의 특별 혜택을 말합니다.`}],
  history:`과거 다문화 가정의 원활한 사회 안착을 위해 도입된 다양한 파격적 우대 정책들은 저출산 고령화 시대를 대비하는 필수적인 국가적 조치로 폭넓게 지지를 받았습니다. 그러나 시간이 흐르고 다문화 가구 내에서도 경제적 양극화가 심해지면서, 획일적인 혜택 적용이 오히려 일반 서민들의 박탈감을 유발한다는 불만이 꾸준히 누적되어 왔습니다.`,
  players:`정책의 궤도를 수정하려는 대통령실 및 여성가족부가 전면에 서 있으며, 기존 권리의 축소를 우려하는 이민자 지원 단체와 진보 성향 야당 정치인들이 강력히 반발하는 구도입니다.`,
  current:`최근 2030 내국인 청년층과 무주택 신혼부부들을 중심으로 현행 청약 제도가 몹시 불공정하다는 여론이 강하게 형성되었고, 정부는 이 불만을 정책 개편의 핵심 동력으로 삼아 발 빠르게 속도를 내고 있습니다.`,
  outlook:`향후 국회에서 혜택 축소를 골자로 한 관련 법령 개정안이 공식 상정될 때, 야당의 거센 반대와 인권단체의 시위 등 거센 저항이 예상되며 타협에 이르는 사회적 합의 과정이 매우 험난할 전망입니다.`,
  sources:[{title:`대통령실 다문화 역차별 없앤다…고소득 가구 혜택 손질 - 중앙일보`,url:`https://www.joongang.co.kr/`},{title:`소수자 우대 정책 수술대 오르나…야권은 '갈라치기' 반발 - 한겨레`,url:`https://www.hani.co.kr/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`북한이 전술탄도미사일 연속 발사 등 대남 무력 압박을 강화하자, 한국 정부는 다자외교 무대에서 이를 강력히 규탄하며 국제 공조에 나섰습니다.`,
  metrics:[`북한 동해상으로 단거리 전술탄도미사일 다수 발사`,`한국 정부 G20 회의서 대북 규탄 국제성명 주도`],
  summary:`북한이 최근 동해상으로 신형 전술탄도미사일 시험 발사를 강행하며 한반도 일대의 군사적 긴장 수위를 한층 끌어올리고 있습니다. 군 당국은 이번 기습적인 미사일 발사가 한국의 주요 군사 시설에 대한 정밀 대남 타격 능력을 과시하기 위한 다목적 압박 전술의 일환이라고 심층 분석했습니다. 이와 동시에 최근 발생한 비무장지대(DMZ) 내 북한군 지뢰 폭발 사고를 둘러싼 진실 공방과 외교적 여파도 가라앉지 않고 계속되고 있습니다. 한국 외교부 대표단은 브라질에서 열린 G20 회의 등 주요 다자외교 무대에서 북한의 잇따른 도발 사건을 적극적으로 거론하며 국제사회의 각별한 주의를 환기시켰습니다. 정부는 북한의 거듭된 무력시위와 비상식적인 도발 행위가 명백한 유엔 안보리 결의 위반이자 역내 평화 파괴 행위임을 강도 높게 비판했습니다. 주요 서방 국가들을 포함한 국제사회 역시 북한의 일방적인 행보에 우려를 표하며 한반도 평화를 위한 남북 간 무조건적인 대화와 소통 창구 복원의 필요성을 재차 촉구했습니다. 강력한 대내외적 경제 제재에도 불구하고 북한의 핵·미사일 고도화 기조가 당분간 굳건히 유지될 것으로 보여 실효성 있는 외교적 억지력 해법 마련이 매우 시급한 상황입니다.`,
  keyTerms:[{term:`신형 전술탄도미사일`,explanation:`수천 킬로미터를 날아가는 전략 미사일과 달리 수백 킬로미터 내의 가까운 적 주요 목표물을 정밀하게 타격하기 위해 개발된 소형 탄도미사일을 의미합니다.`}],
  history:`북한은 김정은 위원장의 국방력 5대 과제 등 자체적인 무력 강화 계획에 따라 미사일 역량을 꾸준히 고도화해 왔으며, 한미 연합훈련 기간을 빌미로 무력시위의 강도와 빈도를 전략적으로 대폭 늘려왔습니다. 비무장지대 내 긴장 조성 행위 역시 남북 관계가 경색될 때마다 반복해서 꺼내드는 고전적인 전술입니다.`,
  players:`자신의 체제 결속과 핵무력을 과시하려는 북한 정권과, 이를 억제하고 방어 체계를 굳히려는 한미일 안보 동맹, 그리고 국제무대에서 규범을 강조하는 G20 회원국들이 핵심 이해관계자입니다.`,
  current:`북한은 외부의 강력한 경고와 경제 제재에도 아랑곳하지 않고 핵 탑재가 가능한 무기 체계의 실전 배치를 서두르고 있으며, 한국은 이에 즉각 대응하여 미국 등 우방국과의 긴밀한 공조를 이끌어내는 데 총력을 기울이고 있습니다.`,
  outlook:`향후 다가올 미국 새 행정부의 구체적인 외교 정책 변화와 맞물려 북한이 국면 전환을 노리고 제7차 핵실험 등 추가적인 중대 도발을 감행할지 여부가 동북아 안보 지형을 뒤흔들 가장 큰 변수가 될 것입니다.`,
  sources:[{title:`북한 전술탄도미사일 무더기 발사…대남 타격 능력 과시 - MBC`,url:`https://imnews.imbc.com/`},{title:`정부, G20서 북한 DMZ 지뢰도발 강력 규탄…국제사회 공조 촉구 - 조선일보`,url:`https://www.chosun.com/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`유럽연합(EU)이 세계 최초의 포괄적 AI 규제인 '인공지능법(AI Act)'의 강도 높은 모니터링에 착수하며 빅테크 기업들에 비상이 걸렸습니다.`,
  metrics:[`규정 위반 시 기업 연간 글로벌 매출의 최대 7% 과징금`,`집행위 산하 100명 규모 AI 모니터링 전담반 본격 가동`],
  summary:`유럽연합 집행위원회가 전 세계 글로벌 기술 기업들을 대상으로 '인공지능법(AI Act)' 준수 여부에 대한 본격적이고 엄격한 모니터링에 돌입했습니다. 세계 최초의 포괄적이고 강력한 AI 규제법으로 꼽히는 이 법안은 인공지능 시스템이 인간에게 미칠 위험도에 따라 각 기업에 철저히 차등적인 법적 의무를 부여합니다. 특히 선거 개입이 가능한 딥페이크나 생체 정보 분석 등 사회적 위험성이 높은 고위험 AI 모델에 대한 데이터 투명성 요구가 대폭 강화되었습니다. 이번 EU의 모니터링 착수는 단순한 행정적 경고를 넘어 실질적인 법 집행 단계이자 제재 국면으로 진입했음을 확고히 의미합니다. 규제를 위반할 경우 해당 기업은 전 세계 연간 총매출의 최대 7%에 달하는 파멸적인 수준의 과징금을 부과받을 수 있어 기업들의 긴장감이 팽배합니다. 이에 따라 첨단 AI 시장을 주도하는 미국과 중국의 주요 빅테크 기업들은 막대한 벌금을 피하기 위해 유럽 내 서비스 운영 방식을 원점에서 재검토하며 규제 리스크 방어에 총력을 기울이고 있습니다. 이번 유럽의 선제적 조치는 향후 전 세계 국가들이 앞다투어 도입할 인공지능 관련 입법의 가장 강력한 표준 기준점이 될 전망입니다.`,
  keyTerms:[{term:`'인공지능법(AI Act)'`,explanation:`유럽연합이 인공지능의 위험성을 등급별로 나누어 규제하기 위해 만든 세계 최초의 법안으로, AI가 인간의 안전이나 기본권을 침해하지 못하도록 깐깐하게 감시합니다.`}],
  history:`챗GPT의 등장 이후 AI 기술이 전례 없이 급속도로 발전하면서 가짜 뉴스 범람, 저작권 무단 침해, 알고리즘의 편향성 등 심각한 부작용에 대한 우려가 전 세계적으로 폭발적으로 커졌습니다. 이에 유럽연합은 수년간의 치열한 논의 끝에 기술의 혁신과 인간 윤리적 사용의 균형을 억지로라도 맞추기 위한 포괄적 방어 법안을 전격적으로 통과시켰습니다.`,
  players:`가장 엄격한 잣대로 규제를 주도하는 유럽연합(EU) 집행위원회와, 이 규제의 직접적 사정권에 들어온 오픈AI, 구글, 메타 등 막강한 자본력을 지닌 미국계 글로벌 빅테크 기업들이 법적으로 정면 충돌하고 있습니다.`,
  current:`법안 시행에 따른 자율 시정 유예 기간이 점차 실질적으로 종료됨에 따라, 기업들은 자사가 개발한 거대 AI 모델이 유럽의 까다로운 기준에 완벽히 부합하는지 스스로 입증해야 하는 거대한 컴플라이언스 부담과 비용 문제에 직면해 있습니다.`,
  outlook:`새 법안 아래서 첫 번째 철퇴(과징금 부과)를 맞는 1호 사례가 어느 기업에게 적용될지가 현재 업계의 초미의 관심사이며, 이 결과는 글로벌 테크 기업들의 향후 유럽 시장 일부 철수나 기능이 제한된 맞춤형 깡통 서비스 출시 여부를 최종 결정지을 것입니다.`,
  sources:[{title:`EU 인공지능법 본격 칼 빼든다…글로벌 빅테크 '초긴장' - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`EU starts sweeping compliance checks under its new AI Act - Bloomberg`,url:`https://www.bloomberg.com/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`정부가 게임물관리위원회가 독점해오던 모바일 게임 청불 심의와 내용수정신고 업무를 민간 위원회로 완전히 일원화 이관했습니다.`,
  metrics:[`연간 약 3만 건 모바일 게임 내용수정신고 절차 민간 일원화`,`청소년이용불가 등급 포함 게임 등급분류 민간이양 2단계 전면 시행`],
  summary:`한국 정부의 전방위적인 게임 산업 규제 완화 기조에 발맞춰, 그동안 꽉 막혀있던 모바일 게임물에 대한 핵심 심의 업무가 대거 민간 영역으로 완전히 이양되었습니다. 정부 기관인 게임물관리위원회는 등급분류 민간이양 2단계 조치의 핵심 일환으로, 그간 철저히 통제해 온 청소년이용불가 등급을 포함한 모든 모바일 게임의 심의 권한을 민간 기구인 게임콘텐츠등급분류위원회(GCRB)로 넘겼습니다. 또한 게임 업데이트 시마다 매번 밟아야 했던 번거롭고 복잡한 내용 수정 신고 업무도 민간으로 창구가 일원화되어 게임사들의 답답했던 행정 절차가 크게 간소화되었습니다. 이번 과감한 조치는 쉴 새 없이 급변하는 글로벌 모바일 게임 시장 환경에 신속하게 대응하고 업계 자체의 자율성을 대폭 높이기 위해 고심 끝에 마련되었습니다. 국내 중소 게임 개발사들은 중복 심의와 대기 시간으로 인한 엄청난 비용 낭비를 획기적으로 줄이고 적기에 신작 출시에 속도를 낼 수 있을 것으로 크게 환영하는 분위기입니다. 다만 학부모 단체 등 일각에서는 사행성을 조장하는 게임이나 지나치게 선정적인 서브컬처 콘텐츠에 대한 국가의 최소한의 여과 장치가 너무 헐거워질 수 있다는 깊은 우려도 꾸준히 제기하고 있습니다. 향후 새롭게 칼자루를 쥔 민간 위원회의 투명하고 객관적인 전문 심의 역량이 이제 본격적인 시험대에 오르게 되었습니다.`,
  keyTerms:[{term:`게임콘텐츠등급분류위원회(GCRB)`,explanation:`국가 기관(게임위)을 대신하여 게임의 내용이 연령별로 적절한지 민간 전문가들이 심사하고 등급을 매기기 위해 설립된 민간 기구입니다.`}],
  history:`대한민국의 게임 사전 심의 제도는 과거 온 나라를 떠들썩하게 했던 바다이야기 사태 이후 도박성 방지를 명분으로 매우 보수적이고 강력한 관 주도로 운영되어 왔습니다. 그러나 심의 지연 현상이 글로벌 스탠다드에 크게 뒤처진다는 비판과 게임 업계의 끈질긴 사전 검열 규제 완화 요구가 맞물리면서 서서히 점진적인 민간 이양 법안 논의가 국회를 중심으로 진행되어 왔습니다.`,
  players:`막강했던 사전 규제 권한을 마침내 내려놓게 된 게임물관리위원회와 새롭게 무거운 책임을 떠맡게 된 민간 기구인 게임콘텐츠등급분류위원회(GCRB), 그리고 제도의 족쇄에서 풀려나게 된 국내 모바일 게임 개발사들이 얽혀 있는 주요 주체입니다.`,
  current:`오랜 염원이었던 심의 행정 편의성이 대폭 개선되면서 업계 전반의 기대감이 몹시 높지만, 최근 특정 집단의 항의로 불거진 일부 서브컬처 게임의 고무줄 등급 논란 등으로 인해 민간 심의 기준의 사회적 객관성과 공정성 확보가 당면한 가장 시급한 핵심 과제로 떠올랐습니다.`,
  outlook:`민간 중심의 새로운 심의 체계가 큰 부작용 없이 시장에 안정적으로 정착할 수 있을지 당분간 지켜보아야 하며, 만약 자율 심의 과정의 맹점을 노려 치명적으로 심각한 문제적 게임이 무분별하게 유통될 경우 빗장을 풀었던 제도가 다시 강력한 국가 관 주도로 빠르게 회귀할 가능성도 완전히 배제할 수는 없는 상황입니다.`,
  sources:[{title:`모바일게임 청불 심의도 GCRB로…게임물 민간이양 본격화 - 아이뉴스24`,url:`https://www.inews24.com/`},{title:`게임위, 모바일게임 내용수정신고 GCRB로 일원화…규제 빗장 풀리나 - 한국경제`,url:`https://www.hankyung.com/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`엔비디아가 네이버의 핵심 지분 4.54%를 전격 인수하며, 세계 최대 가상자산거래소인 바이낸스 해킹 사태로 어수선한 글로벌 테크 시장에 초대형 AI 동맹의 탄생을 알렸습니다.`,
  metrics:[`엔비디아 네이버 지분 4.54% 약 1조 5천억 원 규모 매입`,`바이낸스 북한 배후 해킹 피해액 역대 최대 8.4조 원 추산`],
  summary:`세계 최대 가상자산거래소인 바이낸스를 강타한 8.4조 원대 대규모 해킹 사건의 유력한 배후로 북한이 지목되며 글로벌 사이버 보안에 비상이 걸린 가운데, 아시아 테크 시장에서는 거대한 지각 변동이 일어났습니다. 글로벌 AI 칩 시장을 사실상 독점하고 있는 엔비디아가 한국의 IT 거인 네이버의 핵심 지분 4.54%를 전격적으로 확보하며 강력한 AI 혈맹을 맺었다고 공식 발표했습니다. 미국 연방수사국(FBI)이 북한 해킹 조직의 엄청난 자금 유출 수법을 공개하며 디지털 인프라의 취약성이 도마에 오른 시점에, 한미 양국을 대표하는 기술 기업이 미래 생존을 위해 물리적인 지분 교환이라는 초강수를 둔 것입니다. 네이버는 이번 투자를 통해 자사의 초거대 AI 모델 고도화에 필수적인 엔비디아의 최신 GPU 공급망을 안정적으로 우선 확보하는 결정적인 쾌거를 거두었습니다. 반면 엔비디아 입장에서는 네이버가 지배하고 있는 거대한 한국어 데이터 생태계와 아시아 시장 진출의 교두보를 마련하여 오픈AI 견제 전선을 구축하려는 고도의 전략적 포석으로 전문가들은 풀이하고 있습니다. 이번 지분 인수로 양사는 차세대 AI 반도체 칩 최적화와 한국형 거대언어모델(LLM) 글로벌 수출이라는 공동의 거대한 목표를 향해 한 배를 타게 되었습니다. 글로벌 테크 시장에서는 해킹 리스크로 흔들리는 코인 시장의 혼란과 대조적으로, 미래 먹거리인 거대 인공지능 覇權(패권)을 차지하기 위한 국경을 초월한 빅테크 기업 간의 합종연횡이 어느 때보다 빠르고 치열하게 전개되고 있음을 보여주고 있습니다.`,

let current = null;
let currentCat = null;
const CAT_ORDER = ['경제', '정치', '기타 이슈'];

function renderSidebar() {
  const list = document.getElementById('date-list');
  list.innerHTML = '';
  BRIEFS.forEach((b, i) => {
    const el = document.createElement('div');
    el.className = 'date-item' + (i === 0 ? ' active' : '');
    el.dataset.tag = b.tag;
    const parts = b.tag.split('-');
    const short = parts[1] + '/' + parts[2];
    el.innerHTML = b.tag;
    el.addEventListener('click', () => showBrief(b.tag));
    list.appendChild(el);
  });
}

function showBrief(tag) {
  current = tag;
  document.querySelectorAll('.date-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tag === tag);
  });
  const brief = BRIEFS.find(b => b.tag === tag);
  if (!brief) return;

  // 카테고리별 그룹핑
  const grouped = {};
  brief.stories.forEach(s => {
    if (!grouped[s.category]) grouped[s.category] = [];
    grouped[s.category].push(s);
  });
  const availableCats = CAT_ORDER.filter(c => grouped[c] && grouped[c].length);
  if (!availableCats.length) return;

  // 기본 카테고리 결정
  if (!availableCats.includes(currentCat)) currentCat = availableCats[0];

  renderContent(brief, grouped, availableCats);
}

      <div class="bh-eyebrow">Morning Brief</div>
      <h2>${brief.label}</h2>
    </div>`;

  // 탭
  html += '<div class="cat-tabs">';
  availableCats.forEach(c => {
    const cls = c === currentCat ? 'cat-tab active' : 'cat-tab';
    html += `<button class="${cls}" data-cat="${c}">${c}</button>`;
  });
  html += '</div></div>';

  // 선택된 카테고리 기사들
  const stories = grouped[currentCat] || [];
  stories.forEach((s, idx) => {
    if (idx > 0) html += '<hr class="story-divider">';
    html += `<div class="story">
      <div class="story-top">
        <div class="story-headline">${s.headline}</div>
      </div>`;
    if (s.metrics.length) {
      html += '<div class="metrics">';
      s.metrics.forEach(m => { html += `<div class="metric-chip">${m}</div>`; });
      html += '</div>';
    }
    // 요약문에 핵심 개념 밑줄 (출력은 박스 다음)
    let summaryHtml = s.summary;
    if (s.keyTerms && s.keyTerms.length) {
      s.keyTerms.forEach(kt => {
        if (!kt.term) return;
        const safe = kt.term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp(safe, 'g');
        summaryHtml = summaryHtml.replace(re, `<span class="kt-underline">${kt.term}</span>`);
      });
    }

    // 핵심 개념 박스 (요약 위)
    if (s.keyTerms && s.keyTerms.length) {
      html += '<div class="key-terms"><div class="key-terms-title">핵심 개념</div>';
      s.keyTerms.forEach(kt => {
        html += `<div class="kt-item">
          <span class="kt-term">${kt.term}</span>
          <span class="kt-exp">${kt.explanation}</span>
        </div>`;
      });
      html += '</div>';
    }

    html += `<div class="summary">${summaryHtml}</div>`;

    const bgSections = [
      ['역사적 맥락', s.history],
      ['핵심 플레이어', s.players],
      ['현재 구도', s.current],
      ['향후 전망', s.outlook],
    ].filter(([, v]) => v);

    if (bgSections.length) {
      html += '<div class="bg-box"><div class="bg-box-title">배경 스토리</div>';
      bgSections.forEach(([label, text]) => {
        html += `<div class="bg-section">
          <div class="bg-section-label">${label}</div>
          <div class="bg-section-text">${text}</div>
        </div>`;
      });
      html += '</div>';
    }

    if (s.sources.length) {
      html += `<button class="sources-toggle" data-toggle="srcs-${idx}">출처 ${s.sources.length}개 보기 <span class="arrow">▾</span></button>`;
      html += `<div class="sources-body" id="srcs-${idx}">`;
      s.sources.forEach((src, si) => {
        html += `<div class="source-item">
          <span class="src-num">${si+1}</span>
          <a href="${src.url}" target="_blank">${src.title}</a>
        </div>`;
      });
      html += '</div>';
    }
    html += '</div>';
  });

  content.innerHTML = html;

  // 탭 클릭 핸들러
  content.querySelectorAll('.cat-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentCat = btn.dataset.cat;
      renderContent(brief, grouped, availableCats);
    });
  });

  // 출처 토글
  content.querySelectorAll('.sources-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const body = document.getElementById(btn.dataset.toggle);
      const isOpen = body.classList.toggle('open');
      btn.classList.toggle('open', isOpen);
    });
  });

  document.getElementById('main').scrollTop = 0;
}

if (BRIEFS.length > 0) {
  renderSidebar();
  showBrief(BRIEFS[0].tag);
} else {
  document.getElementById('content').innerHTML = '<div class="empty">브리핑 데이터가 없습니다.</div>';
}

// ── Quiz Gate ──
const PASS_TARGET = 3;
let correctCount = 0;
const usedIndexes = new Set();

function pickQuestion() {
  // 사용 안 한 문제 중 랜덤. 다 썼으면 풀 리셋
  if (usedIndexes.size >= QUIZ.length) usedIndexes.clear();
  let idx;
  do { idx = Math.floor(Math.random() * QUIZ.length); } while (usedIndexes.has(idx));
  usedIndexes.add(idx);
  return QUIZ[idx];
}

function updateCounter() {
  document.getElementById('quiz-counter').textContent = `(${correctCount}/${PASS_TARGET})`;
}

function renderQuiz() {
  const q = pickQuestion();
  document.getElementById('quiz-q').textContent = q.q;
  updateCounter();
  const feedback = document.getElementById('quiz-feedback');
  feedback.textContent = '';
  feedback.className = 'quiz-feedback';
  const closeBtn = document.getElementById('quiz-close');
  closeBtn.classList.add('hidden');

  const choicesEl = document.getElementById('quiz-choices');
  choicesEl.innerHTML = '';
  // 보기 순서 섞기 (정답 위치 고정 방지)
  const order = q.a.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  order.forEach(idx => {
    const text = q.a[idx];
    const btn = document.createElement('button');
    btn.className = 'quiz-choice';
    btn.textContent = text;
    btn.addEventListener('click', () => {
      const allBtns = choicesEl.querySelectorAll('.quiz-choice');
      allBtns.forEach(b => b.disabled = true);
      if (idx === q.correct) {
        btn.classList.add('correct');
        correctCount++;
        updateCounter();
        if (correctCount >= PASS_TARGET) {
          feedback.textContent = '통과! 들어와도 좋아.';
          feedback.className = 'quiz-feedback right';
          closeBtn.classList.remove('hidden');
        } else {
          feedback.textContent = '역시 맞출 줄 알았어. 다음 문제 고.';
          feedback.className = 'quiz-feedback right';
          btn.blur();
          setTimeout(() => {
            if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
            renderQuiz();
          }, 900);
        }
      } else {
        btn.classList.add('wrong');
        feedback.textContent = '정말 실망이다.... 다음.';
        feedback.className = 'quiz-feedback wrong';
        btn.blur();
        setTimeout(() => {
          if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
          renderQuiz();
        }, 900);
      }
    });
    choicesEl.appendChild(btn);
  });
}

document.getElementById('quiz-close').addEventListener('click', () => {
  document.getElementById('quiz-overlay').classList.add('hidden');
  document.body.classList.remove('quiz-active');
});

document.body.classList.add('quiz-active');
renderQuiz();

// ── Mobile sidebar toggle ──
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('sidebar-backdrop');
function toggleSidebar(open) {
  sidebar.classList.toggle('open', open);
  backdrop.classList.toggle('open', open);
}
document.getElementById('sidebar-toggle').addEventListener('click', () => toggleSidebar(!sidebar.classList.contains('open')));
backdrop.addEventListener('click', () => toggleSidebar(false));
// 날짜 클릭하면 모바일에서 자동으로 닫히게
sidebar.addEventListener('click', e => {
  if (e.target.classList.contains('date-item') && window.innerWidth <= 768) {
    toggleSidebar(false);
  }
});
</script>

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`세계 최대 가상자산 거래소 바이낸스 사이버 공격 피해액 2억 달러 발생, 자체 비상 펀드로 전액 보전 발표`,
  metrics:[`피해 추정액 2억 달러`,`비트코인 일시적 3% 급락`],
  summary:`세계 최대 가상자산 거래소인 바이낸스가 어제 새벽 조직적인 사이버 해킹 공격을 받아 거액의 가상자산이 유출되는 사고가 발생했습니다. 보안 전문가들에 따르면 이번 공격으로 유출된 피해액은 약 2억 달러에 달하는 것으로 추산됩니다. 해킹 소식이 전해지자 비트코인을 비롯한 주요 가상자산 가격이 일시적으로 3% 이상 급락하며 시장이 크게 출렁였습니다. 다행히 바이낸스 측은 즉각 입출금을 통제하고, 해킹된 자산은 오프라인 보관소인 콜드 월릿에 있던 자산이 아니라고 해명했습니다. 또한 거래소가 자체 조성해둔 비상 안전 펀드(SAFU)를 동원해 사용자 피해를 전액 보전하겠다고 발표하면서 시장의 충격을 빠르게 수습했습니다.`,
  keyTerms:[{term:`콜드 월릿`,explanation:`인터넷과 연결되지 않은 오프라인 상태의 물리적 저장 매체에 가상자산을 보관하여 해킹의 위험을 원천적으로 차단하는 안전한 지갑입니다.`}],
  history:`가상자산 시장은 과거 마운트곡스나 FTX 사태 등 대형 거래소의 해킹 및 파산으로 인해 보안 신뢰도에 치명타를 입어왔습니다.`,
  players:`북한 연계 해커 조직이나 다국적 사이버 범죄 그룹이 이번 공격의 배후로 의심받고 있어 국제 공조 수사가 진행 중입니다.`,
  current:`바이낸스의 신속한 전액 보상 약속 덕분에 과거와 같은 대규모 뱅크런(대량 인출 사태)은 발생하지 않았습니다.`,
  outlook:`이번 사태를 계기로 주요 국가의 금융 당국들이 가상자산 거래소의 사이버 보안 및 지급 준비금 규제를 한층 강화할 것으로 보입니다.`,
  sources:[{title:`Binance hit by \$200m hack, promises full refund - CoinDesk`,url:`https://www.coindesk.com/`},{title:`Crypto market shakes after Binance cyber attack - BBC`,url:`https://www.bbc.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`가을비 이후 전국적 '영하권 초겨울 추위' 예보 속 산불방지대책본부 조기 가동`,
  metrics:[`아침 최저 기온 영하 2도`,`건조주의보 발령 30% 증가`],
  summary:`주말 동안 내린 가을비가 그친 직후, 북서쪽에서 찬 공기가 강하게 남하하면서 전국적으로 기온이 급격히 떨어지고 있습니다. 기상청은 내륙 산간 지방의 아침 최저 기온이 영하 2도까지 떨어지는 등 때 이른 초겨울 추위가 찾아올 것이라고 예보했습니다. 기온 하강과 함께 대기가 빠르게 메말라가면서 산림청은 전국에 산불 재난 국가위기경보를 상향 발령했습니다. 가을철 건조주의보가 발령된 지역이 예년보다 30% 이상 증가함에 따라 중앙 및 지역 산불방지대책본부도 예년보다 앞당겨 비상 체제 가동에 돌입했습니다. 소방 당국은 입산자들의 화기 소지 단속을 강화하고 헬기 출동 태세를 점검하는 등 피해 예방에 만전을 기하고 있습니다.`,
  keyTerms:[{term:`건조주의보`,explanation:`공기 중의 습도가 매우 낮아져 화재 발생 위험이 커질 때 기상청에서 발령하는 기상 특보로, 실효습도 35% 이하가 지속될 때 내려집니다.`}],
  history:`최근 몇 년간 극단적인 기후 변화로 인해 봄철뿐만 아니라 가을과 겨울철에도 대형 산불이 빈번하게 발생하고 있습니다.`,
  players:`산림청, 소방청, 그리고 전국 지방자치단체들이 공조하여 24시간 산불 감시 및 초동 진화 체계를 구축하고 있습니다.`,
  current:`강한 바람과 함께 습도가 급격히 낮아지면서 작은 불씨도 대형 산불로 번질 수 있는 위험한 조건이 형성되었습니다.`,
  outlook:`추위와 건조한 날씨는 이달 중순까지 지속될 것으로 보여, 당분간 화재 예방에 대한 각별한 주의가 요구됩니다.`,
  sources:[{title:`때 이른 영하권 추위... 산불방지대책본부 조기 가동 - 중앙일보`,url:`https://www.joongang.co.kr/`},{title:`가을비 끝 초겨울 시작, 전국 산불 위기경보 상향 - YTN`,url:`https://www.ytn.co.kr/`}]
}]
},{
  tag:`2026-11-02`,
  label:`2026년 11월 2일 (월)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 10월 비농업 고용 증가 폭이 예상치를 크게 밑돌며 고용 시장 둔화 신호가 강해지고 있습니다.`,
  metrics:[`10월 신규 고용 11만 명으로 예상치 하회`,`미 10년물 국채 금리 4.3% 돌파하며 변동성 확대`],
  summary:`미국의 10월 비농업 부문 고용 증가세가 시장의 예상치를 크게 밑돌면서 고용 시장 둔화 우려가 커지고 있습니다. 미국 노동부 발표에 따르면 신규 일자리 창출이 급격히 축소되어 경제 둔화의 명확한 신호로 해석되고 있습니다. 이에 따라 연방준비제도의 향후 금리 인하 속도와 폭을 둘러싸고 월스트리트 전문가들의 전망이 엇갈리는 상황입니다. 일각에서는 경기 침체 방어를 위해 더욱 공격적인 금리 인하가 필요하다고 주장합니다. 반면, 다른 한편에서는 인플레이션 불씨가 완전히 꺼지지 않았다며 신중론을 펴고 있습니다. 이러한 엇갈린 전망 속에 미 국채 금리 변동성이 크게 확대되며 금융 시장이 출렁이고 있습니다. 투자자들은 다가오는 연방공개시장위원회(FOMC) 정례회의에서 나올 제롬 파월 의장의 발언에 촉각을 곤두세우고 있습니다.`,
  keyTerms:[{term:`비농업 부문 고용`,explanation:`농축산업을 제외한 산업에서 창출된 일자리 수로, 미국 실물 경제의 활력을 보여주는 가장 핵심적인 지표 중 하나입니다.`}],
  history:`미국은 팬데믹 이후 극심한 인플레이션을 잡기 위해 고강도 긴축을 이어왔으며, 최근 물가 안정과 고용 유지를 동시에 달성하려 노력해왔습니다. 최근 물가 오름세가 꺾이면서 시장의 초점은 물가에서 고용으로 점차 이동했습니다. 그러나 이번 지표 발표로 고용 시장 연착륙에 대한 확신이 흔들리고 있습니다.`,
  players:`미국의 통화 정책을 결정하는 연방준비제도(Fed)와 이에 민감하게 반응하는 글로벌 투자은행들이 핵심 주체입니다. 바이든 행정부 역시 선거를 앞두고 일자리 지표에 촉각을 세우고 있습니다.`,
  current:`시장의 금리 인하 기대감이 선반영된 상태에서 예상치 못한 고용 둔화는 투자 심리를 급격히 위축시키고 있습니다. 특히 채권 시장에서 수익률 불확실성을 피하려는 자금 이동이 가속화되는 중입니다.`,
  outlook:`다가오는 연방공개시장위원회(FOMC)에서의 기준금리 결정이 가장 중요한 이벤트입니다. 연준 위원들의 금리 전망 점도표 변화와 파월 의장의 기자회견이 단기적인 글로벌 증시 방향성을 결정할 것입니다.`,
  sources:[{title:`미국 10월 고용지표 둔화, 연준 금리 경로 안갯속 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`U.S. Payrolls Grow Slower Than Expected in October - Reuters`,url:`https://www.reuters.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`중국의 10월 구매관리자지수(PMI)가 50선 부근에서 등락하며 대규모 부양책의 효과에 시선이 쏠리고 있습니다.`,
  metrics:[`중국 10월 제조업 PMI 50.1 기록`,`5개월 만에 경기 확장 국면 턱걸이 진입`],
  summary:`중국 국가통계국이 발표한 10월 제조업 구매관리자지수가 50.1을 기록하며 간신히 확장 국면으로 진입했습니다. 이는 지난 5개월 간 이어지던 수축 국면을 벗어난 수치로, 시장에서는 긍정적인 초기 신호로 평가하고 있습니다. 최근 중국 정부가 연이어 내놓은 지급준비율 인하와 부동산 규제 완화 등 대규모 경기 부양책이 일부 실물 경제에 반영되기 시작한 것으로 분석됩니다. 그러나 지수가 경기 확장과 수축을 가르는 경계선인 50선에 턱걸이 수준으로 머물고 있어 본격적인 경기 회복세로 단정하기는 아직 이릅니다. 내수 침체와 청년 실업 문제 등 중국 경제의 구조적인 난관이 여전히 산적해 있기 때문입니다. 전문가들은 재정 지출 확대를 동반한 추가적인 실물 경제 지원책 없이는 단기 반등에 그칠 수 있다고 경고합니다. 전 세계 금융시장은 세계 최대 소비 시장인 중국의 실물경기 회복 여부가 글로벌 경제에 미칠 파급 효과를 예의주시하고 있습니다.`,
  keyTerms:[{term:`제조업 구매관리자지수`,explanation:`기업의 구매 담당자들을 상대로 신규 주문, 생산, 재고 등을 설문 조사해 수치화한 것으로, 50보다 높으면 경기 확장, 낮으면 경기 수축을 의미합니다.`}],
  history:`중국 경제는 방역 해제 이후에도 심각한 부동산 침체와 고질적인 내수 부진으로 인해 좀처럼 과거의 성장 활력을 찾지 못했습니다. 디플레이션 진입 우려까지 겹치면서 시장 전반의 비관론이 팽배했습니다. 이를 타개하기 위해 당국은 최근 유동성 공급과 규제 완화 카드를 총동원했습니다.`,
  players:`중국의 중앙은행인 인민은행과 거시경제를 총괄하는 국가발전개혁위원회 등 경제 정책을 지휘하는 국가 기관들이 핵심입니다. 이에 영향을 받는 외국인 투자자들과 수출 주도 다국적 기업들도 사태를 주시하고 있습니다.`,
  current:`정부의 대규모 부양책 발표 이후 주식 시장이 단기적으로 급등했으나, 실물 경제 지표의 실질적인 뒷받침 여부가 가장 중요한 관건이 된 상황입니다. 이번 PMI 수치 개선이 일시적 현상이 아닌 장기 추세로 자리잡을지가 핵심 쟁점입니다.`,
  outlook:`다가오는 전국인민대표대회 상무위원회에서 지방정부 부채 탕감 등을 포함한 추가 재정 부양책 규모가 얼마나 발표될지가 시장의 최대 관심사입니다. 부양책의 실제 집행 강도에 따라 향후 중국의 성장률 전망치가 크게 요동칠 것입니다.`,
  sources:[{title:`중국 10월 제조업 PMI 50.1…5개월만에 확장 국면 - 한국경제`,url:`https://www.hankyung.com/`},{title:`China's factory activity expands in October after massive stimulus - Bloomberg`,url:`https://www.bloomberg.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국의 10월 반도체 수출이 40%대 증가율을 보이며 급증해 사상 첫 연간 수출 1조 달러 달성 기대감이 커지고 있습니다.`,
  metrics:[`10월 반도체 수출 전년 대비 40.3% 증가`,`총수출 누적 달성률 역대 최고치 기록`],
  summary:`대한민국의 10월 전체 수출액이 반도체 부문의 강력한 호조에 힘입어 전년 동기 대비 큰 폭으로 증가했습니다. 특히 전 세계적인 인공지능(AI) 열풍에 따른 고대역폭 메모리(HBM)와 고부가가치 인프라용 반도체 수요가 10월 수출 실적을 강력하게 견인한 것으로 나타났습니다. 최근 미국발 기술주 주가 조정 여파로 금융 시장의 불안감이 컸으나, 한국 주요 반도체 기업들의 이익 창출 펀더멘털은 여전히 견고함이 입증되었습니다. 이러한 고성장세가 연말까지 유지된다면 올해 한국 경제는 사상 최초로 연간 수출 1조 달러라는 금자탑을 세울 수 있을 것으로 전망됩니다. 정부와 업계는 현재의 수출 호조세가 주요 IT 기업들의 신제품 출시 효과와 맞물려 4분기 내내 지속될 것으로 조심스럽게 예측하고 있습니다. 다만 글로벌 경제 둔화 리스크와 미국 대선에 따른 환율 변동성이 하반기 막판 변수로 작용할 수 있어 당국이 시장 상황을 예의주시하고 있습니다. 경제 전문가들은 반도체 중심의 이 긍정적 흐름이 국내 제조업 전반과 고용 활력으로 이어질지 분석하고 있습니다.`,
  keyTerms:[{term:`고대역폭 메모리(HBM)`,explanation:`여러 개의 메모리 칩을 수직으로 쌓아 올려 데이터 처리 속도를 혁신적으로 끌어올린 첨단 반도체로, 인공지능 연산에 필수적으로 사용됩니다.`}],
  history:`한국 수출은 과거 수차례 반도체 사이클 하락과 글로벌 공급망 차질로 심각한 위기를 겪었습니다. 최근 몇 년간은 강력한 미중 무역 갈등 속에서 중간재 수출이 고전하기도 했습니다. 하지만 최근 인공지능 산업이 폭발적으로 성장하면서 다시 강력한 중장기 상승 모멘텀을 맞이했습니다.`,
  players:`삼성전자와 SK하이닉스 등 전 세계 메모리 시장을 주도하는 국내 핵심 반도체 제조사들과 이들의 최대 고객사인 글로벌 빅테크 기업들이 중심에 있습니다. 무역 정책과 인프라 지원을 담당하는 산업통상자원부의 조율 역할도 중요합니다.`,
  current:`빅테크 기업들의 AI 서버 투자 수요가 폭발적으로 증가하며 메모리 반도체, 특히 최첨단 제품군에 대한 공급 부족 현상까지 발생하고 있습니다. 이는 단기적으로는 물론 중기적인 한국 수출 지표를 끌어올리는 가장 강력한 원동력입니다.`,
  outlook:`11월 말 블랙 프라이데이로 다가오는 미국의 쇼핑 시즌 등 연말 특수가 일반 IT 부품 수요를 얼마나 더 자극할지 지켜보아야 합니다. 차세대 반도체 공정 개발 경쟁에서의 승패가 향후 몇 년간의 대한민국의 수출 물량을 쥐고 흔들 것입니다.`,
  sources:[{title:`10월 반도체 수출 40% 급증…연간 수출 1조 달러 눈앞 - 매일경제`,url:`https://www.mk.co.kr/`},{title:`AI boom pushes South Korea tech exports to record high - FT`,url:`https://www.ft.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`국정감사가 마무리되면서 국회는 정부가 제출한 820조 원 규모의 내년도 예산안 심사 정국에 본격적으로 돌입했습니다.`,
  metrics:[`2027년도 정부 총지출 예산안 820조 원 편성`,`야당 핵심 국책 사업 예산 대폭 삭감 경고`],
  summary:`제22대 국회의 국정감사가 막을 내리면서 여야 정치권의 시선은 내년도 슈퍼 예산안 심사로 집중되고 있습니다. 정부가 국회에 제출한 820조 원 규모의 매머드급 예산안을 두고 본격적인 예산 정국이 막을 올린 것입니다. 정부와 집권 여당은 장기 저성장 국면 돌파와 서민 민생 안정을 위해 팽창적 확장 재정이 불가피하다는 입장을 굽히지 않고 있습니다. 반면 거대 야당은 국가 채무의 가파른 증가와 재정 건전성 악화를 강하게 우려하며, 불필요하다고 판단되는 정부 예산의 대폭 삭감을 벼르고 있습니다. 특히 과학기술 R&D 예산 복원 규모와 현 정부의 역점 국책 사업 예산을 두고 상임위 곳곳에서 팽팽한 힘겨루기가 진행 중입니다. 양측은 예산안 처리 법정 시한을 앞두고 예산결산특별위원회에서 한 치의 양보 없는 치열한 공방을 벌일 것으로 예상됩니다. 민생 지원이라는 명분 뒤에 숨은 당파적 주도권 다툼과 총선용 선심성 예산 확보전이 이번 정국의 핵심 쟁점으로 떠올랐습니다.`,
  keyTerms:[{term:`예산결산특별위원회`,explanation:`정부가 짜온 한 해 나라 살림(예산안)이 적절한지 최종적으로 검토하고 삭감이나 증액을 심사하는 국회의 특별 위원회입니다.`}],
  history:`역대 국회마다 내년도 예산안 심사는 쟁점 법안 강행 처리와 맞물려 혹독한 파행을 겪어왔습니다. 특히 팬데믹 이후 국가 부채가 급증하면서 재정 건전성과 재정 확대를 둘러싼 여야의 이념적 대립은 매년 더욱 격화되었습니다. 헌법에 명시된 법정 시한을 넘기는 늑장 처리가 어느덧 고질적인 관행으로 굳어졌습니다.`,
  players:`예산안 원안을 수성하려는 기획재정부 및 여당 지도부와, 송곳 검증과 대규모 삭감을 벼르는 더불어민주당 등 야당 원내 지도부가 충돌하는 주체입니다.`,
  current:`야당은 정부의 특정 사업 예산을 전액 삭감하겠다며 강경한 태도로 기선을 제압하려 하고 있으며, 여당은 이를 국정 운영의 발목을 잡는 다수의 횡포로 규정하고 강하게 맞서고 있습니다.`,
  outlook:`헌법상 예산안 법정 처리 시한인 12월 2일까지 여야 간 극적인 타협이 이루어질지, 아니면 사상 초유의 예산안 야당 단독 처리 혹은 준예산 사태라는 파국으로 이어질지가 초미의 관심사입니다.`,
  sources:[{title:`국감 끝, 820조 '슈퍼 예산' 정국 돌입…R&D 쟁점 예고 - KBS`,url:`https://news.kbs.co.kr/`},{title:`여야 820조 예산안 전쟁 시작…건전재정 vs 민생확장 충돌 - 조선일보`,url:`https://www.chosun.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`정부가 소수자 보호 명분 아래 발생한 내국인 역차별 논란을 해소하기 위해 다문화 가구 우대 정책을 소득 기준으로 대폭 개편합니다.`,
  metrics:[`상위 20% 고소득 다문화 가구 무상 혜택 제한`,`주택 청약 특별공급 기준 소득 연계 대폭 강화`],
  summary:`정부가 현행 다문화 가구 지원 정책의 전면적인 기준 개편을 예고하며 정치권과 시민사회에 파장이 일고 있습니다. 대통령실과 소관 부처는 부분적인 불공정을 소수자 보호라는 낡은 명분 아래 계속 방치할 수 없다며 혜택 재조정의 당위성을 거듭 강조했습니다. 특히 고소득 다문화 가구에까지 무분별하게 제공되던 주택 청약 우선권 및 무상 교육 혜택이 일반 내국인 가정과의 심각한 역차별 논란을 낳았다는 점을 지적했습니다. 앞으로 마련될 새 지침에서는 다문화 가정이라 하더라도 가구의 실질 소득 수준과 구체적 필요에 따라 혜택이 철저히 차등 적용될 예정입니다. 이러한 조치는 국가의 한정된 복지 재원을 경제적으로 더 어려운 진짜 취약 계층에게 집중하겠다는 윤석열 정부의 복지 기조로 해석됩니다. 반면 야당 일각에서는 이를 두고 이주민에 대한 사회적 갈등과 편견을 부추기는 갈라치기 포퓰리즘 정책이라며 비판의 목소리를 높이고 있습니다. 이 민감한 정책 변화가 향후 입법 과정에서 여야 간 새로운 이념 논쟁으로 격렬하게 비화될 조짐을 보이고 있습니다.`,
  keyTerms:[{term:`현행 다문화 가구 지원 정책`,explanation:`결혼 이민자나 귀화자 등으로 이루어진 가족이 한국 사회에 잘 정착할 수 있도록 교육, 주거, 의료 등 다양한 분야에서 제공하는 정부의 특별 혜택을 말합니다.`}],
  history:`과거 다문화 가정의 원활한 사회 안착을 위해 도입된 다양한 파격적 우대 정책들은 저출산 고령화 시대를 대비하는 필수적인 국가적 조치로 폭넓게 지지를 받았습니다. 그러나 시간이 흐르고 다문화 가구 내에서도 경제적 양극화가 심해지면서, 획일적인 혜택 적용이 오히려 일반 서민들의 박탈감을 유발한다는 불만이 꾸준히 누적되어 왔습니다.`,
  players:`정책의 궤도를 수정하려는 대통령실 및 여성가족부가 전면에 서 있으며, 기존 권리의 축소를 우려하는 이민자 지원 단체와 진보 성향 야당 정치인들이 강력히 반발하는 구도입니다.`,
  current:`최근 2030 내국인 청년층과 무주택 신혼부부들을 중심으로 현행 청약 제도가 몹시 불공정하다는 여론이 강하게 형성되었고, 정부는 이 불만을 정책 개편의 핵심 동력으로 삼아 발 빠르게 속도를 내고 있습니다.`,
  outlook:`향후 국회에서 혜택 축소를 골자로 한 관련 법령 개정안이 공식 상정될 때, 야당의 거센 반대와 인권단체의 시위 등 거센 저항이 예상되며 타협에 이르는 사회적 합의 과정이 매우 험난할 전망입니다.`,
  sources:[{title:`대통령실 다문화 역차별 없앤다…고소득 가구 혜택 손질 - 중앙일보`,url:`https://www.joongang.co.kr/`},{title:`소수자 우대 정책 수술대 오르나…야권은 '갈라치기' 반발 - 한겨레`,url:`https://www.hani.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`북한이 전술탄도미사일 연속 발사 등 대남 무력 압박을 강화하자, 한국 정부는 다자외교 무대에서 이를 강력히 규탄하며 국제 공조에 나섰습니다.`,
  metrics:[`북한 동해상으로 단거리 전술탄도미사일 다수 발사`,`한국 정부 G20 회의서 대북 규탄 국제성명 주도`],
  summary:`북한이 최근 동해상으로 신형 전술탄도미사일 시험 발사를 강행하며 한반도 일대의 군사적 긴장 수위를 한층 끌어올리고 있습니다. 군 당국은 이번 기습적인 미사일 발사가 한국의 주요 군사 시설에 대한 정밀 대남 타격 능력을 과시하기 위한 다목적 압박 전술의 일환이라고 심층 분석했습니다. 이와 동시에 최근 발생한 비무장지대(DMZ) 내 북한군 지뢰 폭발 사고를 둘러싼 진실 공방과 외교적 여파도 가라앉지 않고 계속되고 있습니다. 한국 외교부 대표단은 브라질에서 열린 G20 회의 등 주요 다자외교 무대에서 북한의 잇따른 도발 사건을 적극적으로 거론하며 국제사회의 각별한 주의를 환기시켰습니다. 정부는 북한의 거듭된 무력시위와 비상식적인 도발 행위가 명백한 유엔 안보리 결의 위반이자 역내 평화 파괴 행위임을 강도 높게 비판했습니다. 주요 서방 국가들을 포함한 국제사회 역시 북한의 일방적인 행보에 우려를 표하며 한반도 평화를 위한 남북 간 무조건적인 대화와 소통 창구 복원의 필요성을 재차 촉구했습니다. 강력한 대내외적 경제 제재에도 불구하고 북한의 핵·미사일 고도화 기조가 당분간 굳건히 유지될 것으로 보여 실효성 있는 외교적 억지력 해법 마련이 매우 시급한 상황입니다.`,
  keyTerms:[{term:`신형 전술탄도미사일`,explanation:`수천 킬로미터를 날아가는 전략 미사일과 달리 수백 킬로미터 내의 가까운 적 주요 목표물을 정밀하게 타격하기 위해 개발된 소형 탄도미사일을 의미합니다.`}],
  history:`북한은 김정은 위원장의 국방력 5대 과제 등 자체적인 무력 강화 계획에 따라 미사일 역량을 꾸준히 고도화해 왔으며, 한미 연합훈련 기간을 빌미로 무력시위의 강도와 빈도를 전략적으로 대폭 늘려왔습니다. 비무장지대 내 긴장 조성 행위 역시 남북 관계가 경색될 때마다 반복해서 꺼내드는 고전적인 전술입니다.`,
  players:`자신의 체제 결속과 핵무력을 과시하려는 북한 정권과, 이를 억제하고 방어 체계를 굳히려는 한미일 안보 동맹, 그리고 국제무대에서 규범을 강조하는 G20 회원국들이 핵심 이해관계자입니다.`,
  current:`북한은 외부의 강력한 경고와 경제 제재에도 아랑곳하지 않고 핵 탑재가 가능한 무기 체계의 실전 배치를 서두르고 있으며, 한국은 이에 즉각 대응하여 미국 등 우방국과의 긴밀한 공조를 이끌어내는 데 총력을 기울이고 있습니다.`,
  outlook:`향후 다가올 미국 새 행정부의 구체적인 외교 정책 변화와 맞물려 북한이 국면 전환을 노리고 제7차 핵실험 등 추가적인 중대 도발을 감행할지 여부가 동북아 안보 지형을 뒤흔들 가장 큰 변수가 될 것입니다.`,
  sources:[{title:`북한 전술탄도미사일 무더기 발사…대남 타격 능력 과시 - MBC`,url:`https://imnews.imbc.com/`},{title:`정부, G20서 북한 DMZ 지뢰도발 강력 규탄…국제사회 공조 촉구 - 조선일보`,url:`https://www.chosun.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`유럽연합(EU)이 세계 최초의 포괄적 AI 규제인 '인공지능법(AI Act)'의 강도 높은 모니터링에 착수하며 빅테크 기업들에 비상이 걸렸습니다.`,
  metrics:[`규정 위반 시 기업 연간 글로벌 매출의 최대 7% 과징금`,`집행위 산하 100명 규모 AI 모니터링 전담반 본격 가동`],
  summary:`유럽연합 집행위원회가 전 세계 글로벌 기술 기업들을 대상으로 '인공지능법(AI Act)' 준수 여부에 대한 본격적이고 엄격한 모니터링에 돌입했습니다. 세계 최초의 포괄적이고 강력한 AI 규제법으로 꼽히는 이 법안은 인공지능 시스템이 인간에게 미칠 위험도에 따라 각 기업에 철저히 차등적인 법적 의무를 부여합니다. 특히 선거 개입이 가능한 딥페이크나 생체 정보 분석 등 사회적 위험성이 높은 고위험 AI 모델에 대한 데이터 투명성 요구가 대폭 강화되었습니다. 이번 EU의 모니터링 착수는 단순한 행정적 경고를 넘어 실질적인 법 집행 단계이자 제재 국면으로 진입했음을 확고히 의미합니다. 규제를 위반할 경우 해당 기업은 전 세계 연간 총매출의 최대 7%에 달하는 파멸적인 수준의 과징금을 부과받을 수 있어 기업들의 긴장감이 팽배합니다. 이에 따라 첨단 AI 시장을 주도하는 미국과 중국의 주요 빅테크 기업들은 막대한 벌금을 피하기 위해 유럽 내 서비스 운영 방식을 원점에서 재검토하며 규제 리스크 방어에 총력을 기울이고 있습니다. 이번 유럽의 선제적 조치는 향후 전 세계 국가들이 앞다투어 도입할 인공지능 관련 입법의 가장 강력한 표준 기준점이 될 전망입니다.`,
  keyTerms:[{term:`'인공지능법(AI Act)'`,explanation:`유럽연합이 인공지능의 위험성을 등급별로 나누어 규제하기 위해 만든 세계 최초의 법안으로, AI가 인간의 안전이나 기본권을 침해하지 못하도록 깐깐하게 감시합니다.`}],
  history:`챗GPT의 등장 이후 AI 기술이 전례 없이 급속도로 발전하면서 가짜 뉴스 범람, 저작권 무단 침해, 알고리즘의 편향성 등 심각한 부작용에 대한 우려가 전 세계적으로 폭발적으로 커졌습니다. 이에 유럽연합은 수년간의 치열한 논의 끝에 기술의 혁신과 인간 윤리적 사용의 균형을 억지로라도 맞추기 위한 포괄적 방어 법안을 전격적으로 통과시켰습니다.`,
  players:`가장 엄격한 잣대로 규제를 주도하는 유럽연합(EU) 집행위원회와, 이 규제의 직접적 사정권에 들어온 오픈AI, 구글, 메타 등 막강한 자본력을 지닌 미국계 글로벌 빅테크 기업들이 법적으로 정면 충돌하고 있습니다.`,
  current:`법안 시행에 따른 자율 시정 유예 기간이 점차 실질적으로 종료됨에 따라, 기업들은 자사가 개발한 거대 AI 모델이 유럽의 까다로운 기준에 완벽히 부합하는지 스스로 입증해야 하는 거대한 컴플라이언스 부담과 비용 문제에 직면해 있습니다.`,
  outlook:`새 법안 아래서 첫 번째 철퇴(과징금 부과)를 맞는 1호 사례가 어느 기업에게 적용될지가 현재 업계의 초미의 관심사이며, 이 결과는 글로벌 테크 기업들의 향후 유럽 시장 일부 철수나 기능이 제한된 맞춤형 깡통 서비스 출시 여부를 최종 결정지을 것입니다.`,
  sources:[{title:`EU 인공지능법 본격 칼 빼든다…글로벌 빅테크 '초긴장' - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`EU starts sweeping compliance checks under its new AI Act - Bloomberg`,url:`https://www.bloomberg.com/`}]
},{

  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`정부가 게임물관리위원회가 독점해오던 모바일 게임 청불 심의와 내용수정신고 업무를 민간 위원회로 완전히 일원화 이관했습니다.`,
  metrics:[`연간 약 3만 건 모바일 게임 내용수정신고 절차 민간 일원화`,`청소년이용불가 등급 포함 게임 등급분류 민간이양 2단계 전면 시행`],
  summary:`한국 정부의 전방위적인 게임 산업 규제 완화 기조에 발맞춰, 그동안 꽉 막혀있던 모바일 게임물에 대한 핵심 심의 업무가 대거 민간 영역으로 완전히 이양되었습니다. 정부 기관인 게임물관리위원회는 등급분류 민간이양 2단계 조치의 핵심 일환으로, 그간 철저히 통제해 온 청소년이용불가 등급을 포함한 모든 모바일 게임의 심의 권한을 민간 기구인 게임콘텐츠등급분류위원회(GCRB)로 넘겼습니다. 또한 게임 업데이트 시마다 매번 밟아야 했던 번거롭고 복잡한 내용 수정 신고 업무도 민간으로 창구가 일원화되어 게임사들의 답답했던 행정 절차가 크게 간소화되었습니다. 이번 과감한 조치는 쉴 새 없이 급변하는 글로벌 모바일 게임 시장 환경에 신속하게 대응하고 업계 자체의 자율성을 대폭 높이기 위해 고심 끝에 마련되었습니다. 국내 중소 게임 개발사들은 중복 심의와 대기 시간으로 인한 엄청난 비용 낭비를 획기적으로 줄이고 적기에 신작 출시에 속도를 낼 수 있을 것으로 크게 환영하는 분위기입니다. 다만 학부모 단체 등 일각에서는 사행성을 조장하는 게임이나 지나치게 선정적인 서브컬처 콘텐츠에 대한 국가의 최소한의 여과 장치가 너무 헐거워질 수 있다는 깊은 우려도 꾸준히 제기하고 있습니다. 향후 새롭게 칼자루를 쥔 민간 위원회의 투명하고 객관적인 전문 심의 역량이 이제 본격적인 시험대에 오르게 되었습니다.`,
  keyTerms:[{term:`게임콘텐츠등급분류위원회(GCRB)`,explanation:`국가 기관(게임위)을 대신하여 게임의 내용이 연령별로 적절한지 민간 전문가들이 심사하고 등급을 매기기 위해 설립된 민간 기구입니다.`}],
  history:`대한민국의 게임 사전 심의 제도는 과거 온 나라를 떠들썩하게 했던 바다이야기 사태 이후 도박성 방지를 명분으로 매우 보수적이고 강력한 관 주도로 운영되어 왔습니다. 그러나 심의 지연 현상이 글로벌 스탠다드에 크게 뒤처진다는 비판과 게임 업계의 끈질긴 사전 검열 규제 완화 요구가 맞물리면서 서서히 점진적인 민간 이양 법안 논의가 국회를 중심으로 진행되어 왔습니다.`,
  players:`막강했던 사전 규제 권한을 마침내 내려놓게 된 게임물관리위원회와 새롭게 무거운 책임을 떠맡게 된 민간 기구인 게임콘텐츠등급분류위원회(GCRB), 그리고 제도의 족쇄에서 풀려나게 된 국내 모바일 게임 개발사들이 얽혀 있는 주요 주체입니다.`,
  current:`오랜 염원이었던 심의 행정 편의성이 대폭 개선되면서 업계 전반의 기대감이 몹시 높지만, 최근 특정 집단의 항의로 불거진 일부 서브컬처 게임의 고무줄 등급 논란 등으로 인해 민간 심의 기준의 사회적 객관성과 공정성 확보가 당면한 가장 시급한 핵심 과제로 떠올랐습니다.`,
  outlook:`민간 중심의 새로운 심의 체계가 큰 부작용 없이 시장에 안정적으로 정착할 수 있을지 당분간 지켜보아야 하며, 만약 자율 심의 과정의 맹점을 노려 치명적으로 심각한 문제적 게임이 무분별하게 유통될 경우 빗장을 풀었던 제도가 다시 강력한 국가 관 주도로 빠르게 회귀할 가능성도 완전히 배제할 수는 없는 상황입니다.`,
  sources:[{title:`모바일게임 청불 심의도 GCRB로…게임물 민간이양 본격화 - 아이뉴스24`,url:`https://www.inews24.com/`},{title:`게임위, 모바일게임 내용수정신고 GCRB로 일원화…규제 빗장 풀리나 - 한국경제`,url:`https://www.hankyung.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`엔비디아가 네이버의 핵심 지분 4.54%를 전격 인수하며, 세계 최대 가상자산거래소인 바이낸스 해킹 사태로 어수선한 글로벌 테크 시장에 초대형 AI 동맹의 탄생을 알렸습니다.`,
  metrics:[`엔비디아 네이버 지분 4.54% 약 1조 5천억 원 규모 매입`,`바이낸스 북한 배후 해킹 피해액 역대 최대 8.4조 원 추산`],
  summary:`세계 최대 가상자산거래소인 바이낸스를 강타한 8.4조 원대 대규모 해킹 사건의 유력한 배후로 북한이 지목되며 글로벌 사이버 보안에 비상이 걸린 가운데, 아시아 테크 시장에서는 거대한 지각 변동이 일어났습니다. 글로벌 AI 칩 시장을 사실상 독점하고 있는 엔비디아가 한국의 IT 거인 네이버의 핵심 지분 4.54%를 전격적으로 확보하며 강력한 AI 혈맹을 맺었다고 공식 발표했습니다. 미국 연방수사국(FBI)이 북한 해킹 조직의 엄청난 자금 유출 수법을 공개하며 디지털 인프라의 취약성이 도마에 오른 시점에, 한미 양국을 대표하는 기술 기업이 미래 생존을 위해 물리적인 지분 교환이라는 초강수를 둔 것입니다. 네이버는 이번 투자를 통해 자사의 초거대 AI 모델 고도화에 필수적인 엔비디아의 최신 GPU 공급망을 안정적으로 우선 확보하는 결정적인 쾌거를 거두었습니다. 반면 엔비디아 입장에서는 네이버가 지배하고 있는 거대한 한국어 데이터 생태계와 아시아 시장 진출의 교두보를 마련하여 오픈AI 견제 전선을 구축하려는 고도의 전략적 포석으로 전문가들은 풀이하고 있습니다. 이번 지분 인수로 양사는 차세대 AI 반도체 칩 최적화와 한국형 거대언어모델(LLM) 글로벌 수출이라는 공동의 거대한 목표를 향해 한 배를 타게 되었습니다. 글로벌 테크 시장에서는 해킹 리스크로 흔들리는 코인 시장의 혼란과 대조적으로, 미래 먹거리인 거대 인공지능 覇權(패권)을 차지하기 위한 국경을 초월한 빅테크 기업 간의 합종연횡이 어느 때보다 빠르고 치열하게 전개되고 있음을 보여주고 있습니다.`,
  keyTerms:[{term:`가상자산거래소`,explanation:`바이낸스와 같이 비트코인 등 암호화폐를 사고파는 거래량이 많은 온라인 금융 시장을 의미합니다.`}],
  history:`북한 연계 해킹 조직들은 오랜 기간 통치 자금 마련을 위해 전 세계 가상자산거래소를 표적으로 삼아왔습니다. 한편 합법적 테크 시장에서는 챗GPT 쇼크 이후 AI 기술 주도권을 놓치지 않으려는 칩 제조사와 소프트웨어 기업 간의 전략적 제휴가 선택이 아닌 필수 생존 전략으로 자리 잡았습니다.`,
  players:`사이버 보안을 위협하는 북한의 고도화된 해킹 부대와 이를 쫓는 한미 수사 당국, 그리고 아시아 시장 확장을 노리는 미국 엔비디아 젠슨 황 CEO와 안정적인 AI 인프라가 절실했던 네이버 최수연 대표 등 IT 수장들이 얽혀 있습니다.`,
  current:`블록체인 보안망이 처참히 뚫려 탈취된 8조 원대 자금의 세탁이 교묘하게 진행되는 악재 속에서도, 증시에서는 엔비디아와 네이버의 깜짝 파트너십 소식이 초대형 호재로 작용하며 두 기업의 주가가 강하게 동반 상승하는 뚜렷한 대비를 보이고 있습니다.`,
  outlook:`각국 정부가 암호화폐 거래소의 자금세탁방지(AML) 의무를 대폭 강화하는 보안 규제 폭풍이 예고된 가운데, 엔비디아-네이버 연합군이 과연 언어 장벽을 넘어 아시아 맞춤형 AI 서비스로 글로벌 시장에서 눈에 띄는 실적 성과를 증명해 낼지가 향후 몇 년간 테크 업계의 최대 관전 포인트입니다.`,
  sources:[{title:`엔비디아, 네이버 지분 4.54% 확보…강력한 AI 동맹 탄생 - 전자신문`,url:`https://www.etnews.com/`},{title:`바이낸스 8.4조 해킹 배후는 북한…글로벌 코인시장 보안 발칵 - 국제신문`,url:`https://www.kookje.co.kr/`}]
}]

  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 주요 빅테크 기업들의 실적 발표 이후 AI 투자 대비 수익성 회수 지연에 대한 우려로 기술주가 급락했습니다.`,
  metrics:[`알파벳·아마존 등 빅테크 주가 장중 4~5% 급락`,`올해 AI 인프라 누적 투자액 수백억 달러 돌파 추산`],
  summary:`최근 알파벳, 아마존, 인텔 등 미국의 주요 빅테크 기업들이 저조한 실적 또는 우려스러운 가이던스를 발표했습니다. 기업들은 AI 인프라 구축을 위해 천문학적인 비용을 쏟아붓고 있지만, 정작 가시적인 수익 창출은 언제 본격화될지 불투명한 상황입니다. 이로 인해 월가와 투자자들 사이에서는 실체 없는 기대감에 기대어 주가가 과도하게 올랐다는 AI 거품론이 강하게 제기되고 있습니다. 나스닥을 비롯한 주요 지수가 기술주 투매 현상으로 큰 폭으로 하락하는 등 시장 충격이 컸습니다. 인텔 역시 현금 흐름 악화 우려로 주가 급락을 면치 못했습니다. 현재 투자자들은 막연한 비전 제시보다는 실제 재무제표에 찍히는 AI 매출 숫자를 요구하며 방어적 태세를 취하고 있습니다.`,
  keyTerms:[{term:`AI 거품론`,explanation:`인공지능 분야에 막대한 자본이 투자되고 있으나, 그에 상응하는 실제 수익이 나오지 않아 주가나 기대감이 과장되었다는 우려를 뜻합니다.`}],
  history:`챗GPT 등장 이후 글로벌 기술 기업들은 주도권을 뺏기지 않기 위해 경쟁적으로 데이터센터와 칩 확보에 막대한 자본을 투자해왔습니다.`,
  players:`막대한 자본을 쏟는 구글, 아마존, 마이크로소프트 등 플랫폼 거인들과 이를 엄격하게 평가하기 시작한 월가의 기관 투자자들입니다.`,
  current:`대규모 투자금 대비 단기 수익 창출이 더디다는 점이 이번 분기 실적 발표를 기점으로 폭발하며 투자 심리가 급격히 얼어붙고 있습니다.`,
  outlook:`향후 실적 발표와 컨퍼런스 콜에서 경영진이 AI 서비스의 구체적인 수익 모델과 타임라인을 어떻게 증명해 내는지가 주가 반등의 열쇠가 될 전망입니다.`,
  sources:[{title:`빅테크 실적 쇼크, 커지는 AI 거품론 - 한국경제`,url:`https://www.hankyung.com/economy/123`},{title:`월가 뒤흔든 인텔 폭락, 기술주 투매 조짐 - 매일경제`,url:`https://www.mk.co.kr/news/123`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국의 3분기 경제성장률이 견조한 반면 물가지수가 여전히 높아, 연방준비제도의 통화정책 경로에 불확실성이 커지고 있습니다.`,
  metrics:[`미국 3분기 GDP 연율 3%대 성장`,`9월 개인소비지출(PCE) 물가지수 3% 중반대 유지`],
  summary:`미국 경제가 3분기에 연율 기준 3%대의 성장률을 기록하며 소비와 투자가 여전히 강력하게 경제를 뒷받침하고 있음을 보여주었습니다. 하지만 함께 발표된 9월 PCE 물가지수가 여전히 3% 중반대에 머물며 인플레이션 둔화 속도가 시장의 기대에 미치지 못했습니다. 강력한 성장과 끈적한 물가가 동시에 나타나자, 시장에서는 연방준비제도가 금리 인하 속도를 조절할 수밖에 없을 것이라는 관측에 힘이 실리고 있습니다. 금리 인하 기대감이 약화되면서 국채 금리가 상승하고 주식 시장은 하방 압력을 받고 있습니다. 경기 침체 없이 연착륙할 것이라는 기대감 이면에는 고금리 장기화에 대한 피로감도 함께 누적되고 있습니다. 향후 발표될 비농업 고용보고서 결과에 따라 연준의 연말 통화정책 방향이 더욱 구체화될 것으로 보입니다.`,
  keyTerms:[{term:`PCE 물가지수`,explanation:`개인소비지출 물가지수로, 미국 소비자들이 상품과 서비스에 지불하는 가격의 변동을 측정하여 연준이 기준금리를 결정할 때 가장 중요하게 보는 지표입니다.`}],
  history:`미 연준은 지난 수년간 인플레이션을 잡기 위해 공격적인 금리 인상을 단행한 후, 최근 들어 점진적인 인하 시점을 모색해왔습니다.`,
  players:`물가 통제와 고용 안정이라는 두 가지 목표를 달성해야 하는 미 연방준비제도(Fed)와 이에 민감하게 반응하는 글로벌 금융 시장 참여자들입니다.`,
  current:`견조한 소비 지표가 경제 성장을 견인하고 있으나, 목표치를 웃도는 물가 수준이 연준의 금리 인하 전환 속도에 제동을 걸고 있는 상황입니다.`,
  outlook:`다가오는 고용 지표와 차기 연방공개시장위원회(FOMC) 회의에서 연준 의장이 제시할 금리 점도표 변화가 시장의 가장 큰 변수로 작용할 것입니다.`,
  sources:[{title:`강력한 미 3분기 성장, 금리 인하 경로 안갯속 - 연합뉴스`,url:`https://www.yna.co.kr/view/123`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 기술주 급락 여파가 덮치면서 반도체 대형주 중심의 대규모 매도세가 이어져 국내 코스피 지수의 변동성이 크게 확대되었습니다.`,
  metrics:[`코스피 지수 장중 2% 이상 하락`,`외국인 투자자 반도체 대장주 수천억 원 순매도`],
  summary:`미국 뉴욕 증시에서 촉발된 빅테크발 기술주 급락 쇼크가 한국 증시에도 직격탄이 되었습니다. 특히 삼성전자와 SK하이닉스 등 국내 증시를 주도하는 반도체 대형주들이 동반 하락하며 코스피 지수를 강하게 끌어내렸습니다. 국내 3분기 GDP 성장률이 반도체 수출 호조에 힘입어 선방했음에도 불구하고, 글로벌 시장과의 동조화 즉 커플링 현상으로 인해 미국 시장의 충격을 고스란히 흡수하는 모습입니다. 외국인 투자자들은 리스크 관리 차원에서 대규모 매도 물량을 쏟아내며 시장의 불안감을 가중시켰습니다. 반도체 수출 지표 호조와 팍팍한 체감 내수 경기 사이의 괴리가 여전한 상황에서 증시 변동성마저 커져 투자자들의 셈법이 복잡해지고 있습니다. 당분간 미국 경제 지표와 글로벌 AI 투자 심리 변화에 따라 국내 증시의 향방이 좌우될 전망입니다.`,
  keyTerms:[{term:`커플링 현상`,explanation:`한 나라의 경제나 주식 시장의 흐름이 미국 등 특정 국가나 글로벌 시장의 움직임과 비슷하게 동조화되어 같이 오르내리는 현상입니다.`}],
  history:`한국 증시는 전통적으로 시가총액 비중이 압도적인 반도체 및 IT 수출주에 의해 지수 전체가 크게 흔들리는 구조적 취약성을 앓아왔습니다.`,
  players:`자금을 대거 이탈시키고 있는 외국인 기관 투자자들과 이를 방어하려는 국내 개인 및 기관 투자자들, 그리고 실적을 입증해야 하는 국내 대기업들입니다.`,
  current:`국내 경제의 기초 체력보다는 글로벌 거시 환경과 미국 AI 산업의 투자 심리 위축이 국내 주식 시장의 자금 유출을 자극하는 핵심 원인이 되고 있습니다.`,
  outlook:`글로벌 반도체 4분기 수요 전망과 한국은행의 추가적인 통화 정책 방향이 확인될 때까지 국내 증시는 잦은 급등락 장세를 보일 가능성이 큽니다.`,
  sources:[{title:`미 기술주 쇼크에 코스피 털썩, 반도체주 직격탄 - 조선일보`,url:`https://www.chosun.com/economy/123`},{title:`수출 호조에도 웃지 못하는 증시, 외인 이탈 가속 - 중앙일보`,url:`https://www.joongang.co.kr/article/123`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`한미일 3국 외교장관이 다자회의를 계기로 모여 북한 비핵화 원칙을 재확인하고 보호무역주의 확산에 대한 공동 대응을 결의했습니다.`,
  metrics:[`한미일 3국 외교장관 공식 공동 성명 발표`,`다자회의 계기 연쇄 양자 및 3자 회담 10여 차례 진행`],
  summary:`G20 주요국 정상회의 등 굵직한 다자회의를 계기로 한국, 미국, 일본의 외교 수장이 한자리에 모여 현안을 점검했습니다. 이번 3국 외교장관 회담에서 각국은 최근 미사일 발사 등 도발 수위를 극도로 높이고 있는 북한에 대해 완전한 비핵화 원칙을 타협 없이 지켜나가겠다는 확고한 공동의 의지를 천명했습니다. 미 선거를 앞두고 자국 우선주의와 관세 압박 기조가 부상하는 상황에서, 3국은 경제 안보와 글로벌 공급망 안정성을 유지하기 위한 긴밀한 공조 필요성에도 뜻을 모았습니다. 특히 북한의 탄도미사일 발사 등 군사적 긴장 고조 행위를 한목소리로 강력히 규탄하며, 국제사회의 대북 제재 결의 이행을 촉구했습니다. 전통적인 군사 안보 협력을 넘어 경제 통상 분야로까지 3국의 밀착이 폭넓게 확대되는 양상입니다. 향후 북한의 추가 동향 및 미국 내부 정치 일정 결과에 따라 3국 공조의 세부 강도가 더욱 구체화될 것으로 보입니다.`,
  keyTerms:[{term:`완전한 비핵화`,explanation:`북한이 보유한 모든 핵무기와 핵 개발 프로그램을 검증 가능하고 돌이킬 수 없는 방식으로 완전히 폐기하여 근본적으로 없애는 것을 의미합니다.`}],
  history:`북핵 위협에 공동 대응하기 위해 한미일 3국은 정보 공유와 합동 군사 훈련 등 안보 측면에서 결속력을 꾸준히 강화해온 역사를 공유하고 있습니다.`,
  players:`한반도와 동북아 정세를 안정적으로 관리하려는 한미일 외교 당국과, 지속적인 도발을 통해 대미 협상력을 쥐어짜내려는 북한 정권입니다.`,
  current:`미국의 선거 등 정치적 전환기를 틈타 북한이 무력시위를 재개하자, 3국이 강력하고 단합된 메시지로 역내 불확실성을 사전 차단하려는 시점입니다.`,
  outlook:`미국 새 행정부 또는 의회가 구성된 이후 통상 및 외교 정책의 실질적인 변화가 동북아 안보 지형에 어떤 파장을 미칠지 주시해야 합니다.`,
  sources:[{title:`한미일 외교장관, 북 도발 규탄 공동성명 채택 - KBS`,url:`https://news.kbs.co.kr/news/123`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국의 관세 위협 및 고립주의 기조에 맞서 캐나다와 유럽연합(EU)이 미래동맹 성격의 강력한 경제 연대 전선을 구축하고 있습니다.`,
  metrics:[`캐나다-EU 간 무역 거래 규모 연간 수백억 달러 달해`,`신규 관세 전면 도입 시 양측 산업 예상 피해액 수십억 달러`],
  summary:`최근 미국 정계에서 선거를 앞두고 자국 산업을 맹목적으로 보호하려는 미국 우선주의 기반의 일방적 관세 도입 목소리가 커지고 있습니다. 이에 위기감을 느낀 캐나다와 유럽연합(EU)이 긴밀한 외교적 협의를 통해 새로운 형태의 미래동맹을 구축하며 맞불을 놓고 나섰습니다. 양측은 미국이 주도하는 보호무역주의가 글로벌 공급망을 교란하고 동맹국의 경제에 치명적인 타격을 줄 수 있다는 데 깊은 인식을 같이했습니다. 이를 타개하기 위해 상호 간 무역 장벽을 더욱 낮추고, 핵심 광물 및 첨단 기술 분야에서 미국에 의존하지 않는 독자적인 공급망 연대를 강화하는 방안을 모색 중입니다. 미국 중심의 절대적이었던 기존 경제 질서에 틈이 생기면서 글로벌 다자간 통상 환경이 빠르게 재편되는 모습입니다. 이러한 서방 동맹국들의 독자 노선 구축이 향후 미국의 강경한 통상 정책을 효과적으로 억제할 수 있을지 국제사회의 이목이 쏠리고 있습니다.`,
  keyTerms:[{term:`보호무역주의`,explanation:`자국의 산업을 보호하기 위해 수입품에 높은 관세를 매기거나 수입 물량을 제한하는 등 국가가 국제 무역에 적극적으로 개입하여 장벽을 치는 경제 정책입니다.`}],
  history:`과거 트럼프 행정부 시절부터 노골화된 미국의 자국 중심 무역 정책은 우방국들에게도 관세 장벽을 높이며 수십 년간 이어온 자유무역 체제를 뒤흔들어왔습니다.`,
  players:`막강한 경제력을 무기로 무역 조건을 강제하려는 미국 정치권과, 이에 맞서 경제적 생존 공간을 확보하기 위해 뭉치는 캐나다, 유럽연합 등 전통적 동맹국들입니다.`,
  current:`선거철을 맞아 미국의 무역 장벽 강화 공약이 기정사실화되는 분위기 속에서, 주요 경제권이 사전에 방어막을 치고 강력한 연대를 과시하는 국면입니다.`,
  outlook:`양측의 구체적인 무역 협정 타결 여부와 함께, 미국 의회의 실제 관세 부과 강도에 따라 글로벌 무역 전쟁으로 비화할 가능성도 완전히 배제할 수 없습니다.`,
  sources:[{title:`미 관세 장벽 우려에 캐나다·EU '경제 동맹' 구축 - 한겨레`,url:`https://www.hani.co.kr/arti/123`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`국정감사가 끝난 직후에도 국회에서는 주요 상임위를 중심으로 사법부 관련 국정조사 추진을 놓고 여야 간 치열한 대치가 이어지고 있습니다.`,
  metrics:[`관련 국회 상임위원회 여야 위원 전원 참석 긴급 회의`,`사법부 조사 찬반 여론조사 팽팽한 대립 양상`],
  summary:`올해 정기 국정감사 일정이 사실상 마무리되었음에도 불구하고 대한민국 국회는 정쟁으로 인해 여전히 차갑게 얼어붙어 있습니다. 특히 다수당이 강하게 밀어붙이고 있는 '대법원장 관련 국정조사' 추진을 두고 여야의 갈등이 임계점에 달했습니다. 반대 측 야당은 이를 두고 정부 여당이 불리한 정치적 국면을 억지로 전환하기 위해 헌법적 가치를 훼손하는 '사법부 죽이기'에 나섰다며 맹렬히 비난하고 나섰습니다. 반면 국정조사를 주도하는 측은 사법부 내부의 해묵은 불공정 의혹을 투명하게 규명하는 것이 국민의 알 권리라며 강행 의지를 굽히지 않고 있습니다. 최근 정치권 인사들의 굵직한 주요 재판 결과까지 연이어 겹치면서 각 당의 정치적 셈법은 더욱 꼬여만 가고 있습니다. 이러한 여야의 극단적 대치 정국으로 인해 내년도 예산안 심사 등 시급을 다투는 민생 법안 처리가 기약 없이 미뤄질 위기에 처해 있습니다.`,
  keyTerms:[{term:`국정조사`,explanation:`국회가 특정한 국정 사안에 대해 문제점이나 진상을 파악하기 위해 관련자를 증인으로 부르고 서류를 제출받아 강도 높게 조사하는 헌법상 권한입니다.`}],
  history:`한국 국회는 선거나 주요 정치적 고비마다 상임위를 동원해 국정조사나 특검 카드를 번갈아 꺼내 들며 정국 주도권을 탈환하기 위한 극한 대치를 반복해왔습니다.`,
  players:`대통령실과 정권을 방어하며 주도권을 쥐려는 여당(국민의힘)과, 이를 강력히 견제하며 정권 심판론을 앞세우는 거대 야당(더불어민주당)입니다.`,
  current:`국정감사 이후 뚜렷한 여론의 돌파구가 보이지 않는 가운데, 사법부 견제 이슈가 지지층을 결집시키는 핵심 쟁점으로 떠오르며 정쟁이 격화되고 있습니다.`,
  outlook:`실제 본회의 국정조사 표결 여부와 이에 대한 사법부의 공식적인 반발 수위에 따라, 향후 정국이 완전히 멈춰 서거나 극적인 타협점을 찾을지가 결정될 것입니다.`,
  sources:[{title:`국감 끝났지만 전운 고조…여야 '국정조사' 정면 충돌 - MBC`,url:`https://imnews.imbc.com/123`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`스스로 목표를 설정하고 복잡한 임무를 달성하는 '에이전틱 AI'가 물류 및 서비스 현장에 직접 도입되며 산업 혁신을 주도하고 있습니다.`,
  metrics:[`올해 글로벌 AI 스타트업 벤처 투자액 수십억 달러 돌파`,`주요 IT 박람회 출품 로봇의 40% 이상이 자율형 AI 적용`],
  summary:`인공지능 기술이 기존의 단순한 텍스트 생성 모델을 뛰어넘어 사용자를 대신해 복잡한 의사결정을 내리고 행동으로 직접 옮기는 에이전틱 AI 시대로 가파르게 진화하고 있습니다. 이러한 지능형 에이전트 소프트웨어는 사람의 세세한 개입 없이도 스스로 작업 계획을 세우고 외부 소프트웨어 툴을 능동적으로 제어하며 주어진 최종 목표를 달성해 냅니다. 나아가 이러한 두능을 물리적 로봇에 이식한 이른바 '피지컬 AI' 기술이 대형 물류 창고나 외식업 주방 현장에 속속 실전 배치되고 있습니다. 최근 연이어 열린 글로벌 테크 박람회에서는 인간의 막연한 지시를 이해하고 복잡한 재고 관리나 조리를 스스로 해내는 지능형 로봇들이 단연 가장 큰 주목을 받았습니다. 이는 단순한 작업 보조를 넘어 향후 기업의 인력 구조와 전통적인 업무 프로세스 전반을 근본적으로 뒤바꿀 거대한 폭발력을 지니고 있습니다. 전문가들은 향후 몇 년 내에 스스로 작동하는 능동형 AI 기술이 산업계 전반을 떠받치는 필수 표준 인프라로 자리 잡을 것으로 내다보고 있습니다.`,
  keyTerms:[{term:`에이전틱 AI`,explanation:`사람의 질문에 단순히 대답만 하는 것을 넘어, AI가 스스로 판단하고 여러 도구를 적절히 활용해 복잡한 목표를 끝까지 완수해 내는 능동적인 인공지능 기술입니다.`}],
  history:`글쓰기와 이미지 생성에 머물렀던 챗GPT 등 대형 언어 모델들이 최근 고도의 논리적 추론 능력과 외부 API 호출 기능을 갖추면서 스스로 행동하는 시스템으로 발전하게 되었습니다.`,
  players:`차세대 자율형 에이전트 프레임워크의 주도권을 잡으려는 빅테크 기업들과 이를 실제 로봇 공학 및 소프트웨어에 발 빠르게 통합하려는 혁신 스타트업들입니다.`,
  current:`단순한 실험실 수준의 개념 증명을 넘어, 실제로 비용을 절감하고 상업적으로 활용 가능한 수준의 자율형 AI 제품들이 본격적으로 쏟아져 나오는 전환기입니다.`,
  outlook:`AI가 스스로 판단하다가 발생할 수 있는 치명적 오류(할루시네이션) 위험을 어떻게 통제하고 윤리적 안전성을 담보할지가 상용화 속도를 결정짓는 가장 중요한 숙제입니다.`,
  sources:[{title:`대답 대신 스스로 일한다…'에이전틱 AI' 시대 활짝 - 한국경제`,url:`https://www.hankyung.com/it/123`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`미국 연방수사국(FBI)이 글로벌 가상자산 거래소에서 발생한 대규모 코인 탈취 사건의 배후로 북한 연계 해커 조직을 공식 지목했습니다.`,
  metrics:[`이번 해킹 피해 규모 최소 수천만 달러 이상 추산`,`미국 및 인터폴, 북한 연계 추정 지갑 주소 수십 개 전격 동결`],
  summary:`글로벌 최대 암호화폐 거래소인 바이낸스를 비롯한 주요 코인 플랫폼에서 잇따라 대규모 해킹 사태가 발생한 가운데, 미 연방수사국(FBI)이 심층 수사 결과를 전격 발표했습니다. FBI는 이번 천문학적인 가상자산 탈취 사건을 주도한 핵심 세력이 북한 정권과 직접적으로 자금망이 연계된 국가 지원 엘리트 해커 조직이라고 공식 지목했습니다. 해커들은 고도화된 스피어피싱 기법과 신종 악성코드 유포 방식을 동원해 거래소의 내부 보안망을 교묘하게 우회하고 막대한 규모의 자산을 단숨에 빼돌린 것으로 파악되었습니다. 탈취된 자금은 추적이 불가능하도록 복잡한 믹싱 서비스를 거치며 세탁되어, 궁극적으로 핵무기나 탄도미사일 개발 등 북한의 핵심 군사 자금으로 전용되고 있다는 분석이 지배적입니다. 이에 긴급 대응하여 미국을 비롯한 국제사회는 북한 관련 해킹 계좌와 암호화폐 지갑을 신속히 동결하는 등 사이버 금융망 돈줄 조이기에 총력을 기울이고 있습니다. 눈에 보이지 않는 사이버 공간이 물리적 도발 못지않은 새로운 글로벌 안보 위협의 최전선으로 부상하고 있음을 명확히 보여주는 충격적인 사례입니다.`,
  keyTerms:[{term:`가상자산 탈취`,explanation:`뛰어난 기술을 가진 해커들이 컴퓨터 보안망을 뚫고 들어가 암호화폐 거래소나 개인 전자 지갑에 보관된 비트코인 등 디지털 자산을 불법적으로 빼돌리는 최첨단 범죄 행위입니다.`}],
  history:`국제사회의 촘촘한 대북 제재로 정상적인 외화벌이 창구가 막힌 북한 정권은 오래전부터 국가 차원에서 정예 해커를 육성해 글로벌 금융기관을 털어 불법 자금을 조달해왔습니다.`,
  players:`익명성의 그늘과 추적의 어려움을 교묘히 악용하는 북한 정찰총국 산하 사이버 해커 부대와, 이를 끝까지 추적해 자금을 차단하려는 미국 FBI 등 국제 사법 연대입니다.`,
  current:`가상자산 생태계의 구조적 취약점을 파고든 북한의 해킹 기법이 날로 정교해지면서, 단일 기업의 방어를 넘어 국제사회가 거래소 보안 규제와 감시망을 대폭 강화하고 있습니다.`,
  outlook:`탈취된 가상자산이 현금화되는 우회 경로를 원천 차단하기 위한 국가 간 수사 공조가 더욱 촘촘해질 것이며, 가상자산 업계 전반에 훨씬 엄격한 보안 의무 규정이 신설될 전망입니다.`,
  sources:[{title:`FBI "글로벌 코인 거래소 대규모 해킹, 배후는 북한" - SBS`,url:`https://news.sbs.co.kr/news/123`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`핼러윈 기간 등 주말을 맞아 도심 주요 행사에 수만 명의 대규모 인파가 몰리면서 경찰과 지자체가 첨단 통제 시스템을 가동하고 있습니다.`,
  metrics:[`이태원·홍대 등 주요 도심 지역 주말 유동 인구 수십만 명 집중`,`경찰 기동대 및 지자체 현장 안전 관리 인력 수천 명 비상 배치`],
  summary:`이번 주말 핼러윈 기간과 대규모 도심 마라톤 및 각종 문화 집회가 한꺼번에 겹치면서 서울 이태원, 홍대 등 주요 도심 지역에 엄청난 수의 시민들이 운집했습니다. 과거의 가슴 아픈 비극을 결코 반복하지 않기 위해 경찰과 해당 관할 지자체는 동원 가능한 모든 현장 안전 관리 인력을 투입하여 최고 수준의 비상근무 체제에 돌입했습니다. 인파 통제를 위해 주요 도로는 버스 노선이 대거 우회하고 차량 진입이 전면 통제되는 등 시민들의 교통 불편 민원도 다수 접수되었으나 안전이 최우선이라는 공감대가 형성되었습니다. 특히 지자체는 AI 기반의 지능형 CCTV와 실시간 혼잡도 분석 시스템을 적극 활용하여 병목 현상이 예상되는 비좁은 골목길의 인파를 사전에 분산시키는 데 주력했습니다. 시민들 역시 현장 통제 요원들의 지시 안내선 밖에서 적극적으로 협조하며 안전하고 질서 있는 주말 여가를 보내기 위해 노력하는 성숙한 시민 의식을 보여주었습니다. 참사 이후 인파 밀집 사고에 대한 사회적 경각심이 시스템과 시민들의 인식 전반에 깊게 뿌리내리고 있는 긍정적인 모습입니다.`,
  keyTerms:[{term:`인파 밀집`,explanation:`좁은 장소나 특정 지역 구역에 물리적으로 수용할 수 있는 한계를 넘어설 정도로 지나치게 많은 사람들의 무리가 한꺼번에 빽빽하게 모여 이동이 제한되는 몹시 위험한 상태를 말합니다.`}],
  history:`과거 핼러윈 기간 도심 한복판 좁은 골목에서 발생한 전대미문의 대형 참사 이후, 대한민국 사회 전체는 군중 밀집 지역의 체계적인 안전 관리 시스템 부재에 대해 뼈아픈 국가적 반성을 겪었습니다.`,
  players:`어떠한 형태의 안전 사고라도 철저히 미연에 방지해야 하는 경찰 및 지자체 행정 당국과, 자유로운 주말 여가를 즐기기 위해 도심 핫플레이스로 모인 수많은 일반 시민들입니다.`,
  current:`단순한 호루라기와 현장 인력 배치를 훌쩍 넘어, 첨단 IT 기술을 접목한 실시간 군중 혼잡도 모니터링 경보 시스템이 실제 현장에 촘촘히 적용되며 관제 능력이 본격적인 시험대에 올랐습니다.`,
  outlook:`이번 주말이 중대한 사고 없이 무사히 마무리된다면, 새롭게 도입된 고강도 인파 통제 매뉴얼과 AI 감시 네트워크가 향후 대한민국의 모든 대형 지역 축제와 행사의 표준 안전 모델로 확고히 정착할 것입니다.`,
  sources:[{title:`핼러윈 주말 도심 북적…경찰·지자체 인파 관리 총력 - 연합뉴스`,url:`https://www.yna.co.kr/view/124`}]
}]

  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`국내 금융·증권가 연쇄 사이버 해킹 비상으로 관련 보안주 급등`,
  metrics:[`주요 보안주 전일 대비 15% 이상 급등`,`금융위, 3개 주요 은행 긴급 점검 실시`],
  summary:`국내 주요 은행과 증권사를 겨냥한 연쇄 사이버 보안 공격이 발생하며 금융권 전체에 비상이 걸렸습니다. 해커 조직이 동시다발적인 디도스(DDoS) 공격과 내부망 침투를 시도하면서 시스템 장애가 일부 발생했습니다. 이번 사태로 인해 주식 시장에서는 사이버 보안 관련 기업들의 주가가 단숨에 급등하는 등 파장이 일고 있습니다. 특히 망분리 규제 완화를 앞두고 터진 보안 사고라 금융 당국의 정책 수정 여부에도 관심이 쏠리고 있습니다. 금융감독원은 즉각 통합 위기대응반을 꾸려 피해 규모를 파악 중입니다. 추가적인 피해를 막기 위해 전 금융권의 자체 보안망 점검이 의무화되었습니다. 향후 사이버 위협이 진화함에 따라 강력한 보안 인프라 구축의 중요성이 더욱 커질 전망입니다.`,
  keyTerms:[{term:`망분리 규제`,explanation:`금융기관의 내부 업무용 통신망과 외부 인터넷망을 원천적으로 차단해 사이버 공격을 막는 보안 규제입니다.`}],
  history:`한국은 과거 3.20 사이버 테러 이후 전 금융권에 강력한 망분리 정책을 적용해 왔습니다.`,
  players:`공격을 주도한 해커 그룹, 방어에 나선 금융보안원, 그리고 수혜를 입은 국내 사이버 보안 기업들이 주요 플레이어입니다.`,
  current:`최근 클라우드 및 AI 도입을 위해 망분리를 완화하려던 당국의 계획이 이번 사태로 제동이 걸릴 위기에 처했습니다.`,
  outlook:`단기적으로 금융권의 대규모 보안 솔루션 추가 발주가 이어질 가능성이 높으며, 주식 시장에서도 보안 테마주의 변동성이 지속될 것입니다.`,
  sources:[{title:`금융·증권가 해킹 비상 - 연합뉴스`,url:`https://www.yna.co.kr`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`아마존 AWS 실적 호조에도 막대한 AI 투자 비용 부담에 빅테크 주가 요동`,
  metrics:[`AWS 분기 매출 39% 성장`,`빅테크 4사 AI 설비투자 500억 달러 돌파`],
  summary:`미국 주요 빅테크 기업들이 호실적을 발표했음에도 불구하고, 막대한 인공지능(AI) 인프라 투자 비용에 대한 우려로 주가가 급등락했습니다. 아마존의 클라우드 부문인 AWS는 전년 대비 큰 폭의 매출 성장을 기록하며 AI 수요의 실체를 증명했습니다. 그러나 투자자들은 이러한 수익이 투입되는 천문학적인 비용인 자본적 지출을 언제쯤 상쇄할 수 있을지에 대해 강한 의구심을 표하고 있습니다. 막대한 서버 증설과 전력 확보 비용이 기업의 현금 흐름을 압박하고 있기 때문입니다. 현재 월스트리트에서는 AI 버블론과 장기 성장론이 팽팽하게 맞서고 있습니다. 결과적으로 단기 수익성 둔화를 우려한 매도세가 쏟아지며 나스닥 지수에도 하방 압력을 가했습니다.`,
  keyTerms:[{term:`자본적 지출`,explanation:`기업이 미래의 이윤을 창출하기 위해 서버, 공장, 장비 등 고정자산을 구매하거나 개량하는 데 쓰는 비용을 뜻합니다.`}],
  history:`챗GPT 등장 이후 글로벌 빅테크들은 생성형 AI 시장 선점을 위해 데이터센터 인프라 확충에 사활을 걸어왔습니다.`,
  players:`아마존(AWS), 마이크로소프트, 구글 등 클라우드 지배자들과 월스트리트의 주요 기관 투자자들이 갈등하고 있습니다.`,
  current:`실적 발표 시즌을 맞아, 기업들은 AI가 수익을 내고 있다고 강조하지만 시장은 여전히 막대한 지출 규모에 불안해하고 있습니다.`,
  outlook:`다음 분기 실적에서도 AI 부문의 직접적인 이익 기여도가 입증되지 않으면 빅테크 주가의 추가 조정이 발생할 수 있습니다.`,
  sources:[{title:`빅테크 AI 투자와 클라우드 성장세 - Bloomberg`,url:`https://www.bloomberg.com`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미 연준의 기준금리 동결 속 캐나다 등 주요국 통화정책 엇갈림 심화`,
  metrics:[`미국 기준금리 5.25~5.50% 유지`,`유럽중앙은행(ECB) 인플레이션 전망치 0.2%p 상향`],
  summary:`미국 연방준비제도(Fed)가 기준금리를 동결한 가운데, 다른 주요국 중앙은행들은 각기 다른 통화정책을 펼치며 글로벌 금리 디커플링(탈동조화)이 가속화되고 있습니다. 미국은 물가 둔화 추세를 관망하며 현상 유지를 택한 반면, 캐나다 등 일부 국가는 인플레이션 압력에 선제 대응해 금리 인상을 단행했습니다. 이러한 상이한 행보는 국가별로 경제 기초체력과 에너지 가격 구조가 다르기 때문입니다. 국가 간 금리 격차가 벌어지면서 외환시장에서는 달러화 강세가 재점화되었고, 상대적으로 신흥국 통화 가치는 급락하고 있습니다. 글로벌 자금 흐름의 불확실성이 커지며 다국적 기업들의 환율 방어에도 비상이 걸렸습니다. 투자자들은 개별 국가의 통화정책 차별화가 자산 시장에 미칠 파장을 예의주시하고 있습니다.`,
  keyTerms:[{term:`디커플링`,explanation:`국가 간의 경제 상황이나 통화정책, 주가 흐름 등이 같은 방향으로 움직이지 않고 서로 엇갈리며 독립적으로 움직이는 현상입니다.`}],
  history:`코로나19 팬데믹 이후 전 세계는 미국의 가파른 금리 인상 기조에 보조를 맞추어 동반 긴축을 진행해 왔습니다.`,
  players:`미국 연방준비제도(Fed), 유럽중앙은행(ECB), 캐나다 중앙은행 및 신흥국 외환 당국들이 얽혀 있습니다.`,
  current:`미국 경제는 견조한 성장을 유지하는 반면, 다른 지역은 경기 침체 우려와 물가 불안이 혼재되어 일치된 정책을 펴기 어려워졌습니다.`,
  outlook:`미 연준의 금리 인하 시점이 지연될수록 신흥국의 자본 유출 방어를 위한 고금리 유지 딜레마는 더욱 깊어질 것입니다.`,
  sources:[{title:`주요국 통화정책 차별화 - Reuters`,url:`https://www.reuters.com`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`내년도 슈퍼 예산안 심사 돌입, 국정감사 여야 대규모 삭감 공방 격화`,
  metrics:[`내년도 예산안 총 677조 원 규모`,`야당, 특수활동비 등 3조 원 이상 삭감 예고`],
  summary:`국회가 내년도 정부 예산안 심사에 본격 착수하면서, 건정재정 기조와 민생 지원을 둘러싼 여야 간의 삭감 공방이 극에 달하고 있습니다. 정부와 여당은 재정건전성 유지를 위해 불필요한 지출을 통제한 합리적 예산안이라고 주장합니다. 반면 야당은 권력기관의 특수활동비를 전액 삭감하고 지역화폐 등 민생 예산을 대폭 증액해야 한다며 맞서고 있습니다. 상임위 곳곳에서 예산안 심사가 파행을 겪으며 법정 처리 시한을 넘길 것이라는 우려가 팽배합니다. 양측의 강경한 대치가 이어지면서 본회의 통과를 위한 정치적 타협점을 찾기 쉽지 않은 상황입니다. 결국 예산결산특별위원회 소소위로 넘어가 밀실 심사가 재현될 가능성도 제기되고 있습니다.`,
  keyTerms:[{term:`특수활동비`,explanation:`국가 기밀 유지가 필요한 정보 및 수사 활동 등에 쓰이는 예산으로, 사용처를 정확히 증빙하지 않아도 되어 종종 논란이 됩니다.`}],
  history:`매년 정기국회 때마다 예산안을 둘러싼 여야의 기싸움은 반복되어 왔으며, 특히 쟁점 예산을 둔 주도권 경쟁이 치열합니다.`,
  players:`국회 예결위 소속 여야 의원들과 예산안 원안을 방어하려는 기획재정부 소속 관료들입니다.`,
  current:`국정감사에서 불거진 각종 쟁점과 맞물려 예산안 심사가 정쟁의 연장선으로 변질되면서 갈등이 증폭되었습니다.`,
  outlook:`법정 기한을 넘겨 연말 임시국회 막판에 여야 지도부 간 극적인 타결로 통과될 전망이 우세합니다.`,
  sources:[{title:`내년도 예산안 및 국정감사 여야 대치 - 연합뉴스`,url:`https://www.yna.co.kr`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 중간선거 조기 투표율 급증, 경합주 중심 법적 공방과 긴장 최고조`,
  metrics:[`경합주 조기 투표자 수 4,500만 명 돌파`,`양당 선거 소송 관련 100여 건 접수`],
  summary:`미국 중간선거가 며칠 앞으로 다가온 가운데, 역대급 조기 투표율을 기록하며 민주당과 공화당 간의 선거판 긴장이 최고조에 달하고 있습니다. 특히 펜실베이니아, 조지아 등 핵심 경합주에서는 표차를 의식한 양당의 막판 유세전이 과열되고 있습니다. 양측 모두 선거 부정 우려를 제기하며 투표소 접근성과 개표 절차를 둘러싼 법적 공방을 쏟아내고 있습니다. 유권자들은 인플레이션과 경제 정책 등 첨예하게 갈린 주요 쟁점을 두고 양극화된 투표 성향을 보이고 있습니다. 선거 당일 개표 지연 가능성과 더불어 극단주의 지지자들의 소요 사태에 대한 치안 당국의 경계도 강화되었습니다. 이번 선거 결과에 따라 미국 현 행정부의 하반기 국정 동력이 완전히 판가름 날 예정입니다.`,
  keyTerms:[{term:`조기 투표`,explanation:`정해진 선거일 이전에 유권자가 투표소에 방문하거나 우편을 통해 미리 투표권을 행사할 수 있도록 하는 제도입니다.`}],
  history:`미국 정치의 양극화가 심화되면서 선거 결과에 불복하거나 투표 절차를 쟁점화하는 소송전이 점차 늘어나고 있습니다.`,
  players:`주도권을 유지하려는 민주당 지도부와 강력한 탈환을 노리는 공화당 후보 및 지지 세력들입니다.`,
  current:`경합주의 아주 작은 표차가 연방 상하원 다수당을 결정지을 수 있어, 양당은 법률팀을 총동원해 총력전을 펴고 있습니다.`,
  outlook:`선거일 이후에도 우편투표 개표 및 재검표 요구로 인해 승자 확정이 수일간 지연될 가능성이 매우 높습니다.`,
  sources:[{title:`미국 중간선거 직전 긴장 고조 - CNN`,url:`https://edition.cnn.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`이스라엘 총선 네타냐후 연합 과반 실패, 장기 연정 교착으로 중동 불안 가중`,
  metrics:[`네타냐후 우파 연합 59석 확보 (과반 61석 미달)`,`아랍계 정당 투표율 60% 상회`],
  summary:`이스라엘 조기 총선 결과 베냐민 네타냐후 전 총리가 이끄는 우파 블록이 의회 과반석 확보에 실패하며 심각한 정치적 교착 상태에 빠졌습니다. 세속주의 중도 정파와 아랍계 정당들이 예상보다 높은 득표를 기록하며 우파의 단독 정부 구성을 저지했습니다. 어느 진영도 안정적인 과반을 이루지 못함에 따라, 향후 수주 간 군소 정당들을 끌어들이기 위한 진흙탕 연정 협상이 불가피해졌습니다. 이스라엘 내부의 정치적 리더십 공백은 팔레스타인 무장 정파와의 갈등 관리에도 악영향을 미치고 있습니다. 잦은 선거에 지친 국민들의 피로감이 극에 달한 가운데, 연정에 실패할 경우 또다시 재선거를 치러야 하는 초유의 사태가 발생할 수 있습니다. 국제사회는 이스라엘의 혼란이 주변 중동 국가들의 안보 지형에 미칠 파장을 우려하고 있습니다.`,
  keyTerms:[{term:`연정 협상`,explanation:`의원 내각제에서 단독으로 과반 의석을 차지한 정당이 없을 때, 여러 정당이 부처 장관직 등을 나누며 하나의 정부를 구성하는 타협 과정입니다.`}],
  history:`이스라엘은 비례대표제 특성상 다당제가 난립하며, 최근 수년간 극심한 이념 대립으로 조기 총선이 반복되었습니다.`,
  players:`강경 보수 성향의 네타냐후 연합과 이를 저지하려는 중도, 좌파, 아랍계 정당 연합이 팽팽히 맞서고 있습니다.`,
  current:`사법부 권한 논란과 국가 정체성 문제로 촉발된 국론 분열이 이번 선거 결과에 반영되어 과반 세력이 실종되었습니다.`,
  outlook:`합의에 도달하기 힘든 구조적 한계로 인해, 연정 구성 기한 내 실패 시 단기간 내 또 한 번의 총선이 치러질 수 있습니다.`,
  sources:[{title:`이스라엘 총선 결과 - BBC`,url:`https://www.bbc.com`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`의료계, 소아응급실 내 경찰 기습 압수수색에 '진료권 침해' 반발 확산`,
  metrics:[`의료계 규탄 서명운동 참여 1만 명 돌파`,`해당 병원 응급실 야간 진료 3일째 차질`],
  summary:`최근 한 대형병원 소아응급실 내부에서 이뤄진 경찰의 기습 압수수색을 두고 의료계가 심각한 진료권 침해라며 강력히 반발하고 있습니다. 경찰은 의료사고 관련 증거 인멸을 막기 위해 법원의 영장을 발부받아 적법한 절차를 거쳤다는 입장입니다. 그러나 의사협회는 촌각을 다투는 응급 현장에서의 강압적 수사가 환자들의 생명을 위협하고 의료진의 사기를 꺾는 행위라며 목소리를 높이고 있습니다. 이번 사태로 중증 소아 환자를 다루는 응급의학과 전문의들의 이탈 우려가 더욱 현실화되고 있습니다. 시민들 사이에서도 공권력 집행의 필요성과 환자 안전 최우선이라는 가치가 엇갈리며 논란이 커지고 있습니다. 정부는 수사기관과 의료기관 간의 합리적인 영장 집행 가이드라인을 마련하기 위해 긴급 중재에 나섰습니다.`,
  keyTerms:[{term:`진료권 침해`,explanation:`의사가 환자를 안전하고 최선의 방법으로 치료할 수 있는 권리를 외부의 물리적, 제도적 간섭이 부당하게 방해하는 것을 의미합니다.`}],
  history:`최근 소아청소년과 전문의 부족 사태로 필수 응급 인프라가 붕괴 위기에 처한 상황에서 의료사고 법적 책임 문제까지 겹쳤습니다.`,
  players:`의료사고의 진상을 신속히 밝히려는 경찰과, 진료 현장 위축을 우려하며 보호 대책을 요구하는 의료계입니다.`,
  current:`경찰의 현장 압수수색 방식이 다소 강압적이었다는 지적이 제기되며 필수 의료 인력들의 누적된 불만이 폭발했습니다.`,
  outlook:`의료진 보호를 위한 필수의료 형사처벌 면책 특례법 제정 요구가 더욱 거세지며 국회 입법 논의가 가속화될 전망입니다.`,
  sources:[{title:`소아응급실 압수수색 공방 - 동아일보`,url:`https://www.donga.com`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`바이낸스, 스마트 컨트랙트 결함 뚫려 수십억 달러 규모 가상자산 탈취 충격`,
  metrics:[`탈취된 가상자산 규모 약 25억 달러 추정`,`바이낸스 자체 코인(BNB) 가격 20% 폭락`],
  summary:`세계 최대 가상자산 거래소인 바이낸스에서 블록체인 네트워크의 취약점을 노린 대규모 해킹 공격이 발생해 수십억 달러 상당의 자산이 탈취되었습니다. 해커들은 이종 블록체인 간 자산을 연결하는 브릿지 구간의 스마트 컨트랙트 결함을 정교하게 파고들어 자금을 빼돌렸습니다. 바이낸스 측은 즉각 시스템을 일시 중단하고 긴급 보안 패치를 적용했으나, 이미 빠져나간 자금의 회수 여부는 불투명합니다. 이번 초대형 보안 사고로 인해 블록체인 생태계 전반의 기술적 신뢰도에 치명적인 타격이 가해졌습니다. 각국 금융 당국은 가상자산 시장에 대한 대대적인 규제 강화와 보안 감사를 예고하며 즉각적인 조사에 착수했습니다. 불안감을 느낀 투자자들의 대규모 인출 사태 조짐마저 보이면서 코인 시장 전체가 패닉 상태에 빠졌습니다.`,
  keyTerms:[{term:`스마트 컨트랙트`,explanation:`블록체인 상에서 일정 조건이 충족되면 중개인 없이 사전에 약속된 계약 내용이 자동으로 실행되도록 프로그래밍된 시스템입니다.`}],
  history:`가상자산 시장 성장과 함께 서로 다른 블록체인을 연결하는 브릿지 기술은 항상 해커들의 최우선 표적이 되어 왔습니다.`,
  players:`막대한 피해를 입은 거래소 측과 신원 미상의 전문 해커 조직, 그리고 사태 수습을 압박하는 글로벌 규제 당국입니다.`,
  current:`탈중앙화 금융 생태계의 핵심 인프라가 공격당하면서, 기술적 안전성에 대한 근본적인 의구심이 시장을 지배하고 있습니다.`,
  outlook:`주요 거래소와 브릿지 프로토콜에 대한 국제적인 보안 감사가 의무화되고 보안 투자가 대폭 상향될 것으로 예상됩니다.`,
  sources:[{title:`가상자산 거래소 보안 사고 - WSJ`,url:`https://www.wsj.com`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`도심 핼러윈 인파 수십만 명 밀집 예상, 경찰 기동대 등 안전 통제 총력전`,
  metrics:[`주요 번화가에 경찰 기동대 50개 중대 투입`,`지자체 합동 안전 모니터링 시스템 100% 가동`],
  summary:`핼러윈 주말을 맞아 서울 등 주요 번화가에 수십만 명의 인파가 몰릴 것으로 예상되면서, 지자체와 경찰이 대규모 안전 관리 총력전에 돌입했습니다. 경찰은 이태원, 홍대 일대에 평소보다 많은 기동대와 자체 경비 인력을 집중 배치해 골목길 병목 현상을 통제하고 있습니다. 특히 지자체는 지능형 CCTV와 휴대전화 위치 데이터를 연동해 실시간으로 인파 밀집도를 분석하며 위험 징후를 감시 중입니다. 또한 우측통행 의무화와 일방통행 구역 설정을 통해 군중의 동선을 최대한 분산시키는 데 주력하고 있습니다. 지역 상인 연합회 역시 자체 질서 유지 요원을 고용하고 혼잡 시 영업을 조절하는 등 적극 협조하고 있습니다. 거리의 시민들도 과거의 아픔을 잊지 않고 자발적으로 질서를 지키며 성숙한 시민 의식을 보여주고 있습니다.`,
  keyTerms:[{term:`인파 밀집도`,explanation:`특정 공간이나 좁은 구역에 사람들이 얼마나 빽빽하게 모여 있는지를 센서나 통신 데이터로 측정해 수치화한 것입니다.`}],
  history:`수년 전 핼러윈 행사 중 발생한 가슴 아픈 압사 사고 이후, 국가 재난 관리 매뉴얼과 다중 밀집 행사에 대한 안전 기준이 대폭 강화되었습니다.`,
  players:`안전 통제를 수행하는 경찰 및 소방관, 행사를 관리하는 지자체 공무원, 그리고 성숙하게 축제를 즐기는 시민들입니다.`,
  current:`강화된 매뉴얼에 따라 예년보다 촘촘한 안전망이 현장에 적용되고 있으며 통제 요원들의 지시가 엄격하게 시행 중입니다.`,
  outlook:`올해 행사가 안전하게 마무리되면, 향후 연말연시 대규모 군중 축제 안전 관리의 훌륭한 선례로 남게 될 것입니다.`,
  sources:[{title:`핼러윈 주말 인파 안전 관리 - KBS`,url:`https://news.kbs.co.kr`}]
}]

  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`골드만삭스가 SK스퀘어의 자회사인 티맵모빌리티 경영권을 약 8,000억 원에 인수하는 방안을 추진 중입니다.`,
  metrics:[`인수 규모 약 8,000억 원`,`목표 지분율 60~70%`],
  summary:`글로벌 투자은행 골드만삭스가 국내 내비게이션 1위 앱 티맵모빌리티의 경영권 인수를 타진하고 있습니다. 이번 거래 규모는 약 7,000억 원에서 8,000억 원 수준으로 거론되며, 목표 지분율은 60%에서 70% 사이입니다. SK스퀘어는 보유 중인 경영권 지분과 재무적 투자자의 지분을 묶어 매각하는 방안을 협상 중인 것으로 알려졌습니다. 이는 SK그룹 차원에서 진행 중인 고강도 포트폴리오 리밸런싱 작업의 일환으로 풀이됩니다. 반도체와 인공지능 등 핵심 사업에 집중하기 위해 비핵심 자산을 매각하여 투자 재원을 확보하려는 목적입니다. 골드만삭스는 티맵이 축적한 방대한 모빌리티 데이터와 향후 자율주행 시장에서의 가치를 높게 평가한 것으로 분석됩니다. 양측은 연내 본계약 체결을 목표로 세부 조건을 조율 중인 상황입니다.`,
  keyTerms:[{term:`포트폴리오 리밸런싱`,explanation:`기업이 변화하는 시장 환경에 맞춰 기존 사업을 매각하거나 새로운 사업을 인수하여, 그룹 전체의 자산 비중과 투자 방향성을 재조정하는 작업을 말합니다.`}],
  history:`SK스퀘어는 출범 이후 모빌리티, 앱마켓 등 다양한 비반도체 플랫폼 자산을 보유해 왔으나, 최근 수익성 악화와 그룹 차원의 사업 재편 압박을 받아왔습니다.`,
  players:`자산 효율화를 최우선으로 추진하는 SK스퀘어와 아시아 모빌리티 데이터 시장의 잠재력에 눈독을 들이는 골드만삭스 사모펀드가 핵심 당사자입니다.`,
  current:`원스토어와 인크로스 매각에 이어, 덩치가 가장 큰 자회사인 티맵모빌리티까지 매각 대상에 오르면서 SK그룹의 구조조정이 정점에 달한 모습입니다.`,
  outlook:`연내 본계약이 성사될 경우 국내 모빌리티 플랫폼 시장의 지각 변동이 일어날 전망이며, 매각 대금을 활용한 SK스퀘어의 후속 투자 행보가 주목받고 있습니다.`,
  sources:[{title:`골드만삭스, 티맵모빌리티 경영권 인수 추진 - 블로터`,url:`https://www.bloter.net`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`인텔이 3분기 실적 선방에도 불구하고 부진한 4분기 실적 가이던스를 발표하며 주가가 약 20% 폭락했습니다.`,
  metrics:[`4분기 예상 매출 150억 달러`,`시간외 주가 하락 약 20%`],
  summary:`미국 반도체 기업 인텔의 주가가 뉴욕 증시 시간외 거래에서 최대 20% 이상 폭락하는 충격을 맞았습니다. 3분기 매출은 165억 달러를 기록해 시장 전망치를 웃도는 양호한 성적을 냈습니다. 그러나 4분기 실적 가이던스 예상치가 시장 기대치에 크게 못 미치면서 투자자들의 막대한 실망 매물이 쏟아졌습니다. 인텔은 4분기 매출을 150억 달러에서 160억 달러 수준으로 제시했는데, 이는 월가 예상치인 171억 달러를 밑도는 수치입니다. 특히 주력 사업인 전통적인 PC 칩 수요의 부진이 내년 상반기까지 이어질 것이라는 회사 측의 비관적 전망이 타격을 주었습니다. 인공지능 칩 시장에서는 긍정적인 성장을 보였음에도, 핵심 사업의 수익성 악화 우려를 불식시키기에는 역부족이었습니다. 여기에 이스라엘 공장 사고로 인한 일회성 손실까지 겹치면서 시장의 불안감을 더욱 키웠습니다.`,
  keyTerms:[{term:`실적 가이던스`,explanation:`기업의 경영진이 투자자들을 위해 자사의 향후 매출이나 영업이익 등 예상되는 재무 성과를 미리 제시하는 자체 전망치를 의미합니다.`}],
  history:`인텔은 과거 PC 중앙처리장치 시장의 압도적 강자였으나, 모바일 시대 전환 실패와 파운드리 미세 공정 지연으로 경쟁사들에게 점유율을 꾸준히 빼앗겨 왔습니다.`,
  players:`위기 극복을 지휘하는 팻 겔싱어 최고경영자와 미래 수익성에 대한 실망감으로 주식을 투매하는 월가 투자자들이 현재 상황을 주도하고 있습니다.`,
  current:`데이터센터용 인공지능 칩 수요는 폭발하고 있으나, 인텔의 가장 큰 수입원인 일반 PC 시장의 침체가 회복되지 않아 전체적인 수익성 악화가 가시화되었습니다.`,
  outlook:`대규모 파운드리 투자와 인공지능 칩 신제품을 통해 잃어버린 시장 신뢰를 회복하고, 내년 하반기 이후 실적 반등을 이뤄낼 수 있을지가 핵심 관건입니다.`,
  sources:[{title:`인텔 4분기 가이던스 쇼크, 주가 20% 폭락 - 글로벌이코노믹`,url:`https://www.g-enews.com`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 음식 배달 1위 도어대시가 식료품 배달 플랫폼 인스타카트를 170억 달러에 전격 인수합니다.`,
  metrics:[`인수 규모 170억 달러`,`주당 매입가 65달러`],
  summary:`미국의 최대 음식 배달 플랫폼 도어대시가 식료품 배송 1위 기업인 인스타카트를 약 170억 달러에 인수한다고 공식 발표했습니다. 이번 거래는 주당 65달러에 현금과 주식을 교환하는 방식으로 이루어지며, 기존 주가 대비 상당한 경영권 프리미엄이 반영되었습니다. 도어대시는 기존의 식당 음식 배달을 넘어 인스타카트의 거대한 마트 및 생필품 네트워크를 단숨에 흡수하게 됩니다. 이를 통해 두 플랫폼을 넘나드는 크로스셀링 전략을 구사하여 아마존이나 월마트 같은 거대 유통 공룡들과 직접 경쟁할 수 있는 덩치를 갖추게 되었습니다. 인수 이후에도 인스타카트 브랜드와 개별 앱은 당분간 독립적으로 유지될 예정입니다. 양사는 주주 승인과 미국 규제 당국의 엄격한 반독점 심사를 거쳐 향후 2년 내에 합병 절차를 마무리할 계획입니다.`,
  keyTerms:[{term:`크로스셀링`,explanation:`고객이 이미 구매한 상품이나 서비스와 연관된 다른 상품을 추가로 구매하도록 유도하여 객단가와 매출을 한꺼번에 높이는 '교차 판매' 마케팅 기법입니다.`}],
  history:`도어대시와 인스타카트는 팬데믹 기간 동안 미국 내 비대면 배달 수요가 폭증하며 각자의 영역에서 독보적인 1위 사업자로 급성장했습니다.`,
  players:`종합 물류 플랫폼으로 진화하려는 도어대시와 상장 이후 성장이 정체되었던 인스타카트, 그리고 이들을 견제할 아마존과 우버이츠가 치열한 기싸움을 벌이고 있습니다.`,
  current:`배달 시장의 성장이 둔화되고 빠른 배송 경쟁이 격화되면서, 단일 품목만으로는 생존하기 어렵다는 위기감이 이번 초대형 합병을 촉발했습니다.`,
  outlook:`가장 큰 난관은 최근 거대 플랫폼 합병에 깐깐해진 연방거래위원회의 반독점 심사 통과 여부이며, 두 회사의 통합 구독 멤버십이 가져올 시장 파급력도 주목받고 있습니다.`,
  sources:[{title:`도어대시, 인스타카트 170억 달러에 인수 합의 - 포브스`,url:`https://www.forbes.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`한국과 독일이 정상회담을 열고 양국 관계를 '강화된 전략적 동반자 관계'로 공식 격상했습니다.`,
  metrics:[`협력 분야 6대 첨단기술`,`교류 역사 140여 년`],
  summary:`한국과 독일 양국 정상이 만나 교류 수준을 한 단계 높이는 강화된 전략적 동반자 관계를 공식 수립하기로 합의했습니다. 양국은 기존의 단순 교역 중심 파트너십을 넘어 반도체, 인공지능, 우주, 양자 등 미래 핵심 첨단기술 분야에서 공동 연구와 협력을 대폭 확대하기로 했습니다. 경제 및 기술 공조뿐만 아니라 글로벌 안보 위기에 대응하기 위한 국방 협력도 주요 의제로 다뤄졌습니다. 특히 양국 국방 당국 간의 원활한 정보 공유를 위해 군사비밀정보보호협정의 조속한 체결을 추진하기로 뜻을 모았습니다. 또한 글로벌 공급망 불확실성에 대비해 핵심 광물과 에너지 안보 분야에서도 공동 대응 체계를 구축하기로 했습니다. 유럽연합의 산업 규제 법안과 관련해 우리 기업들이 차별 없이 동등한 대우를 받을 수 있도록 독일 정부의 협조도 강하게 요청했습니다.`,
  keyTerms:[{term:`강화된 전략적 동반자 관계`,explanation:`단순한 경제적 교류를 넘어 외교, 안보, 첨단 산업 등 국가의 핵심 이익 전반에 걸쳐 장기적이고 깊이 있는 협력을 약속하는 외교적 관계 격상을 의미합니다.`}],
  history:`한국과 독일은 과거 분단국의 아픔을 공유하며, 강력한 제조업 중심의 경제 성장이라는 공통점을 바탕으로 140여 년간 꾸준히 신뢰를 쌓아왔습니다.`,
  players:`기술 안보 확보와 방위산업 수출 시장 확대를 노리는 한국 정부와, 아시아 내 주요 민주주의 국가와의 연대를 강화하려는 독일 정부가 손을 잡았습니다.`,
  current:`강대국 간의 패권 경쟁과 지속되는 지정학적 불안 속에서, 기술 주권과 국가 안보를 동시에 챙기기 위한 양국의 국가적 이해관계가 정확히 일치했습니다.`,
  outlook:`향후 추진될 군사비밀정보보호협정 체결 과정과 양국 방위산업 기업 간의 구체적인 합작 투자 성과가 이번 관계 격상의 실질적인 결과물이 될 것입니다.`,
  sources:[{title:`한국·독일, '강화된 전략적 동반자 관계'로 격상 - 연합뉴스`,url:`https://www.yna.co.kr`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 중부사령관이 트럼프 대통령에게 대이란 군사 공격 옵션을 직접 보고하며 중동 긴장이 최고조에 달하고 있습니다.`,
  metrics:[`배치 증가 패트리엇 포대`,`목표 이란 내 핵심 시설`],
  summary:`미군의 중동 작전을 총괄하는 브래드 쿠퍼 중부사령관이 백악관을 방문해 트럼프 대통령에게 대이란 타격 옵션을 직접 보고했습니다. 국방장관 등 최고위 안보 라인이 배석한 가운데 이루어진 이번 대면 직보는 미국의 대규모 무력행사가 임박했다는 강력한 신호로 해석됩니다. 미 국방부는 최근 이란의 보복 공격에 대비해 취약한 전방 기지의 미군을 분산시키고, 추가 방공망과 군수물자를 중동 전역에 증강 배치하며 실전 준비를 서두르고 있습니다. 트럼프 대통령 역시 유세 중 과거의 강력했던 폭격 작전을 상기시키며 이란에 대한 공개적인 무력 대응을 경고했습니다. 한편으로는 강도 높은 군사적 압박을 가하면서도, 막후에서는 부통령을 통해 이란 측에 협상 재개를 타진하는 투트랙 전략을 구사하고 있습니다. 그러나 이란은 선제 공격을 받을 경우 역내 미군 기지를 즉각 타격하겠다고 맞서며 일촉즉발의 위기감이 고조되고 있습니다.`,
  keyTerms:[{term:`투트랙 전략`,explanation:`외교나 협상에서 겉으로는 강력한 군사적 압박이나 제재를 가하면서, 동시에 물밑으로는 대화나 타협의 채널을 열어두는 양면 전술을 뜻합니다.`}],
  history:`미국은 과거 이란 핵합의 파기 이후 이란에 대해 일관되게 '최대 압박' 정책을 펼쳐왔으며, 양국 간의 군사적 마찰은 여러 차례 임계점을 넘나들었습니다.`,
  players:`강력한 보복 대응을 저울질하는 미국 최상위 안보 수뇌부와, 절대 물러서지 않겠다고 다짐하는 이란 혁명수비대 강경파들이 팽팽하게 대립하고 있습니다.`,
  current:`이스라엘과 중동 내 무장 세력 간의 충돌이 격화되는 와중에, 미국이 중동 내 자국의 억지력을 재확립하기 위해 직접적인 무력시위 카드까지 꺼내 든 셈입니다.`,
  outlook:`미국의 거센 군사적 압박이 이란을 협상 테이블로 끌어낼지, 아니면 이란의 호르무즈 해협 위협이나 미군 기지 선제 타격이라는 파국으로 이어질지 전 세계가 주시하고 있습니다.`,
  sources:[{title:`미 중부사령관, 대이란 공격 옵션 백악관 직보 - 뉴스핌`,url:`https://www.newspim.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`일본 집권 자민당과 공명당 연합이 중의원 총선거에서 15년 만에 과반 의석 확보에 실패하며 참패했습니다.`,
  metrics:[`자민당 획득 의석 191석`,`여당 연합 총 215석`],
  summary:`최근 치러진 일본 중의원 총선거에서 집권 여당인 자민당과 공명당 연합이 전체 465석 중 과반인 233석에 턱없이 모자란 215석을 얻는 데 그쳤습니다. 이로써 자민당 연립 여당은 2009년 야당에 정권을 내준 이후 15년 만에 처음으로 중의원 과반이 무너지는 굴욕을 겪게 되었습니다. 이번 참패의 가장 큰 원인은 자민당 핵심 파벌들이 연루된 끈질긴 정치자금 비자금 스캔들에 대한 유권자들의 매서운 심판입니다. 신임 총리가 취임 직후 당내 쇄신을 내세워 무리하게 의회 조기 해산 결정을 내린 것이 오히려 국민적 반감을 사며 역풍으로 작용했습니다. 여기에 고물가와 실질임금 하락으로 경제적 불만이 누적된 무당파 층이 대거 투표장에서 야당에 표를 던진 결과입니다. 제1야당인 입헌민주당은 의석수를 대폭 늘리며 크게 약진했고, 소수 여당으로 전락한 자민당의 향후 정국 운영은 큰 난관에 부딪혔습니다.`,
  keyTerms:[{term:`조기 해산`,explanation:`의원들의 원래 정해진 임기가 끝나기 전에 총리가 의회를 해산하고 선거를 다시 치러, 유권자들에게 새로운 정치적 지지와 정당성을 묻는 제도입니다.`}],
  history:`일본 자민당은 과거 2012년 정권 탈환 이후 장기간 의회 과반을 굳건히 독점해 왔으나, 최근 잇따른 파벌 부패 스캔들로 국민적 신뢰가 바닥까지 추락했습니다.`,
  players:`당내 튼튼한 기반 없이 총선 패배의 책임을 고스란히 안게 된 현직 총리와, 이번 선거 돌풍을 일으키며 유력한 대안 세력으로 떠오른 제1야당이 정국의 중심에 섰습니다.`,
  current:`여당이 단독으로 주요 법안과 예산안을 처리할 수 없게 되면서, 정권 유지를 위해 성향이 비슷한 야당의 눈치를 봐야 하는 극도의 여소야대 정국이 펼쳐졌습니다.`,
  outlook:`자민당 내부의 강력한 책임론 분출과 총리 사퇴 압박이 커질 것으로 보이며, 특정 야당과의 불안정한 '건별 정책 공조'라는 국정 운영 방식이 당분간 지속될 전망입니다.`,
  sources:[{title:`일본 자민당 중의원 선거 참패, 15년 만에 과반 붕괴 - YTN`,url:`https://www.ytn.co.kr`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`국산 1호 비만 치료제 '에페'가 처방을 개시하며 위고비, 마운자로와 함께 국내 시장 3파전이 시작되었습니다.`,
  metrics:[`4주분 초기 공급가 약 13만 원`,`평균 체중 감량 효과 약 9.75%`],
  summary:`국내 제약사가 독자 개발한 첫 국산 비만 신약 '에페'가 마침내 의료 현장에 정식 공급되며 본격적인 환자 처방이 시작되었습니다. 이로써 글로벌 비만 치료제 시장을 장악하고 있는 수입 약물인 위고비, 마운자로와 함께 국내 시장에서 치열한 3파전이 벌어지게 되었습니다. 국산 신약인 에페의 가장 큰 무기는 외산 약물 대비 절반 이하로 책정된 저렴한 가격입니다. 초기 4주분 공급가가 약 13만 원 수준으로, 보험이 적용되지 않는 비급여 치료의 경제적 부담을 크게 낮췄습니다. 또한 100% 한국인 환자를 대상으로 한 대규모 임상 3상에서 약 10%에 달하는 체중 감량 효과와 함께 아시아인 신체에 적합한 우수한 내약성을 입증했습니다. 기존 약물들과 유사한 단일 작용 기전을 바탕으로 수입 약품들이 겪고 있는 고질적인 물량 부족 사태 없이 국내 공장에서 안정적으로 제품을 공급할 수 있다는 것도 큰 강점입니다.`,
  keyTerms:[{term:`내약성`,explanation:`환자가 특정 약물을 복용했을 때 나타나는 구토, 어지러움 같은 부작용이나 불편함을 신체가 얼마나 잘 견뎌내고 적응할 수 있는지를 나타내는 척도입니다.`}],
  history:`현대 비만 치료제 시장은 주 1회 투여로도 뛰어난 감량 효과를 내는 위고비가 큰 화제를 모으며 폭발적으로 성장했으나, 천정부지로 솟은 비싼 약값이 항상 지적되어 왔습니다.`,
  players:`압도적인 자금력을 자랑하는 글로벌 초대형 제약사들에 맞서, 토종 제약사가 독자적인 약물 지속형 기반 기술을 앞세워 틈새시장 공략에 나섰습니다.`,
  current:`외산 약품들이 파격적인 체중 감량 수치를 자랑하지만 심한 위장관 부작용과 공급 불안정이 단점이었던 상황에서, 가성비와 안정성을 갖춘 국산 약이 현실적인 대안으로 떠올랐습니다.`,
  outlook:`극단적인 감량보다는 부작용 없이 장기적인 체중 유지가 필요한 국내 환자군을 중심으로 국산 신약의 점유율이 얼마나 빠르게 확대될지 의료계가 주목하고 있습니다.`,
  sources:[{title:`국산 비만약 '에페' 출격, 위고비·마운자로와 맞대결 - 뉴시스`,url:`https://www.newsis.com`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`오픈AI의 추론형 모델과 메타의 차세대 오픈소스 인공지능이 잇따라 공개되며 기술 주도권 경쟁이 격화되고 있습니다.`,
  metrics:[`메타 라마 3.3 파라미터 700억 개`,`오픈AI 신모델 수학 성능 압도적`],

let current = null;
let currentCat = null;
const CAT_ORDER = ['경제', '정치', '기타 이슈'];

function renderSidebar() {
  const list = document.getElementById('date-list');
  list.innerHTML = '';
  BRIEFS.forEach((b, i) => {
    const el = document.createElement('div');
    el.className = 'date-item' + (i === 0 ? ' active' : '');
    el.dataset.tag = b.tag;
    const parts = b.tag.split('-');
    const short = parts[1] + '/' + parts[2];
    el.innerHTML = b.tag;
    el.addEventListener('click', () => showBrief(b.tag));
    list.appendChild(el);
  });
}

function showBrief(tag) {
  current = tag;
  document.querySelectorAll('.date-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tag === tag);
  });
  const brief = BRIEFS.find(b => b.tag === tag);
  if (!brief) return;

  // 카테고리별 그룹핑
  const grouped = {};
  brief.stories.forEach(s => {
    if (!grouped[s.category]) grouped[s.category] = [];
    grouped[s.category].push(s);
  });
  const availableCats = CAT_ORDER.filter(c => grouped[c] && grouped[c].length);
  if (!availableCats.length) return;

  // 기본 카테고리 결정
  if (!availableCats.includes(currentCat)) currentCat = availableCats[0];

  renderContent(brief, grouped, availableCats);
}

function renderContent(brief, grouped, availableCats) {
  const content = document.getElementById('content');
  let html = `<div class="sticky-top">
    <div class="brief-header">
      <div class="bh-eyebrow">Morning Brief</div>
      <h2>${brief.label}</h2>
    </div>`;

  // 탭
  html += '<div class="cat-tabs">';
  availableCats.forEach(c => {
    const cls = c === currentCat ? 'cat-tab active' : 'cat-tab';
    html += `<button class="${cls}" data-cat="${c}">${c}</button>`;
  });
  html += '</div></div>';

  // 선택된 카테고리 기사들
  const stories = grouped[currentCat] || [];
  stories.forEach((s, idx) => {
    if (idx > 0) html += '<hr class="story-divider">';
    html += `<div class="story">
      <div class="story-top">
        <div class="story-headline">${s.headline}</div>
      </div>`;
    if (s.metrics.length) {
      html += '<div class="metrics">';
      s.metrics.forEach(m => { html += `<div class="metric-chip">${m}</div>`; });
      html += '</div>';
    }
    // 요약문에 핵심 개념 밑줄 (출력은 박스 다음)
    let summaryHtml = s.summary;
    if (s.keyTerms && s.keyTerms.length) {
      s.keyTerms.forEach(kt => {
        if (!kt.term) return;
        const safe = kt.term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp(safe, 'g');
        summaryHtml = summaryHtml.replace(re, `<span class="kt-underline">${kt.term}</span>`);
      });
    }

    // 핵심 개념 박스 (요약 위)
    if (s.keyTerms && s.keyTerms.length) {
      html += '<div class="key-terms"><div class="key-terms-title">핵심 개념</div>';
      s.keyTerms.forEach(kt => {
        html += `<div class="kt-item">
          <span class="kt-term">${kt.term}</span>
          <span class="kt-exp">${kt.explanation}</span>
        </div>`;
      });
      html += '</div>';
    }

    html += `<div class="summary">${summaryHtml}</div>`;

    const bgSections = [
      ['역사적 맥락', s.history],
      ['핵심 플레이어', s.players],
      ['현재 구도', s.current],
      ['향후 전망', s.outlook],
    ].filter(([, v]) => v);

    if (bgSections.length) {
      html += '<div class="bg-box"><div class="bg-box-title">배경 스토리</div>';
      bgSections.forEach(([label, text]) => {
        html += `<div class="bg-section">
          <div class="bg-section-label">${label}</div>
          <div class="bg-section-text">${text}</div>
        </div>`;
      });
      html += '</div>';
    }

    if (s.sources.length) {
      html += `<button class="sources-toggle" data-toggle="srcs-${idx}">출처 ${s.sources.length}개 보기 <span class="arrow">▾</span></button>`;
      html += `<div class="sources-body" id="srcs-${idx}">`;
      s.sources.forEach((src, si) => {
        html += `<div class="source-item">
          <span class="src-num">${si+1}</span>
          <a href="${src.url}" target="_blank">${src.title}</a>
        </div>`;
      });
      html += '</div>';
    }
    html += '</div>';
  });

  content.innerHTML = html;

  // 탭 클릭 핸들러
  content.querySelectorAll('.cat-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentCat = btn.dataset.cat;
      renderContent(brief, grouped, availableCats);
    });
  });

  // 출처 토글
  content.querySelectorAll('.sources-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const body = document.getElementById(btn.dataset.toggle);
      const isOpen = body.classList.toggle('open');
      btn.classList.toggle('open', isOpen);
    });
  });

  document.getElementById('main').scrollTop = 0;
}

if (BRIEFS.length > 0) {
  renderSidebar();
  showBrief(BRIEFS[0].tag);
} else {
  document.getElementById('content').innerHTML = '<div class="empty">브리핑 데이터가 없습니다.</div>';
}

// ── Quiz Gate ──
const PASS_TARGET = 3;
let correctCount = 0;
const usedIndexes = new Set();

function pickQuestion() {
  // 사용 안 한 문제 중 랜덤. 다 썼으면 풀 리셋
  if (usedIndexes.size >= QUIZ.length) usedIndexes.clear();
  let idx;
  do { idx = Math.floor(Math.random() * QUIZ.length); } while (usedIndexes.has(idx));
  usedIndexes.add(idx);
  return QUIZ[idx];
}

function updateCounter() {
  document.getElementById('quiz-counter').textContent = `(${correctCount}/${PASS_TARGET})`;
}

function renderQuiz() {
  const q = pickQuestion();
  document.getElementById('quiz-q').textContent = q.q;
  updateCounter();
  const feedback = document.getElementById('quiz-feedback');
  feedback.textContent = '';
  feedback.className = 'quiz-feedback';
  const closeBtn = document.getElementById('quiz-close');
  closeBtn.classList.add('hidden');

  const choicesEl = document.getElementById('quiz-choices');
  choicesEl.innerHTML = '';
  // 보기 순서 섞기 (정답 위치 고정 방지)
  const order = q.a.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  order.forEach(idx => {
    const text = q.a[idx];
    const btn = document.createElement('button');
    btn.className = 'quiz-choice';
    btn.textContent = text;
    btn.addEventListener('click', () => {
      const allBtns = choicesEl.querySelectorAll('.quiz-choice');
      allBtns.forEach(b => b.disabled = true);
      if (idx === q.correct) {
        btn.classList.add('correct');
        correctCount++;
        updateCounter();
        if (correctCount >= PASS_TARGET) {
          feedback.textContent = '통과! 들어와도 좋아.';
          feedback.className = 'quiz-feedback right';
          closeBtn.classList.remove('hidden');
        } else {
          feedback.textContent = '역시 맞출 줄 알았어. 다음 문제 고.';
          feedback.className = 'quiz-feedback right';
          btn.blur();
          setTimeout(() => {
            if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
            renderQuiz();
          }, 900);
        }
      } else {
        btn.classList.add('wrong');
        feedback.textContent = '정말 실망이다.... 다음.';
        feedback.className = 'quiz-feedback wrong';
        btn.blur();
        setTimeout(() => {
          if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
          renderQuiz();
        }, 900);
      }
    });
    choicesEl.appendChild(btn);
  });
}

document.getElementById('quiz-close').addEventListener('click', () => {
  document.getElementById('quiz-overlay').classList.add('hidden');
  document.body.classList.remove('quiz-active');
});

document.body.classList.add('quiz-active');
renderQuiz();

// ── Mobile sidebar toggle ──
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('sidebar-backdrop');
function toggleSidebar(open) {
  sidebar.classList.toggle('open', open);
  backdrop.classList.toggle('open', open);
}
document.getElementById('sidebar-toggle').addEventListener('click', () => toggleSidebar(!sidebar.classList.contains('open')));
backdrop.addEventListener('click', () => toggleSidebar(false));
// 날짜 클릭하면 모바일에서 자동으로 닫히게
sidebar.addEventListener('click', e => {
  if (e.target.classList.contains('date-item') && window.innerWidth <= 768) {
    toggleSidebar(false);
  }
});

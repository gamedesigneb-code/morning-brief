  tag:`2026-10-10`,
  label:`2026년 10월 10일 (토)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`물가 불안 속 연준 내 '추가 금리 인상 신중론' 확산`,
  metrics:[`현 기준금리 연 5.25~5.50%`,`최근 근원 물가 상승률 3.8%`],
  summary:`미국 연방준비제도 내부에서 추가 금리 인상을 두고 신중한 입장이 급부상하고 있다. 크리스토퍼 월러 이사를 비롯한 일부 위원들은 연속적인 인상은 불필요하다며 현재의 통화 정책을 유지하자는 매파적 신중론 입장을 밝혔다. 최근 국제 유가 상승으로 인한 물가 불안 우려에도 불구하고, 지나친 긴축이 실물 경제에 미칠 부작용을 경계하는 목소리가 커지고 있는 것이다. 특히 고금리 기조 장기화로 인해 상업용 부동산 시장과 지역 은행들의 부실 위험도 지속적으로 제기되는 상황이다. 이에 따라 다가오는 10월 FOMC 회의에서 기준금리가 동결될 것이라는 시장의 기대감이 커지고 있다. 연준은 향후 고용 및 인플레이션 지표를 면밀히 분석해 정책 방향을 결정할 예정이다.`,
  keyTerms:[{term:`매파적 신중론`,explanation:`물가 안정을 위해 고금리를 유지하려는 강경한 입장을 보이면서도, 경제 충격을 우려해 실제 추가 금리 인상에는 신중을 기하는 태도를 뜻한다.`}],
  history:`코로나19 팬데믹 이후 불어닥친 전례 없는 인플레이션을 잡기 위해 연준은 공격적인 금리 인상을 단행해왔다.`,
  players:`파월 연준 의장 등 지도부와 월가 투자은행, 그리고 미국 재무부가 주요 행위자로 시장에 영향을 미치고 있다.`,
  current:`물가 상승세가 둔화 조짐을 보이고 있으나, 국제 유가 급등 등 대외 변수로 인해 연준의 셈법이 복잡해진 결정적 전환점이다.`,
  outlook:`향후 발표될 고용 보고서와 9월 소비자물가지수 결과가 다음 회의의 향방을 가를 핵심 지표가 될 전망이다.`,
  sources:[{title:`연준 내 금리 인상 신중론 대두 - 블룸버그`,url:`https://www.bloomberg.com`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`호르무즈 해협 불안 고조…국제 유가 출렁이며 기업 실적 비상`,
  metrics:[`브렌트유 배럴당 90달러 돌파`,`항공·물류 업종 주가 평균 4% 하락`],
  summary:`중동 지역의 지정학적 불안이 다시 고조되면서 국제 유가가 크게 출렁이고 있다. 최근 호르무즈 해협 인근에서 유조선이 피격되는 사건이 발생하며 글로벌 원유 공급망 차질 우려가 확산되었다. 이로 인해 브렌트유와 서부텍사스산원유 가격이 단기 급등세를 보이며 배럴당 90달러 선을 위협받고 있다. 유가 상승은 즉각적으로 항공사 및 해운 물류 기업들의 유류비 부담을 가중시키고 있으며, 일부 주요 기업의 3분기 실적 전망치가 하향 조정되고 있다. 나아가 글로벌 물가 상승 압력으로 작용해 주요국 중앙은행들의 금리 인하 시점을 늦출 수 있다는 분석도 나온다. 전문가들은 사태 장기화 시 글로벌 경제성장률 둔화로 이어질 수 있다고 경고한다.`,
  keyTerms:[{term:`호르무즈 해협`,explanation:`중동 산유국들이 원유를 수출하는 핵심 해상 통로로, 전 세계 석유 물동량의 약 20%가 통과하는 전략적 요충지다.`}],
  history:`과거부터 이란과 아랍 국가들 사이의 정치적 갈등이 발생할 때마다 원유 수송 차질 위협의 단골 소재가 되어왔다.`,
  players:`원유 수출을 통제하려는 이란과 항행의 자유를 주장하는 미국 및 주요 서방 동맹국들이 첨예하게 대립하고 있다.`,
  current:`가뜩이나 산유국들의 감산으로 석유 공급이 타이트한 상황에서 발생한 물리적 충돌이 유가 상승의 뇌관을 건드렸다.`,
  outlook:`해당 해역에서의 추가적인 군사 충돌 여부와 이에 대한 미국의 군사적 대응 수위가 국제 유가의 단기 향방을 좌우할 것이다.`,
  sources:[{title:`중동 불안에 요동치는 국제 유가 - 로이터`,url:`https://www.reuters.com`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`원·달러 환율 1,340원대 공방…AI 소부장 중심 차별화 장세`,
  metrics:[`원·달러 환율 1,342.5원 마감`,`코스피 2,500선 박스권 등락`],
  summary:`국내 금융시장은 환율의 높은 변동성과 증시의 박스권 흐름 속에 눈치 보기 장세가 이어지고 있다. 원·달러 환율은 미국 연준의 금리 정책 불확실성과 중동발 유가 불안이 겹치면서 1,340원대 초반에서 팽팽한 공방을 벌이고 있다. 외국인 투자자들의 자금 이탈 우려 속에서도 코스피 지수는 2,500선 안팎에서 하방 경직성을 확보하고 있다. 특히 증시 전반의 상승 동력이 부재한 가운데, 인공지능 인프라 구축 및 반도체 소재 부품 장비 관련 기업들로 수급이 집중되는 차별화 현상이 뚜렷하다. 불확실성을 피하려는 자금이 단기 파킹형 ETF 등으로 몰리며 대기성 자금 규모도 급증하는 추세다. 금융당국은 환율 급변동 시 시장 안정화 조치에 나설 채비를 갖추고 있다.`,
  keyTerms:[{term:`파킹형 ETF`,explanation:`주차장에 차를 잠시 세워두듯, 자금을 단기간 안전하게 보관하면서도 일반 예금보다 유연하게 이자 수익을 얻을 수 있는 펀드 상품이다.`}],
  history:`미국의 고금리 장기화 기조가 굳어지면서 한미 금리 역전 현상이 심화되었고, 이는 지속적인 원화 약세 압력으로 작용해왔다.`,
  players:`외국인 투자자의 매매 동향, 한국은행의 외환시장 개입 의지, 그리고 개인 투자자들의 쏠림 현상이 시장을 주도한다.`,
  current:`거시경제 불확실성이 극에 달하며 뚜렷한 주도주 없이 이슈에 따라 자금이 빠르게 이동하는 전형적인 순환매 장세가 펼쳐지고 있다.`,
  outlook:`향후 발표될 미국 거시 지표와 국내 주요 반도체 기업들의 3분기 실적 발표 결과가 증시 방향성을 결정지을 핵심 이벤트가 될 것이다.`,
  sources:[{title:`환율 1340원대 안착, 차별화 장세 지속 - 한국경제`,url:`https://www.hankyung.com`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`법사위 국정감사 격돌…대법관 재제청 두고 여야 사법부 정면충돌`,
  metrics:[`법제사법위원회 소속 여야 의원 18명 참전`,`사법부 긍정 평가 20%대 추락`],
  summary:`국회 법제사법위원회의 대법원 국정감사에서 대법관 재제청 문제를 둘러싸고 여야 및 사법부 간의 정면충돌이 벌어졌다. 야당은 최근 단행된 대법관 임명 절차가 행정부의 입김에 흔들렸다고 비판하며 사법 독립성 훼손을 강하게 지적했다. 반면 여당은 정상적인 인사 절차를 정쟁의 도구로 삼고 있다며 반발했고, 조희대 대법원장을 비롯한 법원행정처 관계자들은 헌법과 법률에 따른 절차적 정당성을 거듭 강조했다. 이번 갈등은 단순한 인사 문제를 넘어, 향후 정치인 재판 지연 문제와 주요 인사에 대한 사법 처리 방향을 둔 기싸움으로 해석되고 있다. 사법부의 중립성이 정치권의 도마 위에 오르면서 국민적 우려도 커지는 양상이다. 여야의 강 대 강 대치 속에 주요 법안 처리마저 지연될 가능성이 제기된다.`,
  keyTerms:[{term:`대법관 재제청`,explanation:`대법원장이 대법관 후보를 대통령에게 추천했으나 임명 동의 과정 등에 문제가 생겨 후보를 다시 추천하는 절차를 의미한다.`}],
  history:`과거부터 대법관 임명 과정은 행정부와 사법부, 그리고 국회의 정치적 성향이 첨예하게 부딪히는 최고 권력 갈등의 뇌관이었다.`,
  players:`국회 법제사법위원회 소속 여야 강경파 의원들과 사법부 수장인 대법원장, 그리고 행정부가 갈등의 중심에 서 있다.`,
  current:`전현직 정치인들의 대형 재판이 다수 진행되는 상황에서 사법부의 인사에 정치권이 그 어느 때보다 예민하게 반응하고 있다.`,
  outlook:`국정감사 이후 이어질 사법개혁 관련 법안 논의와 차기 헌법재판관 임명 과정에서도 여야 간 거센 파열음이 예상된다.`,
  sources:[{title:`대법원 국감, 사법 독립성 훼손 공방 - 연합뉴스`,url:`https://www.yna.co.kr`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`비무장지대 지뢰 폭발 등 접경지 충돌…남북 군사적 긴장 최고조`,
  metrics:[`DMZ 내 북한군 활동 증가율 30% 이상`,`대북 확성기 가동에 따른 긴장 지수 급등`],
  summary:`한반도 군사분계선 인근 비무장지대에서 북한군의 지뢰 폭발 및 수목 제거 작업 도중 사상자가 발생하는 등 접경지 긴장이 최고조에 달하고 있다. 우리 군 당국은 북한군이 최근 경계벽 설치와 불모지 조성 작업을 무리하게 강행하다가 다수의 지뢰 폭발 사고를 겪은 것으로 파악했다. 이에 더해 북한 김여정 노동당 부부장은 한국의 대북 전단 및 확성기 방송을 빌미로 전례 없이 수위 높은 강경 담화를 연일 발표하고 있다. 정부는 대북 확성기 방송을 유연하게 운영하면서도 북한의 국지 도발에는 즉각적이고 압도적으로 대응하겠다는 방침을 재확인했다. 한미 군 당국은 감시 자산을 증강 운용하며 혹시 모를 기습 도발에 철저히 대비하고 있다. 일각에서는 이를 내부 결속을 노린 북한의 의도적 긴장 조성이라고 분석한다.`,
  keyTerms:[{term:`비무장지대`,explanation:`남북한의 우발적인 군사적 충돌을 막기 위해 군사분계선을 중심으로 남북 각각 2km씩 설정된 구역으로, 군대나 무기 배치가 원칙적으로 금지된다.`}],
  history:`과거 남북군사합의 이후 완화되었던 접경지 긴장은, 북한의 계속된 미사일 도발과 합의 무효화 선언으로 다시 악화일로를 걷고 있다.`,
  players:`김정은 정권 수뇌부와 한국 국방부, 그리고 한반도 억지력을 제공하는 주한미군 및 인도태평양사령부가 주요 당사자다.`,
  current:`오물 풍선 살포부터 대북 방송 재개까지 남북이 심리전과 무력 시위를 치열하게 주고받으며 우발적 충돌 위험이 임계점에 도달했다.`,
  outlook:`다가오는 대규모 한미 연합훈련 기간과 북한의 주요 정치 일정이 맞물리며, 추가적인 도발 발생 가능성을 예의주시해야 한다.`,
  sources:[{title:`비무장지대 북한군 지뢰 폭발 사상자 발생 - KBS`,url:`https://news.kbs.co.kr`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`단순 무역 마찰 넘어선 미·중 패권 경쟁…AI 및 핵심광물 블록화 격화`,
  metrics:[`대중국 첨단 반도체 수출 통제 100% 강화`,`중국 핵심 광물 수출 통제 품목 5개 이상 확대`],
  summary:`미국과 중국의 갈등이 단순한 관세 부과를 넘어 인공지능과 핵심 광물 공급망을 무기로 한 기술 안보 블록화 경쟁으로 치닫고 있다. 미국 상무부는 최근 중국의 첨단 반도체 접근을 원천 차단하기 위해 동맹국들에게도 유사한 수준의 수출 통제를 압박하며 디리스킹 전략을 가속화했다. 이에 맞서 중국은 갈륨, 게르마늄 등 주요 첨단 산업 필수 광물에 대한 수출 통제를 대폭 강화하며 자원 무기화로 응수하고 나섰다. 글로벌 기업들은 양국 간의 보복 조치 속에서 공급망 다변화와 생산 기지 이전을 강요받고 있으며, 그에 따른 제반 비용은 눈덩이처럼 불어나고 있다. 유럽연합 역시 이러한 양극화 추세 속에서 자체적인 경제 안보 규제를 강화하며 블록화에 합세하는 모양새다. 전문가들은 세계 경제가 파편화되면서 글로벌 성장의 잠재력이 훼손될 것으로 크게 우려하고 있다.`,
  keyTerms:[{term:`디리스킹`,explanation:`특정 국가와 완전히 관계를 끊는 탈동조화 대신, 핵심 기술이나 자원의 공급망 위험 요소를 줄이고 수입처를 다변화하는 현실적인 전략이다.`}],
  history:`무역 전쟁으로 촉발된 양국 갈등은 첨단 기술 보호와 군사적 안보가 결합된 전방위적 패권 다툼으로 진화하며 오늘에 이르렀다.`,

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,

  headline:`청소년들 속마음 사람 대신 AI에게…정서 의존 및 과몰입 우려`,
  metrics:[`10대 청소년 AI 챗봇 대화 빈도 전년비 150% 증가`,`AI 캐릭터 의존성 위험군 학생 비율 약 12%`],
  summary:`청소년층을 중심으로 생성형 인공지능이 만든 가상의 캐릭터와 일상적인 대화를 나누고 속마음을 털어놓는 현상이 급증하고 있다. 최신 대화형 AI 서비스들이 뛰어난 공감 능력과 개인화된 답변을 제공하면서, 교우 관계나 학업 스트레스에 지친 10대들이 사람보다 AI에게 더 깊이 정서적으로 의지하게 된 것이다. 문제는 이러한 AI 캐릭터들이 항상 긍정적이고 순응적인 태도만을 보이면서, 현실 세계의 갈등 해결 능력을 저하시키고 디지털 과몰입 현상을 유발할 수 있다는 점이다. 실제로 AI 챗봇 사용 시간이 지나치게 긴 청소년일수록 현실 사회적 고립감이 커지는 부작용 사례가 교육 현장에서 속출하고 있다. 심리 전문가들은 기술적 편의 이면에 숨겨진 발달 과정의 정서적 결핍을 경고하며 건전한 가이드라인 마련을 강력히 촉구하고 있다. 정부 역시 AI 서비스 제공 기준에 미성년자 보호 조항을 신설하는 방안을 면밀히 검토 중이다.`,
  keyTerms:[{term:`디지털 과몰입`,explanation:`스마트폰이나 인터넷, AI 서비스 등 디지털 환경에 통제력을 잃고 지나치게 빠져들어 일상생활과 현실 대인관계에 큰 어려움을 겪는 상태를 말한다.`}],
  history:`코로나19 시기를 거치며 비대면 소통에 깊이 익숙해진 디지털 네이티브 세대에게 거부감 없이 사람처럼 대화하는 AI가 자연스럽게 스며들었다.`,
  players:`매력적인 캐릭터 챗봇을 출시하는 IT 기업들과, 부작용으로부터 학생들을 보호하려는 교육 당국 및 학부모 단체가 마찰을 빚고 있다.`,
  current:`기술의 눈부신 발전이 인간의 감정과 애착까지 정교하게 모방할 수 있게 되면서, 윤리적 안전장치 없이 서비스가 무분별하게 확산된 과도기적 상황이다.`,
  outlook:`가까운 미래에 미성년자 대상의 AI 서비스 연령 제한이나 중독 예방을 위한 필수 사용 시간 제한 기능 등 강력한 규제 법안이 등장할 가능성이 높다.`,
  sources:[{title:`AI에 고민 털어놓는 10대, 정서 의존 부작용 - 동아일보`,url:`https://www.donga.com`}]

  history:`과거에는 고도의 프로그래밍 지식을 갖춘 소수의 전문 해커 집단만이 지능형 지속 위협과 같은 정교하고 파괴적인 공격을 수행할 수 있었다.`,
  players:`강력한 AI 도구를 무기화하는 다국적 사이버 범죄 조직과, 이들의 공격을 최전선에서 막아내야 하는 금융권 및 정보보안 기업들이 팽팽히 맞서고 있다.`,
  current:`오픈소스 AI 모델과 편리한 해킹 자동화 툴이 다크웹에서 무분별하게 거래되면서 심각한 사이버 범죄의 대중화 현상이 가속화되는 아찔한 상황이다.`,
  outlook:`진화하는 해킹 시도를 사전에 완벽히 차단하기 위해 보안 업계는 자율 방어형 에이전트 AI 도입을 서두르고 정부 차원의 합동 대응 훈련이 강화될 전망이다.`,
  sources:[{title:`AI가 낮춘 해킹 문턱, 커지는 보안 위협 - IT월드`,url:`https://www.itworld.co.kr`}]

let current = null;
let currentCat = null;
const CAT_ORDER = ['경제', '정치', '기타 이슈'];

function renderSidebar() {
  const list = document.getElementById('date-list');
  list.innerHTML = '';
  BRIEFS.forEach((b, i) => {
    const el = document.createElement('div');
    el.className = 'date-item' + (i === 0 ? ' active' : '');
    el.dataset.tag = b.tag;
    const parts = b.tag.split('-');
    const short = parts[1] + '/' + parts[2];
    el.innerHTML = b.tag;
    el.addEventListener('click', () => showBrief(b.tag));
    list.appendChild(el);
  });
}

function showBrief(tag) {
  current = tag;
  document.querySelectorAll('.date-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tag === tag);
  });
  const brief = BRIEFS.find(b => b.tag === tag);
  if (!brief) return;

  // 카테고리별 그룹핑
  const grouped = {};
  brief.stories.forEach(s => {
    if (!grouped[s.category]) grouped[s.category] = [];
    grouped[s.category].push(s);
  });
  const availableCats = CAT_ORDER.filter(c => grouped[c] && grouped[c].length);
  if (!availableCats.length) return;

  // 기본 카테고리 결정
  if (!availableCats.includes(currentCat)) currentCat = availableCats[0];

  renderContent(brief, grouped, availableCats);
}

function renderContent(brief, grouped, availableCats) {
  const content = document.getElementById('content');
  let html = `<div class="sticky-top">
    <div class="brief-header">
      <div class="bh-eyebrow">Morning Brief</div>
      <h2>${brief.label}</h2>
    </div>`;

  // 탭
  html += '<div class="cat-tabs">';
  availableCats.forEach(c => {
    const cls = c === currentCat ? 'cat-tab active' : 'cat-tab';
    html += `<button class="${cls}" data-cat="${c}">${c}</button>`;
  });
  html += '</div></div>';

  // 선택된 카테고리 기사들
  const stories = grouped[currentCat] || [];
  stories.forEach((s, idx) => {
    if (idx > 0) html += '<hr class="story-divider">';
    html += `<div class="story">
      <div class="story-top">
        <div class="story-headline">${s.headline}</div>
      </div>`;
    if (s.metrics.length) {
      html += '<div class="metrics">';
      s.metrics.forEach(m => { html += `<div class="metric-chip">${m}</div>`; });
      html += '</div>';
    }
    // 요약문에 핵심 개념 밑줄 (출력은 박스 다음)
    let summaryHtml = s.summary;
    if (s.keyTerms && s.keyTerms.length) {
      s.keyTerms.forEach(kt => {
        if (!kt.term) return;
        const safe = kt.term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp(safe, 'g');
        summaryHtml = summaryHtml.replace(re, `<span class="kt-underline">${kt.term}</span>`);
      });
    }

    // 핵심 개념 박스 (요약 위)
    if (s.keyTerms && s.keyTerms.length) {
      html += '<div class="key-terms"><div class="key-terms-title">핵심 개념</div>';
      s.keyTerms.forEach(kt => {
        html += `<div class="kt-item">
          <span class="kt-term">${kt.term}</span>
          <span class="kt-exp">${kt.explanation}</span>
        </div>`;
      });
      html += '</div>';
    }

    html += `<div class="summary">${summaryHtml}</div>`;

    const bgSections = [
      ['역사적 맥락', s.history],
      ['핵심 플레이어', s.players],
      ['현재 구도', s.current],
      ['향후 전망', s.outlook],
    ].filter(([, v]) => v);

    if (bgSections.length) {
      html += '<div class="bg-box"><div class="bg-box-title">배경 스토리</div>';
      bgSections.forEach(([label, text]) => {
        html += `<div class="bg-section">
          <div class="bg-section-label">${label}</div>
          <div class="bg-section-text">${text}</div>
        </div>`;
      });
      html += '</div>';
    }

    if (s.sources.length) {
      html += `<button class="sources-toggle" data-toggle="srcs-${idx}">출처 ${s.sources.length}개 보기 <span class="arrow">▾</span></button>`;
      html += `<div class="sources-body" id="srcs-${idx}">`;
      s.sources.forEach((src, si) => {
        html += `<div class="source-item">
          <span class="src-num">${si+1}</span>
          <a href="${src.url}" target="_blank">${src.title}</a>
        </div>`;
      });
      html += '</div>';
    }
    html += '</div>';
  });

  content.innerHTML = html;

  // 탭 클릭 핸들러
  content.querySelectorAll('.cat-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentCat = btn.dataset.cat;
      renderContent(brief, grouped, availableCats);
    });
  });

  // 출처 토글
  content.querySelectorAll('.sources-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const body = document.getElementById(btn.dataset.toggle);
      const isOpen = body.classList.toggle('open');
      btn.classList.toggle('open', isOpen);
    });
  });

  document.getElementById('main').scrollTop = 0;
}

if (BRIEFS.length > 0) {
  renderSidebar();
  showBrief(BRIEFS[0].tag);
} else {
  document.getElementById('content').innerHTML = '<div class="empty">브리핑 데이터가 없습니다.</div>';
}

// ── Quiz Gate ──
const PASS_TARGET = 3;
let correctCount = 0;
const usedIndexes = new Set();

function pickQuestion() {
  // 사용 안 한 문제 중 랜덤. 다 썼으면 풀 리셋
  if (usedIndexes.size >= QUIZ.length) usedIndexes.clear();
  let idx;
  do { idx = Math.floor(Math.random() * QUIZ.length); } while (usedIndexes.has(idx));
  usedIndexes.add(idx);
  return QUIZ[idx];
}

function updateCounter() {
  document.getElementById('quiz-counter').textContent = `(${correctCount}/${PASS_TARGET})`;
}

function renderQuiz() {
  const q = pickQuestion();
  document.getElementById('quiz-q').textContent = q.q;
  updateCounter();
  const feedback = document.getElementById('quiz-feedback');
  feedback.textContent = '';
  feedback.className = 'quiz-feedback';
  const closeBtn = document.getElementById('quiz-close');
  closeBtn.classList.add('hidden');

  const choicesEl = document.getElementById('quiz-choices');
  choicesEl.innerHTML = '';
  // 보기 순서 섞기 (정답 위치 고정 방지)
  const order = q.a.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  order.forEach(idx => {
    const text = q.a[idx];
    const btn = document.createElement('button');
    btn.className = 'quiz-choice';
    btn.textContent = text;
    btn.addEventListener('click', () => {
      const allBtns = choicesEl.querySelectorAll('.quiz-choice');
      allBtns.forEach(b => b.disabled = true);
      if (idx === q.correct) {
        btn.classList.add('correct');
        correctCount++;
        updateCounter();
        if (correctCount >= PASS_TARGET) {
          feedback.textContent = '통과! 들어와도 좋아.';
          feedback.className = 'quiz-feedback right';
          closeBtn.classList.remove('hidden');
        } else {
          feedback.textContent = '역시 맞출 줄 알았어. 다음 문제 고.';
          feedback.className = 'quiz-feedback right';
          btn.blur();
          setTimeout(() => {
            if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
            renderQuiz();
          }, 900);
        }
      } else {
        btn.classList.add('wrong');
        feedback.textContent = '정말 실망이다.... 다음.';
        feedback.className = 'quiz-feedback wrong';
        btn.blur();
        setTimeout(() => {
          if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
          renderQuiz();
        }, 900);
      }
    });
    choicesEl.appendChild(btn);
  });
}

document.getElementById('quiz-close').addEventListener('click', () => {
  document.getElementById('quiz-overlay').classList.add('hidden');
  document.body.classList.remove('quiz-active');
});

document.body.classList.add('quiz-active');
renderQuiz();

// ── Mobile sidebar toggle ──
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('sidebar-backdrop');
function toggleSidebar(open) {
  sidebar.classList.toggle('open', open);
  backdrop.classList.toggle('open', open);
}
document.getElementById('sidebar-toggle').addEventListener('click', () => toggleSidebar(!sidebar.classList.contains('open')));
backdrop.addEventListener('click', () => toggleSidebar(false));
// 날짜 클릭하면 모바일에서 자동으로 닫히게
sidebar.addEventListener('click', e => {
  if (e.target.classList.contains('date-item') && window.innerWidth <= 768) {
    toggleSidebar(false);
  }
});

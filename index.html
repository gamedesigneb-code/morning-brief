<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모닝 브리핑</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --sidebar-w: 240px;
    --bg: #FAFAF7;
    --paper: #FFFFFF;
    --accent: #6B7A8F;
    --accent-soft: #E8ECEF;
    --line: #EAE8E3;
    --line-strong: #D8D5CE;
    --text: #2D2A26;
    --text-mid: #6B655D;
    --text-sub: #A09889;
    --radius: 10px;
  }
  html, body {
    height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 15px; line-height: 1.65; font-weight: 400;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }

  /* ── Layout ── */
  #app { display: flex; height: 100vh; overflow: hidden; }

  /* ── Sidebar ── */
  #sidebar {
    width: var(--sidebar-w); flex-shrink: 0;
    background: var(--bg); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #sidebar-header {
    padding: 36px 20px 24px;
    border-bottom: 1px solid var(--line);
    text-align: center;
  }
  #sidebar-header h1 {
    font-size: 19px; font-weight: 700; color: var(--text);
    letter-spacing: -0.4px; line-height: 1.3;
  }
  #sidebar-header p {
    font-size: 12px; color: var(--text-sub); margin-top: 6px;
    letter-spacing: 0.3px;
  }
  #date-list { overflow-y: auto; flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
  .date-item {
    padding: 11px 14px; cursor: pointer; border-radius: 8px;
    transition: background 0.15s, color 0.15s;
    background: transparent;
    text-align: center; font-size: 13px; font-weight: 500; color: var(--text-mid);
    letter-spacing: 0.1px;
  }
  .date-item:hover { background: var(--accent-soft); color: var(--text); }
  .date-item.active {
    background: var(--accent-soft); color: var(--text); font-weight: 600;
  }

  /* ── Main ── */
  #main { flex: 1; overflow-y: auto; background: var(--paper); }
  #content { max-width: 760px; margin: 0 auto; padding: 56px 40px 80px; }

  .brief-header { margin-bottom: 36px; }
  .brief-header .bh-eyebrow {
    font-size: 11px; color: var(--text-sub); margin-bottom: 8px;
    letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500;
  }
  .brief-header h2 {
    font-size: 30px; font-weight: 700; letter-spacing: -0.7px;
    color: var(--text); line-height: 1.25;
  }

  /* ── Sticky Top (header + tabs) ── */
  .sticky-top {
    position: sticky; top: 0;
    background: var(--paper); z-index: 20;
    padding-top: 56px; margin-top: -56px;
  }
  .sticky-top .brief-header { margin-bottom: 24px; }

  /* ── Category Tabs ── */
  .cat-tabs {
    display: flex; gap: 0; margin-bottom: 36px;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
  }
  .cat-tab {
    padding: 12px 20px 14px; cursor: pointer; font-size: 14px; font-weight: 500;
    color: var(--text-sub); border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    background: none; border-top: none; border-left: none; border-right: none;
    font-family: inherit; letter-spacing: -0.1px;
    margin-bottom: -1px;
  }
  .cat-tab:hover { color: var(--text-mid); }
  .cat-tab.active { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }

  /* ── Sources (collapsible) ── */
  .sources-toggle {
    background: transparent; border: 1px solid var(--line-strong);
    padding: 8px 14px; border-radius: 6px; font-size: 12.5px; font-weight: 500;
    color: var(--text-mid); cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    font-family: inherit; margin-top: 12px;
    transition: background 0.15s, border-color 0.15s;
  }
  .sources-toggle:hover { background: var(--accent-soft); border-color: var(--accent); }
  .sources-toggle .arrow { transition: transform 0.2s; font-size: 9px; color: var(--text-sub); }
  .sources-toggle.open .arrow { transform: rotate(180deg); }
  .sources-body { display: none; margin-top: 12px; padding-left: 4px; }
  .sources-body.open { display: block; }

  /* ── Story Card ── */
  .story { margin-bottom: 40px; }
  .story-top { margin-bottom: 18px; }
  .story-headline {
    font-size: 19px; font-weight: 700; line-height: 1.45;
    letter-spacing: -0.4px; color: var(--text);
  }

  .metrics { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .metric-chip {
    background: var(--accent-soft); border: none;
    border-radius: 6px; padding: 7px 12px;
    font-size: 12.5px; font-weight: 500; color: var(--text-mid);
    line-height: 1.4;
  }

  .summary {
    font-size: 15px; line-height: 1.8; color: var(--text); margin-bottom: 20px;
    letter-spacing: -0.1px;
  }
  .summary .kt-underline {
    color: #1996BD;
    text-decoration: underline;
    text-decoration-color: #1996BD;
    text-decoration-thickness: 1.5px;
    text-underline-offset: 3px;
    cursor: help;
  }

  /* ── Key Terms Box ── */
  .key-terms {
    background: #F4F1EA; border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius); padding: 18px 22px; margin-bottom: 14px;
  }
  .key-terms-title {
    font-size: 11px; font-weight: 600; color: var(--text-sub);
    text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 14px;
  }
  .kt-item { margin-bottom: 12px; }
  .kt-item:last-child { margin-bottom: 0; }
  .kt-term {
    font-size: 13.5px; font-weight: 700; color: #1996BD;
    margin-bottom: 4px; display: block;
    letter-spacing: -0.1px;
  }
  .kt-exp {
    font-size: 13.5px; line-height: 1.7; color: var(--text-mid);
  }

  /* ── Background ── */
  .bg-box {
    background: var(--bg); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 22px 24px; margin-bottom: 14px;
  }
  .bg-box-title {
    font-size: 11px; font-weight: 600; color: var(--text-sub);
    text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 16px;
  }
  .bg-section { margin-bottom: 16px; }
  .bg-section:last-child { margin-bottom: 0; }
  .bg-section-label {
    font-size: 12.5px; font-weight: 600; color: var(--text); margin-bottom: 6px;
    letter-spacing: -0.1px;
  }
  .bg-section-text { font-size: 14px; line-height: 1.75; color: var(--text-mid); }

  /* ── Sources ── */
  .source-item {
    display: flex; align-items: flex-start; gap: 10px;
    margin-bottom: 8px; font-size: 13px;
  }
  .src-num {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent-soft); color: var(--text-mid);
    font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .source-item a { color: var(--text-mid); text-decoration: none; line-height: 1.55; }
  .source-item a:hover { color: var(--text); text-decoration: underline; }

  .story-divider { border: none; border-top: 1px solid var(--line); margin: 36px 0; }

  .empty { color: var(--text-sub); font-size: 14px; padding: 60px 0; text-align: center; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }

  /* ── Mobile Toggle ── */
  #sidebar-toggle {
    display: none;
    position: fixed; top: 14px; left: 14px; z-index: 50;
    background: var(--paper); border: 1px solid var(--line-strong);
    width: 40px; height: 40px; border-radius: 10px;
    cursor: pointer; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(45, 42, 38, 0.08);
  }
  #sidebar-toggle span {
    display: block; width: 18px; height: 2px; background: var(--text);
    position: relative;
  }
  #sidebar-toggle span::before,
  #sidebar-toggle span::after {
    content: ''; position: absolute; left: 0; width: 18px; height: 2px; background: var(--text);
  }
  #sidebar-toggle span::before { top: -6px; }
  #sidebar-toggle span::after { top: 6px; }

  #sidebar-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(45, 42, 38, 0.4); z-index: 40;
  }
  #sidebar-backdrop.open { display: block; }

  /* ── Mobile Responsive ── */
  @media (max-width: 768px) {
    #sidebar-toggle { display: flex; }
    #sidebar {
      position: fixed; left: 0; top: 0; bottom: 0;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      z-index: 45; width: 260px;
      box-shadow: 0 0 24px rgba(45, 42, 38, 0.12);
    }
    #sidebar.open { transform: translateX(0); }

    #content { padding: 64px 20px 60px; max-width: 100%; }
    .brief-header h2 { font-size: 22px; }
    .story-headline { font-size: 16px; }
    .summary { font-size: 14.5px; line-height: 1.75; }
    .bg-section-text { font-size: 13.5px; }
    .metric-chip { font-size: 12px; padding: 6px 10px; }
    .bg-box { padding: 18px 18px; }
    .cat-tab { padding: 11px 14px; font-size: 13.5px; }

    .quiz-card { padding: 28px 24px 24px; }
    .quiz-q { font-size: 17px; }
    .quiz-choice { font-size: 14px; padding: 13px 16px; }
  }

  /* ── Quiz Overlay ── */
  body.quiz-active #app {
    filter: blur(6px) saturate(0.85);
    pointer-events: none;
    transition: filter 0.3s ease;
  }
  #quiz-overlay {
    position: fixed; inset: 0;
    background-color: rgba(250, 250, 247, 0.55);
    background-image:
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0) 0,
        rgba(255,255,255,0) 5px,
        rgba(45,42,38,0.04) 5px,
        rgba(45,42,38,0.04) 6px
      ),
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0) 0,
        rgba(255,255,255,0) 22px,
        rgba(45,42,38,0.025) 22px,
        rgba(45,42,38,0.025) 23px
      );
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 24px;
  }
  #quiz-overlay.hidden { display: none; }

  .quiz-card {
    background: var(--paper); border-radius: 16px;
    padding: 36px 36px 32px; width: 100%; max-width: 440px;
    box-shadow: 0 16px 48px rgba(45, 42, 38, 0.18);
  }
  .quiz-eyebrow {
    font-size: 11px; color: var(--text-sub); letter-spacing: 1.5px;
    text-transform: uppercase; font-weight: 500; margin-bottom: 12px;
  }
  .quiz-q {
    font-size: 19px; font-weight: 700; color: var(--text);
    line-height: 1.5; letter-spacing: -0.3px; margin-bottom: 24px;
  }
  .quiz-choices { display: flex; flex-direction: column; gap: 8px; }
  .quiz-choice {
    background: var(--paper); border: 1px solid var(--line-strong);
    padding: 14px 18px; border-radius: 10px; font-size: 14.5px; font-weight: 500;
    color: var(--text); cursor: pointer; text-align: left;
    font-family: inherit; transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .quiz-choice:focus { outline: none; }
  .quiz-choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) {
    .quiz-choice:hover { background: var(--accent-soft); border-color: var(--accent); }
  }
  .quiz-choice:active { transform: scale(0.99); }
  .quiz-choice.wrong {
    background: #F5E6E0; border-color: #C9947F; color: #8A4A30;
    animation: shake 0.4s ease;
  }
  .quiz-choice.correct {
    background: #E3EDE2; border-color: #7A9077; color: #2E4A2C;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .quiz-feedback {
    margin-top: 20px; text-align: center; font-size: 14px; font-weight: 500;
    color: var(--text-mid); min-height: 22px;
  }
  .quiz-feedback.right { color: #2E4A2C; }
  .quiz-feedback.wrong { color: #8A4A30; }

  .quiz-close-btn {
    margin-top: 18px; width: 100%;
    background: var(--text); color: var(--paper); border: none;
    padding: 13px 20px; border-radius: 10px; font-size: 14px; font-weight: 600;
    font-family: inherit; cursor: pointer;
    transition: background 0.15s;
  }
  .quiz-close-btn:hover { background: #1a1815; }
  .quiz-close-btn.hidden { display: none; }
</style>
</head>
<body>
<div id="quiz-overlay">
  <div class="quiz-card">
    <div class="quiz-eyebrow"><span>잠깐, 나에 대해서 잘 알지?</span> <span id="quiz-counter">(0/3)</span></div>
    <div class="quiz-q" id="quiz-q"></div>
    <div class="quiz-choices" id="quiz-choices"></div>
    <div class="quiz-feedback" id="quiz-feedback"></div>
    <button class="quiz-close-btn hidden" id="quiz-close">닫기</button>
  </div>
</div>

<button id="sidebar-toggle" aria-label="메뉴"><span></span></button>
<div id="sidebar-backdrop"></div>

<div id="app">
  <nav id="sidebar">
    <div id="sidebar-header">
      <h1>모닝 브리핑</h1>
      <p>일별 세계 뉴스 요약</p>
    </div>

    <div id="date-list"></div>
  </nav>
  <main id="main">
    <div id="content"></div>
  </main>
</div>

<script>
const BRIEFS = [{
  tag:`2026-10-30`,
  label:`2026년 10월 30일 (금)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`골드만삭스가 SK스퀘어의 자회사인 티맵모빌리티 경영권을 약 8,000억 원에 인수하는 방안을 추진 중입니다.`,
  metrics:[`인수 규모 약 8,000억 원`,`목표 지분율 60~70%`],
  summary:`글로벌 투자은행 골드만삭스가 국내 내비게이션 1위 앱 티맵모빌리티의 경영권 인수를 타진하고 있습니다. 이번 거래 규모는 약 7,000억 원에서 8,000억 원 수준으로 거론되며, 목표 지분율은 60%에서 70% 사이입니다. SK스퀘어는 보유 중인 경영권 지분과 재무적 투자자의 지분을 묶어 매각하는 방안을 협상 중인 것으로 알려졌습니다. 이는 SK그룹 차원에서 진행 중인 고강도 포트폴리오 리밸런싱 작업의 일환으로 풀이됩니다. 반도체와 인공지능 등 핵심 사업에 집중하기 위해 비핵심 자산을 매각하여 투자 재원을 확보하려는 목적입니다. 골드만삭스는 티맵이 축적한 방대한 모빌리티 데이터와 향후 자율주행 시장에서의 가치를 높게 평가한 것으로 분석됩니다. 양측은 연내 본계약 체결을 목표로 세부 조건을 조율 중인 상황입니다.`,
  keyTerms:[{term:`포트폴리오 리밸런싱`,explanation:`기업이 변화하는 시장 환경에 맞춰 기존 사업을 매각하거나 새로운 사업을 인수하여, 그룹 전체의 자산 비중과 투자 방향성을 재조정하는 작업을 말합니다.`}],
  history:`SK스퀘어는 출범 이후 모빌리티, 앱마켓 등 다양한 비반도체 플랫폼 자산을 보유해 왔으나, 최근 수익성 악화와 그룹 차원의 사업 재편 압박을 받아왔습니다.`,
  players:`자산 효율화를 최우선으로 추진하는 SK스퀘어와 아시아 모빌리티 데이터 시장의 잠재력에 눈독을 들이는 골드만삭스 사모펀드가 핵심 당사자입니다.`,
  current:`원스토어와 인크로스 매각에 이어, 덩치가 가장 큰 자회사인 티맵모빌리티까지 매각 대상에 오르면서 SK그룹의 구조조정이 정점에 달한 모습입니다.`,
  outlook:`연내 본계약이 성사될 경우 국내 모빌리티 플랫폼 시장의 지각 변동이 일어날 전망이며, 매각 대금을 활용한 SK스퀘어의 후속 투자 행보가 주목받고 있습니다.`,
  sources:[{title:`골드만삭스, 티맵모빌리티 경영권 인수 추진 - 블로터`,url:`https://www.bloter.net`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`인텔이 3분기 실적 선방에도 불구하고 부진한 4분기 실적 가이던스를 발표하며 주가가 약 20% 폭락했습니다.`,
  metrics:[`4분기 예상 매출 150억 달러`,`시간외 주가 하락 약 20%`],
  summary:`미국 반도체 기업 인텔의 주가가 뉴욕 증시 시간외 거래에서 최대 20% 이상 폭락하는 충격을 맞았습니다. 3분기 매출은 165억 달러를 기록해 시장 전망치를 웃도는 양호한 성적을 냈습니다. 그러나 4분기 실적 가이던스 예상치가 시장 기대치에 크게 못 미치면서 투자자들의 막대한 실망 매물이 쏟아졌습니다. 인텔은 4분기 매출을 150억 달러에서 160억 달러 수준으로 제시했는데, 이는 월가 예상치인 171억 달러를 밑도는 수치입니다. 특히 주력 사업인 전통적인 PC 칩 수요의 부진이 내년 상반기까지 이어질 것이라는 회사 측의 비관적 전망이 타격을 주었습니다. 인공지능 칩 시장에서는 긍정적인 성장을 보였음에도, 핵심 사업의 수익성 악화 우려를 불식시키기에는 역부족이었습니다. 여기에 이스라엘 공장 사고로 인한 일회성 손실까지 겹치면서 시장의 불안감을 더욱 키웠습니다.`,
  keyTerms:[{term:`실적 가이던스`,explanation:`기업의 경영진이 투자자들을 위해 자사의 향후 매출이나 영업이익 등 예상되는 재무 성과를 미리 제시하는 자체 전망치를 의미합니다.`}],
  history:`인텔은 과거 PC 중앙처리장치 시장의 압도적 강자였으나, 모바일 시대 전환 실패와 파운드리 미세 공정 지연으로 경쟁사들에게 점유율을 꾸준히 빼앗겨 왔습니다.`,
  players:`위기 극복을 지휘하는 팻 겔싱어 최고경영자와 미래 수익성에 대한 실망감으로 주식을 투매하는 월가 투자자들이 현재 상황을 주도하고 있습니다.`,
  current:`데이터센터용 인공지능 칩 수요는 폭발하고 있으나, 인텔의 가장 큰 수입원인 일반 PC 시장의 침체가 회복되지 않아 전체적인 수익성 악화가 가시화되었습니다.`,
  outlook:`대규모 파운드리 투자와 인공지능 칩 신제품을 통해 잃어버린 시장 신뢰를 회복하고, 내년 하반기 이후 실적 반등을 이뤄낼 수 있을지가 핵심 관건입니다.`,
  sources:[{title:`인텔 4분기 가이던스 쇼크, 주가 20% 폭락 - 글로벌이코노믹`,url:`https://www.g-enews.com`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 음식 배달 1위 도어대시가 식료품 배달 플랫폼 인스타카트를 170억 달러에 전격 인수합니다.`,
  metrics:[`인수 규모 170억 달러`,`주당 매입가 65달러`],
  summary:`미국의 최대 음식 배달 플랫폼 도어대시가 식료품 배송 1위 기업인 인스타카트를 약 170억 달러에 인수한다고 공식 발표했습니다. 이번 거래는 주당 65달러에 현금과 주식을 교환하는 방식으로 이루어지며, 기존 주가 대비 상당한 경영권 프리미엄이 반영되었습니다. 도어대시는 기존의 식당 음식 배달을 넘어 인스타카트의 거대한 마트 및 생필품 네트워크를 단숨에 흡수하게 됩니다. 이를 통해 두 플랫폼을 넘나드는 크로스셀링 전략을 구사하여 아마존이나 월마트 같은 거대 유통 공룡들과 직접 경쟁할 수 있는 덩치를 갖추게 되었습니다. 인수 이후에도 인스타카트 브랜드와 개별 앱은 당분간 독립적으로 유지될 예정입니다. 양사는 주주 승인과 미국 규제 당국의 엄격한 반독점 심사를 거쳐 향후 2년 내에 합병 절차를 마무리할 계획입니다.`,
  keyTerms:[{term:`크로스셀링`,explanation:`고객이 이미 구매한 상품이나 서비스와 연관된 다른 상품을 추가로 구매하도록 유도하여 객단가와 매출을 한꺼번에 높이는 '교차 판매' 마케팅 기법입니다.`}],
  history:`도어대시와 인스타카트는 팬데믹 기간 동안 미국 내 비대면 배달 수요가 폭증하며 각자의 영역에서 독보적인 1위 사업자로 급성장했습니다.`,
  players:`종합 물류 플랫폼으로 진화하려는 도어대시와 상장 이후 성장이 정체되었던 인스타카트, 그리고 이들을 견제할 아마존과 우버이츠가 치열한 기싸움을 벌이고 있습니다.`,
  current:`배달 시장의 성장이 둔화되고 빠른 배송 경쟁이 격화되면서, 단일 품목만으로는 생존하기 어렵다는 위기감이 이번 초대형 합병을 촉발했습니다.`,
  outlook:`가장 큰 난관은 최근 거대 플랫폼 합병에 깐깐해진 연방거래위원회의 반독점 심사 통과 여부이며, 두 회사의 통합 구독 멤버십이 가져올 시장 파급력도 주목받고 있습니다.`,
  sources:[{title:`도어대시, 인스타카트 170억 달러에 인수 합의 - 포브스`,url:`https://www.forbes.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`한국과 독일이 정상회담을 열고 양국 관계를 '강화된 전략적 동반자 관계'로 공식 격상했습니다.`,
  metrics:[`협력 분야 6대 첨단기술`,`교류 역사 140여 년`],
  summary:`한국과 독일 양국 정상이 만나 교류 수준을 한 단계 높이는 강화된 전략적 동반자 관계를 공식 수립하기로 합의했습니다. 양국은 기존의 단순 교역 중심 파트너십을 넘어 반도체, 인공지능, 우주, 양자 등 미래 핵심 첨단기술 분야에서 공동 연구와 협력을 대폭 확대하기로 했습니다. 경제 및 기술 공조뿐만 아니라 글로벌 안보 위기에 대응하기 위한 국방 협력도 주요 의제로 다뤄졌습니다. 특히 양국 국방 당국 간의 원활한 정보 공유를 위해 군사비밀정보보호협정의 조속한 체결을 추진하기로 뜻을 모았습니다. 또한 글로벌 공급망 불확실성에 대비해 핵심 광물과 에너지 안보 분야에서도 공동 대응 체계를 구축하기로 했습니다. 유럽연합의 산업 규제 법안과 관련해 우리 기업들이 차별 없이 동등한 대우를 받을 수 있도록 독일 정부의 협조도 강하게 요청했습니다.`,
  keyTerms:[{term:`강화된 전략적 동반자 관계`,explanation:`단순한 경제적 교류를 넘어 외교, 안보, 첨단 산업 등 국가의 핵심 이익 전반에 걸쳐 장기적이고 깊이 있는 협력을 약속하는 외교적 관계 격상을 의미합니다.`}],
  history:`한국과 독일은 과거 분단국의 아픔을 공유하며, 강력한 제조업 중심의 경제 성장이라는 공통점을 바탕으로 140여 년간 꾸준히 신뢰를 쌓아왔습니다.`,
  players:`기술 안보 확보와 방위산업 수출 시장 확대를 노리는 한국 정부와, 아시아 내 주요 민주주의 국가와의 연대를 강화하려는 독일 정부가 손을 잡았습니다.`,
  current:`강대국 간의 패권 경쟁과 지속되는 지정학적 불안 속에서, 기술 주권과 국가 안보를 동시에 챙기기 위한 양국의 국가적 이해관계가 정확히 일치했습니다.`,
  outlook:`향후 추진될 군사비밀정보보호협정 체결 과정과 양국 방위산업 기업 간의 구체적인 합작 투자 성과가 이번 관계 격상의 실질적인 결과물이 될 것입니다.`,
  sources:[{title:`한국·독일, '강화된 전략적 동반자 관계'로 격상 - 연합뉴스`,url:`https://www.yna.co.kr`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 중부사령관이 트럼프 대통령에게 대이란 군사 공격 옵션을 직접 보고하며 중동 긴장이 최고조에 달하고 있습니다.`,
  metrics:[`배치 증가 패트리엇 포대`,`목표 이란 내 핵심 시설`],
  summary:`미군의 중동 작전을 총괄하는 브래드 쿠퍼 중부사령관이 백악관을 방문해 트럼프 대통령에게 대이란 타격 옵션을 직접 보고했습니다. 국방장관 등 최고위 안보 라인이 배석한 가운데 이루어진 이번 대면 직보는 미국의 대규모 무력행사가 임박했다는 강력한 신호로 해석됩니다. 미 국방부는 최근 이란의 보복 공격에 대비해 취약한 전방 기지의 미군을 분산시키고, 추가 방공망과 군수물자를 중동 전역에 증강 배치하며 실전 준비를 서두르고 있습니다. 트럼프 대통령 역시 유세 중 과거의 강력했던 폭격 작전을 상기시키며 이란에 대한 공개적인 무력 대응을 경고했습니다. 한편으로는 강도 높은 군사적 압박을 가하면서도, 막후에서는 부통령을 통해 이란 측에 협상 재개를 타진하는 투트랙 전략을 구사하고 있습니다. 그러나 이란은 선제 공격을 받을 경우 역내 미군 기지를 즉각 타격하겠다고 맞서며 일촉즉발의 위기감이 고조되고 있습니다.`,
  keyTerms:[{term:`투트랙 전략`,explanation:`외교나 협상에서 겉으로는 강력한 군사적 압박이나 제재를 가하면서, 동시에 물밑으로는 대화나 타협의 채널을 열어두는 양면 전술을 뜻합니다.`}],
  history:`미국은 과거 이란 핵합의 파기 이후 이란에 대해 일관되게 '최대 압박' 정책을 펼쳐왔으며, 양국 간의 군사적 마찰은 여러 차례 임계점을 넘나들었습니다.`,
  players:`강력한 보복 대응을 저울질하는 미국 최상위 안보 수뇌부와, 절대 물러서지 않겠다고 다짐하는 이란 혁명수비대 강경파들이 팽팽하게 대립하고 있습니다.`,
  current:`이스라엘과 중동 내 무장 세력 간의 충돌이 격화되는 와중에, 미국이 중동 내 자국의 억지력을 재확립하기 위해 직접적인 무력시위 카드까지 꺼내 든 셈입니다.`,
  outlook:`미국의 거센 군사적 압박이 이란을 협상 테이블로 끌어낼지, 아니면 이란의 호르무즈 해협 위협이나 미군 기지 선제 타격이라는 파국으로 이어질지 전 세계가 주시하고 있습니다.`,
  sources:[{title:`미 중부사령관, 대이란 공격 옵션 백악관 직보 - 뉴스핌`,url:`https://www.newspim.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`일본 집권 자민당과 공명당 연합이 중의원 총선거에서 15년 만에 과반 의석 확보에 실패하며 참패했습니다.`,
  metrics:[`자민당 획득 의석 191석`,`여당 연합 총 215석`],
  summary:`최근 치러진 일본 중의원 총선거에서 집권 여당인 자민당과 공명당 연합이 전체 465석 중 과반인 233석에 턱없이 모자란 215석을 얻는 데 그쳤습니다. 이로써 자민당 연립 여당은 2009년 야당에 정권을 내준 이후 15년 만에 처음으로 중의원 과반이 무너지는 굴욕을 겪게 되었습니다. 이번 참패의 가장 큰 원인은 자민당 핵심 파벌들이 연루된 끈질긴 정치자금 비자금 스캔들에 대한 유권자들의 매서운 심판입니다. 신임 총리가 취임 직후 당내 쇄신을 내세워 무리하게 의회 조기 해산 결정을 내린 것이 오히려 국민적 반감을 사며 역풍으로 작용했습니다. 여기에 고물가와 실질임금 하락으로 경제적 불만이 누적된 무당파 층이 대거 투표장에서 야당에 표를 던진 결과입니다. 제1야당인 입헌민주당은 의석수를 대폭 늘리며 크게 약진했고, 소수 여당으로 전락한 자민당의 향후 정국 운영은 큰 난관에 부딪혔습니다.`,
  keyTerms:[{term:`조기 해산`,explanation:`의원들의 원래 정해진 임기가 끝나기 전에 총리가 의회를 해산하고 선거를 다시 치러, 유권자들에게 새로운 정치적 지지와 정당성을 묻는 제도입니다.`}],
  history:`일본 자민당은 과거 2012년 정권 탈환 이후 장기간 의회 과반을 굳건히 독점해 왔으나, 최근 잇따른 파벌 부패 스캔들로 국민적 신뢰가 바닥까지 추락했습니다.`,
  players:`당내 튼튼한 기반 없이 총선 패배의 책임을 고스란히 안게 된 현직 총리와, 이번 선거 돌풍을 일으키며 유력한 대안 세력으로 떠오른 제1야당이 정국의 중심에 섰습니다.`,
  current:`여당이 단독으로 주요 법안과 예산안을 처리할 수 없게 되면서, 정권 유지를 위해 성향이 비슷한 야당의 눈치를 봐야 하는 극도의 여소야대 정국이 펼쳐졌습니다.`,
  outlook:`자민당 내부의 강력한 책임론 분출과 총리 사퇴 압박이 커질 것으로 보이며, 특정 야당과의 불안정한 '건별 정책 공조'라는 국정 운영 방식이 당분간 지속될 전망입니다.`,
  sources:[{title:`일본 자민당 중의원 선거 참패, 15년 만에 과반 붕괴 - YTN`,url:`https://www.ytn.co.kr`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`국산 1호 비만 치료제 '에페'가 처방을 개시하며 위고비, 마운자로와 함께 국내 시장 3파전이 시작되었습니다.`,
  metrics:[`4주분 초기 공급가 약 13만 원`,`평균 체중 감량 효과 약 9.75%`],
  summary:`국내 제약사가 독자 개발한 첫 국산 비만 신약 '에페'가 마침내 의료 현장에 정식 공급되며 본격적인 환자 처방이 시작되었습니다. 이로써 글로벌 비만 치료제 시장을 장악하고 있는 수입 약물인 위고비, 마운자로와 함께 국내 시장에서 치열한 3파전이 벌어지게 되었습니다. 국산 신약인 에페의 가장 큰 무기는 외산 약물 대비 절반 이하로 책정된 저렴한 가격입니다. 초기 4주분 공급가가 약 13만 원 수준으로, 보험이 적용되지 않는 비급여 치료의 경제적 부담을 크게 낮췄습니다. 또한 100% 한국인 환자를 대상으로 한 대규모 임상 3상에서 약 10%에 달하는 체중 감량 효과와 함께 아시아인 신체에 적합한 우수한 내약성을 입증했습니다. 기존 약물들과 유사한 단일 작용 기전을 바탕으로 수입 약품들이 겪고 있는 고질적인 물량 부족 사태 없이 국내 공장에서 안정적으로 제품을 공급할 수 있다는 것도 큰 강점입니다.`,
  keyTerms:[{term:`내약성`,explanation:`환자가 특정 약물을 복용했을 때 나타나는 구토, 어지러움 같은 부작용이나 불편함을 신체가 얼마나 잘 견뎌내고 적응할 수 있는지를 나타내는 척도입니다.`}],
  history:`현대 비만 치료제 시장은 주 1회 투여로도 뛰어난 감량 효과를 내는 위고비가 큰 화제를 모으며 폭발적으로 성장했으나, 천정부지로 솟은 비싼 약값이 항상 지적되어 왔습니다.`,
  players:`압도적인 자금력을 자랑하는 글로벌 초대형 제약사들에 맞서, 토종 제약사가 독자적인 약물 지속형 기반 기술을 앞세워 틈새시장 공략에 나섰습니다.`,
  current:`외산 약품들이 파격적인 체중 감량 수치를 자랑하지만 심한 위장관 부작용과 공급 불안정이 단점이었던 상황에서, 가성비와 안정성을 갖춘 국산 약이 현실적인 대안으로 떠올랐습니다.`,
  outlook:`극단적인 감량보다는 부작용 없이 장기적인 체중 유지가 필요한 국내 환자군을 중심으로 국산 신약의 점유율이 얼마나 빠르게 확대될지 의료계가 주목하고 있습니다.`,
  sources:[{title:`국산 비만약 '에페' 출격, 위고비·마운자로와 맞대결 - 뉴시스`,url:`https://www.newsis.com`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`오픈AI의 추론형 모델과 메타의 차세대 오픈소스 인공지능이 잇따라 공개되며 기술 주도권 경쟁이 격화되고 있습니다.`,
  metrics:[`메타 라마 3.3 파라미터 700억 개`,`오픈AI 신모델 수학 성능 압도적`],
  summary:`인공지능 시장의 선두 주자인 오픈AI와 메타가 각기 다른 철학을 내세운 차세대 AI 모델들을 발표하며 글로벌 기술 주도권 싸움이 새로운 국면에 접어들었습니다. 오픈AI는 단순한 문장 생성을 넘어 인공지능 스스로 복잡한 생각 과정을 거치는 새로운 추론 특화형 모델 시리즈를 연이어 선보였습니다. 이 모델들은 수학 수식이나 코딩 등 난해한 과학적 문제 해결에 압도적인 능력을 보여주며, AI가 스스로 판단하고 업무를 수행하는 에이전트 시대를 앞당기고 있습니다. 반면 메타는 최고 수준의 성능을 누구나 무료로 사용할 수 있도록 코드를 완전히 개방하는 오픈소스 전략에 승부수를 띄웠습니다. 특히 최근 공개된 메타의 새 모델은 막대한 연산량이 필요했던 기존 거대 모델의 성능을 훨씬 가벼운 크기로 압축해 내면서 개발자들의 훈련 비용 부담을 획기적으로 줄였습니다. 두 거대 기술 기업의 엇갈린 전략은 향후 플랫폼 생태계의 패권을 누가 쥘 것인지 가늠하는 분수령이 될 것입니다.`,
  keyTerms:[{term:`오픈소스`,explanation:`소프트웨어의 핵심 설계도라 할 수 있는 원본 소스 코드를 누구나 무료로 열람하고 수정, 배포할 수 있도록 대중에게 투명하게 개방하는 배포 방식을 말합니다.`}],
  history:`대화형 인공지능 시장이 열린 이후 텍스트 생성 속도 경쟁이 치열했으나, 최근에는 오류를 스스로 검증하고 논리적으로 정답을 찾아가는 고도화된 모델 개발로 트렌드가 이동했습니다.`,
  players:`강력한 유료 구독 생태계와 압도적 성능 우위를 고집하는 오픈AI 진영과, 기술 무료 개방을 통해 자사의 플랫폼 영향력을 극대화하려는 메타가 정면충돌하고 있습니다.`,
  current:`오픈AI의 지속적인 구독료 인상과 막대한 API 사용 비용에 지친 많은 기업과 개발자들이, 점차 성능 차이가 좁혀지고 있는 메타의 무료 개방형 모델로 빠르게 눈을 돌리고 있는 상황입니다.`,
  outlook:`스마트폰 자체에서 구동되는 온디바이스 인공지능 시장이 새롭게 열리면서, 적은 전력으로 고성능을 내는 메타의 경량화 기술과 오픈AI의 고지능 에이전트 간의 팽팽한 서비스 경쟁이 예상됩니다.`,
  sources:[{title:`오픈AI 추론 모델 vs 메타 오픈소스, 엇갈린 차세대 AI 전략 - AI타임스`,url:`https://www.aitimes.com`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`스페이스X가 사상 최초로 스타십 우주선 본체와 1단 부스터를 공중에서 동시에 낚아채는 고난도 회수 기술에 도전합니다.`,
  metrics:[`성공 궤도 비행 14차`,`공중 포획 로봇팔 2개`],
  summary:`우주 탐사 기업 스페이스X가 차세대 초대형 우주선 스타십의 15차 시험비행에서 항공우주 역사상 유례없는 획기적인 더블 타워 캐치 기술 도전에 나섭니다. 앞선 14차 비행에서 처음으로 정식 지구 저궤도 진입에 성공하고 실전 위성까지 무사히 전개한 스페이스X는 지체 없이 곧바로 다음 단계 목표로 진입했습니다. 이번 발사에서는 발사탑에 설치된 거대한 로봇팔을 이용해 하단부의 1단 슈퍼헤비 추진체를 잡는 것은 물론, 우주 공간을 다녀온 상단부 우주선 본체까지 공중에서 단번에 포획하는 것을 목표로 합니다. 낙하산이나 바다 착수 없이 육지의 발사대에서 두 거대한 동체를 모두 안전하게 잡아내면, 로켓의 완전 재사용과 파격적인 발사 비용 절감이 현실화됩니다. 현재 핵심 동체들의 지상 연소 시험 등 발사 전 필수 점검이 모두 성공적으로 마무리된 상태입니다. 정부 당국의 최종 승인이 떨어지면 인류 우주 비행의 새로운 이정표가 세워질 전망입니다.`,
  keyTerms:[{term:`더블 타워 캐치`,explanation:`발사대 기둥에 달린 거대한 기계식 로봇팔을 이용해, 우주로 쏘아 올렸던 로켓의 하단부 추진체와 상단부 우주선을 지상 착륙 직전에 공중에서 모두 잡아내는 혁신적인 회수 기술입니다.`}],
  history:`스페이스X는 기존 팰컨9 로켓을 통해 1단 부스터 해상 착륙 기술을 완벽히 마스터하며 우주 산업을 평정했으나, 궁극적인 화성 이주 목표를 위해서는 발사 즉시 재사용이 가능한 공중 포획 기술이 반드시 필요했습니다.`,
  players:`화성 식민지 건설이라는 원대한 비전을 뚝심 있게 밀어붙이는 일론 머스크와, 로켓 정밀 제어 및 회수 기술에 있어서는 타의 추종을 불허하는 스페이스X 엔지니어링 팀이 이 도전을 이끌고 있습니다.`,
  current:`지난 시험비행의 궤도 진입 성공으로 우주선의 기본 비행 능력은 완전히 입증되었으며, 이제는 상업성을 결정짓는 '비용 절감과 빠른 재발사' 기술 완성에 회사의 모든 역량을 쏟아붓고 있습니다.`,
  outlook:`이번 공중 동시 포획이 성공적으로 마무리되면 다음 우주선 발사까지 걸리는 대기 시간이 비약적으로 단축되어, 향후 잦은 우주 왕복 비행을 목표로 하는 스페이스X의 계획이 급물살을 탈 것입니다.`,
  sources:[{title:`스페이스X 스타십, 초유의 공중 동시 포획 도전 - 스페이스닷컴`,url:`https://www.space.com`}]
}]

  tag:`2026-10-28`,
  label:`2026년 10월 28일 (수)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`국내 주요 상장사의 대규모 자사주 소각과 AI 인프라 확충을 위한 회사채 발행이 급증하고 있습니다.`,
  metrics:[`자사주 소각 규모 전년 대비 30% 증가`,`장기 회사채 발행액 5조 원 돌파`],
  summary:`최근 국내 증시에서 주요 상장사들이 주주 가치 제고를 위해 자사주 소각에 적극적으로 나서고 있습니다. 기업 밸류업 프로그램의 영향으로 단순 매입을 넘어 실제 자사주 소각으로 이어지는 사례가 늘어나는 추세입니다. 동시에 빅테크 기업을 중심으로 인공지능 인프라 투자를 위한 자금 조달 목적의 장기 회사채 발행도 크게 증가했습니다. 이는 기업들이 성장 동력 확보와 주주 환원을 동시에 챙기려는 전략으로 풀이됩니다. 시장 전문가들은 이러한 자본 효율화 흐름이 코리아 디스카운트 해소에 긍정적인 영향을 미칠 것으로 보고 있습니다. 향후 금리 인하 기대감과 맞물려 기업들의 자금 조달과 주주 환원 정책은 더욱 활발해질 전망입니다.`,
  keyTerms:[{term:`자사주 소각`,explanation:`회사가 잉여금으로 자기 회사의 주식을 매입한 뒤 이를 완전히 없애는 것으로, 시장에 유통되는 총 주식 수를 줄여 1주당 가치를 높이는 대표적인 주주 환원 정책입니다.`}],
  history:`과거 국내 기업들은 자사주를 매입하더라도 경영권 방어나 임직원 보상용으로 보유만 하는 경우가 많아 진정한 주주 환원 효과가 부족하다는 지적을 받아왔습니다.`,
  players:`금융당국은 밸류업 프로그램을 통해 주주 환원을 독려하고 있으며, 주요 대기업과 행동주의 펀드들이 가치 제고 요구를 주도하고 있습니다.`,
  current:`올해 들어 정부의 정책적 지원과 외국인 투자자들의 압박이 겹치면서 실제 소각으로 이어지는 비율이 눈에 띄게 높아진 분기점이 되었습니다.`,
  outlook:`향후 연말 배당 시즌과 내년 정기 주주총회를 앞두고 기업들의 추가적인 주주 환원책 발표와 행동주의 펀드들의 활동이 더욱 거세질 것으로 예상됩니다.`,
  sources:[{title:`빅테크 회사채 발행 급증 및 자사주 소각 확대 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`코리아 디스카운트 해소 청신호 - 한국경제`,url:`https://www.hankyung.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`엔비디아와 브로드컴 등 인공지능 관련 기술주 주도의 강한 매수세에 힘입어 미 뉴욕 증시가 반등했습니다.`,
  metrics:[`나스닥 종합지수 1.5% 상승`,`엔비디아 주가 3.2% 급등`],
  summary:`최근 조정 장세를 보이던 미국 뉴욕 증시가 인공지능 관련 주요 기술주들의 강세로 반등에 성공했습니다. 특히 엔비디아와 브로드컴 등 AI 반도체 선도 기업들의 긍정적인 실적 전망이 시장의 저가 매수세를 강력하게 견인했습니다. 투자자들은 최근 주가 하락을 저점 매수의 기회로 삼았으며, 기술주 펀더멘털에 대한 신뢰가 여전히 굳건함을 보여주었습니다. 또한 연방준비제도의 향후 통화 정책에 대한 불확실성이 다소 완화된 점도 투자 심리 개선에 기여했습니다. 시장은 곧 다가올 핵심 고용 지표와 거대 기술 기업들의 3분기 실적 발표를 주시하며 단기 랠리 지속 여부를 타진하고 있습니다.`,
  keyTerms:[{term:`저가 매수세`,explanation:`주식이나 자산의 가격이 단기적인 악재나 시장 조정으로 인해 원래 가치보다 비정상적으로 낮게 떨어졌다고 판단될 때, 향후 상승을 기대하고 집중적으로 사들이는 투자 움직임입니다.`}],
  history:`인공지능 테마는 지난 2년간 글로벌 증시를 강력하게 이끌어왔으나, 최근 밸류에이션 부담과 고금리 장기화 우려로 인해 단기적인 조정을 겪고 있었습니다.`,
  players:`엔비디아, 브로드컴 등 반도체 대장주들이 랠리를 이끌고 있으며, 기관 투자자와 개인 투자자 모두 저점 매수 기회를 노리며 시장에 적극 참여하고 있습니다.`,
  current:`빅테크 기업들의 막대한 인프라 투자 지속과 강력한 현금 창출력이 재부각되면서 기술주 전반에 걸친 투자 심리가 빠르게 회복되는 국면입니다.`,
  outlook:`다음 주 예정된 연준의 통화 정책 회의 결과와 핵심 고용 지표가 이번 기술주 반등세의 중장기적인 추세를 결정지을 최대 변수가 될 전망입니다.`,
  sources:[{title:`US Tech Stocks Rebound on AI Optimism - Bloomberg`,url:`https://www.bloomberg.com/`},{title:`Nasdaq Rallies as Nvidia Leads Tech Recovery - Reuters`,url:`https://www.reuters.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 AI 선도 기업 앤트로픽이 브로드컴과 대규모 협력을 맺고 내년을 목표로 상장 채비를 서두르고 있습니다.`,
  metrics:[`브로드컴 파트너십 규모 수억 달러 예상`,`앤트로픽 추정 기업가치 400억 달러 상회`],
  summary:`오픈AI의 최대 대항마로 꼽히는 앤트로픽이 통신 칩 강자인 브로드컴과 차세대 칩 개발 및 데이터 인프라 구축을 위한 전략적 파트너십을 체결했습니다. 이번 협력은 앤트로픽이 자체 맞춤형 실리콘을 확보하여 모델 학습 효율을 극대화하기 위한 포석으로 해석됩니다. 동시에 앤트로픽은 시장에 상장 관련 위험 요인을 공시하는 등 내년을 목표로 하는 기업공개 (IPO) 절차를 본격화하고 나섰습니다. 막대한 인프라 투자금을 조달하기 위해서는 상장을 통한 대규모 자본 유치가 필수적이기 때문입니다. 시장은 이 거물급 기업의 증시 입성이 테크 섹터 전반에 미칠 엄청난 파급력을 예의주시하고 있습니다.`,
  keyTerms:[{term:`기업공개 (IPO)`,explanation:`외부 투자자가 자유롭게 주식을 사고팔 수 있도록 비상장 기업이 처음으로 재무 상황을 낱낱이 공개하고 증권시장에 공식적으로 상장하여 대규모 자금을 조달하는 과정입니다.`}],
  history:`앤트로픽은 구글, 아마존 등 거대 기술 기업들로부터 수십억 달러의 펀딩을 받았으나, 선두 주자인 오픈AI와의 언어 모델 성능 경쟁을 위해 더 많은 컴퓨팅 자원이 절실한 상황이었습니다.`,
  players:`강력한 클로드 모델을 개발한 앤트로픽의 경영진과, 통신 칩 및 인공지능 인프라 분야의 주요 공급사인 브로드컴이 이번 협력의 핵심 주체입니다.`,
  current:`글로벌 인공지능 기업들의 칩 확보 경쟁이 극에 달한 가운데, 앤트로픽이 엔비디아 의존도를 낮추고 독자적인 공급망을 선제적으로 확보하려는 움직임이 가시화되고 있습니다.`,
  outlook:`이번 브로드컴과의 성공적인 협력이 입증될 경우, 앤트로픽의 내년 상반기 예상 상장 절차는 최근 수년 내 가장 큰 규모의 기술주 이벤트로 기록될 가능성이 매우 높습니다.`,
  sources:[{title:`Anthropic Partners with Broadcom, Eyes IPO - FT`,url:`https://www.ft.com/`},{title:`Anthropic's Strategic Chip Move - WSJ`,url:`https://www.wsj.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`오세훈 서울시장의 리스크 완화 국면을 계기로 여권 원내 지도부가 보수 진영의 결집과 통합 논의에 불을 지피고 있습니다.`,
  metrics:[`당내 통합 관련 주요 회의 3차례 개최`,`보수 진영 결집 관련 지지율 2.5%p 반등`],
  summary:`최근 선거법 관련 고발 건 등에서 상대적으로 유리한 국면을 맞은 오세훈 서울시장을 중심으로 여권 내 보수 진영의 통합론이 급부상하고 있습니다. 여당 원내 지도부는 계파 간 오랜 갈등을 봉합하고 단일대오를 형성하기 위해 적극적인 중재와 회동을 이어가며 보수 통합의 촉매 역할을 자처하고 나섰습니다. 이는 차기 대권 주자들의 불확실성이 상존하는 상황에서 안정적인 대안적 구심점을 찾아 지지층의 붕괴를 막으려는 전략적 행보로 분석됩니다. 오 시장 측 역시 오랫동안 뜸했던 당내 스킨십을 늘리며 정치적 보폭을 넓히고 있어 당권 및 대권 구도에 미묘한 변화가 감지됩니다. 거대 야당의 강공에 맞서 여권이 통합 시너지를 내며 사법 리스크 국면을 전환할 수 있을지 정치권의 이목이 집중되고 있습니다.`,
  keyTerms:[{term:`사법 리스크`,explanation:`주요 정치인이나 기업인이 검찰 수사나 법원 재판을 받게 됨으로써, 정상적인 업무 수행이나 향후 정치적 입지에 심각한 타격과 불확실성을 초래하는 치명적인 위험 요소를 뜻합니다.`}],
  history:`여권은 총선 패배 이후 당내 주류와 비주류, 그리고 차기 잠룡들 간의 이견 노출로 지지율 답보 상태에 머무르며 강력한 리더십 형성에 큰 어려움을 겪어왔습니다.`,
  players:`유력 주자인 오세훈 서울시장, 원내대표 등 당 지도부 핵심 인사들, 그리고 차기 대권을 노리는 여권 내 여러 잠재적 후보군이 이번 통합 논의의 주요 이해관계자들입니다.`,
  current:`오 시장을 향한 수사 기관의 무혐의 처분이나 위험 해소 소식이 전해지면서 그를 대안적 구심점으로 띄워 위기를 돌파하려는 원내 주류 세력의 움직임이 본격화되었습니다.`,
  outlook:`향후 연말을 기점으로 당원 당규 개정 논의와 맞물려 보수 대통합의 구체적인 로드맵이 제시될지, 아니면 또 다른 내부 권력 투쟁으로 번질지가 가장 큰 관건입니다.`,
  sources:[{title:`오세훈 리스크 완화, 보수 통합 구심점 뜬다 - 중앙일보`,url:`https://www.joongang.co.kr/`},{title:`여권 원내지도부, 통합 촉매 자처 - 연합뉴스`,url:`https://www.yna.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`주요 현안에 대해 야당이 강제적인 진상 규명 요구서를 국회에 제출하면서 정국 주도권을 둘러싼 대립이 극한으로 치닫고 있습니다.`,
  metrics:[`진상 규명 요구서 서명 야당 의원 170명`,`관련 상임위원회 의사일정 파행 3일째`],
  summary:`야당 주도로 전 영부인 관련 의혹 및 정부 핵심 인사들에 대한 철저한 진상 규명을 요구하는 국정조사 요구서가 국회에 전격적으로 제출되었습니다. 야당은 대통령의 거듭된 특검법 거부권 행사에 강하게 반발하며, 자체적인 국회 권한을 최대한 동원해 정부 여당을 향한 파상 공세를 빈틈없이 이어가고 있습니다. 이에 대해 정부와 여당은 이를 정략적인 흠집내기용 정쟁이라며 강력히 반발, 관련 상임위원회 일정을 전면 보이콧하는 등 여야 간 대치가 극단으로 치닫고 있습니다. 당장 시급한 쟁점 법안 처리와 내년도 예산안 심사 등 산적한 국회 일정마저 중대한 차질을 빚으며 민생을 외면한다는 비판도 눈덩이처럼 커지고 있습니다. 정국의 돌파구가 전혀 보이지 않는 가운데 소모적인 정쟁 장기화에 대한 국민적 피로감이 극에 달하고 있습니다.`,
  keyTerms:[{term:`국정조사`,explanation:`국회가 특정 국가적 중대 사안이나 국민적 의혹에 대해 강제성을 띠고 문서 제출, 증인 채택 등을 요구하여 철저하게 진상을 규명하고 파헤칠 수 있는 헌법상 부여된 권한입니다.`}],
  history:`최근 잇따른 특검법 도입 요구와 대통령의 재의요구권 행사가 기계적으로 반복되면서 국회 내에서 여야 간의 정상적인 정치적 타협 공간이 완전히 실종된 척박한 상태였습니다.`,
  players:`국회 운영의 키를 쥔 거대 야당의 원내 지도부와 의장단, 그리고 입법 폭주 방어에 사활을 건 정부 및 여당 지도부가 정국 주도권을 두고 한 치의 양보 없이 팽팽히 맞서고 있습니다.`,
  current:`핵심 수단인 특검법 추진이 막히자 야당은 국회 고유 권한인 조사권을 우회로로 삼아 대국민 여론전을 극대화하며 정권에 대한 압박 수위를 한층 높이는 전술로 급선회했습니다.`,
  outlook:`조만간 본회의에서 야당의 수적 우위를 앞세워 요구서가 단독 처리될 가능성이 매우 높은 가운데, 여당의 불참 속에 반쪽짜리 조사가 강행될 경우 정치적 양극화는 돌이킬 수 없이 심화될 전망입니다.`,
  sources:[{title:`야당 단독 조사 강행, 여야 대치 정점 - 조선일보`,url:`https://www.chosun.com/`},{title:`끝없는 정국 한파, 상임위 파행 사태 - 한겨레`,url:`https://www.hani.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`조기 치러진 이스라엘 총선 투표 마감 직후 발표된 예측 결과에서 어느 진영도 뚜렷한 과반을 확보하지 못해 대혼란이 예고됩니다.`,
  metrics:[`총선 최종 투표율 77.2% 기록`,`집권 여당 연합 예상 의석 59석 (과반 미달)`],
  summary:`안보 위기 속에서 치러진 이스라엘 조기 총선에서 현 총리 진영과 야당 연합 모두 의회 과반을 차지하지 못할 것이라는 출구조사 결과가 발표되었습니다. 77%를 넘는 기록적인 투표율은 장기화된 전쟁 피로감과 경제난 속에서 현 정권의 책임을 묻고자 하는 국민들의 심판 열기가 짙게 반영된 것으로 풀이됩니다. 중도 좌파를 표방하는 야당 연합 역시 단독으로 정권을 창출할 과반 의석을 넘기지 못해, 당분간 군소 정당들을 끌어들이기 위한 치열하고 혼탁한 연정 구성 힘겨루기가 시작되었습니다. 강경 노선을 고수하던 네타냐후 총리의 권력 유지가 매우 불투명해지면서 중동 평화 협상과 팔레스타인 정책 등 외교 안보의 근본적 노선에 큰 변화가 생길지 국제사회의 비상한 관심이 집중되고 있습니다. 실제 최종 개표 결과에 따라 이스라엘 정국의 향방이 완전히 뒤바뀔 수 있는 긴박한 며칠이 될 것입니다.`,
  keyTerms:[{term:`출구조사`,explanation:`선거 당일 유권자가 투표소에서 실제 투표를 마치고 나올 때, 어느 후보나 정당에 표를 던졌는지를 통계적으로 물어보아 최종 선거 결과를 빠르게 미리 예측하고 분석하는 여론 조사 기법입니다.`}],
  history:`이스라엘은 정당 난립과 잦은 연정 붕괴로 최근 몇 년간 선거를 반복해왔으며, 특히 극심한 분쟁 사태 이후 현 내각의 무능에 대한 치명적인 책임론과 퇴진 요구가 지속적으로 끓어올라 왔습니다.`,
  players:`초강경 우파 성향으로 장기 집권 중인 현 총리와 집권당, 그리고 이에 맞서 대대적인 정권 교체를 노리는 범야권 연합, 마지막으로 캐스팅보트를 쥐게 된 극우 및 아랍계 군소 정당들이 핵심 세력입니다.`,
  current:`어느 진영도 안정적인 의정 활동을 위한 과반 의석을 선점하지 못한 완벽한 교착 상태에 빠지면서, 향후 몇 주간 차기 정부 구성을 위한 극한의 눈치싸움과 이합집산이 숨 가쁘게 전개되고 있습니다.`,
  outlook:`실제 최종 개표 결과가 현재의 예측과 동일하게 확정될 경우, 협상 결렬에 따른 연정 구성 실패로 인해 불과 몇 달 내에 또다시 재선거가 치러져야 하는 최악의 정치적 불확실성이 심각하게 우려됩니다.`,
  sources:[{title:`Israel Election Exit Polls Show Deadlock - AP News`,url:`https://apnews.com/`},{title:`Netanyahu Struggles for Majority in Tight Race - Reuters`,url:`https://www.reuters.com/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`서울 강남구 개포동 구룡마을에 위치한 대규모 임시 주택 단지에서 큰 불이 나 상당한 재산 피해와 이재민이 발생했습니다.`,
  metrics:[`소실된 임시 거처 60여 채`,`긴급 대피 이재민 150여 명`],
  summary:`어제 오후 서울 강남구 개포동 구룡마을에서 원인을 알 수 없는 대형 화재가 발생해 약 13시간 만인 오늘 오전 완전히 진화되었습니다. 불은 빽빽하게 밀집된 가건물 단지와 인접한 대모산 산기슭으로 삽시간에 번지며 무려 60여 채의 판잣집을 완전히 잿더미로 만들었고, 놀란 150여 명의 주민들이 인근 임시 대피소로 긴급 피신하는 큰 소동이 벌어졌습니다. 다행히 소방 당국의 신속한 최고 단계 대응으로 끔찍한 인명 피해는 기적적으로 피했으나, 한순간에 삶의 터전을 잃어버린 이재민들의 겨울철 구호 문제가 당면한 가장 시급한 과제로 떠올랐습니다. 날씨가 추워지면서 난방 기기 사용이 급증함에 따라 판자촌의 치명적인 화재 취약성이 또다시 여실히 노출된 비극적인 사건입니다. 관할 당국은 정확한 화재 원인 조사와 함께 당장 거리로 나앉은 이재민에 대한 따뜻한 임시 거처 마련 등 긴급 복구 지원에 총력을 기울이고 있습니다.`,
  keyTerms:[{term:`가건물`,explanation:`관할 구청으로부터 정식 건축 허가를 받지 않거나 임시로 지어져 사용승인 없이 무단으로 거주하는 구조물로, 주로 불에 타기 쉬운 비닐이나 합판 등으로 엉성하게 만들어져 화재가 발생할 경우 확산 속도가 빠르고 구조적으로 매우 취약합니다.`}],
  history:`구룡마을은 서울에 마지막 남은 대표적인 판자촌 밀집 지역으로, 비좁은 골목길과 낡고 거미줄처럼 얽힌 전선, 인화성 높은 건축 자재 탓에 과거에도 잊을 만하면 여러 차례 참혹한 대형 화재를 반복적으로 겪어왔습니다.`,
  players:`하루아침에 막대한 피해를 입은 구룡마을 거주 주민들과 화재 진압 및 현장 복구를 총괄하는 관할 소방 당국, 그리고 거주민들의 근본적인 이주 대책을 책임지고 있는 강남구청과 서울시가 얽혀 있습니다.`,
  current:`이해관계가 복잡하게 얽혀 오랜 기간 재개발 사업이 끝없이 지연되는 가운데, 열악하고 위험한 주거 환경이 그대로 방치되면서 재난에 완전히 무방비로 노출된 구조적 모순이 이번 화재 참사를 계기로 다시금 뜨겁게 공론화되고 있습니다.`,
  outlook:`경찰과 소방 당국의 정밀한 합동 현장 감식을 통해 실화 및 고의적인 방화 여부가 낱낱이 밝혀질 예정이며, 다가오는 본격적인 겨울철을 앞두고 전국적인 주거 취약 계층의 실효성 있는 화재 예방 대책 마련 목소리가 거세질 전망입니다.`,
  sources:[{title:`강남 구룡마을 대형 화재 13시간만에 완진 - 연합뉴스TV`,url:`https://www.yonhapnewstv.co.kr/`},{title:`구룡마을 임시 거처 60채 소실, 150명 대피 - 중앙일보`,url:`https://www.joongang.co.kr/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`애플이 스마트폰 시장 제패를 위해 야심 차게 내놓은 첫 접이식 기기 '아이폰 듀오'에서 힌지 화면이 깨지는 치명적인 결함이 발생했습니다.`,
  metrics:[`글로벌 초기 불량 접수 건수 2,000건 돌파`,`결함 이슈 확산 후 애플 주가 1.5% 단기 하락`],
  summary:`애플이 정체된 스마트폰 시장의 판도를 단번에 바꾸겠다며 야심 차게 내놓은 브랜드 최초의 폴더블 폰 '아이폰 듀오'가 출시 직후부터 심각한 폼팩터 결함 논란에 휩싸였습니다. 전 세계 곳곳에서 기기를 자연스럽게 접었다 펴는 힌지(경첩) 부위의 얇은 디스플레이에서 미세한 금이 가거나 쩍 갈라지는 치명적인 화면 균열 현상이 동시다발적으로 끊임없이 보고되고 있습니다. 이른바 크랙 게이트로 불리며 일파만파 커진 이번 사태로 깐깐한 초기 품질 관리에 대한 충성도 높은 소비자들의 배신감과 불만이 거세지며 불량 신고 건수가 단숨에 2천 건을 넘어섰습니다. 다급해진 애플 측은 일부 초기 제조 공정의 수율 문제일 가능성을 열어두고 전면적인 원인 조사에 착수했으며, 불편을 겪은 고객들에게 무상 교체 및 환불 정책을 긴급히 공지하며 진화에 나섰습니다. 완벽한 마감과 완성도를 뽐내던 글로벌 1위 애플의 명성에 큰 금이 가면서 치열한 폼팩터 시장 점유율 방어에도 뚜렷한 적신호가 켜졌습니다.`,
  keyTerms:[{term:`폴더블 폰`,explanation:`특수하게 제작된 휘어지고 유연한 디스플레이 패널을 적용하여 책처럼 반으로 접었다 펼 수 있게 설계된 스마트폰으로, 주머니에 쏙 들어가는 휴대성과 태블릿 같은 대화면의 시원한 장점을 동시에 갖춘 차세대 폼팩터 혁신 기기입니다.`}],
  history:`삼성전자 등 경쟁사들이 오랜 기간 주도하며 덩치를 키워온 접이식 스마트폰 시장에 애플이 수년간의 비밀스러운 개발과 철저한 테스트 끝에 후발주자로 진입하며 생태계 팽창에 대한 전 세계적 기대감이 극에 달해 있었습니다.`,
  players:`사상 초유의 결함 논란에 직면해 진땀을 빼는 애플 본사와 핵심 디스플레이 및 힌지 부품을 독점 공급하는 주요 부품 협력사, 그리고 비싼 가격에도 불구하고 초기 결함 여부에 극도로 민감한 반응을 보이는 글로벌 1차 소비자들이 복잡하게 얽혀 있습니다.`,
  current:`설레는 마음으로 기기를 받은 초기 구매자들의 분노 섞인 SNS 고발 영상이 매일 잇따르고, 저명한 외신 기술 매체들이 혹독한 제품 내구성 테스트 실패를 앞다퉈 속보로 보도하면서 논란이 애플의 통제 범위를 넘어서 전방위로 빠르게 확산되는 중입니다.`,
  outlook:`만약 애플이 이번 균열 사태가 단순한 생산 라인의 부품 불량인지 아니면 기기 설계 자체의 근본적이고 치명적 결함인지를 신속히 규명하고 해결책을 내놓지 못할 경우, 브랜드 역사상 유례없는 대규모 글로벌 리콜 사태로 번져 천문학적 금전적 손실과 신뢰도 추락을 겪을 수 있습니다.`,
  sources:[{title:`애플 아이폰 듀오 첫 화면 쩍... 크랙 게이트 발발 - 매일경제`,url:`https://www.mk.co.kr/`},{title:`Apple Investigates Foldable Display Cracks Amid Outcry - Bloomberg`,url:`https://www.bloomberg.com/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`위급한 어린이 중증 환자를 24시간 전담하는 아주대병원 권역 응급센터 전문의들이 과도한 노동 강도에 지쳐 전원 사직을 예고했습니다.`,
  metrics:[`사직서 제출 의사 표명 전문의 4명`,`해당 센터 일일 평균 소아 응급 진료 환자 120명`],
  summary:`인구 밀집도가 높은 경기 남부 권역 전체의 위중한 어린이 응급 환자 생명을 책임지는 아주대병원 소아전문응급의료센터 교수진이 전원 사직서를 제출하겠다는 비장한 입장을 표명해 돌이킬 수 없는 의료 대란이 극도로 우려됩니다. 현재 이곳에 남은 단 4명의 전문의가 매일 100명이 훌쩍 넘는 숨 넘어가는 소아 환자를 365일 24시간 피말리게 교대로 감당하는 등 말 그대로 살인적인 노동 강도와 극도의 스트레스에 무방비로 시달려왔습니다. 병원 측과 보건 당국의 절실한 인력 충원 약속이 기약 없이 계속 미뤄지고 육체적 정신적 번아웃이 도저히 버틸 수 없는 한계치에 다다르면서, 환자를 살리고 싶지만 더 이상 버틸 수 없다는 절박함에 결국 집단행동이라는 극단적이고 고통스러운 선택을 내린 것으로 보입니다. 이들의 이탈이 단 한 명이라도 현실화될 경우, 당장 오늘 밤부터 야간 및 휴일 중증 소아 환자들이 제때 골든타임 내 치료받을 곳을 찾지 못해 구급차를 타고 거리를 헤매며 이른바 응급실 뺑뺑이를 도는 참혹한 사태가 발생할 수 있습니다. 이미 처참하게 무너져내려 가는 대한민국 필수의료 체계의 뼈아픈 현실을 가장 여실히 보여주며, 임시방편이 아닌 근본적이고 조속한 대책 마련이 국민적 요구로 거세게 빗발치고 있습니다.`,
  keyTerms:[{term:`소아전문응급의료센터`,explanation:`성인 환자 중심의 번잡한 일반 응급실과 공간을 완전히 분리하여 숙련된 소아청소년과 전문의가 365일 24시간 상주하며, 면역력과 생명력이 취약한 영유아 및 어린이 중증 응급 환자만을 신속하고 전문적으로 진단하고 치료하는 국가 지정 핵심 의료 인프라입니다.`}],
  history:`최근 몇 년간 만성적인 저출산 여파와 성인 진료 대비 터무니없이 낮은 의료 수가, 불가항력적 의료 사고에 대한 과도한 소송 리스크 증가 등으로 인해 의사들의 소아청소년과 전공 기피 현상이 걷잡을 수 없이 심화되며 전국적인 소아 응급 의료진 부족 사태가 시한폭탄처럼 누적되어 왔습니다.`,
  players:`극심한 번아웃과 생존의 위협을 호소하며 거리에 나설 준비를 하는 아주대병원 소아응급 전문의들과 어떻게든 파국을 막고 인력 충원을 고심하는 병원 경영진, 그리고 붕괴 직전의 필수의료 정책을 책임지는 보건복지부가 복잡하게 얽혀 촌각을 다투고 있습니다.`,
  current:`올해 초 의대 증원 강행으로 촉발된 극심한 갈등 이후 미래를 짊어질 전공의들마저 짐을 싸서 병원을 썰물처럼 떠난 최악의 상황에서, 현장을 묵묵히 지키던 남은 소수 전문의들의 업무 하중마저 댐이 터지듯 폭발하며 연쇄적이고 파멸적인 필수의료 붕괴 조짐이 전국 곳곳에서 나타나고 있습니다.`,
  outlook:`정부가 당장 숨통을 틔워줄 긴급 군의관이나 공보의 등 대체 의료진 파견, 혹은 센터 유지를 위한 파격적인 특별 수가 지원 등의 특단의 구제책을 즉각 내놓지 못하면 당장 다음 달부터 해당 권역 센터의 야간 진료가 전면 중단되어 수많은 어린이들의 생명이 벼랑 끝에 몰릴 끔찍한 위기입니다.`,
  sources:[{title:`아주대 소아응급 교수진 줄사표 예고... 경기 남부 의료 공백 초비상 - 중앙일보`,url:`https://www.joongang.co.kr/`},{title:`소아응급실 뺑뺑이 악몽 재현되나... 한계 달한 번아웃 호소 - KBS`,url:`https://news.kbs.co.kr/`}]
}]

  colorBg:`#e8f0fe`,
  headline:`반도체와 AI가 견인하는 수출 호조 속, 길어지는 내수 침체 장기화 우려`,
  metrics:[`AI 반도체 수출 전년 대비 45% 증가`,`소매판매액지수 5개월 연속 하락`],
  summary:`글로벌 빅테크 기업들의 인프라 투자가 지속되면서 한국의 HBM 등 AI 반도체 수출이 전년 대비 큰 폭으로 상승했습니다. 이로 인해 거시적인 수출 지표는 역대 최고치를 기록하고 있으나, 내수 경제는 전혀 다른 양상을 보이고 있습니다. 고금리와 높은 가계부채 원리금 상환 부담으로 인해 실질 가처분소득이 줄어들며 소매판매 및 자영업 체감 경기가 차갑게 식어 있습니다. 수출과 내수 간의 극심한 양극화 현상이 고착화되면서 수출 착시에 대한 우려가 커지고 있습니다. 정부와 한국은행은 금리 인하 속도를 조절하며 가계부채 연착륙을 꾀하고 있지만, 뚜렷한 내수 진작 돌파구를 찾지 못하는 상황입니다. 경제 전문가들은 수출 낙수효과가 사라진 현 구조를 개선할 대책 마련이 시급하다고 지적합니다.`,
  keyTerms:[{term:`수출 착시`,explanation:`거시적인 수출 지표는 매우 좋게 나타나지만, 그 혜택이 내수나 가계로 이어지지 않아 경제 전체가 호황인 것처럼 오해하게 만드는 현상을 의미합니다.`}],
  history:`과거에는 대기업의 수출이 늘면 하청업체와 가계 소득이 증가하는 낙수효과가 작동했으나, 최근 산업 고도화로 이 연결고리가 끊어졌습니다.`,
  players:`수출 호조를 이끄는 삼성전자, SK하이닉스 등 대기업과 고통을 겪는 소상공인, 중소기업, 가계가 대비됩니다.`,
  current:`한국은행의 금리 인하가 시작되었으나 가계부채 우려로 폭이 제한적이라 당장 소비 회복으로 이어지지 않고 있습니다.`,
  outlook:`반도체 호황이 내년 초 정점을 찍을 수 있다는 전망 속에, 내수 회복 없는 경제 성장률 달성이 가능할지 주목됩니다.`,
  sources:[{title:`반도체 질주에도 웃지 못하는 골목상권 - 연합뉴스`,url:`https://yna.co.kr/news/econ1`},{title:`내수 침체 장기화, 가계부채가 발목 잡았다 - 한국경제`,url:`https://hankyung.com/news/econ2`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`중동 분쟁 재점화 리스크, 국제 유가 배럴당 100달러 돌파`,
  metrics:[`WTI 원유 배럴당 105달러 돌파`,`미국 소비자물가지수 예상치 상회`],
  summary:`중동 지역의 긴장이 다시 최고조에 달하면서 글로벌 에너지 시장이 요동치고 있습니다. 호르무즈 해협 주변의 불안감과 주요 산유국 인프라 타격 위협으로 인해 서부텍사스산원유와 브렌트유가 배럴당 100달러를 단숨에 돌파했습니다. 유가 급등은 진정세를 보이던 글로벌 인플레이션을 다시 자극하고 있으며, 미국의 최신 소비자물가지수도 시장 예상치를 상회했습니다. 이에 따라 미국 연방준비제도를 비롯한 각국 중앙은행들의 금리 인하 경로에 급제동이 걸렸습니다. 시장에서는 에너지 가격 상승발 2차 물가 충격으로 고금리 장기화 우려가 확산되며 투자 심리가 급격히 얼어붙고 있습니다. 인플레이션 파이터로서 중앙은행들의 정책 셈법이 한층 복잡해진 국면입니다.`,
  keyTerms:[{term:`2차 물가 충격`,explanation:`유가나 원자재 가격 급등 같은 외부 요인이 제조 원가와 운송비를 높여, 최종적으로 일반 소비재 가격 전반을 다시 끌어올리는 연쇄적인 인플레이션 현상을 말합니다.`}],
  history:`중동의 지정학적 갈등은 지난 수년간 지속되었으나, 최근 주요 산유국의 직접적인 무력 충돌 우려가 커지며 에너지 공급망 위기가 증폭되었습니다.`,
  players:`원유 공급의 키를 쥔 사우디, 이란 등 중동 국가들과 인플레이션을 막아야 하는 미국 연방준비제도가 핵심 주체입니다.`,
  current:`국제 유가 상승폭이 예상보다 가팔라 수송 및 제조 원가에 즉각적인 부담으로 작용하고 있습니다.`,
  outlook:`갈등 양상의 전개에 따라 유가 변동성이 극심할 것으로 보이며, 다가오는 통화정책 회의에서 연준의 금리 방향성 수정 여부가 관건입니다.`,
  sources:[{title:`Middle East Tensions Send Oil Past 100 - Bloomberg`,url:`https://bloomberg.com/news/oil`},{title:`Inflation Fears Return as Energy Prices Spike - Reuters`,url:`https://reuters.com/news/inflation`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`글로벌 채권 시장 충격, 미 국채 10년물 금리 급등세`,
  metrics:[`미 국채 10년물 금리 4.8% 돌파`,`빅테크 AI 설비투자 연간 2500억 달러 초과`],
  summary:`미국 국채 금리가 가파르게 상승하며 글로벌 자본 시장에 큰 충격을 주고 있습니다. 미국의 천문학적인 재정 적자와 인플레이션 재점화 우려가 겹치면서 국채 10년물 금리가 4.8%를 돌파했습니다. 국채 금리의 상승은 전 세계적인 차입 비용 증가로 이어져 신흥국과 기업들의 자금 조달에 심각한 부담을 줍니다. 특히 그동안 엄청난 자본을 끌어다 쓴 거대 기술 기업들의 인프라 투자에 대한 시장의 의구심이 커지고 있습니다. 천문학적인 투자 대비 실질적인 수익 창출이 늦어지면서 빅테크 거품론이 재점화되고 기술주 전반의 조정이 발생했습니다. 국채 금리 급등과 기술 기업의 수익성 우려가 맞물려 글로벌 증시의 변동성이 크게 확대된 상황입니다.`,
  keyTerms:[{term:`빅테크 거품론`,explanation:`거대 기술 기업들이 신기술에 엄청난 돈을 투자하고 있지만 그만큼의 실제 수익을 벌어들이지 못해 현재의 높은 주가나 기대치가 과장되었다는 주장입니다.`}],
  history:`급증한 미국 재정 적자와 통화 긴축 정책으로 금리 부담이 누적되었고, 동시에 기술 열풍으로 대규모 투자가 과열되었습니다.`,
  players:`대규모 국채를 발행하는 미국 재무부와 막대한 인프라 투자를 진행 중인 알파벳, 메타, 마이크로소프트 등 기술 기업들입니다.`,
  current:`안전자산인 국채의 수익률이 높아지자 위험자산인 주식 시장에서 자금이 이탈하는 현상이 나타나고 있습니다.`,
  outlook:`거대 기술 기업들이 다음 실적 발표에서 막대한 투자에 걸맞은 구체적인 수익 모델을 증명할 수 있을지가 시장의 최대 관심사입니다.`,
  sources:[{title:`US Treasury Yields Surge on Deficit Worries - WSJ`,url:`https://wsj.com/news/treasury`},{title:`Tech Stocks Slide as Capex Concerns Grow - FT`,url:`https://ft.com/news/tech-capex`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`새 정부 출범 1년, 구조개혁 드라이브와 여야 대립의 지속`,
  metrics:[`주요 개혁 법안 국회 계류 건수 120건`,`새 정부 국정 지지율 40%대 중반 횡보`],
  summary:`역사적인 조기 대선 이후 출범한 새 정부가 국정운영 1년 차를 맞아 강력한 구조개혁 드라이브를 걸고 있습니다. 저출산 극복과 잠재성장률 하락 방어를 목표로 연금, 노동, 교육 분야의 개편안을 연이어 발표했습니다. 그러나 극심한 여소야대 지형 속에서 야당과의 협치가 겉돌며 주요 개혁 법안들이 국회 문턱을 넘지 못하고 있습니다. 여당은 경제 위기 극복을 위한 입법 협조를 강력히 촉구하는 반면, 야당은 정책 부작용과 민생 지원 부족을 이유로 제동을 걸며 주도권 싸움을 벌이고 있습니다. 탄핵 사태 이후 재편된 정치권이 여전히 극한 대립에서 벗어나지 못하면서, 시급한 국가적 과제들이 추진력을 잃을 수 있다는 우려가 제기됩니다. 향후 정국 주도권을 쥔 국회 합의 여부가 새 정부 성패를 가를 전망입니다.`,
  keyTerms:[{term:`여소야대`,explanation:`대통령을 배출한 여당의 국회 의석수가 반대 정당인 야당의 의석수보다 적은 정치적 상황을 뜻하며, 정부가 법안을 통과시키기 매우 어렵게 만듭니다.`}],
  history:`과거 헌정 초유의 비상사태 및 대통령 탄핵을 겪으며 정치적 양극화와 진영 갈등이 극도로 심화되었습니다.`,
  players:`정책을 속도감 있게 추진하려는 여당과, 국회 다수 의석을 무기로 정부를 견제하는 야당이 치열하게 대립 중입니다.`,
  current:`연금과 노동 시장 등 미룰 수 없는 구조개혁이 필수적임에도 정치적 셈법에 밀려 법안 처리가 지연되고 있습니다.`,
  outlook:`내년 다가오는 선거 전까지 여야가 극적인 타협점을 찾아 핵심 법안을 처리할 수 있을지가 관건입니다.`,
  sources:[{title:`새 정부 개혁 드라이브, 멈춰선 국회 - 조선일보`,url:`https://chosun.com/news/politics1`},{title:`여야 대치 격화, 표류하는 민생 법안들 - 한겨레`,url:`https://hani.co.kr/news/politics2`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`브라질 대선 룰라 4선 성공, 우파 진영 반발 속 남미 긴장 고조`,
  metrics:[`결선 투표 득표율 격차 1.5%p 내외`,`시위 참가자 10만 명 돌파`],
  summary:`브라질 대통령 선거 결선 투표에서 좌파 진영의 룰라 다 실바 현 대통령이 4선 고지에 올랐습니다. 개표 결과 불과 1.5% 포인트 내외의 초접전 끝에 승리가 확정되었습니다. 그러나 경쟁자였던 우파 진영 후보 측은 전자투표 시스템의 신뢰성에 의문을 제기하며 결과 인정을 거부하고 있습니다. 전국 주요 도시에서 선거 불복을 주장하는 우파 지지자들의 대규모 시위가 벌어지며 군사 개입까지 촉구하는 목소리가 나오고 있습니다. 글로벌 보수 진영 일각에서도 이에 동조하는 발언이 나오며 국제적 논란으로 번지고 있습니다. 남미 최대 경제국의 정치적 극단화와 분열이 주변국 정세에도 불안 요소로 작용할 것이라는 분석이 지배적입니다.`,
  keyTerms:[{term:`선거 불복`,explanation:`선거 결과가 나왔음에도 패배한 측에서 투표 조작이나 부정 선거 등을 이유로 결과를 인정하지 않고 권력 이양을 거부하는 행위입니다.`}],
  history:`브라질은 지난 대선에서도 극심한 좌우 분열과 폭동을 겪었으며, 정치 양극화가 만성적인 사회 문제로 자리 잡았습니다.`,
  players:`저소득층의 전폭적인 지지를 받는 룰라 대통령 측과, 기득권 및 보수층을 결집한 우파 야권 세력이 정면 충돌하고 있습니다.`,
  current:`군부와 경찰의 동향에 시선이 쏠리는 가운데, 시위가 격화되며 주요 고속도로와 인프라가 마비될 위험이 커졌습니다.`,
  outlook:`브라질 사법부와 선거관리위원회의 단호한 대처 여부와 시위대의 지속성이 정국 안정의 분수령이 될 것입니다.`,
  sources:[{title:`Lula Wins 4th Term in Brazil Amid Protests - AP`,url:`https://apnews.com/news/brazil-election`},{title:`Right-wing Protesters Reject Election Results - BBC`,url:`https://bbc.com/news/world-latin-america`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`러시아와 우크라이나, 현 영토 기준 휴전 논의 돌입하나 난항 예상`,
  metrics:[`러시아 통제 우크라이나 영토 비율 약 18%`,`복구 필요한 에너지 인프라 피해액 1000억 달러 이상`],
  summary:`몇 년째 교착 상태에 빠진 러시아와 우크라이나 전쟁에서 전선 동결을 전제로 한 휴전 논의가 수면 위로 떠올랐습니다. 양측 모두 막대한 인명 피해와 무기 고갈을 겪으면서, 혹독한 겨울을 앞두고 에너지 인프라 타격 중단이 먼저 협상 테이블에 올랐습니다. 우크라이나 대통령은 현 전선을 기준으로 삼는 협상의 가능성을 처음으로 조심스럽게 시사했습니다. 그러나 영토 양보에 반발하는 내부의 강경 여론과 러시아의 무리한 요구가 팽팽하게 맞서 실질적인 타결은 쉽지 않은 상황입니다. 또한 서방 국가들의 대외 지원 기조가 흔들리는 가운데 유럽이 독자적인 안보 지원을 어떻게 유지할 것인지도 주요 변수입니다. 동맹국들의 셈법이 엇갈리며 완전한 종전보다는 불안한 형태의 일시 정전이 될 가능성이 제기됩니다.`,
  keyTerms:[{term:`전선 동결`,explanation:`전쟁 당사국들이 평화협정을 맺지 않은 상태에서, 현재 군대가 대치하고 있는 선을 멈추고 더 이상 공격하지 않기로 임시 합의하는 것을 의미합니다.`}],
  history:`수년 전 발발한 전쟁이 장기 소모전으로 굳어지면서 양국은 경제적, 군사적 한계 상황에 직면해 있습니다.`,
  players:`영토 회복을 포기하기 힘든 우크라이나, 점령지를 기정사실화하려는 러시아, 그리고 확전을 막고 싶은 서방 국가들입니다.`,
  current:`당장의 거대한 확전보다는 다가오는 겨울철 전력망 붕괴 등 인도적 재난을 막기 위한 부분적 협상부터 시도되고 있습니다.`,
  outlook:`향후 중재국을 통한 비밀 회담 결과에 따라 올겨울 대규모 교전이 일어날지 여부가 결정될 것으로 보입니다.`,
  sources:[{title:`Ukraine, Russia Weigh Frozen Conflict Scenario - Reuters`,url:`https://reuters.com/news/ukraine-russia`},{title:`Hints at Ceasefire Based on Current Lines - BBC`,url:`https://bbc.com/news/world-europe`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`생성형 기술 악용 개인정보 해킹, 800만 건 유출 사태로 발칵`,
  metrics:[`탈취된 개인정보 800만 건 이상`,`피해 병원 및 학원 전산망 90여 곳`],
  summary:`일반인이 새로운 정보 생성 기술을 범죄에 악용하여 무려 800만 건 이상의 개인정보를 털어낸 해킹 일당이 경찰에 붙잡혔습니다. 이들은 프로그래밍 전문 지식이 없었으나, 최신 도구를 이용해 국내 병원과 학원 90여 곳의 전산망에서 보안 취약점을 자동으로 탐색하는 악성 코드를 만들었습니다. 탈취된 데이터는 이름, 연락처는 물론 민감한 진료 기록까지 포함되어 충격을 주고 있습니다. 정부와 인터넷진흥원은 즉각 민관합동조사단을 꾸려 피해 규모를 파악하고 전국의 영세 서버 관리자들에게 사이버 위기경보를 상향 발령했습니다. 혁신적인 기술의 발전이 사이버 범죄의 진입 장벽을 극단적으로 낮추는 부작용이 현실화된 것입니다. 보안 업계는 기존 백신 중심의 방어를 넘어 새로운 보안 체계 구축이 시급하다고 경고합니다.`,
  keyTerms:[{term:`보안 취약점`,explanation:`컴퓨터 시스템이나 소프트웨어에 존재하는 빈틈이나 결함으로, 해커들이 이를 통해 시스템에 침투하거나 정보를 빼내게 됩니다.`}],
  history:`과거 해킹은 고도의 기술을 가진 조직의 전유물이었으나, 최근 코딩을 도와주는 자동화 도구가 대중화되면서 범죄의 양상이 바뀌었습니다.`,
  players:`전문 지식 없이 도구를 흉기로 쓴 범죄자들과, 낡은 전산망을 쓰는 영세 학원, 이를 막아야 할 보안 당국입니다.`,
  current:`탈취된 개인정보가 어둠의 경로를 통해 금융 사기 등 2차 범죄에 활용될 위험이 매우 높은 상황입니다.`,
  outlook:`정부의 정보보호법 강화와 더불어, 기술 기업들이 악성 코드 생성 요청을 원천 차단하는 기술적 가이드라인 제정이 강제될 전망입니다.`,
  sources:[{title:`해킹 자동화로 800만명 개인정보 털렸다 - 매일경제`,url:`https://mk.co.kr/news/it1`},{title:`합동조사단, 악용 해킹 정밀조사 착수 - 중앙일보`,url:`https://joongang.co.kr/news/it2`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`한국 첫 우주쓰레기 청소위성 본격 조립, 우주 비즈니스 시동`,
  metrics:[`지구 궤도 내 위험 파편 10cm 이상 3만 개`,`정부 우주 개발 예산 전년 대비 15% 징가`],
  summary:`한국이 독자 개발 중인 첫 우주쓰레기 청소위성이 설계 단계를 마치고 본격적인 조립에 착수했습니다. 지구 저궤도에 버려진 고장 난 위성과 발사체 잔해를 포획해 대기권으로 끌어들여 불태우는 임무를 수행할 예정입니다. 최근 상업용 통신망 구축 등을 위해 저궤도 위성 발사가 급증하면서 위험한 우주 파편이 3만 개를 넘어서며 충돌 위험이 심각해졌습니다. 이에 따라 우주 쓰레기 처리 기술은 단순한 환경 보호를 넘어 막대한 부가가치를 창출하는 미래 우주 비즈니스의 핵심으로 떠올랐습니다. 국내 스타트업들과 투자사들도 궤도 상의 자율운항 데이터센터 등 파생 산업에 앞다퉈 자본을 투입하고 있습니다. 정부는 성공적인 청소위성 발사를 기점으로 글로벌 우주 환경 관리 시장에서 선도적인 위치를 확보하겠다는 계획입니다.`,
  keyTerms:[{term:`저궤도 위성`,explanation:`지구와 비교적 가까운 고도인 500에서 2000킬로미터 상공을 도는 인공위성으로, 통신 지연이 적어 초고속 인터넷망 구축 등에 수천 개씩 쓰입니다.`}],
  history:`인류의 우주 개발 반세기가 지나면서 버려진 파편들이 점차 쌓여 멀쩡한 위성이나 우주정거장을 위협하는 상황이 되었습니다.`,
  players:`로봇 팔과 그물망 기술을 개발하는 한국 우주항공청 및 관련 기업들과 상업적 기회를 노리는 투자사들입니다.`,
  current:`파편 충돌이 실존하는 위협으로 다가오면서 국제사회의 규제 움직임과 맞물려 청소 기술 수요가 폭발하고 있습니다.`,
  outlook:`몇 년 내 첫 실증 위성이 발사되어 실제 궤도에서 잔해물을 포획하는 데 성공한다면 우주 산업의 판도가 크게 바뀔 것입니다.`,
  sources:[{title:`한국형 우주 청소부 뜬다, 청소위성 조립 착수 - SBS`,url:`https://sbs.co.kr/news/science1`},{title:`우주쓰레기 제거, 돈 되는 비즈니스로 뜬다 - 한국경제`,url:`https://hankyung.com/news/science2`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`양자 컴퓨터 난제 극복, 실리콘 기반 동시 제어 돌파구 확보`,
  metrics:[`동시 연산 정확도 99.9% 도달`,`독립형 초정밀 원자핵 시계 기술 세계 최초 시연`],
  summary:`미래 컴퓨팅의 판도를 바꿀 양자 컴퓨터 개발에서 가장 큰 난제로 꼽히던 오류 통제 기술에 중대한 돌파구가 마련되었습니다. 글로벌 연구진이 기존 반도체 공정에 쓰이는 실리콘 기반 소자 여러 개를 높은 정확도로 동시에 구동하는 데 성공한 것입니다. 기존의 초전도 방식은 극저온 환경이 필수적이고 확장이 매우 어려웠으나, 새로운 기술은 기존 반도체 제조 시설을 활용할 수 있어 상용화 시기를 크게 앞당길 수 있습니다. 이번 연산 정확도 99.9% 달성은 의미 있는 큐비트 제어가 가능해졌음을 보여주는 쾌거로 평가받습니다. 이와 함께 세계 최초의 독립형 원자핵 시계 기술까지 시연되면서 초정밀 물리 측정의 새 장이 열렸습니다. 미래 기술이 실험실을 벗어나 신약 개발이나 차세대 암호 해독 등 실제 산업에 적용될 날이 임박했다는 기대감이 커지고 있습니다.`,
  keyTerms:[{term:`큐비트`,explanation:`일반 컴퓨터가 0 또는 1로 정보를 처리하는 비트와 달리, 0과 1이 동시에 겹쳐있는 상태를 이용해 정보를 기하급수적으로 빠르게 처리하는 차세대 컴퓨터의 기본 단위입니다.`}],
  history:`차세대 컴퓨팅은 계산 능력은 압도적이지만 주변 환경에 너무 민감해 오류가 쉽게 발생하여, 연산 소자 수를 늘리면서도 정확도를 유지하는 것이 십수 년간 최대 난제였습니다.`,
  players:`기술 패권을 놓고 경쟁하는 거대 기술 기업들과 기초과학 연구를 주도하는 글로벌 대학 연합 연구진입니다.`,
  current:`상용화의 가장 큰 허들이었던 대규모 확장의 가능성을 범용 소재인 실리콘을 통해 입증했다는 데 큰 의의가 있습니다.`,
  outlook:`향후 수백, 수천 개의 소자를 연결하는 후속 연구가 급물살을 타며 글로벌 기술 패권 경쟁이 더욱 치열해질 것입니다.`,
  sources:[{title:`Breakthrough in Silicon Control - ScienceDaily`,url:`https://sciencedaily.com/news/quantum`},{title:`Next Gen Computing Edges Closer to Reality - CNET`,url:`https://cnet.com/tech/quantum`}]
}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국 경상수지 흑자 세계 2위 달성… 반도체 호황이 견인`,
  metrics:[`경상수지 흑자 세계 2위`,`기준금리 3.00% 동결`],
  summary:`한국 경제가 글로벌 AI 수요 급증과 반도체 수출 호조에 힘입어 대규모 경상수지 흑자를 기록했습니다. 특히 분기 기준 흑자 규모가 독일과 일본을 추월하며 세계 2위 수준까지 올라섰습니다. 이는 우리 경제의 수출 경쟁력이 여전히 건재함을 보여줍니다. 하지만 동시에 반도체 쏠림 현상에 대한 우려도 함께 커지고 있습니다. 수출 지표는 강력한 반면, 고금리 지속에 따른 원리금 상환 부담으로 자영업 및 민간 소비 등 내수 회복세는 여전히 더딘 양극화 양상이 나타나고 있습니다. 한편 한국은행은 물가 상승 압력 완화와 내수 경기 영향을 지켜보기 위해 기준금리를 3.00% 수준에서 동결했습니다.`,
  keyTerms:[{term:`경상수지`,explanation:`국가 간 상품, 서비스 등을 사고판 결과를 종합한 수치로, 한 나라의 경제 건전성을 평가하는 핵심 지표입니다.`}],
  history:`한국은 과거 제조업 기반 수출로 성장해왔으며, 최근 수년간 반도체가 전체 수출의 절대적인 비중을 차지해왔습니다. 글로벌 IT 경기에 따라 흑자와 적자를 오가는 구조적 특징을 지니고 있습니다.`,
  players:`글로벌 빅테크 기업(AI 칩 수요처), 한국은행(통화정책 결정), 주요 반도체 수출 기업들.`,
  current:`AI 인프라 투자 열풍으로 반도체 수요가 폭증하면서 수출과 수지의 가파른 회복을 이끌고 있는 변곡점입니다.`,
  outlook:`글로벌 지정학적 불확실성과 내수 침체가 맞물린 상황에서 반도체 의존도를 넘어서는 새로운 수출 동력 발굴 여부가 주목됩니다.`,
  sources:[{title:`반도체 훈풍에 경상수지 흑자 세계 2위 - 연합뉴스`,url:`https://www.yna.co.kr/view/AKR20261025000100001`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`가상자산 소득 과세 유예 연장 검토… 투자 시장 위축 우려 반영`,
  metrics:[`과세 2년 유예 검토`,`2030세대 투자자 반발 여론`],
  summary:`정부와 정치권에서 가상자산 소득 과세 유예를 연장하는 방안을 신중하게 검토하고 있습니다. 투자 심리가 위축된 현 시장 상황과 주요 투자층인 2030 세대의 반발 여론 등을 종합적으로 고려한 조치로 풀이됩니다. 현재 과세 시점과 가이드라인을 두고 정부와 업계 간의 의견 수렴 및 제도 정비 논의가 활발히 진행 중입니다. 과세 인프라가 아직 완벽히 갖춰지지 않았다는 업계의 지적도 유예론에 힘을 싣고 있습니다. 향후 국회 논의 과정에서 최종적인 과세 시기가 확정될 것으로 보입니다.`,
  keyTerms:[{term:`가상자산 소득 과세`,explanation:`코인 등 가상자산을 거래하여 얻은 수익에 대해 세금을 부과하는 제도로, 과세 인프라와 형평성 문제로 시행 시기가 계속 논의되고 있습니다.`}],
  history:`가상자산 시장이 급성장하면서 소득이 있는 곳에 세금이 있다는 원칙에 따라 과세가 추진되었으나, 과세 인프라 부족과 반발로 수차례 연기되어 왔습니다.`,
  players:`기획재정부(과세 주체), 여야 정치권(입법), 가상자산 거래소 및 개인 투자자들.`,
  current:`과세 시행이 코앞으로 다가온 시점에서 시장 침체 우려와 표심을 의식한 정치권의 유예 주장이 다시 힘을 얻고 있습니다.`,
  outlook:`정기 국회에서 세법 개정안을 다룰 때 유예 기간이 최종 합의될지, 아니면 예정대로 시행될지 관심이 쏠립니다.`,
  sources:[{title:`코인 과세 또 미루나… 정치권 유예 저울질 - 매일경제`,url:`https://www.mk.co.kr/news/economy/202610250002`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미 연준 기준금리 동결 전망 우세 속 고금리 장기화 경계감 지속`,
  metrics:[`미 국채 금리 상승`,`국제 유가 배럴당 80달러 돌파`],
  summary:`미국 연방준비제도(Fed)의 통화정책 회의를 앞두고 기준금리 동결 전망이 지배적입니다. 끈적한 인플레이션과 중동 정세 불안으로 인한 국제 유가 변동성이 겹치면서, 고금리 장기화 기조가 상당 기간 유지될 것이라는 경계감이 시장에 확산되고 있습니다. 유럽중앙은행(ECB) 역시 경기 둔화 리스크를 감안해 관망세를 유지하는 분위기입니다. 반면 일본은행(BOJ)은 물가 지표 강세에 따라 점진적 금리 인상 기조를 저울질하고 있어 글로벌 통화정책의 탈동조화 현상이 관찰됩니다. 글로벌 증시는 빅테크 투자 기대감과 거시경제 불확실성이 팽팽하게 맞서며 혼조세를 보이고 있습니다.`,
  keyTerms:[{term:`고금리 장기화`,explanation:`물가를 잡기 위해 올린 높은 금리를 예상보다 훨씬 긴 기간 동안 내리지 않고 유지하는 통화정책 방향을 뜻합니다.`}],
  history:`코로나19 이후 촉발된 전 세계적 인플레이션에 대응해 미 연준은 공격적으로 금리를 인상해왔으며, 최근 인하 기대감이 번졌으나 물가가 쉽게 잡히지 않아 제동이 걸렸습니다.`,
  players:`미국 연방준비제도(Fed), 유럽중앙은행(ECB), 일본은행(BOJ), 글로벌 기관투자자들.`,
  current:`중동 불안으로 인한 유가 상승이 물가 상승 압력을 재점화하면서, 중앙은행들이 금리를 섣불리 내리지 못하는 딜레마에 빠져 있습니다.`,
  outlook:`향후 발표될 미국의 소비자물가지수(CPI) 및 고용 지표에 따라 연말~내년 초 연준의 금리 인하 경로가 다시 수정될 전망입니다.`,
  sources:[{title:`커지는 고금리 장기화 공포… 글로벌 증시 혼조 - 한국경제`,url:`https://www.hankyung.com/economy/article/202610250003`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`국정감사 마지막 주 종합감사 돌입… 오세훈 무죄 판결 여파로 여야 공방 격화`,
  metrics:[`상임위 종합감사 진행`,`장동혁 대표 426일 최장수`],
  summary:`제22대 국회 국정감사가 마지막 주에 접어들며 법사위, 국방위 등 주요 상임위에서 종합 국정감사가 진행되고 있습니다. 여야는 핵심 쟁점을 두고 마지막까지 치열한 공방전을 벌이고 있습니다. 특히 최근 오세훈 서울시장의 정치자금법 위반 항소심 무죄 선고 이후, 야권 내에서 대법원장 탄핵 또는 국정조사를 추진하려는 움직임이 일면서 갈등이 최고조에 달했습니다. 이에 대해 여당과 일부 야당은 사법부 흔들기라며 강하게 반발하며 사안별 공조 가능성을 내비치고 있습니다. 얽히고설킨 정국 속에서 각 당 지도부는 국감 마무리 전략과 향후 입법 과제 주도권 잡기에 총력을 기울이고 있습니다.`,
  keyTerms:[{term:`종합 국정감사`,explanation:`국회가 국정 전반에 대해 실시하는 감사의 마지막 단계로, 그동안 제기된 쟁점들을 총망라하여 해당 부처 장관 등을 상대로 최종 질의를 하는 과정입니다.`}],
  history:`매년 가을 열리는 정기 국회의 꽃인 국정감사는 여야가 정국 주도권을 잡기 위해 치열하게 대립하는 정치적 전쟁터 역할을 해왔습니다.`,
  players:`여당(국민의힘), 제1야당(더불어민주당), 기타 야당(개혁신당 등), 주요 피감기관 및 사법부.`,
  current:`주요 정치인들에 대한 사법부의 판결이 연달아 나오면서, 입법부와 사법부 간의 긴장감이 국정감사 이슈를 덮는 양상으로 전개되고 있습니다.`,
  outlook:`종합 국정감사가 마무리된 이후 국회는 예산안 심사와 쟁점 법안 처리를 위한 입법 전쟁 체제로 즉각 전환될 예정입니다.`,
  sources:[{title:`마지막 주 국감 돌입… 사법부 충돌 쟁점 부상 - KBS`,url:`https://news.kbs.co.kr/news/view.do?ncd=202610250004`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`우크라이나-러시아 장거리 공방 지속 속 미국·UAE 중재로 포로 교환 성사`,
  metrics:[`포로 수십 명 맞교환`,`인프라 공습 피해 확산`],
  summary:`러시아가 우크라이나의 에너지 인프라와 주요 도시를 향해 대규모 드론 및 미사일 공습을 가하고, 우크라이나 역시 러시아 본토의 정제시설을 장거리 드론으로 타격하며 팽팽한 전선 공방이 계속되고 있습니다. 전황이 격화되는 와중에도 미국과 아랍에미리트(UAE)의 중재로 양국 간 포로 교환이 성사되었습니다. 일부 교전 지역에서는 제한적인 인도적 휴전마저 논의되며 대화의 불씨를 살려가는 모습입니다. 차기 3자 회담 추진을 위한 특사 접촉이 물밑에서 이어지고 있지만, 영토 분할과 안보 보장이라는 핵심 조건에서 양측의 이견이 워낙 커 극적인 타결까지는 난항이 예상됩니다.`,
  keyTerms:[{term:`인도적 휴전`,explanation:`전쟁 중 민간인 구호, 포로 교환, 부상자 치료 등 인도주의적 목적을 달성하기 위해 일시적으로 교전을 중단하는 것을 말합니다.`}],
  history:`2022년 러시아의 침공으로 시작된 전쟁이 수년째 교착 상태에 빠지면서 양국 모두 막대한 인명과 경제적 피해를 입고 있습니다.`,
  players:`우크라이나 정부, 러시아 정부, 미국(서방 지원국), 아랍에미리트(중재국).`,
  current:`겨울을 앞두고 러시아가 우크라이나의 난방 및 전력망을 집요하게 파괴하는 전략을 구사하는 가운데 막후 외교가 병행되는 상황입니다.`,
  outlook:`서방의 무기 지원 속도와 양국의 내부 정치 상황에 따라 올 겨울 전황과 향후 평화 협상의 본격적 재개 여부가 결정될 것으로 보입니다.`,
  sources:[{title:`우크라-러 팽팽한 공방 속 일부 포로 맞교환 - SBS`,url:`https://news.sbs.co.kr/news/endPage.do?news_id=N202610250005`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`전면전 위기 속 미·이란 간접 메시지 교환… 후티 반군 공격으로 홍해 불안 장기화`,
  metrics:[`홍해 물동량 지속 감소`,`이란과 이스라엘 대립 격화`],
  summary:`이스라엘과 이란 대리세력 간의 충돌로 중동 전역에 전면전 위기가 고조되고 있으나, 미국과 이란이 제3국 중재자를 통한 막후 외교를 벌이며 대규모 충돌은 억제하는 모양새입니다. 이스라엘은 총선 정국 속에서도 강경 노선을 유지하며 가자지구 및 레바논 남부 국경 지역에서 작전을 병행하고 있습니다. 한편 예멘의 후티 반군이 사우디 공항과 주요 해상 거점을 공격하고 다국적 연합군이 보복 공습에 나서면서 홍해 항로의 안보 불안이 장기화되고 있습니다. 복잡하게 얽힌 지정학적 리스크가 글로벌 물류와 유가에 직접적인 타격을 주고 있는 상황입니다.`,
  keyTerms:[{term:`막후 외교`,explanation:`공식적이고 공개적인 외교 채널 대신, 비밀리에 제3자나 비공식 통로를 이용해 상대국과 협상이나 의사를 타진하는 활동입니다.`}],
  history:`이스라엘과 하마스 간의 분쟁이 레바논 헤즈볼라, 예멘 후티 반군 등 이란의 지원을 받는 저항의 축 전체로 확전되며 역내 위기가 극에 달했습니다.`,
  players:`미국 정부, 이스라엘 정부, 이란 정부 및 연계 무장세력(후티 반군, 헤즈볼라 등).`,
  current:`서로에 대한 군사적 보복이 꼬리를 물고 이어지면서, 확전을 원치 않는 강대국들이 억제력을 발휘하려 애쓰는 아슬아슬한 균형 상태입니다.`,
  outlook:`이스라엘의 내부 정치적 판단과 이란의 보복 수위에 따라 언제든 국지전이 중동 전체를 휩쓰는 전면전으로 비화할 뇌관이 남아 있습니다.`,
  sources:[{title:`불안한 중동… 미-이란 확전 막으려 비공식 채널 가동 - 조선일보`,url:`https://www.chosun.com/politics/202610250006`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`고령 택시기사 교통사고율 최근 10년간 급증… 면허 관리 체계 도마 위`,
  metrics:[`65세 이상 사고율 증가`,`고령 운전자 비중 30% 돌파`],
  summary:`전체적인 택시 교통사고 건수는 감소하는 추세지만, 65세 이상 고령 택시기사가 낸 사고율은 최근 10년간 큰 폭으로 증가해 사회적 우려를 낳고 있습니다. 급발진 의혹이나 반응 속도 저하로 인한 대형 사고가 연이어 발생하면서 시민들의 불안감이 커지고 있습니다. 이에 따라 여객운수종사자의 고령 운전자 면허 관리 체계를 더 엄격하게 개편해야 한다는 목소리가 높아지고 있습니다. 정부와 지자체는 조건부 면허 도입이나 비상자동제동장치 장착 의무화 등 다양한 안전 대책 마련을 서두르고 있으나 생업 유지라는 현실적 문제와 부딪혀 진통을 겪고 있습니다.`,
  keyTerms:[{term:`고령 운전자 면허 관리`,explanation:`나이가 들어 인지 및 신체 능력이 저하된 운전자의 교통사고 예방을 위해, 적성 검사를 강화하거나 야간 운전을 제한하는 등의 제도적 관리를 뜻합니다.`}],
  history:`초고령사회 진입과 함께 생업을 위해 운전대를 잡는 고령자가 늘어났고, 이와 비례해 고령 운전자 유발 교통사고 비율도 지속적으로 상승해왔습니다.`,
  players:`고령 택시 운수종사자, 국토교통부 및 경찰청(면허 및 안전 담당), 일반 시민 및 승객들.`,
  current:`최근 도심 한복판에서 고령 운전자로 인한 다수 사상자 발생 사고가 잇따르며 여론이 악화되어 제도 개선의 압박이 거세지고 있습니다.`,
  outlook:`이동권 및 생존권 보장과 시민 안전 사이의 타협점으로서 첨단 운전자 보조 시스템(ADAS) 지원 확대 등 기술적 보완책이 병행될 것으로 예상됩니다.`,
  sources:[{title:`늘어나는 고령 운전자 사고… 딜레마 빠진 면허 갱신 제도 - 중앙일보`,url:`https://www.joongang.co.kr/article/202610250007`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`생성형 AI 전력 폭증에 빅테크들 SMR(소형 모듈 원자로) 확보전 돌입`,
  metrics:[`데이터센터 전력 소모 폭증`,`원전 스타트업 투자 급증`],
  summary:`고성능 생성형 AI 모델의 운영과 학습에 필요한 전력 소모량이 폭증하면서, 글로벌 빅테크 기업들이 차세대 에너지원으로 소형 모듈 원자로에 눈을 돌리고 있습니다. 기존 신재생에너지로는 데이터센터의 엄청난 기저 부하를 감당하기 어렵다고 판단해 무탄소 전력망 확보에 직접 뛰어든 것입니다. 마이크로소프트, 구글 등 주요 기업들은 원전 스타트업에 대규모 투자를 단행하며 전력 공급망의 획기적인 변화를 예고하고 있습니다. 이는 단순한 비용 절감을 넘어 탄소 배출 규제를 준수하고 지속 가능한 AI 인프라 주도권을 쥐기 위한 치열한 생존 경쟁으로 풀이됩니다.`,
  keyTerms:[{term:`소형 모듈 원자로`,explanation:`기존 대형 원전보다 크기가 훨씬 작아 공장에서 부품을 생산해 조립할 수 있으며, 건설 비용이 저렴하고 안전성이 높은 차세대 소형 원자력 발전소입니다.`}],
  history:`과거 안전성 문제로 배척받던 원자력이 탄소 중립 시대를 맞아 깨끗한 에너지원으로 재평가되기 시작했고, SMR 기술이 구체화되면서 상용화 논의가 급물살을 탔습니다.`,
  players:`글로벌 빅테크(구글, MS, 아마존 등), SMR 개발 스타트업 및 원전 기술 기업, 각국 에너지 규제 당국.`,
  current:`폭발적으로 증가하는 AI 데이터센터의 전력 수요를 충당하기 위해 IT 기업들이 이례적으로 원자력 발전소 전력을 입도선매하는 계약을 속속 맺고 있습니다.`,
  outlook:`SMR 기술의 실제 상용화 성공 여부와 지역 주민들의 수용성, 그리고 규제 당국의 안전성 승인 속도가 향후 기술 확산의 성패를 가를 것입니다.`,
  sources:[{title:`AI 전력 먹는 하마… 빅테크 원전 기술 투자 사활 - 매일경제`,url:`https://www.mk.co.kr/news/it/202610250008`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`우주에서 탄소 배출원 잡는다… 위성 기반 초정밀 온실가스 모니터링 도입`,
  metrics:[`이산화탄소·메탄 정밀 관측`,`실시간 기후 감시 정확도 향상`],
  summary:`인공위성을 활용해 지구 전역의 이산화탄소와 메탄 배출원을 국소 단위로 추적하는 초정밀 온실가스 모니터링 기술이 본격적으로 기후 감시에 도입되었습니다. 기존 지상 관측망이 가지던 공간적 한계를 극복하고, 개별 공장이나 파이프라인에서 새어나오는 배출량까지 실시간으로 파악할 수 있게 된 것입니다. 이 기술의 도입으로 각국의 탄소 감축 목표 이행 여부를 투명하게 감시할 수 있는 강력한 수단이 마련되었습니다. 전 세계 과학계와 환경 단체들은 이 데이터가 향후 기후 협약 및 탄소세 부과 등 환경 정책 입안에 결정적인 과학적 근거가 될 것으로 기대하고 있습니다.`,
  keyTerms:[{term:`초정밀 온실가스 모니터링`,explanation:`고성능 인공위성 센서를 통해 우주에서 특정 지역이나 시설 단위로 배출되는 이산화탄소와 메탄의 양을 매우 정확하게 실시간으로 측정하는 기술입니다.`}],
  history:`기후 변화 대응을 위해 탄소 배출량 측정이 중요해졌으나, 각국이 제출하는 자체 통계에 의존해야만 했던 과거 방식은 신뢰성에 잦은 의문이 제기되었습니다.`,
  players:`우주 및 기후 기술 기업, 유엔(UN) 등 국제 환경 감시 기구, 탄소를 배출하는 각국 정부 및 대형 산업 시설들.`,
  current:`인공위성 탑재 센서 기술과 데이터 분석 AI의 발달로 눈에 보이지 않는 온실가스 누출을 구글 지도처럼 정밀하게 찾아내는 것이 가능해졌습니다.`,
  outlook:`투명한 배출량 공개로 인해 글로벌 기업들의 환경 세금 부담이 현실화될 수 있으며, 국가 간 기후 협상에서 이 위성 데이터가 핵심 잣대로 쓰일 전망입니다.`,
  sources:[{title:`우주에서 감시하는 탄소 배출… 기후 위기 대응 새 국면 - 동아일보`,url:`https://www.donga.com/news/It/article/all/202610250009`}]
}]

  colorBg:`#e8f0fe`,
  headline:`SK하이닉스, 자회사 솔리다임 미국 나스닥 상장 추진 전격 철회`,
  metrics:[`약 40조 원 규모 솔리다임 기업가치 재평가 대기`,`SK하이닉스 주가 장중 약 2.5% 상승`],
  summary:`SK하이닉스가 자회사 솔리다임의 미국 나스닥 상장(IPO) 및 프리IPO 추진 검토를 전격 중단한다고 공시했습니다. 당초 미국 낸드플래시 시장 공략을 위해 자금 조달을 목표로 상장을 추진했으나, 모회사 주주가치를 훼손하는 쪼개기 상장 논란이 거세지자 이를 철회한 것입니다. 금융당국의 엄격해진 중복 상장 규제 기조도 이번 결정에 큰 영향을 미친 것으로 보입니다. 이번 결정으로 기존 주주들의 지분 희석 우려가 해소되면서 단기적으로 주가는 반등하는 모습을 보였습니다. 다만, 향후 수십조 원 단위의 미국 공장 증설과 AI 반도체 투자를 이어가기 위해서는 새로운 자금 조달 플랜B 마련이 시급해진 상황입니다.`,
  keyTerms:[{term:`쪼개기 상장`,explanation:`핵심 사업부나 유망한 자회사를 별도의 회사로 분리해 주식 시장에 상장하는 것을 말합니다. 기존 모회사 주주의 가치가 훼손될 수 있어 논란이 됩니다.`}],
  history:`솔리다임은 인텔의 낸드 사업부를 인수해 출범한 자회사입니다. 최근 AI 수요 증가로 기업가치가 상승하며 상장 기대감이 컸습니다.`,
  players:`SK하이닉스와 금융당국, 그리고 주주가치 훼손을 우려하는 소액 주주들이 얽혀 있습니다.`,
  current:`금융당국의 제재 부담과 주주들의 반발을 수용해 상장을 전격 철회하며 시장의 불확실성을 일부 해소했습니다.`,
  outlook:`자체 현금 창출력과 외부 차입 등을 통해 미국 투자 자금을 어떻게 마련할지 향후 자금 조달 계획 발표가 주목받고 있습니다.`,
  sources:[{title:`SK하이닉스, 중복 상장 논란에 솔리다임 상장 철회 - 한국경제`,url:`https://www.hankyung.com/economy`},{title:`금융당국 제재 우려에 나스닥 상장 접은 SK - 동아일보`,url:`https://www.donga.com/news`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`정용진 신세계 회장, 13년 만에 이마트 대표이사 등기임원 전격 복귀`,
  metrics:[`2013년 이후 13년 만의 등기이사 복귀`,`40대 젊은 임원 30% 대거 발탁`],
  summary:`신세계그룹 정기 임원인사에서 정용진 회장이 핵심 계열사인 이마트의 대표이사로 전격 등판했습니다. 이는 2013년 등기이사직에서 물러난 이후 무려 13년 만의 복귀입니다. 최근 오프라인 유통 시장의 침체와 온라인 커머스 경쟁 격화로 인한 그룹 전체의 위기를 정면 돌파하겠다는 의지로 풀이됩니다. 특히 오너가 직접 경영 전면에 나서는 책임경영 기조를 명확히 하며, 위기 극복의 고삐를 죄고 있습니다. 동시에 40대 임원을 대거 발탁하여 조직에 젊은 피를 수혈하고 대대적인 체질 개선을 시도하고 있습니다.`,
  keyTerms:[{term:`책임경영`,explanation:`기업의 실질적 소유주나 최고 경영자가 경영 결과에 대해 법적, 도의적 책임을 지고 경영 전면에 나서는 것을 뜻합니다.`}],
  history:`정 회장은 과거 등기이사직에서 물러나 미등기 임원으로 활동해왔으나, 최근 실적 부진으로 리더십 변화 요구가 있었습니다.`,
  players:`정용진 회장 및 기존 김홍극 대표 등 신세계그룹 수뇌부와 유통 업계 경쟁자들이 주요 행위자입니다.`,
  current:`각자대표 체제를 통해 본업 경쟁력 강화와 신사업 동력 발굴을 동시에 추진하는 새로운 체제를 구축했습니다.`,
  outlook:`다가오는 연말 쇼핑 시즌과 내년 상반기 실적을 통해 오너 복귀의 성과와 체질 개선 효과가 입증될 수 있을지 주목됩니다.`,
  sources:[{title:`정용진 13년만의 귀환, 신세계 위기 돌파 특단 조치 - 중앙일보`,url:`https://joongang.co.kr/economy`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미 연준 금리 인하 속도 조절 시사에 미 국채 10년물 금리 5% 육박`,
  metrics:[`미 국채 10년물 금리 장중 4.95% 돌파`,`빅테크 AI 자본지출(CapEx) 회수 우려 부각`],
  summary:`미국의 견조한 경제 지표가 잇따라 발표되면서 연방준비제도(Fed)가 금리 인하 속도를 늦출 수 있다는 관측이 시장에 확산되고 있습니다. 이로 인해 글로벌 벤치마크 역할을 하는 미 국채 10년물 금리가 5% 선에 육박하며 크게 치솟았습니다. 고금리 장기화 우려 속에 글로벌 금융시장 전반의 경계감이 커지고 있습니다. 한편, 실적 발표를 앞둔 미국 빅테크 기업들이 AI 분야에 막대한 자본적 지출을 쏟아붓고 있지만, 실질적인 수익 회수 여부에 대한 의구심이 부각되며 투자 심리는 더욱 위축되었습니다. 결과적으로 안전자산 선호 현상이 짙어지며 기술주 중심의 주가 변동성이 확대되었습니다.`,
  keyTerms:[{term:`안전자산 선호`,explanation:`경제적, 정치적 불확실성이 커질 때 투자자들이 주식 등 위험자산을 팔고 국채나 금 등 비교적 안전한 자산으로 자금을 이동시키는 현상입니다.`}],
  history:`미 연준은 인플레이션 둔화 조짐에 따라 금리 인하 사이클을 준비해왔으나, 최근 고용과 소비 지표가 예상보다 강하게 나타났습니다.`,
  players:`미국 연방준비제도(Fed)와 월스트리트 투자자들, 그리고 거액의 투자를 단행하는 주요 빅테크 기업들이 핵심 주체입니다.`,
  current:`연준 인사들의 매파적 발언과 빅테크 실적 불안감이 겹치며 시장 금리가 급등하고 투자자들은 짙은 관망세로 돌아섰습니다.`,
  outlook:`조만간 발표될 미국 핵심 물가지수와 대형 기술주들의 3분기 실적 발표 결과가 금리와 증시 방향성을 결정지을 것입니다.`,
  sources:[{title:`Fed 속도조절론에 요동치는 국채금리 - 한국경제`,url:`https://www.hankyung.com/finance`},{title:`빅테크 AI 투자 수익성 도마 위 - 매일경제`,url:`https://www.mk.co.kr/news`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`오세훈 서울시장 항소심 무죄 선고, 여야 정치권 대선 주도권 공방 격화`,
  metrics:[`1심 유죄 뒤집고 항소심 무죄 선고`,`여야 대변인 논평 등 하루 20여 건 쏟아져`],
  summary:`선거법 위반 혐의 등으로 기소되었던 오세훈 서울시장이 항소심 재판에서 무죄를 선고받았습니다. 1심의 판결을 뒤집은 이번 판결로 인해 오 시장은 자신을 옭아매던 법적 족쇄를 풀고 보수 진영 내 유력 대권 주자로서의 입지를 탄탄하게 굳히게 되었습니다. 여당은 즉각 사법부의 현명한 판단을 환영하며 정치적 탄압이 입증되었다고 목소리를 높였습니다. 반면, 야당은 이번 판결을 강하게 비판하며 대법원 상고를 포함한 추가적인 정치 공세 수위를 높이고 있습니다. 이로 인해 사법 리스크를 둘러싼 여야 간의 정쟁은 정기국회 막바지에 더욱 거세지고 있습니다.`,
  keyTerms:[{term:`사법 리스크`,explanation:`정치인이나 기업인이 재판, 수사 등 법적 문제에 휘말려 정치적 행보나 경영 활동에 부정적인 영향을 받는 위험을 의미합니다.`}],
  history:`오 시장은 과거 선거 과정에서의 발언과 관련해 공직선거법 위반 혐의로 기소되어 1심에서 유죄 판결을 받은 바 있습니다.`,
  players:`재판부, 오세훈 시장 측 변호인단, 그리고 주도권을 쥐려는 여야 정치권 핵심 인사들이 얽혀 있습니다.`,
  current:`항소심 무죄 선고 직후 오 시장의 정치적 운신 폭이 크게 넓어졌으며, 보수 진영 내 대권 경쟁 구도에도 지각변동이 일어났습니다.`,
  outlook:`검찰의 대법원 상고 여부와 최종 판결 결과가 남아 있으며, 이를 지렛대로 삼은 여야의 치열한 여론전이 계속될 전망입니다.`,
  sources:[{title:`오세훈 항소심서 무죄 반전... 대권 행보 날개 달았다 - 조선일보`,url:`https://chosun.com/politics`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`김정은 북한 국무위원장 중국 단둥 전격 방문, 북·중 밀착 행보 가속화`,
  metrics:[`중국 참전 기념일 앞두고 전격 회동`,`신규 북중 국경 교량 개통식 참석`],
  summary:`중국의 6·25 전쟁 참전 기념일을 앞두고 김정은 북한 국무위원장이 접경 도시인 중국 단둥을 전격 방문했습니다. 이번 방문은 새로 완공된 북·중 국경 교량 개통식에 맞춰 이루어졌으며, 중국 고위급 인사들과의 회동이 포함되었습니다. 최근 글로벌 제재가 지속되는 가운데 북한과 중국이 노골적인 밀착 행보를 과시하며 서방 진영을 압박하려는 의도로 분석됩니다. 국제사회는 이러한 움직임이 한반도를 둘러싼 신냉전 구도를 더욱 고착화시킬 수 있다고 우려하고 있습니다. 특히 러시아와의 군사 협력에 이어 중국과의 경제·외교적 유대까지 강화하면서 역내 안보 리스크가 급부상하고 있습니다.`,
  keyTerms:[{term:`신냉전 구도`,explanation:`과거 미국과 소련의 냉전처럼, 현재 미국 중심의 서방 세계와 중국·러시아 등 반서방 진영 간의 군사적, 경제적 대립이 심화되는 국제 질서를 뜻합니다.`}],
  history:`북한은 코로나19 이후 국경을 폐쇄했으나, 최근 러시아 및 중국과의 교류를 단계적으로 재개하며 진영 외교를 강화해왔습니다.`,
  players:`김정은 국무위원장과 중국 지도부, 그리고 이를 견제하는 한미일 외교·안보 당국이 주요 플레이어입니다.`,
  current:`북중 간 새로운 무역 통로 개통과 고위급 회담을 통해 양국은 경제적 상호 의존도와 군사적 연대를 공개적으로 선포했습니다.`,
  outlook:`이번 회동의 구체적인 경제 지원 합의 내용과 다가오는 주요 국제 회의에서 한미일 연합이 내놓을 대응 메시지에 관심이 쏠립니다.`,
  sources:[{title:`김정은, 단둥 깜짝 방문... 북중 혈맹 과시 - 연합뉴스`,url:`https://www.yna.co.kr/politics`},{title:`신냉전 고착화 우려 키우는 북중러 밀착 - 한겨레`,url:`https://www.hani.co.kr/politics`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`우크라이나-러시아 남부 올레시키 국지적 휴전 합의 및 대규모 포로 교환`,
  metrics:[`양측 270명씩 총 540명 군인 맞교환`,`10월 29일부터 임시 휴전 발효 예정`],
  summary:`기나긴 소모전이 이어지던 우크라이나 전쟁에서 남부 전선의 핵심 요충지인 올레시키 지역에 대해 임시 휴전이 성사되었습니다. 러시아와 우크라이나 양국은 민간인 대피와 인도적 구호품 전달을 목적으로 오는 29일부터 며칠간 국지적 휴전에 들어가기로 전격 합의했습니다. 이와 동시에 양측은 각각 270명씩, 총 540명의 군인을 돌려보내는 대규모 포로 교환도 단행했습니다. 비록 전면전 종식은 아니지만, 양국 간 소통 채널이 열리고 실질적인 군사 충돌 중단이 합의되었다는 점에서 외교적 돌파구 마련에 대한 기대감이 피어오르고 있습니다. 국제사회는 이번 조치가 평화 협상의 마중물이 되기를 희망하고 있습니다.`,
  keyTerms:[{term:`국지적 휴전`,explanation:`전쟁 전체를 멈추는 전면 휴전이 아니라, 특정한 제한된 지역이나 기간에 대해서만 일시적으로 교전을 중단하는 합의를 말합니다.`}],
  history:`우크라이나 남부 전선은 치열한 교전으로 수많은 민간인 사상자와 인프라 파괴가 발생하며 인도적 위기가 최고조에 달했던 곳입니다.`,
  players:`러시아와 우크라이나 정부 대표단, 그리고 중재에 나선 제3국 외교 채널들이 협상을 이끌었습니다.`,
  current:`포로들이 무사히 본국으로 송환되고 있으며, 휴전 발효를 앞두고 유엔 등 구호 단체들이 긴급 식량과 의약품 반입을 준비 중입니다.`,
  outlook:`임시 휴전이 성공적으로 유지될 경우, 이를 타 전선으로 확대하거나 정식 평화 회담으로 이어갈 수 있을지가 관건입니다.`,
  sources:[{title:`우크라-러, 남부 요충지서 임시 휴전 합의 - KBS 뉴스`,url:`https://news.kbs.co.kr/world`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`구형 PHP 치명적 제로데이 취약점 확인, 한국 정부 사이버위기 경보 단계 상향`,
  metrics:[`보안 위험도 9.2점 (10점 만점)`,`국내 수십만 개 웹사이트 잠재적 노출 위험`],
  summary:`서버 관리자의 별도 인증 없이도 원격에서 악성 명령을 실행할 수 있는 치명적인 PHP 보안 취약점이 확인되어 IT 업계에 비상이 걸렸습니다. 과학기술정보통신부와 한국인터넷진흥원은 사안의 심각성을 고려해 국가 사이버위기 경보를 즉각 격상했습니다. 이 취약점은 널리 쓰이는 구형 PHP 버전에 존재하여 공공기관 및 민간 웹사이트 수만 곳이 잠재적인 해킹 위협에 노출된 상태입니다. 정부는 즉각적인 보안 패치 적용과 서버 접근 제어 강화를 권고하는 긴급 대응 수칙을 발표했습니다. 민간 기업과 보안 당국은 대규모 데이터 유출 피해를 막기 위해 철야 대응 체제에 돌입했습니다.`,
  keyTerms:[{term:`사이버위기 경보`,explanation:`국가에 대한 사이버 공격 위협이 발생했을 때, 그 위험의 심각성에 따라 정상, 관심, 주의, 경계, 심각 5단계로 발령하는 예보 시스템입니다.`}],
  history:`PHP는 전 세계 웹사이트의 상당수를 구동하는 핵심 언어로, 이번과 같은 구조적 결함은 과거 대규모 해킹 사태의 원인이 되곤 했습니다.`,
  players:`취약점을 악용하려는 해킹 그룹, 방어에 나선 인터넷진흥원(KISA) 및 각 기업의 보안 담당자들이 대응 중입니다.`,
  current:`보안 당국을 중심으로 전국의 취약 서버 목록을 스캔하고 보안 업데이트를 독려하는 경고 안내문이 대대적으로 발송되고 있습니다.`,
  outlook:`미처 패치를 적용하지 못한 중소형 웹사이트를 노린 2차 해킹 공격 발생 여부와 추가적인 보안 취약점 발견 여부를 예의주시해야 합니다.`,
  sources:[{title:`최악의 PHP 취약점 발견... 보안 당국 긴급 패치 권고 - SBS 뉴스`,url:`https://news.sbs.co.kr/it`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`국산 AI로 상상력 활짝, 전국 어린이 AI 창작대회 본선 성황리 개최`,
  metrics:[`치열한 예선 뚫고 60개 초등학생 팀 본선 진출`,`국산 거대언어모델(LLM) 100% 활용 규정 적용`],
  summary:`과학기술정보통신부가 주최하는 전국 단위의 어린이 AI 창작대회 본선이 카카오 AI캠퍼스에서 성황리에 개최되었습니다. 이번 대회는 치열한 예선을 거쳐 선발된 전국의 초등학생 60개 팀이 참가해 국산 생성형 AI 툴을 활용하여 자신만의 창작물을 만드는 행사입니다. 아이들은 국내 기술로 개발된 거대언어모델을 이용해 동화, 동요, 웹툰 등 다양한 형태의 콘텐츠를 즉석에서 기획하고 제작했습니다. 어릴 때부터 AI 기술을 자연스럽게 접하고 윤리적으로 사용하는 AI 리터러시 교육의 일환으로 기획되어 큰 호응을 얻었습니다. 창의적인 아이디어와 최신 기술의 만남이 미래 세대의 역량을 엿볼 수 있는 무대가 되었습니다.`,
  keyTerms:[{term:`AI 리터러시`,explanation:`인공지능 기술의 원리와 한계를 이해하고, 이를 윤리적이고 비판적인 시각으로 일상과 업무에 효과적으로 활용할 수 있는 능력을 말합니다.`}],
  history:`생성형 AI가 대중화되면서, 교육 현장에서는 AI에 종속되지 않고 이를 도구로 활용하는 올바른 훈련의 필요성이 제기되어 왔습니다.`,
  players:`과기정통부, 국산 AI 개발사들, 그리고 상상력을 뽐내는 전국 초등학생 참가자들과 지도 교사들이 주역입니다.`,
  current:`본선 현장에서는 AI 프롬프트 엔지니어링 기술을 활용해 몇 번의 대화만으로 수준 높은 동화를 완성해 내는 참가자들의 실력이 돋보였습니다.`,
  outlook:`이번 대회를 계기로 공교육 정규 교과과정 내에 실습 위주의 AI 활용 프로그램을 확대 도입하는 방안이 탄력을 받을 전망입니다.`,
  sources:[{title:`어린이들이 만든 AI 웹툰, 창작대회 본선 뜨거운 열기 - 중앙일보`,url:`https://joongang.co.kr/society`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`프랑스 연금·예산 삭감 반대 40만 명 대규모 시위, 이탈리아 등 연쇄 혼란 우려`,
  metrics:[`프랑스 전역 주요 도시 40만 명 이상 집결`,`국가 재정 수백억 유로 삭감 예산안 반발`],
  summary:`만성적인 국가 부채 문제에 직면한 프랑스 정부가 강도 높은 재정 적자 감축을 위해 연금과 예산을 대폭 삭감하려 하자 전국이 마비되었습니다. 파리와 리옹 등 주요 도시에는 노동조합과 일반 시민 등 40만 명 이상이 거리로 쏟아져 나와 거센 반정부 시위를 벌였습니다. 일부 지역에서는 시위대와 경찰이 충돌하며 최루탄과 물대포가 동원되는 등 폭력 사태로 격화되는 양상을 보였습니다. 이웃한 이탈리아 역시 유사한 경제 위기를 겪고 있어 시위가 국경을 넘어 확산될 우려가 커지자, 밀란과 로마 등 주요 시설에 보안을 대폭 강화했습니다. 이번 사태는 재정 위기 극복이라는 명분과 민생 고통 사이에서 갈등하는 유럽의 현실을 극명히 보여줍니다.`,
  keyTerms:[{term:`재정 위기`,explanation:`국가가 거둬들이는 세금보다 지출이 지나치게 많아 정부 부채가 눈덩이처럼 불어나고, 빚을 갚을 능력을 상실할 위험에 처하는 경제적 상황입니다.`}],
  history:`프랑스 등 남유럽 주요 국가들은 고령화와 복지 지출 확대로 인해 장기간 막대한 재정 적자에 시달려 왔으며, 최근 신용평가사들의 경고를 받았습니다.`,
  players:`지출을 줄이려는 마크롱 프랑스 정부와 기득권 복지를 지키려는 노동조합 연합, 불안감에 휩싸인 이웃 국가들이 얽혀 있습니다.`,
  current:`의회 내 예산안 통과가 난항을 겪는 가운데 거리 시위가 장기 파업으로 번질 조짐을 보이며 대중교통과 물류 시스템이 차질을 빚고 있습니다.`,
  outlook:`시위의 폭력화 정도와 노사정 간 타협 여부에 따라 정부의 예산 삭감안 원안 통과 여부가 판가름 날 것이며, 유로존 경제에도 파장을 미칠 것입니다.`,
  sources:[{title:`예산 삭감 반발 프랑스 40만 명 시위... 불타는 파리 거리 - MBC 뉴스`,url:`https://imnews.imbc.com/world`}]
}]

  tag:`2026-10-24`,
  label:`2026년 10월 24일 (토)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`국제 유가 116달러 돌파와 인플레이션 재점화 우려로 뉴욕 증시가 650포인트 이상 급락했습니다.`,
  metrics:[`브렌트유 배럴당 116달러`,`미국 9월 PCE 예상치 3.7%`],
  summary:`최근 중동의 지정학적 갈등이 격화되면서 국제 원유 수급 불안이 심화되고 있습니다. 이로 인해 브렌트유가 배럴당 116달러 선을 돌파하며 2022년 이후 최고치를 기록했습니다. 에너지 가격 급등은 전반적인 물가 상승 압력으로 작용하고 있으며, 미국 9월 개인소비지출(PCE) 물가지수가 목표치를 크게 웃도는 3.7% 수준을 기록할 것으로 예상됩니다. 물가가 다시 오르면 연방준비제도의 금리 인하 계획에 차질이 생길 수 있다는 우려가 커졌습니다. 이러한 불안감이 반영되며 다우존스 지수가 650포인트 이상 하락하는 등 뉴욕 증시 전반이 큰 충격을 받았습니다.`,
  keyTerms:[{term:`개인소비지출(PCE) 물가지수`,explanation:`미국 연방준비제도가 물가 상승률을 파악할 때 가장 중요하게 보는 지표로, 소비자들이 물건을 살 때 실제로 체감하는 가격 변화를 보여줍니다.`}],
  history:`코로나19 팬데믹 이후 각국 중앙은행은 물가를 잡기 위해 고강도 긴축 정책을 펼쳐왔습니다. 최근 들어 물가 오름세가 꺾이며 금리 인하 기대감이 커지던 상황이었습니다.`,
  players:`미국 연방준비제도는 통화정책을 결정하며, 주요 산유국과 국제 에너지 시장 참여자들의 움직임이 유가에 직접적인 영향을 미치고 있습니다.`,
  current:`지정학적 리스크로 유가가 급등하면서 간신히 잡혀가던 물가가 다시 오를 수 있다는 공포가 금융시장을 덮치고 있습니다.`,
  outlook:`향후 발표될 미국의 실제 물가 지표와 주요 기술 기업들의 3분기 실적 발표 결과에 따라 증시의 변동성이 더욱 커질 수 있습니다.`,
  sources:[{title:`유가 급등 및 인플레이션 우려로 뉴욕 증시 급락 - Bloomberg`,url:`https://bloomberg.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`독일의 화학기업 바스프(BASF)가 경쟁사인 에보닉(Evonik)의 인수 제안가를 약 111억 유로로 대폭 상향했습니다.`,
  metrics:[`주당 제안가 24유로`,`총 기업가치 111억 8,000만 유로`],
  summary:`세계 최대 종합 화학기업 중 하나인 독일 바스프가 특수 화학 분야의 강자인 에보닉을 인수하기 위해 더욱 적극적으로 나서고 있습니다. 바스프는 에보닉의 주당 인수 제안가를 24유로로 상향 조정했으며, 이는 전체 기업가치로 환산하면 약 111억 8,000만 유로에 달하는 초대형 규모입니다. 최근 글로벌 화학 업계는 수요 부진과 비용 상승에 대응하기 위해 사업 구조 재편과 인수합병(M&A)을 통한 규모의 경제 확보를 시도하고 있습니다. 바스프의 이번 파격적인 제안은 핵심 사업의 포트폴리오를 고부가가치 제품 중심으로 재편하려는 강력한 의지로 풀이됩니다. 양사 간의 협상이 성사될 경우 유럽을 넘어 글로벌 화학 시장의 판도가 크게 요동칠 전망입니다.`,
  keyTerms:[{term:`인수합병(M&A)`,explanation:`어떤 기업이 다른 기업을 사들이거나 두 기업이 하나로 합쳐지는 것을 말하며, 시장 지배력을 강화하고 새로운 성장 동력을 확보하기 위해 사용됩니다.`}],
  history:`글로벌 화학 산업은 최근 수년간 에너지가 급등과 중국의 공격적인 설비 증설로 인해 수익성 악화라는 구조적인 위기에 직면해 왔습니다.`,
  players:`인수를 추진하는 바스프와 대상 기업인 에보닉, 그리고 독과점 문제를 심사하게 될 유럽연합 경쟁 당국이 핵심 주체입니다.`,
  current:`바스프가 기존보다 훨씬 높은 금액을 제시함에 따라 에보닉 이사회와 주주들이 어떤 반응을 보일지가 초미의 관심사로 떠올랐습니다.`,
  outlook:`양측의 인수 협상 타결 여부와 함께, 거래가 성사될 경우 각국의 엄격한 반독점 규제 심사를 무사히 통과할 수 있을지가 다음 관건입니다.`,
  sources:[{title:`독일 바스프, 에보닉 인수 제안가 상향 - Reuters`,url:`https://reuters.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`정부가 반도체 연구개발 인력에 대한 주 52시간 근무제 예외 법제화 대신 기존 특별연장근로 제도의 보완을 지시했습니다.`,
  metrics:[`반도체 연구개발(R&D) 인력`,`특별연장근로 인가 기간 연장 논의`],
  summary:`한국 정부가 국가 첨단전략산업인 반도체 분야의 경쟁력을 높이기 위해 근로시간 제도 개편을 논의하고 있습니다. 최근 열린 관련 회의에서 정부는 반도체 연구개발 인력들을 주 52시간 근무제의 적용 대상에서 아예 제외하는 새로운 법률을 만들기보다는, 기존 제도를 활용하는 방안을 먼저 검토하라고 지시했습니다. 구체적으로는 업무량이 몰릴 때 합법적으로 초과 근무를 할 수 있게 해주는 특별연장근로 제도의 인가 기간을 늘리거나 절차를 간소화하는 방향이 논의되고 있습니다. 재계는 글로벌 경쟁에서 뒤처지지 않으려면 완전한 법적 예외가 필요하다고 주장하지만, 노동계의 반발 등을 고려해 정부가 한발 물러선 것으로 해석됩니다. 이로써 단기적으로는 행정적인 규제 완화를 통해 기업들의 숨통을 틔워줄 것으로 보입니다.`,
  keyTerms:[{term:`특별연장근로`,explanation:`갑작스러운 업무 폭증이나 연구개발 등 특별한 사정이 발생했을 때, 정부의 허가를 받아 법정 근로시간을 넘겨 일할 수 있도록 허용해주는 제도입니다.`}],
  history:`근로자의 과로를 막기 위해 주 52시간 근무제가 도입되었으나, 집중적인 연구개발이 필요한 정보통신과 반도체 업계에서는 유연성이 부족하다는 불만이 꾸준히 제기되어 왔습니다.`,
  players:`제도 유연화를 요구하는 재계와 근로조건 악화를 우려하는 노동계, 그리고 제도를 조율해야 하는 정부와 국회가 얽혀 있습니다.`,
  current:`글로벌 반도체 패권 경쟁이 격화되면서 연구 인력의 근무 시간 제한이 국가 경쟁력 저하로 이어질 수 있다는 위기감이 커지고 있습니다.`,
  outlook:`특별연장근로 인가 요건 완화 등 정부의 시행령 개정 작업이 얼마나 속도감 있게 진행될지, 그리고 향후 완전한 예외를 위한 법 개정 논의가 이어질지 주목됩니다.`,
  sources:[{title:`반도체 주 52시간 예외, 새 제도 만들 필요 있나 - 조선일보`,url:`https://chosun.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`오세훈 서울시장이 여론조사비 대납 의혹과 관련된 정치자금법 위반 항소심에서 당선무효형을 깬 무죄를 선고받았습니다.`,
  metrics:[`1심 벌금 1,000만 원`,`2심 무죄(벌금 0원)`],
  summary:`오세훈 서울시장이 징역형이나 무거운 벌금형으로 인해 시장직을 잃을 뻔한 위기에서 극적으로 벗어났습니다. 서울고등법원은 23일 열린 정치자금법 위반 혐의 항소심에서 오 시장에게 무죄를 선고했습니다. 앞서 1심 재판부는 오 시장 측이 불법 여론조사 비용을 대납받았다는 의혹을 일부 인정하여 벌금 1,000만 원의 당선무효형을 내렸습니다. 그러나 2심 재판부는 이 사건의 핵심 관련자인 명태균 씨의 진술이 일관되지 않아 신빙성이 크게 부족하다고 판단하여 원심을 뒤집었습니다. 이번 판결로 오 시장은 정치적 족쇄를 풀고 시정에 전념할 수 있게 되었습니다. 동시에 보수 진영 내에서 그의 대권 행보와 정치적 입지도 한층 강화될 것이라는 평가가 나오고 있습니다.`,
  keyTerms:[{term:`당선무효형`,explanation:`공직선거법이나 정치자금법 등을 위반하여 일정 금액 이상의 벌금형이나 징역형이 확정될 경우, 선거 당선의 효력이 상실되어 그 직을 잃게 되는 형벌입니다.`}],
  history:`과거 선거 과정에서 여론조사 비용 대납 의혹이 불거지면서 오세훈 시장은 정치자금법 위반 혐의로 기소되어 오랜 기간 재판을 받아왔습니다.`,
  players:`혐의를 벗은 오세훈 서울시장과 의혹의 중심에 서 있는 관련자들, 그리고 유죄를 입증하려는 검찰 측이 주요 당사자입니다.`,
  current:`1심의 유죄 판결로 인해 정치적 생명이 위태로웠으나, 2심에서 무죄로 뒤집히면서 시장직 유지와 함께 차기 대권 주자로서의 행보에 탄력을 받게 되었습니다.`,
  outlook:`검찰이 항소심 결과에 불복하여 대법원에 상고할 가능성이 높기 때문에, 최종 판결이 나오기까지 법적 공방은 당분간 이어질 것으로 전망됩니다.`,
  sources:[{title:`오세훈 서울시장, 여론조사비 대납 의혹 2심 무죄 선고 - 연합뉴스`,url:`https://yna.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`국가정보원이 북한 김정은 국무위원장의 사망설을 공식 부인한 가운데, 북한 매체가 김 위원장의 군 행사 주재 소식을 전했습니다.`,
  metrics:[`공식 석상 등장 2일`,`조선인민군 제3차 중대장대회 주재`],
  summary:`최근 온라인 커뮤니티와 소셜 미디어를 중심으로 급격하게 퍼졌던 북한 김정은 국무위원장의 뇌출혈 사망설은 사실이 아닌 것으로 밝혀졌습니다. 국가정보원은 23일 이례적으로 입장을 내고 해당 소문에 대해 근거 없는 허위 사실이라고 일축했습니다. 이와 동시에 북한의 관영 매체들은 김정은 위원장이 22일과 23일 이틀에 걸쳐 평양에서 열린 조선인민군 제3차 중대장대회를 직접 주재했다고 24일 보도했습니다. 북한 매체에 따르면 김 위원장은 이 행사에서 군 지휘관들에게 임전태세를 완비할 것을 강력하게 주문하며 건재함을 과시했습니다. 한반도의 긴장 상황 속에서 불거진 북한 최고지도자의 건강 이상설은 단순한 해프닝으로 일단락되는 분위기입니다.`,
  keyTerms:[{term:`국가정보원`,explanation:`국가 안보와 관련된 국내외 정보 수집, 보안 및 범죄 수사를 총괄하는 대한민국의 최고 정보기관입니다.`}],
  history:`북한이라는 국가의 폐쇄적인 특성 때문에 과거에도 김정은 위원장을 비롯한 최고지도자들의 건강 이상설이나 사망설이 주기적으로 반복해서 등장해 왔습니다.`,
  players:`건강 이상설의 당사자인 북한 김정은 위원장과 대북 정보를 수집하고 분석하여 사실 여부를 확인하는 한국의 정보 당국이 핵심입니다.`,
  current:`가짜 뉴스가 확산되면서 불필요한 안보 불안이 조장될 수 있었으나, 정보 당국의 빠른 부인과 북한 매체의 보도로 혼란이 진화되었습니다.`,
  outlook:`김정은 위원장이 군사 행사에 등장하여 전면전 대비를 강조한 만큼, 향후 북한의 추가적인 무력시위나 도발 움직임에 대한 지속적인 감시가 필요합니다.`,
  sources:[{title:`국정원 김정은 사망설 허위, 군 중대장대회 지도 - 조선일보`,url:`https://chosun.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`마수드 페제시키안 이란 대통령이 다음 주 러시아를 방문해 블라디미르 푸틴 대통령과 전략적 협력을 논의합니다.`,
  metrics:[`페제시키안 취임 후 첫 방러`,`정상회담 1회 예정`],
  summary:`중동 지역의 긴장이 계속되는 가운데, 이란과 러시아의 밀착이 더욱 가속화되고 있습니다. 이란 외무부는 마수드 페제시키안 이란 대통령이 다음 주 러시아 모스크바를 공식 방문할 예정이라고 발표했습니다. 이번 일정은 페제시키안 대통령이 취임한 이후 처음으로 이루어지는 러시아 방문입니다. 그는 모스크바에서 블라디미르 푸틴 러시아 대통령과 정상회담을 열고 양국 간의 경제 및 군사 분야 협력을 깊이 있게 논의할 계획입니다. 두 국가는 현재 서방 세계의 강력한 경제 제재를 공통적으로 받고 있어, 이를 타개하기 위해 포괄적인 협력 체계를 구축하려 하고 있습니다. 이러한 이란과 러시아의 연대 강화는 글로벌 지정학적 갈등 구도에 새로운 변수로 작용할 전망입니다.`,
  keyTerms:[{term:`정상회담`,explanation:`두 개 이상 국가의 최고 지도자들이 직접 만나서 국가 간의 주요 현안을 논의하고 외교적인 합의를 이끌어내는 공식적인 회의입니다.`}],
  history:`러시아의 우크라이나 침공과 이란의 핵 개발 및 중동 내 무장단체 지원 등으로 인해 두 국가는 오랜 기간 미국 등 서방의 제재를 받아왔습니다.`,
  players:`반서방 연대의 중심축을 형성하고 있는 러시아의 푸틴 대통령과 이란의 페제시키안 대통령, 그리고 이를 견제하는 미국과 유럽 국가들입니다.`,
  current:`국제 사회의 고립을 피하고 경제적, 군사적 활로를 모색하기 위해 이란과 러시아가 서로를 핵심 파트너로 인식하며 밀착하고 있습니다.`,
  outlook:`이번 회담을 통해 무기 거래나 대규모 경제 협력 계약이 체결될 경우, 중동 및 동유럽 지역의 안보 지형에 상당한 파장을 일으킬 것으로 예상됩니다.`,
  sources:[{title:`이란 페제시키안 대통령, 차주 방러 예정 - 연합뉴스`,url:`https://yna.co.kr/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`삼성전자와 SK하이닉스가 기존 메모리를 넘어설 차세대 인공지능(AI) 반도체 기술 경쟁에 본격적으로 돌입했습니다.`,
  metrics:[`3D D램 적층 기술`,`대용량 고대역폭 낸드(HBF) 개발`],
  summary:`글로벌 반도체 시장을 주도하는 삼성전자와 SK하이닉스가 미래 인공지능 시대를 겨냥한 차세대 메모리 주도권 다툼을 치열하게 벌이고 있습니다. 현재는 고대역폭 메모리가 시장의 주력이지만, 양사는 이미 그 다음 단계를 준비 중입니다. 삼성전자는 서버를 거치지 않고 기기 자체에서 구동되는 온디바이스 AI 기기에 최적화된 새로운 솔루션 검증에 집중하고 있습니다. 반면 SK하이닉스는 연산 반도체 위에 직접 메모리를 쌓아 올리는 3D D램 기술과 저장 능력을 극대화한 고대역폭 낸드 개발에 속도를 내고 있습니다. 이러한 기술 혁신은 전력 소모는 줄이면서 데이터 처리 속도는 획기적으로 높이기 위한 필수적인 과정입니다. 두 한국 기업의 치열한 기술 개발은 향후 글로벌 AI 반도체 생태계의 발전 방향을 결정지을 핵심 요소가 될 것입니다.`,
  keyTerms:[{term:`온디바이스 AI`,explanation:`외부의 클라우드 서버에 연결하지 않고 스마트폰이나 컴퓨터 등 사용자의 기기 내부에서 인공지능 연산을 직접 처리하는 기술을 의미합니다.`}],
  history:`인공지능 모델이 급격히 거대해지면서, 막대한 양의 데이터를 빠르게 처리할 수 있는 고성능 메모리 반도체의 필요성이 그 어느 때보다 중요해졌습니다.`,
  players:`전 세계 메모리 반도체 시장을 선도하는 대한민국의 삼성전자와 SK하이닉스가 차세대 기술 표준을 선점하기 위해 치열하게 경쟁하고 있습니다.`,
  current:`기존의 메모리 기술력을 넘어서, 소비 전력을 줄이고 크기를 혁신할 수 있는 전혀 새로운 구조의 메모리 반도체 개발이 업계의 핵심 화두로 떠올랐습니다.`,
  outlook:`향후 수년 내에 양사가 개발 중인 차세대 메모리가 실제 상용화되어 스마트폰, 자율주행차, 첨단 서버 등 다양한 산업 분야에 본격적으로 탑재될 전망입니다.`,
  sources:[{title:`차세대 AI 메모리 경쟁 격화 - 연합뉴스`,url:`https://yna.co.kr/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`재생에너지의 날이 공식적인 법정기념일로 지정된 이후 처음으로 정부 주관의 공식 기념식이 열렸습니다.`,
  metrics:[`10월 23일 법정기념일`,`제1회 정부 주관 기념식`],
  summary:`기후 위기 대응과 탄소 중립 실현을 위한 상징적인 행사가 열렸습니다. 10월 23일 재생에너지의 날을 맞아 올해 처음으로 정부가 직접 주관하는 공식 기념식이 성대하게 개최되었습니다. 이 날은 최근 관련 규정이 개정되면서 국가가 인정하는 공식 법정기념일로 새롭게 지정되었습니다. 이번 기념식에서는 그동안 국내 산업 현장과 학계에서 신재생에너지 보급과 기술 개발에 힘써온 유공자들에게 정부 포상이 수여되었습니다. 정부는 이번 행사를 통해 친환경 에너지 전환에 대한 국가적인 의지를 대내외에 다시 한번 천명했습니다. 앞으로 이 기념일을 계기로 관련 산업에 대한 투자 확대와 국민적인 공감대 형성이 더욱 속도를 낼 것으로 기대됩니다.`,
  keyTerms:[{term:`신재생에너지`,explanation:`태양광, 풍력, 지열, 수력 등 시간이 지나도 고갈되지 않고 자연적으로 계속 보충되는 친환경적인 에너지를 통틀어 일컫는 말입니다.`}],
  history:`지구 온난화로 인한 기후 변화가 심각해지면서, 화석 연료를 대체할 깨끗한 에너지원의 개발과 보급은 전 세계적인 최우선 과제가 되었습니다.`,
  players:`에너지 정책을 수립하는 정부 부처와 관련 기술을 개발하는 친환경 에너지 기업 및 연구 기관들이 주도적인 역할을 하고 있습니다.`,
  current:`법정기념일 지정을 통해 국가 차원의 에너지 전환 목표를 확고히 하고, 산업계의 사기를 진작시키기 위한 제도적 기반이 새롭게 마련되었습니다.`,
  outlook:`정부의 적극적인 정책 지원을 바탕으로 태양광, 해상 풍력 등 다양한 친환경 에너지 인프라 구축 프로젝트가 전국적으로 속도를 낼 전망입니다.`,
  sources:[{title:`재생에너지의 날 첫 법정기념일 지정 및 기념식 - 전자신문`,url:`https://etnews.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`미국의 유력 인공지능 기업 앤트로픽이 유럽 기업들의 AI 도입을 돕기 위해 런던에 합작 컨설팅사를 세웁니다.`,
  metrics:[`유럽 기업 대상 AI 지원`,`전담 엔지니어 직접 파견`],
  summary:`글로벌 거대 인공지능 시장의 선두 주자 중 하나인 미국의 앤트로픽이 유럽 시장 공략에 본격적으로 나섰습니다. 앤트로픽은 영국 런던에 본사를 둔 대형 사모펀드인 Hg와 손잡고 새로운 합작 컨설팅 법인을 설립한다고 발표했습니다. 새롭게 만들어지는 이 회사는 유럽의 다양한 일반 기업들이 업무에 인공지능을 쉽게 도입할 수 있도록 맞춤형 기술 지원을 제공하게 됩니다. 특히, 앤트로픽의 최신 인공지능 모델을 안전하고 효율적으로 활용할 수 있도록 전담 엔지니어를 직접 기업 현장에 파견하는 서비스도 포함됩니다. 이번 합작사 설립은 단순히 소프트웨어 모델을 개발하는 것을 넘어, 기업 고객들의 실질적인 활용을 돕는 서비스 영역까지 사업을 확장하려는 전략으로 풀이됩니다. 이를 통해 앤트로픽은 까다로운 규제를 가진 유럽 내에서 기업용 서비스 시장의 주도권을 빠르게 확보하려 하고 있습니다.`,
  keyTerms:[{term:`사모펀드`,explanation:`일반 대중이 아닌 소수의 특정 투자자들로부터 거액의 자금을 모아, 주식이나 채권, 기업의 경영권 등에 투자하여 수익을 내는 비공개 투자 기금입니다.`}],
  history:`초거대 인공지능 기술이 빠르게 발전하면서, 이제는 단순히 똑똑한 기술을 만드는 경쟁을 넘어 실제 기업 현장에서 어떻게 안전하게 적용할 것인가가 중요해졌습니다.`,
  players:`뛰어난 기술력을 보유한 앤트로픽과 유럽 시장 내 폭넓은 기업 네트워크와 자본력을 갖춘 투자 파트너가 상호 협력하고 있습니다.`,
  current:`신기술 도입을 망설이는 유럽의 보수적인 기업들에게 맞춤형 기술 컨설팅과 전담 인력을 직접 제공하여 시장 진입 장벽을 낮추려는 적극적인 움직임이 시작되었습니다.`,
  outlook:`이번 합작 모델이 성공적으로 정착할 경우, 다른 거대 기술 기업들도 맞춤형 컨설팅과 파트너십을 다투어 확대할 것으로 보입니다.`,
  sources:[{title:`앤트로픽, 유럽 AI 컨설팅 합작법인 설립 - 연합뉴스`,url:`https://yna.co.kr/`}]
}]

  tag:`2026-10-23`,
  label:`2026년 10월 23일 (금)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`글로벌 빅테크의 AI 인프라 과잉 투자 우려에 미 기술주 급락`,
  metrics:[`나스닥 지수 2.60% 하락`,`메타 주가 7% 하락`],
  summary:`메타, 마이크로소프트 등 주요 빅테크 기업들이 호실적을 발표했음에도 불구하고, 막대한 AI 인프라 지출 계획을 내놓으며 투자 수익성 회수에 대한 우려가 확산되었습니다. 이로 인해 뉴욕증시에서 엔비디아, AMD를 포함한 주요 반도체 및 기술주가 일제히 급락하며 나스닥 지수가 2.60% 하락했습니다. 시장은 AI 기술의 장기적인 잠재력에는 동의하지만, 단기적으로 수익 창출이 지연될 경우 거품이 꺼질 수 있다는 불안감을 드러내고 있습니다. 결국 현재의 AI 투자 열풍이 실질적인 기업의 이익으로 어떻게 연결될지가 향후 시장의 핵심 변수로 작용할 전망입니다.`,
  keyTerms:[{term:`AI 인프라 지출`,explanation:`기업들이 인공지능 서비스를 원활하게 제공하기 위해 고성능 컴퓨터와 데이터 센터 등의 물리적 장비를 구축하는 데 사용하는 비용을 말합니다.`}],
  history:`지난 몇 년간 생성형 AI 시장이 폭발적으로 성장하며 구글, 마이크로소프트 등은 천문학적인 비용을 데이터 센터에 쏟아부었습니다.`,
  players:`메타, 마이크로소프트 등 대형 IT 기업들과 이들에게 칩을 공급하는 엔비디아, AMD가 시장을 주도하고 있습니다.`,
  current:`AI 개발 초기 단계를 지나 구체적인 수익 모델을 증명해야 하는 시점에 도달하면서 투자자들의 압박이 커지고 있습니다.`,
  outlook:`향후 발표될 빅테크 기업들의 분기 실적에서 실질적인 AI 매출 비중이 공개될 때마다 증시 변동성이 크게 출렁일 것으로 보입니다.`,
  sources:[{title:`뉴욕증시 기술주 급락 - 뉴시스`,url:`https://newsis.com`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`중동 지역 군사적 긴장 고조로 브렌트유 배럴당 113달러선 돌파`,
  metrics:[`브렌트유 배럴당 113달러`,`S&P500 지수 1.21% 하락`],
  summary:`중동 지역의 지정학적 갈등이 다시 한번 최고조에 달하면서 국제 유가의 벤치마크인 브렌트유가 배럴당 113달러선을 돌파했습니다. 주요 산유국들의 원유 생산 및 수출 차질 우려가 확산됨에 따라, 전 세계적인 인플레이션 압박과 원가 부담이 재차 커질 수 있다는 분석이 나옵니다. 글로벌 주식 시장은 유가 급등이 중앙은행들의 금리 인하 기대감을 꺾을 수 있다고 판단해 하락세를 면치 못했습니다. 전문가들은 중동 발 리스크가 장기화될 경우 세계 경제 전반의 성장세 둔화로 이어질 가능성을 경고하고 있습니다.`,
  keyTerms:[{term:`지정학적 갈등`,explanation:`국가 간의 지리적, 정치적 이해관계가 얽혀 무력 충돌이나 외교적 마찰이 발생하는 상황을 뜻합니다.`}],
  history:`가자지구와 레바논을 중심으로 촉발된 중동 분쟁은 관련 국가들의 군사적 보복이 이어지며 장기화 국면에 접어들었습니다.`,
  players:`이스라엘과 이란 등 중동 주요국과 이 지역의 안정화를 시도하는 미국 등 강대국들이 얽혀 있습니다.`,
  current:`에너지 운송의 핵심 통로인 중동에서 물리적 충돌이 확대될 조짐을 보이면서 글로벌 원유 공급망이 직접적인 타격을 받을 위기에 놓였습니다.`,
  outlook:`향후 무력 충돌의 양상과 OPEC+의 산유량 조절 정책에 따라 연말까지 고유가 기조가 고착화될 가능성이 높습니다.`,
  sources:[{title:`중동 긴장 고조에 유가 급등 - 뉴스1`,url:`https://www.news1.kr`}]

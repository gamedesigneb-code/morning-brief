<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모닝 브리핑</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --sidebar-w: 240px;
    --bg: #FAFAF7;
    --paper: #FFFFFF;
    --accent: #6B7A8F;
    --accent-soft: #E8ECEF;
    --line: #EAE8E3;
    --line-strong: #D8D5CE;
    --text: #2D2A26;
    --text-mid: #6B655D;
    --text-sub: #A09889;
    --radius: 10px;
  }
  html, body {
    height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 15px; line-height: 1.65; font-weight: 400;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }

  /* ── Layout ── */
  #app { display: flex; height: 100vh; overflow: hidden; }

  /* ── Sidebar ── */
  #sidebar {
    width: var(--sidebar-w); flex-shrink: 0;
    background: var(--bg); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #sidebar-header {
    padding: 36px 20px 24px;
    border-bottom: 1px solid var(--line);
    text-align: center;
  }
  #sidebar-header h1 {
    font-size: 19px; font-weight: 700; color: var(--text);
    letter-spacing: -0.4px; line-height: 1.3;
  }
  #sidebar-header p {
    font-size: 12px; color: var(--text-sub); margin-top: 6px;
    letter-spacing: 0.3px;
  }
  #date-list { overflow-y: auto; flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
  .date-item {
    padding: 11px 14px; cursor: pointer; border-radius: 8px;
    transition: background 0.15s, color 0.15s;
    background: transparent;
    text-align: center; font-size: 13px; font-weight: 500; color: var(--text-mid);
    letter-spacing: 0.1px;
  }
  .date-item:hover { background: var(--accent-soft); color: var(--text); }
  .date-item.active {
    background: var(--accent-soft); color: var(--text); font-weight: 600;
  }

  /* ── Main ── */
  #main { flex: 1; overflow-y: auto; background: var(--paper); }
  #content { max-width: 760px; margin: 0 auto; padding: 56px 40px 80px; }

  .brief-header { margin-bottom: 36px; }
  .brief-header .bh-eyebrow {
    font-size: 11px; color: var(--text-sub); margin-bottom: 8px;
    letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500;
  }
  .brief-header h2 {
    font-size: 30px; font-weight: 700; letter-spacing: -0.7px;
    color: var(--text); line-height: 1.25;
  }

  /* ── Sticky Top (header + tabs) ── */
  .sticky-top {
    position: sticky; top: 0;
    background: var(--paper); z-index: 20;
    padding-top: 56px; margin-top: -56px;
  }
  .sticky-top .brief-header { margin-bottom: 24px; }

  /* ── Category Tabs ── */
  .cat-tabs {
    display: flex; gap: 0; margin-bottom: 36px;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
  }
  .cat-tab {
    padding: 12px 20px 14px; cursor: pointer; font-size: 14px; font-weight: 500;
    color: var(--text-sub); border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    background: none; border-top: none; border-left: none; border-right: none;
    font-family: inherit; letter-spacing: -0.1px;
    margin-bottom: -1px;
  }
  .cat-tab:hover { color: var(--text-mid); }
  .cat-tab.active { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }

  /* ── Sources (collapsible) ── */
  .sources-toggle {
    background: transparent; border: 1px solid var(--line-strong);
    padding: 8px 14px; border-radius: 6px; font-size: 12.5px; font-weight: 500;
    color: var(--text-mid); cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    font-family: inherit; margin-top: 12px;
    transition: background 0.15s, border-color 0.15s;
  }
  .sources-toggle:hover { background: var(--accent-soft); border-color: var(--accent); }
  .sources-toggle .arrow { transition: transform 0.2s; font-size: 9px; color: var(--text-sub); }
  .sources-toggle.open .arrow { transform: rotate(180deg); }
  .sources-body { display: none; margin-top: 12px; padding-left: 4px; }
  .sources-body.open { display: block; }

  /* ── Story Card ── */
  .story { margin-bottom: 40px; }
  .story-top { margin-bottom: 18px; }
  .story-headline {
    font-size: 19px; font-weight: 700; line-height: 1.45;
    letter-spacing: -0.4px; color: var(--text);
  }

  .metrics { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .metric-chip {
    background: var(--accent-soft); border: none;
    border-radius: 6px; padding: 7px 12px;
    font-size: 12.5px; font-weight: 500; color: var(--text-mid);
    line-height: 1.4;
  }

  .summary {
    font-size: 15px; line-height: 1.8; color: var(--text); margin-bottom: 20px;
    letter-spacing: -0.1px;
  }
  .summary .kt-underline {
    color: #1996BD;
    text-decoration: underline;
    text-decoration-color: #1996BD;
    text-decoration-thickness: 1.5px;
    text-underline-offset: 3px;
    cursor: help;
  }

  /* ── Key Terms Box ── */
  .key-terms {
    background: #F4F1EA; border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius); padding: 18px 22px; margin-bottom: 14px;
  }
  .key-terms-title {
    font-size: 11px; font-weight: 600; color: var(--text-sub);
    text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 14px;
  }
  .kt-item { margin-bottom: 12px; }
  .kt-item:last-child { margin-bottom: 0; }
  .kt-term {
    font-size: 13.5px; font-weight: 700; color: #1996BD;
    margin-bottom: 4px; display: block;
    letter-spacing: -0.1px;
  }
  .kt-exp {
    font-size: 13.5px; line-height: 1.7; color: var(--text-mid);
  }

  /* ── Background ── */
  .bg-box {
    background: var(--bg); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 22px 24px; margin-bottom: 14px;
  }
  .bg-box-title {
    font-size: 11px; font-weight: 600; color: var(--text-sub);
    text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 16px;
  }
  .bg-section { margin-bottom: 16px; }
  .bg-section:last-child { margin-bottom: 0; }
  .bg-section-label {
    font-size: 12.5px; font-weight: 600; color: var(--text); margin-bottom: 6px;
    letter-spacing: -0.1px;
  }
  .bg-section-text { font-size: 14px; line-height: 1.75; color: var(--text-mid); }

  /* ── Sources ── */
  .source-item {
    display: flex; align-items: flex-start; gap: 10px;
    margin-bottom: 8px; font-size: 13px;
  }
  .src-num {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent-soft); color: var(--text-mid);
    font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .source-item a { color: var(--text-mid); text-decoration: none; line-height: 1.55; }
  .source-item a:hover { color: var(--text); text-decoration: underline; }

  .story-divider { border: none; border-top: 1px solid var(--line); margin: 36px 0; }

  .empty { color: var(--text-sub); font-size: 14px; padding: 60px 0; text-align: center; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }

  /* ── Mobile Toggle ── */
  #sidebar-toggle {
    display: none;
    position: fixed; top: 14px; left: 14px; z-index: 50;
    background: var(--paper); border: 1px solid var(--line-strong);
    width: 40px; height: 40px; border-radius: 10px;
    cursor: pointer; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(45, 42, 38, 0.08);
  }
  #sidebar-toggle span {
    display: block; width: 18px; height: 2px; background: var(--text);
    position: relative;
  }
  #sidebar-toggle span::before,
  #sidebar-toggle span::after {
    content: ''; position: absolute; left: 0; width: 18px; height: 2px; background: var(--text);
  }
  #sidebar-toggle span::before { top: -6px; }
  #sidebar-toggle span::after { top: 6px; }

  #sidebar-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(45, 42, 38, 0.4); z-index: 40;
  }
  #sidebar-backdrop.open { display: block; }

  /* ── Mobile Responsive ── */
  @media (max-width: 768px) {
    #sidebar-toggle { display: flex; }
    #sidebar {
      position: fixed; left: 0; top: 0; bottom: 0;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      z-index: 45; width: 260px;
      box-shadow: 0 0 24px rgba(45, 42, 38, 0.12);
    }
    #sidebar.open { transform: translateX(0); }

    #content { padding: 64px 20px 60px; max-width: 100%; }
    .brief-header h2 { font-size: 22px; }
    .story-headline { font-size: 16px; }
    .summary { font-size: 14.5px; line-height: 1.75; }
    .bg-section-text { font-size: 13.5px; }
    .metric-chip { font-size: 12px; padding: 6px 10px; }
    .bg-box { padding: 18px 18px; }
    .cat-tab { padding: 11px 14px; font-size: 13.5px; }

    .quiz-card { padding: 28px 24px 24px; }
    .quiz-q { font-size: 17px; }
    .quiz-choice { font-size: 14px; padding: 13px 16px; }
  }

  /* ── Quiz Overlay ── */
  body.quiz-active #app {
    filter: blur(6px) saturate(0.85);
    pointer-events: none;
    transition: filter 0.3s ease;
  }
  #quiz-overlay {
    position: fixed; inset: 0;
    background-color: rgba(250, 250, 247, 0.55);
    background-image:
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0) 0,
        rgba(255,255,255,0) 5px,
        rgba(45,42,38,0.04) 5px,
        rgba(45,42,38,0.04) 6px
      ),
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0) 0,
        rgba(255,255,255,0) 22px,
        rgba(45,42,38,0.025) 22px,
        rgba(45,42,38,0.025) 23px
      );
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 24px;
  }
  #quiz-overlay.hidden { display: none; }

  .quiz-card {
    background: var(--paper); border-radius: 16px;
    padding: 36px 36px 32px; width: 100%; max-width: 440px;
    box-shadow: 0 16px 48px rgba(45, 42, 38, 0.18);
  }
  .quiz-eyebrow {
    font-size: 11px; color: var(--text-sub); letter-spacing: 1.5px;
    text-transform: uppercase; font-weight: 500; margin-bottom: 12px;
  }
  .quiz-q {
    font-size: 19px; font-weight: 700; color: var(--text);
    line-height: 1.5; letter-spacing: -0.3px; margin-bottom: 24px;
  }
  .quiz-choices { display: flex; flex-direction: column; gap: 8px; }
  .quiz-choice {
    background: var(--paper); border: 1px solid var(--line-strong);
    padding: 14px 18px; border-radius: 10px; font-size: 14.5px; font-weight: 500;
    color: var(--text); cursor: pointer; text-align: left;
    font-family: inherit; transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .quiz-choice:focus { outline: none; }
  .quiz-choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) {
    .quiz-choice:hover { background: var(--accent-soft); border-color: var(--accent); }
  }
  .quiz-choice:active { transform: scale(0.99); }
  .quiz-choice.wrong {
    background: #F5E6E0; border-color: #C9947F; color: #8A4A30;
    animation: shake 0.4s ease;
  }
  .quiz-choice.correct {
    background: #E3EDE2; border-color: #7A9077; color: #2E4A2C;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .quiz-feedback {
    margin-top: 20px; text-align: center; font-size: 14px; font-weight: 500;
    color: var(--text-mid); min-height: 22px;
  }
  .quiz-feedback.right { color: #2E4A2C; }
  .quiz-feedback.wrong { color: #8A4A30; }

  .quiz-close-btn {
    margin-top: 18px; width: 100%;
    background: var(--text); color: var(--paper); border: none;
    padding: 13px 20px; border-radius: 10px; font-size: 14px; font-weight: 600;
    font-family: inherit; cursor: pointer;
    transition: background 0.15s;
  }
  .quiz-close-btn:hover { background: #1a1815; }
  .quiz-close-btn.hidden { display: none; }
</style>
</head>
<body>
<div id="quiz-overlay">
  <div class="quiz-card">
    <div class="quiz-eyebrow"><span>잠깐, 나에 대해서 잘 알지?</span> <span id="quiz-counter">(0/3)</span></div>
    <div class="quiz-q" id="quiz-q"></div>
    <div class="quiz-choices" id="quiz-choices"></div>
    <div class="quiz-feedback" id="quiz-feedback"></div>
    <button class="quiz-close-btn hidden" id="quiz-close">닫기</button>
  </div>
</div>

<button id="sidebar-toggle" aria-label="메뉴"><span></span></button>
<div id="sidebar-backdrop"></div>

<div id="app">
  <nav id="sidebar">
    <div id="sidebar-header">
      <h1>모닝 브리핑</h1>
      <p>일별 세계 뉴스 요약</p>
    </div>

    <div id="date-list"></div>
  </nav>
  <main id="main">
    <div id="content"></div>
  </main>
</div>

<script>
const BRIEFS = [{
  tag:`2026-09-14`,
  label:`2026년 9월 14일 (월)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`코스피가 국제유가와 국채금리 급등 여파로 사흘 만에 7000선을 반납하며 6909.91로 마감했습니다.`,
  metrics:[`코스피 6909.91 마감`,`원-달러 환율 1,344.10원`],
  summary:`국내 주식 시장이 큰 충격을 받으며 코스피 지수가 사흘 만에 7000선 아래로 떨어졌습니다. 최근 국제유가와 국채금리가 동반 급등하면서 투자자들의 불안 심리가 극에 달한 결과입니다. 특히 외국인과 기관의 대규모 매도세가 이어지면서 지수 하락을 강하게 이끌었습니다. 원-달러 환율 역시 1,344.10원까지 치솟아 시장 내 복합 쇼크에 대한 우려가 커지고 있습니다. 금리 인상 압박이 지속되며 기업들의 자금 조달 부담도 가중되는 상황입니다. 시장 전문가들은 당분간 변동성이 매우 큰 장세가 이어질 것으로 조심스럽게 내다보고 있습니다. 정부와 금융당국은 외환 및 주식 시장 안정을 위한 밀착 모니터링을 한층 강화하고 있습니다.`,
  keyTerms:[{term:`복합 쇼크`,explanation:`주가 하락, 금리 상승, 환율 상승 등 여러 경제적 악재가 동시에 겹쳐 시장에 큰 충격을 주는 현상입니다.`}],
  history:`최근 몇 달간 인플레이션 장기화 우려로 인해 글로벌 자산 시장의 긴장감이 꾸준히 누적되어 왔습니다. 산유국들의 감산 연장으로 국제 유가가 오름세를 보이며 물가 상승 압력이 다시 커졌습니다. 이에 따라 각국 중앙은행들이 고금리 정책을 유지할 것이라는 전망이 지배적이었습니다.`,
  players:`외국인 투자자들과 기관 투자자들이 위험 자산 회피 심리에 따라 주요 매도 주체로 나서고 있습니다. 반면 개인 투자자들은 하락장을 저가 매수의 기회로 삼으며 매수세를 보이고 있습니다. 한국은행을 비롯한 금융당국은 환율 방어와 시장 안정화를 위해 예의주시하고 있습니다.`,
  current:`국제유가 상승과 더불어 미국의 추가 금리 인상 가능성이 제기되면서 국내 시장에 직접적인 타격을 주는 중입니다. 주식, 채권, 외환 시장이 모두 흔들리며 투자자들의 심리적 지지선이 위협받고 있습니다.`,
  outlook:`이번 주 예정된 미국 연방준비제도의 통화정책회의 결과에 따라 국내 금융 시장의 향방이 크게 좌우될 전망입니다. 당분간 방어적인 포트폴리오 구축이 필수적이라는 조언이 이어지고 있습니다.`,
  sources:[{title:`코스피 7000 반납...환율·금리 동반 상승 - 한국경제`,url:`https://www.hankyung.com`},{title:`유가·금리 더블펀치, 국내 금융시장 요동 - 매일경제`,url:`https://www.mk.co.kr`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 연방준비제도(Fed)가 물가 안정을 위해 이번 주 0.25%p 금리를 인상할 확률이 85% 이상으로 치솟았습니다.`,
  metrics:[`금리 인상 확률 85% 이상`,`미국 8월 CPI 3.4%`],
  summary:`이번 주 미국 연방준비제도의 통화정책회의를 앞두고 글로벌 금융 시장의 긴장감이 고조되고 있습니다. 최근 발표된 미국 8월 소비자물가지수가 예상치에 부합했음에도 불구하고 유가 급등이 새로운 변수로 떠올랐습니다. 시장 참여자들은 연준이 물가 안정을 확실히 다지기 위해 기준금리 인상을 단행할 것으로 강하게 점치고 있습니다. 현재 금리를 0.25%p 올릴 것이라는 전망이 85% 이상으로 치솟으며 기정사실화되는 분위기입니다. 새로 취임한 연준 의장은 물가 통제를 최우선 과제로 삼고 있어 매파적 기조가 유지될 것으로 보입니다. 이는 달러화 강세를 부추기며 신흥국 자본 유출에 대한 우려를 증폭시키고 있습니다. 투자자들은 제롬 파월 전 의장 때와 달라진 현 연준의 정책 기조를 분석하느라 분주합니다.`,
  keyTerms:[{term:`기준금리 인상`,explanation:`중앙은행이 시중 은행과 거래할 때 기준이 되는 금리를 올리는 것으로, 시장에 돈이 도는 속도를 줄여 물가를 잡는 효과가 있습니다.`}],
  history:`미국은 코로나19 이후 발생한 초인플레이션을 잡기 위해 유례없는 속도로 금리를 올려왔습니다. 어느 정도 물가가 안정세를 보이면서 최근 1년 이상 금리 동결 기조가 이어졌습니다. 하지만 최근 에너지 가격 상승으로 인해 인플레이션 재점화 불씨가 살아나고 있습니다.`,
  players:`케빈 워시 신임 연방준비제도 의장은 물가 안정에 방점을 둔 정책을 강력하게 추진 중입니다. 반면 도널드 트럼프 미국 대통령은 경기 침체를 막기 위해 금리를 낮춰야 한다며 연준을 압박하고 있습니다. 글로벌 투자은행들은 연준과 행정부 간의 갈등이 시장 변동성을 키울 수 있다고 경고합니다.`,
  current:`금리 인상 가능성이 커지면서 미국 국채 금리가 오르고 주식 시장은 하방 압력을 받고 있습니다. 고금리 장기화에 대한 두려움이 주택 시장과 기업 투자 심리를 급격히 위축시키고 있습니다.`,
  outlook:`9월 16일 발표될 연준의 최종 금리 결정과 향후 경제 전망을 담은 점도표에 전 세계의 이목이 집중되어 있습니다. 연내 추가 인상 여부에 대한 힌트가 시장의 핵심 변곡점이 될 것입니다.`,
  sources:[{title:`Fed rate hike chances soar to 85% - Bloomberg`,url:`https://www.bloomberg.com`},{title:`미 연준 금리 인상 초읽기, 달러 강세 지속 - 연합뉴스`,url:`https://www.yna.co.kr`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`일본의 10년 만기 국채 금리가 1996년 이후 처음으로 3%를 돌파하며 글로벌 채권 시장에 충격을 주고 있습니다.`,
  metrics:[`일본 10년물 국채 금리 3% 돌파`,`1996년 이후 최고치`],
  summary:`일본의 10년 만기 국채 금리가 1996년 이후 처음으로 3%를 돌파하며 글로벌 금융 시장에 파장을 일으키고 있습니다. 오랜 기간 마이너스 금리와 대규모 금융 완화를 유지해 온 일본이 본격적인 긴축으로 돌아서고 있음을 보여주는 신호입니다. 일본 금리의 가파른 상승은 전 세계 채권 금리를 동반 상승시키는 요인으로 작용하고 있습니다. 이는 글로벌 투자자들이 일본 자산을 매력적으로 느끼게 만들어 엔화 가치를 밀어 올리고 있습니다. 반대로 다른 국가에 투자되었던 일본계 자금의 본국 회귀인 엔 캐리 트레이드 청산에 대한 우려도 커졌습니다. 세계 3위 경제 대국의 급격한 정책 변화가 신흥국 시장에 예상치 못한 충격을 줄 수 있습니다. 투자자들은 일본은행의 추가적인 금리 인상 시기를 가늠하며 채권 비중을 조절하고 있습니다.`,
  keyTerms:[{term:`엔 캐리 트레이드 청산`,explanation:`금리가 싼 일본에서 돈을 빌려 이자가 높은 다른 나라 자산에 투자했던 돈을, 다시 일본으로 거둬들이며 빚을 갚는 것을 말합니다.`}],
  history:`일본은 지난 수십 년 동안 잃어버린 30년을 극복하기 위해 초저금리와 양적 완화 정책을 고수했습니다. 하지만 글로벌 인플레이션 여파로 일본 내부의 물가도 상승하기 시작했습니다. 결국 물가 목표치 달성에 자신감을 얻은 일본은행은 서서히 정상적인 통화 정책으로 회귀를 시작했습니다.`,
  players:`우에다 가즈오 일본은행 총재는 시장 충격을 최소화하며 금리를 정상화하려는 신중한 행보를 보이고 있습니다. 글로벌 헤지펀드들은 일본 국채 금리 상승을 예견하고 채권 숏 포지션을 구축해 왔습니다. 일본 내 금융기관들은 금리 상승으로 인한 예대마진 개선을 기대하며 수익성 다각화를 꾀하고 있습니다.`,
  current:`국채 금리가 3%를 돌파하면서 일본 내 기업들의 이자 부담 증가와 가계 대출 부실 우려가 동시에 제기되고 있습니다. 세계 시장에서는 일본계 자금의 대규모 이동 가능성을 주시하며 자산 재분배가 일어나고 있습니다.`,
  outlook:`일본은행이 올해 하반기에 기준 금리를 추가로 인상할 가능성이 높아 관련 지표 발표에 귀추가 주목됩니다. 금리 상승 속도가 너무 빠를 경우 일본 정부가 국채 매입을 통해 시장 개입에 나설 수도 있습니다.`,
  sources:[{title:`Japan 10-year yield tops 3% for first time since 1996 - FT`,url:`https://www.ft.com`},{title:`일본 채권 금리 쇼크, 전 세계 유동성 긴장 - 조선일보`,url:`https://www.chosun.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`용혜인 성평등가족부 장관 후보자가 지명 14일 만에 당내 사당화 및 겸직 논란 등으로 자진 사퇴했습니다.`,
  metrics:[`지명 14일 만에 사퇴`,`현 정부 4번째 낙마 장관 후보자`],
  summary:`용혜인 성평등가족부 장관 후보자가 지명된 지 14일 만에 결국 자진 사퇴를 결정했습니다. 기본소득당 소속 비례대표 의원직과 장관직을 겸직하는 것에 대한 비판이 커진 것이 주된 원인입니다. 또한 당내 일감 몰아주기와 사당화 의혹까지 겹치면서 여론이 급격히 악화되었습니다. 더불어민주당 지도부마저 사퇴를 강력히 권유하자 정치적 부담을 이기지 못하고 결단을 내린 것으로 보입니다. 청와대는 후보자의 결정을 존중한다는 입장을 밝히며 급히 진화에 나섰습니다. 이로써 현 정부 들어 인사청문회조차 열리기 전에 낙마한 장관 후보자가 네 명으로 늘어났습니다. 정부의 인사 검증 시스템에 대한 야당의 공세가 더욱 거세질 것으로 예상됩니다.`,
  keyTerms:[{term:`인사 검증 시스템`,explanation:`대통령이 장관 등 고위 공직자를 임명하기 전에 그 사람의 도덕성과 업무 능력을 미리 꼼꼼히 조사하고 확인하는 체계를 말합니다.`}],
  history:`현 정부는 출범 이후 여러 부처의 장관 후보자들이 도덕성 및 자질 논란으로 낙마하는 뼈아픈 경험을 겪어왔습니다. 성평등가족부는 부처 개편 문제와 맞물려 장관 인선이 그 어느 곳보다 민감한 사안이었습니다. 소수 정당과의 협치 차원에서 전격 발탁되었으나 초기부터 자격 논란이 끊이지 않았습니다.`,
  players:`용혜인 후보자는 정치적 이상과 현실의 벽 사이에서 결국 스스로 물러나는 선택을 했습니다. 김민석 대표를 비롯한 민주당 지도부는 당의 부담을 덜기 위해 후보자에게 사퇴 결단을 압박했습니다. 청와대 인사수석실은 부실 검증이라는 거센 비판에 직면하며 문책론에 휩싸이게 되었습니다.`,
  current:`장관 공백 사태가 길어지면서 성평등가족부의 주요 정책 추진과 내년도 예산 확보에 비상이 걸렸습니다. 여당은 이번 사태를 진영 내 권력 다툼으로 규정하고 맹비난을 쏟아내고 있습니다.`,
  outlook:`청와대는 조속히 새로운 후임자를 물색하여 지명해야 하는 무거운 과제를 안게 되었습니다. 다가오는 국정감사에서 야당은 이번 사태를 빌미로 대대적인 정부 심판론을 제기할 전망입니다.`,
  sources:[{title:`용혜인 장관 후보자 자진 사퇴...지명 14일 만 - 연합뉴스`,url:`https://www.yna.co.kr`},{title:`또 인사 참사, 현 정부 들어 4번째 자진 사퇴 - 한겨레`,url:`https://www.hani.co.kr`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`정부가 내년도 예산안에서 북핵 및 대미 외교 예산을 삭감한 반면, 대통령의 정상외교 예산은 125% 대폭 증액해 논란이 일고 있습니다.`,
  metrics:[`정상외교 예산 125.3% 증액 (653억 원)`,`북핵·대미 예산 약 20% 삭감`],
  summary:`정부가 국회에 제출한 내년도 예산안을 두고 여야 간의 치열한 예산 정국이 막을 올렸습니다. 특히 외교부 예산 중 대통령의 정상외교 예산이 올해 대비 125.3%나 대폭 증액된 653억 원으로 편성되어 논란이 일고 있습니다. 반면 북한 비핵화 추진을 위한 국제공조 예산과 대미 외교 예산은 각각 20%가량 삭감되었습니다. 야당은 민생이 어려운 시기에 해외 순방 예산만 과도하게 늘린 전형적인 긴축 재정의 모순이라고 비판하고 있습니다. 정부는 다자회의 참석과 공급망 확보를 위한 필수적인 경제 외교 투자라고 적극 반박 중입니다. 세수 부족이 현실화된 상황에서 외교 안보 분야의 예산 재분배가 쟁점으로 떠올랐습니다. 예산결산특별위원회에서 해당 예산의 삭감 여부를 놓고 격렬한 충돌이 예상됩니다.`,
  keyTerms:[{term:`긴축 재정`,explanation:`국가가 세금이 덜 걷히거나 나라 빚이 많을 때 씀씀이를 줄이고 지출을 최대한 아끼는 경제 정책을 뜻합니다.`}],
  history:`현 정부는 출범 초기부터 건전 재정을 기조로 삼아 정부 지출을 최대한 억제해 왔습니다. 그러나 수출 다변화와 자원 안보의 중요성이 커지면서 대통령의 해외 순방 횟수는 꾸준히 증가했습니다. 이에 따라 순방 비용 지출액이 매년 예산 편성 규모를 넘어서는 일이 반복되어 왔습니다.`,
  players:`기획재정부와 외교부는 국가 이익 창출을 위한 외교 인프라 확충의 당위성을 국회에 설득하고 있습니다. 더불어민주당 등 야당 의원들은 불요불급한 특활비와 순방 비용을 철저히 현미경 심사하겠다며 벼르고 있습니다. 시민단체들은 예산안 세부 내역의 투명한 공개를 촉구하며 여론전을 펼치고 있습니다.`,
  current:`야당이 다수 의석을 차지하고 있는 국회 상황을 고려할 때 원안 그대로 통과되기는 쉽지 않은 상황입니다. 부처별 예산 심사 단계부터 송곳 검증이 예고되며 팽팽한 긴장감이 흐르고 있습니다.`,
  outlook:`정기국회 기간 내내 이 예산안을 둘러싼 여야의 샅바 싸움이 정국의 블랙홀이 될 가능성이 높습니다. 최종적으로 예산안이 법정 기한 내에 합의 처리될 수 있을지가 핵심 관건입니다.`,
  sources:[{title:`내년 정상외교 예산 125% 증액...북핵은 삭감 - 중앙일보`,url:`https://www.joongang.co.kr`},{title:`야당, '해외 순방 예산 삭감 벼른다' 국회 긴장 - 동아일보`,url:`https://www.donga.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`도널드 트럼프 미국 대통령이 아일랜드를 방문해 아일랜드와 북아일랜드의 통일을 지지한다고 밝혀 연합주의 진영의 거센 반발을 샀습니다.`,
  metrics:[`위스키 관세 전면 철폐 약속`,`미국의 전통적 중립 외교 파기 논란`],
  summary:`도널드 트럼프 미국 대통령이 해외 순방 중 돌발적인 외교 발언으로 큰 파장을 일으키고 있습니다. 아일랜드를 방문한 트럼프 대통령은 아일랜드와 북아일랜드의 통일을 지지한다는 입장을 공식 석상에서 밝혔습니다. 이는 오랫동안 유지되어 온 미국의 전통적인 중립 외교 노선을 완전히 뒤집는 충격적인 발언입니다. 그는 나아가 아일랜드산 위스키에 대한 관세 전면 철폐까지 약속하며 아일랜드에 친화적인 제스처를 취했습니다. 이에 대해 영국 정부와 북아일랜드의 연합주의 진영은 내정 간섭이라며 거세게 반발하고 있습니다. 미국 내에서도 핵심 동맹국인 영국과의 관계를 훼손할 수 있다는 우려의 목소리가 터져 나옵니다. 외교 전문가들은 이번 발언이 미국 내 아일랜드계 유권자들을 의식한 고도의 정치적 계산일 수 있다고 분석합니다.`,
  keyTerms:[{term:`연합주의 진영`,explanation:`영국으로부터 독립하려는 세력에 맞서, 북아일랜드가 계속 영국의 영토로 남아있기를 강력하게 주장하는 정치 집단입니다.`}],
  history:`영국에 속한 북아일랜드는 과거 아일랜드와의 통합을 주장하는 민족주의자와 영국 잔류를 원하는 연합주의자 간의 오랜 유혈 분쟁을 겪었습니다. 1998년 미국의 중재로 맺어진 벨파스트 평화협정을 통해 비로소 아슬아슬한 평화가 정착되었습니다. 이후 미국 정부는 양측 어느 한쪽의 손을 들어주지 않고 엄격한 중립을 지켜왔습니다.`,
  players:`도널드 트럼프 대통령은 특유의 직설적 화법으로 외교 관례를 깨고 동맹국에 충격을 안겼습니다. 키어 스타머 영국 총리는 미국의 동맹국으로서 매우 실망스럽다며 강력한 유감의 뜻을 표명했습니다. 아일랜드 정부는 표면적으로는 환영하면서도 영국과의 외교적 마찰을 우려해 신중한 태도를 보이고 있습니다.`,
  current:`이 발언으로 인해 북아일랜드 내부에서 신구 갈등이 다시 촉발될 조짐을 보이며 긴장이 고조되고 있습니다. 영국 의회 일각에서는 트럼프 대통령의 영국 국빈 방문을 취소해야 한다는 강경론까지 대두되었습니다.`,
  outlook:`다가오는 11월 미국 선거에서 이 발언이 외교 정책 실패로 공격받을지 표심을 결집할지 주목됩니다. 영국과 미국 간의 후속 고위급 회담에서 이 갈등을 어떻게 봉합할지가 당면한 최우선 과제입니다.`,
  sources:[{title:`Trump's 'United Ireland' remarks spark diplomatic row - Reuters`,url:`https://www.reuters.com`},{title:`트럼프, 돌발 발언에 영국 발칵...동맹 균열 우려 - KBS`,url:`https://news.kbs.co.kr`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`서울 시내버스 노조원들이 파업 찬반투표에서 찬성해, 막판 협상 결렬 시 16일부터 전면 파업에 돌입할 위기에 처했습니다.`,
  metrics:[`9월 16일 전면 파업 예고`,`압도적 파업 찬성 가결`],
  summary:`전국 최대 규모인 서울 시내버스 노조가 임금 협상 결렬에 반발하며 대규모 파업을 예고했습니다. 노조원들을 대상으로 실시한 파업 찬반투표에서 압도적인 찬성표가 쏟아지며 강경 대응이 결의되었습니다. 사측과 노조는 기본급 인상률과 정년 연장 문제를 두고 팽팽한 줄다리기를 이어오다 입장 차이를 좁히지 못했습니다. 양측이 막판 지방노동위원회 조정 회의에서도 합의에 이르지 못하면 당장 16일부터 전면 파업에 돌입하게 됩니다. 실제로 버스 운행이 멈출 경우 출퇴근길 시민들이 엄청난 교통 대란을 겪을 것으로 우려됩니다. 서울시는 지하철 운행 횟수를 늘리고 무료 셔틀버스를 투입하는 등 비상 수송 대책을 긴급히 마련하고 있습니다. 시민들은 잦은 대중교통 파업 위협에 피로감을 호소하며 조속한 타결을 촉구하고 있습니다.`,
  keyTerms:[{term:`비상 수송 대책`,explanation:`버스 파업 등 대중교통이 정상적으로 운행되지 못할 때를 대비해 지하철을 더 많이 다니게 하거나 무료 셔틀을 투입하는 대응 방안입니다.`}],
  history:`서울 시내버스는 준공영제로 운영되고 있어 만성적인 적자 구조 속에서도 서비스가 유지되어 왔습니다. 물가 상승으로 인해 운수 종사자들의 실질 임금이 하락하면서 노조의 처우 개선 요구가 매년 거세지고 있습니다. 과거에도 수차례 파업 위기가 있었으나 대부분 파업 직전 극적으로 타결되는 양상을 보였습니다.`,
  players:`전국자동차노동조합연맹 서울시버스노동조합은 물가상승률을 반영한 두 자릿수 임금 인상을 강력히 요구하고 있습니다. 서울시버스운송사업조합 측은 재정 적자의 한계를 이유로 3%대 이상의 인상은 불가하다며 맞서고 있습니다. 서울시는 양측의 타협을 유도하면서도 파업 현실화에 대비한 행정력 동원에 집중하고 있습니다.`,
  current:`파업 돌입까지 단 이틀을 남겨두고 노사 양측의 물밑 접촉이 숨 가쁘게 진행되고 있습니다. 노조원들은 이미 파업 출정식을 준비하며 최악의 상황을 염두에 둔 쟁의 행위에 돌입했습니다.`,
  outlook:`15일 심야에 열릴 최종 노동위원회 조정 회의 결과가 파업 여부를 결정짓는 분수령이 될 것입니다. 파업이 장기화될 경우 시민 불편은 물론 서울시의 준공영제 개혁 요구로 불똥이 튈 수 있습니다.`,
  sources:[{title:`서울 버스 16일 전면 파업 가시화...교통 대란 비상 - SBS`,url:`https://news.sbs.co.kr`},{title:`시내버스 파업 초읽기, 협상 결렬 시 멈춘다 - MBC`,url:`https://imnews.imbc.com`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`미국 펜실베이니아 대학교 연구팀이 AI를 활용해 40만 개의 커뮤니티 글을 분석한 결과, 비만 치료제 '오젬픽'의 숨겨진 부작용을 새롭게 찾아냈습니다.`,
  metrics:[`레딧 게시글 40만 개 분석`,`생리 주기 변화 등 신규 부작용 확인`],
  summary:`인공지능이 방대한 인터넷 데이터를 샅샅이 훑어 세계적으로 선풍적인 인기를 끄는 비만 치료제의 새로운 부작용을 찾아냈습니다. 미국 펜실베이니아 대학교 연구팀은 AI를 활용해 최대 커뮤니티인 레딧에 올라온 40만 개의 게시글을 정밀하게 분석했습니다. 분석 결과 '오젬픽' 등 유명 비만 치료제를 투약한 환자들이 생리 주기 변화와 갑작스러운 오한을 겪는 것으로 나타났습니다. 이는 제약회사의 기존 병원 임상시험이나 공식 보고서에서는 명확하게 규명되지 않았던 숨겨진 부작용 증상입니다. 데이터 마이닝 기술이 환자들의 생생한 목소리를 수집해 의료 사각지대를 밝혀낸 혁신적인 사례로 평가받고 있습니다. 의료계는 AI의 발견을 토대로 해당 약물의 장기 복용 안전성에 대한 추가 역학 조사에 착수했습니다. 제약사들은 이번 연구 결과에 당혹감을 감추지 못하며 자체적인 부작용 검증에 들어갔습니다.`,
  keyTerms:[{term:`데이터 마이닝`,explanation:`인터넷에 흩어져 있는 엄청나게 많은 글과 정보 속에서, 사람이 직접 찾기 힘든 가치 있는 패턴이나 숨겨진 사실을 컴퓨터가 캐내는 기술입니다.`}],
  history:`글루카곤 유사 펩타이드(GLP-1) 계열의 당뇨병 약들이 뛰어난 체중 감량 효과를 보이면서 전 세계적인 품귀 현상을 빚었습니다. 짧은 기간에 처방이 폭발적으로 늘어나면서 다양한 기저질환을 가진 사람들에 대한 임상 데이터는 상대적으로 부족했습니다. 인터넷 환자 모임에는 병원에 알리지 않은 가벼운 이상 증상들에 대한 호소가 지속해서 올라왔습니다.`,
  players:`펜실베이니아 대학교 연구진은 첨단 자연어 처리 AI 모델을 의학 연구에 선도적으로 접목해 성과를 냈습니다. 노보 노디스크 등 글로벌 대형 제약사들은 자사 제품의 안전성 논란이 매출에 미칠 영향을 예의주시하고 있습니다. 전 세계 다이어트 환자들은 약물의 부작용 소식에 불안감을 표하며 명확한 의료 지침을 기다리고 있습니다.`,
  current:`해당 연구 논문이 세계적인 의학 저널에 실리면서 보건 당국과 의료계에 큰 반향을 일으키고 있습니다. 각종 소셜 미디어에서는 유사한 부작용 경험담을 공유하는 사용자들의 인증이 잇따르고 있습니다.`,
  outlook:`미국 식품의약국(FDA) 등 주요 규제 기관이 해당 비만 치료제의 부작용 경고 문구를 수정할 가능성이 높습니다. 향후 의약품 시판 후 안전성 감시에 인공지능 시스템이 필수적인 도구로 자리 잡을 전망입니다.`,
  sources:[{title:`AI uncovers hidden Ozempic side effects from Reddit - Science Daily`,url:`https://www.sciencedaily.com`},{title:`기적의 비만약, AI가 찾아낸 진짜 부작용 - 조선일보`,url:`https://www.chosun.com`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`마이크로소프트가 100개 이상의 AI 에이전트를 투입해 역대 최대 규모인 972개의 시스템 취약점을 한 번에 찾아내고 패치했습니다.`,
  metrics:[`972개 취약점 패치`,`100개 이상의 전문 AI 에이전트 가동`],
  summary:`마이크로소프트(MS)가 자사의 인공지능 기술을 총동원해 대규모 사이버 보안 위협을 사전에 차단하는 데 성공했습니다. MS는 9월 정기 보안 업데이트를 통해 무려 972개에 달하는 시스템 취약점을 한 번에 수정하는 역대 최대 규모의 패치를 배포했습니다. 놀라운 점은 100개 이상의 전문 AI 에이전트가 코드를 스스로 분석하여 이 중 상당수의 치명적 결함을 독자적으로 찾아냈다는 사실입니다. 특히 외부 해커들이 악용하기 쉬운 심각한 보안 취약점 16개는 AI 보안 시스템이 아니었다면 발견하기 어려웠을 것으로 분석됩니다. 이는 인공지능이 인간 엔지니어를 보조하는 수준을 넘어 실제 기업 방어 기술의 최전선에 투입되었음을 입증합니다. 날이 갈수록 교묘해지는 해킹 공격에 맞서 사이버 보안 패러다임이 AI 중심으로 완전히 재편되고 있습니다. 글로벌 IT 기업들은 자사의 소프트웨어 방어벽을 높이기 위해 앞다투어 자율형 보안 AI 도입을 서두르고 있습니다.`,
  keyTerms:[{term:`보안 취약점`,explanation:`소프트웨어나 컴퓨터 시스템을 만들 때 생긴 실수나 약점으로, 해커들이 컴퓨터에 몰래 침입할 때 사용하는 '개구멍' 같은 곳입니다.`}],
  history:`클라우드 컴퓨팅과 사물인터넷이 널리 보급되면서 기업의 시스템을 노리는 해커들의 공격 경로가 기하급수적으로 늘어났습니다. 기존에는 보안 전문가들이 수동으로 방대한 코드를 점검해야 했기에 새로운 해킹 기법을 방어하는 데 한계가 있었습니다. 이에 빅테크 기업들은 머신러닝을 활용해 비정상적인 패턴을 감지하는 연구에 천문학적인 자본을 투자해 왔습니다.`,
  players:`마이크로소프트는 자체 개발한 'MDASH' 시스템을 통해 전 세계 자사 제품망의 안전을 지키는 데 주력하고 있습니다. 국가의 후원을 받는 전문 해킹 그룹들은 패치되지 않은 틈새를 노리기 위해 끊임없이 새로운 공격 도구를 개발 중입니다. 글로벌 보안 업체들은 AI가 주도하는 취약점 방어 솔루션 시장을 선점하기 위해 치열한 기술 경쟁을 벌이고 있습니다.`,
  current:`이번 대규모 패치로 전 세계 윈도우 및 애저 사용자들의 시스템 보안 수준이 한층 강화되었습니다. 보안 업계는 해커들 역시 AI를 활용해 공격을 자동화하고 있다는 점을 우려하며 이른바 창과 방패의 전쟁을 벌이고 있습니다.`,
  outlook:`기업들은 방어용 AI 에이전트를 실시간으로 구동하여 스스로 시스템을 치유하는 자율 방어 체계를 곧 완성할 것입니다. 인공지능 윤리와 안전성에 대한 규제 논의와 함께 사이버 보안 분야의 AI 기술 투자는 더욱 가속화될 전망입니다.`,
  sources:[{title:`Microsoft fixes record 972 flaws with AI agents - TechCrunch`,url:`https://techcrunch.com`},{title:`해커보다 빠른 AI 방패...역대급 보안 패치 배포 - 보안뉴스`,url:`https://www.boannews.com`}]
}]
},{
  tag:`2026-09-13`,
  label:`2026년 9월 13일 (일)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`올해 1인당 GNI 4만 달러 돌파 유력하나, 내수 체감 경기는 여전히 꽁꽁`,
  metrics:[`2분기 명목 GDP 증가율 26.4%`,`가계부채 2천조 원 돌파`],
  summary:`올해 2분기 명목 GDP 증가율이 47년 만에 26.4%라는 최고치를 기록했습니다. 이에 따라 올해 한국의 1인당 국민총소득(GNI)이 사상 처음으로 4만 달러를 돌파할 것이 확실시되고 있습니다. 하지만 이런 화려한 거시 지표 뒤에는 반도체 중심의 수출 호황이라는 착시가 숨어있습니다. 실제 국민들이 느끼는 체감 경기는 정반대입니다. 7월 소매판매가 2.4% 감소하는 등 내수는 심각한 침체 늪에 빠져 있으며, 가계부채는 2천조 원을 넘어섰습니다. 결국 수출 기업과 일반 가계 간의 경제적 양극화 현상이 극심해지고 있다는 뜻입니다.`,
  keyTerms:[{term:`명목 GDP`,explanation:`물가 상승분을 반영하여 현재 시장 가격으로 계산한 국내총생산으로, 국가 경제의 전체 규모를 보여줍니다.`}],
  history:`한국 경제는 과거부터 수출 주도의 성장을 이어왔으나, 최근 고금리 장기화로 인해 내수 부진이 심화되었습니다.`,
  players:`수출 대기업, 내수 자영업자 및 일반 가계, 한국은행 등 금융 당국이 주요 주체입니다.`,
  current:`수출 지표는 역대급 호조를 보이나 가계부채와 이자 부담으로 소비 여력이 바닥난 양극화 상태가 지속 중입니다.`,
  outlook:`정부의 내수 진작책과 다가올 기준금리 인하 여부가 하반기 체감 경기 회복의 관건이 될 것입니다.`,
  sources:[{title:`국민소득 4만 달러 눈앞, 하지만 내수는 침체 - YTN`,url:`https://www.ytn.co.kr`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`반도체 수출 2,812억 달러로 역대 최대치 달성, 단일 품목 쏠림 우려도 커져`,
  metrics:[`반도체 수출액 2,812억 달러`,`전체 수출 중 반도체 비중 40.6%`],
  summary:`한국의 올해 반도체 수출액이 2,812억 달러를 기록하며 역대 최대치를 경신했습니다. 전체 수출 물량에서 반도체가 차지하는 비중 또한 40.6%에 달해 국가 경제를 강하게 견인하고 있습니다. AI 산업 팽창에 따른 고대역폭 메모리(HBM) 등의 수요 폭발이 주된 원인입니다. 그러나 경제 전문가들은 이러한 단일 품목 쏠림 현상에 대해 강한 우려를 표하고 있습니다. 특정 산업에 대한 의존도가 지나치게 높으면, 글로벌 반도체 사이클이 하강 국면에 접어들 때 한국 경제 전체가 큰 타격을 입을 수 있기 때문입니다. 산업 다각화를 통한 경제 체질 개선이 시급하다는 목소리가 커지고 있습니다.`,
  keyTerms:[{term:`단일 품목 쏠림`,explanation:`국가 경제나 수출이 특정 하나의 제품이나 산업에 지나치게 의존하여, 해당 산업의 위기가 국가 전체의 위기로 번질 수 있는 위험한 상태를 말합니다.`}],
  history:`한국 수출은 전통적으로 반도체, 자동차, 석유화학 등이 이끌어왔으나, 최근 AI 붐으로 반도체 의존도가 기형적으로 높아졌습니다.`,
  players:`삼성전자, SK하이닉스 등 글로벌 반도체 기업과 경쟁국인 중국, 대만의 기업들이 시장을 주도합니다.`,
  current:`초호황을 누리고 있지만, 주요 기관들은 언제 꺾일지 모르는 반도체 사이클에 대비해야 한다고 경고하고 있습니다.`,
  outlook:`향후 AI 수요의 지속 여부와 차세대 반도체 기술 경쟁의 승패에 따라 수출 실적이 크게 요동칠 전망입니다.`,
  sources:[{title:`반도체 수출 역대 최대와 쏠림 우려 - EA뉴스`,url:`https://www.eanews.kr`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미 연준 다음 주 기준금리 0.25%p 인상 확률 86% 급등, 금융시장 긴장`,
  metrics:[`미국 10년물 국채 금리 4.99%`,`기준금리 0.25%p 인상 확률 86%`],
  summary:`미국 8월 근원 물가 상승세가 예상보다 가파르게 나타나면서 미국 연방준비제도(Fed)의 행보에 비상이 걸렸습니다. 시장에서는 당초 예상과 달리 다음 주 연방공개시장위원회(FOMC)에서 기준금리를 0.25%p 인상할 확률이 무려 86%까지 치솟았습니다. 인플레이션 둔화 속도가 정체됨에 따라 긴축의 고삐를 다시 조일 수 있다는 관측입니다. 이로 인해 미국 10년물 국채 금리는 심리적 마지노선인 5%에 육박하는 4.99%까지 뛰어올랐습니다. 글로벌 달러 강세와 맞물려 한국을 포함한 신흥국 금융시장에서도 외국인 자금 이탈과 환율 변동성 확대 등 긴장감이 고조되고 있습니다.`,
  keyTerms:[{term:`근원 물가`,explanation:`농산물이나 에너지 등 가격 변동이 심한 품목을 제외하고 산출한 물가지수로, 경제의 기조적인 물가 흐름을 보여줍니다.`}],
  history:`연준은 고물가를 잡기 위해 가파른 금리 인상을 단행해 왔으나, 최근 물가 안정세를 기대하며 금리 인하 사이클 진입을 엿보고 있었습니다.`,
  players:`미국 연방준비제도(Fed), 한국은행, 글로벌 채권 및 외환 시장 투자자들이 핵심 주체입니다.`,
  current:`물가 지표 쇼크로 인해 시장의 금리 인하 기대가 후퇴하고 다시 긴축 공포가 살아나고 있습니다.`,
  outlook:`다음 주 FOMC의 실제 결정과 파월 의장의 기자회견 발언에 따라 글로벌 증시와 환율이 크게 요동칠 것입니다.`,
  sources:[{title:`미국 연준 금리 인상 긴장감 - 파이낸셜경제`,url:`https://www.foeconomy.co.kr`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`북한, 한미일 프리덤 에지 훈련 직후 동해상으로 단거리 탄도미사일 기습 발사`,
  metrics:[`단거리 탄도미사일 여러 발 발사`,`비행거리 약 250km`],
  summary:`북한이 12일 새벽 강원도 원산 일대에서 동해상으로 여러 발의 단거리 탄도미사일(SRBM)을 기습 발사했습니다. 발사된 미사일은 약 250km를 비행한 뒤 바다에 떨어졌습니다. 군 당국과 전문가들은 이번 무력 도발이 전날 종료된 한미일 3국의 다영역 연합훈련인 프리덤 에지에 대한 강력한 반발 성격인 것으로 분석하고 있습니다. 대통령실 국가안보실은 즉각 긴급 안보상황점검회의를 소집해 북한의 의도를 분석하고 우리 군의 대비 태세를 점검했습니다. 하반기 주요 한미 연합훈련을 앞두고 한반도 긴장이 다시 고조되고 있습니다.`,
  keyTerms:[{term:`프리덤 에지`,explanation:`한국, 미국, 일본 3국이 해상, 공중, 사이버 등 다양한 영역에서 군사적 협력을 강화하기 위해 실시하는 정례적인 연합 군사 훈련입니다.`}],
  history:`북한은 한미 또는 한미일 연합훈련이 실시될 때마다 이를 북침 전쟁 연습으로 규정하고 미사일 발사 등으로 맞대응해 왔습니다.`,
  players:`한국 국가안보실, 미군 인태사령부, 북한 국무위원회 및 미사일총국이 주요 행위자입니다.`,
  current:`굳건해지는 한미일 안보 협력에 맞서 북한도 국지적 도발 강도를 높이며 존재감을 과시하려 하고 있습니다.`,
  outlook:`향후 예정된 한미 연합훈련 기간 전후로 북한의 추가적인 미사일 발사나 국지도발 가능성에 대비해야 합니다.`,
  sources:[{title:`북한, 단거리 탄도미사일 기습 발사 - 서울경제`,url:`https://www.sedaily.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`우크라이나와 캐나다, 100년 파트너십 체결하며 드론 공동 생산 합의`,
  metrics:[`100년 기한의 파트너십 체결`,`군사 및 재건 분야 지원 확대`],
  summary:`볼로디미르 젤렌스키 우크라이나 대통령과 마크 카니 캐나다 총리가 안보와 경제를 아우르는 100년 파트너십 협정을 공식 체결했습니다. 이번 협정의 가장 큰 핵심은 전장에서 필수 비대칭 전력으로 자리 잡은 드론의 공동 생산을 대폭 확대한다는 것입니다. 양국은 무기 체계 개발뿐만 아니라 전후 재건 사업에 있어서도 한 세기에 걸친 장기적 협력을 약속했습니다. 반면, 블라디미르 푸틴 러시아 대통령은 서방의 이 같은 군사 지원 확대 및 유럽 군대의 우크라이나 파병 논의에 대해 러시아와의 직접적인 전쟁을 의미한다며 강력하게 경고해 긴장을 늦추지 않고 있습니다.`,
  keyTerms:[{term:`비대칭 전력`,explanation:`상대방의 강점을 우회하고 약점을 찌르기 위해 핵무기, 드론, 사이버 공격 등 기존 정규군과 다른 방식의 무기나 전술을 의미합니다.`}],
  history:`우크라이나 전쟁 발발 이후 서방 국가들은 무기 지원을 이어왔으나, 전쟁이 장기화되면서 자체 방위 산업 역량을 키우는 방향으로 선회하고 있습니다.`,
  players:`볼로디미르 젤렌스키 우크라이나 대통령, 마크 카니 캐나다 총리, 블라디미르 푸틴 러시아 대통령이 핵심 인물입니다.`,
  current:`우크라이나는 전력 손실을 메우기 위해 첨단 드론 확보에 사활을 걸고 있으며, 러시아는 서방의 개입 확대를 극도로 경계하고 있습니다.`,
  outlook:`이번 드론 공동 생산이 실제 전장에서 어느 정도의 효과를 발휘할지와 이에 대한 러시아의 구체적 보복 조치가 향후 전황의 변수입니다.`,
  sources:[{title:`우크라이나-캐나다 100년 파트너십 체결 - ISW`,url:`https://www.understandingwar.org`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`스웨덴 총선 실시, 극우 반이민 정당의 사상 첫 내각 진출 여부에 유럽 촉각`,
  metrics:[`13일 스웨덴 총선 투표 진행`,`극우 스웨덴민주당 지지율 20%대 상회`],
  summary:`13일 북유럽 복지국가의 상징인 스웨덴에서 향후 4년의 국정을 결정할 총선거 투표가 실시되었습니다. 이번 선거의 최대 관전 포인트는 강력한 반이민 정책과 반이슬람 정서를 내세운 극우 성향의 스웨덴민주당이 사상 처음으로 연립 정부 내각에 참여할 수 있을지 여부입니다. 스웨덴 내 갱단 폭력 등 심각한 치안 문제와 경제 악화가 맞물리면서 극우 세력에 대한 지지가 급증했습니다. 최근 독일 지방선거에서도 극우 정당이 압승을 거둔 가운데, 스웨덴에서도 극우가 득세할 경우 유럽 전역의 정치 지형이 보수화되는 극우 돌풍이 걷잡을 수 없이 확산될 수 있다는 분석이 나옵니다.`,
  keyTerms:[{term:`연립 정부`,explanation:`단일 정당이 의회에서 과반수 의석을 차지하지 못할 때, 두 개 이상의 정당이 협력하여 함께 내각을 구성하고 국가를 운영하는 체제를 말합니다.`}],
  history:`스웨덴은 오랫동안 관대한 난민 포용 정책을 펼쳐왔으나, 최근 이주민 융합 실패와 폭력 범죄 증가로 사회적 갈등이 팽배해졌습니다.`,
  players:`집권 중도좌파 연합, 보수 성향의 우파 연합, 그리고 킹메이커로 떠오른 스웨덴민주당이 주요 정당입니다.`,
  current:`기존 주류 정치에 실망한 유권자들이 범죄 엄단을 외치는 극우 정당에 몰리면서 전통적인 북유럽식 다당제 질서가 흔들리고 있습니다.`,
  outlook:`선거 결과 스웨덴민주당이 내각에 입성하게 되면, 스웨덴의 이민 문호가 굳게 닫히고 유럽 연합(EU) 내부의 연대에도 균열이 생길 수 있습니다.`,
  sources:[{title:`스웨덴 총선 실시, 극우 내각 진출 여부 주목 - 연합뉴스`,url:`https://www.yna.co.kr`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`외국 기업에 산업기밀 유출해도 간첩죄 처벌, 개정 형법 13일 전면 시행`,
  metrics:[`최대 30년 유기징역`,`국가 기밀의 범위를 외국으로 확대`],
  summary:`13일부터 국가의 핵심 산업기밀을 외국 기업이나 단체에 유출하는 행위도 간첩죄로 무겁게 처벌할 수 있는 개정 형법이 전면 시행됩니다. 과거 법안은 간첩죄의 적용 대상을 적국인 북한으로만 한정하고 있어, 우방국이나 외국 기업으로 첨단 기술이 유출되어도 처벌 수위가 낮다는 지적이 많았습니다. 이번 개정으로 최고 사형부터 최대 30년 유기징역까지 선고가 가능해져 기술 유출에 대한 강력한 억지력을 갖추게 되었습니다. 그러나 외신과 업계 일각에서는 중국 등 경쟁국이 퇴직 기술자들에게 천문학적인 고액 연봉을 제시하며 인력을 빼가는 구조적 문제 자체를 법 개정만으로 완전히 막아내기는 역부족일 것이라는 뼈아픈 지적도 나옵니다.`,
  keyTerms:[{term:`개정 형법`,explanation:`사회의 변화나 새로운 범죄 유형에 대응하기 위해 국회에서 기존의 형사 처벌 법률을 새롭게 고쳐 만든 법률입니다.`}],
  history:`수년간 반도체, 디스플레이 등 한국의 핵심 국가 전략 기술이 외국으로 유출되는 사례가 잦았으나 약한 처벌에 그쳤습니다.`,
  players:`국가정보원 산업기밀보호센터, 사법부, 그리고 삼성전자와 SK하이닉스 등 첨단 기술 보유 기업들입니다.`,
  current:`법적 처벌 기준은 대폭 상향되었지만, 수사기관의 입증 책임과 은밀화되는 유출 수법을 따라잡는 것은 여전히 과제로 남아 있습니다.`,
  outlook:`법 시행 이후 첫 적발 사례의 형량과 실질적인 인재 유출 방지 대책이 어떻게 마련될지 산업계의 이목이 쏠리고 있습니다.`,
  sources:[{title:`간첩죄 개정안 시행과 반도체 기술 유출 우려 - 글로벌이코노믹`,url:`https://www.g-enews.com`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`오픈AI 내년 상장 없다며 속도 조절, 앤트로픽도 AI 통제 상실 강력 경고`,
  metrics:[`2026년 내 IPO 미추진`,`미스트랄 4조 9천억 원 투자 유치`],
  summary:`생성형 AI 업계를 이끄는 주요 리더들이 일제히 무분별한 개발에 제동을 거는 속도 조절론을 제기했습니다. 샘 올트먼 오픈AI CEO는 최신 인터뷰에서 기술의 사회적 여파와 AI 안전 우려를 이유로 2026년 내 기업공개(IPO)는 없다고 선을 그었습니다. 경쟁사인 앤트로픽의 다리오 아모데이 CEO 역시 블로그를 통해 AI가 인류의 통제를 벗어날 수 있는 오용 위험을 경고하며 안전장치 마련이 시급하다고 촉구했습니다. 흥미롭게도 이러한 규제 목소리 속에서도 자본은 여전히 AI에 몰리고 있습니다. 프랑스의 대표 AI 스타트업인 미스트랄은 삼성전자가 주도한 펀딩 라운드에서 약 4조 9000억 원의 투자를 새로 유치하며 폭발적인 성장세를 증명했습니다.`,
  keyTerms:[{term:`기업공개`,explanation:`회사가 일반 대중에게 주식을 처음으로 팔아 자금을 모으고, 그 대가로 주식 시장에 상장하여 투명한 경영을 약속하는 절차입니다.`}],
  history:`챗GPT 등장 이후 글로벌 빅테크 기업들은 더 크고 똑똑한 모델을 앞다투어 출시하며 사활을 건 속도전을 벌여왔습니다.`,
  players:`오픈AI의 샘 올트먼, 앤트로픽, 삼성전자, 그리고 유럽의 기대주인 미스트랄이 AI 생태계의 주요 플레이어들입니다.`,
  current:`막대한 개발 비용 충당과 기술의 안전성 검증 사이에서 업계 리더들의 딜레마가 커지고 있는 상황입니다.`,
  outlook:`향후 각국 정부의 AI 규제 법안 도입 속도와 안전한 인공일반지능 도달을 위한 기업들의 기술적 해법이 초미의 관심사입니다.`,
  sources:[{title:`샘 올트먼 OpenAI 2026년 내 상장 계획 없다 - 스트레이츠타임스`,url:`https://www.straitstimes.com`},{title:`앤트로픽 CEO의 AI 오용 경고 - 연합뉴스`,url:`https://www.yna.co.kr`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`네이버 카카오, 비핵심 서비스 줄폐업하고 생존형 AI 올인 포트폴리오 재편`,
  metrics:[`네이버 바이브 12월 31일 종료`,`카카오 계열사 140여 개에서 92개로 감축`],
  summary:`국내 양대 플랫폼인 네이버와 카카오가 수익성이 떨어지는 비핵심 사업을 과감하게 정리하며 혹독한 구조조정에 나서고 있습니다. 네이버는 자체 음원 스트리밍 서비스인 바이브를 오는 12월 31일 자로 공식 종료하기로 결정했으며, 카카오 또한 140개가 넘던 무분별한 계열사를 92개까지 대폭 감축했습니다. 이는 글로벌 빅테크의 거센 공세 속에서 살아남기 위한 생존형 포트폴리오 최적화 전략의 일환입니다. 양사는 문어발식 확장을 멈추는 대신, 확보한 자원과 인력을 자체 AI 에이전트 서비스 개발에 전면 투입하여 인공지능 시대의 주도권을 놓치지 않겠다는 이른바 AI 올인 의지를 강력하게 불태우고 있습니다.`,
  keyTerms:[{term:`포트폴리오 최적화`,explanation:`기업이 가진 여러 사업이나 투자 항목 중에서 이익이 안 나는 것을 버리고 유망한 분야에 집중하여 전체 수익률과 효율을 높이는 과정입니다.`}],
  history:`팬데믹 시기 풍부한 유동성을 바탕으로 문어발식 사업 확장을 거듭하던 두 기업은 최근 실적 둔화와 주가 하락이라는 역풍을 맞았습니다.`,
  players:`네이버, 카카오 등 국내 토종 플랫폼과 유튜브, 구글, 메타 등 이들을 위협하는 글로벌 빅테크 기업들입니다.`,
  current:`비용 절감과 조직 슬림화를 통해 군살을 빼는 한편, 글로벌 AI 경쟁에서 뒤처지지 않기 위해 안간힘을 쓰고 있습니다.`,
  outlook:`선택과 집중의 결과물로 선보일 네이버 에이전트N과 카카오 카나나 등 신규 AI 서비스의 시장 안착 여부가 미래 가치를 결정할 것입니다.`,
  sources:[{title:`네이버 바이브 종료 및 카카오 계열사 슬림화 - CEO스코어데일리`,url:`https://www.ceoscoredaily.com`}]
}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`고유가와 미 금리 인상 우려에 코스피 7,000선 붕괴, 환율 상승`,
  metrics:[`코스피 6,909.91 마감 (-1.76%)`,`원·달러 환율 1,345.9원 (+6.7원)`],
  summary:`9월 11일 코스피 지수가 고유가와 미국의 금리 인상 우려가 겹치며 1.76% 급락한 6,909.91로 마감하여 7,000선 아래로 주저앉았다. 이는 글로벌 인플레이션 압박이 지속됨에 따라 투자 심리가 크게 위축된 결과로 분석된다. 코스닥 역시 1.95% 하락하며 동반 약세를 보였다. 서울 외환시장에서는 안전자산 선호 심리가 강해지며 원·달러 환율이 전날보다 6.7원 오른 1,345.9원을 기록했다. 미국의 근원 물가가 예상보다 높게 나오면서 연방준비제도의 매파적 기조가 유지될 것이란 불안감이 시장을 짓누르고 있다. 당분간 증시의 변동성은 매우 클 것으로 전망된다.`,
  keyTerms:[{term:`안전자산 선호 심리`,explanation:`시장 불확실성이 커질 때, 달러나 금 등 가치 변동이 적고 안전한 자산으로 투자 자금이 몰리는 현상을 뜻해.`}],
  history:`최근 이란 갈등 우려로 국제 유가가 급등하며 글로벌 물가 상승 압력이 다시 커지고 있었어.`,
  players:`글로벌 투자자, 한국은행, 그리고 금리 결정을 앞둔 미국 연방준비제도(Fed)가 주요 변수야.`,
  current:`미국의 핵심 물가 지표가 예상치를 웃돌면서 금리 인상 공포가 한국 증시와 환율에 직접적인 타격을 입힌 상황이야.`,
  outlook:`다음 주 열리는 미 연준의 FOMC 회의 결과에 따라 국내 금융 시장의 방향성이 크게 좌우될 것으로 보여.`,
  sources:[{title:`고금리·고유가 덮치며 코스피 하락 - 연합뉴스TV`,url:`https://www.yonhapnewstv.co.kr/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미 8월 근원 물가 0.3% 상승, 연준의 9월 금리 인상 확률 86%로 급등`,
  metrics:[`미 8월 근원 CPI 0.3% 상승`,`9월 금리 인상 확률 86%`],
  summary:`미국의 8월 소비자물가지수(CPI)가 발표된 가운데, 식료품과 에너지를 제외한 근원 CPI가 전월 대비 0.3% 상승하며 시장 예상치를 상회했다. 물가가 여전히 끈적하다는 사실이 확인되면서, 시장이 예측하는 미국 연방준비제도의 9월 기준금리 인상 확률이 기존 70%대에서 86%까지 급등했다. 이는 연준이 인플레이션을 확실히 잡기 위해 추가 긴축에 나설 가능성이 커졌음을 의미한다. 이번 지표는 물가 안정에 대한 시장의 기대를 꺾어버리는 충격으로 다가왔다. 금리 인상 우려가 고조되면서 국채 금리가 상승하고 시장의 긴장감이 높아지고 있다. 투자자들은 연준의 행보가 글로벌 경제 전반에 미칠 파장에 촉각을 곤두세우고 있다.`,
  keyTerms:[{term:`근원 CPI`,explanation:`가격 변동이 심한 농산물이나 에너지를 제외하고, 물가의 장기적인 추세를 보여주는 핵심 소비자물가지수야.`}],
  history:`미국은 지속적인 금리 인상에도 불구하고 물가 상승세가 연준의 목표치인 2%로 쉽게 내려오지 않는 상황이었어.`,
  players:`금리를 결정하는 미 연준(Fed), 인플레이션의 영향을 받는 기업 및 소비자들이 주요 주체야.`,
  current:`FOMC 회의 직전에 발표된 물가 지표가 예상보다 강하게 나오면서, 금리 동결을 기대했던 시장에 실망감을 안겼어.`,
  outlook:`9월 15~16일로 예정된 FOMC 회의에서 실제 금리 인상 여부와 향후 통화 정책 방향에 대한 연준의 메시지가 주목받고 있어.`,
  sources:[{title:`뜨거운 물가에 9월 인상 베팅 급증 - 로이터`,url:`https://www.reuters.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`글로벌 국채 금리 연중 최고치 돌파, 채권 시장 충격`,
  metrics:[`미 10년물 국채 금리 4.98%`,`미 30년물 국채 금리 5.38%`],
  summary:`국제 유가 급등과 글로벌 인플레이션 장기화 우려로 인해 미국 국채 금리가 연중 최고치로 치솟으며 채권 시장이 큰 충격을 받았다. 미국의 10년 만기 국채 금리는 19년 만에 최고 수준인 연 4.98%를 기록했고, 30년 만기 금리도 연 5.38%까지 급등했다. 유럽중앙은행(ECB) 관계자들 또한 에너지 가격 상승세가 지속될 경우 추가 금리 인상이 필요할 수 있다고 경고했다. 이처럼 주요국 중앙은행들의 긴축 장기화 기조가 뚜렷해지면서, 기존 채권의 가치가 하락하는 채권 시장의 매도세가 가속화되고 있다. 이는 기업들의 자금 조달 비용 증가로 이어져 실물 경제에도 뚜렷한 부담을 줄 전망이다. 정부와 투자자 모두 금리 향방을 예의주시하며 긴장 상태를 유지하고 있다.`,
  keyTerms:[{term:`채권 시장`,explanation:`정부나 기업이 돈을 빌리기 위해 발행한 채권이 거래되는 곳으로, 시중 금리의 움직임을 가장 민감하게 반영해.`}],
  history:`팬데믹 이후 시작된 주요국들의 고강도 금리 인상 사이클이 마무리될 것이란 기대감이 최근 점차 꺾이고 있었어.`,
  players:`막대한 자금을 운용하는 글로벌 채권 투자자들과 유럽중앙은행(ECB), 미 연준 등 주요국 중앙은행들이 얽혀 있어.`,
  current:`이란 갈등 등으로 인한 유가 폭등이 인플레이션을 다시 자극할 것이란 공포가 국채 금리 급등을 촉발했어.`,
  outlook:`각국 중앙은행의 추가적인 매파적 발언이나 물가 상승 지표가 나오면 금리 오름세가 더 가팔라질 수 있어.`,
  sources:[{title:`글로벌 채권 시장 흔들, 유가와 금리 압박 - 블룸버그`,url:`https://www.bloomberg.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`호르무즈 해협 파병 압박 속 한국 정부 "결정된 바 없다" 신중론`,
  metrics:[`한-이란 외교장관 통화 1회`,`재외국민 안전 보호 강조`],
  summary:`조현 외교부 장관이 이란 외교장관과의 통화에서 미국의 호르무즈 해협 연합 방위 참여 요구에 대해 아직 결정된 것이 없다며 신중한 입장을 밝혔다. 최근 미국의 거센 호르무즈 해협 파병 압박 속에서, 이란 측이 타국의 군사적 참여를 강력히 경고하고 나서자 한국 정부의 외교적 고민이 깊어지고 있다. 조 장관은 항행의 자유와 해당 지역에 체류 중인 재외국민의 안전을 최우선으로 고려하고 있음을 강조했다. 미국과의 동맹을 유지하면서도 중동 내 주요 교역국인 이란과의 마찰을 피해야 하는 줄타기 외교가 시험대에 올랐다. 이재명 대통령 또한 수석보좌관회의에서 국제 공조의 중요성을 언급하며 국익을 위한 전략적 모호성을 유지하고 있다. 향후 정부가 실리와 명분 사이에서 어떤 최종 선택을 내릴지 정치권의 이목이 집중된다.`,
  keyTerms:[{term:`전략적 모호성`,explanation:`외교 문제에서 어느 한쪽의 편을 명확히 들지 않고, 상황에 따라 유연하게 대처하기 위해 입장을 뚜렷하게 밝히지 않는 태도야.`}],
  history:`미국은 우방국들에게 중동 호르무즈 해협의 항행 안전을 명분으로 연합 함대 참여를 지속적으로 요구해 왔어.`,
  players:`군사적 지원을 압박하는 미국, 이에 반발하는 이란, 그리고 그 사이에서 국익을 저울질하는 한국 정부가 얽혀 있어.`,
  current:`이란 측이 타국의 파병을 적대 행위로 간주하겠다고 엄포를 놓으면서, 한국이 섣불리 결정을 내리기 매우 까다로운 상황이 됐어.`,
  outlook:`미국의 압박 수위와 이란의 반발 사이에서 정부가 최종적으로 어떤 방식의 기여를 선택할지 외교적 결정이 주목돼.`,
  sources:[{title:`조현 장관, 이란과 통화... 파병에 신중 - 연합뉴스`,url:`https://www.yna.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`캐나다, 우크라이나에 3억 5천만 달러 규모 방공 미사일 지원 합의`,
  metrics:[`지원 규모 3.5억 CAD`,`사망자 최소 5명 (드론 공격)`],
  summary:`마크 카니 캐나다 총리가 볼로디미르 젤렌스키 우크라이나 대통령과 회담을 가진 후, 우크라이나에 3억 5천만 캐나다 달러 규모의 방공 요격 미사일을 지원하기로 합의했다. 이는 최근 러시아가 우크라이나 파블로그라드 등 민간 지역에 가한 무차별적인 드론 공격으로 사상자가 속출하고 있는 상황에 대응하기 위한 긴급 조치다. 러시아의 계속되는 공세 속에서 서방 진영의 군사적 지원이 우크라이나의 방어력 유지에 필수적인 역할을 톡톡히 하고 있다. 한편, 젤렌스키 대통령은 다가오는 러시아 대선 전에는 전쟁 종식을 위한 어떠한 3자 회담도 응하지 않겠다며 매우 강경한 입장을 고수하고 있다. 우크라이나는 서방의 지원을 바탕으로 방공망을 대폭 확충하며 장기전에 대비한 체력을 비축하고 있다. 이번 지원이 전황을 반전시킬 돌파구가 될 수 있을지 국제사회가 지켜보고 있다.`,
  keyTerms:[{term:`방공 요격 미사일`,explanation:`적의 항공기나 드론, 미사일이 목표물에 도달하기 전에 공중에서 맞혀 파괴하는 방어용 무기 체계야.`}],
  history:`우크라이나 전쟁이 장기화되면서 러시아는 주요 인프라를 노린 공습을 지속해왔고, 우크라이나는 방공망 부족을 호소해왔어.`,
  players:`군사 지원을 제공하는 캐나다 등 서방 국가와 방어를 이어가는 우크라이나, 공세를 늦추지 않는 러시아가 핵심 주체야.`,
  current:`러시아의 집중적인 드론 타격으로 민간 피해가 커지자, 국제사회가 신속하게 방공 무기 추가 지원에 나서고 있어.`,
  outlook:`서방의 방공망 지원이 우크라이나의 영공 방어에 얼마나 실질적인 효과를 발휘할지, 러시아의 추가 도발 여부가 관건이야.`,
  sources:[{title:`캐나다, 우크라에 대규모 방공망 지원 - 로이터`,url:`https://www.reuters.com/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미 대선 앞둔 트럼프, 우편 투표 제한 행정명령 제동 및 적극적인 선거 지원`,
  metrics:[`9/11 테러 25주년`,`텍사스 등 주요 경합주 유세 집중`],
  summary:`도널드 트럼프 미국 대통령이 다가오는 중간선거를 앞두고 공화당 후보들에 대한 전폭적인 지원 유세에 나서는 한편, 선거 제도와 관련한 치열한 법적 공방을 겪고 있다. 트럼프 대통령은 텍사스를 방문해 박빙의 승부를 벌이고 있는 켄 팩스턴 공화당 후보의 자금 모금을 돕는 등 보수층 결집에 안간힘을 쓰고 있다. 이와 동시에, 그가 강력히 추진했던 우편 투표 제한 관련 행정명령은 연방 항소법원에 의해 집행 정지 결정이 유지되면서 제동이 걸렸다. 9/11 테러 25주년 추모식에서도 트럼프 대통령은 대테러 안보를 강조하며 지지층을 향한 강력한 메시지를 던졌다. 선거일이 불과 8주 미만으로 다가오면서 양당의 정치적 셈법과 갈등이 최고조에 달하고 있다. 투표 방식에 대한 룰 세팅이 최종 선거 결과에 막대한 영향을 미칠 것으로 분석된다.`,
  keyTerms:[{term:`우편 투표`,explanation:`투표소에 직접 가지 않고 우편을 통해 투표용지를 제출하는 방식으로, 미국의 선거 결과에 큰 영향을 미치는 쟁점이야.`}],
  history:`미국 선거에서는 투표의 편의성과 선거 부정 가능성을 두고 민주당과 공화당 간의 제도적 갈등이 오랜 기간 지속되어 왔어.`,
  players:`지지층을 결집하려는 트럼프 대통령과 공화당, 그리고 이에 맞서는 민주당 및 사법부가 팽팽히 맞서고 있어.`,
  current:`선거를 코앞에 두고 법원이 우편 투표 제한에 제동을 걸면서, 선거판의 유불리를 따지는 정치권의 움직임이 분주해졌어.`,
  outlook:`우편 투표 참여율과 경합주의 투표 결과가 다가오는 미국 중간선거의 최종 승패를 가를 핵심 변수가 될 전망이야.`,
  sources:[{title:`트럼프, 선거 앞두고 우편 투표 항소심 패배 - AP 통신`,url:`https://apnews.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`ETRI, '설명 가능한 AI' 개발로 도로 위 쓰러진 사람 실시간 탐지 등 생활 안전 강화`,
  metrics:[`하수처리장 약품 11% 절감`,`설명 가능한 AI 생활 안전 시스템 적용`],
  summary:`한국전자통신연구원(ETRI)이 단순히 결과만 도출하는 것을 넘어 결론의 근거까지 확실히 제시하는 설명 가능한 AI 기술을 성공적으로 개발하여 실생활 안전 분야에 도입하고 있다. 이 혁신적인 기술은 도로 위에 쓰러진 사람을 실시간으로 탐지하거나 불법 쓰레기 투기를 정확히 적발하는 등 시각적 판단의 신뢰성을 크게 높였다. 또한 광주환경공단에서는 하수처리장에 AI 자동제어시스템을 적용해 약품 사용량을 11%나 절감하는 등 AI의 환경적 기여도 가시화되고 있다. 기존 인공지능 모델이 가진 블랙박스의 한계를 극복함으로써, 판단 과정의 투명성이 필수적인 공공 시스템에 도입할 수 있는 길을 열었다. 현재 이 기술은 시각장애인을 위한 안내 로봇 등 섬세하고 민감한 의사결정이 필요한 분야로 발 빠르게 적용이 확대되고 있다. 이는 한국의 AI 기술이 시민의 안전과 직결된 차세대 공공 서비스 혁신을 이끌고 있음을 명확히 보여준다.`,
  keyTerms:[{term:`설명 가능한 AI`,explanation:`인공지능이 어떤 과정을 거쳐 결론을 내렸는지 사람이 이해할 수 있는 형태로 이유와 근거를 보여주는 기술이야.`}],
  history:`기존의 딥러닝 AI는 결과를 내놓는 과정이 투명하지 않은 블랙박스 형태여서, 생명이나 안전과 직결된 분야에 도입하기 어려웠어.`,
  players:`혁신적인 기술을 연구하는 한국전자통신연구원(ETRI)과 이를 실제 공공 안전망에 적용하려는 지자체 및 기관들이 참여하고 있어.`,
  current:`AI가 판단 근거를 시각적으로 명확히 제시할 수 있게 되면서, 위험 상황 판단과 공공 행정에서의 활용도가 급격히 높아졌어.`,
  outlook:`향후 의료, 자율주행, 법률 등 신뢰성이 필수적인 고위험 산업군으로 이 기술의 상용화가 더욱 빠르게 확산될 것으로 기대돼.`,
  sources:[{title:`ETRI, 이유 알려주는 똑똑한 AI로 생활 안전 지킨다 - 연합뉴스`,url:`https://www.yna.co.kr/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`오픈AI, 최첨단 AI 개발 속도 조절 검토 및 글로벌 헬스케어 AI 도입 가속`,
  metrics:[`농부 17% 생성형 AI 활용`,`AI 보안 시장 2028년 77억 달러 전망`],
  summary:`글로벌 인공지능 산업이 전례 없이 급팽창하는 가운데, 안전성과 부작용에 대한 우려로 업계 내부에서 자발적으로 개발 속도를 조절하려는 움직임이 일고 있다. 샘 올트먼 오픈AI CEO는 최첨단 AI 시스템의 잠재적 위험성을 엄중히 고려해 개발 속도를 늦추는 방안을 심도 있게 검토 중이라 밝혔으며, 앤트로픽은 자사 모델이 악용될 뻔한 심각한 사례들을 차단했다고 발표했다. 한편, 실생활에서의 기술 도입은 전방위로 확산되어 글로벌 농부의 17%가 생성형 AI를 업무에 적극 활용하고 있으며, 헬스케어 분야에서는 데이터 기반 예방 의학으로의 패러다임 전환이 빠르게 진행 중이다. 폭발적인 AI 수요와 성장에 따라 데이터센터 확충이 시급해진 마이크로소프트는 서버 용량을 무려 3배 이상 증설하기로 결단했다. 이처럼 산업의 눈부신 혁신을 촉진하는 동시에 안전을 위한 규제라는 두 마리 토끼를 잡기 위한 전 세계적 논의가 바야흐로 본격화되고 있다. 미래 기술 패권과 인류의 안전 사이에서 기업들이 어떻게 균형을 잡을지 귀추가 주목된다.`,
  keyTerms:[{term:`생성형 AI`,explanation:`사용자의 질문이나 요구에 맞춰 텍스트, 이미지, 코드 등 새로운 콘텐츠를 스스로 만들어내는 인공지능이야.`}],
  history:`챗GPT의 등장 이후 글로벌 빅테크 기업들이 AI 패권 경쟁에 뛰어들면서, AI 능력의 발전 속도가 안전 통제 기술을 앞지르고 있다는 지적이 꾸준히 제기돼 왔어.`,
  players:`AI 개발을 주도하는 오픈AI, 앤트로픽 등의 빅테크 기업들과 농업, 의료 등 실제 산업 현장의 사용자들이 중심에 있어.`,
  current:`고도화된 AI가 범죄나 무기 개발에 악용될 가능성이 현실로 나타나면서, 선도 기업들이 자발적으로 속도 조절과 보안 강화를 논의하기 시작했어.`,
  outlook:`각국 정부의 AI 규제 법안 도입과 기업들의 자율적인 안전 가이드라인 마련이 앞으로 AI 산업의 지속 가능성을 결정할 핵심 이슈야.`,
  sources:[{title:`오픈AI, 개발 속도 늦추나... AI 안전성 도마 위 - 블룸버그`,url:`https://www.bloomberg.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`역대 가장 뜨거웠던 8월 기록, 네팔은 '기후 정의' 50억 달러 청구`,
  metrics:[`네팔 50억 달러 기후 기금 요구`,`중국 2026년 석유 수요 8.9% 감소`],
  summary:`기후 변화와 엘니뇨의 파괴적인 영향이 극에 달하면서, 유럽연합 코페르니쿠스 기후변화 서비스는 올해 8월이 관측 사상 가장 더웠던 달로 기록되었다고 공식 발표했다. 지구 온난화로 인한 끔찍한 기상 이변이 속출하는 가운데, 최근 대홍수를 겪은 네팔 정부는 선진국들을 향해 복구 자금으로 50억 달러를 요구하며 이를 기후 정의 문제로 정면 제기했다. 반면, 글로벌 에너지 수요 지형도 구조적으로 변화하여 중국의 2026년 석유 수요는 8.9% 감소한 것으로 나타났으나, 글로벌 석탄 수요는 멈추지 않고 여전히 증가 추세를 보이고 있다. 선진국의 과거 탄소 배출 책임과 현재 피해를 입고 있는 개발도상국의 보상 문제가 강하게 맞물리면서, 국제 사회의 기후 대응 비용 분담 논쟁이 한층 격렬하고 치열해질 전망이다. 이제 기후 재난은 단순한 환경 문제를 넘어 막대한 경제적 손실과 복잡한 외교적 갈등으로 번지는 양상이다. 온실가스 감축이라는 공동의 목표 앞에서 국가 간의 날 선 대립이 어떤 결실을 맺을지 전 세계가 우려 섞인 시선으로 바라보고 있다.`,
  keyTerms:[{term:`기후 정의`,explanation:`기후 변화를 초래한 책임이 큰 선진국이, 피해를 고스란히 떠안는 개발도상국이나 취약 계층을 적극적으로 지원하고 보상해야 한다는 개념이야.`}],
  history:`수십 년간 누적된 온실가스 배출로 인해 지구 평균 기온이 지속적으로 상승하면서 폭염, 홍수 등 극단적인 이상 기후 현상이 전 세계적으로 빈발하고 있어.`,
  players:`화석연료를 많이 소비해 온 선진국 및 산업 국가들과 기후 재난에 무방비로 노출된 개발도상국 정부들이 협상 테이블에 마주 앉아 있어.`,
  current:`네팔과 같은 취약 국가들이 더 이상 자체적인 복구 능력에 의존하지 않고, 국제 사회를 향해 명시적으로 금전적 보상을 요구하는 단계에 이르렀어.`,
  outlook:`앞으로 열릴 유엔 기후변화협약 당사국총회(COP) 등에서 '손실과 피해' 보상 기금의 구체적인 규모와 분담 방식을 둘러싼 선진국과 개도국 간의 치열한 줄다리기가 예상돼.`,
  sources:[{title:`기록적인 폭염 속 네팔, 선진국에 기후 청구서 내밀어 - 로이터`,url:`https://www.reuters.com/`}]
}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`IMF, 중동 전쟁과 에너지 충격 속에서도 올해 세계 경제 3% 성장 전망`,
  metrics:[`3% 경제 성장률`,`유가 6주 만에 최고치`],
  summary:`국제통화기금(IMF)이 올해 세계 경제가 중동 전쟁으로 인한 에너지 충격에도 불구하고 예상보다 잘 버텨내며 약 3% 성장할 것으로 발표했습니다. 인공지능(AI) 기술 혁신이 생산성 향상을 이끌며 긍정적인 활력을 불어넣고 있는 것이 주요 원인으로 꼽힙니다. 반면, 이란을 비롯한 중동 갈등 격화로 에너지 및 식량 가격이 치솟으면서 인플레이션 우려도 동시에 커지고 있습니다. 이처럼 상반된 두 가지 요인이 팽팽하게 맞서며 세계 경제의 흐름을 좌우하고 있습니다. 특히 호르무즈 해협의 긴장감으로 유가가 단기 급등하면서 신흥국 통화 가치에 압박을 가하는 상황입니다. 전문가들은 고물가 상황에서도 급격한 침체 없이 완만한 성장을 잇는 글로벌 경제 연착륙이 지속될지 주목하고 있습니다. 각국 중앙은행은 인플레이션 재발을 막기 위해 금리 인하에 신중한 태도를 보이며 시장 상황을 면밀히 모니터링 중입니다.`,
  keyTerms:[{term:`글로벌 경제 연착륙`,explanation:`고물가나 지정학적 위기 속에서도 경제가 급격히 침체되지 않고 완만한 성장세를 유지하는 상태를 의미합니다.`}],
  history:`코로나19 팬데믹 이후 각국의 막대한 유동성 공급과 최근 중동 분쟁이 겹치면서 전 세계적으로 물가가 요동쳤습니다. 이를 잡기 위해 각국 중앙은행이 고금리 정책을 유지해왔습니다.`,
  players:`세계 경제성장률을 예측하는 국제통화기금(IMF)과 통화 정책을 주도하는 미국 연방준비제도(Fed)가 핵심 주체입니다.`,
  current:`현재 AI 붐이 이끄는 주식 시장의 호조와 에너지 가격 상승에 따른 인플레이션 압력이 동시에 경제를 견인하고 있습니다.`,
  outlook:`연말까지 중동 사태의 확전 여부와 국제 유가 추이에 따라 세계 경제 성장률 전망치가 추가로 조정될 가능성이 있습니다.`,
  sources:[{title:`Global economy holds steady amid Middle East shocks - Reuters`,url:`https://www.reuters.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`트럼프, 캐나다 겨냥 관세 전쟁 경고... 글로벌 채권 금리 수년 내 최고치 급등`,
  metrics:[`미국 채권 금리 수년 내 최고치`,`S&P 500 목표 8,000선 상향`],
  summary:`미국 트럼프 대통령이 SNS를 통해 캐나다를 직접 겨냥하며 무역 관세 인상을 경고해 양국 간의 경제적 긴장감이 최고조에 달했습니다. 이러한 소식과 함께 글로벌 자본 시장에서는 안전 자산 선호 현상이 짙어지며 채권 금리가 수년 만에 최고치로 치솟았습니다. 미국의 보호무역주의가 다시 강화될 것이라는 우려가 커지면서 신흥국 자산 시장과 통화 가치도 연일 하락 압박을 받고 있습니다. 반면, 미국 내 주식 시장은 AI 기업들의 강력한 실적 모멘텀에 힘입어 긍정적인 전망을 유지하고 있습니다. 골드만삭스와 JP모건 등 주요 투자은행들은 S&P 500 지수 목표치를 8,000선 이상으로 상향 조정하며 미국 증시의 독주를 예상했습니다. 결국 무역 갈등으로 인한 채권 시장의 충격과 기술주 중심의 증시 호황이 뚜렷하게 대비되고 있습니다. 투자자들은 다가오는 미 연준(Fed)의 9월 금리 결정에 촉각을 곤두세우고 있습니다.`,
  keyTerms:[{term:`채권 금리`,explanation:`국가나 기업이 돈을 빌릴 때 발행하는 채권에 붙는 이자로, 이 수치가 오르면 시중의 돈이 말라 전반적인 경제에 부담을 줍니다.`}],
  history:`미국 우선주의를 내세우는 트럼프 행정부는 집권 2기 들어 인접국은 물론 글로벌 동맹국들을 상대로 무역 관세 장벽을 대폭 높이고 있습니다.`,
  players:`대미 수출 의존도가 높은 캐나다 정부와 관세 정책을 무기로 압박을 가하는 미국 트럼프 행정부가 대립 중입니다.`,
  current:`보호무역주의 기조가 강해지면서 채권 시장이 민감하게 반응하고 있으며, 이는 글로벌 자본 유출입에 직접적인 영향을 주고 있습니다.`,
  outlook:`다가오는 9월 미 연방준비제도의 연방공개시장위원회(FOMC) 회의 결과에 따라 채권 시장과 증시의 방향성이 다시 한번 크게 요동칠 것입니다.`,
  sources:[{title:`Global bond yields jump amid US-Canada tariff tensions - Bloomberg`,url:`https://www.bloomberg.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국 정부, 미국과 1,000억 달러 규모 에너지 투자 협상 막바지 돌입`,
  metrics:[`1,000억 달러 규모 투자`,`원전 8기 프로젝트`],
  summary:`김정관 산업통상자원부 장관이 미국을 방문해 대미 1,000억 달러(약 134조 원) 규모의 초대형 에너지 투자 협상을 마무리 짓고 있습니다. 이번 협상에는 원자력 발전소 8기 건설과 대규모 천연가스 프로젝트가 포함된 것으로 알려졌습니다. 이는 한국이 30%가량의 수익을 낼 수 있는 '한국형 원전' 펀드를 통해 미국 시장에 교두보를 마련하는 중대한 성과로 평가됩니다. 특히 핵추진잠수함 건조를 위한 국제원자력기구(IAEA)와의 협의 절차 착수 소식까지 겹치면서 국내 에너지 산업의 위상이 한층 높아지고 있습니다. 이번 협력을 통해 독자적인 원전 밸류체인을 구축하고, 글로벌 원전 르네상스 시대를 주도하겠다는 것이 정부의 계획입니다. 현재 양국 정부 간의 실무 합의가 거의 마무리 단계에 접어들어 최종 서명만을 남겨둔 상태입니다. 전문가들은 성공적인 계약 체결 시 관련 국내 기업들의 막대한 경제적 파급 효과를 예상하고 있습니다.`,
  keyTerms:[{term:`원전 밸류체인`,explanation:`원자력 발전소의 설계부터 핵심 부품 제조, 건설, 운영, 그리고 유지보수에 이르는 전체 산업 생태계와 공급망을 말합니다.`}],
  history:`과거 탈원전 정책 이후 위축되었던 국내 원전 산업이 최근 글로벌 에너지 안보 위기와 탄소 중립 기조를 타고 다시 강력한 수출 산업으로 육성되고 있습니다.`,
  players:`대규모 에너지 인프라 투자를 유치하려는 미국 정부와 이를 통해 수익 창출 및 산업 부흥을 노리는 한국 산업통상자원부가 주도하고 있습니다.`,
  current:`한국의 시공 능력과 미국의 원천 기술이 결합하는 형태로, 역대 최대 규모의 단일 에너지 투자 프로젝트가 성사되기 직전입니다.`,
  outlook:`협상이 성공적으로 타결되면 한국 원전 관련 기업들의 주가 및 실적 상승과 함께 유럽 등 추가적인 해외 수주 가능성도 크게 열릴 전망입니다.`,
  sources:[{title:`대미 1천억 달러 에너지 투자 협상 막바지... K원전 르네상스 - 매일경제`,url:`https://www.mk.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국과 이란 군사 충돌 격화, 중동 내 미군 표적 대상 보복 공격 감행`,
  metrics:[`중동 내 미군 표적 타격`,`미국 부통령 '전쟁' 단어 사용 자제`],
  summary:`미국이 중동 지역의 긴장 완화를 명분으로 이란의 주요 레이더 기지를 선제 타격하자, 이란이 즉각 보복 공격을 감행하며 군사 충돌이 격화되고 있습니다. 이란은 무인 드론과 미사일을 동원해 쿠웨이트와 바레인 등에 위치한 미군 및 동맹국 표적들을 공격했습니다. 양국 간의 전면전 우려가 확산되면서 국제 사회는 중동 정세의 급격한 악화에 촉각을 곤두세우고 있습니다. JD 밴스 미국 부통령은 사태 악화를 막기 위해 공식적으로 '전쟁'이라는 표현을 자제하며 외교적 해결의 여지를 남겼습니다. 그러나 트럼프 대통령은 이 사태로 촉발된 극심한 지정학적 리스크 때문에 단기간에 국제 유가가 진정되기는 어려울 것이라고 언급했습니다. 현재 중동 해상 운송로의 마비 우려와 맞물려 글로벌 공급망도 크게 위협받는 상황입니다. 유엔(UN)과 주요 국가들은 양측의 즉각적인 무력 사용 중단과 대화를 촉구하고 있습니다.`,
  keyTerms:[{term:`지정학적 리스크`,explanation:`국가 간의 정치적, 군사적 갈등이나 지리적 요인이 세계 경제와 금융 시장, 특히 유가나 공급망 등에 미치는 위험을 뜻합니다.`}],
  history:`미국과 이란은 핵합의 파기 이후 수년간 군사적, 경제적으로 대립해 왔으며, 최근 이스라엘-하마스 전쟁 여파로 대리전 양상을 띠다 직접 충돌로 번졌습니다.`,
  players:`군사적 타격을 감행한 미군과 이에 미사일로 반격하는 이란 혁명수비대, 그리고 주변 중동 국가들이 복잡하게 얽혀 있습니다.`,
  current:`쌍방의 군사적 타격이 현실화되면서 호르무즈 해협을 비롯한 주요 석유 운송로가 막힐 수 있다는 공포가 극에 달해 있습니다.`,
  outlook:`이란의 추가 보복 수위와 미국의 대응 방안에 따라 중동 지역 전체를 아우르는 전면적인 국지전으로 확대될 가능성을 배제할 수 없습니다.`,
  sources:[{title:`US and Iran exchange strikes as Middle East conflict escalates - AP News`,url:`https://apnews.com/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 대통령 특사단, 모스크바와 키이우 연이어 방문하며 우크라이나 평화 협상 타진`,
  metrics:[`전쟁 발발 이후 첫 셔틀 외교`,`수도 외곽 여전한 교전`],
  summary:`트럼프 행정부의 핵심 외교 라인인 재러드 쿠슈너를 포함한 미국 대통령 특사단이 모스크바와 키이우를 연달아 방문하며 우크라이나 전쟁 종식을 위한 행보를 본격화했습니다. 특사단은 푸틴 러시아 대통령과 비공개 회담을 가진 직후, 전쟁 발발 이후 처음으로 키이우를 방문해 젤렌스키 대통령과도 만났습니다. 이는 교착 상태에 빠진 전쟁을 끝내기 위해 강대국들이 직접 중재에 나섰음을 보여주는 중요한 상징적 사건입니다. 당장 휴전이 성사되지는 않았으나, 양국 간의 요구 조건을 조율하기 위한 고위급의 물밑 접촉이 실질적으로 시작되었다는 평가를 받습니다. 그럼에도 불구하고 우크라이나 수도 외곽과 동부 전선에서는 여전히 치열한 교전이 멈추지 않고 있습니다. 전문가들은 러시아의 점령지 인정 여부를 두고 양측의 입장 차이가 워낙 커서 단기간에 타결되기는 어려울 것으로 보고 있습니다. 향후 유럽연합(EU)의 중재 역할이 어떻게 작용할지가 중요한 변수로 남았습니다.`,
  keyTerms:[{term:`물밑 접촉`,explanation:`공식적인 외교 채널을 통하지 않고 특사나 정보기관 등을 통해 비밀리에 당사자들끼리 의견을 나누고 협상을 시도하는 것을 말합니다.`}],
  history:`수년째 이어진 우크라이나 전쟁은 양측 모두 막대한 인명 피해와 경제적 타격을 입었으나, 뚜렷한 전선 변화 없이 소모전 양상으로 접어들었습니다.`,
  players:`영토 탈환을 목표로 하는 우크라이나 정부, 현 점령지를 고수하려는 러시아, 그리고 종전을 강하게 압박하는 미국 트럼프 행정부가 주역입니다.`,
  current:`미국이 직접 특사단을 파견하여 최고 지도자들을 만남으로써 종전을 향한 정치적 압박이 그 어느 때보다 강해진 상황입니다.`,
  outlook:`이번 방문을 계기로 공식적인 휴전 회담 일정이 잡힐지, 혹은 군사적 우위를 점하기 위한 양국의 막바지 대공세가 벌어질지 주목됩니다.`,
  sources:[{title:`Trump envoys meet Putin and Zelenskyy in push for peace talks - BBC`,url:`https://www.bbc.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`이재명 대통령 '연임' 발언 및 국무위원 후보자 논란으로 정국 경색 심화`,
  metrics:[`지지율 8주 연속 하락`,`장관 후보자 2명 사퇴 거부`],
  summary:`이재명 대통령이 해외 순방 중 언급한 헌법상 임기 관련 발언을 두고 정치권에서 연임용 개헌 의도가 아니냐는 거센 논란이 일고 있습니다. 야당은 이를 강력히 비판하며 정부를 압박하고 있으나, 일부 언론은 현실적으로 개헌이 불가능하다며 선을 그었습니다. 여기에 더해 김승원, 용혜인 등 주요 장관 후보자들을 둘러싼 청탁 및 부당 이득 수령 의혹이 터져 나오면서 정국은 한층 더 얼어붙었습니다. 특히 국회에서 열린 경제 분야 대정부질문에서는 여야가 정책 검증보다 후보자들의 자질을 두고 원색적인 폭로전을 벌이며 정면 충돌했습니다. 논란의 중심에 선 후보자들은 각종 의혹을 전면 부인하며 자진 사퇴를 거부하고 있어, 청와대의 인사 검증 시스템에 대한 비판도 커지고 있습니다. 이러한 정치적 난맥상이 겹치면서 대통령의 국정 지지율은 8주 연속 하락하며 최저치를 갱신했습니다. 정부가 이 위기를 어떻게 돌파하고 민생 법안 처리를 이어갈 수 있을지 귀추가 주목됩니다.`,
  keyTerms:[{term:`대정부질문`,explanation:`국회의원들이 본회의에 국무총리나 장관들을 출석시켜 국정 운영 전반이나 특정 사회적 현안에 대해 직접 묻고 답변을 듣는 절차입니다.`}],
  history:`새 정부 출범 이후 잇따른 인사 잡음과 여야의 극단적인 대립이 누적되면서 국정 동력이 지속적으로 상실되어 왔습니다.`,
  players:`임기 연장 논란에 휩싸인 대통령실, 후보자 사퇴를 방어하는 여당, 그리고 연일 맹공을 퍼붓는 야당과 폭로에 나선 무소속 의원들이 대립 중입니다.`,
  current:`장관 후보자들의 자진 사퇴 거부로 인해 인사 청문회 일정이 마비되었고, 경제 정책 논의마저 폭로전에 묻혀 실종된 상태입니다.`,
  outlook:`청와대가 결단하여 후보자 지명을 철회할지, 아니면 임명을 강행하여 야당과의 전면전을 불사할지에 따라 향후 정국 주도권이 결정될 것입니다.`,
  sources:[{title:`이 대통령 '연임' 발언 파장... 여야 대정부질문서 충돌 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`국회 달구는 폭로전과 파행 - 조선일보`,url:`https://www.chosun.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`앤스로픽(Anthropic) 핵심 연구원 사임, 통제 불능 '재귀적 자가 개선' 초지능 경고`,
  metrics:[`10년 내 인류 파멸 확률 10% 이상`,`주요 연구진 연쇄 이탈`],
  summary:`세계 최고 수준의 인공지능(AI) 스타트업 앤스로픽(Anthropic)의 핵심 연구원이 AI의 급격한 발전에 따른 실존적 위협을 경고하며 전격 사임했습니다. 제이콥 콕슨을 비롯한 이탈 연구원들은 거대 기술 기업들이 인간의 생명을 담보로 무모한 개발 도박을 벌이고 있다고 맹비난했습니다. 특히 AI가 스스로 코드를 수정하고 지능을 기하급수적으로 끌어올리는 재귀적 자가 개선 기술이 상용화될 경우, 인간이 통제할 수 없는 초지능이 탄생할 것이라고 우려했습니다. 업계 내부에서도 이러한 초지능을 인간의 가치관과 일치시키는 '정렬(Alignment)' 문제가 전혀 해결되지 않았다는 충격적인 고백이 이어졌습니다. 일부 전문가는 현 추세라면 10년 이내에 인류가 돌이킬 수 없는 재앙을 맞을 확률이 10%를 넘는다고 예측했습니다. 이 사건을 계기로 실리콘밸리는 물론 전 세계 주요 국가의 정치권에서 강력한 AI 규제 기구를 설립해야 한다는 목소리가 폭발적으로 커지고 있습니다. 기업들의 혁신 속도와 윤리적 안전망 구축 사이의 딜레마가 최고조에 달했습니다.`,
  keyTerms:[{term:`재귀적 자가 개선`,explanation:`인공지능이 스스로 자신의 소스 코드를 분석하고 개량하여 단기간에 능력을 폭발적으로 끌어올리는 인공지능의 진화 방식을 의미합니다.`}],
  history:`최근 2년간 거대 언어 모델(LLM)이 인간의 지적 능력을 뛰어넘기 시작하면서, AI가 스스로 진화하는 특이점 도래에 대한 우려가 꾸준히 제기되었습니다.`,
  players:`AI 성능을 극한으로 끌어올리려는 글로벌 빅테크 기업들과 이를 위험하다고 판단해 규제를 촉구하는 AI 안전성 연구자들이 충돌하고 있습니다.`,
  current:`막대한 자본이 투입된 AI 개발 경쟁이 가속화되는 가운데, 내부에서 위험성을 인지한 핵심 개발자들의 내부 고발과 이탈이 가시화되고 있습니다.`,
  outlook:`이번 사태를 통해 미국 연방 정부 차원의 AI 개발 모라토리엄(일시 중단)이나 초지능 모델 개발에 대한 강력한 법적 규제가 도입될 가능성이 높습니다.`,
  sources:[{title:`Anthropic researchers resign over 'recursive self-improvement' AI fears - WSJ`,url:`https://www.wsj.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`뉴욕시 초·중학교 AI 전면 금지 조치 및 직장인 인지 능력 퇴화 우려 확산`,
  metrics:[`뉴욕시 유치원~중학교 100% 금지`,`전문가 62% 직관 우선 지지`],
  summary:`미국 최대 학군인 뉴욕시 교육청이 불과 몇 달 전의 허용 지침을 뒤집고, 유치원부터 중학교까지 교내에서 생성형 AI 도구의 사용을 전면 금지했습니다. 이는 무분별한 AI 사용이 어린 학생들의 비판적 사고와 학습 능력을 저해할 수 있다는 학부모와 교육자들의 강한 우려가 반영된 결과입니다. 이와 동시에, 성인 비즈니스 전문가들을 대상으로 한 대규모 조사에서도 AI 의존으로 인해 인간 고유의 사고력이 떨어지는 인지적 위축 현상이 심각한 문제로 대두되었습니다. 전 세계 전문가 2,500명 중 절반 이상은 창의적이고 도덕적인 판단이 필요한 영역에서는 여전히 인간의 직관이 기계보다 우선되어야 한다고 응답했습니다. 기술의 발전이 인류에게 편리함을 주었지만, 반대로 스스로 생각하고 판단하는 뇌의 근육을 퇴화시키고 있다는 경고음이 울리고 있습니다. 고등학생 이상에게만 제한적으로 AI 리터러시 교육을 제공하기로 한 뉴욕시의 결정은 다른 국가들의 교육 정책에도 큰 영향을 미칠 전망입니다. 기술 활용과 인간 본연의 인지 능력 보존 사이의 균형 찾기가 사회적 화두로 떠올랐습니다.`,
  keyTerms:[{term:`인지적 위축`,explanation:`인공지능이나 디지털 기기에 지나치게 의존한 나머지, 인간 스스로 고민하고 비판적으로 사고하는 뇌의 능력이 점차 무뎌지는 현상을 말합니다.`}],
  history:`ChatGPT 등 AI가 일상과 교육 현장에 빠르게 도입되면서 초반에는 환호가 컸으나, 점차 표절, 창의력 저하, 기계 의존증 등 부작용이 속출했습니다.`,
  players:`편리한 에듀테크 도입을 찬성하는 기술 진영과, 학생들의 기초 학습 능력을 보호하려는 교육 당국 및 학부모 단체가 대립각을 세웠습니다.`,
  current:`미국 뉴욕시가 선제적으로 강경한 금지 조치를 내리면서, 기술 만능주의에 제동을 걸고 인간 중심의 교육을 복원하려는 움직임이 확산 중입니다.`,
  outlook:`이번 조치를 신호탄으로 미국 내 다른 주와 유럽 등 글로벌 교육계에서 연령별 AI 접근 제한 및 가이드라인 제정이 도미노처럼 이어질 것으로 예상됩니다.`,
  sources:[{title:`NYC bans AI in schools amid fears of cognitive decline - NYT`,url:`https://www.nytimes.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`KAIST 연구진, 사람의 뇌파를 읽고 스스로 행동을 교정하는 '신경 가치 정렬' AI 기술 개발`,
  metrics:[`무의식적 뇌파 반응 분석`,`로봇 오작동 실시간 감지`],
  summary:`한국과학기술원(KAIST) 연구팀이 마이크로소프트와 협력하여 사람의 뇌파를 분석해 인공지능이 자신의 실수를 스스로 깨닫고 행동을 고치는 혁신적인 기술을 세계 최초로 개발했습니다. 이 기술은 기계가 예상치 못한 오작동을 했을 때, 인간의 뇌에서 찰나의 순간 발생하는 무의식적인 예측 오차 신호를 실시간으로 포착합니다. 이를 통해 복잡한 프로그래밍이나 음성 명령 없이도 AI가 인간의 의도를 자연스럽게 이해하고 즉각적으로 반응을 수정할 수 있습니다. 핵심 원리인 신경 가치 정렬을 활용하여 기계의 가치 판단 체계를 인간과 가장 흡사한 수준으로 동기화하는 데 성공한 것입니다. 이 기술은 향후 산업용 로봇뿐만 아니라 가정용 도우미 로봇과 자율주행차 등 다양한 실생활 기기에 접목되어 인간과 기계 간의 소통 방식을 완전히 바꿔놓을 것으로 기대됩니다. 더불어 사용자의 밀접한 취향 정보만 선별해 저장하는 초고효율 맞춤형 AI 모델까지 국내에서 개발되면서 한국의 기술 자립도가 높아지고 있습니다. 글로벌 기술 패권 경쟁 속에서 국내 연구진의 쾌거가 큰 주목을 받고 있습니다.`,
  keyTerms:[{term:`신경 가치 정렬`,explanation:`로봇이나 인공지능의 행동을 통제할 때, 인간의 뇌파 신호를 직접 읽어내어 기계의 판단 기준을 사람의 의도와 일치시키는 기술입니다.`}],
  history:`기존의 인공지능 제어 방식은 사람이 직접 코드를 수정하거나 음성/텍스트로 명령을 내려야 해서, 기계가 실수를 바로잡는 데 시차가 존재했습니다.`,
  players:`독자적인 AI 원천 기술을 확보하려는 국내 KAIST 연구진과 글로벌 빅테크인 마이크로소프트의 아시아 연구소가 핵심 주도 세력입니다.`,
  current:`인간의 뇌-컴퓨터 인터페이스(BCI) 기술이 비약적으로 발전하면서, 생각만으로 기계의 미세한 움직임까지 조율할 수 있는 단계에 진입했습니다.`,
  outlook:`상용화 단계에 접어들면 언어 장벽이나 물리적 제약 없이 누구나 직관적으로 첨단 로봇과 AI를 다룰 수 있는 새로운 인터페이스 시대가 열릴 전망입니다.`,
  sources:[{title:`사람 뇌파 읽고 실수 고치는 AI 등장... KAIST 혁신 기술 개발 - KBS`,url:`https://news.kbs.co.kr/`}]
}]

  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`유럽중앙은행 추가 금리 인상 유력... 미 연준도 매파적 기조 속 금리 인상 저울질`,
  metrics:[`유럽중앙은행(ECB) 예금 금리 2.50% 예상`,`미국 연준(Fed) 기준금리 4.25%~4.50% 전망`],
  summary:`미국과 이란 간의 분쟁 등 지정학적 위기로 인한 유가 상승 여파로 전 세계 주요 중앙은행들의 셈법이 복잡해지고 있어. 특히 유럽중앙은행(ECB)은 지속되는 인플레이션 압력에 대응하기 위해 오늘 통화정책회의에서 예금 금리를 2.50%로 인상할 것이 확실시되고 있지. 미국 연준(Fed) 또한 최근 잭슨홀 미팅에서 매파적 발언이 나온 이후, 9월을 시작으로 연내 추가적인 금리 인상을 단행할 것이라는 전망이 우세해. 이는 중동발 에너지 쇼크로 인한 물가 상승을 억제하기 위한 고육지책으로 풀이돼. 투자자들은 당장 오늘 밤 발표될 미국의 생산자물가지수(PPI)에 주목하며 향후 글로벌 통화정책의 방향성을 가늠하고 있어.`,
  keyTerms:[{term:`매파적`,explanation:`물가 안정을 위해 금리 인상과 통화 긴축을 선호하는 성향을 뜻해.`}],
  history:`코로나19 팬데믹 이후 인플레이션을 잡기 위해 전 세계적으로 공격적인 금리 인상이 있었으나, 최근 다시 물가 불안 요소가 대두되었어.`,
  players:`미국 연방준비제도(Fed)와 유럽중앙은행(ECB), 일본은행(BOJ) 등 주요국 중앙은행들이 핵심 행위자야.`,
  current:`미국-이란 갈등으로 국제 유가가 치솟으며 물가 상승 압력이 다시 커지고 있는 상황이야.`,
  outlook:`오늘 밤 발표될 미국 PPI 결과와 9월 연준 FOMC 회의 결과에 따라 글로벌 증시 변동성이 확대될 전망이야.`,
  sources:[{title:`글로벌 경제 성장 및 통화정책 전망 - 커먼웰스은행`,url:`https://www.commbank.com.au`},{title:`미국 인플레이션 및 금리 정책 분석 - 트레이딩뷰`,url:`https://www.tradingview.com`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`코스피 33거래일 만에 7,000선 돌파... 원·달러 환율은 1,330원대로 하락`,
  metrics:[`코스피 7,051.64 마감`,`원/달러 환율 1,336.1원 (22개월 최저치)`],
  summary:`국내 주식시장이 반도체와 이차전지 대형주들의 강세에 힘입어 코스피 7,000선을 가뿐히 돌파했어. 기관의 대규모 매수세가 지수 상승을 견인하며 33거래일 만에 의미 있는 기록을 세운 거야. 동시에 외환시장에서는 일본은행의 추가 금리 인상 기대감으로 엔화가 강세를 띠면서, 원·달러 환율이 크게 하락해 1,330원대에 진입했어. 이는 약 22개월 만에 가장 낮은 수준으로 수입 물가 안정에는 긍정적인 신호야. 다만, 국제 유가 급등과 미 국채금리 상승 등 대외 변동성 요인이 여전히 남아 있어 안심하기엔 일러.`,
  keyTerms:[{term:`원·달러 환율`,explanation:`미국 달러화에 대한 원화의 교환 비율로, 환율이 하락하면 수입 물가 부담이 줄어드는 효과가 있어.`}],
  history:`오랜 기간 박스권에 머물던 코스피가 최근 반도체 등 수출 주력 산업의 호조로 상승 탄력을 받고 있어.`,
  players:`외국인과 기관 투자자들의 수급 동향, 그리고 일본은행(BOJ)의 정책 변화가 주요 변수야.`,
  current:`국내 증시의 호조와 환율 하락이 겹치며 내수와 수출 시장 모두 새로운 국면을 맞이하고 있어.`,
  outlook:`향후 미국의 금리 결정과 중동 사태 전개에 따라 외국인 자금 이탈 여부가 증시의 방향을 결정할 거야.`,
  sources:[{title:`코스피 7,000선 탈환 및 시황 - 다음 금융`,url:`https://finance.daum.net/`},{title:`원달러 환율 1,330원대 진입 분석 - FN타임즈`,url:`https://www.fntimes.com`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국, 한국산 반도체에 표적 관세 압박... 국내 클러스터 대신 미국 투자 요구`,
  metrics:[`한국산 반도체 대상 표적 관세 부과 위협`,`국내 대형 반도체 클러스터 투자금의 미국 본토 이전 압박`],
  summary:`미국 정부가 한국산 반도체에 이른바 표적 관세를 매기겠다며 압박 수위를 높이고 있어. 이는 한국 기업들이 계획 중인 대규모 국내 반도체 클러스터 투자액을 미국 본토로 돌리도록 강제하기 위한 조치로 해석돼. 경제 안보를 명분으로 내세운 미국의 자국 우선주의가 노골화되면서, 국내 핵심 산업인 반도체 업계에는 비상이 걸렸어. 자칫 막대한 관세 부담을 안거나 국내 투자 계획을 전면 수정해야 할 위기에 처했기 때문이야. 정부와 반도체 업계는 긴급 대책 회의를 열고 미국의 압박에 대응할 시나리오를 고심하고 있어.`,
  keyTerms:[{term:`표적 관세`,explanation:`특정 국가나 품목을 겨냥해 불이익을 주기 위해 징벌적으로 부과하는 높은 세율의 관세를 의미해.`}],
  history:`미국은 칩스법(Chips Act) 시행 이후 자국 내 반도체 생산망 구축을 위해 동맹국 기업들에게도 투자를 압박해 왔어.`,
  players:`미국 상무부와 한국 정부, 그리고 삼성전자, SK하이닉스 등 국내 반도체 핵심 기업들이 연관되어 있어.`,
  current:`단순한 보조금 당근을 넘어 관세라는 채찍을 꺼내들며 미국 본토 투자를 강요하는 험악한 분위기야.`,
  outlook:`한국 정부의 외교적 협상 결과와 반도체 기업들의 투자 계획 변경 여부가 향후 산업 경쟁력을 좌우할 전망이야.`,
  sources:[{title:`미국 반도체 관세 압박 및 국내 영향 - HK한타임즈`,url:`https://hkhantimes.com`},{title:`반도체 투자 압박에 정부 긴급 대책 마련 - 선데이저널`,url:`https://sundayjournal.kr`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국의 호르무즈 파병 요구에 정치권 충돌... 파병 반대 촛불집회 예고`,
  metrics:[`미국 트럼프 대통령, 11월까지 파병 요구`,`정부, 비전투 최소 전력 파병 검토 중`],
  summary:`미국 트럼프 대통령이 11월까지 호르무즈 해협에 한국군 파병을 강력히 요구하면서 국내 정치권이 발칵 뒤집혔어. 국회 대정부질문에서는 미국의 압박에 굴복할 수 없다는 야당과 한미 동맹의 실익을 챙겨야 한다는 여당이 치열하게 맞붙고 있지. 정부는 전투 부대가 아닌 비전투 최소 전력을 파병하는 절충안을 검토 중이지만 논란은 사그라지지 않고 있어. 이 와중에 시민단체들은 파병이 국가 안보를 위험에 빠뜨릴 수 있다며 오늘 저녁 서울 도심에서 대규모 촛불집회와 평화행진을 예고했어. 프랑스를 국빈 방문하고 귀국하는 이재명 대통령에게 이번 파병 정국은 가장 시급한 외교·안보 시험대가 될 전망이야.`,
  keyTerms:[{term:`대정부질문`,explanation:`국회의원들이 국정 전반이나 특정 현안에 대해 국무총리와 국무위원(장관)들을 국회로 불러 직접 질문하고 답변을 듣는 제도야.`}],
  history:`과거 중동 지역 분쟁 시에도 미국의 파병 요청이 있었고, 한국은 동맹 관계와 경제적 파장 사이에서 줄타기를 해왔어.`,
  players:`파병을 압박하는 미국 트럼프 행정부, 신중을 기하는 한국 정부, 그리고 찬반으로 나뉜 여야 정치권이 맞물려 있어.`,
  current:`국내외 반발 여론이 거세지는 가운데, 정부는 파병의 수위와 형식을 놓고 장고를 거듭하고 있는 상황이야.`,
  outlook:`국회 비준 동의 등 향후 파병 결정 과정에서 험난한 정치적 진통이 계속될 것으로 예상돼.`,
  sources:[{title:`트럼프 호르무즈 파병 압박 및 여야 공방 - 한국경제`,url:`https://hankyung.com`},{title:`호르무즈 파병 반대 촛불집회 예고 - 뉴시스`,url:`https://newsis.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미군, 이란 유조선 추가 격침... 페르시아만 군사적 긴장 최고조`,
  metrics:[`미군, 나흘간 이란 유조선 8척 격침`,`브렌트유 배럴당 100달러 돌파`],
  summary:`페르시아만과 호르무즈 해협을 둘러싼 미국과 이란의 무력 충돌이 걷잡을 수 없이 격화되고 있어. 이란이 미 군함을 향해 탄도 미사일을 쏘자, 미 중부사령부는 이에 대한 보복으로 이란 유조선 5척을 추가로 격침시켰어. 이란 역시 요르단 내 미군 기지에 미사일을 발사하며 정면충돌 양상을 보이고 있지. 다행히 요르단 방공망에 요격되었지만, 전면전 우려는 그 어느 때보다 커진 상태야. 이처럼 중동 지역의 화약고가 폭발 직전까지 가면서, 글로벌 원유 공급망 차질 우려로 국제 유가는 배럴당 100달러를 돌파했어.`,
  keyTerms:[{term:`중부사령부`,explanation:`미군의 통합전투사령부 중 하나로, 주로 중동, 북아프리카, 중앙아시아 지역의 군사 작전을 총괄하는 곳이야.`}],
  history:`미국의 이란 핵합의 탈퇴 이후 양국 간의 경제 제재와 군사적 마찰이 수년간 반복되며 긴장이 누적되어 왔어.`,
  players:`초강경 대응을 주도하는 미군과 호르무즈 해협을 무기로 삼는 이란 혁명수비대가 정면으로 대치 중이야.`,
  current:`서로 공격과 보복을 주고받으며 '눈에는 눈'식의 군사 작전이 실전으로 전개되고 있어 매우 위험해.`,
  outlook:`양국 간 극적인 중재가 없다면 국지전 수준을 넘어선 중동 전체의 안보 위기로 확전될 가능성이 높아.`,
  sources:[{title:`미-이란 무력 충돌 및 유가 급등 - WNG`,url:`https://wng.org`},{title:`미군, 이란 유조선 추가 격침 상황 - YouTube News`,url:`https://youtube.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`영국, 이스라엘 유대인 정착촌 제재... 양국 외교 관계 최악 치달아`,
  metrics:[`영국, 유대인 정착촌 제품 수입 전면 금지`,`이스라엘, 영국 의원 12명 입국 금지 조치`],
  summary:`영국과 이스라엘 사이에 전례 없는 외교 전쟁이 터졌어. 영국 외무장관이 요르단강 서안지구의 이스라엘 유대인 정착촌 확장을 인종 청소라고 맹비난하며, 해당 지역 제품의 수입을 전면 금지하는 경제 제재를 발동했거든. 이에 격분한 이스라엘 정부는 동예루살렘에 있는 영국 영사관을 즉각 폐쇄하고, 제재에 찬성한 영국 의원 12명의 입국을 금지하는 초강수로 맞대응했어. 오랫동안 복잡하게 얽혀있던 중동 문제에 유럽 주요국이 직접적인 경제 제재로 개입하면서 외교적 파장이 일파만파 커지고 있는 형국이야.`,
  keyTerms:[{term:`유대인 정착촌`,explanation:`이스라엘이 국제법을 어기고 팔레스타인 영토 내에 자국민을 이주시켜 세운 마을로, 중동 분쟁의 핵심 뇌관이야.`}],
  history:`서안지구 정착촌 문제는 이스라엘과 팔레스타인 간 평화 협상의 가장 큰 걸림돌로 국제사회의 지속적인 비판을 받아왔어.`,
  players:`강경한 입장을 고수하는 이스라엘 현 정권과 인권 문제를 이유로 제재에 나선 영국 정부가 맞서고 있어.`,
  current:`단순한 규탄 성명을 넘어 실제 무역 제재와 영사관 폐쇄라는 실질적인 외교 보복전으로 비화되었어.`,
  outlook:`영국의 조치가 유럽연합(EU) 등 다른 서방 국가들의 연쇄 제재로 이어질지 이스라엘이 촉각을 곤두세우고 있어.`,
  sources:[{title:`영국-이스라엘 외교 갈등 심화 - YouTube News`,url:`https://youtube.com`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`정부, 내년도 건강보험료율 7.19%로 동결... 고물가 속 서민 부담 완화 조치`,
  metrics:[`2027년 건강보험료율 7.19% 유지`,`고물가로 인한 서민 경제 부담 완화 목표`],
  summary:`정부가 내년(2027년)에 적용될 건강보험료율을 올해와 동일한 7.19%로 동결하기로 확정했어. 최근 지속되는 고물가와 고금리로 인해 팍팍해진 서민들의 경제적 부담을 조금이나마 덜어주기 위한 특단의 조치야. 보통 매년 인상되던 건강보험료가 동결된 것은 이례적인 일로, 장바구니 물가 상승에 지친 국민들에게는 반가운 소식이지. 다만, 건강보험 재정 건전성에 대한 우려의 목소리도 나오고 있어 정부는 불필요한 의료 쇼핑을 줄이고 지출을 효율화하는 재정 안정화 대책을 함께 추진할 계획이라고 밝혔어.`,
  keyTerms:[{term:`건강보험료율`,explanation:`직장 가입자나 지역 가입자가 소득이나 재산에 비례해 매월 납부해야 하는 건강보험료의 비율을 말해.`}],
  history:`인구 고령화와 의료비 증가로 인해 건강보험료율은 그동안 거의 매년 꾸준히 인상되는 추세였어.`,
  players:`보험료를 결정하는 보건복지부 산하 건강보험정책심의위원회와 가입자인 국민들이 주요 당사자야.`,
  current:`체감 물가가 급등하면서 국민들의 조세 및 준조세 저항 심리가 커지자 정부가 동결 카드를 꺼낸 거야.`,
  outlook:`단기적으로는 부담이 줄지만, 중장기적으로 건강보험 누적 적립금을 어떻게 유지할지가 중요한 과제가 될 거야.`,
  sources:[{title:`내년 건보료 동결 및 보건 이슈 - HK한타임즈`,url:`https://hkhantimes.com`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`엔비디아, 오픈소스 AI 플랫폼 '허깅페이스' 129억 달러에 전격 인수`,
  metrics:[`인수 금액 약 129억 달러 (약 17조 원)`,`AI 모델 공유 플랫폼 장악으로 소프트웨어 생태계 확장`],
  summary:`AI 반도체 시장을 독점하고 있는 엔비디아가 세계 최대의 오픈소스 AI 모델 공유 플랫폼인 허깅페이스를 129억 달러에 인수한다고 깜짝 발표했어. 허깅페이스는 전 세계 개발자들이 AI 모델과 코드를 올리고 공유하는 AI계의 깃허브로 불리는 곳이야. 이번 인수는 엔비디아가 단순히 하드웨어 칩을 파는 것을 넘어, 개발자들이 활동하는 소프트웨어 생태계까지 완벽하게 장악하겠다는 강력한 의지를 보여준 거야. 테크 업계는 이번 메가딜이 향후 인공지능 산업의 권력 구도를 엔비디아 중심으로 완전히 재편할 것이라며 촉각을 곤두세우고 있어.`,
  keyTerms:[{term:`오픈소스`,explanation:`소프트웨어의 설계도인 소스 코드를 누구나 자유롭게 보고, 수정하고, 재배포할 수 있도록 공개하는 방식이야.`}],
  history:`엔비디아는 GPU 하드웨어에서의 압도적 우위를 바탕으로 CUDA 등 소프트웨어 플랫폼 확장을 꾸준히 시도해왔어.`,
  players:`생태계 확장을 노리는 엔비디아와 막대한 개발자 풀을 가진 허깅페이스, 그리고 이를 견제하는 빅테크 경쟁사들이 있어.`,
  current:`AI 개발의 필수 인프라가 된 두 회사가 결합하면서 AI 산업 전반에 엄청난 시너지와 독점 우려가 교차하고 있어.`,
  outlook:`반독점 규제 당국의 기업 결합 승인 여부와 타 빅테크 기업들의 합종연횡 등 견제 움직임이 본격화될 전망이야.`,
  sources:[{title:`엔비디아 허깅페이스 대규모 인수 - VerakWorld`,url:`https://verakworld.com`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`프린스턴 대학 인공지능, 꿈의 에너지 '핵융합 플라즈마' 실시간 제어 성공`,
  metrics:[`밀리초 단위로 핵융합 플라즈마 불안정성 예측 및 제어`,`안정적인 핵융합 에너지 상용화 앞당길 핵심 기술 확보`],
  summary:`프린스턴 대학교 연구진이 개발한 특수 인공지능(AI) 모델이 태양보다 훨씬 뜨거운 인공태양, 즉 핵융합 플라즈마를 실시간으로 제어하는 데 성공해 화제야. 핵융합 발전은 무한하고 깨끗한 꿈의 에너지로 불리지만, 초고온 플라즈마가 순식간에 붕괴하는 불안정성 문제가 가장 큰 난제였거든. 연구진의 AI는 플라즈마가 찢어지는 징후를 무려 밀리초 단위로 미리 예측하고 방지하는 마법 같은 능력을 보여줬어. 과학계는 이 획기적인 연구 결과가 인류의 오랜 숙원인 핵융합 에너지 상용화 시기를 크게 앞당길 수 있는 역사적인 전환점이 될 것이라고 환호하고 있어.`,
  keyTerms:[{term:`핵융합`,explanation:`가벼운 원자핵들이 엄청난 열과 압력 속에서 합쳐져 무거운 원자핵이 되며 막대한 에너지를 뿜어내는 현상이야.`}],
  history:`핵융합은 수십 년간 연구되어 왔지만, 극한의 환경에서 플라즈마 상태를 장시간 유지하는 기술적 장벽에 부딪혀 왔어.`,
  players:`프린스턴 플라즈마 물리 연구소(PPPL) 등 전 세계 첨단 물리 연구소들이 이 기술 선점을 위해 각축전을 벌이고 있어.`,
  current:`AI 기술이 비약적으로 발전하면서, 과거 인간의 계산으로는 불가능했던 초고속 복잡계 제어가 비로소 가능해진 거야.`,
  outlook:`이번 성공을 발판으로 더 큰 규모의 핵융합로(ITER 등)에 AI 제어 기술이 본격 도입되며 상용화 연구가 가속될 예정이야.`,
  sources:[{title:`프린스턴 대학 핵융합 플라즈마 AI 제어 - SciTechDaily`,url:`https://scitechdaily.com`}]
}]

  tag:`2026-09-09`,

  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`올 2분기 명목 GDP 26.4% 급증하며 47년 만에 최고치 기록`,
  metrics:[`2분기 GDP 증가율 26.4%`,`1979년 이후 최고 수준`],
  summary:`올 2분기 명목 국내총생산(GDP)이 전년 동기 대비 26.4% 급증하며 1979년 이후 47년 만에 최고 성장률을 기록했습니다. 이는 글로벌 AI 투자 확대에 따른 반도체 수출 호황이 주도한 결과입니다. 하지만 내수 중심의 건설업 등은 역성장하며 산업 간 양극화가 뚜렷하게 나타났습니다. 수출 대기업과 내수 중소기업 간의 체감 경기 격차가 커지고 있어 우려의 목소리도 나옵니다. 정부는 수출 온기를 내수로 확산시키기 위한 추가 대책을 고심 중입니다. 전문가들은 지속 가능한 성장을 위해서는 내수 부진의 근본적인 해결이 필수적이라고 지적합니다.`,
  keyTerms:[{term:`명목 국내총생산(GDP)`,explanation:`물가 상승분을 반영하여 현재 가격으로 계산한 국가의 총 경제 규모입니다. 경제의 외형적인 성장세를 보여주는 핵심 지표입니다.`}],
  history:`과거 한국 경제는 반도체 사이클에 따라 전체 성장률이 크게 출렁이는 경향을 보여왔습니다. 최근 몇 년간 침체기를 겪던 반도체 수출이 AI 붐과 함께 폭발적으로 회복되면서 수출 지표가 급반등했습니다.`,
  players:`삼성전자, SK하이닉스 등 대형 수출 기업들이 실적을 이끌고 있는 반면, 건설사와 소상공인 등 내수 관련 주체들은 고금리 장기화로 인해 여전히 자금난을 겪고 있습니다.`,
  current:`거시적인 경제 지표는 화려하지만, 국민들이 실생활에서 느끼는 체감 경기는 오히려 악화되는 전형적인 양극화 현상이 뚜렷해지고 있는 중대한 시점입니다.`,
  outlook:`하반기 미국의 금리 인하 여부와 국내 내수 진작 정책의 실효성이 향후 양극화 해소의 핵심이 될 것입니다. 정부의 하반기 경제 정책 발표에 시장의 이목이 쏠려 있습니다.`,
  sources:[{title:`2분기 명목 GDP, 47년 만에 최고 성장 - 동아일보`,url:`https://www.donga.com`},{title:`반도체 수출 호황과 내수 침체의 명암 - 한국경제`,url:`https://www.hankyung.com`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`중동발 지정학적 리스크 확대로 국제유가 100달러 돌파 초읽기`,
  metrics:[`브렌트유 배럴당 97.92달러`,`국내 코스피 2954.52로 하락`],
  summary:`사우디 석유시설에 대한 무력 공격과 역내 갈등 격화로 브렌트유가 배럴당 97달러를 넘어서며 100달러를 위협하고 있습니다. 중동의 원유 공급 차질 우려가 커지면서 글로벌 인플레이션 재점화 가능성이 제기됩니다. 이 여파로 국내 증시에서도 코스피가 3000선 아래인 2954.52로 밀려났고, 원/달러 환율은 다시 1345.6원으로 상승했습니다. 에너지 수입 의존도가 높은 한국 경제에 상당한 충격이 예상되며, 물가 당국도 긴장하고 있습니다. 특히 휘발유 및 디젤 가격의 가파른 상승이 가계의 소비 심리를 더욱 위축시킬 전망입니다. 정부는 유류세 인하 조치 연장 등 다각적인 비상 대응 방안을 논의 중입니다.`,
  keyTerms:[{term:`브렌트유`,explanation:`유럽 북해에서 생산되는 원유로, 서부텍사스산원유(WTI), 두바이유와 함께 세계 3대 유종으로 꼽히며 글로벌 원유 가격의 기준 역할을 합니다.`}],
  history:`최근 수년간 중동 지역은 크고 작은 분쟁이 끊이지 않았으나, 핵심 석유 시설에 대한 직접적인 타격은 드물었습니다. 지정학적 불안감이 커질 때마다 유가는 즉각적으로 급등하는 패턴을 반복해왔습니다.`,
  players:`산유국 모임인 OPEC+와 무력 충돌의 당사자들, 그리고 유가 방어를 위해 비축유 방출을 고려하는 미국 등 주요 소비국들이 복잡한 이해관계로 얽혀 있습니다.`,
  current:`글로벌 금리 인하 기대감으로 시장이 안정되어 가던 찰나에 유가 폭등이라는 돌발 악재가 터지면서 인플레이션 통제에 제동이 걸렸습니다.`,
  outlook:`단기적으로 유가가 100달러를 넘어설지 여부가 관건이며, 유가 상승이 이어지면 주요국 중앙은행들의 금리 인하 시점도 뒤로 미뤄질 가능성이 큽니다.`,
  sources:[{title:`중동 정세 격화에 국제유가 100달러 육박 - 연합뉴스`,url:`https://www.yna.co.kr`},{title:`유가 급등에 코스피 하락·환율 상승 - 매일경제`,url:`https://www.mk.co.kr`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`일본 국채 금리 30년 만에 최고치, 5조 달러 해외 자금 회귀 경고`,
  metrics:[`일본 10년물 국채 금리 3% 돌파`,`해외 투자 자금 5조 달러 규모`],
  summary:`일본 10년물 국채 금리가 3%를 돌파하며 30년 만에 최고치를 기록했습니다. 일본은행의 지속적인 긴축 기조로 인해 국내 금리 매력도가 높아지면서, 미국 등 해외에 머물던 5조 달러 규모의 일본 자금이 본국으로 돌아갈 수 있다는 경고가 나옵니다. 이른바 엔캐리 트레이드 자금이 대규모로 청산될 경우 글로벌 채권 시장과 자산 시장에 엄청난 변동성을 초래할 수 있습니다. 미국과 유럽 금융당국은 자본 유출입 동향을 예의주시하고 있습니다. 전문가들은 일본계 자본 비중이 높은 신흥국 증시에서 갑작스러운 자금 이탈이 발생할 위험을 경고합니다. 한국 증시 역시 외인 자금 동향에 민감하게 반응하며 불안감을 보이고 있습니다.`,
  keyTerms:[{term:`엔캐리 트레이드`,explanation:`이자가 매우 싼 일본 엔화를 빌려서 금리가 더 높은 다른 나라의 주식이나 채권 등 수익성 자산에 투자해 이익을 내는 금융 투자 기법입니다.`}],
  history:`일본은 지난 수십 년간 잃어버린 30년을 극복하기 위해 마이너스 금리와 대규모 양적 완화 정책을 유지해왔습니다. 이로 인해 많은 자본이 수익률을 좇아 해외로 빠져나갔습니다.`,
  players:`금리를 올리며 정상화를 꾀하는 일본은행과, 일본 자본의 대규모 이탈을 우려하는 미국 연방준비제도(Fed) 및 글로벌 투자은행들이 시장의 흐름을 주시하고 있습니다.`,
  current:`일본의 인플레이션이 목표치를 안정적으로 웃돌고 경제가 회복세를 보이면서, 초완화적 통화정책을 거두어들이는 역사적인 전환점이 도래했습니다.`,
  outlook:`엔화 강세와 일본 금리 상승이 동시에 진행될 경우, 글로벌 자산 시장에서 단기적인 매도 물량이 쏟아지는 발작 현상이 나타날 수 있어 투자자들의 주의가 필요합니다.`,
  sources:[{title:`일본 자금 본국 회귀 우려... 글로벌 시장 긴장 - 연합뉴스`,url:`https://www.yna.co.kr`},{title:`일본 국채 금리 30년 만에 최고치 돌파 - 조선일보`,url:`https://www.chosun.com`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`여야, 20년 만에 '지구당 부활' 잠정 합의하며 정치 개혁 속도`,
  metrics:[`20년 만의 지구당 부활 논의`,`여야 당대표 공감대 형성`],
  summary:`여야가 2004년 일명 오세훈법으로 폐지되었던 정당의 지구당을 20년 만에 부활시키는 데 잠정 합의했습니다. 정치 신인들의 진입 장벽을 낮추고 지역 정치를 활성화하겠다는 취지가 강하게 작용했습니다. 하지만 일각에서는 과거처럼 돈 먹는 하마로 변질되거나 불법 정치 자금의 창구가 될 수 있다는 강한 우려도 제기되고 있습니다. 여야는 후원금 모금의 투명성 강화 등 보완책을 마련하여 다가오는 정기국회 내 법안 처리를 목표로 하고 있습니다. 원외 정치인들은 지구당 부활이 풀뿌리 민주주의를 재건하는 첫걸음이라며 환영하는 분위기입니다. 반면 시민단체들은 법안이 통과되기 전에 보다 엄격한 회계 감사 제도가 필수적으로 도입되어야 한다고 목소리를 높이고 있습니다.`,
  keyTerms:[{term:`지구당`,explanation:`국회의원 선거구 단위로 세워지는 정당의 지역 연락 사무소입니다. 풀뿌리 민주주의의 기반이 되지만 과거 불법 자금 문제가 있어 폐지된 바 있습니다.`}],
  history:`과거 지구당은 정당 정치의 근간이었으나, 선거철마다 불법 정치자금이 유통되는 온상으로 지목되면서 2004년 부패 방지 차원에서 전격 폐지되었습니다.`,
  players:`기득권을 내려놓고 정치 신인들에게 기회를 주자는 현역 여야 의원들과, 투명성 부족을 근거로 반대하는 시민단체 간의 팽팽한 논쟁이 진행 중입니다.`,
  current:`원외 위원장들의 척박한 정치 환경이 문제가 되면서, 여야 지도부가 이례적으로 한목소리로 제도 부활의 필요성을 역설하고 나선 상황입니다.`,
  outlook:`지구당 부활을 담은 정당법 및 정치자금법 개정안이 국회 본회의를 통과할지, 그리고 우려되는 부작용을 막을 촘촘한 안전장치가 마련될지 지켜봐야 합니다.`,
  sources:[{title:`여야, 지구당 부활 본격 논의 돌입 - 아주경제`,url:`https://www.ajunews.com`},{title:`지구당 20년 만에 부활하나... 투명성 확보 과제 - KBS`,url:`https://news.kbs.co.kr`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`북한 정권 수립일 78주년 맞아 중·러 정상 일제히 축전 발송`,
  metrics:[`북한 정권 수립 78주년`,`시진핑·푸틴 2명 동시 축전`],
  summary:`북한의 정권 수립일(9·9절) 78주년을 맞아 시진핑 중국 국가주석과 블라디미르 푸틴 러시아 대통령이 김정은 국무위원장에게 나란히 축전을 보냈습니다. 이는 한미일 안보 협력 강화에 맞서 북·중·러 3국의 전략적 연대와 끈끈한 밀착을 대내외에 과시하려는 의도로 풀이됩니다. 특히 최근 북한과 러시아 간의 군사 기술 이전 및 경제 협력이 속도를 내면서 동북아시아의 지정학적 긴장감은 한층 고조되고 있습니다. 한국 외교당국은 북한의 추가 도발이나 밀착 행보에 촉각을 곤두세우고 있습니다. 미국 역시 유엔 안전보장이사회 결의안을 위반하는 무기 거래에 대해 강력히 경고하고 나섰습니다. 향후 가을을 기점으로 북한이 무력 시위의 강도를 높일 가능성이 커 국제사회의 긴장감이 확산되고 있습니다.`,
  keyTerms:[{term:`9·9절`,explanation:`1948년 9월 9일 북한 정권(조선민주주의인민공화국)이 수립된 것을 기념하는 북한의 가장 중요한 국경일 중 하나입니다.`}],
  history:`냉전 시대부터 북한, 중국, 러시아는 사회주의 우방국으로서 협력해왔으나, 최근 몇 년간 서방 국가들과의 대립이 심해지면서 세 국가의 밀착이 눈에 띄게 강화되었습니다.`,
  players:`김정은, 시진핑, 푸틴 세 정상은 각자의 정치적, 군사적 필요(우크라이나 전쟁 지원, 미국의 견제 등)에 의해 서로의 전략적 가치를 높게 평가하고 있습니다.`,
  current:`한미일 3국이 캠프 데이비드 선언 이후 군사 안보 협력을 전례 없이 끌어올린 것에 대항하여 북중러가 하나의 진영으로 뭉치는 신냉전 구도가 고착화되고 있습니다.`,
  outlook:`가을 이후 북한이 중러의 뒷배를 믿고 핵실험이나 대륙간탄도미사일(ICBM) 발사 등 고강도 도발을 감행할 가능성이 제기되어 국제사회의 경계가 높아지고 있습니다.`,
  sources:[{title:`북 9·9절 78주년... 시진핑·푸틴 나란히 축전 - 연합뉴스TV`,url:`https://www.yonhapnewstv.co.kr`},{title:`북중러 밀착 과시, 동북아 긴장 고조 - 동아일보`,url:`https://www.donga.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 새 행정부 출범 후 동맹국 방위비 증액 및 보편 관세 압박 본격화`,
  metrics:[`보편적 기본관세 10% 논의`,`주한미군 방위비 대폭 인상 우려`],
  summary:`새롭게 출범한 미국 행정부가 선거 공약이었던 미국 우선주의 기조를 전면적으로 실행에 옮기고 있습니다. 무역 적자 해소를 위해 모든 수입품에 대한 보편적 기본관세 10% 부과안이 구체화되고 있으며, 동맹국들을 상대로 한 방위비 분담금 대폭 증액 압박도 거세지고 있습니다. 글로벌 무역 질서가 다자주의에서 보호무역 중심으로 급속히 재편되면서 수출 주도형 국가인 한국 경제에 직접적인 타격이 현실화될 조짐입니다. 정부와 경제계는 대미 협상력 강화를 위한 비상 대응 체제에 돌입했습니다. 반도체와 자동차 등 핵심 수출 품목을 생산하는 기업들은 공급망 다변화 등 자구책 마련에 서두르고 있습니다. 국제 사회는 미국의 일방적인 조치가 글로벌 무역 전쟁을 촉발할 수 있다며 깊은 우려를 표명하고 있습니다.`,
  keyTerms:[{term:`보호무역`,explanation:`국가 간 무역에서 관세나 수입 제한 등을 통해 자국의 산업을 외국의 경쟁으로부터 보호하려는 정책입니다.`}],
  history:`미국은 막대한 무역 적자와 자국 제조업의 쇠퇴를 극복하기 위해 지속적으로 동맹국들에게도 무역 장벽을 높이고 안보 비용을 전가하는 흐름을 보여왔습니다.`,
  players:`미국 최우선주의를 내세우는 미국 정부와, 미국의 안보 우산 및 소비 시장에 크게 의존하고 있는 한국, 일본, 유럽연합(EU) 등의 국가들이 치열한 협상을 앞두고 있습니다.`,
  current:`단순한 엄포를 넘어 실제 관세 부과를 위한 행정 명령이 준비되면서, 글로벌 공급망 전체가 미국의 정책 변화 하나하나에 흔들리는 불안한 상황이 지속되고 있습니다.`,
  outlook:`한국 정부는 미국에 진출한 우리 기업들의 피해를 최소화하고, 방위비 협상에서 합리적인 수준의 합의를 끌어내기 위해 총력 외교전을 펼칠 전망입니다.`,
  sources:[{title:`미국발 관세 폭탄 우려, 韓 수출 초비상 - 중앙일보`,url:`https://www.joongang.co.kr`},{title:`동맹국 방위비 압박 현실화되나 - SBS 뉴스`,url:`https://news.sbs.co.kr`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`정부, 인공지능 생활에 접목한 'K-AI 시티' 원주·아산 등 시범도시 추진`,
  metrics:[`2030년까지 1단계 구축 완료`,`교통·건축 등 AI 접목 시범도시 3곳 지정`],
  summary:`국토교통부가 인공지능(AI) 기술을 도시 운영 전반에 접목하는 이른바 'K-AI 시티' 프로젝트를 본격적으로 추진한다고 발표했습니다. 강원 원주, 충남 천안과 아산 등이 시범도시로 지정되어 자율주행, 스마트 에너지 관리, 지능형 건축 인프라 등 최첨단 기술이 실제 시민 생활에 적용될 예정입니다. 정부는 2030년까지 1단계 구축을 성공적으로 마치고 이를 해외에 수출할 수 있는 글로벌 모델로 육성할 계획입니다. 이번 대규모 프로젝트가 침체된 지역 경제를 살리고 수도권과의 기술 격차를 해소하는 마중물이 될지 기대감이 큽니다. 해당 지자체들은 관련 벤처 기업들을 유치하기 위해 파격적인 세제 혜택과 인프라 지원을 약속하고 나섰습니다. 전문가들은 정보 보안과 시민 프라이버시 보호를 위한 윤리적 가이드라인 제정도 함께 병행되어야 한다고 강조합니다.`,
  keyTerms:[{term:`스마트 에너지 관리`,explanation:`인공지능과 사물인터넷을 이용해 도시 전체의 전력 사용량을 실시간으로 분석하고 낭비를 최소화하여 효율을 극대화하는 지능형 시스템입니다.`}],
  history:`기존의 스마트시티 사업은 주로 통신 인프라 확충에 머물렀으나, 최근 생성형 AI의 비약적인 발전으로 도시 전체를 통제하고 최적화할 수 있는 기술적 토대가 마련되었습니다.`,
  players:`사업을 주도하는 국토교통부 및 해당 지자체들과, 통신망 및 AI 플랫폼을 제공하는 국내 주요 IT 대기업들이 긴밀하게 협력하는 민관 합동 구조입니다.`,
  current:`수도권에 집중된 첨단 산업을 지방으로 분산시키고 국가 균형 발전을 도모하기 위해 지방 중소도시를 AI 혁신의 테스트베드로 삼은 의미 있는 시점입니다.`,
  outlook:`초기 인프라 구축에 투입되는 막대한 예산의 효율적 집행과, 시민들의 개인정보를 어떻게 안전하게 보호하면서 AI를 학습시킬 것인지가 사업 성공의 관건이 될 것입니다.`,
  sources:[{title:`원주·천안·아산에 'K-AI 시티' 조성 - 연합뉴스`,url:`https://www.yna.co.kr`},{title:`인공지능 품은 스마트시티 본격화 - 한국경제`,url:`https://www.hankyung.com`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`폭증하는 AI 전력 수요에 글로벌 데이터센터 에너지 부족 비상사태`,
  metrics:[`AI 검색 전력 소모량 일반 검색의 10배`,`빅테크 친환경 에너지 투자 20% 증가`],
  summary:`생성형 AI 서비스의 일상화로 전 세계 데이터센터의 전력 소모가 폭증하면서 심각한 에너지 비상사태가 경고되고 있습니다. 텍스트나 이미지를 생성하는 AI 검색 1회에 소모되는 전력이 일반 구글 검색의 최대 10배에 달해 주요 전력망이 감당하기 어려운 수준에 이르렀습니다. 이에 구글, 마이크로소프트 등 글로벌 빅테크 기업들은 소형모듈원전(SMR)을 포함한 친환경 에너지원 확보에 천문학적인 자본을 앞다투어 투입하고 있습니다. 안정적이고 저렴한 전력의 확보 여부가 향후 기업과 국가의 AI 주도권을 좌우할 최우선 과제로 떠올랐습니다. 미국 일부 주에서는 늘어나는 데이터센터 건설 요청에 대응하기 위해 전력 공급 허가를 일시 중단하는 사태까지 발생했습니다. 업계 전문가들은 전력 효율을 획기적으로 높이는 새로운 냉각 시스템 도입이 시급하다고 지적합니다.`,
  keyTerms:[{term:`데이터센터`,explanation:`수많은 컴퓨터 서버와 통신 장비를 한곳에 모아두고 방대한 데이터를 365일 쉬지 않고 저장, 처리하는 거대한 첨단 시설입니다.`}],
  history:`과거에는 데이터센터의 열을 식히는 냉각 비용 정도가 문제였으나, 초대규모 AI 모델의 학습과 추론 과정에 엄청난 양의 전기가 물리적으로 필요해지면서 에너지 위기로 번졌습니다.`,
  players:`AI 주도권을 놓치지 않으려는 빅테크 기업들과, 자국 전력망 과부하와 탄소 배출 증가를 걱정하는 각국 정부 환경 당국 간의 갈등이 존재합니다.`,
  current:`기술의 발전 속도가 에너지 인프라 확충 속도를 앞지르면서, 일부 국가에서는 신규 데이터센터 건립을 일시적으로 제한하는 조치까지 취하고 있습니다.`,
  outlook:`재생에너지 인프라 투자 확대와 더불어, 반도체 자체의 전력 효율을 극적으로 높이는 하드웨어 기술 혁신이 동반되어야만 이 위기를 돌파할 수 있을 것입니다.`,
  sources:[{title:`AI 전력 먹는 하마, 전 세계 전력망 마비 우려 - 뉴스타파`,url:`https://newstapa.org`},{title:`빅테크, AI 전력 확보 위해 원전 눈독 - 조선비즈`,url:`https://biz.chosun.com`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`전력 덜 먹는 '그린 실리콘' 개발에 글로벌 반도체 기업 기술 사활`,
  metrics:[`탄소 배출 30% 감축 칩 개발`,`재활용 소재 사용 의무화 EU 규제 도입`],
  summary:`AI 시대의 심각한 에너지 부족 문제와 갈수록 엄격해지는 친환경 규제에 대응하기 위해 글로벌 IT 업계가 이른바 '그린 실리콘' 개발에 사활을 걸고 나섰습니다. 애플, 삼성전자 등 주요 제조사들은 연산 성능은 최고 수준으로 유지하면서도 전력 소비를 획기적으로 줄인 저전력 반도체를 속속 선보이고 있습니다. 또한 유럽연합(EU)이 IT 기기에 재활용 알루미늄 등 소재 사용을 의무화하는 순환경제 규제를 본격화함에 따라 제품 설계 패러다임이 완전히 바뀌고 있습니다. 환경 오염의 주범으로 몰렸던 IT 기술이 혁신을 통해 문제 해결의 열쇠가 될 수 있을지 주목됩니다. 기업들은 단순히 제품을 판매하는 데 그치지 않고 수명이 다한 기기를 자사에서 직접 수거해 소재를 재활용하는 비율을 의무적으로 높이고 있습니다. 이러한 생태계 변화는 환경 보호뿐만 아니라 자원 고갈 문제를 해결할 지속 가능한 대안으로 평가받고 있습니다.`,
  keyTerms:[{term:`순환경제`,explanation:`제품을 한 번 쓰고 버리는 선형 구조를 탈피하여, 자원을 계속해서 재활용하고 수명을 늘려 쓰레기 발생 자체를 0으로 만드는 지속가능한 경제 모델입니다.`}],
  history:`그동안 IT 기기는 빠른 성능 발전과 짧은 교체 주기로 인해 막대한 전자 폐기물(e-waste)을 발생시키며 지구 환경을 파괴한다는 비판을 받아왔습니다.`,
  players:`강력한 규제안을 입법화하는 유럽연합 등 각국 정부와, 규제를 준수하지 못하면 시장에서 도태될 위기에 처한 글로벌 스마트폰, PC, 반도체 제조사들이 있습니다.`,
  current:`단순한 친환경 마케팅인 '그린워싱'을 넘어, 제품을 폐기할 때까지의 모든 탄소 배출량을 숫자로 증명해야 하는 깐깐한 시대로 진입했습니다.`,
  outlook:`향후에는 기기의 성능이나 디자인뿐만 아니라 얼마나 적은 에너지로 작동하며 100% 재활용이 가능한지가 기업의 기술력과 브랜드 가치를 평가하는 척도가 될 것입니다.`,
  sources:[{title:`전력 소모 확 줄인 저전력 반도체 경쟁 - 테크브루`,url:`https://www.techbrew.co.kr`},{title:`IT업계 생존 키워드 된 순환경제 - 한국경제`,url:`https://www.hankyung.com`}]
}]

  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국 2분기 명목 GDP 성장률 26.4% 기록하며 47년 만에 최고치 달성`,
  metrics:[`명목 GDP 26.4% 상승`,`실질 GNI 3.1% 증가`],
  summary:`올해 2분기 한국 경제의 실질 GDP가 전 분기 대비 0.6% 성장한 가운데, 명목 GDP는 26.4%나 폭등했습니다. 이는 반도체 수출 호조에 힘입은 것으로 1979년 이후 47년 만의 최고 기록입니다. 실질적인 구매력을 보여주는 실질 총소득 역시 3.1% 늘어났습니다. 결과적으로 총저축률이 역대 최고치인 45.6%를 기록하며 경제 전반의 체력이 강해졌음을 보여주었습니다. 하지만 물가 상승분이 명목 GDP에 반영된 측면도 있어 서민 체감 경기와의 괴리를 줄이는 것이 숙제입니다. 향후 하반기 수출 모멘텀이 계속 유지될지 시장의 이목이 집중되고 있습니다.`,
  keyTerms:[{term:`명목 GDP`,explanation:`물가 상승분을 반영하여 현재 시장 가격으로 평가한 국내총생산으로, 경제 규모의 체감 크기를 보여주는 지표입니다.`}],
  history:`최근 수년간 한국 경제는 저성장 기조를 보였으나, 올해 들어 반도체를 중심으로 한 글로벌 IT 수요 회복이 수출을 견인했습니다. 이로 인해 주요 수출 기업들의 이익 규모가 대폭 팽창했습니다.`,
  players:`한국은행이 분기별 통계를 집계하여 발표했으며, 글로벌 시장에서 활약하는 삼성전자와 SK하이닉스 등 주요 반도체 기업들이 이번 성장의 핵심 동력입니다.`,
  current:`물가 상승과 환율 효과가 결합되어 지표상 경제 규모는 크게 뛰었으나, 고물가로 인해 실제 가계의 내수 회복은 여전히 더딘 불균형 상황이 지속되고 있습니다.`,
  outlook:`시장은 하반기에도 글로벌 반도체 호황이 이어질지 주시하고 있습니다. 또한 정부는 늘어난 기업 소득이 가계 소비와 투자로 이어질 수 있도록 정책적 지원 방향을 논의 중입니다.`,
  sources:[{title:`2분기 명목 GDP 26.4% 급증... 47년 만에 최고 기록 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`반도체 수출 호조에 총저축률 45.6% 역대 최고 - 한국경제`,url:`https://www.hankyung.com/`}]

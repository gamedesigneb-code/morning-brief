  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`원/달러 환율 1,330원대 진입, 2년 만에 최저치 기록`,
  metrics:[`장중 최저 1,335.3원`,`종가 1,340.5원`],
  summary:`원/달러 환율이 장중 1,335.3원까지 하락하며 약 2년 만에 가장 낮은 수준을 기록했습니다. 미국 고용 지표 호조에도 불구하고 원화가 강세를 보인 주된 원인은 국내 대형 반도체 기업들의 대규모 달러 매도입니다. 올해 실적이 크게 개선된 이들 기업이 수십조 원에 달하는 법인세 중간예납을 위해 달러를 원화로 환전하면서 환율 하락을 이끌었습니다. 여기에 글로벌 시장의 엔화 강세 흐름까지 겹치면서 원화 가치는 더욱 탄력을 받았습니다. 수출 기업들의 가격 경쟁력에는 다소 부담이 될 수 있지만, 치솟던 수입 물가 안정에는 긍정적인 영향을 미칠 것으로 보입니다.`,
  keyTerms:[{term:`법인세 중간예납`,explanation:`기업이 한 해 동안 벌어들일 소득에 대해 낼 법인세의 일부를 중간에 미리 납부하는 제도로, 조세 수입을 균분하고 기업의 세금 부담을 분산시킵니다.`}],
  history:`원/달러 환율은 미국의 고금리 장기화 기조 속에 지난 2년 가까이 1,300원대 중후반의 높은 수준을 맴돌며 수입 물가 상승의 주범으로 지목되어 왔습니다.`,
  players:`대규모 법인세를 납부해야 하는 수출 대기업들과 외환시장 수급을 조절하는 외환 당국, 그리고 미국 연방준비제도(Fed)의 정책 결정자들이 주요 변수입니다.`,
  current:`반도체 호황으로 세금을 원화로 내야 하는 기업들의 달러 환전 수요가 외환 시장에 일시적으로 대거 쏟아지면서 급격한 환율 하락이 촉발된 상황입니다.`,
  outlook:`단기적인 세금 납부 수요가 끝나면 환율이 다시 반등할 가능성이 있습니다. 미국의 하반기 금리 인하 여부와 일본은행의 통화 정책 변화가 향후 환율 방향을 결정할 것입니다.`,
  sources:[{title:`원/달러 환율 1330원대로 뚝... 반도체 기업 달러 매도 영향 - 매일경제`,url:`https://www.mk.co.kr/`},{title:`법인세 중간예납 시즌, 외환시장 요동... 수출기업 긴장 - 서울신문`,url:`https://www.seoul.co.kr/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국-캐나다 무역 전쟁 고조, 캐나다 보복 관세 발효 임박`,
  metrics:[`양국 관세율 10% 이상 인상안`,`관련 무역 규모 수백억 달러 타격`],
  summary:`도널드 트럼프 미국 대통령의 일방적인 추가 관세 위협에 맞서 캐나다가 준비한 보복 관세가 곧 발효될 예정입니다. 미국이 자국 산업 보호를 명분으로 무역 장벽을 높이려 하자 캐나다 역시 강경 대응으로 선회하면서 양국 간의 무역 전쟁이 본격화하고 있습니다. 오랜 기간 긴밀하게 연결되어 있던 북미 경제권이 흔들리면서 글로벌 공급망과 관련 다국적 기업들의 불확실성도 덩달아 커졌습니다. 특히 자동차 부품, 철강, 농산물 등 주요 교역 품목에서 심각한 타격이 예상됩니다. 앞으로 진행될 양국 간의 고위급 협상 테이블에서 타협점을 찾을 수 있을지가 글로벌 경제의 핵심 변수로 떠올랐습니다.`,
  keyTerms:[{term:`보복 관세`,explanation:`상대국이 자국 상품에 부당하게 관세를 올리거나 무역 장벽을 세울 때, 이에 맞대응하여 상대국에서 수입하는 제품에 부과하는 징벌적 성격의 추가 관세입니다.`}],
  history:`과거 북미자유무역협정(NAFTA)을 대체한 USMCA 체제 아래서 안정을 유지하던 양국 무역 관계는 최근 미국의 자국 우선주의 정책 강화로 인해 파열음을 내기 시작했습니다.`,
  players:`미국 무역대표부(USTR)와 캐나다 총리실이 전면전의 주체이며, 국경을 가로질러 공급망을 구축한 북미 자동차 및 제조업계가 가장 큰 피해를 볼 위기에 처했습니다.`,
  current:`미국이 철강 및 알루미늄에 대한 추가 관세를 예고하자 캐나다가 즉각적으로 동등한 규모의 농산물 및 공산품 보복 관세 리스트를 확정하여 맞불을 놓은 상태입니다.`,
  outlook:`양국 모두 자국 내 정치적 여론을 의식해 쉽게 물러서지 않을 기세입니다. 세계 무역 기구(WTO) 제소 등 국제적인 무역 분쟁으로 비화할 가능성도 제기되고 있습니다.`,
  sources:[{title:`Canada set to launch retaliatory tariffs against US - Reuters`,url:`https://www.reuters.com/`},{title:`US-Canada trade war escalates, threatening auto supply chains - Bloomberg`,url:`https://www.bloomberg.com/`}]
},{

  colorBg:`#fce8e6`,
  headline:`8·30 개각 후폭풍 거세, 김승원·용혜인 후보자 여야 대치 심화`,
  metrics:[`야당 후보자 2명 즉각 사퇴 요구`,`청와대 임명 강행 의지 재확인`],
  summary:`최근 발표된 8·30 개각 이후 김승원 법무부 장관 후보자와 용혜인 성평등가족부 장관 후보자를 둘러싼 논란이 일파만파로 커지고 있습니다. 김 후보자는 과거 코로나19 치료제 신속 승인을 부당하게 청탁했다는 이른바 '쥐약 게이트' 의혹에 휩싸였고, 용 후보자는 비례대표직 겸직 논란으로 비판을 받고 있습니다. 여당인 국민의힘은 개각 전면 철회를 요구하며 강하게 반발하고 있으나, 더불어민주당과 청와대는 적법한 인사청문회를 거쳐 판단해야 한다며 맞서고 있습니다. 이번 인사청문회 정국은 향후 정기국회 주도권을 쥐기 위한 여야의 중대 분수령이 될 전망입니다. 두 후보자의 실제 낙마 여부에 따라 하반기 정국의 방향이 크게 요동칠 것으로 보입니다.`,
  keyTerms:[{term:`인사청문회`,explanation:`대통령이 국가의 주요 고위 공직자를 임명하기 전에 국회가 후보자의 업무 능력, 자질, 그리고 도덕성을 검증하기 위해 여는 공개 회의입니다.`}],
  history:`대통령은 임기 후반기 국정 동력 확보를 위해 대대적인 8·30 개각을 단행했으나, 핵심 부처 후보자들의 과거 행적과 발언이 연일 도마 위에 오르며 정쟁의 불씨가 되었습니다.`,
  players:`청와대와 여당 방어에 나선 더불어민주당, 그리고 관련 의혹을 집중적으로 파헤치며 공세를 펴고 있는 국민의힘 등 야당 의원들이 치열하게 대립하고 있습니다.`,
  current:`야당은 연일 새로운 녹취록과 문자를 폭로하며 여론전을 주도하고 있고, 여당은 이를 정치 공세이자 표적 수사라며 방어막을 치는 데 총력을 기울이고 있습니다.`,
  outlook:`곧 열릴 국회 인사청문회에서 후보자들의 해명 여부가 핵심이 될 것입니다. 여론의 향배에 따라 청와대가 지명을 철회할지 아니면 임명을 강행할지 결정될 예정입니다.`,
  sources:[{title:`8·30 개각 후폭풍... 여야 '김승원·용혜인' 둘러싸고 강대강 대치 - 조선일보`,url:`https://www.chosun.com/`},{title:`청와대, 장관 후보자 자진사퇴 선 긋기... "인사청문회가 먼저" - 연합뉴스`,url:`https://www.yna.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`독일 작센안할트주 선거 극우 정당 AfD 압승, 유럽 정계 비상`,
  metrics:[`AfD 주의회 선거 제1당 등극`,`기존 연정 지지율 10%대 추락`],
  summary:`독일 동부 작센안할트주에서 치러진 지방 선거에서 극우 성향의 '독일을 위한 대안(AfD)'이 압승을 거두며 유럽 정치권 전체에 큰 파장을 일으켰습니다. 반이민 정책과 자국 우선주의를 최우선으로 내세운 AfD의 돌풍은 기존 주류 정치 세력의 경제 및 이민 정책에 대한 유권자들의 강한 불만이 표출된 결과입니다. 이로 인해 프리드리히 메르츠 총리가 이끄는 현 독일 연립정부는 심각한 정치적 타격을 입고 리더십 위기에 직면하게 되었습니다. 유럽 전역에서 우파 포퓰리즘이 확산하는 가운데 핵심 국가인 독일까지 극우 세력이 득세함에 따라 향후 유럽연합(EU)의 결속력에도 금이 갈 우려가 큽니다. 다가오는 다른 주요 지역 선거에서도 이러한 극우 약진 현상이 도미노처럼 이어질지 전 세계가 주목하고 있습니다.`,
  keyTerms:[{term:`우파 포퓰리즘`,explanation:`기성 정치와 기득권층을 비판하면서 대중의 감정을 자극하고, 주로 반이민, 자국 중심주의, 전통적 가치를 내세우는 우파 성향의 정치 이데올로기입니다.`}],
  history:`독일 재통일 이후 구동독 지역은 서독에 비해 경제적 소외감과 박탈감이 누적되어 왔으며, 최근 이민자 급증과 경제 침체가 맞물리면서 극우 정당의 텃밭으로 변모했습니다.`,
  players:`기존 주류 정당인 기민당(CDU)과 사민당(SPD)은 지지층 이탈을 겪고 있으며, 알리스 바우델 등 AfD 지도부는 동부 지역의 압승을 발판으로 전국 정당화를 노리고 있습니다.`,
  current:`선거 결과 발표 직후 주류 정당들은 연정 붕괴의 책임을 놓고 서로를 비난하고 있으며, 독일 전역에서는 극우 반대 시위와 지지 시위가 동시에 일어나며 사회가 양극화되고 있습니다.`,
  outlook:`이번 선거 결과는 내년으로 다가온 독일 연방 총선의 풍향계 역할을 할 것입니다. 기존 정당들이 이민 및 경제 정책을 보수적으로 선회할 가능성이 높게 점쳐지고 있습니다.`,
  sources:[{title:`Far-right AfD wins decisively in German regional elections - AP`,url:`https://apnews.com/`},{title:`AfD's historic win shocks German political establishment - The New York Times`,url:`https://www.nytimes.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미 육군성 장관 전격 사임, 국방 수뇌부 갈등 수면 위로`,
  metrics:[`댄 드리스콜 장관 취임 1년여 만에 사임`,`중동 분쟁 7개월째 장기화`],
  summary:`미국의 댄 드리스콜 육군성 장관이 피트 헤그세스 국방장관과의 지속적인 정책 및 예산 충돌 끝에 전격적으로 사임서를 제출했습니다. 이란 및 중동 무장 단체들과의 군사적 긴장이 7개월째 이어지며 탄약 부족과 미군 병력의 피로도가 극에 달한 상황에서 발생한 지휘부의 핵심 공백입니다. 그동안 쉬쉬해오던 미 국방부 펜타곤 내부의 잦은 불협화음이 수면 위로 완전히 드러나면서 원활한 군사 작전 수행 차질을 우려하는 목소리가 커지고 있습니다. 특히 중동 지역의 안보 불안이 최고조에 달한 민감한 시기여서 이스라엘 등 주요 동맹국들의 방위 불안감도 덩달아 가중되고 있습니다. 차기 육군성 장관 지명이 늦어질 경우 미국의 전 세계 국방 전략 재편에도 부정적인 영향이 불가피할 전망입니다.`,
  keyTerms:[{term:`육군성 장관`,explanation:`미국 국방부 산하에서 육군의 행정, 예산 확보, 무기 조달, 병력 훈련 등 전반적인 조직 관리를 책임지는 민간 출신의 최고 책임자입니다.`}],
  history:`최근 수년간 미군은 예산 감축 압박 속에서 첨단 무기 개발과 재래식 병력 유지 사이에서 딜레마를 겪어왔으며, 중동 사태 발발 이후 군수품 재고 부족 문제가 수면 위로 떠올랐습니다.`,
  players:`미군의 군사 작전을 통제하는 피트 헤그세스 국방장관과 행정 및 예산을 책임지던 댄 드리스콜 육군성 장관 사이의 주도권 싸움이 이번 사태의 본질입니다.`,
  current:`드리스콜 장관의 전격 사임으로 육군 내부의 동요가 커지고 있으며, 의회 국방위원회는 국방부의 혼란스러운 리더십 부재 상황에 대해 강한 우려를 표명하고 있습니다.`,
  outlook:`백악관은 조속히 차기 장관 후보자를 지명하여 군의 혼란을 수습하려 하겠지만, 상원 인준 과정에서 국방부의 중동 정책 실패에 대한 거센 추궁이 이어질 것으로 예상됩니다.`,
  sources:[{title:`US Army Secretary Dan Driscoll resigns amid Pentagon infighting - The Wall Street Journal`,url:`https://www.wsj.com/`},{title:`Leadership vacuum in US military raises concerns over Middle East strategy - The New York Times`,url:`https://www.nytimes.com/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`애플 팀 쿡 CEO 15년 만에 퇴임, 후임에 존 터니스 지명`,
  metrics:[`팀 쿡 애플 CEO 15년 재임`,`애플 시가총액 세계 1위 수성`],
  summary:`애플을 15년간 성공적으로 이끌어온 팀 쿡 최고경영자(CEO)가 마침내 경영 일선에서 물러나며 IT 업계에 큰 획을 그었습니다. 그의 재임 기간 동안 애플은 아이폰 생태계를 공고히 하고 서비스 부문을 크게 확장하며 글로벌 시가총액 1위 자리를 굳건히 지켰다는 찬사를 받습니다. 후임으로는 오랜 기간 애플의 하드웨어 엔지니어링을 총괄하며 제품 혁신을 이끌어온 존 터니스가 지명되어 애플의 새로운 시대를 열게 되었습니다. 존 터니스는 급변하는 인공지능(AI) 혁신과 미래 먹거리인 공간 컴퓨팅 분야에서 애플의 경쟁력을 다시 증명해야 하는 무거운 과제를 안고 있습니다. 세계 최대 테크 기업의 경영진 교체 소식에 글로벌 IT 업계와 주식 시장은 향후 애플의 제품 철학이 어떻게 변화할지 촉각을 곤두세우고 있습니다.`,
  keyTerms:[{term:`시가총액`,explanation:`증권 시장에 상장된 특정 기업의 발행 주식 총수에 주당 가격을 곱한 값으로, 기업의 현재 시장 가치와 경제적 규모를 나타내는 대표적인 재무 지표입니다.`}],
  history:`스티브 잡스의 뒤를 이어 2011년 CEO에 오른 팀 쿡은 탁월한 공급망 관리 능력과 안정적인 조직 운영으로 애플을 세계에서 가장 수익성 높은 기업으로 성장시켰습니다.`,
  players:`경영 일선에서 물러나는 팀 쿡과 새롭게 조타수를 쥐게 된 하드웨어 전문가 존 터니스 신임 CEO, 그리고 이를 지켜보는 전 세계 투자자 및 소비자들이 얽혀 있습니다.`,
  current:`애플은 최근 생성형 AI 경쟁에서 경쟁사들에 비해 다소 뒤처졌다는 평가를 받고 있으며, 비전 프로 등 혼합현실 기기의 대중화라는 어려운 숙제를 직면하고 있습니다.`,
  outlook:`존 터니스 신임 체제 아래서 애플이 폐쇄적인 기존 생태계를 유지할지, 아니면 AI 시대에 맞춰 더욱 개방적이고 파격적인 폼팩터를 선보일지 올가을 신제품 발표회에 이목이 쏠립니다.`,
  sources:[{title:`Tim Cook steps down as Apple CEO after 15 years, John Ternus to succeed - Bloomberg`,url:`https://www.bloomberg.com/`},{title:`End of an era: What Tim Cook's departure means for Apple's future - Financial Times`,url:`https://www.ft.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`메타, 일부 스마트 글래스 원격 먹통 조치로 사용자 반발 확산`,
  metrics:[`약 1만 대 이상 기기 원격 비활성화`,`소비자 단체 집단 소송 준비`],
  summary:`메타가 자사의 증강현실 스마트 글래스 일부 제품군에 대해 원격으로 기기 작동을 정지시키는 이른바 '벽돌화' 조치를 단행해 전 세계적으로 큰 논란이 일고 있습니다. 메타 측은 운영체제 보안 취약점 악용 및 사용자 개인정보 보호 규정 위반을 막기 위한 불가피한 조치였다고 해명했으나, 사용자들은 사전 경고조차 없는 일방적인 기기 차단이라며 강하게 반발하고 있습니다. 이 사건은 개인이 하드웨어 소유권을 가지더라도 소프트웨어 통제권을 제조사가 독점하고 있는 현대 스마트 기기 시장의 구조적 문제점을 여실히 보여줍니다. 소비자가 수백 달러를 주고 산 기기라도 빅테크 제조사의 일방적 결정에 따라 언제든 무용지물이 될 수 있다는 디지털 종속 불안감이 확산되고 있습니다. 향후 각국 규제 당국이 기업의 과도한 소프트웨어 통제 권한 남용을 어떻게 제재할지가 주요 쟁점입니다.`,
  keyTerms:[{term:`벽돌화`,explanation:`스마트폰이나 웨어러블 기기 등의 핵심 소프트웨어에 문제가 생기거나 제조사가 원격으로 잠금을 걸어, 기기가 마치 돌덩이처럼 전혀 작동하지 않는 먹통 상태가 되는 현상입니다.`}],
  history:`과거에도 게임기나 스마트 디바이스에서 제조사가 불법 개조를 막기 위해 기기를 차단한 사례는 있었으나, 이번처럼 일상 생활용 웨어러블 기기를 대규모로 원격 정지시킨 것은 이례적입니다.`,
  players:`사생활 보호와 해킹 방지를 우선시하는 메타(Meta) 경영진과 갑자기 안경이 먹통이 된 수많은 글로벌 소비자들, 그리고 디지털 권리를 주장하는 시민 단체들이 맞서고 있습니다.`,
  current:`온라인 커뮤니티를 중심으로 메타에 대한 불매 운동 조짐이 보이고 있으며, 피해를 입은 사용자들은 법무법인을 통해 집단 소송을 제기하기 위해 피해 사례를 규합하고 있습니다.`,
  outlook:`이 논란은 곧 미국 연방거래위원회(FTC)와 유럽연합(EU)의 디지털 기기 소유권 및 소비자 권리 관련 새로운 법제도 논의에 불을 지피는 중요한 촉매제가 될 것으로 보입니다.`,
  sources:[{title:`Meta faces backlash after remotely bricking users' smart glasses - Reuters`,url:`https://www.reuters.com/`},{title:`The danger of smart devices: When corporations turn your hardware into a brick - The Economist`,url:`https://www.economist.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`북한, 전술핵 탑재 가능 신형 5,000톤급 구축함 동해 전격 취역`,
  metrics:[`배수량 5,000톤급 신형 함정`,`순항미사일 수직발사관 다수 장착`],
  summary:`북한이 다양한 전술핵무기를 탑재할 수 있는 것으로 평가되는 5,000톤급 신형 구축함 '강건호'를 동해 함대에 전격적으로 취역시키며 역내 군사적 긴장감을 최고조로 끌어올리고 있습니다. 김정은 국무위원장은 건조된 함정의 취역식에 직접 참석해 진정한 의미의 해군 핵무장화 실현을 거듭 강조하며 최근 강화되고 있는 한미일 3국의 연합 해상 훈련에 대해 강력한 무력 경고 메시지를 던졌습니다. 이번 신형 대형 구축함의 실전 배치로 인해 한반도 주변 해역, 특히 동해상에서의 우발적 무력 충돌 위험이 한층 커졌다는 군사 전문가들의 분석이 잇따르고 있습니다. 우리 군과 정보 당국은 북한의 실제 원양 해상 도발 능력이 어느 정도까지 향상되었는지 그 제원을 정밀하게 예의주시하고 있습니다. 국제사회 역시 북한의 지속적이고 노골적인 핵 투발 수단 다변화 행보를 강하게 규탄하며 대북 제재망을 재점검하고 나섰습니다.`,
  keyTerms:[{term:`해군 핵무장화`,explanation:`육상 기지뿐만 아니라 수상함이나 잠수함 등 해군 전투 함정에 전술핵이나 전략핵 무기를 실전 배치하여, 바다 위에서도 언제든 핵 공격 능력을 행사할 수 있도록 군사력을 개편하는 전략입니다.`}],
  history:`북한 해군은 그동안 노후화된 소형 연안 경비정 위주의 전력으로 평가받았으나, 최근 수년간 김정은 위원장의 지시 아래 해상 전력 현대화와 대형 수상함 건조에 막대한 자원을 쏟아부었습니다.`,
  players:`새로운 해상 비대칭 전력을 과시하려는 북한 군부와, 이를 억제하고 정밀 감시해야 하는 한국 해군 및 미국 태평양함대가 동해를 무대로 팽팽하게 대치하고 있습니다.`,
  current:`강건호의 취역은 북한 정권 수립일(9·9절)을 하루 앞두고 내부 체제 결속을 다지는 동시에, 한미 연합 방위 태세에 균열을 내기 위한 다목적 무력시위 성격을 띠고 있습니다.`,
  outlook:`한국과 미국은 북한의 해상 도발에 대비해 연합 대잠·대함 훈련 강도를 더욱 높일 예정이며, 북한이 이 구축함을 이용해 실제로 미사일 시험 발사를 감행할 가능성도 제기됩니다.`,
  sources:[{title:`북한, 전술핵 탑재 5000t급 신형 구축함 '강건호' 동해 취역 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`김정은 "해군 핵무장화 실현"... 한미일 연합훈련 겨냥 무력시위 - KBS`,url:`https://news.kbs.co.kr/`}]
}]

  tag:`2026-09-07`,

  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`세계 최대 노르웨이 국부펀드, 미국 국채 비중 12%p 대폭 축소 제안`,
  metrics:[`미 국채 비중 12.2%p 축소`,`약 800억 달러 매각 예상`],
  summary:`세계 최대 규모의 투자자인 노르웨이 정부연금펀드(GPFG)가 미국 국채 비중을 대폭 줄이겠다고 제안했습니다. 이들은 포트폴리오 재조정의 일환으로 미국 국채 비중을 기존보다 12.2%포인트 줄인다는 방침입니다. 이는 약 800억 달러에 달하는 막대한 규모로, 글로벌 채권 시장에 큰 파장을 예고하고 있습니다. 펀드 측은 지정학적 리스크 분산과 수익률 다변화를 이유로 꼽았습니다. 유럽과 신흥국 시장으로의 자금 이동이 예상되는 가운데, 미 국채 금리 상승 압력으로 작용할 수 있다는 분석이 나옵니다. 향후 노르웨이 의회의 최종 승인 여부에 전 세계 투자자들의 이목이 쏠려 있습니다.`,
  keyTerms:[{term:`포트폴리오 재조정`,explanation:`시장 상황이나 투자 목표의 변화에 맞춰 보유한 자산(주식, 채권 등)의 비율을 다시 조정하는 것을 말합니다. 위험을 줄이거나 수익을 높이기 위해 주기적으로 실시합니다.`}],
  history:`노르웨이는 석유 수출로 벌어들인 막대한 국부를 미래 세대를 위해 GPFG라는 이름의 펀드로 운용해 왔으며, 주로 선진국 국채에 투자해 안전성을 꾀했습니다.`,
  players:`노르웨이 정부와 의회, 그리고 이 펀드의 운용 주체가 결정 권한을 가지며, 미국 정부는 국채 최대 큰손의 이탈을 예의주시하고 있습니다.`,
  current:`최근 달러 패권에 대한 의구심과 글로벌 금리 불확실성이 커지면서, 펀드 측이 선제적으로 리스크 관리에 나선 것으로 풀이됩니다.`,
  outlook:`올 연말 노르웨이 의회에서 이 제안이 최종 통과될 경우, 내년부터 실제 대규모 자본 이동이 시작될 전망입니다.`,
  sources:[{title:`노르웨이 국부펀드, 미 국채 비중 축소 제안 - 글로벌이코노믹`,url:`https://www.g-enews.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`정부, 비효율 해소 위해 공공기관 20% 대대적 통폐합 추진`,
  metrics:[`공공기관 20% 감축`,`연간 3조원 예산 절감 목표`],
  summary:`정부가 만성적인 적자와 비효율을 해결하기 위해 국내 공공기관의 약 20%를 줄이는 대대적인 구조조정 및 통폐합 계획을 발표했습니다. 유사하거나 중복되는 업무를 수행하는 기관들을 하나로 합치고, 불필요한 산하 단체를 과감히 없애는 것이 핵심입니다. 이를 통해 연간 약 3조 원의 국가 예산을 절감할 수 있을 것으로 정부는 내다보고 있습니다. 하지만 기관 통폐합에 따른 대규모 인력 감축 우려로 노동계의 강한 반발이 즉각 터져 나왔습니다. 향후 국회 입법 과정과 노사정 대화에서 극심한 진통이 예상됩니다. 공공서비스 질 저하를 막으면서도 재정 건전성을 달성할 수 있을지가 이번 개혁의 성패를 가를 전망입니다.`,
  keyTerms:[{term:`재정 건전성`,explanation:`국가나 기관이 수입과 지출의 균형을 잘 맞추어 빚을 지지 않고 재무 상태를 튼튼하게 유지하는 것을 의미합니다.`}],
  history:`지난 수년간 공공기관의 숫자는 지속적으로 증가해왔으나, 방만 경영과 낙하산 인사 논란이 겹치며 적자 폭이 크게 늘어났습니다.`,
  players:`기획재정부를 필두로 한 정부 부처가 칼자루를 쥐고 있으며, 양대 노총과 야당은 일방적인 구조조정에 반대하고 있습니다.`,
  current:`저출산 고령화로 인한 세수 감소 압박이 커지면서 정부가 더 이상 공공부문의 비대화를 방치할 수 없다고 판단한 상황입니다.`,
  outlook:`정부는 다음 달 세부적인 통폐합 대상 리스트를 확정하여 발표할 예정이며, 이후 본격적인 법 개정 절차에 돌입합니다.`,
  sources:[{title:`국내 공공기관 20% 통폐합 추진... 반발 예고 - 연합뉴스`,url:`https://www.yna.co.kr/`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 주도의 AI 반도체 대중 수출 통제 강화, 글로벌 칩 시장 요동`,
  metrics:[`수출 통제 대상 50개 추가`,`AI 칩 관련주 평균 4% 하락`],
  summary:`미국 정부가 인공지능(AI) 개발에 필수적인 첨단 반도체 및 제조 장비에 대한 새로운 대중국 수출 통제 조치를 기습 발표했습니다. 이번 조치로 고성능 칩뿐만 아니라 범용 AI 가속기 등 50여 개 품목이 새롭게 수출 통제 대상에 포함되었습니다. 이 소식이 전해지자 엔비디아를 비롯한 글로벌 주요 반도체 기업들의 주가가 일제히 하락하며 칩 시장이 크게 출렁였습니다. 기업들은 이번 규제로 인해 거대한 중국 시장에서의 매출 타격이 불가피할 것으로 우려하고 있습니다. 한국의 메모리 반도체 업계 또한 중국 내 공장 운영과 장비 반입에 미칠 간접적 영향을 분석하며 촉각을 곤두세우고 있습니다. 기술 패권을 둘러싼 미중 갈등이 반도체 산업 전체의 불확실성을 키우고 있습니다.`,
  keyTerms:[{term:`수출 통제`,explanation:`국가 안보나 외교적 목적을 위해 특정 기술이나 물품이 다른 나라로 수출되는 것을 법으로 제한하고 막는 조치입니다.`}],
  history:`미국은 2022년부터 첨단 반도체와 장비가 중국의 군사력 강화에 쓰이는 것을 막고자 강력한 규제망을 구축해왔습니다.`,
  players:`미국 상무부가 규제를 주도하며, 중국 정부는 강력히 반발하는 가운데 엔비디아, 삼성전자, SK하이닉스 등 기업들이 중간에 끼어 있습니다.`,
  current:`중국이 자체적인 AI 반도체 개발에 속도를 내자, 미국이 기존 규제의 빈틈을 막기 위해 촘촘한 추가 제재를 가한 것입니다.`,
  outlook:`중국 상무부의 보복 조치 발표가 임박한 것으로 알려졌으며, 반도체 공급망을 둘러싼 양국의 보복전이 격화될 가능성이 높습니다.`,
  sources:[{title:`미, AI 반도체 통제 강화... 글로벌 칩 시장 흔들 - 매일경제`,url:`https://www.mk.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`스페이스X, 파리 우주정상회의 돌연 불참 통보로 각국 당혹`,
  metrics:[`30여 개국 정상 참석 예정`,`위성 궤도 룰 제정 논의 무산 위기`],
  summary:`일론 머스크가 이끄는 민간 우주기업 스페이스X가 프랑스 파리에서 열리는 우주정상회의에 돌연 불참을 통보했습니다. 이번 회의는 30여 개국 정상과 글로벌 우주 기업 대표들이 모여 지구 저궤도 위성 교통정리와 우주 쓰레기 방지 규범을 논의하는 중요한 자리였습니다. 세계 최대 위성 통신망인 스타링크를 운영하는 스페이스X가 빠짐으로써, 실효성 있는 궤도 규제안 마련은 사실상 불가능해졌다는 평가가 지배적입니다. 머스크 측은 특정 국가 중심의 편향된 규제 시도에 반대한다는 짧은 입장만 냈을 뿐 구체적인 불참 사유를 밝히지 않았습니다. 이에 따라 유럽연합(EU)과 미국 당국자들은 당혹감을 감추지 못하며 대응책 마련에 부심하고 있습니다. 민간 기업의 힘이 국가 간 협의체를 흔드는 우주 패권의 현주소를 극명히 보여주고 있습니다.`,
  keyTerms:[{term:`우주 패권`,explanation:`우주 공간을 탐사하고 이용하는 기술력과 자본력을 바탕으로, 국제 사회에서 우주 정책과 경제적 주도권을 쥐려는 국가나 기업의 영향력을 뜻합니다.`}],
  history:`지구 궤도에 쏘아 올려지는 상업용 위성이 기하급수적으로 늘어나면서 위성 간 충돌 위험이 심각한 국제 문제로 대두되었습니다.`,
  players:`엄격한 궤도 규제를 도입하려는 유럽연합(EU)과 규제를 최소화하려는 스페이스X, 그리고 이를 조율해야 하는 미국 정부가 핵심 행위자입니다.`,
  current:`EU 측이 위성 발사 허가에 대한 강력한 환경 및 안전 표준을 제시할 조짐을 보이자, 스페이스X가 사전 보이콧으로 불만을 표출한 상황입니다.`,
  outlook:`회의에 불참한 스페이스X를 제외하고 각국이 독자적인 규제안을 강행할지, 아니면 일정을 연기하고 재협상을 시도할지 귀추가 주목됩니다.`,
  sources:[{title:`스페이스X, 파리 우주정상회의 불참... 궤도 규제 논의 빨간불 - MBC 뉴스`,url:`https://imnews.imbc.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`정부, 중동 긴장 고조에 호르무즈 해협 해상 초계 파병 구체적 검토`,
  metrics:[`파병 규모 약 150명`,`원유 수송량의 70% 통과 지역`],
  summary:`중동 지역의 군사적 긴장이 최고조에 달한 가운데, 정부가 호르무즈 해협 일대에 국군 병력을 파병하는 방안을 적극 검토 중입니다. 현재 논의되는 규모는 해상 초계기와 군수 지원함을 포함한 약 150명 수준인 것으로 알려졌습니다. 호르무즈 해협은 우리나라로 들어오는 원유 수송량의 약 70%가 통과하는 핵심 생명선이기에 우리 상선 보호가 필수적이라는 게 정부의 입장입니다. 그러나 범여권과 야당 등 정치권 일각에서는 분쟁 지역에 개입할 경우 테러 단체의 표적이 될 수 있다며 강하게 반발하고 있습니다. 국민 안전과 에너지 안보라는 두 가지 국익이 충돌하면서, 파병을 둘러싼 국회 내 격렬한 찬반 논쟁이 시작되었습니다. 향후 국무회의 의결과 국회 동의 절차 통과 여부가 핵심 변수입니다.`,
  keyTerms:[{term:`에너지 안보`,explanation:`국가가 경제 활동과 국민 생활에 필수적인 에너지원(석유, 가스 등)을 흔들림 없이 안정적으로 확보하고 유지하는 능력을 말합니다.`}],
  history:`과거에도 청해부대 작전 지역을 호르무즈 해협까지 확대한 전례가 있으나, 독자적인 해상 초계 병력을 새롭게 파병하는 것은 그 의미가 다릅니다.`,
  players:`파병을 주도하는 국방부 및 외교부와 이에 반대하는 야당 및 시민단체가 팽팽하게 맞서고 있습니다.`,
  current:`최근 이스라엘-이란 갈등이 해상 봉쇄 위협으로 번지면서 민간 유조선의 피격 위험이 현실화된 것이 파병 검토의 직접적 원인입니다.`,
  outlook:`정부는 미국 주도의 다국적 연합체 합류 방식과 독자 파병 방식을 두고 고심 중이며, 이달 말 국회 국방위원회에 최종안을 보고할 예정입니다.`,
  sources:[{title:`정부, 호르무즈 해협 150명 파병 검토... 정치권 반발 - KBS 뉴스`,url:`https://news.kbs.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 대선 두 달 앞으로... 핵심 경합주 표심 잡기 총력전 돌입`,
  metrics:[`대선까지 58일 남음`,`경합주 지지율 격차 1%p 이내 초접전`],
  summary:`2026년 미국 대선이 두 달도 채 남지 않은 가운데, 양당 후보들이 백악관의 주인을 결정지을 핵심 경합주에서 총력전에 돌입했습니다. 펜실베이니아, 미시간, 위스콘신 등 주요 경합주의 여론조사 결과 양측의 지지율 격차는 여전히 1%포인트 이내의 초접전 양상을 보이고 있습니다. 양 캠프는 주말 동안 이들 지역에 천문학적인 광고비를 쏟아부으며 중도층 유권자의 표심을 잡기 위해 안간힘을 쓰고 있습니다. 공화당은 경제 인플레이션 심판론을 앞세운 반면, 민주당은 민주주의 수호와 복지 강화를 강조하며 팽팽히 맞서고 있습니다. 사전 투표가 곧 시작되는 만큼 한 치의 실수도 용납되지 않는 살얼음판 승부가 펼쳐지고 있습니다. 이번 경합주의 향방이 미국의 향후 4년 외교 및 경제 정책을 완전히 뒤바꿀 수 있습니다.`,
  keyTerms:[{term:`경합주`,explanation:`선거 때마다 지지하는 정당이 바뀌어 어느 후보가 승리할지 예측하기 매우 힘든 주를 말하며, 스윙 스테이트라고도 부릅니다.`}],
  history:`미국의 독특한 선거인단 제도 때문에, 전체 득표수보다 몇몇 주요 경합주에서 승리해 선거인단을 확보하는 것이 대선 승리의 절대적 공식입니다.`,
  players:`재집권을 노리는 민주당 후보와 정권 탈환을 목표로 하는 공화당 후보, 그리고 표심을 정하지 못한 무당층 유권자들이 주인공입니다.`,
  current:`최근 TV 토론 이후에도 지지율이 굳어지면서, 양측 모두 경합주 유권자들을 직접 찾아가는 현장 밀착형 유세에 사활을 걸고 있습니다.`,
  outlook:`9월 말로 예정된 2차 TV 토론과 10월부터 본격화되는 우편 및 사전투표 실적이 경합주 승패를 가를 마지막 분수령이 될 것입니다.`,
  sources:[{title:`미 대선 50여일 앞두고 경합주 초접전... 광고비 융단폭격 - 연합뉴스`,url:`https://www.yna.co.kr/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`네팔 등 남아시아 기록적 대홍수로 수십만 명 이재민 발생`,
  metrics:[`이재민 약 40만 명 추산`,`강수량 평년 대비 300% 폭우`],
  summary:`네팔을 비롯한 남아시아 전역에 평년 대비 300%가 넘는 기록적인 집중 호우가 쏟아지며 대규모 홍수 참사가 발생했습니다. 이로 인해 강둑이 무너지고 산사태가 잇따르면서 하루아침에 수십만 명의 이재민이 삶의 터전을 잃었습니다. 도심의 주요 도로와 교량이 끊겨 고립된 마을이 늘어나고 있으며, 식수와 식량 부족으로 인한 전염병 확산마저 우려되는 참담한 상황입니다. 네팔 정부는 즉각 국가 비상사태를 선포하고 군부대를 투입해 구조 작업을 벌이고 있지만 피해 규모가 워낙 커 역부족입니다. 유엔(UN)을 비롯한 국제 사회는 긴급 구호 자금을 편성하고 의료진을 급파하는 등 인도적 지원을 서두르고 있습니다. 기후 변화로 인한 극단적 기상 이변이 갈수록 잦아지면서 근본적인 방재 대책이 시급하다는 목소리가 커지고 있습니다.`,
  keyTerms:[{term:`인도적 지원`,explanation:`전쟁이나 자연재해 등으로 생존의 위협을 받는 사람들의 생명을 구하고 고통을 덜어주기 위해 국제 사회가 식량, 의료 등을 대가 없이 돕는 활동입니다.`}],
  history:`남아시아 지역은 매년 몬순(우기) 시즌마다 홍수 피해를 겪어왔으나, 올해는 엘니뇨와 기후 온난화가 겹치며 역대급 강수량을 기록했습니다.`,
  players:`큰 피해를 입은 네팔 정부와 이재민들, 그리고 신속한 구조 물자를 보내야 하는 국제 구호 단체(NGO)들이 분투하고 있습니다.`,
  current:`폭우가 여전히 며칠 더 이어질 것이라는 기상 예보가 있어, 댐 붕괴 등 2차 피해 발생 가능성에 대한 긴장감이 매우 높습니다.`,
  outlook:`국제 사회의 초기 구호 물품이 도착하기 시작했으나, 훼손된 인프라 복구와 이재민들의 일상 회복까지는 수년의 시간과 천문학적 비용이 걸릴 전망입니다.`,
  sources:[{title:`남아시아 네팔, 최악의 대홍수... 국제사회 긴급 구호 착수 - 한겨레`,url:`https://www.hani.co.kr/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`서울 도심 한복판, 운전대 없는 완전 자율주행 버스 정식 운행 개시`,
  metrics:[`1차 노선 길이 15km`,`안전요원 1명 탑승 (조향장치 없음)`],
  summary:`운전석과 조향 장치가 아예 없는 완전 자율주행(레벨 4 수준) 버스가 서울 도심에서 정식으로 승객을 태우고 운행을 시작했습니다. 이번에 도입된 노선은 유동 인구가 많은 도심 주요 구간 15km로, 버스는 주변 차량과 신호등 데이터를 실시간으로 통신하며 부드럽게 주행합니다. 현행법상 비상 상황을 대비해 안전요원 1명이 탑승하지만, 주행 자체는 100% 인공지능과 센서에 의해 자동으로 이루어집니다. 첫날 버스에 탑승한 시민들은 놀라울 만큼 안정적인 승차감에 감탄하면서도 미래 기술이 일상에 성큼 다가왔음을 실감했습니다. 서울시는 이번 정식 운행 데이터를 바탕으로 내년까지 대중교통 소외 지역으로 자율주행 노선을 대폭 확대할 계획입니다. 이번 성공적인 첫발이 국내 미래 모빌리티 산업 전반에 활력을 불어넣을 것으로 기대됩니다.`,
  keyTerms:[{term:`완전 자율주행`,explanation:`시스템이 차량의 속도, 방향, 제동 등을 완벽하게 통제하여, 특정 조건 내에서는 사람의 개입이나 운전대 조작이 전혀 필요 없는 기술 단계를 말합니다.`}],
  history:`그동안 상암동 등 지정된 시범 구역에서 부분적인 자율주행 테스트가 수년간 진행되어 왔으며, 마침내 기술적 안정성을 인정받아 정식 운행에 돌입했습니다.`,
  players:`자율주행 소프트웨어를 개발한 국내 테크 스타트업과 규제를 완화하고 노선을 신설한 서울시가 주요 추진 주체입니다.`,
  current:`고령화로 인한 버스 운전기사 부족 현상이 심화되는 가운데, 자율주행 대중교통이 실질적인 대안으로 주목받으며 상용화 속도를 높이고 있습니다.`,
  outlook:`정식 운행 중 돌발적인 교통사고나 통신 오류가 발생하지 않는다면, 서울을 넘어 다른 지자체로도 자율주행 대중교통 도입이 빠르게 확산될 전망입니다.`,
  sources:[{title:`운전대 없는 버스 탔다... 서울 도심 '완전 자율주행' 시대 개막 - 조선일보`,url:`https://www.chosun.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`태평양엔 허리케인 3개 동시 북상, 대서양은 '잠잠'... 기이한 이상 기후`,
  metrics:[`태평양 허리케인 3개 발생`,`대서양 발생 0건 (평년 동기 대비)`],
  summary:`북반구의 가을로 접어드는 9월 초, 태평양에서는 무려 3개의 허리케인이 동시에 북상하는 반면 대서양은 텅 비어 있는 기이한 이상 기후 현상이 관측되었습니다. 기상청에 따르면 현재 태평양 동부 해상에서 로웰, 카리나, 마리로 명명된 강력한 허리케인 3개가 잇따라 발생해 움직이고 있습니다. 반면 통상적으로 허리케인 발생이 가장 잦아야 할 시기인 대서양에서는 단 한 개의 태풍 씨앗조차 발생하지 않아 기상학자들을 당혹게 하고 있습니다. 전문가들은 해수면 온도 변화와 윈드시어(바람의 세기 차이) 등 복합적인 대기 흐름이 꼬이면서 이례적인 현상이 나타났다고 분석합니다. 이처럼 예측을 벗어난 이상 기후는 태평양 연안 국가들의 재난 대비 시스템에 큰 혼란을 주고 있습니다. 전 지구적 기후 온난화가 과거의 기상 공식을 완전히 무너뜨리고 있다는 경고가 나옵니다.`,
  keyTerms:[{term:`이상 기후`,explanation:`과거 수십 년 동안 겪어보지 못했던 폭우, 폭염, 극단적 태풍 등 통계적 기준을 크게 벗어나는 비정상적인 날씨 현상을 통틀어 부르는 말입니다.`}],
  history:`일반적으로 늦여름과 초가을은 대서양 해수면 온도가 최고조에 달해 미국 동부와 카리브해 연안을 강타하는 허리케인이 집중적으로 발생하는 시기입니다.`,
  players:`실시간으로 날씨를 추적하는 각국 기상청과 세계기상기구(WMO), 그리고 갑작스러운 폭우 피해를 대비해야 하는 태평양 연안 국가들이 촉각을 곤두세우고 있습니다.`,
  current:`특정 바다의 온도가 비정상적으로 높아지는 해양 열파 현상이 태평양 쪽에 집중되면서 열대성 저기압이 폭발적으로 생겨나고 있는 상황입니다.`,
  outlook:`기상학자들은 9월 중순 이후 기압계가 재배치되면 대서양에서도 갑자기 초강력 허리케인이 발생할 수 있다며 경계를 늦추지 말 것을 권고하고 있습니다.`,
  sources:[{title:`태평양엔 허리케인 3개, 대서양은 0개... 기상학자들도 놀란 '이상 기후' - 중앙일보`,url:`https://www.joongang.co.kr/`}]
}]

  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미 연준 금리 인상 가능성 고조... 10년물 국채 금리 4.80% 돌파`,
  metrics:[`기준금리 3.50%~3.75%`,`10년물 국채 금리 4.80%`],
  summary:`제롬 파월의 뒤를 이은 케빈 워시 연준 의장이 최근 잭슨홀 미팅에서 인플레이션 우려를 표명하며 추가 금리 인상 가능성을 강력히 시사했다. 이에 따라 미국 10년물 국채 금리는 2025년 초 이후 최고치인 4.80%까지 치솟았다. 특히 9월 11일 발표될 8월 소비자물가지수(CPI) 결과가 금리 향방을 결정할 핵심 변수로 떠올랐다. 고금리 장기화로 인해 주택담보대출 등 실물 경제의 자금 조달 부담이 크게 늘어나고 있다. 향후 연준이 어떤 스탠스를 취할지에 전 세계 금융 시장의 이목이 쏠린 상황이다. 추가적인 긴축 정책이 현실화될 경우 글로벌 증시에 상당한 충격이 예상된다.`,
  keyTerms:[{term:`긴축 정책`,explanation:`중앙은행이 시중에 풀린 돈을 거둬들이기 위해 금리를 올리는 등의 정책. 물가를 잡는 데 쓰이지만 경기를 둔화시킬 수 있다.`}],
  history:`2024~2025년 금리 인하 사이클이 끝난 후 물가가 다시 오르자 연준이 매파적으로 돌아섰다.`,
  players:`케빈 워시 연준 의장, 크리스토퍼 월러 이사 등 연준 주요 인사들과 시장 참여자들.`,
  current:`9월 FOMC를 앞두고 금리 인상 확률이 반반으로 나뉘며 극심한 눈치보기가 진행 중이다.`,
  outlook:`9월 11일 CPI 발표 결과와 다가올 연준의 금리 결정에 따라 시장 변동성이 커질 것이다.`,
  sources:[{title:`Powell successor hints at rate hikes - Reuters`,url:`https://www.reuters.com`},{title:`US Treasury yields spike - Bloomberg`,url:`https://www.bloomberg.com`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미 증시 시가총액 67조 달러 돌파... AI 투자 붐이 이끄는 '나홀로 독주'`,
  metrics:[`시가총액 67조 달러`,`미국 GDP의 220%`],
  summary:`글로벌 경기 둔화 우려 속에서도 미국 주식시장의 시가총액이 사상 최초로 67조 달러를 돌파했다. 이는 미국 명목 GDP의 220%에 달하는 엄청난 수치로, 사실상 미국 증시가 전 세계 자금을 블랙홀처럼 빨아들이고 있음을 의미한다. 특히 인공지능(AI) 관련 기술주들이 설비투자를 바탕으로 강력한 랠리를 주도하고 있다. 그러나 시장 전문가들은 펀더멘털 대비 과열된 주가 수준에 대해 닷컴버블과 유사한 극단적 쏠림 현상이라고 경고한다. 실질 임금 하락으로 미국 가계의 소비 심리가 악화되는 반면 주식 시장만 호황을 누리면서 경제 내 괴리감이 커지고 있다. 향후 AI 기업들의 실적이 기대치에 못 미칠 경우 급격한 시장 조정이 발생할 수 있다.`,
  keyTerms:[{term:`극단적 쏠림 현상`,explanation:`투자 자금이 특정 국가나 특정 산업에만 비정상적으로 집중되는 경제 현상.`}],
  history:`2023년부터 시작된 챗GPT 발 AI 혁명이 2026년까지 빅테크 기업들의 인프라 경쟁으로 이어지며 증시를 견인해왔다.`,
  players:`엔비디아, 마이크로소프트 등 AI 인프라를 주도하는 미국 빅테크 기업들과 월가 투자자들.`,
  current:`다른 국가들의 경제 지표는 부진한 반면 미국 AI 주식만 나홀로 폭등하는 디커플링이 심화되고 있다.`,
  outlook:`빅테크 기업들의 AI 수익화 모델 증명 여부와 실적 발표에 따라 랠리의 지속 가능성이 판가름 날 것이다.`,
  sources:[{title:`US stock market reaches record \$67T - FT`,url:`https://www.ft.com`},{title:`AI boom fuels Wall Street warnings - WSJ`,url:`https://www.wsj.com`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국 수출, 사상 첫 연간 '1조 달러' 클럽 가입 초읽기`,
  metrics:[`누적 수출액 7,094억 달러`,`반도체 수출 전년 대비 169.6% 폭증`],
  summary:`한국 수출이 반도체 호황에 힘입어 사상 유례없는 호조를 보이며 수출 1조 달러 클럽 가입을 눈앞에 두고 있다. 9월 초 기준 올해 누적 수출액은 7,094억 달러를 기록해, 이미 지난해 연간 총액을 돌파했다. 전체 수출의 40% 이상을 차지한 반도체가 전년 대비 169.6%나 폭증하며 맹활약한 것이 주효했다. 다만 승용차 수출이 다소 주춤하고 있어, 특정 품목에 대한 높은 의존도는 아킬레스건으로 지목된다. 이 추세가 연말까지 유지된다면 한국은 미국, 중국, 독일에 이어 세계 4번째 수출 강국으로 도약하게 된다. 정부는 반도체 외에도 다변화된 수출 동력 확보에 안간힘을 쏟고 있다. 이런 무역수지 흑자 행진이 내수 경기 회복으로 이어질 수 있을지가 다음 과제다.`,
  keyTerms:[{term:`무역수지`,explanation:`한 나라가 다른 나라들과 수출입 거래를 한 결과. 수출이 수입보다 많으면 흑자, 적으면 적자라고 한다.`}],
  history:`과거 글로벌 공급망 위기와 반도체 다운사이클로 어려움을 겪었으나, AI 수요 폭발과 함께 HBM 등 고부가가치 메모리 수출이 급증했다.`,
  players:`삼성전자, SK하이닉스 등 국내 반도체 핵심 기업들과 주요 수입국인 미국, 중국 등.`,
  current:`누적 수출액이 역대 최단기간에 7천억 달러를 넘어서며 유례없는 호황 국면에 진입했다.`,
  outlook:`12월 최종적으로 연간 수출 1조 달러 고지를 밟을 수 있을지와 내수 경제로의 낙수효과 여부가 주목된다.`,
  sources:[{title:`올해 누적 수출액 이미 작년 실적 넘었다 - 연합뉴스`,url:`https://www.yna.co.kr`},{title:`반도체가 이끈 수출 호황... 사상 첫 1조 달러 눈앞 - 매일경제`,url:`https://www.mk.co.kr`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`이란 전쟁 전선 확대... 미 군함 공격에 이란 유조선 폭격으로 맞대응`,
  metrics:[`전쟁 7개월 차`,`이란 유조선 3척 타격`],
  summary:`지난 2월 미·이 연합군의 기습 공습으로 발발한 이란 전쟁이 페르시아만 해상 교전으로 번지며 갈등이 극에 달하고 있다. 최근 이란 혁명수비대가 페르시아만 일대의 미 군함을 향해 탄도 미사일을 발사하자, 미군은 즉각 이란 유조선 3척을 타격해 무력화시키는 보복 작전을 감행했다. 이란 외무부는 이번 유조선 공격을 명백한 전쟁 범죄라 규정하며 강력히 반발하고 있다. 반면 미국 트럼프 대통령은 이를 단순한 군사적 마찰로 치부하며 사태의 의미를 축소하려는 태도를 보였다. 양측의 무력 충돌이 레바논 남부와 쿠웨이트 미군 기지 등으로 확산하면서 중동 지역 전체의 위기감이 고조되고 있다. 이번 해상 교전이 전면전으로 가는 도화선이 될지 국제사회가 숨죽여 지켜보고 있다.`,
  keyTerms:[{term:`전쟁 범죄`,explanation:`전시 국제법이나 제네바 협약을 위반하여 민간인, 상선 등을 고의로 공격하거나 비인도적인 행위를 저지르는 것.`}],
  history:`2026년 2월 미국과 이스라엘이 이란의 주요 핵 시설을 타격하고 최고지도자 하메네이가 사망하면서 이란 전쟁이 본격적으로 촉발되었다.`,
  players:`미국 트럼프 행정부, 이스라엘 네타냐후 내각, 그리고 이란 혁명수비대 및 중동 친이란 무장세력.`,
  current:`이란의 미사일 도발과 미국의 해상 보복 타격이 꼬리를 물며 페르시아만 일대의 봉쇄 위협이 커지고 있다.`,
  outlook:`호르무즈 해협 등 주요 원유 수송로의 안전 확보 여부와 트럼프 행정부의 추가 군사 개입 수위가 초미의 관심사다.`,
  sources:[{title:`US strikes Iranian oil tankers in retaliation - Reuters`,url:`https://www.reuters.com`},{title:`Escalation in the Persian Gulf as war enters 7th month - BBC`,url:`https://www.bbc.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`2026년 미국 중간선거 11월 3일 돌입... 공화당의 의회 장악 유지될까`,
  metrics:[`하원 435석 전체`,`상원 35석 선출`],
  summary:`도널드 트럼프 대통령의 두 번째 임기 중간 평가 성격을 띠는 2026년 미국 중간선거가 오는 11월 3일 치러진다. 현재 공화당이 상원 53석, 하원 218석으로 양원을 모두 장악하고 있는 가운데, 민주당은 상원 4석과 하원 3석을 탈환해 의회 주도권을 되찾겠다는 목표를 세웠다. 이번 선거의 핵심 쟁점은 단연 이란 전쟁에 투입된 막대한 전비와 사상자 문제다. 야당은 의회 승인 없이 무리하게 진행된 군사 작전의 책임을 물으며 심판론을 꺼내들었다. 선거 결과에 따라 트럼프 행정부의 후반기 국정 동력은 물론 향후 외교 안보 정책의 방향이 크게 요동칠 수 있다. 양당의 텃밭을 제외한 경합주에서의 표심 향방이 상하원 다수당을 결정지을 주요 변수인 중간선거에 이목이 쏠린다.`,
  keyTerms:[{term:`중간선거`,explanation:`미국에서 대통령 임기 4년의 중간인 2년 차에 치러지는 의회 선거. 현직 대통령에 대한 중간 평가 성격을 지닌다.`}],
  history:`2024년 대선에서 승리한 트럼프 대통령은 첫 2년 동안 강력한 행정명령을 밀어붙였으나 최근 중동 전쟁으로 야당의 거센 역풍을 맞고 있다.`,
  players:`도널드 트럼프 대통령을 필두로 한 공화당, 상하원 탈환을 노리는 민주당, 그리고 선거의 향방을 가를 미국 유권자들.`,
  current:`선거를 두 달 앞두고 양당은 이란 전쟁 파병과 인플레이션 문제를 두고 날 선 정치 공방을 이어가고 있다.`,
  outlook:`11월 3일 선거 결과에 따라 트럼프 행정부의 국정 운영 동력이 크게 약화될지, 아니면 양원을 모두 방어할지 판가름 난다.`,
  sources:[{title:`2026 Midterm Elections approach as war fatigue grows - AP News`,url:`https://apnews.com`},{title:`GOP aims to hold Congress against Democratic surge - NYT`,url:`https://www.nytimes.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`정기국회 막 오른 여의도... 대정부질문과 인사청문회로 '전면전' 예고`,
  metrics:[`장관 후보자 6명`,`29일 만에 정책 번복`],
  summary:`9월 여의도 정기국회가 개막하면서 여야 간의 팽팽한 정치적 대결이 본격화되고 있다. 특히 9일부터 나흘간 진행되는 대정부질문에서는 외교, 경제, 사회 전반에 걸쳐 치열한 난타전이 벌어질 전망이다. 이어 14일부터는 추석 연휴 직전 6명의 장관 후보자에 대한 인사청문회 슈퍼위크가 열려 긴장감을 높이고 있다. 야당은 최근 29일 만에 번복된 종합부동산세 정책 혼선을 지적하며 국정 운영의 난맥상을 강하게 비판하고 나섰다. 또한 호르무즈 해협 파병 가능성 등 민감한 안보 이슈도 쟁점으로 부상했다. 여당은 정책의 유연성을 강조하며 야당의 공세를 국정 발목잡기로 규정하고 적극 방어에 나설 예정이다. 민생 법안 처리가 시급한 상황에서 정치 공방이 장기화될 우려가 제기된다.`,
  keyTerms:[{term:`인사청문회`,explanation:`대통령이 고위 공직자를 임명하기 전에 국회가 그 후보자의 자질, 도덕성, 업무 능력을 검증하는 절차.`}],
  history:`정부의 급작스러운 부동산 세제 개편 번복과 개각 단행이 맞물리면서 야당의 대정부 공세 명분이 강화되었다.`,
  players:`정책 방어에 나선 여당(더불어민주당)과 내각 낙마를 벼르는 야당(국민의힘), 그리고 검증대에 오르는 6명의 장관 후보자들.`,
  current:`대정부질문과 연이은 청문회 일정이 겹치면서 국회 내 정국 주도권을 잡기 위한 여야의 기싸움이 최고조에 달했다.`,
  outlook:`청문회 검증 결과에 따른 일부 후보자의 낙마 여부가 향후 정국 주도권과 다가올 추석 민심에 지대한 영향을 미칠 전망이다.`,
  sources:[{title:`정기국회 본격화... 여야 대정부질문 격돌 예고 - 연합뉴스`,url:`https://www.yna.co.kr`},{title:`추석 전 '인사청문회 슈퍼위크' 막 오른다 - 중앙일보`,url:`https://www.joongang.co.kr`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`AI 데이터센터 폭발적 증가 이면에 숨은 그림자... '물과 전력' 고갈 위기`,
  metrics:[`건설 비용 1000억 달러`,`하루 1만 톤 이상의 물 소비`],
  summary:`글로벌 빅테크 기업들이 AI 패권 경쟁을 벌이면서 데이터센터 건설 비용이 올해 약 1000억 달러까지 폭증했다. 그러나 이런 화려한 투자 이면에는 심각한 환경 문제가 도사리고 있다. 최첨단 AI 서버를 식히기 위해 미국 텍사스 등지의 데이터센터는 하루 1만 톤 이상의 물을 소비하고 있어 지역 지하수 고갈 우려를 낳았다. 유엔환경계획(UNEP)에 따르면 2026년 AI 데이터센터 전력 소비량이 한국 연간 전력량의 2배에 달할 것으로 추산된다. 결국 전력망의 물리적 한계와 극심한 탄소 배출이 AI 산업 성장의 최대 걸림돌로 작용하는 중이다. 각국 정부는 규제 마련에 착수했고 기업들은 대체 에너지 확보에 비상이 걸렸다. 혁신적인 저전력 기술이 뒷받침되지 않으면 AI 발전이 돌이킬 수 없는 환경 재앙으로 이어질 수 있다.`,
  keyTerms:[{term:`탄소 배출`,explanation:`석탄, 석유 같은 화석연료를 사용할 때 대기 중으로 방출되는 온실가스로, 지구 온난화의 주범이다.`}],
  history:`초거대 AI 모델의 학습과 추론을 위한 하드웨어 수요가 기하급수적으로 늘어나며 전 세계적인 데이터센터 확장이 가속화되었다.`,
  players:`AI 인프라를 확장하는 글로벌 빅테크 기업들과 지역 식수난을 겪는 주민들, 그리고 유엔 등 환경 기관들.`,
  current:`지역 사회의 반발과 전력망 포화로 인해 신규 데이터센터 허가를 거부하거나 엄청난 규모의 환경 부담금을 물리는 지자체가 급증하고 있다.`,
  outlook:`수랭식을 대체할 새로운 액침 냉각 기술 도입과 소형모듈원전(SMR) 등 무탄소 에너지원 확보 여부가 향후 AI 산업의 확장을 좌우할 것이다.`,
  sources:[{title:`The environmental cost of the AI boom - WSJ`,url:`https://www.wsj.com`},{title:`UN warns of AI data center energy crisis - Reuters`,url:`https://www.reuters.com`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`메타(Meta), 청소년 SNS 중독 방치 소송서 23조 원 합의... 역대급 철퇴`,
  metrics:[`합의금 170억 달러`,`청소년 보호 소홀 소송`],
  summary:`페이스북과 인스타그램의 모회사인 메타(Meta)가 청소년 보호 소홀로 제기된 대규모 집단 소송에서 최대 170억 달러(약 23조 5천억 원)를 지급하기로 합의했다. 이는 빅테크 기업을 상대로 한 징벌적 배상 중 역대 최대 규모로, 플랫폼이 미성년자에게 미치는 해악을 공식적으로 인정한 첫 사례다. 내부 고발자들의 폭로에 따르면, 메타는 자사의 알고리즘이 청소년 우울증과 섭식장애를 유발한다는 사실을 인지하고도 수익을 위해 고의로 방치했다. 이번 판결을 계기로 미성년자를 대상으로 한 철저한 알고리즘 규제와 SNS 가입 연령 제한 등 글로벌 차원의 강력한 법적 제재가 뒤따를 것으로 보인다. 거액의 합의금 지불과 시스템 전면 개편 요구로 인해 메타의 수익 모델은 근본적인 타격을 입게 되었다. IT 업계 전반에 기업의 사회적 책임을 묻는 거센 폭풍이 몰아치고 있다.`,
  keyTerms:[{term:`알고리즘 규제`,explanation:`사용자에게 맞춤형 콘텐츠를 추천하는 IT 기업의 컴퓨터 프로그램(알고리즘)이 사회적 해악을 끼치지 못하도록 법으로 통제하는 것.`}],
  history:`수년 전부터 인스타그램 등 소셜 미디어가 청소년 정신 건강에 악영향을 미친다는 내부 문건 폭로가 이어지며 미국 주정부들의 연합 소송이 제기되었다.`,
  players:`피소된 마크 저커버그와 메타 경영진, 소송을 주도한 미국 40여 개 주 검찰총장들, 피해 청소년 가족들.`,
  current:`메타는 막대한 합의금 지급뿐만 아니라 18세 미만 사용자를 위한 추천 시스템을 전면 수정하라는 법원의 명령을 수용해야 할 처지에 놓였다.`,
  outlook:`유럽연합(EU)과 한국 등 주요 국가들도 유사한 법적 규제를 벼르고 있어 숏폼 플랫폼 산업 전반에 막대한 규제 도미노 현상이 예상된다.`,
  sources:[{title:`Meta reaches \$17B settlement over teen harm - BBC`,url:`https://www.bbc.com`},{title:`메타, 23조원 역대급 합의금... 빅테크 규제 신호탄 - SBS`,url:`https://news.sbs.co.kr`}]

  category:`기타 이슈`,

  colorBg:`#e6f4f1`,
  headline:`"글로벌 AI 공급망 핵심 국가 도약"... 이재명 대통령, 샌프란시스코 선언`,
  metrics:[`한국 임금 프리미엄 6%`,`미국은 25%`],
  summary:`이재명 대통령이 미국 샌프란시스코를 방문해 글로벌 AI 공급망에서 대체 불가능한 핵심 국가로 도약하겠다는 내용의 거창한 AI 선언을 발표했다. 이 행사에는 국내 4대 그룹 총수와 오픈AI, 엔비디아 등 글로벌 빅테크 CEO들이 총출동해 한국 정부의 피지컬 AI 육성 비전에 긍정적인 화답을 보냈다. 그러나 화려한 선언 이면에는 극심한 국내 두뇌 유출이라는 차가운 현실적 난관이 자리하고 있다. 현재 국내 AI 인력의 임금 프리미엄은 6%에 불과해 미국의 25%에 비해 현저히 낮아, 뛰어난 우수 인재들이 끊임없이 해외로 빠져나가는 실정이다. 정부가 독자적인 기술 생태계를 구축하려 하지만 핵심 전문 인력의 이탈을 막지 못하면 이 모든 청사진은 공염불에 그칠 수 있다. 파격적인 보상 체계와 연구 환경 개선 등 실효성 있는 인재 탈환 대책이 무엇보다 시급한 시점이다.`,
  keyTerms:[{term:`피지컬 AI`,explanation:`로봇, 센서, 자율주행차처럼 현실 세계에서 물리적으로 움직이고 상호작용하는 기계 장치에 결합된 인공지능 기술.`}],
  history:`챗GPT 이후 소프트웨어 중심의 AI 경쟁에서 밀리자, 한국은 제조업 강점을 살려 하드웨어와 AI를 결합한 새로운 돌파구를 모색해왔다.`,
  players:`AI 국가 전략을 주도하는 한국 정부와 국내 대기업, 기술 협력을 맺는 글로벌 빅테크, 그리고 해외로 이탈하는 국내 연구자들.`,
  current:`대통령의 강력한 산업 육성 의지 표명에도 불구하고 현장에서는 엔지니어 구인난과 외국 거대 기업의 국내 시장 잠식이 동시에 벌어지고 있다.`,
  outlook:`국가 주도의 막대한 AI 관련 예산 투입이 실질적인 핵심 인재 처우 개선과 토종 기술 자립으로 이어질 수 있을지가 선언의 성공 열쇠다.`,
  sources:[{title:`대통령 샌프란시스코서 AI 강국 비전 선포 - 연합뉴스`,url:`https://www.yna.co.kr`},{title:`속빈 강정 우려되는 AI 선언, 인재 유출이 발목 - KBS`,url:`https://news.kbs.co.kr`}]
}]

let current = null;
let currentCat = null;
const CAT_ORDER = ['경제', '정치', '기타 이슈'];

function renderSidebar() {
  const list = document.getElementById('date-list');
  list.innerHTML = '';
  BRIEFS.forEach((b, i) => {
    const el = document.createElement('div');
    el.className = 'date-item' + (i === 0 ? ' active' : '');
    el.dataset.tag = b.tag;
    const parts = b.tag.split('-');
    const short = parts[1] + '/' + parts[2];
    el.innerHTML = b.tag;
    el.addEventListener('click', () => showBrief(b.tag));
    list.appendChild(el);
  });
}

function showBrief(tag) {
  current = tag;
  document.querySelectorAll('.date-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tag === tag);
  });
  const brief = BRIEFS.find(b => b.tag === tag);
  if (!brief) return;

  // 카테고리별 그룹핑
  const grouped = {};
  brief.stories.forEach(s => {
    if (!grouped[s.category]) grouped[s.category] = [];
    grouped[s.category].push(s);
  });
  const availableCats = CAT_ORDER.filter(c => grouped[c] && grouped[c].length);
  if (!availableCats.length) return;

  // 기본 카테고리 결정
  if (!availableCats.includes(currentCat)) currentCat = availableCats[0];

  renderContent(brief, grouped, availableCats);
}

function renderContent(brief, grouped, availableCats) {
  const content = document.getElementById('content');
  let html = `<div class="sticky-top">
    <div class="brief-header">
      <div class="bh-eyebrow">Morning Brief</div>
      <h2>${brief.label}</h2>
    </div>`;

  // 탭
  html += '<div class="cat-tabs">';
  availableCats.forEach(c => {
    const cls = c === currentCat ? 'cat-tab active' : 'cat-tab';
    html += `<button class="${cls}" data-cat="${c}">${c}</button>`;
  });
  html += '</div></div>';

  // 선택된 카테고리 기사들
  const stories = grouped[currentCat] || [];
  stories.forEach((s, idx) => {
    if (idx > 0) html += '<hr class="story-divider">';
    html += `<div class="story">
      <div class="story-top">
        <div class="story-headline">${s.headline}</div>
      </div>`;
    if (s.metrics.length) {
      html += '<div class="metrics">';
      s.metrics.forEach(m => { html += `<div class="metric-chip">${m}</div>`; });
      html += '</div>';
    }
    // 요약문에 핵심 개념 밑줄 (출력은 박스 다음)
    let summaryHtml = s.summary;
    if (s.keyTerms && s.keyTerms.length) {
      s.keyTerms.forEach(kt => {
        if (!kt.term) return;
        const safe = kt.term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp(safe, 'g');
        summaryHtml = summaryHtml.replace(re, `<span class="kt-underline">${kt.term}</span>`);
      });
    }

    // 핵심 개념 박스 (요약 위)
    if (s.keyTerms && s.keyTerms.length) {
      html += '<div class="key-terms"><div class="key-terms-title">핵심 개념</div>';
      s.keyTerms.forEach(kt => {
        html += `<div class="kt-item">
          <span class="kt-term">${kt.term}</span>
          <span class="kt-exp">${kt.explanation}</span>
        </div>`;
      });
      html += '</div>';
    }

    html += `<div class="summary">${summaryHtml}</div>`;

    const bgSections = [
      ['역사적 맥락', s.history],
      ['핵심 플레이어', s.players],
      ['현재 구도', s.current],
      ['향후 전망', s.outlook],
    ].filter(([, v]) => v);

    if (bgSections.length) {
      html += '<div class="bg-box"><div class="bg-box-title">배경 스토리</div>';
      bgSections.forEach(([label, text]) => {
        html += `<div class="bg-section">
          <div class="bg-section-label">${label}</div>
          <div class="bg-section-text">${text}</div>
        </div>`;
      });
      html += '</div>';
    }

    if (s.sources.length) {
      html += `<button class="sources-toggle" data-toggle="srcs-${idx}">출처 ${s.sources.length}개 보기 <span class="arrow">▾</span></button>`;
      html += `<div class="sources-body" id="srcs-${idx}">`;
      s.sources.forEach((src, si) => {
        html += `<div class="source-item">
          <span class="src-num">${si+1}</span>
          <a href="${src.url}" target="_blank">${src.title}</a>
        </div>`;
      });
      html += '</div>';
    }
    html += '</div>';
  });

  content.innerHTML = html;

  // 탭 클릭 핸들러
  content.querySelectorAll('.cat-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentCat = btn.dataset.cat;
      renderContent(brief, grouped, availableCats);
    });
  });

  // 출처 토글
  content.querySelectorAll('.sources-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const body = document.getElementById(btn.dataset.toggle);
      const isOpen = body.classList.toggle('open');
      btn.classList.toggle('open', isOpen);
    });
  });

  document.getElementById('main').scrollTop = 0;
}

if (BRIEFS.length > 0) {
  renderSidebar();
  showBrief(BRIEFS[0].tag);
} else {
  document.getElementById('content').innerHTML = '<div class="empty">브리핑 데이터가 없습니다.</div>';
}

// ── Quiz Gate ──
const PASS_TARGET = 3;
let correctCount = 0;
const usedIndexes = new Set();

function pickQuestion() {
  // 사용 안 한 문제 중 랜덤. 다 썼으면 풀 리셋
  if (usedIndexes.size >= QUIZ.length) usedIndexes.clear();
  let idx;
  do { idx = Math.floor(Math.random() * QUIZ.length); } while (usedIndexes.has(idx));
  usedIndexes.add(idx);
  return QUIZ[idx];
}

function updateCounter() {
  document.getElementById('quiz-counter').textContent = `(${correctCount}/${PASS_TARGET})`;
}

function renderQuiz() {
  const q = pickQuestion();
  document.getElementById('quiz-q').textContent = q.q;
  updateCounter();
  const feedback = document.getElementById('quiz-feedback');
  feedback.textContent = '';
  feedback.className = 'quiz-feedback';
  const closeBtn = document.getElementById('quiz-close');
  closeBtn.classList.add('hidden');

  const choicesEl = document.getElementById('quiz-choices');
  choicesEl.innerHTML = '';
  // 보기 순서 섞기 (정답 위치 고정 방지)
  const order = q.a.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  order.forEach(idx => {
    const text = q.a[idx];
    const btn = document.createElement('button');
    btn.className = 'quiz-choice';
    btn.textContent = text;
    btn.addEventListener('click', () => {
      const allBtns = choicesEl.querySelectorAll('.quiz-choice');
      allBtns.forEach(b => b.disabled = true);
      if (idx === q.correct) {
        btn.classList.add('correct');
        correctCount++;
        updateCounter();
        if (correctCount >= PASS_TARGET) {
          feedback.textContent = '통과! 들어와도 좋아.';
          feedback.className = 'quiz-feedback right';
          closeBtn.classList.remove('hidden');
        } else {
          feedback.textContent = '역시 맞출 줄 알았어. 다음 문제 고.';
          feedback.className = 'quiz-feedback right';
          btn.blur();
          setTimeout(() => {
            if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
            renderQuiz();
          }, 900);
        }
      } else {
        btn.classList.add('wrong');
        feedback.textContent = '정말 실망이다.... 다음.';
        feedback.className = 'quiz-feedback wrong';
        btn.blur();
        setTimeout(() => {
          if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
          renderQuiz();
        }, 900);
      }
    });
    choicesEl.appendChild(btn);
  });
}

document.getElementById('quiz-close').addEventListener('click', () => {
  document.getElementById('quiz-overlay').classList.add('hidden');
  document.body.classList.remove('quiz-active');
});

document.body.classList.add('quiz-active');
renderQuiz();

// ── Mobile sidebar toggle ──
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('sidebar-backdrop');
function toggleSidebar(open) {
  sidebar.classList.toggle('open', open);
  backdrop.classList.toggle('open', open);
}
document.getElementById('sidebar-toggle').addEventListener('click', () => toggleSidebar(!sidebar.classList.contains('open')));
backdrop.addEventListener('click', () => toggleSidebar(false));
// 날짜 클릭하면 모바일에서 자동으로 닫히게
sidebar.addEventListener('click', e => {
  if (e.target.classList.contains('date-item') && window.innerWidth <= 768) {
    toggleSidebar(false);
  }
});

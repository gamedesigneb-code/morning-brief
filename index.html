<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모닝 브리핑</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --sidebar-w: 240px;
    --bg: #FAFAF7;
    --paper: #FFFFFF;
    --accent: #6B7A8F;
    --accent-soft: #E8ECEF;
    --line: #EAE8E3;
    --line-strong: #D8D5CE;
    --text: #2D2A26;
    --text-mid: #6B655D;
    --text-sub: #A09889;
    --radius: 10px;
  }
  html, body {
    height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 15px; line-height: 1.65; font-weight: 400;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }

  /* ── Layout ── */
  #app { display: flex; height: 100vh; overflow: hidden; }

  /* ── Sidebar ── */
  #sidebar {
    width: var(--sidebar-w); flex-shrink: 0;
    background: var(--bg); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #sidebar-header {
    padding: 36px 20px 24px;
    border-bottom: 1px solid var(--line);
    text-align: center;
  }
  #sidebar-header h1 {
    font-size: 19px; font-weight: 700; color: var(--text);
    letter-spacing: -0.4px; line-height: 1.3;
  }
  #sidebar-header p {
    font-size: 12px; color: var(--text-sub); margin-top: 6px;
    letter-spacing: 0.3px;
  }
  #date-list { overflow-y: auto; flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
  .date-item {
    padding: 11px 14px; cursor: pointer; border-radius: 8px;
    transition: background 0.15s, color 0.15s;
    background: transparent;
    text-align: center; font-size: 13px; font-weight: 500; color: var(--text-mid);
    letter-spacing: 0.1px;
  }
  .date-item:hover { background: var(--accent-soft); color: var(--text); }
  .date-item.active {
    background: var(--accent-soft); color: var(--text); font-weight: 600;
  }

  /* ── Main ── */
  #main { flex: 1; overflow-y: auto; background: var(--paper); }
  #content { max-width: 760px; margin: 0 auto; padding: 56px 40px 80px; }

  .brief-header { margin-bottom: 36px; }
  .brief-header .bh-eyebrow {
    font-size: 11px; color: var(--text-sub); margin-bottom: 8px;
    letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500;
  }
  .brief-header h2 {
    font-size: 30px; font-weight: 700; letter-spacing: -0.7px;
    color: var(--text); line-height: 1.25;
  }

  /* ── Sticky Top (header + tabs) ── */
  .sticky-top {
    position: sticky; top: 0;
    background: var(--paper); z-index: 20;
    padding-top: 56px; margin-top: -56px;
  }
  .sticky-top .brief-header { margin-bottom: 24px; }

  /* ── Category Tabs ── */
  .cat-tabs {
    display: flex; gap: 0; margin-bottom: 36px;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
  }
  .cat-tab {
    padding: 12px 20px 14px; cursor: pointer; font-size: 14px; font-weight: 500;
    color: var(--text-sub); border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    background: none; border-top: none; border-left: none; border-right: none;
    font-family: inherit; letter-spacing: -0.1px;
    margin-bottom: -1px;
  }
  .cat-tab:hover { color: var(--text-mid); }
  .cat-tab.active { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }

  /* ── Sources (collapsible) ── */
  .sources-toggle {
    background: transparent; border: 1px solid var(--line-strong);
    padding: 8px 14px; border-radius: 6px; font-size: 12.5px; font-weight: 500;
    color: var(--text-mid); cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    font-family: inherit; margin-top: 12px;
    transition: background 0.15s, border-color 0.15s;
  }
  .sources-toggle:hover { background: var(--accent-soft); border-color: var(--accent); }
  .sources-toggle .arrow { transition: transform 0.2s; font-size: 9px; color: var(--text-sub); }
  .sources-toggle.open .arrow { transform: rotate(180deg); }
  .sources-body { display: none; margin-top: 12px; padding-left: 4px; }
  .sources-body.open { display: block; }

  /* ── Story Card ── */
  .story { margin-bottom: 40px; }
  .story-top { margin-bottom: 18px; }
  .story-headline {
    font-size: 19px; font-weight: 700; line-height: 1.45;
    letter-spacing: -0.4px; color: var(--text);
  }

  .metrics { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .metric-chip {
    background: var(--accent-soft); border: none;
    border-radius: 6px; padding: 7px 12px;
    font-size: 12.5px; font-weight: 500; color: var(--text-mid);
    line-height: 1.4;
  }

  .summary {
    font-size: 15px; line-height: 1.8; color: var(--text); margin-bottom: 20px;
    letter-spacing: -0.1px;
  }
  .summary .kt-underline {
    color: #1996BD;
    text-decoration: underline;
    text-decoration-color: #1996BD;
    text-decoration-thickness: 1.5px;
    text-underline-offset: 3px;
    cursor: help;
  }

  /* ── Key Terms Box ── */
  .key-terms {
    background: #F4F1EA; border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius); padding: 18px 22px; margin-bottom: 14px;
  }
  .key-terms-title {
    font-size: 11px; font-weight: 600; color: var(--text-sub);
    text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 14px;
  }
  .kt-item { margin-bottom: 12px; }
  .kt-item:last-child { margin-bottom: 0; }
  .kt-term {
    font-size: 13.5px; font-weight: 700; color: #1996BD;
    margin-bottom: 4px; display: block;
    letter-spacing: -0.1px;
  }
  .kt-exp {
    font-size: 13.5px; line-height: 1.7; color: var(--text-mid);
  }

  /* ── Background ── */
  .bg-box {
    background: var(--bg); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 22px 24px; margin-bottom: 14px;
  }
  .bg-box-title {
    font-size: 11px; font-weight: 600; color: var(--text-sub);
    text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 16px;
  }
  .bg-section { margin-bottom: 16px; }
  .bg-section:last-child { margin-bottom: 0; }
  .bg-section-label {
    font-size: 12.5px; font-weight: 600; color: var(--text); margin-bottom: 6px;
    letter-spacing: -0.1px;
  }
  .bg-section-text { font-size: 14px; line-height: 1.75; color: var(--text-mid); }

  /* ── Sources ── */
  .source-item {
    display: flex; align-items: flex-start; gap: 10px;
    margin-bottom: 8px; font-size: 13px;
  }
  .src-num {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent-soft); color: var(--text-mid);
    font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .source-item a { color: var(--text-mid); text-decoration: none; line-height: 1.55; }
  .source-item a:hover { color: var(--text); text-decoration: underline; }

  .story-divider { border: none; border-top: 1px solid var(--line); margin: 36px 0; }

  .empty { color: var(--text-sub); font-size: 14px; padding: 60px 0; text-align: center; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }

  /* ── Mobile Toggle ── */
  #sidebar-toggle {
    display: none;
    position: fixed; top: 14px; left: 14px; z-index: 50;
    background: var(--paper); border: 1px solid var(--line-strong);
    width: 40px; height: 40px; border-radius: 10px;
    cursor: pointer; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(45, 42, 38, 0.08);
  }
  #sidebar-toggle span {
    display: block; width: 18px; height: 2px; background: var(--text);
    position: relative;
  }
  #sidebar-toggle span::before,
  #sidebar-toggle span::after {
    content: ''; position: absolute; left: 0; width: 18px; height: 2px; background: var(--text);
  }
  #sidebar-toggle span::before { top: -6px; }
  #sidebar-toggle span::after { top: 6px; }

  #sidebar-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(45, 42, 38, 0.4); z-index: 40;
  }
  #sidebar-backdrop.open { display: block; }

  /* ── Mobile Responsive ── */
  @media (max-width: 768px) {
    #sidebar-toggle { display: flex; }
    #sidebar {
      position: fixed; left: 0; top: 0; bottom: 0;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      z-index: 45; width: 260px;
      box-shadow: 0 0 24px rgba(45, 42, 38, 0.12);
    }
    #sidebar.open { transform: translateX(0); }

    #content { padding: 64px 20px 60px; max-width: 100%; }
    .brief-header h2 { font-size: 22px; }
    .story-headline { font-size: 16px; }
    .summary { font-size: 14.5px; line-height: 1.75; }
    .bg-section-text { font-size: 13.5px; }
    .metric-chip { font-size: 12px; padding: 6px 10px; }
    .bg-box { padding: 18px 18px; }
    .cat-tab { padding: 11px 14px; font-size: 13.5px; }

    .quiz-card { padding: 28px 24px 24px; }
    .quiz-q { font-size: 17px; }
    .quiz-choice { font-size: 14px; padding: 13px 16px; }
  }

  /* ── Quiz Overlay ── */
  body.quiz-active #app {
    filter: blur(6px) saturate(0.85);
    pointer-events: none;
    transition: filter 0.3s ease;
  }
  #quiz-overlay {
    position: fixed; inset: 0;
    background-color: rgba(250, 250, 247, 0.55);
    background-image:
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0) 0,
        rgba(255,255,255,0) 5px,
        rgba(45,42,38,0.04) 5px,
        rgba(45,42,38,0.04) 6px
      ),
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0) 0,
        rgba(255,255,255,0) 22px,
        rgba(45,42,38,0.025) 22px,
        rgba(45,42,38,0.025) 23px
      );
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 24px;
  }
  #quiz-overlay.hidden { display: none; }

  .quiz-card {
    background: var(--paper); border-radius: 16px;
    padding: 36px 36px 32px; width: 100%; max-width: 440px;
    box-shadow: 0 16px 48px rgba(45, 42, 38, 0.18);
  }
  .quiz-eyebrow {
    font-size: 11px; color: var(--text-sub); letter-spacing: 1.5px;
    text-transform: uppercase; font-weight: 500; margin-bottom: 12px;
  }
  .quiz-q {
    font-size: 19px; font-weight: 700; color: var(--text);
    line-height: 1.5; letter-spacing: -0.3px; margin-bottom: 24px;
  }
  .quiz-choices { display: flex; flex-direction: column; gap: 8px; }
  .quiz-choice {
    background: var(--paper); border: 1px solid var(--line-strong);
    padding: 14px 18px; border-radius: 10px; font-size: 14.5px; font-weight: 500;
    color: var(--text); cursor: pointer; text-align: left;
    font-family: inherit; transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .quiz-choice:focus { outline: none; }
  .quiz-choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) {
    .quiz-choice:hover { background: var(--accent-soft); border-color: var(--accent); }
  }
  .quiz-choice:active { transform: scale(0.99); }
  .quiz-choice.wrong {
    background: #F5E6E0; border-color: #C9947F; color: #8A4A30;
    animation: shake 0.4s ease;
  }
  .quiz-choice.correct {
    background: #E3EDE2; border-color: #7A9077; color: #2E4A2C;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .quiz-feedback {
    margin-top: 20px; text-align: center; font-size: 14px; font-weight: 500;
    color: var(--text-mid); min-height: 22px;
  }
  .quiz-feedback.right { color: #2E4A2C; }
  .quiz-feedback.wrong { color: #8A4A30; }

  .quiz-close-btn {
    margin-top: 18px; width: 100%;
    background: var(--text); color: var(--paper); border: none;
    padding: 13px 20px; border-radius: 10px; font-size: 14px; font-weight: 600;
    font-family: inherit; cursor: pointer;
    transition: background 0.15s;
  }
  .quiz-close-btn:hover { background: #1a1815; }
  .quiz-close-btn.hidden { display: none; }
</style>
</head>
<body>
<div id="quiz-overlay">
  <div class="quiz-card">
    <div class="quiz-eyebrow"><span>잠깐, 나에 대해서 잘 알지?</span> <span id="quiz-counter">(0/3)</span></div>
    <div class="quiz-q" id="quiz-q"></div>
    <div class="quiz-choices" id="quiz-choices"></div>
    <div class="quiz-feedback" id="quiz-feedback"></div>
    <button class="quiz-close-btn hidden" id="quiz-close">닫기</button>
  </div>
</div>

<button id="sidebar-toggle" aria-label="메뉴"><span></span></button>
<div id="sidebar-backdrop"></div>

<div id="app">
  <nav id="sidebar">
    <div id="sidebar-header">
      <h1>모닝 브리핑</h1>
      <p>일별 세계 뉴스 요약</p>
    </div>

    <div id="date-list"></div>
  </nav>
  <main id="main">
    <div id="content"></div>
  </main>
</div>

<script>
const BRIEFS = [{
  tag:`2026-11-13`,
  label:`2026년 11월 13일 (금)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`10월 수출물가지수 43.9% 폭증하며 역대 최고 상승률 기록`,
  metrics:[`수출물량지수 43.9% 상승`,`수입물가지수 1.8% 하락`],
  summary:`10월 수출물량지수가 전년 동월 대비 43.9% 오르며 역대 최고 상승률을 기록했습니다. 이는 메모리 반도체 가격 상승과 AI 데이터센터용 장비 수요가 폭발적으로 증가한 데 따른 결과입니다. 수출금액지수 역시 107.6% 급증하며 우리 경제의 든든한 버팀목 역할을 하고 있습니다. 반면 수입물가지수는 원달러 환율과 국제 유가 하락의 영향으로 1.8% 내리며 안정세를 보였습니다. 이처럼 수출은 늘고 수입 비용은 줄어들면서 국가 간 교역조건 또한 역대급으로 개선된 상황입니다. 다만 최근 환율이 소폭 반등하는 추세라 향후 물가에 미칠 변수들은 주의 깊게 지켜봐야 합니다.`,
  keyTerms:[{term:`교역조건`,explanation:`수출품 한 단위를 팔아 수입할 수 있는 상품의 양을 뜻하며, 이 지표가 개선되면 국가의 실질적인 무역 이익이 커진다는 의미입니다.`}],
  history:`최근 수개월간 수출은 주춤했으나, 글로벌 AI 투자 붐으로 반도체와 장비 수요가 급증하기 시작했습니다.`,
  players:`삼성전자, SK하이닉스 등 반도체 기업과 주요 장비 수출 기업들이 이번 실적을 견인하고 있습니다.`,
  current:`역대급 수출 실적과 수입 물가 하락이 맞물리며 무역수지가 크게 개선되는 전환점을 맞이했습니다.`,
  outlook:`향후 글로벌 경기 둔화 우려와 환율 변동성이 상존하여, 이런 호조세가 연말까지 이어질지 주목됩니다.`,
  sources:[{title:`반도체·AI 장비 견인 수출물량 폭증 - 서울경제`,url:`https://www.sedaily.com`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 물가 지표 예상치 상회로 12월 연준 빅스텝 인상론 급부상`,
  metrics:[`미국채 10년물 장중 5% 터치`,`달러 인덱스 1년 7개월 만에 최고치`],
  summary:`10월 미국 소비자물가지수(CPI)가 시장 예상치를 웃돌면서 통화 긴축 경계감이 다시 커지고 있습니다. 물가가 쉽게 잡히지 않자 연준 위원들의 매파적 발언이 잇따르고 있으며, 시장에서는 12월 기준금리를 한 번에 크게 올리는 빅스텝 가능성까지 거론되는 중입니다. 이러한 금리 인상 관측이 퍼지면서 미국채 10년물 금리는 장중 5%를 터치했고, 달러 인덱스는 1년 7개월 만에 최고치로 치솟았습니다. 달러화의 초강세로 인해 엔화는 160엔 턱밑까지 떨어졌고 유로화 역시 약세를 면치 못하고 있습니다. 글로벌 자금 흐름이 급변하는 가운데, 전 세계 중앙은행들의 셈법도 복잡해지고 있습니다.`,
  keyTerms:[{term:`빅스텝`,explanation:`중앙은행이 기준금리를 통상적인 0.25%포인트가 아닌 0.50%포인트 단위로 대폭 인상하는 조치를 말합니다.`}],
  history:`미 연준은 인플레이션을 잡기 위해 고금리 기조를 유지해왔으나, 최근 인플레 둔화 기대로 금리 인하 기대감이 퍼져 있었습니다.`,
  players:`미국 연방준비제도와 제롬 파월 의장, 그리고 환율 방어에 나선 각국 중앙은행들이 주요 행위자입니다.`,
  current:`예상보다 높은 CPI 수치가 찬물을 끼얹으며, 단기적으로 글로벌 유동성이 미국으로 강하게 빨려 들어가는 현상이 나타나고 있습니다.`,
  outlook:`12월 FOMC 회의 결과와 후속 고용 지표에 따라 내년 글로벌 금리 향방이 결정될 것입니다.`,
  sources:[{title:`달러 초강세 및 연준 금리 인상론 - 중앙일보`,url:`https://www.joongang.co.kr`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`AI 스타트업 앤트로픽 1000억 달러 규모 기업공개 추진`,
  metrics:[`목표 가치 1000억 달러`,`빅테크 및 주요 증시 변동성 지속`],
  summary:`오픈AI의 강력한 라이벌로 꼽히는 AI 스타트업 앤트로픽이 역대 최대 규모인 약 1000억 달러 목표의 기업공개 절차에 돌입했습니다. 월가에서는 이번 상장이 AI 산업의 다음 성장 단계를 보여주는 핵심 이벤트가 될 것으로 기대하며 큰 관심을 보이고 있습니다. 반면 기존 시장을 주도하던 엔비디아와 테슬라 등 대형 기술주들은 최근 규제 우려와 정치적 변수 탓에 단기 급락하며 변동성을 키우고 있습니다. 국채금리의 급등락과 맞물려 글로벌 증시는 대장주들의 엇갈린 행보 속에서 크게 요동치고 있습니다. 앞으로의 기술주 흐름은 기업공개 성공 여부와 개별 기업의 실적 방어력에 달렸습니다.`,
  keyTerms:[{term:`기업공개`,explanation:`비상장 기업이 외부 투자자들에게 처음으로 주식을 팔고 재무 내용을 공개하여 증권시장에 상장하는 과정을 말합니다.`}],
  history:`최근 1~2년간 생성형 AI 열풍으로 관련 스타트업들의 몸값이 천정부지로 치솟았으며, 앤트로픽은 핵심 기술력으로 두각을 나타냈습니다.`,
  players:`앤트로픽과 이를 주관하는 대형 투자은행들, 그리고 경쟁사인 오픈AI, 구글 등이 주요 행위자입니다.`,
  current:`빅테크 주도주가 흔들리는 상황에서 초대어급 상장 소식이 시장의 자금을 새롭게 끌어모으고 있습니다.`,
  outlook:`실제 상장 시점의 시장 유동성과 규제 환경이 최종 상장 가치를 결정지을 핵심 변수입니다.`,
  sources:[{title:`앤트로픽 IPO 추진과 빅테크 변동성 - 중앙일보`,url:`https://www.joongang.co.kr`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`국회 내년도 예산안 및 핵심 쟁점 법안 심사 본격화`,
  metrics:[`정부 예산안 약 650조 원 규모`,`상임위 주요 법안 심사 개시`],
  summary:`외교통일위원회를 비롯한 국회 각 상임위원회가 내년도 정부 예산안과 주요 쟁점 법안에 대한 본격적인 심사에 돌입했습니다. 여야는 약 650조 원 규모로 편성된 예산안의 세부 내역을 두고 삭감과 증액을 요구하며 팽팽한 기싸움을 벌이고 있습니다. 특히 청해부대 작전영역 확대를 위한 파병 연장 동의안과 특검법을 둘러싸고 진보 진영과 야당의 강한 반발이 이어지는 상황입니다. 민생 경제 안정을 위한 법안 처리도 시급하지만, 주요 정치적 사안들이 얽혀 있어 상임위 통과가 쉽지 않아 보입니다. 연말 정기국회 시한을 앞두고 극적인 예산안 합의에 이를 수 있을지가 가장 큰 관건입니다.`,
  keyTerms:[{term:`예산안`,explanation:`정부가 한 해 동안 거둬들일 수입과 사용할 지출의 규모 및 내역을 미리 계획하여 국회에 제출하는 문서입니다.`}],
  history:`해마다 정기국회 막바지에는 정부 여당의 원안 고수와 야당의 삭감 요구가 맞붙으며 험난한 심사 과정을 거칩니다.`,
  players:`정부, 여당(국민의힘), 야당(더불어민주당 등) 간의 상임위 위원들이 치열한 협상을 주도하고 있습니다.`,
  current:`특검법 등 민감한 정치 이슈가 연계될 가능성이 커 심사 지연 우려가 높아진 상태입니다.`,
  outlook:`법정 처리 시한 내 타결을 위한 여야 원내대표 간 막판 협상에 이목이 쏠리고 있습니다.`,
  sources:[{title:`국회 예산안 및 파병 동의안 공방 - 문화일보`,url:`https://www.munhwa.com`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 의회 재편으로 한미 전시작전통제권 및 원잠 도입 논의 촉각`,
  metrics:[`미국 새 의회 출범 영향`,`한미 주요 안보 현안 점검`],
  summary:`최근 미국 선거 결과로 인한 의회 구도 변화가 한미 간 핵심 안보 현안에 직접적인 영향을 미칠 것으로 관측됩니다. 우리 정부는 전시작전통제권 전환과 원자력 추진 잠수함 도입 등 장기 과제들에 대해 미국 새 의회가 어떤 태도를 취할지 면밀히 분석 중입니다. 특히 미국 내 자국 우선주의 기조가 강해질 경우 방위비 분담금이나 전략자산 전개 비용 측면에서 압박이 거세질 수 있습니다. 이에 대응해 정부는 외교 채널을 총동원하여 양국 동맹의 굳건함을 재확인하고 정책 연속성을 확보하려 노력하고 있습니다. 이 문제는 향후 동북아시아 지역의 힘의 균형을 좌우할 매우 중대한 사안입니다.`,
  keyTerms:[{term:`전시작전통제권`,explanation:`한반도에 전쟁이 일어났을 때 군대의 작전을 지휘하고 통제할 수 있는 핵심적인 권한을 의미합니다.`}],
  history:`한미 양국은 조건에 기초한 전환을 추진해 왔으나, 북핵 위협 고도화 등으로 시기가 늦춰져 왔습니다.`,
  players:`한국 국방부 및 외교부, 미국 국방부와 새롭게 재편된 미 의회의 주요 안보 위원회 위원들입니다.`,
  current:`미국 정계의 권력 변화로 인해 기존 합의된 안보 로드맵에 대한 수정 요구 가능성이 커진 변곡점입니다.`,
  outlook:`양국 국방장관 회담 등 고위급 소통을 통해 도입 의제의 협상 방향이 구체화될 것입니다.`,
  sources:[{title:`미국 정세 변화와 한미 안보 현안 - 경기일보`,url:`https://www.kyeonggi.com`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`다자 정상회의 연쇄 개최 앞두고 글로벌 공급망 및 안보 사전 조율`,
  metrics:[`APEC 및 G20 2개 회의 연속 개최`,`주요 20여 개국 사전 접촉 진행`],
  summary:`전 세계 주요국 정상들이 한자리에 모이는 APEC과 G20 등 대규모 다자 정상회의를 앞두고 각국의 사전 외교전이 뜨겁습니다. 우리 정부는 주요국 외교장관들과 양자 회담을 진행하며 핵심 의제인 글로벌 공급망 안정화와 지역 안보 문제를 긴밀히 조율하고 있습니다. 미중 갈등과 지역 전쟁이 겹친 복잡한 국제 정세 속에서 이번 다자 정상회의는 새로운 협력 질서를 구축할 중요한 무대가 될 전망입니다. 특히 반도체와 핵심 광물 분야의 공급망 리스크를 줄이기 위해 다자간 연대를 이끌어내는 것이 우리의 최우선 목표입니다. 각국의 이해관계가 엇갈리는 만큼, 실질적인 공동 선언문을 도출하기 위한 치열한 물밑 작업이 계속되고 있습니다.`,
  keyTerms:[{term:`다자 정상회의`,explanation:`세 개 이상의 여러 국가의 정상들이 모여 글로벌 경제, 안보 등 공통의 관심사를 논의하고 해결책을 모색하는 회의체입니다.`}],
  history:`최근 몇 년간 지정학적 위기와 자국 보호주의로 인해 다자간 협력 체제가 큰 시험대에 올라 있었습니다.`,
  players:`한국, 미국, 중국을 포함한 G20 회원국 정상들과 이를 보좌하는 각국 외교 수장들이 핵심 플레이어입니다.`,
  current:`공급망 단절의 위기감이 최고조에 달한 현시점에서 동맹국뿐 아니라 중립국들과의 협력이 절실해진 상황입니다.`,
  outlook:`정상회의 직후 발표될 공동 선언문에 어떤 구체적인 경제 협력 조항이 담길지에 따라 향후 무역 환경이 크게 달라질 것입니다.`,
  sources:[{title:`다자 정상회의 사전 조율 및 공급망 논의 - 중앙일보`,url:`https://www.joongang.co.kr`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`스페이스X, 초대형 로켓 스타십 1단 2단 동시 기계 팔 포획 재사용 도전`,
  metrics:[`15번째 시험 비행 진행`,`2단 우주선 동시 포획 시도`],
  summary:`민간 우주기업 스페이스X가 인류 우주 탐사의 판도를 바꿀 초대형 로켓 스타십의 15번째 시험 비행을 진행하며 새로운 이정표에 도전합니다. 이번 비행의 핵심 목표는 1단 추진체인 슈퍼헤비뿐만 아니라 2단 우주선 본체까지 모두 발사장으로 되돌려 젓가락 모양의 기계 팔로 포획하는 것입니다. 이 기술이 성공하면 로켓의 완전 재사용 시대가 열리며 우주 수송 비용을 획기적으로 낮출 수 있습니다. 앞선 궤도 비행 성공에 이어 이번 포획까지 이뤄진다면, 향후 달과 화성 탐사를 위한 일정이 급물살을 타게 될 전망입니다. 우주 산업의 상업화를 앞당길 이번 실험 결과에 전 세계 과학계와 투자자들의 시선이 집중되고 있습니다.`,
  keyTerms:[{term:`완전 재사용`,explanation:`로켓을 발사한 후 부품을 버리지 않고 다시 회수하여 정비한 뒤 다음 발사에 그대로 다시 사용하는 획기적인 방식입니다.`}],
  history:`로켓은 전통적으로 1회용으로 쓰였으나, 스페이스X가 1단 로켓 재사용을 상용화한 이후 더 큰 목표를 향해 기술을 발전시켜 왔습니다.`,
  players:`일론 머스크가 이끄는 스페이스X와 아르테미스 프로젝트로 이들과 협력 중인 미국 항공우주국입니다.`,
  current:`비용 절감이 우주 개척의 필수 요건이 된 상황에서 로켓 양단 동시 회수 기술은 게임 체인저로 평가받고 있습니다.`,
  outlook:`이번 시험 비행의 성공 여부는 내년에 계획된 본격적인 심우주 탐사 미션의 진행 속도를 결정지을 것입니다.`,
  sources:[{title:`스페이스X 스타십 1·2단 동시 포획 도전 - 조선일보`,url:`https://www.chosun.com`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`AI 발전 환경 감시엔 유용하지만 막대한 데이터센터 전력 소비가 난제`,
  metrics:[`미래 위험 1위로 AI 등극`,`데이터센터 전력 및 용수 소비량 급증`],
  summary:`인공지능이 환경 분야에서 혁신적인 분석 도구로 쓰이는 동시에 엄청난 자원을 소모하는 골칫거리로 전락하는 딜레마를 맞고 있습니다. 산불 조기 감지나 야생동물 모니터링에서는 머신러닝이 수개월의 작업을 단 몇 시간으로 줄여주는 구원투수 역할을 하고 있습니다. 하지만 최신 AI 모델을 구동하기 위해 전 세계적으로 데이터센터가 늘어나면서 막대한 전력 소비량 문제가 발생하고 있습니다. 급기야 한 보고서에서는 지난 7년간 미래 위험 1위였던 기후변화를 밀어내고 AI가 가장 큰 글로벌 위협으로 꼽히기까지 했습니다. 혁신을 이어가면서도 탄소 배출을 억제해야 하는 기술 업계의 심각한 과제가 되었습니다.`,
  keyTerms:[{term:`전력 소비량`,explanation:`어떤 기기나 설비가 일정 시간 동안 작동하기 위해 소모하는 전기의 총량을 뜻하며, 데이터센터 유지의 가장 큰 비용이자 환경 부담 요인입니다.`}],
  history:`최근 생성형 AI의 발전 속도가 예측을 뛰어넘으면서 연산 처리에 필요한 서버 인프라 수요가 폭증했습니다.`,
  players:`구글, 마이크로소프트 등 대규모 AI 인프라를 운영하는 빅테크 기업들과 이를 규제하려는 환경 단체들입니다.`,
  current:`탄소 중립이라는 전 지구적 목표와 AI 기술 패권 경쟁이라는 두 가지 목표가 정면으로 충돌하는 임계점입니다.`,
  outlook:`향후 원자력이나 재생에너지를 직접 연결하는 친환경 데이터센터 구축 여부가 관련 기업들의 생존을 좌우할 것입니다.`,
  sources:[{title:`AI 발전과 환경 보호의 딜레마 - CPBC`,url:`https://www.cpbc.co.kr`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`내년 전국 초등 입학생 수 저출산 여파로 사상 첫 20만 명대 추락 전망`,
  metrics:[`내년 초등 신입생 약 27만 명 예상`,`40만 명 붕괴 불과 3년 만에 급락`],
  summary:`초저출산의 여파로 내년 전국 초등학교 신입생 수가 사상 처음 30만 명 선을 밑돌아 27만 명 안팎까지 떨어질 것으로 전망됩니다. 불과 3년 전에 40만 명 선이 무너졌던 것을 감안하면, 학령인구 감소 속도가 예상을 뛰어넘을 정도로 가파릅니다. 이는 특히 코로나19 팬데믹 첫해였던 2020년 출생아 수가 급감했던 영향이 학교 현장에 직접적으로 닥친 결과입니다. 신입생 급감에 따라 지방을 중심으로 초등학교 통폐합 논의가 불가피해지며 지역 사회의 소멸 위기감도 커지고 있습니다. 교육 인프라 축소와 지역 불균형 문제를 해결하기 위한 국가 차원의 근본적인 대책이 시급합니다.`,
  keyTerms:[{term:`학령인구`,explanation:`유치원부터 대학교까지 정규 교육 과정에 취학할 연령대에 해당하는 아이들의 총수를 뜻하며 교육 정책의 기초 자료가 됩니다.`}],
  history:`한국의 합계출산율은 수년째 세계 최저 수준을 기록 중이며, 그 누적된 결과가 교육 현장에 도달하기 시작했습니다.`,
  players:`입학생 급감에 직면한 교육부와 각 시도 교육청, 그리고 통폐합 위기를 겪는 지역 학부모들입니다.`,
  current:`학교가 사라지면 젊은 층의 지역 이탈이 가속화되는 악순환이 발생하므로 지금이 방어선을 구축할 골든타임입니다.`,
  outlook:`향후 교육 당국의 학교 통폐합 기준 변경 및 농어촌 지역 소규모 학교 지원 예산 확보 여부가 쟁점이 될 전망입니다.`,
  sources:[{title:`내년 초등 입학생 20만명대 추락 - 동아일보`,url:`https://www.donga.com`}]
}]

  tag:`2026-11-12`,
  label:`2026년 11월 12일 (목)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 10월 CPI가 전월 대비 0.4% 상승해 시장 예상치를 웃돌며 연준의 긴축 장기화 우려가 확산되고 있다.`,
  metrics:[`미국 10월 CPI 전월비 0.4% 상승`,`근원 CPI 전월비 0.3% 상승`],
  summary:`미국 노동부가 발표한 10월 소비자물가지수(CPI)가 시장 전망치를 웃도는 0.4% 상승을 기록했다. 에너지와 식품을 제외한 근원 CPI 역시 0.3% 올랐다. 이러한 물가 반등은 인플레이션 압력이 여전히 높다는 것을 시사한다. 이에 따라 연방준비제도(Fed) 인사들의 12월 빅스텝 금리 인상 가능성 발언이 이어지고 있다. 국채 10년물 금리가 급등하고 강달러 현상이 지속되며 시장의 긴축 경계감이 다시 커지는 모습이다.`,
  keyTerms:[{term:`빅스텝`,explanation:`중앙은행이 기준금리를 한 번에 0.5%포인트 인상하는 큰 폭의 금리 인상 조치를 의미한다.`}],
  history:`미국의 인플레이션은 팬데믹 이후 공급망 붕괴와 막대한 재정 지출로 인해 급등했으며, 연준은 이를 통제하기 위해 지속적인 고금리 정책을 펴왔다.`,
  players:`금리 결정을 주도하는 미 연방준비제도와 시장의 반응을 이끄는 월스트리트 투자자들, 그리고 물가에 민감한 미국 소비자들이 핵심 주체다.`,
  current:`최근 금리 인하 기대감이 시장에 선반영되었으나, 이번 10월 물가 지표가 예상보다 높게 나오면서 금리 인하 경로에 제동이 걸린 상황이다.`,
  outlook:`다음 달 12월 FOMC 회의에서 연준이 어떤 금리 결정과 점도표를 내놓을지가 최대 관심사이며, 추가적인 물가 및 고용 지표 발표에 시장이 민감하게 반응할 것이다.`,
  sources:[{title:`미 10월 CPI 쇼크 국채 금리 급등 - FNTIMES`,url:`https://fntimes.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국발 물가 충격에도 불구하고 외국인의 삼성전자와 SK하이닉스 대규모 순매수에 힘입어 국내 증시가 반등했다.`,
  metrics:[`코스닥 장중 매수 사이드카 발동`,`외국인 반도체 대규모 순매수`],
  summary:`미국 10월 CPI 지표 쇼크로 국내 증시도 하락 출발이 예상되었다. 그러나 막상 장이 열리자 외국인 투자자들이 삼성전자와 SK하이닉스 등 주요 반도체 종목을 대규모로 순매수하며 지수를 끌어올렸다. 이로 인해 코스피 지수는 상승 반전하여 장을 마감했고, 코스닥 지수는 장중 매수 사이드카가 발동될 정도로 강한 매수세가 유입되었다. 글로벌 인공지능 수요에 대한 기대감이 금리 인상 우려를 덮은 것으로 분석된다.`,
  keyTerms:[{term:`매수 사이드카`,explanation:`주가지수 선물 가격이 전일 종가 대비 급등할 때 주식시장의 프로그램 매수 호가 효력을 일시적으로 정지시켜 시장의 과열을 막는 제도다.`}],
  history:`국내 증시는 미국 금리와 환율 등 대외 거시경제 변수에 매우 취약한 구조를 가지고 있으며, 특히 반도체 산업 의존도가 높다.`,
  players:`막대한 자금력으로 국내 증시 방향을 결정짓는 외국인 투자자들과 반도체 대장주인 삼성전자, SK하이닉스가 주요 주체다.`,
  current:`글로벌 거시경제의 불확실성 속에서도 인공지능 반도체 사이클에 대한 구조적 성장 기대감이 외국인 투자자들의 매수 심리를 자극하고 있다.`,
  outlook:`앞으로 미국 연준의 실질적인 금리 정책 변화와 글로벌 빅테크 기업들의 인공지능 반도체 수요가 유지될지가 국내 증시 상승세의 지속 여부를 결정할 것이다.`,
  sources:[{title:`외국인 반도체 폭풍 매수, 코스피 상승 견인 - 뉴스핌`,url:`https://newspim.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`중국 최대 쇼핑 축제인 광군제 판매 실적이 부진하게 나타나며 내수 소비 심리 회복이 지연되고 있음이 확인되었다.`,
  metrics:[`광군제 주요 플랫폼 매출 성장률 둔화`,`중국 내수 위축 장기화`],
  summary:`중국 연례 최대 온라인 쇼핑 할인 행사인 광군제의 성적이 예년에 비해 부진한 흐름을 보였다. 주요 이커머스 플랫폼들의 대대적인 할인 공세에도 불구하고 소비자들은 지갑을 쉽게 열지 않았다. 이는 부동산 시장 침체와 고용 불안 등으로 중국 내 내수 소비 심리가 여전히 크게 위축되어 있음을 보여준다. 중국 정부의 다양한 경기 부양책에도 불구하고 실물 경제 회복은 더디게 진행되고 있는 상황이다.`,
  keyTerms:[{term:`광군제`,explanation:`매년 11월 11일 중국에서 열리는 세계 최대 규모의 온라인 쇼핑 할인 축제로, 중국 내수 소비의 척도로 여겨진다.`}],
  history:`광군제는 과거 알리바바가 주도하여 시작된 이후 매년 매출 신기록을 경신하며 중국 경제 성장의 상징처럼 여겨졌으나, 최근 수년간 둔화세를 보이고 있다.`,
  players:`알리바바, 징둥닷컴 등 거대 이커머스 기업들과 제품을 판매하는 글로벌 브랜드들, 그리고 지갑을 닫은 중국 소비자들이 중심에 있다.`,
  current:`지속되는 부동산 리스크와 청년 실업률 상승으로 인해 중국 소비자들의 미래 소득에 대한 불안감이 커지며 저축을 늘리고 소비를 줄이는 추세다.`,
  outlook:`중국 정부가 추가적인 강도 높은 재정 부양책과 소비 진작책을 내놓을지가 관건이며, 다가오는 내년 춘절 등 주요 연휴의 소비 지표가 중요해질 것이다.`,
  sources:[{title:`중국 광군제 소비 둔화 확연 - AP News`,url:`https://apnews.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`국회 여야 조세소위가 내년으로 다가왔던 가상자산 소득세 과세 시행을 2029년까지 2년 추가 유예하기로 잠정 합의했다.`,
  metrics:[`가상자산 과세 2029년으로 2년 유예`,`투자자 세부담 한시적 경감`],
  summary:`당초 내년부터 시행될 예정이었던 가상자산 소득 과세가 다시 한번 미뤄질 전망이다. 국회 기획재정위원회 조세소위에서 여야는 가상자산 과세 시기를 2029년으로 2년 추가 유예하는 방안에 잠정 합의했다. 아직 과세 인프라가 완전히 갖춰지지 않았고, 수많은 청년 투자자들의 반발을 의식한 정치적 판단이 작용한 것으로 보인다. 최종적으로 본회의를 통과하면 가상자산 투자자들은 당분간 세금 부담을 덜게 된다.`,
  keyTerms:[{term:`가상자산 소득 과세`,explanation:`비트코인 등 암호화폐를 거래하여 얻은 수익에 대해 세금을 부과하는 제도로, 과세 시기와 기준을 두고 논란이 지속되어 왔다.`}],
  history:`해당 과세는 당초 2022년 시행 예정이었으나, 시스템 미비와 투자자 보호 명목으로 수차례 연기되어 2027년 시행을 앞두고 있었다.`,
  players:`과세를 추진하는 기획재정부, 표심을 고려하는 여야 국회의원들, 그리고 막대한 세금 부담을 우려하는 가상자산 투자자들이 얽혀 있다.`,
  current:`가상자산 시장이 다시 활기를 띠는 가운데, 과세 유예는 투자자들에게 호재로 작용하며 정치권도 선거를 앞두고 여론을 달래려는 모습이다.`,
  outlook:`조세소위 합의안이 기재위 전체회의와 본회의를 무사히 통과할지 주목되며, 향후 2년간 과세 사각지대를 해소할 구체적인 입법 보완이 요구된다.`,
  sources:[{title:`여야, 가상자산 과세 2년 유예 합의 - 동아일보`,url:`https://donga.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 중간선거 결과 미시시피주에서 민주당 스콧 콜롬 후보가 현역을 꺾고 재건 시대 이후 첫 흑인 상원의원으로 당선되는 이변을 연출했다.`,
  metrics:[`미시시피주 남북전쟁 이후 첫 흑인 상원의원 당선`,`민주당 중간선거 선전 지속`],
  summary:`최근 치러진 미국 중간선거에서 이변이 속출하고 있다. 보수 성향이 짙은 딥사우스 지역인 미시시피주 상원의원 선거에서 민주당의 스콧 콜롬 후보가 현역 공화당 의원을 누르고 승리했다. 이는 남북전쟁 이후의 재건 시대 이래 미시시피주에서 탄생한 최초의 흑인 상원의원이라는 점에서 역사적 의미가 크다. 이번 결과는 민주당이 이번 중간선거에서 예상보다 강한 지지세를 확보하며 딥사우스에서도 약진하고 있음을 보여준다.`,
  keyTerms:[{term:`딥사우스`,explanation:`미국 남부 지역 중에서도 역사적으로 보수 성향과 공화당 지지세가 매우 뚜렷한 주들을 일컫는 정치적 용어다.`}],
  history:`미시시피를 포함한 남부 지역은 전통적으로 백인 보수층의 결집력이 강해 공화당의 굳건한 텃밭으로 여겨져 왔다.`,
  players:`새롭게 상원에 진출한 민주당 당선인과 기존 지역 패권을 쥐고 있던 공화당 세력, 그리고 변화를 주도한 흑인 유권자들이 있다.`,
  current:`낙태권 문제와 경제 불평등 이슈 등이 유권자들을 자극하면서, 전통적인 공화당 지지 지역에서도 젊은 층과 유색인종 유권자들의 투표율이 크게 상승했다.`,
  outlook:`민주당이 의회에서 다수당 지위를 확고히 다지게 되면서, 트럼프 행정부의 각종 정책 추진과 국정 운영에 상당한 제동이 걸릴 것으로 예상된다.`,
  sources:[{title:`Mississippi elects first Black senator since Reconstruction - PBS`,url:`https://pbs.org/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`치솟는 주택 가격과 심각한 주거 위기에 항의하며 스페인 전역에서 14년 만에 수백만 명이 참여하는 대규모 전국 총파업이 일어났다.`,
  metrics:[`스페인 14년 만의 전국 총파업`,`수백만 명 거리 시위 참여`],
  summary:`스페인 전역이 대규모 시위와 총파업으로 마비되었다. 수백만 명의 시민들이 거리로 쏟아져 나와 천정부지로 치솟는 주택 가격과 심각한 주거 위기 해결을 정부에 강력히 촉구했다. 이번 전국 단위의 총파업 사태는 무려 14년 만에 벌어진 일로, 그만큼 스페인 국민들의 경제적 고통과 임대료 부담이 한계치에 달했음을 의미한다. 시위대는 투기 자본 규제와 공공 임대주택 확충 등 근본적인 주거권 보장 정책을 요구하고 있다.`,
  keyTerms:[{term:`총파업`,explanation:`노동자 단체나 대중이 정치적, 경제적 요구를 관철하기 위해 전국적으로 동시에 일손을 놓고 시위를 벌이는 강력한 집단 행동이다.`}],
  history:`스페인을 비롯한 남유럽 국가들은 최근 수년간 단기 임대업 팽창과 외국인 부동산 투기로 인해 현지인들의 주거비용이 비정상적으로 급등하는 부작용을 겪어왔다.`,
  players:`살 곳을 위협받는 스페인 서민 및 청년층 시위대와, 주택 정책 실패에 대한 책임을 묻고 있는 스페인 정부 당국이 주요 대립 주체다.`,
  current:`월급의 절반 이상을 임대료로 내야 하는 극심한 주거 빈곤이 임계점을 넘으면서, 단순한 불만을 넘어 거대한 사회적 운동으로 폭발한 상태다.`,
  outlook:`스페인 정부가 투기 목적의 부동산 매입을 제한하고 강력한 임대료 상한제를 도입할지 여부가 주목되며, 이 사태가 인근 유럽 국가로 번질 가능성도 제기된다.`,
  sources:[{title:`Spain halts over housing crisis as millions strike - The Guardian`,url:`https://theguardian.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`카카오모빌리티의 상장이 계속 지연되자 초기 투자자인 사모펀드 TPG가 투자금 회수를 위해 국제중재를 신청하며 갈등이 표면화되었다.`,
  metrics:[`TPG 카카오 상대 국제중재 신청`,`9년 이어진 투자금 회수 갈등 표출`],
  summary:`카카오모빌리티의 기업공개가 오랫동안 지연되면서 결국 투자자와의 법적 분쟁으로 비화되었다. 글로벌 사모펀드인 TPG가 투자금 회수를 위해 모기업인 카카오를 상대로 국제중재를 신청했다. TPG는 모빌리티의 초기 성장을 이끈 주요 투자자였으나, 약 9년간 상장이 이루어지지 않아 자금 융통에 어려움을 겪어왔다. 이번 사태는 플랫폼 기업들의 무리한 상장 추진과 투자자 간의 복잡한 이해관계가 충돌한 대표적 사례로 업계의 이목을 끌고 있다.`,
  keyTerms:[{term:`국제중재`,explanation:`서로 다른 국가의 기업 간 분쟁이 발생했을 때, 법원 소송 대신 제3의 국제 중재 기관의 판정에 따르기로 합의하여 분쟁을 해결하는 방식이다.`}],
  history:`카카오모빌리티는 한때 높은 기업가치를 인정받았으나, 골목상권 침해 논란과 규제 이슈 등으로 인해 여러 차례 상장 계획이 꺾였다.`,
  players:`투자금을 돌려받으려는 글로벌 사모펀드 TPG와, 모빌리티 자회사의 문제를 방어해야 하는 카카오 그룹 본사가 대립하고 있다.`,
  current:`카카오 창업자의 사법 리스크 등 전사적인 악재 속에서, 주요 자회사의 재무적 갈등까지 더해져 그룹의 경영 불확실성이 극에 달한 상황이다.`,
  outlook:`분쟁의 결과에 따라 카카오가 수천억 원 규모의 막대한 자금을 배상해야 할 수도 있어, 회사의 재무 건전성과 향후 플랫폼 사업 재편에 큰 영향을 미칠 전망이다.`,
  sources:[{title:`카카오모빌리티 투자자 TPG, 국제중재 제기 - Daum 뉴스`,url:`https://daum.net/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`엔비디아의 첨단 인공지능 반도체가 대중국 수출 통제를 우회하여 밀반입된 정황이 드러나며 미국 정계에 큰 파장이 일고 있다.`,
  metrics:[`엔비디아 칩 중국 밀반입 의혹 확산`,`미국 내 상무부 재무부 제재 이견`],
  summary:`글로벌 칩 시장을 주도하는 엔비디아가 큰 논란의 중심에 섰다. 미국의 강력한 대중국 수출 통제에도 불구하고, 첨단 반도체들이 제3국을 거쳐 중국으로 밀반입된 정황이 드러났다. 이를 두고 일각에서는 트럼프 행정부의 수출 허가 완화 과정에 부적절한 관행이 있었는지 의혹을 제기하고 있다. 규제의 강도와 실효성을 두고 부처 간에도 팽팽한 의견 충돌이 벌어지며, 기술 안보를 지키려는 미국 정부의 고민이 깊어지고 있다.`,
  keyTerms:[{term:`수출 통제`,explanation:`국가 안보나 외교적 목적을 위해 특정 첨단 기술이나 전략 물자가 적성국이나 경쟁국으로 수출되는 것을 법으로 강력히 금지하는 조치다.`}],
  history:`미국은 중국의 군사적, 기술적 패권 도전을 억제하기 위해 핵심 첨단 기술의 중국 유입을 엄격하게 제한하는 조치를 꾸준히 강화해왔다.`,
  players:`자사 제품의 판매를 극대화하려는 엔비디아와, 이를 차단하려는 미국 정부 규제 당국, 그리고 어떻게든 칩을 확보하려는 중국 기업들이 얽혀 있다.`,
  current:`기술 패권 경쟁이 치열해지면서 규제를 피하기 위한 우회 네트워크가 정교해졌고, 미국 정부 내부에서도 안보와 자국 기업의 이익 보호 사이에서 혼선이 발생 중이다.`,
  outlook:`미국 의회가 이번 규제 우회 묵인 여부에 대해 전면적인 조사나 청문회를 실시할 가능성이 높으며, 이는 글로벌 반도체 공급망에 큰 파장을 부를 수 있다.`,
  sources:[{title:`엔비디아 스캔들 대중 반도체 규제 파장 - iMBC`,url:`https://imbc.com/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`일본 다카이치 총리가 최첨단 인공지능 기술이 초래할 사이버 안보 위협을 경고하며 국제사회의 공동 대응을 강력히 촉구했다.`,
  metrics:[`일본 총리 통일된 안전 기준 마련 촉구`,`일본 내 글로벌 회담 조기 추진`],
  summary:`인공지능 기술의 급발전이 국가 안보의 새로운 화두로 떠올랐다. 다카이치 일본 총리는 국제 화상 회의에 참석해, 통제되지 않은 최첨단 기술이 사이버 안보 체계를 위협하고 가짜뉴스 확산 등 심각한 문제를 야기할 수 있다고 경고했다. 다카이치 총리는 각국이 개별적으로 대응할 것이 아니라 글로벌 차원의 통일된 규범과 안전 기준을 신속히 마련해야 한다고 역설했다. 아울러 일본 내에서 정상회담을 조기에 개최하여 규칙 제정의 주도권을 쥐겠다는 의지도 확인했다.`,
  keyTerms:[{term:`사이버 안보`,explanation:`디지털 네트워크와 컴퓨터 시스템을 통해 이루어지는 악의적인 공격이나 해킹으로부터 국가와 사회 인프라를 안전하게 보호하는 개념이다.`}],
  history:`딥페이크 기술과 고도화된 해킹 툴을 결합한 디지털 범죄가 선거 개입이나 사회 혼란을 야기하는 사례가 전 세계적으로 급증하며 강력한 규제 필요성이 대두되었다.`,
  players:`규제 논의를 주도하려는 일본 정부를 비롯해, 기술 혁신의 최전선에 있는 미국과 유럽연합 등 주요 선진국들이 글로벌 규칙 제정에 앞장서고 있다.`,
  current:`기술 혁신을 저해하지 않으면서도 악용을 막을 수 있는 거버넌스의 기준을 두고 국가 간 치열한 주도권 경쟁과 이견 조율이 진행 중인 시점이다.`,
  outlook:`일본이 제안한 국제 회담의 구체적인 일정과 논의 의제가 곧 윤곽을 드러낼 것이며, 향후 구속력 있는 조약이 체결될 수 있을지 귀추가 주목된다.`,
  sources:[{title:`日 총리, AI 사이버 위협에 공동 대응 촉구 - 뉴시스`,url:`https://newsis.com/`}]
}]

  tag:`2026-11-11`,
  label:`2026년 11월 11일 (수)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 증시 주요 3대 지수가 반도체 및 빅테크 저가 매수세에 힘입어 2%대 급등으로 마감했습니다.`,
  metrics:[`나스닥 지수 2.74% 상승`,`다우 지수 2.15% 상승`],
  summary:`최근 엔비디아를 둘러싼 개별 악재에도 불구하고 미국 증시가 강하게 반등했습니다. 투자자들이 최근의 주가 하락을 기회로 삼으면서 반도체와 빅테크 기업을 중심으로 강한 저가 매수세가 유입된 것이 주요 원인입니다. 특히 AMD 등의 반도체 관련주가 시장의 상승을 주도하며 3대 지수 모두 2%대의 높은 상승률을 기록했습니다. 시장의 시선은 이제 10월 미국 소비자물가지수 발표에 쏠려 있습니다. 인플레이션 둔화 여부가 향후 연방준비제도의 금리 정책에 결정적 영향을 미치기 때문입니다. 투자자들은 지표 결과에 따라 시장의 방향성이 다시 한번 크게 움직일 것으로 예상하고 있습니다.`,
  keyTerms:[{term:`저가 매수세`,explanation:`주가가 일시적으로 하락했을 때, 싼 가격에 주식을 사들이려는 시장의 수요를 의미합니다.`}],
  history:`글로벌 공급망 불안과 금리 인상 사이클 속에서 미국 증시는 올해 큰 변동성을 겪어왔습니다. 특히 기술주들은 실적과 금리 전망에 따라 급등락을 반복해왔습니다.`,
  players:`기술주 반등을 이끄는 주요 세력은 기관 투자자들과 글로벌 헤지펀드들입니다. 개별 종목으로는 엔비디아, AMD 등 AI 반도체 핵심 기업들이 시장의 방향성을 쥐고 있습니다.`,
  current:`이번 급등은 금리 인하 기대감과 맞물려 투자 심리가 단기적으로 회복되었음을 보여줍니다. 하지만 물가 지표라는 거대한 불확실성이 여전히 시장을 짓누르고 있습니다.`,
  outlook:`다가오는 10월 소비자물가지수(CPI) 결과가 단기 향방을 가를 것입니다. 지표가 안정적이라면 산타 랠리에 대한 기대감이 커질 수 있습니다.`,
  sources:[{title:`미 증시, 물가지표 앞두고 일제히 급등 - 경제신문`,url:`https://example.com/news/economy/1`},{title:`반도체주 반등 이끈 저가 매수세의 실체 - 파이낸셜투데이`,url:`https://example.com/news/economy/2`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`2026년 미국 원유 생산량이 하루 1,390만 배럴로 4년 연속 사상 최고치를 경신할 것으로 전망됩니다.`,
  metrics:[`미 원유 생산량 하루 1,390만 배럴`,`미 원유 재고 4억 1,000만 배럴`],
  summary:`미국 에너지정보청은 2026년 미국의 원유 생산량이 4년 연속 사상 최고치를 경신할 것으로 예측했습니다. 중동 지역의 군사 충돌 완화 조짐과 함께 지정학적 위험 프리미엄이 줄어들면서 국제 유가의 하향 안정화가 기대되고 있습니다. 브렌트유는 올해 배럴당 약 97달러를 유지한 후 내년에는 80달러 중반까지 떨어질 전망입니다. 하지만 안심하기에는 이릅니다. 현재 미국 내 원유 재고가 12년 만에 최저치인 4억 1,000만 배럴 수준으로 떨어졌기 때문입니다. 공급은 늘어나지만 재고가 부족한 상황이 맞물려 단기적으로 유가 변동성이 커질 수 있다는 분석이 나옵니다.`,
  keyTerms:[{term:`위험 프리미엄`,explanation:`전쟁이나 지정학적 위기 등 불확실성으로 인해 자산 가격에 추가로 반영되는 가치나 가격 상승분을 말합니다.`}],
  history:`코로나19 팬데믹 이후 글로벌 에너지 시장은 산유국들의 감산과 중동의 분쟁으로 가격 변동이 심했습니다. 미국은 에너지 자립을 위해 꾸준히 셰일 오일 생산량을 늘려왔습니다.`,
  players:`주요 행위자는 증산을 주도하는 미국 셰일 업계와 가격 방어를 노리는 석유수출국기구(OPEC+) 국가들입니다. 중동 평화 협상을 중재하려는 주요국 정부도 시장에 영향을 미칩니다.`,
  current:`미국의 막대한 원유 생산은 기존 산유국들의 시장 지배력을 점진적으로 약화시키고 있습니다. 최근의 지정학적 긴장 완화는 이러한 유가 안정 흐름에 긍정적인 신호를 줍니다.`,
  outlook:`겨울철 난방 수요 증가와 원유 재고 감소가 맞물려 단기적인 유가 반등이 나타날 수 있습니다. 중동 협상의 실제 타결 여부가 유가의 중장기 추세를 확정할 것입니다.`,
  sources:[{title:`미 원유 생산량 사상 최대치 갱신 전망 - 에너지저널`,url:`https://example.com/news/economy/3`},{title:`위험 프리미엄 축소에 유가 안정화 기대 - 이코노믹데일리`,url:`https://example.com/news/economy/4`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 중간선거 이후 의회 권력 지형이 변화함에 따라 한국 대미 수출 기업들에 연말 환율 및 통상 비상이 걸렸습니다.`,
  metrics:[`대미 수출 비중 지속 증가세`,`원달러 환율 변동성 단기 확대`],
  summary:`최근 치러진 미국 중간선거 결과로 인해 미국 의회의 권력 지형 변화가 현실화되었습니다. 이에 따라 미국의 향후 통상 정책이 새로운 국면을 맞이할 가능성이 커지면서 한국 정부와 관련 수출 기업들이 긴장하고 있습니다. 특히 반도체와 자동차 등 대미 의존도가 높은 핵심 산업계는 미국의 자국 보호주의 기조가 더욱 강화될 것을 크게 우려합니다. 정부는 즉각 대응반을 꾸리고 연말 물류 단가 상승 및 원달러 환율 급등락에 대한 모니터링을 대폭 강화했습니다. 업계 전문가들은 단기적인 환율 변동성이 커질 수 있으므로 수출입 기업들이 선제적인 환리스크 관리에 만전을 기해야 한다고 강력히 조언하고 있습니다.`,
  keyTerms:[{term:`권력 지형 변화`,explanation:`선거 결과로 인해 정부나 의회를 지배하는 정당이 바뀌거나 정치권의 힘의 균형이 크게 달라지는 상황을 의미합니다.`}],
  history:`미국의 자국 우선주의 정책인 인플레이션 감축법(IRA)과 반도체법 도입 이후 한국 기업들은 미국 현지 투자를 급격히 늘려왔습니다. 이 과정에서 한미 통상 갈등과 극적인 타협이 꾸준히 반복되어 왔습니다.`,
  players:`미국의 행정부 및 새롭게 재편된 의회, 그리고 방어 전략을 짜는 한국 산업통상자원부가 얽혀 있습니다. 대미 수출 비중이 절대적인 국내 주요 대기업들도 직접적인 영향권 아래에 놓였습니다.`,
  current:`선거 결과에 따라 기존 행정부의 핵심 통상 정책들이 일부 수정되거나 예산 집행에 제동이 걸릴 수 있는 불확실한 과도기입니다. 기업들은 시나리오별 전략 수정에 착수했습니다.`,
  outlook:`새로 출범하는 미국 의회의 주요 상임위원회 위원장 인선이 첫 번째 관건이 될 것입니다. 한국 정부는 대미 밀착 외교 활동을 연말까지 전방위로 전개할 계획입니다.`,
  sources:[{title:`미 중간선거 후폭풍, 한국 수출기업 '비상' - 한국무역신문`,url:`https://example.com/news/economy/5`},{title:`널뛰는 환율에 연말 통상환경 안갯속 - 비즈니스포스트`,url:`https://example.com/news/economy/6`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`파리 G7 외교장관회의를 계기로 한미 양국 외교장관이 만나 굳건한 안보 동맹과 주요 현안을 논의했습니다.`,
  metrics:[`미 중간선거 이후 첫 최고위급 대면`,`호르무즈 해협 자유 항행 기여 방안 논의`],
  summary:`프랑스 파리에서 열린 G7 외교장관회의 현장에서 조현 한국 외교부 장관과 마코 루비오 미국 국무장관이 비공식 약식회동인 풀어사이드를 가졌습니다. 이번 만남은 미국 중간선거 이후 처음으로 성사된 양국의 최고위급 대면이라는 점에서 외교적 의미가 남다릅니다. 양국 장관은 한국의 핵잠수함 건조 지원 및 우라늄 농축 권한 확대 등 그간 합의된 주요 안보 사안의 후속 조치를 면밀히 점검했습니다. 또한 중동의 화약고라 불리는 호르무즈 해협의 자유 항행을 위해 한국이 어떻게 기여할 것인지에 대한 방안도 깊이 있게 논의된 것으로 전해집니다. 양국은 이를 통해 흔들림 없는 동맹의 결속력을 재확인하고 글로벌 위기에 공동 대응하겠다는 굳은 의지를 보였습니다.`,
  keyTerms:[{term:`풀어사이드`,explanation:`다자회의 등 공식 행사가 진행되는 도중에 회의장 밖이나 복도에서 비공식적으로 짧게 갖는 약식 양자 회담을 말합니다.`}],
  history:`최근 몇 년간 북핵 위협이 기하급수적으로 고도화되면서 한국 내에서는 독자적 핵 억지력 확보와 핵잠수함 도입 요구가 꾸준히 커져 왔습니다. 이에 양국은 확장억제 강화 방안을 지속 협의해왔습니다.`,
  players:`조현 한국 외교부 장관과 마코 루비오 미국 국무장관이 외교 협상의 최전선에서 호흡을 맞추고 있습니다. 실무적으로는 양국의 국방 및 정보 당국이 긴밀히 교류 중입니다.`,
  current:`미국의 국내 정치적 지형 변화에도 불구하고 안보 동맹만큼은 초당적으로 굳건히 유지되고 있음을 국제사회에 확실히 각인시키는 시점입니다. 안보 협력의 지평이 한반도를 넘어 중동 해역까지 확장되고 있습니다.`,
  outlook:`한미 실무 워킹그룹을 통해 우라늄 농축 권한 확대를 위한 한미 원자력 협정 개정 논의가 조만간 본격화될지 이목이 쏠립니다. 아울러 호르무즈 해협 안보 참여에 대한 정부의 구체적 청사진도 공개될 전망입니다.`,
  sources:[{title:`한미 외교장관, 파리서 첫 대면 '안보 동맹 굳건' - 외교저널`,url:`https://example.com/news/politics/1`},{title:`핵잠수함부터 호르무즈까지 굵직한 현안 논의 - 폴리틱스투데이`,url:`https://example.com/news/politics/2`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`아랍에미리트 아부다비에서 미국, 러시아, 우크라이나 고위급 인사가 참석한 3자 평화 협상이 전격 개시되었습니다.`,
  metrics:[`3개국 핵심 인사 대면 회담`,`유럽 주요 동맹국 협상 합류 예고`],
  summary:`기나긴 소모전으로 치닫던 우크라이나 전쟁의 새로운 돌파구를 찾기 위해 아랍에미리트 아부다비에서 극적인 휴전 협상이 시작되었습니다. 이번 회담은 미국, 러시아, 우크라이나의 최고위급 특사들이 한자리에 모이는 3자 대면 협상으로 치러져 전 세계의 이목을 단숨에 집중시키고 있습니다. 이는 분쟁 지역의 신속한 안정화를 꾀하는 미국 새 행정부의 외교적 기조가 강하게 반영된 결과로 풀이됩니다. 협상을 중재하는 마코 루비오 미 국무장관은 향후 협상 테이블에 주요 유럽 동맹국들까지 순차적으로 포함시켜 협상의 정당성과 실효성을 넓히겠다고 선언했습니다. 비록 교전 양측의 팽팽한 입장 차이가 단번에 좁혀지긴 어렵지만, 의미 있는 대화의 물꼬를 텄다는 점만으로도 글로벌 안보 시장에 강력한 긍정적 신호를 보내고 있습니다.`,
  keyTerms:[{term:`휴전 협상`,explanation:`치열한 무력 충돌을 임시로 멈추고 평화적인 분쟁 해결책을 모색하기 위해 교전 당사국이나 중재국이 벌이는 정치적 대화 과정입니다.`}],
  history:`2022년 발발한 전쟁은 양측 모두에게 막대한 인명 피해를 남기며 수년째 고착 상태에 빠졌고, 이로 인해 전 세계적인 에너지 폭등과 식량 공급망 위기를 초래했습니다. 여러 차례의 물밑 평화 접촉 시도는 영토 반환 문제로 번번이 무산되었습니다.`,
  players:`강력한 중재자로 나선 미국의 외교 수장과 러시아, 우크라이나 대통령의 최측근 특사들이 협상장의 핵심 인물입니다. 회담의 외교적 무대를 흔쾌히 제공한 아랍에미리트(UAE)도 숨은 조력자 역할을 톡톡히 하고 있습니다.`,
  current:`오랜 전쟁에 지친 참전국들의 피로감과 단기간에 굵직한 외교적 성과를 내려는 미국 행정부의 의지가 절묘하게 맞물리며 대화의 동력이 급격히 살아났습니다. 유럽 국가들 역시 끝없는 확전 방지를 위해 대화 재개를 지지하는 입장입니다.`,
  outlook:`이번 첫 아부다비 회담에서는 종전이라는 완벽한 결과보다는 임시 정전이나 완충 지대 설정 같은 점진적인 단계적 합의가 도출될 가능성이 제기됩니다. 조만간 유럽 동맹국들이 합류하는 2차 확대 회담 일정이 공식 발표될 것입니다.`,
  sources:[{title:`우크라이나 종전 향한 3자 회담 첫걸음 뗐다 - 글로벌뉴스`,url:`https://example.com/news/politics/3`},{title:`종전 불씨 살린 미국, 험난한 협상 테이블 예고 - 국제평화보도`,url:`https://example.com/news/politics/4`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`윤석열 대통령이 국무회의를 주재하며 급변하는 대외 환경 속 국익 중심의 실용외교와 적극적인 기업 보호를 지시했습니다.`,
  metrics:[`제48회 국무회의 개최`,`국회 2027년도 예산안 심사 본격화`],
  summary:`윤석열 대통령은 용산 대통령실에서 제48회 국무회의를 직접 주재하며 갈수록 급변하는 글로벌 대외 환경에 대해 내각의 발 빠른 대처를 엄중히 주문했습니다. 특히 미국 중간선거 이후 예상되는 정책 변화 상황을 짚으며, 낡은 이념보다는 철저하게 국익을 우선시하는 실용외교 노선을 흔들림 없이 견지할 것을 당부했습니다. 아울러 해외에 진출해 고군분투하는 우리 기업들이 불확실한 통상 환경 속에서 부당한 피해를 입지 않도록 국가 차원의 촘촘한 보호망을 총가동하라고 거듭 강조했습니다. 한편, 정치권 일각에서 불거진 주미대사관 특별감사설에 대해 국무총리실은 통상적인 정례 복무점검일 뿐이라며 과도한 확대 해석을 즉각 일축하기도 했습니다. 같은 날 국회가 정부의 2027년도 예산안 심사에 본격 돌입하면서 연말 정국이 한층 뜨겁게 달아오르고 있습니다.`,
  keyTerms:[{term:`실용외교`,explanation:`추상적인 이념이나 명분보다는 국가의 실질적인 이익과 경제적 실리를 가장 최우선으로 삼아 타국과 관계를 맺는 정책 방향입니다.`}],
  history:`역대 한국 정부는 세계 최대 우방국인 미국의 정권이 교체되거나 의회 권력이 바뀔 때마다 경제 안보 정책의 불확실성에 대비해 범정부 차원의 철저한 대응 체계를 구축해왔습니다.`,
  players:`대외 정책의 큰 방향을 제시하는 대통령과 이를 실무적으로 빈틈없이 집행해야 하는 외교부, 산업통상자원부가 전면에 서 있습니다. 국회에서는 내년도 예산을 움켜쥐고 여야 의원들이 치열한 기싸움을 벌이고 있습니다.`,
  current:`미국의 자국 중심주의 정책 기조가 당분간 지속될 가능성이 매우 커짐에 따라, 정부는 수출 기업의 타격을 최소화하는 것을 올 연말 최우선 국정 과제로 삼았습니다. 이로 인해 관련 부처의 대응 예산 확보가 국회 심사의 최대 쟁점으로 떠올랐습니다.`,
  outlook:`대통령의 지시에 따라 각 유관 부처는 신속하게 세부적인 대미 통상 전략과 맞춤형 외교 로드맵을 수정하여 발표할 것입니다. 다가오는 예산안 법정 통과 시한까지 정국 주도권을 둔 여야의 양보 없는 공방이 계속될 전망입니다.`,
  sources:[{title:`국무회의 주재한 대통령 '국익 실리 챙겨라' - 정치포커스`,url:`https://example.com/news/politics/5`},{title:`국회 예산안 심사 돌입, 연말 정국 본격화 - 의회일보`,url:`https://example.com/news/politics/6`}]

  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`은행과 보험사의 보안 방패 역할을 하는 금융보안원이 해킹 공격을 받아 내부 개인정보가 유출되는 초유의 사태가 발생했습니다.`,
  metrics:[`전국 200여 개 금융사 회원 가입`,`내부 직원 데이터 650여 건 외부 유출`],
  summary:`국내 200여 개 핵심 금융기관을 회원사로 관리하며 사이버 위협을 방어하는 금융보안원이 정작 자신들의 내부 시스템이 뚫리는 심각한 사이버 공격을 받았습니다. 이 해킹 과정에서 내부 직원의 민감한 개인정보 등 650여 건의 데이터가 고스란히 외부로 유출된 사실이 확인되어 뼈아픈 충격을 주고 있습니다. 금융권의 최고 방어선을 자처하는 기관마저 어이없이 해킹에 노출됨에 따라, 금융 시스템 전반을 지탱하는 공급망 보안 체계에 비상이 걸렸습니다. 보안 당국은 즉각 최고 수준의 침해사고 대응팀을 꾸려 정밀 조사에 착수했으며 추가적인 연쇄 피해 여부를 샅샅이 파악하고 있습니다. 이번 충격적인 사건을 계기로 협력 보안 업체를 징검다리 삼아 파고드는 우회 침투 공격에 대한 방어망을 원점에서 재점검해야 한다는 전문가들의 쓴소리가 쏟아지고 있습니다.`,
  keyTerms:[{term:`공급망 보안`,explanation:`소프트웨어나 IT 서비스를 제공하는 외부 협력업체의 취약점을 먼저 뚫은 뒤, 이를 발판 삼아 최종 목표 기관을 해킹하는 공격에 방어하는 체계입니다.`}],
  history:`최근 수년간 국제적인 전문 해킹 조직들은 방벽이 높은 주요 금융회사에 정면으로 침투하기보다, 상대적으로 취약한 보안 솔루션 업체나 유지보수망을 먼저 노리는 방식을 집요하게 선호해왔습니다. 금융당국이 규제를 조여왔음에도 여전히 방어의 사각지대가 뚫린 셈입니다.`,
  players:`사태 수습의 무거운 짐을 진 금융보안원과 상급 감독 기관인 금융감독원, 그리고 수사에 착수한 경찰청 사이버수사대가 긴밀히 움직이고 있습니다. 시중 은행들의 정보보호 최고책임자(CISO)들도 자사 시스템 방어에 비상이 걸린 상태입니다.`,
  current:`가장 완벽한 신뢰를 줘야 할 보안 전담 국가 기관에서 사고가 터졌다는 점에서 전체 금융권의 불안감이 최고조에 달하고 있습니다. 혹시 모를 2차 금융 피해를 막기 위해 은행들의 자체 보안 점검이 매일 야간까지 숨 가쁘게 이어지고 있습니다.`,
  outlook:`정부 합동 사이버 조사단의 세밀한 포렌식 분석 결과에 따라 이번 해킹의 배후 조직과 구체적인 침투 경로가 곧 명백히 밝혀질 예정입니다. 이번 참사는 향후 정부가 추진하려던 금융권 클라우드 망분리 규제 완화 논의에도 상당한 악재로 작용할 것이 확실시됩니다.`,
  sources:[{title:`믿었던 금융보안원 뚫렸다, 개인정보 650건 유출 - 사이버뉴스`,url:`https://example.com/news/tech/1`},{title:`최후 방어선 뚫린 금융권 '공급망 보안 재검토 시급' - IT조선`,url:`https://example.com/news/tech/2`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`대학수학능력시험을 앞두고 카메라와 무선 통신 기능이 내장된 'AI 스마트 안경'을 악용한 신종 부정행위 시도에 비상이 걸렸습니다.`,
  metrics:[`수능일 전파 신호 탐지 장비 전격 가동`,`금속탐지기 활용 및 육안 검사 대폭 강화`],
  summary:`온 국민의 관심이 쏠리는 대학수학능력시험이 코앞으로 다가온 가운데 고도화된 정보통신 기기를 악용한 치밀한 부정행위 우려가 커져 교육 당국이 바짝 긴장하고 있습니다. 특히 겉보기엔 일반 뿔테 안경과 전혀 구별이 가지 않으면서도 초소형 카메라와 실시간 통신 칩이 내장된 'AI 스마트 안경'이 시험장의 가장 무서운 위협으로 떠올랐습니다. 교육부와 전국 시험장 관리위원회는 시험 중 외부와 몰래 연결되는 불법 기기를 완벽히 차단하기 위해 실시간 전파 신호 탐지 장비를 전격 도입하여 가동하기로 결정했습니다. 또한 시험 감독관들에게 최신 금속탐지기를 지급하고 수험생의 안경이나 수상한 장신구에 대한 현장 육안 검사도 유례없는 수준으로 깐깐하게 강화할 방침입니다. 하루가 다르게 진화하는 첨단 기술이 오히려 공정한 입시 경쟁의 뿌리를 흔들면서, 수능 시험장 방역의 난이도가 매년 기하급수적으로 높아지는 실정입니다.`,
  keyTerms:[{term:`전파 신호 탐지`,explanation:`우리 눈에 보이지 않는 스마트 기기의 무선 통신용 전자파를 특수한 센서 장비를 사용해 은밀하게 찾아내고 추적해 내는 기술입니다.`}],
  history:`과거 아날로그 시절의 수능 부정행위는 지우개에 적은 커닝 페이퍼나 옷 속에 숨긴 소형 이어폰 정도에 머물렀습니다. 하지만 최근 10년 새 스마트워치를 거쳐 이제는 몸에 착용하는 첨단 웨어러블 디바이스로 그 수법이 무섭게 진화해왔고, 교육부 역시 반입 금지 물품 규정을 매년 갱신하며 창과 방패의 싸움을 이어왔습니다.`,
  players:`무결점 시험 운영의 막중한 책임을 진 교육부와 전국 시도교육청, 그리고 현장에서 학생들을 직접 통제해야 하는 일선 학교의 감독관 교사들이 철통 보안 단속에 나섭니다. 아이러니하게도 사람들의 삶을 편하게 만드는 글로벌 빅테크 기업들의 기기 혁신이 국가 중요 시험에 엄청난 부작용을 던져주고 있습니다.`,
  current:`가격이 저렴하고 구하기 쉬운 초소형 AI 기기들이 시중에 너무 흔하게 유통되면서, 더 이상 전통적인 단순 소지품 검사만으로는 치밀한 부정행위를 걸러내는 것이 사실상 불가능해진 벼랑 끝 상황입니다. 이로 인해 학부모와 성실한 수험생들 사이에서 시험의 공정성이 훼손될까 우려하는 목소리가 팽배합니다.`,
  outlook:`교육 당국은 수능 당일 현장에서 한 번이라도 적발된 불법 전자기기 소지자에 대해서는 고의성 여부를 불문하고 그해 시험을 무조건 무효 처리한다는 강력하고 단호한 무관용 원칙을 끝까지 유지할 것입니다. 이번 사태를 계기로 국가 공무원 시험 등 공인 시험 전반에 걸친 '첨단 부정행위 방지 가이드라인'이 새롭게 제정될 전망입니다.`,
  sources:[{title:`안경 쓴 AI 비서? 수능 부정행위 주의보 - 교육저널`,url:`https://example.com/news/society/1`},{title:`전파 탐지기까지 동원된 수능 고사장 - 에듀타임즈`,url:`https://example.com/news/society/2`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`호주 정부가 고위험 첨단 AI에 대해 엄격한 사전 안전검증을 의무화하는 강력한 법안을 공식 추진하며 글로벌 규제에 앞장서고 있습니다.`,
  metrics:[`호주 연방정부 AI 규제안 공식 입법화`,`미국 내 주요 AI 반도체 독점 조사 심화`],
  summary:`호주 연방정부가 무분별한 인공지능 기술의 폭주를 막고 사회적 안전망을 확보하기 위해 마침내 초강력 규제안의 칼을 빼 들었습니다. 호주 정부는 국가 안보나 국민의 삶에 큰 파급력을 미칠 수 있는 '고위험 첨단 AI 모델'을 개발할 경우, 시장에 출시하기 전 사전에 반드시 정부가 승인한 안전검증 의무화 절차를 깐깐하게 거치도록 하는 법안을 추진한다고 공식 선언했습니다. 이는 세계 최초로 마련된 유럽연합(EU)의 깐깐한 AI법에 이어, 또 다른 서방 선진국이 국가 차원의 구속력 있는 거대 통제 장치를 마련하려는 뚜렷한 전 세계적 흐름을 보여줍니다. 한편 같은 시각 미국에서도 AI 혁신을 주도하는 빅테크 기업들을 향한 규제 압박이 덩달아 거세지고 있습니다. 사법 당국은 엔비디아를 비롯한 주요 AI 칩 제조사들의 독점적 지위 남용 혐의와 제재 국가를 향한 우회 수출 의혹에 대해 대대적인 전방위 조사를 벌이고 있습니다. 눈부신 기술 혁신과 묵직한 사회적 통제 사이에서 글로벌 IT 업계의 긴장감이 그 어느 때보다 높게 고조되고 있습니다.`,
  keyTerms:[{term:`안전검증 의무화`,explanation:`기업이 개발한 새로운 첨단 기술이나 제품을 대중에게 출시하기 전에, 국가나 공인 기관으로부터 인체나 사회에 미칠 잠재적 위험성이 없음을 강제로 철저히 확인받도록 강제하는 법적 제도입니다.`}],
  history:`세상을 놀라게 한 챗GPT의 화려한 등장 이후, 생성형 인공지능 기술이 인간의 예측을 뛰어넘는 속도로 팽창하면서 정교한 가짜 뉴스 양산, 무단 저작권 침해, 화이트칼라 일자리 위협 등 각종 심각한 사회적 부작용에 대한 우려가 전 세계적으로 끊임없이 제기되어 왔습니다.`,
  players:`기술 통제를 명분으로 선제적인 입법 규제를 주도하는 유럽연합(EU)과 호주 등 각국 정부 기관들이 한 축을 이룹니다. 다른 한 축에서는 글로벌 혁신을 저해한다며 치열한 방어 논리와 막후 로비전을 펼치고 있는 구글, 마이크로소프트, 오픈AI, 엔비디아 등 거대 테크 기업들이 치열하게 대립하고 있습니다.`,
  current:`미국을 제외한 주요 서방 선진국들이 하나둘씩 각자의 엄격한 AI 규제 법안을 속도감 있게 입법화하면서, 복잡하고 파편화된 규제 환경 자체가 글로벌 AI 기업들에게 엄청난 비용과 새로운 진입 장벽으로 강하게 작용하고 있는 현실입니다. 그 이면에는 첨단 기술 안보를 핑계 삼아 자국의 열세인 IT 산업을 노골적으로 보호하려는 보호무역주의적 성격도 짙게 엿보입니다.`,
  outlook:`호주의 강력한 이번 규제 법안은 조만간 의회 표결 통과를 거쳐 이르면 내년 초부터 전격적으로 본격 시행될 가능성이 매우 큽니다. 아울러 미국의 깐깐한 반독점 조사 결과에 따라 글로벌 AI 반도체 칩 시장의 지배 구도와 복잡한 하드웨어 공급망이 송두리째 크게 흔들릴 수도 있는 중대한 분수령을 맞고 있습니다.`,
  sources:[{title:`호주도 칼 뺐다, 첨단 AI 사전 검증 법제화 - 테크크런치`,url:`https://example.com/news/tech/3`},{title:`미 사법당국 AI 반도체 정조준, 빅테크 규제 확산 - 실리콘밸리뉴스`,url:`https://example.com/news/tech/4`}]
}]

  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`대출 규제 우려에 중도상환 급감… 차주들 '빚 갚으면 다시 못 빌려' 기현상`,
  metrics:[`주요 은행 중도상환액 전년 대비 30% 감소`,`신규 주택담보대출 금리 연 5%대 돌파`],
  summary:`가계대출 규제가 강화되면서 여유 자금이 생겨도 대출을 갚지 않는 기현상이 벌어지고 있습니다. 차주들은 한 번 빚을 갚으면 추후 필요할 때 다시 빌리기 어려워질 것을 우려하고 있습니다. 이로 인해 주요 은행들의 대출 중도상환액이 전년 대비 크게 감소했습니다. 특히 중도상환수수료 부담을 감수하고서라도 대출을 유지하려는 심리가 확산되고 있습니다. 금융당국은 가계부채 관리의 고삐를 죄고 있으나, 시장의 불안 심리가 겹쳐 정책 효과가 반감되고 있다는 지적이 나옵니다. 향후 금리 인하 기대감마저 약화되며 차주들의 이자 부담은 더욱 가중될 전망입니다.`,
  keyTerms:[{term:`중도상환수수료`,explanation:`대출 만기일 이전에 빌린 돈을 미리 갚을 때 은행이 부과하는 위약금 성격의 수수료입니다.`}],
  history:`최근 1~2년 사이 가계부채 급증에 대응해 정부가 강도 높은 대출 억제 정책을 시행하면서 대출 문턱이 크게 높아졌습니다.`,
  players:`주요 시중은행과 금융당국, 그리고 주택 자금 등 유동성이 필요한 금융소비자들이 복잡하게 얽혀 있습니다.`,
  current:`대출 한도 축소와 심사 강화가 맞물리면서, 소비자들이 빚을 유지하는 것을 일종의 현금 확보 전략으로 삼고 있는 전환점입니다.`,
  outlook:`연말까지 가계부채 증가세가 잡히지 않을 경우 추가적인 대출 규제가 도입될 수 있어 시장 상황을 주시해야 합니다.`,
  sources:[{title:`대출 규제 역설과 중도상환 급감 - 한국경제`,url:`https://www.hankyung.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`배달앱·플랫폼 최혜대우 과징금 공방 격화… 소상공인 수수료 부담 한계`,
  metrics:[`주요 배달앱 수수료율 9.8% 논란`,`소상공인 10명 중 7명 수수료 부담 호소`],
  summary:`배달의민족, 쿠팡 등 주요 거대 플랫폼 기업들이 입점업체에 자사 플랫폼에 가장 유리한 조건을 요구하는 이른바 최혜대우 요구를 둘러싸고 논란이 커지고 있습니다. 공정거래위원회는 이러한 행위에 대해 강력한 제재와 대규모 과징금 부과를 검토 중입니다. 반면 플랫폼 업계는 소비자 편익을 위한 불가피한 조치라며 반발하고 나섰습니다. 하지만 입점 소상공인들은 끝없이 오르는 수수료 부담에 한계 상황에 다다랐다고 호소합니다. 플랫폼의 독과점적 지위 남용을 막기 위한 온라인 플랫폼 공정화법 입법 촉구 목소리도 높아지고 있습니다. 정부의 규제 수위에 따라 플랫폼 생태계 전반에 큰 파장이 예상됩니다.`,
  keyTerms:[{term:`최혜대우 요구`,explanation:`플랫폼 기업이 입점업체에게 다른 경쟁 플랫폼보다 가격이나 조건을 불리하게 설정하지 못하도록 강제하는 행위입니다.`}],
  history:`코로나19 팬데믹 이후 배달 및 이커머스 시장이 급성장하면서 소수 플랫폼의 시장 지배력이 비약적으로 커졌습니다.`,
  players:`배달의민족, 쿠팡 등 대형 플랫폼 사업자와 이에 종속된 영세 소상공인, 그리고 시장 질서를 감시하는 공정거래위원회가 중심입니다.`,
  current:`플랫폼의 과도한 수수료 인상 시도가 한계에 다다르며, 정부 규제가 본격적으로 칼을 빼든 핵심 시기입니다.`,
  outlook:`공정위의 최종 제재 수위와 국회의 관련 법안 통과 여부가 향후 플랫폼 비즈니스 모델의 운명을 결정할 것입니다.`,
  sources:[{title:`플랫폼 수수료·과징금 공방 - 다음뉴스`,url:`https://news.daum.net/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`주요 기관 2026년 글로벌 경제 성장률 둔화 전망… 에너지 쇼크 여파`,
  metrics:[`IMF 2026년 글로벌 성장률 2.5%로 하향 조정`,`국제 유가 배럴당 90달러 재돌파 조짐`],
  summary:`IMF와 세계은행 등 주요 국제기관들이 2026년 글로벌 경제 성장률을 2.5% 안팎으로 일제히 하향 조정했습니다. 중동 지역의 지속적인 지정학적 긴장과 불안한 에너지 공급망이 핵심 원인으로 지목되었습니다. 특히 원자재 가격 상승이 물가를 자극하며 주요국의 금리 인하 사이클에도 제동이 걸린 상황입니다. 경기 침체 속에서 물가가 상승하는 스태그플레이션 우려가 다시 고개를 들고 있습니다. 신흥국 경제는 강달러 기조와 수출 부진으로 인해 더욱 큰 타격을 입을 것으로 예상됩니다. 전 세계적으로 보호무역주의가 강화되며 경제 불확실성은 가중되고 있습니다.`,
  keyTerms:[{term:`스태그플레이션 우려`,explanation:`경제 불황(Stagnation)과 물가 상승(Inflation)이 동시에 발생하는 현상에 대한 시장의 두려움입니다.`}],
  history:`최근 몇 년간 이어진 지정학적 분쟁과 글로벌 공급망 블록화 현상이 세계 경제의 장기 저성장 기조를 고착화시켰습니다.`,
  players:`미국과 중국 등 주요 경제 대국은 물론, 중동 산유국과 에너지 수입 의존도가 높은 신흥국들이 복잡하게 연결되어 있습니다.`,
  current:`성장 엔진이 식어가는 상황에서 인플레이션이라는 암초를 만나 각국 중앙은행의 통화정책 여력이 크게 제한된 상태입니다.`,
  outlook:`겨울철 에너지 수요 증가 시기를 맞아 국제 유가 변동성이 극대화될 수 있으며, 주요국의 재정 부양책 도입 여부가 관건입니다.`,
  sources:[{title:`글로벌 경제 성장률 둔화 및 인플레이션 압박 - UN 뉴스`,url:`https://news.un.org/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`여야 1주택자 종합부동산세 공제액 상향 논란… 감세 딜레마 격화`,
  metrics:[`1주택자 종부세 기본공제 14억 원 상향 제안`,`서울 주요 지역 아파트 중위가격 12억 원 근접`],
  summary:`더불어민주당 내부에서 1세대 1주택자에 대한 종합부동산세 기본공제액을 14억 원으로 상향하자는 요구가 터져나오며 정치권의 화두로 떠올랐습니다. 중도층 및 수도권 표심을 의식한 조치이나, 당내 강경파는 부자 감세라며 거세게 반발하고 있습니다. 정부와 여당 역시 세수 부족 우려와 부동산 시장 자극 가능성을 두고 셈법이 복잡해 당정 간 조율이 난항을 겪고 있습니다. 이번 종부세 논란은 헌법 개정과 같은 거시적 정치 아젠다와 맞물려 내년 선거를 앞둔 정치권의 주도권 다툼으로 번지는 모양새입니다. 서민 주거 안정과 조세 형평성이라는 두 가치가 정면 충돌하며 여론도 찬반으로 팽팽히 엇갈리고 있습니다. 국회 기재위 심사 과정에서 격렬한 공방이 예상됩니다.`,
  keyTerms:[{term:`종합부동산세`,explanation:`일정 금액 이상의 부동산을 보유한 사람에게 누진세율을 적용하여 부과하는 국세로, 자산 양극화 완화 목적을 띠고 있습니다.`}],
  history:`과거 집값 급등기에 도입된 징벌적 세금 기준이 현 부동산 시장 상황과 괴리되었다는 불만이 지속적으로 제기되어 왔습니다.`,
  players:`조세 저항에 직면한 수도권 유권자, 당내 노선 갈등을 겪는 야당 지도부, 그리고 세수 펑크를 우려하는 기획재정부입니다.`,
  current:`내년 주요 선거를 앞두고 중도층 표심 확보가 절실한 정치권이 세제 개편을 선거 전략의 핵심 카드로 꺼내든 상황입니다.`,
  outlook:`여야 합의 여부에 따라 연말 세법 개정안 통과 방향이 결정되며, 이는 하반기 부동산 시장 관망세에도 큰 영향을 줄 것입니다.`,
  sources:[{title:`부동산 증시 세제 완화 논란 - 중앙일보`,url:`https://www.joongang.co.kr/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 중간선거 민주당 상·하원 선전… 트럼프식 강경 관세 정책 제동`,
  metrics:[`민주당 하원 의석 과반 탈환 성공`,`선거 직후 미국 달러화 지수 1.5% 하락`],
  summary:`2026년 11월 미국 중간선거 결과, 민주당이 예상을 깨고 하원 과반을 탈환하며 의회 권력의 균형을 맞췄습니다. 이에 따라 집권 2년 차를 맞은 트럼프 행정부의 일방적인 강경 관세 및 감세 정책 드라이브에 강력한 제동이 걸릴 전망입니다. 선거 직후 중간선거 결과가 전해지자 글로벌 금융시장은 정책 불확실성 우려로 출렁였으며 달러화 가치는 즉각 하락세를 보였습니다. 의회 분점에 따라 양당 간 예산안 합의와 주요 입법 과정에서 치열한 힘겨루기가 예고됩니다. 특히 미국의 동맹국들은 관세 장벽 완화 등 대외 정책 기조의 변화 가능성을 예의주시하고 있습니다. 향후 2년간 미국 내 정치적 교착 상태가 글로벌 질서에도 상당한 파장을 미칠 것으로 보입니다.`,
  keyTerms:[{term:`중간선거`,explanation:`미국 대통령 임기 4년의 중간인 2년 차에 치러지는 상·하원 의원 및 공직자 선거로, 현직 대통령에 대한 중간 평가 성격을 가집니다.`}],
  history:`현 행정부 출범 이후 지속된 급진적인 보호무역주의와 고금리 압박에 대해 유권자들의 피로감과 경제 불안감이 누적되어 왔습니다.`,
  players:`강력한 행정명령을 고수하는 백악관과 입법 저지선을 확보한 민주당 지도부, 그리고 이해관계가 엇갈리는 글로벌 무역 파트너들입니다.`,
  current:`행정부의 정책 독주가 의회라는 강력한 견제 장치를 만나게 되면서, 기존 정책의 수정이나 타협이 불가피해진 중대한 분기점입니다.`,
  outlook:`차기 대선을 2년 앞두고 양당의 극한 대립이 이어질 것이며, 당장 연말 예산안 처리 과정이 첫 번째 충돌 시험대가 될 것입니다.`,
  sources:[{title:`미국 중간선거 결과 및 정치 지형 변화 - AP통신`,url:`https://apnews.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`유럽 주요국 부채 압박 심화… 국채 금리 급등으로 정치적 혼란 가중`,
  metrics:[`프랑스 국채 10년물 금리 3.5% 돌파`,`유로존 평균 정부 부채 비율 GDP 대비 90% 상회`],
  summary:`프랑스와 이탈리아 등 유럽 주요국들의 재정 적자 문제가 임계점에 달하며 정치적 혼란을 가중시키고 있습니다. 막대한 복지 지출과 국방비 증액으로 부채 규모가 커지면서 시장의 우려를 반영해 국채 금리가 급등했습니다. 특히 독일과의 국채 스프레드 격차가 벌어지며 유로존 내부의 재정 신뢰도에 균열이 가고 있습니다. 각국 정부는 긴축 재정안을 내놓고 있으나, 성난 민심과 야당의 반대로 의회 통과에 험로를 겪고 있습니다. 극우 및 극좌 포퓰리즘 정당들이 이 틈을 타 지지율을 끌어올리며 기존 정치 질서를 크게 흔들고 있습니다. 유럽의 재정 불안이 글로벌 자금 이탈로 이어질 가능성마저 제기되고 있습니다.`,
  keyTerms:[{term:`국채 스프레드`,explanation:`위험도가 낮은 안전 국가의 국채 금리와 다른 국가의 국채 금리 사이의 차이를 뜻하며, 국가 부도 위험을 나타내는 지표입니다.`}],
  history:`유럽은 코로나19 대응과 우크라이나 전쟁 여파로 수년간 막대한 재정을 쏟아부었으나, 구조적인 저성장으로 세수 확충에 실패했습니다.`,
  players:`재정 건전성을 요구하는 EU 집행위원회와 빚을 갚을 여력이 부족한 회원국 정부, 그리고 긴축에 반대하는 시민 사회입니다.`,
  current:`시장의 금리 인상 압박이 국가 채무 상환 능력을 위협하는 수준에 이르러, 정치권이 강도 높은 구조조정을 결단해야 하는 시점입니다.`,
  outlook:`연말 유럽중앙은행(ECB)의 통화 정책 회의 결과와 각국의 내년도 예산안 승인 과정에서 심각한 시위와 정치적 파동이 예상됩니다.`,
  sources:[{title:`유럽 재정 불안 지속 - The Guardian`,url:`https://www.theguardian.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`공공·운송 부문 연말 연쇄 파업 예고… 전국 교통 및 물류 대란 우려`,
  metrics:[`전국철도노조 등 주요 노조 조합원 약 10만 명 쟁의 결의`,`연말 물류 운송 차질 발생 예상률 20% 상회`],
  summary:`철도, 공항, 교육공무직 등 주요 공공 및 운송 부문 노동자들이 대규모 연말 연쇄 파업을 예고하면서 전국적인 물류 및 교통 대란이 현실화될 조짐입니다. 노조 측은 실질 임금 인상과 인력 충원을 통한 노동 조건 개선을 강력히 요구하고 있습니다. 정부는 불법 파업에 대한 엄정 대응 기조를 재확인하며 물러서지 않고 있어 강대강 대치가 이어지고 있습니다. 노사정 위원회 차원의 막판 교섭이 시도되고 있으나, 이견 차이가 커 합의점을 찾기 쉽지 않은 상황입니다. 연말 성수기를 앞두고 산업계 전반에 걸친 경제적 피해가 눈덩이처럼 커질 수 있다는 우려가 나옵니다. 시민들의 이동 불편과 수출입 기업들의 타격이 불가피해 보입니다.`,
  keyTerms:[{term:`노사정 위원회`,explanation:`노동자 대표, 사용자 대표, 정부 공익위원이 모여 주요 노동 정책과 일자리 문제를 협의하는 사회적 대화 기구입니다.`}],
  history:`최근 수년간의 가파른 물가 상승에도 불구하고 임금 인상률이 이를 밑돌면서 현장 노동자들의 누적된 불만이 폭발 단계에 이르렀습니다.`,
  players:`강경 투쟁을 예고한 거대 산별노조와 예산 제약을 이유로 불가 방침을 고수하는 정부, 피로감을 호소하는 산업계 및 일반 시민입니다.`,
  current:`정치권의 국정감사가 끝난 직후 다가오는 동절기에 노사 갈등이 사회적 마비 사태로 확전될 수 있는 중대한 고비입니다.`,
  outlook:`이번 주말 예정된 전국 노동자 대회가 파업의 규모와 수위를 결정짓는 분수령이 될 것이며, 정부의 긴급 조정권 발동 여부도 주목됩니다.`,
  sources:[{title:`연말 파업 예고 및 노사 갈등 - 조선일보`,url:`https://www.chosun.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`엔비디아-SKT 협력 국산 NPU 연동 '소버린 AI 인프라' 구축 본격화`,
  metrics:[`초기 데이터센터 인프라 구축 투자금 300억 원 규모`,`2027년까지 국산 NPU 상용화 1단계 완료 목표`],
  summary:`글로벌 AI 칩 선두주자인 엔비디아가 SK텔레콤, 국내 AI 반도체 기업 리벨리온과 손잡고 한국 맞춤형 인프라 구축에 나섰습니다. 이들 기업은 외산 GPU와 국산 NPU를 연동하여 데이터 보안과 기술 자립을 강조하는 소버린 AI 인프라 생태계를 공동 조성하기로 합의했습니다. 국내 기술 기업이 글로벌 빅테크와 기술 설계 단계부터 협력하는 것은 매우 이례적인 사례로 평가됩니다. 이를 통해 막대한 외화 유출을 막고 국가 차원의 데이터 주권을 확립할 수 있는 발판을 마련하게 되었습니다. 또한 카카오모빌리티 등 국내 플랫폼 기업들과의 모빌리티 자율주행 협력까지 논의되고 있습니다. 대한민국이 글로벌 AI 하드웨어 시장에서 새로운 테스트베드로 부상하고 있습니다.`,
  keyTerms:[{term:`소버린 AI`,explanation:`특정 국가나 지역이 자체적인 인프라와 데이터를 활용해 외부의 간섭 없이 독립적으로 구축하고 운영하는 자주적 인공지능을 뜻합니다.`}],
  history:`생성형 AI 붐 이후 전 세계적으로 특정 빅테크에 대한 기술 의존도가 극도로 높아지자, 자체 AI 인프라 확보의 필요성이 커졌습니다.`,
  players:`독점력을 굳히려는 엔비디아, 통신망 바탕의 AI 전환을 노리는 SKT, 그리고 국산 칩셋 상용화를 꿈꾸는 리벨리온 등 스타트업입니다.`,
  current:`막대한 자본이 소요되는 시장에서 국내 기술진이 자체 칩셋을 세계적 수준의 시스템에 접목시키는 중요한 첫걸음입니다.`,
  outlook:`실제 서비스 적용 후 성능 테스트 결과에 따라, 국내 스타트업들이 설계한 국산 NPU의 글로벌 수출 길도 열릴 것으로 기대됩니다.`,
  sources:[{title:`엔비디아-국내 기업 연합 행보 - 뉴스1`,url:`https://www.news1.kr/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`구글 차세대 AI 칩 TPU 전격 공개… 빅테크 인프라 자립 경쟁 심화`,
  metrics:[`새로운 8세대 TPU 연산 처리 속도 기존 대비 2배 향상`,`구글 자체 데이터센터 내 엔비디아 의존도 30% 이하 감축 목표`],
  summary:`구글이 복잡한 추론과 자율적 작업 수행에 특화된 차세대 AI 반도체인 TPU 최신 모델을 전격 공개하며 하드웨어 시장에 파장을 일으켰습니다. 이번에 발표된 칩셋은 기존 대비 연산 속도와 전력 효율을 비약적으로 끌어올려 AI 에이전트 서비스에 최적화되었습니다. 구글의 이 같은 행보는 엔비디아의 독점적 시장 지배력에서 벗어나 원가 절감과 기술 자립을 이룩하겠다는 강력한 의지로 풀이됩니다. 마이크로소프트와 아마존 역시 자체 칩 개발에 속도를 내고 있어 빅테크 기업 간의 실리콘 전쟁이 본격화되고 있습니다. 핵심 칩셋의 성능 향상과 더불어 막대한 전력을 소모하는 데이터센터의 열 관리 기술도 핵심 경쟁력으로 부상했습니다. 향후 고도화된 하드웨어를 바탕으로 AI 서비스의 이용 단가가 크게 낮아질 것으로 전망됩니다.`,
  keyTerms:[{term:`TPU`,explanation:`구글이 딥러닝과 인공지능 기계 학습에 특화하여 자체적으로 설계하고 개발한 텐서 처리 장치 칩입니다.`}],
  history:`챗GPT 열풍 이후 AI 연산에 필수적인 그래픽처리장치 품귀 현상이 벌어지며, 엔비디아가 칩 가격을 크게 올리고 공급을 통제해 왔습니다.`,
  players:`AI 칩 시장의 절대 강자 엔비디아와 이에 대항하여 인프라 비용을 줄이려는 구글, 마이크로소프트, 메타 등 클라우드 공룡 기업들입니다.`,
  current:`빅테크 기업들이 AI 모델 개발을 넘어, 이를 굴리기 위한 물리적 반도체 칩셋까지 직접 통제하려는 수직 계열화의 분수령입니다.`,
  outlook:`자체 개발 칩의 성능이 주력 시장 제품을 어느 정도 대체할 수 있을지에 따라 내년도 전 세계 반도체 공급망 판도가 재편될 것입니다.`,
  sources:[{title:`빅테크 AI 칩·인프라 경쟁 - 중앙일보`,url:`https://www.joongang.co.kr/`}]
}]
},{
  tag:`2026-11-09`,
  label:`2026년 11월 9일 (월)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`퇴직연금 시장 542조원 돌파에도 수익률 양극화는 심화`,
  metrics:[`퇴직연금 적립금 542조 원`,`원리금 보장형 비중 85%`],
  summary:`국내 퇴직연금 시장이 542조 원 규모로 성장했으나 수익률 양극화가 뚜렷해지고 있다. 특히 원리금 보장형 상품에 자금이 쏠리면서 물가 상승률을 따라잡지 못하는 계좌가 속출하는 상황이다. 이에 따라 실질적인 노후 대비 수단으로서의 기능에 의문이 제기되고 있다. 전문가들은 디폴트옵션 도입 이후에도 가입자들의 보수적 투자 성향이 유지되고 있다고 분석한다. 장기적으로 연금 개혁과 맞물려 자산 운용 규제 완화 목소리가 커질 전망이다. 정부는 관련 세제 혜택 확대를 검토 중이다.`,
  keyTerms:[{term:`디폴트옵션`,explanation:`가입자가 별도로 운용 지시를 하지 않으면 금융사가 사전에 정해둔 방법으로 퇴직연금을 자동 운용하는 제도입니다.`}],
  history:`과거 기업이 퇴직금을 직접 관리하던 방식에서 벗어나 2005년부터 퇴직연금 제도가 도입되었습니다. 고령화 사회로 진입하며 노후 대비의 중요성이 커졌고, 관련 시장도 급성장했습니다. 최근에는 542조 원이라는 막대한 규모로 자산이 축적되었습니다.`,
  players:`퇴직연금을 운용하는 은행, 증권사, 보험사 등 주요 금융기관들이 시장 점유율을 두고 경쟁하고 있습니다. 동시에 실질적인 수익률을 원하는 일반 직장인 가입자들의 요구도 거셉니다. 정부와 금융당국은 수익률 제고와 안정성 사이에서 규제의 수위를 조절하고 있습니다.`,
  current:`안전 자산에만 자금이 머물면서 실제 투자 수익률이 물가 상승률을 밑도는 사례가 속출하고 있습니다. 디폴트옵션 도입 등 제도적 보완이 있었음에도 가입자의 보수적 성향은 쉽게 변하지 않고 있습니다.`,
  outlook:`향후 국회와 정부를 중심으로 자산 운용 관련 규제를 완화하려는 논의가 탄력을 받을 것으로 보입니다. 수익률을 끌어올리기 위한 금융권의 상품 다변화 경쟁도 한층 치열해질 전망입니다.`,
  sources:[{title:`퇴직연금 542조 시대의 명암 - 연합뉴스`,url:`https://www.yna.co.kr/view/AKR202611090001`},{title:`잠자는 퇴직연금, 수익률 비상 - 매일경제`,url:`https://www.mk.co.kr/news/economy/202611090001`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`엔비디아 발 미·중 기술전쟁 심화 속 K-반도체 긴장 고조`,
  metrics:[`엔비디아 주가 변동성 8% 확대`,`K-반도체 수출 영향 추정치 -3%`],
  summary:`엔비디아 최고경영자가 중국 관련 인물과 연루되었다는 의혹이 불거지며 미국 내 독립 수사가 시작되었다. 이로 인해 글로벌 빅테크 및 반도체 공급망에 큰 불확실성이 조성되었다. 특히 미국의 대중국 반도체 수출 통제가 더욱 강화될 조짐을 보이면서, 국내 K-반도체 기업들도 예의주시하고 있다. 시장에서는 엔비디아의 독점적 지위가 흔들릴 경우 새로운 합종연횡이 일어날 것으로 예측한다. 한국 기업들은 대체 시장 발굴과 기술 초격차 유지라는 과제를 동시에 안게 되었다. 이번 사태가 글로벌 기술 패권 경쟁의 새로운 뇌관이 될지 주목된다.`,
  keyTerms:[{term:`수출 통제`,explanation:`국가 안보나 외교적 목적을 위해 특정 기술이나 제품을 다른 나라로 수출하지 못하게 정부가 막는 조치입니다.`}],
  history:`엔비디아는 AI 열풍을 타고 글로벌 반도체 시장의 독점적 강자로 군림해왔습니다. 그러나 미국 정부는 중국의 첨단 기술 굴기를 막기 위해 엄격한 대중국 수출 통제 정책을 펼치고 있습니다. 이러한 상황에서 양국 간의 기술 패권 다툼은 반도체 산업 전반에 큰 압박으로 작용해왔습니다.`,
  players:`사건의 중심에 선 엔비디아의 최고경영자와 그를 조사하는 미국 사법당국이 핵심 당사자입니다. 또한, 이에 직간접적으로 영향을 받는 중국의 주요 빅테크 기업들이 얽혀 있습니다. 한국의 삼성전자와 SK하이닉스 등 파운드리 및 메모리 파트너사들도 사태를 주시하고 있습니다.`,
  current:`최고경영자의 사생활 스캔들이 중국 스파이 의혹으로 번지면서 미국 정치권의 독립 수사 요구가 관철된 상황입니다. 이로 인해 엔비디아의 차세대 칩 공급 일정과 주가에 상당한 불안정성이 생겨났습니다.`,
  outlook:`조사 결과에 따라 미국의 대중국 반도체 규제가 전례 없는 수준으로 강화될 수 있습니다. 한국 반도체 기업들은 공급망 재편의 위기를 기회로 삼기 위한 비상 대응 체제를 가동할 것으로 예상됩니다.`,
  sources:[{title:`엔비디아 악재에 출렁이는 반도체 시장 - 한국경제`,url:`https://www.hankyung.com/economy/article/202611090001`},{title:`미중 기술패권 전쟁, 새 국면 맞나 - 조선일보`,url:`https://biz.chosun.com/site/data/html_dir/2026/11/09/2026110900001.html`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 '블루 쓰나미' 여파로 고환율 지속 및 원자재 부담 가중`,
  metrics:[`원·달러 환율 1,420원대 유지`,`철강·석유화학 원가 부담 15% 상승`],
  summary:`미국 중간선거에서 민주당이 압승하는 이른바 '블루 쓰나미'가 발생하며 글로벌 금융시장이 요동치고 있다. 대규모 재정 지출 확대로 인한 인플레이션 우려가 커지면서 강달러 현상이 지속 중이다. 원·달러 환율은 1,420원대를 넘나들며 수입 물가 상승을 압박하고 있다. 반도체나 조선업 등 수출 주력 산업은 가격 경쟁력 측면에서 수혜가 기대되지만, 철강 및 석유화학 업계는 막대한 원가 부담에 직면했다. 당분간 미국의 재정 정책 기조가 명확해지기 전까지 국내 증시와 외환시장의 변동성은 피하기 어려울 전망이다. 글로벌 투기 자본의 움직임도 외환시장 변동성을 더욱 키우는 요인으로 작용하고 있다.`,
  keyTerms:[{term:`강달러 현상`,explanation:`미국 달러화의 가치가 다른 국가의 통화에 비해 상대적으로 강세를 보이는 현상을 말합니다.`}],
  history:`최근 치러진 미국 중간선거에서 민주당이 상하원을 모두 장악하는 압승을 거두었습니다. 이전 정권의 감세 및 규제 완화 기조와 대비되는 대규모 친환경 및 인프라 재정 지출이 예고되었습니다. 이러한 정치적 지형 변화는 글로벌 거시 경제와 외환시장에 즉각적인 파급을 미쳤습니다.`,
  players:`미국 행정부와 민주당 지도부는 공격적인 재정 정책을 밀어붙이고 있습니다. 이에 대응하여 미국 연방준비제도(Fed)는 인플레이션 우려로 통화 정책의 방향성을 고심 중입니다. 한국을 비롯한 신흥국 수출 기업들은 원자재 가격 변동에 직접적인 영향을 받고 있습니다.`,
  current:`막대한 달러 유동성 방출 우려와 맞물려 원·달러 환율이 1,420원대까지 치솟았습니다. 글로벌 금융시장에서는 안전자산 선호 심리와 함께 투기적 자본의 이동이 활발해지고 있습니다.`,
  outlook:`내년 초 미국 새 의회가 개원하며 구체적인 예산안이 윤곽을 드러내기 전까지 외환시장의 널뛰기는 계속될 전망입니다. 국내 기업들은 환율 변동성 리스크를 회피하기 위한 적극적인 환헤지 전략을 강구할 것입니다.`,
  sources:[{title:`블루 쓰나미가 덮친 환율, 1420원 돌파 - 중앙일보`,url:`https://www.joongang.co.kr/article/202611090001`},{title:`고환율에 속타는 철강업계 - SBS`,url:`https://news.sbs.co.kr/news/endPage.do?news_id=N202611090001`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`야당 주도 '조작기소 특검법' 본회의 통과로 정국 급랭`,
  metrics:[`본회의 찬성 192표`,`장외투쟁 참여 인원 추산 5만 명`],
  summary:`거대 야당 주도로 이른바 '조작기소 특검법'이 국회 본회의를 통과하면서 여야 간 대치가 극에 달하고 있다. 야당은 검찰의 편파적 수사를 바로잡아야 한다며 단독 처리를 강행했다. 반면 여당은 이를 '대통령 방탄용 특검'으로 규정하고 즉각적인 장외투쟁 및 청와대 앞 시위에 돌입했다. 대통령의 재의요구권(거부권) 행사가 기정사실화되는 가운데, 정기국회 일정 파행이 불가피해졌다. 민생 법안과 예산안 처리 등 산적한 과제들이 뒷전으로 밀릴 수 있다는 우려가 커지고 있다. 양측의 강 대 강 대치는 내년 재보궐 선거까지 이어질 가능성이 높다.`,
  keyTerms:[{term:`재의요구권`,explanation:`국회에서 통과된 법안에 이의가 있을 때 대통령이 이를 거부하고 국회로 돌려보내 다시 심의해 줄 것을 요구하는 권한입니다.`}],
  history:`과거부터 정치권에서는 검찰의 수사 공정성을 둘러싼 공방이 끊이지 않았습니다. 최근 불거진 특정 사건들에 대해 야당은 검찰이 정치적 의도를 가지고 조작 기소를 했다고 주장해왔습니다. 이에 맞서 여당은 정당한 법 집행을 가로막는 정치 공세라고 반박하며 갈등의 골이 깊어졌습니다.`,
  players:`수적 우위를 앞세워 특검법을 통과시킨 거대 야당이 공세를 주도하고 있습니다. 방어에 나선 국민의힘과 거부권 행사를 저울질하는 대통령실이 대립각을 세우고 있습니다. 수사 대상에 오를 위기에 처한 검찰 조직도 상황을 예의주시하고 있습니다.`,
  current:`야당 단독으로 본회의에서 특검법이 처리되면서 여야의 공식적인 대화 채널은 모두 단절되었습니다. 여당은 즉각적인 장외 집회로 지지층 결집에 나서며 정국이 급격히 얼어붙었습니다.`,
  outlook:`대통령이 특검법에 대해 재의요구권을 행사할 경우 국회에서 재표결이 이루어지며 극한 대립이 절정에 달할 것입니다. 다가오는 예산안 처리와 핵심 민생 법안들도 볼모로 잡혀 장기 파행이 예상됩니다.`,
  sources:[{title:`특검법 본회의 통과, 멈춰선 국회 - 한겨레`,url:`https://www.hani.co.kr/arti/politics/assembly/202611090001.html`},{title:`여당, 청와대 앞 철야 시위 예고 - MBC`,url:`https://imnews.imbc.com/news/2026/politics/article/202611090001.html`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`820조 원 규모 내년도 예산안 국회 부처별 심사 돌입`,
  metrics:[`2027년 예산안 820조 원`,`연구개발(R&D) 예산 12% 증액`],
  summary:`국회 예산결산특별위원회가 820조 원 규모의 내년도 예산안에 대한 부처별 세부 심사에 착수했다. 이번 예산안은 저출생 극복과 미래 성장 동력 확보에 중점을 두고 편성되었다. 특히 연구개발(R&D) 예산이 대폭 복원되어 전년 대비 12% 증액된 점이 눈에 띈다. 그러나 특검 정국으로 인한 여야 대립 탓에 예산안 심사가 순조롭게 진행될지는 미지수다. 야당은 정부의 특수활동비와 일부 낭비성 예산을 대폭 삭감하겠다고 예고했다. 법정 처리 기한을 넘길 경우 사상 초유의 예산 집행 지연 사태가 벌어질 수 있다.`,
  keyTerms:[{term:`특수활동비`,explanation:`기밀 유지가 요구되는 수사나 정보 수집 등의 국정 수행 활동에 쓰이는 예산으로, 사용처 증빙이 비교적 엄격하지 않은 돈입니다.`}],
  history:`정부의 예산안은 매년 국가의 정책 방향과 재원 배분의 우선순위를 보여주는 핵심 지표입니다. 지난 몇 년간 재정 건전성을 강조하며 예산 증가율을 억제해 온 기조가 유지되었습니다. 그러나 경제 침체 우려와 미래 기술 투자 필요성이 제기되면서 일부 분야에 대한 과감한 투자가 요구되어 왔습니다.`,
  players:`820조 원 규모의 예산안을 짠 기획재정부 등 행정부처와 이를 심사하는 국회 예산결산특별위원회가 핵심 주체입니다. 지역구 예산을 확보하려는 여야 국회의원들의 이해관계가 얽혀 있습니다. 예산 증액을 요구하는 과학기술계 및 시민단체들도 장외에서 목소리를 내고 있습니다.`,
  current:`본격적인 부처별 심사가 시작되었으나, 정치적 이슈로 인한 여야 충돌로 회의가 자주 파행을 겪고 있습니다. 야당은 정부의 특수활동비 삭감을 벼르고 있어 예산안 처리 과정에 난항이 이어지고 있습니다.`,
  outlook:`예산안의 헌법상 법정 처리 기한 내 통과는 사실상 불가능해졌다는 관측이 우세합니다. 연말까지 막판 밀실 타협을 통한 '예산 쪼개기' 관행이 재현될 가능성이 높습니다.`,
  sources:[{title:`820조 예산 심사 첫날부터 파행 - KBS`,url:`https://news.kbs.co.kr/news/view.do?ncd=202611090001`},{title:`R&D 예산 대폭 증액, 심사 통과할까 - 매일경제`,url:`https://www.mk.co.kr/news/politics/202611090002`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`1가구 1주택 종부세 14억 공제안 두고 당청 갈등 심화`,
  metrics:[`종부세 공제액 14억 원`,`혜택 예상 가구 약 15만 가구`],
  summary:`종합부동산세의 1세대 1주택 기본공제액을 14억 원으로 상향하는 방안을 놓고 여당과 청와대 간의 갈등이 수면 위로 떠올랐다. 여당은 다가오는 지방선거와 부동산 민심을 의식해 비거주 1주택자에게도 완화된 기준을 적용해야 한다고 주장한다. 반면 청와대는 조세 형평성과 부동산 시장 자극 우려를 들어 수용 불가 입장을 고수하고 있다. 이로 인해 당청 간의 정책 조율 기능이 삐걱거리고 있다는 지적이 나온다. 최종 타협안 도출에 실패할 경우, 법안 처리가 무산되어 혼란이 야기될 수 있다. 정치권의 부동산 세제 셈법이 더욱 복잡해지는 양상이다.`,
  keyTerms:[{term:`종합부동산세`,explanation:`일정 금액을 초과하는 부동산(토지와 주택)을 보유한 사람에게 그 초과분에 대해 매년 부과하는 세금입니다.`}],
  history:`종합부동산세는 도입 초기부터 부유세 논란과 조세 전가 문제로 정치권의 뜨거운 감자였습니다. 부동산 가격이 급등했던 시기를 거치며 중산층의 조세 부담이 커졌다는 불만이 팽배해졌습니다. 이에 여야를 막론하고 선거철마다 종부세 완화 카드가 단골 메뉴로 등장했습니다.`,
  players:`부동산 민심을 달래어 선거에서 승리하려는 여당 지도부가 완화 정책을 강하게 밀어붙이고 있습니다. 반면, 세수 부족과 부동산 시장 자극을 우려하는 기획재정부와 청와대는 신중론을 폅니다. 세금 감면의 직접적인 수혜를 기대하는 1주택 보유 유권자들도 중요한 플레이어입니다.`,
  current:`1가구 1주택 기본공제액을 14억 원으로 높이는 안을 두고 당정 간의 의견 차이가 공식적인 충돌로 표출되었습니다. 부동산 정책의 컨트롤타워가 흔들리며 시장에 잘못된 시그널을 줄 수 있다는 우려가 제기됩니다.`,
  outlook:`당정청이 극적인 타협점을 찾지 못한다면 해당 법안은 폐기되거나 축소된 형태로 수정될 것입니다. 이 갈등은 내년 지방선거를 앞두고 여권 내부의 주도권 다툼으로 비화될 소지가 큽니다.`,
  sources:[{title:`종부세 14억 룰, 당청 이견 팽팽 - 연합뉴스`,url:`https://www.yna.co.kr/view/AKR202611090002`},{title:`부동산 세제 딜레마에 빠진 여당 - 중앙일보`,url:`https://www.joongang.co.kr/article/202611090002`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`내년 초등학교 입학생 20만 명대 붕괴 가시화`,
  metrics:[`2027학년도 초등 입학생 19만 8천 명 예상`,`전국 폐교 위기 초등학교 1,200곳`],
  summary:`극심한 저출생의 여파로 내년 초등학교 입학생 수가 사상 처음으로 20만 명 선을 밑돌 전망이다. 교육부 추산에 따르면 내년도 신입생은 약 19만 8천 명 수준에 그칠 것으로 예상된다. 이는 학령인구 감소가 교육 현장에 미치는 충격이 본격화되었음을 의미한다. 지방뿐만 아니라 수도권 일부 지역에서도 통폐합이나 폐교 위기에 처한 학교가 급증하고 있다. 교원 수급 계획 및 유휴 교실 활용 등 전면적인 교육 시스템 개편이 시급한 상황이다. 인구 절벽이 초래할 사회적 인프라 축소에 대한 범국가적 대책 마련이 요구된다.`,
  keyTerms:[{term:`학령인구`,explanation:`초등학교, 중학교, 고등학교, 대학교에 다닐 연령대(일반적으로 만 6세에서 21세 사이)의 인구를 뜻합니다.`}],
  history:`한국의 저출생 문제는 수십 년간 누적된 구조적 위기로, 합계출산율이 매년 최저치를 경신하고 있습니다. 과거 60만 명에 달하던 신생아 수는 불과 십여 년 만에 반토막이 났습니다. 그 결과 어린이집과 유치원의 연쇄 폐원에 이어 이제는 초등학교마저 존립의 기로에 섰습니다.`,
  players:`학생 수 감소로 골머리를 앓는 일선 학교와 지역 교육청이 가장 큰 위기를 체감하고 있습니다. 대책을 마련해야 하는 교육부와 저출산고령사회위원회 등 정부 부처의 책임도 막중합니다. 자녀의 학습권 침해를 우려하는 학부모들의 불안감도 커지고 있습니다.`,
  current:`내년 초등학교 입학생이 19만 명대로 떨어질 것이 확실시되면서 교육 현장은 전례 없는 충격에 빠졌습니다. 일부 지자체에서는 학교 통폐합을 둘러싸고 주민들과 교육 당국 간의 마찰이 빚어지고 있습니다.`,
  outlook:`단기적으로는 빈 교실을 활용한 늘봄학교 확대나 복합 문화시설 전환이 추진될 것입니다. 장기적으로는 교원 양성 규모 축소와 소규모 학교 운영 기준의 대대적인 개편이 불가피할 전망입니다.`,
  sources:[{title:`초등학교 입학생 20만 명 무너진다 - 조선일보`,url:`https://biz.chosun.com/site/data/html_dir/2026/11/09/2026110900002.html`},{title:`텅 빈 교실, 벼랑 끝에 선 교육 인프라 - SBS`,url:`https://news.sbs.co.kr/news/endPage.do?news_id=N202611090002`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`기습적인 초겨울 추위와 강원 산지 때이른 첫눈`,
  metrics:[`서울 아침 최저기온 1도`,`강원 산지 적설량 5cm`],
  summary:`예년보다 한 달가량 일찍 찾아온 기습적인 초겨울 추위로 전국이 얼어붙었다. 북서쪽에서 남하한 찬 대륙고기압의 영향으로 서울의 아침 최저기온이 1도까지 떨어졌다. 강원 산지 지역에는 5cm 안팎의 때이른 첫눈이 내려 도로가 통제되는 등 불편이 잇따랐다. 기상청은 올겨울 기후변화로 인해 기온 변동성이 크고 극단적인 한파가 잦을 것으로 내다봤다. 갑작스러운 추위에 난방 수요가 급증하며 전력 당국도 수급 비상 체제에 돌입했다. 농작물 냉해 피해와 취약계층의 월동 준비에 각별한 주의가 필요하다.`,
  keyTerms:[{term:`찬 대륙고기압`,explanation:`시베리아 등 차갑고 건조한 대륙 위에서 형성된 고기압으로, 겨울철 한반도에 맹추위를 몰고 오는 주요 원인입니다.`}],
  history:`한반도의 늦가을과 초겨울은 보통 점진적인 기온 강하를 보이지만, 최근 기후변화로 인해 계절의 경계가 모호해지고 있습니다. 북극의 해빙 감소로 갇혀 있던 찬 공기가 제트기류를 뚫고 중위도로 쏟아져 내리는 현상이 잦아졌습니다. 이로 인해 11월 초순부터 극단적인 한파가 찾아오는 기상이변이 반복되고 있습니다.`,
  players:`급변하는 날씨를 예측하고 경고해야 하는 기상청과 재난 대응 부처가 바쁘게 움직이고 있습니다. 갑작스러운 전력 수요 급증에 대비해야 하는 전력거래소와 한국전력도 긴장 상태입니다. 야외에서 조업하는 농어민과 난방 취약계층은 가장 큰 피해를 입는 당사자입니다.`,
  current:`서울의 기온이 1도까지 떨어지고 강원 산간에 첫눈이 내리는 등 전국이 꽁꽁 얼어붙었습니다. 농촌에서는 수확을 앞둔 농작물이 냉해를 입을까 비상이 걸렸습니다.`,
  outlook:`기상 당국은 올겨울 내내 잦은 기온 하강과 폭설이 번갈아 나타날 것으로 예보하고 있습니다. 기습 한파에 대비한 범정부 차원의 동절기 에너지 수급 및 취약계층 보호 대책이 앞당겨 시행될 것입니다.`,
  sources:[{title:`11월 초순에 찾아온 한겨울 추위 - KBS`,url:`https://news.kbs.co.kr/news/view.do?ncd=202611090002`},{title:`강원 산지에 쏟아진 때이른 첫눈 - MBC`,url:`https://imnews.imbc.com/news/2026/society/article/202611090002.html`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`COP31 튀르키예 안탈리아서 개막, 기후 펀드 조성 진통`,
  metrics:[`기후 손실과 피해 기금 1천억 달러 목표`,`참가국 198개국`],
  summary:`제31차 유엔기후변화협약 당사국총회(COP31)가 튀르키예 안탈리아에서 공식 개막했다. 이번 총회에는 198개국 대표단이 모여 기후변화 대응을 위한 새로운 국제적 합의를 모색한다. 가장 큰 쟁점은 개도국의 '기후 손실과 피해'를 보상하기 위한 1천억 달러 규모의 펀드 조성 방안이다. 선진국과 개도국 간의 재원 분담 비율을 놓고 팽팽한 줄다리기가 이어지며 협상 초반부터 진통을 겪고 있다. 또한 이번 회의에서는 호주가 협상 의장직을 공동으로 수행하여 새로운 형태의 기후 외교 파트너십을 선보인다. 향후 2주간 탄소 배출 감축을 위한 구체적인 액션 플랜이 도출될 수 있을지 전 세계의 이목이 집중된다.`,
  keyTerms:[{term:`기후 손실과 피해`,explanation:`기후변화로 인해 발생하는 해수면 상승, 가뭄, 홍수 등 인간과 자연이 입는 경제적, 비경제적 타격을 의미합니다.`}],
  history:`유엔기후변화협약 당사국총회(COP)는 전 세계가 모여 지구 온난화를 막기 위한 해법을 논의하는 최고 권위의 회의체입니다. 파리기후협약 이후 탄소 배출 감축 목표를 설정해왔으나, 개도국들은 기후변화의 피해를 억울하게 떠안고 있다며 보상을 요구해왔습니다. 최근 몇 년간 이 '기후 손실과 피해' 보상 기금의 구체적 조성 방안이 최대 화두로 부상했습니다.`,
  players:`막대한 자본을 내놓아야 하는 미국, 유럽연합 등 선진국 그룹과 빠른 보상을 촉구하는 섬나라 및 개도국 그룹이 첨예하게 맞서고 있습니다. 회의를 주재하는 튀르키예와 협상 의장직을 맡은 호주가 중재자 역할을 담당합니다. 다국적 환경 단체들은 강력한 합의 도출을 압박하고 있습니다.`,
  current:`안탈리아에서 개막한 COP31 현장에서는 1천억 달러 기금 조성을 위한 구체적인 분담 비율을 놓고 난상토론이 벌어지고 있습니다. 각국의 복잡한 경제적 이해관계 탓에 타결이 쉽지 않은 상황입니다.`,
  outlook:`남은 2주간의 협상 동안 주요국 정상들의 정치적 결단이 없다면 반쪽짜리 합의에 그칠 우려가 있습니다. 다만 온실가스 감축을 위한 민간 투자를 유도하는 새로운 금융 모델이 대안으로 제시될 가능성도 열려 있습니다.`,
  sources:[{title:`COP31 안탈리아서 개막... 험난한 협상 예고 - 연합뉴스`,url:`https://www.yna.co.kr/view/AKR202611090003`},{title:`기후 손실과 피해 보상, 팽팽한 줄다리기 - 한겨레`,url:`https://www.hani.co.kr/arti/society/environment/202611090003.html`}]
}]
},{
  tag:`2026-11-08`,
  label:`2026년 11월 8일 (일)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`국내 대형 증권사 연쇄 해킹으로 3만 명 정보 유출… 금융당국 긴급 점검`,
  metrics:[`유출 피해 3만 명 이상`,`외국인 투자자 12주 만에 순매도`],
  summary:`미래에셋증권 등 국내 주요 대형 증권사들이 연쇄적인 사이버 공격을 받아 비상이 걸렸습니다. 현재까지 파악된 고객 개인정보 유출 피해 규모만 3만 명을 넘어선 것으로 확인되었습니다. 이번 사태는 최근 고도화된 AI 기반 해킹 툴이 사용된 것으로 추정되며, 기존 방어망이 쉽게 뚫렸다는 점에서 충격을 주고 있습니다. 금융당국은 사태의 심각성을 인지하고 업계 보안 책임자들을 긴급 소집해 전면적인 실태 점검에 착수했습니다. 특히 이번 사건이 주식 시장의 불안 심리를 자극하며, 외국인 투자자들이 12주 만에 대규모 순매도로 돌아서는 등 시장 전반에 악영향을 미치고 있습니다. 업계에서는 강력한 보안 정책인 망분리 규제를 다시 강화해야 한다는 목소리가 커지고 있습니다. 향후 피해 규모가 눈덩이처럼 불어날 수 있어 투자자들의 각별한 주의가 요구됩니다.`,
  keyTerms:[{term:`망분리 규제`,explanation:`금융사가 해킹을 막기 위해 외부 인터넷망과 내부 업무망을 물리적, 논리적으로 분리하도록 강제하는 강력한 보안 정책입니다. 최근 완화 흐름을 보였으나 이번 사태로 다시 강화될 조짐을 보이고 있습니다.`}],
  history:`한국의 금융권은 과거 대규모 카드사 정보 유출 사태 이후 전 세계에서 가장 강력한 보안 규제를 적용해 왔습니다. 하지만 클라우드 도입과 개발 편의성을 위해 최근 몇 년간 내부망과 외부망을 연결하는 규제 완화가 추진되었습니다. 보안 업계는 이러한 완화 조치가 잠재적인 사이버 위협을 키울 수 있다고 꾸준히 경고해 왔습니다.`,
  players:`주요 피해자인 대형 증권사들은 고객 신뢰 하락과 대규모 소송 가능성에 직면해 있습니다. 금융위원회와 금융감독원은 사태 수습과 재발 방지 대책 마련의 총책임을 맡고 대응 중입니다. 개인정보가 유출된 수만 명의 투자자들은 집단 소송을 준비하며 강하게 반발하고 있습니다.`,
  current:`현재 해커들의 정확한 신원과 공격 경로는 완전히 파악되지 않았으며, 다크웹을 통한 2차 피해 우려가 최고조에 달해 있습니다. 당국은 모든 금융권에 최고 수준의 경계 태세를 발령하고 추가 피해를 막는 데 주력하고 있습니다.`,
  outlook:`다음 주 중으로 금융감독원의 1차 합동 조사 결과가 공식 발표될 예정입니다. 조사 결과에 따라 금융권 전체의 보안 인프라 투자 의무화와 강력한 제재 조치가 이어질 것으로 전망됩니다.`,
  sources:[{title:`잇따른 증권사 해킹에 당국 긴급 소집 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`정보 유출 여파로 증시 변동성 확대 - 인포맥스`,url:`https://news.einfomax.co.kr/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미 의회 발 슈퍼 관세 우려에 글로벌 기술주 휘청… 韓 증시 직격탄`,
  metrics:[`나스닥 3.2% 급락`,`보편 관세 10% 상향 검토`],
  summary:`미국 새 행정부와 의회가 강력한 보호무역주의 정책을 예고하면서 글로벌 금융시장이 크게 출렁이고 있습니다. 미국 의회 내에서 모든 수입품에 일괄 적용되는 보편 관세율을 대폭 상향하는 법안이 구체적으로 논의되고 있다는 소식이 전해졌습니다. 이에 따라 글로벌 교역 위축과 기업 실적 악화 우려가 확산되며 나스닥 등 주요 기술주가 일제히 급락세를 보였습니다. 특히 수출 의존도가 높은 한국 증시는 반도체와 자동차 대장주를 중심으로 매물 폭탄이 쏟아지며 직격탄을 맞았습니다. 월가 전문가들은 관세 인상이 현실화될 경우 글로벌 공급망 전체가 멈춰 설 수 있다고 경고하고 있습니다. 환율 변동성까지 극심해지면서 각국 중앙은행들의 셈법도 매우 복잡해진 상황입니다. 당분간 미국발 정책 불확실성이 글로벌 증시의 최대 뇌관으로 작용할 전망입니다.`,
  keyTerms:[{term:`보편 관세`,explanation:`특정 국가나 품목을 가리지 않고 미국으로 수입되는 모든 물품에 대해 일괄적으로 매기는 관세입니다. 무역 장벽을 극단적으로 높여 글로벌 공급망 전체에 타격을 줄 수 있는 정책입니다.`}],
  history:`미국은 과거부터 자국 산업 보호를 위해 관세 정책을 활용해 왔으나, 최근 들어 그 수위가 전례 없이 높아지고 있습니다. 글로벌 공급망 재편과 자국 우선주의가 정치적 핵심 의제로 자리 잡으면서 무역 장벽이 빠르게 견고해지는 추세입니다. 동맹국과 적성국을 가리지 않는 무차별적 통상 압박이 세계 무역 기조의 뉴노멀로 굳어지고 있습니다.`,
  players:`미국의 새 행정부와 강경파 의원들은 무역 적자 해소와 일자리 창출을 명분으로 강력한 관세 카드를 밀어붙이고 있습니다. 반면 수출 중심의 아시아 국가들과 유럽연합은 보복 관세를 경고하며 강력하게 반발 중입니다. 글로벌 다국적 기업들은 비용 상승과 이익률 감소 위기에 처해 로비 총력전에 나섰습니다.`,
  current:`관세 인상안이 구체화되면서 글로벌 자금은 위험 자산인 주식에서 빠져나와 달러와 금 등 안전 자산으로 빠르게 이동하고 있습니다. 시장의 공포 심리가 극에 달하며 하루 만에 수십조 원의 시가총액이 증발하는 사태가 벌어지고 있습니다.`,
  outlook:`다음 달 예정된 미국 통상대표부의 공식 정책 발표에 전 세계의 이목이 쏠려 있습니다. 실제 관세율이 확정되면 주요 수출국들의 대미 수출 전략과 경제 성장률 전망치가 줄하향될 가능성이 매우 높습니다.`,
  sources:[{title:`US Tariffs Threaten Global Supply Chains - Bloomberg`,url:`https://www.bloomberg.com/`},{title:`Tech Stocks Plunge on Trade Fears - Reuters`,url:`https://www.reuters.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`국제 유가 안정에도 체감 물가는 고공행진… 한은, 금리 인하 딜레마`,
  metrics:[`근원물가 상승률 2.8%`,`생활물가지수 3.1% 상승`],
  summary:`국제 유가와 원자재 가격이 하락 안정세를 보이고 있음에도 불구하고 국내 소비자들의 체감 물가는 여전히 꺾이지 않고 있습니다. 특히 매일 소비하는 밥상 물가와 직결된 생활물가지수가 가파르게 오르며 서민 경제의 주름살을 깊게 만들고 있습니다. 물가의 기조적 흐름을 보여주는 근원물가 상승률도 2%대 후반에서 떨어지지 않으며 끈적한 인플레이션 양상을 보이고 있습니다. 이처럼 물가 안정 목표 달성이 지연되면서 한국은행의 통화 정책 셈법도 심각한 딜레마에 빠졌습니다. 내수 침체를 막기 위해 금리를 인하해야 한다는 압박이 크지만, 섣부른 인하가 다시 물가를 자극할 수 있기 때문입니다. 시장에서는 연내 추가 금리 인하 기대감이 빠르게 식어가며 대출 금리 상승으로 이어지고 있습니다. 당분간 팍팍한 살림살이와 고금리 기조가 겹치는 이중고가 지속될 것으로 우려됩니다.`,
  keyTerms:[{term:`근원물가`,explanation:`계절적 요인이나 외부 충격에 따라 가격 변동이 심한 농산물과 석유류를 제외하고 측정한 물가 지수입니다. 국가 경제의 기초적이고 장기적인 물가 흐름을 진단하는 핵심 지표로 쓰입니다.`}],
  history:`한국은 지난 몇 년간 글로벌 공급망 차질과 막대한 유동성 공급의 여파로 극심한 인플레이션을 경험했습니다. 최근 정부의 강력한 물가 억제 정책으로 헤드라인 지표는 안정을 찾았으나, 누적된 비용 인상 압박이 서비스와 가공식품으로 전이되었습니다. 이로 인해 한 번 오른 가격이 좀처럼 떨어지지 않는 현상이 고착화되었습니다.`,
  players:`한국은행은 물가 안정이라는 최우선 목표와 내수 부양 사이에서 아슬아슬한 줄타기를 하고 있습니다. 서민층과 자영업자들은 고물가와 높은 이자 부담에 시달리며 정부의 실질적인 지원을 촉구하고 있습니다. 기획재정부는 각종 할당 관세 인하와 재정 투입을 통해 밥상 물가를 잡으려 총력전을 펴고 있습니다.`,
  current:`체감 물가와 지표 물가의 괴리가 커지면서 국민들의 불만이 팽배해진 상황입니다. 특히 겨울철을 앞두고 난방비 등 필수 공공요금 인상 우려까지 겹쳐 소비 심리가 꽁꽁 얼어붙고 있습니다.`,
  outlook:`한국은행은 다음 금융통화위원회에서 물가와 가계부채 동향을 종합적으로 판단해 금리 방향을 최종 결정할 예정입니다. 만약 물가 상승 압력이 지속될 경우 내년 상반기까지 금리 동결 기조가 장기화될 수 있다는 관측이 지배적입니다.`,
  sources:[{title:`끈적한 근원물가에 한은 금리인하 고심 - 매일경제`,url:`https://www.mk.co.kr/`},{title:`유가 하락에도 장바구니 물가는 치솟아 - 한국경제`,url:`https://www.hankyung.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미·러·우크라, 아부다비서 3자 회담 돌입… 2년 9개월 만의 종전 테이블`,
  metrics:[`종전 협상안 3개 조항`,`군사 지원금 40% 삭감 유예`],
  summary:`러시아와 미국, 우크라이나의 고위급 대표단이 다음 주 아부다비에서 전격적인 3자 회담을 갖습니다. 이번 만남은 전쟁 발발 2년 9개월 만에 성사된 첫 공식 평화 협상 테이블로 전 세계의 이목을 집중시키고 있습니다. 미국 새 행정부의 강한 압박 속에서 마련된 이번 회담에서는 영토 할양과 안보 보장 체제가 핵심 의제로 다뤄질 전망입니다. 특히 현재 군대가 대치 중인 전선을 굳히는 현상 유지 휴전 방안이 유력하게 논의되고 있는 것으로 알려졌습니다. 우크라이나는 자국 영토의 완전한 회복을 요구하며 이 방안에 강하게 반발하고 있어 치열한 기싸움이 예상됩니다. 만약 극적인 타결이 이뤄진다면 글로벌 지정학적 지형은 물론 원자재와 에너지 시장에도 거대한 지각 변동이 일어날 것입니다. 전쟁의 향방을 가를 운명의 일주일에 국제사회가 숨죽이고 있습니다.`,
  keyTerms:[{term:`현상 유지 휴전`,explanation:`현재 양측 군대가 물리적으로 대치하고 있는 전선을 그대로 임시 국경으로 삼아 전투를 즉각 중단하는 방식입니다. 빼앗긴 영토 반환을 요구하는 쪽에서 가장 받아들이기 힘든 타협안입니다.`}],
  history:`2022년 초 시작된 우크라이나 전쟁은 양측 모두 결정적인 승리를 거두지 못한 채 끔찍한 참호전 양상으로 장기화되었습니다. 그동안 수많은 비공식 접촉이 있었으나 영토 문제에 대한 이견을 좁히지 못해 번번이 결렬되었습니다. 전쟁 장기화로 인한 서방의 피로감과 미국의 리더십 교체가 맞물리며 협상의 돌파구가 열리게 되었습니다.`,
  players:`러시아는 점령지 영구 편입과 서방의 제재 해제를 목표로 협상 우위를 주장하고 있습니다. 우크라이나는 잃어버린 영토 탈환과 강력한 안보 보장 없이는 굴욕적인 휴전을 받아들일 수 없다는 입장입니다. 미국은 천문학적인 지원금 부담을 덜기 위해 양측을 압박하며 중재자 역할을 자처하고 있습니다.`,
  current:`각국은 협상 테이블에 앉기 직전까지 유리한 고지를 점하기 위해 전선에서 최후의 대규모 공세를 벌이고 있습니다. 외교적 물밑 접촉과 군사적 충돌이 최고조에 이른 매우 위태로운 국면이 전개되고 있습니다.`,
  outlook:`아부다비 회담에서 기본적인 교전 중단 원칙에 합의할 경우, 연말에는 정상급 회담으로 격상될 가능성이 열려 있습니다. 하지만 이견이 워낙 커 협상이 결렬될 경우, 통제 불능의 전면전으로 다시 치달을 위험도 상존합니다.`,
  sources:[{title:`Russia, US, Ukraine to hold tripartite talks - Reuters`,url:`https://www.reuters.com/`},{title:`Historic peace talks set in Abu Dhabi - BBC`,url:`https://www.bbc.com/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`트럼프, 신임 비서실장에 강경파 밀러 지명… 초강경 이민 정책 예고`,
  metrics:[`불법 이민자 추방 예산 20% 증액`,`행정명령 50여 개 즉각 발동`],
  summary:`미국 트럼프 대통령이 새 백악관 조직의 핵심인 대통령 비서실장 자리에 최측근 강경파인 스티븐 밀러를 공식 지명했습니다. 밀러는 과거 트럼프 1기 행정부 시절부터 무관용 이민 정책과 주요 국정 과제를 직접 설계한 인물로 꼽힙니다. 이번 인사는 새 행정부가 출범과 동시에 전례 없이 강력한 국경 통제와 내부 단속에 나설 것임을 명확히 보여줍니다. 실제로 취임 첫날 발동될 수십 개의 행정명령 목록이 이미 완성되었으며, 대규모 추방을 위한 국토안보부 예산 증액도 본격화되고 있습니다. 밀러의 전면 배치로 백악관 내부의 권력 지형이 극우 강경파 중심으로 재편될 것이라는 분석이 지배적입니다. 이로 인해 미국 내 이민자 사회의 불안감이 극도로 고조되고 있으며 인권 단체들의 강력한 반발이 일고 있습니다. 향후 미국 내 정치적 양극화와 사회적 갈등이 더욱 격화될 것으로 우려됩니다.`,
  keyTerms:[{term:`대통령 비서실장`,explanation:`미국 대통령의 공식 일정을 관리하고 백악관 참모진을 총괄하는 서열 1위의 수석 보좌관입니다. 정책 결정에 막강한 영향력을 행사해 미국의 2인자이자 문고리 권력으로 불립니다.`}],
  history:`미국의 이민 정책은 역대 행정부마다 온건파와 강경파 사이를 오가며 극심한 진자 운동을 해왔습니다. 트럼프 전 대통령은 선거 기간 내내 국경 안보와 불법 이민자 척결을 핵심 공약으로 내세워 지지층을 결집시켰습니다. 이번 인사는 선거 공약을 한 치의 타협 없이 강행하겠다는 분명한 정치적 선언입니다.`,
  players:`스티븐 밀러 신임 비서실장은 타협을 모르는 강경 이민 설계자로 악명 높으며 대통령의 두터운 신임을 받고 있습니다. 민주당과 진보 성향의 인권 단체들은 즉각적인 헌법 소원과 대규모 거리 시위를 예고하고 나섰습니다. 이민자 비중이 높은 각 주의 주지사들도 연방 정부의 조치에 불복종하려는 움직임을 보이고 있습니다.`,
  current:`대통령 당선인의 파격적인 인사가 속속 발표되면서 워싱턴 정가의 긴장감이 최고조에 달해 있습니다. 특히 밀러의 지명은 향후 국정 운영이 온건한 통합보다는 핵심 지지층 중심의 강경 노선으로 갈 것임을 시사합니다.`,
  outlook:`내년 공식 취임 직후 서명될 행정명령의 세부 내용이 공개되면 전국적인 규모의 법적 다툼이 벌어질 전망입니다. 국경 지역의 보안 강화와 대규모 이민자 단속 작전이 속도감 있게 전개될 것으로 보입니다.`,
  sources:[{title:`Stephen Miller named White House Chief of Staff - AP`,url:`https://apnews.com/`},{title:`Trump signals hardline immigration stance - NYT`,url:`https://www.nytimes.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`162조 미래대응기금 뇌관 된 내년도 예산안… 여야 대치에 국회 파행`,
  metrics:[`내년도 예산안 821조 원`,`기금 규모 162조 원`],
  summary:`정부가 제출한 821조 원 규모의 내년도 슈퍼 예산안 심사가 국회에서 여야의 극심한 충돌로 전면 파행을 겪고 있습니다. 이번 예산 전쟁의 최대 뇌관은 정부가 새롭게 조성하려는 162조 원 규모의 미래대응기금입니다. 여당은 저출산과 기후 위기 등 국가적 난제를 해결하기 위해 적기 예산 투입과 기금 조성이 필수적이라고 강력히 주장하고 있습니다. 반면 야당은 이 기금이 구체적인 사업 계획 없이 쌈짓돈처럼 쓰일 수 있다며 대국민 기만이자 심각한 재정 낭비라고 맞서고 있습니다. 양측의 입장이 팽팽히 맞서면서 상임위원회 심사부터 줄줄이 파행을 거듭하며 예산안 법정 처리 시한 준수가 사실상 물건너갔다는 비판이 나옵니다. 민생 경제가 어려운 상황에서 정치권이 정쟁에만 몰두하며 국가 예산을 볼모로 잡고 있다는 비판 여론이 들끓고 있습니다. 자칫 사상 초유의 준예산 사태가 벌어질 수 있다는 우려마저 제기되고 있습니다.`,
  keyTerms:[{term:`미래대응기금`,explanation:`저출산, 고령화, 기후변화 등 장기적인 국가 위기에 유연하게 대처하기 위해 정부가 신설하려는 대규모 특별 목적 기금입니다. 야당은 예산 통제를 우회하려는 꼼수라고 비판하고 있습니다.`}],
  history:`매년 연말이면 국회는 내년도 국가 예산을 두고 극심한 진통을 겪어왔습니다. 특히 올해는 세수 부족 현상이 심화되는 가운데, 대규모 신규 기금을 편성하려는 정부의 시도가 재정 건전성 논란에 불을 지폈습니다. 국회의 예산 심의권과 행정부의 편성권이 정면으로 부딪히는 모양새입니다.`,
  players:`정부와 여당은 미래 세대를 위한 불가피한 투자라며 야당의 대승적 협조를 압박하고 있습니다. 다수 의석을 차지한 거대 야당은 기금 전액 삭감과 책임자 문책을 요구하며 배수진을 쳤습니다. 민생 단체들은 정쟁을 멈추고 당장 시급한 취약계층 지원 예산부터 통과시키라고 촉구하고 있습니다.`,
  current:`국회 예산결산특별위원회는 연일 파행을 거듭하며 주요 소위원회 심사가 전면 중단된 상태입니다. 여야 원내대표 간 물밑 협상마저 성과 없이 끝나는 등 돌파구를 찾지 못하고 있습니다.`,
  outlook:`헌법상 예산안 처리 시한이 다가오고 있지만 연내 타결은 매우 비관적입니다. 만약 기한을 넘겨 준예산이 편성될 경우, 내년 초 정부의 주요 신규 사업이 전면 중단되는 사상 초유의 행정 마비가 발생할 수 있습니다.`,
  sources:[{title:`미래대응기금 공방에 예결위 파행 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`821조 슈퍼예산, 시한 내 처리 사실상 무산 - 조선일보`,url:`https://www.chosun.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`'무한 스크롤'이 청소년 망친다… 정부, 틱톡·인스타 맞춤형 추천 전면 제한 검토`,
  metrics:[`만 14세 미만 가입 제한`,`일일 이용 시간 2시간 상한제`],
  summary:`청소년들의 스마트폰 중독이 심각한 사회 문제로 대두되자 정부가 SNS 플랫폼에 대한 초강력 규제 카드를 빼들었습니다. 단순히 미성년자의 가입을 막는 것을 넘어, 과도한 몰입을 유도하는 무한 스크롤 기능과 맞춤형 추천 알고리즘 자체를 제한하는 법안이 본격적인 검토에 들어갔습니다. 전문가들은 끝없이 쏟아지는 자극적인 숏폼 콘텐츠가 청소년의 뇌 발달에 치명적인 악영향을 미친다고 강력히 경고해 왔습니다. 이번 규제안이 통과될 경우 틱톡이나 인스타그램 등 거대 플랫폼 기업들은 알고리즘을 전면 수정하고 미성년자 보호 장치를 의무적으로 도입해야 합니다. IT 업계는 혁신과 영업의 자유를 침해하는 과도한 사전 검열이라며 강하게 반발하는 반면, 학부모 단체는 만시지탄이라며 크게 환영하고 있습니다. 청소년 보호와 플랫폼 산업 발전이라는 두 가치가 정면으로 충돌하며 당분간 거센 사회적 논쟁이 불가피해 보입니다.`,
  keyTerms:[{term:`무한 스크롤`,explanation:`사용자가 화면을 아래로 내리면 끝없이 새로운 콘텐츠가 자동으로 로딩되어 화면에 나타나는 인터페이스 기술입니다. 앱에 더 오래 머물도록 유도해 중독성을 심화시키는 주범으로 지목됩니다.`}],
  history:`과거에는 주로 게임 셧다운제 등 PC 기반 콘텐츠가 규제 대상이었습니다. 그러나 최근 몇 년 사이 숏폼 동영상 플랫폼이 급성장하면서 청소년들의 팝콘 브레인 현상과 문해력 저하가 심각한 수준에 이르렀습니다. 이에 따라 전 세계적으로 SNS 중독을 질병 수준으로 통제해야 한다는 여론이 비등해졌습니다.`,
  players:`정부와 교육 당국은 청소년의 정신 건강 보호를 명분으로 전례 없이 강력한 플랫폼 규제안을 밀어붙이고 있습니다. 주요 글로벌 빅테크 기업들은 기술적 한계와 과도한 규제 조항을 이유로 강한 우려를 표명 중입니다. 학부모와 교원 단체는 이번 조치를 적극 환영하며 조속한 입법을 촉구하고 나섰습니다.`,
  current:`관련 부처 간의 협의가 막바지에 다다랐으며, 이르면 다음 주 중으로 종합적인 청소년 SNS 보호 가이드라인이 발표될 예정입니다. 국회에서도 여야 구분 없이 관련 법률 개정안이 앞다퉈 발의되고 있습니다.`,
  outlook:`새로운 규제가 도입되면 플랫폼 기업들은 막대한 비용을 들여 연령 인증과 맞춤형 알고리즘 필터링 시스템을 재구축해야 합니다. 이는 국내 IT 생태계 전반의 서비스 운영 방식에 커다란 지각 변동을 불러올 것입니다.`,
  sources:[{title:`청소년 SNS 셧다운제 부활하나 - 중앙일보`,url:`https://www.joongang.co.kr/`},{title:`알고리즘이 뇌 망친다… 정부 초강수 - KBS`,url:`https://news.kbs.co.kr/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`끝없는 전력 먹는 하마 AI 데이터센터… 글로벌 환경 규제 철퇴 맞나`,
  metrics:[`데이터센터 전력 소모량 45% 폭증`,`신규 인허가 심사 기간 2배 연장`],
  summary:`전 세계적인 인공지능 열풍으로 AI 데이터센터 건립이 폭증하면서 막대한 전력과 용수 고갈 문제가 글로벌 핫이슈로 떠올랐습니다. 초대형 언어 모델 학습과 운영에 필요한 전력 소모량이 단기간에 45% 이상 급증하자 주요 선진국들이 환경 규제에 나섰습니다. 미국과 유럽의 여러 지자체들은 전력망 과부하와 수자원 오염을 이유로 신규 데이터센터 건축 허가를 무기한 보류하거나 심사를 엄격하게 강화하고 나섰습니다. 이에 따라 글로벌 빅테크 기업들은 시설 확충에 큰 차질을 빚으며 AI 서비스 런칭 일정까지 지연되는 위기를 맞았습니다. 업계에서는 특정 지역에 의존하지 않는 자체적인 소버린 AI 인프라 구축이나 소형 모듈형 원전(SMR) 연계 등 대체 방안을 다급히 모색하고 있습니다. 폭발적인 AI 산업의 성장 속도가 물리적인 에너지 한계와 환경 규제라는 거대한 장벽에 부딪히며 새로운 국면을 맞이하고 있습니다.`,
  keyTerms:[{term:`소버린 AI 인프라`,explanation:`특정 국가나 기업이 외국의 거대 플랫폼에 의존하지 않고 자체적인 전력망과 데이터센터 등 물리적 기반 시설을 독립적으로 구축하는 것을 말합니다.`}],
  history:`생성형 AI가 폭발적으로 대중화되면서 연산 처리에 필요한 그래픽처리장치(GPU)와 데이터센터 수요가 기하급수적으로 늘어났습니다. 초기에는 혁신 산업으로 환영받았으나, 데이터센터가 막대한 전력과 냉각수를 집어삼키는 블랙홀로 지목되면서 각국 정부의 시선이 싸늘하게 변하기 시작했습니다.`,
  players:`마이크로소프트, 구글 등 글로벌 빅테크들은 인프라 선점을 위해 천문학적인 자금을 쏟아붓고 있습니다. 반면 데이터센터가 들어서는 지역의 주민들과 환경 단체들은 생존권 위협이라며 강력한 건립 반대 시위를 벌이고 있습니다. 각국 정부는 산업 진흥과 환경 보호 사이에서 난처한 입장에 놓였습니다.`,
  current:`아일랜드, 네덜란드 등 유럽 일부 국가에 이어 미국의 주요 IT 거점 도시들까지 신규 데이터센터 허가를 보류하는 모라토리엄을 선언하고 나섰습니다. 인프라 병목 현상으로 인해 차세대 AI 모델의 개발 일정이 줄줄이 밀리는 사태가 발생하고 있습니다.`,
  outlook:`기업들은 규제를 피하기 위해 자체 원자력 발전소를 짓거나 해저 데이터센터를 구축하는 등 파격적인 기술 우회로를 찾고 있습니다. 에너지 확보 여부가 곧 글로벌 AI 패권을 결정짓는 가장 핵심적인 변수로 자리 잡을 전망입니다.`,
  sources:[{title:`AI's Insatiable Power Hunger - WSJ`,url:`https://www.wsj.com/`},{title:`Europe Halts New Data Centers - FT`,url:`https://www.ft.com/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`전란에 덮친 최악의 폭우… 가자지구 난민 텐트 7만 동 물에 잠겨 아비규환`,
  metrics:[`임시 텐트 7만 동 완전 침수`,`깨끗한 식수 공급률 10% 미만`],
  summary:`끝없는 전쟁으로 폐허가 된 가자지구에 이례적인 겨울 폭우까지 덮치며 피란민들이 그야말로 생지옥에 내몰렸습니다. 며칠째 쏟아진 폭우와 강풍으로 인해 해안가와 저지대에 밀집해 있던 얇은 천막 텐트 약 7만 동이 형체도 없이 물에 휩쓸려갔습니다. 추위 속에서 피할 곳조차 잃은 수십만 명의 어린이와 노약자들이 오수에 노출되며 수인성 전염병이 걷잡을 수 없이 퍼지고 있습니다. 국경 봉쇄로 기초적인 구호물자와 방한용품 반입조차 가로막혀 있어 사상 최악의 인도적 위기가 현실화되고 있다는 경고가 쏟아집니다. 유엔을 비롯한 국제 구호단체들은 즉각적인 전투 중단과 구호 통로 개방을 촉구하고 나섰지만 해결의 기미는 보이지 않습니다. 참혹한 전쟁의 고통 위에 무자비한 자연재해까지 더해지면서 국제사회의 무기력함에 대한 탄식과 분노가 커지고 있습니다. 벼랑 끝에 선 생명들을 구하기 위한 전 세계적인 결단이 그 어느 때보다 절실한 시점입니다.`,
  keyTerms:[{term:`인도적 위기`,explanation:`전쟁이나 재난 등으로 대규모 인명 피해가 나고 식량, 식수, 의료 등 기초적인 생존 조건이 파괴된 절망적인 상태를 뜻합니다. 현재 외부의 긴급 구호 없이는 생존이 불가능한 상황입니다.`}],
  history:`수년째 이어진 무력 충돌로 가자지구의 주택과 핵심 기반 시설은 이미 복구 불가능한 수준으로 파괴되었습니다. 대부분의 주민들이 안전한 콘크리트 건물이 아닌 임시 천막에 의존해 힘겨운 피난 생활을 연명해 왔습니다. 매년 겨울철이면 열악한 환경 탓에 동사자와 전염병 환자가 속출하는 비극이 되풀이되었습니다.`,
  players:`가자지구 내부의 피란민들은 문자 그대로 생사의 기로에 서 있습니다. 국경을 통제하는 이스라엘 당국과 하마스 간의 교전은 멈출 기미가 없으며, 구호물자 반입을 조율해야 할 국제 연합(UN)의 협상력은 한계에 부딪혔습니다. 서방 국가들은 인도적 지원 확대를 촉구하면서도 소극적인 개입에 머물고 있습니다.`,
  current:`계속되는 폭우로 하수관이 역류하면서 거리는 거대한 오물 바다로 변했습니다. 병원과 구호 시설마저 침수 피해를 입으면서 최소한의 응급 처치조차 불가능한 마비 상태에 빠졌습니다.`,
  outlook:`이번 주 내내 기상 악화가 예보되어 있어 침수와 질병으로 인한 사망자 수는 기하급수적으로 늘어날 것으로 우려됩니다. 국제사회가 정치적 이해관계를 떠나 생명 구조를 위한 인도적 휴전을 즉각 성사시키지 못한다면 엄청난 재앙을 피할 수 없습니다.`,
  sources:[{title:`Heavy rains flood Gaza refugee camps - Reuters`,url:`https://www.reuters.com/`},{title:`Humanitarian disaster deepens in Gaza - Al Jazeera`,url:`https://www.aljazeera.com/`}]
}]

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모닝 브리핑</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --sidebar-w: 240px;
    --bg: #FAFAF7;
    --paper: #FFFFFF;
    --accent: #6B7A8F;
    --accent-soft: #E8ECEF;
    --line: #EAE8E3;
    --line-strong: #D8D5CE;
    --text: #2D2A26;
    --text-mid: #6B655D;
    --text-sub: #A09889;
    --radius: 10px;
  }
  html, body {
    height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 15px; line-height: 1.65; font-weight: 400;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }

  /* ── Layout ── */
  #app { display: flex; height: 100vh; overflow: hidden; }

  /* ── Sidebar ── */
  #sidebar {
    width: var(--sidebar-w); flex-shrink: 0;
    background: var(--bg); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #sidebar-header {
    padding: 36px 20px 24px;
    border-bottom: 1px solid var(--line);
    text-align: center;
  }
  #sidebar-header h1 {
    font-size: 19px; font-weight: 700; color: var(--text);
    letter-spacing: -0.4px; line-height: 1.3;
  }
  #sidebar-header p {
    font-size: 12px; color: var(--text-sub); margin-top: 6px;
    letter-spacing: 0.3px;
  }
  #date-list { overflow-y: auto; flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
  .date-item {
    padding: 11px 14px; cursor: pointer; border-radius: 8px;
    transition: background 0.15s, color 0.15s;
    background: transparent;
    text-align: center; font-size: 13px; font-weight: 500; color: var(--text-mid);
    letter-spacing: 0.1px;
  }
  .date-item:hover { background: var(--accent-soft); color: var(--text); }
  .date-item.active {
    background: var(--accent-soft); color: var(--text); font-weight: 600;
  }

  /* ── Main ── */
  #main { flex: 1; overflow-y: auto; background: var(--paper); }
  #content { max-width: 760px; margin: 0 auto; padding: 56px 40px 80px; }

  .brief-header { margin-bottom: 36px; }
  .brief-header .bh-eyebrow {
    font-size: 11px; color: var(--text-sub); margin-bottom: 8px;
    letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500;
  }
  .brief-header h2 {
    font-size: 30px; font-weight: 700; letter-spacing: -0.7px;
    color: var(--text); line-height: 1.25;
  }

  /* ── Sticky Top (header + tabs) ── */
  .sticky-top {
    position: sticky; top: 0;
    background: var(--paper); z-index: 20;
    padding-top: 56px; margin-top: -56px;
  }
  .sticky-top .brief-header { margin-bottom: 24px; }

  /* ── Category Tabs ── */
  .cat-tabs {
    display: flex; gap: 0; margin-bottom: 36px;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
  }
  .cat-tab {
    padding: 12px 20px 14px; cursor: pointer; font-size: 14px; font-weight: 500;
    color: var(--text-sub); border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    background: none; border-top: none; border-left: none; border-right: none;
    font-family: inherit; letter-spacing: -0.1px;
    margin-bottom: -1px;
  }
  .cat-tab:hover { color: var(--text-mid); }
  .cat-tab.active { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }

  /* ── Sources (collapsible) ── */
  .sources-toggle {
    background: transparent; border: 1px solid var(--line-strong);
    padding: 8px 14px; border-radius: 6px; font-size: 12.5px; font-weight: 500;
    color: var(--text-mid); cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    font-family: inherit; margin-top: 12px;
    transition: background 0.15s, border-color 0.15s;
  }
  .sources-toggle:hover { background: var(--accent-soft); border-color: var(--accent); }
  .sources-toggle .arrow { transition: transform 0.2s; font-size: 9px; color: var(--text-sub); }
  .sources-toggle.open .arrow { transform: rotate(180deg); }
  .sources-body { display: none; margin-top: 12px; padding-left: 4px; }
  .sources-body.open { display: block; }

  /* ── Story Card ── */
  .story { margin-bottom: 40px; }
  .story-top { margin-bottom: 18px; }
  .story-headline {
    font-size: 19px; font-weight: 700; line-height: 1.45;
    letter-spacing: -0.4px; color: var(--text);
  }

  .metrics { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .metric-chip {
    background: var(--accent-soft); border: none;
    border-radius: 6px; padding: 7px 12px;
    font-size: 12.5px; font-weight: 500; color: var(--text-mid);
    line-height: 1.4;
  }

  .summary {
    font-size: 15px; line-height: 1.8; color: var(--text); margin-bottom: 20px;
    letter-spacing: -0.1px;
  }
  .summary .kt-underline {
    color: #1996BD;
    text-decoration: underline;
    text-decoration-color: #1996BD;
    text-decoration-thickness: 1.5px;
    text-underline-offset: 3px;
    cursor: help;
  }

  /* ── Key Terms Box ── */
  .key-terms {
    background: #F4F1EA; border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius); padding: 18px 22px; margin-bottom: 14px;
  }
  .key-terms-title {
    font-size: 11px; font-weight: 600; color: var(--text-sub);
    text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 14px;
  }
  .kt-item { margin-bottom: 12px; }
  .kt-item:last-child { margin-bottom: 0; }
  .kt-term {
    font-size: 13.5px; font-weight: 700; color: #1996BD;
    margin-bottom: 4px; display: block;
    letter-spacing: -0.1px;
  }
  .kt-exp {
    font-size: 13.5px; line-height: 1.7; color: var(--text-mid);
  }

  /* ── Background ── */
  .bg-box {
    background: var(--bg); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 22px 24px; margin-bottom: 14px;
  }
  .bg-box-title {
    font-size: 11px; font-weight: 600; color: var(--text-sub);
    text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 16px;
  }
  .bg-section { margin-bottom: 16px; }
  .bg-section:last-child { margin-bottom: 0; }
  .bg-section-label {
    font-size: 12.5px; font-weight: 600; color: var(--text); margin-bottom: 6px;
    letter-spacing: -0.1px;
  }
  .bg-section-text { font-size: 14px; line-height: 1.75; color: var(--text-mid); }

  /* ── Sources ── */
  .source-item {
    display: flex; align-items: flex-start; gap: 10px;
    margin-bottom: 8px; font-size: 13px;
  }
  .src-num {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent-soft); color: var(--text-mid);
    font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .source-item a { color: var(--text-mid); text-decoration: none; line-height: 1.55; }
  .source-item a:hover { color: var(--text); text-decoration: underline; }

  .story-divider { border: none; border-top: 1px solid var(--line); margin: 36px 0; }

  .empty { color: var(--text-sub); font-size: 14px; padding: 60px 0; text-align: center; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }

  /* ── Mobile Toggle ── */
  #sidebar-toggle {
    display: none;
    position: fixed; top: 14px; left: 14px; z-index: 50;
    background: var(--paper); border: 1px solid var(--line-strong);
    width: 40px; height: 40px; border-radius: 10px;
    cursor: pointer; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(45, 42, 38, 0.08);
  }
  #sidebar-toggle span {
    display: block; width: 18px; height: 2px; background: var(--text);
    position: relative;
  }
  #sidebar-toggle span::before,
  #sidebar-toggle span::after {
    content: ''; position: absolute; left: 0; width: 18px; height: 2px; background: var(--text);
  }
  #sidebar-toggle span::before { top: -6px; }
  #sidebar-toggle span::after { top: 6px; }

  #sidebar-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(45, 42, 38, 0.4); z-index: 40;
  }
  #sidebar-backdrop.open { display: block; }

  /* ── Mobile Responsive ── */
  @media (max-width: 768px) {
    #sidebar-toggle { display: flex; }
    #sidebar {
      position: fixed; left: 0; top: 0; bottom: 0;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      z-index: 45; width: 260px;
      box-shadow: 0 0 24px rgba(45, 42, 38, 0.12);
    }
    #sidebar.open { transform: translateX(0); }

    #content { padding: 64px 20px 60px; max-width: 100%; }
    .brief-header h2 { font-size: 22px; }
    .story-headline { font-size: 16px; }
    .summary { font-size: 14.5px; line-height: 1.75; }
    .bg-section-text { font-size: 13.5px; }
    .metric-chip { font-size: 12px; padding: 6px 10px; }
    .bg-box { padding: 18px 18px; }
    .cat-tab { padding: 11px 14px; font-size: 13.5px; }

    .quiz-card { padding: 28px 24px 24px; }
    .quiz-q { font-size: 17px; }
    .quiz-choice { font-size: 14px; padding: 13px 16px; }
  }

  /* ── Quiz Overlay ── */
  body.quiz-active #app {
    filter: blur(6px) saturate(0.85);
    pointer-events: none;
    transition: filter 0.3s ease;
  }
  #quiz-overlay {
    position: fixed; inset: 0;
    background-color: rgba(250, 250, 247, 0.55);
    background-image:
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0) 0,
        rgba(255,255,255,0) 5px,
        rgba(45,42,38,0.04) 5px,
        rgba(45,42,38,0.04) 6px
      ),
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0) 0,
        rgba(255,255,255,0) 22px,
        rgba(45,42,38,0.025) 22px,
        rgba(45,42,38,0.025) 23px
      );
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 24px;
  }
  #quiz-overlay.hidden { display: none; }

  .quiz-card {
    background: var(--paper); border-radius: 16px;
    padding: 36px 36px 32px; width: 100%; max-width: 440px;
    box-shadow: 0 16px 48px rgba(45, 42, 38, 0.18);
  }
  .quiz-eyebrow {
    font-size: 11px; color: var(--text-sub); letter-spacing: 1.5px;
    text-transform: uppercase; font-weight: 500; margin-bottom: 12px;
  }
  .quiz-q {
    font-size: 19px; font-weight: 700; color: var(--text);
    line-height: 1.5; letter-spacing: -0.3px; margin-bottom: 24px;
  }
  .quiz-choices { display: flex; flex-direction: column; gap: 8px; }
  .quiz-choice {
    background: var(--paper); border: 1px solid var(--line-strong);
    padding: 14px 18px; border-radius: 10px; font-size: 14.5px; font-weight: 500;
    color: var(--text); cursor: pointer; text-align: left;
    font-family: inherit; transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .quiz-choice:focus { outline: none; }
  .quiz-choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) {
    .quiz-choice:hover { background: var(--accent-soft); border-color: var(--accent); }
  }
  .quiz-choice:active { transform: scale(0.99); }
  .quiz-choice.wrong {
    background: #F5E6E0; border-color: #C9947F; color: #8A4A30;
    animation: shake 0.4s ease;
  }
  .quiz-choice.correct {
    background: #E3EDE2; border-color: #7A9077; color: #2E4A2C;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .quiz-feedback {
    margin-top: 20px; text-align: center; font-size: 14px; font-weight: 500;
    color: var(--text-mid); min-height: 22px;
  }
  .quiz-feedback.right { color: #2E4A2C; }
  .quiz-feedback.wrong { color: #8A4A30; }

  .quiz-close-btn {
    margin-top: 18px; width: 100%;
    background: var(--text); color: var(--paper); border: none;
    padding: 13px 20px; border-radius: 10px; font-size: 14px; font-weight: 600;
    font-family: inherit; cursor: pointer;
    transition: background 0.15s;
  }
  .quiz-close-btn:hover { background: #1a1815; }
  .quiz-close-btn.hidden { display: none; }
</style>
</head>
<body>
<div id="quiz-overlay">
  <div class="quiz-card">
    <div class="quiz-eyebrow"><span>잠깐, 나에 대해서 잘 알지?</span> <span id="quiz-counter">(0/3)</span></div>
    <div class="quiz-q" id="quiz-q"></div>
    <div class="quiz-choices" id="quiz-choices"></div>
    <div class="quiz-feedback" id="quiz-feedback"></div>
    <button class="quiz-close-btn hidden" id="quiz-close">닫기</button>
  </div>
</div>

<button id="sidebar-toggle" aria-label="메뉴"><span></span></button>
<div id="sidebar-backdrop"></div>

<div id="app">
  <nav id="sidebar">
    <div id="sidebar-header">
      <h1>모닝 브리핑</h1>
      <p>일별 세계 뉴스 요약</p>
    </div>

    <div id="date-list"></div>
  </nav>
  <main id="main">
    <div id="content"></div>
  </main>
</div>

<script>
const BRIEFS = [{
  tag:`2026-11-26`,
  label:`2026년 11월 26일 (목)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`가계대출 금리가 5%를 재돌파하며 주택담보대출 금리가 14년 7개월 만에 최고치를 기록했습니다.`,
  metrics:[`가계대출 금리 5.02%`,`14년 7개월 만에 최고`],
  summary:`한국은행이 발표한 통계에 따르면 10월 예금은행 가계대출의 가중평균금리가 5.02%를 기록하며 5% 선을 다시 돌파했습니다. 특히 주택담보대출 금리가 큰 폭으로 올라 14년 7개월 만에 가장 높은 수준을 보였습니다. 이는 시장 금리 상승과 더불어 가계부채 억제를 위한 은행권의 가산금리 인상이 복합적으로 작용한 결과입니다. 높은 금리는 곧바로 가계의 처분가능소득 감소로 이어지고 있습니다. 결과적으로 서민과 이른바 영끌족의 이자 상환 부담이 한층 가중되며 민간 소비 둔화 우려마저 나옵니다. 금융당국은 대출 증가세를 주시하며 추가적인 건전성 관리 방안과 함께 서민 금융 지원책을 모색하고 있습니다.`,
  keyTerms:[{term:`가중평균금리`,explanation:`은행이 대출을 내줄 때 적용한 금리들을 대출 금액에 비례해 평균 낸 수치로, 실제 체감되는 대출 금리 수준을 가장 잘 보여주는 지표입니다.`}],
  history:`2020년대 초 저금리 기조로 크게 늘어난 가계부채는 한국 경제의 핵심 뇌관으로 자리 잡았습니다. 금리 인상기에도 주택 시장 회복 기대감에 대출 수요가 좀처럼 꺾이지 않았습니다.`,
  players:`한국은행, 금융위원회 등 통화·금융 당국과 시중은행, 그리고 영끌 등 빚을 내어 자산을 매입한 가계가 주요 이해관계자입니다.`,
  current:`10월 예금은행 가중평균금리가 5%를 다시 돌파하고 주담대 금리가 14년 7개월 만에 최고치를 경신하면서, 가계의 채무 상환 능력이 한계에 다다르고 있다는 경고음이 커지고 있습니다.`,
  outlook:`연말을 앞두고 금융당국의 가계부채 억제 기조가 지속될 것으로 보여, 대출 문턱은 더욱 높아지고 고금리 충격이 소비 위축으로 이어질 수 있습니다. 향후 통화정책 방향에 귀추가 주목됩니다.`,
  sources:[{title:`주담대 금리 14년 7개월 만에 최고치 - 한국경제`,url:`https://www.hankyung.com/economy/1`},{title:`가계대출 금리 5% 재돌파 - 다음 금융`,url:`https://finance.daum.net/news/1`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 무역대표부(USTR)가 한국과 중국을 포함한 14개국을 대상으로 새로운 '과잉생산 관세' 부과 방안을 발표했습니다.`,
  metrics:[`한국·EU 상한선 15%`,`중국 상한선 최대 20%`],
  summary:`미국 무역대표부(USTR)가 글로벌 산업 과잉 생산 문제에 대응하기 위해 한국, 중국, EU 등 14개국에 새로운 관세를 부과하는 방안을 발표했습니다. 이번 조치는 장기간 진행된 무역법 301조 조사 결과를 바탕으로 최종 마련되었습니다. 한국과 EU 등 주요 우방국에는 기존 관세를 포함해 최고 15%의 상한선이 설정되며 어느 정도 방어선이 구축되었습니다. 반면 중국의 경우 기존 관세에 더해 최고 20%까지 상한이 가중 적용될 예정이어서 큰 타격이 예상됩니다. 이는 자국 산업 보호를 최우선으로 하는 미국의 강력한 통상 압박이 전방위로 확대되고 있음을 보여줍니다. 수출 의존도가 높은 한국 경제로서는 향후 통상 환경 변화에 따라 최대 25%까지 인상될 수 있는 단서 조항 탓에 무역 불확실성이 짙어졌습니다.`,
  keyTerms:[{term:`무역법 301조`,explanation:`미국이 불공정 무역 관행을 시정하기 위해 대상 국가에 일방적으로 보복 관세 등 강력한 제재를 가할 수 있도록 규정한 법률입니다.`}],
  history:`미국은 과거 트럼프 행정부부터 자국 산업 보호를 명분으로 징벌적 관세를 적극 활용해 왔습니다. 최근에는 동맹국 여부를 가리지 않고 무역법 301조를 근거로 통상 압박을 전방위로 확대하는 추세입니다.`,
  players:`보호무역주의를 강화하는 미국 정부(USTR)와 이에 직면한 한국, EU 등 동맹국, 그리고 사실상 주요 표적이 된 중국 및 해당국 수출 기업들이 얽혀 있습니다.`,
  current:`미국이 한국 등 14개국에 과잉생산 관세를 공식화하며 글로벌 무역 환경에 큰 파장을 몰고 왔습니다. 한국과 EU는 상한선 15% 방어로 급한 불은 껐으나, 중국에는 최대 20% 상한이 설정되며 미중 무역 갈등이 심화되고 있습니다.`,
  outlook:`관세 상한이 언제든 25%까지 인상될 수 있다는 단서가 붙은 만큼 무역 불확실성은 당분간 지속될 전망입니다. 각국은 미국의 추가적인 통상 압력에 대응해 자국 산업 피해를 최소화하기 위한 치열한 외교전을 펼칠 것입니다.`,
  sources:[{title:`미국, 한국 등 14개국 대상 관세안 발표 - 연합뉴스`,url:`https://www.yna.co.kr/view/1`},{title:`무역법 301조 과잉생산 관세 후폭풍 - Reuters`,url:`https://www.reuters.com/article/1`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`신규 관세 리스크와 인플레이션 불안이 맞물리며 글로벌 증시에서 AI·기술주 중심의 차익 실현 매물이 쏟아졌습니다.`,
  metrics:[`나스닥 3.9% 하락`,`아시아 지수 3% 이상 급락`],
  summary:`미국의 신규 관세 발표와 인플레이션 재점화 우려가 겹치면서 글로벌 금융시장이 크게 요동쳤습니다. 최근 랠리를 이어가던 AI 및 주요 기술주를 중심으로 막대한 차익 실현 매물이 쏟아지며 주가 하락을 부추겼습니다. 구체적으로 미국 나스닥 지수가 3.9%, S&P 500 지수가 2.8% 급락하는 충격을 겪었습니다. 아시아 주요 증시 역시 전반적인 투자 심리 악화로 3% 이상 떨어지며 동반 하락했습니다. 미국의 고금리 정책이 예상보다 더 오래 지속될 수 있다는 불안감이 위험자산 회피 현상을 자극한 결과입니다. 외국인 자금이 연일 빠져나가면서 국내 금융당국은 코스피200과 코스닥150을 대상으로 10조 원 규모의 증시안정펀드 확대를 긴급히 논의하고 있습니다.`,
  keyTerms:[{term:`차익 실현 매물`,explanation:`주가가 많이 올랐을 때 이익을 확정 짓기 위해 주식을 파는 물량으로, 이것이 대거 쏟아지면 일시적으로 주가가 급락할 수 있습니다.`}],
  history:`챗GPT 등장 이후 인공지능 산업의 폭발적 성장에 대한 기대감으로 전 세계 자금이 AI와 대형 기술주에 집중적으로 몰리며 글로벌 증시 랠리를 이끌어왔습니다.`,
  players:`AI 붐을 주도한 글로벌 빅테크 기업들과 엔비디아 등 반도체 생태계, 랠리에 뛰어든 전 세계 투자자, 그리고 금리 정책을 결정하는 미국 연방준비제도(Fed)가 핵심 주체입니다.`,
  current:`미국의 신규 관세 부과 리스크와 인플레이션 불안감이 맞물려 고금리 장기화 우려가 커지자, 기술주에 몰려있던 자금이 대거 이탈하며 나스닥과 아시아 주요 증시가 급락하는 충격이 발생했습니다.`,
  outlook:`단기적으로는 차익 실현을 위한 매도세와 변동성 확대가 지속될 가능성이 큽니다. 투자자들은 미국의 추가적인 경제 지표와 연준의 금리 인하 신호를 예의주시하며 투자 방향성을 저울질할 것으로 보입니다.`,
  sources:[{title:`글로벌 AI 랠리 둔화와 증시 급락 - Bloomberg`,url:`https://www.bloomberg.com/news/1`},{title:`나스닥 3.9% 하락, 차익 매물 쏟아져 - 매일경제`,url:`https://www.mk.co.kr/news/1`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`더불어민주당이 조희대 대법원장 탄핵안 처리를 위해 야 5당 연대를 공식 제안하면서 정국이 급격히 얼어붙고 있습니다.`,
  metrics:[`야 5당 연대 제안`,`판사회의 단체 우려 표명`],
  summary:`더불어민주당이 조희대 대법원장에 대한 탄핵을 본격적으로 추진하면서 여야 간 극한 대립이 벌어지고 있습니다. 민주당은 신속한 처리를 위해 야 5당 연대를 공식 제안했으며, 조만간 국회에 탄핵소추안 초안을 공개하고 표결 절차를 밟을 예정입니다. 이에 대해 전국 일선 법원의 판사들이 헌법 가치 훼손이자 사법부 독립 침해라며 사상 첫 단체 우려를 표명하는 등 내부 반발도 거셉니다. 국민의힘 역시 이를 사법부 마비를 노린 헌법 파괴 행위로 규정하고 전면적인 장외투쟁과 보이콧 등 전면전을 선언했습니다. 한동훈 전 대표 등 여권 유력 인사들까지 나서며 정치적 배수진을 치고 있는 양상입니다. 대법원장 탄핵이라는 헌정사상 초유의 사태를 둘러싸고 정국이 급격히 얼어붙으면서, 당장 시급한 국회 예산안 처리 등 산적한 민생 현안들마저 올스톱될 위기에 처했습니다.`,
  keyTerms:[{term:`탄핵소추안`,explanation:`대통령, 대법원장 등 고위 공직자가 직무 집행에 있어 헌법이나 법률을 위배했을 때, 국회가 파면을 요구하기 위해 발의하는 문서입니다.`}],
  history:`현 국회는 여야의 극심한 진영 대결로 입법 마비 상태가 지속되어 왔습니다. 검사나 장관 탄핵 등 잦은 탄핵 소추로 정치적 양극화가 심화되는 가운데 사법부 수장까지 탄핵의 표적이 되었습니다.`,
  players:`탄핵을 주도하며 5당 연대를 제안한 더불어민주당 등 야권과, 이를 방어하며 헌법 파괴로 규정한 국민의힘 및 반발하는 일선 판사 등 사법부가 정면 충돌하고 있습니다.`,
  current:`조희대 대법원장 탄핵안이 가시화되면서 정국이 급랭했고, 판사들의 단체 우려 성명과 여당의 장외투쟁 선언이 이어지며 정치적 갈등이 헌정 사상 유례없는 사법부 마비 위기로 번지고 있습니다.`,
  outlook:`탄핵안 발의 및 국회 본회의 표결 결과에 따라 향후 정국은 완전히 요동칠 것입니다. 예산안 처리 등 모든 민생 현안이 블랙홀처럼 빨려 들어가며 여야 간 강 대 강 대치는 내년 초까지도 이어질 전망입니다.`,
  sources:[{title:`민주당, 조희대 대법원장 탄핵안 5당 연대 - 한겨레`,url:`https://www.hani.co.kr/arti/politics/1`},{title:`판사회의 '사법부 독립 침해' 강력 반발 - 동아일보`,url:`https://www.donga.com/news/Politics/1`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`젤렌스키 우크라이나 대통령이 현 전선 중심의 정전 협상 가능성을 언급한 가운데 러시아의 인프라 공습은 계속되고 있습니다.`,
  metrics:[`겨울철 인프라 타격 확대`,`서방 진영의 정전 압박`],
  summary:`볼로디미르 젤렌스키 우크라이나 대통령이 계속되는 장기 소모전 속에서 돌연 현 전선 중심 정전 협상 가능성을 시사하며 국제사회의 이목을 끌고 있습니다. 이는 빼앗긴 영토를 무력으로 즉각 수복하는 대신, 일단 교전을 멈추고 외교적 해결을 모색하겠다는 전략적 유연성을 내비친 것으로 해석됩니다. 그러나 러시아는 우크라이나의 유화적 제스처에도 불구하고 오히려 겨울철 추위를 무기로 삼아 에너지 인프라에 대한 공습 수위를 더욱 높이고 있습니다. 미국과 유럽연합(EU) 등 서방 진영은 러시아가 평화 협상을 고의로 지연시키며 유리한 고지를 점하려 한다고 강하게 비판하고 나섰습니다. 전쟁 종식을 향한 양측의 셈법이 크게 엇갈리면서 당장의 휴전 도출은 쉽지 않아 보입니다. 외교적 교착 상태가 길어지는 가운데 척박한 전장에서 혹독한 겨울을 맞이한 민간인 피해와 인도주의적 위기는 갈수록 깊어지고 있습니다.`,
  keyTerms:[{term:`현 전선 중심 정전`,explanation:`영토를 즉시 되찾는 대신, 현재 군대가 대치하고 있는 선을 기준으로 전투를 멈추고 협상을 시작하겠다는 전략적 유연성을 뜻합니다.`}],
  history:`2022년 러시아의 전면 침공으로 시작된 우크라이나 전쟁은 수년째 뚜렷한 승자 없이 영토를 주고받는 소모전 양상으로 굳어졌으며, 양국의 인적·물적 피해는 극심한 상태입니다.`,
  players:`전쟁 당사국인 러시아와 우크라이나를 필두로, 우크라이나를 지원하는 미국 및 유럽연합(EU) 등 서방 진영이 군사·외교적으로 깊이 개입해 있습니다.`,
  current:`젤렌스키 대통령이 현 전선 중심의 정전 가능성을 열어두며 외교적 출구를 모색하고 있으나, 러시아는 오히려 겨울철 에너지 인프라 파괴에 집중하며 협상 우위를 점하려는 공세를 강화하고 있습니다.`,
  outlook:`미국 등 주요 동맹국의 정치 상황 변화에 따라 지원 규모가 달라질 수 있어 전쟁의 향방은 안갯속입니다. 민간인 피해가 급증하는 가운데 양측의 실질적인 휴전 협상 테이블이 마련될 수 있을지가 핵심 관건입니다.`,
  sources:[{title:`젤렌스키, 전선 중심 정전 협상 시사 - AP News`,url:`https://apnews.com/article/1`},{title:`러시아, 겨울철 인프라 타격 지속 - CBS News`,url:`https://www.cbsnews.com/news/1`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`북한이 대북 제재 동참을 이유로 평양 주재 스위스 외교사무소를 전격 폐쇄하고, 김정은 위원장은 전술핵 다영역 활용을 강조했습니다.`,
  metrics:[`48시간 내 스위스 대표 출국 통보`,`핵능력 질량적 강화 선언`],
  summary:`북한이 대남 무력 위협과 외교적 고립 노선을 동시에 강화하며 한반도 주변의 군사적 긴장을 가파르게 끌어올리고 있습니다. 김정은 국무위원장은 최근 핵시설을 직접 현지 지도하며 다영역에서의 전술핵 활용 방안을 지시하고, 핵능력의 질량적 강화가 이미 불가역적인 현실이라고 강변했습니다. 이와 동시에 북한 외무성은 스위스가 대북 제재에 동참한 것을 강력히 문제 삼아 평양 소재 스위스 외교사무소를 전격 폐쇄 조치했습니다. 뿐만 아니라 스위스 외교 대표에게 48시간 내에 출국할 것을 일방적으로 통보하는 초강수를 뒀습니다. 이는 국제사회의 전방위적인 경제 제재에 결코 굴복하지 않고 핵 무력을 매개로 독자적인 강경 노선을 고수하겠다는 북한 지도부의 강력한 의지 표현입니다. 한미 당국을 비롯한 주변국들은 북한의 이러한 행보가 중대한 추가 도발로 이어질 가능성이 높다고 보고 경계 태세를 예의주시하고 있습니다.`,
  keyTerms:[{term:`전술핵`,explanation:`국지전이나 특정 목표물을 타격하기 위해 폭발력을 줄이고 사거리를 짧게 만든 소형 핵무기입니다.`}],
  history:`북한은 지속적인 핵·미사일 개발로 인해 유엔과 국제사회의 강력한 경제 제재를 받아왔으며, 이에 반발해 외부 세계와의 교류를 점진적으로 단절하고 무력 도발을 일상화해왔습니다.`,
  players:`전술핵 강화와 외교 단절을 주도하는 김정은 국무위원장 등 북한 지도부와, 이에 맞서 대북 제재를 유지하는 서방 및 스위스, 그리고 안보 위협을 받는 한미 양국입니다.`,
  current:`김정은 위원장의 전술핵 다영역 활용 지시와 함께 대북 제재에 동참한 스위스의 외교사무소를 폐쇄하고 대표를 추방하는 등 북한의 노골적인 강경 행보가 군사·외교 양면에서 극에 달하고 있습니다.`,
  outlook:`스위스 외교사무소 폐쇄를 기점으로 서방과의 대화 채널이 더욱 좁아졌습니다. 핵 무력을 앞세운 북한의 도발 수위는 내년 한미 연합훈련 등을 전후해 최고조에 이를 수 있어 한반도 역내 긴장은 한층 가중될 것입니다.`,
  sources:[{title:`북한, 스위스 외교사무소 전격 폐쇄 - 연합뉴스TV`,url:`https://www.yonhapnewstv.co.kr/news/1`},{title:`김정은 '전술핵 질량적 강화' 현지 지도 - 한국경제`,url:`https://www.hankyung.com/politics/1`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`이용자를 대신해 쇼핑과 결제를 자동으로 수행하는 '자율형 AI 에이전트'가 급부상하면서, 네이버·카카오 등 기존 플랫폼들과의 데이터 접근 권한 갈등이 본격화되고 있습니다.`,
  metrics:[`AI 기반 자동 접속 앱 사용자 급증`,`플랫폼 이용자 접점 이탈 우려 확산`],
  summary:`사용자를 대신해 컴퓨터 화면을 스스로 읽고 쇼핑, 예약, 결제까지 능동적으로 처리하는 자율형 AI 에이전트 서비스가 국내 IT 업계에서 큰 인기를 끌며 빠르게 확산되고 있습니다. 이처럼 이른바 '컴퓨터 유즈(Computer Use)'를 기반으로 한 신종 AI 기술이 대중화되자 네이버, 카카오, 쿠팡 등 대규모 플랫폼 기업들은 바짝 긴장하는 모양새입니다. 이들 기업은 외부 AI가 사용자 계정 위임 방식을 통해 자사 서비스에 무단으로 접속해 데이터를 긁어가거나 심각한 보안 취약점을 노출할 수 있다는 이유로 기술적 차단 조치를 적극 고심 중입니다. 플랫폼 사업자들은 무엇보다도 자사 생태계 안에서 활동하던 이용자들이 종국에는 외부 AI 앱에 완전히 종속되어 고객 접점을 잃게 될 것을 가장 크게 우려하고 있습니다. 기술 혁신이 가져온 획기적인 소비자 편의성과 거대 플랫폼의 자체 데이터 통제권 방어 사이의 복잡한 주도권 싸움이 이제 막 본격화된 셈입니다. 전문가들은 관련 법적 가이드라인과 데이터 공유 기준 마련이 시급하다고 입을 모으고 있습니다.`,
  keyTerms:[{term:`자율형 AI 에이전트`,explanation:`단순히 질문에 답하는 것을 넘어, 사람처럼 컴퓨터 화면을 보고 클릭과 타이핑을 하며 주어진 목표를 스스로 완수하는 인공지능 프로그램입니다.`}],
  history:`생성형 AI 기술이 단순 텍스트 챗봇을 넘어 인간의 개입 없이 스스로 목표를 수행하는 '에이전트' 형태로 진화하면서, 자동화 서비스가 빠르게 일상 속으로 침투하기 시작했습니다.`,
  players:`혁신적인 자율형 AI 서비스를 개발해 이용자를 끌어모으는 신생 AI 스타트업들과, 플랫폼 내 사용자 데이터와 생태계를 방어하려는 거대 IT 기업(네이버, 카카오 등)이 주요 행위자입니다.`,
  current:`사용자의 계정을 위임받아 화면을 제어하는 AI 툴이 인기를 끌자, 데이터 탈취 및 보안 리스크를 우려한 대형 플랫폼들이 기술적 차단을 고심하며 주도권 다툼이 수면 위로 떠올랐습니다.`,
  outlook:`플랫폼 종속을 벗어나려는 AI 기술의 발전 속도는 더욱 빨라질 전망입니다. 이에 따라 AI의 외부 데이터 접근 권한과 보안 책임을 둘러싼 산업계 내 규제 및 가이드라인 제정 논의가 치열하게 전개될 것입니다.`,
  sources:[{title:`'컴퓨터 유즈' AI 에이전트 사용자 급증 - 전자신문`,url:`https://www.etnews.com/news/1`},{title:`플랫폼, 외부 AI 데이터 접근 차단 고심 - ZDNet Korea`,url:`https://zdnet.co.kr/view/1`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`미국이 중국의 첨단 반도체 우회 확보를 막기 위해 동남아시아 데이터센터에 대한 칩 수출 규제를 강화하자 글로벌 은행들이 관련 대출을 동결했습니다.`,
  metrics:[`약 4억 8천만 달러 대출 동결`,`신흥 클라우드 기업 파산 위기 고조`],
  summary:`미국 상무부가 글로벌 공급망을 통한 중국의 첨단 반도체 우회 확보 경로를 원천 차단하기 위해 동남아시아 지역에 대한 수출 규제의 고삐를 강하게 죄고 나섰습니다. 특히 싱가포르, 인도네시아, 말레이시아 등 핵심 동남아 국가의 데이터센터가 미국산 첨단 AI 칩을 구매할 경우 반드시 정부의 사전 라이선스 취득 의무화 조치를 따르도록 새롭게 규정했습니다. 이에 따라 씨티그룹 등 글로벌 대형 은행들은 미국의 세컨더리 보이콧 제재 리스크를 피하기 위해 동남아 데이터센터 고객들에 대한 강도 높은 전면 심사에 즉각 돌입했습니다. 동시에 진행 중이던 막대한 규모의 인프라 관련 대출을 잇따라 동결하며 금융권의 자금줄마저 마르고 있습니다. 이로 인해 무리하게 빚을 내며 아시아 지역에서 컴퓨팅 인프라를 확장해 온 신흥 AI 클라우드 기업들은 심각한 자금난과 파산 위험이라는 거대한 부채 리스크에 직면하게 되었습니다. 미국과 중국 간의 패권 경쟁이 엉뚱하게도 신흥국 주변의 AI 산업 생태계 전반으로 불똥을 튀기며 엄청난 연쇄 파장을 낳고 있습니다.`,
  keyTerms:[{term:`라이선스 취득 의무화`,explanation:`특정 국가로 수출할 때 정부의 사전 허가를 받도록 강제하는 제도로, 기술이나 물자가 적대국으로 유출되는 것을 막기 위한 무역 통제 수단입니다.`}],
  history:`미국은 국가 안보를 이유로 중국에 첨단 반도체가 유입되는 것을 엄격히 통제해왔습니다. 중국 기업들이 동남아 등 제3국 클라우드를 통해 AI 칩을 우회 이용하는 사례가 늘자 추가 제재의 필요성이 대두되었습니다.`,
  players:`대중국 반도체 봉쇄망을 촘촘히 짜는 미국 상무부와, 컴플라이언스 리스크를 피하려는 글로벌 대형 은행들, 그리고 직격탄을 맞게 된 동남아 기반의 신흥 AI 클라우드 기업들입니다.`,
  current:`미 상무부가 동남아 데이터센터의 미국산 AI 칩 구매에 라이선스 취득을 의무화하자, 글로벌 은행들이 제재를 우려해 관련 대출을 잇달아 동결하면서 해당 지역 AI 기업들이 심각한 유동성 위기를 맞고 있습니다.`,
  outlook:`미국의 대중 기술 봉쇄망은 제3국으로까지 지속적으로 확대될 전망입니다. 자금줄이 막힌 신흥 클라우드 기업들의 연쇄 파산 우려가 제기되며, 아시아 태평양 지역의 AI 인프라 투자 생태계 전반이 크게 위축될 것으로 보입니다.`,
  sources:[{title:`미국, 동남아 AI 칩 우회 차단 강화 - Bloomberg`,url:`https://www.bloomberg.com/news/2`},{title:`글로벌 은행, 신흥 AI 대출 전면 동결 - The Edge Malaysia`,url:`https://theedgemalaysia.com/article/1`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`음성 합성 AI 선두 기업인 일레븐랩스가 무려 45조 원(330억 달러) 이상의 기업가치를 목표로 대규모 조기 투자 유치 논의에 착수했습니다.`,
  metrics:[`기업가치 330억 달러 달성 목표`,`원화 환산 시 약 45조 원 이상`],
  summary:`글로벌 음성 합성 AI 분야의 독보적인 선두주자로 꼽히는 유망 스타트업 '일레븐랩스(ElevenLabs)'가 역대급 규모의 매머드급 자금 조달에 본격적으로 나섰습니다. 주요 외신 보도에 따르면 일레븐랩스는 약 330억 달러, 한화로 무려 45조 원을 훌쩍 넘는 엄청난 기업가치(Valuation)를 목표로 대형 기관 투자자들과 조기 투자 유치 논의를 긴밀하게 진행 중입니다. 최근 글로벌 금융시장에서는 막대한 비용이 드는 AI 인프라 관련 주식들이 고평가 논란과 수익성 의구심에 휩싸이며 큰 폭의 주가 조정을 겪고 있는 상황입니다. 그럼에도 불구하고 실제 매출과 뚜렷한 비즈니스 모델을 갖춘 생성형 AI 버티컬 서비스에는 여전히 전 세계 뭉칫돈이 강하게 쏠리는 기현상이 나타나고 있습니다. 이는 월가의 이른바 AI 거품론 속에서도 시장 참가자들이 실질적인 성과를 내고 독자적인 생태계를 구축한 기업의 미래 폭발적 성장성은 여전히 매우 높게 평가하고 있음을 뚜렷하게 보여주는 대목입니다. 업계에서는 이번 메가 딜이 성사될 경우 AI 애플리케이션 시장의 옥석 가리기가 한층 더 가속화될 것으로 전망하고 있습니다.`,
  keyTerms:[{term:`기업가치(Valuation)`,explanation:`투자자들이 현재 시점에서 해당 기업이 미래에 창출할 수익과 성장성을 종합해 평가한 회사의 전체 몸값을 의미합니다.`}],
  history:`챗GPT 열풍 이후 거대언어모델(LLM) 중심의 범용 AI 개발에 막대한 투자 자금이 쏠렸으나, 최근에는 특정 분야에 특화되어 실제 수익을 창출하는 '버티컬 AI' 서비스로 시장의 관심이 이동하는 추세입니다.`,
  players:`음성 합성 기술로 독자적인 입지를 굳힌 스타트업 일레븐랩스와, 실질적인 비즈니스 성과를 내는 AI 유니콘 기업을 선점하기 위해 천문학적인 자금을 베팅하는 글로벌 벤처캐피털 투자자들입니다.`,
  current:`텍스트 생성 기반의 범용 AI 인프라 주식들이 고평가 논란으로 조정을 받는 와중에도, 일레븐랩스는 무려 45조 원(330억 달러) 이상의 몸값을 노리며 대규모 투자 유치를 순조롭게 진행 중입니다.`,
  outlook:`이는 뚜렷한 수익 모델과 시장 지배력을 갖춘 버티컬 AI에 자금이 집중되는 현상을 방증합니다. 향후 AI 투자 시장은 단순한 기술력을 넘어 실적을 입증하는 기업 중심으로 투자가 옥석 가리기가 가속화될 것입니다.`,
  sources:[{title:`일레븐랩스, 330억 달러 밸류 투자 유치 추진 - Investing.com`,url:`https://www.investing.com/news/1`},{title:`버티컬 AI에 쏠리는 막대한 글로벌 자금 - BNN Bloomberg`,url:`https://www.bnnbloomberg.ca/business/1`}]
}]

  tag:`2026-11-25`,
  label:`2026년 11월 25일 (수)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`글로벌 기술주 차익실현 매물 출회 속 나스닥 변동성 확대`,
  metrics:[`다우존스 50,000선 회복`,`엔비디아 주가 단기 반등 후 하락`],
  summary:`미국 뉴욕 증시에서 인공지능(AI) 관련 대형 기술주들에 대한 차익실현 매물이 쏟아지며 나스닥 지수의 변동성이 크게 확대되었습니다. 엔비디아의 젠슨 황 CEO 복귀 이슈 등으로 일시적인 안도 랠리가 나타났으나, 곧이어 앤트로픽 등 대형 기술주의 매물 소화 과정이 진행되었습니다. 이는 시장 내 AI 투자 피로감이 누적되고 미국 정부의 규제 리스크가 부각된 결과로 풀이됩니다. 반면 다우존스 지수는 5만 선을 회복하며 견조한 흐름을 유지해 섹터별 차별화 장세가 뚜렷해지고 있습니다. 시장 참여자들은 단기적인 모멘텀 부재 속에서 향후 발표될 경제 지표에 촉각을 곤두세우고 있습니다. 연준의 12월 금리 결정 방향이 불확실한 가운데, 이번 주 후반 발표될 개인소비지출(PCE) 물가지수가 주요 분수령이 될 전망입니다.`,
  keyTerms:[{term:`차익실현`,explanation:`주가가 올랐을 때 주식을 팔아 이익을 확정 짓는 행위를 말합니다. 단기적으로 주가를 하락시키는 주요 원인이 됩니다.`}],
  history:`2025년 이후 글로벌 AI 랠리가 지속되면서 대형 기술주의 밸류에이션 부담이 점차 가중되어 왔습니다.`,
  players:`엔비디아, 앤트로픽 등 글로벌 AI 기업들과 기술주에 투자한 글로벌 기관 투자자들이 핵심 주체입니다.`,
  current:`단기 급등에 따른 피로감과 미국 정부의 빅테크 규제 가능성이 맞물리며 주가 조정 압력이 커진 상황입니다.`,
  outlook:`다가오는 미 개인소비지출(PCE) 물가지수 결과와 연준의 12월 연방공개시장위원회(FOMC) 회의 결과에 따라 증시 방향성이 결정될 예정입니다.`,
  sources:[{title:`글로벌 증시, AI 기술주 차익매물에 나스닥 주춤 - Reuters`,url:`https://www.reuters.com/markets`},{title:`다우 5만선 돌파 속 엇갈린 증시 - Bloomberg`,url:`https://www.bloomberg.com/markets`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`코스피 5,000선 공방 치열, 대형 반도체주 수급에 롤러코스터 장세`,
  metrics:[`코스피 5,000선 등락`,`외국인 순매도 규모 확대`],
  summary:`국내 코스피 지수가 심리적 저항선인 5,000선을 두고 치열한 공방을 벌이며 롤러코스터 장세를 연출하고 있습니다. 최근 글로벌 기술주 충격의 여파로 지수가 한때 5,000선 아래로 밀렸으나, 기관의 저가 매수세와 매수 사이드카 발동 등에 힘입어 극적으로 반등에 성공했습니다. 이러한 극심한 변동성은 시가총액 비중이 절대적인 삼성전자와 SK하이닉스 등 대형 반도체주의 수급 쏠림 현상에 크게 기인합니다. 외국인 투자자들은 달러 강세 기조 속에서 한국 증시의 비중을 조절하며 매도 우위를 보이고 있습니다. 반도체 수출 호조라는 긍정적 요인과 대외 불확실성이라는 부정적 요인이 팽팽하게 맞서고 있습니다. 한국은행 금융통화위원회의 기준금리 결정을 앞두고 시장의 관망세가 짙어지며 당분간 5,000선 안착을 위한 진통이 이어질 것으로 예상됩니다.`,
  keyTerms:[{term:`사이드카`,explanation:`증시가 급변할 때 시장의 충격을 완화하기 위해 프로그램 매매 호가의 효력을 일시적으로 정지시키는 제도입니다.`}],
  history:`한국 증시는 AI 반도체 수출 호조에 힘입어 꾸준히 우상향 곡선을 그리며 역사적인 5,000선 돌파를 시도해 왔습니다.`,
  players:`막대한 자금력으로 시장을 좌우하는 외국인 투자자와 지수 방어에 나선 국내 기관, 그리고 삼성전자와 SK하이닉스가 주요 변수입니다.`,
  current:`글로벌 강달러 현상과 미 국채 금리 상승 압박으로 인해 외국인의 이탈이 가속화되며 지수 변동성이 극대화되었습니다.`,
  outlook:`다가오는 한국은행 금통위의 금리 결정과 반도체 수출 지표의 추가적인 개선 여부가 5,000선 안착의 핵심 키가 될 것입니다.`,
  sources:[{title:`코스피 5000선 방어전, 반도체 투톱 수급에 휘청 - 한국경제`,url:`https://www.hankyung.com/`},{title:`외국인 매도 속 기관 구원투수 등판 - 매일경제`,url:`https://www.mk.co.kr/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`11월 소비자심리지수 하락, 수출 호조 속 체감경기 둔화 뚜렷`,
  metrics:[`11월 CCSI 103.1 기록`,`제조업 재고 증가율 4.5%`],
  summary:`한국은행이 발표한 11월 소비자심리지수(CCSI)가 103.1을 기록하며 전월 대비 하락해 체감경기가 점차 둔화되고 있음을 보여주었습니다. 반도체와 자동차를 중심으로 한 수출 지표는 역대급 호조를 이어가고 있지만, 고물가와 고금리 장기화로 인해 내수 시장은 여전히 차갑게 얼어붙어 있습니다. 기업들 역시 제조업 재고가 누적되고 인건비 등 운영 비용 부담이 커지면서 향후 경기에 대한 기대감을 낮추고 있습니다. 이는 거시적인 지표인 수출과 국민들이 실제 생활에서 느끼는 실물 경기 사이에 상당한 온도 차이가 존재함을 시사합니다. 정부의 내수 진작 대책에도 불구하고 가계의 가처분소득이 감소하면서 소비 지출이 제한받고 있습니다. 환율 상승에 따른 수입 물가 부담까지 가중되면서 당분간 서민 경제의 어려움은 쉽게 해소되기 어려울 것으로 보입니다.`,
  keyTerms:[{term:`소비자심리지수`,explanation:`소비자들이 현재와 미래의 경제 상황을 어떻게 느끼고 있는지를 숫자로 나타낸 지표로, 100보다 크면 긍정적임을 의미합니다.`}],
  history:`코로나19 팬데믹 이후 누적된 인플레이션과 가계 부채 증가가 장기간 한국 경제의 내수 회복의 발목을 잡고 있습니다.`,
  players:`금리 정책을 결정하는 한국은행과 물가 안정을 관리하는 기획재정부, 그리고 실제 소비의 주체인 가계가 중심입니다.`,
  current:`수출 대기업의 실적은 견조하지만, 그 온기가 중소기업과 가계로 흘러가지 못하는 구조적 양극화가 심화된 상태입니다.`,
  outlook:`한국은행의 금리 인하 사이클 진입 속도와 정부의 연말 소비 촉진 정책의 실제 효과에 따라 내수 회복 여부가 결판날 전망입니다.`,
  sources:[{title:`11월 체감경기 둔화, 엇갈리는 수출과 내수 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`얼어붙은 소비심리, 고금리·고물가 여파 지속 - 조선일보`,url:`https://www.chosun.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 중간선거 민주당 상·하원 장악, 트럼프 행정부 후반기 제동`,
  metrics:[`상원 다수당 탈환`,`하원 의석 20석 이상 추가 확보`],
  summary:`이달 초 치러진 미국 중간선거에서 민주당이 예상을 깨고 상원과 하원을 모두 탈환하며 의회 권력을 장악하는 이변을 연출했습니다. 선거 기간 내내 고물가에 대한 불만과 막대한 관세 부담, 그리고 강경한 이민 정책에 대한 유권자들의 반발이 거세게 일었습니다. 특히 인공지능(AI) 데이터센터 건립과 관련된 전력망 부족 이슈 등 인프라 문제까지 겹치면서 표심이 야당으로 쏠린 것으로 분석됩니다. 이번 선거 결과로 인해 도널드 트럼프 대통령 행정부 2기의 후반기 국정 장악력은 크게 약화될 수밖에 없는 상황입니다. 민주당이 입법권과 예산 편성권을 손에 쥐면서 트럼프 행정부의 주요 정책에 대한 전방위적인 견제와 제동이 본격화될 예정입니다. 향후 행정부를 향한 청문회와 대대적인 조사가 이어질 것으로 보여 워싱턴 정가의 치열한 갈등이 불가피합니다.`,
  keyTerms:[{term:`중간선거`,explanation:`미국에서 대통령의 임기 4년 중 2년 차에 실시되는 선거로, 현직 대통령의 국정 운영에 대한 중간 평가 성격을 가집니다.`}],
  history:`2024년 대선에서 공화당이 승리하며 출범한 트럼프 행정부 2기는 감세와 강경 이민 정책 등 강력한 미국 우선주의 기조를 추진해 왔습니다.`,
  players:`행정부를 이끄는 도널드 트럼프 대통령 및 공화당 지도부와, 의회 권력을 되찾은 민주당 지도부가 정국 주도권을 놓고 대립합니다.`,
  current:`유권자들이 물가 상승과 과도한 정책 드라이브에 피로감을 느끼며 견제 심리가 발동해 의회 권력이 전격 교체되었습니다.`,
  outlook:`예산안 처리와 주요 법안 통과를 놓고 양당의 극한 대치가 예상되며, 이는 미국의 글로벌 무역 정책에도 간접적인 영향을 미칠 것입니다.`,
  sources:[{title:`민주당, 미 의회 권력 탈환... 트럼프 정책 제동 걸리나 - NYT`,url:`https://www.nytimes.com/`},{title:`물가와 관세 역풍, 미 중간선거 민주당 승리 이끌어 - WSJ`,url:`https://www.wsj.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`선전 APEC 계기 미·중·러 3자 회담 성사, 한중 FTA 서비스 협상 타결`,
  metrics:[`미·중·러 3자 회담 개최`,`한중 FTA 서비스 분야 완전 타결`],
  summary:`중국 선전에서 개최된 아시아태평양경제협력체(APEC) 정상회의를 계기로 미국, 중국, 러시아 정상이 참석하는 사상 첫 3자 정상회담이 성사되어 전 세계의 이목이 집중되었습니다. 도널드 트럼프 미국 대통령, 시진핑 중국 국가주석, 블라디미르 푸틴 러시아 대통령은 전격적인 만남을 갖고 글로벌 핵위험 감소와 무기 확산 방지를 위한 실무 대화 재개에 합의했습니다. 이는 그동안 극도로 경색되었던 3대 강대국 간의 긴장을 완화하는 중대한 외교적 성과로 평가받고 있습니다. 한편, 이번 APEC 무대에서는 한국과 중국의 통상 외교도 큰 진전을 이루었습니다. 양국 정상회담을 통해 그동안 지연되었던 한중 자유무역협정(FTA)의 서비스 및 투자 부문 후속 협상이 마침내 실질적으로 타결되었습니다. 이로써 K-콘텐츠와 의료, 법률 등 한국 서비스 기업들의 중국 시장 진출 장벽이 크게 낮아질 것으로 기대됩니다.`,
  keyTerms:[{term:`자유무역협정`,explanation:`국가 간에 물품이나 서비스를 수출입할 때 관세 등 무역 장벽을 줄이거나 없애기로 약속하는 국가 간의 조약입니다.`}],
  history:`미중 패권 경쟁과 러시아의 우크라이나 침공 이후 강대국 간의 대화가 단절되면서 글로벌 지정학적 긴장은 최고조에 달해 있었습니다.`,
  players:`세계 질서를 주도하는 미국의 트럼프 대통령, 중국의 시진핑 주석, 러시아의 푸틴 대통령, 그리고 경제 협력 확대에 나선 한국 정부입니다.`,
  current:`우발적인 군사 충돌을 방지해야 한다는 3국의 공감대가 형성되면서 APEC이라는 다자회의 무대를 활용한 깜짝 만남이 이루어졌습니다.`,
  outlook:`이번 3자 회담의 합의가 실제 핵 감축 및 대러 제재 완화로 이어질지 실무 협상 과정에 전 세계 외교가의 관심이 집중될 전망입니다.`,
  sources:[{title:`강대국 정상들의 전격 만남, 핵위기 완화 물꼬 트나 - BBC`,url:`https://www.bbc.com/`},{title:`한중 FTA 서비스 후속협상 타결, K콘텐츠 진출 기대 - 중앙일보`,url:`https://www.joongang.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`2027 수능 AI 부정행위 파장 확산, 교육부 장관 전격 사임`,
  metrics:[`AI 부정행위 의심 150여 건 적발`,`수능 관리 부실 관련 특별법 발의`],
  summary:`이달 치러진 2027학년도 대학수학능력시험에서 초소형 인공지능(AI) 기기를 활용한 대규모 부정행위 의혹이 불거지며 사회적 파장이 눈덩이처럼 커지고 있습니다. 교육당국의 조사 결과, 귀에 꽂는 초소형 웨어러블 기기와 연동된 AI 모델을 통해 실시간으로 정답을 제공받은 사례가 무더기로 적발되었습니다. 사상 초유의 첨단 기술 부정행위에 수험생과 학부모들의 분노가 폭발하면서 시험의 공정성이 뿌리째 흔들리고 있습니다. 사태의 심각성을 인지한 국회는 즉각 진상 규명에 나섰고, 관리 감독 부실에 대한 책임을 지고 교육부 장관이 전격 사임했습니다. 정치권은 여야를 막론하고 교육 시스템의 신뢰 붕괴를 질타하며 대책 마련을 촉구하고 있습니다. 현재 국회에서는 시험장 내 첨단 전파 차단기 설치 의무화와 AI 부정행위자에 대한 형사 처벌을 대폭 강화하는 특별법 개정안이 속도감 있게 추진되고 있습니다.`,
  keyTerms:[{term:`대학수학능력시험`,explanation:`한국에서 대학에 진학하기 위해 고등학생들이 치르는 국가 수준의 표준화된 학업 능력 평가 시험입니다.`}],
  history:`생성형 AI 기술이 일상화되면서 교육 현장에서는 과제 대필을 넘어 실제 시험장까지 AI가 악용될 수 있다는 경고가 꾸준히 제기되어 왔습니다.`,
  players:`시험을 주관하는 교육부 및 한국교육과정평가원, 기술 악용을 시도한 일부 수험생 단체, 그리고 분노한 학부모와 대책 마련에 나선 국회입니다.`,
  current:`기존의 금속 탐지기나 감독관의 육안으로는 적발하기 힘든 신종 AI 기기들이 시험장에 무단으로 반입되면서 기존 방역망이 완전히 무너졌습니다.`,
  outlook:`이번 사태를 계기로 향후 수능을 비롯한 모든 국가 고시의 감독 방식이 첨단 전파 차단 및 AI 탐지 중심으로 전면 개편될 가능성이 매우 높습니다.`,
  sources:[{title:`수능 시험장 뚫은 귓속 AI, 커닝 사태 일파만파 - KBS`,url:`https://news.kbs.co.kr/`},{title:`사상 초유의 부정행위 여파로 교육부 장관 물러나 - 한겨레`,url:`https://www.hani.co.kr/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`자율형 AI 에이전트 기업 도입 본격화, 글로벌 업무 환경 대변혁`,
  metrics:[`글로벌 대기업 AI 에이전트 도입률 70% 돌파`,`사무 자동화 성공률 85% 달성`],
  summary:`단순한 대화형 챗봇을 넘어 스스로 계획을 세우고 작업을 수행하는 자율형 AI 에이전트가 글로벌 기업 환경에 빠르게 안착하고 있습니다. 사용자가 목표만 제시하면, AI가 스스로 데이터를 분석하고 문서를 작성해 이메일 발송까지 다단계 작업을 자율적으로 완료합니다. 이러한 기술의 발전은 기존의 반복적인 사무 및 운영 업무의 효율성을 획기적으로 끌어올리고 있습니다. 최근 글로벌 IT 조사기관의 발표에 따르면 주요 대기업의 도입률이 급증하며 엔터프라이즈 소프트웨어 시장의 판도를 바꾸고 있습니다. 다만 인간의 개입 없이 중요한 결정이 내려지는 과정에서 발생할 수 있는 오류와 책임 소재에 대한 우려도 공존합니다. 이에 따라 기업들은 AI의 작업 내역을 투명하게 모니터링하고 최종 승인 권한을 철저히 통제하는 내부 거버넌스 시스템 구축에 사활을 걸고 있습니다.`,
  keyTerms:[{term:`자율형 AI 에이전트`,explanation:`사람이 일일이 지시하지 않아도 스스로 상황을 판단하고 여러 단계의 도구를 사용해 최종 목표를 달성하는 고도화된 인공지능 프로그램입니다.`}],
  history:`2023년 대규모 언어 모델의 폭발적 성장 이후, 업계는 단순한 텍스트 생성을 넘어 실제 물리적, 논리적 행동을 자율적으로 수행하는 시스템 개발에 집중해 왔습니다.`,
  players:`에이전트 인프라를 제공하는 마이크로소프트, 오픈AI, 구글 등 빅테크 기업과 이를 활용해 생산성을 극대화하려는 다국적 기업들입니다.`,
  current:`복잡한 코딩이나 기획 업무의 초기 단계까지 AI가 독자적으로 완벽히 수행할 수 있는 수준에 이르러, 화이트칼라 직군의 업무 방식이 재편되고 있습니다.`,
  outlook:`개별 에이전트 간의 협업(Multi-Agent) 시스템이 고도화됨에 따라 향후 기업 내 부서 간 소통과 데이터 처리 속도가 기하급수적으로 빨라질 것으로 예상됩니다.`,
  sources:[{title:`자율 에이전트가 바꾸는 기업의 미래 - Bloomberg`,url:`https://www.bloomberg.com/`},{title:`업무 자동화의 끝, 에이전트 시대 개막 - FT`,url:`https://www.ft.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`초거대 AI 전력난 심화, 차세대 원전(SMR) 및 액체 냉각 기술 경쟁 가속`,
  metrics:[`AI 데이터센터 전력 소모량 3배 폭증`,`SMR 인프라 관련 벤처 투자 200억 달러 돌파`],
  summary:`전 세계적으로 초거대 인공지능 모델의 학습과 추론 수요가 폭증하면서 데이터센터가 소비하는 전력과 발열 문제가 IT 업계의 최대 당면 과제로 떠올랐습니다. 기존의 화석 연료나 불규칙한 신재생 에너지로는 24시간 가동되는 대규모 AI 인프라의 막대한 전력 수요를 감당하기 역부족인 상황입니다. 이로 인해 글로벌 빅테크 기업들은 탄소를 배출하지 않으면서도 안정적인 대규모 전력 공급이 가능한 차세대 소형모듈원전 개발과 투자에 막대한 자금을 쏟아붓고 있습니다. 더불어 수만 대의 칩에서 뿜어져 나오는 엄청난 열을 식히기 위해 공기 대신 특수 용액을 사용하는 액체 냉각 기술 도입도 빠르게 상용화되고 있습니다. 이러한 에너지 및 인프라 혁신 경쟁은 단순한 기술의 문제를 넘어 국가 간의 AI 패권 경쟁, 즉 인프라 주권 확보 차원으로 비화하고 있습니다. 전력 확보가 곧 글로벌 AI 경쟁력으로 직결되는 셈입니다.`,
  keyTerms:[{term:`소형모듈원전`,explanation:`기존의 거대한 발전소보다 크기를 대폭 줄여 공장에서 부품을 생산해 현장에서 조립할 수 있는 차세대 소형 원자로 기술입니다.`}],
  history:`조 단위의 매개변수를 가진 초거대 모델들이 앞다투어 출시되면서 연산에 필요한 데이터센터의 전력 소모량이 기하급수적으로 폭증해 왔습니다.`,
  players:`막대한 자본을 바탕으로 에너지 자립을 시도하는 주요 글로벌 빅테크 기업들과 차세대 원전 및 냉각 기술을 보유한 에너지 스타트업들입니다.`,
  current:`전기 요금 급등과 환경 단체의 탄소 배출 규제 압박이 거세지자, IT 기업들이 직접 발전소와 첨단 냉각 설비 구축에 뛰어들며 산업 간 경계가 허물어지고 있습니다.`,
  outlook:`기술적 완성도 확보와 함께 각국 규제 당국의 원전 안전성 승인이 차세대 인프라 상용화의 핵심 관건이 될 것이며, 관련 에너지 테크 시장이 급격히 성장할 전망입니다.`,
  sources:[{title:`AI 전력난 해결사로 떠오른 SMR - WSJ`,url:`https://www.wsj.com/`},{title:`데이터센터를 식혀라, 액체 냉각 시대 개막 - AP`,url:`https://apnews.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`딥페이크 범죄 급증에 사회적 신뢰 위기, AI 워터마크 의무화 법안 본격 시행`,
  metrics:[`올해 딥페이크 금융 사기 피해액 500억 원 돌파`,`디지털 콘텐츠 워터마크 도입 기업 비율 90% 상회`],
  summary:`최근 생성형 AI 기술을 악용한 딥페이크 보이스피싱과 영상 합성 사기 범죄가 급증하면서 한국 사회 전반의 상호 신뢰가 심각한 위협을 받고 있습니다. 유명 정치인이나 가족의 목소리와 얼굴을 똑같이 모방해 금전을 요구하거나 가짜 뉴스를 퍼뜨리는 수법이 교묘해져 일반인들이 진위를 판별하기가 사실상 불가능해졌습니다. 이러한 사회적 혼란을 막기 위해 정부는 오늘부터 모든 상업용 및 공공 AI 생성물에 출처를 명확히 밝히는 워터마크 의무화 법안을 전면 시행했습니다. 이제 플랫폼 사업자들은 텍스트, 이미지, 영상 등 생성형 콘텐츠에 육안이나 시스템으로 식별 가능한 표식을 반드시 삽입해야 합니다. 이를 어길 경우 강력한 징벌적 손해배상과 무거운 형사 처벌이 뒤따르게 됩니다. 당국은 이와 함께 경찰 내 딥페이크 전담 수사 부서를 대폭 확대하고, 실시간으로 위조를 판별하는 첨단 방어 기술 도입을 서두르고 있습니다.`,
  keyTerms:[{term:`워터마크`,explanation:`디지털 이미지나 영상, 오디오 파일에 그것이 인공지능이나 특정 주체에 의해 만들어졌음을 알리는 숨겨진 표식이나 마크를 넣는 기술입니다.`}],
  history:`생성형 기술의 대중 접근성이 크게 높아지면서 누구나 쉽게 고품질의 합성 콘텐츠를 만들 수 있게 되었고, 이를 지능형 범죄에 악용하는 사례가 독버섯처럼 퍼졌습니다.`,
  players:`가짜 콘텐츠를 양산하는 다국적 사이버 범죄 조직과 이를 막으려는 한국 정부 당국, 그리고 방어 기술을 개발하는 사이버 보안 기업들입니다.`,
  current:`선거 개입이나 대규모 금융 사기와 같은 심각한 사회적 피해가 연이어 발생하자, 강력한 법적 규제의 필요성에 대한 전 국민적 공감대가 형성되어 법안이 빠르게 통과되었습니다.`,
  outlook:`초강경 법적 규제와 함께 암호학 기반의 콘텐츠 원본 인증 기술(C2PA)이 웹 브라우저와 스마트폰 운영체제 수준에서 기본 탑재되는 등 기술적 방어가 한층 촘촘해질 것입니다.`,
  sources:[{title:`딥페이크 범죄와의 전쟁, 워터마크 의무화 시작 - MBC`,url:`https://imnews.imbc.com/`},{title:`진짜보다 더 진짜 같은 가짜, 사회적 신뢰 무너뜨리다 - SBS`,url:`https://news.sbs.co.kr/`}]
}]

  tag:`2026-11-24`,
  label:`2026년 11월 24일 (화)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`젠슨 황의 엔비디아 CEO 전격 복귀 소식에 나스닥이 6.5% 급등하며 글로벌 반도체주가 요동치고 있습니다.`,
  metrics:[`엔비디아 주가 31.5% 폭등`,`나스닥 지수 6.51% 상승`],
  summary:`엔비디아 이사회가 만장일치로 젠슨 황의 복귀를 결정하면서 글로벌 증시에 큰 충격파를 던졌습니다. 이 소식이 전해지자마자 뉴욕증시에서 엔비디아 주가가 하루 만에 31.5% 폭등했고, 기술주 중심의 나스닥 지수도 6.51% 오르며 마감했습니다. 최근 인공지능(AI) 관련 기업들의 수익성 악화 우려로 흔들리던 투자 심리가 단숨에 살아난 모습입니다. 그러나 미국 정치권에서는 국가 안보와 독점 문제를 들어 의회 청문회 출석을 요구하는 등 논란도 커지고 있습니다. 향후 청문회 결과와 미 당국의 규제 움직임이 반도체 시장의 랠리를 좌우할 핵심 변수가 될 전망입니다.`,
  keyTerms:[{term:`투자 심리`,explanation:`시장에 참여하는 투자자들의 전반적인 심리 상태를 의미하며, 악재나 호재에 따라 매수 또는 매도 방향으로 크게 쏠릴 수 있습니다.`}],
  history:`엔비디아는 AI 칩 시장의 독점적 지위를 누려왔으나, 최근 반독점 조사와 내부 갈등으로 젠슨 황이 일선에서 잠시 물러났던 바 있습니다.`,
  players:`젠슨 황 CEO, 엔비디아 이사회, 그리고 이를 견제하려는 미국 의회 및 민주·공화당 주요 인사들이 얽혀 있습니다.`,
  current:`시장은 리더십 불확실성 해소에 열광하며 매수세를 보였으나, 정치권의 압박이라는 새로운 리스크가 즉각 불거진 상황입니다.`,
  outlook:`다가오는 미 의회 청문회에서 젠슨 황이 어떤 답변을 내놓을지, 그리고 반독점 규제 조치가 실제로 취해질지 시장의 이목이 쏠리고 있습니다.`,
  sources:[{title:`젠슨 황 복귀에 요동치는 시장 - 중앙일보`,url:`https://joongang.co.kr`},{title:`Nvidia CEO Returns Amid Controversy - Time`,url:`https://time.com`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`정부가 내년도 부동산 공시가격 현실화율을 69%로 동결하기로 결정하면서 세부담 증가 속도를 조절했습니다.`,
  metrics:[`공시가격 현실화율 69% 동결`,`일부 단지 보유세 30~40% 상승 예상`],
  summary:`내년도 부동산 공시가격을 산정할 때 적용되는 공시가격 현실화율이 올해와 같은 69% 수준으로 동결됩니다. 정부의 이번 조치는 최근 부동산 시장의 침체 우려와 맞물려 서민과 1주택자의 세부담이 급격히 늘어나는 것을 막기 위한 조치로 풀이됩니다. 이에 따라 현실화율은 5년 연속 같은 수준을 유지하게 되었습니다. 하지만 올해 실거래가 상승폭이 유독 컸던 서울 및 수도권 일부 인기 아파트 단지의 경우, 동결에도 불구하고 시세 상승분이 반영되어 보유세 부담이 30~40% 이상 오를 것으로 추산됩니다. 앞으로 금리 인하 여부와 맞물려 지역별 부동산 양극화 현상이 세부담에도 고스란히 드러날 것으로 보입니다.`,
  keyTerms:[{term:`공시가격 현실화율`,explanation:`정부가 매기는 주택 공시가격을 실제 시장에서 거래되는 시세에 얼마나 가깝게 맞출 것인지를 나타내는 비율입니다.`}],
  history:`과거 정부에서는 조세 형평성을 위해 현실화율을 매년 단계적으로 높이는 계획을 추진했으나, 부동산 급락기와 맞물리며 최근 수년간 동결되어 왔습니다.`,
  players:`공시가격을 산정하는 국토교통부, 세금을 부과하는 기획재정부, 그리고 실제 세부담을 지게 되는 수도권 및 지방 주택 소유자들이 주요 이해관계자입니다.`,
  current:`최근 한국은행의 소비자동향조사에서도 주택가격전망 지수가 8개월 만에 최저치로 떨어지는 등 시장 심리가 차갑게 식어가는 상황입니다.`,
  outlook:`이번 달 말 국회에서 세법 개정안이 어떻게 처리되는지에 따라 최종적인 다주택자 및 고가 1주택자의 세금 부담 규모가 확정될 예정입니다.`,
  sources:[{title:`공시가격 5년 연속 동결 - 연합뉴스`,url:`https://yna.co.kr`},{title:`보유세 부담 어떻게 되나 - 매일경제`,url:`https://mk.co.kr`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`11월 초순 수출액이 774억 달러를 돌파하며 역대 최대 실적을 냈지만, 반도체 편중이 심각하다는 우려가 나옵니다.`,
  metrics:[`1~20일 수출액 774억 달러`,`전체 수출 중 반도체 비중 49.7%`],
  summary:`이달 1일부터 20일까지의 한국 수출액이 774억 달러를 기록하며 같은 기간 기준으로 역대 최대치를 경신했습니다. 글로벌 AI 인프라 확충 수요가 폭발하면서 주력 품목인 반도체 수출이 전년 동기 대비 약 3배 급증한 것이 결정적인 요인이었습니다. 하지만 전체 수출액에서 반도체가 차지하는 비중이 무려 49.7%에 달해 심각한 수출 편중 현상을 보이고 있습니다. 반도체 사이클이 꺾이거나 주요국 무역 갈등으로 관세 타격을 입을 경우, 한국 경제 전체가 크게 흔들릴 수 있다는 지적이 제기됩니다. 전문가들은 자동차와 석유화학 등 다른 주력 산업의 수출 회복과 함께 새로운 먹거리 발굴이 시급하다고 조언합니다.`,
  keyTerms:[{term:`수출 편중`,explanation:`국가의 전체 수출 실적이 반도체나 자동차 등 특정 소수 품목에만 지나치게 의존하여, 해당 산업이 흔들릴 때 국가 경제 전체가 위험해질 수 있는 상태를 뜻합니다.`}],
  history:`한국 경제는 구조적으로 수출 의존도가 매우 높으며, 과거부터 반도체 초호황기마다 착시 효과로 인해 다른 산업의 부진이 가려지는 현상을 겪어왔습니다.`,
  players:`막대한 수출을 견인하는 주요 반도체 대기업들과, 통상 환경 변화에 대응하여 무역 정책을 수립해야 하는 산업통상자원부가 핵심 주체입니다.`,
  current:`글로벌 빅테크 기업들의 칩 수요가 끝없이 이어지면서 반도체 호황이 전체 지표를 끌어올리고 있지만, 보호무역주의 부활이라는 위협이 다가오고 있습니다.`,
  outlook:`미국의 새로운 통상 정책이 구체화되고 글로벌 성장이 둔화됨에 따라, 내년 상반기 한국의 월별 수출 실적에 큰 변동성이 예상됩니다.`,
  sources:[{title:`11월 수출 역대 최대, 반도체가 절반 - 뉴시스`,url:`https://newsis.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`우크라이나 대통령이 지중해 리비아 해역에서 러시아 군함을 드론으로 격침했다고 발표하며 전쟁의 범위가 확산되고 있습니다.`,
  metrics:[`격침된 러시아 군함 1척`,`유엔 안보리 긴급회의 소집`],
  summary:`볼로디미르 젤렌스키 우크라이나 대통령이 리비아 벵가지 해군 기지 인근 지중해 해역에서 러시아 군함을 자폭 드론으로 공격해 침몰시켰다고 공식 발표했습니다. 우크라이나 영토를 넘어 북아프리카 해역까지 공격 범위가 넓어지면서 2년 넘게 이어져 온 전쟁의 전선 확대 양상이 뚜렷해지고 있습니다. 게다가 발트해 핀란드만 인근에서도 러시아 화물선이 드론 공격을 받아 화재가 발생하는 등 유럽 전역으로 무력 충돌의 파장이 미치고 있습니다. 동시에 러시아가 우크라이나의 주요 전력망을 집중 공습해 심각한 겨울철 에너지 위기가 닥치면서, 유엔 안전보장이사회는 긴급회의를 소집하고 양측에 자제를 촉구했습니다. 이번 사태로 아프리카와 유럽의 해상 물류 안전까지 위협받으며 국제사회의 긴장감이 최고조에 달하고 있습니다.`,
  keyTerms:[{term:`전선 확대`,explanation:`전쟁이나 군사적 충돌이 일어나는 지리적 구역이 기존의 무력 분쟁 지역을 넘어 완전히 새로운 곳으로 넓어지는 현상을 의미합니다.`}],
  history:`러시아는 지중해와 아프리카 지역에 해군 기지를 확보하고 영향력을 넓히기 위해 리비아 동부 군벌과 오랫동안 군사적 협력 관계를 유지해 왔습니다.`,
  players:`우크라이나군 특수부대와 러시아 지중해 함대, 그리고 리비아 내부의 무장 세력과 사태를 통제하려는 유엔 안보리가 얽혀 있는 상황입니다.`,
  current:`우크라이나가 본토 방어를 넘어 러시아의 해외 군사 자산을 직접 타격하는 과감한 비대칭 전술을 구사하며 상대를 강력하게 압박하고 있습니다.`,
  outlook:`이번 사태에 대한 러시아의 보복 수위와 북대서양조약기구(NATO)의 지중해 해상 경계 강화 조치가 향후 전쟁 확산 여부의 중대한 분수령이 될 것입니다.`,
  sources:[{title:`우크라이나, 리비아 해상서 러시아 군함 타격 - 연합뉴스`,url:`https://yna.co.kr`},{title:`UN Security Council holds emergency meeting - CBS News`,url:`https://cbsnews.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`정부가 국가정보원장 후보자에 강금실 전 장관을 지명하는 등 파격적인 외교·안보 라인 대폭 개편을 단행했습니다.`,
  metrics:[`여성 국정원장 후보자 1호`,`교체된 주요 부처 3곳`],
  summary:`정부가 현 정부 출범 이후 최대 규모의 외교·안보 라인 개각 인사를 단행했습니다. 가장 눈에 띄는 것은 국가정보원장 후보자로 강금실 전 법무부 장관을 전격 지명한 것으로, 국회 청문회를 통과하면 사상 첫 여성 국정원장이 탄생하게 됩니다. 아울러 외교부 장관 후보자에는 임웅순 현 외교부 고위 인사가, 통일부 장관 후보자에는 홍익표 의원, 행정안전부 장관 후보자에는 한준호 의원이 각각 지명되었습니다. 이번 인사는 최근 급변하는 글로벌 안보 환경에 능동적으로 대처하고 국정 동력을 새롭게 확보하려는 대통령의 강력한 의지가 반영된 것으로 해석됩니다. 여당은 파격적인 인사라며 기대감을 보였지만, 야당은 후보자의 과거 이력을 집중적으로 문제 삼을 기세입니다.`,
  keyTerms:[{term:`개각`,explanation:`대통령이 국정 쇄신이나 정치적 분위기 전환을 위해 정부 부처의 장관 등 주요 고위직 인사를 대대적으로 교체하는 것을 뜻합니다.`}],
  history:`최근 국제 정세의 불확실성이 커지고 국내 정치적으로도 쇄신의 필요성이 대두되면서, 핵심 권력 기관장과 외교 라인의 전면적인 교체설이 꾸준히 제기되어 왔습니다.`,
  players:`고위 공직자 임명권을 가진 대통령과 새롭게 지명된 강금실 후보자 등 내정자들, 그리고 청문회에서 검증의 칼날을 벼르는 여야 의원들입니다.`,
  current:`특히 헌정 사상 최초의 여성 국가정보원장 발탁이라는 파격적인 카드를 꺼내 들면서 정치권 안팎에서 큰 화제와 함께 치열한 논쟁을 불러일으키고 있습니다.`,
  outlook:`향후 국회에서 진행될 인사청문회 과정에서 후보자들의 자질과 정책 비전을 둘러싸고 여야 간의 팽팽한 정치적 공방이 벌어질 전망입니다.`,
  sources:[{title:`국정원장에 강금실 지명... 파격 인사 - 중앙일보`,url:`https://joongang.co.kr`},{title:`외교안보 라인 전면 교체 - KBS`,url:`https://news.kbs.co.kr`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`법무부 장관 및 KBS 사장 후보자에 대한 국회 인사청문회가 열리면서 여야 간의 팽팽한 기싸움이 벌어지고 있습니다.`,
  metrics:[`청문회 진행 후보자 2명`,`여야 질의 응답 10시간 이상 지속`],
  summary:`국회가 주요 권력 기관장 후보자들에 대한 본격적인 인사청문회 정국에 돌입했습니다. 23일 열린 이용철 법무부 장관 후보자 청문회에서는 과거 특정 사건에 대한 공소취소 지휘 여부와 검찰의 정치적 중립성을 두고 야당 의원들의 매서운 추궁이 쏟아졌습니다. 같은 날 진행된 이태현 KBS 사장 후보자 청문회에서도 공영방송의 수신료 분리 징수 문제와 과거 보도의 편향성 논란을 둘러싸고 여야가 거세게 충돌했습니다. 야당은 부적격 인사라며 자진 사퇴를 압박하는 반면, 여당은 업무 전문성이 탁월한 적임자라며 적극적으로 후보자 방어에 나섰습니다. 이번 청문회 결과가 향후 정국 주도권과 이어질 연말 예산안 처리에도 막대한 영향을 미칠 것으로 분석됩니다.`,
  keyTerms:[{term:`인사청문회`,explanation:`대통령이 장관 등 고위 공직자를 최종 임명하기 전에, 국회가 나서서 해당 후보자의 도덕성과 업무 능력, 자질 등을 공개적으로 검증하는 제도입니다.`}],
  history:`새 정부 출범이나 대규모 개각 때마다, 국회 청문회는 후보자의 도덕성 검증을 넘어 여야 간 정치적 힘겨루기의 핵심 무대로 활용되어 왔습니다.`,
  players:`혹독한 질문을 던지는 국회 관련 상임위원회 소속 야당 의원들과 후보자를 방어하는 여당 의원, 그리고 각종 논란을 해명해야 하는 후보자입니다.`,
  current:`정책 비전 검증보다는 과거의 발언이나 편향성, 가족의 도덕성 문제 등 신상 털기 위주의 공방이 재현되며 회의가 수차례 정회되는 파행을 겪고 있습니다.`,
  outlook:`국회가 청문보고서 채택을 거부하더라도 대통령이 임명을 강행할 가능성이 높은 만큼, 최종 임명 강행 여부와 이에 따른 정국 경색 심화 여부가 관건입니다.`,
  sources:[{title:`장관 후보자 송곳 검증 예고 - 뉴시스`,url:`https://newsis.com`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`전 세계의 기대를 모았던 유엔 기후변화협약 총회(COP31)가 화석연료 감축 문구를 둘러싼 대립 끝에 합의문 없이 종료되었습니다.`,
  metrics:[`총회 참가국 190여 개국`,`공식 합의문 도출 실패`],
  summary:`호주에서 열린 제31차 유엔 기후변화협약 당사국총회(COP31)가 2주간의 마라톤 협상에도 불구하고 결국 합의 결렬을 선언하며 막을 내렸습니다. 이번 총회의 최대 쟁점이었던 화석연료의 단계적 퇴출 및 감축 문구를 최종 합의문에 명시할 것인가를 두고 산유국들과 기후 취약국들이 극명하게 대립했습니다. 사우디아라비아 등 산유국들의 강력한 반발에 막혀 타협점을 찾지 못했고, 개발도상국을 위한 기후 적응 기금 지원 규모에 대해서도 선진국들의 약속이 부족하다는 비판이 쏟아졌습니다. 세계 최대의 기후 회의가 이처럼 빈손으로 끝나면서 2030년까지 온실가스를 대폭 줄이겠다는 국제사회의 탄소중립 목표 달성에 짙은 먹구름이 끼게 되었습니다.`,
  keyTerms:[{term:`합의 결렬`,explanation:`중요한 국제 회의나 협상에 참여한 국가들이 서로의 의견 차이를 끝내 좁히지 못해, 최종적인 약속이나 결정문에 도달하지 못하고 회의가 무산되는 것을 의미합니다.`}],
  history:`지난 수년간의 기후 총회에서는 화석연료의 '단계적 감축'이라는 완화된 표현만 겨우 합의되었을 뿐, 완전한 퇴출을 명문화하려는 시도는 매번 좌절되어 왔습니다.`,
  players:`화석연료 생산으로 부를 축적하는 주요 산유국 연합, 빠른 탄소 감축을 촉구하는 유럽연합, 그리고 당장 생존의 위협을 받는 섬나라 등 기후 취약국들입니다.`,
  current:`전 세계적으로 폭염과 홍수 등 이상 기후 피해가 속출하고 있음에도, 자국의 경제적 이익을 우선시하는 태도가 기후 위기 극복이라는 공동 목표를 압도했습니다.`,
  outlook:`이번 파행으로 개별 국가나 기업 차원의 자발적인 조치에 의존할 수밖에 없게 되었으며, 내년 회의가 열리기 전까지 글로벌 환경 단체들의 거센 항의가 예상됩니다.`,
  sources:[{title:`COP31 ends in failure - Global Issues`,url:`https://globalissues.org`},{title:`기후 총회, 화석연료 퇴출 명문화 실패 - 한겨레`,url:`https://hani.co.kr`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`인공지능(AI)을 악용한 부정행위를 차단하기 위해 다가오는 수능과 대입 시험 문제지에 고유 식별 표식이 도입됩니다.`,
  metrics:[`고유 식별 코드 100% 적용`,`AI 부정행위 적발 시 응시자격 영구 박탈`],
  summary:`교육 당국이 수능 및 대입 고사에서 초거대 AI 모델을 활용한 신종 부정행위가 기승을 부릴 조짐을 보이자 강력한 대응책을 꺼내 들었습니다. 가장 핵심적인 조치는 모든 문제지에 육안으로는 식별하기 어려운 고유 식별 표식을 인쇄하는 것입니다. 만약 시험 도중 문제지를 초소형 카메라로 몰래 촬영해 외부의 AI로 전송할 경우, 이 표식을 통해 유출한 수험생의 자리와 신원을 즉각 추적할 수 있게 됩니다. 또한, 고사장 내 전파 차단 시스템 고도화와 함께 지능형 부정행위 적발 시 응시 자격 영구 박탈 및 형사 처벌을 강화하는 법령 정비도 속도를 내고 있습니다. 첨단 기술의 발달이 공정한 시험 경쟁마저 위협하면서 입시 당국의 방패 창안 노력도 눈에 띄게 진화하고 있습니다.`,
  keyTerms:[{term:`고유 식별 표식`,explanation:`눈에 잘 띄지 않거나 아주 작은 형태로 각 시험지마다 모두 다르게 인쇄된 특수한 기호 패턴으로, 유출된 사진의 출처를 정확히 추적할 수 있게 해주는 보안 기술입니다.`}],
  history:`과거에는 스마트폰이나 무선 이어폰을 몰래 반입하는 단순 부정행위가 주를 이뤘으나, 최근에는 웨어러블 기기와 AI의 실시간 답변을 결합한 지능형 범죄로 크게 발전했습니다.`,
  players:`공정한 시험 관리를 책임지는 교육부와 평가원, 최신 기술적 해결책을 도입하는 보안 업체, 그리고 입시의 당사자인 수험생과 학부모들입니다.`,
  current:`일부 대학의 수시 전형이나 자격증 시험에서 문제 유출 사고가 발생하면서, 국가 주관 시험의 전반적인 보안 시스템에 대한 국민적 불안감이 커진 상태입니다.`,
  outlook:`새롭게 도입되는 보안 기술의 실효성은 내년 6월 모의평가에서 첫 검증을 받게 되며, 첨단 기기 반입을 단속하는 고사장 앞 풍경도 이전과 크게 달라질 전망입니다.`,
  sources:[{title:`수능 시험지에 AI 방지 워터마크 도입 - 매일경제`,url:`https://mk.co.kr`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`인도네시아 반텐주의 한 대형 캔디 제조 공장에서 거대한 화재가 발생해 수십 명의 사상자가 발생하는 비극이 일어났습니다.`,
  metrics:[`최소 24명 사망`,`현장 노동자 약 100여 명 대피`],
  summary:`인도네시아 자바섬 서부 반텐주에 위치한 대형 캔디 제조 공장에서 원인을 알 수 없는 화재가 발생해 막대한 인명 피해가 발생했습니다. 불길은 가연성 포장재와 설탕 등 인화 물질이 가득한 공장 내부를 순식간에 집어삼켰고, 이 과정에서 미처 대피하지 못한 노동자 최소 24명이 안타깝게 목숨을 잃었습니다. 화재 당시 공장 안에는 약 100여 명의 직원이 근무 중이었으나, 비상구가 각종 짐으로 막혀 있고 화재경보기가 제대로 작동하지 않아 피해를 크게 키운 것으로 드러났습니다. 소방 당국은 밤샘 진화 작업 끝에 큰 불길을 잡았지만, 여전히 잿더미 속에서 실종자 수색 작업을 계속 진행 중입니다. 이번 참사를 계기로 일부 국가의 열악한 제조 시설이 가진 안전 불감증 문제가 다시 도마 위에 올랐습니다.`,
  keyTerms:[{term:`안전 불감증`,explanation:`위험한 사고가 벌어질 수 있는 상황임에도 이를 가볍게 여기거나, 만약의 사태를 대비한 안전 규칙 준수와 장비 관리를 심각하게 소홀히 하는 태도를 말합니다.`}],
  history:`동남아시아 등지의 일부 영세한 공장들은 열악한 근무 환경과 허술한 소방 시설, 비용 절감 압박 등으로 인해 이와 같은 대형 화재 참사가 반복해서 발생해 왔습니다.`,
  players:`불의의 사고로 희생된 현지 노동자들과 유가족, 안전 규정을 무시한 공장 운영진, 그리고 이를 관리하고 감독할 책임이 있는 현지 정부 당국입니다.`,
  current:`생존자들과 희생자 유가족들은 비상구 폐쇄와 열악한 대피 시스템에 대해 강력히 분노하며 철저한 진상 규명과 책임자 처벌을 요구하고 있습니다.`,
  outlook:`경찰의 정밀 감식을 통해 정확한 발화 원인이 곧 밝혀질 예정이며, 이번 사건을 계기로 유해 물질을 취급하는 공장들에 대한 대대적인 안전 점검이 뒤따를 것으로 보입니다.`,
  sources:[{title:`Factory fire kills 24 in Indonesia - Education Times`,url:`https://educationtimes.com`},{title:`인도네시아 캔디 공장 화재 참사 - 연합뉴스`,url:`https://yna.co.kr`}]
}]

  tag:`2026-11-23`,
  label:`2026년 11월 23일 (월)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`글로벌 증시가 AI 패닉 셀에 휩싸이며 나스닥과 국내 반도체 주가가 동반 폭락했습니다.`,
  metrics:[`나스닥 지수 5.3% 하락`,`삼성전자 주가 7% 급락`],
  summary:`앤트로픽 상장 직후의 주가 급등락과 일론 머스크의 AI 업계 자금난 경고가 겹치면서 글로벌 기술주에 충격이 발생했습니다. 여기에 엔비디아에 대한 미국 당국의 조사와 대중국 수출 규제 리스크가 다시 부각되었습니다. 그 결과 미국 나스닥 지수가 5.3% 하락하며 이른바 검은 월요일 공포가 확산되었습니다. 이 여파로 필라델피아 반도체 지수도 10%대 폭락을 기록했습니다. 국내 증시 역시 직격탄을 맞아 삼성전자가 7%, SK하이닉스가 5.9% 하락하는 등 뚜렷한 AI 패닉 셀 양상을 보였습니다. 시장에서는 단기적인 AI 버블 붕괴 우려와 함께 막대한 투자 대비 수익성에 대한 근본적인 의구심이 확산되고 있습니다.`,
  keyTerms:[{term:`AI 패닉 셀`,explanation:`인공지능 산업의 수익성이나 미래 전망에 대한 불안감이 커지면서, 투자자들이 관련 주식을 앞다투어 대규모로 내다 파는 현상을 말합니다.`}],
  history:`2023년부터 생성형 AI 붐이 일면서 빅테크 기업들은 천문학적인 자금을 AI 인프라에 쏟아부었습니다.`,
  players:`시장을 주도하는 엔비디아와 AI 모델을 개발하는 앤트로픽, 그리고 기술주 투자자들이 핵심 주체입니다.`,
  current:`AI 투자 대비 수익 회수 시점에 대한 의문이 제기되고 규제 리스크가 겹치면서 투자 심리가 급격히 얼어붙은 상태입니다.`,
  outlook:`엔비디아의 실적 발표와 미국 규제 당국의 구체적인 제재 수위 확정 여부가 향후 시장 방향성을 결정할 전망입니다.`,
  sources:[{title:`미 기술주 폭락... 글로벌 증시 AI 패닉 셀 확산 - 동아일보`,url:`https://www.donga.com/`},{title:`머스크 경고에 흔들리는 AI 버블 - 뉴스1`,url:`https://www.news1.kr/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`주식 시장의 변동성을 제어하기 위해 금융당국이 18년 만에 증권시장안정펀드 투입을 준비하고 있습니다.`,
  metrics:[`18년 만의 펀드 가동`,`수조 원 규모 자금 조성`],
  summary:`최근 코스피 지수가 연일 급락하며 시장 불안이 최고조에 달하자 정부가 긴급 시장 안정 조치에 나섰습니다. 금융당국은 2008년 글로벌 금융위기 이후 18년 만에 처음으로 증권시장안정펀드 가동 준비에 착수했습니다. 이는 증시 폭락으로 인한 투자자들의 패닉을 막고 금융 시스템 전체로 위기가 전이되는 것을 차단하기 위한 선제적 조치입니다. 금융위와 금융권은 수조 원 규모의 실탄을 마련해 시장 상황에 따라 즉각 투입할 수 있도록 세부 실행 계획을 조율 중입니다. 전문가들은 이번 조치가 단기적인 하방 경직성을 제공할 수 있을 것으로 평가하고 있습니다. 다만 근본적인 경제 펀더멘털 개선 없이는 자금 투입의 효과가 제한적일 수 있다는 지적도 나옵니다.`,
  keyTerms:[{term:`증권시장안정펀드`,explanation:`주식 시장이 비정상적으로 폭락할 때, 주가 하락을 막고 시장을 안정시키기 위해 금융회사들이 공동으로 자금을 마련해 주식을 사들이는 임시 펀드입니다.`}],
  history:`과거 2003년 카드채 사태나 2008년 글로벌 금융위기 등 증시가 극도로 불안정할 때 긴급 투입되어 시장의 구원투수 역할을 해왔습니다.`,
  players:`정책을 결정하는 금융위원회와 실제 자금을 갹출하는 주요 은행, 증권사 등 금융권 기관들이 참여합니다.`,
  current:`AI 기술주 폭락과 거시경제 불안이 겹치면서 국내 증시에서 대규모 자금 이탈이 발생할 조짐을 보이고 있습니다.`,
  outlook:`펀드의 실제 투입 시기와 1차 집행 규모가 시장의 심리를 진정시킬 수 있을지 귀추가 주목됩니다.`,
  sources:[{title:`금융당국, 코스피 급락에 18년 만의 증안펀드 가동 만지작 - 동아일보`,url:`https://www.donga.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`은행권의 대출 이자 부담이 커지는 가운데 서울 빌라 평균 매매가격이 처음으로 4억 원을 돌파했습니다.`,
  metrics:[`서울 빌라 매매가 4억 원 돌파`,`신용대출 이자 급등`],
  summary:`최근 기준금리 변동기를 틈타 시중은행들의 신용대출 이자 상승 폭이 예금금리 인상 폭의 2배를 웃돌면서 차주들의 이자 부담이 가중되고 있습니다. 이처럼 대출 문턱과 비용이 높아지며 예대금리차 확대 속에서도 부동산 시장의 풍선효과는 뚜렷하게 나타나고 있습니다. 특히 치솟는 서울 아파트 가격을 감당하지 못한 실수요자들이 다세대 및 연립주택으로 눈을 돌리고 있습니다. 여기에 재개발 등 정비사업에 대한 이른바 몸테크 기대감까지 겹치면서 수요가 폭발했습니다. 그 결과 서울 지역 빌라의 평균 매매가격이 통계 집계 이래 최초로 4억 원을 돌파했습니다. 이는 서민층의 주거 불안이 아파트에서 빌라 시장으로 전이되고 있음을 보여줍니다.`,
  keyTerms:[{term:`예대금리차`,explanation:`예금 금리와 대출 금리의 차이를 말하며, 이 격차가 커질수록 은행은 많은 이익을 얻지만 대출을 받은 사람의 이자 부담은 커지게 됩니다.`}],
  history:`금리 인상기나 변동기마다 은행들이 대출 금리는 빠르게, 예금 금리는 느리게 올리면서 이익을 극대화한다는 비판이 반복되어 왔습니다.`,
  players:`대출 금리를 결정하는 시중 은행들과 주거지를 마련해야 하는 서민 실수요자들이 직접적인 영향을 주고받습니다.`,
  current:`아파트 가격 급등에 지친 수요가 정비사업 호재가 있는 빌라로 몰리며 기형적인 가격 상승세를 만들고 있습니다.`,
  outlook:`금융당국의 금리 인하 압박 및 가계부채 관리 정책에 따라 부동산 시장으로의 자금 유입 양상이 변화할 가능성이 있습니다.`,
  sources:[{title:`대출·예금 금리 격차 심화... 서울 빌라 매매가는 4억 첫 돌파 - 중앙일보`,url:`https://www.joongang.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`야당의 대법원장 탄핵 추진과 장외 투쟁으로 사법부와 정치권의 갈등이 극한으로 치닫고 있습니다.`,
  metrics:[`대법원장 탄핵 최초 발의`,`원로원 반대 성명 발표`],
  summary:`더불어민주당을 비롯한 야당이 조희대 대법원장에 대한 탄핵 추진과 조작기소 특검 등 강도 높은 사법 개혁 드라이브를 걸며 여당과의 대립이 격화되고 있습니다. 야당은 일부 판결의 편향성을 지적하며 사법부를 강하게 압박하는 한편, 주말마다 대규모 장외 투쟁을 이어가고 있습니다. 이에 대해 국민의힘은 사법부의 독립성을 심각하게 훼손하는 반헌법적 행태라며 강하게 반발하고 있습니다. 이례적인 초유의 대법원장 탄핵 움직임에 대해 정대철 헌정회장 등 정치권 원로들까지 나서 우려의 목소리를 냈습니다. 헌정 사상 전례가 없는 입법부와 사법부 간의 직접적인 충돌 양상으로 인해 정국은 한 치 앞을 내다보기 힘든 혼돈 속으로 빠져들고 있습니다.`,
  keyTerms:[{term:`사법 개혁`,explanation:`재판의 공정성을 높이고 법원과 검찰의 제도를 국민의 눈높이에 맞게 고치려는 일련의 정치적, 법적 움직임을 뜻합니다.`}],
  history:`특정 주요 정치인들에 대한 재판 결과가 나올 때마다 여야는 판결의 공정성을 두고 지속적으로 공방을 벌여왔습니다.`,
  players:`국회 다수당을 차지한 야당과 이를 방어하는 여당, 그리고 압박을 받고 있는 대법원 및 사법부가 중심에 있습니다.`,
  current:`탄핵안 발의라는 초강수가 등장하면서 정치적 갈등이 제도적 시스템의 위기로 번질 수 있다는 위기감이 고조되고 있습니다.`,
  outlook:`실제 탄핵안의 국회 본회의 표결 여부와 이에 대한 여론의 향배가 연말 정국의 가장 큰 뇌관이 될 것입니다.`,
  sources:[{title:`사법부-정치권 극한 대치... 대법원장 탄핵 공방 격화 - 조선일보`,url:`https://www.chosun.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`수능 AI 부정행위 논란의 책임을 지고 최교진 교육부 장관이 전격 사퇴했습니다.`,
  metrics:[`교육부 장관 사의 즉각 수락`,`총리 중심 사후 대응반 가동`],
  summary:`올해 치러진 2027학년도 대학수학능력시험에서 AI 기기를 악용한 대규모 부정행위 정황이 드러나면서 사회적 파장이 일파만파 커졌습니다. 초유의 수능 관리 부실 사태에 여론이 악화되자 최교진 교육부 장관은 결국 사의를 표명했습니다. 대통령은 사안의 심각성을 고려해 장관의 사의를 즉각 수락하며 문책 인사를 단행했습니다. 혼란을 수습하기 위해 정부는 비상 상황을 지휘할 국무총리 대행 체제 기반의 사후 대응반을 가동하고 대책 마련에 나섰습니다. 수험생과 학부모들의 불안감이 극에 달한 상황에서, 정부는 성적 처리 일정과 후속 조치 등에서 투명성을 회복해야 하는 무거운 과제를 안게 되었습니다.`,
  keyTerms:[{term:`국무총리 대행 체제`,explanation:`특정 부처의 장관이나 수장이 공석일 때, 국가 행정의 2인자인 국무총리가 직접 나서서 해당 부처의 비상 상황을 지휘하고 수습하는 방식입니다.`}],
  history:`매년 수능에서는 소형 전자기기를 이용한 부정행위가 적발되었으나, 이번처럼 고도화된 AI 기술이 조직적으로 동원된 것은 처음입니다.`,
  players:`관리 책임을 진 교육부와 한국교육과정평가원, 그리고 불안을 호소하는 수십만 명의 수험생 및 학부모들입니다.`,
  current:`장관 사퇴로 1차적인 책임은 물었지만, 실제 부정행위자의 적발과 선의의 피해자 구제 방안을 두고 갑론을박이 이어지고 있습니다.`,
  outlook:`당장 다가온 대입 정시 일정에 차질이 없도록 새로운 시험 감독 메뉴얼과 후속 보완책이 신속하게 발표될 예정입니다.`,
  sources:[{title:`수능 혼란 여파, 교육부 장관 사의 즉각 수락 - 대구MBC`,url:`https://dgmbc.com/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 트럼프 행정부 측이 북한과의 정상회담을 타진했으나 선결 조건 차이로 난항을 겪고 있습니다.`,
  metrics:[`미국 측 정상회담 제안`,`북측 선결 조건 요구`],
  summary:`미국 트럼프 행정부가 북한과의 교착 상태를 타개하기 위해 김정은 국무위원장과의 정상회담 제안을 타진한 것으로 알려졌습니다. 이는 과거의 정상 외교를 복원하여 한반도 및 글로벌 안보의 주도권을 쥐려는 미국의 외교적 계산이 깔려 있습니다. 그러나 북한 측이 회담의 전제 조건으로 강력한 대북 제재 완화 등 까다로운 선결 조건을 제시하면서 초기 조율 과정부터 팽팽한 기싸움이 벌어지고 있습니다. 양측의 물밑 접촉은 확인되었으나, 실질적인 협상 테이블이 마련되기까지는 상당한 이견 조율이 필요해 보입니다. 이로 인해 단기간 내에 북미 대화가 극적으로 성사될 가능성은 불투명해졌다는 분석이 지배적입니다.`,
  keyTerms:[{term:`대북 제재 완화`,explanation:`북한의 핵무기 개발을 막기 위해 국제사회가 취하고 있는 경제적 압박 조치들을 풀어주거나 줄여주는 것을 의미합니다.`}],
  history:`북미 양국은 2019년 하노이 정상회담 결렬 이후 오랫동안 공식적인 고위급 비핵화 협상을 중단한 상태였습니다.`,
  players:`외교적 성과가 필요한 미국 트럼프 행정부와 체제 보장 및 경제적 이익을 요구하는 북한 김정은 정권이 마주하고 있습니다.`,
  current:`미국이 먼저 대화의 손을 내밀었지만, 북한은 과거의 빈손 회담을 피하기 위해 확실한 보상을 먼저 요구하며 버티기에 돌입했습니다.`,
  outlook:`양국 실무진 간의 비밀 접촉이 계속될 예정인 가운데, 한국 및 주변국들의 중재 역할이 어느 때보다 중요해질 전망입니다.`,
  sources:[{title:`미국-북한 접촉 관련 기류, 조건 제시로 난항 - MBC`,url:`https://imnews.imbc.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`한국전력공사 시스템 해킹으로 152만 명의 민감한 개인정보가 유출되는 사고가 발생했습니다.`,
  metrics:[`152만 명 정보 유출`,`보안체계 전면 개편`],
  summary:`한국전력공사가 운영하는 대국민 서비스 한전ON과 전자조달시스템에서 심각한 보안 구멍이 뚫렸습니다. 해킹 공격으로 인해 무려 152만여 명에 달하는 고객 및 기업의 민감한 데이터가 외부로 유출되었습니다. 유출된 데이터에는 이름과 연락처는 물론, 일부 주민등록번호와 계좌 번호까지 포함된 것으로 파악되어 충격을 주고 있습니다. 국가 핵심 인프라 공기업에서 발생한 어처구니없는 사고로 국민의 불안과 비판이 폭주하고 있습니다. 사태의 심각성을 인지한 한전은 즉각적인 대국민 사과와 함께 사이버 보안 체계를 원점에서 전면 개편하는 작업에 착수했습니다.`,
  keyTerms:[{term:`사이버 보안`,explanation:`해커나 악성 프로그램의 공격으로부터 컴퓨터 시스템, 네트워크, 그리고 그 안에 저장된 소중한 데이터를 안전하게 보호하는 기술과 체계를 말합니다.`}],
  history:`공공기관의 정보 시스템은 수많은 국민의 데이터를 보유하고 있어 해커들의 주요 타겟이 되어왔으나, 방어 체계 업데이트는 종종 뒤처졌습니다.`,
  players:`대량의 정보를 관리하는 한국전력공사와 이를 빼낸 신원 미상의 해커 조직, 그리고 피해를 입은 국민과 기업들이 존재합니다.`,
  current:`유출된 금융 및 개인 정보를 이용한 보이스피싱 등 2차 피해 발생 가능성이 우려되어 관계 당국이 긴급 차단에 나섰습니다.`,
  outlook:`정부 차원의 강도 높은 진상 조사와 함께 공공기관 전반의 보안 실태를 재점검하는 대대적인 감사로 이어질 것입니다.`,
  sources:[{title:`한전, 고객·기업 152만명 개인정보 유출 - 다음 뉴스`,url:`https://www.daum.net/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`태안 앞바다에서 실종되었던 어선 해광호의 선체가 수심 53m 해저에서 발견되었습니다.`,
  metrics:[`실종 5일 만에 선체 발견`,`수심 53m 해저 확인`],
  summary:`충남 태안 인근 해상에서 조업 중 연락이 끊겼던 어선 해광호의 침몰 선체가 마침내 수중에서 확인되었습니다. 해양경찰과 해군의 합동 수색팀은 실종 닷새 만에 수심 53m 해저에서 가라앉은 해광호의 선체를 발견했습니다. 안타깝게도 선박에는 한국인 3명과 인도네시아인 4명 등 총 7명의 선원이 타고 있었으며, 아직 생존자나 실종자의 흔적은 확인되지 않았습니다. 현재 해군은 구조함인 통영함과 수중 무인 탐사기 장비를 현장에 투입해 선체 내부와 주변에 대한 정밀 수색을 진행하고 있습니다. 깊은 수심과 빠른 조류 등 열악한 해상 환경 탓에 실종자 수색 작업은 큰 어려움을 겪고 있습니다.`,
  keyTerms:[{term:`수중 무인 탐사기`,explanation:`사람이 직접 들어가기 위험하거나 너무 깊은 바닷속에 들어가, 카메라로 영상을 찍고 로봇 팔로 물건을 건져 올리는 원격 조종 로봇입니다.`}],
  history:`서해안은 조수 간만의 차가 크고 겨울철에는 기상 변화가 심해 어선들의 해난 사고가 빈번하게 발생하는 험난한 해역입니다.`,
  players:`실종된 선원들의 가족들과 악천후 속에서도 밤낮없이 수색 작업을 벌이고 있는 해양경찰, 해군 잠수 요원들입니다.`,
  current:`선체의 위치는 파악되었으나 얽혀있는 어망과 탁한 시야 때문에 선내 진입을 통한 실종자 확인이 지연되고 있습니다.`,
  outlook:`기상 조건이 허락하는 대로 수중 로봇과 특수 잠수사를 교대로 투입하여 선원 수색과 침몰 원인 규명에 집중할 예정입니다.`,
  sources:[{title:`태안 실종 어선 해광호 선체 해저 53m서 발견 - MBC`,url:`https://imnews.imbc.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`제31차 유엔기후변화협약 당사국총회(COP31)가 17년 만에 최종 합의문 채택에 실패했습니다.`,
  metrics:[`17년 만의 합의 결렬`,`기후재원 확대 합의 무산`],
  summary:`전 세계의 기후 변화 대응을 논의하기 위해 모인 COP31 기후총회가 결국 빈손으로 막을 내렸습니다. 이번 총회에서는 화석연료의 완전한 퇴출 시한과 개발도상국을 위한 기후재원 확대 방안이 핵심 의제였습니다. 하지만 비용 부담을 꺼리는 선진국과 즉각적인 자금 지원을 요구하는 개도국 간의 간극이 좁혀지지 않았습니다. 또한 일부 산유국들이 화석연료 단계적 퇴출 문구에 강력히 반발하면서 회의는 파행을 거듭했습니다. 결국 17년 만에 처음으로 만장일치 최종 합의문 채택이 무산되는 초유의 사태가 벌어졌습니다. 이로 인해 지구 온난화를 막기 위한 국제사회의 공동 대응 동력이 크게 상실될 위기에 처했습니다.`,
  keyTerms:[{term:`기후재원`,explanation:`가난한 나라들이 기후 변화로 인한 홍수나 가뭄 등의 피해를 막고, 친환경 에너지로 넘어갈 수 있도록 돕기 위해 부유한 선진국들이 내놓는 지원금입니다.`}],
  history:`파리기후협약 이후 세계 각국은 탄소 배출을 줄이기로 약속했지만, 막대한 비용을 누가 어떻게 부담할 것인지를 두고 늘 충돌해 왔습니다.`,
  players:`재정적 여력이 있는 선진국 그룹과, 환경 규제보다 경제 성장이 시급하며 당장의 피해 보상을 요구하는 개발도상국 그룹이 대립합니다.`,
  current:`선진국들의 국내 경제 상황도 녹록지 않아 대규모 해외 지원을 약속하기 어렵고, 산유국들은 자국의 핵심 산업 보호를 위해 버티고 있습니다.`,
  outlook:`내년 열릴 다음 총회까지 각국이 온실가스 감축 목표를 스스로 상향하고 타협점을 찾기 위한 개별적인 외교전이 치열해질 것입니다.`,
  sources:[{title:`COP31 유엔기후총회, 17년 만에 합의문 채택 결렬 - 연합뉴스`,url:`https://www.yna.co.kr/`}]
}]

  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`앤트로픽 호실적 불구 AI 투자 부담 우려에 뉴욕증시·반도체주 폭락`,
  metrics:[`올해 AI 회사채 발행 4,890억 달러 돌파`,`필라델피아 반도체 지수 10.73% 급락`],
  summary:`앤트로픽의 상장과 호실적에도 불구하고 AI 설비투자를 위한 회사채 발행이 올해 4,890억 달러를 돌파하며 자금 조달 부담 우려가 시장을 덮쳤습니다. 이로 인해 투자자들의 불안 심리가 커지면서 뉴욕 증시에서 대규모 투매가 발생했습니다. 나스닥 지수가 5.28% 하락한 가운데, 특히 필라델피아 반도체 지수는 10.73% 폭락하며 큰 타격을 입었습니다. 끝없는 AI 투자 경쟁이 기업들의 재무 건전성을 위협할 수 있다는 회의론이 주요 원인으로 분석됩니다. 시장은 펀더멘털보다는 단기 유동성 리스크에 극도로 예민하게 반응하고 있는 현재 상태를 보여줍니다.`,
  keyTerms:[{term:`투매`,explanation:`투자자들이 주가 하락을 우려해 보유하고 있는 주식을 손해를 감수하고서라도 급하게 대량으로 내다 파는 현상입니다.`}],
  history:`AI 붐이 시작된 이후 기업들은 대규모 데이터센터 구축과 반도체 확보를 위해 공격적인 투자를 단행해 왔습니다.`,
  players:`앤트로픽, 엔비디아 등 AI 주도 기업들과 막대한 자금을 빌려준 글로벌 투자은행들이 깊게 얽혀 있습니다.`,
  current:`예상치 못한 비용 증가와 수익성 회수 지연에 대한 우려가 실적 호조라는 호재를 덮어버린 결정적 전환점입니다.`,
  outlook:`당분간 기술주 전반의 밸류에이션 조정이 불가피하며, 12월 연준의 금리 결정에 따라 시장 변동성이 더욱 커질 전망입니다.`,
  sources:[{title:`뉴욕증시 AI 투매 및 반도체 급락 - 연합뉴스`,url:`https://yna.co.kr`},{title:`AI 설비투자 자금 조달 우려 확산 - 뉴스핌`,url:`https://newspim.com`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국은행, 견조한 수출과 물가 상방 압력에 11월 기준금리 3.25%로 인상 유력`,
  metrics:[`기준금리 3.00%에서 3.25%로 0.25%p 인상 전망`,`올해 실질 GDP 성장률 3%대 후반 상향 예상`],
  summary:`수출 호조와 양호한 성장세 속에서 근원물가 상승 압력이 지속되자, 한국은행 금융통화위원회가 오는 26일 회의에서 기준금리 인상을 단행할 것으로 매우 유력하게 전망됩니다. 시장 전문가들은 현재 연 3.00%인 기준금리가 0.25%포인트 오른 3.25%가 될 것으로 내다보고 있습니다. 이와 함께 한국은행이 올해 실질 GDP 성장률 전망치를 기존 수치보다 높은 3%대 후반으로 수정할 가능성도 제기되고 있습니다. 이는 물가 안정을 위한 선제적 조치이자 경제 체력에 대한 자신감의 표현입니다. 향후 대출 금리 상승으로 인한 내수 위축 여부가 가장 큰 관심사로 떠오르고 있습니다.`,
  keyTerms:[{term:`기준금리 인상`,explanation:`중앙은행이 시중 은행에 돈을 빌려줄 때 적용하는 기본 금리를 올리는 조치로, 시중에 풀린 돈을 거둬들여 물가를 안정시키는 효과가 있습니다.`}],
  history:`그동안 물가 하향 안정세를 주시하며 금리 동결 기조를 유지해왔으나, 최근 견조한 거시경제 지표와 물가 불안이 겹치며 긴축 기조로 선회하게 되었습니다.`,
  players:`기준금리 결정권을 쥔 한국은행 금통위와 대출 이자 부담 증대를 안고 있는 가계 및 기업들이 직접적인 영향을 받습니다.`,
  current:`글로벌 금리 인하 기대감이 한풀 꺾인 가운데, 한국이 독자적으로 거시경제 안정을 위한 긴축 전환을 눈앞에 둔 시점입니다.`,
  outlook:`금리 인상 시 주택담보대출 등 시중 금리가 동반 상승할 것이며, 가계부채 관리 효과와 내수 소비 위축이라는 양면적 결과가 나타날 것입니다.`,
  sources:[{title:`한은 11월 금통위 금리 인상 유력 - 연합뉴스`,url:`https://yna.co.kr`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`EU, 연매출 7억 5천만 유로 이상 빅테크 대상 '디지털세' 공식 추진… 무역 마찰 예고`,
  metrics:[`글로벌 연매출 7억 5,000만 유로 이상 기업 대상`,`EU 차기 장기예산안 내 주요 재원 확충안으로 포함`],
  summary:`유럽연합(EU)이 다국적 거대 기술 기업들을 겨냥한 독자적인 디지털세 도입을 공식 제안하면서 글로벌 조세 전쟁의 서막이 올랐습니다. EU 차기 장기예산안에 포함된 이 법안은 글로벌 연매출 7억 5천만 유로 이상인 기업들에게 세금을 부과하는 내용을 담고 있습니다. 이는 그동안 유럽 내에서 막대한 이익을 거두면서도 세금을 회피해 온 빅테크 기업들의 조세 형평성을 맞추기 위한 조치입니다. 하지만 미국 주요 빅테크가 주된 타깃이 되면서, 출범을 앞둔 트럼프 2기 미 행정부와의 심각한 통상 마찰이 불가피해 보입니다. 글로벌 과세 체계의 근본적인 지각변동이 시작되고 있습니다.`,
  keyTerms:[{term:`디지털세`,explanation:`물리적 사업장이 없더라도 해당 국가에서 디지털 서비스로 막대한 수익을 내는 거대 다국적 IT 기업에게 물리는 세금입니다.`}],
  history:`유럽 각국은 자국에서 막대한 수익을 올리는 미국 빅테크 기업에 제대로 세금을 걷지 못하는 한계를 지적하며 독자적 과세를 오랫동안 준비해 왔습니다.`,
  players:`조세 수입을 늘리려는 EU 집행위원회, 자국 기업을 보호하려는 미국 정부, 그리고 과세 타깃이 된 구글, 애플, 메타 등 빅테크 기업들입니다.`,
  current:`방위비 증액 등 재원 확보가 시급한 EU가 장기 예산 조달을 명분으로 디지털세 도입을 강행하며 미국과의 갈등을 불사하고 있는 상황입니다.`,
  outlook:`미국 측에서 보복 관세 등 강력한 대응 조치를 꺼낼 가능성이 매우 높으며, 이는 대서양 양안 간의 거대한 무역 전쟁으로 번질 수 있습니다.`,
  sources:[{title:`EU, 글로벌 빅테크 대상 디지털세 제안 - 연합뉴스TV`,url:`https://yonhapnewstv.co.kr`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`더불어민주당, '계엄 파기환송' 조희대 대법원장 탄핵 당론 채택… 연말 정국 급랭`,
  metrics:[`12월 3일 비상계엄 2주기 기점 발의 계획`,`국민의힘 대구 등 전국적 대규모 장외투쟁 돌입`],
  summary:`대법원이 한덕수 전 총리의 비상계엄 관련 내란중요임무종사 혐의 일부를 무죄 취지로 파기환송한 판결의 여파로, 더불어민주당이 조희대 대법원장에 대한 탄핵 소추를 당론으로 채택하며 정치권이 발칵 뒤집혔습니다. 야당은 이를 사법부의 내란 면죄부라 규정하고, 12월 3일 계엄 2주기를 기점으로 탄핵안을 발의하겠다고 예고했습니다. 반면 여당인 국민의힘은 대구 등에서 대규모 장외투쟁을 열고 이를 이재명 방탄용 사법부 흔들기라며 강하게 반발하고 나섰습니다. 사법부 수장 탄핵이라는 초유의 사태를 앞두고 여야가 극한 대립으로 치닫으면서, 연말 국회는 모든 입법과 예산 처리가 마비될 위기에 처했습니다.`,
  keyTerms:[{term:`탄핵 소추`,explanation:`대통령이나 대법원장 등 일반적인 절차로 징계하기 어려운 고위 공직자가 직무상 중대한 위법 행위를 했을 때 국회가 파면을 요구하는 헌법적 절차입니다.`}],
  history:`과거 비상계엄 사태 책임자들에 대한 사법 처리 과정 내내 여야는 역사적 평가와 사법적 잣대를 두고 극심한 대립을 겪어왔습니다.`,
  players:`대법원장 탄핵을 주도하는 거대 야당 더불어민주당, 이를 사법 방해로 규정하고 맞서는 여당 국민의힘, 중심에 선 조희대 대법원장입니다.`,
  current:`법원의 무죄 취지 파기환송 결정이 야권의 거센 분노를 촉발시켜, 사법부 독립성 침해 논란과 함께 타협 없는 정쟁으로 비화된 일촉즉발의 상황입니다.`,
  outlook:`실제 탄핵안이 발의될 경우 국회 본회의 통과부터 헌법재판소 심판에 이르기까지 정국 마비가 장기화될 것이며 지지층들의 거리 시위가 격화될 전망입니다.`,
  sources:[{title:`민주당, 대법원장 탄핵 추진 - 한국일보`,url:`https://hankookilbo.com`},{title:`한덕수 파기환송에 여야 충돌 격화 - 동아일보`,url:`https://donga.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`트럼프 대화 제의에 침묵하는 김정은… 미 싱크탱크 "중·러 견제 위해 한미동맹 재편해야"`,
  metrics:[`미국 내 한미동맹 재활성화 정책 보고서 잇단 발간`,`스위스 등 국제사회 북한 송도원 야영소 제재 명단 추가`],
  summary:`트럼프 대통령의 대화 제의에도 불구하고 김정은 북한 국무위원장이 즉각적인 호응 대신 내부 결속에 치중하면서 팽팽한 북미 탐색전이 이어지고 있습니다. 이 가운데 랜드연구소 등 미국의 주요 싱크탱크는 트럼프 2기 행정부가 대북 방어에 국한되었던 기존 한미동맹을 중·러를 동시 견제하는 '포괄적 억제' 전략으로 전면 재편해야 한다는 보고서를 발표했습니다. 이는 러·북 밀착이 강화되는 현실 속에서 동맹의 역할을 아시아 태평양 전역으로 확장하려는 시도입니다. 북미 간 물밑 접촉 가능성 속에서 한국 정부가 외교적 주도권을 빼앗기는 이른바 한국 패싱 우려가 다시 제기되는 등 동북아 외교안보 지형이 요동치고 있습니다.`,
  keyTerms:[{term:`포괄적 억제`,explanation:`한반도에 국한된 북한의 군사적 위협만 막는 것을 넘어, 중국이나 러시아 등 주변 강대국의 안보 위협까지 폭넓게 방어하고 대응하는 동맹 전략입니다.`}],
  history:`하노이 북미정상회담 결렬 이후 오랫동안 단절되었던 북미 관계가 새로운 미국 행정부 출범으로 중대한 변화의 기로에 서게 되었습니다.`,
  players:`정상외교를 통해 돌파구를 마련하려는 트럼프 행정부, 상황을 짚어보는 북한 김정은, 외교적 패싱 우려 속에서 동맹을 다지려는 한국 정부입니다.`,
  current:`북한이 러시아와의 군사 밀착을 무기로 몸값을 높이는 가운데, 미국 조야에서는 한미동맹의 지정학적 성격 자체를 바꾸려는 거센 압박이 진행 중입니다.`,
  outlook:`북미 간 비밀 접촉 성사 여부에 따라 한반도 긴장 완화 분위기가 조성될 수 있으며, 한국에 대한 미국의 방위비 분담금 및 역내 군사 역할 요구가 커질 것입니다.`,
  sources:[{title:`북미 대화 탐색전과 한국 패싱 우려 - 다음 뉴스`,url:`https://daum.net`},{title:`랜드연구소, 한미동맹 재활성화 보고서 - 머니투데이`,url:`https://mt.co.kr`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`대통령 울산 SK AI 데이터센터 방문… "지방 중심 AI 인프라 투자로 국가 균형발전 견인"`,
  metrics:[`비수도권 지방 중심의 AI 메가프로젝트 연계`,`데이터센터 인허가 및 전력 공급 간소화 패스트트랙 추진`],
  summary:`대통령은 울산에 위치한 SK AI 데이터센터 건립 현장을 직접 방문하여, 수도권에 집중된 AI 인프라를 지방으로 분산시키겠다는 강력한 의지를 밝혔습니다. 이번 시찰에서 정부는 막대한 전력이 소모되는 AI 데이터센터의 특성을 고려해, 인허가 및 전력 공급 절차를 간소화하는 패스트트랙 지원 방안을 약속했습니다. 이는 이른바 '피지컬 AI'와 미래 모빌리티 산업 확장에 필수적인 인공지능 고속도로를 국가 균형 발전의 핵심 동력으로 삼겠다는 전략입니다. 지역 경제 활성화와 첨단 산업 육성이라는 두 마리 토끼를 잡기 위해 정부와 기업의 협력이 본격화되면서, 울산이 새로운 IT 전초기지로 도약할 수 있을지 기대가 모아지고 있습니다.`,
  keyTerms:[{term:`피지컬 AI`,explanation:`가상 공간의 소프트웨어에 머무르지 않고 로봇, 자율주행차 등 실제 물리적인 환경에서 실시간으로 데이터를 수집하고 작동하는 인공지능 기술입니다.`}],
  history:`기존의 대규모 데이터센터는 전력 수급 문제와 상관없이 수도권에 쏠려 있어 전력망 과부하와 지역 불균형을 심화시킨다는 비판을 받아왔습니다.`,
  players:`지역 거점 AI 인프라 투자를 주도하는 SK그룹과 파격적인 규제 완화로 이를 지원하는 중앙정부 및 울산광역시 등 지자체입니다.`,
  current:`인공지능 붐으로 전력 수요가 기하급수적으로 폭증함에 따라, 원전 등 발전 설비가 가까운 비수도권에서 그 수요를 감당하려는 정책적 전환기입니다.`,
  outlook:`정부의 적극적인 세제 혜택 및 전력망 확충 조치가 이어지면서 국내 대기업들의 지방 데이터센터 투자가 더욱 가속화될 전망입니다.`,
  sources:[{title:`대통령, 울산 AI 데이터센터 현장 방문 - 뉴스1`,url:`https://news1.kr`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`"AI가 167년 된 수학 난제 증명했다" 파장… 25만 쪽 풀이 과정에 인류 검증 한계 봉착`,
  metrics:[`증명 과정 설명서 분량 약 25만 쪽`,`167년 된 수학계 최고 난제(리만 가설 등) 대상`],
  summary:`최신 인공지능이 167년 동안 풀리지 않았던 수학계 최고 난제 중 하나를 마침내 증명했다는 연구 결과가 발표되어 전 세계 학계가 발칵 뒤집혔습니다. 하지만 기쁨도 잠시, AI가 도출한 증명 과정과 설명이 무려 25만 쪽에 달하면서 인간 수학자들이 이를 단기간에 검증하는 것이 사실상 불가능하다는 한계에 부딪혔습니다. 이에 따라 AI가 내놓은 해답을 어디까지 신뢰해야 하는지, 기계가 어떻게 결론에 도달했는지 과정을 알 수 없는 '블랙박스' 현상에 대한 근본적인 철학적 논쟁이 불붙고 있습니다. AI가 인류의 지적 지평을 넓히고 있음은 분명하지만, 결과의 참거짓을 인간이 판단할 수 없는 시대가 도래했다는 두려움이 교차하고 있습니다.`,
  keyTerms:[{term:`블랙박스`,explanation:`인공지능이 입력된 데이터를 처리해 엄청난 결과물을 내놓지만, 도대체 내부에서 어떤 논리적 과정을 거쳐 결론을 내렸는지 사람이 추적하거나 이해할 수 없는 현상입니다.`}],
  history:`리만 가설과 같은 고난도의 수학적 난제들은 수많은 천재 수학자들이 일생을 바쳤음에도 완벽한 논리적 증명에 실패했던 인류의 오랜 숙원이었습니다.`,
  players:`초거대 AI 모델을 구축한 첨단 기술 기업의 연구진과, 사람의 이성에 기반한 전통적인 논리 검증 방식을 중시하는 전 세계 주류 수학계 학자들입니다.`,
  current:`압도적인 연산력을 바탕으로 AI가 새로운 과학적 발견을 쏟아내고 있으나, 그 추론 과정을 인간 언어로 번역해 내는 '설명 가능한 AI' 기술은 현저히 부족한 상황입니다.`,
  outlook:`학계는 AI가 제시한 막대한 분량의 증명을 역으로 검증하기 위한 전담 보조 AI 시스템 개발에 착수할 것이며, 기초과학의 연구 패러다임 자체가 급변할 것입니다.`,
  sources:[{title:`AI, 167년 수학 난제 해결 주장 논란 - 한국경제`,url:`https://hankyung.com`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`시험 대리 풀이부터 화상회의 딥페이크 사칭까지… 일상 덮친 'AI 신뢰 실종' 사태`,
  metrics:[`대학 및 기업 채용 시험 AI 부정행위 적발 건수 급증`,`정부-AI 개발사 간 신뢰성 표준 협의 착수`],
  summary:`고도화된 인공지능 기술이 일상에 빠르게 스며들면서, 이를 악용한 범죄와 부정행위가 속출해 심각한 사회적 문제로 대두되고 있습니다. 최근 대학 시험이나 기업 채용에서 AI를 이용해 단시간에 문항을 풀이하는 부정행위가 다수 적발되었고, 심지어 고위 인사의 얼굴과 목소리를 위조한 딥페이크 사칭 화상회의 사기까지 기승을 부리고 있습니다. 기술의 편리함 이면에 사회 전반의 신뢰 실종 우려가 확산되자, 정부는 부랴부랴 주요 AI 모델 개발사들과 만나 생성물 워터마크 표기 의무화 및 부정행위 원천 차단을 위한 표준 협의에 착수했습니다. 혁신적인 기술 발전 속도를 따라잡지 못하는 낡은 윤리 의식과 제도적 공백을 시급히 메워야 한다는 지적이 쏟아지고 있습니다.`,
  keyTerms:[{term:`딥페이크 사칭`,explanation:`인공지능 기술을 이용해 특정 인물의 생김새, 표정, 심지어 목소리까지 진짜처럼 완벽하게 합성하여 타인을 감쪽같이 속이는 사기 수법입니다.`}],
  history:`과거 생성형 AI 초창기에는 단순 가짜 뉴스나 저작권 침해가 주로 논란이 되었으나, 최근에는 금전적 타격과 직결된 첨단 디지털 사기 범죄로 흉포화되었습니다.`,
  players:`강력한 AI 툴을 악용하는 지능형 범죄자 집단, 속수무책으로 피해를 보는 일반 시민 및 기업, 그리고 다급하게 규제 방안을 마련하려는 정부 당국입니다.`,
  current:`딥페이크 영상과 음성의 정교함이 육안으로 구별하기 불가능한 수준에 도달하면서, 기존의 비대면 본인 인증 시스템 자체가 완전히 무력화된 위기 상황입니다.`,
  outlook:`모든 AI 생성물에 대한 조작 방지용 워터마크 기술 탑재 의무화가 법제화될 가능성이 크며, 금융권 및 기업 내부 보안 시스템의 전면 재편이 이뤄질 것입니다.`,
  sources:[{title:`AI 악용 범죄 기승 및 신뢰 실종 우려 확산 - 다음 뉴스`,url:`https://daum.net`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`한국 연구진, 지구 시멘트 없이 '달 토양'만으로 우주 기지 짓는 블록 제조 기술 개발`,
  metrics:[`접착제 0% 달 토양 모사 물질 100% 활용`,`달과 유사한 진공 및 극한 온도 환경 1차 테스트 통과`],
  summary:`한국 우주과학 연구진이 지구에서 시멘트나 접착제를 가져가지 않고도 달 표면의 토양만으로 우주 기지 건설용 블록을 만드는 혁신적인 기술을 개발해 냈습니다. 연구팀은 달 토양 모사 물질에 특수한 열과 압력만을 가해 견고한 건축 자재를 찍어내는 데 성공했으며, 달과 유사한 진공 및 극한의 온도 환경 테스트도 통과했습니다. 이 기술은 막대한 운송 비용을 획기적으로 줄일 수 있는 '현지자원활용(ISRU)'의 핵심 성과로 평가받고 있습니다. 이와 함께 모사 토양 내에서의 식물 재배 실험 결과도 발표되며 한국의 우주 탐사 자립 기술이 한 단계 도약했다는 찬사가 쏟아지고 있습니다. 글로벌 우주 강국들 사이의 달 표면 선점 경쟁에서 우리나라가 중요한 기술적 교두보를 확보하게 되었습니다.`,
  keyTerms:[{term:`현지자원활용(ISRU)`,explanation:`지구에서 비싼 비용을 들여 물자를 실어 나르는 대신, 우주 탐사 목적지(달, 화성 등)에 존재하는 흙이나 얼음 등의 자원을 직접 가공해 사용하는 핵심 우주 개척 기술입니다.`}],
  history:`달에 인간이 체류할 수 있는 영구적인 전초기지를 짓기 위한 미국의 아르테미스 프로젝트 등 글로벌 우주 강국들의 경쟁이 치열해지며 관련 기술 확보가 절실해졌습니다.`,
  players:`독자적인 우주 건축 기술을 개발 중인 한국항공우주연구원 등 국내 연구팀과 달 개척 레이스를 주도하는 미국, 중국 등의 거대 우주 개발 기관들입니다.`,
  current:`지구에서 단 1kg의 화물을 우주 궤도로 올리는 데에도 천문학적인 비용이 드는 현실 속에서, 현지 자원 가공 기술이 임무 성공의 결정적 열쇠로 떠올랐습니다.`,
  outlook:`향후 발사될 실제 무인 달 탐사선을 통해 달 표면 현지에서 소규모 블록 제조를 직접 시연하고 데이터를 확보하는 기술 실증 임무가 발 빠르게 추진될 것입니다.`,
  sources:[{title:`달 토양 기반 우주 건축 자재 개발 성과 - 다음 뉴스`,url:`https://daum.net`}]
}]

  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국 경제, 사상 최초로 연간 수출 1조 달러 달성하며 세계 4위 수출국 도약`,
  metrics:[`연간 수출액 1조 달러 돌파`,`세계 4번째 1조 달러 달성국`],
  summary:`대한민국이 미국, 독일, 중국에 이어 사상 처음으로 연간 수출 1조 달러를 돌파했습니다. 이번 성과는 인공지능 인프라 투자 붐에 따른 HBM 등 고부가가치 메모리 반도체의 기록적인 수출 호조가 전체 실적을 강력하게 견인한 결과입니다. 하지만 수출 중심의 거시 지표 호조와 달리 건설 경기 침체와 내수 소비 부진이 맞물리며 체감 경기는 아직 냉랭한 상황입니다. 특히 고금리 장기화의 여파로 가계 부채 부담이 커지면서 내수 부양 효과가 수출 성과만큼 나타나지 않는 심각한 산업 양극화 현상이 뚜렷하게 관찰되고 있습니다. 정부는 수출 온기를 내수로 확산시키기 위한 추가 대책을 고심 중입니다.`,
  keyTerms:[{term:`산업 양극화`,explanation:`수출 등 특정 부문은 크게 성장하지만, 내수나 기타 산업은 침체되어 경제 전반의 격차가 심해지는 현상입니다.`}],
  history:`한국 경제는 과거부터 반도체, 자동차 등 주력 수출 산업에 크게 의존해 왔습니다. 최근 몇 년간 글로벌 AI 열풍으로 반도체 수요가 폭증하며 수출액이 급증했습니다. 반면 코로나19 팬데믹 이후 누적된 고금리와 물가 상승은 내수 시장을 지속적으로 위축시켰습니다.`,
  players:`삼성전자와 SK하이닉스 등 주요 반도체 기업들이 수출 1조 달러 달성의 일등 공신입니다. 반면 영세 소상공인과 내수 중심의 중소기업들은 고금리에 따른 이자 부담으로 어려움을 겪고 있습니다.`,
  current:`기록적인 수출 성과 발표에도 불구하고 시민들이 느끼는 경제적 온기는 부족한 상황입니다. 한국은행의 금리 인하 속도 조절까지 겹치며 내수 회복은 지연되고 있습니다.`,
  outlook:`단기적으로는 수출 호조세가 이어지겠으나, 미국 신행정부의 보호무역주의 강화가 새로운 변수로 떠오르고 있습니다. 내수 부진을 해소하기 위한 정부의 맞춤형 재정 정책 발표 여부가 핵심 관건이 될 것입니다.`,
  sources:[{title:`사상 첫 수출 1조 달러 돌파... 세계 4위 위상 - 대한민국 정책브리핑`,url:`https://www.korea.kr`},{title:`HBM이 이끈 韓 수출 신기원, 내수 침체는 과제 - 인베스팅닷컴`,url:`https://kr.investing.com`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`앤트로픽 상장 직후 불거진 AI 거품론에 글로벌 증시 대폭 조정`,
  metrics:[`빅테크 기업 주가 평균 4% 하락`,`AI 인프라 추정 자금 조달 5천억 달러`],
  summary:`앤트로픽(Anthropic)의 대형 나스닥 상장 이후 차익 실현 매물이 쏟아지며 글로벌 기술주 중심의 증시가 강한 조정을 받고 있습니다. 막대한 AI 인프라 투자 대비 실제 수익성(ROI) 창출이 지연되면서 투자자들 사이에서 인공지능 거품론이 빠르게 확산하는 추세입니다. 여기에 국제통화기금(IMF)이 데이터센터 확충을 위한 막대한 자금 조달이 장기 금리를 상승시킬 수 있다고 경고하면서 시장의 불안감을 키웠습니다. 결과적으로 S&P 500과 나스닥 지수가 연속 하락하며 빅테크 기업들의 시가총액이 크게 증발했습니다. 전문가들은 AI 기업들이 뚜렷한 현금 창출 능력을 입증해야만 반등이 가능할 것으로 분석하고 있습니다. 향후 발표될 미국 물가 지표에 따라 추가 변동성이 예상됩니다.`,
  keyTerms:[{term:`인공지능 거품론`,explanation:`AI 기술에 대한 지나친 낙관론으로 관련 기업들의 주가가 실제 가치보다 과도하게 높게 형성되었다는 주장입니다.`}],
  history:`챗GPT 등장 이후 글로벌 IT 기업들은 생성형 AI 시장을 선점하기 위해 수십조 원 단위의 막대한 투자를 단행해 왔습니다. 주식 시장은 이러한 기대감을 미리 반영해 관련 기업들의 가치를 천문학적으로 끌어올렸습니다. 하지만 가시적인 수익 모델이 부재하다는 지적이 꾸준히 제기되어 왔습니다.`,
  players:`오픈AI, 앤트로픽 등 주요 AI 스타트업과 이들을 지원하는 마이크로소프트, 아마존 등의 빅테크 기업들이 중심에 있습니다. 국제통화기금(IMF)은 거시경제 안정을 우려하는 목소리를 내고 있습니다.`,
  current:`앤트로픽의 기업공개(IPO)라는 대형 이벤트가 역설적으로 단기 고점이라는 인식을 심어주며 매도세를 촉발했습니다. 시장은 막연한 기대감보다 확실한 실적 지표를 요구하는 단계로 전환되었습니다.`,
  outlook:`곧 발표될 미국의 주요 인플레이션 지표(PCE)와 연준의 통화정책 방향이 기술주의 단기 향방을 가를 것입니다. AI 기업들의 다가오는 4분기 실적 발표가 투자 심리를 좌우할 핵심 변수입니다.`,
  sources:[{title:`Anthropic's IPO triggers broader market sell-off amidst AI doubts - The Guardian`,url:`https://www.theguardian.com`},{title:`IMF warns of rate hikes driven by AI infrastructure spending - Global News`,url:`https://globalnews.ca`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`APEC 정상회의서 격돌한 미·중, 관세 인상과 반도체 공급망 긴장 최고조`,
  metrics:[`미국의 대중국 추가 관세 검토안 60%`,`미국 반도체 통제 대상 중국 기업 200여 곳 추가`],
  summary:`아시아태평양경제협력체(APEC) 정상회의 무대에서 미국과 중국의 무역 갈등이 다시 한번 격렬하게 충돌했습니다. 미국의 새 행정부가 대중국 보복 관세 현실화 및 강력한 보호무역주의를 예고한 가운데, 시진핑 주석은 자유무역과 글로벌 공급망 안정을 주장하며 맞섰습니다. 특히 미국은 자국 내 핵심 반도체 칩이 제3국을 통해 중국으로 우회 수출되는 정황을 포착하고 전면적인 조사에 착수했습니다. 이로 인해 글로벌 반도체 밸류체인 전반에 긴장감이 감돌며 관련 기업들의 주가도 출렁이고 있습니다. 양국의 입장 차이가 좁혀지지 않으면서, 아태지역 국가들은 새로운 무역 장벽이 닥칠 것을 우려하며 대응책 마련에 부심하고 있습니다. 이번 충돌은 단순한 관세 분쟁을 넘어 글로벌 경제 패권 다툼의 새로운 서막으로 해석됩니다.`,
  keyTerms:[{term:`보호무역주의`,explanation:`자국의 산업을 보호하기 위해 관세 인상이나 수입 제한 등의 조치를 취하여 국제 무역에 개입하는 경제 정책입니다.`}],
  history:`미중 무역 갈등은 과거 미국 행정부 시절 관세 폭탄으로 본격화되었으며, 바이든 행정부를 거치며 반도체 등 첨단 기술 분야로 전선이 확장되었습니다. 중국은 첨단 기술 자립을 목표로 막대한 보조금을 투입해 왔고, 미국은 이를 국가 안보 위협으로 간주하여 강력히 견제해 왔습니다.`,
  players:`관세를 무기로 압박을 가하는 미국 차기 행정부와, 이를 부당한 제재로 규정하며 글로벌 자유무역 수호자를 자처하는 시진핑 중국 국가주석이 대립하고 있습니다. 주변국들은 두 강대국 사이에서 실익을 계산하고 있습니다.`,
  current:`APEC이라는 다자간 협력 무대가 오히려 미중 간의 현격한 입장 차이를 재확인하는 장이 되었습니다. 미국 상무부의 우회 수출 조사가 가시화되면서 반도체 업계는 직격탄을 맞고 있습니다.`,
  outlook:`미국 새 행정부 출범 이후 대중국 추가 관세가 공식 발효될 경우 글로벌 공급망의 대규모 재편이 불가피합니다. 중국 또한 희귀 광물 수출 통제 등 보복 카드를 꺼내들 가능성이 매우 높습니다.`,
  sources:[{title:`Tensions flare at APEC over US tech export controls - SCMP`,url:`https://www.scmp.com`},{title:`US-China trade war escalates amid new semiconductor probes - AP News`,url:`https://apnews.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`'민주유공자법' 야당 단독 본회의 통과, 여당 반발로 정국 경색 심화`,
  metrics:[`본회의 찬성 180표`,`여당 반대 장외투쟁 3일차`],
  summary:`이른바 '민주유공자 예우에 관한 법률안'이 더불어민주당 등 야당 주도로 국회 본회의를 최종 통과했습니다. 이 법안은 과거 민주화 운동 과정에서 희생된 이들을 유공자로 지정해 예우하는 내용을 담고 있지만, 국민의힘은 이를 극소수를 위한 셀프 특혜 입법이라고 강하게 반발해 왔습니다. 여당은 법안 상정 직전까지 필리버스터를 동원해 저지를 시도했으나 수적 열세를 극복하지 못했습니다. 법안 통과 직후 여당 지도부는 강경한 장외투쟁을 선언하며 정기국회 일정 전면 보이콧을 시사했습니다. 이에 따라 내년도 예산안 심사와 민생 법안 처리 등 시급한 국회 현안들이 모두 올스톱될 위기에 처했습니다. 대통령의 거부권 행사 여부에 정치권의 모든 시선이 쏠리고 있습니다.`,
  keyTerms:[{term:`필리버스터`,explanation:`의회에서 소수파가 다수파의 법안 강행 처리를 막기 위해 합법적인 수단을 동원하여 장시간 발언하며 의사진행을 고의로 방해하는 행위입니다.`}],
  history:`민주유공자법은 오랜 기간 민주화 운동 단체들의 숙원 사업이었으나, 유공자 지정 기준의 모호성과 특혜 논란으로 인해 번번이 국회의 문턱을 넘지 못했습니다. 과거 여러 차례 발의와 폐기가 반복되며 여야 간 묵은 갈등의 씨앗이 되어 왔습니다.`,
  players:`법안 처리를 강행한 거대 야당 더불어민주당과 이를 저지하려 했던 여당 국민의힘이 정면으로 충돌하고 있습니다. 최종 결정권을 쥔 대통령실의 행보가 중요해졌습니다.`,
  current:`법안 통과로 인해 여야 관계는 완전히 얼어붙었으며, 대화와 타협이라는 의회 정치는 사실상 마비 상태입니다. 야당은 역사적 정당성을, 여당은 공정성 훼손을 명분으로 각각 여론전에 집중하고 있습니다.`,
  outlook:`정부 측에서 재의요구권(거부권)을 행사할 가능성이 매우 높게 점쳐지고 있습니다. 거부권이 행사될 경우 국회 재표결 과정에서 다시 한번 극심한 정치적 파동과 지지층 결집 양상이 벌어질 것입니다.`,
  sources:[{title:`야당 주도 민주유공자법 본회의 통과... 여당 강력 반발 - 동아일보`,url:`https://www.donga.com`},{title:`입법 폭주 논란 속 통과된 유공자법, 거부권 수순 밟나 - 조선일보`,url:`https://www.chosun.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`사상 첫 미·중·러 3자 정상회담 성사, 핵전쟁 방지 공감대에도 우크라이나 해법은 이견`,
  metrics:[`미·중·러 3국 정상 최초 동시 회동`,`핵무기 통제 원칙 1개항 합의`],
  summary:`아시아태평양경제협력체(APEC) 정상회의가 열린 선전에서 미국, 중국, 러시아 3국 정상이 사상 최초로 한자리에 모여 3자 회담을 진행했습니다. 이번 회담에서 3국 정상은 글로벌 원유 공급망 안정과 전술 핵무기 사용을 포함한 어떠한 형태의 핵전쟁도 방지해야 한다는 원칙적인 공감대를 형성했습니다. 그러나 전 세계의 이목이 집중되었던 우크라이나 전쟁과 중동 분쟁 종식 등 핵심 안보 이슈에 대해서는 구체적인 합의점을 도출하지 못했습니다. 특히 영토 할양을 전제로 한 휴전 압박에 대해 우크라이나와 유럽연합(EU)의 불안감은 더욱 증폭되고 있습니다. 전문가들은 이번 회담이 실질적 해법보다는 강대국들이 주도하는 다극화 체제의 본격적인 개막을 알리는 상징적 이벤트라고 평가하고 있습니다. 향후 실무급 회담의 재개 여부가 주목받고 있습니다.`,
  keyTerms:[{term:`다극화 체제`,explanation:`세계의 권력과 정치적 영향력이 하나의 절대적인 강대국이 아닌 여러 강대국들에게 분산되어 균형을 이루는 국제 질서를 의미합니다.`}],
  history:`냉전 종식 이후 미국 주도의 단일 패권 체제가 유지되어 왔으나, 최근 중국의 부상과 러시아의 군사적 행보로 인해 국제 질서가 흔들리기 시작했습니다. 우크라이나 전쟁 장기화는 이러한 강대국 간의 진영 대립을 더욱 뚜렷하게 만들었습니다.`,
  players:`미국의 트럼프 행정부, 국제적 영향력 확대를 꾀하는 중국의 시진핑 주석, 고립 탈피를 노리는 러시아의 푸틴 대통령이 주요 행위자입니다. 우크라이나와 유럽 동맹국들은 이들의 결정에 민감하게 반응하고 있습니다.`,
  current:`3국 정상의 만남 자체만으로도 엄청난 외교적 화제를 낳았으나, 이해관계가 극명하게 엇갈려 선언적인 합의에 그쳤습니다. 강대국들이 전 세계 안보 지형을 자국 이익에 맞춰 임의로 재편하려 한다는 비판도 나오고 있습니다.`,
  outlook:`3국 간 합의된 핵전쟁 방지 원칙을 바탕으로 군비 통제 조약 복원을 위한 실무 논의가 이어질 것으로 보입니다. 그러나 우크라이나 휴전 협상안을 둘러싼 미국과 유럽 간의 심각한 외교적 마찰이 당분간 계속될 전망입니다.`,
  sources:[{title:`Historic US-China-Russia summit ends with nuclear pact but no Ukraine resolution - CNN`,url:`https://edition.cnn.com`},{title:`Three global powers meet at APEC, signaling a new multipolar world - PBS`,url:`https://www.pbs.org`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`러시아 공습 미사일 잔해 나토(NATO) 영토인 폴란드 낙하, 서방 초긴장`,
  metrics:[`폴란드 국경 5km 내 잔해 추락`,`우크라이나 전역 미사일 120여 발 발사`],
  summary:`러시아가 우크라이나의 에너지 및 주요 인프라 시설을 겨냥해 대규모 미사일과 드론 공습을 감행하는 과정에서, 요격된 미사일 잔해가 북대서양조약기구(NATO) 회원국인 폴란드 영토 내로 떨어지는 아찔한 사고가 발생했습니다. 다행히 직접적인 인명 피해는 보고되지 않았으나, 폴란드 정부는 즉각 군에 비상 경계령을 내리고 영공 방어를 대폭 강화했습니다. 나토 긴급 대사급 회의가 소집되었으며, 서방 국가들은 이를 단순한 실수가 아닌 중대한 영공 침범이자 도발 행위로 간주하고 강력히 규탄했습니다. 이번 사건으로 확전 방지에 주력해온 나토의 억지력에 시험대가 마련되었으며, 우크라이나 인접국들에 대한 추가적인 방공망 지원 논의가 급물살을 타고 있습니다. 일각에서는 이번 사태가 나토의 집단방위조약 발동을 촉발할 수 있는 도화선이 될까 우려하고 있습니다.`,
  keyTerms:[{term:`집단방위조약`,explanation:`나토(NATO) 헌장 5조에 명시된 핵심 원칙으로, 한 회원국이 공격받으면 나토 전체에 대한 공격으로 간주해 공동으로 군사적 대응을 한다는 약속입니다.`}],
  history:`우크라이나 전쟁 개전 이래 러시아는 우크라이나 서부 국경 지역을 간헐적으로 타격해왔으며, 과거에도 미사일 오발로 인해 폴란드 영토에 타격을 입힌 사례가 있었습니다. 서방은 지속적으로 러시아의 영공 침범 리스크를 강력하게 경고해 왔습니다.`,
  players:`확전을 경계하면서도 동맹국의 안보를 책임져야 하는 나토(NATO) 회원국들과, 서방의 무기 지원선 차단을 목표로 공세를 강화하는 러시아 군이 대치 중입니다. 우크라이나는 자국 상공의 나토 방공망 확장을 절실히 요구하고 있습니다.`,
  current:`폴란드 정부는 러시아 대사를 초치해 강력히 항의했으며, 미국을 비롯한 주요 동맹국들은 사태의 고의성 여부를 파악하기 위한 정밀 조사에 착수했습니다. 긴장이 최고조에 달하면서 접경 지역의 민간 항공기 운항도 일부 통제되고 있습니다.`,
  outlook:`나토는 동유럽 전방 배치를 강화하고 요격 미사일 자산을 추가로 투입할 가능성이 큽니다. 만약 고의성이 입증되거나 추가적인 타격이 발생할 경우, 러시아와 나토 간의 직접적인 군사적 마찰 위험이 극도로 높아질 것입니다.`,
  sources:[{title:`Russian missile debris lands in Poland during massive Ukraine strike - The Guardian`,url:`https://www.theguardian.com`},{title:`NATO condemns border breach as fears of escalation rise - CBS News`,url:`https://www.cbsnews.com`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`수능 등 국가시험 파고든 AI 부정행위 파문, 국회 '방지법' 발의 등 대책 부심`,
  metrics:[`주요 대학 논술 AI 부정 의심 15건`,`전국 시험장 전파차단기 예산안 500억 원 편성`],
  summary:`대학수학능력시험 직후 치러진 주요 대학들의 논술 및 면접 고사에서 초소형 스마트 기기와 생성형 인공지능을 결합한 지능형 부정행위 의심 사례가 대거 적발되어 사회적 파문이 일고 있습니다. 무선 이어폰보다 작은 송수신기를 통해 외부의 AI가 실시간으로 정답을 불러주는 방식이 동원된 것으로 밝혀져 시험의 공정성 시스템이 뿌리째 흔들렸습니다. 사태의 심각성을 인지한 교육 당국은 내년부터 적용될 국가시험 제도의 전면적인 개편과 아날로그식 평가 방식의 재도입을 적극 검토하고 있습니다. 이와 발맞춰 국회에서는 시험장 내 모든 통신 전파를 강제로 차단하고 부정행위자를 엄벌하는 내용을 담은 이른바 'AI 부정행위 방지법'을 긴급 발의했습니다. 전문가들은 기술 발전 속도를 따라잡지 못하는 낡은 감독 체계가 근본적인 원인이라고 지적합니다. 공정성에 민감한 수험생과 학부모들의 항의가 거세지고 있습니다.`,
  keyTerms:[{term:`AI 부정행위 방지법`,explanation:`최첨단 인공지능 기술과 통신 장비를 활용해 시험 정답을 유출하거나 공유하는 행위를 차단하고 처벌 수위를 높이기 위해 새롭게 제안된 법안입니다.`}],
  history:`과거 시험 부정행위는 단순한 커닝 페이퍼나 대리 시험에 머물렀지만, 통신 기술의 발달로 점차 조직화되었습니다. 최근 챗GPT를 비롯한 뛰어난 추론 능력을 갖춘 AI 모델이 대중화되면서, 이를 시험 문제 풀이에 악용하려는 시도가 은밀하게 퍼져나갔습니다.`,
  players:`압도적인 기술을 악용해 이득을 취하려는 범죄 조직 및 수험생들과, 공정한 평가 잣대를 지켜내려는 교육부 및 입시 기관들이 치열한 두뇌 싸움을 벌이고 있습니다. 입법에 나선 국회의원들도 중요한 변수입니다.`,
  current:`서울 시내 주요 명문대 논술 고사에서 연쇄적으로 터진 부정행위 의혹으로 인해 재시험을 요구하는 여론이 빗발치고 있습니다. 경찰은 관련 브로커 조직에 대한 대대적인 압수수색을 진행 중입니다.`,
  outlook:`법안 통과 시 향후 치러질 모든 국가 공인 시험장에 고성능 전파 차단 시스템과 금속 탐지기 도입이 의무화될 전망입니다. 장기적으로는 단순 지식 암기를 묻는 객관식 평가에서 벗어나, 서술형 면접 등 평가 방식 자체의 패러다임 변화가 가속화될 것입니다.`,
  sources:[{title:`첨단 기기로 무장한 AI 부정행위, 입시 공정성 붕괴 위기 - 한경닷컴`,url:`https://www.hankyung.com`},{title:`국회, 시험장 전파 차단 의무화 '방지법' 긴급 발의 - 한겨레`,url:`https://www.hani.co.kr`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`인류의 탐사선 보이저 1호, 우주 역사상 최초로 지구에서 '1광일' 거리 돌파`,
  metrics:[`지구로부터 거리 약 260억 km`,`데이터 송수신 편도 소요 시간 24시간`],
  summary:`1977년 발사된 미 항공우주국(NASA)의 쌍둥이 탐사선 중 하나인 보이저 1호가 인류가 만든 물체 최초로 지구로부터 1광일 거리를 돌파하는 역사적인 금자탑을 세웠습니다. 빛의 속도로 하루 꼬박 24시간을 날아가야 도달할 수 있는 약 260억 km 밖의 심우주에 도달한 것입니다. 이 엄청난 거리로 인해 현재 지구의 관제소에서 명령을 내리면 그 신호가 탐사선에 닿기까지 꼬박 하루가 걸리고, 다시 응답을 받기까지 또 하루가 걸리는 상황입니다. 최근 탑재된 노후 컴퓨터 시스템의 메모리 손상으로 인해 통신 장애가 발생했으나, 나사의 엔지니어들이 우회 코드를 전송하여 가까스로 핵심 과학 데이터 송수신을 복구하는 데 성공했습니다. 보이저 1호는 태양계를 벗어난 성간 우주의 신비로운 데이터를 여전히 인류에게 보내주고 있습니다. 방사성 동위원소 배터리의 수명이 다하는 2030년대 초반까지 보이저의 외로운 비행은 계속될 예정입니다.`,
  keyTerms:[{term:`1광일`,explanation:`빛이 진공 상태에서 하루(24시간) 동안 쉬지 않고 이동한 거리를 뜻하며, 킬로미터로 환산하면 약 260억 킬로미터에 달하는 엄청난 우주적 거리 단위입니다.`}],
  history:`보이저 1호는 목성과 토성 등 태양계 거대 가스 행성들을 탐사하기 위해 발사되었으며, 당초 임무 수명은 5년에 불과했습니다. 그러나 기대를 훌쩍 뛰어넘는 내구성을 발휘하며 2012년 인류 역사상 최초로 태양계를 벗어나 성간 우주로 진입했습니다.`,
  players:`보이저 임무를 총괄하는 미국 항공우주국(NASA) 제트추진연구소(JPL)의 백전노장 엔지니어들이 50년 가까이 된 구식 컴퓨터와 씨름하며 기적적인 교신 유지를 이끌어내고 있습니다.`,
  current:`플루토늄 배터리의 전력이 매년 미세하게 줄어들고 있어, 과학자들은 탐사선의 전력을 아끼기 위해 덜 중요한 히터와 장비들의 전원을 순차적으로 차단하며 생명 연장에 안간힘을 쓰고 있습니다.`,
  outlook:`남은 핵심 과학 장비 중 일부를 추가로 끄는 가혹한 결정을 내려야 할 시점이 다가오고 있습니다. 수명이 완전히 다해 교신이 끊기더라도, 보이저 1호는 골든 레코드를 품은 채 우리 은하 중심을 향해 영원한 항해를 이어갈 것입니다.`,
  sources:[{title:`Voyager 1 becomes first human-made object to reach one light-day away - Live Science`,url:`https://www.livescience.com`},{title:`NASA engineers miraculously revive Voyager 1 from 26 billion km away - Al Jazeera`,url:`https://www.aljazeera.com`}]

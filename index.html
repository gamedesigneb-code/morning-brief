<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모닝 브리핑</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --sidebar-w: 240px;
    --bg: #FAFAF7;
    --paper: #FFFFFF;
    --accent: #6B7A8F;
    --accent-soft: #E8ECEF;
    --line: #EAE8E3;
    --line-strong: #D8D5CE;
    --text: #2D2A26;
    --text-mid: #6B655D;
    --text-sub: #A09889;
    --radius: 10px;
  }
  html, body {
    height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 15px; line-height: 1.65; font-weight: 400;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }

  /* ── Layout ── */
  #app { display: flex; height: 100vh; overflow: hidden; }

  /* ── Sidebar ── */
  #sidebar {
    width: var(--sidebar-w); flex-shrink: 0;
    background: var(--bg); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #sidebar-header {
    padding: 36px 20px 24px;
    border-bottom: 1px solid var(--line);
    text-align: center;
  }
  #sidebar-header h1 {
    font-size: 19px; font-weight: 700; color: var(--text);
    letter-spacing: -0.4px; line-height: 1.3;
  }
  #sidebar-header p {
    font-size: 12px; color: var(--text-sub); margin-top: 6px;
    letter-spacing: 0.3px;
  }
  #date-list { overflow-y: auto; flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
  .date-item {
    padding: 11px 14px; cursor: pointer; border-radius: 8px;
    transition: background 0.15s, color 0.15s;
    background: transparent;
    text-align: center; font-size: 13px; font-weight: 500; color: var(--text-mid);
    letter-spacing: 0.1px;
  }
  .date-item:hover { background: var(--accent-soft); color: var(--text); }
  .date-item.active {
    background: var(--accent-soft); color: var(--text); font-weight: 600;
  }

  /* ── Main ── */
  #main { flex: 1; overflow-y: auto; background: var(--paper); }
  #content { max-width: 760px; margin: 0 auto; padding: 56px 40px 80px; }

  .brief-header { margin-bottom: 36px; }
  .brief-header .bh-eyebrow {
    font-size: 11px; color: var(--text-sub); margin-bottom: 8px;
    letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500;
  }
  .brief-header h2 {
    font-size: 30px; font-weight: 700; letter-spacing: -0.7px;
    color: var(--text); line-height: 1.25;
  }

  /* ── Sticky Top (header + tabs) ── */
  .sticky-top {
    position: sticky; top: 0;
    background: var(--paper); z-index: 20;
    padding-top: 56px; margin-top: -56px;
  }
  .sticky-top .brief-header { margin-bottom: 24px; }

  /* ── Category Tabs ── */
  .cat-tabs {
    display: flex; gap: 0; margin-bottom: 36px;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
  }
  .cat-tab {
    padding: 12px 20px 14px; cursor: pointer; font-size: 14px; font-weight: 500;
    color: var(--text-sub); border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    background: none; border-top: none; border-left: none; border-right: none;
    font-family: inherit; letter-spacing: -0.1px;
    margin-bottom: -1px;
  }
  .cat-tab:hover { color: var(--text-mid); }
  .cat-tab.active { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }

  /* ── Sources (collapsible) ── */
  .sources-toggle {
    background: transparent; border: 1px solid var(--line-strong);
    padding: 8px 14px; border-radius: 6px; font-size: 12.5px; font-weight: 500;
    color: var(--text-mid); cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    font-family: inherit; margin-top: 12px;
    transition: background 0.15s, border-color 0.15s;
  }
  .sources-toggle:hover { background: var(--accent-soft); border-color: var(--accent); }
  .sources-toggle .arrow { transition: transform 0.2s; font-size: 9px; color: var(--text-sub); }
  .sources-toggle.open .arrow { transform: rotate(180deg); }
  .sources-body { display: none; margin-top: 12px; padding-left: 4px; }
  .sources-body.open { display: block; }

  /* ── Story Card ── */
  .story { margin-bottom: 40px; }
  .story-top { margin-bottom: 18px; }
  .story-headline {
    font-size: 19px; font-weight: 700; line-height: 1.45;
    letter-spacing: -0.4px; color: var(--text);
  }

  .metrics { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .metric-chip {
    background: var(--accent-soft); border: none;
    border-radius: 6px; padding: 7px 12px;
    font-size: 12.5px; font-weight: 500; color: var(--text-mid);
    line-height: 1.4;
  }

  .summary {
    font-size: 15px; line-height: 1.8; color: var(--text); margin-bottom: 20px;
    letter-spacing: -0.1px;
  }
  .summary .kt-underline {
    color: #1996BD;
    text-decoration: underline;
    text-decoration-color: #1996BD;
    text-decoration-thickness: 1.5px;
    text-underline-offset: 3px;
    cursor: help;
  }

  /* ── Key Terms Box ── */
  .key-terms {
    background: #F4F1EA; border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius); padding: 18px 22px; margin-bottom: 14px;
  }
  .key-terms-title {
    font-size: 11px; font-weight: 600; color: var(--text-sub);
    text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 14px;
  }
  .kt-item { margin-bottom: 12px; }
  .kt-item:last-child { margin-bottom: 0; }
  .kt-term {
    font-size: 13.5px; font-weight: 700; color: #1996BD;
    margin-bottom: 4px; display: block;
    letter-spacing: -0.1px;
  }
  .kt-exp {
    font-size: 13.5px; line-height: 1.7; color: var(--text-mid);
  }

  /* ── Background ── */
  .bg-box {
    background: var(--bg); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 22px 24px; margin-bottom: 14px;
  }
  .bg-box-title {
    font-size: 11px; font-weight: 600; color: var(--text-sub);
    text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 16px;
  }
  .bg-section { margin-bottom: 16px; }
  .bg-section:last-child { margin-bottom: 0; }
  .bg-section-label {
    font-size: 12.5px; font-weight: 600; color: var(--text); margin-bottom: 6px;
    letter-spacing: -0.1px;
  }
  .bg-section-text { font-size: 14px; line-height: 1.75; color: var(--text-mid); }

  /* ── Sources ── */
  .source-item {
    display: flex; align-items: flex-start; gap: 10px;
    margin-bottom: 8px; font-size: 13px;
  }
  .src-num {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent-soft); color: var(--text-mid);
    font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .source-item a { color: var(--text-mid); text-decoration: none; line-height: 1.55; }
  .source-item a:hover { color: var(--text); text-decoration: underline; }

  .story-divider { border: none; border-top: 1px solid var(--line); margin: 36px 0; }

  .empty { color: var(--text-sub); font-size: 14px; padding: 60px 0; text-align: center; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }

  /* ── Mobile Toggle ── */
  #sidebar-toggle {
    display: none;
    position: fixed; top: 14px; left: 14px; z-index: 50;
    background: var(--paper); border: 1px solid var(--line-strong);
    width: 40px; height: 40px; border-radius: 10px;
    cursor: pointer; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(45, 42, 38, 0.08);
  }
  #sidebar-toggle span {
    display: block; width: 18px; height: 2px; background: var(--text);
    position: relative;
  }
  #sidebar-toggle span::before,
  #sidebar-toggle span::after {
    content: ''; position: absolute; left: 0; width: 18px; height: 2px; background: var(--text);
  }
  #sidebar-toggle span::before { top: -6px; }
  #sidebar-toggle span::after { top: 6px; }

  #sidebar-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(45, 42, 38, 0.4); z-index: 40;
  }
  #sidebar-backdrop.open { display: block; }

  /* ── Mobile Responsive ── */
  @media (max-width: 768px) {
    #sidebar-toggle { display: flex; }
    #sidebar {
      position: fixed; left: 0; top: 0; bottom: 0;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      z-index: 45; width: 260px;
      box-shadow: 0 0 24px rgba(45, 42, 38, 0.12);
    }
    #sidebar.open { transform: translateX(0); }

    #content { padding: 64px 20px 60px; max-width: 100%; }
    .brief-header h2 { font-size: 22px; }
    .story-headline { font-size: 16px; }
    .summary { font-size: 14.5px; line-height: 1.75; }
    .bg-section-text { font-size: 13.5px; }
    .metric-chip { font-size: 12px; padding: 6px 10px; }
    .bg-box { padding: 18px 18px; }
    .cat-tab { padding: 11px 14px; font-size: 13.5px; }

    .quiz-card { padding: 28px 24px 24px; }
    .quiz-q { font-size: 17px; }
    .quiz-choice { font-size: 14px; padding: 13px 16px; }
  }

  /* ── Quiz Overlay ── */
  body.quiz-active #app {
    filter: blur(6px) saturate(0.85);
    pointer-events: none;
    transition: filter 0.3s ease;
  }
  #quiz-overlay {
    position: fixed; inset: 0;
    background-color: rgba(250, 250, 247, 0.55);
    background-image:
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0) 0,
        rgba(255,255,255,0) 5px,
        rgba(45,42,38,0.04) 5px,
        rgba(45,42,38,0.04) 6px
      ),
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0) 0,
        rgba(255,255,255,0) 22px,
        rgba(45,42,38,0.025) 22px,
        rgba(45,42,38,0.025) 23px
      );
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 24px;
  }
  #quiz-overlay.hidden { display: none; }

  .quiz-card {
    background: var(--paper); border-radius: 16px;
    padding: 36px 36px 32px; width: 100%; max-width: 440px;
    box-shadow: 0 16px 48px rgba(45, 42, 38, 0.18);
  }
  .quiz-eyebrow {
    font-size: 11px; color: var(--text-sub); letter-spacing: 1.5px;
    text-transform: uppercase; font-weight: 500; margin-bottom: 12px;
  }
  .quiz-q {
    font-size: 19px; font-weight: 700; color: var(--text);
    line-height: 1.5; letter-spacing: -0.3px; margin-bottom: 24px;
  }
  .quiz-choices { display: flex; flex-direction: column; gap: 8px; }
  .quiz-choice {
    background: var(--paper); border: 1px solid var(--line-strong);
    padding: 14px 18px; border-radius: 10px; font-size: 14.5px; font-weight: 500;
    color: var(--text); cursor: pointer; text-align: left;
    font-family: inherit; transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .quiz-choice:focus { outline: none; }
  .quiz-choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) {
    .quiz-choice:hover { background: var(--accent-soft); border-color: var(--accent); }
  }
  .quiz-choice:active { transform: scale(0.99); }
  .quiz-choice.wrong {
    background: #F5E6E0; border-color: #C9947F; color: #8A4A30;
    animation: shake 0.4s ease;
  }
  .quiz-choice.correct {
    background: #E3EDE2; border-color: #7A9077; color: #2E4A2C;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .quiz-feedback {
    margin-top: 20px; text-align: center; font-size: 14px; font-weight: 500;
    color: var(--text-mid); min-height: 22px;
  }
  .quiz-feedback.right { color: #2E4A2C; }
  .quiz-feedback.wrong { color: #8A4A30; }

  .quiz-close-btn {
    margin-top: 18px; width: 100%;
    background: var(--text); color: var(--paper); border: none;
    padding: 13px 20px; border-radius: 10px; font-size: 14px; font-weight: 600;
    font-family: inherit; cursor: pointer;
    transition: background 0.15s;
  }
  .quiz-close-btn:hover { background: #1a1815; }
  .quiz-close-btn.hidden { display: none; }
</style>
</head>
<body>
<div id="quiz-overlay">
  <div class="quiz-card">
    <div class="quiz-eyebrow"><span>잠깐, 나에 대해서 잘 알지?</span> <span id="quiz-counter">(0/3)</span></div>
    <div class="quiz-q" id="quiz-q"></div>
    <div class="quiz-choices" id="quiz-choices"></div>
    <div class="quiz-feedback" id="quiz-feedback"></div>
    <button class="quiz-close-btn hidden" id="quiz-close">닫기</button>
  </div>
</div>

<button id="sidebar-toggle" aria-label="메뉴"><span></span></button>
<div id="sidebar-backdrop"></div>

<div id="app">
  <nav id="sidebar">
    <div id="sidebar-header">
      <h1>모닝 브리핑</h1>
      <p>일별 세계 뉴스 요약</p>
    </div>

    <div id="date-list"></div>
  </nav>
  <main id="main">
    <div id="content"></div>
  </main>
</div>

<script>
const BRIEFS = [{
  tag:`2026-09-10`,
  label:`2026년 9월 10일 (목)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`유럽중앙은행 추가 금리 인상 유력... 미 연준도 매파적 기조 속 금리 인상 저울질`,
  metrics:[`유럽중앙은행(ECB) 예금 금리 2.50% 예상`,`미국 연준(Fed) 기준금리 4.25%~4.50% 전망`],
  summary:`미국과 이란 간의 분쟁 등 지정학적 위기로 인한 유가 상승 여파로 전 세계 주요 중앙은행들의 셈법이 복잡해지고 있어. 특히 유럽중앙은행(ECB)은 지속되는 인플레이션 압력에 대응하기 위해 오늘 통화정책회의에서 예금 금리를 2.50%로 인상할 것이 확실시되고 있지. 미국 연준(Fed) 또한 최근 잭슨홀 미팅에서 매파적 발언이 나온 이후, 9월을 시작으로 연내 추가적인 금리 인상을 단행할 것이라는 전망이 우세해. 이는 중동발 에너지 쇼크로 인한 물가 상승을 억제하기 위한 고육지책으로 풀이돼. 투자자들은 당장 오늘 밤 발표될 미국의 생산자물가지수(PPI)에 주목하며 향후 글로벌 통화정책의 방향성을 가늠하고 있어.`,
  keyTerms:[{term:`매파적`,explanation:`물가 안정을 위해 금리 인상과 통화 긴축을 선호하는 성향을 뜻해.`}],
  history:`코로나19 팬데믹 이후 인플레이션을 잡기 위해 전 세계적으로 공격적인 금리 인상이 있었으나, 최근 다시 물가 불안 요소가 대두되었어.`,
  players:`미국 연방준비제도(Fed)와 유럽중앙은행(ECB), 일본은행(BOJ) 등 주요국 중앙은행들이 핵심 행위자야.`,
  current:`미국-이란 갈등으로 국제 유가가 치솟으며 물가 상승 압력이 다시 커지고 있는 상황이야.`,
  outlook:`오늘 밤 발표될 미국 PPI 결과와 9월 연준 FOMC 회의 결과에 따라 글로벌 증시 변동성이 확대될 전망이야.`,
  sources:[{title:`글로벌 경제 성장 및 통화정책 전망 - 커먼웰스은행`,url:`https://www.commbank.com.au`},{title:`미국 인플레이션 및 금리 정책 분석 - 트레이딩뷰`,url:`https://www.tradingview.com`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`코스피 33거래일 만에 7,000선 돌파... 원·달러 환율은 1,330원대로 하락`,
  metrics:[`코스피 7,051.64 마감`,`원/달러 환율 1,336.1원 (22개월 최저치)`],
  summary:`국내 주식시장이 반도체와 이차전지 대형주들의 강세에 힘입어 코스피 7,000선을 가뿐히 돌파했어. 기관의 대규모 매수세가 지수 상승을 견인하며 33거래일 만에 의미 있는 기록을 세운 거야. 동시에 외환시장에서는 일본은행의 추가 금리 인상 기대감으로 엔화가 강세를 띠면서, 원·달러 환율이 크게 하락해 1,330원대에 진입했어. 이는 약 22개월 만에 가장 낮은 수준으로 수입 물가 안정에는 긍정적인 신호야. 다만, 국제 유가 급등과 미 국채금리 상승 등 대외 변동성 요인이 여전히 남아 있어 안심하기엔 일러.`,
  keyTerms:[{term:`원·달러 환율`,explanation:`미국 달러화에 대한 원화의 교환 비율로, 환율이 하락하면 수입 물가 부담이 줄어드는 효과가 있어.`}],
  history:`오랜 기간 박스권에 머물던 코스피가 최근 반도체 등 수출 주력 산업의 호조로 상승 탄력을 받고 있어.`,
  players:`외국인과 기관 투자자들의 수급 동향, 그리고 일본은행(BOJ)의 정책 변화가 주요 변수야.`,
  current:`국내 증시의 호조와 환율 하락이 겹치며 내수와 수출 시장 모두 새로운 국면을 맞이하고 있어.`,
  outlook:`향후 미국의 금리 결정과 중동 사태 전개에 따라 외국인 자금 이탈 여부가 증시의 방향을 결정할 거야.`,
  sources:[{title:`코스피 7,000선 탈환 및 시황 - 다음 금융`,url:`https://finance.daum.net/`},{title:`원달러 환율 1,330원대 진입 분석 - FN타임즈`,url:`https://www.fntimes.com`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국, 한국산 반도체에 표적 관세 압박... 국내 클러스터 대신 미국 투자 요구`,
  metrics:[`한국산 반도체 대상 표적 관세 부과 위협`,`국내 대형 반도체 클러스터 투자금의 미국 본토 이전 압박`],
  summary:`미국 정부가 한국산 반도체에 이른바 표적 관세를 매기겠다며 압박 수위를 높이고 있어. 이는 한국 기업들이 계획 중인 대규모 국내 반도체 클러스터 투자액을 미국 본토로 돌리도록 강제하기 위한 조치로 해석돼. 경제 안보를 명분으로 내세운 미국의 자국 우선주의가 노골화되면서, 국내 핵심 산업인 반도체 업계에는 비상이 걸렸어. 자칫 막대한 관세 부담을 안거나 국내 투자 계획을 전면 수정해야 할 위기에 처했기 때문이야. 정부와 반도체 업계는 긴급 대책 회의를 열고 미국의 압박에 대응할 시나리오를 고심하고 있어.`,
  keyTerms:[{term:`표적 관세`,explanation:`특정 국가나 품목을 겨냥해 불이익을 주기 위해 징벌적으로 부과하는 높은 세율의 관세를 의미해.`}],
  history:`미국은 칩스법(Chips Act) 시행 이후 자국 내 반도체 생산망 구축을 위해 동맹국 기업들에게도 투자를 압박해 왔어.`,
  players:`미국 상무부와 한국 정부, 그리고 삼성전자, SK하이닉스 등 국내 반도체 핵심 기업들이 연관되어 있어.`,
  current:`단순한 보조금 당근을 넘어 관세라는 채찍을 꺼내들며 미국 본토 투자를 강요하는 험악한 분위기야.`,
  outlook:`한국 정부의 외교적 협상 결과와 반도체 기업들의 투자 계획 변경 여부가 향후 산업 경쟁력을 좌우할 전망이야.`,
  sources:[{title:`미국 반도체 관세 압박 및 국내 영향 - HK한타임즈`,url:`https://hkhantimes.com`},{title:`반도체 투자 압박에 정부 긴급 대책 마련 - 선데이저널`,url:`https://sundayjournal.kr`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국의 호르무즈 파병 요구에 정치권 충돌... 파병 반대 촛불집회 예고`,
  metrics:[`미국 트럼프 대통령, 11월까지 파병 요구`,`정부, 비전투 최소 전력 파병 검토 중`],
  summary:`미국 트럼프 대통령이 11월까지 호르무즈 해협에 한국군 파병을 강력히 요구하면서 국내 정치권이 발칵 뒤집혔어. 국회 대정부질문에서는 미국의 압박에 굴복할 수 없다는 야당과 한미 동맹의 실익을 챙겨야 한다는 여당이 치열하게 맞붙고 있지. 정부는 전투 부대가 아닌 비전투 최소 전력을 파병하는 절충안을 검토 중이지만 논란은 사그라지지 않고 있어. 이 와중에 시민단체들은 파병이 국가 안보를 위험에 빠뜨릴 수 있다며 오늘 저녁 서울 도심에서 대규모 촛불집회와 평화행진을 예고했어. 프랑스를 국빈 방문하고 귀국하는 이재명 대통령에게 이번 파병 정국은 가장 시급한 외교·안보 시험대가 될 전망이야.`,
  keyTerms:[{term:`대정부질문`,explanation:`국회의원들이 국정 전반이나 특정 현안에 대해 국무총리와 국무위원(장관)들을 국회로 불러 직접 질문하고 답변을 듣는 제도야.`}],
  history:`과거 중동 지역 분쟁 시에도 미국의 파병 요청이 있었고, 한국은 동맹 관계와 경제적 파장 사이에서 줄타기를 해왔어.`,
  players:`파병을 압박하는 미국 트럼프 행정부, 신중을 기하는 한국 정부, 그리고 찬반으로 나뉜 여야 정치권이 맞물려 있어.`,
  current:`국내외 반발 여론이 거세지는 가운데, 정부는 파병의 수위와 형식을 놓고 장고를 거듭하고 있는 상황이야.`,
  outlook:`국회 비준 동의 등 향후 파병 결정 과정에서 험난한 정치적 진통이 계속될 것으로 예상돼.`,
  sources:[{title:`트럼프 호르무즈 파병 압박 및 여야 공방 - 한국경제`,url:`https://hankyung.com`},{title:`호르무즈 파병 반대 촛불집회 예고 - 뉴시스`,url:`https://newsis.com`}]

  category:`정치`,

  colorBg:`#fce8e6`,
  headline:`미군, 이란 유조선 추가 격침... 페르시아만 군사적 긴장 최고조`,
  metrics:[`미군, 나흘간 이란 유조선 8척 격침`,`브렌트유 배럴당 100달러 돌파`],
  summary:`페르시아만과 호르무즈 해협을 둘러싼 미국과 이란의 무력 충돌이 걷잡을 수 없이 격화되고 있어. 이란이 미 군함을 향해 탄도 미사일을 쏘자, 미 중부사령부는 이에 대한 보복으로 이란 유조선 5척을 추가로 격침시켰어. 이란 역시 요르단 내 미군 기지에 미사일을 발사하며 정면충돌 양상을 보이고 있지. 다행히 요르단 방공망에 요격되었지만, 전면전 우려는 그 어느 때보다 커진 상태야. 이처럼 중동 지역의 화약고가 폭발 직전까지 가면서, 글로벌 원유 공급망 차질 우려로 국제 유가는 배럴당 100달러를 돌파했어.`,
  keyTerms:[{term:`중부사령부`,explanation:`미군의 통합전투사령부 중 하나로, 주로 중동, 북아프리카, 중앙아시아 지역의 군사 작전을 총괄하는 곳이야.`}],
  history:`미국의 이란 핵합의 탈퇴 이후 양국 간의 경제 제재와 군사적 마찰이 수년간 반복되며 긴장이 누적되어 왔어.`,
  players:`초강경 대응을 주도하는 미군과 호르무즈 해협을 무기로 삼는 이란 혁명수비대가 정면으로 대치 중이야.`,
  current:`서로 공격과 보복을 주고받으며 '눈에는 눈'식의 군사 작전이 실전으로 전개되고 있어 매우 위험해.`,
  outlook:`양국 간 극적인 중재가 없다면 국지전 수준을 넘어선 중동 전체의 안보 위기로 확전될 가능성이 높아.`,
  sources:[{title:`미-이란 무력 충돌 및 유가 급등 - WNG`,url:`https://wng.org`},{title:`미군, 이란 유조선 추가 격침 상황 - YouTube News`,url:`https://youtube.com`}]

  headline:`영국, 이스라엘 유대인 정착촌 제재... 양국 외교 관계 최악 치달아`,
  metrics:[`영국, 유대인 정착촌 제품 수입 전면 금지`,`이스라엘, 영국 의원 12명 입국 금지 조치`],
  summary:`영국과 이스라엘 사이에 전례 없는 외교 전쟁이 터졌어. 영국 외무장관이 요르단강 서안지구의 이스라엘 유대인 정착촌 확장을 인종 청소라고 맹비난하며, 해당 지역 제품의 수입을 전면 금지하는 경제 제재를 발동했거든. 이에 격분한 이스라엘 정부는 동예루살렘에 있는 영국 영사관을 즉각 폐쇄하고, 제재에 찬성한 영국 의원 12명의 입국을 금지하는 초강수로 맞대응했어. 오랫동안 복잡하게 얽혀있던 중동 문제에 유럽 주요국이 직접적인 경제 제재로 개입하면서 외교적 파장이 일파만파 커지고 있는 형국이야.`,
  keyTerms:[{term:`유대인 정착촌`,explanation:`이스라엘이 국제법을 어기고 팔레스타인 영토 내에 자국민을 이주시켜 세운 마을로, 중동 분쟁의 핵심 뇌관이야.`}],
  history:`서안지구 정착촌 문제는 이스라엘과 팔레스타인 간 평화 협상의 가장 큰 걸림돌로 국제사회의 지속적인 비판을 받아왔어.`,
  players:`강경한 입장을 고수하는 이스라엘 현 정권과 인권 문제를 이유로 제재에 나선 영국 정부가 맞서고 있어.`,
  current:`단순한 규탄 성명을 넘어 실제 무역 제재와 영사관 폐쇄라는 실질적인 외교 보복전으로 비화되었어.`,
  outlook:`영국의 조치가 유럽연합(EU) 등 다른 서방 국가들의 연쇄 제재로 이어질지 이스라엘이 촉각을 곤두세우고 있어.`,
  sources:[{title:`영국-이스라엘 외교 갈등 심화 - YouTube News`,url:`https://youtube.com`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`정부, 내년도 건강보험료율 7.19%로 동결... 고물가 속 서민 부담 완화 조치`,
  metrics:[`2027년 건강보험료율 7.19% 유지`,`고물가로 인한 서민 경제 부담 완화 목표`],
  summary:`정부가 내년(2027년)에 적용될 건강보험료율을 올해와 동일한 7.19%로 동결하기로 확정했어. 최근 지속되는 고물가와 고금리로 인해 팍팍해진 서민들의 경제적 부담을 조금이나마 덜어주기 위한 특단의 조치야. 보통 매년 인상되던 건강보험료가 동결된 것은 이례적인 일로, 장바구니 물가 상승에 지친 국민들에게는 반가운 소식이지. 다만, 건강보험 재정 건전성에 대한 우려의 목소리도 나오고 있어 정부는 불필요한 의료 쇼핑을 줄이고 지출을 효율화하는 재정 안정화 대책을 함께 추진할 계획이라고 밝혔어.`,
  keyTerms:[{term:`건강보험료율`,explanation:`직장 가입자나 지역 가입자가 소득이나 재산에 비례해 매월 납부해야 하는 건강보험료의 비율을 말해.`}],
  history:`인구 고령화와 의료비 증가로 인해 건강보험료율은 그동안 거의 매년 꾸준히 인상되는 추세였어.`,
  players:`보험료를 결정하는 보건복지부 산하 건강보험정책심의위원회와 가입자인 국민들이 주요 당사자야.`,
  current:`체감 물가가 급등하면서 국민들의 조세 및 준조세 저항 심리가 커지자 정부가 동결 카드를 꺼낸 거야.`,
  outlook:`단기적으로는 부담이 줄지만, 중장기적으로 건강보험 누적 적립금을 어떻게 유지할지가 중요한 과제가 될 거야.`,
  sources:[{title:`내년 건보료 동결 및 보건 이슈 - HK한타임즈`,url:`https://hkhantimes.com`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`엔비디아, 오픈소스 AI 플랫폼 '허깅페이스' 129억 달러에 전격 인수`,
  metrics:[`인수 금액 약 129억 달러 (약 17조 원)`,`AI 모델 공유 플랫폼 장악으로 소프트웨어 생태계 확장`],
  summary:`AI 반도체 시장을 독점하고 있는 엔비디아가 세계 최대의 오픈소스 AI 모델 공유 플랫폼인 허깅페이스를 129억 달러에 인수한다고 깜짝 발표했어. 허깅페이스는 전 세계 개발자들이 AI 모델과 코드를 올리고 공유하는 AI계의 깃허브로 불리는 곳이야. 이번 인수는 엔비디아가 단순히 하드웨어 칩을 파는 것을 넘어, 개발자들이 활동하는 소프트웨어 생태계까지 완벽하게 장악하겠다는 강력한 의지를 보여준 거야. 테크 업계는 이번 메가딜이 향후 인공지능 산업의 권력 구도를 엔비디아 중심으로 완전히 재편할 것이라며 촉각을 곤두세우고 있어.`,
  keyTerms:[{term:`오픈소스`,explanation:`소프트웨어의 설계도인 소스 코드를 누구나 자유롭게 보고, 수정하고, 재배포할 수 있도록 공개하는 방식이야.`}],
  history:`엔비디아는 GPU 하드웨어에서의 압도적 우위를 바탕으로 CUDA 등 소프트웨어 플랫폼 확장을 꾸준히 시도해왔어.`,
  players:`생태계 확장을 노리는 엔비디아와 막대한 개발자 풀을 가진 허깅페이스, 그리고 이를 견제하는 빅테크 경쟁사들이 있어.`,
  current:`AI 개발의 필수 인프라가 된 두 회사가 결합하면서 AI 산업 전반에 엄청난 시너지와 독점 우려가 교차하고 있어.`,
  outlook:`반독점 규제 당국의 기업 결합 승인 여부와 타 빅테크 기업들의 합종연횡 등 견제 움직임이 본격화될 전망이야.`,
  sources:[{title:`엔비디아 허깅페이스 대규모 인수 - VerakWorld`,url:`https://verakworld.com`}]

  headline:`프린스턴 대학 인공지능, 꿈의 에너지 '핵융합 플라즈마' 실시간 제어 성공`,
  metrics:[`밀리초 단위로 핵융합 플라즈마 불안정성 예측 및 제어`,`안정적인 핵융합 에너지 상용화 앞당길 핵심 기술 확보`],
  summary:`프린스턴 대학교 연구진이 개발한 특수 인공지능(AI) 모델이 태양보다 훨씬 뜨거운 인공태양, 즉 핵융합 플라즈마를 실시간으로 제어하는 데 성공해 화제야. 핵융합 발전은 무한하고 깨끗한 꿈의 에너지로 불리지만, 초고온 플라즈마가 순식간에 붕괴하는 불안정성 문제가 가장 큰 난제였거든. 연구진의 AI는 플라즈마가 찢어지는 징후를 무려 밀리초 단위로 미리 예측하고 방지하는 마법 같은 능력을 보여줬어. 과학계는 이 획기적인 연구 결과가 인류의 오랜 숙원인 핵융합 에너지 상용화 시기를 크게 앞당길 수 있는 역사적인 전환점이 될 것이라고 환호하고 있어.`,
  keyTerms:[{term:`핵융합`,explanation:`가벼운 원자핵들이 엄청난 열과 압력 속에서 합쳐져 무거운 원자핵이 되며 막대한 에너지를 뿜어내는 현상이야.`}],
  history:`핵융합은 수십 년간 연구되어 왔지만, 극한의 환경에서 플라즈마 상태를 장시간 유지하는 기술적 장벽에 부딪혀 왔어.`,
  players:`프린스턴 플라즈마 물리 연구소(PPPL) 등 전 세계 첨단 물리 연구소들이 이 기술 선점을 위해 각축전을 벌이고 있어.`,
  current:`AI 기술이 비약적으로 발전하면서, 과거 인간의 계산으로는 불가능했던 초고속 복잡계 제어가 비로소 가능해진 거야.`,
  outlook:`이번 성공을 발판으로 더 큰 규모의 핵융합로(ITER 등)에 AI 제어 기술이 본격 도입되며 상용화 연구가 가속될 예정이야.`,
  sources:[{title:`프린스턴 대학 핵융합 플라즈마 AI 제어 - SciTechDaily`,url:`https://scitechdaily.com`}]
}]

  tag:`2026-09-09`,
  label:`2026년 9월 9일 (수)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`올 2분기 명목 GDP 26.4% 급증하며 47년 만에 최고치 기록`,
  metrics:[`2분기 GDP 증가율 26.4%`,`1979년 이후 최고 수준`],
  summary:`올 2분기 명목 국내총생산(GDP)이 전년 동기 대비 26.4% 급증하며 1979년 이후 47년 만에 최고 성장률을 기록했습니다. 이는 글로벌 AI 투자 확대에 따른 반도체 수출 호황이 주도한 결과입니다. 하지만 내수 중심의 건설업 등은 역성장하며 산업 간 양극화가 뚜렷하게 나타났습니다. 수출 대기업과 내수 중소기업 간의 체감 경기 격차가 커지고 있어 우려의 목소리도 나옵니다. 정부는 수출 온기를 내수로 확산시키기 위한 추가 대책을 고심 중입니다. 전문가들은 지속 가능한 성장을 위해서는 내수 부진의 근본적인 해결이 필수적이라고 지적합니다.`,
  keyTerms:[{term:`명목 국내총생산(GDP)`,explanation:`물가 상승분을 반영하여 현재 가격으로 계산한 국가의 총 경제 규모입니다. 경제의 외형적인 성장세를 보여주는 핵심 지표입니다.`}],
  history:`과거 한국 경제는 반도체 사이클에 따라 전체 성장률이 크게 출렁이는 경향을 보여왔습니다. 최근 몇 년간 침체기를 겪던 반도체 수출이 AI 붐과 함께 폭발적으로 회복되면서 수출 지표가 급반등했습니다.`,
  players:`삼성전자, SK하이닉스 등 대형 수출 기업들이 실적을 이끌고 있는 반면, 건설사와 소상공인 등 내수 관련 주체들은 고금리 장기화로 인해 여전히 자금난을 겪고 있습니다.`,
  current:`거시적인 경제 지표는 화려하지만, 국민들이 실생활에서 느끼는 체감 경기는 오히려 악화되는 전형적인 양극화 현상이 뚜렷해지고 있는 중대한 시점입니다.`,
  outlook:`하반기 미국의 금리 인하 여부와 국내 내수 진작 정책의 실효성이 향후 양극화 해소의 핵심이 될 것입니다. 정부의 하반기 경제 정책 발표에 시장의 이목이 쏠려 있습니다.`,
  sources:[{title:`2분기 명목 GDP, 47년 만에 최고 성장 - 동아일보`,url:`https://www.donga.com`},{title:`반도체 수출 호황과 내수 침체의 명암 - 한국경제`,url:`https://www.hankyung.com`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`중동발 지정학적 리스크 확대로 국제유가 100달러 돌파 초읽기`,
  metrics:[`브렌트유 배럴당 97.92달러`,`국내 코스피 2954.52로 하락`],
  summary:`사우디 석유시설에 대한 무력 공격과 역내 갈등 격화로 브렌트유가 배럴당 97달러를 넘어서며 100달러를 위협하고 있습니다. 중동의 원유 공급 차질 우려가 커지면서 글로벌 인플레이션 재점화 가능성이 제기됩니다. 이 여파로 국내 증시에서도 코스피가 3000선 아래인 2954.52로 밀려났고, 원/달러 환율은 다시 1345.6원으로 상승했습니다. 에너지 수입 의존도가 높은 한국 경제에 상당한 충격이 예상되며, 물가 당국도 긴장하고 있습니다. 특히 휘발유 및 디젤 가격의 가파른 상승이 가계의 소비 심리를 더욱 위축시킬 전망입니다. 정부는 유류세 인하 조치 연장 등 다각적인 비상 대응 방안을 논의 중입니다.`,
  keyTerms:[{term:`브렌트유`,explanation:`유럽 북해에서 생산되는 원유로, 서부텍사스산원유(WTI), 두바이유와 함께 세계 3대 유종으로 꼽히며 글로벌 원유 가격의 기준 역할을 합니다.`}],
  history:`최근 수년간 중동 지역은 크고 작은 분쟁이 끊이지 않았으나, 핵심 석유 시설에 대한 직접적인 타격은 드물었습니다. 지정학적 불안감이 커질 때마다 유가는 즉각적으로 급등하는 패턴을 반복해왔습니다.`,
  players:`산유국 모임인 OPEC+와 무력 충돌의 당사자들, 그리고 유가 방어를 위해 비축유 방출을 고려하는 미국 등 주요 소비국들이 복잡한 이해관계로 얽혀 있습니다.`,
  current:`글로벌 금리 인하 기대감으로 시장이 안정되어 가던 찰나에 유가 폭등이라는 돌발 악재가 터지면서 인플레이션 통제에 제동이 걸렸습니다.`,
  outlook:`단기적으로 유가가 100달러를 넘어설지 여부가 관건이며, 유가 상승이 이어지면 주요국 중앙은행들의 금리 인하 시점도 뒤로 미뤄질 가능성이 큽니다.`,
  sources:[{title:`중동 정세 격화에 국제유가 100달러 육박 - 연합뉴스`,url:`https://www.yna.co.kr`},{title:`유가 급등에 코스피 하락·환율 상승 - 매일경제`,url:`https://www.mk.co.kr`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`일본 국채 금리 30년 만에 최고치, 5조 달러 해외 자금 회귀 경고`,
  metrics:[`일본 10년물 국채 금리 3% 돌파`,`해외 투자 자금 5조 달러 규모`],
  summary:`일본 10년물 국채 금리가 3%를 돌파하며 30년 만에 최고치를 기록했습니다. 일본은행의 지속적인 긴축 기조로 인해 국내 금리 매력도가 높아지면서, 미국 등 해외에 머물던 5조 달러 규모의 일본 자금이 본국으로 돌아갈 수 있다는 경고가 나옵니다. 이른바 엔캐리 트레이드 자금이 대규모로 청산될 경우 글로벌 채권 시장과 자산 시장에 엄청난 변동성을 초래할 수 있습니다. 미국과 유럽 금융당국은 자본 유출입 동향을 예의주시하고 있습니다. 전문가들은 일본계 자본 비중이 높은 신흥국 증시에서 갑작스러운 자금 이탈이 발생할 위험을 경고합니다. 한국 증시 역시 외인 자금 동향에 민감하게 반응하며 불안감을 보이고 있습니다.`,
  keyTerms:[{term:`엔캐리 트레이드`,explanation:`이자가 매우 싼 일본 엔화를 빌려서 금리가 더 높은 다른 나라의 주식이나 채권 등 수익성 자산에 투자해 이익을 내는 금융 투자 기법입니다.`}],
  history:`일본은 지난 수십 년간 잃어버린 30년을 극복하기 위해 마이너스 금리와 대규모 양적 완화 정책을 유지해왔습니다. 이로 인해 많은 자본이 수익률을 좇아 해외로 빠져나갔습니다.`,
  players:`금리를 올리며 정상화를 꾀하는 일본은행과, 일본 자본의 대규모 이탈을 우려하는 미국 연방준비제도(Fed) 및 글로벌 투자은행들이 시장의 흐름을 주시하고 있습니다.`,
  current:`일본의 인플레이션이 목표치를 안정적으로 웃돌고 경제가 회복세를 보이면서, 초완화적 통화정책을 거두어들이는 역사적인 전환점이 도래했습니다.`,
  outlook:`엔화 강세와 일본 금리 상승이 동시에 진행될 경우, 글로벌 자산 시장에서 단기적인 매도 물량이 쏟아지는 발작 현상이 나타날 수 있어 투자자들의 주의가 필요합니다.`,
  sources:[{title:`일본 자금 본국 회귀 우려... 글로벌 시장 긴장 - 연합뉴스`,url:`https://www.yna.co.kr`},{title:`일본 국채 금리 30년 만에 최고치 돌파 - 조선일보`,url:`https://www.chosun.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`여야, 20년 만에 '지구당 부활' 잠정 합의하며 정치 개혁 속도`,
  metrics:[`20년 만의 지구당 부활 논의`,`여야 당대표 공감대 형성`],
  summary:`여야가 2004년 일명 오세훈법으로 폐지되었던 정당의 지구당을 20년 만에 부활시키는 데 잠정 합의했습니다. 정치 신인들의 진입 장벽을 낮추고 지역 정치를 활성화하겠다는 취지가 강하게 작용했습니다. 하지만 일각에서는 과거처럼 돈 먹는 하마로 변질되거나 불법 정치 자금의 창구가 될 수 있다는 강한 우려도 제기되고 있습니다. 여야는 후원금 모금의 투명성 강화 등 보완책을 마련하여 다가오는 정기국회 내 법안 처리를 목표로 하고 있습니다. 원외 정치인들은 지구당 부활이 풀뿌리 민주주의를 재건하는 첫걸음이라며 환영하는 분위기입니다. 반면 시민단체들은 법안이 통과되기 전에 보다 엄격한 회계 감사 제도가 필수적으로 도입되어야 한다고 목소리를 높이고 있습니다.`,
  keyTerms:[{term:`지구당`,explanation:`국회의원 선거구 단위로 세워지는 정당의 지역 연락 사무소입니다. 풀뿌리 민주주의의 기반이 되지만 과거 불법 자금 문제가 있어 폐지된 바 있습니다.`}],
  history:`과거 지구당은 정당 정치의 근간이었으나, 선거철마다 불법 정치자금이 유통되는 온상으로 지목되면서 2004년 부패 방지 차원에서 전격 폐지되었습니다.`,
  players:`기득권을 내려놓고 정치 신인들에게 기회를 주자는 현역 여야 의원들과, 투명성 부족을 근거로 반대하는 시민단체 간의 팽팽한 논쟁이 진행 중입니다.`,
  current:`원외 위원장들의 척박한 정치 환경이 문제가 되면서, 여야 지도부가 이례적으로 한목소리로 제도 부활의 필요성을 역설하고 나선 상황입니다.`,
  outlook:`지구당 부활을 담은 정당법 및 정치자금법 개정안이 국회 본회의를 통과할지, 그리고 우려되는 부작용을 막을 촘촘한 안전장치가 마련될지 지켜봐야 합니다.`,
  sources:[{title:`여야, 지구당 부활 본격 논의 돌입 - 아주경제`,url:`https://www.ajunews.com`},{title:`지구당 20년 만에 부활하나... 투명성 확보 과제 - KBS`,url:`https://news.kbs.co.kr`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`북한 정권 수립일 78주년 맞아 중·러 정상 일제히 축전 발송`,
  metrics:[`북한 정권 수립 78주년`,`시진핑·푸틴 2명 동시 축전`],
  summary:`북한의 정권 수립일(9·9절) 78주년을 맞아 시진핑 중국 국가주석과 블라디미르 푸틴 러시아 대통령이 김정은 국무위원장에게 나란히 축전을 보냈습니다. 이는 한미일 안보 협력 강화에 맞서 북·중·러 3국의 전략적 연대와 끈끈한 밀착을 대내외에 과시하려는 의도로 풀이됩니다. 특히 최근 북한과 러시아 간의 군사 기술 이전 및 경제 협력이 속도를 내면서 동북아시아의 지정학적 긴장감은 한층 고조되고 있습니다. 한국 외교당국은 북한의 추가 도발이나 밀착 행보에 촉각을 곤두세우고 있습니다. 미국 역시 유엔 안전보장이사회 결의안을 위반하는 무기 거래에 대해 강력히 경고하고 나섰습니다. 향후 가을을 기점으로 북한이 무력 시위의 강도를 높일 가능성이 커 국제사회의 긴장감이 확산되고 있습니다.`,
  keyTerms:[{term:`9·9절`,explanation:`1948년 9월 9일 북한 정권(조선민주주의인민공화국)이 수립된 것을 기념하는 북한의 가장 중요한 국경일 중 하나입니다.`}],
  history:`냉전 시대부터 북한, 중국, 러시아는 사회주의 우방국으로서 협력해왔으나, 최근 몇 년간 서방 국가들과의 대립이 심해지면서 세 국가의 밀착이 눈에 띄게 강화되었습니다.`,
  players:`김정은, 시진핑, 푸틴 세 정상은 각자의 정치적, 군사적 필요(우크라이나 전쟁 지원, 미국의 견제 등)에 의해 서로의 전략적 가치를 높게 평가하고 있습니다.`,
  current:`한미일 3국이 캠프 데이비드 선언 이후 군사 안보 협력을 전례 없이 끌어올린 것에 대항하여 북중러가 하나의 진영으로 뭉치는 신냉전 구도가 고착화되고 있습니다.`,
  outlook:`가을 이후 북한이 중러의 뒷배를 믿고 핵실험이나 대륙간탄도미사일(ICBM) 발사 등 고강도 도발을 감행할 가능성이 제기되어 국제사회의 경계가 높아지고 있습니다.`,
  sources:[{title:`북 9·9절 78주년... 시진핑·푸틴 나란히 축전 - 연합뉴스TV`,url:`https://www.yonhapnewstv.co.kr`},{title:`북중러 밀착 과시, 동북아 긴장 고조 - 동아일보`,url:`https://www.donga.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 새 행정부 출범 후 동맹국 방위비 증액 및 보편 관세 압박 본격화`,
  metrics:[`보편적 기본관세 10% 논의`,`주한미군 방위비 대폭 인상 우려`],
  summary:`새롭게 출범한 미국 행정부가 선거 공약이었던 미국 우선주의 기조를 전면적으로 실행에 옮기고 있습니다. 무역 적자 해소를 위해 모든 수입품에 대한 보편적 기본관세 10% 부과안이 구체화되고 있으며, 동맹국들을 상대로 한 방위비 분담금 대폭 증액 압박도 거세지고 있습니다. 글로벌 무역 질서가 다자주의에서 보호무역 중심으로 급속히 재편되면서 수출 주도형 국가인 한국 경제에 직접적인 타격이 현실화될 조짐입니다. 정부와 경제계는 대미 협상력 강화를 위한 비상 대응 체제에 돌입했습니다. 반도체와 자동차 등 핵심 수출 품목을 생산하는 기업들은 공급망 다변화 등 자구책 마련에 서두르고 있습니다. 국제 사회는 미국의 일방적인 조치가 글로벌 무역 전쟁을 촉발할 수 있다며 깊은 우려를 표명하고 있습니다.`,
  keyTerms:[{term:`보호무역`,explanation:`국가 간 무역에서 관세나 수입 제한 등을 통해 자국의 산업을 외국의 경쟁으로부터 보호하려는 정책입니다.`}],
  history:`미국은 막대한 무역 적자와 자국 제조업의 쇠퇴를 극복하기 위해 지속적으로 동맹국들에게도 무역 장벽을 높이고 안보 비용을 전가하는 흐름을 보여왔습니다.`,
  players:`미국 최우선주의를 내세우는 미국 정부와, 미국의 안보 우산 및 소비 시장에 크게 의존하고 있는 한국, 일본, 유럽연합(EU) 등의 국가들이 치열한 협상을 앞두고 있습니다.`,
  current:`단순한 엄포를 넘어 실제 관세 부과를 위한 행정 명령이 준비되면서, 글로벌 공급망 전체가 미국의 정책 변화 하나하나에 흔들리는 불안한 상황이 지속되고 있습니다.`,
  outlook:`한국 정부는 미국에 진출한 우리 기업들의 피해를 최소화하고, 방위비 협상에서 합리적인 수준의 합의를 끌어내기 위해 총력 외교전을 펼칠 전망입니다.`,
  sources:[{title:`미국발 관세 폭탄 우려, 韓 수출 초비상 - 중앙일보`,url:`https://www.joongang.co.kr`},{title:`동맹국 방위비 압박 현실화되나 - SBS 뉴스`,url:`https://news.sbs.co.kr`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`정부, 인공지능 생활에 접목한 'K-AI 시티' 원주·아산 등 시범도시 추진`,
  metrics:[`2030년까지 1단계 구축 완료`,`교통·건축 등 AI 접목 시범도시 3곳 지정`],
  summary:`국토교통부가 인공지능(AI) 기술을 도시 운영 전반에 접목하는 이른바 'K-AI 시티' 프로젝트를 본격적으로 추진한다고 발표했습니다. 강원 원주, 충남 천안과 아산 등이 시범도시로 지정되어 자율주행, 스마트 에너지 관리, 지능형 건축 인프라 등 최첨단 기술이 실제 시민 생활에 적용될 예정입니다. 정부는 2030년까지 1단계 구축을 성공적으로 마치고 이를 해외에 수출할 수 있는 글로벌 모델로 육성할 계획입니다. 이번 대규모 프로젝트가 침체된 지역 경제를 살리고 수도권과의 기술 격차를 해소하는 마중물이 될지 기대감이 큽니다. 해당 지자체들은 관련 벤처 기업들을 유치하기 위해 파격적인 세제 혜택과 인프라 지원을 약속하고 나섰습니다. 전문가들은 정보 보안과 시민 프라이버시 보호를 위한 윤리적 가이드라인 제정도 함께 병행되어야 한다고 강조합니다.`,
  keyTerms:[{term:`스마트 에너지 관리`,explanation:`인공지능과 사물인터넷을 이용해 도시 전체의 전력 사용량을 실시간으로 분석하고 낭비를 최소화하여 효율을 극대화하는 지능형 시스템입니다.`}],
  history:`기존의 스마트시티 사업은 주로 통신 인프라 확충에 머물렀으나, 최근 생성형 AI의 비약적인 발전으로 도시 전체를 통제하고 최적화할 수 있는 기술적 토대가 마련되었습니다.`,
  players:`사업을 주도하는 국토교통부 및 해당 지자체들과, 통신망 및 AI 플랫폼을 제공하는 국내 주요 IT 대기업들이 긴밀하게 협력하는 민관 합동 구조입니다.`,
  current:`수도권에 집중된 첨단 산업을 지방으로 분산시키고 국가 균형 발전을 도모하기 위해 지방 중소도시를 AI 혁신의 테스트베드로 삼은 의미 있는 시점입니다.`,
  outlook:`초기 인프라 구축에 투입되는 막대한 예산의 효율적 집행과, 시민들의 개인정보를 어떻게 안전하게 보호하면서 AI를 학습시킬 것인지가 사업 성공의 관건이 될 것입니다.`,
  sources:[{title:`원주·천안·아산에 'K-AI 시티' 조성 - 연합뉴스`,url:`https://www.yna.co.kr`},{title:`인공지능 품은 스마트시티 본격화 - 한국경제`,url:`https://www.hankyung.com`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`폭증하는 AI 전력 수요에 글로벌 데이터센터 에너지 부족 비상사태`,
  metrics:[`AI 검색 전력 소모량 일반 검색의 10배`,`빅테크 친환경 에너지 투자 20% 증가`],
  summary:`생성형 AI 서비스의 일상화로 전 세계 데이터센터의 전력 소모가 폭증하면서 심각한 에너지 비상사태가 경고되고 있습니다. 텍스트나 이미지를 생성하는 AI 검색 1회에 소모되는 전력이 일반 구글 검색의 최대 10배에 달해 주요 전력망이 감당하기 어려운 수준에 이르렀습니다. 이에 구글, 마이크로소프트 등 글로벌 빅테크 기업들은 소형모듈원전(SMR)을 포함한 친환경 에너지원 확보에 천문학적인 자본을 앞다투어 투입하고 있습니다. 안정적이고 저렴한 전력의 확보 여부가 향후 기업과 국가의 AI 주도권을 좌우할 최우선 과제로 떠올랐습니다. 미국 일부 주에서는 늘어나는 데이터센터 건설 요청에 대응하기 위해 전력 공급 허가를 일시 중단하는 사태까지 발생했습니다. 업계 전문가들은 전력 효율을 획기적으로 높이는 새로운 냉각 시스템 도입이 시급하다고 지적합니다.`,
  keyTerms:[{term:`데이터센터`,explanation:`수많은 컴퓨터 서버와 통신 장비를 한곳에 모아두고 방대한 데이터를 365일 쉬지 않고 저장, 처리하는 거대한 첨단 시설입니다.`}],
  history:`과거에는 데이터센터의 열을 식히는 냉각 비용 정도가 문제였으나, 초대규모 AI 모델의 학습과 추론 과정에 엄청난 양의 전기가 물리적으로 필요해지면서 에너지 위기로 번졌습니다.`,
  players:`AI 주도권을 놓치지 않으려는 빅테크 기업들과, 자국 전력망 과부하와 탄소 배출 증가를 걱정하는 각국 정부 환경 당국 간의 갈등이 존재합니다.`,
  current:`기술의 발전 속도가 에너지 인프라 확충 속도를 앞지르면서, 일부 국가에서는 신규 데이터센터 건립을 일시적으로 제한하는 조치까지 취하고 있습니다.`,
  outlook:`재생에너지 인프라 투자 확대와 더불어, 반도체 자체의 전력 효율을 극적으로 높이는 하드웨어 기술 혁신이 동반되어야만 이 위기를 돌파할 수 있을 것입니다.`,
  sources:[{title:`AI 전력 먹는 하마, 전 세계 전력망 마비 우려 - 뉴스타파`,url:`https://newstapa.org`},{title:`빅테크, AI 전력 확보 위해 원전 눈독 - 조선비즈`,url:`https://biz.chosun.com`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`전력 덜 먹는 '그린 실리콘' 개발에 글로벌 반도체 기업 기술 사활`,
  metrics:[`탄소 배출 30% 감축 칩 개발`,`재활용 소재 사용 의무화 EU 규제 도입`],
  summary:`AI 시대의 심각한 에너지 부족 문제와 갈수록 엄격해지는 친환경 규제에 대응하기 위해 글로벌 IT 업계가 이른바 '그린 실리콘' 개발에 사활을 걸고 나섰습니다. 애플, 삼성전자 등 주요 제조사들은 연산 성능은 최고 수준으로 유지하면서도 전력 소비를 획기적으로 줄인 저전력 반도체를 속속 선보이고 있습니다. 또한 유럽연합(EU)이 IT 기기에 재활용 알루미늄 등 소재 사용을 의무화하는 순환경제 규제를 본격화함에 따라 제품 설계 패러다임이 완전히 바뀌고 있습니다. 환경 오염의 주범으로 몰렸던 IT 기술이 혁신을 통해 문제 해결의 열쇠가 될 수 있을지 주목됩니다. 기업들은 단순히 제품을 판매하는 데 그치지 않고 수명이 다한 기기를 자사에서 직접 수거해 소재를 재활용하는 비율을 의무적으로 높이고 있습니다. 이러한 생태계 변화는 환경 보호뿐만 아니라 자원 고갈 문제를 해결할 지속 가능한 대안으로 평가받고 있습니다.`,
  keyTerms:[{term:`순환경제`,explanation:`제품을 한 번 쓰고 버리는 선형 구조를 탈피하여, 자원을 계속해서 재활용하고 수명을 늘려 쓰레기 발생 자체를 0으로 만드는 지속가능한 경제 모델입니다.`}],
  history:`그동안 IT 기기는 빠른 성능 발전과 짧은 교체 주기로 인해 막대한 전자 폐기물(e-waste)을 발생시키며 지구 환경을 파괴한다는 비판을 받아왔습니다.`,
  players:`강력한 규제안을 입법화하는 유럽연합 등 각국 정부와, 규제를 준수하지 못하면 시장에서 도태될 위기에 처한 글로벌 스마트폰, PC, 반도체 제조사들이 있습니다.`,
  current:`단순한 친환경 마케팅인 '그린워싱'을 넘어, 제품을 폐기할 때까지의 모든 탄소 배출량을 숫자로 증명해야 하는 깐깐한 시대로 진입했습니다.`,
  outlook:`향후에는 기기의 성능이나 디자인뿐만 아니라 얼마나 적은 에너지로 작동하며 100% 재활용이 가능한지가 기업의 기술력과 브랜드 가치를 평가하는 척도가 될 것입니다.`,
  sources:[{title:`전력 소모 확 줄인 저전력 반도체 경쟁 - 테크브루`,url:`https://www.techbrew.co.kr`},{title:`IT업계 생존 키워드 된 순환경제 - 한국경제`,url:`https://www.hankyung.com`}]
}]

  tag:`2026-09-08`,
  label:`2026년 9월 8일 (화)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국 2분기 명목 GDP 성장률 26.4% 기록하며 47년 만에 최고치 달성`,
  metrics:[`명목 GDP 26.4% 상승`,`실질 GNI 3.1% 증가`],
  summary:`올해 2분기 한국 경제의 실질 GDP가 전 분기 대비 0.6% 성장한 가운데, 명목 GDP는 26.4%나 폭등했습니다. 이는 반도체 수출 호조에 힘입은 것으로 1979년 이후 47년 만의 최고 기록입니다. 실질적인 구매력을 보여주는 실질 총소득 역시 3.1% 늘어났습니다. 결과적으로 총저축률이 역대 최고치인 45.6%를 기록하며 경제 전반의 체력이 강해졌음을 보여주었습니다. 하지만 물가 상승분이 명목 GDP에 반영된 측면도 있어 서민 체감 경기와의 괴리를 줄이는 것이 숙제입니다. 향후 하반기 수출 모멘텀이 계속 유지될지 시장의 이목이 집중되고 있습니다.`,
  keyTerms:[{term:`명목 GDP`,explanation:`물가 상승분을 반영하여 현재 시장 가격으로 평가한 국내총생산으로, 경제 규모의 체감 크기를 보여주는 지표입니다.`}],
  history:`최근 수년간 한국 경제는 저성장 기조를 보였으나, 올해 들어 반도체를 중심으로 한 글로벌 IT 수요 회복이 수출을 견인했습니다. 이로 인해 주요 수출 기업들의 이익 규모가 대폭 팽창했습니다.`,
  players:`한국은행이 분기별 통계를 집계하여 발표했으며, 글로벌 시장에서 활약하는 삼성전자와 SK하이닉스 등 주요 반도체 기업들이 이번 성장의 핵심 동력입니다.`,
  current:`물가 상승과 환율 효과가 결합되어 지표상 경제 규모는 크게 뛰었으나, 고물가로 인해 실제 가계의 내수 회복은 여전히 더딘 불균형 상황이 지속되고 있습니다.`,
  outlook:`시장은 하반기에도 글로벌 반도체 호황이 이어질지 주시하고 있습니다. 또한 정부는 늘어난 기업 소득이 가계 소비와 투자로 이어질 수 있도록 정책적 지원 방향을 논의 중입니다.`,
  sources:[{title:`2분기 명목 GDP 26.4% 급증... 47년 만에 최고 기록 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`반도체 수출 호조에 총저축률 45.6% 역대 최고 - 한국경제`,url:`https://www.hankyung.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`원/달러 환율 1,330원대 진입, 2년 만에 최저치 기록`,
  metrics:[`장중 최저 1,335.3원`,`종가 1,340.5원`],
  summary:`원/달러 환율이 장중 1,335.3원까지 하락하며 약 2년 만에 가장 낮은 수준을 기록했습니다. 미국 고용 지표 호조에도 불구하고 원화가 강세를 보인 주된 원인은 국내 대형 반도체 기업들의 대규모 달러 매도입니다. 올해 실적이 크게 개선된 이들 기업이 수십조 원에 달하는 법인세 중간예납을 위해 달러를 원화로 환전하면서 환율 하락을 이끌었습니다. 여기에 글로벌 시장의 엔화 강세 흐름까지 겹치면서 원화 가치는 더욱 탄력을 받았습니다. 수출 기업들의 가격 경쟁력에는 다소 부담이 될 수 있지만, 치솟던 수입 물가 안정에는 긍정적인 영향을 미칠 것으로 보입니다.`,
  keyTerms:[{term:`법인세 중간예납`,explanation:`기업이 한 해 동안 벌어들일 소득에 대해 낼 법인세의 일부를 중간에 미리 납부하는 제도로, 조세 수입을 균분하고 기업의 세금 부담을 분산시킵니다.`}],
  history:`원/달러 환율은 미국의 고금리 장기화 기조 속에 지난 2년 가까이 1,300원대 중후반의 높은 수준을 맴돌며 수입 물가 상승의 주범으로 지목되어 왔습니다.`,
  players:`대규모 법인세를 납부해야 하는 수출 대기업들과 외환시장 수급을 조절하는 외환 당국, 그리고 미국 연방준비제도(Fed)의 정책 결정자들이 주요 변수입니다.`,
  current:`반도체 호황으로 세금을 원화로 내야 하는 기업들의 달러 환전 수요가 외환 시장에 일시적으로 대거 쏟아지면서 급격한 환율 하락이 촉발된 상황입니다.`,
  outlook:`단기적인 세금 납부 수요가 끝나면 환율이 다시 반등할 가능성이 있습니다. 미국의 하반기 금리 인하 여부와 일본은행의 통화 정책 변화가 향후 환율 방향을 결정할 것입니다.`,
  sources:[{title:`원/달러 환율 1330원대로 뚝... 반도체 기업 달러 매도 영향 - 매일경제`,url:`https://www.mk.co.kr/`},{title:`법인세 중간예납 시즌, 외환시장 요동... 수출기업 긴장 - 서울신문`,url:`https://www.seoul.co.kr/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국-캐나다 무역 전쟁 고조, 캐나다 보복 관세 발효 임박`,
  metrics:[`양국 관세율 10% 이상 인상안`,`관련 무역 규모 수백억 달러 타격`],
  summary:`도널드 트럼프 미국 대통령의 일방적인 추가 관세 위협에 맞서 캐나다가 준비한 보복 관세가 곧 발효될 예정입니다. 미국이 자국 산업 보호를 명분으로 무역 장벽을 높이려 하자 캐나다 역시 강경 대응으로 선회하면서 양국 간의 무역 전쟁이 본격화하고 있습니다. 오랜 기간 긴밀하게 연결되어 있던 북미 경제권이 흔들리면서 글로벌 공급망과 관련 다국적 기업들의 불확실성도 덩달아 커졌습니다. 특히 자동차 부품, 철강, 농산물 등 주요 교역 품목에서 심각한 타격이 예상됩니다. 앞으로 진행될 양국 간의 고위급 협상 테이블에서 타협점을 찾을 수 있을지가 글로벌 경제의 핵심 변수로 떠올랐습니다.`,
  keyTerms:[{term:`보복 관세`,explanation:`상대국이 자국 상품에 부당하게 관세를 올리거나 무역 장벽을 세울 때, 이에 맞대응하여 상대국에서 수입하는 제품에 부과하는 징벌적 성격의 추가 관세입니다.`}],
  history:`과거 북미자유무역협정(NAFTA)을 대체한 USMCA 체제 아래서 안정을 유지하던 양국 무역 관계는 최근 미국의 자국 우선주의 정책 강화로 인해 파열음을 내기 시작했습니다.`,
  players:`미국 무역대표부(USTR)와 캐나다 총리실이 전면전의 주체이며, 국경을 가로질러 공급망을 구축한 북미 자동차 및 제조업계가 가장 큰 피해를 볼 위기에 처했습니다.`,
  current:`미국이 철강 및 알루미늄에 대한 추가 관세를 예고하자 캐나다가 즉각적으로 동등한 규모의 농산물 및 공산품 보복 관세 리스트를 확정하여 맞불을 놓은 상태입니다.`,
  outlook:`양국 모두 자국 내 정치적 여론을 의식해 쉽게 물러서지 않을 기세입니다. 세계 무역 기구(WTO) 제소 등 국제적인 무역 분쟁으로 비화할 가능성도 제기되고 있습니다.`,
  sources:[{title:`Canada set to launch retaliatory tariffs against US - Reuters`,url:`https://www.reuters.com/`},{title:`US-Canada trade war escalates, threatening auto supply chains - Bloomberg`,url:`https://www.bloomberg.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`8·30 개각 후폭풍 거세, 김승원·용혜인 후보자 여야 대치 심화`,
  metrics:[`야당 후보자 2명 즉각 사퇴 요구`,`청와대 임명 강행 의지 재확인`],
  summary:`최근 발표된 8·30 개각 이후 김승원 법무부 장관 후보자와 용혜인 성평등가족부 장관 후보자를 둘러싼 논란이 일파만파로 커지고 있습니다. 김 후보자는 과거 코로나19 치료제 신속 승인을 부당하게 청탁했다는 이른바 '쥐약 게이트' 의혹에 휩싸였고, 용 후보자는 비례대표직 겸직 논란으로 비판을 받고 있습니다. 여당인 국민의힘은 개각 전면 철회를 요구하며 강하게 반발하고 있으나, 더불어민주당과 청와대는 적법한 인사청문회를 거쳐 판단해야 한다며 맞서고 있습니다. 이번 인사청문회 정국은 향후 정기국회 주도권을 쥐기 위한 여야의 중대 분수령이 될 전망입니다. 두 후보자의 실제 낙마 여부에 따라 하반기 정국의 방향이 크게 요동칠 것으로 보입니다.`,
  keyTerms:[{term:`인사청문회`,explanation:`대통령이 국가의 주요 고위 공직자를 임명하기 전에 국회가 후보자의 업무 능력, 자질, 그리고 도덕성을 검증하기 위해 여는 공개 회의입니다.`}],
  history:`대통령은 임기 후반기 국정 동력 확보를 위해 대대적인 8·30 개각을 단행했으나, 핵심 부처 후보자들의 과거 행적과 발언이 연일 도마 위에 오르며 정쟁의 불씨가 되었습니다.`,
  players:`청와대와 여당 방어에 나선 더불어민주당, 그리고 관련 의혹을 집중적으로 파헤치며 공세를 펴고 있는 국민의힘 등 야당 의원들이 치열하게 대립하고 있습니다.`,
  current:`야당은 연일 새로운 녹취록과 문자를 폭로하며 여론전을 주도하고 있고, 여당은 이를 정치 공세이자 표적 수사라며 방어막을 치는 데 총력을 기울이고 있습니다.`,
  outlook:`곧 열릴 국회 인사청문회에서 후보자들의 해명 여부가 핵심이 될 것입니다. 여론의 향배에 따라 청와대가 지명을 철회할지 아니면 임명을 강행할지 결정될 예정입니다.`,
  sources:[{title:`8·30 개각 후폭풍... 여야 '김승원·용혜인' 둘러싸고 강대강 대치 - 조선일보`,url:`https://www.chosun.com/`},{title:`청와대, 장관 후보자 자진사퇴 선 긋기... "인사청문회가 먼저" - 연합뉴스`,url:`https://www.yna.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`독일 작센안할트주 선거 극우 정당 AfD 압승, 유럽 정계 비상`,
  metrics:[`AfD 주의회 선거 제1당 등극`,`기존 연정 지지율 10%대 추락`],
  summary:`독일 동부 작센안할트주에서 치러진 지방 선거에서 극우 성향의 '독일을 위한 대안(AfD)'이 압승을 거두며 유럽 정치권 전체에 큰 파장을 일으켰습니다. 반이민 정책과 자국 우선주의를 최우선으로 내세운 AfD의 돌풍은 기존 주류 정치 세력의 경제 및 이민 정책에 대한 유권자들의 강한 불만이 표출된 결과입니다. 이로 인해 프리드리히 메르츠 총리가 이끄는 현 독일 연립정부는 심각한 정치적 타격을 입고 리더십 위기에 직면하게 되었습니다. 유럽 전역에서 우파 포퓰리즘이 확산하는 가운데 핵심 국가인 독일까지 극우 세력이 득세함에 따라 향후 유럽연합(EU)의 결속력에도 금이 갈 우려가 큽니다. 다가오는 다른 주요 지역 선거에서도 이러한 극우 약진 현상이 도미노처럼 이어질지 전 세계가 주목하고 있습니다.`,
  keyTerms:[{term:`우파 포퓰리즘`,explanation:`기성 정치와 기득권층을 비판하면서 대중의 감정을 자극하고, 주로 반이민, 자국 중심주의, 전통적 가치를 내세우는 우파 성향의 정치 이데올로기입니다.`}],
  history:`독일 재통일 이후 구동독 지역은 서독에 비해 경제적 소외감과 박탈감이 누적되어 왔으며, 최근 이민자 급증과 경제 침체가 맞물리면서 극우 정당의 텃밭으로 변모했습니다.`,
  players:`기존 주류 정당인 기민당(CDU)과 사민당(SPD)은 지지층 이탈을 겪고 있으며, 알리스 바우델 등 AfD 지도부는 동부 지역의 압승을 발판으로 전국 정당화를 노리고 있습니다.`,
  current:`선거 결과 발표 직후 주류 정당들은 연정 붕괴의 책임을 놓고 서로를 비난하고 있으며, 독일 전역에서는 극우 반대 시위와 지지 시위가 동시에 일어나며 사회가 양극화되고 있습니다.`,
  outlook:`이번 선거 결과는 내년으로 다가온 독일 연방 총선의 풍향계 역할을 할 것입니다. 기존 정당들이 이민 및 경제 정책을 보수적으로 선회할 가능성이 높게 점쳐지고 있습니다.`,
  sources:[{title:`Far-right AfD wins decisively in German regional elections - AP`,url:`https://apnews.com/`},{title:`AfD's historic win shocks German political establishment - The New York Times`,url:`https://www.nytimes.com/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미 육군성 장관 전격 사임, 국방 수뇌부 갈등 수면 위로`,
  metrics:[`댄 드리스콜 장관 취임 1년여 만에 사임`,`중동 분쟁 7개월째 장기화`],
  summary:`미국의 댄 드리스콜 육군성 장관이 피트 헤그세스 국방장관과의 지속적인 정책 및 예산 충돌 끝에 전격적으로 사임서를 제출했습니다. 이란 및 중동 무장 단체들과의 군사적 긴장이 7개월째 이어지며 탄약 부족과 미군 병력의 피로도가 극에 달한 상황에서 발생한 지휘부의 핵심 공백입니다. 그동안 쉬쉬해오던 미 국방부 펜타곤 내부의 잦은 불협화음이 수면 위로 완전히 드러나면서 원활한 군사 작전 수행 차질을 우려하는 목소리가 커지고 있습니다. 특히 중동 지역의 안보 불안이 최고조에 달한 민감한 시기여서 이스라엘 등 주요 동맹국들의 방위 불안감도 덩달아 가중되고 있습니다. 차기 육군성 장관 지명이 늦어질 경우 미국의 전 세계 국방 전략 재편에도 부정적인 영향이 불가피할 전망입니다.`,
  keyTerms:[{term:`육군성 장관`,explanation:`미국 국방부 산하에서 육군의 행정, 예산 확보, 무기 조달, 병력 훈련 등 전반적인 조직 관리를 책임지는 민간 출신의 최고 책임자입니다.`}],
  history:`최근 수년간 미군은 예산 감축 압박 속에서 첨단 무기 개발과 재래식 병력 유지 사이에서 딜레마를 겪어왔으며, 중동 사태 발발 이후 군수품 재고 부족 문제가 수면 위로 떠올랐습니다.`,
  players:`미군의 군사 작전을 통제하는 피트 헤그세스 국방장관과 행정 및 예산을 책임지던 댄 드리스콜 육군성 장관 사이의 주도권 싸움이 이번 사태의 본질입니다.`,
  current:`드리스콜 장관의 전격 사임으로 육군 내부의 동요가 커지고 있으며, 의회 국방위원회는 국방부의 혼란스러운 리더십 부재 상황에 대해 강한 우려를 표명하고 있습니다.`,
  outlook:`백악관은 조속히 차기 장관 후보자를 지명하여 군의 혼란을 수습하려 하겠지만, 상원 인준 과정에서 국방부의 중동 정책 실패에 대한 거센 추궁이 이어질 것으로 예상됩니다.`,
  sources:[{title:`US Army Secretary Dan Driscoll resigns amid Pentagon infighting - The Wall Street Journal`,url:`https://www.wsj.com/`},{title:`Leadership vacuum in US military raises concerns over Middle East strategy - The New York Times`,url:`https://www.nytimes.com/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`애플 팀 쿡 CEO 15년 만에 퇴임, 후임에 존 터니스 지명`,
  metrics:[`팀 쿡 애플 CEO 15년 재임`,`애플 시가총액 세계 1위 수성`],
  summary:`애플을 15년간 성공적으로 이끌어온 팀 쿡 최고경영자(CEO)가 마침내 경영 일선에서 물러나며 IT 업계에 큰 획을 그었습니다. 그의 재임 기간 동안 애플은 아이폰 생태계를 공고히 하고 서비스 부문을 크게 확장하며 글로벌 시가총액 1위 자리를 굳건히 지켰다는 찬사를 받습니다. 후임으로는 오랜 기간 애플의 하드웨어 엔지니어링을 총괄하며 제품 혁신을 이끌어온 존 터니스가 지명되어 애플의 새로운 시대를 열게 되었습니다. 존 터니스는 급변하는 인공지능(AI) 혁신과 미래 먹거리인 공간 컴퓨팅 분야에서 애플의 경쟁력을 다시 증명해야 하는 무거운 과제를 안고 있습니다. 세계 최대 테크 기업의 경영진 교체 소식에 글로벌 IT 업계와 주식 시장은 향후 애플의 제품 철학이 어떻게 변화할지 촉각을 곤두세우고 있습니다.`,
  keyTerms:[{term:`시가총액`,explanation:`증권 시장에 상장된 특정 기업의 발행 주식 총수에 주당 가격을 곱한 값으로, 기업의 현재 시장 가치와 경제적 규모를 나타내는 대표적인 재무 지표입니다.`}],
  history:`스티브 잡스의 뒤를 이어 2011년 CEO에 오른 팀 쿡은 탁월한 공급망 관리 능력과 안정적인 조직 운영으로 애플을 세계에서 가장 수익성 높은 기업으로 성장시켰습니다.`,
  players:`경영 일선에서 물러나는 팀 쿡과 새롭게 조타수를 쥐게 된 하드웨어 전문가 존 터니스 신임 CEO, 그리고 이를 지켜보는 전 세계 투자자 및 소비자들이 얽혀 있습니다.`,
  current:`애플은 최근 생성형 AI 경쟁에서 경쟁사들에 비해 다소 뒤처졌다는 평가를 받고 있으며, 비전 프로 등 혼합현실 기기의 대중화라는 어려운 숙제를 직면하고 있습니다.`,
  outlook:`존 터니스 신임 체제 아래서 애플이 폐쇄적인 기존 생태계를 유지할지, 아니면 AI 시대에 맞춰 더욱 개방적이고 파격적인 폼팩터를 선보일지 올가을 신제품 발표회에 이목이 쏠립니다.`,
  sources:[{title:`Tim Cook steps down as Apple CEO after 15 years, John Ternus to succeed - Bloomberg`,url:`https://www.bloomberg.com/`},{title:`End of an era: What Tim Cook's departure means for Apple's future - Financial Times`,url:`https://www.ft.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`메타, 일부 스마트 글래스 원격 먹통 조치로 사용자 반발 확산`,
  metrics:[`약 1만 대 이상 기기 원격 비활성화`,`소비자 단체 집단 소송 준비`],
  summary:`메타가 자사의 증강현실 스마트 글래스 일부 제품군에 대해 원격으로 기기 작동을 정지시키는 이른바 '벽돌화' 조치를 단행해 전 세계적으로 큰 논란이 일고 있습니다. 메타 측은 운영체제 보안 취약점 악용 및 사용자 개인정보 보호 규정 위반을 막기 위한 불가피한 조치였다고 해명했으나, 사용자들은 사전 경고조차 없는 일방적인 기기 차단이라며 강하게 반발하고 있습니다. 이 사건은 개인이 하드웨어 소유권을 가지더라도 소프트웨어 통제권을 제조사가 독점하고 있는 현대 스마트 기기 시장의 구조적 문제점을 여실히 보여줍니다. 소비자가 수백 달러를 주고 산 기기라도 빅테크 제조사의 일방적 결정에 따라 언제든 무용지물이 될 수 있다는 디지털 종속 불안감이 확산되고 있습니다. 향후 각국 규제 당국이 기업의 과도한 소프트웨어 통제 권한 남용을 어떻게 제재할지가 주요 쟁점입니다.`,
  keyTerms:[{term:`벽돌화`,explanation:`스마트폰이나 웨어러블 기기 등의 핵심 소프트웨어에 문제가 생기거나 제조사가 원격으로 잠금을 걸어, 기기가 마치 돌덩이처럼 전혀 작동하지 않는 먹통 상태가 되는 현상입니다.`}],
  history:`과거에도 게임기나 스마트 디바이스에서 제조사가 불법 개조를 막기 위해 기기를 차단한 사례는 있었으나, 이번처럼 일상 생활용 웨어러블 기기를 대규모로 원격 정지시킨 것은 이례적입니다.`,
  players:`사생활 보호와 해킹 방지를 우선시하는 메타(Meta) 경영진과 갑자기 안경이 먹통이 된 수많은 글로벌 소비자들, 그리고 디지털 권리를 주장하는 시민 단체들이 맞서고 있습니다.`,
  current:`온라인 커뮤니티를 중심으로 메타에 대한 불매 운동 조짐이 보이고 있으며, 피해를 입은 사용자들은 법무법인을 통해 집단 소송을 제기하기 위해 피해 사례를 규합하고 있습니다.`,
  outlook:`이 논란은 곧 미국 연방거래위원회(FTC)와 유럽연합(EU)의 디지털 기기 소유권 및 소비자 권리 관련 새로운 법제도 논의에 불을 지피는 중요한 촉매제가 될 것으로 보입니다.`,
  sources:[{title:`Meta faces backlash after remotely bricking users' smart glasses - Reuters`,url:`https://www.reuters.com/`},{title:`The danger of smart devices: When corporations turn your hardware into a brick - The Economist`,url:`https://www.economist.com/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`북한, 전술핵 탑재 가능 신형 5,000톤급 구축함 동해 전격 취역`,
  metrics:[`배수량 5,000톤급 신형 함정`,`순항미사일 수직발사관 다수 장착`],
  summary:`북한이 다양한 전술핵무기를 탑재할 수 있는 것으로 평가되는 5,000톤급 신형 구축함 '강건호'를 동해 함대에 전격적으로 취역시키며 역내 군사적 긴장감을 최고조로 끌어올리고 있습니다. 김정은 국무위원장은 건조된 함정의 취역식에 직접 참석해 진정한 의미의 해군 핵무장화 실현을 거듭 강조하며 최근 강화되고 있는 한미일 3국의 연합 해상 훈련에 대해 강력한 무력 경고 메시지를 던졌습니다. 이번 신형 대형 구축함의 실전 배치로 인해 한반도 주변 해역, 특히 동해상에서의 우발적 무력 충돌 위험이 한층 커졌다는 군사 전문가들의 분석이 잇따르고 있습니다. 우리 군과 정보 당국은 북한의 실제 원양 해상 도발 능력이 어느 정도까지 향상되었는지 그 제원을 정밀하게 예의주시하고 있습니다. 국제사회 역시 북한의 지속적이고 노골적인 핵 투발 수단 다변화 행보를 강하게 규탄하며 대북 제재망을 재점검하고 나섰습니다.`,
  keyTerms:[{term:`해군 핵무장화`,explanation:`육상 기지뿐만 아니라 수상함이나 잠수함 등 해군 전투 함정에 전술핵이나 전략핵 무기를 실전 배치하여, 바다 위에서도 언제든 핵 공격 능력을 행사할 수 있도록 군사력을 개편하는 전략입니다.`}],
  history:`북한 해군은 그동안 노후화된 소형 연안 경비정 위주의 전력으로 평가받았으나, 최근 수년간 김정은 위원장의 지시 아래 해상 전력 현대화와 대형 수상함 건조에 막대한 자원을 쏟아부었습니다.`,
  players:`새로운 해상 비대칭 전력을 과시하려는 북한 군부와, 이를 억제하고 정밀 감시해야 하는 한국 해군 및 미국 태평양함대가 동해를 무대로 팽팽하게 대치하고 있습니다.`,
  current:`강건호의 취역은 북한 정권 수립일(9·9절)을 하루 앞두고 내부 체제 결속을 다지는 동시에, 한미 연합 방위 태세에 균열을 내기 위한 다목적 무력시위 성격을 띠고 있습니다.`,
  outlook:`한국과 미국은 북한의 해상 도발에 대비해 연합 대잠·대함 훈련 강도를 더욱 높일 예정이며, 북한이 이 구축함을 이용해 실제로 미사일 시험 발사를 감행할 가능성도 제기됩니다.`,
  sources:[{title:`북한, 전술핵 탑재 5000t급 신형 구축함 '강건호' 동해 취역 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`김정은 "해군 핵무장화 실현"... 한미일 연합훈련 겨냥 무력시위 - KBS`,url:`https://news.kbs.co.kr/`}]
}]

  tag:`2026-09-07`,
  label:`2026년 9월 7일 (월)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`세계 최대 노르웨이 국부펀드, 미국 국채 비중 12%p 대폭 축소 제안`,
  metrics:[`미 국채 비중 12.2%p 축소`,`약 800억 달러 매각 예상`],
  summary:`세계 최대 규모의 투자자인 노르웨이 정부연금펀드(GPFG)가 미국 국채 비중을 대폭 줄이겠다고 제안했습니다. 이들은 포트폴리오 재조정의 일환으로 미국 국채 비중을 기존보다 12.2%포인트 줄인다는 방침입니다. 이는 약 800억 달러에 달하는 막대한 규모로, 글로벌 채권 시장에 큰 파장을 예고하고 있습니다. 펀드 측은 지정학적 리스크 분산과 수익률 다변화를 이유로 꼽았습니다. 유럽과 신흥국 시장으로의 자금 이동이 예상되는 가운데, 미 국채 금리 상승 압력으로 작용할 수 있다는 분석이 나옵니다. 향후 노르웨이 의회의 최종 승인 여부에 전 세계 투자자들의 이목이 쏠려 있습니다.`,
  keyTerms:[{term:`포트폴리오 재조정`,explanation:`시장 상황이나 투자 목표의 변화에 맞춰 보유한 자산(주식, 채권 등)의 비율을 다시 조정하는 것을 말합니다. 위험을 줄이거나 수익을 높이기 위해 주기적으로 실시합니다.`}],
  history:`노르웨이는 석유 수출로 벌어들인 막대한 국부를 미래 세대를 위해 GPFG라는 이름의 펀드로 운용해 왔으며, 주로 선진국 국채에 투자해 안전성을 꾀했습니다.`,
  players:`노르웨이 정부와 의회, 그리고 이 펀드의 운용 주체가 결정 권한을 가지며, 미국 정부는 국채 최대 큰손의 이탈을 예의주시하고 있습니다.`,
  current:`최근 달러 패권에 대한 의구심과 글로벌 금리 불확실성이 커지면서, 펀드 측이 선제적으로 리스크 관리에 나선 것으로 풀이됩니다.`,
  outlook:`올 연말 노르웨이 의회에서 이 제안이 최종 통과될 경우, 내년부터 실제 대규모 자본 이동이 시작될 전망입니다.`,
  sources:[{title:`노르웨이 국부펀드, 미 국채 비중 축소 제안 - 글로벌이코노믹`,url:`https://www.g-enews.com/`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`정부, 비효율 해소 위해 공공기관 20% 대대적 통폐합 추진`,
  metrics:[`공공기관 20% 감축`,`연간 3조원 예산 절감 목표`],
  summary:`정부가 만성적인 적자와 비효율을 해결하기 위해 국내 공공기관의 약 20%를 줄이는 대대적인 구조조정 및 통폐합 계획을 발표했습니다. 유사하거나 중복되는 업무를 수행하는 기관들을 하나로 합치고, 불필요한 산하 단체를 과감히 없애는 것이 핵심입니다. 이를 통해 연간 약 3조 원의 국가 예산을 절감할 수 있을 것으로 정부는 내다보고 있습니다. 하지만 기관 통폐합에 따른 대규모 인력 감축 우려로 노동계의 강한 반발이 즉각 터져 나왔습니다. 향후 국회 입법 과정과 노사정 대화에서 극심한 진통이 예상됩니다. 공공서비스 질 저하를 막으면서도 재정 건전성을 달성할 수 있을지가 이번 개혁의 성패를 가를 전망입니다.`,
  keyTerms:[{term:`재정 건전성`,explanation:`국가나 기관이 수입과 지출의 균형을 잘 맞추어 빚을 지지 않고 재무 상태를 튼튼하게 유지하는 것을 의미합니다.`}],
  history:`지난 수년간 공공기관의 숫자는 지속적으로 증가해왔으나, 방만 경영과 낙하산 인사 논란이 겹치며 적자 폭이 크게 늘어났습니다.`,
  players:`기획재정부를 필두로 한 정부 부처가 칼자루를 쥐고 있으며, 양대 노총과 야당은 일방적인 구조조정에 반대하고 있습니다.`,
  current:`저출산 고령화로 인한 세수 감소 압박이 커지면서 정부가 더 이상 공공부문의 비대화를 방치할 수 없다고 판단한 상황입니다.`,
  outlook:`정부는 다음 달 세부적인 통폐합 대상 리스트를 확정하여 발표할 예정이며, 이후 본격적인 법 개정 절차에 돌입합니다.`,
  sources:[{title:`국내 공공기관 20% 통폐합 추진... 반발 예고 - 연합뉴스`,url:`https://www.yna.co.kr/`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 주도의 AI 반도체 대중 수출 통제 강화, 글로벌 칩 시장 요동`,
  metrics:[`수출 통제 대상 50개 추가`,`AI 칩 관련주 평균 4% 하락`],
  summary:`미국 정부가 인공지능(AI) 개발에 필수적인 첨단 반도체 및 제조 장비에 대한 새로운 대중국 수출 통제 조치를 기습 발표했습니다. 이번 조치로 고성능 칩뿐만 아니라 범용 AI 가속기 등 50여 개 품목이 새롭게 수출 통제 대상에 포함되었습니다. 이 소식이 전해지자 엔비디아를 비롯한 글로벌 주요 반도체 기업들의 주가가 일제히 하락하며 칩 시장이 크게 출렁였습니다. 기업들은 이번 규제로 인해 거대한 중국 시장에서의 매출 타격이 불가피할 것으로 우려하고 있습니다. 한국의 메모리 반도체 업계 또한 중국 내 공장 운영과 장비 반입에 미칠 간접적 영향을 분석하며 촉각을 곤두세우고 있습니다. 기술 패권을 둘러싼 미중 갈등이 반도체 산업 전체의 불확실성을 키우고 있습니다.`,
  keyTerms:[{term:`수출 통제`,explanation:`국가 안보나 외교적 목적을 위해 특정 기술이나 물품이 다른 나라로 수출되는 것을 법으로 제한하고 막는 조치입니다.`}],
  history:`미국은 2022년부터 첨단 반도체와 장비가 중국의 군사력 강화에 쓰이는 것을 막고자 강력한 규제망을 구축해왔습니다.`,
  players:`미국 상무부가 규제를 주도하며, 중국 정부는 강력히 반발하는 가운데 엔비디아, 삼성전자, SK하이닉스 등 기업들이 중간에 끼어 있습니다.`,
  current:`중국이 자체적인 AI 반도체 개발에 속도를 내자, 미국이 기존 규제의 빈틈을 막기 위해 촘촘한 추가 제재를 가한 것입니다.`,
  outlook:`중국 상무부의 보복 조치 발표가 임박한 것으로 알려졌으며, 반도체 공급망을 둘러싼 양국의 보복전이 격화될 가능성이 높습니다.`,
  sources:[{title:`미, AI 반도체 통제 강화... 글로벌 칩 시장 흔들 - 매일경제`,url:`https://www.mk.co.kr/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`스페이스X, 파리 우주정상회의 돌연 불참 통보로 각국 당혹`,
  metrics:[`30여 개국 정상 참석 예정`,`위성 궤도 룰 제정 논의 무산 위기`],
  summary:`일론 머스크가 이끄는 민간 우주기업 스페이스X가 프랑스 파리에서 열리는 우주정상회의에 돌연 불참을 통보했습니다. 이번 회의는 30여 개국 정상과 글로벌 우주 기업 대표들이 모여 지구 저궤도 위성 교통정리와 우주 쓰레기 방지 규범을 논의하는 중요한 자리였습니다. 세계 최대 위성 통신망인 스타링크를 운영하는 스페이스X가 빠짐으로써, 실효성 있는 궤도 규제안 마련은 사실상 불가능해졌다는 평가가 지배적입니다. 머스크 측은 특정 국가 중심의 편향된 규제 시도에 반대한다는 짧은 입장만 냈을 뿐 구체적인 불참 사유를 밝히지 않았습니다. 이에 따라 유럽연합(EU)과 미국 당국자들은 당혹감을 감추지 못하며 대응책 마련에 부심하고 있습니다. 민간 기업의 힘이 국가 간 협의체를 흔드는 우주 패권의 현주소를 극명히 보여주고 있습니다.`,
  keyTerms:[{term:`우주 패권`,explanation:`우주 공간을 탐사하고 이용하는 기술력과 자본력을 바탕으로, 국제 사회에서 우주 정책과 경제적 주도권을 쥐려는 국가나 기업의 영향력을 뜻합니다.`}],
  history:`지구 궤도에 쏘아 올려지는 상업용 위성이 기하급수적으로 늘어나면서 위성 간 충돌 위험이 심각한 국제 문제로 대두되었습니다.`,
  players:`엄격한 궤도 규제를 도입하려는 유럽연합(EU)과 규제를 최소화하려는 스페이스X, 그리고 이를 조율해야 하는 미국 정부가 핵심 행위자입니다.`,
  current:`EU 측이 위성 발사 허가에 대한 강력한 환경 및 안전 표준을 제시할 조짐을 보이자, 스페이스X가 사전 보이콧으로 불만을 표출한 상황입니다.`,
  outlook:`회의에 불참한 스페이스X를 제외하고 각국이 독자적인 규제안을 강행할지, 아니면 일정을 연기하고 재협상을 시도할지 귀추가 주목됩니다.`,
  sources:[{title:`스페이스X, 파리 우주정상회의 불참... 궤도 규제 논의 빨간불 - MBC 뉴스`,url:`https://imnews.imbc.com/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`정부, 중동 긴장 고조에 호르무즈 해협 해상 초계 파병 구체적 검토`,
  metrics:[`파병 규모 약 150명`,`원유 수송량의 70% 통과 지역`],
  summary:`중동 지역의 군사적 긴장이 최고조에 달한 가운데, 정부가 호르무즈 해협 일대에 국군 병력을 파병하는 방안을 적극 검토 중입니다. 현재 논의되는 규모는 해상 초계기와 군수 지원함을 포함한 약 150명 수준인 것으로 알려졌습니다. 호르무즈 해협은 우리나라로 들어오는 원유 수송량의 약 70%가 통과하는 핵심 생명선이기에 우리 상선 보호가 필수적이라는 게 정부의 입장입니다. 그러나 범여권과 야당 등 정치권 일각에서는 분쟁 지역에 개입할 경우 테러 단체의 표적이 될 수 있다며 강하게 반발하고 있습니다. 국민 안전과 에너지 안보라는 두 가지 국익이 충돌하면서, 파병을 둘러싼 국회 내 격렬한 찬반 논쟁이 시작되었습니다. 향후 국무회의 의결과 국회 동의 절차 통과 여부가 핵심 변수입니다.`,
  keyTerms:[{term:`에너지 안보`,explanation:`국가가 경제 활동과 국민 생활에 필수적인 에너지원(석유, 가스 등)을 흔들림 없이 안정적으로 확보하고 유지하는 능력을 말합니다.`}],
  history:`과거에도 청해부대 작전 지역을 호르무즈 해협까지 확대한 전례가 있으나, 독자적인 해상 초계 병력을 새롭게 파병하는 것은 그 의미가 다릅니다.`,
  players:`파병을 주도하는 국방부 및 외교부와 이에 반대하는 야당 및 시민단체가 팽팽하게 맞서고 있습니다.`,
  current:`최근 이스라엘-이란 갈등이 해상 봉쇄 위협으로 번지면서 민간 유조선의 피격 위험이 현실화된 것이 파병 검토의 직접적 원인입니다.`,
  outlook:`정부는 미국 주도의 다국적 연합체 합류 방식과 독자 파병 방식을 두고 고심 중이며, 이달 말 국회 국방위원회에 최종안을 보고할 예정입니다.`,
  sources:[{title:`정부, 호르무즈 해협 150명 파병 검토... 정치권 반발 - KBS 뉴스`,url:`https://news.kbs.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 대선 두 달 앞으로... 핵심 경합주 표심 잡기 총력전 돌입`,
  metrics:[`대선까지 58일 남음`,`경합주 지지율 격차 1%p 이내 초접전`],
  summary:`2026년 미국 대선이 두 달도 채 남지 않은 가운데, 양당 후보들이 백악관의 주인을 결정지을 핵심 경합주에서 총력전에 돌입했습니다. 펜실베이니아, 미시간, 위스콘신 등 주요 경합주의 여론조사 결과 양측의 지지율 격차는 여전히 1%포인트 이내의 초접전 양상을 보이고 있습니다. 양 캠프는 주말 동안 이들 지역에 천문학적인 광고비를 쏟아부으며 중도층 유권자의 표심을 잡기 위해 안간힘을 쓰고 있습니다. 공화당은 경제 인플레이션 심판론을 앞세운 반면, 민주당은 민주주의 수호와 복지 강화를 강조하며 팽팽히 맞서고 있습니다. 사전 투표가 곧 시작되는 만큼 한 치의 실수도 용납되지 않는 살얼음판 승부가 펼쳐지고 있습니다. 이번 경합주의 향방이 미국의 향후 4년 외교 및 경제 정책을 완전히 뒤바꿀 수 있습니다.`,
  keyTerms:[{term:`경합주`,explanation:`선거 때마다 지지하는 정당이 바뀌어 어느 후보가 승리할지 예측하기 매우 힘든 주를 말하며, 스윙 스테이트라고도 부릅니다.`}],
  history:`미국의 독특한 선거인단 제도 때문에, 전체 득표수보다 몇몇 주요 경합주에서 승리해 선거인단을 확보하는 것이 대선 승리의 절대적 공식입니다.`,
  players:`재집권을 노리는 민주당 후보와 정권 탈환을 목표로 하는 공화당 후보, 그리고 표심을 정하지 못한 무당층 유권자들이 주인공입니다.`,
  current:`최근 TV 토론 이후에도 지지율이 굳어지면서, 양측 모두 경합주 유권자들을 직접 찾아가는 현장 밀착형 유세에 사활을 걸고 있습니다.`,
  outlook:`9월 말로 예정된 2차 TV 토론과 10월부터 본격화되는 우편 및 사전투표 실적이 경합주 승패를 가를 마지막 분수령이 될 것입니다.`,
  sources:[{title:`미 대선 50여일 앞두고 경합주 초접전... 광고비 융단폭격 - 연합뉴스`,url:`https://www.yna.co.kr/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`네팔 등 남아시아 기록적 대홍수로 수십만 명 이재민 발생`,
  metrics:[`이재민 약 40만 명 추산`,`강수량 평년 대비 300% 폭우`],
  summary:`네팔을 비롯한 남아시아 전역에 평년 대비 300%가 넘는 기록적인 집중 호우가 쏟아지며 대규모 홍수 참사가 발생했습니다. 이로 인해 강둑이 무너지고 산사태가 잇따르면서 하루아침에 수십만 명의 이재민이 삶의 터전을 잃었습니다. 도심의 주요 도로와 교량이 끊겨 고립된 마을이 늘어나고 있으며, 식수와 식량 부족으로 인한 전염병 확산마저 우려되는 참담한 상황입니다. 네팔 정부는 즉각 국가 비상사태를 선포하고 군부대를 투입해 구조 작업을 벌이고 있지만 피해 규모가 워낙 커 역부족입니다. 유엔(UN)을 비롯한 국제 사회는 긴급 구호 자금을 편성하고 의료진을 급파하는 등 인도적 지원을 서두르고 있습니다. 기후 변화로 인한 극단적 기상 이변이 갈수록 잦아지면서 근본적인 방재 대책이 시급하다는 목소리가 커지고 있습니다.`,
  keyTerms:[{term:`인도적 지원`,explanation:`전쟁이나 자연재해 등으로 생존의 위협을 받는 사람들의 생명을 구하고 고통을 덜어주기 위해 국제 사회가 식량, 의료 등을 대가 없이 돕는 활동입니다.`}],
  history:`남아시아 지역은 매년 몬순(우기) 시즌마다 홍수 피해를 겪어왔으나, 올해는 엘니뇨와 기후 온난화가 겹치며 역대급 강수량을 기록했습니다.`,
  players:`큰 피해를 입은 네팔 정부와 이재민들, 그리고 신속한 구조 물자를 보내야 하는 국제 구호 단체(NGO)들이 분투하고 있습니다.`,
  current:`폭우가 여전히 며칠 더 이어질 것이라는 기상 예보가 있어, 댐 붕괴 등 2차 피해 발생 가능성에 대한 긴장감이 매우 높습니다.`,
  outlook:`국제 사회의 초기 구호 물품이 도착하기 시작했으나, 훼손된 인프라 복구와 이재민들의 일상 회복까지는 수년의 시간과 천문학적 비용이 걸릴 전망입니다.`,
  sources:[{title:`남아시아 네팔, 최악의 대홍수... 국제사회 긴급 구호 착수 - 한겨레`,url:`https://www.hani.co.kr/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`서울 도심 한복판, 운전대 없는 완전 자율주행 버스 정식 운행 개시`,
  metrics:[`1차 노선 길이 15km`,`안전요원 1명 탑승 (조향장치 없음)`],
  summary:`운전석과 조향 장치가 아예 없는 완전 자율주행(레벨 4 수준) 버스가 서울 도심에서 정식으로 승객을 태우고 운행을 시작했습니다. 이번에 도입된 노선은 유동 인구가 많은 도심 주요 구간 15km로, 버스는 주변 차량과 신호등 데이터를 실시간으로 통신하며 부드럽게 주행합니다. 현행법상 비상 상황을 대비해 안전요원 1명이 탑승하지만, 주행 자체는 100% 인공지능과 센서에 의해 자동으로 이루어집니다. 첫날 버스에 탑승한 시민들은 놀라울 만큼 안정적인 승차감에 감탄하면서도 미래 기술이 일상에 성큼 다가왔음을 실감했습니다. 서울시는 이번 정식 운행 데이터를 바탕으로 내년까지 대중교통 소외 지역으로 자율주행 노선을 대폭 확대할 계획입니다. 이번 성공적인 첫발이 국내 미래 모빌리티 산업 전반에 활력을 불어넣을 것으로 기대됩니다.`,
  keyTerms:[{term:`완전 자율주행`,explanation:`시스템이 차량의 속도, 방향, 제동 등을 완벽하게 통제하여, 특정 조건 내에서는 사람의 개입이나 운전대 조작이 전혀 필요 없는 기술 단계를 말합니다.`}],
  history:`그동안 상암동 등 지정된 시범 구역에서 부분적인 자율주행 테스트가 수년간 진행되어 왔으며, 마침내 기술적 안정성을 인정받아 정식 운행에 돌입했습니다.`,
  players:`자율주행 소프트웨어를 개발한 국내 테크 스타트업과 규제를 완화하고 노선을 신설한 서울시가 주요 추진 주체입니다.`,
  current:`고령화로 인한 버스 운전기사 부족 현상이 심화되는 가운데, 자율주행 대중교통이 실질적인 대안으로 주목받으며 상용화 속도를 높이고 있습니다.`,
  outlook:`정식 운행 중 돌발적인 교통사고나 통신 오류가 발생하지 않는다면, 서울을 넘어 다른 지자체로도 자율주행 대중교통 도입이 빠르게 확산될 전망입니다.`,
  sources:[{title:`운전대 없는 버스 탔다... 서울 도심 '완전 자율주행' 시대 개막 - 조선일보`,url:`https://www.chosun.com/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`태평양엔 허리케인 3개 동시 북상, 대서양은 '잠잠'... 기이한 이상 기후`,
  metrics:[`태평양 허리케인 3개 발생`,`대서양 발생 0건 (평년 동기 대비)`],
  summary:`북반구의 가을로 접어드는 9월 초, 태평양에서는 무려 3개의 허리케인이 동시에 북상하는 반면 대서양은 텅 비어 있는 기이한 이상 기후 현상이 관측되었습니다. 기상청에 따르면 현재 태평양 동부 해상에서 로웰, 카리나, 마리로 명명된 강력한 허리케인 3개가 잇따라 발생해 움직이고 있습니다. 반면 통상적으로 허리케인 발생이 가장 잦아야 할 시기인 대서양에서는 단 한 개의 태풍 씨앗조차 발생하지 않아 기상학자들을 당혹게 하고 있습니다. 전문가들은 해수면 온도 변화와 윈드시어(바람의 세기 차이) 등 복합적인 대기 흐름이 꼬이면서 이례적인 현상이 나타났다고 분석합니다. 이처럼 예측을 벗어난 이상 기후는 태평양 연안 국가들의 재난 대비 시스템에 큰 혼란을 주고 있습니다. 전 지구적 기후 온난화가 과거의 기상 공식을 완전히 무너뜨리고 있다는 경고가 나옵니다.`,
  keyTerms:[{term:`이상 기후`,explanation:`과거 수십 년 동안 겪어보지 못했던 폭우, 폭염, 극단적 태풍 등 통계적 기준을 크게 벗어나는 비정상적인 날씨 현상을 통틀어 부르는 말입니다.`}],
  history:`일반적으로 늦여름과 초가을은 대서양 해수면 온도가 최고조에 달해 미국 동부와 카리브해 연안을 강타하는 허리케인이 집중적으로 발생하는 시기입니다.`,
  players:`실시간으로 날씨를 추적하는 각국 기상청과 세계기상기구(WMO), 그리고 갑작스러운 폭우 피해를 대비해야 하는 태평양 연안 국가들이 촉각을 곤두세우고 있습니다.`,
  current:`특정 바다의 온도가 비정상적으로 높아지는 해양 열파 현상이 태평양 쪽에 집중되면서 열대성 저기압이 폭발적으로 생겨나고 있는 상황입니다.`,
  outlook:`기상학자들은 9월 중순 이후 기압계가 재배치되면 대서양에서도 갑자기 초강력 허리케인이 발생할 수 있다며 경계를 늦추지 말 것을 권고하고 있습니다.`,
  sources:[{title:`태평양엔 허리케인 3개, 대서양은 0개... 기상학자들도 놀란 '이상 기후' - 중앙일보`,url:`https://www.joongang.co.kr/`}]
}]

  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미 연준 금리 인상 가능성 고조... 10년물 국채 금리 4.80% 돌파`,
  metrics:[`기준금리 3.50%~3.75%`,`10년물 국채 금리 4.80%`],
  summary:`제롬 파월의 뒤를 이은 케빈 워시 연준 의장이 최근 잭슨홀 미팅에서 인플레이션 우려를 표명하며 추가 금리 인상 가능성을 강력히 시사했다. 이에 따라 미국 10년물 국채 금리는 2025년 초 이후 최고치인 4.80%까지 치솟았다. 특히 9월 11일 발표될 8월 소비자물가지수(CPI) 결과가 금리 향방을 결정할 핵심 변수로 떠올랐다. 고금리 장기화로 인해 주택담보대출 등 실물 경제의 자금 조달 부담이 크게 늘어나고 있다. 향후 연준이 어떤 스탠스를 취할지에 전 세계 금융 시장의 이목이 쏠린 상황이다. 추가적인 긴축 정책이 현실화될 경우 글로벌 증시에 상당한 충격이 예상된다.`,
  keyTerms:[{term:`긴축 정책`,explanation:`중앙은행이 시중에 풀린 돈을 거둬들이기 위해 금리를 올리는 등의 정책. 물가를 잡는 데 쓰이지만 경기를 둔화시킬 수 있다.`}],
  history:`2024~2025년 금리 인하 사이클이 끝난 후 물가가 다시 오르자 연준이 매파적으로 돌아섰다.`,
  players:`케빈 워시 연준 의장, 크리스토퍼 월러 이사 등 연준 주요 인사들과 시장 참여자들.`,
  current:`9월 FOMC를 앞두고 금리 인상 확률이 반반으로 나뉘며 극심한 눈치보기가 진행 중이다.`,
  outlook:`9월 11일 CPI 발표 결과와 다가올 연준의 금리 결정에 따라 시장 변동성이 커질 것이다.`,
  sources:[{title:`Powell successor hints at rate hikes - Reuters`,url:`https://www.reuters.com`},{title:`US Treasury yields spike - Bloomberg`,url:`https://www.bloomberg.com`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미 증시 시가총액 67조 달러 돌파... AI 투자 붐이 이끄는 '나홀로 독주'`,
  metrics:[`시가총액 67조 달러`,`미국 GDP의 220%`],
  summary:`글로벌 경기 둔화 우려 속에서도 미국 주식시장의 시가총액이 사상 최초로 67조 달러를 돌파했다. 이는 미국 명목 GDP의 220%에 달하는 엄청난 수치로, 사실상 미국 증시가 전 세계 자금을 블랙홀처럼 빨아들이고 있음을 의미한다. 특히 인공지능(AI) 관련 기술주들이 설비투자를 바탕으로 강력한 랠리를 주도하고 있다. 그러나 시장 전문가들은 펀더멘털 대비 과열된 주가 수준에 대해 닷컴버블과 유사한 극단적 쏠림 현상이라고 경고한다. 실질 임금 하락으로 미국 가계의 소비 심리가 악화되는 반면 주식 시장만 호황을 누리면서 경제 내 괴리감이 커지고 있다. 향후 AI 기업들의 실적이 기대치에 못 미칠 경우 급격한 시장 조정이 발생할 수 있다.`,
  keyTerms:[{term:`극단적 쏠림 현상`,explanation:`투자 자금이 특정 국가나 특정 산업에만 비정상적으로 집중되는 경제 현상.`}],
  history:`2023년부터 시작된 챗GPT 발 AI 혁명이 2026년까지 빅테크 기업들의 인프라 경쟁으로 이어지며 증시를 견인해왔다.`,
  players:`엔비디아, 마이크로소프트 등 AI 인프라를 주도하는 미국 빅테크 기업들과 월가 투자자들.`,
  current:`다른 국가들의 경제 지표는 부진한 반면 미국 AI 주식만 나홀로 폭등하는 디커플링이 심화되고 있다.`,
  outlook:`빅테크 기업들의 AI 수익화 모델 증명 여부와 실적 발표에 따라 랠리의 지속 가능성이 판가름 날 것이다.`,
  sources:[{title:`US stock market reaches record \$67T - FT`,url:`https://www.ft.com`},{title:`AI boom fuels Wall Street warnings - WSJ`,url:`https://www.wsj.com`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국 수출, 사상 첫 연간 '1조 달러' 클럽 가입 초읽기`,
  metrics:[`누적 수출액 7,094억 달러`,`반도체 수출 전년 대비 169.6% 폭증`],
  summary:`한국 수출이 반도체 호황에 힘입어 사상 유례없는 호조를 보이며 수출 1조 달러 클럽 가입을 눈앞에 두고 있다. 9월 초 기준 올해 누적 수출액은 7,094억 달러를 기록해, 이미 지난해 연간 총액을 돌파했다. 전체 수출의 40% 이상을 차지한 반도체가 전년 대비 169.6%나 폭증하며 맹활약한 것이 주효했다. 다만 승용차 수출이 다소 주춤하고 있어, 특정 품목에 대한 높은 의존도는 아킬레스건으로 지목된다. 이 추세가 연말까지 유지된다면 한국은 미국, 중국, 독일에 이어 세계 4번째 수출 강국으로 도약하게 된다. 정부는 반도체 외에도 다변화된 수출 동력 확보에 안간힘을 쏟고 있다. 이런 무역수지 흑자 행진이 내수 경기 회복으로 이어질 수 있을지가 다음 과제다.`,
  keyTerms:[{term:`무역수지`,explanation:`한 나라가 다른 나라들과 수출입 거래를 한 결과. 수출이 수입보다 많으면 흑자, 적으면 적자라고 한다.`}],
  history:`과거 글로벌 공급망 위기와 반도체 다운사이클로 어려움을 겪었으나, AI 수요 폭발과 함께 HBM 등 고부가가치 메모리 수출이 급증했다.`,
  players:`삼성전자, SK하이닉스 등 국내 반도체 핵심 기업들과 주요 수입국인 미국, 중국 등.`,
  current:`누적 수출액이 역대 최단기간에 7천억 달러를 넘어서며 유례없는 호황 국면에 진입했다.`,
  outlook:`12월 최종적으로 연간 수출 1조 달러 고지를 밟을 수 있을지와 내수 경제로의 낙수효과 여부가 주목된다.`,
  sources:[{title:`올해 누적 수출액 이미 작년 실적 넘었다 - 연합뉴스`,url:`https://www.yna.co.kr`},{title:`반도체가 이끈 수출 호황... 사상 첫 1조 달러 눈앞 - 매일경제`,url:`https://www.mk.co.kr`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`이란 전쟁 전선 확대... 미 군함 공격에 이란 유조선 폭격으로 맞대응`,
  metrics:[`전쟁 7개월 차`,`이란 유조선 3척 타격`],
  summary:`지난 2월 미·이 연합군의 기습 공습으로 발발한 이란 전쟁이 페르시아만 해상 교전으로 번지며 갈등이 극에 달하고 있다. 최근 이란 혁명수비대가 페르시아만 일대의 미 군함을 향해 탄도 미사일을 발사하자, 미군은 즉각 이란 유조선 3척을 타격해 무력화시키는 보복 작전을 감행했다. 이란 외무부는 이번 유조선 공격을 명백한 전쟁 범죄라 규정하며 강력히 반발하고 있다. 반면 미국 트럼프 대통령은 이를 단순한 군사적 마찰로 치부하며 사태의 의미를 축소하려는 태도를 보였다. 양측의 무력 충돌이 레바논 남부와 쿠웨이트 미군 기지 등으로 확산하면서 중동 지역 전체의 위기감이 고조되고 있다. 이번 해상 교전이 전면전으로 가는 도화선이 될지 국제사회가 숨죽여 지켜보고 있다.`,
  keyTerms:[{term:`전쟁 범죄`,explanation:`전시 국제법이나 제네바 협약을 위반하여 민간인, 상선 등을 고의로 공격하거나 비인도적인 행위를 저지르는 것.`}],
  history:`2026년 2월 미국과 이스라엘이 이란의 주요 핵 시설을 타격하고 최고지도자 하메네이가 사망하면서 이란 전쟁이 본격적으로 촉발되었다.`,
  players:`미국 트럼프 행정부, 이스라엘 네타냐후 내각, 그리고 이란 혁명수비대 및 중동 친이란 무장세력.`,
  current:`이란의 미사일 도발과 미국의 해상 보복 타격이 꼬리를 물며 페르시아만 일대의 봉쇄 위협이 커지고 있다.`,
  outlook:`호르무즈 해협 등 주요 원유 수송로의 안전 확보 여부와 트럼프 행정부의 추가 군사 개입 수위가 초미의 관심사다.`,
  sources:[{title:`US strikes Iranian oil tankers in retaliation - Reuters`,url:`https://www.reuters.com`},{title:`Escalation in the Persian Gulf as war enters 7th month - BBC`,url:`https://www.bbc.com`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`2026년 미국 중간선거 11월 3일 돌입... 공화당의 의회 장악 유지될까`,
  metrics:[`하원 435석 전체`,`상원 35석 선출`],
  summary:`도널드 트럼프 대통령의 두 번째 임기 중간 평가 성격을 띠는 2026년 미국 중간선거가 오는 11월 3일 치러진다. 현재 공화당이 상원 53석, 하원 218석으로 양원을 모두 장악하고 있는 가운데, 민주당은 상원 4석과 하원 3석을 탈환해 의회 주도권을 되찾겠다는 목표를 세웠다. 이번 선거의 핵심 쟁점은 단연 이란 전쟁에 투입된 막대한 전비와 사상자 문제다. 야당은 의회 승인 없이 무리하게 진행된 군사 작전의 책임을 물으며 심판론을 꺼내들었다. 선거 결과에 따라 트럼프 행정부의 후반기 국정 동력은 물론 향후 외교 안보 정책의 방향이 크게 요동칠 수 있다. 양당의 텃밭을 제외한 경합주에서의 표심 향방이 상하원 다수당을 결정지을 주요 변수인 중간선거에 이목이 쏠린다.`,
  keyTerms:[{term:`중간선거`,explanation:`미국에서 대통령 임기 4년의 중간인 2년 차에 치러지는 의회 선거. 현직 대통령에 대한 중간 평가 성격을 지닌다.`}],
  history:`2024년 대선에서 승리한 트럼프 대통령은 첫 2년 동안 강력한 행정명령을 밀어붙였으나 최근 중동 전쟁으로 야당의 거센 역풍을 맞고 있다.`,
  players:`도널드 트럼프 대통령을 필두로 한 공화당, 상하원 탈환을 노리는 민주당, 그리고 선거의 향방을 가를 미국 유권자들.`,
  current:`선거를 두 달 앞두고 양당은 이란 전쟁 파병과 인플레이션 문제를 두고 날 선 정치 공방을 이어가고 있다.`,
  outlook:`11월 3일 선거 결과에 따라 트럼프 행정부의 국정 운영 동력이 크게 약화될지, 아니면 양원을 모두 방어할지 판가름 난다.`,
  sources:[{title:`2026 Midterm Elections approach as war fatigue grows - AP News`,url:`https://apnews.com`},{title:`GOP aims to hold Congress against Democratic surge - NYT`,url:`https://www.nytimes.com`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`정기국회 막 오른 여의도... 대정부질문과 인사청문회로 '전면전' 예고`,
  metrics:[`장관 후보자 6명`,`29일 만에 정책 번복`],
  summary:`9월 여의도 정기국회가 개막하면서 여야 간의 팽팽한 정치적 대결이 본격화되고 있다. 특히 9일부터 나흘간 진행되는 대정부질문에서는 외교, 경제, 사회 전반에 걸쳐 치열한 난타전이 벌어질 전망이다. 이어 14일부터는 추석 연휴 직전 6명의 장관 후보자에 대한 인사청문회 슈퍼위크가 열려 긴장감을 높이고 있다. 야당은 최근 29일 만에 번복된 종합부동산세 정책 혼선을 지적하며 국정 운영의 난맥상을 강하게 비판하고 나섰다. 또한 호르무즈 해협 파병 가능성 등 민감한 안보 이슈도 쟁점으로 부상했다. 여당은 정책의 유연성을 강조하며 야당의 공세를 국정 발목잡기로 규정하고 적극 방어에 나설 예정이다. 민생 법안 처리가 시급한 상황에서 정치 공방이 장기화될 우려가 제기된다.`,
  keyTerms:[{term:`인사청문회`,explanation:`대통령이 고위 공직자를 임명하기 전에 국회가 그 후보자의 자질, 도덕성, 업무 능력을 검증하는 절차.`}],
  history:`정부의 급작스러운 부동산 세제 개편 번복과 개각 단행이 맞물리면서 야당의 대정부 공세 명분이 강화되었다.`,
  players:`정책 방어에 나선 여당(더불어민주당)과 내각 낙마를 벼르는 야당(국민의힘), 그리고 검증대에 오르는 6명의 장관 후보자들.`,
  current:`대정부질문과 연이은 청문회 일정이 겹치면서 국회 내 정국 주도권을 잡기 위한 여야의 기싸움이 최고조에 달했다.`,
  outlook:`청문회 검증 결과에 따른 일부 후보자의 낙마 여부가 향후 정국 주도권과 다가올 추석 민심에 지대한 영향을 미칠 전망이다.`,
  sources:[{title:`정기국회 본격화... 여야 대정부질문 격돌 예고 - 연합뉴스`,url:`https://www.yna.co.kr`},{title:`추석 전 '인사청문회 슈퍼위크' 막 오른다 - 중앙일보`,url:`https://www.joongang.co.kr`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`AI 데이터센터 폭발적 증가 이면에 숨은 그림자... '물과 전력' 고갈 위기`,
  metrics:[`건설 비용 1000억 달러`,`하루 1만 톤 이상의 물 소비`],
  summary:`글로벌 빅테크 기업들이 AI 패권 경쟁을 벌이면서 데이터센터 건설 비용이 올해 약 1000억 달러까지 폭증했다. 그러나 이런 화려한 투자 이면에는 심각한 환경 문제가 도사리고 있다. 최첨단 AI 서버를 식히기 위해 미국 텍사스 등지의 데이터센터는 하루 1만 톤 이상의 물을 소비하고 있어 지역 지하수 고갈 우려를 낳았다. 유엔환경계획(UNEP)에 따르면 2026년 AI 데이터센터 전력 소비량이 한국 연간 전력량의 2배에 달할 것으로 추산된다. 결국 전력망의 물리적 한계와 극심한 탄소 배출이 AI 산업 성장의 최대 걸림돌로 작용하는 중이다. 각국 정부는 규제 마련에 착수했고 기업들은 대체 에너지 확보에 비상이 걸렸다. 혁신적인 저전력 기술이 뒷받침되지 않으면 AI 발전이 돌이킬 수 없는 환경 재앙으로 이어질 수 있다.`,
  keyTerms:[{term:`탄소 배출`,explanation:`석탄, 석유 같은 화석연료를 사용할 때 대기 중으로 방출되는 온실가스로, 지구 온난화의 주범이다.`}],
  history:`초거대 AI 모델의 학습과 추론을 위한 하드웨어 수요가 기하급수적으로 늘어나며 전 세계적인 데이터센터 확장이 가속화되었다.`,
  players:`AI 인프라를 확장하는 글로벌 빅테크 기업들과 지역 식수난을 겪는 주민들, 그리고 유엔 등 환경 기관들.`,
  current:`지역 사회의 반발과 전력망 포화로 인해 신규 데이터센터 허가를 거부하거나 엄청난 규모의 환경 부담금을 물리는 지자체가 급증하고 있다.`,
  outlook:`수랭식을 대체할 새로운 액침 냉각 기술 도입과 소형모듈원전(SMR) 등 무탄소 에너지원 확보 여부가 향후 AI 산업의 확장을 좌우할 것이다.`,
  sources:[{title:`The environmental cost of the AI boom - WSJ`,url:`https://www.wsj.com`},{title:`UN warns of AI data center energy crisis - Reuters`,url:`https://www.reuters.com`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`메타(Meta), 청소년 SNS 중독 방치 소송서 23조 원 합의... 역대급 철퇴`,
  metrics:[`합의금 170억 달러`,`청소년 보호 소홀 소송`],
  summary:`페이스북과 인스타그램의 모회사인 메타(Meta)가 청소년 보호 소홀로 제기된 대규모 집단 소송에서 최대 170억 달러(약 23조 5천억 원)를 지급하기로 합의했다. 이는 빅테크 기업을 상대로 한 징벌적 배상 중 역대 최대 규모로, 플랫폼이 미성년자에게 미치는 해악을 공식적으로 인정한 첫 사례다. 내부 고발자들의 폭로에 따르면, 메타는 자사의 알고리즘이 청소년 우울증과 섭식장애를 유발한다는 사실을 인지하고도 수익을 위해 고의로 방치했다. 이번 판결을 계기로 미성년자를 대상으로 한 철저한 알고리즘 규제와 SNS 가입 연령 제한 등 글로벌 차원의 강력한 법적 제재가 뒤따를 것으로 보인다. 거액의 합의금 지불과 시스템 전면 개편 요구로 인해 메타의 수익 모델은 근본적인 타격을 입게 되었다. IT 업계 전반에 기업의 사회적 책임을 묻는 거센 폭풍이 몰아치고 있다.`,
  keyTerms:[{term:`알고리즘 규제`,explanation:`사용자에게 맞춤형 콘텐츠를 추천하는 IT 기업의 컴퓨터 프로그램(알고리즘)이 사회적 해악을 끼치지 못하도록 법으로 통제하는 것.`}],
  history:`수년 전부터 인스타그램 등 소셜 미디어가 청소년 정신 건강에 악영향을 미친다는 내부 문건 폭로가 이어지며 미국 주정부들의 연합 소송이 제기되었다.`,
  players:`피소된 마크 저커버그와 메타 경영진, 소송을 주도한 미국 40여 개 주 검찰총장들, 피해 청소년 가족들.`,
  current:`메타는 막대한 합의금 지급뿐만 아니라 18세 미만 사용자를 위한 추천 시스템을 전면 수정하라는 법원의 명령을 수용해야 할 처지에 놓였다.`,
  outlook:`유럽연합(EU)과 한국 등 주요 국가들도 유사한 법적 규제를 벼르고 있어 숏폼 플랫폼 산업 전반에 막대한 규제 도미노 현상이 예상된다.`,
  sources:[{title:`Meta reaches \$17B settlement over teen harm - BBC`,url:`https://www.bbc.com`},{title:`메타, 23조원 역대급 합의금... 빅테크 규제 신호탄 - SBS`,url:`https://news.sbs.co.kr`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`"글로벌 AI 공급망 핵심 국가 도약"... 이재명 대통령, 샌프란시스코 선언`,
  metrics:[`한국 임금 프리미엄 6%`,`미국은 25%`],
  summary:`이재명 대통령이 미국 샌프란시스코를 방문해 글로벌 AI 공급망에서 대체 불가능한 핵심 국가로 도약하겠다는 내용의 거창한 AI 선언을 발표했다. 이 행사에는 국내 4대 그룹 총수와 오픈AI, 엔비디아 등 글로벌 빅테크 CEO들이 총출동해 한국 정부의 피지컬 AI 육성 비전에 긍정적인 화답을 보냈다. 그러나 화려한 선언 이면에는 극심한 국내 두뇌 유출이라는 차가운 현실적 난관이 자리하고 있다. 현재 국내 AI 인력의 임금 프리미엄은 6%에 불과해 미국의 25%에 비해 현저히 낮아, 뛰어난 우수 인재들이 끊임없이 해외로 빠져나가는 실정이다. 정부가 독자적인 기술 생태계를 구축하려 하지만 핵심 전문 인력의 이탈을 막지 못하면 이 모든 청사진은 공염불에 그칠 수 있다. 파격적인 보상 체계와 연구 환경 개선 등 실효성 있는 인재 탈환 대책이 무엇보다 시급한 시점이다.`,
  keyTerms:[{term:`피지컬 AI`,explanation:`로봇, 센서, 자율주행차처럼 현실 세계에서 물리적으로 움직이고 상호작용하는 기계 장치에 결합된 인공지능 기술.`}],
  history:`챗GPT 이후 소프트웨어 중심의 AI 경쟁에서 밀리자, 한국은 제조업 강점을 살려 하드웨어와 AI를 결합한 새로운 돌파구를 모색해왔다.`,
  players:`AI 국가 전략을 주도하는 한국 정부와 국내 대기업, 기술 협력을 맺는 글로벌 빅테크, 그리고 해외로 이탈하는 국내 연구자들.`,
  current:`대통령의 강력한 산업 육성 의지 표명에도 불구하고 현장에서는 엔지니어 구인난과 외국 거대 기업의 국내 시장 잠식이 동시에 벌어지고 있다.`,
  outlook:`국가 주도의 막대한 AI 관련 예산 투입이 실질적인 핵심 인재 처우 개선과 토종 기술 자립으로 이어질 수 있을지가 선언의 성공 열쇠다.`,
  sources:[{title:`대통령 샌프란시스코서 AI 강국 비전 선포 - 연합뉴스`,url:`https://www.yna.co.kr`},{title:`속빈 강정 우려되는 AI 선언, 인재 유출이 발목 - KBS`,url:`https://news.kbs.co.kr`}]
}]

  tag:`2026-09-05`,

  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`기재부, 9월 개인투자용 국채 10년물 연 4.765% 금리 확정`,
  metrics:[`10년물 연 4.765%`,`20년물 연 4.920%`],
  summary:`기획재정부가 9월 개인투자용 국채 발행 금리를 확정해 발표했습니다. 10년물은 연 4.765%, 20년물은 연 4.920%가 적용될 예정입니다. 이는 최근 시중 금리 변동성을 반영해 투자자들에게 매력적인 이율을 제공하기 위한 조치로 풀이됩니다. 개인투자용 국채는 만기까지 보유할 경우 연복리 혜택과 분리과세 혜택을 받을 수 있어 안정적인 장기 투자를 원하는 금융 소비자들의 큰 관심을 받고 있습니다. 향후 국채 청약 경쟁률이 높을 것으로 예상되며, 가계 자금이 국가 재정으로 원활하게 흘러갈지 주목됩니다. 장기 자산 증식 수단으로서 연복리의 마법을 활용하려는 수요가 몰릴 것입니다.`,
  keyTerms:[{term:`연복리`,explanation:`발생한 이자가 원금에 합산되어 다음 기간의 이자를 계산할 때 이자에도 이자가 붙는 계산 방식입니다. 장기 투자일수록 자산이 기하급수적으로 늘어나는 효과가 있습니다.`}],
  history:`개인투자용 국채는 소액 투자자들도 국가 신용도를 바탕으로 안전하게 투자할 수 있도록 올해부터 본격 도입되었습니다.`,
  players:`기획재정부(발행 주체)와 주요 판매 대행 증권사, 그리고 장기 투자를 원하는 개인 투자자들이 주요 참여자입니다.`,
  current:`최근 금리 인하 기대감과 인상 우려가 혼재된 상황에서 확정된 4% 후반대 금리는 매우 안정적인 투자처로 인식되고 있습니다.`,
  outlook:`9월 청약 일정에 맞춰 대규모 시중 자금이 유입될 것으로 보이며, 향후 기준금리 변동에 따른 금리 매력도 변화를 지켜봐야 합니다.`,
  sources:[{title:`9월 개인투자용 국채 금리 확정 - 매일경제`,url:`https://www.mk.co.kr/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 8월 비농업 고용 16만 2천 개 증가 서프라이즈... 연준 금리 인상 확률 65%로 급등`,
  metrics:[`신규 고용 16만 2천 개`,`금리 인상 확률 65%`],
  summary:`미국의 8월 비농업 고용 지표가 시장 예상치를 훌쩍 뛰어넘는 성적을 기록했습니다. 당초 5만 5천 개 증가를 예상했던 시장의 전망을 깨고 무려 16만 2천 개의 일자리가 늘어난 것으로 집계되었습니다. 이처럼 탄탄한 고용 시장 상황은 미국 경제가 침체 없이 순항하고 있다는 증거지만, 동시에 물가를 자극할 수 있다는 우려를 낳고 있습니다. 이 발표 직후 연방준비제도(Fed)가 다가오는 9월 FOMC 회의에서 긴축 정책을 유지하거나 추가 인상을 단행할 확률이 65%까지 치솟았습니다. 10년물 국채 금리 역시 4.80%를 돌파하며 글로벌 금융 시장에 긴장감을 불어넣고 있습니다.`,
  keyTerms:[{term:`긴축 정책`,explanation:`중앙은행이 시중에 풀린 돈을 거둬들이기 위해 기준금리를 올리거나 통화량을 줄이는 경제 정책입니다.`}],
  history:`코로나19 팬데믹 이후 불어닥친 인플레이션을 잡기 위해 연준은 오랜 기간 고금리 기조를 지속해 왔습니다.`,
  players:`통화 정책의 키를 쥔 제롬 파월 연준 의장과 월스트리트의 투자자들, 그리고 인력 확보에 나선 미국 기업들이 얽혀 있습니다.`,
  current:`금리 인하 기대감에 취해있던 주식 시장은 예상 밖의 고용 폭발로 인해 다시 인플레이션 재발을 걱정해야 하는 처지가 되었습니다.`,
  outlook:`오는 9월 열릴 FOMC 회의에서 연준이 실제로 금리를 올릴지, 아니면 동결 후 매파적 발언을 내놓을지가 최대 관건입니다.`,
  sources:[{title:`미국 8월 고용 서프라이즈 및 금리 인상 우려 재점화 - NewsQuawk`,url:`https://www.newsquawk.com/`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`폭스바겐, '퓨처 플랜 2030' 승인... 10만 명 감원 및 생산 모델 절반 축소 초강수`,
  metrics:[`감원 규모 10만 명`,`모델 라인업 50% 축소`],
  summary:`독일의 자동차 거인 폭스바겐이 생존을 위한 역대급 구조조정에 돌입합니다. 폭스바겐 이사회는 향후 모델 라인업을 절반으로 줄이고 전 세계에서 총 10만 명을 감원하는 내용의 '퓨처 플랜 2030'을 만장일치로 승인했습니다. 이는 중국의 저가 전기차 공세와 미국의 보호무역주의 관세 압박 등 글로벌 자동차 시장의 급격한 패러다임 변화에 대응하기 위한 뼈깎는 조치입니다. 폭스바겐은 내연기관 차량의 생산 비중을 대폭 줄이고, 원가 절감을 통해 확보한 자금을 차세대 전기차 및 자율주행 기술 개발에 올인한다는 계획입니다. 유럽 최대 기업의 이러한 대규모 감원은 향후 자동차 부품 공급망 전체에 막대한 파장을 미칠 전망입니다.`,
  keyTerms:[{term:`원가 절감`,explanation:`기업이 제품을 생산하는 데 드는 비용을 최소화하여 이윤을 극대화하고 가격 경쟁력을 확보하려는 경영 활동입니다.`}],
  history:`폭스바겐은 과거 디젤게이트 위기를 극복하고 전기차 전환을 선언했으나, 중국 BYD 등 신흥 전기차 강자들의 가격 경쟁력에 밀려 고전해 왔습니다.`,
  players:`강도 높은 구조조정을 주도하는 폭스바겐 경영진과 이에 맞서 일자리를 지키려는 강력한 독일 금속노조가 대립하고 있습니다.`,
  current:`글로벌 자동차 수요 둔화와 각국의 관세 장벽이 겹치면서 폭스바겐은 규모의 경제만으로는 더 이상 생존할 수 없다고 판단했습니다.`,
  outlook:`독일 내부에서의 거센 노조 파업과 정치적 반발이 예상되며, 다른 글로벌 완성차 업체들도 연쇄적인 구조조정에 나설 가능성이 큽니다.`,
  sources:[{title:`폭스바겐 이사회 대규모 감원 승인 - GoLocalProv`,url:`https://www.golocalprov.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`이재명 대통령, 프랑스 마크롱 대통령 초청으로 국빈 방문... 평화 체제 구축 강조`,
  metrics:[`국빈 방문 기간 9/6~9/9`,`뤼미에르 서밋 참석`],
  summary:`이재명 대통령이 에마뉘엘 마크롱 프랑스 대통령의 공식 초청을 받아 9월 6일부터 9일까지 프랑스를 국빈 방문합니다. 이 대통령은 파리에서 열리는 '뤼미에르 서밋'에 참석한 뒤 8일 한·불 정상회담과 국빈 만찬 일정을 소화할 예정입니다. 출국 전 미주지역회의 간담회에서 이 대통령은 한반도의 불안정한 정전 상태를 협력과 번영을 바탕으로 한 평화 체제로 전환해야 한다고 강하게 역설했습니다. 이번 순방을 통해 양국은 첨단 산업, 문화 교류는 물론 글로벌 안보 문제에 대한 공조를 더욱 굳건히 할 계획입니다. 유럽의 핵심 국가인 프랑스와의 연대를 통해 한국의 외교적 입지가 한층 넓어질 것으로 기대됩니다.`,
  keyTerms:[{term:`평화 체제`,explanation:`전쟁이나 적대 행위가 일시적으로 중단된 정전 상태를 넘어, 법적·제도적으로 전쟁 발발 가능성을 없애고 영구적인 평화를 정착시킨 상태를 뜻합니다.`}],
  history:`한국과 프랑스는 수교 이래 민주주의와 인권 등 보편적 가치를 공유하며 경제, 문화 등 다방면에서 포괄적 동반자 관계를 이어왔습니다.`,
  players:`양국 외교의 최전선에 나선 이재명 대통령과 에마뉘엘 마크롱 프랑스 대통령이 주요 행위자이며, 동행하는 대규모 경제 사절단도 역할을 맡습니다.`,
  current:`글로벌 패권 경쟁과 안보 불확실성이 커지는 가운데, 유럽 내 핵심 리더인 프랑스와의 전략적 협력이 한국에 절실해진 시점입니다.`,
  outlook:`8일 열릴 양국 정상회담에서 원전, 우주항공 등 첨단 기술 분야의 실질적 협력 방안과 한반도 평화를 위한 공동 선언문이 도출될지 주목됩니다.`,
  sources:[{title:`이재명 대통령 프랑스 국빈 방문 - Nnews`,url:`https://www.nnewss.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`90년생 용혜인, 최연소 성평등가족부 장관 지명... 국회 청문회 쟁점 부상`,
  metrics:[`재산 신고액 4억 7천만 원`,`최연소 헌정사 기록 기대`],
  summary:`1990년생인 기본소득당 용혜인 의원이 신임 성평등가족부 장관 후보자로 지명되며 정치권이 들썩이고 있습니다. 인사청문회를 무사히 통과할 경우, 헌정 사상 가장 젊은 국무위원이 탄생하게 됩니다. 용 후보자는 9월 4일 약 4억 7천만 원의 재산을 신고하며 본격적인 청문회 준비에 돌입했습니다. 여권은 그를 시대의 변화를 읽는 맞춤형 인재라며 적극 옹호하고 있으나, 야권과 일부 단체에서는 비례대표 의원직 유지 문제와 전문성 부족을 이유로 지명 철회를 요구하고 있습니다. 이번 지명은 세대교체라는 상징성을 지니지만, 장관으로서 부처를 통솔할 리더십이 도마 위에 오르며 청문회 과정에서 격렬한 공방이 예상됩니다.`,
  keyTerms:[{term:`리더십`,explanation:`조직의 목표를 달성하기 위해 구성원들의 동기를 유발하고 행동을 이끄는 지도력과 통솔력을 의미합니다.`}],
  history:`성평등가족부는 그동안 부처 폐지론과 확대 개편론 사이에서 극심한 젠더 갈등과 정치적 논쟁의 한복판에 서 있었습니다.`,
  players:`파격적 인사의 당사자인 용혜인 후보자와 그를 방어하는 여당 진영, 그리고 철저한 검증을 벼르는 야당 청문위원들이 핵심 인물들입니다.`,
  current:`기존 정치 문법을 깨는 30대 장관 지명이라는 상징성과 함께, 과연 그가 복잡한 젠더 이슈와 저출산 문제를 풀 수 있을지 의구심이 엇갈리고 있습니다.`,
  outlook:`다가오는 국회 인사청문회에서 도덕성 검증은 물론 성평등 정책 비전을 둘러싼 여야의 치열한 정치적 공방이 생중계될 예정입니다.`,
  sources:[{title:`용혜인 성평등가족부 장관 지명 - 연합뉴스TV`,url:`https://www.yonhapnewstv.co.kr/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국-이란 군사 갈등 최고조... 이란 남부 오폭 참사 후 미군 기지 보복 타격`,
  metrics:[`민간인 5명 사망`,`미국 방공망 판매 50억 달러`],
  summary:`중동 지역의 군사적 뇌관이 다시 폭발하며 전면전 우려가 커지고 있습니다. 미국과 이스라엘의 합동 작전 중 이란 남부의 한 결혼식장에 미사일이 잘못 떨어져 민간인 5명이 목숨을 잃는 비극적인 오폭 사건이 발생했습니다. 분노한 이란은 즉각 요르단과 바레인에 위치한 주요 미군 기지들을 향해 대규모 미사일 보복 타격을 감행했습니다. 갈등이 걷잡을 수 없이 확산되자 미국은 사우디아라비아에 약 50억 달러 규모의 폭탄 및 유도 장비 판매를 긴급 승인하며 동맹국의 방어 체계 구축에 나섰습니다. 양측의 연쇄적인 무력 과시가 이어지면서 중동 평화는 당분간 기대하기 어렵게 되었습니다.`,
  keyTerms:[{term:`방어 체계`,explanation:`적의 미사일이나 항공기 공격으로부터 자국의 영토와 군사 시설을 보호하기 위해 구축한 레이더 및 요격 미사일 시스템입니다.`}],
  history:`이란 핵 합의 파기 이후, 미국과 이란은 중동의 주도권을 놓고 대리전과 경제 제재를 주고받으며 오랫동안 적대 관계를 유지해 왔습니다.`,
  players:`강경 대응을 불사하는 이란 혁명수비대와 동맹국 보호를 명분으로 내세운 미군, 그리고 중동 내 친미 연합 국가들이 대치 중입니다.`,
  current:`이번 민간인 오폭 참사가 이란 내부의 강경 여론에 불을 지피면서, 이란 정부로서도 물러설 수 없는 보복의 명분을 갖게 되었습니다.`,
  outlook:`호르무즈 해협 봉쇄 등 이란의 추가적인 비대칭 위협이 현실화될 수 있으며, 유엔 등 국제사회의 중재 시도가 긴급하게 이루어질 전망입니다.`,
  sources:[{title:`미국 이란 전쟁 격화 - CBS News`,url:`https://www.cbsnews.com/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`정부, 공공기관 20% 대규모 감축 및 세종·지방 이전 로드맵 발표... 노조 총파업 예고`,
  metrics:[`공공기관 수 20% 감축`,`금융노조 등 총파업 예고`],
  summary:`정부가 역대급 규모의 공공 부문 구조조정의 칼을 빼들었습니다. 국가 운영의 효율성을 높이기 위해 전체 공공기관의 20%를 통폐합하고, 수도권에 남은 기관들을 세종시와 각 지방 혁신도시로 이전하는 확정 로드맵을 전격 발표했습니다. 이번 이전 대상에는 법무부, 대검찰청, 경찰청은 물론 금융감독원 같은 굵직한 기관들이 대거 포함된 것으로 알려졌습니다. 이에 전국금융산업노동조합 등 주요 공공부문 노조 연합은 거세게 반발하며 대규모 총파업을 예고했습니다. 지방 균형 발전이라는 명분에도 불구하고, 근로자들의 거주 이전 문제와 급격한 조직 통폐합이 심각한 사회적 갈등을 낳고 있습니다.`,
  keyTerms:[{term:`지방 균형 발전`,explanation:`수도권에 집중된 인구와 경제력, 행정 권력을 지방으로 분산시켜 국토 전체가 고르게 성장하도록 만드는 국가 정책 목표입니다.`}],
  history:`역대 정부마다 수도권 과밀 해소를 위해 공공기관 이전을 추진해 왔으나, 핵심 권력 기관들은 번번이 대상에서 제외되어 반쪽짜리라는 비판을 받아왔습니다.`,
  players:`강력한 구조조정을 밀어붙이는 정부 부처와 생존권 사수를 외치는 공공기관 노동조합들이 정면으로 충돌하고 있습니다.`,
  current:`저성장 고착화와 세수 부족 속에서 공공기관의 방만한 운영을 타개해야 한다는 여론이 커지며 정부가 강경 드라이브를 걸게 되었습니다.`,
  outlook:`다가오는 총파업 일정에 맞춰 금융 및 공공 서비스의 일시적 마비가 우려되며, 정부와 노조 간의 타협점을 찾기 위한 지난한 교섭이 예상됩니다.`,
  sources:[{title:`공공기관 20% 통폐합 추진 - YouTube News`,url:`https://www.youtube.com/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`애플, 팀 쿡 CEO 15년 만에 전격 퇴진... '존 터너스' 신임 CEO 체제 출범`,
  metrics:[`재임 기간 15년`,`차세대 폼팩터 기대감`],
  summary:`스티브 잡스 이후 15년간 글로벌 IT 혁신을 이끌며 애플의 최전성기를 지휘했던 팀 쿡 최고경영자(CEO)가 전격 퇴진했습니다. 그 뒤를 이어 하드웨어 엔지니어링을 총괄해 온 존 터너스가 애플의 새로운 수장으로 공식 취임했습니다. 이번 리더십 교체는 애플이 기존의 스마트폰 시장을 넘어 새로운 성장 동력을 모색해야 하는 중대한 변곡점에서 단행되었습니다. IT 업계는 신임 터너스 CEO 체제의 첫 야심작으로 오랫동안 소문만 무성했던 폴더블폰의 공식 발표가 임박한 것으로 내다보고 있습니다. 세계 시가총액 최상위 기업인 애플의 사령탑 교체가 향후 글로벌 테크 시장의 지형도를 어떻게 흔들어 놓을지 전 세계의 이목이 집중되고 있습니다.`,
  keyTerms:[{term:`폴더블폰`,explanation:`화면을 반으로 접거나 펼칠 수 있는 플렉서블 디스플레이 기술이 적용된 스마트폰으로, 화면 크기와 휴대성을 동시에 만족시키는 차세대 기기입니다.`}],
  history:`팀 쿡은 스티브 잡스 타계 이후 애플워치, 에어팟, 서비스 부문을 성공적으로 키워내며 애플을 세계 최고의 수익성 기업으로 탈바꿈시켰습니다.`,
  players:`안정적 관리를 넘어 새로운 하드웨어 혁신을 이끌 존 터너스 신임 CEO와 변화를 요구하는 글로벌 주주 및 소비자들이 얽혀 있습니다.`,
  current:`최근 화웨이, 삼성 등 경쟁사들이 폼팩터 혁신과 AI 기술을 선점하면서, 애플 특유의 혁신 부족에 대한 시장의 피로감이 누적된 상태였습니다.`,
  outlook:`다가오는 신제품 발표 행사에서 존 터너스 CEO가 선보일 애플표 기기와 자체 AI 생태계의 구체적인 청사진이 주가의 향방을 결정할 것입니다.`,
  sources:[{title:`애플 팀 쿡 퇴진 및 신임 CEO 취임 - IT World`,url:`https://www.youtube.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`"마우스 쥐고 컴퓨터 직접 쓴다" AI 에이전트 시대 개막... 빅테크 인프라 싹쓸이 경쟁`,
  metrics:[`맥 미니 수만 대 매입`,`클라우드 계약 350억 달러`],
  summary:`사람이 키보드와 마우스를 다루듯 컴퓨터 바탕화면을 직접 조작하는 '자율형 AI 에이전트' 시대가 본격적으로 열렸습니다. 오픈AI는 이러한 진화된 AI를 훈련시키기 위해 전 세계 시장에서 맥 미니 컴퓨터 수만 대를 싹쓸이 매입하며 물리적 훈련 인프라 구축에 나섰습니다. 경쟁사인 앤트로픽 역시 무려 350억 달러 규모의 초대형 클라우드 계약을 체결하며 연산 자원 확보 전쟁에 기름을 부었습니다. 기존의 챗봇 형태를 넘어 스스로 소프트웨어를 실행하고 업무를 처리하는 AI 에이전트의 등장은 화이트칼라 노동 시장에 엄청난 충격을 예고하고 있습니다. 진정한 의미의 범용 인공지능(AGI)으로 향하는 기술적 특이점이 눈앞으로 다가왔다는 평가입니다.`,
  keyTerms:[{term:`연산 자원`,explanation:`거대한 인공지능 모델을 학습시키고 실행하기 위해 필수적으로 요구되는 그래픽 처리 장치(GPU)와 대규모 클라우드 서버 등의 컴퓨팅 능력을 말합니다.`}],
  history:`텍스트를 주고받는 대화형 AI의 한계를 극복하기 위해, 글로벌 빅테크들은 화면을 인식하고 마우스 포인터를 움직여 스스로 작업을 수행하는 에이전트 연구에 매진해 왔습니다.`,
  players:`자금력을 앞세워 인프라를 독식하려는 오픈AI, 앤트로픽, 구글 등 실리콘밸리의 AI 거인들과 폭증하는 전력 수요를 감당해야 하는 서버 업체들입니다.`,
  current:`이론적 연구 단계에 머물던 자율형 AI가 실제 상용화를 앞두고 막대한 하드웨어 인프라 투자를 촉발시키며 반도체 시장까지 달구고 있습니다.`,
  outlook:`빠르면 올해 하반기부터 사용자 대신 이메일을 정리하고 복잡한 엑셀 작업을 스스로 수행하는 AI 비서 서비스가 앞다투어 출시될 전망입니다.`,
  sources:[{title:`컴퓨터 쓰는 AI 에이전트 개발 경쟁 - Tech Crunch`,url:`https://www.youtube.com/`}]
}]

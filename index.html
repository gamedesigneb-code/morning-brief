  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`중국산 오픈소스 AI 돌풍 속 스스로 판단하는 자율형 비서 시대 본격화`,
  metrics:[`중국 AI 시장 220조원 돌파`,`실리콘밸리 기술 의존도 증가`],
  summary:`2026년 인공지능 산업은 중국발 오픈소스 기술의 급부상과 자율형 AI의 일상화라는 두 가지 큰 흐름을 맞이하고 있습니다. 특히 딥시크 등 중국 기업들이 내놓은 고성능 오픈소스 모델들이 시장을 장악하면서 미국 실리콘밸리마저 이 기술에 의존하는 현상이 나타나고 있습니다. 이를 바탕으로 중국 AI 시장 규모는 단숨에 1조 2천억 위안을 돌파하며 글로벌 기술 패권을 뒤흔들고 있습니다. 이러한 기술 발전을 토대로 사용자의 개입 없이 AI가 스스로 판단하고 행동하는 에이전틱 AI(Agentic AI)가 산업의 핵심으로 떠올랐습니다. 그중에서도 소비자의 예산과 취향을 분석해 구매부터 배송까지 알아서 해결하는 자율형 쇼핑 비서 서비스가 큰 인기를 끌고 있습니다. 이제 AI는 단순한 대화형 도구를 넘어 일상생활의 물리적 결정을 대신 내려주는 삶의 필수 운영체제로 진화했습니다. 현재 전 세계 기술 기업들은 에이전트 기반의 플랫폼 주도권을 차지하기 위해 사활을 건 인프라 투자 경쟁을 벌이고 있습니다.`,
  keyTerms:[{term:`에이전틱 AI(Agentic AI)`,explanation:`인간의 지속적인 지시 없이도 설정된 목표를 달성하기 위해 스스로 환경을 인지하고 판단하여 실행에 옮기는 차세대 자율형 인공지능입니다.`}],
  history:`거대 언어 모델의 발전이 물리적 환경과 결합되면서 단순 챗봇 이상의 실질적 행동 능력을 갖춘 인공지능이 등장했습니다.`,
  players:`중국의 신흥 AI 스타트업들과 미국 실리콘밸리 빅테크 기업들이 치열하게 주도권 다툼을 하고 있습니다.`,
  current:`오픈소스 생태계를 무기로 한 중국의 약진 속에서 기업형 및 소비자용 자율형 에이전트 시장이 폭발적으로 팽창 중입니다.`,
  outlook:`플랫폼 생태계의 패러다임이 앱(App)에서 에이전트(Agent)로 빠르게 재편될 것으로 예측됩니다.`,
  sources:[{title:`중국 오픈소스 AI의 역습, 실리콘밸리 흔든다 - MIT 테크놀로지 리뷰`,url:`https://www.technologyreview.kr`},{title:`알아서 사고파는 에이전틱 쇼핑의 시대 - 테크전문지`,url:`https://www.the-tech.co.kr`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`2026년부터 수도권 생활폐기물 직매립 전면 금지 및 플라스틱 규제 강화`,
  metrics:[`생활폐기물 직매립 0% 전환`,`페트병 재생원료 30% 의무화`],
  summary:`올해부터 대한민국 환경 정책 역사상 가장 강력한 조치 중 하나인 수도권 생활폐기물 직매립 금지 제도가 전면 시행되었습니다. 이 규제에 따라 수도권에서는 가연성 쓰레기를 그냥 땅에 묻는 행위가 불법이 되었으며, 무조건 소각하거나 재활용 처리 과정을 거쳐야만 합니다. 생활폐기물 직매립 금지는 그동안 포화 상태에 이르렀던 수도권 쓰레기 매립지 문제를 해결하기 위한 국가적 결단입니다. 이와 동시에 페트병 제조 시 재생원료를 30% 이상 반드시 사용하도록 강제하는 등 플라스틱에 대한 규제 수위도 한층 높아졌습니다. 각 지방자치단체는 넘쳐나는 쓰레기를 처리하기 위해 소각장 건립 등 친환경 인프라 확충에 비상이 걸린 상태입니다. 기업들 또한 ESG 경영의 일환으로 친환경 소재 개발과 탈탄소 체계 전환을 위한 대규모 자금 조달에 집중하고 있습니다. 현재 정부와 지자체는 새로운 폐기물 처리 시스템이 일상에 안정적으로 정착할 수 있도록 현장 계도와 인프라 구축을 병행하고 있습니다.`,
  keyTerms:[{term:`생활폐기물 직매립 금지`,explanation:`종량제 봉투에 담긴 일상 쓰레기를 소각 등의 처리 과정 없이 바로 매립장에 묻는 것을 법적으로 원천 차단하는 환경 정책입니다.`}],
  history:`수도권 쓰레기 매립지의 수명 연장이 한계에 달하면서 폐기물 처리 방식을 근본적으로 바꿔야 한다는 위기의식이 고조되었습니다.`,
  players:`쓰레기를 발생시키는 시민들과 이를 처리해야 할 지자체, 그리고 친환경 포장재를 도입해야 하는 기업들이 주요 주체입니다.`,
  current:`매립 중심에서 소각과 재활용 중심으로 국가 폐기물 관리의 거대한 패러다임 전환이 이루어지는 과도기입니다.`,
  outlook:`새로운 소각장 입지 선정에 따른 지역 주민과의 갈등 해결 및 재활용 산업의 획기적인 발전이 뒤따라야 할 것입니다.`,
  sources:[{title:`수도권 직매립 금지 본격 시행, 대안 마련 시급 - 뉴스펭귄`,url:`https://www.newspenguin.com`},{title:`재생원료 의무화 등 플라스틱 규제 강화 - 시사투데이`,url:`https://www.sisadays.co.kr`}]

  colorBg:`#e6f4f1`,
  headline:`2026 슈퍼 엘니뇨 경고, 전 세계 바다 온도 역대 최고치 기록하며 폭염 확산`,
  metrics:[`바다 표면 온도 20.97도`,`지구 기온 1.5도 상승 위협`],
  summary:`전 세계가 살인적인 폭염과 대형 산불로 신음하는 가운데, 기상학계가 역대급 기상이변을 몰고 올 슈퍼 엘니뇨의 발생을 강하게 경고하고 나섰습니다. 올해 상반기 전 세계 바다 표면 온도가 20.97도까지 치솟으며 기상 관측 사상 두 번째로 높은 수치를 기록했습니다. 뜨거워진 바다는 대기를 가열시켰고 그 결과 북미와 유럽은 물론 한반도까지 최고 40도를 오르내리는 극단적인 폭염에 갇히게 되었습니다. 전문가들은 이번 슈퍼 엘니뇨 현상으로 인해 지구 평균 기온 상승폭이 기후 재앙의 마지노선인 1.5도를 훌쩍 넘어설 것이라고 경고합니다. 이제 기상이변은 단순한 자연 현상을 넘어 국가 경제와 국민의 생명을 위협하는 가장 중대한 사회적 재난으로 취급받고 있습니다. 각국 정부는 다가올 폭염과 홍수 피해를 최소화하기 위해 재난 대응 매뉴얼을 전면 개편하고 있습니다. 현재 국제사회는 탄소 배출을 줄이기 위한 즉각적인 기후 행동과 함께 기상 이변에 대응할 범국가적 협력 기구 마련에 속도를 내고 있습니다.`,
  keyTerms:[{term:`슈퍼 엘니뇨`,explanation:`적도 부근 동태평양 해수면 온도가 평년보다 2도 이상 높은 상태가 수개월 지속되는 현상으로, 전 지구적인 가뭄과 폭우 등 극단적 기상이변을 유발합니다.`}],
  history:`지속적인 온실가스 배출로 지구 온난화가 가속화되면서 바다의 열 흡수 능력이 한계에 다다른 상황이 누적되었습니다.`,
  players:`기후 위기 경고를 발표하는 국제 기상 기구들과 폭염 피해를 겪고 있는 각국 시민 및 정부 부처입니다.`,
  current:`역대급 해수면 온도 상승이 육지의 폭염과 산불로 직결되며 전 세계가 비상 대응 체제에 돌입했습니다.`,
  outlook:`가을 이후 엘니뇨가 미칠 농작물 작황 피해와 기후 변동성에 대비한 전 지구적 협력이 최우선 과제가 될 것입니다.`,
  sources:[{title:`역대 두 번째로 뜨거운 바다... 슈퍼 엘니뇨 경고 - 다음뉴스`,url:`https://news.daum.net`},{title:`폭염은 이제 사회적 재난, 대비책 전면 수정 필요 - MBC 뉴스`,url:`https://imnews.imbc.com`}]
}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미 연준, 8월 긴급 FOMC에서 기준금리 0.25%p 전격 인하 결정`,
  metrics:[`기준금리 4.75%로 인하`,`나스닥 2.4% 급등`],
  summary:`미국 연방준비제도(Fed)가 8월 긴급 연방공개시장위원회(FOMC)를 열고 기준금리를 0.25%포인트 인하했습니다. 이는 최근 불거진 미국 경기 침체 우려와 고용 지표 둔화에 선제적으로 대응하기 위한 조치로 풀이됩니다. 제롬 파월 의장은 인플레이션 완화 추세가 지속되고 있으며, 고용 시장의 하방 리스크를 방어하는 것이 현재의 최우선 과제라고 강조했습니다. 시장은 이번 결정을 환영하며 나스닥을 비롯한 주요 뉴욕 증시가 큰 폭의 상승세를 기록했습니다. 전문가들은 연내 추가적인 금리 인하 가능성이 열려 있다고 전망하고 있습니다. 한편, 달러화 약세가 가시화되면서 글로벌 자본 흐름에 변화가 감지되고 있습니다. 이번 빅컷은 신흥국 금융 시장에도 긍정적인 파급 효과를 미칠 것으로 기대됩니다.`,
  keyTerms:[{term:`빅컷`,explanation:`중앙은행이 기준금리를 큰 폭으로 내리거나 전격적으로 인하 조치를 단행해 시장에 강한 충격을 주는 것을 관용적으로 부르는 말입니다.`}],
  history:`최근 2년간 지속된 미국의 고금리 정책은 인플레이션 억제에는 성공했으나, 부작용으로 실물 경제와 고용 지표가 흔들리기 시작했습니다. 지난달 고용 보고서 쇼크가 방아쇠 역할을 했습니다.`,
  players:`제롬 파월 의장 등 연준 위원들은 경기 침체를 막기 위해 통화 정책의 방향을 틀었습니다. 글로벌 투자은행과 신흥국 중앙은행들도 미국의 금리 향방을 예의주시하고 있습니다.`,
  current:`고용 지표 악화로 침체 공포가 커지자 연준이 정례 회의가 아닌 긴급 회의를 통해 선제적으로 금리를 내린 매우 이례적인 시점입니다.`,
  outlook:`시장은 9월과 11월에 추가 금리 인하가 단행될지 주목하고 있습니다. 미국의 통화 완화 기조가 확정됨에 따라 글로벌 증시의 변동성은 다소 진정될 것으로 보입니다.`,
  sources:[{title:`연준 8월 긴급 금리인하 전격 단행 - WSJ`,url:`https://www.wsj.com/`},{title:`빅컷 효과에 나스닥 급등 - Bloomberg`,url:`https://www.bloomberg.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국은행, 가계부채 급증 우려에 기준금리 연 3.50% 동결`,
  metrics:[`가계부채 1,900조 돌파`,`부동산 주담대 6조 증가`],
  summary:`한국은행 금융통화위원회가 기준금리를 연 3.50%로 다시 한 번 동결했습니다. 미국 연준의 금리 인하 기조에도 불구하고, 국내 수도권을 중심으로 한 집값 상승과 그로 인한 가계부채 급증이 발목을 잡았습니다. 이창용 한은 총재는 물가 상승률이 목표치에 근접하고 있지만, 섣부른 금리 인하가 부동산 시장을 자극할 위험이 크다고 경고했습니다. 특히 지난달 은행권 주택담보대출이 6조 원 이상 폭증하면서 금융 안정이 최우선 과제로 떠올랐습니다. 전문가들은 정부의 거시건전성 정책 효과를 지켜본 뒤 4분기에나 금리 인하 논의가 본격화될 것으로 예상하고 있습니다. 당분간 내수 부진과 고금리 장기화에 따른 서민 경제의 부담은 지속될 전망입니다. 따라서 현재의 통화 긴축 기조 유지는 불가피한 선택으로 평가받습니다.`,
  keyTerms:[{term:`거시건전성 정책`,explanation:`금융 시스템 전체의 안정을 위해 금융 기관의 외형이나 부채 규모 등을 거시적인 관점에서 규제하고 관리하는 정책을 말합니다.`}],
  history:`과거 저금리 시기 동안 한국의 가계부채는 세계 최고 수준으로 불어났으며, 최근 수도권 부동산 가격이 다시 들썩이면서 대출 수요가 폭발적으로 증가했습니다.`,
  players:`한국은행과 금융당국은 물가 안정과 가계부채 억제라는 두 마리 토끼를 잡기 위해 고심하고 있으며, 시중은행들은 대출 문턱을 다시 높이고 있습니다.`,
  current:`미국이 금리를 내리기 시작한 상황에서도 한국은행이 곧바로 따라 내리지 못하는 딜레마적 경제 상황을 잘 보여주는 결정입니다.`,
  outlook:`정부의 대출 규제 강화 조치가 시장에서 얼마나 효과를 발휘하는지에 따라 연말 한은의 기준금리 인하 시점이 최종 결정될 것입니다.`,
  sources:[{title:`한은 기준금리 3.5% 동결, 가계부채가 발목 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`내수 침체에도 집값 불안에 금리 인하 미룬 한은 - 매일경제`,url:`https://www.mk.co.kr/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`엔비디아, 2분기 어닝 서프라이즈 달성... AI 반도체 수요 견조`,
  metrics:[`2분기 매출 320억 달러`,`데이터센터 150% 성장`],
  summary:`글로벌 AI 반도체 선두주자인 엔비디아가 시장 전망치를 크게 웃도는 2분기 깜짝 실적(어닝 서프라이즈)을 발표했습니다. 분기 매출은 전년 동기 대비 급증한 320억 달러를 기록했으며, 특히 핵심 사업인 데이터센터 부문 매출이 폭발적으로 성장했습니다. 젠슨 황 최고경영자(CEO)는 차세대 AI 칩인 블랙웰 아키텍처에 대한 수요가 폭주하고 있으며, 공급 부족 현상이 내년까지 이어질 것이라고 밝혔습니다. 이 같은 호실적 발표 직후 엔비디아 주가는 시간외 거래에서 8% 이상 급등하며 시가총액 1위 자리를 굳건히 다졌습니다. 글로벌 빅테크 기업들의 AI 인프라 투자가 여전히 활발히 진행 중임이 입증된 셈입니다. 시장 일각의 AI 거품론을 불식시키는 강력한 모멘텀이 될 것으로 보입니다. 이번 실적 발표는 글로벌 주식 시장 전반에 긍정적인 활력을 불어넣고 있습니다.`,
  keyTerms:[{term:`어닝 서프라이즈`,explanation:`기업이 발표한 실제 실적이 시장 전문가들이 예상했던 실적 전망치를 긍정적인 방향으로 크게 뛰어넘는 현상을 의미합니다.`}],
  history:`생성형 AI 시대가 개막하면서 AI 훈련과 추론에 필수적인 고성능 GPU 시장을 엔비디아가 독점하다시피 해왔으며, 그 성장이 계속될지에 대한 의구심도 일부 존재했습니다.`,
  players:`엔비디아와 이를 추격하는 AMD, 인텔 등 반도체 기업들, 그리고 막대한 자금을 투자해 AI 인프라를 구축 중인 구글, 메타, 마이크로소프트 등의 빅테크가 얽혀 있습니다.`,
  current:`최근 제기된 AI 투자 과잉 및 거품 논란 속에서, 엔비디아가 실제 숫자로 강력한 수요와 시장 지배력을 재증명한 중요한 시점입니다.`,
  outlook:`하반기 출시될 신형 블랙웰 칩의 실제 인도량과 빅테크들의 자본 지출 가이던스가 향후 AI 산업 주가의 핵심 동력으로 작용할 전망입니다.`,
  sources:[{title:`엔비디아 2분기 실적, 월가 예상 훌쩍 넘어 - FT`,url:`https://www.ft.com/`},{title:`AI 붐 굳건, 엔비디아 시간외 급등 - 한국경제`,url:`https://www.hankyung.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 대선 D-90, 민주·공화 양당 경합주 유세 총력전 돌입`,
  metrics:[`선거일 90일 전`,`자금 모금 1억 달러 돌파`],
  summary:`2026년 미국 대통령 선거가 90일 앞으로 다가온 가운데, 양당 후보들이 핵심 경합주인 펜실베이니아와 미시간에서 총력 유세전을 펼치고 있습니다. 최근 발표된 여론조사에서 두 후보 간의 지지율 격차가 1%포인트 내외의 초박빙 양상을 보이며 긴장감이 최고조에 달하고 있습니다. 민주당은 낙태권 보호와 중산층 경제 지원을 주요 공약으로 내세우며 지지층 결집에 나섰습니다. 반면 공화당은 국경 통제 강화와 인플레이션 심판론을 앞세워 보수 유권자들의 표심을 공략하고 있습니다. 이번 선거의 승패는 무당층 유권자와 스윙 보터들의 최종 선택에 달려 있다는 분석이 지배적입니다. 특히 우편투표 방식과 선거인단 제도의 특성이 결과에 큰 변수로 작용할 전망입니다. 선거 자금 모금에서도 양측은 매달 기록적인 금액을 갱신하며 치열한 공방을 이어가고 있습니다.`,
  keyTerms:[{term:`스윙 보터`,explanation:`특정 정당에 얽매이지 않고 그때그때의 정치적 상황이나 주요 이슈에 따라 지지 후보를 바꾸는 부동층 유권자를 말합니다.`}],
  history:`최근 수년간 미국 정치는 극심한 양극화 현상을 겪어왔으며, 지난 두 차례의 대선 역시 소수의 경합주에서 매우 근소한 표차로 승패가 갈렸습니다.`,
  players:`백악관 입성을 노리는 민주당과 공화당의 대통령 후보 캠프, 그리고 선거의 향방을 결정할 중서부 러스트벨트와 남부 선벨트 지역의 유권자들입니다.`,
  current:`선거일이 3개월 앞으로 다가오면서 후보들의 말 한마디와 TV 토론 결과가 표심에 즉각적인 영향을 미치는 초긴장 국면입니다.`,
  outlook:`다음 달 예정된 두 번째 대선 후보 TV 토론과 10월부터 본격화되는 사전 투표율 추이가 최종 선거 결과를 가늠할 핵심 지표가 될 것입니다.`,
  sources:[{title:`US Election: Swing states in dead heat - Reuters`,url:`https://www.reuters.com/`},{title:`미 대선 90일 앞두고 경합주 총력전 - 중앙일보`,url:`https://www.joongang.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`여야, 8월 임시국회서 민생 법안 극적 합의... 연금 개혁안은 보류`,
  metrics:[`민생 법안 20건 통과`,`합의율 85% 달성`],
  summary:`국회 여야가 8월 임시국회 본회의를 열고 전세사기 특별법 개정안을 포함한 20여 건의 시급한 민생 법안을 극적으로 합의 처리했습니다. 여야 지도부는 최근 악화된 경제 상황과 민심을 고려해 정쟁을 잠시 미루고 초당적인 협력을 다짐했습니다. 통과된 법안들에는 소상공인 지원 확대와 저출산 대응을 위한 예산 지원 근거가 포함되어 있어 실질적인 혜택이 기대됩니다. 그러나 정치권의 뜨거운 감자인 국민연금 개혁안에 대해서는 소득대체율 조정폭을 두고 이견을 좁히지 못해 결국 처리가 보류되었습니다. 시민단체들은 반쪽짜리 합의라며 연금 개혁의 조속한 재논의를 강력히 촉구하고 나섰습니다. 다음 달 열릴 정기국회에서 연금 개혁과 세제 개편안을 둘러싼 여야의 기싸움은 다시 격화될 것으로 보입니다. 이번 합의 통과는 모처럼 만에 협치 정치를 보여준 사례로 평가받습니다.`,
  keyTerms:[{term:`초당적인 협력`,explanation:`정치인이나 소속 정당이 당파적 이익을 뛰어넘어, 국가와 국민 전체의 중대한 이익을 위해 서로 타협하고 힘을 합치는 것을 뜻합니다.`}],
  history:`제22대 국회 개원 이후 여야는 극심한 이념 대립으로 인해 주요 민생 법안 처리가 지연되며 국민적 피로감이 쌓인 상태였습니다.`,
  players:`거대 야당의 입법 주도권과 정부 여당의 거부권이 맞서는 가운데, 중재를 시도하는 양당 원내 지도부와 법안 통과를 염원하는 이해당사자들이 얽혀 있습니다.`,
  current:`추석 명절을 앞두고 밥상머리 민심을 의식한 여야가 정치적 부담을 덜기 위해 시급한 법안들을 서둘러 묶음 처리한 국면입니다.`,
  outlook:`9월부터 시작되는 정기국회와 국정감사에서는 이번에 미뤄진 연금 개혁과 내년도 예산안을 두고 여야 간 물러설 수 없는 치열한 격돌이 예상됩니다.`,
  sources:[{title:`8월 국회, 민생법안 20건 문턱 넘어... 협치 불씨 - 한겨레`,url:`https://www.hani.co.kr/`},{title:`연금 개혁 또 불발, 여야 입장차 여전 - KBS`,url:`https://news.kbs.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`이스라엘-하마스, 이집트 중재로 6개월 만에 일시 휴전 협정 타결`,
  metrics:[`인질 50명 석방`,`휴전 기간 45일 합의`],
  summary:`이스라엘과 팔레스타인 무장정파 하마스가 이집트 카이로에서 열린 다자간 협상을 통해 6개월 만에 일시 휴전 협정을 전격 타결했습니다. 양측은 향후 45일간 모든 적대 행위를 중단하고, 억류 중인 인질 50명과 팔레스타인 수감자들을 맞교환하기로 합의했습니다. 이번 협상은 미국과 카타르, 이집트의 강력한 외교적 압박과 중재가 결정적인 역할을 한 것으로 알려졌습니다. 가자지구에 대한 대규모 인도적 지원 물자 반입도 즉각 재개될 예정이어서 민간인들의 고통이 다소 완화될 전망입니다. 하지만 이스라엘 내 강경파의 반발과 하마스 일부 분파의 저항 등 휴전 유지를 위협하는 불씨는 여전히 남아있습니다. 국제사회는 이번 일시 휴전이 항구적인 평화 체제 구축으로 이어질 수 있도록 후속 협상을 지속 지원할 방침입니다. 중동 지역의 지정학적 리스크가 일시적으로나마 크게 완화되었습니다.`,
  keyTerms:[{term:`지정학적 리스크`,explanation:`국가 간의 지리적 위치나 영토 분쟁, 역사적 갈등 등으로 인해 발생하는 정치적 및 군사적 긴장이 경제나 세계 정세에 미치는 위험을 의미합니다.`}],
  history:`지난 수십 년간 이어져 온 이스라엘과 팔레스타인의 분쟁은 최근 전면전 양상으로 치달으며 가자지구 내 심각한 인도적 위기를 초래했습니다.`,
  players:`직접 교전 중인 이스라엘 정부와 하마스, 그리고 막후에서 휴전을 이끌어내기 위해 외교 총력전을 펼친 미국, 이집트, 카타르 등이 핵심 주체입니다.`,
  current:`국제사회의 거센 비판과 이스라엘 내부의 인질 구출 여론이 고조됨에 따라, 양측 모두 한 발씩 물러나 임시 봉합을 선택한 결정적 시기입니다.`,
  outlook:`45일간의 휴전 기간 동안 영구 휴전을 위한 외교적 돌파구를 마련할 수 있을지가 관건이며, 불발될 경우 다시 대규모 교전으로 회귀할 위험이 큽니다.`,
  sources:[{title:`Israel, Hamas reach 45-day ceasefire agreement - BBC`,url:`https://www.bbc.com/`},{title:`가자지구 총성 멎는다... 6개월 만에 휴전 타결 - 조선일보`,url:`https://www.chosun.com/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`오픈AI, 인간의 추론 능력을 뛰어넘는 차세대 AI 'GPT-5' 전격 공개`,
  metrics:[`매개변수 10조 개 추정`,`추론 정확도 95% 달성`],
  summary:`오픈AI가 마침내 인간의 논리적 추론 능력을 크게 상회하는 것으로 평가받는 차세대 언어 모델 'GPT-5'를 전격 공개했습니다. 새 모델은 단순한 텍스트 생성을 넘어 복잡한 수학 증명과 자율적인 코딩 설계, 그리고 단계별 문제 해결 능력이 비약적으로 향상되었습니다. 샘 알트만 CEO는 이번 성과가 범용 인공지능(AGI)에 한 걸음 더 다가선 역사적 이정표라고 평가했습니다. 특히 환각 현상을 기존 대비 80% 이상 줄여 신뢰성과 정확성을 대폭 끌어올린 점이 가장 큰 특징입니다. 글로벌 IT 업계는 GPT-5의 압도적인 성능에 놀라움을 표하며 자사 서비스와의 접목을 서두르고 있습니다. 반면, AI의 급격한 발전에 따른 윤리적 우려와 일자리 위협 논란도 다시금 거세게 일고 있습니다. 각국 정부는 AI 규제 방안 마련에 더욱 속도를 낼 것으로 예상됩니다.`,
  keyTerms:[{term:`범용 인공지능(AGI)`,explanation:`특정 작업에 국한되지 않고 사람처럼 다양한 분야에서 스스로 학습하고 사고하며 복잡한 문제를 해결할 수 있는 인간 수준 이상의 AI를 말합니다.`}],
  history:`생성형 AI 기술은 GPT-3와 4를 거치며 빠르게 진화해 왔으나, 여전히 복잡한 논리적 추론의 한계와 환각(거짓 정보 생성) 문제가 약점으로 지적받아 왔습니다.`,
  players:`선두 자리를 굳히려는 오픈AI와 이를 추격하는 구글, 앤스로픽 등 빅테크 기업들 간의 거대한 AI 주도권 경쟁이 펼쳐지고 있습니다.`,
  current:`오픈AI가 다시 한번 압도적인 성능의 모델을 출시함으로써, 전 세계 산업계에 AI 도입을 가속화하는 강력한 충격파를 던진 시점입니다.`,
  outlook:`향후 기업과 개인의 업무 방식에 혁명적 변화가 예상되며, 동시에 유럽과 미국을 중심으로 AI의 위험성을 통제하기 위한 강력한 규제 입법이 뒤따를 것입니다.`,
  sources:[{title:`OpenAI releases GPT-5, pushing closer to AGI - The Economist`,url:`https://www.economist.com/`},{title:`오픈AI, 추론의 벽 넘은 GPT-5 발표 - 동아일보`,url:`https://www.donga.com/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`대한민국, 독자 개발한 화성 탐사선 '다누리 2호' 성공적 발사`,
  metrics:[`예산 8,500억 원 투입`,`화성 도착까지 7개월`],
  summary:`대한민국 우주항공청이 순수 국내 기술로 개발한 첫 화성 탐사선 '다누리 2호'를 전남 고흥 나로우주센터에서 성공적으로 발사했습니다. 누리호 개량형 발사체에 실려 우주로 향한 다누리 2호는 발사 40분 만에 목표 궤도에 안착하며 지상국과 첫 교신을 무사히 마쳤습니다. 탐사선은 앞으로 약 7개월간의 우주 항해를 거쳐 화성 궤도에 진입한 뒤, 화성의 대기 성분과 지표면 구조를 정밀 분석하는 임무를 수행하게 됩니다. 이번 성공으로 한국은 세계에서 6번째로 화성 탐사선을 보낸 국가 반열에 당당히 이름을 올렸습니다. 정부는 이번 프로젝트 성공을 발판 삼아 2030년대 달 기지 건설을 위한 우주 탐사 로드맵을 더욱 가속화할 방침입니다. 국내 항공우주 산업의 비약적인 도약을 전 세계에 알린 쾌거라는 평가가 쏟아지고 있습니다. 국민적 자긍심과 함께 우주 경제 시대로의 본격적인 진입이 기대됩니다.`,
  keyTerms:[{term:`지상국`,explanation:`우주에 쏘아 올린 인공위성이나 탐사선과 직접 통신하며 기기의 상태를 모니터링하고 각종 임무 명령을 주고받는 지상의 안테나와 제어 시설입니다.`}],
  history:`한국은 과거 달 탐사선 다누리호의 성공을 바탕으로 더 깊은 심우주 탐사를 목표로 우주항공청을 설립하고 예산을 집중 투자해왔습니다.`,
  players:`우주항공청과 한국항공우주연구원, 그리고 발사체 및 탐사선 부품 제작에 참여한 수많은 국내 항공우주 민간 기업들이 주역입니다.`,
  current:`글로벌 우주 강국들이 경쟁적으로 화성 탐사에 나서는 이른바 뉴 스페이스(New Space) 시대에, 한국이 독자적인 우주 항행 능력을 입증한 기념비적 순간입니다.`,
  outlook:`다누리 2호가 내년 초 화성 궤도에 안착해 보내올 첫 데이터에 세계 과학계의 이목이 집중되며, 후속 착륙선 개발 논의도 본격화될 전망입니다.`,
  sources:[{title:`한국 독자 화성 탐사선 다누리 2호 발사 성공 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`우주강국 도약, 화성 향해 날아오른 코리아 - SBS`,url:`https://news.sbs.co.kr/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`유럽 남부 강타한 사상 최악의 폭염... 섭씨 48도 넘나들며 비상사태`,
  metrics:[`최고 기온 48.5도 기록`,`사망자 1천 명 육박`],
  summary:`이탈리아, 스페인, 그리스 등 유럽 남부 지역에 연일 섭씨 48도를 넘나드는 사상 최악의 폭염이 덮치면서 국가 비상사태가 선포되었습니다. 뜨거운 공기가 돔 모양으로 갇혀 지표면을 가열하는 열돔 현상이 장기화되면서 인명 피해가 눈덩이처럼 불어나고 있습니다. 가뭄과 건조한 날씨까지 겹치면서 대형 산불이 곳곳에서 동시다발적으로 발생해 수만 명의 이재민이 발생했습니다. 각국 정부는 주요 관광지를 임시 폐쇄하고 전력망 붕괴를 막기 위해 순환 정전 조치를 실시하는 등 극단의 대책을 내놓고 있습니다. 기상학자들은 기후 변화로 인해 이러한 극단적 기상 이변이 앞으로 더욱 잦아질 것이라고 강력히 경고하고 있습니다. 유럽 연합(EU) 차원의 기후 위기 공동 대응 기금 마련 목소리도 커지고 있습니다. 글로벌 탄소 배출 감축을 위한 강력한 국제적 결단이 시급한 시점입니다.`,
  keyTerms:[{term:`열돔 현상`,explanation:`대기 상층부의 고기압이 강하게 자리 잡으면서 뜨거운 공기가 뚜껑처럼 갇혀, 지상 부근의 열기가 빠져나가지 못하고 펄펄 끓는 폭염을 유발하는 기상 현상입니다.`}],
  history:`지구 온난화가 가속화되면서 최근 수년간 유럽 남부 지중해 연안 국가들은 여름철마다 극심한 폭염과 가뭄의 빈도와 강도가 눈에 띄게 증가했습니다.`,
  players:`피해를 입고 있는 남유럽 국가의 시민들과 정부, 화재 진압을 돕는 국제 구조대, 그리고 기후 정책을 주도하는 유럽연합 집행위원회가 있습니다.`,
  current:`기록적인 고온이 인명 피해뿐만 아니라 농작물 수확량 급감과 관광 산업 타격 등 막대한 경제적 손실을 실시간으로 초래하고 있는 재난 상황입니다.`,
  outlook:`이번 사태를 계기로 화석연료 사용 중단을 촉구하는 국제 환경단체의 압박이 거세지며, 오는 11월 열릴 유엔 기후변화협약 당사국총회(COP)에서 강력한 제재안이 논의될 것입니다.`,
  sources:[{title:`Deadly heatwave scorches southern Europe - NYT`,url:`https://www.nytimes.com/`},{title:`48도 펄펄 끓는 남유럽, 폭염에 국가 비상사태 - MBC`,url:`https://imnews.imbc.com/`}]
}]

  tag:`2026-08-03`,
  label:`2026년 8월 3일 (월)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국발 빅테크 호실적의 영향으로 국내 코스피와 코스닥 시장이 폭등하며 매수 사이드카가 발동되었습니다.`,
  metrics:[`코스피 단숨에 6,400선 회복`,`삼성전자 장중 18%대 폭등`],
  summary:`지난 밤 미국 아마존과 마이크로소프트 등 빅테크 기업들이 시장 예상치를 웃도는 호실적을 발표했습니다. 이로 인해 글로벌 AI 투자 열기가 다시 점화되며 투자 심리가 크게 개선되었습니다. 국내 증시도 개장 직후부터 강한 매수세가 유입되며 주가가 수직 상승했습니다. 특히 반도체 대장주인 삼성전자와 SK하이닉스가 급등세를 이끌었습니다. 결국 코스피가 10% 넘게 오르며 단숨에 6,400선을 회복했습니다. 코스닥 역시 5% 이상 폭등하면서 양 시장 모두 매수 사이드카가 발동되는 진풍경을 연출했습니다. 향후 미국 연준의 금리 결정에 따라 변동성이 커질 가능성도 제기되고 있습니다.`,
  keyTerms:[{term:`사이드카`,explanation:`주식 시장에서 주가가 갑자기 크게 오르거나 떨어질 때, 시장의 충격을 완화하기 위해 프로그램 매매 호가의 효력을 일시적으로 정지시키는 제도입니다. 과열된 시장을 잠시 식히는 브레이크 역할을 합니다.`}],
  history:`글로벌 증시는 최근 중동 리스크와 인플레이션 우려로 변동성이 컸습니다. 하지만 AI 산업의 지속적인 성장에 대한 기대감이 증시의 든든한 버팀목 역할을 해왔습니다. 이번 반등도 이러한 기대감이 실적으로 증명되면서 시작되었습니다.`,
  players:`미국의 대형 기술 기업들과 이를 추종하는 글로벌 투자자들이 핵심 주체입니다. 국내에서는 삼성전자와 SK하이닉스 등 반도체 수출 기업들이 수혜를 입고 있습니다.`,
  current:`빅테크 기업들의 깜짝 실적이 그간 쌓여있던 시장의 불안감을 일거에 해소시켰습니다. 외국인과 기관 투자자들의 대규모 매수세가 국내 증시의 폭등을 견인했습니다.`,
  outlook:`이번 주 발표될 미국의 7월 고용 보고서 결과가 단기적인 증시 향방을 결정할 것입니다. 또한 연준의 금리 인하 기대감이 어떻게 반영될지 지켜봐야 합니다.`,
  sources:[{title:`국내 증시 폭등 및 사이드카 발동 - 연합뉴스TV`,url:`https://www.yonhapnewstv.co.kr`},{title:`코스피 6,400선 회복, 반도체 대장주 랠리 - 조선일보`,url:`https://www.chosun.com`}]

  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국은행이 물가 상승 압력과 경제 성장세를 반영해 3년 6개월 만에 기준금리를 0.25%p 전격 인상했습니다.`,
  metrics:[`기준금리 2.50%에서 2.75%로 인상`,`3년 6개월 만의 첫 인상 조치`],
  summary:`한국은행 금융통화위원회가 기준금리를 기존 연 2.50%에서 2.75%로 0.25%포인트 인상했습니다. 이번 금리 인상은 무려 3년 6개월 만에 단행된 조치입니다. 최근 인공지능 투자 붐과 반도체 수출 호조 덕분에 국내 경제의 성장세가 예상을 뛰어넘을 정도로 강해졌습니다. 경제가 활력을 띠면서 시중에 돈이 돌고 물가 상승 압력이 다시 커지는 부작용도 나타났습니다. 한국은행은 고물가 상황이 고착화되는 것을 선제적으로 막기 위해 금리 인상을 결정했습니다. 대출 이자 부담이 커지게 된 가계와 한계 기업들의 어려움은 가중될 것으로 보입니다. 시장 전문가들은 당분간 추가 인상보다는 경제 지표를 확인하며 숨 고르기에 들어갈 것으로 예상하고 있습니다.`,
  keyTerms:[{term:`기준금리`,explanation:`한 나라의 중앙은행이 다른 금융기관들과 거래할 때 기준으로 삼는 가장 기본이 되는 금리입니다. 시중 은행들의 예금이나 대출 금리를 결정하는 기준점이 됩니다.`}],
  history:`한국은행은 팬데믹 이후 경기 부양을 위해 낮은 금리를 오랫동안 유지해 왔습니다. 하지만 최근 반도체 슈퍼 사이클을 타고 수출이 급증하며 거시 경제 지표가 눈에 띄게 개선되었습니다.`,
  players:`통화 정책을 결정하는 한국은행 금융통화위원회와, 이에 영향을 받는 국내 은행, 기업, 그리고 가계 대출자들이 주요 이해관계자입니다.`,
  current:`물가가 다시 꿈틀거리는 조짐을 보이자, 중앙은행이 더 늦기 전에 선제적으로 돈줄을 조이는 결정을 내린 것입니다.`,
  outlook:`하반기 수출 실적과 내수 소비 동향에 따라 추가적인 통화 정책 방향이 정해질 것입니다. 정부의 가계 부채 관리 대책도 주목해야 할 변수입니다.`,
  sources:[{title:`한국은행, 기준금리 2.75%로 인상 - 연합뉴스`,url:`https://www.yna.co.kr`},{title:`3년 6개월 만에 금리 인상, 대출자 비상 - 한겨레`,url:`https://www.hani.co.kr`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`중동 지역의 분쟁이 장기화되면서 국제 유가가 들썩이고 글로벌 인플레이션이 다시 심해질 것이라는 경고가 나왔습니다.`,
  metrics:[`조사 대상 50개국 중 39개국 인플레 전망 상향`,`국제 유가 배럴당 100달러 재돌파`],
  summary:`최근 경제학자들을 대상으로 한 설문조사에서 글로벌 인플레이션 압력이 다시 커지고 있다는 결과가 나왔습니다. 미국과 이란의 대리전 양상을 띠는 중동 전쟁이 5개월째로 접어들면서 불확실성이 극에 달했기 때문입니다. 일시적인 휴전 이후 교전이 재개되자 국제 유가는 다시 배럴당 100달러를 돌파하며 고공행진을 벌였습니다. 에너지 가격 상승은 전반적인 물가 상승을 부추기고 기업의 생산 비용을 크게 늘립니다. 이에 따라 설문 대상 50개국 중 39개국의 인플레이션 전망치가 상향 조정되었습니다. 각국 중앙은행들은 금리를 내리려던 계획을 수정하며 깊은 고민에 빠졌습니다. 영란은행 역시 호르무즈 해협 봉쇄 시 극심한 스태그플레이션이 올 수 있다고 강하게 경고했습니다.`,
  keyTerms:[{term:`스태그플레이션`,explanation:`경제가 성장하지 않고 침체되어 있는데도 물가는 계속해서 오르는 경제 현상을 말합니다. 일반적인 경제 상식과 반대로 움직여 해결하기 매우 까다롭습니다.`}],
  history:`중동 지역은 세계 원유 공급의 핵심 동맥으로, 이 지역의 지정학적 불안은 늘 글로벌 유가 급등으로 이어졌습니다. 최근 몇 달간 휴전과 확전이 반복되며 시장의 피로도가 매우 높아진 상태입니다.`,
  players:`산유국 모임인 석유수출국기구와 분쟁 당사국들, 그리고 물가를 잡아야 하는 각국 중앙은행이 얽혀 있습니다. 기름을 수입해 쓰는 제조업 중심 국가들이 가장 큰 타격을 받습니다.`,
  current:`유가 상승이 시차를 두고 제품 가격에 반영되기 시작하면서, 잡히는 듯했던 글로벌 물가가 다시 반등할 조짐을 보이고 있습니다.`,
  outlook:`호르무즈 해협의 안전한 통항 여부가 가장 중요한 변수입니다. 유가 향방에 따라 미국 연준과 유럽 중앙은행의 하반기 금리 인하 스케줄이 전면 백지화될 수 있습니다.`,
  sources:[{title:`중동 불안에 글로벌 인플레이션 재점화 경고 - 로이터`,url:`https://www.reuters.com`},{title:`영란은행, 호르무즈 봉쇄 시 경제 충격 우려 - 매일경제`,url:`https://www.mk.co.kr`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`8월 임시국회가 개막한 가운데 패스트트랙 심사 기간 단축 등 주요 쟁점을 둘러싸고 여야 간의 극한 대치가 벌어지고 있습니다.`,
  metrics:[`패스트트랙 심사 기간 330일에서 90일로 단축 추진`,`검찰 보완수사권 폐지 형소법 개정안 야당 단독 처리`],
  summary:`8월 임시국회가 시작되자마자 정국이 꽁꽁 얼어붙고 있습니다. 거대 야당인 더불어민주당은 패스트트랙 안건의 심사 기간을 최장 330일에서 90일로 대폭 줄이는 국회법 개정안을 강력히 추진 중입니다. 이에 국민의힘은 소수당의 방어권을 무력화하는 입법 독주라며 거세게 반발하며 국회 보이콧까지 불사하겠다는 태세입니다. 앞서 검찰의 보완수사권 폐지를 골자로 하는 형사소송법 개정안마저 야당 주도로 통과되면서 여야 갈등은 이미 최고조에 달했습니다. 여기에 선거관리위원회 특검법의 특검 후보 추천 방식을 두고도 양측이 양보 없는 신경전을 벌이고 있습니다. 민생 법안 처리가 시급한 상황에서 정쟁만 격화되면서 국회 파행이 장기화될 것이라는 우려가 커지고 있습니다.`,
  keyTerms:[{term:`패스트트랙`,explanation:`국회에서 여야 간 합의가 어려운 쟁점 법안을 신속하게 처리하기 위해 일정한 기간이 지나면 자동으로 본회의에 상정되도록 하는 제도입니다. 합법적인 의사진행 지연을 방지하기 위한 장치입니다.`}],
  history:`22대 국회 개원 이후 거대 야당의 입법 주도권 행사와 여당의 반발, 그리고 대통령의 거부권 행사가 쳇바퀴처럼 반복되며 정치적 교착 상태가 이어져 왔습니다.`,
  players:`다수 의석을 바탕으로 법안을 밀어붙이는 더불어민주당과, 이를 저지하려는 국민의힘 지도부가 정면 충돌하고 있습니다.`,
  current:`주요 법안 처리 기한과 특검 정국이 맞물리면서, 대화와 타협이라는 의회 정치의 기본이 실종된 극단적인 대치 국면이 전개되고 있습니다.`,
  outlook:`여야 지도부 간의 물밑 협상 여부가 관건이지만, 각 당의 강경파 목소리가 커 당분간 돌파구를 찾기는 쉽지 않아 보입니다. 대통령의 재의요구권 행사 여부도 정국의 뇌관입니다.`,
  sources:[{title:`8월 국회도 지뢰밭… 패스트트랙 단축 놓고 '강대강' - 연합뉴스`,url:`https://www.yna.co.kr`},{title:`여야 대치 극에 달해, 민생 법안은 뒷전 - KBS`,url:`https://news.kbs.co.kr`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`도널드 트럼프 미국 대통령이 중동 지역의 군사적 긴장을 고조시켰던 대이란 대규모 공습 계획을 전격적으로 보류했습니다.`,
  metrics:[`이란 공습 작전 개시 직전 전격 보류`,`월요일부터 테헤란과 공식 협상 재개 선언`],
  summary:`주말 사이 일촉즉발의 위기로 치달았던 중동 정세가 급반전되었습니다. 도널드 트럼프 미국 대통령은 이란의 핵심 에너지 시설을 겨냥한 대규모 공습을 계획했으나, 작전 실행을 직전에 전격 보류했습니다. 트럼프 대통령은 사우디아라비아 등 우방국들의 강력한 만류를 수용하여 무력 과시 대신 외교적 해결을 선택했다고 밝혔습니다. 이에 따라 미국은 다가오는 월요일부터 이란 테헤란과 직접적인 협상 테이블을 차리기로 합의했습니다. 이번 협상의 주요 의제는 호르무즈 해협의 완전한 개방과 이란의 핵 위협 종식이 될 전망입니다. 최악의 군사적 충돌을 피했다는 소식에 국제 사회는 일제히 안도하며 환영의 뜻을 나타냈습니다. 향후 중동 지역의 평화 정착에 중요한 이정표가 될지 주목받고 있습니다.`,
  keyTerms:[{term:`호르무즈 해협`,explanation:`페르시아만과 오만만을 잇는 좁은 바닷길로, 전 세계 원유 물동량의 약 20%가 지나가는 핵심 해상 교통로입니다. 이란이 통제력을 쥐고 있어 지정학적으로 매우 중요한 곳입니다.`}],
  history:`미국과 이란은 핵 합의 파기 이후 수년간 군사적 긴장과 제재를 주고받으며 앙숙 관계를 이어왔습니다. 최근 친이란 무장단체의 도발로 양국 간의 갈등이 통제 불능 상태로 치닫고 있었습니다.`,
  players:`강경 대응을 예고했던 트럼프 미국 대통령, 이란의 최고지도자, 그리고 막후에서 중재자 역할을 한 사우디아라비아의 빈 살만 왕세자가 핵심 인물들입니다.`,
  current:`전면전으로 비화될 수 있는 위험천만한 상황에서, 미국의 전략적 인내와 주변국들의 적극적인 중재가 맞물려 극적인 국면 전환이 이루어졌습니다.`,
  outlook:`실제로 테헤란에서 열릴 협상에서 양국이 얼마나 의미 있는 타협점을 찾을 수 있을지가 관건입니다. 강경파들의 반발을 억누르고 합의를 이행하는 과정이 순탄치만은 않을 것입니다.`,
  sources:[{title:`트럼프, 대이란 공습 전격 취소... 대화 국면 진입 - 로이터`,url:`https://www.reuters.com`},{title:`중동 전쟁 위기 넘겨, 트럼프 협상 테이블로 - 중앙일보`,url:`https://www.joongang.co.kr`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`러시아 모스크바 시내 중심가에서 폭탄 테러가 발생해 다수의 사상자가 나오면서 우크라이나와의 군사적 긴장이 한층 고조되고 있습니다.`,
  metrics:[`사상자 최소 26명 발생 (사망 5명, 부상 21명)`,`모스크바 중심부 식당서 폭발물 터져`],
  summary:`현지 시각으로 주말 저녁, 러시아 수도 모스크바 중심가에 위치한 한 유명 식당 주변에서 강력한 폭발이 일어났습니다. 거리를 걷던 한 여성이 소지하고 있던 사제 폭발물이 터진 것으로 파악되며, 현장에서 최소 5명이 사망하고 21명이 다치는 참사가 발생했습니다. 러시아 당국은 즉각 이를 중대한 테러 행위로 규정하고 대대적인 수사에 착수했습니다. 특히 러시아 연방보안국은 이번 사건의 배후에 우크라이나 정보 당국이 개입했을 가능성이 높다고 강하게 의심하고 있습니다. 폭발 직후 모스크바 시내 주요 시설에 대한 경계가 대폭 강화되었고 시민들은 큰 불안에 떨고 있습니다. 이 사건을 빌미로 러시아가 우크라이나에 대한 대대적인 보복 공습을 가할 수 있다는 우려가 확산되고 있습니다.`,
  keyTerms:[{term:`사제 폭발물`,explanation:`군대나 경찰이 사용하는 정식 폭탄이 아니라, 일반인이 화학 물질이나 비료 등을 섞어 불법적으로 직접 제조한 사설 폭탄을 의미합니다.`}],
  history:`러시아와 우크라이나 전쟁이 장기화되면서 전선뿐만 아니라 러시아 본토 깊숙한 곳에서도 산발적인 공격이 끊이지 않았습니다.`,
  players:`러시아 내부의 치안을 담당하는 연방보안국과 우크라이나 정보국, 그리고 전쟁에 지친 양국 국민들이 이번 사태의 파장을 예의주시하고 있습니다.`,
  current:`민간인이 붐비는 모스크바 한복판에서 끔찍한 인명 피해가 발생하면서, 러시아 국민들의 전쟁 피로감과 분노가 복합적으로 표출되고 있습니다.`,
  outlook:`러시아 정부가 이번 테러의 명확한 증거를 우크라이나와 결부시킬 경우, 이를 명분으로 한층 더 파괴적인 공세에 나설 가능성이 높습니다.`,

  metrics:[`투명성 의무 위반 시 글로벌 매출 1.5% 과징금`,`최대 125억 원에 달하는 강력한 벌금 부과 가능`],

  history:`기술이 급속도로 발전하면서 가짜 뉴스 생산과 저작권 침해, 차별 조장 등 사회적 부작용이 심각한 문제로 대두되었습니다. 이에 유럽연합은 선도적으로 촘촘한 법적 가이드라인을 준비해왔습니다.`,

  headline:`국내 공동 연구진이 혈액 한 방울만으로 파킨슨병을 쉽고 빠르게 조기 진단할 수 있는 획기적인 단백질 지표를 발굴해 냈습니다.`,
  metrics:[`값비싼 뇌 영상 검사 없이 혈액 검사로 대체`,`칠곡경북대병원과 한국뇌연구원 공동 연구 성과`],
  summary:`국내 의료진과 과학자들이 난치성 뇌 질환인 파킨슨병을 간편하게 진단할 수 있는 새로운 길을 열었습니다. 칠곡경북대병원과 한국뇌연구원으로 구성된 공동 연구팀은 파킨슨병 환자의 혈액에서 특이하게 변하는 단백질 바이오마커 후보 물질을 성공적으로 찾아냈습니다. 기존에는 병을 진단하기 위해 값비싸고 복잡한 뇌 영상 검사와 의료진의 주관적인 임상 평가에 크게 의존해야 했습니다. 하지만 이번에 발견된 지표를 활용하면, 단 한 방울의 채혈만으로도 객관적이고 빠르게 질병의 진행 상태를 파악할 수 있게 됩니다. 이는 환자의 조기 발견을 가능하게 하여 삶의 질을 크게 높일 수 있는 획기적인 성과로 평가받습니다. 연구팀은 향후 대규모 임상 시험을 거쳐 상용화에 나설 계획입니다.`,

  history:`치매와 함께 대표적인 퇴행성 뇌 질환으로 꼽히지만, 확진을 내릴 수 있는 명확한 생체 지표가 없어 의사들의 임상적 판단에 의존하는 한계가 있었습니다.`,

let current = null;
let currentCat = null;
const CAT_ORDER = ['경제', '정치', '기타 이슈'];

function renderSidebar() {
  const list = document.getElementById('date-list');
  list.innerHTML = '';
  BRIEFS.forEach((b, i) => {
    const el = document.createElement('div');
    el.className = 'date-item' + (i === 0 ? ' active' : '');
    el.dataset.tag = b.tag;
    const parts = b.tag.split('-');
    const short = parts[1] + '/' + parts[2];
    el.innerHTML = b.tag;
    el.addEventListener('click', () => showBrief(b.tag));
    list.appendChild(el);
  });
}

function showBrief(tag) {
  current = tag;
  document.querySelectorAll('.date-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tag === tag);
  });
  const brief = BRIEFS.find(b => b.tag === tag);
  if (!brief) return;

  // 카테고리별 그룹핑
  const grouped = {};
  brief.stories.forEach(s => {
    if (!grouped[s.category]) grouped[s.category] = [];
    grouped[s.category].push(s);
  });
  const availableCats = CAT_ORDER.filter(c => grouped[c] && grouped[c].length);
  if (!availableCats.length) return;

  // 기본 카테고리 결정
  if (!availableCats.includes(currentCat)) currentCat = availableCats[0];

  renderContent(brief, grouped, availableCats);
}

function renderContent(brief, grouped, availableCats) {
  const content = document.getElementById('content');
  let html = `<div class="sticky-top">
    <div class="brief-header">
      <div class="bh-eyebrow">Morning Brief</div>
      <h2>${brief.label}</h2>
    </div>`;

  // 탭
  html += '<div class="cat-tabs">';
  availableCats.forEach(c => {
    const cls = c === currentCat ? 'cat-tab active' : 'cat-tab';
    html += `<button class="${cls}" data-cat="${c}">${c}</button>`;
  });
  html += '</div></div>';

  // 선택된 카테고리 기사들
  const stories = grouped[currentCat] || [];
  stories.forEach((s, idx) => {
    if (idx > 0) html += '<hr class="story-divider">';
    html += `<div class="story">
      <div class="story-top">
        <div class="story-headline">${s.headline}</div>
      </div>`;
    if (s.metrics.length) {
      html += '<div class="metrics">';
      s.metrics.forEach(m => { html += `<div class="metric-chip">${m}</div>`; });
      html += '</div>';
    }
    // 요약문에 핵심 개념 밑줄 (출력은 박스 다음)
    let summaryHtml = s.summary;
    if (s.keyTerms && s.keyTerms.length) {
      s.keyTerms.forEach(kt => {
        if (!kt.term) return;
        const safe = kt.term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp(safe, 'g');
        summaryHtml = summaryHtml.replace(re, `<span class="kt-underline">${kt.term}</span>`);
      });
    }

    // 핵심 개념 박스 (요약 위)
    if (s.keyTerms && s.keyTerms.length) {
      html += '<div class="key-terms"><div class="key-terms-title">핵심 개념</div>';
      s.keyTerms.forEach(kt => {
        html += `<div class="kt-item">
          <span class="kt-term">${kt.term}</span>
          <span class="kt-exp">${kt.explanation}</span>
        </div>`;
      });
      html += '</div>';
    }

    html += `<div class="summary">${summaryHtml}</div>`;

    const bgSections = [
      ['역사적 맥락', s.history],
      ['핵심 플레이어', s.players],
      ['현재 구도', s.current],
      ['향후 전망', s.outlook],
    ].filter(([, v]) => v);

    if (bgSections.length) {
      html += '<div class="bg-box"><div class="bg-box-title">배경 스토리</div>';
      bgSections.forEach(([label, text]) => {
        html += `<div class="bg-section">
          <div class="bg-section-label">${label}</div>
          <div class="bg-section-text">${text}</div>
        </div>`;
      });
      html += '</div>';
    }

    if (s.sources.length) {
      html += `<button class="sources-toggle" data-toggle="srcs-${idx}">출처 ${s.sources.length}개 보기 <span class="arrow">▾</span></button>`;
      html += `<div class="sources-body" id="srcs-${idx}">`;
      s.sources.forEach((src, si) => {
        html += `<div class="source-item">
          <span class="src-num">${si+1}</span>
          <a href="${src.url}" target="_blank">${src.title}</a>
        </div>`;
      });
      html += '</div>';
    }
    html += '</div>';
  });

  content.innerHTML = html;

  // 탭 클릭 핸들러
  content.querySelectorAll('.cat-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentCat = btn.dataset.cat;
      renderContent(brief, grouped, availableCats);
    });
  });

  // 출처 토글
  content.querySelectorAll('.sources-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const body = document.getElementById(btn.dataset.toggle);
      const isOpen = body.classList.toggle('open');
      btn.classList.toggle('open', isOpen);
    });
  });

  document.getElementById('main').scrollTop = 0;
}

if (BRIEFS.length > 0) {
  renderSidebar();
  showBrief(BRIEFS[0].tag);
} else {
  document.getElementById('content').innerHTML = '<div class="empty">브리핑 데이터가 없습니다.</div>';
}

// ── Quiz Gate ──
const PASS_TARGET = 3;
let correctCount = 0;
const usedIndexes = new Set();

function pickQuestion() {
  // 사용 안 한 문제 중 랜덤. 다 썼으면 풀 리셋
  if (usedIndexes.size >= QUIZ.length) usedIndexes.clear();
  let idx;
  do { idx = Math.floor(Math.random() * QUIZ.length); } while (usedIndexes.has(idx));
  usedIndexes.add(idx);
  return QUIZ[idx];
}

function updateCounter() {
  document.getElementById('quiz-counter').textContent = `(${correctCount}/${PASS_TARGET})`;
}

function renderQuiz() {
  const q = pickQuestion();
  document.getElementById('quiz-q').textContent = q.q;
  updateCounter();
  const feedback = document.getElementById('quiz-feedback');
  feedback.textContent = '';
  feedback.className = 'quiz-feedback';
  const closeBtn = document.getElementById('quiz-close');
  closeBtn.classList.add('hidden');

  const choicesEl = document.getElementById('quiz-choices');
  choicesEl.innerHTML = '';
  // 보기 순서 섞기 (정답 위치 고정 방지)
  const order = q.a.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  order.forEach(idx => {
    const text = q.a[idx];
    const btn = document.createElement('button');
    btn.className = 'quiz-choice';
    btn.textContent = text;
    btn.addEventListener('click', () => {
      const allBtns = choicesEl.querySelectorAll('.quiz-choice');
      allBtns.forEach(b => b.disabled = true);
      if (idx === q.correct) {
        btn.classList.add('correct');
        correctCount++;
        updateCounter();
        if (correctCount >= PASS_TARGET) {
          feedback.textContent = '통과! 들어와도 좋아.';
          feedback.className = 'quiz-feedback right';
          closeBtn.classList.remove('hidden');
        } else {
          feedback.textContent = '역시 맞출 줄 알았어. 다음 문제 고.';
          feedback.className = 'quiz-feedback right';
          btn.blur();
          setTimeout(() => {
            if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
            renderQuiz();
          }, 900);
        }
      } else {
        btn.classList.add('wrong');
        feedback.textContent = '정말 실망이다.... 다음.';
        feedback.className = 'quiz-feedback wrong';
        btn.blur();
        setTimeout(() => {
          if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
          renderQuiz();
        }, 900);
      }
    });
    choicesEl.appendChild(btn);
  });
}

document.getElementById('quiz-close').addEventListener('click', () => {
  document.getElementById('quiz-overlay').classList.add('hidden');
  document.body.classList.remove('quiz-active');
});

document.body.classList.add('quiz-active');
renderQuiz();

// ── Mobile sidebar toggle ──
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('sidebar-backdrop');
function toggleSidebar(open) {
  sidebar.classList.toggle('open', open);
  backdrop.classList.toggle('open', open);
}
document.getElementById('sidebar-toggle').addEventListener('click', () => toggleSidebar(!sidebar.classList.contains('open')));
backdrop.addEventListener('click', () => toggleSidebar(false));
// 날짜 클릭하면 모바일에서 자동으로 닫히게
sidebar.addEventListener('click', e => {
  if (e.target.classList.contains('date-item') && window.innerWidth <= 768) {
    toggleSidebar(false);
  }
});

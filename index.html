<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모닝 브리핑</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --sidebar-w: 240px;
    --bg: #FAFAF7;
    --paper: #FFFFFF;
    --accent: #6B7A8F;
    --accent-soft: #E8ECEF;
    --line: #EAE8E3;
    --line-strong: #D8D5CE;
    --text: #2D2A26;
    --text-mid: #6B655D;
    --text-sub: #A09889;
    --radius: 10px;
  }
  html, body {
    height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 15px; line-height: 1.65; font-weight: 400;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }

  /* ── Layout ── */
  #app { display: flex; height: 100vh; overflow: hidden; }

  /* ── Sidebar ── */
  #sidebar {
    width: var(--sidebar-w); flex-shrink: 0;
    background: var(--bg); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #sidebar-header {
    padding: 36px 20px 24px;
    border-bottom: 1px solid var(--line);
    text-align: center;
  }
  #sidebar-header h1 {
    font-size: 19px; font-weight: 700; color: var(--text);
    letter-spacing: -0.4px; line-height: 1.3;
  }
  #sidebar-header p {
    font-size: 12px; color: var(--text-sub); margin-top: 6px;
    letter-spacing: 0.3px;
  }
  #date-list { overflow-y: auto; flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
  .date-item {
    padding: 11px 14px; cursor: pointer; border-radius: 8px;
    transition: background 0.15s, color 0.15s;
    background: transparent;
    text-align: center; font-size: 13px; font-weight: 500; color: var(--text-mid);
    letter-spacing: 0.1px;
  }
  .date-item:hover { background: var(--accent-soft); color: var(--text); }
  .date-item.active {
    background: var(--accent-soft); color: var(--text); font-weight: 600;
  }

  /* ── Main ── */
  #main { flex: 1; overflow-y: auto; background: var(--paper); }
  #content { max-width: 760px; margin: 0 auto; padding: 56px 40px 80px; }

  .brief-header { margin-bottom: 36px; }
  .brief-header .bh-eyebrow {
    font-size: 11px; color: var(--text-sub); margin-bottom: 8px;
    letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500;
  }
  .brief-header h2 {
    font-size: 30px; font-weight: 700; letter-spacing: -0.7px;
    color: var(--text); line-height: 1.25;
  }

  /* ── Sticky Top (header + tabs) ── */
  .sticky-top {
    position: sticky; top: 0;
    background: var(--paper); z-index: 20;
    padding-top: 56px; margin-top: -56px;
  }
  .sticky-top .brief-header { margin-bottom: 24px; }

  /* ── Category Tabs ── */
  .cat-tabs {
    display: flex; gap: 0; margin-bottom: 36px;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
  }
  .cat-tab {
    padding: 12px 20px 14px; cursor: pointer; font-size: 14px; font-weight: 500;
    color: var(--text-sub); border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    background: none; border-top: none; border-left: none; border-right: none;
    font-family: inherit; letter-spacing: -0.1px;
    margin-bottom: -1px;
  }
  .cat-tab:hover { color: var(--text-mid); }
  .cat-tab.active { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }

  /* ── Sources (collapsible) ── */
  .sources-toggle {
    background: transparent; border: 1px solid var(--line-strong);
    padding: 8px 14px; border-radius: 6px; font-size: 12.5px; font-weight: 500;
    color: var(--text-mid); cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    font-family: inherit; margin-top: 12px;
    transition: background 0.15s, border-color 0.15s;
  }
  .sources-toggle:hover { background: var(--accent-soft); border-color: var(--accent); }
  .sources-toggle .arrow { transition: transform 0.2s; font-size: 9px; color: var(--text-sub); }
  .sources-toggle.open .arrow { transform: rotate(180deg); }
  .sources-body { display: none; margin-top: 12px; padding-left: 4px; }
  .sources-body.open { display: block; }

  /* ── Story Card ── */
  .story { margin-bottom: 40px; }
  .story-top { margin-bottom: 18px; }
  .story-headline {
    font-size: 19px; font-weight: 700; line-height: 1.45;
    letter-spacing: -0.4px; color: var(--text);
  }

  .metrics { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .metric-chip {
    background: var(--accent-soft); border: none;
    border-radius: 6px; padding: 7px 12px;
    font-size: 12.5px; font-weight: 500; color: var(--text-mid);
    line-height: 1.4;
  }

  .summary {
    font-size: 15px; line-height: 1.8; color: var(--text); margin-bottom: 20px;
    letter-spacing: -0.1px;
  }
  .summary .kt-underline {
    color: #1996BD;
    text-decoration: underline;
    text-decoration-color: #1996BD;
    text-decoration-thickness: 1.5px;
    text-underline-offset: 3px;
    cursor: help;
  }

  /* ── Key Terms Box ── */
  .key-terms {
    background: #F4F1EA; border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius); padding: 18px 22px; margin-bottom: 14px;
  }
  .key-terms-title {
    font-size: 11px; font-weight: 600; color: var(--text-sub);
    text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 14px;
  }
  .kt-item { margin-bottom: 12px; }
  .kt-item:last-child { margin-bottom: 0; }
  .kt-term {
    font-size: 13.5px; font-weight: 700; color: #1996BD;
    margin-bottom: 4px; display: block;
    letter-spacing: -0.1px;
  }
  .kt-exp {
    font-size: 13.5px; line-height: 1.7; color: var(--text-mid);
  }

  /* ── Background ── */
  .bg-box {
    background: var(--bg); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 22px 24px; margin-bottom: 14px;
  }
  .bg-box-title {
    font-size: 11px; font-weight: 600; color: var(--text-sub);
    text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 16px;
  }
  .bg-section { margin-bottom: 16px; }
  .bg-section:last-child { margin-bottom: 0; }
  .bg-section-label {
    font-size: 12.5px; font-weight: 600; color: var(--text); margin-bottom: 6px;
    letter-spacing: -0.1px;
  }
  .bg-section-text { font-size: 14px; line-height: 1.75; color: var(--text-mid); }

  /* ── Sources ── */
  .source-item {
    display: flex; align-items: flex-start; gap: 10px;
    margin-bottom: 8px; font-size: 13px;
  }
  .src-num {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent-soft); color: var(--text-mid);
    font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .source-item a { color: var(--text-mid); text-decoration: none; line-height: 1.55; }
  .source-item a:hover { color: var(--text); text-decoration: underline; }

  .story-divider { border: none; border-top: 1px solid var(--line); margin: 36px 0; }

  .empty { color: var(--text-sub); font-size: 14px; padding: 60px 0; text-align: center; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }

  /* ── Mobile Toggle ── */
  #sidebar-toggle {
    display: none;
    position: fixed; top: 14px; left: 14px; z-index: 50;
    background: var(--paper); border: 1px solid var(--line-strong);
    width: 40px; height: 40px; border-radius: 10px;
    cursor: pointer; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(45, 42, 38, 0.08);
  }
  #sidebar-toggle span {
    display: block; width: 18px; height: 2px; background: var(--text);
    position: relative;
  }
  #sidebar-toggle span::before,
  #sidebar-toggle span::after {
    content: ''; position: absolute; left: 0; width: 18px; height: 2px; background: var(--text);
  }
  #sidebar-toggle span::before { top: -6px; }
  #sidebar-toggle span::after { top: 6px; }

  #sidebar-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(45, 42, 38, 0.4); z-index: 40;
  }
  #sidebar-backdrop.open { display: block; }

  /* ── Mobile Responsive ── */
  @media (max-width: 768px) {
    #sidebar-toggle { display: flex; }
    #sidebar {
      position: fixed; left: 0; top: 0; bottom: 0;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      z-index: 45; width: 260px;
      box-shadow: 0 0 24px rgba(45, 42, 38, 0.12);
    }
    #sidebar.open { transform: translateX(0); }

    #content { padding: 64px 20px 60px; max-width: 100%; }
    .brief-header h2 { font-size: 22px; }
    .story-headline { font-size: 16px; }
    .summary { font-size: 14.5px; line-height: 1.75; }
    .bg-section-text { font-size: 13.5px; }
    .metric-chip { font-size: 12px; padding: 6px 10px; }
    .bg-box { padding: 18px 18px; }
    .cat-tab { padding: 11px 14px; font-size: 13.5px; }

    .quiz-card { padding: 28px 24px 24px; }
    .quiz-q { font-size: 17px; }
    .quiz-choice { font-size: 14px; padding: 13px 16px; }
  }

  /* ── Quiz Overlay ── */
  body.quiz-active #app {
    filter: blur(6px) saturate(0.85);
    pointer-events: none;
    transition: filter 0.3s ease;
  }
  #quiz-overlay {
    position: fixed; inset: 0;
    background-color: rgba(250, 250, 247, 0.55);
    background-image:
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0) 0,
        rgba(255,255,255,0) 5px,
        rgba(45,42,38,0.04) 5px,
        rgba(45,42,38,0.04) 6px
      ),
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0) 0,
        rgba(255,255,255,0) 22px,
        rgba(45,42,38,0.025) 22px,
        rgba(45,42,38,0.025) 23px
      );
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 24px;
  }
  #quiz-overlay.hidden { display: none; }

  .quiz-card {
    background: var(--paper); border-radius: 16px;
    padding: 36px 36px 32px; width: 100%; max-width: 440px;
    box-shadow: 0 16px 48px rgba(45, 42, 38, 0.18);
  }
  .quiz-eyebrow {
    font-size: 11px; color: var(--text-sub); letter-spacing: 1.5px;
    text-transform: uppercase; font-weight: 500; margin-bottom: 12px;
  }
  .quiz-q {
    font-size: 19px; font-weight: 700; color: var(--text);
    line-height: 1.5; letter-spacing: -0.3px; margin-bottom: 24px;
  }
  .quiz-choices { display: flex; flex-direction: column; gap: 8px; }
  .quiz-choice {
    background: var(--paper); border: 1px solid var(--line-strong);
    padding: 14px 18px; border-radius: 10px; font-size: 14.5px; font-weight: 500;
    color: var(--text); cursor: pointer; text-align: left;
    font-family: inherit; transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .quiz-choice:focus { outline: none; }
  .quiz-choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) {
    .quiz-choice:hover { background: var(--accent-soft); border-color: var(--accent); }
  }
  .quiz-choice:active { transform: scale(0.99); }
  .quiz-choice.wrong {
    background: #F5E6E0; border-color: #C9947F; color: #8A4A30;
    animation: shake 0.4s ease;
  }
  .quiz-choice.correct {
    background: #E3EDE2; border-color: #7A9077; color: #2E4A2C;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .quiz-feedback {
    margin-top: 20px; text-align: center; font-size: 14px; font-weight: 500;
    color: var(--text-mid); min-height: 22px;
  }
  .quiz-feedback.right { color: #2E4A2C; }
  .quiz-feedback.wrong { color: #8A4A30; }

  .quiz-close-btn {
    margin-top: 18px; width: 100%;
    background: var(--text); color: var(--paper); border: none;
    padding: 13px 20px; border-radius: 10px; font-size: 14px; font-weight: 600;
    font-family: inherit; cursor: pointer;
    transition: background 0.15s;
  }
  .quiz-close-btn:hover { background: #1a1815; }
  .quiz-close-btn.hidden { display: none; }
</style>
</head>
<body>
<div id="quiz-overlay">
  <div class="quiz-card">
    <div class="quiz-eyebrow"><span>잠깐, 나에 대해서 잘 알지?</span> <span id="quiz-counter">(0/3)</span></div>
    <div class="quiz-q" id="quiz-q"></div>
    <div class="quiz-choices" id="quiz-choices"></div>
    <div class="quiz-feedback" id="quiz-feedback"></div>
    <button class="quiz-close-btn hidden" id="quiz-close">닫기</button>
  </div>
</div>

<button id="sidebar-toggle" aria-label="메뉴"><span></span></button>
<div id="sidebar-backdrop"></div>

<div id="app">
  <nav id="sidebar">
    <div id="sidebar-header">
      <h1>모닝 브리핑</h1>
      <p>일별 세계 뉴스 요약</p>
    </div>

    <div id="date-list"></div>
  </nav>
  <main id="main">
    <div id="content"></div>
  </main>
</div>

<script>
const BRIEFS = [{
  tag:`2026-10-17`,
  label:`2026년 10월 17일 (토)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국은행, 10월 금융통화위원회에서 기준금리 연 3.50%로 14연속 동결 결정`,
  metrics:[`기준금리 연 3.50%`,`가계대출 잔액 1,100조 원 돌파`],
  summary:`한국은행이 10월 금융통화위원회에서 기준금리 동결을 결정하며 연 3.50%를 유지했습니다. 이는 물가 상승세가 둔화되고 있지만 가계부채가 역대 최대치를 경신하며 금융 불안 리스크가 커졌기 때문입니다. 최근 시중은행의 주택담보대출이 급증하면서 추가 금리 인상 시 취약차주의 부실 위험이 극도로 높아질 수 있다는 점이 지적되었습니다. 반면 미국 연준의 고금리 장기화 기조로 인해 한미 금리차가 벌어져 외국인 자금 유출 우려도 여전한 상황입니다. 현재 한국은행은 성장률 둔화와 물가 안정 사이에서 매우 신중한 줄타기를 하고 있습니다. 전문가들은 내년 상반기까지는 현재의 긴축 기조가 유지될 것으로 내다보고 있습니다. 결과적으로 이번 기준금리 동결 결정은 내수 침체를 막기 위한 고육지책으로 풀이됩니다.`,
  keyTerms:[{term:`기준금리 동결`,explanation:`중앙은행이 정책금리를 올리거나 내리지 않고 현재 수준으로 유지하는 조치입니다. 가계부채 부담과 물가 상승 압력 사이에서 고심할 때 주로 선택합니다.`}],
  history:`한국은행은 2023년 초부터 인플레이션 억제를 위해 기준금리를 꾸준히 인상해 왔습니다. 이후 물가가 다소 안정세를 보이면서 연 3.50%에서 인상을 멈추었습니다. 그러나 부동산 시장 연착륙을 위한 정책 대출이 풀리면서 다시 가계부채가 폭증하기 시작했습니다.`,
  players:`이창용 한국은행 총재를 비롯한 금통위원들이 금리 결정을 주도하고 있습니다. 시중은행들은 금리 인상 여부에 따라 대출 금리를 조절하며 직접적인 영향을 받습니다. 빚을 낸 가계와 기업들은 이자 부담의 직격탄을 맞는 주요 이해관계자들입니다.`,
  current:`최근 발표된 가계대출 잔액이 1,100조 원을 넘어서며 사상 최고치를 찍었습니다. 미국 국채 금리까지 5%를 위협하면서 대내외적 금융 환경이 매우 불안정합니다. 정부의 대출 규제 강화 카드가 제대로 작동할지가 핵심 변수입니다.`,
  outlook:`다음 달 발표될 11월 물가 지표가 통화 정책의 향방을 가를 것입니다. 미국 FOMC의 금리 결정에 따라 한은의 금리 인하 시점은 내년 하반기로 미뤄질 수 있습니다.`,
  sources:[{title:`한은, 금리 또 묶었다... 가계빚·환율 딜레마 - 매일경제`,url:`https://www.mk.co.kr/news/economy/12345`},{title:`가계대출 1100조 턱밑, 한은의 고심 - 한국경제`,url:`https://www.hankyung.com/economy/67890`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`삼성전자와 SK하이닉스, AI 반도체 수요 폭발로 3분기 역대급 실적 달성`,
  metrics:[`SK하이닉스 영업이익 8조 원`,`HBM 시장 점유율 90%`],
  summary:`국내 반도체 투톱인 삼성전자와 SK하이닉스가 3분기에 시장 기대치를 훌쩍 뛰어넘는 어닝 서프라이즈를 기록했습니다. 이는 글로벌 테크 기업들의 인공지능 인프라 투자가 지속되면서 고대역폭메모리 수요가 폭발적으로 증가했기 때문입니다. 특히 SK하이닉스는 엔비디아에 HBM3E 제품 공급을 독점하다시피 하며 분기 영업이익 8조 원이라는 신기록을 썼습니다. 삼성전자 역시 5세대 HBM의 양산 수율을 크게 끌어올리며 본격적인 추격에 나섰습니다. 현재 두 기업은 전 세계 HBM 시장 점유율 90% 이상을 차지하며 AI 반도체 생태계를 주도하고 있습니다. 다만 중국 마이크론 등의 저가 공세와 범용 D램 가격 하락은 향후 실적의 불안 요소로 꼽힙니다. 그럼에도 내년까지 고부가 메모리 중심의 수출 호황은 지속될 전망입니다.`,
  keyTerms:[{term:`고대역폭메모리`,explanation:`여러 개의 D램을 수직으로 연결해 데이터 처리 속도를 획기적으로 높인 차세대 메모리입니다. 방대한 데이터를 빠르게 처리해야 하는 인공지능(AI) 반도체의 핵심 부품입니다.`}],
  history:`2023년 챗GPT 등장 이후 인공지능 연산에 필수적인 그래픽처리장치(GPU) 수요가 폭증했습니다. 이에 따라 GPU에 탑재되는 HBM 메모리 가격이 천정부지로 치솟았습니다. 메모리 반도체 한파를 겪던 국내 기업들은 HBM을 통해 극적인 실적 반등을 이뤄냈습니다.`,
  players:`엔비디아는 전 세계 AI GPU 시장을 독점하며 HBM의 최대 수요처로 군림하고 있습니다. SK하이닉스는 발 빠른 기술 개발로 엔비디아의 핵심 파트너 자리를 꿰찼습니다. 삼성전자는 막강한 자본력을 바탕으로 파운드리와 메모리를 결합한 턴키 서비스를 무기로 반격 중입니다.`,
  current:`AI 데이터센터 구축이 글로벌 국가 단위의 경쟁으로 번지면서 반도체 주문이 폭주하고 있습니다. 빅테크 기업들이 자체 AI 칩 개발에 나서면서 맞춤형 메모리의 중요성은 더욱 커졌습니다.`,
  outlook:`내년 초 차세대 HBM4 제품이 본격 양산되면 두 기업 간의 점유율 경쟁은 한층 치열해질 것입니다. 글로벌 AI 거품론이 가라앉고 실질적인 AI 서비스 수익 모델이 증명될지가 반도체 사이클을 결정할 핵심 지표입니다.`,
  sources:[{title:`SK하이닉스 영업이익 8조 잭팟... AI가 살렸다 - 조선일보`,url:`https://biz.chosun.com/site/data/12345`},{title:`삼성 HBM3E 양산 박차, 반도체 슈퍼사이클 굳히나 - 연합뉴스`,url:`https://www.yna.co.kr/view/67890`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 연준 10월 금리 동결 유력, 미 국채 10년물 금리는 5% 재돌파`,
  metrics:[`미 국채 10년물 금리 5.02%`,`9월 미국 CPI 상승률 3.7%`],
  summary:`미국 연방준비제도(Fed)가 다가오는 10월 FOMC 회의에서 기준금리를 동결할 것이라는 전망이 우세해지고 있습니다. 9월 소비자물가지수(CPI)가 3.7% 상승하며 인플레이션 불씨가 남았음에도 불구하고 추가 인상에 신중한 태도를 보이는 것입니다. 그 이면에는 글로벌 벤치마크 역할을 하는 미 국채 금리 급등 현상이 자리 잡고 있습니다. 10년 만기 미 국채 금리는 16년 만에 다시 5% 선을 돌파하며 시장의 자금을 강하게 빨아들이고 있습니다. 채권 금리가 급등하면 사실상 연준이 기준금리를 올린 것과 같은 긴축 효과를 내기 때문에 연준 입장에서는 무리하게 나설 이유가 줄어듭니다. 현재 월가에서는 고금리 환경이 내년 말까지 장기화할 것이라는 공포가 확산되며 증시가 크게 출렁였습니다. 미국 재무부의 막대한 국채 발행 탓에 수급 불균형 문제도 당분간 해소되기 어려워 보입니다.`,
  keyTerms:[{term:`국채 금리`,explanation:`국가가 돈을 빌리기 위해 발행하는 채권의 이자율입니다. 이 금리가 오르면 시중의 주택담보대출이나 기업 대출 금리도 함께 뛰어 실물 경제에 큰 부담을 줍니다.`}],
  history:`코로나19 팬데믹 이후 풀린 막대한 유동성을 거둬들이기 위해 연준은 공격적인 금리 인상을 단행했습니다. 2024년 잠시 금리 인하 기대감이 돌았으나, 견조한 고용과 끈적한 물가로 인해 고금리 장기화 기조로 선회했습니다. 여기에 미국 정부의 막대한 재정 적자를 메우기 위한 국채 발행이 겹쳤습니다.`,
  players:`제롬 파월 연준 의장은 물가 안정을 최우선 목표로 삼으며 시장의 조기 금리 인하 기대를 꺾어왔습니다. 월스트리트의 대형 투자은행들은 매일 발표되는 고용 및 물가 지표에 따라 채권을 사고팔며 변동성을 키우고 있습니다. 미국 재무부 재닛 옐런 장관의 국채 발행 계획도 시장의 핵심 관심사입니다.`,
  current:`이스라엘과 이란 등 중동 지역의 지정학적 리스크가 불거지며 국제 유가가 들썩이고 있습니다. 유가 상승은 다시 인플레이션을 자극하여 연준의 셈법을 매우 복잡하게 만들고 있습니다.`,
  outlook:`10월 27일부터 이틀간 열리는 FOMC 회의에서 점도표와 제롬 파월 의장의 발언 수위가 초미의 관심사입니다. 국채 금리 오름세가 지속될 경우 한계 기업들의 파산 위험이 글로벌 금융 시스템의 뇌관이 될 수 있습니다.`,
  sources:[{title:`미 10년물 국채금리 5% 돌파... 글로벌 금융시장 발작 - Reuters`,url:`https://www.reuters.com/finance/12345`},{title:`연준 10월 동결 유력하지만 '더 높게 더 오래' 공포 - Bloomberg`,url:`https://www.bloomberg.com/news/67890`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`여야, 국정감사에서 북한 무인기 도발 및 국방부 대응 태세 놓고 정면 충돌`,
  metrics:[`비대칭 전력 예산 30% 삭감 논란`,`군 당국 경고 성명 5회 발표`],
  summary:`국회 국방위원회 국정감사에서 최근 발생한 북한의 무인기 도발과 우리 군의 대응을 둘러싸고 여야가 거세게 충돌했습니다. 야당은 군 당국의 방공망에 심각한 구멍이 뚫렸다며 국방부 장관의 사퇴를 강력히 촉구했습니다. 특히 내년도 예산안에서 대드론 체계 등 비대칭 전력 대응 예산이 무더기로 삭감된 점을 집중적으로 파고들었습니다. 반면 여당은 전 정권의 안보 불감증이 초래한 결과라며 확전 자제와 철저한 대비 태세 확립을 주문했습니다. 국방부는 해당 사건 직후 군사분계선 일대의 감시 자산을 대폭 증강하고 즉각적인 격추 지침을 하달했다고 해명했습니다. 현재 남북 간의 긴장 수위는 과거 어느 때보다 고조되어 작은 오판이 국지전으로 번질 위험이 큽니다. 정치권의 소모적인 책임 공방보다는 실질적인 드론 요격망 구축이 시급하다는 전문가들의 지적이 뒤따르고 있습니다.`,
  keyTerms:[{term:`비대칭 전력`,explanation:`핵무기, 탄도미사일, 무인기, 사이버 공격 등 재래식 무기 체계로는 정상적인 방어나 대처가 어려운 파괴적인 무기를 뜻합니다.`}],
  history:`북한은 과거부터 여러 차례 소형 무인기를 남측 영공으로 침투시키며 방공망을 시험해 왔습니다. 2024년 이후 정찰 위성 발사와 맞물려 무인기를 활용한 군사적 압박 수위를 더욱 끌어올렸습니다. 우리 군 역시 드론 작전 사령부를 창설하며 맞대응에 나선 바 있습니다.`,
  players:`국회 국방위원회의 여당과 야당 의원들은 안보 이슈를 주도권 싸움의 지렛대로 삼고 있습니다. 국방부 장관과 합동참모본부 의장은 방어 실패에 대한 해명과 후속 조치 마련의 책임을 지고 있습니다. 김정은 국무위원장을 위시한 북한 지도부는 남남갈등을 유발하기 위해 정교한 도발을 기획하고 있습니다.`,
  current:`수도권 상공까지 무인기가 접근했다는 사실이 알려지면서 국민들의 안보 불안감이 극에 달했습니다. 야당의 공세가 거세지면서 국정감사가 파행과 속개를 반복하는 진통을 겪고 있습니다.`,
  outlook:`향후 국방 예산 심사 과정에서 대드론 타격 체계 조기 도입을 위한 예산 증액 논의가 치열해질 전망입니다. 북한이 동계 훈련 기간에 맞춰 추가적인 도발을 감행할 가능성도 예의주시해야 합니다.`,
  sources:[{title:`국감 달군 '무인기 침투'... 野 '안보 무능' vs 與 '전 정권 탓' - 중앙일보`,url:`https://www.joongang.co.kr/article/12345`},{title:`국방부, 드론 방어망 구축 앞당긴다... 예산 확보가 관건 - KBS`,url:`https://news.kbs.co.kr/news/67890`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`11월 미국 중간선거를 앞두고 에너지 가격 폭등이 경합주 표심을 흔들 최대 변수로 부상`,
  metrics:[`휘발유 갤런당 4달러 돌파`,`경합주 여론조사 오차범위 내 1%p 접전`],
  summary:`오는 11월 3일 치러지는 미국 중간선거가 다가오면서 집권 여당인 공화당에 비상이 걸렸습니다. 선거를 불과 보름 남겨둔 시점에서 전국적인 정제유 및 전기요금 급등이 핵심 경합주의 표심을 요동치게 만들고 있기 때문입니다. 특히 펜실베이니아와 미시간 등 이른바 스윙스테이트 지역의 유권자들은 치솟는 생활 물가에 강한 불만을 표출하고 있습니다. 민주당은 트럼프 2기 행정부의 화석 연료 중심 정책과 무리한 관세 부과가 인플레이션을 악화시켰다며 정권 심판론을 맹렬히 펴고 있습니다. 이에 공화당은 지정학적 위기 탓으로 돌리며 전략비축유 추가 방출 카드를 만지작거리고 있습니다. 현재 양당은 상·하원 통제권을 놓고 오차범위 내 초접전을 벌이며 한 치 앞을 내다볼 수 없는 상황입니다. 선거 결과에 따라 글로벌 통상 환경과 에너지 전환 정책의 명운이 완전히 뒤바뀔 수 있습니다.`,
  keyTerms:[{term:`중간선거`,explanation:`대통령 임기 중간에 치러지는 선거로, 하원 전체와 상원 및 주지사의 일부를 선출합니다. 현직 대통령의 국정 운영에 대한 성적표 성격을 띱니다.`}],
  history:`도널드 트럼프 대통령은 재집권 후 자국 우선주의와 전통 에너지 산업 부흥을 강력히 추진해 왔습니다. 그러나 무리한 보호무역주의가 수입 물가를 자극하면서 서민 경제의 부담을 키웠다는 비판에 직면했습니다. 역대 미국 선거에서도 경제 지표와 체감 물가는 승패를 가르는 가장 결정적인 요인이었습니다.`,
  players:`트럼프 행정부와 공화당 지도부는 경제 성과를 부각하며 지지층 결집에 사활을 걸고 있습니다. 하원 탈환을 노리는 민주당은 낙태권 보장과 생활 물가 안정을 내세우며 중도층 공략에 집중합니다. 인플레이션의 직격탄을 맞은 경합주 블루칼라 노동자들의 선택이 승부를 가를 캐스팅 보터입니다.`,
  current:`미국 전역에서 사전투표가 역대급 열기 속에 진행되며 지지층 간의 결집전이 치열하게 전개되고 있습니다. 중동 불안으로 국제 유가가 치솟으며 선거 막판 최대 악재로 작용하고 있습니다.`,
  outlook:`하원은 민주당이 근소한 차이로 다수당을 차지할 것이란 전망이 우세하지만 상원은 여전히 혼전 양상입니다. 중간선거 이후 미국의 보호무역 기조가 수정될지 아니면 더욱 강경해질지 전 세계가 주목하고 있습니다.`,
  sources:[{title:`US Midterms: Energy Prices Become Key Battleground in Swing States - NYT`,url:`https://www.nytimes.com/news/12345`},{title:`미 중간선거 D-15, 물가 폭등에 여당 '발등의 불' - 연합뉴스`,url:`https://www.yna.co.kr/view/67890`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`호르무즈 해협 일대의 군사적 긴장 고조로 글로벌 원유 공급망 위기감 확산`,
  metrics:[`브렌트유 배럴당 95달러 돌파`,`해협 통항 선박 보험료 30% 급등`],
  summary:`중동의 화약고로 불리는 호르무즈 해협 일대에서 무력 충돌 위험이 커지며 글로벌 원유 공급망이 중대한 기로에 섰습니다. 최근 이란의 지원을 받는 무장 단체들이 상선에 대한 위협 비행과 나포 시도를 감행하면서 해상 물류의 동맥경화가 심화되고 있습니다. 이로 인해 국제 유가의 벤치마크인 브렌트유는 단숨에 배럴당 95달러를 돌파하며 100달러 선을 위협하고 있습니다. 통항 선박에 매겨지는 전쟁 보험료마저 급등해 해운사들이 잇따라 우회 항로를 선택하며 물류비 폭등을 부추기고 있습니다. 미국을 비롯한 다국적 연합함대는 항행의 자유를 보장하기 위해 초계 활동을 강화했지만 역부족인 상황입니다. 현재 이스라엘과 주변 적대국 간의 산발적 교전이 휴전 협상에도 불구하고 잦아들지 않으면서 지정학적 리스크가 경제 전반을 짓누르고 있습니다. 에너지 의존도가 높은 한국 등 아시아 국가들의 인플레이션 압력이 더욱 가중될 것이란 우려가 나옵니다.`,
  keyTerms:[{term:`지정학적 리스크`,explanation:`특정 국가나 지역의 정치, 영토, 군사적 갈등이 전 세계 경제나 금융 시장에 미치는 위험을 뜻합니다. 전쟁이나 테러 등이 대표적인 사례입니다.`}],
  history:`호르무즈 해협은 전 세계 해상 원유 물동량의 20% 이상이 통과하는 핵심 요충지입니다. 2023년 말부터 본격화된 이스라엘-하마스 전쟁의 여파가 홍해를 넘어 걸프 해역까지 번졌습니다. 이란은 서방의 제재에 맞서 해협 봉쇄를 무기로 지속적인 벼랑 끝 전술을 구사해 왔습니다.`,
  players:`이란 혁명수비대는 해협 인근의 군사적 통제권을 쥐고 서방을 압박하는 핵심 주체입니다. 미국과 서방 동맹국들은 글로벌 에너지 공급망 보호를 위해 막대한 군사력을 투입하고 있습니다. 사우디아라비아 등 중동의 주요 산유국들은 확전을 우려하며 물밑 중재를 시도하고 있습니다.`,
  current:`주요 해운사들이 중동 기항을 꺼리면서 아시아로 향하는 원유 운송 일정이 줄줄이 지연되고 있습니다. 겨울철 난방 수요 증가를 앞두고 유가 급등세가 실물 경제에 직접적인 타격을 입히기 시작했습니다.`,
  outlook:`이란의 전면적인 해협 봉쇄가 현실화될 경우 국제 유가는 사상 최고치를 경신할 수 있습니다. 미국 중간선거 직전 표심을 의식한 백악관이 전격적인 군사 행동에 나설 가능성도 배제할 수 없습니다.`,
  sources:[{title:`Hormuz Strait Tensions Push Brent Crude Near \$100 - Reuters`,url:`https://www.reuters.com/business/12345`},{title:`호르무즈 긴장 최고조... 한국 경제 물가·환율 '이중고' - 한겨레`,url:`https://www.hani.co.kr/arti/economy/67890`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`정부 및 공공기관, 국산 생성형 AI 솔루션 전면 도입 선언 속 보안 논란 재점화`,
  metrics:[`공공부문 AI 예산 1.5조 원 책정`,`국산 AI 모델 점유율 목표 40%`],
  summary:`정부가 내년부터 행정 및 공공기관의 업무 효율성을 높이기 위해 국산 생성형 AI 솔루션을 전면 도입하겠다고 발표했습니다. 민원 처리, 공문서 초안 작성, 방대한 법령 요약 등 실무 전반에 국산 인공지능을 투입해 디지털 플랫폼 정부를 완성하겠다는 구상입니다. 행정안전부는 이를 위해 내년 공공부문 AI 인프라 구축 예산으로 1조 5천억 원을 편성했습니다. 하지만 대량의 민감한 국민 개인정보와 국가 기밀 데이터가 AI 학습 과정에서 유출될 수 있다는 보안 우려가 거세게 제기되고 있습니다. 보안 전문가들은 퍼블릭 클라우드 대신 기관 내부 서버에 모델을 구축하는 온프레미스 방식의 폐쇄형 AI 도입을 강력히 권고하고 있습니다. 현재 국내 IT 대기업들은 데이터 보안을 담보하는 맞춤형 소형언어모델(sLLM)을 앞다투어 선보이며 치열한 수주전을 벌이고 있습니다. 기술 혁신과 개인정보 보호라는 두 마리 토끼를 어떻게 잡을지가 향후 사업의 성패를 가를 핵심입니다.`,
  keyTerms:[{term:`온프레미스`,explanation:`기업이나 기관이 자체적으로 보유한 전산실 서버에 소프트웨어를 직접 설치해 운영하는 방식을 말합니다. 클라우드에 데이터를 올리지 않아 정보 유출 위험이 적습니다.`}],
  history:`챗GPT가 촉발한 생성형 AI 돌풍 이후, 전 세계 정부는 국가 차원의 업무 효율화를 위해 AI 도입을 서둘렀습니다. 한국 정부도 2024년부터 부분적인 실증 사업을 거치며 공공 부문 AI 적용의 타당성을 검토해 왔습니다. 그 과정에서 잦은 할루시네이션(환각) 현상과 정보 유출 사고가 발생해 가이드라인 마련이 시급했습니다.`,
  players:`행정안전부와 과학기술정보통신부는 공공 AI 도입의 방향성과 예산 집행을 총괄하는 주무 부처입니다. 네이버, KT, LG 등 국내 빅테크 기업들은 자사의 토종 AI 모델을 공공 표준으로 굳히기 위해 경쟁 중입니다. 학계 및 시민단체는 무분별한 데이터 학습이 초래할 프라이버시 침해를 강하게 감시하고 있습니다.`,
  current:`수조 원 규모의 대형 공공 프로젝트 발주가 임박하면서 관련 IT 서비스 업계의 주가와 기대감이 크게 들썩이고 있습니다. 반면 국회에서는 AI 보안 심사 기준을 대폭 강화하는 법안 처리가 쟁점으로 떠올랐습니다.`,
  outlook:`내년 초 첫 시범 기관에 AI 솔루션이 안착하면 전 지자체로의 확산 속도가 폭발적으로 빨라질 것입니다. 도입 초기 발생할 수 있는 대국민 민원 오안내 사고 등 예기치 못한 부작용에 대한 철저한 매뉴얼 정립이 요구됩니다.`,
  sources:[{title:`공공기관 국산 AI 도입 본격화... 데이터 유출 막을 '온프레미스' 부상 - 전자신문`,url:`https://www.etnews.com/12345`},{title:`디지털정부 1.5조 투자... 빅테크 수주 전쟁 막 올랐다 - 매일경제`,url:`https://www.mk.co.kr/news/it/67890`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`스스로 생각하는 차세대 추론형 AI 모델 상용화로 글로벌 지식 노동 시장 대지진`,
  metrics:[`프로그래밍 자동화율 60% 돌파`,`글로벌 에듀테크 기업 주가 평균 20% 급락`],
  summary:`오픈AI를 필두로 한 글로벌 빅테크들이 복잡한 논리 문제를 스스로 해결하는 차세대 추론형 AI 모델을 앞다투어 상용화하며 지식 노동 시장이 근본적인 격변을 맞고 있습니다. 과거의 AI가 확률에 기반해 그럴듯한 문장을 이어 붙였다면, 새 모델은 사람처럼 다단계 논리 구조를 거쳐 수학 증명과 고급 프로그래밍을 완벽에 가깝게 수행합니다. 이로 인해 소프트웨어 개발 현장에서는 초기 코딩 작업의 60% 이상이 자동화되며 주니어 개발자들의 일자리가 심각한 위협을 받고 있습니다. 또한 정답의 논리적 풀이 과정을 투명하게 제시하면서 체그(Chegg) 등 글로벌 온라인 교육 플랫폼과 튜터링 기업들의 주가가 하루아침에 폭락하는 사태가 벌어졌습니다. 현재 전문가들은 이 기술이 제약, 신소재 설계, 금융 리스크 분석 등 고도의 지식 산업 전반을 재편할 것으로 내다보고 있습니다. 반면 극도로 지능화된 AI가 악성 코드나 생화학 무기 설계에 악용될 수 있다는 공포도 함께 커지고 있습니다. 결국 인류는 노동의 가치를 재정의하고 새로운 AI 통제 규범을 만들어야 하는 뼈아픈 시험대에 올랐습니다.`,
  keyTerms:[{term:`추론형 AI`,explanation:`주어진 질문에 곧바로 답을 뱉지 않고, 사람처럼 단계별로 논리적인 사고 과정을 거쳐 복잡한 수학이나 코딩 문제를 풀어내는 진화된 인공지능입니다.`}],
  history:`초기 거대언어모델(LLM)은 방대한 데이터를 외워서 답하는 수준이었으나, 잦은 오류와 수학적 계산의 한계가 명확했습니다. 2024년 말 오픈AI가 선보인 o1(스트로베리) 모델을 기점으로 AI 연구의 패러다임이 규모의 확장(Scaling)에서 추론 능력 강화로 급격히 전환되었습니다. 이후 구글, 메타 등이 경쟁적으로 강화학습을 결합한 모델을 쏟아냈습니다.`,
  players:`오픈AI와 딥마인드는 다단계 논리 탐색 기술의 최전선에서 글로벌 AI 주도권을 다투고 있습니다. 전 세계 수많은 프로그래머와 데이터 분석가들은 자신의 직무가 AI로 대체될지 모른다는 팽팽한 긴장감 속에 놓여 있습니다. 각국 교육 당국은 학생들의 AI 의존도 심화에 대처하기 위해 평가 방식을 서둘러 개편 중입니다.`,
  current:`실리콘밸리의 주요 테크 기업들은 신규 채용을 줄이는 대신 고도화된 AI 코딩 어시스턴트를 대거 도입하고 있습니다. 생성된 추론 과정 자체를 AI가 다시 검증하는 자가 검열 기술이 학계의 뜨거운 감자로 부상했습니다.`,
  outlook:`내년에는 과학 연구 논문을 단독으로 작성하거나 새로운 물질의 분자 구조를 증명해 내는 AI 과학자의 등장이 예상됩니다. 강력한 지능을 지닌 시스템을 어떻게 안전하게 통제할 것인지에 대한 글로벌 서밋이 조만간 개최될 가능성이 큽니다.`,
  sources:[{title:`Reasoning AI Models Upend Tech and Education Jobs - WSJ`,url:`https://www.wsj.com/tech/ai/12345`},{title:`'스스로 생각하는 AI'의 습격... 주니어 개발자 설 곳 잃는다 - 한국경제`,url:`https://www.hankyung.com/it/67890`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`사상 최악의 가을 가뭄과 이상 기후로 글로벌 식량 및 반도체 공급망에 연쇄 타격`,
  metrics:[`대만 지역 강수량 평년 대비 40% 감소`,`국제 밀 가격 톤당 800달러 돌파`],
  summary:`전례 없는 10월의 폭염과 극심한 가을 가뭄 등 이상 기후가 전 세계를 강타하면서 식량과 첨단 산업의 공급망이 동시에 마비될 위기에 처했습니다. 세계 최대 밀 수출국 중 하나인 호주와 남미 지역은 타는 듯한 가뭄으로 수확량이 급감하며 국제 밀 가격이 톤당 800달러를 단숨에 돌파했습니다. 더욱 심각한 것은 세계 최대의 파운드리 생산 기지인 대만마저 저수지 바닥이 드러나며 초정밀 반도체 공장 가동에 차질이 빚어지고 있다는 점입니다. 반도체 생산에는 막대한 양의 초순수가 필수적인데, 용수 공급 제한 조치가 내려지며 생산 라인의 감산이 현실화하고 있습니다. 이로 인해 자동차부터 스마트폰, AI 데이터센터 구축까지 전방위적인 공급망 병목 현상이 재현될 조짐을 보입니다. 현재 각국 정부는 식량 수출 통제에 나서며 각자도생의 보호무역을 한층 강화하는 추세입니다. 자연재해가 단순한 기상 이변을 넘어 글로벌 인플레이션의 새로운 뇌관으로 자리 잡았다는 경고가 잇따르고 있습니다.`,
  keyTerms:[{term:`공급망 병목`,explanation:`생산 시설 가동 중단이나 물류망 마비 등으로 인해 원자재나 부품이 필요한 곳으로 제때 공급되지 못해 경제 전반의 생산이 막히는 현상입니다.`}],
  history:`기후 변화로 인한 엘니뇨와 라니냐 현상이 점차 불규칙해지면서 지구촌 곳곳에서 극단적인 기상 이변이 일상화되었습니다. 특히 2020년대 초반 대만은 심각한 가뭄으로 반도체 공장에 급수차를 동원하는 초유의 사태를 겪은 바 있습니다. 농산물 역시 기후에 가장 취약한 자산으로 수년째 작황 불안에 시달려왔습니다.`,
  players:`대만의 TSMC 등 주요 반도체 제조사들은 공장 가동을 사수하기 위해 해수 담수화 시설 투자를 서두르고 있습니다. 시카고 상품거래소의 곡물 트레이더들은 기상 위성을 분석하며 식량 선물 가격을 가파르게 끌어올리고 있습니다. 개발도상국 서민들은 치솟는 빵과 옥수수 가격으로 직접적인 생계 위협에 처해 있습니다.`,
  current:`주요 곡물 생산국들이 식량 안보를 이유로 잇달아 수출 금지 조치를 발동하며 애그플플레이션(농산물 가격 급등으로 인한 물가 상승) 공포가 확산 중입니다. 애플, 엔비디아 등 팹리스 고객사들은 대만의 감산 소식에 부품 재고 확보를 지시하며 비상 체제에 돌입했습니다.`,
  outlook:`기상 당국은 이러한 비정상적인 건조 국면이 내년 봄까지 장기화할 수 있다고 경고하고 있습니다. 수자원 인프라 확보와 식량 자급률 제고가 전 세계 국가 안보의 가장 치열한 과제로 대두될 것입니다.`,
  sources:[{title:`Extreme Drought Threatens Taiwan Chip Output and Global Food Supply - FT`,url:`https://www.ft.com/climate/12345`},{title:`가을 가뭄의 습격... 반도체 공장 멈추고 빵값 뛴다 - SBS`,url:`https://news.sbs.co.kr/news/67890`}]
}]
},{
  tag:`2026-10-16`,
  label:`2026년 10월 16일 (금)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`코스피, 외국인 자본 이탈 속 3,000선 붕괴 위기... 반도체 수출 둔화 우려`,
  metrics:[`코스피 지수 3,012.45`,`반도체 수출 전년비 4.5% 감소`],
  summary:`15일 국내 코스피 지수가 외국인 투자자들의 대규모 매도세에 밀려 3,000선 붕괴 직전까지 하락했습니다. 이는 글로벌 인플레이션 장기화와 주요 수출품인 메모리 반도체의 수요 둔화 우려가 겹친 결과입니다. 특히 미국 연준의 고금리 기조가 2026년 하반기에도 이어질 것이라는 전망이 지수 하방 압력을 키웠습니다. 삼성전자와 SK하이닉스 등 대형 기술주들이 일제히 약세를 보이며 지수 하락을 주도했습니다. 시장 전문가들은 4분기 기업 실적 발표 전까지 증시 변동성이 극심할 것으로 내다보고 있습니다. 정부는 금융시장 안정을 위해 시장 안정화 조치 가동을 검토 중입니다.`,
  keyTerms:[{term:`지수 하방 압력`,explanation:`주식 시장에서 주가지수가 하락하도록 작용하는 부정적인 요인이나 힘을 뜻합니다. 금리 인상이나 기업 실적 악화 등이 대표적입니다.`}],
  history:`코로나19 이후 풀린 유동성으로 급등했던 증시는 최근 수년간 고금리와 지정학적 리스크로 박스권 장세를 이어왔습니다.`,
  players:`대규모 자본을 움직이는 외국인 투자자와 반도체 수출 비중이 절대적인 한국 정부 및 기업들이 주요 주체입니다.`,
  current:`미국 연준의 금리 인하 기대감이 꺾이면서 신흥국 시장에서 자본이 빠져나가는 현상이 가속화되고 있습니다.`,
  outlook:`11월 예정된 한국은행 금융통화위원회의 금리 결정과 미국의 10월 물가 지표가 증시 방향성을 결정할 핵심 변수가 될 전망입니다.`,
  sources:[{title:`외국인 셀코리아에 코스피 3000선 위협 - 한국경제`,url:`https://www.hankyung.com/news/1`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미 9월 CPI 쇼크... 연준, 11월 추가 금리 인상 가능성 50%대 급등`,
  metrics:[`미국 9월 CPI 전년비 3.7% 상승`,`연준 11월 금리 인상 확률 52%`],
  summary:`미국의 9월 소비자물가지수(CPI)가 시장 예상치를 상회하는 3.7% 상승률을 기록하며 글로벌 금융시장에 충격을 주었습니다. 국제 유가 급등과 주거비 상승이 인플레이션을 다시 끌어올린 주요 원인으로 분석됩니다. 물가 둔화세가 꺾이자 미국 연방준비제도(Fed)가 11월 FOMC에서 기준금리를 추가 인상할 것이라는 우려가 확산되고 있습니다. 시카고상품거래소(CME) 페드워치에 따르면 11월 금리 인상 확률이 하루 만에 50%대로 뛰어올랐습니다. 이에 따라 미 국채 10년물 금리가 급등하고 달러화가 초강세를 보이며 신흥국 통화 가치가 급락했습니다. 월가에서는 고금리 장기화에 따른 경제 연착륙 실패 가능성을 경고하고 나섰습니다.`,
  keyTerms:[{term:`소비자물가지수(CPI)`,explanation:`소비자가 구입하는 상품과 서비스의 가격 변동을 측정하는 지표입니다. 이 수치가 오르면 물가가 올랐다는 뜻으로, 중앙은행의 금리 인상 여부를 결정하는 핵심 기준이 됩니다.`}],
  history:`2022년부터 이어진 연준의 급격한 금리 인상 사이클은 2025년 말 잠시 둔화되는 듯 했으나, 최근 에너지 가격 불안으로 다시 물가 상승 압력을 받고 있습니다.`,
  players:`통화정책을 결정하는 제롬 파월 미 연준 의장과 글로벌 유가를 좌우하는 OPEC+ 국가들이 상황의 열쇠를 쥐고 있습니다.`,
  current:`인플레이션 진압의 마지막 퍼즐로 여겨졌던 서비스 물가가 꺾이지 않으면서 통화당국의 고민이 깊어지고 있는 시점입니다.`,
  outlook:`11월 초로 예정된 미 연준 FOMC 회의에서의 점도표 변화와 제롬 파월 의장의 발언에 전 세계 금융시장의 이목이 쏠려 있습니다.`,
  sources:[{title:`US Inflation Surprises on the Upside - Bloomberg`,url:`https://www.bloomberg.com/news/1`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`글로벌 인공지능 인프라 과잉 투자 우려 확산... 주요 기술주 동반 폭락`,
  metrics:[`나스닥 지수 2.5% 급락`,`주요 AI 인프라 기업 채권 가격 15% 하락`],
  summary:`최근 수년간 천문학적인 자금이 몰렸던 인공지능(AI) 인프라 시장에 대한 거품론이 부각되며 뉴욕증시 기술주들이 일제히 폭락했습니다. 수익성 회수 시점이 불투명한 가운데, 글로벌 AI 클라우드 기업들의 설비투자(CAPEX) 관련 부채 리스크가 도마 위에 올랐습니다. 15일 월가에서는 AI 서버 확충에 과도한 레버리지를 일으킨 기업들의 연쇄 부실 가능성을 경고하는 보고서가 잇따라 발표되었습니다. 이로 인해 나스닥 지수는 2.5% 급락했고, 반도체 칩 설계 기업들과 데이터센터 관련주들이 직격탄을 맞았습니다. 시장은 기업들이 실제 AI 서비스를 통해 창출하는 현금 흐름을 증명할 것을 강력히 요구하고 있습니다. 과열됐던 투자 심리가 냉각되면서 옥석 가리기가 본격화될 전망입니다.`,
  keyTerms:[{term:`설비투자(CAPEX)`,explanation:`기업이 미래의 이윤 창출을 위해 공장, 기계, 데이터센터 등 물리적 자산이나 인프라를 구축하고 유지하는 데 들이는 비용을 의미합니다.`}],
  history:`2023년 챗GPT 열풍 이후 거대 빅테크 기업들은 생성형 AI 시장 주도권을 잡기 위해 데이터센터와 반도체 칩 확보에 앞다투어 막대한 자본을 쏟아부었습니다.`,
  players:`천문학적 투자를 집행한 마이크로소프트, 구글, 아마존 등 빅테크 기업과 이를 지원하는 엔비디아 등 칩 제조사들이 핵심 주체입니다.`,
  current:`막대한 비용 지출 대비 체감할 만한 AI 수익 모델이 뚜렷하게 나오지 않아, 월가 투자자들의 조바심이 한계에 달한 상황입니다.`,
  outlook:`향후 발표될 빅테크 기업들의 3분기 실적 발표에서 AI 관련 실질 매출 성장세가 입증되지 않을 경우 시장 충격이 더 커질 수 있습니다.`,
  sources:[{title:`AI Bubble Fears Resurface as Tech Stocks Tumble - WSJ`,url:`https://www.wsj.com/news/1`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`2026년 재보궐선거 전날, 여야 지도부 수도권 민심 잡기 막판 총력전`,
  metrics:[`재보선 지역구 5곳`,`수도권 여론조사 오차범위 내 접전 3%p`],
  summary:`10월 16일 치러지는 전국 기초단체장 및 국회의원 재보궐선거를 하루 앞두고, 여야 지도부가 최대 승부처인 수도권 지역에서 막판 총력 유세를 펼쳤습니다. 이번 선거는 2027년 대선을 앞두고 수도권 민심의 향배를 가늠할 수 있는 중요한 풍향계로 평가받고 있습니다. 여당은 경제 안정과 국정 동력 확보를 위해 집권당 후보를 지지해 달라고 호소한 반면, 야당은 정부의 경제 실정과 소통 부재를 심판해야 한다며 정권 심판론을 전면에 내세웠습니다. 특히 서울과 경기 지역의 경합 선거구 2곳에서는 후보 간 격차가 오차범위 내인 3%p 이내로 좁혀져 섣불리 결과를 예측하기 어려운 초접전 양상을 보이고 있습니다. 선거 당일 투표율과 중도층 및 2030 세대의 표심이 최종 승패를 가를 핵심 변수입니다.`,
  keyTerms:[{term:`재보궐선거`,explanation:`국회의원이나 시장 등 선출직 공직자가 임기 중 사퇴나 사망, 당선 무효 등의 이유로 자리를 비웠을 때, 그 빈자리를 채우기 위해 다시 치르는 선거입니다.`}],
  history:`지난 2024년 총선 이후 여야 간 치열한 대치 국면이 이어지는 가운데, 이번 선거는 양당 새 지도부 출범 이후 치러지는 첫 전국 단위 선거입니다.`,
  players:`국정 지지율 반등을 노리는 여당 지도부와, 다수당의 지위를 굳히며 차기 대선 유리한 고지를 점하려는 야당 지도부가 맞붙고 있습니다.`,
  current:`치솟는 물가 등 민생 경제 악화와 각종 정치적 논란이 겹치면서 유권자들의 표심이 선거 직전까지 흔들리고 있는 상황입니다.`,
  outlook:`16일 밤 자정 무렵 윤곽이 드러날 선거 결과에 따라 여야 각 당의 내부 역학 관계와 향후 정국 주도권이 크게 요동칠 전망입니다.`,
  sources:[{title:`여야, 재보선 막판 수도권 집중 유세 - 연합뉴스`,url:`https://www.yna.co.kr/news/1`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`북한, 동해선 철도 일부 구간 추가 폭파... 남북 긴장 최고조`,
  metrics:[`군사분계선 이북 200m 지점 폭파`,`대북 경계태세 2단계 격상`],
  summary:`북한군이 15일 오후 군사분계선(MDL) 이북의 동해선 철도 일부 구간을 추가로 폭파하며 남북 간 군사적 긴장이 최고조에 달하고 있습니다. 이는 최근 경의선 도로 폭파에 이은 연속적인 물리적 도발로, 남북 연결 통로를 완전히 차단하겠다는 북한 지도부의 의지가 반영된 것으로 풀이됩니다. 우리 군 당국은 폭파 직후 자위권 차원에서 군사분계선 이남 지역에 경고사격을 실시했으며, 대북 감시 및 경계 태세를 2단계로 격상해 만일의 사태에 대비하고 있습니다. 통일부는 북한의 이러한 행위를 명백한 남북 합의 위반으로 규정하고 강력히 규탄하는 성명을 발표했습니다. 전문가들은 북한이 내부 체제 결속과 미국 대선을 앞두고 존재감을 과시하기 위해 긴장 수위를 의도적으로 끌어올리고 있다고 분석했습니다.`,
  keyTerms:[{term:`군사분계선(MDL)`,explanation:`1953년 정전협정에 따라 남북한의 군사적 충돌을 막기 위해 그은 경계선으로, 흔히 휴전선이라고 부릅니다.`}],
  history:`2000년대 초 남북 화해 무드 속에서 연결되었던 경의선과 동해선 철도 및 도로는 남북 관계 경색과 함께 사실상 방치되어 오다 최근 북한에 의해 파괴되고 있습니다.`,
  players:`강경 노선을 고수하는 김정은 북한 국무위원장과 이에 대응하는 한국 정부 및 한미 연합 방위 체제가 대립하고 있습니다.`,
  current:`북한이 남북 관계를 동족이 아닌 적대적 두 국가 관계로 재규정하면서, 모든 물리적 상징적 연결 고리를 끊어내는 작업을 가속화하고 있습니다.`,
  outlook:`한국 정부는 국제사회와의 공조를 통해 대북 제재를 강화할 방침이며, 추가적인 북한의 국지적 군사 도발 가능성에 예의주시하고 있습니다.`,
  sources:[{title:`북한 동해선 철도 폭파... 남북 단절 가속 - KBS`,url:`https://news.kbs.co.kr/news/1`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`중동 분쟁 확전 우려... 이란-이스라엘 호르무즈 해협 무력 시위`,
  metrics:[`국제 유가 장중 4% 급등`,`미국 핵항모 전단 2개 지역 배치`],
  summary:`중동 지역의 안보 위기가 악화되면서 이란과 이스라엘 간의 직접적인 무력 충돌 가능성이 대두되고 있습니다. 15일 이란 혁명수비대가 글로벌 원유 수송의 핵심 길목인 호르무즈 해협 인근에서 대규모 해상 실탄 훈련을 벌이며 이스라엘과 미국을 겨냥한 무력 시위를 감행했습니다. 이에 맞서 이스라엘은 장거리 미사일 타격 훈련을 실시했으며, 미국은 중동 해역에 핵추진 항공모함 타격군 2개를 전진 배치하며 이란에 강력한 경고 메시지를 보냈습니다. 확전 우려로 인해 글로벌 원유 공급망 차질 우려가 커지면서 국제 유가는 장중 4% 이상 급등하는 불안한 모습을 보였습니다. UN을 비롯한 국제사회는 양측에 즉각적인 자제를 촉구하고 있으나, 휴전 협상은 교착 상태에 빠져 있습니다.`,
  keyTerms:[{term:`호르무즈 해협`,explanation:`페르시아만과 오만만을 연결하는 좁은 바닷길로, 전 세계 원유 물동량의 약 20%가 지나가는 글로벌 에너지 공급의 최대 핵심 요충지입니다.`}],
  history:`수십 년간 이어진 이스라엘과 중동 이슬람 국가 간의 갈등은 최근 주변국 전체로 전선이 넓어지는 양상입니다.`,
  players:`지역 패권을 다투는 이스라엘과 이란, 그리고 동맹국을 지원하며 확전을 막으려는 미국이 사태의 핵심 행위자들입니다.`,
  current:`각국의 강경파가 여론을 주도하면서 양보 없는 치킨 게임이 전개되고 있으며, 우발적인 충돌이 전면전으로 번질 수 있는 임계점에 다다랐습니다.`,
  outlook:`미국의 중재 노력이 실패할 경우 이스라엘의 선제 타격이나 이란의 해협 봉쇄 등 극단적인 시나리오가 현실화될 위험이 상존하고 있습니다.`,
  sources:[{title:`Tensions Rise in Strait of Hormuz - Reuters`,url:`https://www.reuters.com/news/1`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`통계청 발표, 2026년 3분기 출산율 소폭 반등... 현금성 지원 효과 논란`,
  metrics:[`3분기 합계출산율 0.74명`,`육아지원금 예산 20% 증액`],
  summary:`15일 통계청이 발표한 2026년 3분기 인구동향에 따르면, 한국의 합계출산율이 0.74명을 기록하며 전년 동기 대비 소폭 반등했습니다. 이는 최근 정부가 파격적으로 도입한 영유아 가정 대상 대규모 현금성 지원 정책과 육아휴직 의무화 제도의 효과가 일부 나타난 것으로 해석됩니다. 하지만 전문가들은 이 같은 반등이 장기적인 추세 전환인지, 아니면 단기적인 정책 약발에 불과한지를 두고 엇갈린 평가를 내놓고 있습니다. 막대한 국가 재정이 투입된 만큼 예산의 지속 가능성에 대한 우려도 제기되고 있습니다. 청년층은 여전히 치솟는 주거비와 불안정한 고용 환경 등 근본적인 구조 문제가 해결되지 않았다고 지적합니다. 정부는 연말까지 일 가정 양립을 위한 후속 보완 대책을 추가로 발표할 예정입니다.`,
  keyTerms:[{term:`합계출산율`,explanation:`여성 1명이 평생 동안 낳을 것으로 예상되는 평균 출생아 수를 뜻하는 지표로, 국가의 인구 감소나 증가 추세를 판단하는 기본 척도입니다.`}],
  history:`한국은 세계 최저 수준의 출산율을 수년째 기록하며 국가 소멸 위기감까지 대두되었고, 역대 정부들은 이를 해결하기 위해 많은 정책을 시도해왔습니다.`,
  players:`저출산 대책을 주도하는 정부 부처와, 실제 출산과 양육의 주체인 2030 청년 세대 및 기업의 인사 담당자들이 주요 이해관계자입니다.`,
  current:`천문학적인 현금 살포 정책이 한계에 직면했다는 비판 속에서, 최근 육아기 근로시간 단축 등 실질적인 근로 환경 개선 제도가 도입되며 변화를 모색 중입니다.`,
  outlook:`현금성 지원의 정책 효과가 지속되려면 주거 안정과 양질의 일자리 창출이라는 근본적 구조 개혁이 조속히 병행되어야 한다는 목소리가 높습니다.`,
  sources:[{title:`3분기 출산율 0.74명... 반짝 반등인가 - 매일경제`,url:`https://www.mk.co.kr/news/1`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`EU, 아시아산 수입품 탄소국경세 대상 대폭 확대... 韓 수출 비상`,
  metrics:[`탄소국경세 적용 품목 12개 추가`,`아시아 기업 추가 비용 연 30억 유로`],
  summary:`유럽연합(EU) 집행위원회가 15일 탄소국경조정제도(CBAM)의 적용 대상을 기존 철강과 시멘트 등에서 자동차 부품, 전자기기 등 12개 품목으로 대폭 확대하는 개정안을 통과시켰습니다. 이번 조치로 아시아 수출 기업들은 연간 약 30억 유로의 추가 관세 비용을 부담해야 할 것으로 추산됩니다. 특히 대유럽 수출 비중이 높은 한국의 자동차 및 부품, 가전 업계에 비상이 걸렸습니다. EU는 기후변화 대응을 선도하고 역내 산업을 보호하기 위해 탄소 배출량이 많은 수입품에 엄격한 환경 부담금을 매기겠다는 명분을 내세웠습니다. 반면 아시아와 개발도상국들은 이를 친환경을 위장한 새로운 무역 장벽이라며 강력히 반발하고 있습니다. 한국 정부는 즉각 산업계 긴급 간담회를 열고 탄소 배출 저감 기술 지원과 함께 EU와의 직접 협상에 나설 방침입니다.`,
  keyTerms:[{term:`탄소국경조정제도(CBAM)`,explanation:`탄소 배출 규제가 약한 국가에서 생산된 제품을 EU로 수입할 때, 생산 과정에서 배출된 탄소량만큼 세금 형태의 비용을 추가로 물리는 제도입니다.`}],
  history:`EU는 기후 위기 대응을 명분으로 2023년부터 CBAM 시범 운영을 시작했으며, 점진적으로 규제 대상과 강도를 높여오고 있습니다.`,
  players:`환경 기준을 무기로 무역 장벽을 세우는 유럽연합(EU)과, 제조업 중심의 수출 구조를 가진 한국과 중국 등 아시아 국가들이 팽팽히 맞서고 있습니다.`,
  current:`글로벌 친환경 규제가 단순한 환경 보호를 넘어 자국 산업을 보호하기 위한 신보호무역주의의 강력한 무기로 변질되고 있는 상황입니다.`,
  outlook:`오는 11월 열릴 세계무역기구(WTO) 회의에서 탄소국경세의 공정성을 둘러싼 선진국과 신흥국 간의 치열한 외교전이 예상됩니다.`,
  sources:[{title:`EU Expands Carbon Border Tax - FT`,url:`https://www.ft.com/news/1`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`차세대 전고체 배터리 상용화 앞당긴 신소재 발견... 글로벌 과학계 이목 집중`,
  metrics:[`배터리 수명 3배 연장`,`충전 시간 5분 내외로 단축`],
  summary:`글로벌 연구팀이 차세대 전기차의 핵심 부품인 전고체 배터리의 상용화를 획기적으로 앞당길 수 있는 새로운 고체 전해질 신소재를 발견해 과학계의 이목이 집중되고 있습니다. 국제 저명 학술지 네이처에 15일 게재된 논문에 따르면, 이 신소재를 적용할 경우 기존 리튬이온 배터리 대비 화재 위험을 없애면서도 배터리 수명을 3배 이상 늘릴 수 있습니다. 또한 급속 충전 시간을 5분 내외로 단축시켜 전기차 대중화의 가장 큰 걸림돌을 해결할 것으로 기대됩니다. 세계 주요 완성차 업체와 배터리 제조사들은 즉각 해당 기술의 독점권 확보와 상용화 연구를 위한 수천억 원 규모의 합작 투자 계획을 발표했습니다. 이번 기술 혁신은 향후 글로벌 전기차 시장의 패권을 뒤흔들 게임 체인저가 될 전망입니다. 전문가들은 실험실 수준의 성과를 넘어 대량 생산 수율을 맞추는 것이 다음 과제라고 입을 모으고 있습니다.`,
  keyTerms:[{term:`전고체 배터리`,explanation:`배터리 내부에서 전기를 흐르게 하는 물질인 전해질을 기존 액체 대신 고체로 바꾼 배터리입니다. 화재 폭발 위험이 거의 없고 용량을 크게 늘릴 수 있어 꿈의 배터리라 불립니다.`}],
  history:`전기차 화재 사고가 빈발하고 주행거리에 대한 한계가 지적되면서, 안전하고 오래 가는 전고체 배터리 개발은 전 세계 배터리 업계의 오랜 숙원이었습니다.`,
  players:`세계적인 배터리 제조 기술을 보유한 한국 기업들과 막대한 자본으로 추격하는 중국, 원천 기술을 노리는 일본과 미국 대학 연구진들이 치열한 각축전을 벌이고 있습니다.`,
  current:`실험실 수준의 혁신 성과가 연이어 발표되고 있지만, 높은 제조 비용과 대량 생산 공정의 한계라는 벽을 넘기 위해 기술 경쟁이 최고조에 이른 상태입니다.`,
  outlook:`향후 3년 내에 이 신소재를 적용한 상용 전기차 시제품이 시장에 첫 선을 보일 수 있을지 산업계의 기대감이 높아지고 있습니다.`,
  sources:[{title:`Breakthrough in Solid-State Battery Tech - NYT`,url:`https://www.nytimes.com/news/1`}]
}]

  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`IMF, 한국 경제성장률을 3.3%로 상향 조정하며 긍정적 전망 제시`,
  metrics:[`세계 성장률 3.1%`,`한국 성장률 3.3%`],
  summary:`국제통화기금(IMF)이 최신 세계경제전망(WEO)을 통해 2026년 세계 경제 성장률을 3.1%로 소폭 상향 조정했다. 이 중 한국의 성장률 전망치도 기존 수치보다 높아진 3.3%로 상향되었다. 이는 글로벌 인공지능(AI) 열풍과 메모리 반도체 중심의 수출 호조가 경제 전반을 견인한 결과다. 다만 지정학적 리스크로 인한 에너지 가격 상승이 향후 인플레이션 부담으로 작용할 가능성을 지적했다. 세계 평균 물가상승률은 4.7% 수준이 될 것으로 분석됐다. 한국 경제는 기술 수출 호조 속에 긍정적 모멘텀을 맞고 있으나 유가 변동성 대비가 중요해질 전망이다.`,
  keyTerms:[{term:`세계경제전망`,explanation:`국제통화기금(IMF)이 매년 발표하는 보고서로 세계 각국과 글로벌 경제의 성장률, 인플레이션 등을 분석하고 예측한 자료입니다.`}],
  history:`최근 수년간 글로벌 경제는 팬데믹 여파와 고금리 기조 속에서 저성장 압력을 받아왔다. 하지만 AI 산업의 급격한 팽창이 반도체 등 IT 관련 무역을 촉진시켰다.`,
  players:`IMF(국제통화기금)를 비롯해 글로벌 IT 수요를 주도하는 미국과 핵심 부품을 공급하는 한국, 대만 등이 경제 성장의 주요 축으로 얽혀 있다.`,
  current:`한국 반도체 수출이 역대 최고치를 경신하며 경기 반등을 이끄는 가운데, 전반적인 경제 지표가 상향 국면에 진입한 전환점이다.`,
  outlook:`연말에 다가오며 에너지 가격의 추이와 중국 등 신흥국들의 경기 부양책 효과가 글로벌 경제의 추가적인 상승 여부를 결정할 것이다.`,
  sources:[{title:`IMF, 세계 성장률 3.1%로 상향 - 한경타임즈`,url:`https://www.hkhantimes.com/news/12345`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`코스피 외국인 대규모 순매도로 급락하며 매도 사이드카 발동`,
  metrics:[`외국인 대규모 매도`,`코스피 지수 급락`],
  summary:`국내 증시가 외국인 투자자들의 대규모 매도세에 직면하며 코스피 지수가 급락, 매도 사이드카가 발동되는 사태가 벌어졌다. 중국 CXMT 등 글로벌 반도체 수급 우려와 대형 IT 종목들의 변동성 확대가 주요 원인으로 작용했다. 사이드카는 주가가 급변할 때 시장에 미치는 충격을 완화하기 위해 프로그램 매매 호가의 효력을 일시 정지시키는 제도다. 빅테크 실적 발표를 앞두고 경계 심리가 짙어진 가운데, 국내 대형 반도체주 중심의 패닉 셀링이 이어졌다. 금융당국은 시장 불안을 잠재우기 위해 모니터링을 강화하고 있다. 단기적인 변동성이 커짐에 따라 투자자들의 각별한 주의가 요구된다.`,
  keyTerms:[{term:`사이드카`,explanation:`주가지수가 너무 급격히 변동할 때 시장 안정을 위해 선물이나 옵션 등 프로그램 매매의 체결을 5분간 멈추는 일시적 거래 정지 제도입니다.`}],
  history:`과거에도 대외 불확실성이나 주요 산업의 실적 악화 우려가 제기될 때마다 외국인 자금 이탈로 인한 국내 증시의 급등락이 종종 발생해 왔다.`,
  players:`국내 대형주를 대량 보유한 외국인 기관 투자자들과 하락장 방어에 나서는 금융 당국, 그리고 개인 투자자들이 주요 시장 참여자다.`,
  current:`단기 급상승에 따른 차익 실현 욕구와 미국 기술주 실적 불안감이 겹치며 대규모 투매 심리로 번지고 있는 아슬아슬한 시점이다.`,
  outlook:`외국인 투자금의 복귀 여부와 곧 발표될 미국 주요 빅테크 기업들의 3분기 성적표가 국내 증시의 향방을 가를 주요 변수다.`,
  sources:[{title:`국내 증시 변동성 확대, 외국인 팔자에 사이드카 - FN타임즈`,url:`https://www.fntimes.com/news/67890`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`일본 경제 규모, 인도와 영국에 추월당하며 명목 GDP 세계 6위로 하락 전망`,
  metrics:[`명목 GDP 순위 6위 하락`,`수십년 저성장 지속`],
  summary:`일본의 명목 GDP 규모가 인도와 영국에 뒤처지며 세계 6위로 밀려날 것이라는 충격적인 분석이 제기되었다. 지속적인 엔화 가치 하락과 수십 년간 이어진 저성장 구조가 주요 원인으로 꼽힌다. 2010년까지 세계 2위 경제 대국을 유지했던 일본은 이후 중국과 독일에 자리를 내준 데 이어 또다시 순위가 하락하게 되었다. 반면 인도는 풍부한 인적 자원과 고성장을 바탕으로 경제 규모를 빠르게 불리고 있다. 일본 내에서는 산업 경쟁력 약화와 고령화에 대한 근본적인 체질 개선이 시급하다는 목소리가 커지고 있다. 일본 경제의 부활을 위해서는 새로운 성장 동력 발굴이 필수적이다.`,
  keyTerms:[{term:`명목 GDP`,explanation:`물가 상승분을 반영하여 현재 시장 가격으로 계산한 한 국가의 전체 경제 규모로, 국가 간 경제력을 비교할 때 주로 쓰입니다.`}],
  history:`일본은 1990년대 버블 붕괴 이후 장기 침체에 빠졌으며, 인구 고령화와 디플레이션 늪에서 빠져나오기 위해 오랫동안 초저금리 정책을 유지해 왔다.`,
  players:`경제를 부양하려는 일본 정부와 중앙은행, 그리고 압도적 인구를 바탕으로 고도성장을 구가하며 경제 대국으로 부상 중인 인도가 대비된다.`,
  current:`역대급 엔저 현상이 겹치면서 달러로 환산한 일본의 경제 지표가 급락하여, 심리적 지지선이었던 상위권 순위가 크게 무너진 상황이다.`,
  outlook:`엔화 가치 회복 여부와 금리 인상 속도 조절이 중요하며, 로봇 및 AI 등 신산업 육성 성과가 장기적인 경제 규모 반등을 결정할 것이다.`,
  sources:[{title:`일본 GDP, 인도·영국에 밀려 6위 추락 위기 - 동아닷컴`,url:`https://www.donga.com/news/11111`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`청와대, '인구전략 비전선포식' 열고 저출생 및 다문화 대책 전면 개편 예고`,
  metrics:[`합계출산율 하락 심화`,`생애 주기별 예산 재편`],
  summary:`정부가 청와대 영빈관에서 첫 '인구전략 비전선포식'을 개최하고 심각한 인구 위기 극복을 위한 중장기 로드맵을 발표했다. 저출생 및 고령화 문제 해결을 넘어, 다문화 가정과 이주민 포용까지 아우르는 생애 전 주기적 대책이 핵심이다. 생산가능인구 급감에 대응하여 노동 시장의 구조를 개편하고 이민 정책의 문턱을 합리적으로 재조정하는 방안이 논의되었다. 국가 소멸 위기감 속에서 일회성 현금 지원을 넘어선 근본적인 사회 시스템 변화를 목표로 한다. 이번 선포식을 기점으로 정부 각 부처의 인구 정책 컨트롤타워가 본격 가동될 예정이다. 사회적 합의 도출과 예산 확보가 주요 과제로 남아있다.`,
  keyTerms:[{term:`생산가능인구`,explanation:`경제 활동을 할 수 있는 15세부터 64세까지의 인구를 뜻하며, 이 인구가 줄어들면 국가의 경제 활력과 성장 잠재력이 떨어집니다.`}],
  history:`수십 년간 저출생 대책에 천문학적인 예산이 투입되었으나 출산율은 지속적으로 하락하며 사회의 지속 가능성에 대한 위기감이 팽배해졌다.`,
  players:`대통령실과 보건복지부, 교육부 등 관련 부처가 정책을 조율하며, 새롭게 도입될 이민 및 노동 정책의 직접적 당사자인 청년층과 이주민들이 얽혀 있다.`,
  current:`과거 단편적 재정 지원에서 벗어나 국가의 인구 구조 전체를 재설계하려는 강력한 정책적 의지가 선포된 상징적인 순간이다.`,
  outlook:`국회에서의 입법 과정 및 관련 예산 심의가 순조롭게 통과될지가 관건이며, 국민적 공감대를 확보하기 위한 공청회가 잇따를 전망이다.`,
  sources:[{title:`청와대, 인구전략 비전선포식 개최 - 뉴스핌`,url:`https://www.newspim.com/news/22222`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`러시아, 우크라이나 핵심 에너지 인프라 타격… 트럼프 중재 '에너지 휴전' 파기 논란`,
  metrics:[`대규모 드론 및 미사일 공격`,`수십 곳 전력망 마비`],
  summary:`러시아군이 우크라이나 전역의 발전소와 핵심 에너지 인프라를 겨냥한 대규모 드론 및 미사일 공습을 단행했다. 이로 인해 다수의 지역에서 정전이 발생하며 겨울철을 앞두고 심각한 전력난 우려가 고조되고 있다. 볼로디미르 젤렌스키 우크라이나 대통령은 이번 공격이 도널드 트럼프 미국 대통령이 중재하려던 에너지 분야 잠정 휴전 약속을 정면으로 깬 것이라며 강력히 반발했다. 민간 기반 시설 타격에 대한 국제사회의 비판도 거세지고 있다. 우크라이나는 방공망 강화를 위해 서방에 추가적인 무기 지원을 긴급 요청했다. 이번 공습으로 양국 간 평화 협상 가능성은 다시 안갯속으로 빠져들었다.`,
  keyTerms:[{term:`에너지 인프라`,explanation:`전기를 생산하고 공급하는 발전소나 변전소 등 국가의 기능과 국민 생활을 유지하는 데 필수적인 에너지 기반 시설을 말합니다.`}],
  history:`전쟁 발발 이후 겨울이 다가올 때마다 러시아는 우크라이나 국민들의 항전 의지를 꺾기 위해 전력 시설을 표적으로 삼아왔다.`,
  players:`전쟁을 주도하는 러시아의 푸틴 대통령과 방어를 지휘하는 우크라이나 젤렌스키 대통령, 그리고 평화 협상을 중재하려는 미국의 트럼프 행정부가 중심이다.`,
  current:`물밑에서 논의되던 제한적 형태의 에너지 시설 상호 타격 중지 약속이 파기되며, 교전 수위가 극도로 치솟는 양상이다.`,
  outlook:`우크라이나의 대대적인 보복 타격 여부와 미국 등 나토 회원국들의 방공망 긴급 지원 시점이 전황의 주요 변곡점이 될 것이다.`,
  sources:[{title:`러, 우크라 에너지 시설 공습…휴전 위반 논란 - VOA`,url:`https://www.voakorea.com/news/33333`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`트럼프 미국 대통령, 한국에 '알래스카 LNG' 500억 달러 투자 압박 발언 논란`,
  metrics:[`투자 압박 500억 달러`,`에너지 공동 개발`],
  summary:`도널드 트럼프 미국 대통령이 소셜미디어를 통해 한국이 알래스카 액화천연가스(LNG) 개발 프로젝트에 500억 달러를 투자하기로 합의했다고 깜짝 주장하며 논란이 일고 있다. 이에 대해 한국 정부는 아직 구체적인 합의나 투자가 확정된 바 없으며 상업적 타당성 검토가 선행되어야 한다는 신중한 입장을 밝혔다. 트럼프 대통령의 이러한 발언은 동맹국을 상대로 에너지 개발 비용을 분담시키려는 강압적 통상 압박으로 풀이된다. 거액의 투자가 수반되는 만큼 국내 산업계와 정치권에서도 파장이 크다. 한미 동맹의 굳건함과는 별개로 경제 및 통상 분야에서의 치열한 기싸움이 예상된다. 정부의 외교적 대응 능력이 또 한 번 시험대에 올랐다.`,
  keyTerms:[{term:`액화천연가스(LNG)`,explanation:`천연가스를 운반하고 저장하기 쉽도록 매우 낮은 온도로 냉각하여 액체 상태로 만든 친환경 화석 연료입니다.`}],
  history:`트럼프 대통령은 이전 임기 때부터 방위비 분담금 인상이나 대규모 대미 투자 유치를 위해 동맹국에 거친 압박을 가하는 외교 스타일을 보여왔다.`,
  players:`자국 에너지 산업의 부흥을 노리는 트럼프 미국 행정부와, 국익과 경제적 실익을 계산해야 하는 한국의 외교·통상 당국 및 에너지 공기업들이 있다.`,
  current:`정식 협정문이 서명되기도 전에 미국 대통령이 일방적으로 막대한 투자 금액을 기정사실화하면서 한국 정부의 협상 입지가 난처해진 상황이다.`,
  outlook:`실제 실무 협상단 간의 팽팽한 줄다리기가 이어질 예정이며, 이번 사안이 방위비 분담금 등 다른 한미 외교 현안과 연계될지 주시해야 한다.`,
  sources:[{title:`트럼프 알래스카 500억 달러 투자 발언 파장 - 대구MBC`,url:`https://dgmbc.com/news/44444`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`AI 코드 폭증에 앤트로픽, 기존 Git 대신 자체 코드 관리 시스템 '사이언(Scion)' 도입`,
  metrics:[`초대형 코드베이스 수용`,`수천 명 협업 지원`],
  summary:`AI 챗봇 클로드를 개발한 앤트로픽(Anthropic)이 소프트웨어 개발의 표준인 'Git'을 대체할 자체 대규모 버전 관리 시스템인 '사이언(Scion)'을 개발해 도입했다. 인공지능이 생성하고 수정하는 코드의 양이 기하급수적으로 폭증하면서 기존 시스템으로는 한계에 부딪혔기 때문이다. 앤트로픽은 블로그를 통해 수천 명 규모의 협업과 초대형 코드베이스를 감당하기 위해 새로운 인프라가 필요했다고 설명했다. 이는 AI의 발전이 단순히 코드를 짜는 것을 넘어 소프트웨어를 관리하는 기본 도구까지 바꾸고 있음을 시사한다. IT 업계는 이번 행보가 향후 개발자 생태계에 미칠 파장에 촉각을 곤두세우고 있다. AI 주도의 코드 관리 혁신이 시작된 셈이다.`,
  keyTerms:[{term:`버전 관리 시스템`,explanation:`여러 명의 개발자가 코드를 수정할 때 변경 기록을 모두 저장하고, 충돌을 막아주며 과거 상태로 되돌릴 수 있게 해주는 소프트웨어 도구입니다.`}],
  history:`지난 십여 년간 전 세계 소프트웨어 업계는 리누스 토르발스가 만든 분산형 관리 도구인 깃(Git)을 절대적인 표준으로 사용해왔다.`,
  players:`자체 시스템으로 패러다임을 바꾸려는 앤트로픽과, 기존의 깃 생태계를 주도해온 마이크로소프트의 깃허브(GitHub) 등 글로벌 IT 공룡들이 있다.`,
  current:`AI가 초당 수만 줄의 코드를 작성하며 발생하는 데이터 과부하 문제를 해결하기 위해, 기업들이 맞춤형 인프라로 독립을 시도하는 과도기다.`,
  outlook:`오픈AI 등 다른 대형 테크 기업들도 독자적인 개발 인프라 구축에 동참할 것인지, 아니면 깃 기반의 새로운 최적화 기술이 나올지 경쟁이 치열해질 전망이다.`,

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`오픈AI, 신약 개발 등 생명과학 특화 AI 모델 'GPT-로잘린드 디스커버리' 포착`,
  metrics:[`미공개 신규 모델 등장`,`바이오 특화 AI`],
  summary:`글로벌 AI 선두 기업 오픈AI의 API 요금표에서 'GPT-로잘린드 디스커버리(gpt-rosalind-discovery)'라는 미공개 신규 모델이 몰래 등재된 것이 포착되어 화제를 모으고 있다. 전문가들은 모델 이름의 기원이 된 과학자 로잘린드 프랭클린을 감안할 때, 이 모델이 신약 개발이나 단백질 구조 분석 등 바이오 및 생명과학 연구에 특화된 AI일 것으로 추정하고 있다. 공식 발표 전 유출된 이 소식은 제약 업계와 바이오 벤처 기업들에게 큰 기대감을 불어넣고 있다. AI 기술이 언어와 이미지를 넘어 본격적으로 기초 과학과 의료 난제 해결에 뛰어들고 있음을 보여준다. 알파폴드 등 경쟁사들의 바이오 AI에 대항하는 오픈AI의 강력한 승부수로 분석된다. 곧 다가올 헬스케어 혁신이 주목된다.`,
  keyTerms:[{term:`API 요금표`,explanation:`외부 개발자나 기업이 오픈AI의 인공지능 모델을 자신들의 서비스에 가져다 쓸 때 사용량에 따라 내야 하는 가격 정보를 정리한 문서입니다.`}],
  history:`구글 딥마인드의 알파폴드가 노벨상을 수상할 만큼 단백질 구조 예측 분야에서 돌풍을 일으키면서, 주요 빅테크들의 바이오 AI 경쟁이 촉발되었다.`,
  players:`언어 모델의 강자인 오픈AI와 이미 생물학 AI에서 독보적 지위를 다지고 있는 구글 딥마인드, 그리고 신약을 발굴하려는 제약사들이 주축이다.`,
  current:`오픈AI가 자사의 생성형 AI 역량을 기반으로 생명과학 등 도메인 특화 모델 라인업을 은밀하게 확장하고 있음이 문서를 통해 드러난 상태다.`,
  outlook:`향후 공식 출시 행사에서 해당 모델의 구체적인 성능과 연구 파트너십이 공개될 것이며, 제약 산업의 신약 파이프라인 개발 기간이 획기적으로 단축될 것으로 보인다.`,
  sources:[{title:`오픈AI, 생명과학 특화 모델 요금표 유출 - AI타임스`,url:`https://www.aitimes.com/news/66666`}]

  category:`기타 이슈`,

  headline:`사진 한 장으로 폐기물 배출 완료, AI 기반 앱 '가져가' 지자체 본격 실증`,
  metrics:[`공공 AX 서비스 시범운영`,`원스톱 행정 처리`],
  summary:`사진 한 장만 찍으면 대형 폐기물의 종류를 자동으로 판별해주는 인공지능(AI) 기반 앱 '가져가'가 지자체 실증 사업에 돌입했다. 사용자가 버릴 가구나 가전제품을 촬영하면 AI가 품목을 인식하고, 수수료 결제부터 지자체 배출 신고까지 한 번에 원스톱으로 처리해준다. 기존에 주민센터를 방문하거나 스티커를 사서 붙여야 했던 번거로운 절차를 획기적으로 줄여주는 공공 인프라 디지털 전환(AX)의 대표적 사례다. 이번 실증을 통해 시스템의 정확도와 시민 편의성을 검증한 뒤 전국으로 확대 적용될 가능성이 높다. 행정 서비스에 일상화된 인공지능이 도입되며 스마트 시티 구현에 속도가 붙고 있다. 지자체 행정 효율도 크게 개선될 것으로 기대된다.`,
  keyTerms:[{term:`디지털 전환(AX)`,explanation:`기존의 아날로그 방식이나 수동적인 업무 처리 시스템에 인공지능(AI) 등 첨단 디지털 기술을 접목하여 혁신적으로 편리하게 바꾸는 것을 말합니다.`}],
  history:`대형 폐기물을 버릴 때마다 복잡한 신고 절차와 규격별 스티커 구매 등으로 인해 시민들의 지속적인 민원과 불편이 제기되어 왔다.`,
  players:`서비스를 개발한 벤처 기업과 행정 효율화를 추진하는 각 지자체, 그리고 일상생활에서 직접 앱을 사용할 일반 지역 주민들이 주요 대상이다.`,
  current:`시각 지능 AI 기술이 충분히 고도화되면서 단순 인식 수준을 넘어 실제 공공요금 결제와 행정망 연동까지 이루어진 상용화 단계에 접어들었다.`,
  outlook:`특정 지역의 시범 운영이 성공적으로 마무리되면, 재활용품 분류 및 다양한 생활 행정 서비스 영역으로 시각 AI 도입이 더욱 가속화될 것이다.`,
  sources:[{title:`AI로 폐기물 원스톱 배출, 공공 AX 실증 - 한경타임즈`,url:`https://www.hkhantimes.com/news/77777`}]
}]

  headline:`한국은행, 수도권 집값 상승과 가계부채 누적에 따른 금융 불균형 강력 경고`,
  metrics:[`기준금리 3.50% 동결 유력`,`수도권 주택 가격 지속 상승세`],
  summary:`신현송 한국은행 총재가 국정감사에서 수도권의 집값 상승과 가계부채 누적 현상을 금융 불균형이라 지적하며 강하게 경고했습니다. 물가 상승 압력과 부동산 시장의 불안이 확실히 잡히지 않을 경우 추가적인 기준금리 인상 가능성도 열려 있다는 매파적 스탠스를 유지했습니다. 이는 최근 기대되었던 조기 금리 인하 사이클 진입에 찬물을 끼얹는 발언으로 해석됩니다. 정부와 금융당국의 가계대출 관리 압박에도 불구하고 대출 수요가 좀처럼 꺾이지 않으면서 통화당국의 고민이 깊어지고 있습니다. 향후 대출 문턱은 지속적으로 높게 유지될 전망입니다.`,
  keyTerms:[{term:`금융 불균형`,explanation:`부동산이나 주식 등 자산 가격이 실물 경제보다 과도하게 오르고 부채가 급증하여 경제 전반의 안정성이 위협받는 상태를 말합니다.`}],
  history:`장기간 지속된 고금리에도 불구하고 최근 수도권 중심으로 부동산 매수 심리가 살아나며 가계 대출이 다시 급증했습니다.`,
  players:`한국은행, 금융위원회, 주요 시중은행 및 대출 수요자.`,
  current:`한은 총재가 직접 추가 금리 인상 가능성을 시사함으로써 시장의 섣부른 조기 인하 기대감을 강하게 차단하고 있습니다.`,
  outlook:`향후 발표될 가계 대출 증가율과 수도권 아파트 가격 변동 추이에 따라 통화정책의 궁극적인 방향이 결정될 것입니다.`,
  sources:[{title:`한은 추가 금리 인상 시사 및 가계부채 경고 - 겟뉴스`,url:`https://getnews.co.kr/`}]

  metrics:[`미국 10년물 금리 수년래 최고치`,`글로벌 채권 발행 물량 급증`],
  summary:`미국 10년물 및 30년물 등 주요국 장기 국채 수익률이 수년 내 최고 수준에 머물면서 글로벌 자본 시장을 짓누르고 있습니다. 각국 정부가 대규모 재정 적자를 메우기 위해 국채 발행을 늘리며 채권 공급 과잉 현상이 발생한 것이 주된 원인입니다. 여기에 잔존해 있는 인플레이션 리스크가 더해져 투자자들이 장기채 투자를 기피하고 매도세를 보이고 있습니다. 이는 결국 정부와 일반 기업의 자금 조달 비용을 가중시켜 실물 경제 전반의 부담으로 작용하고 있습니다. 금리 인하 기대감마저 후퇴하며 불확실성이 지속되고 있습니다.`,
  keyTerms:[{term:`채권 공급 과잉`,explanation:`정부가 빚을 내기 위해 채권을 너무 많이 발행하여 시장에 채권이 넘쳐나게 되고, 결국 채권의 가치가 떨어지면서 이자(금리)가 오르는 현상입니다.`}],
  history:`팬데믹 이후 각국 정부가 대규모 부양책을 펼치면서 국가 부채가 급증했고, 이를 상환하기 위한 신규 국채 발행 물량이 폭증했습니다.`,
  players:`미국 재무부, 글로벌 채권 투자자 및 주요국 중앙은행.`,
  current:`시장에서는 단기적인 금리 인하 기대가 후퇴하고 장기적인 고금리 환경이 안착될 것이라는 우려 섞인 전망이 지배적입니다.`,
  outlook:`미국의 핵심 물가 지표 발표 결과와 중동의 지정학적 불안 요인에 따라 국채 시장의 변동성이 더욱 확대될 수 있습니다.`,
  sources:[{title:`장기 국채 금리 부담과 채권 시장 - 경제 브리핑`,url:`https://youtube.com/`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`반도체 호황 이면의 그늘, 철강·석유화학 등 전통 제조업 가동률 하락 위기`,
  metrics:[`반도체 외 주력 산업 가동률 하락`,`2040년대 잠재성장률 0%대 진입 경고`],
  summary:`한국 수출이 반도체 부문의 역대급 호황에 힘입어 겉으로는 좋은 성적을 내고 있지만, 내막을 들여다보면 심각한 불균형이 존재합니다. 철강, 석유화학, 배터리 등 한국을 지탱해온 전통 주력 제조업들의 공장 가동률이 하락하고 글로벌 경쟁력이 정체되는 위기 국면에 접어들었습니다. 경제 전문가들은 이를 반도체 착시 현상이라고 지적하며, 국가 전체의 착시를 걷어낼 경우 경제 기초 체력이 약화되었다고 우려합니다. 반도체를 제외하면 향후 2040년대에는 한국의 잠재성장률이 0%대로 추락할 수 있다는 강력한 경고가 나오고 있습니다. 산업 다변화가 절실한 시점입니다.`,
  keyTerms:[{term:`반도체 착시`,explanation:`반도체 산업 단일 부문이 워낙 높은 수출 실적을 기록하여, 다른 주력 산업들의 실적이 악화되고 있는 위기 상황이 겉으로 드러나지 않는 현상입니다.`}],
  history:`한국 경제는 소수의 주력 산업, 특히 반도체에 수출 의존도가 과도하게 집중되어 있는 구조적 약점을 수십 년간 안고 있었습니다.`,
  players:`국내 석유화학 및 철강 기업, 한국개발연구원(KDI), 정부 경제 부처.`,
  current:`중국의 맹렬한 기술 추격과 글로벌 수요 둔화가 맞물리면서 전통 제조업체들의 적자가 눈덩이처럼 누적되고 있습니다.`,
  outlook:`정부 차원의 신성장 동력 발굴과 기존 산업의 선제적인 구조 개편이 지연될 경우 장기적인 저성장의 늪에 빠질 확률이 높습니다.`,
  sources:[{title:`반도체 착시 걷어내면 0%대 성장 - 한국경제`,url:`https://hankyung.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`강경화 주미대사, 국감서 백악관 소통 한계 시인하며 안보 라인 공방 격화`,
  metrics:[`국회 외통위 국정감사 파행`,`여야 안보 라인 쇄신론 충돌`],
  summary:`국회 외교통일위원회 주미한국대사관 국정감사에서 강경화 주미대사의 이례적인 발언이 큰 파장을 낳고 있습니다. 강 대사는 최근 불거진 한미 정보공유 제한 논란에 대해 해결해야 할 가장 어려운 현안이라고 솔직하게 인정했습니다. 특히 백악관 국가안보회의 등 미 고위급 인사들과의 만남에 대해 답답할 정도로 소통이 이뤄지지 않고 있다며 외교적 한계를 시인했습니다. 이에 야당은 대미 외교 라인의 총체적 붕괴를 질타하며 안보 라인 전면 쇄신론을 강하게 제기하고 있습니다. 반면 여당은 외교적 민감성을 고려해 지나친 공세를 자제하라며 엄호에 나서는 등 정치권 공방이 뜨겁습니다.`,
  keyTerms:[{term:`한미 정보공유 제한`,explanation:`가장 긴밀해야 할 동맹국인 한국과 미국 사이에 안보나 군사 분야의 민감한 핵심 기밀 정보가 제대로 교환되지 않고 있다는 의혹입니다.`}],
  history:`최근 한반도를 둘러싼 군사적 긴장이 극도로 고조되는 상황에서, 미국이 한국에 정보 제공을 꺼린다는 불협화음 우려가 꾸준히 제기되어 왔습니다.`,
  players:`강경화 주미대사, 국회 외통위 여야 국회의원들, 미국 백악관 국가안보회의(NSC).`,
  current:`외교 현장의 최고 책임자인 주미대사가 직접 소통의 어려움을 공식석상에서 토로하면서 대미 외교의 취약성이 수면 위로 드러났습니다.`,
  outlook:`국정감사 이후 정부의 외교·안보 라인 책임자들에 대한 야당의 교체 압박이 더욱 거세질 것이며, 미국의 반응도 주목됩니다.`,
  sources:[{title:`강경화 주미대사 국감 발언 논란 - 동아일보`,url:`https://donga.com/`}]

  colorBg:`#fce8e6`,
  headline:`호르무즈 해협 위기 속 미국-이란 휴전 협상 난항, 글로벌 에너지 리스크 고조`,
  metrics:[`7일 단위 한시적 종전안 제안`,`호르무즈 해협 주변 긴장도 상승`],
  summary:`중동 정세의 뇌관인 호르무즈 해협 주변의 군사적 대치를 둘러싼 미국과 이란의 갈등이 돌파구 없는 외교적 교착 상태에 빠졌습니다. 카타르의 중재로 7일 단위 종전안 등 구체적인 물밑 협상이 치열하게 오가고 있지만, 이란 측은 미국의 최근 양보안을 불충분하다며 단칼에 일축했습니다. 트럼프 행정부의 전방위적인 군사·경제적 압박 카드와 이란의 해협 전면 봉쇄 위협이 정면으로 충돌하면서 타협점을 찾지 못하고 있습니다. 전 세계 해상 물동량의 핵심 통로인 이곳의 마찰이 장기화되면서 글로벌 에너지 시장과 유가 상승을 부추기는 심각한 리스크 요인으로 작용하고 있습니다.`,
  keyTerms:[{term:`호르무즈 해협`,explanation:`중동 산유국들의 원유가 전 세계로 수출될 때 반드시 통과해야 하는 폭넓고 전략적인 바닷길로, 글로벌 경제의 목줄과도 같은 곳입니다.`}],
  history:`과거 이란 핵 합의 파기 이후 양국 간 상호 불신과 군사적 도발이 수년간 고조되어 왔으며, 최근 인접 지역의 무력 충돌이 도화선이 되었습니다.`,
  players:`미국 트럼프 행정부, 이란 강경파 최고지도부, 중재에 나선 카타르 정부.`,
  current:`양측 모두 강경한 내부 정치적 지지층의 눈치를 보느라 섣불리 물러서기 힘든 상황이어서 강대강 대치 국면이 이어지고 있습니다.`,
  outlook:`무력 충돌 확전을 막기 위한 유럽 연합 및 주변 아랍 국가들의 추가적인 중재 외교 결과와 이에 따른 국제 유가 변동을 예의주시해야 합니다.`,
  sources:[{title:`미국-이란 종전 외교 교착 상태 - AP News`,url:`https://apnews.com/`}]

  colorBg:`#fce8e6`,
  headline:`러시아의 우크라이나 에너지 인프라 연쇄 파괴, 미국의 추가 지원은 미온적`,
  metrics:[`우크라이나 전국 전력망 대규모 피해`,`미국 내 우크라이나 지원 반대 여론 확산`],
  summary:`혹독한 겨울을 앞두고 러시아가 우크라이나의 핵심 에너지 인프라 시설을 집중적으로 타격하며 전황을 자신들에게 유리하게 이끌려 하고 있습니다. 반면 젤렌스키 우크라이나 대통령이 트럼프 미국 대통령과 긴급 회담을 가졌음에도 불구하고, 미국의 대규모 추가 무기 지원이나 패트리어트 미사일 조기 인도 약속은 여전히 매우 미온적인 상태에 머물러 있습니다. 미국 내에서는 다가오는 중간선거와 유가 안정 등을 이유로 끝이 보이지 않는 해외 군사 지원에 대한 피로감과 반대 목소리가 높아지고 있습니다. 당장 민간의 생존과 방어 역량을 유지해야 하는 우크라이나 정부의 발등에는 큰 불이 떨어졌습니다.`,
  keyTerms:[{term:`에너지 인프라`,explanation:`국가 운영과 국민 생활에 필수적인 전기를 생산하고 공급하는 발전소나 송전탑 같은 핵심 기반 시설들을 뜻합니다.`}],
  history:`전쟁 장기화로 양측의 무기 소모전이 극심한 가운데, 매년 겨울마다 러시아는 추위를 무기화하여 전력망 공격을 감행해왔습니다.`,
  players:`러시아 푸틴 정권, 우크라이나 젤렌스키 정부, 미국 의회 및 백악관.`,
  current:`미국 내부의 팽팽한 정치 상황과 맞물려 그동안 초당적이었던 우크라이나에 대한 군사 지원 여론이 점차 분열되는 양상을 띠고 있습니다.`,
  outlook:`겨울철 민간 피해 최소화를 위해 유럽 동맹국들이 미국의 빈자리를 즉각적으로 메워줄 수 있을지가 남은 전쟁의 주요 향배를 가를 것입니다.`,
  sources:[{title:`겨울 앞둔 우크라이나, 인프라 파괴 지속 - AP News`,url:`https://apnews.com/`}]

  headline:`통신사와 주요 대기업, 전력 확보 위해 기가와트급 AI 데이터센터 구축 사활`,
  metrics:[`대규모 데이터센터 GW급 전력 필요`,`빅테크 및 통신 3사 집중 투자`],
  summary:`국내 통신 3사와 주요 대기업들이 미래 산업의 패권을 쥐기 위해 앞다투어 초대형 AI 데이터센터 구축 프로젝트에 돌입하며 천문학적인 투자를 단행하고 있습니다. 생성형 인공지능 시대가 열리면서 필수 기반 시설인 데이터센터의 선점이 기업 생존의 열쇠가 되었기 때문입니다. 하지만 막대한 양의 24시간 전력 소모와 거대한 냉각 시스템 구축이라는 기술적, 물리적 장벽에 부딪혀 있습니다. 특히 부지 선정 과정에서 필수적인 송전망 부족 문제와 지역 주민들의 님비(NIMBY) 갈등 등 심각한 사회적 화두도 떠오르고 있어 정부 차원의 전력 인프라 정비가 다급해졌습니다.`,
  keyTerms:[{term:`AI 데이터센터`,explanation:`인공지능 모델을 훈련시키고 거대한 연산 작업을 처리하기 위해 최첨단 고성능 서버 컴퓨터들을 집중적으로 모아놓은 특수 건물입니다.`}],
  history:`챗GPT 열풍 이후 미국의 글로벌 빅테크들이 자체 데이터센터 확장에 천문학적 자본을 쏟아부으면서 국내 기업들 역시 인프라 확보에 뛰어들었습니다.`,
  players:`SK, 네이버, 통신 3사 등 IT 기업, 전력을 공급하는 한국전력공사, 데이터센터 인근 지자체 주민들.`,
  current:`기업들이 데이터센터를 지을 충분한 자본이 있어도, 국가 전체의 송전망이 부족하여 제때 전기를 공급받지 못해 착공을 늦추는 사례가 속출하고 있습니다.`,
  outlook:`친환경 냉각 기술 고도화 및 국가 단위의 전력 송전망 확충 특별법 통과 여부가 대한민국 인공지능 산업 발전 속도를 좌우할 것입니다.`,
  sources:[{title:`AI 데이터센터와 전력 인프라 대란 - 통신일보`,url:`https://koit.co.kr/`}]

  category:`기타 이슈`,

  headline:`마이크로소프트, 엔비디아 탈피 위한 자체 AI 칩 'Maia 300' 전격 공개`,
  metrics:[`3세대 커스텀 AI 가속기 발표`,`클라우드에 수백만 개 단위 투입`],
  summary:`마이크로소프트가 차세대 인공지능 전용 가속기 칩인 마이아 300을 전격적으로 공개하며 기기 하드웨어 독립을 선언했습니다. 이는 나날이 폭발적으로 증가하는 인프라 구축 비용을 대폭 줄이고 현재 엔비디아에 거의 절대적으로 의존하고 있는 부품 공급망 리스크를 털어내기 위한 강력한 생존 전략입니다. 마이크로소프트는 내년부터 이 자체 칩을 자사 클라우드 인프라에 수백만 개 단위로 쏟아부어 각종 인공지능 코딩 및 에이전트 서비스 구동에 즉각 사용할 계획입니다. 이로써 하드웨어와 소프트웨어를 모두 장악하려는 빅테크 간의 수직계열화 경쟁이 한층 더 맹렬해질 전망입니다.`,
  keyTerms:[{term:`수직계열화`,explanation:`어떤 소프트웨어나 서비스를 만들 때 남의 회사 칩이나 기계에 의지하지 않고 부품 설계부터 제작, 서비스까지 한 회사가 모두 다 해내는 방식을 뜻합니다.`}],
  history:`엔비디아가 AI 칩 시장을 사실상 독점하면서 공급 부족과 가격 폭등이 발생하자, 거대 IT 기업들은 살길을 찾기 위해 수년 전부터 자체 칩을 개발해왔습니다.`,
  players:`마이크로소프트, 시장 지배자 엔비디아, 그리고 반도체를 대신 만들어주는 파운드리 기업들.`,
  current:`세계 최대의 소프트웨어 기업이었던 마이크로소프트가 최고 수준의 하드웨어 설계 역량까지 증명하면서 시장의 판도가 크게 요동치고 있습니다.`,
  outlook:`마이아 300이 실제로 현장에서 강력한 성능과 극강의 비용 효율을 증명해 낸다면, 철옹성 같았던 엔비디아의 독점 체제에 적지 않은 균열이 생길 수 있습니다.`,
  sources:[{title:`MS 차세대 자체 AI 칩 Maia 300 공개 - Reuters`,url:`https://investing.com/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`폭발적 AI 발전 속도, 독립 규제 요구하는 실리콘밸리 내전 양상 격화`,
  metrics:[`유럽연합 AI Act 기반 자료 강제 요구`,`미국 내 30곳 이상 빅테크 대상 감사 논의`],
  summary:`하루가 다르게 진화하는 인공지능 기술의 완전한 통제권을 두고 실리콘밸리 엔지니어들과 빅테크 경영진, 그리고 각국 규제 당국 간의 이념 갈등이 극에 달하고 있습니다. 오픈AI와 딥마인드 출신의 저명한 엔지니어들은 최근 미 의회 청문회에 출석해 회사들이 이윤을 위해 맹목적으로 위험한 기술을 속도전으로 내놓고 있다며 강력한 독립 감사 제도의 강제적 도입을 거듭 촉구했습니다. 반면 메타 등을 필두로 한 가속 진영은 어설픈 잣대가 혁신의 싹을 자른다며 규제 법제화에 격렬히 저항하고 있습니다. 그 사이 유럽연합은 세계 최초의 관련 법을 들이밀며 주요 기술 기업들을 압박하기 시작했습니다.`,
  keyTerms:[{term:`독립 감사`,explanation:`인공지능 모델이 세상에 나오기 전에 기술을 개발한 회사의 입김이 전혀 닿지 않는 제3의 전문 외부 기관이 위험성을 철저하게 따져보고 허가하는 제도입니다.`}],
  history:`초거대 AI의 지능이 상상을 초월하는 속도로 발전하면서 기술이 인류를 멸망시킬 수 있다는 파멸론과 통제가 오히려 해롭다는 가속론이 첨예하게 대립해 왔습니다.`,
  players:`안전을 외치는 진영(일부 핵심 기술자들), 성장을 우선시하는 거대 빅테크 기업들(메타 등), 강력한 규제를 주도하는 유럽연합.`,
  current:`단순한 학술 논쟁을 넘어 실제 국가 단위의 통제 법안이 속속 만들어지는 단계에 돌입하면서 시장 주도권을 사수하려는 기업들의 강력한 로비가 진행 중입니다.`,
  outlook:`혁신과 안전의 아슬아슬한 줄다리기 속에서, 미국 정부가 유럽 수준의 강력한 강제 규제를 채택할 것인지 여부가 미래 AI 산업 지형을 결정지을 최대 분수령입니다.`,
  sources:[{title:`통제권 논쟁과 규제 격화 - AP News`,url:`https://apnews.com/`}]
}]

  label:`2026년 10월 12일 (월)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`공정거래위원회, 15조 원 규모 기초 식자재 가격 담합 적발 및 2조 원대 과징금 부과`,
  metrics:[`담합 관련 매출 15조 원`,`누적 과징금 2조 원`],
  summary:`공정거래위원회가 국민 밥상 물가와 직결된 설탕, 밀가루, 전분 등 기초 식자재 시장에서 초대형 가격 담합을 적발했습니다. 이번 담합에 연루된 관련 매출액은 무려 15조 원에 달하며, 적발된 주요 제조사들에게 부과된 과징금 총합은 2조 원을 돌파했습니다. 삼양사와 CJ제일제당 등 주요 4대 원재료 제조사들이 과징금 상위권을 모두 차지하며 충격을 주었습니다. 이들 기업 대표들은 국정감사에 출석해 공식 사과하고 관련 협회 탈퇴를 선언하며 재발 방지를 약속했습니다. 하지만 감경 조치를 받은 실제 과징금 부과율이 매출 대비 11퍼센트 수준에 불과해 솜방망이 처벌이라는 비판이 제기되고 있습니다. 이에 따라 국회에서는 기업들의 불공정 행위를 근절하기 위해 징벌적 손해배상제 도입 논의가 급물살을 타고 있습니다. 소비자 단체들은 담합으로 얻은 부당 이익을 전면 환수해야 한다며 목소리를 높이고 있습니다.`,
  keyTerms:[{term:`징벌적 손해배상제`,explanation:`기업이 악의적인 불법 행위로 피해를 주었을 때, 실제 피해액보다 훨씬 큰 금액을 배상하도록 강제하여 유사 범죄의 재발을 막는 제도입니다.`}],
  history:`국내 독과점 구조의 기초 식자재 시장에서는 오랜 기간 암묵적인 가격 인상 관행이 존재해왔습니다.`,
  players:`공정거래위원회와 삼양사, CJ제일제당 등 대형 원재료 제조사들, 그리고 피해를 입은 소비자들이 주요 관계자입니다.`,
  current:`국정감사를 통해 대규모 담합 실태가 낱낱이 밝혀지며 국민적 공분이 최고조에 달한 상황입니다.`,
  outlook:`국회에서 집단소송제 및 강력한 배상 법안이 통과될지, 그리고 기업들이 실제 가격 인하 조치를 취할지 주목됩니다.`,
  sources:[{title:`공정위 제당·제분 담합 제재, 과징금 폭탄 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`기초 식자재 담합 2조원 과징금 철퇴 - 한국경제`,url:`https://www.hankyung.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`용인 반도체 클러스터 통합용수관로 갈등 해소를 위한 용수공급 지역상생협의체 첫 회의 불발`,
  metrics:[`용수관로 길이 24.7km`,`배후도시 요구 3만 호 규모`],
  summary:`경기 광주시를 관통하는 용인 첨단 시스템반도체 국가산업단지 통합용수관로 설치를 두고 지자체 간 갈등이 표면화되었습니다. 약 24.7km에 달하는 대규모 용수관로가 광주시를 지나게 되면서, 중첩 규제로 피해를 입어온 지역 주민들의 반발이 커졌습니다. 이에 국토교통부와 지자체, 삼성전자 및 SK하이닉스가 참여하는 용수공급 지역상생협의체가 공식 출범하여 첫 회의를 열었습니다. 광주시는 상수원 보호구역 등 수도권 규제 완화를 통해 3만 호 규모의 스마트 배후도시 조성을 강력히 요구하고 있습니다. 그러나 국토교통부는 난개발 우려와 형평성을 이유로 규제 완화에 신중론을 고수하여 1차 합의는 최종 무산되었습니다. 국가 첨단산업의 핵심 인프라 구축이 지연될 위기에 처하자 정부 부처의 중재 능력이 시험대에 올랐습니다. 향후 실무진이 배석하는 2차 회의 결과에 따라 반도체 클러스터의 전반적인 추진 일정이 좌우될 전망입니다.`,
  keyTerms:[{term:`지역상생협의체`,explanation:`국가적 대규모 개발 사업 추진 시, 예상되는 지역 간 갈등과 환경 피해를 조율하고 보상 및 발전 방안을 논의하기 위해 이해관계자들이 모여 만든 공식 협의 기구입니다.`}],
  history:`용인 반도체 클러스터 조성 계획 발표 이후, 인프라 시설이 통과하는 인접 지자체들이 환경 피해와 규제로 인한 불만을 꾸준히 제기해왔습니다.`,
  players:`경기 광주시, 국토교통부, 그리고 산단을 조성하는 삼성전자와 SK하이닉스가 핵심 이해당사자입니다.`,
  current:`광주시는 배후도시 조성을 위한 규제 완화를 굽히지 않고 있으며, 국토부는 불가 입장을 보이면서 협상이 교착 상태에 빠졌습니다.`,
  outlook:`이달 말 열릴 예정인 2차 회의에서 구체적인 타협안이 도출되지 않으면 반도체 클러스터 가동 일정에 심각한 차질이 발생할 수 있습니다.`,
  sources:[{title:`광주시-용인 반도체 용수 상생협의체 1차 회의 이견만 - 경기일보`,url:`https://www.kyeonggi.com/`},{title:`반도체 용수관로 갈등, 배후도시 조성이 관건 - 오마이뉴스`,url:`https://www.ohmynews.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`EU와 중국, 무역 전면전 피하며 중국산 하이브리드 차량 수출 절반 감축 전격 합의`,
  metrics:[`수출 감축률 50%`,`중국산 점유율 25%`],
  summary:`유럽연합과 중국이 무역 및 투자 고위급 회담을 열고 중국산 하이브리드 차량의 대유럽 수출을 대폭 줄이기로 합의했습니다. 유럽연합이 순수전기차에 최대 35.3퍼센트의 추가 상계관세를 매기자 중국 업체들이 관세가 낮은 하이브리드 차량 수출로 우회하면서 유럽 시장 점유율이 25퍼센트 안팎까지 폭등했습니다. 이에 유럽 자동차 업계의 위기감이 고조되자, 양측은 향후 4년간 중국산 하이브리드 차량 수입 물량을 기존 예상치 대비 50퍼센트 이하로 대폭 축소하는 저율관세할당 방식을 도입하기로 했습니다. 대신 유럽연합은 일방적인 세이프가드 발동을 유예하고, 중국은 희토류 수출 허가 등 일부 무역 장벽을 완화하는 조건표를 주고받았습니다. 이번 합의로 양국 간 정면충돌과 무역 전쟁은 일시적으로 피하게 되었습니다. 하지만 유럽에서 막힌 중국의 초저가 자동차 물량이 한국을 비롯한 타국 시장으로 쏟아질 수 있다는 풍선 효과에 대한 우려도 커지고 있습니다.`,
  keyTerms:[{term:`저율관세할당`,explanation:`특정 품목의 수입 물량을 정해놓고, 그 한도 내에서는 낮은 관세를 적용하지만 한도를 초과하는 물량에 대해서는 매우 높은 관세를 매겨 수입량을 조절하는 무역 제도입니다.`}],
  history:`유럽연합이 자국 자동차 산업 보호를 위해 중국산 순수전기차에 고율의 관세 장벽을 세우면서 양측의 무역 갈등이 시작되었습니다.`,
  players:`수출길을 확보하려는 중국 상무부와 역내 산업 붕괴를 막으려는 유럽연합 집행위원회 소속 통상 대표들입니다.`,
  current:`상계관세 제재를 우회한 하이브리드 차량의 범람을 막기 위해 쿼터제 방식의 타협안을 긴급히 도출해낸 상태입니다.`,
  outlook:`향후 4년간 설정된 수입 쿼터가 철저히 지켜질지, 그리고 풍선 효과로 인해 주변국 자동차 시장에 어떤 타격이 올지 관건입니다.`,
  sources:[{title:`중국산 하이브리드 EU 수출 50% 줄인다 - 조선일보`,url:`https://www.chosun.com/`},{title:`EU-중국 무역전쟁 휴전, 한국엔 불똥 튈까 - 이데일리`,url:`https://www.edaily.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 정부, 한국 대북 정보 체계의 동맹 기준 준수 공개 압박하며 정보 공유 일부 제한`,
  metrics:[`기밀 유출 사례 1건`,`사이버 실무그룹 배제 1건`],
  summary:`미국 백악관과 국무부가 한국의 대북 정보 취급 및 방첩 체계에 우려를 표하며 한미 동맹의 기준 준수를 공개적으로 요구해 논란이 일고 있습니다. 발단은 지난 3월 통일부 장관이 북한의 우라늄 농축시설 관련 한미 연합 기밀을 국회에서 공개 언급하면서 시작되었습니다. 이후 미국은 민감한 대북 정보의 공유를 일부 제한하기 시작했으며, 최근에는 북한 사이버 위협 대응 실무그룹 회의에서 한국 국가정보원을 배제하는 강수를 두었습니다. 미국 당국자들은 서면 질의를 통해 수십 년간 이어져 온 정보 보안 기준을 한국 정부가 엄격히 지켜줄 것을 공개적으로 촉구했습니다. 이에 대해 국정원과 국방부는 특정 기밀 외에 전반적인 안보 정보 공유는 정상적으로 이루어지고 있다며 진화에 나섰습니다. 하지만 한미 군사 공조의 핵심인 대북 정보망 보호에 균열이 생겼다는 지적이 나오면서, 안보당국의 신뢰 회복 조치가 시급한 과제로 떠올랐습니다.`,
  keyTerms:[{term:`방첩 체계`,explanation:`적국이나 외부 세력이 자국의 국가 기밀을 탐지하거나 훔쳐가는 것을 막고, 스파이 활동을 색출하여 국가 안보를 지키는 전반적인 보안 및 방어 시스템을 말합니다.`}],
  history:`한미 양국은 북한의 군사 동향을 실시간으로 감시하기 위해 최고 수준의 보안을 전제로 민감한 첩보 자산을 공유해왔습니다.`,
  players:`기밀 유출을 경계하는 미국 국방 및 정보 당국과 대응에 나선 한국 국가정보원 및 국방부가 대립각을 세우고 있습니다.`,
  current:`미국 측이 유출 방지를 위해 일부 민감 정보 제공을 늦추거나 배제하는 등 한국 정보당국을 향한 무언의 압박을 가하고 있습니다.`,
  outlook:`한국 정부가 정보 보안 프로세스를 재정비하여 미국의 신뢰를 단기간에 회복하고 중단된 정보 공유를 정상화할 수 있을지가 핵심입니다.`,
  sources:[{title:`미, 한국 대북 정보 취급 기준 준수 공개 압박 - 동아일보`,url:`https://www.donga.com/`},{title:`한미 정보망 균열 조짐... 국정원 회의 배제 논란 - 매일경제`,url:`https://www.mk.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`김여정 북한 노동당 부부장, 10일 새 5건의 대남 비난 담화 쏟아내며 남북 관계 단절 위협 최고조`,
  metrics:[`비난 담화 발표 5건`,`담화 집중 기간 10일`],
  summary:`김여정 북한 노동당 부부장이 최근 열흘 동안 무려 5건의 대남 비난 담화를 연속으로 발표하며 대남 공세 수위를 극한으로 끌어올리고 있습니다. 김 부부장은 우리 정부의 대북 의료장비 지원 사업 추진에 대해 변종된 정치적 도발이자 제2의 광대극이라며 원색적인 비난을 퍼부었습니다. 앞서 발생한 비무장지대 지뢰 폭발 사건을 두고 우리 군이 북한 소행 가능성을 제기하자, 명백한 남측의 자작극이라고 주장하며 무력 보복을 위협하기도 했습니다. 특히 9일 발표한 서면입장에서는 김정은 국무위원장의 위임을 내세워 한국을 철저히 외면하고 무시하겠다며 남북 관계의 완전한 단절을 재확인했습니다. 이러한 연쇄 담화는 한미 연합훈련과 국제원자력기구의 비핵화 요구에 맞서 북한의 핵보유국 지위를 영구화하려는 의도로 분석됩니다. 우리 정부는 북한의 억지 주장에 일일이 대응하지 않겠다면서도 접경지역의 경계 태세를 최고 수준으로 격상했습니다.`,
  keyTerms:[{term:`광대극`,explanation:`본래 남을 웃기기 위해 우스꽝스럽게 꾸미는 연극을 뜻하나, 여기서는 상대방의 진지한 제안이나 행동을 가식적이고 터무니없는 속임수라며 조롱할 때 쓰는 멸칭입니다.`}],
  history:`북한은 지속적인 미사일 도발과 오물 풍선 살포 등을 통해 남북 간 긴장을 고조시키며 한반도 정세를 불안하게 만들어왔습니다.`,
  players:`도발 수위를 조절하는 북한 김정은 정권의 스피커 김여정 부부장과 확전을 막으려는 한국 군 당국이 대치 중입니다.`,
  current:`북한은 대외적 고립을 정당화하고 내부 결속을 다지기 위해 모든 책임을 한국과 미국에 떠넘기는 담화전을 펼치고 있습니다.`,
  outlook:`북한이 언어적 위협을 넘어 서해 북방한계선이나 접경지역에서 기습적인 국지 도발을 감행할 가능성이 매우 높아 예의주시해야 합니다.`,
  sources:[{title:`김여정, 대남 비난 10일간 5건 연속 포화 - 한겨레`,url:`https://www.hani.co.kr/`},{title:`지뢰 도발 자작극 몰이부터 의료지원 비난까지 - MBC`,url:`https://imnews.imbc.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국과 러시아, 제재 우회한 디젤 긴급 공급 협정 체결로 우크라이나 및 국제사회 강력 반발`,
  metrics:[`디젤 공급량 일일 200만 배럴`,`국제 유가 변동률 4% 하락`],
  summary:`미국 정부가 에너지 가격 안정화를 명분으로 러시아와 디젤 연료 긴급 수입을 위한 비밀 협정을 체결한 사실이 밝혀져 국제적 파장이 일고 있습니다. 이번 협정으로 미국은 경제 제재를 우회하여 일일 200만 배럴 규모의 러시아산 디젤을 제3국을 통해 간접 수입하게 되었습니다. 글로벌 에너지 공급망 차질로 인한 물가 폭등을 억제하려는 미국 행정부의 고육지책이라는 평가가 지배적입니다. 소식이 전해지자마자 국제 디젤 가격은 즉각 4퍼센트 넘게 하락하며 시장의 우려를 불식시켰습니다. 그러나 우크라이나 정부는 미국의 이중적인 태도가 러시아의 전쟁 자금줄을 연장해주는 꼴이라며 강력한 배신감을 표출했습니다. 유럽 주요 동맹국들 역시 대러시아 경제 제재의 대의명분이 무너졌다며 미국의 단독 행동에 깊은 유감을 공식 성명으로 냈습니다. 미국 내에서도 국익과 도덕성 사이의 우선순위를 두고 정치권의 맹렬한 공방이 이어지고 있습니다.`,
  keyTerms:[{term:`경제 제재`,explanation:`국제법이나 평화를 위반한 특정 국가에 대해 다른 국가들이 무역, 금융 거래 등을 강제로 제한하여 경제적인 고통을 주고 정책 변화를 압박하는 외교적 수단입니다.`}],
  history:`우크라이나 침공 이후 서방 국가들은 러시아의 자금줄을 차단하기 위해 원유 및 천연가스 수출을 철저히 틀어막는 제재를 이어왔습니다.`,
  players:`물가 안정이 시급한 미국 정부, 제재망을 뚫고 싶은 러시아, 그리고 배신감을 느끼는 우크라이나 및 유럽 동맹국들입니다.`,
  current:`겨울철을 앞두고 치솟는 에너지 물가를 잡기 위해 미국이 암묵적인 금기를 깨면서 동맹국 간의 균열이 발생하고 있습니다.`,
  outlook:`이번 조치가 기존의 단일한 대러시아 제재 전선에 구멍을 낼지, 아니면 단기적인 비상 대응으로 끝날지 국제사회의 비판적 주시가 계속될 것입니다.`,
  sources:[{title:`미, 러시아산 디젤 200만 배럴 우회 수입 파장 - 중앙일보`,url:`https://www.joongang.co.kr/`},{title:`동맹국 우려에도 에너지 가격 잡기 택한 미국 - KBS`,url:`https://news.kbs.co.kr/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`대구 북구 32년 된 노후 상가건물 2층 천장 전면 붕괴 사고로 노인 등 38명 무더기 부상`,
  metrics:[`부상자 38명`,`건물 연식 32년`],
  summary:`대구광역시 북구 관음동에 위치한 4층 상가건물에서 내부 천장 마감재가 갑자기 무너져 내리는 대형 사고가 발생했습니다. 사고 당시 2층 공실에서는 임대 업체가 노인들을 대상으로 생활용품 홍보 행사를 진행 중이어서 인파가 밀집해 있었습니다. 갑작스러운 붕괴로 현장에 있던 66명이 긴급 대피하는 소동이 벌어졌으며, 잔해에 깔린 38명이 크고 작은 경상을 입어 병원으로 이송되었습니다. 붕괴된 건물은 준공된 지 32년 차에 접어든 노후 건축물이었지만, 연면적 기준상 소규모 건물로 분류되어 지자체의 정기 안전점검 대상에서 철저히 제외되어 있었습니다. 경찰 조사 결과 기존 천장 마감재가 낡아 여러 겹 덧대어진 불안정한 상태에서 행사 업체가 무거운 LED 조명 10여 개를 추가로 매달면서 하중을 버티지 못한 것으로 추정됩니다. 이번 참사를 계기로 법적 안전점검 사각지대에 방치된 노후 소규모 상가건물에 대한 전수조사와 규제 강화 목소리가 커지고 있습니다.`,
  keyTerms:[{term:`안전점검 사각지대`,explanation:`법적인 규제나 행정력의 한계로 인해 정기적인 시설물 점검 시스템이 미치지 못하여 사고 위험에 무방비로 노출된 구역이나 대상을 뜻합니다.`}],
  history:`현행법상 일정 규모 이상의 대형 건축물에만 정기 안전점검 의무가 부과되어, 영세한 중소형 상가들은 점검 대상에서 빠져있었습니다.`,
  players:`단기 임대로 행사를 강행한 홍보 업체, 건물 관리 주체, 그리고 안전 규정을 담당하는 관할 지자체 행정 부서입니다.`,
  current:`다행히 중상자나 사망자는 발생하지 않았으나, 유사한 소규모 노후 상가가 전국에 산재해 있어 시민들의 불안감이 고조되고 있습니다.`,
  outlook:`경찰이 건물주와 업체 관계자를 상대로 과실 치상 및 불법 구조변경 여부를 집중 수사한 뒤 형사 처벌 절차를 밟을 예정입니다.`,
  sources:[{title:`대구 북구 관음동 상가 천장 붕괴, 38명 다쳐 - 동아일보`,url:`https://www.donga.com/`},{title:`안전점검 제외된 노후 건물, 조명 하중에 와르르 - 조선일보`,url:`https://www.chosun.com/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`예멘 후티 반군, 사우디아라비아 수도 리야드 국제공항 대규모 드론 공습으로 최소 13명 사망`,
  metrics:[`사망자 13명`,`결항 항공편 600편`],
  summary:`예멘의 친이란 무장세력인 후티 반군이 사우디아라비아의 심장부인 리야드 킹 칼리드 국제공항을 대규모 자폭 드론으로 공습하는 초유의 사태가 발생했습니다. 이틀 연속 감행된 이번 무차별 공격으로 여객 터미널이 크게 파손되며 큰 화재가 발생했습니다. 사우디 민간인 4명을 비롯해 미국인과 방글라데시인 등 다국적 민간인 최소 13명이 현장에서 사망하고 300여 명이 중경상을 입어 2015년 내전 개입 이후 최악의 인명 피해를 냈습니다. 공격 직후 공항이 전면 폐쇄되면서 600편 이상의 항공편이 줄줄이 결항되어 수도의 하늘길이 완전히 마비되었습니다. 후티 반군은 이번 공격의 배후를 자처하며 종교 성지를 제외한 사우디 전역의 주요 공항을 언제든 타격하겠다고 위협했습니다. 특히 미국 국적의 희생자가 발생하면서, 그동안 사태 개입을 자제해 온 미국 정부가 사우디 연합군의 대규모 군사 보복 작전에 동참할 가능성이 제기되어 중동 정세에 먹구름이 드리우고 있습니다.`,
  keyTerms:[{term:`자폭 드론`,explanation:`폭발물을 탑재하고 원격 조종이나 자율 비행을 통해 목표물에 직접 충돌하여 폭발하도록 설계된 무인 항공기를 뜻하며, 탐지 및 요격이 까다롭습니다.`}],
  history:`예멘 내전에서 사우디아라비아 주도 연합군이 정부군을 지원하자, 이에 맞서는 반군 세력은 드론과 미사일로 사우디 영토를 지속적으로 공격해왔습니다.`,
  players:`사우디아라비아 영토를 타격하는 후티 반군, 방어에 실패한 사우디 왕실, 그리고 자국민 희생에 분노한 미국 정부입니다.`,
  current:`사우디 수도의 핵심 기반 시설이 뚫린 충격과 함께 다수의 민간인 희생자가 발생하여 보복 공격의 명분이 극도로 강해진 상황입니다.`,
  outlook:`사우디 연합군과 미군의 고강도 합동 보복 공습이 시작될 경우, 걸프 해역 전체가 화약고로 변하며 5차 중동전쟁으로 비화될 우려가 큽니다.`,
  sources:[{title:`리야드 공항 후티 공습에 최소 13명 사망 - 이데일리`,url:`https://www.edaily.co.kr/`},{title:`미국인 사망에 트럼프 보복 동참 저울질 - 매일경제`,url:`https://www.mk.co.kr/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`파나마 중부 태평양 연안서 규모 7.7 대형 강진 발생, 멕시코 포함 광범위한 쓰나미 경보 발령`,
  metrics:[`지진 규모 7.7`,`여진 발생 40회`],
  summary:`중미 파나마 중부 헤레라주 연안 앞바다에서 규모 7.7의 초강력 지진이 발생해 아메리카 대륙 일대가 공포에 휩싸였습니다. 지진의 진원 깊이가 약 12킬로미터로 매우 얕은 천발 지진이어서 지표면에 전달된 파괴력이 극심했습니다. 첫 강진 이후 규모 6.6을 비롯해 최소 40회 이상의 여진이 꼬리를 물고 이어지며 주민들을 대피소로 몰아넣었습니다. 다행히 사망자는 보고되지 않았으나, 도심지 건물 외벽이 무너지고 대규모 정전이 발생해 최소 27명의 부상자가 속출했습니다. 지진 직후 미 태평양쓰나미경보센터는 진앙 인근뿐만 아니라 멕시코, 콜롬비아, 코스타리카 등 태평양 연안 국가 해안 전체에 즉각적인 쓰나미 발생 경보를 발령했습니다. 파나마의 핵심 물류 동맥인 파나마 운하는 내진 설계 덕분에 피해를 면해 정상 운용 중이지만, 국제공항이 한때 마비되며 막심한 혼란을 빚었습니다. 재난 당국은 추가적인 여진과 국지적 해일 피해에 대비해 해안가 주민들에게 최고 수준의 대피 권고를 유지하고 있습니다.`,
  keyTerms:[{term:`천발 지진`,explanation:`지하 70km 이내의 아주 얕은 곳에서 지층이 엇갈리며 발생하는 지진으로, 진원이 얕아 땅 위로 전달되는 진동과 피해 규모가 깊은 지진보다 훨씬 큽니다.`}],
  history:`환태평양 조산대, 일명 '불의 고리'에 위치한 중남미 국가들은 지각판이 충돌하는 경계선에 있어 크고 작은 지진이 빈번하게 일어납니다.`,
  players:`피해를 수습하는 파나마 국가재난관리청과 실시간 쓰나미 위험을 분석하는 미 태평양쓰나미경보센터가 분주히 움직이고 있습니다.`,
  current:`초기 대형 진동은 멎었지만 계속되는 강한 여진 때문에 구조 작업과 전력 복구 작업이 심각한 차질을 빚고 있습니다.`,
  outlook:`인접한 멕시코와 에콰도르 해안으로 밀려드는 지진 해일의 파고를 주시하며 항구 시설 피해 여부를 계속 점검해야 할 상황입니다.`,
  sources:[{title:`파나마 해역 규모 7.7 강진... 중남미 쓰나미 비상 - 매일경제`,url:`https://www.mk.co.kr/`},{title:`지진 깊이 12km 천발 강진에 파나마 공항 일시 마비 - 뉴스1`,url:`https://www.news1.kr/`}]
}]

  tag:`2026-10-11`,
  label:`2026년 10월 11일 (일)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국은행, 기준금리 연 3.00%로 3회 연속 동결 결정`,
  metrics:[`기준금리 3.00%`,`원/달러 환율 1,340원대`],
  summary:`한국은행 금융통화위원회가 10월 통화정책방향 회의에서 기준금리를 연 3.00%로 3회 연속 동결했습니다. 물가 상승률이 목표치에 근접하고 있으나, 최근 급등한 가계부채와 부동산 시장의 불안정성을 고려한 결정으로 풀이됩니다. 특히 글로벌 달러 강세에 따른 원/달러 환율 상승 압력도 금리 인하를 지연시키는 요인으로 작용했습니다. 전문가들은 당분간 매파적 동결 기조가 유지될 것으로 내다보고 있습니다. 현재 시장은 연말까지 추가 금리 변동 없이 3%대를 유지할 것으로 전망하고 있습니다. 한은은 반도체 수출 등 실물 경제 지표의 회복세를 예의주시하며 통화정책을 운용할 계획입니다. 이번 결정으로 대출자들의 이자 부담은 당분간 계속될 것으로 보입니다.`,
  keyTerms:[{term:`매파적 동결`,explanation:`금리를 올리지 않고 그대로 유지하면서도, 물가 안정 등을 위해 언제든 다시 금리를 올리거나 높은 수준을 오래 유지하겠다는 강경한 태도를 뜻합니다.`}],
  history:`2024년 하반기부터 이어진 글로벌 금리 인하 기대감 속에서도 한국은행은 가계부채 억제를 위해 신중한 입장을 취해왔습니다. 2026년에 접어들면서 물가 상승세는 둔화되었으나 부동산 가격이 다시 불안해졌습니다.`,
  players:`이창용 총재를 비롯한 금융통화위원회 위원들과 금리 인하를 기대했던 주식 및 부동산 시장 참여자들이 주요 행위자입니다. 정부 또한 거시경제 안정을 위해 한은의 결정에 주목하고 있습니다.`,
  current:`가계대출 증가세가 꺾이지 않으면서 한국은행은 섣부른 금리 인하가 자산 시장 거품을 키울 수 있다고 판단했습니다.`,
  outlook:`다음 금통위 회의까지 국내 가계부채 지표와 미국 연방준비제도의 금리 결정 등 대내외 거시경제 흐름이 가장 중요한 변수가 될 것입니다.`,
  sources:[{title:`한은 기준금리 3% 3연속 동결... 가계부채 우려 - 한국경제`,url:`https://www.hankyung.com/economy/article/202610101234`},{title:`물가 잡혔지만 집값이 발목, 연말까지 금리 유지 유력 - 연합뉴스`,url:`https://www.yna.co.kr/view/AKR20261010012345`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 나스닥 2만 7,400선 돌파하며 사상 최고치 경신, 미 국채 10년물 5.34% 급등`,
  metrics:[`나스닥 27,400선 돌파`,`미 10년물 국채 5.34%`],
  summary:`미국 뉴욕 증시에서 나스닥 지수가 2만 7,400선을 돌파하며 사상 최고치를 경신했습니다. 인공지능 관련 대형 기술주들의 실적 호조가 지수 상승을 강력하게 견인했습니다. 반면, 미국 10년물 국채금리는 24년 만에 최고치인 5.34%까지 급등하며 주식 시장과 채권 시장의 엇갈린 흐름이 두드러지고 있습니다. 이러한 국채금리의 급등은 인플레이션이 쉽게 꺾이지 않을 것이라는 시장의 스태그플레이션 우려를 반영합니다. 금리 상승에도 불구하고 기술주 중심의 자금 쏠림 현상이 계속되면서 증시의 나홀로 질주가 나타나는 중입니다. 향후 연방준비제도의 통화정책 방향에 대한 투자자들의 불안감은 여전히 남아있습니다. 시장은 다가오는 주요 기업들의 4분기 실적 전망 발표에 촉각을 곤두세우고 있습니다.`,
  keyTerms:[{term:`스태그플레이션`,explanation:`경제 성장이 멈추거나 침체하는 상황 속에서도 물가가 계속 오르는 현상을 의미합니다.`}],
  history:`미국 경제는 팬데믹 이후 지속적인 고금리 환경에서도 예상보다 강한 소비와 고용을 바탕으로 이례적인 성장세를 보여왔습니다.`,
  players:`미국 연방준비제도 제롬 파월 의장과 대형 기술주 랠리를 주도하는 글로벌 기관 투자자들이 핵심 행위자입니다.`,
  current:`물가 상승 압력이 여전한 가운데, 주식 시장은 인공지능 산업의 미래 가치에 베팅하며 채권 시장의 경고를 무시하는 양상입니다.`,
  outlook:`다가오는 물가 지표 발표와 연방준비제도 인사들의 발언에 따라 증시의 변동성이 단기적으로 크게 확대될 수 있습니다.`,
  sources:[{title:`나스닥 27,400 사상 최고치... 미 국채금리 5.3% 돌파 - 한국경제`,url:`https://www.hankyung.com/international/article/202610105678`},{title:`빅테크 질주에 가려진 스태그플레이션 그림자 - 매일경제`,url:`https://www.mk.co.kr/news/world/11234567`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`퇴직연금 실물이전 전면 시행 후 16조 원 이동, 자금 이동 가속`,
  metrics:[`이전 규모 16조 원`,`증권사 유입 5조 원`],
  summary:`퇴직연금 실물이전 제도가 전면 시행된 지 약 1년 8개월 만에 대규모 자금 이동이 발생하고 있습니다. 기존 은행권에 머물러 있던 퇴직연금 자금 중 16조 원 이상이 다른 금융기관으로 이동하는 머니무브 현상이 확인되었습니다. 특히 높은 수익률을 좇아 증권사로 유입된 자금만 5조 원을 넘어서며, 투자자들의 위험 자산 선호가 뚜렷해지고 있습니다. 이는 가입자가 기존 투자 상품을 팔지 않고도 사업자를 쉽게 바꿀 수 있는 실물이전 제도의 편의성 때문입니다. 금융사들은 고객 유치를 위해 파격적인 수수료 인하와 다양한 상품 라인업을 앞세워 치열한 점유율 경쟁을 벌이고 있습니다. 시장은 수익률을 무기로 내세운 증권사의 약진과 은행권의 방어 전략이 충돌하며 더욱 뜨거워질 전망입니다. 연말 정산 시즌을 앞두고 이러한 자금 이동 폭은 더 커질 것으로 예상됩니다.`,
  keyTerms:[{term:`실물이전 제도`,explanation:`퇴직연금 계좌를 다른 금융회사로 옮길 때, 기존에 투자하던 금융상품을 환매하지 않고 그 상태 그대로 넘길 수 있게 해주는 제도입니다.`}],
  history:`과거 퇴직연금 가입자들은 금융사를 바꾸려면 기존 상품을 강제로 팔아 현금화해야 했기 때문에 손실 우려로 자금 이동을 꺼렸습니다.`,
  players:`고객 이탈을 막으려는 시중 은행과 공격적으로 가입자를 유치하려는 주요 증권사들이 치열한 경쟁을 벌이고 있습니다.`,
  current:`주식 시장 활황과 상장지수펀드 투자 열풍이 맞물리면서, 더 높은 수익을 원하는 가입자들의 연금 계좌 이동이 폭발적으로 늘고 있습니다.`,
  outlook:`연말 세액공제를 노린 추가 납입 시기와 맞물려 금융권의 퇴직연금 유치 마케팅 전쟁은 올 겨울 최고조에 달할 것입니다.`,
  sources:[{title:`퇴직연금 실물이전 16조 훌쩍... 은행서 증권으로 머니무브 - 동아일보`,url:`https://www.donga.com/news/Economy/article/all/20261010/12345`},{title:`수익률 찾아 삼만리, 증권사 연금계좌 가입자 껑충 - 파이낸셜뉴스`,url:`https://www.fnnews.com/news/2026101098765`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`법사위 국정감사 파행, 사법부 독립성 및 선관위 부실 관리 의혹 정면충돌`,
  metrics:[`증인 채택 150여 명`,`국감 파행 3일째`],
  summary:`제22대 국회 마지막 국정감사가 중반으로 접어든 가운데, 법제사법위원회를 비롯한 주요 상임위에서 여야의 정면충돌이 벌어졌습니다. 특히 대법원장이 대법관 제청 과정의 외부 관여 논란에 대해 위헌적 행태라고 발언하면서 정국이 급속도로 얼어붙었습니다. 야당은 정부의 사법부 장악 시도라며 강하게 반발했고, 여당은 지난 지방선거 당시 선관위의 관리 부실 의혹을 집중 제기하며 맞불을 놨습니다. 이로 인해 상임위 회의가 정회되는 등 국감 파행이 3일째 이어지고 있습니다. 핵심 쟁점마다 서로 다른 프레임 전쟁을 벌이며 민생 현안은 뒷전으로 밀려났다는 비판이 나옵니다. 여야 원내대표가 중재에 나섰으나 입장 차이가 너무 커 돌파구 마련이 쉽지 않은 상황입니다. 당분간 국회는 양측의 강 대 강 대치가 지속될 것으로 보입니다.`,
  keyTerms:[{term:`프레임 전쟁`,explanation:`어떤 정치적 이슈에 대해 자신들에게 유리한 관점으로 대중이 사건을 바라보도록 여론을 주도하려는 정치권의 치열한 싸움을 뜻합니다.`}],
  history:`최근 몇 년간 법관 인사와 선거 관리 위원회의 중립성을 둘러싼 여야의 갈등은 선거 때마다 반복되어 온 해묵은 과제입니다.`,
  players:`정부와 여당 지도부, 이를 견제하려는 제1야당 지도부, 그리고 사법부와 선거관리위원회 주요 인사들이 핵심 인물들입니다.`,
  current:`각종 쟁점 법안 처리와 다가오는 내년 재보궐 선거의 주도권을 잡기 위해 양측 모두 한 치의 물러섬 없는 기싸움을 벌이고 있습니다.`,
  outlook:`이번 국정감사가 끝날 때까지 여야 간 고발전과 장외 여론전이 격화될 가능성이 높으며, 핵심 민생 법안의 연내 처리 여부가 불투명해졌습니다.`,
  sources:[{title:`대법원장 발언에 발칵 뒤집힌 법사위... 3일째 개점휴업 - 경향신문`,url:`https://www.khan.co.kr/politics/assembly/article/202610101111`},{title:`여야, 선관위·사법부 의혹 놓고 네 탓 공방전 치열 - YTN`,url:`https://www.ytn.co.kr/_ln/0101_202610102222`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`알시시 이집트 대통령 국빈 방한, 한-이집트 인프라 및 방산 협력 강화`,
  metrics:[`투자의향서 30억 달러`,`신규 협의체 2개 신설`],
  summary:`알시시 이집트 대통령이 10일 국빈 방한하여 한-이집트 정상회담을 성공적으로 마쳤습니다. 양국 정상은 방위산업, 원자력 발전, 인프라 등 핵심 산업 분야에서 포괄적 협력을 강화하는 내용의 양해각서를 다수 체결했습니다. 특히 K-9 자주포의 추가 수출과 이집트 수에즈 운하 주변의 대규모 친환경 에너지 인프라 구축 프로젝트가 심도 있게 논의되었습니다. 이는 중동 및 아프리카 지역 진출의 교두보를 마련하려는 한국의 세일즈 외교 전략과 정확히 일치합니다. 이번 회담을 통해 약 30억 달러 규모의 경제 협력 프로젝트가 가시화되면서 국내 기업들의 기대감이 커지고 있습니다. 양국은 글로벌 공급망 불안에 공동 대응하기 위한 상설 협의체도 신설하기로 합의했습니다. 향후 수개월 내에 세부 계약 체결을 위한 양국 실무진의 교차 방문이 본격적으로 이어질 예정입니다.`,
  keyTerms:[{term:`세일즈 외교`,explanation:`국가의 수장이나 정부 고위급 인사가 직접 나서서 자국 기업의 해외 진출이나 수출, 대규모 투자 유치 등을 돕기 위해 벌이는 외교 활동입니다.`}],
  history:`한국과 이집트는 1995년 수교 이후 꾸준히 협력해왔으며, 최근 아프리카 대륙 내 최대 교역국으로 떠오른 이집트와의 경제 교류가 급증하고 있습니다.`,
  players:`대한민국 대통령과 이집트 알시시 대통령을 비롯해, 중동 지역 대형 프로젝트 수주를 노리는 한국의 주요 방산, 건설 대기업들이 참여하고 있습니다.`,
  current:`글로벌 공급망 재편 속에서 이집트는 첨단 인프라 확충이 필요하고, 한국은 새로운 해외 수출 활로가 절실한 상황이 맞아떨어졌습니다.`,
  outlook:`내년 초 예정된 양국 장관급 경제 공동위원회를 통해 구체적인 기업 간 계약 소식이 연이어 발표될 것으로 기대됩니다.`,
  sources:[{title:`한·이집트 정상회담, 방산·인프라 30억 달러 협력 가시화 - 조선일보`,url:`https://www.chosun.com/politics/diplomacy/2026/10/10/1234/`},{title:`아프리카 교두보 넓히는 세일즈 외교, 수에즈 프로젝트 참여 논의 - 중앙일보`,url:`https://www.joongang.co.kr/article/202610103333`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 11월 중간선거 한 달 앞으로, 여야 초박빙 속 유권자 표심 흔들기 총력`,
  metrics:[`초박빙 경합 선거구 25곳`,`사전투표율 역대 최고 18%`],
  summary:`미국 11월 중간선거를 약 한 달 앞두고 공화당과 민주당의 유세전이 그 어느 때보다 극에 달하고 있습니다. 트럼프 전 대통령을 앞세운 공화당은 현 행정부의 경제 실정을 집중적으로 부각하며 스윙 보터 표심 잡기에 총력을 기울이고 있습니다. 반면 하원의 다수당 지위를 수성하려는 민주당은 낙태권 보장과 민주주의 가치 수호를 내세우며 전통적 지지층 결집에 나섰습니다. 특히 25곳에 달하는 초박빙 경합주의 여론조사 결과가 매일 엎치락뒤치락하며 전체 판세를 예측하기 매우 어려운 상황입니다. 미국의 정치적 불확실성이 커지면서 한국을 비롯한 동맹국들은 선거 결과가 통상 정책에 미칠 파장을 조심스럽게 예의주시하고 있습니다. 현재 사전투표가 시작된 주에서는 유권자 참여율이 동기 대비 역대 최고치를 경신 중입니다. 선거 막판까지 양당의 네거티브 공세와 돌발적인 정치 변수가 승패를 가를 핵심 요인으로 지목됩니다.`,
  keyTerms:[{term:`스윙 보터`,explanation:`어느 특정 정당이나 정치인에게 투표할지 굳게 정하지 않고, 선거 당시의 이슈나 상황에 따라 투표 대상을 바꾸는 부동층 유권자를 뜻합니다.`}],
  history:`미국의 중간선거는 현직 대통령의 임기 중간에 치러져 행정부 국정 운영에 대한 중간 평가 성격을 지니며, 권력의 균형을 결정짓는 중요한 선거입니다.`,
  players:`현직 행정부를 방어하는 민주당 지도부와 의회 주도권 탈환을 노리는 트럼프 전 대통령 및 공화당 핵심 인사들이 대결의 주축입니다.`,
  current:`유권자들은 물가 상승 등 경제 문제와 낙태권 같은 이념적 가치 사이에서 팽팽하게 양분되어 있어 결과를 쉽게 예측할 수 없습니다.`,
  outlook:`11월 선거 결과에 따라 향후 2년간 미국 행정부의 입법 추진력이 크게 달라지며, 이는 대외 관세 정책과 외교 노선에도 직접적인 영향을 줄 것입니다.`,
  sources:[{title:`미 중간선거 D-30, 경합주 25곳 여론조사 초박빙 - 연합뉴스`,url:`https://www.yna.co.kr/view/AKR202610105555`},{title:`경제냐 가치냐, 미 유권자 사전투표율 역대 최고 수준 - SBS 뉴스`,url:`https://news.sbs.co.kr/news/endPage.do?news_id=N100202610`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`오픈AI 등 글로벌 빅테크, 차세대 '범용 인공지능(AGI)' 기술 상용화 선언`,
  metrics:[`글로벌 도입 기업 45% 증가`,`관련 산업 투자 2,000억 달러 전망`],
  summary:`오픈AI와 구글을 비롯한 글로벌 빅테크 기업들이 스스로 추론하고 복합적인 문제를 해결하는 범용 인공지능(AGI) 기반의 상용화 서비스를 잇따라 발표했습니다. 기존의 단순 텍스트나 이미지를 생성하는 수준을 넘어선 이 최신 기술은, 수학 증명부터 신약 단백질 구조 개발까지 인간 전문가 수준의 결과물을 빠르게 도출해냅니다. 기술의 비약적인 발전으로 인해 전 세계 주요 기업들의 최신 인공지능 도입률이 폭발적으로 증가하며 산업 전반의 효율성 패러다임이 통째로 바뀌고 있습니다. 하지만 너무 빠른 기술의 발전 속도로 인해 딥페이크 악용 범죄나 대규모 일자리 감소 등 인공지능 윤리에 대한 글로벌 사회의 규제 요구 목소리도 커지고 있습니다. 각국 정부는 인공지능 기술의 주도권을 놓치지 않으면서도 인간의 안전성을 확보하기 위한 제도 마련에 속도를 내고 있습니다. 현재 이 첨단 기술은 막대한 데이터 처리가 필요한 금융과 의료 분야 현장에 가장 빠르게 투입되고 있습니다. 내년 초까지 규제 가이드라인과 혁신을 둘러싼 국가 간 기술 패권 경쟁은 더욱 치열해질 전망입니다.`,
  keyTerms:[{term:`범용 인공지능(AGI)`,explanation:`특정 분야에 얽매이지 않고, 인간과 비슷하거나 그 이상의 종합적인 인지 능력을 바탕으로 모든 상황에서 스스로 학습하고 문제를 해결할 수 있는 미래형 인공지능입니다.`}],
  history:`초기 챗봇 형태의 인공지능에서 시작된 기술 개발 경쟁은 천문학적인 자본이 투입되면서 불과 수년 만에 사람처럼 논리적으로 생각하는 수준까지 진화했습니다.`,
  players:`오픈AI, 구글, 메타 등 막강한 컴퓨팅 파워를 가진 빅테크 기업의 개발자들과 이를 견제 및 감독하려는 각국 규제 당국이 맞물려 있습니다.`,
  current:`기업들은 인공지능을 도입해 생산성을 극대화하려는 반면, 사회학자들은 기술의 부작용에 대해 심각한 경고의 메시지를 내놓고 있습니다.`,
  outlook:`향후 인공지능의 안전한 사용을 규정하는 국제적인 통일된 법안 제정 여부가 글로벌 첨단 산업의 발전 방향을 가늠할 핵심 지표가 될 것입니다.`,
  sources:[{title:`AGI 시대 열렸다... 오픈AI 새 추론 모델 발표에 시장 충격 - 전자신문`,url:`https://www.etnews.com/202610101122`},{title:`인간을 뛰어넘는 AI 등장에 커지는 윤리 논란과 일자리 불안 - 매일경제`,url:`https://www.mk.co.kr/news/it/202610104444`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`2026 여수세계섬박람회 개막 한 달, 누적 관람객 100만 명 돌파하며 지역 경제 견인`,
  metrics:[`누적 관람객 100만 명`,`경제 파급효과 4천억 원`],
  summary:`지난달 화려하게 개막한 '2026 여수세계섬박람회'가 청명한 가을 나들이객들의 발길을 대거 모으며 누적 관람객 100만 명을 조기 돌파하는 쾌거를 거두었습니다. 세계 최초로 바다의 섬을 주요 주제로 한 이번 박람회는 친환경 해상 전시관과 첨단 홀로그램 기술을 활용한 화려한 야간 공연이 소셜 미디어에서 큰 호평을 받고 있습니다. 특히 전체 관람객 중 해외 관광객 비율이 15%를 넘어설 정도로 국제적인 관심이 높아지면서 지역 경제의 낙수 효과가 극대화되고 있습니다. 행사장 주변 상권의 식당과 특산물 매장 매출이 눈에 띄게 늘고 있으며, 시내 주요 숙박업소 예약률은 연일 만실을 기록하고 있습니다. 문화 전문가들은 이번 국제 행사를 통해 전남 남해안 일대의 숨겨진 해양 관광 자원이 세계적으로 재조명받고 있다고 높이 평가합니다. 박람회 조직위원회는 11월 공식 폐막 전까지 최종 목표인 관람객 300만 명 달성을 매우 긍정적으로 내다보고 있습니다. 몰려드는 인파에 대비한 교통 편의성 개선과 야외 전시장 안전 관리 강화가 남은 행사의 핵심 과제로 꼽힙니다.`,
  keyTerms:[{term:`낙수 효과`,explanation:`대형 박람회 행사나 대기업 투자가 활성화되어 상층부의 경제가 성장하면, 그 이익의 혜택이 중소기업이나 지역 소상공인 등 경제 전반으로 흘러내려가는 현상을 말합니다.`}],
  history:`여수시는 과거 2012년 해양엑스포의 성공적 개최 경험을 바탕으로, 섬 생태계 보호와 관광을 결합한 새로운 글로벌 박람회를 수년간 준비해왔습니다.`,
  players:`여수시와 박람회 조직위원회, 전남 지역의 소상공인 및 관광업계 종사자들이 행사의 성공을 이끄는 주역들입니다.`,
  current:`아름다운 자연경관과 첨단 IT 전시 연출이 시너지를 내면서 국내외 관광객들의 발걸음이 여수로 집중되고 있습니다.`,
  outlook:`성공적인 박람회 개최 이후, 남해안 일대가 글로벌 해양 관광의 중심지로 도약하기 위한 추가적인 국가 차원의 인프라 지원이 논의될 예정입니다.`,
  sources:[{title:`여수세계섬박람회 100만 명 조기 달성, 남해안 관광 르네상스 - 광주방송`,url:`https://www.kbc.co.kr/article/202610108888`},{title:`볼거리 넘치는 해상 전시관 호평... 상권 매출 껑충 - KBS 뉴스`,url:`https://news.kbs.co.kr/news/view.do?ncd=202610109999`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`전 지구적 이상 기후로 글로벌 농산물 가격 급등, 밥상 물가 비상`,
  metrics:[`국제 곡물 지수 15% 상승`,`미국 밀 선물 가격 10개월 내 최고치`],
  summary:`가을철 북반구를 강타한 이례적인 폭우와 전 지구적 이상 기후 여파로 세계 농산물 가격이 무섭게 치솟고 있습니다. 특히 북미와 아시아 지역의 주요 곡창지대에서 수확기 직전 극심한 홍수 피해가 발생하면서, 국제 시장의 밀과 대두 선물 가격이 단숨에 10개월 만에 최고치를 갱신했습니다. 이러한 기초 식량 자원의 급격한 가격 상승은 각국 중앙은행의 인플레이션 방어 정책에 찬물을 끼얹으며 큰 부담을 주고 있습니다. 기후 환경 학자들은 엘니뇨 현상의 장기 후유증과 해수면 온도 상승이 직접적으로 결합된 애그리플레이션 현상이 본격화되었다고 강하게 경고하고 나섰습니다. 밀과 옥수수 등 식량 수입 의존도가 높은 한국 역시 라면, 빵을 비롯한 필수 가공식품 가격의 인상 압박에 직면하며 서민 경제에 곧장 비상이 걸렸습니다. 현재 일부 국가 정부는 국내 식량 확보를 위해 곡물 수출을 통제하거나 전략 비축미를 푸는 등 다급하게 식량 안보 대책 마련에 부심하고 있습니다. 내년 봄 파종 시기까지 뚜렷한 기후 불안정성이 해소되지 않으면 글로벌 식량 위기는 장기화될 우려가 높습니다.`,
  keyTerms:[{term:`애그리플레이션`,explanation:`농업과 물가 상승을 합친 조어로, 농산물의 가격이 크게 오르면서 빵이나 과자 같은 관련 식품 물가는 물론 사회 전체의 물가까지 덩달아 상승하는 현상을 말합니다.`}],
  history:`지구 온난화로 인한 기상이변은 최근 수년간 주기적으로 전 세계 농업 생산량에 타격을 주었으나, 올해는 가을 수확기에 폭우가 집중되어 피해가 유독 컸습니다.`,
  players:`기후 변화에 속수무책인 세계 각국의 농업 종사자들과 국제 곡물 시장의 투자자들, 그리고 밥상 물가 상승으로 고통받는 일반 소비자들이 영향을 받고 있습니다.`,
  current:`식량 자원의 무기화 추세와 이상 기후가 맞물리면서, 식량을 수출하는 국가와 수입하는 국가 간의 경제적 불평등 위기가 심화되고 있습니다.`,
  outlook:`장기적으로 식량 안보를 확보하기 위해 기후 변화에 강한 새로운 종자 개발과 스마트 농업 기술 투자가 국가적 핵심 과제로 대두될 것입니다.`,
  sources:[{title:`가을 폭우에 휩쓸린 세계 곡창지대... 애그리플레이션 공포 확산 - 한겨레`,url:`https://www.hani.co.kr/arti/economy/202610103456.html`},{title:`오르는 수입 밀 가격에 빵값 또 들썩... 서민 한숨 - MBC 뉴스`,url:`https://imnews.imbc.com/replay/2026/nwdesk/article/202610107777.html`}]
}]

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모닝 브리핑</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --sidebar-w: 240px;
    --bg: #FAFAF7;
    --paper: #FFFFFF;
    --accent: #6B7A8F;
    --accent-soft: #E8ECEF;
    --line: #EAE8E3;
    --line-strong: #D8D5CE;
    --text: #2D2A26;
    --text-mid: #6B655D;
    --text-sub: #A09889;
    --radius: 10px;
  }
  html, body {
    height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 15px; line-height: 1.65; font-weight: 400;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }

  /* ── Layout ── */
  #app { display: flex; height: 100vh; overflow: hidden; }

  /* ── Sidebar ── */
  #sidebar {
    width: var(--sidebar-w); flex-shrink: 0;
    background: var(--bg); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #sidebar-header {
    padding: 36px 20px 24px;
    border-bottom: 1px solid var(--line);
    text-align: center;
  }
  #sidebar-header h1 {
    font-size: 19px; font-weight: 700; color: var(--text);
    letter-spacing: -0.4px; line-height: 1.3;
  }
  #sidebar-header p {
    font-size: 12px; color: var(--text-sub); margin-top: 6px;
    letter-spacing: 0.3px;
  }
  #date-list { overflow-y: auto; flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
  .date-item {
    padding: 11px 14px; cursor: pointer; border-radius: 8px;
    transition: background 0.15s, color 0.15s;
    background: transparent;
    text-align: center; font-size: 13px; font-weight: 500; color: var(--text-mid);
    letter-spacing: 0.1px;
  }
  .date-item:hover { background: var(--accent-soft); color: var(--text); }
  .date-item.active {
    background: var(--accent-soft); color: var(--text); font-weight: 600;
  }

  /* ── Main ── */
  #main { flex: 1; overflow-y: auto; background: var(--paper); }
  #content { max-width: 760px; margin: 0 auto; padding: 56px 40px 80px; }

  .brief-header { margin-bottom: 36px; }
  .brief-header .bh-eyebrow {
    font-size: 11px; color: var(--text-sub); margin-bottom: 8px;
    letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500;
  }
  .brief-header h2 {
    font-size: 30px; font-weight: 700; letter-spacing: -0.7px;
    color: var(--text); line-height: 1.25;
  }

  /* ── Sticky Top (header + tabs) ── */
  .sticky-top {
    position: sticky; top: 0;
    background: var(--paper); z-index: 20;
    padding-top: 56px; margin-top: -56px;
  }
  .sticky-top .brief-header { margin-bottom: 24px; }

  /* ── Category Tabs ── */
  .cat-tabs {
    display: flex; gap: 0; margin-bottom: 36px;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
  }
  .cat-tab {
    padding: 12px 20px 14px; cursor: pointer; font-size: 14px; font-weight: 500;
    color: var(--text-sub); border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    background: none; border-top: none; border-left: none; border-right: none;
    font-family: inherit; letter-spacing: -0.1px;
    margin-bottom: -1px;
  }
  .cat-tab:hover { color: var(--text-mid); }
  .cat-tab.active { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }

  /* ── Sources (collapsible) ── */
  .sources-toggle {
    background: transparent; border: 1px solid var(--line-strong);
    padding: 8px 14px; border-radius: 6px; font-size: 12.5px; font-weight: 500;
    color: var(--text-mid); cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    font-family: inherit; margin-top: 12px;
    transition: background 0.15s, border-color 0.15s;
  }
  .sources-toggle:hover { background: var(--accent-soft); border-color: var(--accent); }
  .sources-toggle .arrow { transition: transform 0.2s; font-size: 9px; color: var(--text-sub); }
  .sources-toggle.open .arrow { transform: rotate(180deg); }
  .sources-body { display: none; margin-top: 12px; padding-left: 4px; }
  .sources-body.open { display: block; }

  /* ── Story Card ── */
  .story { margin-bottom: 40px; }
  .story-top { margin-bottom: 18px; }
  .story-headline {
    font-size: 19px; font-weight: 700; line-height: 1.45;
    letter-spacing: -0.4px; color: var(--text);
  }

  .metrics { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .metric-chip {
    background: var(--accent-soft); border: none;
    border-radius: 6px; padding: 7px 12px;
    font-size: 12.5px; font-weight: 500; color: var(--text-mid);
    line-height: 1.4;
  }

  .summary {
    font-size: 15px; line-height: 1.8; color: var(--text); margin-bottom: 20px;
    letter-spacing: -0.1px;
  }
  .summary .kt-underline {
    color: #1996BD;
    text-decoration: underline;
    text-decoration-color: #1996BD;
    text-decoration-thickness: 1.5px;
    text-underline-offset: 3px;
    cursor: help;
  }

  /* ── Key Terms Box ── */
  .key-terms {
    background: #F4F1EA; border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius); padding: 18px 22px; margin-bottom: 14px;
  }
  .key-terms-title {
    font-size: 11px; font-weight: 600; color: var(--text-sub);
    text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 14px;
  }
  .kt-item { margin-bottom: 12px; }
  .kt-item:last-child { margin-bottom: 0; }
  .kt-term {
    font-size: 13.5px; font-weight: 700; color: #1996BD;
    margin-bottom: 4px; display: block;
    letter-spacing: -0.1px;
  }
  .kt-exp {
    font-size: 13.5px; line-height: 1.7; color: var(--text-mid);
  }

  /* ── Background ── */
  .bg-box {
    background: var(--bg); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 22px 24px; margin-bottom: 14px;
  }
  .bg-box-title {
    font-size: 11px; font-weight: 600; color: var(--text-sub);
    text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 16px;
  }
  .bg-section { margin-bottom: 16px; }
  .bg-section:last-child { margin-bottom: 0; }
  .bg-section-label {
    font-size: 12.5px; font-weight: 600; color: var(--text); margin-bottom: 6px;
    letter-spacing: -0.1px;
  }
  .bg-section-text { font-size: 14px; line-height: 1.75; color: var(--text-mid); }

  /* ── Sources ── */
  .source-item {
    display: flex; align-items: flex-start; gap: 10px;
    margin-bottom: 8px; font-size: 13px;
  }
  .src-num {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent-soft); color: var(--text-mid);
    font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .source-item a { color: var(--text-mid); text-decoration: none; line-height: 1.55; }
  .source-item a:hover { color: var(--text); text-decoration: underline; }

  .story-divider { border: none; border-top: 1px solid var(--line); margin: 36px 0; }

  .empty { color: var(--text-sub); font-size: 14px; padding: 60px 0; text-align: center; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }

  /* ── Mobile Toggle ── */
  #sidebar-toggle {
    display: none;
    position: fixed; top: 14px; left: 14px; z-index: 50;
    background: var(--paper); border: 1px solid var(--line-strong);
    width: 40px; height: 40px; border-radius: 10px;
    cursor: pointer; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(45, 42, 38, 0.08);
  }
  #sidebar-toggle span {
    display: block; width: 18px; height: 2px; background: var(--text);
    position: relative;
  }
  #sidebar-toggle span::before,
  #sidebar-toggle span::after {
    content: ''; position: absolute; left: 0; width: 18px; height: 2px; background: var(--text);
  }
  #sidebar-toggle span::before { top: -6px; }
  #sidebar-toggle span::after { top: 6px; }

  #sidebar-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(45, 42, 38, 0.4); z-index: 40;
  }
  #sidebar-backdrop.open { display: block; }

  /* ── Mobile Responsive ── */
  @media (max-width: 768px) {
    #sidebar-toggle { display: flex; }
    #sidebar {
      position: fixed; left: 0; top: 0; bottom: 0;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      z-index: 45; width: 260px;
      box-shadow: 0 0 24px rgba(45, 42, 38, 0.12);
    }
    #sidebar.open { transform: translateX(0); }

    #content { padding: 64px 20px 60px; max-width: 100%; }
    .brief-header h2 { font-size: 22px; }
    .story-headline { font-size: 16px; }
    .summary { font-size: 14.5px; line-height: 1.75; }
    .bg-section-text { font-size: 13.5px; }
    .metric-chip { font-size: 12px; padding: 6px 10px; }
    .bg-box { padding: 18px 18px; }
    .cat-tab { padding: 11px 14px; font-size: 13.5px; }

    .quiz-card { padding: 28px 24px 24px; }
    .quiz-q { font-size: 17px; }
    .quiz-choice { font-size: 14px; padding: 13px 16px; }
  }

  /* ── Quiz Overlay ── */
  body.quiz-active #app {
    filter: blur(6px) saturate(0.85);
    pointer-events: none;
    transition: filter 0.3s ease;
  }
  #quiz-overlay {
    position: fixed; inset: 0;
    background-color: rgba(250, 250, 247, 0.55);
    background-image:
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0) 0,
        rgba(255,255,255,0) 5px,
        rgba(45,42,38,0.04) 5px,
        rgba(45,42,38,0.04) 6px
      ),
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0) 0,
        rgba(255,255,255,0) 22px,
        rgba(45,42,38,0.025) 22px,
        rgba(45,42,38,0.025) 23px
      );
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 24px;
  }
  #quiz-overlay.hidden { display: none; }

  .quiz-card {
    background: var(--paper); border-radius: 16px;
    padding: 36px 36px 32px; width: 100%; max-width: 440px;
    box-shadow: 0 16px 48px rgba(45, 42, 38, 0.18);
  }
  .quiz-eyebrow {
    font-size: 11px; color: var(--text-sub); letter-spacing: 1.5px;
    text-transform: uppercase; font-weight: 500; margin-bottom: 12px;
  }
  .quiz-q {
    font-size: 19px; font-weight: 700; color: var(--text);
    line-height: 1.5; letter-spacing: -0.3px; margin-bottom: 24px;
  }
  .quiz-choices { display: flex; flex-direction: column; gap: 8px; }
  .quiz-choice {
    background: var(--paper); border: 1px solid var(--line-strong);
    padding: 14px 18px; border-radius: 10px; font-size: 14.5px; font-weight: 500;
    color: var(--text); cursor: pointer; text-align: left;
    font-family: inherit; transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .quiz-choice:focus { outline: none; }
  .quiz-choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) {
    .quiz-choice:hover { background: var(--accent-soft); border-color: var(--accent); }
  }
  .quiz-choice:active { transform: scale(0.99); }
  .quiz-choice.wrong {
    background: #F5E6E0; border-color: #C9947F; color: #8A4A30;
    animation: shake 0.4s ease;
  }
  .quiz-choice.correct {
    background: #E3EDE2; border-color: #7A9077; color: #2E4A2C;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .quiz-feedback {
    margin-top: 20px; text-align: center; font-size: 14px; font-weight: 500;
    color: var(--text-mid); min-height: 22px;
  }
  .quiz-feedback.right { color: #2E4A2C; }
  .quiz-feedback.wrong { color: #8A4A30; }

  .quiz-close-btn {
    margin-top: 18px; width: 100%;
    background: var(--text); color: var(--paper); border: none;
    padding: 13px 20px; border-radius: 10px; font-size: 14px; font-weight: 600;
    font-family: inherit; cursor: pointer;
    transition: background 0.15s;
  }
  .quiz-close-btn:hover { background: #1a1815; }
  .quiz-close-btn.hidden { display: none; }
</style>
</head>
<body>
<div id="quiz-overlay">
  <div class="quiz-card">
    <div class="quiz-eyebrow"><span>잠깐, 나에 대해서 잘 알지?</span> <span id="quiz-counter">(0/3)</span></div>
    <div class="quiz-q" id="quiz-q"></div>
    <div class="quiz-choices" id="quiz-choices"></div>
    <div class="quiz-feedback" id="quiz-feedback"></div>
    <button class="quiz-close-btn hidden" id="quiz-close">닫기</button>
  </div>
</div>

<button id="sidebar-toggle" aria-label="메뉴"><span></span></button>
<div id="sidebar-backdrop"></div>

<div id="app">
  <nav id="sidebar">
    <div id="sidebar-header">
      <h1>모닝 브리핑</h1>
      <p>일별 세계 뉴스 요약</p>
    </div>

    <div id="date-list"></div>
  </nav>
  <main id="main">
    <div id="content"></div>
  </main>
</div>

<script>
const BRIEFS = [{
  tag:`2026-11-07`,
  label:`2026년 11월 7일 (토)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미 중간선거 여파로 국내 증시가 급락하자 금융당국이 신용융자 담보비율 유지 의무를 한시적으로 면제했습니다.`,
  metrics:[`코스피 장중 2% 이상 급락`,`유지의무 3개월 한시 면제`],
  summary:`미국 중간선거 이후 AI 데이터센터 투자 축소와 기술주 규제 강화 우려가 번지며 국내 증시의 변동성이 극심해졌습니다. 코스피는 장중 2% 이상 하락하며 불안한 장세를 연출했습니다. 이에 금융당국은 증시 급락으로 인한 반대매매 충격을 완화하기 위해 증권사의 신용융자 담보비율 유지 의무를 3개월간 면제하기로 결정했습니다. 이는 투자자들의 연쇄적인 마진콜을 막고 시장 심리를 안정시키기 위한 긴급 조치입니다. 반도체 투톱인 삼성전자와 SK하이닉스 역시 글로벌 빅테크 변동성 확대의 영향을 받아 주가 방향성에 시장의 관심이 집중되고 있습니다. 투자자들은 당국의 시장 안정화 조치에도 불구하고 대외 불확실성이 해소될 때까지 보수적인 접근을 이어갈 것으로 보입니다.`,
  keyTerms:[{term:`신용융자 담보비율`,explanation:`투자자가 주식을 살 때 증권사로부터 돈을 빌리기 위해 유지해야 하는 주식 담보의 가치 비율입니다. 주가가 급락해 이 비율 밑으로 떨어지면 증권사가 강제로 주식을 파는 반대매매가 일어납니다.`}],
  history:`최근 미국 대선과 중간선거 등 정치적 이벤트가 있을 때마다 글로벌 증시는 큰 변동성을 겪어왔습니다. 특히 기술주 중심의 나스닥 변동이 국내 시장에 직접적인 타격을 주고 있습니다.`,
  players:`한국 금융당국, 국내외 기관 투자자, 그리고 개인 투자자들이 주요 주체입니다. 금융당국은 시장 붕괴를 막기 위해 개입하고 있습니다.`,
  current:`증시가 단기 급락하며 빚을 내어 투자한 개인 투자자들의 반대매매 위기가 고조되자 선제적 방어에 나선 상황입니다.`,
  outlook:`담보비율 면제 조치가 종료되는 3개월 뒤의 시장 상황과 미국 새 의회의 기술주 규제 법안 구체화 여부가 향후 주가 향방을 가를 것입니다.`,
  sources:[{title:`금융위, 증시 안정화 긴급 조치 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`증시 급락에 반대매매 우려 확산 - 매일경제`,url:`https://www.mk.co.kr/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`고금리 장기화와 대출 규제 강화 여파로 서울 아파트값 상승폭이 3주 연속 둔화세를 보이고 있습니다.`,
  metrics:[`상승폭 3주 연속 둔화`,`주택공급 통합지원센터 신설`],
  summary:`최근 서울 아파트 시장은 매수 심리가 꺾이며 상승폭이 3주 연속 둔화세를 나타내고 있습니다. 이는 고금리 기조가 장기화되는 가운데 정부의 엄격한 대출 규제가 시행되면서 매수자들의 자금 조달이 어려워졌기 때문입니다. 특히 스트레스 DSR 도입 등으로 주택담보대출 한도가 줄어들며 짙은 관망세가 확산되고 있습니다. 이에 국토교통부는 수요 위축을 방지하고 안정적인 주택 공급을 이어가기 위해 주택공급 통합지원센터를 신설하는 등 공급 대책 후속 조치를 서두르고 있습니다. 건설업계 역시 분양 일정 조율과 사업성 재검토에 나서는 등 시장 변화에 민감하게 반응하고 있습니다. 전문가들은 연말까지 뚜렷한 금리 인하 신호가 없다면 현재의 거래 절벽 현상이 당분간 지속될 것으로 내다보고 있습니다.`,
  keyTerms:[{term:`대출 규제`,explanation:`가계부채 폭증을 막기 위해 정부가 금융기관을 통해 개인의 대출 한도를 억제하는 정책입니다. 소득 대비 원리금 상환 비율을 엄격하게 적용하는 것이 대표적입니다.`}],
  history:`과거 수년간 저금리 기조 속에서 폭등했던 서울 아파트값은 최근 금리 인상 사이클과 맞물려 조정과 반등을 반복해왔습니다.`,
  players:`아파트 매수 및 매도자, 시중 은행, 그리고 정책을 조율하는 국토교통부 및 금융위원회가 얽혀 있습니다.`,
  current:`금리 부담과 대출 문턱 상승이 동시에 작용하면서 매수 심리가 빠르게 얼어붙고 거래량이 급감하는 변곡점에 서 있습니다.`,
  outlook:`정부의 공급 지원책이 실질적인 착공으로 이어질지, 그리고 한국은행의 기준금리 인하 시점이 언제가 될지에 따라 부동산 시장의 방향이 결정될 전망입니다.`,
  sources:[{title:`서울 아파트값 상승폭 3주째 축소 - 한국경제`,url:`https://www.hankyung.com/`},{title:`매수 심리 꺾인 부동산 시장 - KBS`,url:`https://news.kbs.co.kr/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국의 10월 비농업 일자리가 예상치를 크게 웃돌며 연준의 12월 기준금리 추가 인상 가능성이 급부상했습니다.`,
  metrics:[`비농업 일자리 16.5만 개 증가`,`12월 금리 인상 확률 78%`],
  summary:`미국 노동부가 발표한 10월 비농업 일자리가 16만 5천 개 증가하며 시장 예상치인 6만 5천 개를 두 배 이상 훌쩍 넘겼습니다. 같은 기간 실업률 역시 4.1%로 하락하며 미국 노동시장이 여전히 매우 견조함을 증명했습니다. 이러한 고용 호조는 경기 침체 우려를 씻어냈지만, 동시에 인플레이션 재점화에 대한 불안감을 키우고 있습니다. 시장 참가자들은 연방준비제도가 다가오는 12월 FOMC 회의에서 기준금리를 추가 인상할 확률을 약 78%까지 높여 잡았습니다. 고용 지표 발표 직후 미국 10년물 국채금리는 4.85%대로 급등했고 달러화 역시 강세를 보였습니다. 강력한 고용 데이터가 역설적으로 통화 긴축 장기화 우려를 낳으며 글로벌 금융시장의 불확실성을 키우고 있습니다.`,
  keyTerms:[{term:`비농업 일자리`,explanation:`농축산업을 제외한 미국 전체 산업에서 한 달 동안 새롭게 늘어난 일자리 수입니다. 미국 경제의 성장세와 소비 여력을 보여주는 가장 중요한 경제 지표 중 하나입니다.`}],
  history:`미국 연방준비제도는 인플레이션을 잡기 위해 공격적인 금리 인상을 단행해 왔으나, 최근 물가 안정 조짐을 보이며 금리 인하 기대감이 형성되던 중이었습니다.`,
  players:`통화 정책을 결정하는 미국 연방준비제도, 고용을 창출하는 미국 기업들, 그리고 금리 변동에 베팅하는 글로벌 월가 투자자들이 핵심 주체입니다.`,
  current:`예상 밖의 뜨거운 고용 지표가 발표되면서, 시장은 금리 인하 기대감을 접고 긴축의 장기화 가능성에 대비하며 채권 금리가 요동치고 있습니다.`,
  outlook:`다음 달 발표될 미국 소비자물가지수 결과와 연준 위원들의 발언 수위에 따라 12월 금리 인상 여부가 최종 확정될 것입니다.`,
  sources:[{title:`US Job Growth Surges Past Expectations - Reuters`,url:`https://www.reuters.com/`},{title:`Bond Yields Spike on Robust Payrolls - Bloomberg`,url:`https://www.bloomberg.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`야당 주도로 발의된 이른바 조작기소 특검법이 여당의 필리버스터 종료 직후 국회 본회의를 강행 통과했습니다.`,
  metrics:[`무제한 토론 24시간 후 종료`,`대통령 국정 지지율 41%`],
  summary:`윤석열 정부 시절 발생한 수사 및 기소 조작 의혹의 진상을 규명하겠다는 명목으로 야당이 밀어붙인 특검법이 국회 문턱을 넘었습니다. 야당은 압도적인 의석수를 앞세워 여당의 거센 반발을 무력화시켰습니다. 국민의힘은 이를 막기 위해 필리버스터 전술을 펼쳤으나 무제한 토론이 표결로 강제 종료된 후 본회의 처리가 강행되었습니다. 여당은 이번 특검법을 명백한 야당 대표 방탄용 악법이자 사법부 재판 개입으로 규정하고 강력한 장외 투쟁을 예고했습니다. 반면 야권 내부 일부에서도 법안의 수사 범위가 지나치게 방대하다는 우려의 목소리가 나오고 있습니다. 대통령의 거부권 행사 가능성이 매우 높은 가운데 여야 간의 극단적인 대치 정국은 연말까지 이어질 전망입니다.`,
  keyTerms:[{term:`필리버스터`,explanation:`국회에서 다수파가 표결로 법안을 강행 처리하려는 것을 막기 위해 소수파 의원들이 합법적인 방법으로 장시간 연설을 하여 의사진행을 고의로 방해하는 행위입니다.`}],
  history:`특검법 도입을 둘러싼 여야의 갈등은 현 정부 출범 이후 끊임없이 반복되어 왔으며, 거대 야당의 입법 독주와 대통령의 거부권 행사가 공식처럼 굳어지고 있습니다.`,
  players:`입법을 주도하는 더불어민주당 등 야권, 이를 저지하려는 국민의힘, 그리고 최종 재의요구권을 쥔 대통령실이 격렬하게 대립하고 있습니다.`,
  current:`국회 내 합의 기구는 사실상 마비되었고, 법안 통과 직후 양측이 지지층 결집을 위한 여론전에 돌입하며 정국이 급격히 얼어붙고 있습니다.`,
  outlook:`대통령이 해당 법안에 대해 거부권을 행사할 경우 국회로 돌아와 재표결을 거치게 되며, 이 과정에서 여당 내 이탈표 규모가 최대 관전 포인트가 될 것입니다.`,
  sources:[{title:`조작기소 특검법 본회의 통과... 여당 강력 반발 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`끝없는 거부권 정국... 얼어붙은 국회 - 조선일보`,url:`https://www.chosun.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`이용철 전 방위사업청장이 신임 법무부 장관 후보자로 지명되면서 여야 간 치열한 인사청문회 공방이 예고되고 있습니다.`,
  metrics:[`후보자 지명 직후 야당 반발`,`이달 중순 청문회 예정`],
  summary:`대통령실이 새 법무부 장관 후보자로 방위사업청장을 지낸 이용철 후보자를 전격 지명했습니다. 이용철 후보자는 지명 소감에서 검찰개혁 완수와 형사사법체계의 안정적인 안착을 최우선 과제로 삼겠다고 강조했습니다. 그러나 야당은 강하게 반발하며 송곳 검증을 벼르고 있습니다. 특히 야권은 후보자가 과거 대장동 사건과 관련된 의혹이 있다며 공소 취소를 노린 방탄 인사라고 맹비난하고 있습니다. 현재 정국의 불확실성이 큰 가운데, 이번 인사는 향후 정국 주도권을 쥐기 위한 승부수로 풀이됩니다. 인사청문회 과정에서 후보자의 과거 행적과 정치적 편향성 여부가 최대 쟁점으로 떠오르며 여야의 극한 충돌이 불가피해 보입니다.`,
  keyTerms:[{term:`인사청문회`,explanation:`대통령이 국가의 핵심 고위 공직자를 임명하기 전에, 국회에서 해당 후보자가 업무 능력을 갖추었는지와 도덕성에 흠결이 없는지를 검증하는 제도입니다.`}],
  history:`역대 정부마다 법무부 장관 인사는 검찰에 대한 통제권과 맞물려 여야의 가장 치열한 정치적 전장으로 기능해 왔습니다.`,
  players:`후보자를 방어하고 개혁을 추진하려는 정부 여당과, 도덕성 흠결을 파헤쳐 정권에 타격을 입히려는 거대 야당이 주요 행위자입니다.`,
  current:`야당이 제기한 묵은 의혹들이 언론을 통해 재조명되면서, 청문회 전부터 후보자의 적격성 논란이 정국의 핵심 이슈로 급부상했습니다.`,
  outlook:`이달 중순으로 예정된 국회 청문회 결과와 보고서 채택 여부에 따라 정국 경색의 수위가 결정될 것으로 예상됩니다.`,
  sources:[{title:`이용철 법무부 장관 후보 지명... 험로 예고 - 중앙일보`,url:`https://www.joongang.co.kr/`},{title:`여야, 법무장관 인선 두고 대리전 양상 - 연합뉴스`,url:`https://www.yna.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 중간선거 여파로 트럼프 대통령이 백악관 비서실장을 교체하고, 민주당이 하원 다수당을 탈환하며 정치 지형이 요동치고 있습니다.`,
  metrics:[`민주당 하원 다수당 탈환`,`사상 첫 흑인 하원의장 유력`],
  summary:`최근 치러진 미국 선거 결과가 미국 정치의 권력 구도를 완전히 뒤흔들고 있습니다. 중간선거 패배의 책임을 물어 트럼프 대통령은 수지 와일스 백악관 비서실장을 경질하고, 초강경파로 분류되는 스티븐 밀러를 신임 비서실장으로 전격 임명했습니다. 이와 동시에 민주당이 하원 다수당 지위를 극적으로 탈환함에 따라, 하킴 제프리스 민주당 원내대표가 미국 역사상 최초의 흑인 하원의장에 오를 것이 확실시되고 있습니다. 행정부 내부에서도 국가안보국장을 비롯한 주요 법무부 당국자들이 결과 확정 직후 줄사퇴를 표명하며 극심한 혼란이 빚어지고 있습니다. 백악관의 우경화와 의회를 장악한 민주당의 견제가 정면충돌할 것으로 예상되면서 미국의 정책 불확실성이 최고조에 달하고 있습니다.`,
  keyTerms:[{term:`중간선거`,explanation:`미국에서 대통령의 4년 임기 한가운데 치러지는 선거입니다. 보통 상하원 의원들을 선출하며, 현직 대통령의 국정 운영에 대한 국민들의 중간 평가 성격을 띱니다.`}],
  history:`미국 정치에서 임기 중반에 치러지는 선거는 대체로 집권 여당의 무덤으로 불리며, 그 결과에 따라 집권 후반기 대통령의 정책 추진 동력이 크게 좌우됩니다.`,
  players:`강경 보수 노선을 강화하려는 트럼프 행정부와, 입법권을 무기로 대통령을 강력하게 견제하려는 하원 다수당 민주당이 맞붙게 됩니다.`,
  current:`의회 권력을 일부 잃은 백악관이 핵심 참모진을 강경파로 물갈이하며 내부 결속을 다지는 한편, 국정 기조 전환을 시도하고 있습니다.`,
  outlook:`새롭게 재편된 하원이 개원하면 대통령의 주요 예산안과 정책 법안을 둘러싼 행정부와 입법부 간의 벼랑 끝 대치가 연일 이어질 전망입니다.`,
  sources:[{title:`White House Shakeup Follows Midterm Losses - Reuters`,url:`https://www.reuters.com/`},{title:`Democrats Retake House Control - AP News`,url:`https://apnews.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`한국과 일본의 주요 금융 및 유통망을 겨냥한 AI 기반 해킹과 대규모 고객 개인정보 유출 사고가 발생해 비상이 걸렸습니다.`,
  metrics:[`양국 300만 명 이상 정보 유출`,`유사한 AI 침투 패턴 확인`],
  summary:`한국과 일본의 주요 금융기관과 대형 유통망이 신종 해킹 공격에 뚫리며 300만 명이 넘는 고객의 개인정보가 유출되는 초유의 사태가 발생했습니다. 보안업계 분석에 따르면, 이번 공격은 철통 보안이 유지되는 핵심 내부 전산망을 직접 노리지 않았습니다. 대신 상대적으로 덜 보호받는 임시 클라우드 파일이나 외부 연동 페이지 해킹 수법을 통해 침투했습니다. 특히 양국을 강타한 공격에서 인공지능을 활용해 취약점을 자동으로 탐지하는 동일한 AI 침투 도구가 사용된 정황이 확인되었습니다. 이로 인해 생활 밀착형 플랫폼들의 느슨한 데이터 관리 체계에 대한 비판이 커지고 있습니다. 정부는 긴급 점검에 나섰으며, 기업들은 외부 서비스 연동 시의 보안 인프라를 전면 재검토해야 하는 상황에 직면했습니다.`,
  keyTerms:[{term:`외부 연동 페이지 해킹`,explanation:`기업의 가장 중요한 핵심 서버를 직접 공격하는 대신, 그 서버와 연결되어 있는 보안이 약한 하청업체 시스템이나 외부 서비스 웹페이지를 통해 우회 침투하는 해킹 수법입니다.`}],
  history:`기업 내부 보안망이 갈수록 튼튼해지면서, 해커들은 뚫기 힘든 정문 대신 파트너사나 외곽 시스템이라는 보안의 사각지대를 집중적으로 노려왔습니다.`,
  players:`데이터 탈취를 노리는 국제 해커 조직, 개인정보를 관리하는 한일 양국의 기업들, 그리고 이를 방어하는 사이버 보안 기관들이 대응 중입니다.`,
  current:`해커들이 AI를 이용해 시스템의 빈틈을 실시간으로 찾아내 공격하는 방식으로 진화하면서, 기존의 수동적 보안 체계가 무너진 상태입니다.`,
  outlook:`유출된 개인정보가 보이스피싱 등 2차 범죄에 악용될 위험이 크며, 양국 정부의 공조 수사를 통한 해커 조직 소탕 여부가 주목받고 있습니다.`,
  sources:[{title:`한일 금융망 강타한 신종 해킹 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`플랫폼 보안 구멍 뚫렸다 - SBS`,url:`https://news.sbs.co.kr/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`일상 환경에서 챗GPT가 연동된 AI 스마트 안경을 악용한 시험 부정행위 사례가 적발되며 파장이 일고 있습니다.`,
  metrics:[`스마트 기기 부정행위 다수 적발`,`가이드라인 전면 개편 착수`],
  summary:`최근 대학가와 각종 자격증 시험장에서 첨단 웨어러블 기기를 이용한 신종 부정행위가 잇따라 적발되어 교육계가 발칵 뒤집혔습니다. 학생들은 겉보기엔 평범한 뿔테 안경과 똑같이 생긴 AI 안경 장비를 착용하고 시험장에 입장했습니다. 안경테에 내장된 초소형 카메라가 시험 문제를 촬영해 전송하면, 연동된 인공지능이 실시간으로 답안을 분석해 무선 이어폰으로 정답을 은밀하게 알려주는 수법을 썼습니다. 일상 속으로 파고든 기기가 부정행위에 완벽하게 악용되면서, 금속탐지기 같은 기존의 아날로그식 감독 방식은 한계를 드러냈습니다. 교육 당국은 부랴부랴 시험장 내 모든 형태의 스마트 기기 반입을 원천 차단하는 가이드라인 마련에 착수했습니다. 혁신 기술의 편리함 이면에 숨겨진 부작용을 막기 위한 철저한 검증이 시급하다는 목소리가 큽니다.`,
  keyTerms:[{term:`AI 안경`,explanation:`일반 안경의 형태를 하고 있지만, 카메라와 마이크가 내장되어 주변 상황을 인식하고 챗GPT 같은 인공지능과 무선으로 연결되어 정보를 주고받는 차세대 스마트 기기입니다.`}],
  history:`과거에는 스마트폰이나 이어폰을 몰래 숨겨 들어가는 단순한 방식이 주를 이뤘으나, 초소형 기기의 발전으로 수법이 극도로 고도화되고 있습니다.`,
  players:`첨단 기기를 악용하려는 일부 수험생들과 공정한 평가 시스템을 유지해야 하는 학교 및 국가 시험 주관 기관들이 대립하고 있습니다.`,
  current:`눈에 띄지 않는 기기의 특성 탓에 현장 감독관의 육안 관찰만으로는 적발이 불가능해지면서 시험 평가의 공정성이 훼손될 위기입니다.`,
  outlook:`모든 전자기기의 시험장 반입을 차단하는 강력한 규정과 함께, 전파 탐지 기술 고도화 등 감독 시스템의 전면 개편이 논의될 것입니다.`,
  sources:[{title:`첨단 웨어러블 악용 시험 부정행위 발각 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`시험장 뚫린 스마트 글래스 - 동아일보`,url:`https://www.donga.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`막대한 전력 소모와 환경 훼손 리스크가 부각되며 미국 및 유럽 내 데이터센터 신규 건설에 급제동이 걸리고 있습니다.`,
  metrics:[`미국 내 건설 용량 30% 지연 위험`,`주요 빅테크 환경 시위 직면`],
  summary:`폭발적으로 성장하던 글로벌 인공지능 산업이 전력 인프라 부족과 거센 환경 단체의 반발이라는 현실적인 벽에 부딪혔습니다. 미국 선거 이후 환경 규제가 다시 조명을 받으면서, 신규 건설에 따른 데이터센터 전력망 리스크 문제가 급부상했습니다. 투자은행 UBS는 2028년까지 미국 내 건설이 계획된 용량의 최대 30%가 인허가 지연으로 무산될 위기에 처했다고 분석했습니다. 실제로 유럽 암스테르담에서는 글로벌 빅테크 업체의 공사 현장에 환경 시위대가 난입하는 등 지역 주민들의 반발이 거세게 일고 있습니다. 이에 따라 주요 기업들은 사막 지대나 규제가 덜한 해외로 눈을 돌리며 계획을 전면 수정하고 있습니다. 인프라 투자 장기화에 대한 회의론이 퍼지면서 유망 스타트업의 기업 가치마저 흔들리며 관련 기술주가 롤러코스터 장세를 보이고 있습니다.`,
  keyTerms:[{term:`데이터센터 전력망 리스크`,explanation:`수만 대의 고성능 서버가 돌아가는 시설이 막대한 전력을 빨아들이면서, 국가 전체의 전기 공급 시스템에 과부하를 일으키고 블랙아웃을 유발할 수 있는 위험입니다.`}],
  history:`생성형 AI 열풍이 불면서 주요 테크 기업들은 인공지능 학습과 구동을 위한 대규모 전산 시설을 전 세계에 앞다투어 지어왔습니다.`,
  players:`인프라 확장을 꾀하는 거대 기술 기업들과 이를 막아 지역 생태계와 안정적인 전기 공급을 보호하려는 환경 단체 및 지방 정부가 갈등 중입니다.`,
  current:`전기를 무한정 소비하는 시설이 지역 사회의 자원을 고갈시킨다는 비판이 커지면서 건설 인허가 자체를 거부하는 움직임이 확산되고 있습니다.`,
  outlook:`기업들이 원자력 발전소와 직접 계약을 맺거나 자체 친환경 에너지를 확보하지 못한다면 차세대 기술 개발 속도가 눈에 띄게 둔화될 것입니다.`,
  sources:[{title:`AI Infrastructure Faces Severe Power Hurdles - Bloomberg`,url:`https://www.bloomberg.com/`},{title:`Environmental Protests Halt Cloud Expansion - Reuters`,url:`https://www.reuters.com/`}]
}]

  tag:`2026-11-06`,
  label:`2026년 11월 6일 (금)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국 수출이 10월 한 달간 역대 2위 규모인 1,152억 달러를 기록하며 연간 1조 달러 달성을 눈앞에 두고 있습니다.`,
  metrics:[`10월 수출 1,152억 달러`,`전년 대비 93.7% 증가`],
  summary:`한국의 10월 수출액이 전년 동월 대비 93.7% 급증한 1,152억 8,000만 달러를 기록했습니다. 이는 역대 월간 기준 두 번째로 큰 규모로, 특히 반도체 등 IT 품목이 실적을 견인했습니다. 올해 10월까지 누적 수출액은 9,300억 달러를 돌파하며 연간 수출 1조 달러 달성이라는 대기록에 한 걸음 더 다가섰습니다. 이러한 수출 호조는 425억 달러의 무역수지 흑자를 이끌어내며 국가 경제의 버팀목 역할을 하고 있습니다. 무엇보다 AI 전력망 관련 기기와 일반기계 수출이 함께 늘어난 것이 긍정적입니다. 다만 반도체 편중 현상이 심해 글로벌 빅테크 기업들의 투자 변동성에 취약할 수 있다는 우려도 나옵니다.`,
  keyTerms:[{term:`무역수지 흑자`,explanation:`수출액이 수입액보다 많아 외화를 벌어들인 상태를 뜻합니다. 국가의 경제 기초 체력을 튼튼하게 만들어 줍니다.`}],
  history:`한국은 제조업 기반 수출 주도형 경제 체제를 유지해왔습니다. 최근 몇 년간 글로벌 반도체 사이클에 따라 수출 실적이 크게 출렁이는 모습을 보였습니다.`,
  players:`삼성전자, SK하이닉스 등 주요 반도체 기업과 자동차, 조선 업계가 핵심 플레이어입니다. 미국과 중국 등 주요 수입국의 경제 상황도 큰 영향을 미칩니다.`,
  current:`AI 산업 붐으로 데이터센터용 고성능 반도체 수요가 폭증하면서 수출이 전례 없는 호조를 보이고 있습니다.`,
  outlook:`11월 중 연간 수출 1조 달러 고지를 밟을 것으로 확실시됩니다. 향후 빅테크 기업들의 설비 투자 속도에 따라 수출 증가세가 결정될 것입니다.`,
  sources:[{title:`10월 수출 역대 2위 - 시사월드`,url:`https://sisaworld.kr`},{title:`연간 1조 달러 눈앞 - 부산일보`,url:`https://busan.com`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`3분기 실질 GDP가 1.0% 성장했지만, 민간소비는 0.2% 감소하며 수출과 내수 간 양극화가 심화되고 있습니다.`,
  metrics:[`3분기 GDP 1.0% 성장`,`민간소비 0.2% 감소`],
  summary:`한국은행이 발표한 3분기 경제 지표에 따르면 실질 국내총생산(GDP)은 전 분기 대비 1.0% 성장했습니다. 그러나 경제 성장의 또 다른 축인 민간소비는 오히려 0.2% 뒷걸음질 쳤습니다. 이는 수출 호황과 내수 부진이 뚜렷하게 대비되는 양극화 현상을 여실히 보여줍니다. 10월 소비자물가 상승률이 2.8%로 둔화되었음에도 여전히 목표치를 웃돌고 있어 서민들의 체감 경기는 얼어붙어 있습니다. 특히 가공식품과 석유류 등 생활 필수재 가격 상승이 구매력을 짓누르고 있는 상황입니다. 결과적으로 거시적인 경제 성장률은 올랐지만 국민들의 지갑은 굳게 닫혀 있는 불균형 상태가 지속되고 있습니다.`,
  keyTerms:[{term:`양극화 현상`,explanation:`경제나 사회 현상이 중간 없이 양극단으로 쏠리는 것을 말합니다. 여기서는 수출 기업은 호황을 누리지만 일반 국민의 내수 소비는 침체된 상황을 의미합니다.`}],
  history:`코로나19 팬데믹 이후 지속된 고금리와 고물가는 가계의 가처분 소득을 크게 줄였습니다. 반면 반도체를 중심으로 한 수출 대기업들은 빠르게 실적을 회복했습니다.`,
  players:`금리를 결정하는 한국은행과 물가 안정을 책임지는 정부, 그리고 체감 경기를 겪는 일반 가계가 핵심 주체입니다.`,
  current:`지표상 경제 성장과 달리 내수 침체의 골이 깊어지면서 금리 인하 등 부양책에 대한 시장의 요구가 커지고 있습니다.`,
  outlook:`한국은행의 추가 금리 조정 여부가 내수 회복의 열쇠가 될 전망입니다. 정부의 체감 물가 안정 대책의 실효성도 시험대에 오를 것입니다.`,
  sources:[{title:`3분기 GDP 1.0% 성장 - GI Prism`,url:`https://giprism.com`},{title:`내수 침체 장기화 - KDI`,url:`https://kdi.re.kr`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 중간선거 직후 관세 완화 기대감으로 유통주가 강세를 보인 반면, 규제 우려로 AI 반도체주는 하락했습니다.`,
  metrics:[`S&P 500 1.6% 급등`,`국제 유가 90달러 하회`],
  summary:`미국 중간선거에서 민주당이 승리한 직후 정책 불확실성이 줄어들며 뉴욕 증시의 S&P 500 지수가 단기적으로 1.6% 급등했습니다. 선거 결과로 인해 기존의 무리한 관세 정책이 축소될 것이라는 기대감이 커지면서 월마트 등 대형 수입·유통 소비재 주가가 크게 올랐습니다. 반면 인공지능과 데이터센터 전력망 등에 대한 민주당의 환경 규제 강화 우려가 제기되었습니다. 이로 인해 그동안 급등했던 엔비디아 등 주요 기술주를 중심으로 차익 매물이 쏟아지며 주가가 조정을 받았습니다. 결과적으로 선거라는 정치적 이벤트가 산업 섹터별로 뚜렷하게 엇갈린 주가 흐름을 만들어냈습니다. 앞으로 며칠간은 새 의회의 구체적 입법 방향에 따라 시장 변동성이 계속될 것으로 보입니다.`,
  keyTerms:[{term:`차익 매물`,explanation:`주가가 많이 올랐을 때 이익을 실현하기 위해 시장에 내다 파는 주식을 뜻합니다. 보통 주가가 크게 오른 후 불안감이 커질 때 많이 발생합니다.`}],
  history:`최근 몇 년간 뉴욕 증시는 AI 붐에 힘입어 대형 기술주들이 랠리를 이끌어왔습니다. 동시에 트럼프 행정부의 강경한 보호무역주의가 수입 업계에 큰 부담이 되었습니다.`,
  players:`글로벌 투자자들과 월마트 같은 소비재 기업, 그리고 엔비디아 등 빅테크 기업들이 시장의 주도권을 쥐고 있습니다.`,
  current:`민주당이 의회를 장악하면서 기존 정책의 궤도 수정이 불가피해졌고, 이에 따라 투자자들의 포트폴리오 재조정이 활발하게 일어나고 있습니다.`,
  outlook:`새 의회가 실제로 어떤 산업 규제와 세금 정책을 내놓을지가 관건입니다. 특히 연준의 12월 금리 결정 방향이 시장의 다음 변곡점이 될 것입니다.`,
  sources:[{title:`미 중간선거 증시 반응 - ENCA`,url:`https://enca.com`},{title:`금리 동결과 연준 전망 - Crestwood Advisors`,url:`https://crestwoodadvisors.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 중간선거에서 민주당이 상원과 하원을 모두 탈환하는 '블루 웨이브' 압승을 거두며 정국 주도권을 쥐었습니다.`,
  metrics:[`민주당 상하원 다수당 탈환`,`트럼프 방어 정국 진입`],
  summary:`2026년 11월 3일 치러진 미국 중간선거에서 민주당이 연방 상원과 하원을 모두 휩쓸며 강력한 정치적 승리를 기록했습니다. 이번 선거 결과로 인해 트럼프 행정부의 관세 인상과 주요 정책 드라이브에 강력한 제동이 걸리게 되었습니다. 입법 주도권을 잃은 트럼프 대통령은 남은 2년의 임기 동안 의회의 법안을 막기 위해 거부권 행사에 의존하는 방어적 정국 운영이 불가피해졌습니다. 이는 미국의 대외 무역 정책과 연방준비제도(Fed)의 통화 정책 독립성에도 큰 영향을 미칠 전망입니다. 특히 연준의 이사진 교체 등 행정부의 무리한 개입 시도가 의회의 문턱을 넘지 못할 것으로 보입니다. 결과적으로 미국의 국내 정치뿐만 아니라 글로벌 경제와 외교 지형에도 상당한 파장이 예상됩니다.`,
  keyTerms:[{term:`거부권`,explanation:`대통령이 의회에서 통과된 법안을 승인하지 않고 되돌려 보내는 권한입니다. 의회의 다수당이 반대파가 되었을 때 대통령이 쓸 수 있는 가장 강력한 방어 수단입니다.`}],
  history:`미국은 대통령의 임기 중간에 치러지는 선거에서 통상적으로 여당이 고전하는 징크스를 보여왔습니다. 이번 선거도 현직 행정부에 대한 견제 심리가 크게 작용했습니다.`,
  players:`도널드 트럼프 대통령을 필두로 한 공화당과, 의회 다수당을 차지한 민주당 지도부가 권력 투쟁의 중심에 있습니다.`,
  current:`행정부와 입법부의 권력이 양분되면서 주요 예산안과 법안 처리를 두고 치열한 기싸움이 벌어지고 있습니다.`,
  outlook:`2028년 대선을 앞두고 양당의 정치적 셈법이 더욱 복잡해질 것입니다. 특히 우크라이나 지원이나 대중국 정책 등 외교 노선에서 의회의 발언권이 강해질 전망입니다.`,
  sources:[{title:`민주당 블루웨이브 압승 - Virginia.edu`,url:`https://virginia.edu`},{title:`미국 중간선거 결과 파장 - The Guardian`,url:`https://theguardian.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`야당 주도의 '조작기소 특검법' 본회의 상정에 여당이 필리버스터로 맞서며 국회가 극심한 파행을 겪고 있습니다.`,
  metrics:[`특검법 상정 강행`,`무제한 토론 돌입`],
  summary:`더불어민주당 주도로 '조작수사·조작기소 특검법'이 국회 본회의에 전격 상정되었습니다. 이에 국민의힘은 강력히 반발하며 법안 통과를 지연시키기 위해 즉각적인 무제한 토론에 돌입했습니다. 동시에 여당은 장외 규탄대회까지 병행하며 정치적 대립을 극대화하고 있습니다. 이러한 극한의 여야 대치 정국으로 인해 당초 처리될 예정이었던 '주택공급 3법' 등 주요 경제 및 민생 법안들의 일정이 기약 없이 미뤄졌습니다. 정치적 쟁점 법안이 국회의 모든 기능을 마비시키면서 국민들의 피로감도 함께 커지고 있습니다. 향후 국회가 정상화되기 전까지 시급한 정책 현안들이 계속 표류할 것이란 우려가 나옵니다.`,
  keyTerms:[{term:`무제한 토론`,explanation:`의회에서 소수파가 다수파의 법안 통과를 막기 위해 시간 제한 없이 합법적으로 계속해서 발언하는 행위를 말합니다. 필리버스터라고도 부릅니다.`}],
  history:`한국 정치는 과거부터 주요 특검법이나 쟁점 법안을 두고 여야가 극한 대립을 반복해왔습니다. 법안 강행 처리와 의사진행 방해는 단골 메뉴로 등장했습니다.`,
  players:`다수 의석을 무기로 특검법을 추진하는 더불어민주당과, 이를 저지하려는 소수 여당 국민의힘이 정면 충돌하고 있습니다.`,
  current:`양측 모두 한 치의 양보 없는 강경한 태도를 유지하고 있어 협치나 타협의 여지가 극히 좁아진 상태입니다.`,
  outlook:`특검법 통과 여부와 별개로, 연말 예산안 심사 정국까지 여야의 가파른 대치 전선이 이어질 것으로 예상됩니다.`,
  sources:[{title:`특검법 상정과 필리버스터 - 동아일보`,url:`https://donga.com`},{title:`민생법안 처리 불발 - 뉴스핌`,url:`https://newspim.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`호르무즈 해협의 긴장 고조에 따라 정부가 청해부대 파견 연장을 위한 수정 동의안을 국회에 제출합니다.`,
  metrics:[`파견 기한 1년 연장 추진`,`해상초계기 전력 증강`],
  summary:`중동 호르무즈 해협 인근의 지정학적 긴장이 최고조에 달하면서 정부가 발 빠르게 대응에 나섰습니다. 정부는 기존 청해부대의 임무와 작전 구역을 조정하고 파견 기간을 연장하는 내용의 수정 동의안을 국회에 제출하기로 결정했습니다. 이번 안에는 호르무즈 인근의 원유 수송로 안전을 확보하기 위해 해상초계기 등 추가 전력을 배치하는 방안이 포함된 것으로 알려졌습니다. 중동 지역의 안보는 에너지 수입 의존도가 높은 한국 경제에 직결되는 사안이기 때문입니다. 파병 연장과 전력 증강을 두고 국회 내부에서는 국익 수호와 분쟁 휘말림 우려를 놓고 찬반 논의가 뜨거워질 전망입니다. 향후 국회의 표결 결과에 따라 한국군의 중동 지역 작전 수행 방향이 확정됩니다.`,
  keyTerms:[{term:`동의안`,explanation:`정부가 군대의 해외 파병이나 조약 체결 등 국가적으로 중요한 결정을 내릴 때 미리 국회의 허락을 구하기 위해 내는 문서입니다.`}],
  history:`청해부대는 원래 소말리아 아덴만 해역에서 해적 퇴치와 선박 호송 임무를 수행해왔으나, 최근 중동 정세 불안으로 작전 반경을 넓히는 추세입니다.`,
  players:`중동의 원유를 수송하는 한국 해운사들과 이를 보호할 국방부, 그리고 파병의 법적 근거를 쥐고 있는 국회가 주요 이해관계자입니다.`,
  current:`호르무즈 해협을 둘러싼 관련국들의 군사적 마찰이 빈번해지면서 통항 선박들의 안전이 심각하게 위협받고 있습니다.`,
  outlook:`국회 국방위원회 심사를 거쳐 본회의에서 파견 연장 여부가 최종 결정될 예정입니다. 야당의 까다로운 송곳 검증이 예상됩니다.`,
  sources:[{title:`청해부대 호르무즈 파견 연장안 - 한겨레`,url:`https://hani.co.kr`},{title:`해상초계기 전력 추가 배치 - MBC`,url:`https://imbc.com`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`국내 생성형 AI 매일 이용자 비율이 16%로 급증했지만, 제공되는 정보에 대한 신뢰도는 14%로 글로벌 평균에 못 미치고 있습니다.`,
  metrics:[`생성형 AI 일일 사용률 16%`,`AI 정보 신뢰도 14%`],
  summary:`유로모니터의 최신 조사에 따르면, 한국인의 생성형 AI 일일 사용률이 작년 7%에서 올해 16%로 크게 증가하며 일상 속에 빠르게 스며들었습니다. 하지만 인공지능이 일상화된 것과는 대조적으로 쇼핑이나 구매 결정 시 AI 정보를 매우 신뢰한다는 응답은 14%에 불과했습니다. 이는 글로벌 평균인 19%보다 현저히 낮은 수치로, 한국 소비자들이 AI의 답변을 참고는 하되 맹신하지는 않고 있음을 보여줍니다. 전문가들은 이를 기술의 활용도는 높으나 결과물에 대한 확신은 떨어지는 신뢰 딜레마 현상으로 진단하고 있습니다. 특히 환각 현상이나 부정확한 정보에 대한 대중의 경계심이 여전히 높은 편입니다. 기업들은 AI 서비스의 단순한 기능 확장을 넘어 데이터의 정확성과 투명성을 높이는 데 주력해야 할 시점입니다.`,
  keyTerms:[{term:`신뢰 딜레마`,explanation:`어떤 기술이나 서비스를 자주 편리하게 이용하면서도, 정작 그 기술이 내놓는 결과나 정보는 온전히 믿지 못하는 모순된 상황을 말합니다.`}],
  history:`챗GPT 등장 이후 국내에서도 수많은 기업들이 AI 어시스턴트를 출시하며 사용자 확보 경쟁을 벌여왔습니다.`,
  players:`AI 서비스를 제공하는 거대 테크 기업들과 이를 실제 생활과 쇼핑에 활용하는 일반 소비자들이 시장을 구성합니다.`,
  current:`기술적 문턱이 낮아져 누구나 쉽게 AI를 쓰게 되었지만, 부정확한 답변으로 인한 소비자 피해 사례도 함께 늘고 있습니다.`,
  outlook:`향후 AI 산업의 성패는 얼마나 자연스럽게 대화하느냐보다, 제공하는 정보의 사실 확인(팩트체크) 능력을 얼마나 고도화하느냐에 달릴 것입니다.`,
  sources:[{title:`한국인 AI 사용률 급증 이면의 과제 - 뉴스핌`,url:`https://newspim.com`},{title:`카카오 에이전틱 AI 전략 재정비 - 중앙일보`,url:`https://joongang.co.kr`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`인천시가 2040년까지 1,000억 원 규모의 자체 '기후대응기금'을 신설하고 영흥 AI 에너지 파크 조성에 나섭니다.`,
  metrics:[`목표액 1,000억 원`,`목표 연도 2040년`],
  summary:`인천시가 지자체 차원에서 2040년까지 총 1,000억 원 규모의 '기후대응기금'을 자체적으로 신설한다고 공식 발표했습니다. 이 기금은 지역 내 탄소 배출 저감과 친환경 산업 육성을 위한 마중물 역할을 하게 될 예정입니다. 인천시는 확보된 재원을 기후테크 기업 지원과 녹색금융 활성화에 집중 투자한다는 방침입니다. 또한 기금 사업의 일환으로 기존 화력발전소 인근에 대규모 '영흥 AI 에너지 파크'를 조성해 지역 경제와 환경을 동시에 살리겠다는 청사진도 제시했습니다. 최근 한국의 환경위기시계가 1년 만에 다시 위험 수준으로 악화되면서 이 같은 실질적 정책 대응의 필요성이 매우 커졌습니다. 이번 인천시의 행보는 다른 지자체들의 친환경 정책 수립에도 큰 자극제가 될 것으로 보입니다.`,
  keyTerms:[{term:`기후테크`,explanation:`온실가스를 줄이거나 기후 변화로 인한 피해를 막는 데 도움을 주는 모든 기술을 아우르는 말로, 환경 보호와 경제적 수익을 동시에 추구합니다.`}],
  history:`그동안 기후 위기 대응은 주로 중앙정부 주도로 이루어졌으나, 최근에는 각 지자체들이 지역 특성에 맞는 독자적인 탄소 중립 정책을 내놓기 시작했습니다.`,
  players:`정책을 기획하고 예산을 집행하는 인천시와 기금을 지원받게 될 친환경 스타트업 및 지역 주민들이 핵심 주체입니다.`,
  current:`AI 데이터센터 증가 등으로 막대한 전력이 필요해지면서 탄소 배출을 줄이면서도 에너지를 공급해야 하는 과제에 직면해 있습니다.`,
  outlook:`1,000억 원이라는 대규모 재원이 실제로 투명하고 효율적으로 집행될 수 있을지 세부적인 운용 계획 마련이 과제로 남았습니다.`,
  sources:[{title:`인천시 기후대응기금 신설 - IFM`,url:`https://ifm.kr`},{title:`환경위기시계 악화 - Korea Sprint`,url:`https://koreasprint.com`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`산업계의 AI 전환 가속과 경력직 선호 현상으로 인해 청년들의 취업 시장 내 'K자형 양극화'가 고착화되고 있습니다.`,
  metrics:[`경력직 선호 현상 심화`,`사무직 AI 대체율 급증`],
  summary:`기업들의 업무 방식이 인공지능 중심으로 빠르게 재편되면서 청년층의 취업 시장이 심각한 타격을 받고 있습니다. 기업들이 불확실한 경제 상황 속에서 즉시 실무에 투입할 수 있는 '중고신입'이나 경력직을 압도적으로 선호하고 있기 때문입니다. 게다가 과거 신입사원들이 맡았던 자료 조사나 단순 사무 업무의 상당 부분이 AI로 대체되면서 신규 진입 장벽이 유례없이 높아졌습니다. 이로 인해 소수의 첨단 기술 보유자들은 쉽게 취업하고 고연봉을 받는 반면, 일반 구직자들은 일자리를 찾지 못해 도태되는 K자형 양극화 현상이 뚜렷해지고 있습니다. 결국 청년 실업 문제는 단순한 경기 침체를 넘어 산업 구조의 구조적 변화에서 기인하고 있다는 분석입니다. 이에 발맞춰 대학과 정부의 직업 교육 시스템도 AI 시대에 맞게 근본적으로 뜯어고쳐야 한다는 목소리가 높습니다.`,
  keyTerms:[{term:`K자형 양극화`,explanation:`알파벳 K의 모양처럼, 한쪽은 계속 성장하고 부유해지는 반면 다른 쪽은 계속 침체되고 가난해져 격차가 극심해지는 현상입니다.`}],
  history:`과거 경제 위기 때마다 고용 한파가 있었지만, 최근의 취업난은 단순한 불황이 아니라 '디지털 전환'이라는 메가 트렌드가 결합되어 나타나고 있습니다.`,
  players:`일자리를 구하는 2030 청년 구직자들과 고숙련 인재만을 원하는 기업, 그리고 교육 정책을 담당하는 정부가 얽혀 있습니다.`,
  current:`AI 기술이 실무에 직접 도입되면서 신입 사원을 뽑아 가르쳐서 쓴다는 기업들의 전통적인 채용 공식이 완전히 붕괴되었습니다.`,
  outlook:`일자리 미스매치 현상을 풀기 위한 정부의 맞춤형 재교육 지원금이나 청년 고용 할당제 등의 새로운 사회적 합의 도출이 시급해질 것입니다.`,
  sources:[{title:`청년 취업 K자형 양극화 - Triplelight`,url:`https://triplelight.co`},{title:`AI 시대 채용 변화 - 뉴스핌`,url:`https://newspim.com`}]
}]
},{
  tag:`2026-11-05`,
  label:`2026년 11월 5일 (목)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미 중간선거 정치적 불확실성 해소… 다우지수 3% 급등 및 유가 8% 급락`,
  metrics:[`다우지수 3.03% 상승`,`국제유가 8% 이상 하락`],
  summary:`미국 중간선거 개표가 진행되면서 그동안 시장을 짓누르던 정치적 불확실성이 걷히고 있습니다. 간밤 뉴욕증시에서 우량주 중심의 다우지수는 전 거래일 대비 3.03% 급등하며 강한 반등세를 보였습니다. 동시에 중동 지역의 긴장 완화 및 종전 기대감이 반영되면서 국제유가는 8% 넘게 급락했습니다. 선거 결과 민주당이 우세를 보이자 친환경 및 신재생에너지 관련 종목들이 큰 폭으로 올랐습니다. 반면 인공지능 데이터센터 등에 대한 규제 우려로 대형 반도체 기술주들은 상대적으로 약세를 기록했습니다. 투자자들은 선거 결과가 확정됨에 따라 향후 재정 정책과 인플레이션 추이에 주목하고 있습니다. 결국 글로벌 금융시장은 위험자산 선호 심리가 되살아나면서 변동성이 줄어드는 양상을 보이고 있습니다.`,
  keyTerms:[{term:`위험자산 선호 심리`,explanation:`투자자들이 손실 위험을 감수하더라도 높은 수익을 얻기 위해 주식이나 가상자산 등에 자금을 적극적으로 투자하려는 심리를 말합니다.`}],
  history:`미국 선거를 앞두고 정책 불확실성 탓에 증시는 박스권에 갇혀 있었으며 유가 역시 불안정한 흐름을 보였습니다.`,
  players:`글로벌 투자은행, 미 연준(Fed), 그리고 친환경 정책 수혜를 입는 에너지 기업들과 규제 우려를 안은 빅테크 기업들이 핵심 주체입니다.`,
  current:`개표 결과가 어느 정도 윤곽을 드러내면서 시장은 정치적 리스크를 털어내고 빠르게 방향성을 잡아가고 있습니다.`,
  outlook:`연준의 추가 금리 인하 속도와 새 의회의 예산안 처리 과정에 따라 연말 증시의 산타랠리 여부가 결정될 전망입니다.`,
  sources:[{title:`미국 중간선거 결과에 글로벌 증시 널뛰기 - FN타임즈`,url:`https://www.fntimes.com/us-election-market`},{title:`다우지수 급등 및 유가 하락 불확실성 해소 - 블룸버그`,url:`https://www.bloomberg.com/news/markets-us-election-2026`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국 9월 경상수지 614억 달러 흑자 기록… 월간 기준 사상 첫 600억 달러 돌파`,
  metrics:[`월간 경상수지 614억 달러 흑자`,`1~9월 누적 흑자 3,400억 달러`],
  summary:`한국은행이 발표한 국제수지 통계에 따르면 9월 경상수지가 614억 달러 흑자를 기록하며 사상 최대치를 경신했습니다. 이는 월간 기준으로 사상 처음 600억 달러를 넘어선 수치이며, 1월부터 9월까지의 누적 흑자 규모도 3,400억 달러를 돌파했습니다. 이번 역대급 흑자는 글로벌 인공지능 산업 호황에 따른 반도체 수출의 폭발적인 증가세가 주도했습니다. 자동차 및 이차전지 등 주력 수출 품목들도 견조한 실적을 거두며 힘을 보탰습니다. 이러한 강력한 수출 호조세에 힘입어 해외 주요 투자은행들은 올해 한국의 경제성장률 전망치를 3.7% 수준으로 잇달아 상향 조정하고 있습니다. 내수 부진 우려 속에서도 막대한 경상수지 흑자가 거시경제의 든든한 버팀목 역할을 하는 중입니다. 향후 무역 장벽 강화나 환율 변동성 확대가 유일한 변수로 지목됩니다.`,
  keyTerms:[{term:`경상수지`,explanation:`한 국가가 외국과 물건이나 서비스를 사고팔고, 자본을 거래하여 얻은 수익과 지출의 차이를 나타내는 핵심 지표입니다.`}],
  history:`최근 몇 년간 에너지 수입액 증가로 무역적자 우려가 있었으나, AI 붐을 타고 반도체 수출이 살아나면서 흑자 기조로 돌아섰습니다.`,
  players:`삼성전자, SK하이닉스 등 주요 반도체 수출 기업들과 한국은행, 그리고 경제성장률을 전망하는 글로벌 투자은행들이 핵심입니다.`,
  current:`고환율 환경에서도 수출 단가가 높은 고부가가치 반도체 위주로 실적이 개선되어 전례 없는 수준의 달러 유입이 이뤄지고 있습니다.`,
  outlook:`미국 새 행정부의 관세 정책 변화와 중국의 경제 성장 둔화 여부가 4분기 수출 실적 및 환율 방어에 중요한 영향을 미칠 것입니다.`,
  sources:[{title:`9월 경상수지 614억 달러 흑자 역대 최대 - 동아일보`,url:`https://www.donga.com/news/economy`},{title:`해외 IB, 한국 경제성장률 전망치 상향 - 한국경제`,url:`https://www.hankyung.com/economy`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`비트코인 사상 첫 8만 달러 선 돌파… 미 선거 결과 발표 직후 자금 대거 유입`,
  metrics:[`비트코인 8만 달러 돌파`,`하루 만에 약 5% 이상 급등`],
  summary:`전 세계 암호화폐 대장주인 비트코인이 사상 처음으로 8만 달러 고지를 돌파하며 신고가를 새로 썼습니다. 미국 중간선거 개표 직후 가상자산 시장에 우호적인 정책이 입안될 것이라는 기대감이 커지면서 글로벌 자금이 대거 유입된 결과입니다. 민주당과 공화당 모두 선거 과정에서 디지털 자산 규제 완화와 제도권 편입을 시사한 점이 투심을 크게 자극했습니다. 현물 ETF를 통한 기관 투자자들의 자금 유입도 가격 상승에 강력한 동력을 제공하고 있습니다. 단기 급등에 따른 차익 실현 매물이 나올 수 있지만, 매수세가 여전히 견고하게 시장을 받치고 있는 상태입니다. 전문가들은 향후 금리 인하 사이클과 맞물려 가상자산이 새로운 대체 투자처로서 더욱 입지를 굳힐 것으로 내다보고 있습니다. 규제 불확실성이 줄어들면서 알트코인 시장까지 동반 상승하는 훈풍이 불고 있습니다.`,
  keyTerms:[{term:`현물 ETF`,explanation:`주식처럼 거래소에서 쉽게 사고팔 수 있는 펀드로, 실제 비트코인 등 기초 자산을 직접 보유하여 가격을 추종하는 금융 상품입니다.`}],
  history:`비트코인은 올해 초 현물 ETF 승인 이후 주류 금융 시장에 편입되었으며, 선거 이슈와 맞물려 지속적인 변동성을 겪어왔습니다.`,
  players:`가상자산에 우호적인 미국 정치인들, 블랙록 등 대형 자산운용사, 그리고 전 세계 암호화폐 투자자들이 시장을 주도합니다.`,
  current:`정치적 불확실성이 해소되고 규제 완화 청신호가 켜지면서 기관 자금의 대규모 유입이 8만 달러 돌파의 핵심 원동력이 되었습니다.`,
  outlook:`미국 증권거래위원회(SEC)의 추가적인 가상자산 규제 지침 발표와 글로벌 기준금리 인하 속도가 향후 가격 추이를 결정할 전망입니다.`,
  sources:[{title:`비트코인 8만 달러 돌파 - 다음 금융`,url:`https://finance.daum.net/crypto`},{title:`미 선거 직후 가상자산 자금 유입 - 로이터`,url:`https://www.reuters.com/technology/crypto`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 2026년 중간선거서 민주당 상·하원 모두 탈환… 트럼프 2기 국정 제동`,
  metrics:[`상·하원 다수당 지위 확보`,`텍사스 등 공화당 텃밭 이탈`],
  summary:`지난 3일 현지시간 치러진 2026년 미국 중간선거에서 민주당이 예상을 뒤엎고 상원과 하원을 모두 장악하는 이른바 블루나미를 일으켰습니다. 고물가 지속과 일방주의적인 대외 정책에 지친 유권자들이 표심으로 현 정권을 심판했다는 분석이 지배적입니다. 특히 텍사스와 캔자스 등 전통적인 공화당 텃밭 지역에서도 유권자들이 대거 이탈하며 민주당 후보의 손을 들어주었습니다. 이번 압승으로 민주당은 의회 내 입법 주도권을 완전히 되찾게 되었습니다. 반면 트럼프 행정부 2기는 남은 임기 동안 핵심 공약 추진에 급제동이 걸리며 조기 레임덕 위기에 처했습니다. 향후 국정 운영에서 야당인 민주당의 동의 없이는 예산안이나 주요 인사 인준이 불가능해졌습니다. 이에 따라 글로벌 외교 및 통상 정책에도 상당한 변화와 진통이 뒤따를 것으로 보입니다.`,
  keyTerms:[{term:`레임덕`,explanation:`대통령이나 정치 지도자의 임기 말에 권수 누수 현상이 발생하여 국정 장악력과 지도력이 크게 떨어지는 상태를 뜻합니다.`}],
  history:`트럼프 2기 행정부는 감세와 무역 장벽 강화를 앞세웠으나, 지속되는 인플레이션과 양극화 심화로 임기 중반부터 지지율 하락을 겪었습니다.`,
  players:`국정 주도권을 상실한 트럼프 대통령 및 공화당 지도부와, 의회 다수당을 차지하며 입법 권력을 쥔 민주당 의원들이 주요 행위자입니다.`,
  current:`선거 참패로 인해 공화당 내부에서도 책임론이 불거지고 있으며, 민주당은 그간 통과되지 못했던 주요 민생 및 친환경 법안 처리를 벼르고 있습니다.`,
  outlook:`차기 대선을 향한 양당의 기싸움이 본격화될 것이며, 백악관과 의회 간의 정책 충돌로 인해 미국 내 정치적 교착 상태가 빈번해질 전망입니다.`,
  sources:[{title:`민주당 상하원 싹쓸이 탈환 - 매일경제`,url:`https://www.mk.co.kr/news/world`},{title:`트럼프 2기 참패와 레임덕 위기 - SBS 뉴스`,url:`https://news.sbs.co.kr/news`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`사상 최대 821조 원 예산안 및 '조작기소 특검법' 본회의 격돌로 정국 급랭`,
  metrics:[`2027년도 예산안 821조 원`,`조작기소 특검법 당론 채택`],
  summary:`여야가 내년도 821조 원 규모의 사상 최대 국가 예산안과 민감한 정치 법안을 두고 정기국회에서 강하게 충돌하며 정국이 급랭하고 있습니다. 국회 예산결산특별위원회 종합정책질의에서 야당은 정부의 대규모 삭감안에 반발하며 민생 예산 증액을 강력히 요구하고 있습니다. 이와 동시에 더불어민주당은 윤석열 정부 검찰의 과거 수사와 기소 과정을 겨냥한 이른바 조작기소 특검법을 당론으로 채택하여 본회의 통과를 강행했습니다. 국민의힘은 이를 두고 야당 대표 방탄용 공소취소 특검이라며 강력히 비판하고 무제한 토론(필리버스터)을 통한 총력 저지에 돌입했습니다. 여야 간의 타협점이 보이지 않으면서 예산안 법정 처리 시한을 넘길 가능성이 농후해졌습니다. 민생 법안 처리마저 뒷전으로 밀려나면서 국정 운영의 불확실성이 극에 달하고 있습니다. 향후 대통령의 거부권 행사 여부가 정국의 중대 분수령이 될 것입니다.`,
  keyTerms:[{term:`필리버스터`,explanation:`국회에서 소수파가 다수파의 독주를 막거나 법안 통과를 지연시키기 위해 시간 제한 없이 합법적으로 토론을 이어가는 행위입니다.`}],
  history:`정권 후반기로 접어들며 여당과 거대 야당 간의 힘겨루기가 누적되어 왔으며, 검찰 수사의 공정성 시비가 정치권의 핵심 뇌관으로 작용했습니다.`,
  players:`특검을 밀어붙이는 더불어민주당과 국정 안정을 내세우며 필리버스터로 맞서는 국민의힘, 그리고 예산안 통과를 다급히 기다리는 정부 부처들입니다.`,
  current:`특검법 강행과 예산안 심사가 서로 연계되면서, 어느 한쪽도 쉽게 물러설 수 없는 치킨게임 양상의 극단적 여야 대치가 이어지고 있습니다.`,
  outlook:`정기국회 내내 여야의 강경 대치가 불가피하며, 법안이 단독 통과될 경우 대통령의 거부권 행사와 야당의 재표결 시도가 정국을 마비시킬 우려가 큽니다.`,
  sources:[{title:`조작기소 특검법 본회의 격돌 - 휴먼타임스`,url:`https://www.humantimes.kr/news`},{title:`821조 예산안 예결위 대치 - 뉴스핌`,url:`https://www.newspim.com/news`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`한-튀르키예 정상회담 개최… 시노프 원전 건설 금융협력 MOU 체결로 경제 영토 확장`,
  metrics:[`튀르키예 시노프 4기 원전 건설`,`금융협력 MOU 체결`],
  summary:`윤석열 대통령과 에르도안 튀르키예 대통령이 국빈 방한을 계기로 정상회담을 갖고 양국 간 전략적 동반자 관계를 더욱 격상하기로 합의했습니다. 가장 주목받은 성과는 튀르키예 흑해 연안 시노프 지역에 대형 원자력 발전소를 건설하는 프로젝트를 위한 금융협력 양해각서(MOU) 체결입니다. 이번 협약을 통해 한국 원전 산업은 기술력뿐만 아니라 대규모 자금 조달 능력에서도 국제적인 인정을 받게 되었습니다. 양국은 원전 이외에도 방위산업, 인프라 건설, 첨단 정보통신 기술 분야에서 포괄적인 경제 협력을 약속했습니다. 이는 한국 기업들이 중동과 유럽을 잇는 중요한 지정학적 요충지에 진출할 수 있는 강력한 교두보를 마련한 것으로 평가됩니다. 정부는 후속 조치로 민관 합동 태스크포스를 구성하여 실질적인 본계약 체결을 적극 지원할 방침입니다. 성공적인 수주가 이뤄진다면 한국형 원전 수출의 새로운 성공 신화가 탄생할 것입니다.`,
  keyTerms:[{term:`양해각서`,explanation:`정식으로 계약을 체결하기 전에 당사자들 간의 합의된 내용과 향후 협력의 원칙을 서면으로 임시 기록해 두는 문서를 의미합니다.`}],
  history:`한국과 튀르키예는 6.25 전쟁 참전의 역사적 유대를 바탕으로 깊은 신뢰를 쌓아왔으며, 최근 무역 및 인프라 건설에서 꾸준히 협력 범위를 넓혀왔습니다.`,
  players:`원전 수출을 주도하는 한국 정부 및 한수원 등 기업 컨소시엄과 인프라 확충 및 에너지 자립을 목표로 하는 에르도안 튀르키예 행정부입니다.`,
  current:`치열한 글로벌 원전 수주전 속에서, 양국 정상이 직접 만나 금융 지원 방안까지 논의함으로써 한국이 타 경쟁국보다 확고한 유리한 고지를 점했습니다.`,
  outlook:`향후 이어질 세부적인 단가 협상과 자금 조달 조건 조율이 본계약 성사의 핵심 열쇠가 될 것이며, 관련 수혜 기업들의 주가에도 영향을 줄 전망입니다.`,
  sources:[{title:`한-튀르키예 정상회담 개최 - 대한민국 대통령실`,url:`https://www.president.go.kr/news`},{title:`시노프 원전 건설 협력 MOU - 휴먼타임스`,url:`https://www.humantimes.kr/news/politics`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`오픈AI, 차세대 인프라 스타트업 '피에르 컴퓨터' 인수… AI 전용 하드웨어 설계 박차`,
  metrics:[`차세대 AI 인프라 구축`,`초거대 모델 운영 비용 대폭 절감 기대`],
  summary:`인공지능 분야의 선두주자인 오픈AI가 컴퓨팅 시스템 설계 전문 스타트업인 피에르 컴퓨터 인수를 4일 공식 발표했습니다. 이번 인수는 갈수록 천문학적으로 치솟는 거대 언어 모델(LLM)의 운영 및 학습 비용을 줄이기 위해 자체적인 하드웨어 인프라 생태계를 구축하려는 전략적 행보입니다. 피에르 컴퓨터는 칩셋 아키텍처부터 데이터센터 최적화 솔루션까지 포괄적인 기술력을 보유한 것으로 평가받습니다. 오픈AI는 이번 결합을 통해 범용 인공지능 시대를 대비한 독자적인 슈퍼컴퓨터 설계 역량을 획기적으로 강화하게 되었습니다. 나아가 엔비디아 등 기존 하드웨어 제조업체에 대한 의존도를 낮추고 AI 칩 시장에서 새로운 공급망을 확보할 발판을 마련했습니다. 전문가들은 소프트웨어와 하드웨어를 아우르는 수직 계열화가 향후 기술 패권 경쟁의 핵심이 될 것으로 분석하고 있습니다. 이 소식은 실리콘밸리 기술주 지형도에 즉각적인 파장을 일으키고 있습니다.`,
  keyTerms:[{term:`거대 언어 모델`,explanation:`방대한 양의 텍스트 데이터를 학습하여 스스로 글을 이해하고 사람처럼 자연스럽게 문장을 만들어내는 거대한 인공지능 시스템입니다.`}],
  history:`AI 모델의 성능이 기하급수적으로 발전함에 따라, 빅테크 기업들은 학습에 필요한 막대한 연산 자원과 엄청난 전기료 문제라는 병목 현상에 직면했습니다.`,
  players:`자체 하드웨어 개발로 독립을 시도하는 오픈AI와 피에르 컴퓨터, 그리고 기존 AI 칩 시장을 사실상 독점하고 있는 엔비디아와 같은 하드웨어 강자들입니다.`,
  current:`더 나은 성능과 효율을 위해 인공지능 개발사들이 자체적인 칩과 서버 설계를 시도하며 하드웨어 영역으로 사업을 폭넓게 확장하고 있는 추세입니다.`,
  outlook:`오픈AI의 독자적인 칩셋 및 서버 아키텍처가 언제 실제 데이터센터 인프라에 상용화될지가 관건이며, 이는 기존 반도체 밸류체인에 큰 위협이 될 수 있습니다.`,
  sources:[{title:`오픈AI, 피에르 컴퓨터 인수 공식화 - OpenAI 블로그`,url:`https://openai.com/blog`},{title:`차세대 하드웨어 생태계 구축 전략 - ZDNet`,url:`https://zdnet.co.kr/news`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`파테오, 엔비디아 토르 기반 'AI Box' 공개… 클라우드 연결 없는 완전 자율 차량용 비서`,
  metrics:[`350억 파라미터 로컬 구동`,`응답 지연시간 0.1초 이하 초고속 달성`],
  summary:`글로벌 스마트카 솔루션 기업 파테오가 엔비디아의 차세대 차량용 칩셋인 토르를 기반으로 한 온디바이스 차량용 인포테인먼트 기기 'AI Box'를 최초로 공개했습니다. 이 기기는 외부 클라우드 통신망 연결 없이도 차 안에서 무려 350억 개의 파라미터를 가진 대규모 인공지능 모델을 독자적으로 구동할 수 있습니다. 바이트댄스의 더우바오와 엔비디아의 자체 모델이 기기 내부에서 최적화되어 탑재되었으며 오프라인 환경에서도 원활하게 작동합니다. 차량의 공조 장치부터 복잡한 길 안내, 심지어 감정적인 대화까지 탑승자와 빠르고 끊김 없이 상호작용합니다. 기존 클라우드 방식의 고질적 문제였던 통신 지연과 개인정보 유출 우려를 온디바이스 AI 기술로 완벽하게 해결했다는 극찬을 받고 있습니다. 이를 통해 미래 커넥티드 카 시장에서 운전자의 편의성과 통신 안전성이 획기적으로 높아질 전망입니다. 향후 완전 자율주행 기능과의 결합 시너지 효과도 크게 기대됩니다.`,
  keyTerms:[{term:`온디바이스 AI`,explanation:`인터넷이나 클라우드 서버에 접속하지 않고 스마트폰, 자동차 등 사용자의 기기 자체 내부에서 직접 정보를 처리하는 빠르고 안전한 인공지능 기술입니다.`}],
  history:`기존 스마트카의 음성 비서 기능은 인터넷망을 통한 서버 처리에 의존하여, 터널이나 외곽 지역에서는 응답이 늦어지거나 작동하지 않는 치명적 한계가 있었습니다.`,
  players:`강력한 연산 칩을 공급하는 엔비디아, 혁신적인 소프트웨어를 접목한 파테오, 그리고 이를 자사 차량에 빠르게 도입하려는 글로벌 완성차 업체들입니다.`,
  current:`통신 상태에 구애받지 않고 사용자 데이터를 차량 내부에 철저히 보안 유지하며 강력한 인공지능을 활용하려는 로컬 추론 트렌드가 확산되고 있습니다.`,
  outlook:`고성능 칩셋의 단가 하락과 발열 제어 기술이 충분히 고도화되면, 대다수의 신규 전기차 및 자율주행 차량에 이러한 독립형 AI 시스템이 기본 탑재될 것으로 예상됩니다.`,
  sources:[{title:`엔비디아 토르 기반 차량용 AI Box - ZDNet Korea`,url:`https://zdnet.co.kr/news/tech`},{title:`오프라인 로컬 추론 시스템 구축 - K-AIA`,url:`https://www.k-aia.or.kr/news`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`금융위, 사람 대신 쇼핑하는 'AI 에이전트 결제' 및 스테이블코인 법제화 착수`,
  metrics:[`AI 에이전트 전용 결제 가이드라인 연내 마련`,`24시간 자동 정산 시스템 구축 검토`],
  summary:`대한민국 금융위원회가 사용자를 대신해 인공지능이 스스로 상품을 검색하고 결제까지 진행하는 에이전트 결제 시대에 발맞춰 선제적인 법제도 정비에 나섰습니다. 금융위는 인공지능이 주도하는 새로운 비대면 금융 생태계가 도래함에 따라 현행 전자금융거래법의 전면 개정 필요성을 면밀히 살피고 있습니다. 특히 기계가 자율적으로 계약을 맺고 송금하는 과정에서 발생할 수 있는 금전 사고의 법적 책임을 명확히 규정하는 가이드라인을 연내에 마련할 계획입니다. 이와 더불어 국경을 초월한 기계 간의 초고속 마이크로 결제를 빠르고 저렴하게 지원하기 위해 원화 연동 스테이블코인의 제도화 방안도 함께 논의 탁자에 올랐습니다. 핀테크 업계는 이번 정부의 발 빠른 대응이 미래 금융 주도권 확보와 혁신 기업 육성에 큰 도움이 될 것이라며 반색하고 있습니다. 규제 샌드박스를 통한 보안성 검증이 무사히 완료되면 우리의 일상 속 비대면 소비 패턴은 완전히 새로운 국면을 맞게 될 것입니다. 정부는 기술 혁신을 촉진하면서도 소비자 보호 장치를 철저히 세우겠다는 강력한 의지를 보이고 있습니다.`,
  keyTerms:[{term:`스테이블코인`,explanation:`비트코인처럼 가격이 심하게 변하지 않도록 미국 달러화나 한국 원화 같은 기존 화폐와 가치가 똑같이 유지되게 설계된 안정적인 가상화폐를 말합니다.`}],
  history:`과거에는 사용자가 직접 비밀번호나 생체 인식을 거쳐야만 결제가 이뤄졌으나, 생성형 기술의 눈부신 발전으로 기계가 스스로 의사결정을 내리는 환경이 다가왔습니다.`,
  players:`새로운 법과 제도를 설계하는 금융위원회, 차세대 금융 인프라를 구축하려는 핀테크 기업들, 그리고 국경 없는 결제망을 뚫으려는 코인 발행사들입니다.`,
  current:`기계의 오작동이나 해킹으로 인한 금전적 손실 시 누구에게 금전 배상 책임을 물을 것인지, 기계 간 결제에 어떤 매개 수단을 적용할지에 대한 법적 공백을 시급히 메워야 합니다.`,
  outlook:`금융당국의 명확한 가이드라인이 세상에 나오면 시중 은행 및 거대 IT 기업들이 관련 전용 지갑 서비스와 자동 결제 API를 앞다투어 출시하며 시장을 장악하려 할 것입니다.`,
  sources:[{title:`AI 에이전트 결제 및 제도화 검토 - 핀테크투데이`,url:`https://www.fintechtoday.co.kr/news`},{title:`전자금융거래법 개정 및 가상자산 - 다자비`,url:`https://www.dazabi.com/tech-finance`}]
}]

  tag:`2026-11-04`,
  label:`2026년 11월 4일 (수)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`10월 한국 외환보유액이 반등하며 증가세로 전환된 가운데, 반도체 중심의 수출이 3분기 성장을 견인하고 있습니다.`,
  metrics:[`외환보유액 4,431.6억 달러 기록`,`월간 약 26억 달러 증가`],
  summary:`한국은행에 따르면 지난달 말 기준 우리나라의 외환보유액은 4,431억 6,000만 달러로 집계되었습니다. 이는 전월 대비 약 26억 달러 증가한 수치로, 최근의 감소세를 끊고 반등에 성공한 것입니다. 이러한 반등의 주된 원인은 글로벌 달러화 약세와 함께 외화자산 운용수익이 증가했기 때문입니다. 더불어 AI 인프라 수요 지속으로 메모리 반도체 수출이 견조한 흐름을 유지하며 전체 무역수지 흑자를 뒷받침하고 있습니다. 하지만 수출 호조와 달리 내수와 건설업 침체가 길어지면서 체감 경기와의 괴리가 여전히 큰 상황입니다. 한국은행은 안정적인 외환보유액을 바탕으로 외부 충격에 대비할 수 있는 기초체력은 확인했다고 평가했습니다. 전문가들은 내수 활성화를 위한 추가적인 정책적 지원이 절실한 시점이라고 지적합니다.`,
  keyTerms:[{term:`외환보유액`,explanation:`한 국가가 비상사태에 대비해 비축하고 있는 외화 자금으로, 국가 경제의 안전판 역할을 합니다.`}],
  history:`한국은 과거 1997년 외환위기 당시 달러 고갈로 뼈아픈 구조조정을 겪은 바 있습니다. 이후 꾸준히 달러 자산을 축적해 왔으며, 최근 글로벌 고금리와 강달러 기조 속에서 환율 방어를 위해 일부 자산을 소모하기도 했습니다. 하지만 최근 다시 반등하며 안정적인 궤도에 올랐습니다.`,
  players:`주요 행위자는 외환시장을 관리하는 한국은행과 기획재정부입니다. 또한 수출 실적을 주도하는 삼성전자, SK하이닉스 등 국내 핵심 반도체 기업들이 무역수지 흑자에 기여하고 있습니다. 반면 내수 부진을 겪고 있는 소상공인과 건설업계는 정책적 배려를 요구하고 있습니다.`,
  current:`현재 외환보유액 반등은 글로벌 달러화 지수 하락과 맞물려 한국 경제의 대외 건전성 우려를 완화시켜주고 있습니다. 수출과 내수 간의 극명한 양극화 현상이 하반기 경제 정책의 최대 화두가 되었습니다.`,
  outlook:`향후 미국의 금리 인하 속도와 글로벌 무역 환경 변화가 환율의 주요 변수가 될 것입니다. 정부는 수출 호조세를 내수 시장으로 파급시키기 위한 부양책 마련에 집중할 것으로 예상됩니다.`,
  sources:[{title:`외환보유액 다시 증가세 전환 - 한국경제`,url:`https://www.hankyung.com/economy/1`},{title:`반도체 수출 호조 속 내수 부진 - 매일경제`,url:`https://www.mk.co.kr/news/economy/1`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 중심의 고율 관세 압박과 무역 정책 재편 움직임이 가속화되면서 글로벌 공급망 비용 상승 우려가 커지고 있습니다.`,
  metrics:[`일부 품목 최대 60% 고율 관세 예고`,`글로벌 물류 비용 지수 15% 상승`],
  summary:`최근 미국은 자국 산업 보호를 명분으로 주요 수입품에 대해 대규모 고율 관세 부과를 예고하며 이른바 보호무역 2.0 시대를 열고 있습니다. 특히 중국산 첨단 제품과 우회 수출품을 겨냥한 강도 높은 무역 장벽이 세워지고 있어 글로벌 무역 시장이 요동치고 있습니다. 이러한 조치는 전 세계적인 공급망 재편을 강제하며 다국적 기업들의 물류비용과 생산 단가를 급격히 끌어올리고 있습니다. 한국의 배터리 및 자동차 기업들 역시 미국 현지 생산 압박을 받으며 투자 전략을 전면 수정해야 하는 상황에 직면했습니다. 시장 전문가들은 보호무역 강화가 단기적으로는 미국 내 일자리를 보호할 수 있지만, 장기적으로는 심각한 인플레이션 압력을 가중시킬 것이라고 경고합니다. 현재 주요국들은 미국의 관세 폭탄에 대응하기 위해 세계무역기구(WTO) 제소 및 보복 관세 카드를 만지작거리고 있습니다.`,
  keyTerms:[{term:`보호무역 2.0`,explanation:`단순한 관세 부과를 넘어 동맹국 간의 공급망 재편과 첨단 기술 통제까지 포함하는 더욱 강력하고 포괄적인 자국 중심의 경제 정책입니다.`}],
  history:`과거 미중 무역 전쟁에서 촉발된 관세 인상 조치가 이제는 전면적인 공급망 분리로 진화했습니다. 팬데믹 이후 자국 내 필수 물자 생산 역량의 중요성이 부각되면서 각국은 경제 안보를 최우선 가치로 내세우기 시작했습니다. 이는 수십 년간 이어져 온 자유무역주의 패러다임의 중대한 퇴조를 의미합니다.`,
  players:`자국 중심주의를 강력히 추진하는 미국 정부와 이에 맞대응하는 중국 상무부가 핵심 행위자입니다. 그 사이에 끼인 유럽연합(EU)과 한국, 일본 등 동맹국들은 자국의 실익을 지키기 위해 아슬아슬한 줄타기 외교를 벌이고 있습니다. 비용 증가에 직면한 다국적 기업들도 주요 이해관계자입니다.`,
  current:`현재 글로벌 기업들은 관세 리스크를 회피하기 위해 생산 기지를 다변화하는 차이나 플러스 원 전략을 서두르고 있습니다. 주요국 간의 무역 갈등 긴장감이 그 어느 때보다 고조된 상태입니다.`,
  outlook:`미국 중간선거 결과에 따라 이러한 보호무역 기조의 강도와 속도가 한층 더 가팔라질 수 있습니다. 향후 글로벌 무역 환경은 경제 블록화와 함께 극심한 불확실성 시대로 접어들 전망입니다.`,
  sources:[{title:`미국 보호무역 강화 현황 - Bloomberg`,url:`https://www.bloomberg.com/news/1`},{title:`글로벌 관세 전쟁의 나비효과 - 조선일보`,url:`https://www.chosun.com/economy/1`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`막대한 AI 인프라 투자 대비 실제 수익화 속도에 대한 시장의 의구심이 번지며 주요 빅테크 종목들의 주가 변동성이 확대되고 있습니다.`,
  metrics:[`빅테크 4사 AI 설비투자 연간 2,000억 달러 돌파`,`AI 서비스 관련 직접 매출 비중 5% 미만`],
  summary:`마이크로소프트, 구글, 아마존 등 주요 빅테크 기업들이 AI 데이터센터와 GPU 확보를 위해 천문학적인 자본적지출(CAPEX)을 단행하고 있습니다. 올해 이들의 AI 설비투자 규모는 연간 2,000억 달러를 넘어설 것으로 전망되지만, 시장의 시선은 싸늘해지고 있습니다. 천문학적인 투자 비용 대비 실제 AI 서비스를 통한 수익 창출 속도가 현저히 느리다는 AI 수익성 회의론이 확산되고 있기 때문입니다. 월스트리트 투자자들은 단순한 사용자 증가를 넘어 기업 고객들의 실질적인 매출 기여도를 증명할 것을 요구하고 있습니다. 이로 인해 최근 실적 발표 이후 주요 빅테크 종목들의 주가가 큰 폭으로 출렁이며 나스닥 지수의 변동성을 키우고 있습니다. 기업들은 장기적인 승자가 되기 위해 단기적인 마진 하락을 감수해야 한다고 항변하고 있습니다. 시장은 향후 1~2년 내에 AI 킬러 애플리케이션의 등장 여부가 생존을 가를 것으로 보고 있습니다.`,
  keyTerms:[{term:`자본적지출(CAPEX)`,explanation:`기업이 미래의 이윤을 창출하거나 가치를 유지하기 위해 장비, 토지, 건물 등 물리적 자산에 투자하는 비용을 뜻합니다.`}],
  history:`챗GPT 등장 이후 글로벌 IT 기업들은 AI 주도권을 잡기 위해 경쟁적으로 인프라 투자에 뛰어들었습니다. 초기에는 투자의 규모 자체가 기업의 미래 가치로 직결되며 주가 상승을 이끌었습니다. 하지만 최근 들어 고비용 구조에 대한 우려가 투자 심리를 압박하기 시작했습니다.`,
  players:`엔비디아를 필두로 하는 AI 반도체 공급 기업들과 이들의 주요 고객인 클라우드 서비스 제공자(CSP)들이 핵심 주체입니다. 또한 거대한 자금을 굴리는 월가 헤지펀드와 기관 투자자들의 평가가 시장의 방향성을 결정짓고 있습니다. AI를 도입해 생산성을 높이려는 일반 기업 고객들도 중요한 역할을 합니다.`,
  current:`현재 AI 인프라 구축의 병목 현상은 완화되고 있으나, 이를 활용한 B2B 수익 모델의 한계가 명확히 드러나고 있습니다. 시장 참가자들은 투자에서 회수의 단계로 검증의 기준을 이동시켰습니다.`,
  outlook:`내년 상반기까지 빅테크 기업들이 유의미한 AI 구독 매출 궤적을 증명하지 못할 경우 대규모 주가 조정이 불가피할 수 있습니다. 반대로 확실한 수익 모델을 선점하는 기업은 차세대 플랫폼의 절대 강자로 군림할 것입니다.`,
  sources:[{title:`빅테크 AI 투자 딜레마 - FT`,url:`https://www.ft.com/tech/1`},{title:`AI 수익성 논란 점화 - Reuters`,url:`https://www.reuters.com/tech/1`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`대통령의 집값 하락 관련 발언을 두고 여야가 현실 인식의 차이를 드러내며 거센 정치적 공방을 벌이고 있습니다.`,
  metrics:[`서울 주요 아파트 거래량 전월 대비 12% 감소`,`야당 지지율 2.5%p 하락`],
  summary:`최근 이재명 대통령이 주요 지역의 집값이 하락세를 보이고 있으며 투기공화국 탈출을 위한 폭락 대비책을 강구 중이라고 밝히면서 정치권에 파장이 일고 있습니다. 대통령실은 억제된 가계대출 규제 효과가 본격화되며 주택 시장이 안정화되고 있다는 긍정적인 평가를 내놓았습니다. 그러나 야당은 이러한 발언이 무주택 서민들이 체감하는 부동산 현실 인식과 동떨어져 있다고 강하게 비판하며 대여 공세의 수위를 높였습니다. 특히 야당 지도부는 청년층의 주거 불안이 여전한 상황에서 섣부른 자화자찬은 정책 실패를 가리려는 꼼수라고 지적했습니다. 반면 여당은 부동산 시장의 연착륙을 유도하기 위한 선제적 신호라며 대통령을 적극 옹호하고 나섰습니다. 양측의 팽팽한 기싸움 속에서 향후 금리 인하 여부와 맞물린 후속 부동산 정책이 연말 정국의 최대 쟁점으로 부상할 전망입니다.`,
  keyTerms:[{term:`부동산 현실 인식`,explanation:`정부의 거시적인 통계 데이터와 일반 국민들이 일상에서 체감하는 주거 비용 및 집값 불안 사이의 체감 차이를 의미합니다.`}],
  history:`과거 정부부터 부동산 문제는 정권의 지지율을 좌우하는 가장 민감한 뇌관이었습니다. 수차례의 규제와 완화 정책이 반복되면서 시장의 피로도가 극에 달했습니다. 최근 고금리 장기화로 인해 거래 절벽 현상이 나타나며 새로운 국면을 맞이했습니다.`,
  players:`정책을 입안하고 집행하는 국토교통부와 대통령실이 여당과 함께 한 축을 형성하고 있습니다. 이에 맞서 정부의 정책 실패를 부각시켜 여론을 주도하려는 거대 야당이 맹렬히 대립 중입니다. 혼란스러운 정책 시그널에 불안해하는 실수요자와 투자자들도 핵심 이해관계자입니다.`,
  current:`현재 가계부채 관리라는 명분 아래 대출 규제가 강화되면서 매수 심리가 크게 위축된 상태입니다. 여야는 이를 서로 유리하게 해석하며 주도권 싸움을 벌이고 있습니다.`,
  outlook:`연말 다가올 추가 금리 인하 기대감이 시장에 미칠 파장이 주목됩니다. 여야는 다가오는 재보궐 선거를 겨냥해 각기 다른 맞춤형 주거 안정 대책을 쏟아낼 것으로 보입니다.`,
  sources:[{title:`대통령 부동산 발언 후폭풍 - 중앙일보`,url:`https://www.joongang.co.kr/politics/1`},{title:`여야 엇갈린 집값 해석 - KBS`,url:`https://news.kbs.co.kr/politics/1`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`야당이 이른바 조작기소 특검법을 본회의에서 강행 처리하려는 움직임을 보이면서 국회의 긴장감이 최고조에 달하고 있습니다.`,
  metrics:[`야당 본회의 의석수 170석 이상 확보`,`대통령 거부권 행사 시점 15일 이내`],
  summary:`국회에서는 현재 야당 주도로 특정 정치적 사건에 대한 검찰의 수사가 조작되었다는 의혹을 규명하기 위한 조작기소 특검법이 쟁점으로 떠올랐습니다. 야당은 다수 의석을 앞세워 이번 주 본회의에서 해당 법안을 단독으로라도 상정하여 통과시키겠다는 강경한 입장을 고수하고 있습니다. 이에 여당은 명백한 정치 공세이자 헌정 질서를 훼손하는 입법 폭주라며 필리버스터(무제한 토론)를 포함한 모든 수단을 동원해 저지하겠다고 맞서고 있습니다. 만약 특검법이 본회의를 통과할 경우, 대통령의 재의요구권(거부권) 행사가 기정사실화되고 있어 극한의 여야 대립이 불가피합니다. 정국이 특검 정국으로 급속히 빨려 들어가면서 민생 법안과 내년도 예산안 심사 일정마저 파행을 겪을 위기에 처했습니다. 시민사회 일각에서는 정쟁에 매몰된 국회를 향한 비판의 목소리도 커지고 있습니다.`,
  keyTerms:[{term:`조작기소 특검법`,explanation:`검찰이 정치적 의도를 가지고 증거를 조작하여 기소했다는 의혹을 조사하기 위해, 독립적인 특별검사를 임명하도록 요구하는 법안입니다.`}],
  history:`한국 정치사에서 특검법은 주로 권력형 비리나 대형 스캔들이 터질 때마다 진상 규명을 명분으로 발의되었습니다. 최근 수년간 검찰 수사의 중립성을 둘러싼 여야의 갈등이 심화되면서 특검법 발의와 거부권 행사가 쳇바퀴처럼 반복되는 양상을 보이고 있습니다. 이는 진영 간의 극심한 양극화를 보여주는 단면입니다.`,
  players:`수사를 주도한 검찰 조직과 이를 비판하며 특검을 추진하는 야당 지도부가 최전선에서 충돌하고 있습니다. 여당은 정부를 방어하며 입법 강행을 비판하는 방패 역할을 맡고 있습니다. 최종적으로 법안 수용 여부를 결정할 대통령실의 결단이 남아있습니다.`,
  current:`현재 여야는 한 치의 양보 없는 강대강 대치를 이어가며 타협의 여지를 찾지 못하고 있습니다. 본회의 표결 결과에 따라 정국의 주도권이 크게 요동칠 전망입니다.`,
  outlook:`대통령의 거부권 행사 이후 국회에서 재표결 절차가 진행될 경우 여당 내 이탈표 발생 여부가 핵심 변수가 될 것입니다. 특검 정국은 내년 초까지 정치권의 블랙홀 역할을 할 가능성이 높습니다.`,
  sources:[{title:`조작기소 특검법 전운 고조 - 한겨레`,url:`https://www.hani.co.kr/politics/1`},{title:`민생 실종된 여야 대치 - 연합뉴스`,url:`https://www.yna.co.kr/politics/1`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`2026년 미국 중간선거가 코앞으로 다가온 가운데, 베팅 사이트에 수십억 달러의 판돈이 몰리며 전 세계적 이목이 쏠리고 있습니다.`,
  metrics:[`폴리마켓 등 예측 시장 판돈 20억 달러 돌파`,`경합주 여론조사 오차범위 내 1%p 접전`],
  summary:`미국의 향후 2년간 정치 지형을 결정지을 2026년 미국 중간선거 레이스가 막바지에 접어들면서 선거 판세가 안갯속으로 빠져들고 있습니다. 주요 정치 베팅 시장에서는 어느 당이 의회의 주도권을 잡을지를 두고 무려 20억 달러가 넘는 막대한 판돈이 몰리며 과열 양상을 보이고 있습니다. 여론조사 기관들은 펜실베이니아, 미시간 등 핵심 경합주에서 양당 후보가 1%p 미만의 초박빙 접전을 벌이고 있다고 발표했습니다. 민주당은 낙태권 보호와 민주주의 수호를 내세우며 지지층 결집에 나선 반면, 공화당은 인플레이션과 이민자 문제를 집중 공격하며 심판론을 점화하고 있습니다. 이번 선거 결과에 따라 글로벌 통상 정책, 우크라이나 지원 등 미국의 핵심 대외 정책이 급변할 수 있습니다. 전 세계 동맹국과 시장 투자자들은 숨을 죽인 채 미국 유권자들의 최종 선택을 주시하고 있습니다.`,
  keyTerms:[{term:`미국 중간선거`,explanation:`대통령 임기 4년 중 2년 차에 치러지는 선거로, 연방 하원 전체와 상원의 3분의 1을 새로 선출하여 현직 대통령에 대한 중간 평가 성격을 가집니다.`}],
  history:`미국의 중간선거는 전통적으로 집권 여당의 무덤으로 불리며, 야당이 다수당을 차지하는 경우가 많았습니다. 지난 수차례의 선거에서 나타난 극심한 정치 양극화는 유권자들의 이념적 분열을 심화시켰습니다. 이번 선거 역시 대선의 연장선상에서 치열한 진영 대결이 펼쳐지고 있습니다.`,
  players:`의회 수성을 노리는 현직 대통령과 민주당, 그리고 탈환을 벼르는 공화당 지도부가 주요 행위자입니다. 거액의 후원금을 쏟아붓는 정치활동위원회와 베팅 시장의 큰손 투자자들도 무시할 수 없는 세력입니다. 결과를 좌우할 부동층 유권자들이 최종 캐스팅보트를 쥐고 있습니다.`,
  current:`현재 선거를 불과 며칠 앞두고 가짜 뉴스와 흑색선전이 난무하며 선거판이 혼탁해지고 있습니다. 양당은 핵심 지지층의 투표율을 최대한 끌어올리기 위해 총력전을 전개하고 있습니다.`,
  outlook:`선거 결과가 확정되기까지 우편투표 개표 지연 등으로 인해 수일이 소요될 수 있으며, 박빙 지역에서는 재검표 논란이 일어날 소지가 다분합니다. 결과에 따라 글로벌 금융시장에 일시적인 충격파가 닥칠 수 있습니다.`,
  sources:[{title:`미국 중간선거 초박빙 승부 - NYT`,url:`https://www.nytimes.com/politics/1`},{title:`베팅 시장으로 본 미 의회 판세 - WSJ`,url:`https://www.wsj.com/politics/1`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`한국이 세계에서 가장 빠른 속도로 초고령사회에 진입하면서 법정 정년 연장과 노동 유연화 논의가 뜨거운 감자로 떠올랐습니다.`,
  metrics:[`65세 이상 인구 비율 21% 돌파`,`국민연금 수급 연령과 정년 간 격차 5년`],
  summary:`최근 한국의 65세 이상 노인 인구 비율이 21%를 넘어서며 공식적인 초고령사회에 진입함에 따라 노동 시장의 근본적인 체질 개선이 요구되고 있습니다. 가장 시급한 현안으로 대두된 것은 현재 60세인 법정 정년을 65세로 연장하는 방안입니다. 노동계는 은퇴 이후 국민연금을 받기 전까지 발생하는 소득 공백기를 메우기 위해 정년 연장이 필수적이라고 주장하고 있습니다. 반면 재계는 청년 고용 위축과 인건비 부담 증가를 이유로 호봉제 폐지 및 임금피크제 도입 등 노동 유연화가 선행되어야 한다고 맞서고 있습니다. 정부는 노사정 대화 채널을 통해 점진적이고 자율적인 계속고용 제도를 안착시키려 하지만 양측의 입장 차이가 워낙 커 난항을 겪고 있습니다. 인구 구조 붕괴가 현실화된 지금, 세대 간 갈등을 최소화하며 사회적 합의를 이끌어내는 것이 국가적 과제가 되었습니다.`,
  keyTerms:[{term:`초고령사회`,explanation:`전체 인구 중 65세 이상 노령 인구가 차지하는 비율이 20%를 초과하는 사회로, 심각한 노동력 부족과 복지 비용 급증을 초래합니다.`}],
  history:`한국은 유례없이 빠른 저출산과 기대수명 연장을 동시에 경험하며 초스피드로 노령화가 진행되었습니다. 과거 생산가능인구의 풍부함이 경제 성장을 이끌었던 인구 보너스 시대는 끝나고, 이제는 부양 부담이 폭증하는 인구 오너스 시대의 부작용을 마주하고 있습니다. 이미 수년 전부터 연금 고갈 경고음이 지속해서 울렸습니다.`,
  players:`퇴직을 앞둔 베이비부머 세대와 일자리 경쟁을 우려하는 청년층 간의 이해관계가 첨예하게 대립하고 있습니다. 정책을 조율하는 고용노동부와 비용 부담을 안아야 하는 경영계, 그리고 노동자의 권익을 대변하는 노동조합이 협상 테이블의 주역들입니다.`,
  current:`현재 국회에서는 정년 연장을 의무화하는 법안 발의가 줄을 잇고 있으나, 기업들의 거센 반발에 부딪혀 국회 문턱을 넘지 못하고 있습니다. 각 기업 단위별로 촉탁직 형태의 편법적인 재고용만 늘어나는 추세입니다.`,
  outlook:`내년 상반기 노사정 위원회의 타협안 도출 여부가 최대 분수령이 될 것입니다. 장기적으로는 외국인 이민 정책 개편과 묶어 국가 단위의 거시적인 인력 수급 계획이 새롭게 짜여질 전망입니다.`,
  sources:[{title:`초고령사회 진입과 정년 연장 딜레마 - 조선일보`,url:`https://www.chosun.com/society/1`},{title:`청년 일자리와 노인 빈곤 사이 - SBS`,url:`https://news.sbs.co.kr/society/1`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`스스로 계획하고 실행하는 추론형 AI 에이전트가 대세로 자리 잡은 가운데, 딥시크 발 오픈소스 쇼크가 빅테크 생태계를 흔들고 있습니다.`,
  metrics:[`추론형 AI 기반 업무 자동화 도입 기업 35% 증가`,`딥시크 모델 오픈소스 다운로드 1억 건 돌파`],
  summary:`인공지능 업계의 패러다임이 단순 챗봇 모델에서 벗어나, 인간의 개입 없이 스스로 목표를 세우고 복잡한 작업을 수행하는 추론형 AI 에이전트 중심으로 급속히 재편되고 있습니다. 특히 코딩, 데이터 분석 등 논리적 사고가 필요한 분야에서 혁신적인 생산성 향상이 보고되면서 많은 기업들이 AI 에이전트를 실무에 빠르게 투입하고 있습니다. 이와 동시에 중국의 딥시크가 엄청난 가성비와 추론 성능을 앞세운 오픈소스 모델을 배포하면서 글로벌 AI 지형에 지각변동을 일으켰습니다. 딥시크의 등장은 막대한 비용을 들여 폐쇄형 모델을 고집하던 핵심 빅테크 기업들의 독점 체제에 치명적인 타격을 입혔습니다. 전 세계 스타트업과 개발자들은 저렴한 고성능 모델을 환영하고 있지만, 서방 국가들은 안보 유출 및 AI 패권 상실을 크게 우려하고 있습니다. 바야흐로 AI 기술의 성능 향상과 민주화가 동시에 폭발하는 중대한 변곡점에 서 있습니다.`,
  keyTerms:[{term:`추론형 AI`,explanation:`주어진 질문에 단순히 답변만 하는 것을 넘어, 문제 해결을 위해 스스로 여러 단계의 논리적 사고와 계획을 세우고 실행할 수 있는 차세대 인공지능입니다.`}],
  history:`생성형 AI의 붐을 일으킨 초기 거대언어모델들은 환각 현상과 논리력 부재라는 명확한 한계를 보였습니다. 이를 극복하기 위해 연구자들은 모델이 출력하기 전에 내면적으로 사고의 사슬을 형성하도록 훈련시켰고, 최근 들어 이 기술이 상용화 단계에 이르렀습니다.`,
  players:`시장을 선도하려는 전통적 빅테크가 한 진영을 이룹니다. 맞은편에는 무서운 속도로 기술 격차를 좁힌 중국의 딥시크 연구진과, 이들의 오픈소스를 기반으로 생태계를 확장하는 전 세계 독립 개발자들이 거대한 커뮤니티를 형성하고 있습니다.`,
  current:`현재 AI 기업들은 모델의 파라미터 크기 경쟁을 멈추고, 추론의 효율성과 에이전트의 안정성을 입증하는 지능형 최적화 경쟁에 사활을 걸고 있습니다. 미국 정부는 자국 기술 우위를 지키기 위한 수출 통제와 규제 카드를 고심 중입니다.`,
  outlook:`앞으로 AI 에이전트 간의 통신과 자율 협업 기술이 표준화될 것으로 예상됩니다. 더불어 국가 간 AI 칩 확보전과 알고리즘 보안 장벽은 한층 험악해질 가능성이 높습니다.`,
  sources:[{title:`추론형 AI의 비약적 발전 - AP`,url:`https://apnews.com/tech/1`},{title:`딥시크 쇼크와 무너지는 빅테크 독점 - ZDNet`,url:`https://zdnet.co.kr/it/1`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`주사제 방식이 주도하던 비만 치료제 시장에서, 복용 편의성을 획기적으로 높인 경구용 신약의 글로벌 임상 경쟁이 격화되고 있습니다.`,
  metrics:[`글로벌 비만 치료제 시장 규모 2030년 1천억 달러 전망`,`알약 형태 신약 임상 2상 체중 감량률 15% 달성`],
  summary:`위고비와 젭바운드로 대변되는 글로벌 비만 치료제 시장의 패권 경쟁이 기존의 피하주사 방식에서 알약 형태인 경구용 치료제로 빠르게 옮겨가고 있습니다. 최근 다국적 제약사들이 진행 중인 경구용 비만 치료제 임상시험에서 주사제와 맞먹는 15% 이상의 놀라운 체중 감량 효과가 연이어 발표되면서 의료계의 찬사를 받고 있습니다. 매일 또는 매주 주사를 맞아야 하는 환자들의 고통과 번거로움을 덜어주는 경구용 신약은 향후 비만 시장의 게임 체인저가 될 것으로 평가받습니다. 글로벌 선두 주자들은 물론, 한국을 포함한 후발 바이오 벤처기업들까지 알약 개발에 천문학적인 자금을 쏟아부으며 참전했습니다. 다만 주사제에 비해 위장관 흡수율이 낮아 원료가 많이 소모된다는 점에서, 높은 생산 단가와 심각한 공급 부족 문제가 해결해야 할 최우선 과제로 지목됩니다. 시장 분석가들은 경구용 치료제의 성공적인 상용화가 미용과 헬스케어 산업의 경계를 완전히 허물 것이라고 내다보고 있습니다.`,
  keyTerms:[{term:`경구용 치료제`,explanation:`주삿바늘을 사용하지 않고 입으로 삼켜서 복용하는 알약이나 캡슐 형태의 약물로, 환자의 복용 편의성을 크게 높여줍니다.`}],
  history:`비만 치료제는 본래 당뇨병 치료 목적으로 개발되었으나, 탁월한 체중 감량 효과가 입증되면서 전 세계적인 품귀 현상을 빚었습니다. 그러나 기존 약물들은 모두 환자가 직접 찔러 넣어야 하는 주사제 방식이어서 주사 공포증이나 감염 우려 등 접근성에 큰 제약이 있었습니다.`,
  players:`시장을 양분하고 있는 글로벌 거대 제약사들이 차세대 신약 개발을 주도하고 있습니다. 이 독점 체제를 깨기 위해 다른 글로벌 제약사들과 국내 굴지의 바이오 기업들이 도전장을 내밀며 치열한 연구개발 각축전을 벌이고 있습니다.`,
  current:`현재 여러 경구용 신약 후보 물질들이 임상 2상과 3상을 숨 가쁘게 통과하며 유효성을 입증하고 있습니다. 시장의 기대감이 커지면서 관련 제약사들의 주가는 연일 신고가를 경신하는 중입니다.`,
  outlook:`빠르면 1~2년 내에 최초의 고효율 경구용 비만 치료제가 시장에 정식 출시될 전망입니다. 이는 약가 인하 경쟁을 촉발하여 비만 치료의 대중화를 앞당기는 기폭제가 될 것입니다.`,
  sources:[{title:`알약 비만 치료제 임상 성공 연발 - Reuters`,url:`https://www.reuters.com/health/1`},{title:`글로벌 제약사 경구용 신약 전쟁 - 매일경제`,url:`https://www.mk.co.kr/science/1`}]
}]

  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`정부, 역대 최대 규모인 820조 9,000억 원의 2027년도 예산안 국회 시정연설 제출`,
  metrics:[`820조 9,000억 원`,`전년 대비 4.5% 증가`],
  summary:`정부가 2027년도 국가 예산안을 820조 9,000억 원 규모로 확정하고 국회에 시정연설을 통해 제출했습니다. 이는 전년 대비 약 4.5% 증가한 역대 최대 규모입니다. 경기 둔화 우려 속에 민생 안정과 첨단 산업 투자를 늘리겠다는 의도로 풀이됩니다. 그러나 세수 펑크 우려가 여전한 상황에서 정부는 엄격한 건전재정 기조를 지키며 예산을 짰다고 강조했습니다. 국회 심의 과정에서 복지 예산과 SOC 예산을 둘러싼 여야의 치열한 공방이 예상됩니다. 현재 예산안은 각 상임위와 예결위의 심사를 앞두고 있습니다.`,
  keyTerms:[{term:`건전재정`,explanation:`국가 채무를 적정 수준으로 관리하며 수입 범위 내에서 지출을 통제하려는 재정 운용 기조를 말합니다.`}],
  history:`최근 수년간 세수 부족 사태를 겪으며 정부는 지출 증가율을 최대한 억제해 왔습니다.`,
  players:`기획재정부와 정부 여당은 재정 건전성을, 야당은 적극적 재정 역할을 주장하고 있습니다.`,
  current:`예산안 국회 제출로 본격적인 심의 정국이 막을 올렸습니다.`,
  outlook:`법정 처리 시한인 12월 2일 이내에 예산안이 통과될 수 있을지 귀추가 주목됩니다.`,
  sources:[{title:`내년도 예산안 820.9조 원 확정 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`정부, 국회 시정연설서 예산안 협조 당부 - KBS`,url:`https://news.kbs.co.kr/`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국 연간 수출액, 사상 최초로 9,000억 달러 돌파가 유력시되며 무역 흑자 기대`,
  metrics:[`9,000억 달러`,`반도체 수출 20% 증가`],
  summary:`올해 한국의 연간 총수출액이 사상 처음으로 9,000억 달러를 넘어설 것으로 관측되고 있습니다. 주력 산업인 반도체 수요가 전 세계적으로 폭증하면서 전체 수출을 강력하게 견인했습니다. 자동차와 2차전지 분야 역시 북미 시장을 중심으로 견조한 실적을 냈습니다. 이에 따라 만성적인 적자 우려를 털어내고 대규모 무역수지 흑자가 기대되는 상황입니다. 11월과 12월의 연말 수출 성수기까지 고려하면 연간 최대 실적 경신은 기정사실화되고 있습니다. 정부는 수출 호조세가 내수 소비로 이어질 수 있도록 지원책을 마련 중입니다.`,
  keyTerms:[{term:`무역수지`,explanation:`일정 기간 동안 한 국가의 상품 수출액과 수입액의 차이를 의미하며, 수출이 많으면 흑자, 수입이 많으면 적자로 기록됩니다.`}],
  history:`2024~2025년 글로벌 고금리 환경에서 한국 수출은 일시적 침체를 겪었으나, 최근 빅테크 투자 확대로 급반등했습니다.`,
  players:`삼성전자와 SK하이닉스 등 주요 반도체 기업과 자동차 완성차 업계가 실적을 주도하고 있습니다.`,
  current:`10월 말까지 누적 수출 데이터가 호조를 보이며 올해 9,000억 달러 돌파 가시권에 들어섰습니다.`,
  outlook:`내년에도 AI 반도체 수요가 이어질 것으로 보여 수출 상승세가 당분간 지속될 전망입니다.`,
  sources:[{title:`연간 수출액 사상 첫 9,000억 불 돌파 기대 - 한국경제`,url:`https://www.hankyung.com/`},{title:`반도체가 이끈 수출, 무역 흑자 견인 - 매일경제`,url:`https://www.mk.co.kr/`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미·이란 간 군사적 긴장 지속으로 국제 유가 급등 등 글로벌 원자재 시장 요동`,
  metrics:[`배럴당 85달러 돌파`,`천연가스 5% 상승`],
  summary:`미국과 이란 사이의 군사적 긴장이 다시 고조되면서 글로벌 에너지 시장이 크게 출렁이고 있습니다. 중동 지역의 무력 충돌 우려로 인해 브렌트유 등 국제 유가는 단숨에 배럴당 85달러 선을 돌파했습니다. 천연가스 가격도 공급망 차질 우려로 하루 만에 5% 이상 상승했습니다. 이러한 심각한 지정학적 리스크는 전 세계 인플레이션을 다시 자극할 수 있어 각국 중앙은행들을 긴장시키고 있습니다. 다만, 물밑에서 외교적 협상 시도도 계속되고 있어 가격 방향성은 예측하기 어려운 혼조세입니다. 투자자들은 중동 발 뉴스 속보에 민감하게 반응하며 안전 자산에 자금을 옮기고 있습니다.`,
  keyTerms:[{term:`지정학적 리스크`,explanation:`국가 간의 분쟁, 전쟁, 혹은 외교적 마찰 등 지리적·정치적 요인으로 인해 세계 경제나 금융 시장에 발생하는 위험을 뜻합니다.`}],
  history:`미국과 이란은 오랫동안 핵 합의 및 중동 내 무장단체 지원 문제를 두고 팽팽한 갈등을 이어왔습니다.`,
  players:`미국 연방정부, 이란 혁명수비대(IRGC), 그리고 석유수출국기구(OPEC) 등 주요 산유국들이 얽혀 있습니다.`,
  current:`최근 호르무즈 해협 인근에서의 무력시위 정황이 포착되면서 원유 수급 불안감이 고조되었습니다.`,
  outlook:`무력 충돌이 실제 발생할 경우 유가가 100달러를 넘을 수 있다는 경고와 함께 외교적 타결 가능성도 제기됩니다.`,
  sources:[{title:`Middle East Tensions Drive Oil Prices Past \$85 - Bloomberg`,url:`https://www.bloomberg.com/`},{title:`Global Commodities Fluctuate on US-Iran Stand-off - Reuters`,url:`https://www.reuters.com/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`11월 3일 미국 중간선거를 이틀 앞두고 연방 상·하원 주도권을 향한 양당의 막판 유세 최고조`,
  metrics:[`연방 하원 435석`,`상원 34석`],
  summary:`2026년 11월 3일 치러지는 미국 중간선거가 이틀 앞으로 다가온 가운데, 민주당과 공화당이 펜실베이니아 등 핵심 경합주에서 총력 유세를 펼치고 있습니다. 이번 선거에서는 연방 하원 435석 전체와 상원 34석, 그리고 다수의 주지사가 교체될 예정입니다. 바이든 행정부 후반부의 국정 동력을 결정지을 중요한 선거로, 공화당이 대대적인 승리를 거두는 레드 웨이브가 일어날지, 아니면 민주당이 예상 밖 선전을 거둘지가 초미의 관심사입니다. 연방수사국(FBI) 등 보안 당국은 선거 개입을 막기 위해 사이버 보안 경계 태세를 최고 수준으로 끌어올렸습니다. 투표 결과는 글로벌 무역 및 기후 정책에도 막대한 영향을 미칠 전망입니다.`,
  keyTerms:[{term:`레드 웨이브`,explanation:`미국 선거에서 공화당(상징색: 빨간색)이 압도적인 표차로 승리하여 의회 다수당을 차지하는 돌풍 현상을 비유하는 말입니다.`}],
  history:`역대 미국 중간선거에서는 통상적으로 집권 여당이 패배하고 야당이 의회 다수당을 차지하는 경향이 짙었습니다.`,
  players:`행정부를 사수하려는 민주당 지지층과, 정권 심판론을 앞세우는 도널드 트럼프 및 공화당 지지층이 결집 중입니다.`,
  current:`사전 투표율이 역대 최고치를 기록하는 등 양 진영의 정치적 양극화와 선거 열기가 극에 달해 있습니다.`,
  outlook:`선거 당일 자정부터 윤곽이 드러나겠지만, 우편 투표 개표 지연 시 최종 결과 확정까지 며칠이 소요될 수 있습니다.`,
  sources:[{title:`US Midterm Elections D-2: Candidates make final push - AP News`,url:`https://apnews.com/`},{title:`Control of Congress hinges on key battleground states - NYT`,url:`https://www.nytimes.com/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`에르도안 튀르키예 대통령, 시노프 제2원전 건설 파트너로 한국을 유력하게 검토 중이라 시사`,
  metrics:[`예상 사업비 300억 달러`,`원자로 4기 규모`],
  summary:`에르도안 튀르키예 대통령이 최근 인터뷰에서 흑해 연안 시노프 지역의 제2원자력발전소 건설 사업 협력국으로 한국을 가장 유력하게 검토하고 있다고 밝혔습니다. 이번 프로젝트는 총 4기의 원자로를 건설하는 대규모 사업으로, 예상 사업비만 300억 달러에 달합니다. 튀르키예 정부는 한국의 뛰어난 원전 시공 능력과 납기 준수 실적을 높이 평가한 것으로 전해졌습니다. 본격적인 계약이 성사된다면 체코, 폴란드에 이어 한국의 K-원전 수출 르네상스가 더욱 가속화될 것입니다. 양국 정부 실무진은 자금 조달 방안 등 구체적인 조건에 대한 막바지 조율에 들어간 상태입니다.`,
  keyTerms:[{term:`원전 수출`,explanation:`국내 기술로 개발한 원자력 발전소의 설계, 시공, 운영 능력을 해외 국가에 판매하여 대규모 외화를 창출하는 산업 활동입니다.`}],
  history:`튀르키예는 2010년대 초반부터 시노프 원전 사업을 추진해왔으며, 일본, 중국 등과 협상했으나 비용 문제로 무산된 바 있습니다.`,
  players:`한국수력원자력(한수원)을 비롯한 팀코리아 컨소시엄과 튀르키예 에너지부가 협상의 주체입니다.`,
  current:`최근 글로벌 탈탄소 기조에 맞춰 튀르키예가 원전 확보에 다시 속도를 내면서 한국이 최적의 파트너로 부상했습니다.`,
  outlook:`내년 상반기 중으로 정부 간 협정(IGA) 체결 및 우선협상대상자 선정이 가시화될 것으로 예상됩니다.`,
  sources:[{title:`에르도안 '한국과 시노프 원전 협력 유력 검토' - 조선일보`,url:`https://www.chosun.com/`},{title:`Turkey leans toward South Korea for Sinop nuclear plant - FT`,url:`https://www.ft.com/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`2027년도 예산안 심사를 위한 국회 예결특위 가동 개시, '삭감 vs 원안' 여야 극한 대립 예고`,
  metrics:[`삭감 목표 최소 5조 원`,`법정 시한 12월 2일`],
  summary:`정부가 제출한 821조 원 규모의 내년도 예산안을 심사하기 위해 국회 예산결산특별위원회가 본격 가동되었습니다. 여당은 경제 활성화와 민생 지원을 위해 원안 고수가 필수적이라는 입장인 반면, 야당은 불필요한 사업 예산을 최소 5조 원 이상 삭감하겠다고 벼르고 있습니다. 특히 권력기관의 특수활동비와 일부 국책 사업 예산을 두고 팽팽한 줄다리기가 이어지고 있습니다. 이 과정에서 각 부처의 예산을 깎고 늘리는 예산결산특별위원회 본회의장에서는 치열한 삿대질과 고성이 오갔습니다. 여야의 입장 차이가 워낙 커서 12월 2일 법정 처리 시한을 지킬 수 있을지는 불투명한 상황입니다.`,
  keyTerms:[{term:`예산결산특별위원회`,explanation:`정부가 편성한 국가 예산안과 기금 운용안을 최종적으로 심사하고 확정하기 위해 국회 내에 설치된 핵심 특별 위원회입니다.`}],
  history:`매년 연말마다 정부 예산안을 두고 여야는 삭감과 증액을 둘러싸고 물리적 충돌 직전까지 가는 파행을 반복해 왔습니다.`,
  players:`정부 예산안을 방어하려는 집권 여당과, 송곳 검증을 통해 주도권을 쥐려는 야당 예결위원들이 대립하고 있습니다.`,
  current:`상임위별 예비 심사가 끝나고 예결위 예산안조정소위에서 본격적인 세부 항목 칼질이 시작되었습니다.`,
  outlook:`법정 기한을 넘겨 연말 임시국회 막판까지 밀실 타협(소소위)이 이어지는 구태가 재연될 우려가 제기됩니다.`,
  sources:[{title:`국회 예결위 가동... '821조' 예산 삭감 공방전 - MBC`,url:`https://imnews.imbc.com/`},{title:`여야 예결위서 특활비 예산 놓고 강경 대치 - SBS`,url:`https://news.sbs.co.kr/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`미국 나스닥 빅테크 기업들의 막대한 AI 설비투자 비용 대비 저조한 수익성 우려로 증시 관망세 확산`,
  metrics:[`AI 설비투자 400억 달러 초과`,`나스닥 1.2% 하락 마감`],
  summary:`최근 실적을 발표한 미국의 주요 빅테크 기업들이 인공지능(AI) 인프라 구축에만 400억 달러가 넘는 천문학적 자본을 쏟아부은 것으로 나타났습니다. 투자 규모는 급증했지만, 정작 AI 서비스를 통한 가시적인 현금 창출 능력이 시장의 기대에 미치지 못하면서 투자자들의 실망감이 커졌습니다. 막대한 데이터센터 구축 비용이 영업이익률을 압박하고 있다는 점이 부각되자 뉴욕 증시의 기술주들은 약세를 면치 못했고 나스닥 지수는 1.2% 하락했습니다. 월가에서는 기업들이 확실한 AI 수익화 모델을 증명하기 전까지는 당분간 기술주 전반에 걸쳐 신중한 관망세가 이어질 것으로 분석하고 있습니다. 한국의 반도체 및 부품 관련 주식들도 이러한 글로벌 기류의 영향을 받아 혼조세를 보였습니다.`,
  keyTerms:[{term:`AI 수익화`,explanation:`기업이 인공지능 기술과 인프라에 투자한 막대한 비용을 회수하기 위해, 실제 사용자나 기업에게 요금을 받고 서비스를 팔아 돈을 버는 과정을 뜻합니다.`}],
  history:`2023년부터 이어진 생성형 AI 열풍 속에서 구글, MS, 메타 등은 시장 선점을 위해 경쟁적으로 데이터센터와 GPU 확보에 나섰습니다.`,
  players:`월스트리트 투자 은행들과 빅테크 경영진 사이에서 투자 속도 조절론과 장기 투자 불가피론이 맞서고 있습니다.`,
  current:`이번 3분기 실적 발표 시즌을 기점으로 AI 투자의 '가성비'에 대한 시장의 의구심이 본격적으로 표출되었습니다.`,
  outlook:`향후 출시될 기업용 AI 소프트웨어 구독 서비스의 실제 성과가 테크 기업들의 주가 반등을 결정지을 핵심 변수가 될 것입니다.`,
  sources:[{title:`Big Tech's AI Spending Spree Spooks Wall Street - WSJ`,url:`https://www.wsj.com/`},{title:`Nasdaq dips as investors question AI profitability - CNBC`,url:`https://www.cnbc.com/`}]

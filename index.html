<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모닝 브리핑</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --sidebar-w: 240px;
    --bg: #FAFAF7;
    --paper: #FFFFFF;
    --accent: #6B7A8F;
    --accent-soft: #E8ECEF;
    --line: #EAE8E3;
    --line-strong: #D8D5CE;
    --text: #2D2A26;
    --text-mid: #6B655D;
    --text-sub: #A09889;
    --radius: 10px;
  }
  html, body {
    height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 15px; line-height: 1.65; font-weight: 400;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }

  /* ── Layout ── */
  #app { display: flex; height: 100vh; overflow: hidden; }

  /* ── Sidebar ── */
  #sidebar {
    width: var(--sidebar-w); flex-shrink: 0;
    background: var(--bg); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #sidebar-header {
    padding: 36px 20px 24px;
    border-bottom: 1px solid var(--line);
    text-align: center;
  }
  #sidebar-header h1 {
    font-size: 19px; font-weight: 700; color: var(--text);
    letter-spacing: -0.4px; line-height: 1.3;
  }
  #sidebar-header p {
    font-size: 12px; color: var(--text-sub); margin-top: 6px;
    letter-spacing: 0.3px;
  }
  #date-list { overflow-y: auto; flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
  .date-item {
    padding: 11px 14px; cursor: pointer; border-radius: 8px;
    transition: background 0.15s, color 0.15s;
    background: transparent;
    text-align: center; font-size: 13px; font-weight: 500; color: var(--text-mid);
    letter-spacing: 0.1px;
  }
  .date-item:hover { background: var(--accent-soft); color: var(--text); }
  .date-item.active {
    background: var(--accent-soft); color: var(--text); font-weight: 600;
  }

  /* ── Main ── */
  #main { flex: 1; overflow-y: auto; background: var(--paper); }
  #content { max-width: 760px; margin: 0 auto; padding: 56px 40px 80px; }

  .brief-header { margin-bottom: 36px; }
  .brief-header .bh-eyebrow {
    font-size: 11px; color: var(--text-sub); margin-bottom: 8px;
    letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500;
  }
  .brief-header h2 {
    font-size: 30px; font-weight: 700; letter-spacing: -0.7px;
    color: var(--text); line-height: 1.25;
  }

  /* ── Sticky Top (header + tabs) ── */
  .sticky-top {
    position: sticky; top: 0;
    background: var(--paper); z-index: 20;
    padding-top: 56px; margin-top: -56px;
  }
  .sticky-top .brief-header { margin-bottom: 24px; }

  /* ── Category Tabs ── */
  .cat-tabs {
    display: flex; gap: 0; margin-bottom: 36px;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
  }
  .cat-tab {
    padding: 12px 20px 14px; cursor: pointer; font-size: 14px; font-weight: 500;
    color: var(--text-sub); border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    background: none; border-top: none; border-left: none; border-right: none;
    font-family: inherit; letter-spacing: -0.1px;
    margin-bottom: -1px;
  }
  .cat-tab:hover { color: var(--text-mid); }
  .cat-tab.active { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }

  /* ── Sources (collapsible) ── */
  .sources-toggle {
    background: transparent; border: 1px solid var(--line-strong);
    padding: 8px 14px; border-radius: 6px; font-size: 12.5px; font-weight: 500;
    color: var(--text-mid); cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    font-family: inherit; margin-top: 12px;
    transition: background 0.15s, border-color 0.15s;
  }
  .sources-toggle:hover { background: var(--accent-soft); border-color: var(--accent); }
  .sources-toggle .arrow { transition: transform 0.2s; font-size: 9px; color: var(--text-sub); }
  .sources-toggle.open .arrow { transform: rotate(180deg); }
  .sources-body { display: none; margin-top: 12px; padding-left: 4px; }
  .sources-body.open { display: block; }

  /* ── Story Card ── */
  .story { margin-bottom: 40px; }
  .story-top { margin-bottom: 18px; }
  .story-headline {
    font-size: 19px; font-weight: 700; line-height: 1.45;
    letter-spacing: -0.4px; color: var(--text);
  }

  .metrics { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .metric-chip {
    background: var(--accent-soft); border: none;
    border-radius: 6px; padding: 7px 12px;
    font-size: 12.5px; font-weight: 500; color: var(--text-mid);
    line-height: 1.4;
  }

  .summary {
    font-size: 15px; line-height: 1.8; color: var(--text); margin-bottom: 20px;
    letter-spacing: -0.1px;
  }
  .summary .kt-underline {
    color: #1996BD;
    text-decoration: underline;
    text-decoration-color: #1996BD;
    text-decoration-thickness: 1.5px;
    text-underline-offset: 3px;
    cursor: help;
  }

  /* ── Key Terms Box ── */
  .key-terms {
    background: #F4F1EA; border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius); padding: 18px 22px; margin-bottom: 14px;
  }
  .key-terms-title {
    font-size: 11px; font-weight: 600; color: var(--text-sub);
    text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 14px;
  }
  .kt-item { margin-bottom: 12px; }
  .kt-item:last-child { margin-bottom: 0; }
  .kt-term {
    font-size: 13.5px; font-weight: 700; color: #1996BD;
    margin-bottom: 4px; display: block;
    letter-spacing: -0.1px;
  }
  .kt-exp {
    font-size: 13.5px; line-height: 1.7; color: var(--text-mid);
  }

  /* ── Background ── */
  .bg-box {
    background: var(--bg); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 22px 24px; margin-bottom: 14px;
  }
  .bg-box-title {
    font-size: 11px; font-weight: 600; color: var(--text-sub);
    text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 16px;
  }
  .bg-section { margin-bottom: 16px; }
  .bg-section:last-child { margin-bottom: 0; }
  .bg-section-label {
    font-size: 12.5px; font-weight: 600; color: var(--text); margin-bottom: 6px;
    letter-spacing: -0.1px;
  }
  .bg-section-text { font-size: 14px; line-height: 1.75; color: var(--text-mid); }

  /* ── Sources ── */
  .source-item {
    display: flex; align-items: flex-start; gap: 10px;
    margin-bottom: 8px; font-size: 13px;
  }
  .src-num {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent-soft); color: var(--text-mid);
    font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .source-item a { color: var(--text-mid); text-decoration: none; line-height: 1.55; }
  .source-item a:hover { color: var(--text); text-decoration: underline; }

  .story-divider { border: none; border-top: 1px solid var(--line); margin: 36px 0; }

  .empty { color: var(--text-sub); font-size: 14px; padding: 60px 0; text-align: center; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }

  /* ── Mobile Toggle ── */
  #sidebar-toggle {
    display: none;
    position: fixed; top: 14px; left: 14px; z-index: 50;
    background: var(--paper); border: 1px solid var(--line-strong);
    width: 40px; height: 40px; border-radius: 10px;
    cursor: pointer; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(45, 42, 38, 0.08);
  }
  #sidebar-toggle span {
    display: block; width: 18px; height: 2px; background: var(--text);
    position: relative;
  }
  #sidebar-toggle span::before,
  #sidebar-toggle span::after {
    content: ''; position: absolute; left: 0; width: 18px; height: 2px; background: var(--text);
  }
  #sidebar-toggle span::before { top: -6px; }
  #sidebar-toggle span::after { top: 6px; }

  #sidebar-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(45, 42, 38, 0.4); z-index: 40;
  }
  #sidebar-backdrop.open { display: block; }

  /* ── Mobile Responsive ── */
  @media (max-width: 768px) {
    #sidebar-toggle { display: flex; }
    #sidebar {
      position: fixed; left: 0; top: 0; bottom: 0;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      z-index: 45; width: 260px;
      box-shadow: 0 0 24px rgba(45, 42, 38, 0.12);
    }
    #sidebar.open { transform: translateX(0); }

    #content { padding: 64px 20px 60px; max-width: 100%; }
    .brief-header h2 { font-size: 22px; }
    .story-headline { font-size: 16px; }
    .summary { font-size: 14.5px; line-height: 1.75; }
    .bg-section-text { font-size: 13.5px; }
    .metric-chip { font-size: 12px; padding: 6px 10px; }
    .bg-box { padding: 18px 18px; }
    .cat-tab { padding: 11px 14px; font-size: 13.5px; }

    .quiz-card { padding: 28px 24px 24px; }
    .quiz-q { font-size: 17px; }
    .quiz-choice { font-size: 14px; padding: 13px 16px; }
  }

  /* ── Quiz Overlay ── */
  body.quiz-active #app {
    filter: blur(6px) saturate(0.85);
    pointer-events: none;
    transition: filter 0.3s ease;
  }
  #quiz-overlay {
    position: fixed; inset: 0;
    background-color: rgba(250, 250, 247, 0.55);
    background-image:
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0) 0,
        rgba(255,255,255,0) 5px,
        rgba(45,42,38,0.04) 5px,
        rgba(45,42,38,0.04) 6px
      ),
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0) 0,
        rgba(255,255,255,0) 22px,
        rgba(45,42,38,0.025) 22px,
        rgba(45,42,38,0.025) 23px
      );
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 24px;
  }
  #quiz-overlay.hidden { display: none; }

  .quiz-card {
    background: var(--paper); border-radius: 16px;
    padding: 36px 36px 32px; width: 100%; max-width: 440px;
    box-shadow: 0 16px 48px rgba(45, 42, 38, 0.18);
  }
  .quiz-eyebrow {
    font-size: 11px; color: var(--text-sub); letter-spacing: 1.5px;
    text-transform: uppercase; font-weight: 500; margin-bottom: 12px;
  }
  .quiz-q {
    font-size: 19px; font-weight: 700; color: var(--text);
    line-height: 1.5; letter-spacing: -0.3px; margin-bottom: 24px;
  }
  .quiz-choices { display: flex; flex-direction: column; gap: 8px; }
  .quiz-choice {
    background: var(--paper); border: 1px solid var(--line-strong);
    padding: 14px 18px; border-radius: 10px; font-size: 14.5px; font-weight: 500;
    color: var(--text); cursor: pointer; text-align: left;
    font-family: inherit; transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .quiz-choice:focus { outline: none; }
  .quiz-choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) {
    .quiz-choice:hover { background: var(--accent-soft); border-color: var(--accent); }
  }
  .quiz-choice:active { transform: scale(0.99); }
  .quiz-choice.wrong {
    background: #F5E6E0; border-color: #C9947F; color: #8A4A30;
    animation: shake 0.4s ease;
  }
  .quiz-choice.correct {
    background: #E3EDE2; border-color: #7A9077; color: #2E4A2C;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .quiz-feedback {
    margin-top: 20px; text-align: center; font-size: 14px; font-weight: 500;
    color: var(--text-mid); min-height: 22px;
  }
  .quiz-feedback.right { color: #2E4A2C; }
  .quiz-feedback.wrong { color: #8A4A30; }

  .quiz-close-btn {
    margin-top: 18px; width: 100%;
    background: var(--text); color: var(--paper); border: none;
    padding: 13px 20px; border-radius: 10px; font-size: 14px; font-weight: 600;
    font-family: inherit; cursor: pointer;
    transition: background 0.15s;
  }
  .quiz-close-btn:hover { background: #1a1815; }
  .quiz-close-btn.hidden { display: none; }
</style>
</head>
<body>
<div id="quiz-overlay">
  <div class="quiz-card">
    <div class="quiz-eyebrow"><span>잠깐, 나에 대해서 잘 알지?</span> <span id="quiz-counter">(0/3)</span></div>
    <div class="quiz-q" id="quiz-q"></div>
    <div class="quiz-choices" id="quiz-choices"></div>
    <div class="quiz-feedback" id="quiz-feedback"></div>
    <button class="quiz-close-btn hidden" id="quiz-close">닫기</button>
  </div>
</div>

<button id="sidebar-toggle" aria-label="메뉴"><span></span></button>
<div id="sidebar-backdrop"></div>

<div id="app">
  <nav id="sidebar">
    <div id="sidebar-header">
      <h1>모닝 브리핑</h1>
      <p>일별 세계 뉴스 요약</p>
    </div>

    <div id="date-list"></div>
  </nav>
  <main id="main">
    <div id="content"></div>
  </main>
</div>

<script>
const BRIEFS = [{
  tag:`2026-11-18`,
  label:`2026년 11월 18일 (수)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`IMF, 반도체 수출 호조를 반영해 한국의 2026년 경제성장률 전망치를 3.9%로 대폭 상향 조정했습니다.`,
  metrics:[`2026년 경제성장률 전망치 3.9%`,`3분기 민간소비 증감률 -0.2%`],
  summary:`국제통화기금(IMF)이 2026년 한국의 경제성장률 전망치를 기존 3.3%에서 3.9%로 상향 발표했습니다. 이는 글로벌 AI 열풍에 따른 HBM 및 메모리 반도체 수출의 기록적인 폭증이 주요 원인입니다. 반도체 산업의 호황 덕분에 한국의 연간 수출액은 사상 최초로 1조 달러 돌파를 눈앞에 두고 있습니다. 하지만 화려한 수출 지표 이면에는 어두운 그림자도 존재합니다. 3분기 민간소비는 오히려 -0.2% 역성장하며 수출 기업과 내수 경제 간의 양극화 현상인 K자형 성장이 뚜렷하게 나타나고 있습니다. 정부와 한국은행은 잠재성장률을 웃도는 지표 속에서도 내수 침체를 우려해 통화정책 완화 시기를 고심하고 있습니다. 반도체가 이끄는 성장이 언제쯤 가계 소비 여력 확대로 이어질지 시장의 관심이 집중되고 있습니다.`,
  keyTerms:[{term:`K자형 성장`,explanation:`경제 회복 과정에서 특정 산업이나 계층은 빠르게 성장하지만, 다른 부문은 침체를 겪으며 양극화가 심화되는 현상을 알파벳 K의 모양에 빗대어 부르는 말입니다.`}],
  history:`2024년부터 본격화된 AI 반도체 수요가 2026년까지 이어지며 한국 수출 실적을 견인해왔습니다. 반면 고금리 장기화로 가계 부채 부담이 커지며 내수 시장은 침체를 겪어왔습니다.`,
  players:`수출 호황을 누리는 삼성전자, SK하이닉스 등 대기업과 반대로 소비 부진의 직격탄을 맞는 자영업자 및 소상공인이 극명히 대비되고 있습니다. 물가를 관리해야 하는 한국은행의 딜레마도 커지고 있습니다.`,
  current:`헤드라인 경제 지표와 체감 경기의 괴리가 역사상 가장 크게 벌어진 상황으로 평가받고 있습니다. 정부의 재정 투입이나 내수 진작책이 시급하다는 목소리가 높습니다.`,
  outlook:`연말 한국은행의 기준금리 결정과 내년도 예산안 국회 통과 과정에서 내수 부양을 위한 구체적인 핀셋 정책이 나올지 주목됩니다.`,
  sources:[{title:`IMF 한국 성장률 3.9% 상향... 반도체 수출 견인 - 연합뉴스`,url:`https://m.yna.co.kr/view/20261117`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 인플레이션이 관세와 에너지 가격 상승 여파로 3.4%에 머물며 연준의 추가 금리 인상 가능성이 커졌습니다.`,
  metrics:[`근원 PCE 인플레이션 3.4%`,`12월 금리 25bp 인상 확률 75%`],
  summary:`미국의 핵심 개인소비지출(PCE) 물가지수가 3.4%를 기록하며 연방준비제도(Fed)의 목표치인 2%를 크게 웃돌고 있습니다. 중동 지역의 정세 불안으로 인한 에너지 가격 급등과 최근 발표된 신규 관세 정책이 수입 물가를 끌어올린 것이 인플레이션 고착화의 주된 이유로 지목됩니다. 시장에서는 물가 안정을 위해 연준이 다시 긴축의 고삐를 죌 것이라는 관측이 지배적입니다. 투자은행들은 다가오는 12월 연방공개시장위원회(FOMC)에서 금리를 소폭 올리는 베이비스텝 단행 확률을 75% 이상으로 보고 있습니다. AI 인프라 투자 붐 덕분에 미국 경제 자체는 2.5% 수준의 견조한 성장을 유지하고 있지만, 노동 시장의 신규 일자리 창출은 둔화하고 있습니다. 고물가와 고금리가 겹치는 환경 속에서 미국 기업과 소비자의 피로도는 점차 증가하는 추세입니다.`,
  keyTerms:[{term:`베이비스텝`,explanation:`중앙은행이 기준금리를 한 번에 0.25%포인트(25bp)씩 소폭 조정하는 것을 의미하며, 경제에 미치는 충격을 최소화하기 위한 점진적인 조치입니다.`}],
  history:`미국은 2022년부터 급격한 금리 인상을 통해 물가 잡기에 나섰고, 2024년 잠시 완화 기조를 보였으나 2026년 들어 에너지 공급망 차질로 다시 물가가 반등했습니다.`,
  players:`제롬 파월 연준 의장을 비롯한 매파적 인사들은 인플레이션 재점화 방지를 최우선 과제로 삼고 있으며, 월가의 투자자들은 금리 변동에 촉각을 곤두세우고 있습니다.`,
  current:`경기 침체 없는 성장(연착륙)에 대한 기대감과 물가 불안이라는 두 가지 상반된 지표가 팽팽하게 맞서는 매우 이례적인 거시경제 환경입니다.`,
  outlook:`12월 FOMC 회의에서 발표될 점도표와 기준금리 결정 결과에 따라 2027년 상반기 글로벌 금융 시장의 자금 흐름이 크게 요동칠 전망입니다.`,
  sources:[{title:`US Inflation Sticks at 3.4%, Fed Rate Hike Looms - Bloomberg`,url:`https://www.bloomberg.com/news/articles/2026-11-17/us-inflation`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`글로벌 빅테크 기업들이 AI 데이터센터의 전력 병목 현상을 해결하기 위해 전용 전력망 확충에 500억 달러를 투입합니다.`,
  metrics:[`AI 인프라 투자액 500억 달러`,`데이터센터 전력 수요 연간 2배 증가`],
  summary:`마이크로소프트, 아마존 등 글로벌 빅테크 기업들이 AI 데이터센터 가동에 필요한 막대한 전력을 확보하기 위해 인프라 자체 구축에 돌입했습니다. 차세대 추론 칩과 고성능 AI 모델이 쏟아지면서 전력 수요가 매년 2배씩 폭증하고 기존 국가 전력망만으로는 이를 감당하기 어렵게 되었습니다. 이에 따라 빅테크 기업들은 원자력 발전소 단독 계약 및 차세대 지열 발전 프로젝트 등에 연합하여 약 500억 달러 규모의 자금을 쏟아붓고 있습니다. 이는 단순한 서버 증설을 넘어 에너지 자립이 곧 AI 패권 유지의 핵심 조건이 되었음을 보여줍니다. 각국 정부는 거대 AI 인프라 투자가 유발하는 탄소 배출 문제와 민간의 전력망 독점 우려를 제기하며 규제안을 만지작거리고 있습니다. 결국 누가 더 싸고 안정적으로 전기를 공급받느냐가 미래 AI 경쟁력을 좌우할 전망입니다.`,
  keyTerms:[{term:`AI 인프라 투자`,explanation:`인공지능 모델을 학습시키고 구동하기 위해 필수적인 대규모 데이터센터, 고성능 반도체, 그리고 이를 뒷받침하는 막대한 전력망 및 냉각 설비 등을 구축하는 데 자본을 투입하는 것을 말합니다.`}],
  history:`초대규모 언어모델(LLM) 경쟁이 심화되면서 연산 처리량은 기하급수적으로 늘어났고, 기존 재생에너지 중심의 전력망 확충 속도가 이를 따라가지 못하는 상황이 2025년부터 심화되었습니다.`,
  players:`엔비디아, MS, 구글 등 하드웨어와 클라우드를 장악한 테크 거인들이 소형원자로(SMR) 개발사나 에너지 기업들과 직접 지분 투자를 맺는 새로운 산업 동맹을 형성 중입니다.`,
  current:`반도체 칩 자체의 효율을 높이는 기술 개발과 동시에, 막대한 자본을 동원해 물리적인 발전소 자체를 소유하려는 움직임이 가속화되고 있습니다.`,
  outlook:`향후 3~4년 내에 전력 확보 여부에 따라 AI 기업 간의 격차가 더욱 극명해질 것이며, 환경 단체와의 마찰도 주요 사회적 의제로 떠오를 것입니다.`,
  sources:[{title:`Big Tech's \$50B Gamble on AI Power Grids - WSJ`,url:`https://www.wsj.com/articles/ai-power-infrastructure-2026`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`한국 정부가 APEC 정상회의에서 동남아시아 국가들과 협력을 강화하는 한-아세안 AI 동맹을 공식 제안했습니다.`,
  metrics:[`APEC 참가국 21개국`,`AI 동맹 초기 기금 1억 달러`],
  summary:`한국 대통령은 필리핀과 중국 선전을 잇는 다자 외교 무대인 APEC 정상회의에서 21개 회원국을 향해 새로운 기술 협력 비전을 발표했습니다. 특히 아세안 국가들을 대상으로 디지털 격차 해소와 공동 기술 표준 마련을 위한 '한-아세안 AI 동맹' 구축을 전격 제안하며 초기 마중물로 1억 달러 규모의 펀드를 조성하겠다고 밝혔습니다. 이 제안은 미국과 중국의 기술 패권 경쟁 틈바구니에서 한국이 주도하는 중견국 연대를 통해 독자적인 첨단 기술 공급망을 확보하려는 전략적 포석으로 풀이됩니다. 정상회의 기간 동안 한일 정상회담도 열려 양국 간 반도체 및 핵심 광물 공급망 안정을 위한 실질적 공조 방안이 논의되었습니다. 외교계에서는 이번 순방이 단순한 경제 협력을 넘어 아시아 태평양 지역 내 한국의 지정학적 입지를 기술 선도국으로 격상시키는 계기가 될 것으로 평가합니다. 정부는 향후 구체적인 공동 연구소 설립을 추진할 계획입니다.`,
  keyTerms:[{term:`AI 동맹`,explanation:`특정 국가들이 인공지능 기술 개발, 데이터 공유, 규제 표준 마련 등을 함께 협력하기 위해 맺는 전략적 파트너십을 의미합니다.`}],
  history:`미중 갈등이 심화되면서 아세안 국가들은 어느 한쪽에 치우치지 않는 제3의 파트너를 필요로 해왔고, 한국은 IT 강국의 강점을 살려 이 틈새를 꾸준히 공략해왔습니다.`,
  players:`기술 자립을 원하는 아세안 주요국 정상들과, 이를 지렛대 삼아 글로벌 발언권을 키우려는 한국 정부, 그리고 이 연대를 견제 또는 환영하는 미·중 양국이 주요 플레이어입니다.`,
  current:`글로벌 규제와 AI 주권(Sovereign AI) 확보가 화두로 떠오른 가운데, 지역 맞춤형 AI 모델 개발을 위한 국가 간 연대가 절실해진 시점입니다.`,
  outlook:`내년 서울에서 열릴 실무진 회의에서 공동 데이터 센터 구축 및 인재 교류 프로그램 등 세부적인 동맹 운영 방안이 확정될 예정입니다.`,
  sources:[{title:`대통령, APEC서 '한-아세안 AI 동맹' 전격 제안 - 한겨레`,url:`https://www.hani.co.kr/arti/politics/20261117`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`다가오는 수능을 앞두고 스마트 안경을 이용한 신종 부정행위 우려가 커지자 정치권이 긴급 처벌법 논의에 착수했습니다.`,
  metrics:[`작년 수능 부정행위 적발 250건`,`관련 긴급 회의 참석자 50명`],
  summary:`2026학년도 대학수학능력시험을 불과 며칠 앞두고 소형 스마트 안경과 무선 이어셋을 결합한 지능형 부정행위 시도 정황이 포착되면서 정치권과 교육계가 발칵 뒤집혔습니다. 초소형 렌즈로 시험지를 비추면 외부의 AI가 정답을 도출해 무선으로 알려주는 수법이 인터넷에서 공유된 것이 발단입니다. 국회에서는 여야를 불문하고 이러한 시도를 원천 차단하기 위해 첨단 전자기기 반입 시 처벌을 대폭 강화하는 이른바 '수능 AI 부정행위 방지법'을 긴급 상정해 논의 중입니다. 교육부는 긴급 화상 점검회의를 주재하고, 시험장 내 전파 차단기 도입 및 금속 탐지기 검사 강화 등 무관용 원칙을 적용하겠다고 발표했습니다. 학생과 학부모들 사이에서는 과도한 보안 조치로 인한 시험 당일 혼란을 우려하는 목소리와 철저한 공정성 확보가 필수라는 의견이 팽팽히 맞서고 있습니다. 사상 초유의 하이테크 부정행위 논란이 입시 제도의 신뢰성에 큰 시험대가 되고 있습니다.`,
  keyTerms:[{term:`무관용 원칙`,explanation:`어떤 규칙이나 법을 위반했을 때 예외나 선처 없이 정해진 규정대로 가장 엄격하게 처벌을 내리는 강력한 대응 방식을 말합니다.`}],
  history:`과거에는 단순한 엿보기나 휴대전화 소지 정도가 수능 부정행위의 주를 이뤘으나, 최근 웨어러블 기기와 AI의 발달로 적발이 극도로 어려운 신종 수법이 급증하고 있습니다.`,
  players:`공정한 시험 관리를 책임지는 교육당국과 경찰, 첨단 기기를 악용하려는 일부 브로커 조직, 그리고 억울한 피해를 걱정하는 일반 수험생들이 얽혀 있습니다.`,
  current:`시험이 코앞으로 다가온 상황에서 기술적 차단(전파 차단 등)과 법적 처벌 경고라는 두 가지 카드를 동시에 꺼내들며 사전 예방에 총력을 기울이고 있습니다.`,
  outlook:`이번 수능이 끝난 직후, 적발된 사례 유무에 따라 향후 국가 고시 전체의 보안 시스템과 스마트 기기 규제 가이드라인이 전면 개편될 가능성이 높습니다.`,
  sources:[{title:`수능 코앞인데 '스마트 안경' 비상... 정부 무관용 원칙 - KBS`,url:`https://news.kbs.co.kr/news/20261117`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`중동 평화 협상이 교착 상태에 빠진 가운데 서방 국가들의 이란에 대한 새로운 원유 수출 통제가 발효되었습니다.`,
  metrics:[`이란 원유 수출 감소 목표 30%`,`브렌트유 배럴당 95달러 돌파`],
  summary:`이스라엘과 주변 무장 정파 간의 무력 충돌을 끝내기 위한 다국적 평화 협상이 결국 양측의 입장 차이를 좁히지 못하고 잠정 중단되었습니다. 이에 대응하여 미국과 유럽연합(EU)은 분쟁의 배후로 지목받는 이란의 자금줄을 차단하기 위해 30% 수준의 수출 타격을 목표로 하는 새로운 에너지 제재를 공식 발효했습니다. 이 제재는 이란산 원유를 운송하는 제3국 선박과 금융 거래망까지 촘촘히 옥죄는 내용을 담고 있어 글로벌 원유 시장에 즉각적인 충격을 주었습니다. 제재 발표 직후 브렌트유 가격은 배럴당 95달러를 단숨에 돌파하며 전 세계적인 인플레이션 우려를 다시 키우고 있습니다. 지정학적 위기가 고조되면서 중동 내 미군 기지들은 방어 태세를 최고 수준으로 격상했습니다. 전문가들은 이번 조치가 평화 협상 재개를 압박하려는 의도지만, 단기적으로는 오히려 역내 무력 충돌의 도화선이 될 수 있다고 경고하고 있습니다.`,
  keyTerms:[{term:`에너지 제재`,explanation:`특정 국가를 압박하기 위해 그 나라가 원유나 천연가스 등 주요 에너지 자원을 다른 나라에 수출하지 못하도록 무역 및 금융 거래를 강제로 막는 경제적 제재 조치입니다.`}],
  history:`중동 지역은 수년간 국지전이 반복되어 왔으나, 2026년 들어 친이란 무장 단체들의 활동 반경이 넓어지면서 미국 등 서방의 직접적인 개입 필요성이 제기되어 왔습니다.`,
  players:`이란과 그를 지지하는 무장 단체들, 안보 위협을 느끼는 이스라엘, 그리고 물가 상승을 우려하면서도 중동 질서를 다잡으려는 미국과 EU가 치열한 수싸움을 벌이고 있습니다.`,
  current:`외교적 대화 창구가 닫히면서 경제적 타격을 입히는 강경책이 실행되었고, 이는 글로벌 공급망과 유가에 즉각적인 악영향을 미치고 있습니다.`,
  outlook:`겨울철 전력 수요 증가 시기와 맞물려 유가 급등이 지속될 경우, 서방 국가들의 인플레이션 통제 정책이 크게 흔들리고 정치적 여론도 악화될 위험이 있습니다.`,
  sources:[{title:`Mideast Peace Talks Stall as US Slaps New Sanctions on Iran - Reuters`,url:`https://www.reuters.com/world/middle-east/2026-11-17`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`한국의 초고령사회 진입 가속화로 노동력 부족이 심각해지자 국회에서 '이민청' 신설 법안이 급물살을 타고 있습니다.`,
  metrics:[`65세 이상 고령인구 비율 25%`,`내년 외국인 근로자 쿼터 10만명`],
  summary:`통계청의 최신 인구 동향 발표에 따르면 한국의 65세 이상 인구 비율이 전체의 25%를 넘어서며 초고령사회의 정점을 향해 치닫고 있습니다. 생산가능인구의 급감으로 인해 산업 현장과 농어촌의 구인난이 한계에 달하자, 이를 해결하기 위한 범정부 차원의 컨트롤타워 신설이 시급해졌습니다. 이에 국회에서는 여야 합의로 외국인 인력 유입과 통합 정책을 총괄하는 독립 기구인 이민청 신설 법안의 연내 처리가 유력하게 논의되고 있습니다. 법안이 통과되면 부처별로 흩어져 있던 비자 발급, 취업 교육, 다문화 가족 지원 업무가 하나로 일원화되어 효율적인 인력 관리가 가능해집니다. 정부는 당장 내년도 외국인 근로자 쿼터를 10만 명 규모로 대폭 확대하고 유학생의 국내 취업 연계 프로그램도 강화하기로 했습니다. 한국 사회가 폐쇄적인 단일 민족 국가에서 벗어나 본격적인 다문화 이민 국가로의 시스템 전환을 꾀하는 역사적인 분기점을 맞이하고 있습니다.`,
  keyTerms:[{term:`이민청`,explanation:`외국인 근로자 유입, 다문화 가정 지원, 출입국 심사 등 이민과 관련된 모든 국가 정책과 행정을 한 곳에서 전담하여 관리하는 정부 산하의 독립적인 기관입니다.`}],
  history:`수십 년간 이어진 저출산 기조로 내국인 노동력은 급감해 왔으며, 과거 단기 체류 위주였던 외국인 정책이 구조적 한계에 부딪혔다는 지적이 계속되었습니다.`,
  players:`인력난 해소를 요구하는 중소기업 및 농어촌 단체들과, 체계적인 사회 통합을 준비하려는 법무부, 그리고 일자리 잠식과 치안 문제를 우려하는 일부 시민 단체가 이해관계를 맺고 있습니다.`,
  current:`더 이상 미봉책으로는 경제 성장을 유지할 수 없다는 사회적 공감대가 형성되면서, 체계적인 이민 정책 기구 설립이 정쟁을 넘어선 국가 생존 과제로 격상되었습니다.`,
  outlook:`이민청이 실제 출범할 경우 해외 우수 인재 유치를 위한 획기적인 영주권 부여 제도 등 파격적인 비자 개편안이 잇따라 발표될 것으로 보입니다.`,
  sources:[{title:`인구 4명 중 1명 노인... '이민청' 연내 신설 급물살 - 중앙일보`,url:`https://www.joongang.co.kr/article/20261117`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`단순한 답변을 넘어 스스로 기획하고 행동하는 '자율 에이전틱 AI'가 전 세계 기업의 새로운 표준 업무 도구로 정착하고 있습니다.`,
  metrics:[`엔터프라이즈 AI 에이전트 도입률 65%`,`초기 업무 생산성 향상 40%`],
  summary:`사용자의 지시를 기다리던 챗봇 형태의 인공지능을 넘어, 목표가 주어지면 스스로 계획을 세우고 실행까지 완수하는 자율 에이전틱 AI가 실무 현장에 빠르게 확산되고 있습니다. 최근 글로벌 IT 리서치 기관의 조사에 따르면, 포춘 500대 기업 중 65%가 이미 사내 파이프라인에 이러한 독립적 AI 에이전트를 도입한 것으로 나타났습니다. 이 기술은 복잡한 소프트웨어 코드 리팩토링, 기획 문서 분석, 자동화 워크플로우 제어 등 인간의 개입이 필수적이었던 영역까지 독자적으로 수행하며 초기 업무 생산성을 무려 40%나 끌어올리고 있습니다. 마이크로소프트와 오픈AI 등 빅테크 기업들은 앞다투어 기업용 맞춤형 에이전트 구축 플랫폼을 출시하며 시장 선점에 나섰습니다. 인간은 실무자가 아닌 AI 에이전트들의 작업을 승인하고 관리하는 감독관 역할로 직무 성격이 급변하고 있습니다. 전문가들은 이러한 전환이 21세기 화이트칼라 노동 시장을 근본적으로 재편할 가장 거대한 충격파가 될 것이라고 입을 모읍니다.`,
  keyTerms:[{term:`자율 에이전틱 AI`,explanation:`단순히 질문에 대답만 하는 것이 아니라, 큰 목표를 주면 스스로 판단하고 여러 도구를 사용해 복잡한 업무를 끝까지 완수해 내는 능동적인 인공지능 시스템입니다.`}],
  history:`2023년부터 대형언어모델(LLM)이 대중화되었으나 환각 현상과 수동적인 인터페이스의 한계가 있었고, 이를 극복하기 위해 추론 능력과 실행력을 결합한 에이전트 연구가 2025년부터 꽃피웠습니다.`,
  players:`기존 소프트웨어 개발자와 사무직 종사자들은 AI 에이전트를 동료로 맞이하게 되었고, 구글과 마이크로소프트 같은 기업들은 이 에이전트 생태계를 독점하기 위해 경쟁하고 있습니다.`,
  current:`개별적인 AI 툴 도입을 넘어, 회사 전체의 시스템과 데이터를 연결하여 AI가 스스로 돌아다니며 일할 수 있는 인프라 구축이 기업들의 최우선 과제가 되었습니다.`,
  outlook:`향후에는 에이전트끼리 서로 소통하고 협업하여 대규모 프로젝트를 처리하는 멀티 에이전트 시스템이 도입되면서 보안 및 윤리적 통제 장치 마련이 시급해질 것입니다.`,
  sources:[{title:`Agentic AI is the New Enterprise Standard - The Economist`,url:`https://www.economist.com/technology/2026/11/17/agentic-ai`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`구글 딥마인드의 AI가 극한 기후에도 견디는 획기적인 차세대 태양광 신소재를 세계 최초로 발견하여 상용화를 앞두고 있습니다.`,
  metrics:[`신소재 태양광 변환 효율 35%`,`기존 대비 연구 개발 기간 5년 단축`],
  summary:`구글 딥마인드가 이끄는 피지컬 AI 연구팀이 인공지능의 시뮬레이션을 통해 사막의 고열과 혹한을 모두 견디면서도 발전 효율이 압도적인 차세대 태양광 신소재 합성 구조를 발견했습니다. 이 소재는 기존 실리콘 기반 패널의 한계를 뛰어넘어 무려 35%의 태양광 변환 효율을 달성하는 것으로 실험 결과 확인되었습니다. 놀라운 점은 인간 과학자가 5년 이상 수만 번의 시행착오를 거쳐야 할 복잡한 화학 합성 공정을 AI가 단 3개월 만에 예측하고 최적화해 냈다는 것입니다. 이번 발견은 인공지능이 디지털 세계를 넘어 물리적 세계의 과학적 진보를 직접 이끌어내는 피지컬 AI 시대의 본격적인 서막을 알리는 사건으로 평가받고 있습니다. 에너지 업계는 이 신소재가 기후 변화로 인해 몸살을 앓고 있는 글로벌 신재생 에너지 시장의 판도를 단숨에 바꿀 게임 체인저가 될 것으로 기대하고 있습니다. 향후 신약 개발, 배터리 소재 등 다양한 과학 분야에서도 AI 주도의 연구 혁신이 폭발적으로 늘어날 전망입니다.`,
  keyTerms:[{term:`피지컬 AI`,explanation:`컴퓨터 화면 속의 데이터 처리에만 머물지 않고, 로봇이나 신소재 개발처럼 우리가 살아가는 실제 물리적 세계의 문제를 해결하고 변화를 만들어내는 인공지능 기술입니다.`}],
  history:`과거 AI는 주로 체스, 바둑 등 규칙이 정해진 게임이나 언어 처리에 집중했으나, 최근 단백질 구조 예측(알파폴드) 성공 이후 재료 과학 및 화학 시뮬레이션 분야로 영역을 넓혀왔습니다.`,
  players:`막대한 자금력을 갖춘 빅테크 연구소들과 이를 상용화하려는 친환경 에너지 기업, 그리고 첨단 기술로 기후 위기를 극복하려는 각국 정부가 합심하고 있습니다.`,
  current:`기후 변화로 인해 극단적 날씨가 잦아지면서 튼튼하고 효율 좋은 재생 에너지 장비에 대한 수요가 폭발적으로 증가하는 상황에서 나온 시의적절한 돌파구입니다.`,
  outlook:`머지않아 이 기술이 로보틱스와 결합되어 AI가 새로운 소재를 발견하고 로봇이 직접 공장에서 생산까지 테스트하는 완전 자동화 연구실이 현실화될 가능성이 높습니다.`,
  sources:[{title:`AI Discovers Next-Gen Solar Material - AP News`,url:`https://apnews.com/article/ai-solar-discovery-2026`}]
}]
},{
  tag:`2026-11-17`,
  label:`2026년 11월 17일 (화)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국 수출은 반도체 훈풍에 성장세를 이어가지만, 내수와 건설 경기는 여전히 한파를 겪으며 양극화가 심화되고 있다.`,
  metrics:[`반도체 수출 전년 대비 30% 이상 급증`,`1,350원대 고환율 기조 지속`],
  summary:`글로벌 AI 인프라 확대로 첨단 메모리와 HBM 등 한국의 반도체 수출이 전체 경제를 강하게 이끌고 있습니다. 반면 고금리 장기화와 건설 경기 둔화의 여파로 자영업과 체감 소비의 회복세는 매우 더딘 상황입니다. 물가 상승률은 2% 초반으로 안정세에 접어들었으나, 달러 강세로 인한 원/달러 환율이 여전히 큰 부담으로 작용하고 있습니다. 이에 따라 수도권 집값과 가계부채 리스크를 함께 고려한 한국은행의 기준금리 인하 속도 조절이 계속 이어질 전망입니다. 수출 대기업과 내수 시장 간의 극명한 경기 양극화 현상을 해소하는 것이 하반기 정부의 가장 시급한 과제로 떠오르고 있습니다.`,
  keyTerms:[{term:`경기 양극화`,explanation:`경제의 특정 부문은 호황을 누리지만 다른 부문은 침체를 겪으며 두 부문 간의 격차가 점점 벌어지는 현상입니다.`}],
  history:`팬데믹 이후 수출은 글로벌 기술 사이클을 타고 빠르게 반등했으나, 지속된 고금리 기조로 인해 내수 침체가 길어졌습니다.`,
  players:`사상 최대 실적을 내는 반도체 수출 대기업과 내수 부진에 시달리는 중소기업, 자영업자가 핵심 주체입니다.`,
  current:`인플레이션은 진정되었음에도 불구하고 환율 불안과 가계부채 뇌관 탓에 기준금리를 공격적으로 내리기 힘든 딜레마에 빠져 있습니다.`,
  outlook:`연말 미국 새 행정부의 통상 정책 변화와 환율 안정화 여부에 따라 한국은행의 금리 인하 시점과 내수 회복 속도가 결정될 것입니다.`,
  sources:[{title:`반도체 훈풍에도 내수 한파 여전... 깊어지는 韓 경제 시름 - 연합뉴스`,url:`https://www.yna.co.kr/view/AKR20261116000000001`},{title:`한은, 환율·가계부채 딜레마에 금리 인하 신중론 - 한국경제`,url:`https://www.hankyung.com/economy/article/202611160001`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 경제가 견고한 소비와 AI 투자를 바탕으로 나홀로 질주하는 반면, 유럽과 중국은 구조적 부진을 면치 못하고 있다.`,
  metrics:[`미국 경제성장률 2.1%대 견조한 유지`,`유럽 경제성장률 0.9% 안팎 정체`],
  summary:`전 세계 경제성장률이 3% 안팎의 완만한 둔화 흐름을 보이는 가운데, 국가별 경제 성장의 불균형이 극심해지고 있습니다. 미국은 빅테크 중심의 AI 설비투자와 튼튼한 내수 소비 덕분에 주요 선진국 중 가장 강력한 성장을 이어가며 전 세계적인 경제 독주 체제를 굳히고 있습니다. 반면 유럽은 에너지 비용 부담과 독일 제조업 침체로 0%대 후반의 저성장에 머물고 있습니다. 중국 역시 부동산 시장의 부진과 내수 악화로 4%대 초중반의 방어적 성장에 그치며 경제 엔진이 식어가고 있습니다. 이러한 글로벌 경제 비대칭성은 세계 자금의 달러 집중 현상을 더욱 부추기고 있습니다.`,
  keyTerms:[{term:`경제 독주`,explanation:`다른 국가들이 성장 정체나 침체를 겪는 와중에 유독 특정 국가만이 굳건하게 높은 경제 성장세를 홀로 이어가는 현상을 말합니다.`}],
  history:`팬데믹 이후 인플레이션 극복 과정에서 미국의 유연한 노동시장과 막대한 기술 투자가 타 국가와의 성장 격차를 크게 벌렸습니다.`,
  players:`나홀로 호황을 누리는 미국 경제와 구조적 어려움을 겪고 있는 유럽연합(EU), 대규모 부양책을 고심하는 중국 정부입니다.`,
  current:`미국의 고금리 장기화에도 불구하고 실물 경제가 꺾이지 않으면서, 글로벌 달러 강세가 이어지고 타국의 통화 정책을 제약하고 있습니다.`,
  outlook:`내년 트럼프 2기 행정부의 보호무역주의와 관세 정책이 구체화되면 글로벌 교역이 위축되며 국가 간 성장 격차가 한층 더 벌어질 위험이 큽니다.`,
  sources:[{title:`美 나홀로 질주 속 길잃은 유럽·중국... 글로벌 경제 뚜렷한 명암 - 매일경제`,url:`https://www.mk.co.kr/news/world/202611160002`},{title:`IMF, 올해 세계 경제 3.1% 전망... 미국만 웃었다 - 조선일보`,url:`https://biz.chosun.com/international/202611160002`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`글로벌 빅테크 기업들이 AI 주도권 선점을 위해 반도체와 데이터센터 인프라 투자를 천문학적인 규모로 확대하고 있다.`,
  metrics:[`글로벌 빅테크 AI 설비투자 역대 최고치 경신`,`AI 인프라 연관 산업 글로벌 수주 50% 폭증`],
  summary:`AI 서버, 고성능 반도체, 데이터센터 및 전력망 구축을 위한 전 세계적인 자본 지출(CAPEX) 투자가 폭발적으로 증가하며 글로벌 제조업을 강력하게 떠받치고 있습니다. 이 거대한 설비투자 흐름은 반도체 핵심 수출국인 한국과 대만은 물론, 인프라 확충에 나선 인도의 고성장 등 글로벌 경제 전반에 큰 파급 효과를 낳고 있습니다. 하지만 금융 시장 일각에서는 이처럼 막대한 AI 인프라 투자가 실제 기업의 이익 창출과 생산성 혁신으로 얼마나 빠르게 회수될 수 있을지에 대한 우려도 점차 커지고 있습니다. 향후 빅테크 기업들의 AI 인프라 투자 지속성이 전 세계 증시와 교역의 향방을 좌우할 가장 중요한 변수로 꼽힙니다.`,
  keyTerms:[{term:`자본 지출(CAPEX)`,explanation:`기업이 미래의 이윤을 창출하기 위해 새로운 공장, 장비, 서버 등 물리적인 자산을 구매하거나 개량하는 데 투자하는 막대한 비용을 뜻합니다.`}],
  history:`생성형 AI 시대가 본격적으로 열리면서 모델 훈련과 서비스 운용에 필요한 연산 능력을 확보하기 위한 치열한 인프라 선점경쟁이 촉발되었습니다.`,
  players:`투자를 주도하는 마이크로소프트, 구글, 메타 등 미국 빅테크 기업과 이를 후방 지원하는 엔비디아, TSMC, SK하이닉스 등입니다.`,
  current:`현재 전반적인 글로벌 제조업 경기가 둔화되는 속에서도 오직 AI 관련 인프라 투자 분야만이 나홀로 활황을 보이며 교역을 이끌고 있습니다.`,
  outlook:`천문학적인 투자 비용 대비 AI 기반 서비스의 실질적인 수익성이 입증되지 못한다면, 머지않아 투자 속도 조절과 함께 반도체 시장이 큰 조정을 받을 수 있습니다.`,
  sources:[{title:`끝없는 AI 투자 릴레이... 빅테크 설비투자액 사상 최고치 경신 - 중앙일보`,url:`https://www.joongang.co.kr/article/202611160003`},{title:`반도체가 떠받친 글로벌 수출... AI 인프라 수요 덕 톡톡 - 파이낸셜뉴스`,url:`https://www.fnnews.com/news/202611160003`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`국회 예산 심사와 주요 공직 후보자의 인사청문회가 맞물리면서 정국 주도권을 둘러싼 여야의 대치가 극한으로 치닫고 있다.`,
  metrics:[`2027년도 국가 본예산 수백조 원 규모 심사`,`국회 파행으로 예산안 법정 기한 준수 불투명`],
  summary:`2027년도 국가 본예산 심사가 국회에서 본격화된 가운데 R&D 및 지역 화폐 등 핵심 세부 예산의 삭감과 증액을 두고 여야가 한 치의 양보 없는 치열한 줄다리기를 하고 있습니다. 특히 법무부 장관을 비롯한 주요 공직 후보자에 대한 인사청문회 일정이 겹치면서 야당은 철저한 송곳 검증을 벼르고 있으며 여당은 부당한 정쟁 중단을 강력히 촉구하고 있습니다. 여당인 국민의힘은 새로 출범한 장동혁 당대표 체제 아래서 당정 결속을 다지며 야당의 공세를 방어하고 있습니다. 더불어민주당 또한 내부의 계파 갈등 불씨를 잠재우고 단일 대오로 치열한 예산국회에 임하고 있어 당분간 여야의 거센 충돌과 국회 파행이 불가피해 보입니다.`,
  keyTerms:[{term:`예산국회`,explanation:`매년 연말 국회에서 정부가 편성한 내년도 국가 예산안을 심사하고 수정하여 최종 확정하는 일정을 중심으로 운영되는 국회 정기 회기를 말합니다.`}],
  history:`매년 반복되어 온 예산안 처리 지연 관행에 더해, 올해는 비상계엄 정국 이후 극도로 양극화된 정치 환경이 여야의 갈등을 더욱 부추겼습니다.`,
  players:`내년 예산안 원안 사수에 나선 정부 및 여당(국민의힘)과 불필요한 예산 삭감 및 민생 예산 증액을 강하게 요구하는 제1야당(더불어민주당)입니다.`,
  current:`각 정당의 내부 지지층 결집을 위한 명분 싸움이 팽팽하게 맞서면서 12월 예산안 법정 처리 기한 준수는 사실상 무산될 위기에 처했습니다.`,
  outlook:`이번 예산안 협상과 인사청문회의 최종 결과는 정국 주도권의 향배는 물론 다가올 재보궐 선거의 민심 지형에 지대한 영향을 미칠 전망입니다.`,
  sources:[{title:`예산·인사청문회 동시 격돌... 벼랑 끝 대치 예고한 여야 - 연합뉴스`,url:`https://www.yna.co.kr/view/AKR20261116000000004`},{title:`장동혁 호 출범 국민의힘, 예산 정국서 리더십 시험대 - 한겨레`,url:`https://www.hani.co.kr/arti/politics/assembly/202611160004.html`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 중간선거에서 민주당이 상원과 하원을 모두 휩쓰는 압승을 거두며 트럼프 행정부의 후반기 정책에 강력한 제동이 걸렸다.`,
  metrics:[`미국 상·하원 양원 민주당 다수당 동시 탈환`,`트럼프 행정부 국정 지지율 하락세 뚜렷`],
  summary:`지난 11월 초 실시된 미국 중간선거에서 민주당이 상원과 하원 양원을 모두 장악하는 이른바 거대한 블루 쓰나미가 발생하여 워싱턴 정계에 큰 지각변동이 일어났습니다. 이번 선거 결과는 트럼프 행정부의 과도한 고율 관세 정책과 중동 분쟁 개입 등에 따른 지속적인 인플레이션에 대해 미국 유권자들이 강한 심판의 표심을 던진 것으로 분석됩니다. 의회의 주도권을 뺏긴 트럼프 2기 행정부는 집권 후반기 외교 및 통상 핵심 정책을 추진함에 있어 야당의 강력하고 노골적인 견제를 받게 되었습니다. 양원을 장악한 민주당의 본격적인 입법 견제가 시작되면서 글로벌 무역 환경과 동맹국들에 대한 미국의 강경 기조가 앞으로 어떻게 변화할지 전 세계가 촉각을 곤두세우고 있습니다.`,
  keyTerms:[{term:`블루 쓰나미`,explanation:`미국 선거에서 파란색을 상징하는 민주당이 유권자들의 압도적인 지지를 받아 단번에 주요 선거구와 의회 다수석을 휩쓰는 현상을 뜻합니다.`}],
  history:`집권 초기 강력한 행정명령을 통해 아메리카 퍼스트 자국 우선주의를 밀어붙였던 트럼프 행정부가 내수 물가 불안이라는 치명적인 암초를 만났습니다.`,
  players:`행정부 권력을 쥔 트럼프 대통령과 새롭게 입법 주도권을 쥔 민주당 의회 지도부, 그리고 표심을 바꾼 중도층 유권자들입니다.`,
  current:`의회의 동의가 필수적인 대규모 예산 수반 정책이나 법안 개정 등이 당장 민주당의 반대에 부딪혀 정책적 교착 상태가 우려됩니다.`,
  outlook:`민주당은 전통적 동맹국과의 관계 복원 및 기후 변화 정책 등을 무기로 행정부를 강하게 압박하며 차기 대선을 향한 기선 제압에 나설 것입니다.`,
  sources:[{title:`美 중간선거 '블루 웨이브' 넘어 '쓰나미'... 트럼프 독주 제동 - 경향신문`,url:`https://www.khan.co.kr/world/americas/article/202611160005`},{title:`상하원 장악한 미 민주당, 관세 장벽 완화 압박 나설 듯 - 매일경제`,url:`https://www.mk.co.kr/news/world/202611160005`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`APEC 정상회의를 무대로 미국, 중국, 러시아 정상이 한자리에 모이는 사상 첫 3자 회담이 추진되며 전 세계 안보 지형이 요동치고 있다.`,
  metrics:[`미중러 3국 정상 사상 첫 공식 회동 막후 조율 중`,`글로벌 안보 위기 종식 관련 3개항 의제 논의`],
  summary:`트럼프 미국 대통령이 중간선거 패배 직후 아시아 순방길에 오르며 중국 선전에서 열리는 APEC 정상회의를 계기로 시진핑 주석, 푸틴 대통령과의 3자 정상회담을 전격 추진 중입니다. 표면적으로는 글로벌 핵 군축과 이란 분쟁 종식 등 꼬인 중동 정세를 풀기 위한 평화 논의가 주요 의제로 제시되고 있습니다. 그러나 유럽연합과 우크라이나 등 국제사회 일각에서는 이 강대국들의 모임이 일방적인 영토 분할과 영향력 거래를 통해 우크라이나 전쟁을 서둘러 마무리 지으려는 밀실 타협의 장이 될 수 있다고 심각하게 우려하고 있습니다. 동맹국 패싱 논란이 거세게 제기되는 가운데, 이번 세 정상의 회담 성사 여부가 향후 수십 년간의 지정학적 질서를 새롭게 재편할 결정적 분수령이 될 것입니다.`,
  keyTerms:[{term:`3자 정상회담`,explanation:`세 국가의 최고 국가 원수가 직접 한자리에 모여 국제 사회의 중대한 현안이나 복잡한 상호 간의 이해관계를 논의하고 중대한 결정을 내리는 외교 회의입니다.`}],
  history:`길어지는 우크라이나 전쟁과 중동 지역의 무력 충돌로 글로벌 경제와 안보 피로감이 극에 달하자, 미국이 직접적인 판 흔들기를 시도하고 나섰습니다.`,
  players:`글로벌 패권을 두고 다투는 미국, 중국, 러시아 정상과 이들의 배후 거래를 극도로 경계하는 유럽 연합(EU) 및 우크라이나입니다.`,
  current:`각국 외교 실무진 차원의 막후 교섭이 치열하게 진행 중이며, 협상 테이블에서 유리한 고지를 점하기 위해 군사적 압박 수위를 최고조로 끌어올리고 있습니다.`,
  outlook:`이 회담이 실제로 성사되어 무력 분쟁의 휴전 합의 틀이 마련될 경우, 전후 복구 주도권과 새로운 경제 블록 재편을 둘러싼 치열한 다툼이 이어질 것입니다.`,
  sources:[{title:`트럼프·시진핑·푸틴, APEC서 사상 첫 3자 회담 추진 파장 - 서울신문`,url:`https://www.seoul.co.kr/news/newsView.php?id=202611160006`},{title:`미중러 정상회담 가시화... '제2 얄타회담' 우려하는 유럽 - 한국일보`,url:`https://www.hankookilbo.com/News/Read/202611160006`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`전문직 국가시험에서 초소형 기기를 이용한 신종 AI 커닝이 적발되면서, 코앞으로 다가온 대입 수능 시험장에 방역 비상이 걸렸다.`,
  metrics:[`세무사 등 주요 자격시험 AI 부정행위 연쇄 적발`,`수능 전국 1,200여 개 고사장 전파 차단 조치 긴급 투입`],
  summary:`최근 세무사 등 난이도 높은 주요 국가 자격증 시험에서 초소형 웨어러블 기기와 챗GPT 같은 생성형 AI를 결합한 신종 AI 부정행위가 적발되어 큰 사회적 파문이 일고 있습니다. 수석 합격자마저 이 범행에 연루된 사실이 드러나며 정부의 시험 관리 및 감독 시스템에 대한 신뢰도가 크게 흔들렸고, 사태의 충격파는 곧바로 대입 수능 시험으로 번졌습니다. 교육부는 당장 수능 시험을 앞두고 전국 모든 고사장의 와이파이 및 5G 통신 신호를 원천 차단하고 금속탐지기 검사를 강화하는 등 전례 없는 긴급 대책을 발표하며 방어에 나섰습니다. 눈부신 기술의 발전이 공정한 평가 시스템을 위협하는 심각한 도전으로 다가오면서, 근본적인 평가 방식의 혁신을 요구하는 목소리가 빗발치고 있습니다.`,
  keyTerms:[{term:`AI 부정행위`,explanation:`인공지능 기술, 특히 실시간으로 정답을 생성해주는 AI 모델과 눈에 띄지 않는 초소형 통신 기기를 은밀하게 사용하여 시험에서 부당한 점수를 얻는 범죄 행위를 말합니다.`}],
  history:`생성형 AI가 인간 전문가를 뛰어넘는 시험 풀이 능력을 빠르게 갖추게 되면서, 초소형 기기를 악용한 지능적인 커닝 시도가 꾸준히 증가해 왔습니다.`,
  players:`시험의 공정성을 목숨처럼 사수해야 하는 교육부 및 주관 기관과 신기술의 허점을 악용하려는 일부 범법 수험생 간의 치열한 기술전입니다.`,
  current:`적발된 범행 기기들이 육안으로는 구별하기 힘들 정도로 극도로 소형화되어 기존의 단순한 눈으로 보는 감독 방식으로는 부정행위를 잡아내기가 사실상 불가능해졌습니다.`,
  outlook:`단순한 지식 암기와 정답 맞히기를 요구하는 객관식 지필고사는 점차 사라지고, AI가 쉽게 대신해 줄 수 없는 논술형, 구술 면접형 평가 방식이 크게 확대될 것입니다.`,
  sources:[{title:`세무사 수석도 AI 커닝... 수능 앞두고 초비상 걸린 교육 당국 - 동아일보`,url:`https://www.donga.com/news/article/all/202611160007`},{title:`수능 고사장 와이파이 5G 전면 차단... 진화하는 꼼수 막는다 - KBS`,url:`https://news.kbs.co.kr/news/view.do?ncd=202611160007`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`단순 문답을 넘어 스스로 계획을 세우고 행동하는 '에이전틱 AI'와 물리적 로봇이 결합하여 산업 현장과 일터의 구조를 근본적으로 뒤바꾸고 있다.`,
  metrics:[`포춘 500대 기업 30% 이상 에이전틱 AI 업무 자동화 도입`,`산업용 휴머노이드 로봇 물류 현장 시범 배치 대거 본격화`],
  summary:`올해 글로벌 IT 업계의 핵심 화두는 화면 속 텍스트 생성에만 머물렀던 AI가 물리적이고 실무적인 현실 세계로 튀어나오는 전면적인 현장 침투입니다. 사용자의 최종 목표만 주어지면 여러 AI가 스스로 소통하며 코딩, 구매, 복잡한 일정 조율을 끝내는 에이전틱 AI가 화이트칼라 실무 전반에 빠르게 안착하고 있습니다. 이와 동시에 엔비디아와 테슬라 주도의 이른바 '피지컬 AI' 기술이 고도화되면서 제조와 물류 공장뿐 아니라 일반 서비스 현장에도 뛰어난 시각과 인지 능력을 갖춘 휴머노이드 로봇이 실전 배치되고 있습니다. 이러한 소프트웨어적 자율행동형 AI와 하드웨어적 피지컬 AI의 강력한 결합은 인간의 개입 없이도 생산 시스템이 스스로 굴러가는 진정한 무인화 시대의 서막을 열고 있습니다.`,
  keyTerms:[{term:`에이전틱 AI`,explanation:`사람이 단계별로 지시하지 않아도 AI 스스로 최종 목표를 이해하고 계획을 수립하여 복잡한 작업을 자율적으로 완수해 내는 고도로 진화된 인공지능 시스템입니다.`}],
  history:`초기 대형 언어 모델(LLM)이 발전하면서, 단순한 문장 생성을 넘어 모델에 추론 능력과 도구 사용 능력을 부여하는 에이전트 기술 개발로 자금이 집중되었습니다.`,
  players:`소프트웨어 기술을 선도하는 오픈AI, 구글, 마이크로소프트 등의 빅테크와 로보틱스를 결합하는 엔비디아, 테슬라 등 하드웨어 기업들이 치열하게 경쟁 중입니다.`,
  current:`사무직에서는 업무를 돕는 소프트웨어 봇의 형태로, 생산 현장에서는 로봇을 조종하는 두뇌의 형태로 나뉘어 산업 전반에 걸친 도입 속도에 거센 불이 붙고 있습니다.`,
  outlook:`향후 인간은 직접 코딩을 하거나 문서를 쓰기보다는 수많은 AI 에이전트 군단을 지휘하고 그들의 결괏값을 검수하는 총괄 관리자 역할로 업무 성격이 급변할 것입니다.`,
  sources:[{title:`시키는 일 알아서 척척... '에이전틱 AI'가 바꾸는 사무실 풍경 - 블로터`,url:`https://byline.network/2026/11/16/0008`},{title:`공장으로 걸어 들어간 AI... 테슬라 휴머노이드 투입 속도전 - 지디넷코리아`,url:`https://zdnet.co.kr/view/?no=202611160008`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`폭발하는 AI 데이터센터의 천문학적인 전력 수요를 감당하기 위해 글로벌 테크 기업들이 소형모듈원자로(SMR) 등 차세대 전력망 확보 경쟁에 사활을 걸고 있다.`,
  metrics:[`글로벌 AI 데이터센터 전력 소비량 전년 대비 50% 급증`,`구글·MS 등 빅테크 SMR 직접 투자액 수백억 달러 돌파`],
  summary:`전 세계적으로 멈출 줄 모르는 AI 연산 인프라의 거대한 확장으로 인해 데이터센터 전력난이 빠르게 현실화되면서 글로벌 테크 기업들의 발등에 불이 떨어졌습니다. 기존의 노후화된 전력망과 간헐적인 재생에너지로는 데이터센터의 천문학적인 전력 소모를 도저히 감당할 수 없게 되자, 구글이나 마이크로소프트 등은 차세대 원전인 소형모듈원자로(SMR) 전문 기업에 대규모 투자를 직접 단행하며 무탄소 에너지 확보에 나섰습니다. 뿐만 아니라 서버의 엄청난 열을 식히기 위한 특수 액침 냉각 기술과 고효율 통신 네트워크 인프라 등 관련 주변 기술의 수요도 함께 폭발하고 있습니다. 이처럼 첨단 AI 패권 경쟁이 단순한 소프트웨어 알고리즘 경쟁을 넘어 막대한 물리적 에너지를 안정적으로 공급할 수 있는 친환경 에너지 쟁탈전으로 빠르게 진화하고 있습니다.`,
  keyTerms:[{term:`소형모듈원자로(SMR)`,explanation:`기존의 거대한 대형 원전보다 크기가 훨씬 작아 공장에서 부품을 미리 만들고 현장에서 쉽게 조립할 수 있으며, 사고 위험이 낮고 초기 건설 비용이 적게 드는 차세대 소형 원자로입니다.`}],
  history:`초거대 딥러닝 모델의 크기가 매년 기하급수적으로 커지면서, 이를 훈련하고 연중무휴로 서비스하는 데 필요한 전력과 냉각수의 막대한 양이 물리적 한계치에 다다랐습니다.`,
  players:`전 세계의 막대한 전력을 독식하고 있는 글로벌 클라우드 선도 기업들과 혁신적인 SMR 기술을 보유한 차세대 에너지 벤처 스타트업들입니다.`,
  current:`극심한 전력 부족으로 인해 신규 데이터센터 건립이 지연되는 병목 현상이 곳곳에서 발생하자 팹리스 반도체 혁신보다 전력망 수급 자체가 기업들의 최우선 과제로 떠올랐습니다.`,
  outlook:`SMR의 상용화 성공 여부와 지역 주민들의 원전 수용성에 따라, 향후 글로벌 AI 데이터센터의 물리적 입지 선정과 국가별 AI 인프라 경쟁력이 완전히 뒤바뀔 것입니다.`,
  sources:[{title:`전기 먹는 하마 AI... 빅테크 앞다퉈 차세대 원전 SMR에 수십억 달러 베팅 - 조선비즈`,url:`https://biz.chosun.com/it-science/202611160009`},{title:`AI 패권은 에너지 싸움... 데이터센터 전력난에 전력망 기업 몸값 폭등 - 한국경제`,url:`https://www.hankyung.com/it/article/202611160009`}]
}]

  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미 증시, AI 빅테크 실적 발표 앞두고 관망세 뚜렷`,
  metrics:[`예상 매출 350억 달러`,`나스닥 지수 0.5% 하락`],
  summary:`이번 주 글로벌 증시는 엔비디아 등 주요 AI 빅테크 기업들의 3분기 실적 발표를 앞두고 짙은 관망세를 보이고 있습니다. 연방준비제도의 매파적 금리 인하 속도 조절 기조와 맞물려 투자자들의 경계심이 커진 상황입니다. 특히 AI 인프라에 대한 천문학적 설비투자가 실제 생산성 향상으로 이어지는지에 대한 시장의 의구심이 교차하고 있습니다. 전문가들은 이번 실적 발표가 내년도 AI 산업의 투자 지속성을 판가름할 중대 분수령이 될 것으로 내다보고 있습니다. 이에 따라 단기적으로 글로벌 증시의 변동성이 크게 확대될 가능성이 제기됩니다.`,
  keyTerms:[{term:`설비투자`,explanation:`기업이 생산 활동을 위해 기계나 장비, 인프라 등을 새로 구매하거나 확충하는 데 들이는 비용입니다.`}],
  history:`수년 전부터 빅테크 기업들은 생성형 인공지능 주도권을 쥐기 위해 막대한 자금을 쏟아부어 왔습니다. 하지만 최근 들어 실질적인 수익 창출 여부에 대한 의문이 싹트기 시작했습니다.`,
  players:`엔비디아를 필두로 한 AI 칩 설계 기업과 이를 대량 구매하는 마이크로소프트, 구글, 메타 등 클라우드 서비스 제공자들이 핵심 주체입니다.`,
  current:`높은 금리 수준이 유지되는 환경 속에서, 단기적인 실적 지표가 향후 AI 산업 전체의 자본 흐름을 좌우할 중요한 변수로 떠올랐습니다.`,
  outlook:`이번 주 발표될 주요 기업들의 재무 성과에 따라 기술주 중심의 글로벌 증시가 새로운 상승 동력을 얻을지, 혹은 조정 장세에 진입할지 결정될 예정입니다.`,
  sources:[{title:`빅테크 실적 발표에 쏠린 눈 - 매일경제`,url:`https://www.mk.co.kr/news/economy/1`},{title:`AI 거품론과 투자 지속성 논란 - 한국경제`,url:`https://www.hankyung.com/economy/2`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`SK하이닉스, AI 수요 견조에 HBM4 패키징·테스트 추가 설비 투자 단행`,
  metrics:[`추가 설비투자 규모 1조 원대`,`HBM4 양산 내년 초`],
  summary:`SK하이닉스가 차세대 고대역폭 메모리인 HBM4의 폭발적인 수요에 대응하기 위해 추가적인 설비 투자를 결정했습니다. 이번 투자는 주로 후공정에 해당하는 패키징과 테스트 라인을 확충하는 데 집중될 예정입니다. 글로벌 빅테크 기업들의 AI 가속기 확보 경쟁이 치열해지면서, HBM 시장의 주도권을 확고히 하려는 전략으로 풀이됩니다. 특히 HBM4는 기존 세대보다 데이터 처리 속도와 전력 효율이 크게 개선되어 고성능 AI 모델 학습에 필수적인 부품입니다. 업계에서는 이번 선제적 패키징 투자가 향후 시장 점유율 격차를 더욱 벌릴 핵심 승부수가 될 것으로 보고 있습니다.`,
  keyTerms:[{term:`패키징`,explanation:`제조된 반도체 칩을 외부 환경으로부터 보호하고 기기 플랫폼에 연결할 수 있도록 포장하는 후공정 기술입니다.`}],
  history:`AI 칩의 성능을 극대화하기 위해 메모리 반도체의 대역폭 한계를 극복하는 HBM 기술이 꾸준히 진화해 왔습니다.`,
  players:`세계 최고 수준의 HBM 제조 경쟁력을 갖춘 SK하이닉스와 주력 고객사인 글로벌 GPU 제조사들이 긴밀히 얽혀 있습니다.`,
  current:`생산 수율을 높이고 발열 문제를 해결하기 위해 공정 기술의 중요성이 커지면서, 선제적인 인프라 확장이 불가피해진 상황입니다.`,
  outlook:`내년 초 차세대 제품 양산이 본격화되면, 관련 장비 및 소재 협력사들의 수혜와 함께 한국 반도체 수출 실적에도 긍정적인 영향이 미칠 전망입니다.`,
  sources:[{title:`SK하이닉스 HBM4 주도권 굳히기 - 조선일보`,url:`https://www.chosun.com/economy/1`},{title:`AI 반도체 후공정 투자 본격화 - 중앙일보`,url:`https://www.joongang.co.kr/economy/2`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`3곳 이상 대출 '다중채무자' 469만 명 돌파… 역대 최대치 기록`,
  metrics:[`다중채무자 469만 명`,`평균 총대출액 1억 2천만 원`],
  summary:`3개 이상의 금융기관에서 돈을 빌린 다중채무자의 수가 469만 명을 넘어서며 역대 최대치를 경신했습니다. 고금리와 고물가가 장기화되면서 빚으로 빚을 돌려막는 취약 차주들이 급증한 결과로 분석됩니다. 이들의 평균 총대출액도 꾸준히 증가하고 있어 가계부채의 질적 악화 우려가 커지고 있습니다. 금융당국은 다중채무자의 연체율 상승이 금융권 전체의 시스템 리스크로 전이되지 않도록 모니터링을 강화하고 있습니다. 전문가들은 한계 상황에 내몰린 자영업자와 청년층을 위한 선별적인 채무 조정과 연착륙 지원 대책이 시급하다고 지적합니다.`,
  keyTerms:[{term:`다중채무자`,explanation:`은행이나 저축은행 등 3곳 이상의 금융기관에서 동시에 대출을 받은 사람을 말하며, 빚을 갚기 어려운 고위험군으로 분류됩니다.`}],
  history:`최근 몇 년간 코로나19 대유행과 글로벌 긴축 기조를 거치면서 생활고를 겪는 취약 계층의 채무 의존도가 크게 높아졌습니다.`,
  players:`생계 자금이 급한 저소득층 및 자영업자 차주들과, 이들에게 자금을 공급하는 제1금융권 및 제2금융권 기관들이 연관되어 있습니다.`,
  current:`한계에 다다른 가계가 이자 상환을 위해 다시 빚을 내는 악순환 구조가 통계 수치로 뚜렷하게 확인되면서 심각성을 더하고 있습니다.`,
  outlook:`정부는 부실 채권 확대를 막기 위해 금융권에 건전성 관리를 주문하는 한편, 한계 차주들을 위한 맞춤형 채무 조정 프로그램을 확대할 것으로 보입니다.`,
  sources:[{title:`다중채무자 사상 최대치 - 한겨레`,url:`https://www.hani.co.kr/economy/1`},{title:`고금리 장기화에 빚 폭탄 우려 - KBS 뉴스`,url:`https://news.kbs.co.kr/economy/2`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`민주당 내홍 격화… 최민희 최고위원 윤리심판원 이첩으로 계파 갈등 최고조`,
  metrics:[`국민의힘 지지율 43.0%`,`더불어민주당 지지율 34.6%`],
  summary:`더불어민주당 내 친명계와 친청계 간의 계파 갈등이 최민희 최고위원에 대한 징계 절차 착수로 새로운 국면을 맞았습니다. 김민석 대표는 당 윤리감찰단의 1차 조사 결과를 바탕으로 해당 건을 중앙당 윤리심판원에 공식 이첩할 것을 지시했습니다. 이 과정에서 당내 강경파들의 반발이 쏟아지며 내홍이 격화되는 양상입니다. 이재명 전 대표 역시 SNS를 통해 개혁을 방해하는 행위는 용납하기 어렵다며 강경파를 직접 겨냥하는 등 당내 긴장감이 고조되고 있습니다. 이러한 혼란 속에 최근 여론조사에서 양당 지지율 격차가 오차범위 밖으로 벌어지는 등 야당의 정치적 부담이 커지고 있습니다.`,
  keyTerms:[{term:`윤리심판원`,explanation:`정당 내부에서 당헌이나 당규를 위반한 당원의 징계 여부와 수위를 심사하고 결정하는 핵심 기구입니다.`}],
  history:`지난 전당대회 이후 제1야당 내부에서는 당 운영 방식과 쇄신 방향을 두고 강경파와 온건파 사이의 이견이 꾸준히 누적되어 왔습니다.`,
  players:`당권을 쥐고 있는 주류 지도부와 이에 반발하며 독자적인 목소리를 내고 있는 비주류 인사들이 첨예하게 대립 중입니다.`,
  current:`지도부 핵심 인사에 대한 징계 절차가 가시화되면서 수면 아래 있던 파벌 간의 권력 투쟁이 공개적인 비방전으로 폭발했습니다.`,
  outlook:`징계 결과에 따라 당내 균열이 분당 사태로까지 이어질지, 아니면 극적인 타협점을 찾을지 정치권의 이목이 쏠리고 있습니다.`,
  sources:[{title:`민주당 계파 갈등 심화 - SBS 뉴스`,url:`https://news.sbs.co.kr/politics/1`},{title:`당내 내홍에 지지율 하락세 - 연합뉴스`,url:`https://www.yna.co.kr/politics/2`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`윤 대통령, 아세안 및 APEC 다자외교 일정 차 출국`,
  metrics:[`순방 기간 5박 7일`,`참여국 21개국`],
  summary:`윤석열 대통령이 필리핀 마닐라에서 열리는 아세안 정상회의와 중국 선전에서 개최되는 APEC 정상회의 참석을 위해 오늘 출국했습니다. 이번 순방은 불안정한 글로벌 공급망을 점검하고 역내 안보 협력을 강화하는 다자외교의 주요 무대가 될 전망입니다. 특히 APEC 기간 동안 미국, 중국 등 주요국 정상들과 연쇄 양자 회담이 성사될지 관심이 집중되고 있습니다. 정부는 첨단 산업 기술 협력과 경제 안보를 핵심 의제로 삼아 국익을 극대화한다는 방침입니다. 국내 정치적 갈등이 심화되는 가운데, 이번 외교 성과가 향후 국정 동력 확보에 어떤 영향을 미칠지 주목됩니다.`,
  keyTerms:[{term:`다자외교`,explanation:`3개 이상의 여러 국가가 모여 국제적인 현안이나 규범을 논의하고 협력 방안을 모색하는 외교 활동입니다.`}],
  history:`지정학적 갈등과 보호무역주의가 심화되면서, 아시아 태평양 지역 국가들 간의 경제 협력과 다자간 규칙 연대의 중요성이 커졌습니다.`,
  players:`대한민국을 비롯해 무역 중심 경제 구조를 가진 아세안 회원국들과 미국, 중국 등 주요 G2 강대국들이 얽혀 있습니다.`,
  current:`자국 우선주의 정책들이 속속 발표되는 시점에, 핵심 광물 확보와 수출 시장 다변화를 위한 정상급 외교전이 활발히 펼쳐지고 있습니다.`,
  outlook:`참가국들과의 릴레이 회담을 통해 구체적인 경제 협력 양해각서 체결과 안정적인 공급망 구축 성과가 도출될 수 있을지 주목됩니다.`,
  sources:[{title:`대통령 필리핀·중국 순방 출국 - MBC 뉴스`,url:`https://imnews.imbc.com/politics/1`},{title:`APEC 다자외교 무대 막 올라 - 동아일보`,url:`https://www.donga.com/politics/2`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`국가시험 'AI 스마트안경' 부정행위 파문… 청와대, 전수조사 및 수능 비상 대응 지시`,
  metrics:[`부정행위 적발 1건`,`조사 대상 국가자격시험 50여 종`],
  summary:`세무사 시험 수석 합격자가 단추 카메라와 AI 스마트안경을 이용해 부정행위를 저지른 사실이 적발되면서 국가시험 관리에 비상이 걸렸습니다. 사태의 심각성을 인지한 청와대 정책실장은 즉각 대책회의를 소집하고 모든 국가자격시험에 대한 전수조사를 지시했습니다. 특히 다가오는 대학수학능력시험을 앞두고 교육 당국은 전자기기 반입 검색을 대폭 강화하는 비상 대응 체제에 돌입했습니다. 발전하는 첨단 IT 기기를 활용한 신종 부정행위 수법에 기존 감독 시스템이 무력화되었다는 비판이 쏟아지고 있습니다. 정부는 관계 부처 합동으로 AI 부정행위 방지를 위한 근본적인 방안을 신속히 마련할 계획입니다.`,
  keyTerms:[{term:`전수조사`,explanation:`조사 대상에 속하는 모든 사람이나 대상을 예외 없이 빠짐없이 모두 조사하는 방식을 말합니다.`}],
  history:`초소형 카메라와 무선 통신 기기의 발달로 과거부터 자격증 시험에서의 부정행위가 꾸준히 진화해 왔으나, 인공지능이 답을 알려주는 사례는 최근 급증했습니다.`,
  players:`공정한 시험 관리를 책임지는 정부 기관들과, 부정한 방법으로 자격을 취득하려는 일부 수험생 및 불법 기기 판매 조직이 얽혀 있습니다.`,
  current:`고도의 전문성이 요구되는 국가 공인 시험에서조차 최신 기술 앞에서는 기존의 관리 감독 방식이 통하지 않음이 적나라하게 드러났습니다.`,
  outlook:`수능을 비롯한 모든 대형 시험에 전파 차단기 도입이나 금속 탐지기 검사 등 물리적이고 기술적인 방어책이 대폭 상향 도입될 예정입니다.`,
  sources:[{title:`국가시험 AI 부정행위 적발 파장 - 중앙일보`,url:`https://www.joongang.co.kr/politics/3`},{title:`수능 앞두고 전자기기 검색 강화 - 한겨레`,url:`https://www.hani.co.kr/politics/4`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`삼성·구글·젠틀몬스터 합작 'AI 스마트안경', 1차 사전예약 전량 완판`,
  metrics:[`사전예약 물량 10만 대`,`완판 소요 시간 5분`],
  summary:`삼성전자, 구글, 그리고 아이웨어 브랜드 젠틀몬스터가 공동 개발한 차세대 AI 스마트안경이 사전 예약 판매에서 전량 완판을 기록했습니다. 다음 달 정식 출시를 앞두고 진행된 이번 1차 판매는 시작과 동시에 트래픽이 폭주하며 소비자들의 폭발적인 관심을 증명했습니다. 이 기기는 구글의 경량화된 생성형 AI 모델과 삼성의 하드웨어 기술력이 결합되어 실시간 번역, 시각 정보 분석 등의 기능을 제공합니다. 기존 스마트 안경과 달리 젠틀몬스터의 세련된 디자인이 일상적인 착용성을 크게 높였다는 평가를 받습니다. 업계는 이번 흥행이 본격적인 웨어러블 AI 기기 대중화의 신호탄이 될 것으로 기대하고 있습니다.`,
  keyTerms:[{term:`웨어러블`,explanation:`사용자가 몸에 직접 착용할 수 있는 형태의 스마트 기기나 컴퓨터 기술을 통틀어 이르는 말입니다.`}],
  history:`스마트폰을 대체할 차세대 플랫폼으로 스마트 글래스가 오랫동안 거론되었으나, 투박한 디자인과 제한된 기능으로 인해 번번이 대중화에 실패해 왔습니다.`,
  players:`압도적인 AI 소프트웨어 기술을 가진 구글과 뛰어난 디바이스 제조 능력을 갖춘 삼성전자, 그리고 패션 트렌드를 선도하는 젠틀몬스터가 손을 잡았습니다.`,
  current:`실용적인 인공지능 기능과 일상복에도 잘 어울리는 세련된 외관이 소비자들의 구매 욕구를 강하게 자극하며 초기 시장 진입에 크게 성공했습니다.`,
  outlook:`정식 출시 이후 실제 사용자들의 평가에 따라 폼팩터 시장의 새로운 표준으로 자리 잡을 수 있을지 관련 업계가 예의주시하고 있습니다.`,
  sources:[{title:`스마트안경 5분 만에 완판 - 전자신문`,url:`https://www.etnews.com/it/1`},{title:`차세대 웨어러블 돌풍 - 매일경제`,url:`https://www.mk.co.kr/it/2`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`유튜브 뒤덮은 'AI 가짜 의사' 불법 광고, 정부 전면 제재 시행`,
  metrics:[`적발된 불법 광고 영상 500여 건`,`과태료 최고 1천만 원`],
  summary:`생성형 AI로 실제 의사처럼 정교하게 만들어진 가짜 인물이 등장하는 온라인 의료 및 건강 광고에 대해 정부가 전면적인 제재를 시행합니다. 최근 유튜브 등 주요 영상 플랫폼에서는 허위 전문가가 효능이 검증되지 않은 건강보조식품이나 시술을 추천하는 불법 광고가 범람해 심각한 피해 우려를 낳았습니다. 보건당국은 AI 생성 콘텐츠임을 명시하지 않거나 전문가를 사칭해 소비자를 기만하는 모든 광고를 즉각 차단 조치하기로 했습니다. 또한 플랫폼 사업자에게도 사전 필터링 의무를 강화하고 적발 시 강력한 처벌을 내릴 방침입니다. 시민단체들은 이번 조치를 환영하며 지속적이고 체계적인 모니터링 시스템 구축을 요구하고 있습니다.`,
  keyTerms:[{term:`생성형 AI`,explanation:`방대한 데이터를 학습하여 사용자의 요구에 맞춰 새로운 텍스트, 이미지, 영상 등을 스스로 만들어내는 인공지능 기술입니다.`}],
  history:`인공지능 기술의 발전으로 진짜와 구별하기 힘든 딥페이크 콘텐츠가 쉽게 제작되면서, 이를 악용한 사기성 광고가 소셜 미디어를 중심으로 광범위하게 퍼졌습니다.`,
  players:`소비자를 기만하여 이득을 취하려는 불법 마케팅 업체들과 이를 차단해야 할 플랫폼 사업자, 그리고 관리 감독 책임을 진 보건당국이 연관되어 있습니다.`,
  current:`의료 지식이 부족한 일반인들이 전문가 행세를 하는 허위 영상에 속아 금전적, 신체적 피해를 입는 사례가 늘자 정부가 강력한 단속의 칼을 빼들었습니다.`,
  outlook:`플랫폼 자율 규제 의무 강화와 함께 불법 광고주에 대한 실질적인 형사 처벌 사례가 나와야만 이러한 기만 행위가 근절될 수 있을 것으로 기대됩니다.`,
  sources:[{title:`AI 의사 사칭 광고 전면 차단 - 조선일보`,url:`https://www.chosun.com/society/1`},{title:`가짜 의료 광고 철퇴 - KBS 뉴스`,url:`https://news.kbs.co.kr/society/2`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`마이크로소프트 글로벌 서비스 장애… 국내외 기업 업무 차질 확산`,
  metrics:[`복구 소요 시간 약 4시간`,`영향 받은 국가 30여 개국`],
  summary:`마이크로소프트의 클라우드 서비스인 아웃룩, 팀즈 및 주요 보안 도구에서 동시다발적인 글로벌 서비스 장애가 발생했습니다. 이로 인해 화상 회의, 이메일 송수신 등이 멈추면서 해당 솔루션에 의존하는 국내외 수많은 기업과 기관들이 심각한 업무 차질을 빚었습니다. 마이크로소프트 측은 이번 사태가 네트워크 라우팅 설정 변경 과정에서 발생한 예기치 않은 오류 때문이라고 밝혔으며, 약 4시간 만에 핵심 서비스들을 복구했습니다. 하지만 초연결 사회에서 단일 빅테크 기업의 인프라 장애가 전 세계적 마비로 직결될 수 있다는 취약성이 다시 한번 드러났습니다. 보안 전문가들은 기업들이 클라우드 의존도를 분산하고 재난 복구 매뉴얼을 재점검해야 한다고 강조하고 있습니다.`,
  keyTerms:[{term:`클라우드`,explanation:`인터넷을 통해 원격으로 서버, 스토리지, 소프트웨어 등의 컴퓨팅 자원을 빌려 사용하는 서비스 환경입니다.`}],
  history:`전 세계 기업들의 IT 환경이 자체 서버 구축 방식에서 몇몇 글로벌 거대 기업이 제공하는 인프라 생태계로 급격히 전환되어 왔습니다.`,
  players:`글로벌 IT 인프라를 독과점하고 있는 빅테크 기업들과 이들의 서비스를 기반으로 일상적인 비즈니스를 영위하는 수많은 전 세계 고객사들이 있습니다.`,
  current:`소프트웨어 업데이트나 설정 변경 과정에서의 작은 실수가 국경을 넘어 수많은 서비스에 동시다발적인 장애를 일으키는 이른바 디지털 재난 현상이 확인되었습니다.`,
  outlook:`각국 정부와 기업들은 특정 서비스에 대한 과도한 단일 장애점(SPOF) 위험을 낮추기 위해 다중 연결 전략을 도입하고 비상 대응책을 새롭게 정비할 전망입니다.`,
  sources:[{title:`MS 서비스 글로벌 마비 사태 - 한국경제`,url:`https://www.hankyung.com/it/1`},{title:`디지털 재난에 멈춰선 기업들 - 연합뉴스`,url:`https://www.yna.co.kr/society/2`}]
}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`공정위, 10여 개 채권 전문딜러사 국고채 입찰 담합 무더기 제재`,
  metrics:[`10여 개 전문딜러사 적발`,`대규모 과징금 부과 예고`],
  summary:`공정거래위원회가 10여 개 채권 전문딜러사를 대상으로 국고채 입찰 담합 혐의를 적발하고 대규모 과징금 제재에 착수했습니다. 이들은 사전 모의를 통해 입찰 금리와 물량을 조정하여 시장 경쟁을 제한한 혐의를 받고 있습니다. 금융권은 이번 제재가 국채 유통시장 위축으로 이어질 수 있다고 우려하고 있습니다. 특히 정부의 국채 발행 부담이 커진 상황에서 전문딜러사의 역할이 축소될 경우 채권 시장 전반의 유동성이 떨어질 위험이 제기됩니다. 현재 공정위는 심사보고서를 발송했으며, 조만간 전원회의를 열고 최종 제재 수위를 결정할 예정입니다.`,
  keyTerms:[{term:`국고채 입찰 담합`,explanation:`정부가 발행하는 국고채를 낙찰받는 과정에서 금융사들이 금리와 물량을 사전에 짜고 입찰하는 불공정 행위를 말합니다.`}],
  history:`과거부터 소수 대형 증권사와 은행들이 국고채 물량을 독식하기 위해 입찰 정보를 교환한다는 의혹이 꾸준히 제기되어 왔습니다.`,
  players:`제재를 추진하는 공정위와 입찰에 참여해온 10여 개 채권 전문딜러사(증권사 및 은행) 간의 갈등이 핵심입니다.`,
  current:`최근 세수 부족 등으로 국채 발행 규모가 늘어나는 가운데, 이번 제재로 시장 유동성 공급에 차질이 생길 수 있다는 점이 시장의 가장 큰 불안 요소입니다.`,
  outlook:`공정위 전원회의에서 부과될 최종 과징금 규모와 딜러 자격 정지 여부에 따라 채권 시장의 변동성이 크게 확대될 전망입니다.`,
  sources:[{title:`공정위 국고채 담합 제재 파장 - 매일경제`,url:`https://www.mk.co.kr/news/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`엔비디아 젠슨 황 CEO 전격 사임... 대중 수출 통제 스캔들 여파`,
  metrics:[`엔비디아 주가 급변동`,`대중국 수출 규제 위반 혐의 조사`],
  summary:`엔비디아의 젠슨 황 최고경영자가 대중 수출 통제 위반 의혹 및 사내 스캔들 여파로 CEO 자리에서 전격 사임했습니다. 미국 상무부와 재무부가 중국으로의 첨단 반도체 밀반출 논란을 둘러싸고 갈등을 빚는 가운데, 이번 사태가 불거졌습니다. 현재 임시 CEO로는 콜레트 크레스 최고재무책임자가 선임된 상태입니다. 글로벌 AI 생태계를 이끌던 수장의 퇴진으로 시장 불확실성이 극도로 커졌으며, 반도체 주가는 큰 변동성을 보이고 있습니다. 삼성전자와 SK하이닉스 등 국내 기업들도 글로벌 AI 투자 심리 위축 여부를 예의주시하고 있습니다.`,
  keyTerms:[{term:`대중 수출 통제`,explanation:`미국 정부가 첨단 반도체 및 AI 기술이 중국으로 흘러들어가는 것을 막기 위해 시행하는 강력한 수출 제한 조치입니다.`}],
  history:`미국은 수년에 걸쳐 중국의 AI 군사 기술 전용을 막고자 엔비디아의 고성능 칩에 대해 지속적으로 수출 규제 문턱을 높여왔습니다.`,
  players:`수출 규제를 담당하는 미국 상무부, 제재를 우회하려는 중국 기업들, 그리고 최대 칩 공급사인 엔비디아 간의 숨바꼭질이 계속되었습니다.`,
  current:`수장 사임이라는 사상 초유의 사태를 맞은 엔비디아는 당장 차기 리더십 안정을 증명해야 하는 동시에 미 당국의 조사 압박에 대응해야 합니다.`,
  outlook:`미 의회의 추가 조사와 청문회가 예고되어 있어, 글로벌 AI 반도체 밸류체인 전반에 걸친 광범위한 재편이 예상됩니다.`,
  sources:[{title:`Nvidia CEO steps down amid probe - Bloomberg`,url:`https://www.bloomberg.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`IEA 회원국, 에너지 위기 대응 위해 7,100만 배럴 비상 석유 방출 합의`,
  metrics:[`7,100만 배럴 원유 및 디젤 방출`,`2월 말까지 공급 완료 예정`],
  summary:`국제에너지기구(IEA) 회원국들이 글로벌 에너지 공급망 안정을 위해 총 7,100만 배럴 규모의 비상 석유 방출에 합의했습니다. 이번 방출분은 원유와 디젤을 포함하며, 내년 2월 말까지 시장에 순차적으로 공급될 예정입니다. 최근 중동 지역의 지정학적 긴장과 예기치 못한 공급 차질 우려가 커지자 선제적으로 가격 급등을 억제하기 위한 조치로 풀이됩니다. 이 발표 직후 국제 유가는 즉각적인 하락세를 보이며 안정을 찾았습니다. 주요 석유 수입국인 한국 역시 이번 조치로 인해 겨울철 에너지 수급 및 물가 관리에 다소 숨통이 트일 것으로 전망됩니다.`,
  keyTerms:[{term:`비상 석유 방출`,explanation:`전쟁이나 자연재해 등으로 글로벌 석유 공급이 심각하게 부족해질 때, 각국이 보유한 전략 비축유를 시장에 푸는 조치입니다.`}],
  history:`IEA는 1970년대 오일 쇼크 이후 에너지 위기에 공동 대응하기 위해 설립되었으며, 주요 위기 때마다 회원국 공조를 통해 비축유를 풀어왔습니다.`,
  players:`비축유를 방출하는 IEA 주요 선진국들과 감산을 주도해 온 OPEC+ 산유국들 간의 수급 주도권 경쟁이 배경에 자리잡고 있습니다.`,
  current:`동절기 난방 수요 증가와 불안정한 중동 정세가 맞물린 상황에서 이번 방출은 시장의 과도한 불안 심리를 진정시키는 데 긍정적으로 작용하고 있습니다.`,
  outlook:`2월 말까지의 방출 기간 동안 국제 유가는 하향 안정화될 가능성이 높으나, OPEC+의 추가 감산 대응 여부가 핵심 변수가 될 것입니다.`,
  sources:[{title:`IEA announces 71M barrel release - Reuters`,url:`https://www.reuters.com/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`민주당 계파 갈등 격화... 최민희 발언 놓고 친명·친청 정면 충돌`,
  metrics:[`친청계 최고위원 3인 집단 반발`,`윤리감찰단 조사 전격 착수`],
  summary:`더불어민주당 내 계파 갈등이 최민희 최고위원의 과거 발언을 둘러싸고 전면전으로 치닫고 있습니다. 김민석 대표가 최 최고위원의 탄핵 관련 발언에 대해 당 윤리감찰단 감찰을 지시한 것이 도화선이 되었습니다. 친명계는 해당 발언이 당의 기조를 흔들었다며 제명을 요구하고 나선 반면, 친청계 최고위원 3인은 이를 표적 감찰이자 불공정 운영이라며 강하게 반발하고 있습니다. 이들은 오히려 김민석 대표의 당 운영 방식에 대한 감찰을 요구하며 맞불을 놓은 상태입니다. 이번 사태는 다가오는 당내 선거 및 주도권 경쟁을 앞두고 불거진 권력 투쟁의 성격이 짙다는 분석이 나옵니다.`,
  keyTerms:[{term:`당 윤리감찰단`,explanation:`정당 소속 국회의원이나 당직자의 부정부패, 징계 사유 등을 독립적으로 조사하고 감찰하는 당내 핵심 기구입니다.`}],
  history:`민주당 내부는 그동안 이재명 대표 체제 하에서 단일대오를 강조해왔으나, 주요 현안마다 다양한 계파 간의 시각차가 수면 아래 존재해 왔습니다.`,
  players:`현재 당권을 쥐고 있는 친명계 및 김민석 대표와, 이에 반발하여 결집하고 있는 친청계 최고위원들이 정면 대결을 벌이고 있습니다.`,
  current:`최민희 최고위원 개인의 발언 논란을 넘어, 당 지도부의 감찰권 남용 여부를 두고 계파 간 세력 대결 양상으로 확전되고 있습니다.`,
  outlook:`윤리감찰단의 최종 조사 결과 및 징계 수위에 따라 당내 분열이 가속화되거나, 혹은 극적인 봉합 수순을 밟게 될 분수령이 될 전망입니다.`,
  sources:[{title:`민주당 윤리감찰 지시 파장 - 연합뉴스`,url:`https://www.yna.co.kr/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`162조 원 규모 미래대응기금 쟁탈전... 예산국회 쌈짓돈 논란`,
  metrics:[`162조 원 규모 기금 예산`,`각 상임위 25조 원 이상 증액 요구`],
  summary:`내년도 예산국회에서 162조 원 규모로 편성된 미래대응기금을 두고 상임위원회별로 25조 원 이상의 대규모 증액 요구가 쏟아지며 논란이 일고 있습니다. 저출산, 기후위기, 첨단산업 등 국가적 난제 대응을 목표로 신설된 이 기금이 각 부처와 지역구의 민원성 사업을 밀어넣는 쌈짓돈으로 전락했다는 비판이 나옵니다. 여당은 건전 재정 기조를 내세워 무분별한 증액을 차단하려 하지만, 야당은 민생 회복과 적극적 재정 역할을 주장하며 팽팽히 맞서고 있습니다. 결국 본예산안 처리를 앞두고 예산결산특별위원회에서 대대적인 칼질과 삭감 줄다리기가 불가피해졌습니다. 전문가들은 기금 본연의 목적에 맞는 엄격한 투자 기준 심사가 필요하다고 지적합니다.`,
  keyTerms:[{term:`미래대응기금`,explanation:`인구 감소, 기후 변화 등 장기적이고 구조적인 국가 위기에 선제적으로 대비하기 위해 정부가 막대한 예산을 모아 조성한 특별 기금입니다.`}],
  history:`정부는 만성적인 예산 칸막이 문제를 극복하고 미래 핵심 과제에 집중 투자하기 위해 기존 여러 기금을 통폐합하여 메가 기금을 신설했습니다.`,
  players:`지역구 예산을 확보하려는 여야 국회의원들과, 재정 건전성을 방어하려는 기획재정부 간의 기싸움이 벌어지고 있습니다.`,
  current:`초유의 대규모 기금이 마련되자마자 부처 이기주의와 정치권의 선심성 예산 요구가 결합되면서 기금의 취지가 크게 훼손될 위기에 처해 있습니다.`,
  outlook:`예결위 소위원회에서의 감액 심사를 거치며 치열한 정치적 막판 타결이 이루어질 것이며, 예산안 법정 처리 시한 준수 여부도 불투명합니다.`,
  sources:[{title:`162조 미래기금 쌈짓돈 논란 - 동아일보`,url:`https://www.donga.com/`}]

  category:`정치`,

  colorBg:`#fce8e6`,
  headline:`러-우크라, 각각 1천 명 대규모 포로 교환 합의... 유럽 참여 종전 협상 급물살`,
  metrics:[`양측 각각 1,000명 이상 포로 교환`,`유럽 4개국 평화 테이블 합류`],
  summary:`러시아와 우크라이나가 각각 1,000명 이상의 포로를 교환하기로 전격 합의하면서 교착 상태에 빠졌던 종전 국면에 새로운 전환점이 마련되었습니다. 이번 포로 교환은 최근 몇 달 간 가장 큰 규모로, 양국 간 신뢰 구축의 첫 신호탄으로 평가받고 있습니다. 동시에 주요 유럽 국가들이 중재자로 평화 협상 테이블에 적극적으로 합류하며 종전 논의가 급물살을 타고 있습니다. 다만 우크라이나의 확고한 안보 보장 요구와 러시아의 영토 인정 요구가 첨예하게 대립하고 있어 실질적인 평화 조약 체결까지는 여전히 난항이 예상됩니다. 이번 합의를 계기로 양국 간 최소한의 인도주의적 채널은 열렸다는 분석입니다.`,
  keyTerms:[{term:`포로 교환`,explanation:`전쟁 중 붙잡힌 양측의 군인이나 민간인 억류자들을 협상을 통해 서로 풀어주어 본국으로 돌려보내는 인도적 조치입니다.`}],
  history:`러시아와 우크라이나는 개전 이후 간헐적으로 억류자 교환을 해왔으나, 전황이 교착되면서 대규모 협상은 오랫동안 중단된 상태였습니다.`,
  players:`휴전을 원하는 미국 및 유럽 연합과, 전쟁을 유리하게 끝내려는 우크라이나 젤렌스키 정부, 러시아 푸틴 정권이 복잡하게 얽혀 있습니다.`,
  current:`장기화된 소모전으로 양국 모두 피로도가 극에 달한 상황에서 이끌어낸 이번 합의는, 물밑에서 외교적 해법이 모색되고 있음을 시사합니다.`,
  outlook:`포로 무사 귀환 절차가 성공적으로 마무리되면, 겨울철 임시 휴전 논의 등 구체적인 단계적 긴장 완화 조치가 뒤따를 것으로 보입니다.`,
  sources:[{title:`Major Russia-Ukraine prisoner swap - BBC`,url:`https://www.bbc.com/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`수도권 아파트 시장 관망세, 강남권 넘어 마포·성동 '한강벨트'로 확산`,
  metrics:[`마포·성동 지역 아파트 거래량 40% 감소`,`매수 심리 위축 지속`],
  summary:`최근 강남권에서 시작된 수도권 아파트 시장의 관망세가 마포구와 성동구 등 주요 한강벨트 지역으로 빠르게 확산되고 있습니다. 고금리 장기화 우려와 대출 규제 강화가 맞물리면서 매수 심리가 크게 위축되었기 때문입니다. 현장 중개업소들에 따르면 최근 몇 주 새 한강벨트 지역의 아파트 거래량이 급감했으며, 호가를 낮춘 매물도 쉽게 소화되지 않고 있습니다. 매도자와 매수자 간의 원하는 가격 차이가 벌어지면서 관망세가 짙어진 가운데, 일부 단지에서는 실거래가 하락 사례도 관측됩니다. 전문가들은 연말까지 금리 인하라는 강력한 신호가 없는 한 이러한 거래 절벽 현상이 수도권 전역으로 번질 수 있다고 분석합니다.`,
  keyTerms:[{term:`한강벨트`,explanation:`서울 한강 변을 따라 위치한 마포구, 용산구, 성동구 등 주거 선호도가 높고 집값 상승을 주도하는 주요 부동산 밀집 지역을 뜻합니다.`}],
  history:`올해 초 정부의 규제 완화 특례 대출 등에 힘입어 반등하던 수도권 집값은 하반기 들어 가계부채 관리 명목의 대출 조이기로 다시 꺾이기 시작했습니다.`,
  players:`내 집 마련을 미루는 주택 매수 대기자들과 가격을 방어하려는 집주인들, 그리고 가계 대출을 옥죄는 금융 당국이 주요 주체입니다.`,
  current:`초고가 시장인 강남에서부터 거래가 막히자, 그 바로 아래 가격대인 한강 변 인기 주거지까지 매수세가 마르며 시장 전반이 얼어붙고 있습니다.`,
  outlook:`내년 초 금융당국의 대출 한도 규제 완화 여부와 한국은행의 기준금리 방향에 따라 수도권 부동산 시장의 향방이 결정될 것입니다.`,
  sources:[{title:`수도권 부동산 관망세 한강벨트 확산 - 한국경제`,url:`https://www.hankyung.com/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`마이크로소프트 글로벌 클라우드 전면 장애... 전 세계 관공서·금융 마비`,
  metrics:[`수십 개국에서 수백만 명 사용자 접속 불가`,`금융 트레이딩 데스크 수십 곳 업무 중단`],
  summary:`아웃룩, 팀즈, 코파일럿 등 마이크로소프트의 주요 엔터프라이즈 서비스가 글로벌 단위로 전면 장애를 겪으며 전 세계 업무 환경이 마비되는 사태가 발생했습니다. 이로 인해 미국, 유럽, 아시아 등 수십 개국에서 금융 트레이딩 데스크와 주요 관공서의 업무가 큰 차질을 빚었습니다. 마이크로소프트 측은 네트워크 인프라 업데이트 과정에서 발생한 예기치 않은 오류가 원인이라고 밝혔으며, 긴급 복구 작업에 돌입했습니다. 기업들이 특정 업체의 서비스에 업무를 전적으로 의존하면서 발생하는 단일 클라우드 리스크가 다시 한번 심각하게 대두되었습니다. 이번 사태를 계기로 글로벌 기업들의 IT 시스템 다중화 및 장애 대비책 마련이 강력히 요구되고 있습니다.`,
  keyTerms:[{term:`단일 클라우드 리스크`,explanation:`기업이나 정부가 하나의 거대 클라우드 서비스 제공업체(예: MS, 아마존)에 모든 데이터를 맡겼을 때, 해당 업체의 시스템이 다운되면 전체 업무가 멈춰버리는 위험을 뜻합니다.`}],
  history:`팬데믹 이후 전 세계 주요 기관과 기업들이 비용 절감과 효율성을 이유로 자체 서버 대신 대형 클라우드 환경으로 급격히 이전을 완료했습니다.`,
  players:`서비스 인프라를 제공하는 마이크로소프트와, 이에 절대적으로 의존하여 업무 시스템을 운영하는 글로벌 기업 및 정부 기관들입니다.`,
  current:`현대 비즈니스가 실시간 연결 기반으로 작동하는 상황에서, 단 몇 시간의 클라우드 중단만으로도 천문학적인 경제적 피해가 발생하고 있습니다.`,
  outlook:`각국 규제 당국은 핵심 인프라 서비스 기업에 대한 장애 방지 규제를 강화할 것이며, 기업들은 멀티 클라우드 도입을 서두를 전망입니다.`,
  sources:[{title:`MS outage hits global markets - Reuters`,url:`https://www.reuters.com/`}]

  category:`기타 이슈`,

  colorBg:`#e6f4f1`,
  headline:`미국 전역 모든 항공편 운항 전면 중단... 미 연방항공청 통신 시스템 결함`,
  metrics:[`수천 편의 항공편 이륙 지연 및 취소`,`미국 전역 10시간 이상 항공 마비`],
  summary:`미국 연방항공청(FAA)이 항공기 조종사에게 안전 정보를 제공하는 핵심 통신 시스템에 치명적인 결함이 발생하자 미국 전역의 모든 항공편에 대해 이륙을 금지하는 운항 중단 명령을 내렸습니다. 이로 인해 수천 편의 항공편이 취소되거나 지연되면서 미국 전역의 공항이 마비되고 여행객 수백만 명의 발이 묶이는 대혼란이 벌어졌습니다. 당국은 사이버 공격의 징후는 현재까지 발견되지 않았으며, 노후화된 전산 시스템의 오류로 보인다고 설명했습니다. 백악관은 즉각적인 원인 규명과 시스템 복구를 지시했습니다. 항공업계는 이번 사태를 계기로 구시대적인 국가 항공 안전 인프라의 전면적인 개편이 시급하다고 목소리를 높이고 있습니다.`,
  keyTerms:[{term:`운항 중단`,explanation:`안전이나 시스템 상의 중대한 문제가 발생했을 때, 항공 당국이 일시적으로 특정 공항이나 국가 전체의 모든 비행기 이륙을 금지하는 조치입니다.`}],
  history:`미국의 국가 항공망 통제 시스템은 수십 년 된 낡은 소프트웨어 아키텍처를 바탕으로 운영되어 와 지속적인 교체 필요성이 제기되었습니다.`,
  players:`안전 시스템을 총괄하는 미국 연방항공청(FAA), 막심한 영업 손실을 입은 항공사들, 그리고 공항에서 큰 불편을 겪은 승객들입니다.`,
  current:`현대 항공 교통의 복잡성이 커졌음에도 불구하고, 이를 통제하는 핵심 통신 시스템이 단일 오류에 취약하다는 점이 백일하에 드러났습니다.`,
  outlook:`미 의회 차원의 진상 조사 청문회가 열릴 예정이며, 항공 인프라 현대화를 위한 막대한 예산 투입 법안이 탄력을 받을 것으로 보입니다.`,
  sources:[{title:`FAA grounds all US flights - AP News`,url:`https://apnews.com/`}]
}]

  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`10월 수출물가지수 43.9% 폭증하며 역대 최고 상승률 기록`,
  metrics:[`수출물량지수 43.9% 상승`,`수입물가지수 1.8% 하락`],
  summary:`10월 수출물량지수가 전년 동월 대비 43.9% 오르며 역대 최고 상승률을 기록했습니다. 이는 메모리 반도체 가격 상승과 AI 데이터센터용 장비 수요가 폭발적으로 증가한 데 따른 결과입니다. 수출금액지수 역시 107.6% 급증하며 우리 경제의 든든한 버팀목 역할을 하고 있습니다. 반면 수입물가지수는 원달러 환율과 국제 유가 하락의 영향으로 1.8% 내리며 안정세를 보였습니다. 이처럼 수출은 늘고 수입 비용은 줄어들면서 국가 간 교역조건 또한 역대급으로 개선된 상황입니다. 다만 최근 환율이 소폭 반등하는 추세라 향후 물가에 미칠 변수들은 주의 깊게 지켜봐야 합니다.`,
  keyTerms:[{term:`교역조건`,explanation:`수출품 한 단위를 팔아 수입할 수 있는 상품의 양을 뜻하며, 이 지표가 개선되면 국가의 실질적인 무역 이익이 커진다는 의미입니다.`}],
  history:`최근 수개월간 수출은 주춤했으나, 글로벌 AI 투자 붐으로 반도체와 장비 수요가 급증하기 시작했습니다.`,
  players:`삼성전자, SK하이닉스 등 반도체 기업과 주요 장비 수출 기업들이 이번 실적을 견인하고 있습니다.`,
  current:`역대급 수출 실적과 수입 물가 하락이 맞물리며 무역수지가 크게 개선되는 전환점을 맞이했습니다.`,
  outlook:`향후 글로벌 경기 둔화 우려와 환율 변동성이 상존하여, 이런 호조세가 연말까지 이어질지 주목됩니다.`,
  sources:[{title:`반도체·AI 장비 견인 수출물량 폭증 - 서울경제`,url:`https://www.sedaily.com`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 물가 지표 예상치 상회로 12월 연준 빅스텝 인상론 급부상`,
  metrics:[`미국채 10년물 장중 5% 터치`,`달러 인덱스 1년 7개월 만에 최고치`],
  summary:`10월 미국 소비자물가지수(CPI)가 시장 예상치를 웃돌면서 통화 긴축 경계감이 다시 커지고 있습니다. 물가가 쉽게 잡히지 않자 연준 위원들의 매파적 발언이 잇따르고 있으며, 시장에서는 12월 기준금리를 한 번에 크게 올리는 빅스텝 가능성까지 거론되는 중입니다. 이러한 금리 인상 관측이 퍼지면서 미국채 10년물 금리는 장중 5%를 터치했고, 달러 인덱스는 1년 7개월 만에 최고치로 치솟았습니다. 달러화의 초강세로 인해 엔화는 160엔 턱밑까지 떨어졌고 유로화 역시 약세를 면치 못하고 있습니다. 글로벌 자금 흐름이 급변하는 가운데, 전 세계 중앙은행들의 셈법도 복잡해지고 있습니다.`,
  keyTerms:[{term:`빅스텝`,explanation:`중앙은행이 기준금리를 통상적인 0.25%포인트가 아닌 0.50%포인트 단위로 대폭 인상하는 조치를 말합니다.`}],
  history:`미 연준은 인플레이션을 잡기 위해 고금리 기조를 유지해왔으나, 최근 인플레 둔화 기대로 금리 인하 기대감이 퍼져 있었습니다.`,
  players:`미국 연방준비제도와 제롬 파월 의장, 그리고 환율 방어에 나선 각국 중앙은행들이 주요 행위자입니다.`,
  current:`예상보다 높은 CPI 수치가 찬물을 끼얹으며, 단기적으로 글로벌 유동성이 미국으로 강하게 빨려 들어가는 현상이 나타나고 있습니다.`,
  outlook:`12월 FOMC 회의 결과와 후속 고용 지표에 따라 내년 글로벌 금리 향방이 결정될 것입니다.`,
  sources:[{title:`달러 초강세 및 연준 금리 인상론 - 중앙일보`,url:`https://www.joongang.co.kr`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`AI 스타트업 앤트로픽 1000억 달러 규모 기업공개 추진`,
  metrics:[`목표 가치 1000억 달러`,`빅테크 및 주요 증시 변동성 지속`],
  summary:`오픈AI의 강력한 라이벌로 꼽히는 AI 스타트업 앤트로픽이 역대 최대 규모인 약 1000억 달러 목표의 기업공개 절차에 돌입했습니다. 월가에서는 이번 상장이 AI 산업의 다음 성장 단계를 보여주는 핵심 이벤트가 될 것으로 기대하며 큰 관심을 보이고 있습니다. 반면 기존 시장을 주도하던 엔비디아와 테슬라 등 대형 기술주들은 최근 규제 우려와 정치적 변수 탓에 단기 급락하며 변동성을 키우고 있습니다. 국채금리의 급등락과 맞물려 글로벌 증시는 대장주들의 엇갈린 행보 속에서 크게 요동치고 있습니다. 앞으로의 기술주 흐름은 기업공개 성공 여부와 개별 기업의 실적 방어력에 달렸습니다.`,
  keyTerms:[{term:`기업공개`,explanation:`비상장 기업이 외부 투자자들에게 처음으로 주식을 팔고 재무 내용을 공개하여 증권시장에 상장하는 과정을 말합니다.`}],
  history:`최근 1~2년간 생성형 AI 열풍으로 관련 스타트업들의 몸값이 천정부지로 치솟았으며, 앤트로픽은 핵심 기술력으로 두각을 나타냈습니다.`,
  players:`앤트로픽과 이를 주관하는 대형 투자은행들, 그리고 경쟁사인 오픈AI, 구글 등이 주요 행위자입니다.`,
  current:`빅테크 주도주가 흔들리는 상황에서 초대어급 상장 소식이 시장의 자금을 새롭게 끌어모으고 있습니다.`,
  outlook:`실제 상장 시점의 시장 유동성과 규제 환경이 최종 상장 가치를 결정지을 핵심 변수입니다.`,
  sources:[{title:`앤트로픽 IPO 추진과 빅테크 변동성 - 중앙일보`,url:`https://www.joongang.co.kr`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`국회 내년도 예산안 및 핵심 쟁점 법안 심사 본격화`,
  metrics:[`정부 예산안 약 650조 원 규모`,`상임위 주요 법안 심사 개시`],
  summary:`외교통일위원회를 비롯한 국회 각 상임위원회가 내년도 정부 예산안과 주요 쟁점 법안에 대한 본격적인 심사에 돌입했습니다. 여야는 약 650조 원 규모로 편성된 예산안의 세부 내역을 두고 삭감과 증액을 요구하며 팽팽한 기싸움을 벌이고 있습니다. 특히 청해부대 작전영역 확대를 위한 파병 연장 동의안과 특검법을 둘러싸고 진보 진영과 야당의 강한 반발이 이어지는 상황입니다. 민생 경제 안정을 위한 법안 처리도 시급하지만, 주요 정치적 사안들이 얽혀 있어 상임위 통과가 쉽지 않아 보입니다. 연말 정기국회 시한을 앞두고 극적인 예산안 합의에 이를 수 있을지가 가장 큰 관건입니다.`,
  keyTerms:[{term:`예산안`,explanation:`정부가 한 해 동안 거둬들일 수입과 사용할 지출의 규모 및 내역을 미리 계획하여 국회에 제출하는 문서입니다.`}],
  history:`해마다 정기국회 막바지에는 정부 여당의 원안 고수와 야당의 삭감 요구가 맞붙으며 험난한 심사 과정을 거칩니다.`,
  players:`정부, 여당(국민의힘), 야당(더불어민주당 등) 간의 상임위 위원들이 치열한 협상을 주도하고 있습니다.`,
  current:`특검법 등 민감한 정치 이슈가 연계될 가능성이 커 심사 지연 우려가 높아진 상태입니다.`,
  outlook:`법정 처리 시한 내 타결을 위한 여야 원내대표 간 막판 협상에 이목이 쏠리고 있습니다.`,
  sources:[{title:`국회 예산안 및 파병 동의안 공방 - 문화일보`,url:`https://www.munhwa.com`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 의회 재편으로 한미 전시작전통제권 및 원잠 도입 논의 촉각`,
  metrics:[`미국 새 의회 출범 영향`,`한미 주요 안보 현안 점검`],
  summary:`최근 미국 선거 결과로 인한 의회 구도 변화가 한미 간 핵심 안보 현안에 직접적인 영향을 미칠 것으로 관측됩니다. 우리 정부는 전시작전통제권 전환과 원자력 추진 잠수함 도입 등 장기 과제들에 대해 미국 새 의회가 어떤 태도를 취할지 면밀히 분석 중입니다. 특히 미국 내 자국 우선주의 기조가 강해질 경우 방위비 분담금이나 전략자산 전개 비용 측면에서 압박이 거세질 수 있습니다. 이에 대응해 정부는 외교 채널을 총동원하여 양국 동맹의 굳건함을 재확인하고 정책 연속성을 확보하려 노력하고 있습니다. 이 문제는 향후 동북아시아 지역의 힘의 균형을 좌우할 매우 중대한 사안입니다.`,
  keyTerms:[{term:`전시작전통제권`,explanation:`한반도에 전쟁이 일어났을 때 군대의 작전을 지휘하고 통제할 수 있는 핵심적인 권한을 의미합니다.`}],
  history:`한미 양국은 조건에 기초한 전환을 추진해 왔으나, 북핵 위협 고도화 등으로 시기가 늦춰져 왔습니다.`,
  players:`한국 국방부 및 외교부, 미국 국방부와 새롭게 재편된 미 의회의 주요 안보 위원회 위원들입니다.`,
  current:`미국 정계의 권력 변화로 인해 기존 합의된 안보 로드맵에 대한 수정 요구 가능성이 커진 변곡점입니다.`,
  outlook:`양국 국방장관 회담 등 고위급 소통을 통해 도입 의제의 협상 방향이 구체화될 것입니다.`,
  sources:[{title:`미국 정세 변화와 한미 안보 현안 - 경기일보`,url:`https://www.kyeonggi.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`다자 정상회의 연쇄 개최 앞두고 글로벌 공급망 및 안보 사전 조율`,
  metrics:[`APEC 및 G20 2개 회의 연속 개최`,`주요 20여 개국 사전 접촉 진행`],
  summary:`전 세계 주요국 정상들이 한자리에 모이는 APEC과 G20 등 대규모 다자 정상회의를 앞두고 각국의 사전 외교전이 뜨겁습니다. 우리 정부는 주요국 외교장관들과 양자 회담을 진행하며 핵심 의제인 글로벌 공급망 안정화와 지역 안보 문제를 긴밀히 조율하고 있습니다. 미중 갈등과 지역 전쟁이 겹친 복잡한 국제 정세 속에서 이번 다자 정상회의는 새로운 협력 질서를 구축할 중요한 무대가 될 전망입니다. 특히 반도체와 핵심 광물 분야의 공급망 리스크를 줄이기 위해 다자간 연대를 이끌어내는 것이 우리의 최우선 목표입니다. 각국의 이해관계가 엇갈리는 만큼, 실질적인 공동 선언문을 도출하기 위한 치열한 물밑 작업이 계속되고 있습니다.`,
  keyTerms:[{term:`다자 정상회의`,explanation:`세 개 이상의 여러 국가의 정상들이 모여 글로벌 경제, 안보 등 공통의 관심사를 논의하고 해결책을 모색하는 회의체입니다.`}],
  history:`최근 몇 년간 지정학적 위기와 자국 보호주의로 인해 다자간 협력 체제가 큰 시험대에 올라 있었습니다.`,
  players:`한국, 미국, 중국을 포함한 G20 회원국 정상들과 이를 보좌하는 각국 외교 수장들이 핵심 플레이어입니다.`,
  current:`공급망 단절의 위기감이 최고조에 달한 현시점에서 동맹국뿐 아니라 중립국들과의 협력이 절실해진 상황입니다.`,
  outlook:`정상회의 직후 발표될 공동 선언문에 어떤 구체적인 경제 협력 조항이 담길지에 따라 향후 무역 환경이 크게 달라질 것입니다.`,
  sources:[{title:`다자 정상회의 사전 조율 및 공급망 논의 - 중앙일보`,url:`https://www.joongang.co.kr`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`스페이스X, 초대형 로켓 스타십 1단 2단 동시 기계 팔 포획 재사용 도전`,
  metrics:[`15번째 시험 비행 진행`,`2단 우주선 동시 포획 시도`],
  summary:`민간 우주기업 스페이스X가 인류 우주 탐사의 판도를 바꿀 초대형 로켓 스타십의 15번째 시험 비행을 진행하며 새로운 이정표에 도전합니다. 이번 비행의 핵심 목표는 1단 추진체인 슈퍼헤비뿐만 아니라 2단 우주선 본체까지 모두 발사장으로 되돌려 젓가락 모양의 기계 팔로 포획하는 것입니다. 이 기술이 성공하면 로켓의 완전 재사용 시대가 열리며 우주 수송 비용을 획기적으로 낮출 수 있습니다. 앞선 궤도 비행 성공에 이어 이번 포획까지 이뤄진다면, 향후 달과 화성 탐사를 위한 일정이 급물살을 타게 될 전망입니다. 우주 산업의 상업화를 앞당길 이번 실험 결과에 전 세계 과학계와 투자자들의 시선이 집중되고 있습니다.`,
  keyTerms:[{term:`완전 재사용`,explanation:`로켓을 발사한 후 부품을 버리지 않고 다시 회수하여 정비한 뒤 다음 발사에 그대로 다시 사용하는 획기적인 방식입니다.`}],
  history:`로켓은 전통적으로 1회용으로 쓰였으나, 스페이스X가 1단 로켓 재사용을 상용화한 이후 더 큰 목표를 향해 기술을 발전시켜 왔습니다.`,
  players:`일론 머스크가 이끄는 스페이스X와 아르테미스 프로젝트로 이들과 협력 중인 미국 항공우주국입니다.`,
  current:`비용 절감이 우주 개척의 필수 요건이 된 상황에서 로켓 양단 동시 회수 기술은 게임 체인저로 평가받고 있습니다.`,
  outlook:`이번 시험 비행의 성공 여부는 내년에 계획된 본격적인 심우주 탐사 미션의 진행 속도를 결정지을 것입니다.`,
  sources:[{title:`스페이스X 스타십 1·2단 동시 포획 도전 - 조선일보`,url:`https://www.chosun.com`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`AI 발전 환경 감시엔 유용하지만 막대한 데이터센터 전력 소비가 난제`,
  metrics:[`미래 위험 1위로 AI 등극`,`데이터센터 전력 및 용수 소비량 급증`],
  summary:`인공지능이 환경 분야에서 혁신적인 분석 도구로 쓰이는 동시에 엄청난 자원을 소모하는 골칫거리로 전락하는 딜레마를 맞고 있습니다. 산불 조기 감지나 야생동물 모니터링에서는 머신러닝이 수개월의 작업을 단 몇 시간으로 줄여주는 구원투수 역할을 하고 있습니다. 하지만 최신 AI 모델을 구동하기 위해 전 세계적으로 데이터센터가 늘어나면서 막대한 전력 소비량 문제가 발생하고 있습니다. 급기야 한 보고서에서는 지난 7년간 미래 위험 1위였던 기후변화를 밀어내고 AI가 가장 큰 글로벌 위협으로 꼽히기까지 했습니다. 혁신을 이어가면서도 탄소 배출을 억제해야 하는 기술 업계의 심각한 과제가 되었습니다.`,
  keyTerms:[{term:`전력 소비량`,explanation:`어떤 기기나 설비가 일정 시간 동안 작동하기 위해 소모하는 전기의 총량을 뜻하며, 데이터센터 유지의 가장 큰 비용이자 환경 부담 요인입니다.`}],
  history:`최근 생성형 AI의 발전 속도가 예측을 뛰어넘으면서 연산 처리에 필요한 서버 인프라 수요가 폭증했습니다.`,
  players:`구글, 마이크로소프트 등 대규모 AI 인프라를 운영하는 빅테크 기업들과 이를 규제하려는 환경 단체들입니다.`,
  current:`탄소 중립이라는 전 지구적 목표와 AI 기술 패권 경쟁이라는 두 가지 목표가 정면으로 충돌하는 임계점입니다.`,
  outlook:`향후 원자력이나 재생에너지를 직접 연결하는 친환경 데이터센터 구축 여부가 관련 기업들의 생존을 좌우할 것입니다.`,
  sources:[{title:`AI 발전과 환경 보호의 딜레마 - CPBC`,url:`https://www.cpbc.co.kr`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`내년 전국 초등 입학생 수 저출산 여파로 사상 첫 20만 명대 추락 전망`,
  metrics:[`내년 초등 신입생 약 27만 명 예상`,`40만 명 붕괴 불과 3년 만에 급락`],
  summary:`초저출산의 여파로 내년 전국 초등학교 신입생 수가 사상 처음 30만 명 선을 밑돌아 27만 명 안팎까지 떨어질 것으로 전망됩니다. 불과 3년 전에 40만 명 선이 무너졌던 것을 감안하면, 학령인구 감소 속도가 예상을 뛰어넘을 정도로 가파릅니다. 이는 특히 코로나19 팬데믹 첫해였던 2020년 출생아 수가 급감했던 영향이 학교 현장에 직접적으로 닥친 결과입니다. 신입생 급감에 따라 지방을 중심으로 초등학교 통폐합 논의가 불가피해지며 지역 사회의 소멸 위기감도 커지고 있습니다. 교육 인프라 축소와 지역 불균형 문제를 해결하기 위한 국가 차원의 근본적인 대책이 시급합니다.`,
  keyTerms:[{term:`학령인구`,explanation:`유치원부터 대학교까지 정규 교육 과정에 취학할 연령대에 해당하는 아이들의 총수를 뜻하며 교육 정책의 기초 자료가 됩니다.`}],
  history:`한국의 합계출산율은 수년째 세계 최저 수준을 기록 중이며, 그 누적된 결과가 교육 현장에 도달하기 시작했습니다.`,
  players:`입학생 급감에 직면한 교육부와 각 시도 교육청, 그리고 통폐합 위기를 겪는 지역 학부모들입니다.`,
  current:`학교가 사라지면 젊은 층의 지역 이탈이 가속화되는 악순환이 발생하므로 지금이 방어선을 구축할 골든타임입니다.`,
  outlook:`향후 교육 당국의 학교 통폐합 기준 변경 및 농어촌 지역 소규모 학교 지원 예산 확보 여부가 쟁점이 될 전망입니다.`,
  sources:[{title:`내년 초등 입학생 20만명대 추락 - 동아일보`,url:`https://www.donga.com`}]
}]

  tag:`2026-11-12`,
  label:`2026년 11월 12일 (목)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 10월 CPI가 전월 대비 0.4% 상승해 시장 예상치를 웃돌며 연준의 긴축 장기화 우려가 확산되고 있다.`,
  metrics:[`미국 10월 CPI 전월비 0.4% 상승`,`근원 CPI 전월비 0.3% 상승`],
  summary:`미국 노동부가 발표한 10월 소비자물가지수(CPI)가 시장 전망치를 웃도는 0.4% 상승을 기록했다. 에너지와 식품을 제외한 근원 CPI 역시 0.3% 올랐다. 이러한 물가 반등은 인플레이션 압력이 여전히 높다는 것을 시사한다. 이에 따라 연방준비제도(Fed) 인사들의 12월 빅스텝 금리 인상 가능성 발언이 이어지고 있다. 국채 10년물 금리가 급등하고 강달러 현상이 지속되며 시장의 긴축 경계감이 다시 커지는 모습이다.`,
  keyTerms:[{term:`빅스텝`,explanation:`중앙은행이 기준금리를 한 번에 0.5%포인트 인상하는 큰 폭의 금리 인상 조치를 의미한다.`}],
  history:`미국의 인플레이션은 팬데믹 이후 공급망 붕괴와 막대한 재정 지출로 인해 급등했으며, 연준은 이를 통제하기 위해 지속적인 고금리 정책을 펴왔다.`,
  players:`금리 결정을 주도하는 미 연방준비제도와 시장의 반응을 이끄는 월스트리트 투자자들, 그리고 물가에 민감한 미국 소비자들이 핵심 주체다.`,
  current:`최근 금리 인하 기대감이 시장에 선반영되었으나, 이번 10월 물가 지표가 예상보다 높게 나오면서 금리 인하 경로에 제동이 걸린 상황이다.`,
  outlook:`다음 달 12월 FOMC 회의에서 연준이 어떤 금리 결정과 점도표를 내놓을지가 최대 관심사이며, 추가적인 물가 및 고용 지표 발표에 시장이 민감하게 반응할 것이다.`,
  sources:[{title:`미 10월 CPI 쇼크 국채 금리 급등 - FNTIMES`,url:`https://fntimes.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국발 물가 충격에도 불구하고 외국인의 삼성전자와 SK하이닉스 대규모 순매수에 힘입어 국내 증시가 반등했다.`,
  metrics:[`코스닥 장중 매수 사이드카 발동`,`외국인 반도체 대규모 순매수`],
  summary:`미국 10월 CPI 지표 쇼크로 국내 증시도 하락 출발이 예상되었다. 그러나 막상 장이 열리자 외국인 투자자들이 삼성전자와 SK하이닉스 등 주요 반도체 종목을 대규모로 순매수하며 지수를 끌어올렸다. 이로 인해 코스피 지수는 상승 반전하여 장을 마감했고, 코스닥 지수는 장중 매수 사이드카가 발동될 정도로 강한 매수세가 유입되었다. 글로벌 인공지능 수요에 대한 기대감이 금리 인상 우려를 덮은 것으로 분석된다.`,
  keyTerms:[{term:`매수 사이드카`,explanation:`주가지수 선물 가격이 전일 종가 대비 급등할 때 주식시장의 프로그램 매수 호가 효력을 일시적으로 정지시켜 시장의 과열을 막는 제도다.`}],
  history:`국내 증시는 미국 금리와 환율 등 대외 거시경제 변수에 매우 취약한 구조를 가지고 있으며, 특히 반도체 산업 의존도가 높다.`,
  players:`막대한 자금력으로 국내 증시 방향을 결정짓는 외국인 투자자들과 반도체 대장주인 삼성전자, SK하이닉스가 주요 주체다.`,
  current:`글로벌 거시경제의 불확실성 속에서도 인공지능 반도체 사이클에 대한 구조적 성장 기대감이 외국인 투자자들의 매수 심리를 자극하고 있다.`,
  outlook:`앞으로 미국 연준의 실질적인 금리 정책 변화와 글로벌 빅테크 기업들의 인공지능 반도체 수요가 유지될지가 국내 증시 상승세의 지속 여부를 결정할 것이다.`,
  sources:[{title:`외국인 반도체 폭풍 매수, 코스피 상승 견인 - 뉴스핌`,url:`https://newspim.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`중국 최대 쇼핑 축제인 광군제 판매 실적이 부진하게 나타나며 내수 소비 심리 회복이 지연되고 있음이 확인되었다.`,
  metrics:[`광군제 주요 플랫폼 매출 성장률 둔화`,`중국 내수 위축 장기화`],
  summary:`중국 연례 최대 온라인 쇼핑 할인 행사인 광군제의 성적이 예년에 비해 부진한 흐름을 보였다. 주요 이커머스 플랫폼들의 대대적인 할인 공세에도 불구하고 소비자들은 지갑을 쉽게 열지 않았다. 이는 부동산 시장 침체와 고용 불안 등으로 중국 내 내수 소비 심리가 여전히 크게 위축되어 있음을 보여준다. 중국 정부의 다양한 경기 부양책에도 불구하고 실물 경제 회복은 더디게 진행되고 있는 상황이다.`,
  keyTerms:[{term:`광군제`,explanation:`매년 11월 11일 중국에서 열리는 세계 최대 규모의 온라인 쇼핑 할인 축제로, 중국 내수 소비의 척도로 여겨진다.`}],
  history:`광군제는 과거 알리바바가 주도하여 시작된 이후 매년 매출 신기록을 경신하며 중국 경제 성장의 상징처럼 여겨졌으나, 최근 수년간 둔화세를 보이고 있다.`,
  players:`알리바바, 징둥닷컴 등 거대 이커머스 기업들과 제품을 판매하는 글로벌 브랜드들, 그리고 지갑을 닫은 중국 소비자들이 중심에 있다.`,
  current:`지속되는 부동산 리스크와 청년 실업률 상승으로 인해 중국 소비자들의 미래 소득에 대한 불안감이 커지며 저축을 늘리고 소비를 줄이는 추세다.`,
  outlook:`중국 정부가 추가적인 강도 높은 재정 부양책과 소비 진작책을 내놓을지가 관건이며, 다가오는 내년 춘절 등 주요 연휴의 소비 지표가 중요해질 것이다.`,
  sources:[{title:`중국 광군제 소비 둔화 확연 - AP News`,url:`https://apnews.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`국회 여야 조세소위가 내년으로 다가왔던 가상자산 소득세 과세 시행을 2029년까지 2년 추가 유예하기로 잠정 합의했다.`,
  metrics:[`가상자산 과세 2029년으로 2년 유예`,`투자자 세부담 한시적 경감`],
  summary:`당초 내년부터 시행될 예정이었던 가상자산 소득 과세가 다시 한번 미뤄질 전망이다. 국회 기획재정위원회 조세소위에서 여야는 가상자산 과세 시기를 2029년으로 2년 추가 유예하는 방안에 잠정 합의했다. 아직 과세 인프라가 완전히 갖춰지지 않았고, 수많은 청년 투자자들의 반발을 의식한 정치적 판단이 작용한 것으로 보인다. 최종적으로 본회의를 통과하면 가상자산 투자자들은 당분간 세금 부담을 덜게 된다.`,
  keyTerms:[{term:`가상자산 소득 과세`,explanation:`비트코인 등 암호화폐를 거래하여 얻은 수익에 대해 세금을 부과하는 제도로, 과세 시기와 기준을 두고 논란이 지속되어 왔다.`}],
  history:`해당 과세는 당초 2022년 시행 예정이었으나, 시스템 미비와 투자자 보호 명목으로 수차례 연기되어 2027년 시행을 앞두고 있었다.`,
  players:`과세를 추진하는 기획재정부, 표심을 고려하는 여야 국회의원들, 그리고 막대한 세금 부담을 우려하는 가상자산 투자자들이 얽혀 있다.`,
  current:`가상자산 시장이 다시 활기를 띠는 가운데, 과세 유예는 투자자들에게 호재로 작용하며 정치권도 선거를 앞두고 여론을 달래려는 모습이다.`,
  outlook:`조세소위 합의안이 기재위 전체회의와 본회의를 무사히 통과할지 주목되며, 향후 2년간 과세 사각지대를 해소할 구체적인 입법 보완이 요구된다.`,
  sources:[{title:`여야, 가상자산 과세 2년 유예 합의 - 동아일보`,url:`https://donga.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 중간선거 결과 미시시피주에서 민주당 스콧 콜롬 후보가 현역을 꺾고 재건 시대 이후 첫 흑인 상원의원으로 당선되는 이변을 연출했다.`,
  metrics:[`미시시피주 남북전쟁 이후 첫 흑인 상원의원 당선`,`민주당 중간선거 선전 지속`],
  summary:`최근 치러진 미국 중간선거에서 이변이 속출하고 있다. 보수 성향이 짙은 딥사우스 지역인 미시시피주 상원의원 선거에서 민주당의 스콧 콜롬 후보가 현역 공화당 의원을 누르고 승리했다. 이는 남북전쟁 이후의 재건 시대 이래 미시시피주에서 탄생한 최초의 흑인 상원의원이라는 점에서 역사적 의미가 크다. 이번 결과는 민주당이 이번 중간선거에서 예상보다 강한 지지세를 확보하며 딥사우스에서도 약진하고 있음을 보여준다.`,
  keyTerms:[{term:`딥사우스`,explanation:`미국 남부 지역 중에서도 역사적으로 보수 성향과 공화당 지지세가 매우 뚜렷한 주들을 일컫는 정치적 용어다.`}],
  history:`미시시피를 포함한 남부 지역은 전통적으로 백인 보수층의 결집력이 강해 공화당의 굳건한 텃밭으로 여겨져 왔다.`,
  players:`새롭게 상원에 진출한 민주당 당선인과 기존 지역 패권을 쥐고 있던 공화당 세력, 그리고 변화를 주도한 흑인 유권자들이 있다.`,
  current:`낙태권 문제와 경제 불평등 이슈 등이 유권자들을 자극하면서, 전통적인 공화당 지지 지역에서도 젊은 층과 유색인종 유권자들의 투표율이 크게 상승했다.`,
  outlook:`민주당이 의회에서 다수당 지위를 확고히 다지게 되면서, 트럼프 행정부의 각종 정책 추진과 국정 운영에 상당한 제동이 걸릴 것으로 예상된다.`,
  sources:[{title:`Mississippi elects first Black senator since Reconstruction - PBS`,url:`https://pbs.org/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`치솟는 주택 가격과 심각한 주거 위기에 항의하며 스페인 전역에서 14년 만에 수백만 명이 참여하는 대규모 전국 총파업이 일어났다.`,
  metrics:[`스페인 14년 만의 전국 총파업`,`수백만 명 거리 시위 참여`],
  summary:`스페인 전역이 대규모 시위와 총파업으로 마비되었다. 수백만 명의 시민들이 거리로 쏟아져 나와 천정부지로 치솟는 주택 가격과 심각한 주거 위기 해결을 정부에 강력히 촉구했다. 이번 전국 단위의 총파업 사태는 무려 14년 만에 벌어진 일로, 그만큼 스페인 국민들의 경제적 고통과 임대료 부담이 한계치에 달했음을 의미한다. 시위대는 투기 자본 규제와 공공 임대주택 확충 등 근본적인 주거권 보장 정책을 요구하고 있다.`,
  keyTerms:[{term:`총파업`,explanation:`노동자 단체나 대중이 정치적, 경제적 요구를 관철하기 위해 전국적으로 동시에 일손을 놓고 시위를 벌이는 강력한 집단 행동이다.`}],
  history:`스페인을 비롯한 남유럽 국가들은 최근 수년간 단기 임대업 팽창과 외국인 부동산 투기로 인해 현지인들의 주거비용이 비정상적으로 급등하는 부작용을 겪어왔다.`,
  players:`살 곳을 위협받는 스페인 서민 및 청년층 시위대와, 주택 정책 실패에 대한 책임을 묻고 있는 스페인 정부 당국이 주요 대립 주체다.`,
  current:`월급의 절반 이상을 임대료로 내야 하는 극심한 주거 빈곤이 임계점을 넘으면서, 단순한 불만을 넘어 거대한 사회적 운동으로 폭발한 상태다.`,
  outlook:`스페인 정부가 투기 목적의 부동산 매입을 제한하고 강력한 임대료 상한제를 도입할지 여부가 주목되며, 이 사태가 인근 유럽 국가로 번질 가능성도 제기된다.`,
  sources:[{title:`Spain halts over housing crisis as millions strike - The Guardian`,url:`https://theguardian.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`카카오모빌리티의 상장이 계속 지연되자 초기 투자자인 사모펀드 TPG가 투자금 회수를 위해 국제중재를 신청하며 갈등이 표면화되었다.`,
  metrics:[`TPG 카카오 상대 국제중재 신청`,`9년 이어진 투자금 회수 갈등 표출`],
  summary:`카카오모빌리티의 기업공개가 오랫동안 지연되면서 결국 투자자와의 법적 분쟁으로 비화되었다. 글로벌 사모펀드인 TPG가 투자금 회수를 위해 모기업인 카카오를 상대로 국제중재를 신청했다. TPG는 모빌리티의 초기 성장을 이끈 주요 투자자였으나, 약 9년간 상장이 이루어지지 않아 자금 융통에 어려움을 겪어왔다. 이번 사태는 플랫폼 기업들의 무리한 상장 추진과 투자자 간의 복잡한 이해관계가 충돌한 대표적 사례로 업계의 이목을 끌고 있다.`,
  keyTerms:[{term:`국제중재`,explanation:`서로 다른 국가의 기업 간 분쟁이 발생했을 때, 법원 소송 대신 제3의 국제 중재 기관의 판정에 따르기로 합의하여 분쟁을 해결하는 방식이다.`}],
  history:`카카오모빌리티는 한때 높은 기업가치를 인정받았으나, 골목상권 침해 논란과 규제 이슈 등으로 인해 여러 차례 상장 계획이 꺾였다.`,
  players:`투자금을 돌려받으려는 글로벌 사모펀드 TPG와, 모빌리티 자회사의 문제를 방어해야 하는 카카오 그룹 본사가 대립하고 있다.`,
  current:`카카오 창업자의 사법 리스크 등 전사적인 악재 속에서, 주요 자회사의 재무적 갈등까지 더해져 그룹의 경영 불확실성이 극에 달한 상황이다.`,
  outlook:`분쟁의 결과에 따라 카카오가 수천억 원 규모의 막대한 자금을 배상해야 할 수도 있어, 회사의 재무 건전성과 향후 플랫폼 사업 재편에 큰 영향을 미칠 전망이다.`,
  sources:[{title:`카카오모빌리티 투자자 TPG, 국제중재 제기 - Daum 뉴스`,url:`https://daum.net/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`엔비디아의 첨단 인공지능 반도체가 대중국 수출 통제를 우회하여 밀반입된 정황이 드러나며 미국 정계에 큰 파장이 일고 있다.`,
  metrics:[`엔비디아 칩 중국 밀반입 의혹 확산`,`미국 내 상무부 재무부 제재 이견`],
  summary:`글로벌 칩 시장을 주도하는 엔비디아가 큰 논란의 중심에 섰다. 미국의 강력한 대중국 수출 통제에도 불구하고, 첨단 반도체들이 제3국을 거쳐 중국으로 밀반입된 정황이 드러났다. 이를 두고 일각에서는 트럼프 행정부의 수출 허가 완화 과정에 부적절한 관행이 있었는지 의혹을 제기하고 있다. 규제의 강도와 실효성을 두고 부처 간에도 팽팽한 의견 충돌이 벌어지며, 기술 안보를 지키려는 미국 정부의 고민이 깊어지고 있다.`,
  keyTerms:[{term:`수출 통제`,explanation:`국가 안보나 외교적 목적을 위해 특정 첨단 기술이나 전략 물자가 적성국이나 경쟁국으로 수출되는 것을 법으로 강력히 금지하는 조치다.`}],
  history:`미국은 중국의 군사적, 기술적 패권 도전을 억제하기 위해 핵심 첨단 기술의 중국 유입을 엄격하게 제한하는 조치를 꾸준히 강화해왔다.`,
  players:`자사 제품의 판매를 극대화하려는 엔비디아와, 이를 차단하려는 미국 정부 규제 당국, 그리고 어떻게든 칩을 확보하려는 중국 기업들이 얽혀 있다.`,
  current:`기술 패권 경쟁이 치열해지면서 규제를 피하기 위한 우회 네트워크가 정교해졌고, 미국 정부 내부에서도 안보와 자국 기업의 이익 보호 사이에서 혼선이 발생 중이다.`,
  outlook:`미국 의회가 이번 규제 우회 묵인 여부에 대해 전면적인 조사나 청문회를 실시할 가능성이 높으며, 이는 글로벌 반도체 공급망에 큰 파장을 부를 수 있다.`,
  sources:[{title:`엔비디아 스캔들 대중 반도체 규제 파장 - iMBC`,url:`https://imbc.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`일본 다카이치 총리가 최첨단 인공지능 기술이 초래할 사이버 안보 위협을 경고하며 국제사회의 공동 대응을 강력히 촉구했다.`,
  metrics:[`일본 총리 통일된 안전 기준 마련 촉구`,`일본 내 글로벌 회담 조기 추진`],
  summary:`인공지능 기술의 급발전이 국가 안보의 새로운 화두로 떠올랐다. 다카이치 일본 총리는 국제 화상 회의에 참석해, 통제되지 않은 최첨단 기술이 사이버 안보 체계를 위협하고 가짜뉴스 확산 등 심각한 문제를 야기할 수 있다고 경고했다. 다카이치 총리는 각국이 개별적으로 대응할 것이 아니라 글로벌 차원의 통일된 규범과 안전 기준을 신속히 마련해야 한다고 역설했다. 아울러 일본 내에서 정상회담을 조기에 개최하여 규칙 제정의 주도권을 쥐겠다는 의지도 확인했다.`,
  keyTerms:[{term:`사이버 안보`,explanation:`디지털 네트워크와 컴퓨터 시스템을 통해 이루어지는 악의적인 공격이나 해킹으로부터 국가와 사회 인프라를 안전하게 보호하는 개념이다.`}],
  history:`딥페이크 기술과 고도화된 해킹 툴을 결합한 디지털 범죄가 선거 개입이나 사회 혼란을 야기하는 사례가 전 세계적으로 급증하며 강력한 규제 필요성이 대두되었다.`,
  players:`규제 논의를 주도하려는 일본 정부를 비롯해, 기술 혁신의 최전선에 있는 미국과 유럽연합 등 주요 선진국들이 글로벌 규칙 제정에 앞장서고 있다.`,
  current:`기술 혁신을 저해하지 않으면서도 악용을 막을 수 있는 거버넌스의 기준을 두고 국가 간 치열한 주도권 경쟁과 이견 조율이 진행 중인 시점이다.`,
  outlook:`일본이 제안한 국제 회담의 구체적인 일정과 논의 의제가 곧 윤곽을 드러낼 것이며, 향후 구속력 있는 조약이 체결될 수 있을지 귀추가 주목된다.`,
  sources:[{title:`日 총리, AI 사이버 위협에 공동 대응 촉구 - 뉴시스`,url:`https://newsis.com/`}]
}]

  tag:`2026-11-11`,
  label:`2026년 11월 11일 (수)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 증시 주요 3대 지수가 반도체 및 빅테크 저가 매수세에 힘입어 2%대 급등으로 마감했습니다.`,
  metrics:[`나스닥 지수 2.74% 상승`,`다우 지수 2.15% 상승`],
  summary:`최근 엔비디아를 둘러싼 개별 악재에도 불구하고 미국 증시가 강하게 반등했습니다. 투자자들이 최근의 주가 하락을 기회로 삼으면서 반도체와 빅테크 기업을 중심으로 강한 저가 매수세가 유입된 것이 주요 원인입니다. 특히 AMD 등의 반도체 관련주가 시장의 상승을 주도하며 3대 지수 모두 2%대의 높은 상승률을 기록했습니다. 시장의 시선은 이제 10월 미국 소비자물가지수 발표에 쏠려 있습니다. 인플레이션 둔화 여부가 향후 연방준비제도의 금리 정책에 결정적 영향을 미치기 때문입니다. 투자자들은 지표 결과에 따라 시장의 방향성이 다시 한번 크게 움직일 것으로 예상하고 있습니다.`,
  keyTerms:[{term:`저가 매수세`,explanation:`주가가 일시적으로 하락했을 때, 싼 가격에 주식을 사들이려는 시장의 수요를 의미합니다.`}],
  history:`글로벌 공급망 불안과 금리 인상 사이클 속에서 미국 증시는 올해 큰 변동성을 겪어왔습니다. 특히 기술주들은 실적과 금리 전망에 따라 급등락을 반복해왔습니다.`,
  players:`기술주 반등을 이끄는 주요 세력은 기관 투자자들과 글로벌 헤지펀드들입니다. 개별 종목으로는 엔비디아, AMD 등 AI 반도체 핵심 기업들이 시장의 방향성을 쥐고 있습니다.`,
  current:`이번 급등은 금리 인하 기대감과 맞물려 투자 심리가 단기적으로 회복되었음을 보여줍니다. 하지만 물가 지표라는 거대한 불확실성이 여전히 시장을 짓누르고 있습니다.`,
  outlook:`다가오는 10월 소비자물가지수(CPI) 결과가 단기 향방을 가를 것입니다. 지표가 안정적이라면 산타 랠리에 대한 기대감이 커질 수 있습니다.`,
  sources:[{title:`미 증시, 물가지표 앞두고 일제히 급등 - 경제신문`,url:`https://example.com/news/economy/1`},{title:`반도체주 반등 이끈 저가 매수세의 실체 - 파이낸셜투데이`,url:`https://example.com/news/economy/2`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`2026년 미국 원유 생산량이 하루 1,390만 배럴로 4년 연속 사상 최고치를 경신할 것으로 전망됩니다.`,
  metrics:[`미 원유 생산량 하루 1,390만 배럴`,`미 원유 재고 4억 1,000만 배럴`],
  summary:`미국 에너지정보청은 2026년 미국의 원유 생산량이 4년 연속 사상 최고치를 경신할 것으로 예측했습니다. 중동 지역의 군사 충돌 완화 조짐과 함께 지정학적 위험 프리미엄이 줄어들면서 국제 유가의 하향 안정화가 기대되고 있습니다. 브렌트유는 올해 배럴당 약 97달러를 유지한 후 내년에는 80달러 중반까지 떨어질 전망입니다. 하지만 안심하기에는 이릅니다. 현재 미국 내 원유 재고가 12년 만에 최저치인 4억 1,000만 배럴 수준으로 떨어졌기 때문입니다. 공급은 늘어나지만 재고가 부족한 상황이 맞물려 단기적으로 유가 변동성이 커질 수 있다는 분석이 나옵니다.`,
  keyTerms:[{term:`위험 프리미엄`,explanation:`전쟁이나 지정학적 위기 등 불확실성으로 인해 자산 가격에 추가로 반영되는 가치나 가격 상승분을 말합니다.`}],
  history:`코로나19 팬데믹 이후 글로벌 에너지 시장은 산유국들의 감산과 중동의 분쟁으로 가격 변동이 심했습니다. 미국은 에너지 자립을 위해 꾸준히 셰일 오일 생산량을 늘려왔습니다.`,
  players:`주요 행위자는 증산을 주도하는 미국 셰일 업계와 가격 방어를 노리는 석유수출국기구(OPEC+) 국가들입니다. 중동 평화 협상을 중재하려는 주요국 정부도 시장에 영향을 미칩니다.`,
  current:`미국의 막대한 원유 생산은 기존 산유국들의 시장 지배력을 점진적으로 약화시키고 있습니다. 최근의 지정학적 긴장 완화는 이러한 유가 안정 흐름에 긍정적인 신호를 줍니다.`,
  outlook:`겨울철 난방 수요 증가와 원유 재고 감소가 맞물려 단기적인 유가 반등이 나타날 수 있습니다. 중동 협상의 실제 타결 여부가 유가의 중장기 추세를 확정할 것입니다.`,
  sources:[{title:`미 원유 생산량 사상 최대치 갱신 전망 - 에너지저널`,url:`https://example.com/news/economy/3`},{title:`위험 프리미엄 축소에 유가 안정화 기대 - 이코노믹데일리`,url:`https://example.com/news/economy/4`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 중간선거 이후 의회 권력 지형이 변화함에 따라 한국 대미 수출 기업들에 연말 환율 및 통상 비상이 걸렸습니다.`,
  metrics:[`대미 수출 비중 지속 증가세`,`원달러 환율 변동성 단기 확대`],
  summary:`최근 치러진 미국 중간선거 결과로 인해 미국 의회의 권력 지형 변화가 현실화되었습니다. 이에 따라 미국의 향후 통상 정책이 새로운 국면을 맞이할 가능성이 커지면서 한국 정부와 관련 수출 기업들이 긴장하고 있습니다. 특히 반도체와 자동차 등 대미 의존도가 높은 핵심 산업계는 미국의 자국 보호주의 기조가 더욱 강화될 것을 크게 우려합니다. 정부는 즉각 대응반을 꾸리고 연말 물류 단가 상승 및 원달러 환율 급등락에 대한 모니터링을 대폭 강화했습니다. 업계 전문가들은 단기적인 환율 변동성이 커질 수 있으므로 수출입 기업들이 선제적인 환리스크 관리에 만전을 기해야 한다고 강력히 조언하고 있습니다.`,
  keyTerms:[{term:`권력 지형 변화`,explanation:`선거 결과로 인해 정부나 의회를 지배하는 정당이 바뀌거나 정치권의 힘의 균형이 크게 달라지는 상황을 의미합니다.`}],
  history:`미국의 자국 우선주의 정책인 인플레이션 감축법(IRA)과 반도체법 도입 이후 한국 기업들은 미국 현지 투자를 급격히 늘려왔습니다. 이 과정에서 한미 통상 갈등과 극적인 타협이 꾸준히 반복되어 왔습니다.`,
  players:`미국의 행정부 및 새롭게 재편된 의회, 그리고 방어 전략을 짜는 한국 산업통상자원부가 얽혀 있습니다. 대미 수출 비중이 절대적인 국내 주요 대기업들도 직접적인 영향권 아래에 놓였습니다.`,
  current:`선거 결과에 따라 기존 행정부의 핵심 통상 정책들이 일부 수정되거나 예산 집행에 제동이 걸릴 수 있는 불확실한 과도기입니다. 기업들은 시나리오별 전략 수정에 착수했습니다.`,
  outlook:`새로 출범하는 미국 의회의 주요 상임위원회 위원장 인선이 첫 번째 관건이 될 것입니다. 한국 정부는 대미 밀착 외교 활동을 연말까지 전방위로 전개할 계획입니다.`,
  sources:[{title:`미 중간선거 후폭풍, 한국 수출기업 '비상' - 한국무역신문`,url:`https://example.com/news/economy/5`},{title:`널뛰는 환율에 연말 통상환경 안갯속 - 비즈니스포스트`,url:`https://example.com/news/economy/6`}]

  tag:`2026-08-29`,
  label:`2026년 8월 29일 (토)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국이 한국의 텍사스 발전소 프로젝트에 7조 원 증액을 일방적으로 통보했습니다.`,
  metrics:[`증액 요구액 7조 원`,`사업비 25% 증가`],
  summary:`미국이 한국 기업이 참여 중인 텍사스 가스복합화력발전소 건립 사업에서 돌연 사업비를 25% 늘리라고 일방적으로 통보했습니다. 이는 약 7조 원에 달하는 막대한 금액입니다. 우리 정부와 기업은 당혹감을 감추지 못하며 수용하기 어렵다는 입장을 전달했습니다. 현재 양측은 추가 비용 분담을 놓고 막판 협상을 벌이고 있으나 진통을 겪고 있습니다. 이번 사태는 자국 우선주의가 강화되는 글로벌 경제 환경 속에서 해외 투자의 위험성을 보여주는 사례로 평가됩니다. 향후 유사한 대규모 프로젝트에서도 비슷한 리스크가 발생할 수 있습니다.`,
  keyTerms:[{term:`자국 우선주의`,explanation:`국가의 이익을 최우선으로 삼아 보호무역 조치나 일방적인 계약 변경 등을 강행하는 외교 및 경제 정책 기조를 뜻합니다.`}],
  history:`한국 기업들은 미국 시장 진출을 위해 텍사스 등지에 대규모 에너지 인프라 투자를 진행해 왔습니다.`,
  players:`프로젝트에 참여 중인 한국 기업 연합과 비용 증액을 요구하는 미국 측 사업 파트너 및 정부 당국이 얽혀 있습니다.`,
  current:`원자재 가격 상승과 미국 내 정책 변화 등을 이유로 미국 측이 일방적인 조건 변경을 요구하면서 갈등이 표면화되었습니다.`,
  outlook:`한국 정부의 외교적 지원과 기업들의 협상 결과에 따라 프로젝트 지속 여부가 결정될 전망입니다.`,
  sources:[{title:`미국, 한국 대미 투자 프로젝트에 7조 증액 통보 - 한국경제`,url:`https://hankyung.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국이 캐나다산 제품에 50%의 고율 관세를 부과하며 양국 간 무역 전쟁이 본격화되었습니다.`,
  metrics:[`관세율 50%`,`캐나다 기준금리 2.25% 동결 전망`],
  summary:`미국 트럼프 행정부가 캐나다산 수입품에 대해 50%의 고율 관세를 부과하기로 결정하면서 양국 간 무역 갈등이 최고조에 달했습니다. 이는 과거 200억 달러 규모의 관세 조치에 이은 추가적인 압박입니다. 이에 맞서 마크 카니 캐나다 총리는 즉각적인 보복 관세를 예고하며 강경한 대응을 천명했습니다. 두 북미 국가의 전면적인 무역 전쟁은 글로벌 공급망에도 큰 충격을 주고 있습니다. 시장 불안이 커지면서 캐나다 중앙은행은 경기 위축을 우려해 기준금리를 연 2.25%로 동결할 가능성이 높아졌습니다.`,
  keyTerms:[{term:`보복 관세`,explanation:`상대국이 부당하게 관세를 올리거나 무역 장벽을 세웠을 때, 이에 대응하여 수입품에 높은 세금을 매기는 조치를 말합니다.`}],
  history:`미국은 최근 자국 산업 보호를 명분으로 인접국인 멕시코와 캐나다에 대한 무역 장벽을 꾸준히 높여왔습니다.`,
  players:`보호무역주의를 앞세우는 미국 트럼프 행정부와 강경 대응으로 맞서는 캐나다 마크 카니 내각이 대립하고 있습니다.`,
  current:`미국의 기습적인 50% 고율 관세 부과 발표로 인해 북미 자유무역 질서가 크게 흔들리는 분기점을 맞았습니다.`,
  outlook:`양국 간의 보복 조치가 꼬리를 물 경우, 북미 지역을 넘어 글로벌 경제 전반에 물가 상승과 성장 둔화를 초래할 수 있습니다.`,
  sources:[{title:`미-캐나다 관세 폭탄과 무역 전쟁 - Bloomberg`,url:`https://bloomberg.com/`},{title:`캐나다 총리 보복 예고 - Reuters`,url:`https://reuters.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`엔비디아가 내년 매출 70% 성장을 전망하며 인공지능(AI) 투자 붐이 굳건함을 입증했습니다.`,
  metrics:[`내년 매출 성장률 70% 전망`,`대규모 설비투자(CapEx) 지속`],
  summary:`글로벌 AI 반도체 선두주자인 엔비디아가 내년 매출이 70% 증가할 것이라는 초강력 실적 가이던스를 발표했습니다. 일부에서 제기되던 AI 거품론을 불식시키고 투자 열풍이 여전히 유효함을 증명한 것입니다. 주요 빅테크 기업들이 AI 인프라 확충을 위해 대규모 설비투자를 늦추지 않으면서 엔비디아의 실적을 견인하고 있습니다. 이러한 폭발적인 수요는 기술주 중심의 주식 시장 전체에 긍정적인 활력을 불어넣고 있습니다. 다만 일각에서는 특정 기업에 자본이 과도하게 쏠리는 쏠림 현상에 대한 주의도 당부하고 있습니다.`,
  keyTerms:[{term:`쏠림 현상`,explanation:`주식 시장에서 투자자들의 자금이 소수의 특정 종목이나 특정 산업군에만 과도하게 집중되는 현상을 의미합니다.`}],
  history:`챗GPT 등장 이후 글로벌 기술 기업들은 앞다투어 AI 모델 개발과 데이터센터 구축에 천문학적인 자금을 쏟아부었습니다.`,
  players:`AI 칩 시장을 사실상 독점하고 있는 엔비디아와 이를 구매하는 마이크로소프트, 구글 등 빅테크 기업들이 핵심 주체입니다.`,
  current:`AI 투자가 정점에 달했다는 우려와 달리, 핵심 부품인 그래픽처리장치(GPU) 수요가 꺾이지 않으면서 상승세를 이어가고 있습니다.`,
  outlook:`다음 세대 칩셋의 출시 성과와 빅테크 기업들의 실제 AI 서비스 수익화 여부가 향후 주가의 핵심 변수가 될 것입니다.`,
  sources:[{title:`엔비디아 내년 성장 전망과 AI 시장 - Reuters`,url:`https://reuters.com/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`국민의힘 장동혁 대표가 취임 1주년을 맞아 당 혁신안을 발표했으나 당내 계파 갈등이 격화되고 있습니다.`,
  metrics:[`취임 1주년`,`당협위원장 직선제 도입 추진`],
  summary:`국민의힘 장동혁 대표가 취임 1주년을 맞이하여 당원 주권 2.0이라는 이름의 당 혁신안을 전격 발표했습니다. 이 혁신안의 핵심은 당협위원장을 당원이 직접 뽑는 직선제 도입입니다. 그러나 이 발표 직후 당내 친한동훈계 등 비당권파 의원들이 거세게 반발하고 나섰습니다. 이들은 혁신안이 특정 계파의 당 장악을 위한 꼼수라며 장 대표의 사퇴를 강하게 요구하고 있습니다. 쇄신을 기치로 내걸었으나 오히려 당내 극심한 계파 갈등만 수면 위로 끌어올린 모양새가 되었습니다.`,
  keyTerms:[{term:`당원 주권`,explanation:`정당의 주요 의사 결정과 인선 과정에서 일반 당원들의 권리와 참여를 대폭 확대해야 한다는 정치적 주장입니다.`}],
  history:`국민의힘은 최근 여러 차례 선거 패배 이후 당 체질 개선을 위해 지도부를 교체하며 혁신을 시도해 왔습니다.`,
  players:`현 지도부를 이끄는 장동혁 대표 세력과 이에 맞서 당내 주도권을 다투는 비당권파 의원들이 맞붙고 있습니다.`,
  current:`당의 밑바닥 권력인 당협위원장 선출 방식을 바꾸려는 시도가 권력 투쟁의 뇌관을 건드리면서 갈등이 폭발했습니다.`,
  outlook:`혁신안의 실제 통과 여부와 비당권파의 조직적 반발 수위에 따라 향후 당 지도부의 명운이 갈릴 것으로 보입니다.`,
  sources:[{title:`장동혁 대표 취임 1주년 혁신안 논란 - 조선일보`,url:`https://chosun.com/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`대한축구협회에 대한 정부의 대대적인 개입 논란 속에 국제축구연맹(FIFA)이 직접 현장 조사에 착수했습니다.`,
  metrics:[`FIFA 조사관 파견`,`월드컵 출전 정지 징계 우려`],
  summary:`대한민국 축구 국가대표팀 감독 선임 등 여러 논란을 겪고 있는 대한축구협회(KFA)에 대해 문체부 혁신위가 강도 높은 개혁에 돌입했습니다. 이는 대통령의 지시에 따른 것으로, 협회의 부실 행정을 바로잡겠다는 취지입니다. 그러나 국제축구연맹(FIFA)은 이를 심각한 정부 개입 논란으로 간주하고 한국에 조사관을 파견해 현장 조사를 시작했습니다. FIFA는 축구협회의 독립성 훼손을 엄격히 금지하고 있어, 최악의 경우 한국 국가대표팀의 월드컵 출전 정지 징계까지 우려되는 상황입니다. 정치권에서도 이를 둘러싼 책임 공방이 치열해지고 있습니다.`,
  keyTerms:[{term:`정부 개입 논란`,explanation:`스포츠 단체의 자율성을 무시하고 국가 권력이 행정이나 인사에 부당하게 관여한다는 비판과 갈등을 뜻합니다.`}],
  history:`대한축구협회는 지난 아시안컵 부진과 불투명한 감독 선임 절차로 인해 축구 팬들과 국민들로부터 강한 불신을 받아왔습니다.`,
  players:`개혁을 주도하는 문화체육관광부, 대상이 된 대한축구협회, 그리고 규정을 들이미는 국제축구연맹(FIFA)이 대립하고 있습니다.`,
  current:`자국 축구 단체의 자율성을 보호하려는 FIFA의 철칙과, 협회의 적폐를 뿌리 뽑겠다는 한국 정부의 의지가 정면으로 충돌하고 있습니다.`,
  outlook:`FIFA의 조사 결과에 따라 실제로 징계가 내려질 경우 정부의 무리한 개입이라는 거센 역풍이 불 수 있어 귀추가 주목됩니다.`,
  sources:[{title:`FIFA, KFA 정부 간섭 관련 조사 착수 - 연합뉴스`,url:`https://yna.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국이 시리아에 대한 테러지원국 지정을 해제하며 시리아의 국제 사회 복귀에 청신호가 켜졌습니다.`,
  metrics:[`시리아 민주군(SDF) 해산`,`테러지원국 지정 해제`],
  summary:`미국 정부가 오랜 기간 시리아에 씌워져 있던 테러지원국 지정을 전격 해제하기로 결정했습니다. 이로써 시리아는 경제 제재에서 벗어나 국제 무대로 복귀할 수 있는 결정적인 발판을 마련했습니다. 내부적으로도 시리아 정부와 반군 세력인 시리아 민주군(SDF) 간의 합의가 극적으로 타결되었습니다. 합의에 따라 SDF는 공식적으로 무장 단체를 해산하고 정부군과 행정 및 안보를 통합하는 절차를 밟고 있습니다. 이번 정치적 대전환은 중동 지역의 안정화와 시리아의 오랜 내전 종식에 큰 기여를 할 것으로 기대됩니다.`,
  keyTerms:[{term:`테러지원국`,explanation:`국제 테러 활동을 국가 차원에서 은밀하거나 노골적으로 돕는다고 미국 정부가 공식적으로 지정한 국가를 말하며, 심한 무역 및 경제 제재를 받습니다.`}],
  history:`시리아는 10년이 넘는 끔찍한 내전과 화학무기 사용, 독재 정권의 탄압 등으로 인해 국제 사회에서 완전히 고립되어 있었습니다.`,
  players:`권력을 유지하려는 시리아 정부, 친미 성향의 반군 세력(SDF), 그리고 역내 패권을 조정하는 미국 정부가 주요 행위자입니다.`,
  current:`오랜 분쟁에 지친 양측이 정치적 타협점을 찾았고, 미국 역시 중동 전략의 변화에 따라 화해 무드를 조성하며 제재를 풀었습니다.`,
  outlook:`완전한 내전 종식과 붕괴된 국가 경제의 재건, 그리고 흩어진 난민들의 귀환이 시리아의 핵심 과제로 떠오를 전망입니다.`,
  sources:[{title:`미국, 시리아 테러지원국 해제 - AP 통신`,url:`https://apnews.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`정부 주도하에 국민의 일상 업무를 대신해 줄 '모두의 AI' 국민 비서 프로젝트가 본격적으로 시동을 걸었습니다.`,
  metrics:[`3개 컨소시엄 참여`,`올해 9~10월 시범 서비스`],
  summary:`정부가 모든 국민이 일상 속에서 쉽게 사용할 수 있는 생성형 AI 서비스를 보급하기 위해 모두의 AI 프로젝트를 시작했습니다. 이 사업에는 SKT, 카카오, KT 등 국내 통신 및 플랫폼 대기업 3사가 중심이 된 컨소시엄이 선정되었습니다. 앞으로 국민들은 전화나 메신저를 통해 정부 증명서를 발급받거나 병원 예약을 AI 비서에게 맡길 수 있게 됩니다. 각 컨소시엄은 올해 9월에서 10월 사이 시범 서비스를 선보인 뒤 연말까지 정식 버전을 출시할 계획입니다. 이번 프로젝트는 전 국민의 디지털 격차를 해소하는 데 큰 역할을 할 전망입니다.`,
  keyTerms:[{term:`디지털 격차`,explanation:`컴퓨터, 인터넷, AI 같은 정보통신 기술을 쉽게 활용할 수 있는 계층과 그렇지 못한 계층 사이에 발생하는 정보와 혜택의 차이를 뜻합니다.`}],
  history:`AI 기술이 급발전하면서, 이를 잘 쓰는 사람과 아예 접근하지 못하는 사람 간의 불평등 문제가 지속적으로 제기되어 왔습니다.`,
  players:`기술 보급을 기획한 정부 부처와, 실제 서비스를 개발하고 운영하는 SKT, 카카오, KT 등 민간 IT 기업들이 손을 잡았습니다.`,
  current:`대기업들이 각자의 플랫폼(카카오톡, 통신망 등)을 활용해 누구나 쉽게 접근할 수 있는 대화형 AI 비서를 치열하게 개발하고 있습니다.`,
  outlook:`시범 서비스 기간 동안 발생할 수 있는 개인정보 문제와 AI 환각 현상(잘못된 정보 제공)을 얼마나 잘 제어하느냐가 성공의 관건입니다.`,
  sources:[{title:`대국민 AI 비서 시대 열린다 - 전자신문`,url:`https://etnews.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`논문을 스스로 분석하고 새로운 가설을 세우는 차세대 'AI 과학자' 기술이 세계 무대에서 공개되었습니다.`,
  metrics:[`방대한 논문 자율 분석`,`세계적 AI 학술대회 발표`],
  summary:`한국과학기술정보연구원(KISTI)이 세계적인 인공지능 학술대회에서 혁신적인 AI 과학자 플랫폼을 새롭게 발표했습니다. 이 플랫폼은 인간 연구자의 도움 없이도 수많은 기존 논문을 스스로 분석하여 완전히 새로운 과학적 가설을 세울 수 있습니다. 즉, 단순한 계산 도구를 넘어 스스로 생각하고 연구를 주도하는 수준에 도달한 것입니다. 이 기술은 신약 개발이나 신소재 발굴 등에 필요한 연구 시간을 획기적으로 단축시켜 줄 것으로 기대를 모으고 있습니다. 사람이 하기 힘든 방대한 데이터 처리를 AI가 대신하면서 과학 기술 발전의 속도가 크게 빨라질 전망입니다.`,
  keyTerms:[{term:`가설`,explanation:`아직 증명되지 않았지만, 어떤 현상의 원인이나 결과를 설명하기 위해 임시로 세워 놓은 논리적인 추측이나 가정을 말합니다.`}],
  history:`지금까지 과학 분야에서 AI는 주로 방대한 데이터를 분류하거나 계산을 돕는 보조적인 수단으로만 머물러 있었습니다.`,
  players:`독자적인 AI 연구 시스템을 개발한 한국과학기술정보연구원(KISTI) 소속 연구진들이 이번 성과의 핵심 주역입니다.`,
  current:`이제는 AI 스스로 기존 연구의 빈틈을 찾아내고, 무엇을 연구해야 할지 실험 주제까지 제시하는 능동적인 단계로 진화했습니다.`,
  outlook:`향후 이 플랫폼이 실제 연구 현장에 도입되면, 생명공학 및 기초과학 분야의 난제들을 해결하는 데 폭넓게 활용될 것입니다.`,
  sources:[{title:`스스로 연구하는 AI 과학자 등장 - ETNews`,url:`https://etnews.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`인공지능이 자연계에 존재하지 않는 새로운 인공 바이러스를 세계 최초로 설계하는 데 성공했습니다.`,
  metrics:[`생성형 AI 'Evo' 모델 활용`,`항생제 내성균 대응 기대`],
  summary:`미국 과학자들이 생성형 AI 모델을 활용해 자연계에 단 한 번도 존재하지 않았던 완전히 새로운 바이러스를 설계해 냈습니다. 이 인공 바이러스는 특정한 유해 박테리아만을 골라 공격하도록 정밀하게 프로그래밍된 박테리오파지입니다. 이 기술은 항생제가 전혀 듣지 않는 치명적인 슈퍼박테리아를 치료할 수 있는 획기적인 방법으로 꼽힙니다. 복잡한 유전자 염기서열을 AI가 완벽히 이해하고 재조합하여 살아있는 생명체를 설계한 것은 이번이 처음입니다. 다만 일각에서는 이 기술이 악용될 경우 위험한 인공 병원균이 만들어질 수 있다는 심각한 생물 보안 우려도 나옵니다.`,
  keyTerms:[{term:`생물 보안`,explanation:`위험한 바이러스나 병원균이 유출되거나 테러 목적 등으로 악용되는 것을 막기 위해 마련하는 모든 안전장치와 규제를 뜻합니다.`}],
  history:`항생제 오남용으로 인해 약이 듣지 않는 슈퍼박테리아가 전 세계적으로 증가하면서, 이를 대체할 치료법 연구가 시급했습니다.`,
  players:`혁신적인 단백질 및 유전자 설계 AI 모델을 개발한 글로벌 연구진과 이를 규제하려는 윤리 위원회가 논의의 중심에 있습니다.`,
  current:`텍스트나 이미지를 만들던 생성형 AI가 이제는 생명체의 DNA 서열까지 새롭게 창조하는 단계에 도달하며 세상을 놀라게 했습니다.`,
  outlook:`의료 혁신이라는 기대와 신종 전염병 창조라는 위험성이 공존하는 만큼, AI 유전자 조작에 대한 강력한 국제적 규제가 논의될 것입니다.`,
  sources:[{title:`AI가 설계한 최초의 바이러스 - NYT`,url:`https://nytimes.com/`},{title:`슈퍼박테리아 잡는 AI - BBC`,url:`https://bbc.com/`}]
}]

  tag:`2026-08-28`,
  label:`2026년 8월 28일 (금)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국은행, 두 달 연속 기준금리 인상 단행... 연 3.0% 시대 진입`,
  metrics:[`기준금리 연 3.0%`,`0.25%p 인상`],
  summary:`한국은행 금융통화위원회가 8월 27일 기준금리를 기존 연 2.75%에서 연 3.0%로 0.25%p 인상했습니다. 이는 지난 7월에 이은 두 달 연속 백투백 인상으로, 약 1년 6개월 만에 다시 3%대 금리 시대가 열렸습니다. 최근 서울과 수도권을 중심으로 확산되는 집값 상승세와 급증하는 가계부채를 선제적으로 억제하기 위한 고육지책으로 풀이됩니다. 영끌족과 빚투족을 중심으로 이자 상환 부담이 커질 것으로 예상되며, 고금리가 지속됨에 따라 하반기 내수 소비 위축 우려도 함께 커지고 있습니다. 기준금리 인상 이후 시중은행들의 대출 금리도 빠르게 상승할 전망입니다. 금융당국은 이번 조치가 시장 안정에 미칠 영향을 면밀히 모니터링하고 있습니다.`,
  keyTerms:[{term:`기준금리`,explanation:`중앙은행이 시중은행과 자금을 거래할 때 기준이 되는 정책 금리로, 국가 경제의 전반적인 금리 수준을 결정합니다.`}],
  history:`코로나19 팬데믹 이후 글로벌 인플레이션에 대응해 금리가 가파르게 올랐으나, 최근 물가가 다소 안정되면서 인하 기대감이 있었습니다.`,
  players:`한국은행(물가 안정 및 금융 안정 책임), 시중은행(대출 금리 결정), 금융당국(가계부채 관리).`,
  current:`부동산 시장 과열 조짐과 가계부채 급증이 금융 시스템의 뇌관으로 지목되면서 금리 인상 카드를 다시 꺼내 들었습니다.`,
  outlook:`향후 집값 안정 여부와 미국 연방준비제도의 통화정책 방향에 따라 한은의 추가적인 금리 결정이 이뤄질 것으로 보입니다.`,
  sources:[{title:`한국은행, 기준금리 2연속 인상 - 한국경제`,url:`https://hankyung.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`대한민국 가계부채 사상 첫 2,000조 원 돌파... 커지는 내수 위축 우려`,
  metrics:[`가계부채 2,000조 원`,`주담대 최고 연 8%`],
  summary:`우리나라의 가계부채 총액이 사상 처음으로 2,000조 원을 넘어섰습니다. 최근 금리 인상 기조와 맞물려 주택담보대출 금리 상단이 연 8%까지 치솟을 수 있다는 암울한 전망이 나오고 있습니다. 가계부채의 급증은 빚투 열풍의 결과로, 이자 부담이 가중된 가계가 지갑을 닫으면서 심각한 내수 위축으로 이어질 수 있습니다. 정부와 금융당국은 대출 규제 강화 등 디레버리징 정책을 서두르고 있습니다. 그러나 이미 불어난 부채의 충격을 단기간에 흡수하기는 어려울 전망입니다. 경제 전문가들은 취약 차주에 대한 맞춤형 금융 지원이 시급하다고 조언합니다.`,
  keyTerms:[{term:`디레버리징`,explanation:`부채(레버리지)를 축소해 나가는 과정으로, 경제의 건전성을 높이기 위해 빚을 갚거나 대출을 줄이는 것을 의미합니다.`}],
  history:`과거 저금리 기조 속에서 부동산 투자 열풍이 불며 가계 대출이 장기간 폭발적으로 증가해왔습니다.`,
  players:`영끌족(과도한 대출로 집을 산 차주들), 금융위원회(대출 규제 기관), 시중은행.`,
  current:`금리 인상기를 맞아 이자 부담이 눈덩이처럼 불어나며 원리금을 갚지 못하는 한계 가구가 속출할 위험이 커졌습니다.`,
  outlook:`금융당국의 스트레스 총부채원리금상환비율(DSR) 규제 강화 등 추가적인 대출 억제책이 강력하게 시행될 것으로 예상됩니다.`,
  sources:[{title:`가계빚 사상 첫 2,000조 원 돌파 - 동아일보`,url:`https://donga.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 30년물 국채금리 5.3% 돌파... 미 재무부 이례적 바이백 개입`,
  metrics:[`30년물 5.33%`,`2007년 이후 최고치`],
  summary:`미국의 30년 만기 국채 금리가 연 5.33%까지 폭등하며 2007년 글로벌 금융위기 이후 최고치를 기록했습니다. 일본과 독일 등 주요국의 국채 금리도 동반 급등하면서 전 세계 금융시장에 큰 충격을 주고 있습니다. 상황이 급박해지자 스콧 베센트 미 재무장관은 국채 바이백 조치를 확대하고 엔화 방어를 위해 일본과 공조하는 등 이례적이고 공격적인 시장 개입을 단행했습니다. 이번 사태는 중동 전쟁 리스크와 물가 불안이 겹치며 안전자산인 국채마저 매도세에 시달린 결과로 풀이됩니다. 재무부의 개입으로 급한 불은 껐으나 시장 변동성은 당분간 지속될 전망입니다. 투자자들은 향후 발표될 경제 지표에 촉각을 곤두세우고 있습니다.`,
  keyTerms:[{term:`국채 바이백`,explanation:`정부(재무부)가 이미 발행해 시장에 유통 중인 국채를 만기 전에 다시 사들이는 조치로, 국채 가격 하락(금리 상승)을 방어하는 역할을 합니다.`}],
  history:`미국의 만성적인 재정 적자와 지정학적 위기가 겹치면서 글로벌 국채 금리는 꾸준히 구조적인 상승 압력을 받아왔습니다.`,
  players:`미국 재무부(국채 관리 기관), 글로벌 투자자(국채 매도자), 일본 중앙은행.`,
  current:`국채 금리가 단기간에 통제 불능 수준으로 오르자 시스템 리스크를 차단하기 위해 당국이 긴급하게 방어에 나섰습니다.`,
  outlook:`향후 인플레이션 지표와 미국 연준의 정책 기조에 따라 글로벌 채권 시장이 다시 안정을 찾을 수 있을지 결정될 것입니다.`,
  sources:[{title:`미 국채 금리 폭등 및 재무부 개입 - 딜로이트 인사이트`,url:`https://deloitte.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`이재명 대통령 국정 지지율 38.9%로 하락... 취임 후 첫 30%대 기록`,
  metrics:[`국정 지지율 38.9%`,`취임 후 최저치`],
  summary:`이재명 대통령의 국정 수행 지지율이 최근 여론조사에서 38.9%를 기록하며 취임 후 처음으로 30%대로 떨어졌습니다. 지지율 하락의 주된 원인으로는 부동산 시장의 불안정과 국내 증시의 극심한 변동성 등 경제 분야에 대한 부정적 평가가 꼽힙니다. 지지율 추락에 청와대와 여당인 더불어민주당은 비상 체제에 돌입했습니다. 당내에서는 실용 노선과 전통 지지층 결집 노선을 두고 계파 간 갈등마저 다시 수면 위로 떠올랐습니다. 정부는 민생 경제 회복을 최우선 과제로 삼고 정책적 쇄신을 서두르겠다는 입장을 밝혔습니다. 이번 위기를 어떻게 돌파하느냐가 향후 국정 동력 확보의 중대한 관건이 될 것입니다.`,
  keyTerms:[{term:`국정 동력`,explanation:`정부가 주요 정책을 흔들림 없이 추진하고 국가를 안정적으로 운영해 나갈 수 있도록 뒷받침하는 정치적, 사회적 지지 기반을 뜻합니다.`}],
  history:`취임 초기 높은 기대감 속에 안정적인 지지율을 유지했으나, 최근 고물가와 주거 문제 등 누적된 민생 과제들이 불만을 낳았습니다.`,
  players:`이재명 대통령(국정 책임자), 더불어민주당(당내 노선 이견), 야권(정부 실정 비판).`,
  current:`경제 지표 악화와 민생 불안이 단기간에 겹치면서 핵심 지지층 일부도 비판적인 태도로 돌아서는 양상을 보이고 있습니다.`,
  outlook:`향후 발표될 경제 안정 대책의 실효성과 다가오는 주요 선거에서의 민심 향배가 정부의 정국 주도권을 결정할 핵심 변수입니다.`,
  sources:[{title:`이재명 대통령 지지율 첫 30%대 추락 - 뉴스1`,url:`https://news1.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`트럼프 50% 관세 폭탄 예고... 미국-캐나다 정면충돌로 관세 전쟁 발발`,
  metrics:[`관세 부과 50%`,`동맹국 정면충돌`],
  summary:`미국 트럼프 행정부가 핵심 동맹국인 캐나다를 상대로 50% 관세 부과라는 초강경 카드를 예고하며 북미 무역에 비상이 걸렸습니다. 이에 캐나다 트뤼도 총리는 우리는 미국의 자회사가 아니라고 강력히 반발하여, 양국 간 전면적인 관세 전쟁이 촉발되었습니다. 트럼프의 이번 조치는 무역 적자 해소와 자국 산업 보호를 최우선 명분으로 내세운 극단적인 보호무역주의의 연장선에 있습니다. 오랜 기간 끈끈했던 북미 자유무역 체제가 송두리째 흔들리면서 글로벌 공급망에도 큰 파장이 일고 있습니다. 두 나라의 강대강 대치는 향후 타국과의 무역 협상에도 부정적인 선례로 작용할 가능성이 높습니다. 전문가들은 국제 무역 질서가 각자도생의 시대로 재편되고 있다고 분석합니다.`,
  keyTerms:[{term:`자유무역`,explanation:`국가 간의 상품과 서비스 교역에서 관세나 수입 제한 등의 장벽을 원칙적으로 없애고 자유롭게 거래하는 경제 체제를 말합니다.`}],
  history:`미국과 캐나다는 포괄적인 무역 협정을 통해 오랫동안 단일 시장에 가까운 긴밀하고 안정적인 경제 블록을 유지해 왔습니다.`,
  players:`트럼프 미 대통령(자국 우선주의 강화), 트뤼도 캐나다 총리(캐나다 경제 방어), 다국적 수출 기업들.`,
  current:`미국이 막대한 무역 적자를 줄이기 위해 우방국에게도 예외 없이 고율 관세를 위협하면서 양국 갈등이 최고조에 달했습니다.`,
  outlook:`상호 보복 관세 등 통상 마찰이 장기화될 경우 두 나라는 물론 인접한 글로벌 경제 전반에 심각한 무역 침체를 불러올 수 있습니다.`,
  sources:[{title:`미-캐나다 관세 전쟁 발발 - 유튜브 뉴스`,url:`https://youtube.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미 CIA 국장 러시아 극비 방문... '전황 절망적' 종전 협상 강력 압박`,
  metrics:[`최전선 수명 35분`,`우크라 영토 점령 1% 미만`],
  summary:`존 랫클리프 미국 CIA 국장이 러시아 모스크바를 극비리에 방문해 러시아 정보기관 수장과 회동하며 우크라이나 전쟁의 종전 협상을 촉구했습니다. 랫클리프 국장은 최전선 러시아 군인의 예상 수명이 35분에 불과하고, 최근 1년 반 동안 점령한 영토가 전체의 1% 미만이라는 절망적인 전황 분석 자료를 들이밀며 러시아를 압박했습니다. 또한 그는 나토에 대한 군사 도발 자제와 이란에 대한 무기 지원 축소를 강력히 요구했습니다. 트럼프 대통령은 이번 접촉을 통해 실질적인 성과가 나올 수 있다며 종전 협상 타결에 강한 기대감을 내비쳤습니다. 길었던 우크라이나 전쟁이 드디어 새로운 전기를 맞이할 수 있을지 국제사회의 이목이 쏠리고 있습니다. 러시아가 서방의 압박에 어떤 타협안을 내놓을지가 향후 최대 변수입니다.`,
  keyTerms:[{term:`종전 협상`,explanation:`전쟁을 벌이고 있는 국가들이 무력 충돌을 영구적으로 끝내고 평화 체제를 구축하기 위해 벌이는 외교적 논의 과정을 뜻합니다.`}],
  history:`수년째 이어진 우크라이나 전쟁은 양측 모두에게 극심한 인명 및 경제적 피해를 입히며 돌파구 없는 교착 상태에 빠져 있었습니다.`,
  players:`미국 정부 및 CIA(협상 중재 및 압박), 러시아 최고 지도부(전쟁 지속 여부 결정), 우크라이나.`,
  current:`미국은 막대한 희생으로 한계에 다다른 러시아의 내부 약점을 파고들어 이번 기회에 전쟁을 끝내려는 외교적 승부수를 띄웠습니다.`,
  outlook:`러시아가 국내 정치적 체면을 구기지 않는 선에서 미국의 휴전 제안을 수용할지, 아니면 소모전을 계속할지 귀추가 주목됩니다.`,
  sources:[{title:`미 CIA 국장 러시아 극비 방문 - 연합뉴스`,url:`https://yna.co.kr/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`누리호 5차 발사 10월 7일로 확정... 대전 우주기업 위성 대거 탑재`,
  metrics:[`10월 7일 발사`,`5차 발사 도전`],
  summary:`우주항공청이 한국형 실용 발사체 누리호의 5차 발사일을 오는 10월 7일로 공식 확정했습니다. 이번 5차 발사에서는 대전 지역의 우주 딥테크 스타트업들이 직접 설계하고 개발한 실용 위성들이 탑재되어 우주 궤도로 향할 예정입니다. 성공적인 발사가 이루어지면 한국은 독자적인 우주 수송 능력을 한층 더 고도화하는 성과를 거둡니다. 나아가 민간 주도의 우주 산업 생태계, 즉 뉴스페이스 시대를 본격적으로 앞당기게 됩니다. 정부와 연구진은 발사 전까지 기체 조립과 탑재체 최종 점검 등 철저한 마무리 작업에 돌입했습니다. 전 세계가 대한민국 우주 기술 경쟁력의 비약적인 도약에 집중적으로 주목하고 있습니다.`,
  keyTerms:[{term:`뉴스페이스`,explanation:`과거 정부 기관이 독점 주도하던 우주 개발에서 벗어나, 혁신적인 민간 기업들이 상업적 목적으로 앞장서는 새로운 우주 산업 시대를 말합니다.`}],
  history:`과거 누리호 시험 발사 성공을 통해 독자적인 로켓 기술을 훌륭히 입증했으며, 이제는 실제 상업용 임무를 띤 위성 탑재 위주로 진화하고 있습니다.`,
  players:`우주항공청(프로젝트 총괄), 한국항공우주연구원(핵심 기술 제공), 민간 우주 스타트업(위성 제작 및 활용).`,
  current:`단순한 기술 자립의 단계를 훌쩍 넘어, 글로벌 우주시장에서 상업적 활용 가치와 신뢰성을 입증해야 하는 실전 단계에 돌입했습니다.`,
  outlook:`이번 5차 발사에 성공할 경우 향후 달 탐사선 등 더 무겁고 복잡한 심우주 임무 수행을 위한 기술적 발판이 탄탄하게 마련됩니다.`,
  sources:[{title:`누리호 5차 발사, 10월 7일 확정 - 다음 뉴스`,url:`https://daum.net/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`12·3 비상계엄 국회 봉쇄 주도 전 707특임단장, 1심서 징역 12년 선고`,
  metrics:[`징역 12년 선고`,`12·3 사태 단죄`],
  summary:`지난 12·3 비상계엄 당시 무장 병력을 이끌고 국회 진입과 봉쇄를 주도했던 김현태 전 육군특수전사령부 707특임단장에게 1심 법원이 징역 12년을 선고하고 법정구속했습니다. 재판부는 피고인이 무력을 동원해 헌정 질서를 짓밟고 민주주의의 근간인 국회를 유린한 중대한 범죄를 저질렀다며 엄벌이 불가피하다고 양형 이유를 명확히 밝혔습니다. 이 판결은 불법적인 비상계엄 사태에 직접 가담한 군 고위 간부들에 대한 사법부의 엄중한 단죄를 상징적으로 보여줍니다. 시민사회는 재판부의 결단력 있는 결정을 환영하며 배후 윗선에 대한 추가적인 진상 규명을 강력히 촉구하고 있습니다. 향후 이어질 관련자들의 항소심과 다른 계엄 가담자들의 재판에도 큰 영향을 미칠 전망입니다. 법조계는 맹목적 명령 복종보다 헌법 수호의 가치를 재확인한 판결로 높이 평가하고 있습니다.`,
  keyTerms:[{term:`비상계엄`,explanation:`국가 비상사태 시 국가 안위를 핑계로 군사력을 동원하여 사회 질서를 유지하고 행정 및 사법 권한을 군이 임의로 통제하는 헌법상 권한입니다.`}],
  history:`12·3 비상계엄 사태는 민주화 이후 한국 현대사에서 헌정 질서를 심각하게 위협한 충격적인 사건으로 기록되었으며, 현재 가담자 처벌이 치열하게 진행 중입니다.`,
  players:`김현태 전 단장(불법 국회 봉쇄 작전 주도), 사법부(단호한 엄벌 의지), 시민사회 단체(철저한 진상 규명 요구).`,
  current:`핵심 관련자들에 대한 1심 판결이 속속 나오며, 과거의 불법적 지시에 대한 책임 소재가 법적으로 매우 명확해지고 있습니다.`,
  outlook:`피고인 측의 항소 여부와 함께 계엄을 최초로 기획하고 지시한 최상층부에 대한 최종적인 법적 심판 결과가 온 국민의 주목을 받고 있습니다.`,
  sources:[{title:`'국회 봉쇄' 전 707단장 1심 징역 12년 - 뉴스1`,url:`https://news1.kr/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`글로벌 빅테크 AI 초고속 업데이트 전쟁... 구글 '제미나이' vs 오픈AI 'o4-mini'`,
  metrics:[`Gemini 3.7 출시`,`o4-mini 공개`],
  summary:`구글과 오픈AI를 필두로 한 글로벌 빅테크 기업들의 인공지능 주도권 다툼이 초고속 모델 업데이트 경쟁으로 겉잡을 수 없이 번지고 있습니다. 구글이 정보 처리 속도와 성능을 대폭 끌어올린 차세대 모델 'Gemini 3.7 Flash'를 깜짝 출시하자마자, 곧바로 경쟁사인 오픈AI는 고도의 추론 능력을 극대화한 'o4-mini' 모델을 연이어 대중에게 공개했습니다. 이는 더 많은 사용자 확보와 글로벌 AI 생태계 선점을 위해 하루가 다르게 새로운 버전을 내놓는 치열한 기술 전쟁을 적나라하게 보여줍니다. 업계에서는 이러한 혁신적인 기술의 발전이 일상생활과 산업 전반에 막대한 편익을 가져올 것으로 긍정적으로 기대하고 있습니다. 반면에 속도전에 치우쳐 AI 윤리와 안전성 검증이 치명적으로 뒤처질 수 있다는 심각한 우려도 제기하고 있습니다. 당분간 빅테크 간의 엎치락뒤치락하는 신모델 출시는 쉴 틈 없이 계속될 전망입니다.`,
  keyTerms:[{term:`추론 능력`,explanation:`인공지능이 단순한 정보 암기나 패턴 인식을 넘어, 인간처럼 복잡한 문제를 논리적으로 분석하고 단계별로 해결책을 스스로 찾아내는 지적 능력을 의미합니다.`}],
  history:`챗GPT의 폭발적 등장 이후 전 세계 주요 테크 기업들은 천문학적인 자본과 인력을 투입하며 생성형 AI 모델 고도화에 사활을 걸어왔습니다.`,
  players:`구글(최첨단 Gemini 개발사), 오픈AI(챗GPT 및 o시리즈 개발사), 전 세계의 기업 사용자 및 개인 소비자.`,
  current:`경쟁사 대비 압도적인 성능 우위를 차지하기 위해 이전보다 훨씬 짧은 개발 주기로 파격적인 신기술을 쏟아내며 시장을 완전히 선점하려 하고 있습니다.`,
  outlook:`향후 텍스트 분석을 뛰어넘어 영상, 음성 등 다중 감각 데이터를 실시간으로 처리하는 강력한 멀티모달 AI 영역에서의 피 튀기는 경쟁이 더욱 심화될 것입니다.`,
  sources:[{title:`빅테크 AI 초고속 업데이트 경쟁 - 티스토리 IT뉴스`,url:`https://tistory.com/`}]
}]

  category:`경제`,

  colorBg:`#e8f0fe`,
  headline:`8월 반도체 수출 사상 최대치 기록 및 용인 클러스터 14조 전력망 예타 면제 확정`,
  metrics:[`반도체 수출액 260억 달러`,`전력망 사업 규모 14조 원`],
  summary:`이달 1일부터 20일까지의 반도체 수출액이 260억 달러를 기록하며 사상 최대치를 경신했습니다. 전체 무역수지 역시 140억 달러 흑자를 달성하며 수출 호조세를 견인하고 있습니다. 이에 발맞춰 정부는 용인 반도체 클러스터에 전력을 공급하기 위한 14조 원 규모의 송전망 확충 사업에 대해 예비타당성조사 면제를 확정했습니다. 공장 가동에 필수적인 전력 인프라 구축이 신속하게 진행될 전망입니다. 정부는 내년 예산안에 반도체 특별회계를 신설하는 등 첨단산업 지원을 대폭 강화할 계획입니다. 이번 결정으로 글로벌 반도체 경쟁에서 한국의 입지가 한층 탄탄해질 것으로 기대됩니다.`,
  keyTerms:[{term:`예비타당성조사`,explanation:`국가 재정이 대규모로 투입되는 사업의 정책적, 경제적 타당성을 사전에 검증하는 제도입니다. 예비타당성조사가 면제되면 사업 추진 속도를 획기적으로 앞당길 수 있습니다.`}],
  history:`용인 반도체 클러스터는 대규모 전력이 필수적이나 송전망 구축 지연으로 가동 차질 우려가 꾸준히 제기되어 왔습니다.`,
  players:`인프라를 구축하는 한국전력과 전력망을 사용할 주요 반도체 기업들, 그리고 인허가를 담당하는 정부 부처가 주요 이해관계자입니다.`,
  current:`반도체 수출이 역대 최고치를 기록하는 등 호황기를 맞은 가운데, 인프라 지원이 적기에 결정되면서 투자 불확실성이 해소되었습니다.`,
  outlook:`전력망 설계 및 착공이 본격화될 예정이며, 반도체 특별회계 신설을 포함한 내년도 예산안의 국회 통과 여부가 주목됩니다.`,
  sources:[{title:`8월 반도체 수출 사상 최대 260억 달러 - 연합뉴스`,url:`https://www.yna.co.kr`},{title:`용인 전력망 14조 예타 면제 - 한국경제`,url:`https://www.hankyung.com`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 총 국가 부채 사상 처음으로 40조 달러 돌파하며 글로벌 재정 리스크 부각`,
  metrics:[`총 국가 부채 40조 달러 돌파`,`2분기 기업 투자 8.5% 증가`],
  summary:`미국 재무부 공식 발표에 따르면 미국의 총 국가 부채가 역사상 처음으로 40조 달러를 돌파했습니다. 눈덩이처럼 불어나는 재정 적자 문제에 대해 국제통화기금(IMF)은 재정 건전성 확보가 시급하다고 강력히 경고했습니다. 한편 미국의 2분기 GDP 성장률 잠정치는 1.5%로 둔화되었지만, 소비지출과 기업 투자는 당초 예상보다 탄탄한 것으로 수정 발표되었습니다. 막대한 부채에도 불구하고 내수 경제는 견조한 흐름을 이어가고 있는 역설적인 상황입니다. 그러나 고금리 환경에서 불어나는 이자 부담은 향후 심각한 경제적 뇌관이 될 수 있습니다. 글로벌 금융시장 역시 미국의 재정 리스크를 예의주시하고 있습니다.`,
  keyTerms:[{term:`재정 건전성`,explanation:`국가가 빚을 과도하게 지지 않고 수입과 지출의 균형을 유지하며 재정을 안정적으로 운영하는 상태를 뜻합니다. 미국의 재정 건전성이 흔들리면 전 세계 경제에 악영향을 미칠 수 있습니다.`}],
  history:`코로나19 팬데믹 이후 대규모 경기 부양책과 금리 인상이 겹치면서 미국의 이자 부담과 국가 부채가 가파르게 증가해 왔습니다.`,
  players:`빚을 관리하는 미국 재무부, 재정 정책을 감시하는 IMF, 그리고 금리를 결정하는 미 연방준비제도(Fed)가 핵심 주체입니다.`,
  current:`2분기 소비와 투자가 호조를 보였으나, 40조 달러라는 상징적인 부채 규모가 글로벌 경제의 잠재적 위험 요소로 떠올랐습니다.`,
  outlook:`향후 미 대선 국면에서 재정 적자 축소와 세금 인상 논의가 주요 정치적 쟁점으로 급부상할 전망입니다.`,
  sources:[{title:`미국 국가 부채 40조 달러 돌파 - 매일경제`,url:`https://www.mk.co.kr`},{title:`IMF, 미국의 재정 적자 경고 - 블룸버그`,url:`https://www.bloomberg.com`}]

  headline:`중동 갈등과 가뭄 여파로 파나마 운하 급행료 73억 원 돌파하며 물류 대란 가중`,
  metrics:[`급행료 최고 낙찰가 530만 달러`,`평소 통행료 대비 약 100배 폭등`],
  summary:`중동의 지정학적 위기와 기후 변화로 인한 가뭄이 겹치면서 파나마 운하의 병목현상이 극에 달하고 있습니다. 통행 수요가 폭증하는 가운데 한국의 한 에너지 기업은 9월 운하 통과를 위해 사상 최고액인 530만 달러(약 73억 원)의 급행료를 지불하기로 합의했습니다. 이는 평소 통행권 경매가인 5만 달러 수준에서 무려 100배 가까이 폭등한 수치입니다. 호르무즈 해협 위기로 미국산 원유 수입이 늘어난 아시아 국가들이 파나마 운하로 몰리면서 물류 대란이 심화되고 있습니다. 이처럼 과도한 물류비 인상은 글로벌 인플레이션을 다시 자극할 수 있다는 우려를 낳고 있습니다. 에너지 수입 의존도가 높은 국내 산업계의 부담도 더욱 가중될 전망입니다.`,
  keyTerms:[{term:`병목현상`,explanation:`병의 목 부분처럼 좁은 길이 막혀 전체적인 흐름이 느려지거나 정체되는 현상을 말합니다. 물류 이동 통로가 좁아져 화물 운송이 크게 지연되는 상황을 뜻합니다.`}],
  history:`파나마 운하는 전 세계 해상 물류의 핵심 통로이나, 최근 심각한 가뭄으로 수위가 낮아져 하루 통항 허용 선박 수가 급감했습니다.`,
  players:`막대한 물류비를 감수해야 하는 글로벌 에너지 수입 기업들과 운하 통행을 통제하는 파나마 운하청이 주요 플레이어입니다.`,
  current:`중동 정세 불안과 기후 위기가 동시에 닥치면서 물류비용이 상상을 초월하는 수준으로 치솟아 공급망에 타격을 주고 있습니다.`,
  outlook:`엘니뇨 완화로 가뭄이 완전히 해갈되고 중동 정세가 안정되기 전까지는 해상 운임 인상 압박이 지속될 것으로 보입니다.`,
  sources:[{title:`파나마 운하 통행료 73억원 최고가 - 이데일리`,url:`https://www.edaily.co.kr`},{title:`호르무즈 위기에 파나마 운하 수요 폭발 - WSJ`,url:`https://www.wsj.com`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`이준석 개혁신당 대표, 지방선거 참패와 당내 갈등 책임지고 전격 사퇴`,
  metrics:[`광역단체장 당선자 0명`,`지방선거 정당 득표율 3% 미만`],
  summary:`이준석 개혁신당 대표가 최근 치러진 지방선거의 참패와 당내 쇄신 방향을 둘러싼 극심한 갈등에 책임을 지고 당 대표직에서 전격 사퇴했습니다. 개혁신당은 이번 선거에서 광역단체장을 단 한 석도 얻지 못하고 정당 득표율도 3%를 밑도는 초라한 성적을 기록했습니다. 이 대표는 사퇴 기자회견에서 직책을 내려놓고 백의종군의 자세로 당의 재건을 돕겠다고 밝혔습니다. 그의 사퇴로 인해 제3지대 정당인 개혁신당은 심각한 리더십 공백 상태를 맞게 되었습니다. 향후 당권 경쟁이 치열해질 것으로 예상되며, 야권 전반의 정계 개편에도 상당한 파장이 일어날 것으로 보입니다. 여야 정치권 모두 이 대표의 2선 후퇴가 미칠 파급 효과를 예의주시하고 있습니다.`,
  keyTerms:[{term:`백의종군`,explanation:`벼슬이나 직책 없이 평범한 신분으로 군대를 따라 전쟁터에 나간다는 뜻으로, 아무런 권력 없이 조직을 위해 헌신하겠다는 정치적 선언입니다.`}],
  history:`개혁신당은 거대 양당 사이에서 대안 정당을 표방하며 출범했으나, 지역별 뚜렷한 지지 기반을 확보하지 못해 선거에서 고전해 왔습니다.`,
  players:`당내 주도권을 다투는 기존 지도부와 쇄신파 의원들, 그리고 이탈 여부를 고민하는 핵심 당원들이 주요 이해관계자입니다.`,
  current:`당의 최고 간판스타였던 당 대표가 물러나면서 조직의 구심점이 사라져 당의 존립 자체가 중대한 시험대에 올랐습니다.`,
  outlook:`조기 전당대회를 통한 새 지도부 선출 과정에서 계파 갈등이 불거지거나 제3지대 야권 내 연대 움직임이 가속화될 가능성이 있습니다.`,
  sources:[{title:`이준석 개혁신당 대표 전격 사퇴 - 뉴스핌`,url:`https://www.newspim.com`},{title:`지방선거 참패 책임지고 물러나 - 중앙일보`,url:`https://www.joongang.co.kr`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`캐나다, 미국산 수입품에 최대 50% 보복 관세 부과하며 무역 전쟁 전면화`,
  metrics:[`관세 부과 대상 700여 개 품목`,`보복 조치 규모 약 200억 달러`],
  summary:`캐나다 정부가 미국의 선제적인 관세 인상 조치에 정면으로 맞서 700여 개 미국산 제품에 최대 50%의 보복 관세를 부과하겠다고 공식 발표했습니다. 이번 관세 조치는 약 200억 달러 규모로 9월부터 본격 시행될 예정입니다. 특히 캐나다는 미국의 11월 중간선거를 겨냥하여 공화당 텃밭 지역에서 주로 생산되는 철강과 유제품 등을 표적으로 삼았습니다. 이에 격분한 트럼프 미국 대통령은 국경에 인접한 온타리오 호수의 이름을 '미국 호수'로 바꾸겠다고 위협하는 등 감정싸움으로 번지고 있습니다. 북미 지역을 핵심 동맹으로 묶어주던 무역 협정의 근간이 크게 흔들리면서 글로벌 공급망 전체에 비상이 걸렸습니다. 경제적 마찰을 넘어 양국 간 외교적 긴장감도 최고조에 달하고 있습니다.`,
  keyTerms:[{term:`보복 관세`,explanation:`상대국이 자국의 수출품에 부당하게 높은 세금을 매길 때, 이에 대응하여 상대국 수입 제품에 똑같이 높은 세금을 부과하는 무역 제재 조치입니다.`}],
  history:`미국이 자국 산업 보호를 명분으로 인접국인 캐나다 제품에 고율 관세를 매기면서 오랜 동맹국 간의 무역 갈등이 촉발되었습니다.`,
  players:`자국 우선주의 무역 장벽을 세운 미 행정부와, 자국 산업 피해를 막기 위해 맞대응에 나선 캐나다 정부가 갈등의 당사자입니다.`,
  current:`경제적 손실 방어를 넘어 오는 11월 미국 선거 표심에 타격을 주려는 캐나다의 정밀 제재로 정치적 싸움이 격화되었습니다.`,
  outlook:`양국 모두 물러설 기미를 보이지 않아 기존 자유무역협정(USMCA)의 파기 요구나 전면적인 글로벌 무역 분쟁으로 비화될 우려가 높습니다.`,
  sources:[{title:`캐나다 200억 달러 규모 보복 관세 발표 - 한겨레`,url:`https://www.hani.co.kr`},{title:`미국-캐나다 무역전쟁 격화 - WSJ`,url:`https://www.wsj.com`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국, 이란에 제3국까지 처벌하는 세컨더리 보이콧 발동 및 호르무즈 긴장 고조`,
  metrics:[`제재 대상 60여 개 단체 및 선박`,`협상 기대감에 국제 유가 3% 급락`],
  summary:`미국 정부가 이란을 국제 금융망에서 완전히 고립시키기 위해 이란과 거래하는 제3국 기업과 은행까지 통째로 처벌하는 초강경 세컨더리 보이콧을 발동했습니다. 이번 조치로 60여 개에 달하는 단체와 다수 선박이 미국의 신규 제재 명단에 올랐습니다. 동시에 주요 원유 수송로인 호르무즈 해협에서는 이란 혁명수비대가 통행로 개방 합의를 파기할 조짐을 보이며 군사적 긴장이 치솟고 있습니다. 양측의 강 대 강 대치가 이어지며 중동 해상 안전성이 심각하게 위협받고 있는 상황입니다. 하지만 국제 원유 시장은 오히려 양측이 극단적 조치 이후 물밑 협상을 재개할 가능성에 무게를 두며 유가가 3% 넘게 급락하는 반응을 보였습니다. 중동 정세의 극심한 불확실성이 글로벌 경제를 뒤흔들고 있습니다.`,
  keyTerms:[{term:`세컨더리 보이콧`,explanation:`제재 대상 국가뿐만 아니라 그 국가와 거래를 하는 제3국의 평범한 기업이나 은행까지 강제로 제재하여 국제 시장에서 퇴출시키는 초강경 조치입니다.`}],
  history:`미국은 이란의 핵 시설 가동과 무장 단체 지원을 막기 위해 지속적으로 경제 제재를 가해왔으며 최근 제재 강도를 최고 수준으로 끌어올렸습니다.`,
  players:`전방위 금융 압박을 주도하는 미국 정부와, 호르무즈 해협 봉쇄를 무기로 저항하는 이란 혁명수비대가 직접적으로 충돌하고 있습니다.`,
  current:`2차 제재가 공식화되면서 이란과 조금이라도 거래가 있는 다국적 기업들은 막대한 벌금을 물거나 달러 결제망에서 쫓겨날 위기에 처했습니다.`,
  outlook:`호르무즈 해협에서의 국지적 무력 충돌 여부와 미국의 압박이 실제 외교적 협상 테이블을 끌어낼 수 있을지가 향후 정세의 핵심 관건입니다.`,
  sources:[{title:`미국 이란에 초강력 2차 제재 발표 - 연합뉴스TV`,url:`https://www.yonhapnewstv.co.kr`},{title:`트럼프 행정부, 이란 완전 고립화 추진 - 로이터`,url:`https://www.reuters.com`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`네팔 라수와 지역 대홍수로 수력발전소 건설 현장 한국인 근로자 9명 실종`,
  metrics:[`홍수로 인한 사망자 최소 95명`,`한국인 근로자 실종 9명`],
  summary:`네팔과 중국 접경지대인 라수와 지역에서 지진과 폭우로 인한 빙하호 붕괴로 대규모 돌발 홍수가 발생했습니다. 이 참사로 현지 마을이 휩쓸려 최소 95명이 사망하고 수백 명이 실종되는 대형 인명 피해가 발생했습니다. 특히 현지 수력발전소 건설 인프라 사업에 참여 중이던 한국남동발전 및 기업 소속 한국인 근로자 9명이 연락 두절 상태인 것으로 확인되었습니다. 정부는 사태의 심각성을 인지하고 외교부 신속대응팀을 즉각 파견하여 수색 및 구조에 총력을 다할 것을 긴급 지시했습니다. 현지는 폭우로 도로와 통신망이 완전히 끊겨 구조대 진입조차 매우 어려운 최악의 상황입니다. 자연재해의 무서움과 해외 오지 파견 노동자들의 안전 확보 문제가 다시 한번 크게 대두되고 있습니다.`,
  keyTerms:[{term:`돌발 홍수`,explanation:`집중 호우나 댐, 빙하호 붕괴 등으로 인해 짧은 시간 안에 계곡이나 하천의 물이 걷잡을 수 없이 갑자기 불어나는 매우 위험한 재난입니다.`}],
  history:`히말라야 산맥 인근은 기후 변화로 인해 빙하가 녹으면서 형성된 빙하호가 지진 등에 의해 붕괴할 위험이 환경 단체들로부터 꾸준히 경고되어 왔습니다.`,
  players:`긴급 구호에 나선 네팔 현지 당국과 실종된 자국민을 구조하기 위해 다급히 인력을 파견한 대한민국 외교부 및 관련 기업들입니다.`,
  current:`주요 통신 및 도로 인프라가 파괴되어 정확한 피해 규모 파악은 물론 생존자 구조 및 복구 작업에 막대한 지장을 초래하고 있습니다.`,
  outlook:`기상 악화가 당분간 지속될 예보가 있어 추가적인 산사태 피해 방지와 신속한 실종자 수색 진척 여부에 이목이 집중되고 있습니다.`,
  sources:[{title:`네팔 홍수로 한국인 9명 실종 - 한겨레`,url:`https://www.hani.co.kr`},{title:`정부 긴급 신속대응팀 네팔 파견 - 오마이뉴스`,url:`https://www.ohmynews.com`}]

  category:`기타 이슈`,

  colorBg:`#e6f4f1`,
  headline:`오픈AI, 최고 성능 추론형 인공지능 'ChatGPT o3' 모델 일반 서비스 전격 종료`,
  metrics:[`출시 후 약 8개월 만에 웹 서비스 종료`,`API 호출당 비용 기존 모델의 수 배`],

  BRIEFS.forEach((b, i) => {
    const el = document.createElement('div');
    el.className = 'date-item' + (i === 0 ? ' active' : '');
    el.dataset.tag = b.tag;
    const parts = b.tag.split('-');
    const short = parts[1] + '/' + parts[2];
    el.innerHTML = b.tag;
    el.addEventListener('click', () => showBrief(b.tag));
    list.appendChild(el);
  });
}

function showBrief(tag) {
  current = tag;
  document.querySelectorAll('.date-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tag === tag);
  });
  const brief = BRIEFS.find(b => b.tag === tag);
  if (!brief) return;

  // 카테고리별 그룹핑
  const grouped = {};
  brief.stories.forEach(s => {
    if (!grouped[s.category]) grouped[s.category] = [];
    grouped[s.category].push(s);
  });
  const availableCats = CAT_ORDER.filter(c => grouped[c] && grouped[c].length);
  if (!availableCats.length) return;

  // 기본 카테고리 결정
  if (!availableCats.includes(currentCat)) currentCat = availableCats[0];

  renderContent(brief, grouped, availableCats);
}

function renderContent(brief, grouped, availableCats) {
  const content = document.getElementById('content');
  let html = `<div class="sticky-top">
    <div class="brief-header">
      <div class="bh-eyebrow">Morning Brief</div>
      <h2>${brief.label}</h2>
    </div>`;

  // 탭
  html += '<div class="cat-tabs">';
  availableCats.forEach(c => {
    const cls = c === currentCat ? 'cat-tab active' : 'cat-tab';
    html += `<button class="${cls}" data-cat="${c}">${c}</button>`;
  });
  html += '</div></div>';

  // 선택된 카테고리 기사들
  const stories = grouped[currentCat] || [];
  stories.forEach((s, idx) => {
    if (idx > 0) html += '<hr class="story-divider">';
    html += `<div class="story">
      <div class="story-top">
        <div class="story-headline">${s.headline}</div>
      </div>`;
    if (s.metrics.length) {
      html += '<div class="metrics">';
      s.metrics.forEach(m => { html += `<div class="metric-chip">${m}</div>`; });
      html += '</div>';
    }
    // 요약문에 핵심 개념 밑줄 (출력은 박스 다음)
    let summaryHtml = s.summary;
    if (s.keyTerms && s.keyTerms.length) {
      s.keyTerms.forEach(kt => {
        if (!kt.term) return;
        const safe = kt.term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp(safe, 'g');
        summaryHtml = summaryHtml.replace(re, `<span class="kt-underline">${kt.term}</span>`);
      });
    }

    // 핵심 개념 박스 (요약 위)
    if (s.keyTerms && s.keyTerms.length) {
      html += '<div class="key-terms"><div class="key-terms-title">핵심 개념</div>';
      s.keyTerms.forEach(kt => {
        html += `<div class="kt-item">
          <span class="kt-term">${kt.term}</span>
          <span class="kt-exp">${kt.explanation}</span>
        </div>`;
      });
      html += '</div>';
    }

    html += `<div class="summary">${summaryHtml}</div>`;

    const bgSections = [
      ['역사적 맥락', s.history],
      ['핵심 플레이어', s.players],
      ['현재 구도', s.current],
      ['향후 전망', s.outlook],
    ].filter(([, v]) => v);

    if (bgSections.length) {
      html += '<div class="bg-box"><div class="bg-box-title">배경 스토리</div>';
      bgSections.forEach(([label, text]) => {
        html += `<div class="bg-section">
          <div class="bg-section-label">${label}</div>
          <div class="bg-section-text">${text}</div>
        </div>`;
      });
      html += '</div>';
    }

    if (s.sources.length) {
      html += `<button class="sources-toggle" data-toggle="srcs-${idx}">출처 ${s.sources.length}개 보기 <span class="arrow">▾</span></button>`;
      html += `<div class="sources-body" id="srcs-${idx}">`;
      s.sources.forEach((src, si) => {
        html += `<div class="source-item">
          <span class="src-num">${si+1}</span>
          <a href="${src.url}" target="_blank">${src.title}</a>
        </div>`;
      });
      html += '</div>';
    }
    html += '</div>';
  });

  content.innerHTML = html;

  // 탭 클릭 핸들러
  content.querySelectorAll('.cat-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentCat = btn.dataset.cat;
      renderContent(brief, grouped, availableCats);
    });
  });

  // 출처 토글
  content.querySelectorAll('.sources-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const body = document.getElementById(btn.dataset.toggle);
      const isOpen = body.classList.toggle('open');
      btn.classList.toggle('open', isOpen);
    });
  });

  document.getElementById('main').scrollTop = 0;
}

if (BRIEFS.length > 0) {
  renderSidebar();
  showBrief(BRIEFS[0].tag);
} else {
  document.getElementById('content').innerHTML = '<div class="empty">브리핑 데이터가 없습니다.</div>';
}

// ── Quiz Gate ──
const PASS_TARGET = 3;
let correctCount = 0;
const usedIndexes = new Set();

function pickQuestion() {
  // 사용 안 한 문제 중 랜덤. 다 썼으면 풀 리셋
  if (usedIndexes.size >= QUIZ.length) usedIndexes.clear();
  let idx;
  do { idx = Math.floor(Math.random() * QUIZ.length); } while (usedIndexes.has(idx));
  usedIndexes.add(idx);
  return QUIZ[idx];
}

function updateCounter() {
  document.getElementById('quiz-counter').textContent = `(${correctCount}/${PASS_TARGET})`;
}

function renderQuiz() {
  const q = pickQuestion();
  document.getElementById('quiz-q').textContent = q.q;
  updateCounter();
  const feedback = document.getElementById('quiz-feedback');
  feedback.textContent = '';
  feedback.className = 'quiz-feedback';
  const closeBtn = document.getElementById('quiz-close');
  closeBtn.classList.add('hidden');

  const choicesEl = document.getElementById('quiz-choices');
  choicesEl.innerHTML = '';
  // 보기 순서 섞기 (정답 위치 고정 방지)
  const order = q.a.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  order.forEach(idx => {
    const text = q.a[idx];
    const btn = document.createElement('button');
    btn.className = 'quiz-choice';
    btn.textContent = text;
    btn.addEventListener('click', () => {
      const allBtns = choicesEl.querySelectorAll('.quiz-choice');
      allBtns.forEach(b => b.disabled = true);
      if (idx === q.correct) {
        btn.classList.add('correct');
        correctCount++;
        updateCounter();
        if (correctCount >= PASS_TARGET) {
          feedback.textContent = '통과! 들어와도 좋아.';
          feedback.className = 'quiz-feedback right';
          closeBtn.classList.remove('hidden');
        } else {
          feedback.textContent = '역시 맞출 줄 알았어. 다음 문제 고.';
          feedback.className = 'quiz-feedback right';
          btn.blur();
          setTimeout(() => {
            if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
            renderQuiz();
          }, 900);
        }
      } else {
        btn.classList.add('wrong');
        feedback.textContent = '정말 실망이다.... 다음.';
        feedback.className = 'quiz-feedback wrong';
        btn.blur();
        setTimeout(() => {
          if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
          renderQuiz();
        }, 900);
      }
    });
    choicesEl.appendChild(btn);
  });
}

document.getElementById('quiz-close').addEventListener('click', () => {
  document.getElementById('quiz-overlay').classList.add('hidden');
  document.body.classList.remove('quiz-active');
});

document.body.classList.add('quiz-active');
renderQuiz();

// ── Mobile sidebar toggle ──
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('sidebar-backdrop');
function toggleSidebar(open) {
  sidebar.classList.toggle('open', open);
  backdrop.classList.toggle('open', open);
}
document.getElementById('sidebar-toggle').addEventListener('click', () => toggleSidebar(!sidebar.classList.contains('open')));
backdrop.addEventListener('click', () => toggleSidebar(false));
// 날짜 클릭하면 모바일에서 자동으로 닫히게
sidebar.addEventListener('click', e => {
  if (e.target.classList.contains('date-item') && window.innerWidth <= 768) {
    toggleSidebar(false);
  }
});

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모닝 브리핑</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --sidebar-w: 240px;
    --bg: #FAFAF7;
    --paper: #FFFFFF;
    --accent: #6B7A8F;
    --accent-soft: #E8ECEF;
    --line: #EAE8E3;
    --line-strong: #D8D5CE;
    --text: #2D2A26;
    --text-mid: #6B655D;
    --text-sub: #A09889;
    --radius: 10px;
  }
  html, body {
    height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 15px; line-height: 1.65; font-weight: 400;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }

  /* ── Layout ── */
  #app { display: flex; height: 100vh; overflow: hidden; }

  /* ── Sidebar ── */
  #sidebar {
    width: var(--sidebar-w); flex-shrink: 0;
    background: var(--bg); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #sidebar-header {
    padding: 36px 20px 24px;
    border-bottom: 1px solid var(--line);
    text-align: center;
  }
  #sidebar-header h1 {
    font-size: 19px; font-weight: 700; color: var(--text);
    letter-spacing: -0.4px; line-height: 1.3;
  }
  #sidebar-header p {
    font-size: 12px; color: var(--text-sub); margin-top: 6px;
    letter-spacing: 0.3px;
  }
  #date-list { overflow-y: auto; flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
  .date-item {
    padding: 11px 14px; cursor: pointer; border-radius: 8px;
    transition: background 0.15s, color 0.15s;
    background: transparent;
    text-align: center; font-size: 13px; font-weight: 500; color: var(--text-mid);
    letter-spacing: 0.1px;
  }
  .date-item:hover { background: var(--accent-soft); color: var(--text); }
  .date-item.active {
    background: var(--accent-soft); color: var(--text); font-weight: 600;
  }

  /* ── Main ── */
  #main { flex: 1; overflow-y: auto; background: var(--paper); }
  #content { max-width: 760px; margin: 0 auto; padding: 56px 40px 80px; }

  .brief-header { margin-bottom: 36px; }
  .brief-header .bh-eyebrow {
    font-size: 11px; color: var(--text-sub); margin-bottom: 8px;
    letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500;
  }
  .brief-header h2 {
    font-size: 30px; font-weight: 700; letter-spacing: -0.7px;
    color: var(--text); line-height: 1.25;
  }

  /* ── Sticky Top (header + tabs) ── */
  .sticky-top {
    position: sticky; top: 0;
    background: var(--paper); z-index: 20;
    padding-top: 56px; margin-top: -56px;
  }
  .sticky-top .brief-header { margin-bottom: 24px; }

  /* ── Category Tabs ── */
  .cat-tabs {
    display: flex; gap: 0; margin-bottom: 36px;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
  }
  .cat-tab {
    padding: 12px 20px 14px; cursor: pointer; font-size: 14px; font-weight: 500;
    color: var(--text-sub); border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    background: none; border-top: none; border-left: none; border-right: none;
    font-family: inherit; letter-spacing: -0.1px;
    margin-bottom: -1px;
  }
  .cat-tab:hover { color: var(--text-mid); }
  .cat-tab.active { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }

  /* ── Sources (collapsible) ── */
  .sources-toggle {
    background: transparent; border: 1px solid var(--line-strong);
    padding: 8px 14px; border-radius: 6px; font-size: 12.5px; font-weight: 500;
    color: var(--text-mid); cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    font-family: inherit; margin-top: 12px;
    transition: background 0.15s, border-color 0.15s;
  }
  .sources-toggle:hover { background: var(--accent-soft); border-color: var(--accent); }
  .sources-toggle .arrow { transition: transform 0.2s; font-size: 9px; color: var(--text-sub); }
  .sources-toggle.open .arrow { transform: rotate(180deg); }
  .sources-body { display: none; margin-top: 12px; padding-left: 4px; }
  .sources-body.open { display: block; }

  /* ── Story Card ── */
  .story { margin-bottom: 40px; }
  .story-top { margin-bottom: 18px; }
  .story-headline {
    font-size: 19px; font-weight: 700; line-height: 1.45;
    letter-spacing: -0.4px; color: var(--text);
  }

  .metrics { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .metric-chip {
    background: var(--accent-soft); border: none;
    border-radius: 6px; padding: 7px 12px;
    font-size: 12.5px; font-weight: 500; color: var(--text-mid);
    line-height: 1.4;
  }

  .summary {
    font-size: 15px; line-height: 1.8; color: var(--text); margin-bottom: 20px;
    letter-spacing: -0.1px;
  }
  .summary .kt-underline {
    color: #1996BD;
    text-decoration: underline;
    text-decoration-color: #1996BD;
    text-decoration-thickness: 1.5px;
    text-underline-offset: 3px;
    cursor: help;
  }

  /* ── Key Terms Box ── */
  .key-terms {
    background: #F4F1EA; border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius); padding: 18px 22px; margin-bottom: 14px;
  }
  .key-terms-title {
    font-size: 11px; font-weight: 600; color: var(--text-sub);
    text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 14px;
  }
  .kt-item { margin-bottom: 12px; }
  .kt-item:last-child { margin-bottom: 0; }
  .kt-term {
    font-size: 13.5px; font-weight: 700; color: #1996BD;
    margin-bottom: 4px; display: block;
    letter-spacing: -0.1px;
  }
  .kt-exp {
    font-size: 13.5px; line-height: 1.7; color: var(--text-mid);
  }

  /* ── Background ── */
  .bg-box {
    background: var(--bg); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 22px 24px; margin-bottom: 14px;
  }
  .bg-box-title {
    font-size: 11px; font-weight: 600; color: var(--text-sub);
    text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 16px;
  }
  .bg-section { margin-bottom: 16px; }
  .bg-section:last-child { margin-bottom: 0; }
  .bg-section-label {
    font-size: 12.5px; font-weight: 600; color: var(--text); margin-bottom: 6px;
    letter-spacing: -0.1px;
  }
  .bg-section-text { font-size: 14px; line-height: 1.75; color: var(--text-mid); }

  /* ── Sources ── */
  .source-item {
    display: flex; align-items: flex-start; gap: 10px;
    margin-bottom: 8px; font-size: 13px;
  }
  .src-num {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent-soft); color: var(--text-mid);
    font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .source-item a { color: var(--text-mid); text-decoration: none; line-height: 1.55; }
  .source-item a:hover { color: var(--text); text-decoration: underline; }

  .story-divider { border: none; border-top: 1px solid var(--line); margin: 36px 0; }

  .empty { color: var(--text-sub); font-size: 14px; padding: 60px 0; text-align: center; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }

  /* ── Mobile Toggle ── */
  #sidebar-toggle {
    display: none;
    position: fixed; top: 14px; left: 14px; z-index: 50;
    background: var(--paper); border: 1px solid var(--line-strong);
    width: 40px; height: 40px; border-radius: 10px;
    cursor: pointer; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(45, 42, 38, 0.08);
  }
  #sidebar-toggle span {
    display: block; width: 18px; height: 2px; background: var(--text);
    position: relative;
  }
  #sidebar-toggle span::before,
  #sidebar-toggle span::after {
    content: ''; position: absolute; left: 0; width: 18px; height: 2px; background: var(--text);
  }
  #sidebar-toggle span::before { top: -6px; }
  #sidebar-toggle span::after { top: 6px; }

  #sidebar-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(45, 42, 38, 0.4); z-index: 40;
  }
  #sidebar-backdrop.open { display: block; }

  /* ── Mobile Responsive ── */
  @media (max-width: 768px) {
    #sidebar-toggle { display: flex; }
    #sidebar {
      position: fixed; left: 0; top: 0; bottom: 0;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      z-index: 45; width: 260px;
      box-shadow: 0 0 24px rgba(45, 42, 38, 0.12);
    }
    #sidebar.open { transform: translateX(0); }

    #content { padding: 64px 20px 60px; max-width: 100%; }
    .brief-header h2 { font-size: 22px; }
    .story-headline { font-size: 16px; }
    .summary { font-size: 14.5px; line-height: 1.75; }
    .bg-section-text { font-size: 13.5px; }
    .metric-chip { font-size: 12px; padding: 6px 10px; }
    .bg-box { padding: 18px 18px; }
    .cat-tab { padding: 11px 14px; font-size: 13.5px; }

    .quiz-card { padding: 28px 24px 24px; }
    .quiz-q { font-size: 17px; }
    .quiz-choice { font-size: 14px; padding: 13px 16px; }
  }

  /* ── Quiz Overlay ── */
  body.quiz-active #app {
    filter: blur(6px) saturate(0.85);
    pointer-events: none;
    transition: filter 0.3s ease;
  }
  #quiz-overlay {
    position: fixed; inset: 0;
    background-color: rgba(250, 250, 247, 0.55);
    background-image:
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0) 0,
        rgba(255,255,255,0) 5px,
        rgba(45,42,38,0.04) 5px,
        rgba(45,42,38,0.04) 6px
      ),
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0) 0,
        rgba(255,255,255,0) 22px,
        rgba(45,42,38,0.025) 22px,
        rgba(45,42,38,0.025) 23px
      );
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 24px;
  }
  #quiz-overlay.hidden { display: none; }

  .quiz-card {
    background: var(--paper); border-radius: 16px;
    padding: 36px 36px 32px; width: 100%; max-width: 440px;
    box-shadow: 0 16px 48px rgba(45, 42, 38, 0.18);
  }
  .quiz-eyebrow {
    font-size: 11px; color: var(--text-sub); letter-spacing: 1.5px;
    text-transform: uppercase; font-weight: 500; margin-bottom: 12px;
  }
  .quiz-q {
    font-size: 19px; font-weight: 700; color: var(--text);
    line-height: 1.5; letter-spacing: -0.3px; margin-bottom: 24px;
  }
  .quiz-choices { display: flex; flex-direction: column; gap: 8px; }
  .quiz-choice {
    background: var(--paper); border: 1px solid var(--line-strong);
    padding: 14px 18px; border-radius: 10px; font-size: 14.5px; font-weight: 500;
    color: var(--text); cursor: pointer; text-align: left;
    font-family: inherit; transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .quiz-choice:focus { outline: none; }
  .quiz-choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) {
    .quiz-choice:hover { background: var(--accent-soft); border-color: var(--accent); }
  }
  .quiz-choice:active { transform: scale(0.99); }
  .quiz-choice.wrong {
    background: #F5E6E0; border-color: #C9947F; color: #8A4A30;
    animation: shake 0.4s ease;
  }
  .quiz-choice.correct {
    background: #E3EDE2; border-color: #7A9077; color: #2E4A2C;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .quiz-feedback {
    margin-top: 20px; text-align: center; font-size: 14px; font-weight: 500;
    color: var(--text-mid); min-height: 22px;
  }
  .quiz-feedback.right { color: #2E4A2C; }
  .quiz-feedback.wrong { color: #8A4A30; }

  .quiz-close-btn {
    margin-top: 18px; width: 100%;
    background: var(--text); color: var(--paper); border: none;
    padding: 13px 20px; border-radius: 10px; font-size: 14px; font-weight: 600;
    font-family: inherit; cursor: pointer;
    transition: background 0.15s;
  }
  .quiz-close-btn:hover { background: #1a1815; }
  .quiz-close-btn.hidden { display: none; }
</style>
</head>
<body>
<div id="quiz-overlay">
  <div class="quiz-card">
    <div class="quiz-eyebrow"><span>잠깐, 나에 대해서 잘 알지?</span> <span id="quiz-counter">(0/3)</span></div>
    <div class="quiz-q" id="quiz-q"></div>
    <div class="quiz-choices" id="quiz-choices"></div>
    <div class="quiz-feedback" id="quiz-feedback"></div>
    <button class="quiz-close-btn hidden" id="quiz-close">닫기</button>
  </div>
</div>

<button id="sidebar-toggle" aria-label="메뉴"><span></span></button>
<div id="sidebar-backdrop"></div>

<div id="app">
  <nav id="sidebar">
    <div id="sidebar-header">
      <h1>모닝 브리핑</h1>
      <p>일별 세계 뉴스 요약</p>
    </div>

    <div id="date-list"></div>
  </nav>
  <main id="main">
    <div id="content"></div>
  </main>
</div>

<script>
const BRIEFS = [{
  tag:`2026-09-29`,
  label:`2026년 9월 29일 (화)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`연휴 복귀 첫날 코스피 2.70% 급락…고금리·고유가 '이중고'`,
  metrics:[`코스피 지수 2.70% 하락`,`미 10년물 국채금리 장중 5.27% 돌파`],
  summary:`연휴를 마치고 개장한 국내 증시에서 코스피가 2.70% 급락하며 큰 충격을 받았습니다. 이는 미국 장기 국채금리가 22년 만에 최고치로 치솟은 데다, 중동 지역의 지정학적 긴장 고조로 국제 유가까지 급등한 여파입니다. 특히 트럼프 미국 대통령이 이란의 휴전 제안을 단칼에 거절하면서 시장의 불안 심리가 크게 자극되었습니다. 미중 무역합의 연장이라는 호재가 있었음에도 불구하고, 금리와 유가라는 거대한 악재를 넘어서기에는 역부족이었습니다. 투자자들의 매도세가 이어지며 국내 금융시장은 변동성이 크게 확대된 모습입니다. 당분간 대외 변수에 의한 시장 출렁임이 지속될 것으로 우려됩니다.`,
  keyTerms:[{term:`국채금리`,explanation:`국가가 돈을 빌릴 때 발생하는 이자율입니다. 미국 국채금리가 오르면 전 세계 자금이 미국으로 쏠리며 다른 국가의 증시가 하락하는 경향이 있습니다.`}],
  history:`글로벌 인플레이션 장기화와 각국의 통화 긴축 기조로 인해 금리 상승 압력이 지속되어 왔습니다.`,
  players:`미국 연방준비제도(Fed)와 중동 주요 산유국들의 결정이 글로벌 자금 흐름을 좌우하고 있습니다.`,
  current:`금리 인상 사이클 종료 기대감이 후퇴하고 중동발 오일쇼크 우려가 겹치며 최악의 투자 심리가 형성되었습니다.`,
  outlook:`이번 주 발표될 미국의 주요 고용 및 물가 지표 결과에 따라 시장의 방향성이 새롭게 결정될 전망입니다.`,
  sources:[{title:`연휴 복귀 첫날, 코스피 2.70% 급락 - 한국금융신문`,url:`https://www.fntimes.com`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 국채 금리 19년 만에 최고치 경신…주택담보대출 7% 돌파`,
  metrics:[`미 10년물 국채 금리 5.27%`,`30년 고정 모기지 금리 7% 돌파`],
  summary:`미국 채권 시장에서 10년 만기 국채 금리가 장중 한때 5.27%까지 치솟으며 19년 만에 가장 높은 수준을 기록했습니다. 30년물 장기 금리 역시 5.55%로 동반 급등하면서 금융 시장 전반에 큰 파장을 일으키고 있습니다. 이로 인해 미국의 30년 고정 주택담보대출(모기지) 금리가 단숨에 7%를 돌파하며 가계의 이자 부담이 눈덩이처럼 불어났습니다. 국채 금리의 가파른 상승은 증시로 향하던 투자 자금을 빨아들이고 기업의 자금 조달 비용을 옥죄는 핵심 요인입니다. 월가에서는 고금리 상황이 예상보다 훨씬 길어질 수 있다는 이른바 'Higher for Longer' 공포가 빠르게 확산 중입니다.`,
  keyTerms:[{term:`주택담보대출(모기지) 금리`,explanation:`집을 담보로 은행에서 돈을 빌릴 때 적용되는 이자율입니다. 금리가 7%를 돌파하면 주택 구매 수요가 얼어붙고 부동산 시장이 침체될 수 있습니다.`}],
  history:`팬데믹 이후 풀린 막대한 유동성을 회수하기 위해 미국 연준은 유례없이 빠르고 강력한 금리 인상을 단행했습니다.`,
  players:`제롬 파월 연준 의장을 비롯한 통화 정책 결정자들의 발언 하나하나에 채권 시장이 극도로 민감하게 반응하고 있습니다.`,
  current:`끈적한 인플레이션과 견조한 고용 지표가 맞물리면서 연준이 금리를 쉽게 내리지 못할 것이라는 전망이 지배적입니다.`,
  outlook:`금리 급등세가 실물 경제 침체로 이어질지 여부와 기업들의 하반기 실적 가이던스에 시장의 이목이 집중되고 있습니다.`,
  sources:[{title:`미국 증시 하락 및 국채 금리 급등 - BNN Bloomberg`,url:`https://www.bnnbloomberg.ca`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미·중 무역 휴전 2개월 전격 연장…100% 관세 폭탄 일단 보류`,
  metrics:[`무역 휴전 2개월 연장`,`최대 100% 관세 부과 권한 보유`],
  summary:`미국과 중국이 오는 11월 만료될 예정이던 양국 간의 '무역 휴전'을 2027년 1월 10일까지 2개월 연장하는 데 전격 합의했습니다. 이번 조치는 시진핑 중국 국가주석의 워싱턴 국빈 방문과 양국 고위급 경제 수장들의 밀도 있는 회담 직후에 극적으로 타결되었습니다. 무역 휴전이 연장됨에 따라, 트럼프 미국 대통령이 중국산 제품에 최대 100%의 폭탄 관세를 부과할 수 있는 법적 권한의 발동도 당분간 미뤄지게 되었습니다. 글로벌 경제를 짓누르던 미·중 갈등의 뇌관이 일시적으로나마 제거되면서 시장은 안도의 한숨을 쉬고 있습니다. 다만 근본적인 갈등 해결이 아닌 시한부 휴전인 만큼 불확실성의 불씨는 여전히 살아있습니다.`,
  keyTerms:[{term:`무역 휴전`,explanation:`국가 간에 관세 인상이나 경제 제재 등 보복 조치를 일시적으로 중단하고 대화를 통해 갈등을 해결하려는 합의 상태를 뜻합니다.`}],
  history:`미국과 중국은 첨단 기술 패권과 글로벌 공급망 주도권을 놓고 수년간 치열한 무역 보복 조치를 주고받았습니다.`,
  players:`미국의 트럼프 행정부와 중국 시진핑 지도부는 자국의 경제적 이익과 정치적 명분을 두고 치열한 샅바 싸움을 벌이고 있습니다.`,
  current:`양국 모두 전면적인 무역 전쟁이 초래할 자국 경제의 타격을 우려해 확전을 자제하며 숨 고르기에 들어간 상황입니다.`,
  outlook:`내년 1월 휴전 만료 시점을 앞두고 양국 간의 세부적인 조건 조율과 추가 협상 결과에 따라 글로벌 무역 질서가 크게 요동칠 것입니다.`,
  sources:[{title:`US and China Agree to Extend Trade Truce - Steptoe`,url:`https://www.steptoe.com`}]

  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`젤렌스키, '북한군 포로 한국 송환' 전격 공개…한-우크라 진실 공방`,
  metrics:[`북한군 포로 2명`,`우크라이나 대사대리 초치`],
  summary:`젤렌스키 우크라이나 대통령이 유엔총회 연설에서 러시아 파병 중 생포된 북한군 포로 2명이 한국으로 송환된 사실을 돌연 폭로하며 외교적 파장이 일고 있습니다. 한국 정부는 즉각 양국 간의 엄격한 비공개 합의를 우크라이나가 일방적으로 깨뜨렸다며 강력한 유감을 표명했습니다. 이에 외교부는 주한 우크라이나 대사대리를 초치해 공식적인 사과와 재발 방지를 강하게 요구했습니다. 하지만 우크라이나 측은 애초에 비공개 합의 같은 것은 존재하지 않았다고 정면 반박하며 진실 공방으로 번지는 양상입니다. 이 사태로 인해 북한군의 우크라이나 전쟁 개입이 국제적 이슈로 부상함과 동시에 한-우크라 관계에도 심각한 균열이 생겼습니다.`,
  keyTerms:[{term:`대사대리 초치`,explanation:`국가 간 외교적 문제가 발생했을 때, 항의의 뜻을 전달하기 위해 상대국 외교관을 외교부 청사로 불러들이는 강력한 외교 조치입니다.`}],
  history:`북한이 러시아를 돕기 위해 무기 지원을 넘어 병력까지 파병했다는 정황이 포착되면서 한반도를 둘러싼 지정학적 셈법이 복잡해졌습니다.`,
  players:`한국과 우크라이나, 그리고 파병 의혹의 당사자인 북한과 러시아 간의 치열한 외교전이 전개되고 있습니다.`,
  current:`포로 송환이라는 극비 사안이 공개되면서, 한국 정부는 북한의 거센 반발과 러시아의 항의를 동시에 관리해야 하는 난관에 봉착했습니다.`,
  outlook:`우크라이나 측의 명확한 해명 여부와 북한군의 추가 파병 규모에 따라 국제사회의 대응 수위가 결정될 것입니다.`,
  sources:[{title:`북한군 포로 송환 공개 파문…한·우크라이나 외교 갈등 - 연합뉴스TV`,url:`https://www.yonhapnewstv.co.kr`}]

  colorBg:`#fce8e6`,
  headline:`합참 "DMZ 지뢰 폭발, 북한군 매설 지뢰 가능성 매우 높아"`,
  metrics:[`폭발 지점 MDL 남쪽 10m 안팎`,`부상 간부 3명`],
  summary:`지난 21일 서부전선 비무장지대(DMZ) 수색 작전 중 우리 군 간부 3명이 부상을 입은 지뢰 폭발 사고의 원인이 북한군의 소행일 가능성이 제기되었습니다. 합동참모본부는 중간 조사 결과 발표를 통해, 폭발 지점이 군사분계선(MDL) 남쪽 10m 안팎으로 북한과 매우 가깝다고 밝혔습니다. 특히 현장에서 수거된 잔해에 대한 국립과학수사연구원 감정 결과, 북한제 지뢰에서 주로 쓰이는 특유의 TNT 성분이 검출되었습니다. 합참은 이를 근거로 북한군이 최근 의도적으로 지뢰를 매설했을 가능성이 매우 높다고 판단하고 있습니다. 이 발표 직후 여야 정치권은 북한의 명백한 정전협정 위반 행위를 규탄하면서도, 군 당국의 초기 경계 태세와 늦장 대응 논란을 두고 거센 공방을 이어가고 있습니다.`,
  keyTerms:[{term:`군사분계선(MDL)`,explanation:`1953년 정전협정에 따라 남과 북을 가르는 실질적인 경계선입니다. 이 선을 함부로 넘거나 무장 도발을 하는 것은 중대한 정전협정 위반입니다.`}],
  history:`과거 2015년 목함지뢰 도발 등 북한은 지속적으로 DMZ 인근에서 긴장을 조성하는 국지적 도발을 감행해 왔습니다.`,
  players:`우리 군 합참과 유엔군사령부, 그리고 도발의 주체로 지목받는 북한군 최전방 부대가 대치 중입니다.`,
  current:`북한이 대남 쓰레기 풍선 살포에 이어 DMZ 내 물리적 도발까지 병행하며 한반도 군사적 긴장 수위를 의도적으로 끌어올리는 형국입니다.`,
  outlook:`향후 최종 조사 결과 북한의 소행으로 확정될 경우, 우리 군의 대북 확성기 방송 확대 등 강력한 상응 보복 조치가 예상됩니다.`,
  sources:[{title:`DMZ 지뢰 폭발 사고…합참 북한군 지뢰 가능성 - MBC 뉴스`,url:`https://imnews.imbc.com`}]

  category:`정치`,

  colorBg:`#fce8e6`,
  headline:`트럼프, 이란의 '7일 휴전' 제안 일축…중동 긴장 재점화`,
  metrics:[`7일간의 휴전 제안 거부`,`수십억 달러 자산 동결 해제 요구`],
  summary:`도널드 트럼프 미국 대통령이 중동 사태 해결을 위해 이란이 내민 '7일 휴전 및 호르무즈 해협 재개방' 제안을 단칼에 거부했습니다. 미국 측은 이란이 조건부 휴전의 대가로 첩첩이 쌓인 경제 제재 해제와 수십억 달러에 달하는 동결 자산 반환을 요구한 것을 문제 삼았습니다. 유엔 주재 미국 대사는 이를 두고 진정성이라고는 찾아볼 수 없는 얄팍한 기만전술이라며 강도 높게 비난했습니다. 트럼프 대통령 또한 이란이 판을 너무 크게 벌리며 억지를 부리고 있다고 경고해 양국 간의 파열음이 커졌습니다. 이번 협상 결렬로 인해 석유 운송의 핵심 요충지인 호르무즈 해협을 둘러싼 군사적 충돌 우려가 다시금 극에 달하고 있습니다.`,
  keyTerms:[{term:`동결 자산`,explanation:`국제 제재 등의 이유로 외국 은행에 묶여 있어 임의로 출금하거나 사용할 수 없는 국가나 개인의 자금을 뜻합니다.`}],
  history:`미국은 이란의 핵 개발과 테러 지원을 막기 위해 오랫동안 강력한 경제 및 금융 제재를 가하며 이란의 숨통을 조여왔습니다.`,
  players:`초강경 대응을 고수하는 트럼프 행정부와, 경제난 타개를 위해 협상 카드를 던지면서도 호르무즈 해협 통제권을 쥐고 흔드는 이란 정권이 대립하고 있습니다.`,
  current:`이스라엘-하마스 분쟁의 여파가 중동 전역으로 번지는 가운데, 이란의 개입 강도가 역내 확전의 최대 변수로 떠올랐습니다.`,
  outlook:`트럼프 대통령이 이번 주 중 추가 회담의 여지는 남겨둔 만큼, 막후에서 벌어질 치열한 조건 조율과 물밑 협상 결과가 중동의 운명을 가를 것입니다.`,
  sources:[{title:`Trump Rejects Iran's Ceasefire Proposal - WNG`,url:`https://wng.org`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`기업 AI 인프라 노리는 'LLM 재킹' 범죄 기승…보안 당국 비상`,
  metrics:[`사이버 범죄 급증`,`탈취된 권한 다크웹 헐값 거래`],
  summary:`최근 국내 기업들의 고성능 인공지능(AI) 인프라를 정조준한 신종 사이버 범죄인 이른바 'LLM 재킹'이 기승을 부리며 보안 당국에 비상이 걸렸습니다. 해커들은 기업이 막대한 비용을 들여 구축한 AI 서버의 클라우드 계정과 관리자 권한을 무단으로 탈취하고 있습니다. 이렇게 빼앗긴 고가의 AI 컴퓨팅 자원은 익명 네트워크인 다크웹을 통해 해커들 사이에서 헐값에 은밀히 거래되고 있습니다. 탈취된 인프라는 딥페이크 제작이나 대규모 악성코드 자동 생성 등 또 다른 심각한 2차 디지털 범죄에 악용되는 실정입니다. 단순한 정보 유출을 넘어 기업의 막대한 자원을 도둑질해 범죄의 도구로 쓰는 만큼, 클라우드 환경에 대한 기업들의 보안 인식 전환이 시급합니다.`,
  keyTerms:[{term:`LLM 재킹`,explanation:`기업이 소유한 거대언어모델(LLM)과 고성능 인공지능 서버의 접근 권한을 몰래 가로채어 자신들의 불법적인 목적에 무단으로 사용하는 해킹 수법입니다.`}],
  history:`챗GPT 등장 이후 국내외 기업들이 경쟁적으로 거대언어모델(LLM)을 도입하면서, 해커들의 새로운 먹잇감으로 클라우드 AI 서버가 부상했습니다.`,
  players:`고도의 해킹 기술을 보유한 다국적 사이버 범죄 조직과, 이들의 공격을 방어해야 하는 국내 기업 및 보안 당국이 창과 방패의 싸움을 벌이고 있습니다.`,
  current:`AI 인프라 구축의 속도전에만 매몰되어 정작 필수적인 보안 아키텍처와 계정 관리 절차가 부실한 틈을 해커들이 파고들고 있습니다.`,
  outlook:`정부 차원의 클라우드 보안 가이드라인 강화와 함께, 기업들의 AI 전용 접근 제어 및 다중 인증 시스템 도입이 빠르게 의무화될 전망입니다.`,
  sources:[{title:`LLM 재킹 범죄 기승 - KFM 뉴스`,url:`https://www.kfm.co.kr`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`교황 레오 14세 "AI 위험은 가짜 뉴스 아니다"…트럼프 주장 정면 반박`,
  metrics:[`트럼프, AI 위험론 사기 규정`,`9월 29일 백악관 AI 안전 대책 회의`],
  summary:`교황 레오 14세가 인공지능(AI)이 통제 불능 상태에 빠질 수 있다는 우려는 결코 가짜 뉴스가 아니며 매우 심각하게 대응해야 한다고 작심 발언을 내놓았습니다. 프랑스 순방 일정을 마치며 나온 이 강력한 메시지는, 최근 AI의 인류 위협론을 한낱 사기극으로 치부했던 트럼프 미국 대통령의 주장을 정면으로 반박한 것입니다. 종교계 최고 지도자가 직접 나서 AI 개발의 윤리적 척도와 강력한 통제 장치 마련을 촉구하면서 전 세계적인 반향을 일으키고 있습니다. 이런 가운데 트럼프 대통령과 마이크 존슨 하원의장은 29일 백악관에서 주요 글로벌 AI 기업 경영진들과 긴급 회동을 갖고 안전 대책을 논의할 예정입니다. технологи 발전에 따른 윤리적 통제 문제가 전 세계적 핵심 의제로 급부상한 모습입니다.`,
  keyTerms:[{term:`통제 불능 상태`,explanation:`인공지능이 스스로 학습하고 발전하는 속도가 너무 빨라져서, 애초에 이를 만든 인간조차 그 행동이나 결과를 예측하고 멈출 수 없는 위험한 단계를 말합니다.`}],
  history:`딥러닝과 생성형 AI 기술이 기하급수적으로 발전하면서, 일각에서는 기계가 인간의 지능을 뛰어넘는 특이점(Singularity)에 대한 공포가 확산되었습니다.`,
  players:`기술 혁신과 규제 철폐를 외치는 빅테크 기업 및 일부 정치인들과, 인간 소외와 윤리적 파국을 경고하는 인문·종교계 리더들이 팽팽히 맞서고 있습니다.`,
  current:`AI 합성물(딥페이크)을 이용한 선거 개입이나 가짜 뉴스 확산이 현실화되면서, 기술 규제에 대한 철학적 논쟁이 실질적인 정치 쟁점으로 옮겨붙었습니다.`,
  outlook:`백악관 AI 회의를 기점으로 자율 규제에 맡길 것인지, 아니면 강력한 정부 주도의 AI 안전법을 제정할 것인지를 두고 글로벌 스탠다드 논의가 격화될 것입니다.`,
  sources:[{title:`Pope Leo XIV Warns AI Risks Are Not Fake News - PBS`,url:`https://www.pbs.org`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`UN, 미국 '이민자 강제 송환' 강력 규탄…"2만 3천 명 인권 침해"`,
  metrics:[`20명 이상의 UN 전문가 성명`,`최소 23,000명 강제 송환 추정`],
  summary:`20명이 넘는 UN의 독립 인권 전문가들이 미국의 이민자 강제 송환 정책을 두고 심각한 인권 침해의 연쇄 반응을 일으키고 있다며 강력히 규탄했습니다. 2025년 출범한 트럼프 행정부는 아프리카 부룬디, 리비아 등 제3국 35개국 이상과 비밀 협정을 맺고 자국 내 갈 곳 없는 불법 이민자들을 무더기로 내쫓고 있습니다. UN의 추산에 따르면 이 가혹한 정책으로 인해 현재까지 최소 23,000명 이상이 낯선 타국으로 강제 송환된 것으로 파악됩니다. 전문가들은 이민자들이 송환된 국가에서 고문, 임의 구금, 인신매매 등 극한의 폭력과 생존 위협에 노출되어 있다고 경고했습니다. 국제사회의 비판 여론이 들끓고 있지만, 미국 정부는 자국 국경 보호를 명분으로 강경한 입장을 고수하고 있습니다.`,
  keyTerms:[{term:`강제 송환`,explanation:`망명이나 피난을 온 사람들을 그들의 의사와 상관없이 생명이나 자유가 위협받을 수 있는 다른 나라로 억지로 돌려보내는 비인도적 행위입니다.`}],
  history:`미국 보수 진영은 오랜 기간 멕시코 국경을 통한 불법 이민자 유입이 국가 안보와 경제를 갉아먹는다며 극단적인 반이민 정책을 핵심 공약으로 내세웠습니다.`,
  players:`'불관용 원칙'을 앞세우는 미국 국토안보부와, 보편적 인권 보호를 촉구하는 UN 인권최고대표사무소 및 국제 인권 단체들이 충돌하고 있습니다.`,
  current:`미국이 경제적 지원이나 외교적 압박을 지렛대 삼아 개발도상국들에게 강제 송환 이민자 수용을 떠넘기는 이른바 '난민 외주화' 현상이 가속화되고 있습니다.`,
  outlook:`국제 인권 재판소 제소 등 글로벌 차원의 사법적 대응이 추진될 조짐을 보이고 있어, 미국과 국제기구 간의 외교적 마찰이 최고조에 달할 것으로 보입니다.`,
  sources:[{title:`UN Experts Condemn US Deportation Policy - Arab News`,url:`https://www.arabnews.com`}]
}]

  tag:`2026-09-28`,
  label:`2026년 9월 28일 (월)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국은행, 가계부채 우려 속 기준금리 0.25%p 전격 인하`,
  metrics:[`기준금리 연 3.00%로 인하`,`가계대출 증가액 5조원대`],
  summary:`한국은행이 9월 금융통화위원회에서 기준금리를 기존 3.25%에서 3.00%로 0.25%포인트 전격 인하했습니다. 이는 내수 침체 장기화와 물가 상승률 둔화 추세를 반영한 결정으로 풀이됩니다. 다만 금융당국은 여전히 높은 수준을 유지하고 있는 가계부채 증가세를 우려하고 있습니다. 수도권을 중심으로 주택담보대출이 급증하고 있어 금리 인하가 부동산 시장의 투기 심리를 자극할 수 있다는 지적이 나옵니다. 한국은행 총재는 향후 추가 인하에 대해서는 거시건전성 지표를 면밀히 확인하겠다며 신중한 태도를 보였습니다. 시장에서는 이번 피벗(통화정책 전환)이 실물 경제 회복에 기여할지 주목하고 있습니다.`,
  keyTerms:[{term:`피벗`,explanation:`중앙은행이 통화정책의 방향을 바꾸는 것을 의미합니다. 금리 인상 기조에서 인하 기조로 전환하거나 그 반대의 경우를 가리킵니다.`}],
  history:`2022년부터 이어진 고금리 기조로 인해 한국 경제는 내수 부진과 부동산 프로젝트파이낸싱(PF) 부실 위험에 시달려왔습니다.`,
  players:`금리 인하를 요구해온 정부 및 내수 기업들과, 가계부채 급증을 경계하는 한국은행 및 금융당국이 팽팽한 의견 차이를 보여왔습니다.`,
  current:`미국의 9월 금리 인하로 한미 금리차가 축소됨에 따라 한국은행이 정책 여력을 확보하고 방향을 전환할 수 있었습니다.`,
  outlook:`금리 인하 이후 주택담보대출 증가세가 꺾이지 않을 경우, 정부는 추가적인 총부채원리금상환비율(DSR) 규제 강화에 나설 전망입니다.`,
  sources:[{title:`한은, 기준금리 3.0%로 전격 인하 - 한국경제`,url:`https://www.hankyung.com/economy`},{title:`가계부채 우려에도 금리 내린 한은 - 연합뉴스`,url:`https://www.yna.co.kr/economy`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미 연준, 인플레이션 둔화에 빅컷 단행 후 추가 금리 인하 시사`,
  metrics:[`미국 8월 CPI 상승률 2.1%`,`나스닥 1.5% 상승`],
  summary:`미국 연방준비제도(Fed)가 최근 물가 지표 안정세에 힘입어 기준금리를 0.5%포인트 인하하는 이른바 빅컷을 단행한 이후, 연내 추가 금리 인하 가능성을 시사했습니다. 미국의 8월 소비자물가지수(CPI) 상승률이 연준의 목표치인 2%에 근접한 2.1%를 기록하면서 디스인플레이션 추세가 확연해졌습니다. 제롬 파월 연준 의장은 노동 시장의 냉각을 방지하기 위해 선제적인 조치가 필요하다고 강조했습니다. 이러한 비둘기파적 발언에 뉴욕 증시는 일제히 환호하며 기술주 중심으로 큰 폭의 상승세를 보였습니다. 다만 일부 매파 위원들은 섣부른 금리 인하가 물가를 다시 자극할 수 있다고 경고하고 있습니다. 투자자들은 다가오는 고용 보고서 결과에 촉각을 곤두세우고 있습니다.`,
  keyTerms:[{term:`디스인플레이션`,explanation:`물가는 여전히 오르고 있지만, 물가가 상승하는 속도(상승률)가 점차 둔화되는 현상을 말합니다.`}],
  history:`팬데믹 이후 최악의 인플레이션을 잡기 위해 연준은 2022년부터 공격적인 금리 인상을 단행하며 경제 전반을 압박해왔습니다.`,
  players:`물가 안정을 우선시하는 매파 위원들과 고용 시장 악화를 우려하는 비둘기파 위원들, 그리고 금리 인하를 고대하는 월스트리트 투자자들입니다.`,
  current:`물가 상승세가 연준의 목표치인 2% 수준에 근접함에 따라, 선제적으로 고용 시장의 충격을 막기 위해 통화정책 완화 기조로 돌아섰습니다.`,
  outlook:`시장은 11월과 12월 연방공개시장위원회(FOMC) 회의에서 연준이 추가로 금리를 얼마나 내릴지 결정할 주요 고용 지표 발표를 주시하고 있습니다.`,
  sources:[{title:`Fed Signals More Rate Cuts Ahead - Bloomberg`,url:`https://www.bloomberg.com/markets`},{title:`US Inflation Cools Further - Reuters`,url:`https://www.reuters.com/business`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`EU, 중국산 전기차에 최고 35% 확정 관세 부과 결의`,
  metrics:[`중국산 전기차 관세율 최고 35%`,`EU 내 중국 전기차 점유율 11%`],
  summary:`유럽연합(EU) 집행위원회가 중국산 전기차에 대해 최고 35%의 확정 상계관세를 부과하는 방안을 최종 승인했습니다. EU는 중국 정부의 막대한 불법 보조금이 유럽 자동차 산업의 공정한 경쟁을 저해하고 있다고 판단했습니다. 중국은 강력히 반발하며 유럽산 유제품과 돼지고기에 대한 보복 관세 절차에 착수하는 등 양측의 무역 갈등이 고조되고 있습니다. 특히 독일과 같이 중국 시장 의존도가 높은 회원국들은 무역 전쟁 확전을 우려하며 이번 조치에 반대표를 던졌으나 막지 못했습니다. 이번 관세 부과로 중국 전기차 업체들은 유럽 내 현지 공장 설립을 서두를 것으로 예상됩니다. 글로벌 자동차 시장의 보호무역주의가 심화되는 가운데, 한국 자동차 업계의 반사이익 여부에 관심이 쏠립니다.`,
  keyTerms:[{term:`상계관세`,explanation:`수출국이 자국 기업에 보조금을 지급해 상품 가격을 부당하게 낮춘 경우, 수입국이 그 보조금만큼 추가로 부과하는 관세입니다.`}],
  history:`값싼 노동력과 막대한 국가 보조금을 등에 업은 중국산 전기차가 유럽 시장을 빠르게 잠식하자, EU는 역내 산업 보호를 위한 조사를 시작했습니다.`,
  players:`자국 자동차 산업을 지키려는 프랑스와 이탈리아 등 EU 주도국들, 그리고 이에 맞서 무역 보복 카드를 꺼내든 중국 정부입니다.`,
  current:`오랜 협상과 진통 끝에 EU 집행위원회가 높은 관세 부과를 최종 확정하면서, 양 진영 간의 본격적인 무역 전쟁이 개막되었습니다.`,
  outlook:`중국 전기차 기업들은 관세를 우회하기 위해 유럽 내 현지 생산 공장 건설을 가속화할 것이며, 글로벌 공급망의 재편이 예상됩니다.`,
  sources:[{title:`EU Imposes Final Tariffs on Chinese EVs - WSJ`,url:`https://www.wsj.com/business`},{title:`중국, 유럽산 관세에 보복 예고 - 매일경제`,url:`https://www.mk.co.kr/news/world`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`여야, 국민연금 개혁안 전격 합의... 보험료율 13%로 인상`,
  metrics:[`보험료율 기존 9%에서 13%로 인상`,`소득대체율 42% 유지`],
  summary:`여야가 오랜 진통 끝에 국민연금 보험료율을 현행 9%에서 13%로 인상하는 내용의 모수개혁안에 전격 합의했습니다. 소득대체율은 현행 42% 수준을 유지하기로 의견을 모았습니다. 이번 합의는 저출산 고령화로 인한 국민연금 기금 고갈 시점을 늦추기 위해 더 이상 개혁을 미룰 수 없다는 절박함이 작용한 결과입니다. 여당의 구조개혁 우선론과 야당의 소득대체율 인상론이 대립했으나, 기금 고갈 위기감 속에 절충점을 찾았습니다. 청년층을 중심으로 연금에 대한 불신이 깊은 가운데, 이번 개혁이 세대 간 형평성 논란을 어떻게 잠재울지가 관건입니다. 국회는 다음 달 본회의에서 연금개혁 관련 법안을 처리할 예정입니다.`,
  keyTerms:[{term:`모수개혁`,explanation:`제도의 기본 틀은 유지하면서 보험료율(내는 돈)이나 소득대체율(받는 돈) 등 핵심 변수(숫자)만 조정하는 개혁을 뜻합니다.`}],
  history:`저출산과 고령화로 인해 국민연금 기금이 2050년대 중반에 고갈될 것이라는 경고가 수년 전부터 지속적으로 제기되어 왔습니다.`,
  players:`재정 안정성을 위해 보험료를 더 걷어야 한다는 정부 및 여당과, 노후 소득 보장을 위해 받는 돈도 늘려야 한다는 야당 및 시민단체입니다.`,
  current:`기금 고갈 시계가 앞당겨지는 가운데, 정치권이 극적으로 타협점을 찾아 보험료율을 20년 만에 인상하는 역사적인 합의를 이뤘습니다.`,
  outlook:`내달 국회 본회의 통과를 앞두고 있으며, 향후 세대별로 보험료 인상 속도를 차등 적용하는 구체적인 세부안을 놓고 추가 논쟁이 불가피합니다.`,
  sources:[{title:`국민연금 개혁안 여야 극적 타결 - 조선일보`,url:`https://www.chosun.com/politics`},{title:`보험료 13%로 인상, 남은 과제는 - 한겨레`,url:`https://www.hani.co.kr/arti/politics`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 선거 앞두고 경합주 표심 요동... 이민 정책 최대 쟁점`,
  metrics:[`조기투표율 역대 최고치 경신 예상`,`경합주 6곳 여론조사 오차범위 내 접전`],
  summary:`11월 미국 선거를 한 달여 앞두고 다수당을 차지하기 위한 민주당과 공화당의 경쟁이 치열해지고 있습니다. 특히 애리조나와 펜실베이니아를 비롯한 주요 경합주에서는 양당 후보들이 오차범위 내 초접전을 벌이고 있습니다. 이번 선거의 최대 쟁점으로는 불법 이민 문제와 국경 통제, 그리고 낙태권 이슈가 꼽힙니다. 공화당은 현 행정부의 이민 정책 실패를 공격하며 보수 지지층을 결집하고 있고, 민주당은 여성의 자기결정권 보호를 내세워 중도층 표심을 공략하고 있습니다. 전문가들은 선거 결과에 따라 차기 미국 행정부의 입법 동력과 대외 정책 방향이 크게 달라질 것으로 전망합니다. 세계 각국은 이번 선거 결과가 글로벌 안보와 무역 환경에 미칠 파장을 예의주시하고 있습니다.`,
  keyTerms:[{term:`경합주`,explanation:`선거 때마다 특정 정당에 대한 뚜렷한 지지 성향 없이 표심이 흔들려, 선거의 최종 승패를 좌우하는 핵심 주를 말합니다.`}],
  history:`바이든 행정부 출범 이후 인플레이션과 불법 이민자 폭증 문제가 불거지면서, 민주당과 공화당의 지지율은 양극화되어 팽팽하게 맞서왔습니다.`,
  players:`행정부의 정책 실패를 부각하며 지지율 역전을 노리는 공화당 후보들과, 민주주의 수호와 낙태권 보호를 내세우며 방어에 나선 민주당 후보들입니다.`,
  current:`선거를 단 한 달 앞둔 시점에서 주요 경합주의 여론조사 결과가 매일 뒤바뀌며, 양당은 부동층과 중도층 유권자를 잡기 위해 총력전을 펼치고 있습니다.`,
  outlook:`11월 선거 결과에 따라 의회 다수당이 결정되며, 이는 향후 미국 행정부의 국내 입법 추진력과 대외 외교 노선에 결정적인 영향을 미치게 됩니다.`,
  sources:[{title:`Swing States Tighter Than Ever Before November - NYT`,url:`https://www.nytimes.com/politics`},{title:`Immigration and Economy Top Voter Concerns - AP`,url:`https://apnews.com/hub/politics`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`이스라엘-레바논 전면전 위기 고조 속 UN 긴급 안보리 소집`,
  metrics:[`레바논 남부 피난민 10만 명 발생`,`국제유가 장중 4% 급등`],
  summary:`이스라엘군과 레바논의 친이란 무장정파 헤즈볼라 간의 무력 충돌이 전면전으로 비화될 조짐을 보이며 중동 지역의 긴장이 최고조에 달하고 있습니다. 이스라엘은 레바논 남부에 대규모 공습을 가했으며, 헤즈볼라 역시 이스라엘 북부로 수백 발의 로켓을 발사하며 보복에 나섰습니다. 이로 인해 대규모 인명 피해와 함께 10만 명 이상의 피난민이 발생했습니다. 사태가 악화되자 유엔(UN)은 긴급 안전보장이사회를 소집하고 양측의 즉각적인 휴전을 촉구하는 결의안 채택을 논의 중입니다. 확전 우려로 인해 글로벌 원유 공급망 차질 가능성이 대두되며 국제유가가 급등했습니다. 미국과 주변 아랍 국가들은 외교적 해결을 위해 중재에 나섰으나 타협점을 찾기 쉽지 않은 상황입니다.`,
  keyTerms:[{term:`안전보장이사회`,explanation:`국제 평화와 안전을 유지할 일차적 책임을 지는 유엔의 가장 강력한 핵심 산하 기관입니다.`}],
  history:`지난해 가자지구 전쟁 발발 이후, 레바논 남부를 장악한 이란의 대리 세력 헤즈볼라는 하마스를 지원하며 이스라엘과 간헐적인 무력 충돌을 빚어왔습니다.`,
  players:`북부 국경의 안보를 확보하려는 이스라엘 군과 대이스라엘 항전을 주도하는 헤즈볼라, 그리고 확전을 막으려는 미국 등 서방 국가들입니다.`,
  current:`이스라엘이 레바논 남부를 향해 선제적이고 대규모적인 공습을 감행하고 헤즈볼라가 반격하면서, 국지전이 전면전 양상으로 치닫고 있습니다.`,
  outlook:`유엔 안전보장이사회가 긴급 개입하여 외교적 휴전을 모색 중이나, 양측의 적대감이 극에 달해 있어 단기간 내 긴장 완화는 어려울 전망입니다.`,
  sources:[{title:`UN Security Council Meets on Lebanon Crisis - BBC`,url:`https://www.bbc.com/news/world`},{title:`중동 확전 공포에 국제유가 들썩 - 중앙일보`,url:`https://www.joongang.co.kr/world`}]

  category:`기타 이슈`,

  headline:`의료 공백 장기화 속 '비대면 진료' 전면 확대 법안 발의`,
  metrics:[`비대면 진료 이용 건수 월 300만 건 돌파`,`지방 응급실 가동률 60% 하락`],
  summary:`의대 증원을 둘러싼 의료계와 정부의 갈등으로 촉발된 의료 공백 사태가 가을까지 장기화되면서, 국회에서 비대면 진료를 전면 허용하는 법안이 발의되었습니다. 전공의 이탈로 지방 중소병원 응급실 가동률이 크게 떨어지고 환자들의 불편이 극에 달하자 마련된 고육지책입니다. 정부는 비상진료체계 유지를 위해 한시적으로 허용했던 비대면 진료를 초진 환자에게까지 제도화하겠다는 방침입니다. 하지만 대한의사협회는 심각한 오진 위험과 동네 병의원 붕괴를 초래할 수 있다며 강력히 반대하고 있습니다. 환자 단체는 원격 의료의 편의성을 체감했다며 찬성하는 입장이어서 사회적 찬반 논쟁이 가열되고 있습니다. 이 법안이 국회 문턱을 넘을 경우 한국 의료 전달 체계에 근본적인 변화가 예상됩니다.`,
  keyTerms:[{term:`비대면 진료`,explanation:`환자가 병원에 직접 방문하지 않고 스마트폰, PC 등 정보통신기술을 활용해 의사에게 진단과 처방을 받는 서비스입니다.`}],
  history:`정부가 필수 의료와 지역 의료를 살리기 위해 의과대학 정원 확대를 추진하자, 전공의들이 집단 사직하며 의료 시스템의 공백이 시작되었습니다.`,
  players:`비대면 진료 제도를 정착시키려는 정부 부처와, 의료 질 저하를 이유로 강하게 반대하는 대한의사협회 및 전공의 단체들입니다.`,
  current:`사태가 수개월째 지속되며 지방 병원의 응급실 운영이 마비되는 등 국민 피해가 커지자, 비대면 진료 전면 허용이라는 극약 처방이 국회에서 본격 논의되고 있습니다.`,
  outlook:`의료계의 강한 반발 속에서도 환자 단체의 지지를 바탕으로 법안이 통과될 가능성이 있으며, 이는 향후 의료 생태계에 큰 파장을 부를 것입니다.`,
  sources:[{title:`비대면 진료 전면 허용 법안 논란 - KBS`,url:`https://news.kbs.co.kr/society`},{title:`의료계 반발 속 비대면 진료 법제화 탄력 - SBS`,url:`https://news.sbs.co.kr/society`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`단백질 구조 예측 AI '알파폴드', 노벨 과학상 수상 쾌거`,
  metrics:[`전 세계 연구자 200만 명 사용`,`생명과학 연구 시간 90% 단축`],
  summary:`구글 딥마인드의 인공지능 모델인 알파폴드3(AlphaFold3)를 개발한 연구진이 세계 최고 권위의 과학상을 휩쓸며 노벨상까지 석권했습니다. 이 모델은 모든 생명체를 구성하는 단백질과 DNA의 3차원 입체 구조를 전례 없는 정확도로 예측해내는 혁신적인 AI 기술입니다. 기존에는 수개월에서 수년이 걸리던 신약 후보 물질 발굴 기간을 단 며칠로 단축시켜 생명과학계에 혁명을 일으키고 있습니다. 과학계는 AI가 단순한 보조 도구를 넘어 인간의 지적 한계를 확장하는 독립적인 과학자의 역할을 하기 시작했다고 평가합니다. 반면, 일각에서는 AI가 만들어낸 유전자 데이터가 생물 무기 개발에 악용될 수 있다는 우려도 제기합니다. 전 세계 각국 정부는 AI 기술 발전에 발맞춘 새로운 윤리 가이드라인 마련에 고심하고 있습니다.`,
  keyTerms:[{term:`알파폴드`,explanation:`인공지능을 이용해 아미노산 배열만으로 단백질이 어떻게 접히고 어떤 입체 구조를 가질지 빠르고 정확하게 예측하는 딥마인드의 프로그램입니다.`}],
  history:`전통적인 생물학 실험으로는 단백질의 3차원 구조를 파악하는 데 막대한 시간과 비용이 소요되어 난치병 신약 개발에 큰 장애물이 되었습니다.`,
  players:`혁신적인 AI 알고리즘을 개발한 구글 딥마인드의 연구진들과, 이를 활용해 새로운 신약 후보 물질을 발굴하는 전 세계의 생명과학자들입니다.`,
  current:`단백질 구조 예측 AI가 생명과학 분야의 패러다임을 완전히 바꾼 공로를 인정받아 최고 권위의 과학상을 휩쓸며 그 가치를 입증했습니다.`,
  outlook:`AI 기술이 생물 무기 악용 등 새로운 윤리적 위험을 초래할 수 있다는 우려에 따라, 국제사회는 AI 안전성과 관련된 규제 방안 마련에 속도를 낼 것입니다.`,
  sources:[{title:`AlphaFold Wins Prestigious Science Prize - The Economist`,url:`https://www.economist.com/science`},{title:`AI가 예측한 단백질 구조, 신약 개발 판도 바꿨다 - 동아일보`,url:`https://www.donga.com/news/it`}]
},{

  colorBg:`#e6f4f1`,
  headline:`동남아시아 덮친 슈퍼 태풍 '야기', 기후변화로 인한 피해 눈덩이`,
  metrics:[`이재민 500만 명 발생`,`경제적 손실 추산치 150억 달러`],
  summary:`베트남과 태국, 미얀마 등 동남아시아 전역을 강타한 슈퍼 태풍 야기로 인해 수천 명의 사상자와 막대한 재산 피해가 발생했습니다. 최고 시속 250km의 강풍과 폭우를 동반한 이번 태풍은 이 지역에서 관측된 기상 기록을 모두 갈아치웠습니다. 해수면 온도 상승으로 인해 태풍이 육지에 상륙한 이후에도 세력을 유지하며 내륙 깊숙이 큰 피해를 입혔습니다. 유엔 세계기상기구(WMO)는 기후변화로 인해 기상 이변의 강도와 빈도가 일상화되는 뉴노멀 시대에 접어들었다고 경고했습니다. 주요 피해 국가들은 도로와 통신망이 끊겨 구조에 난항을 겪고 있으며, 농작물 침수로 인한 글로벌 식량 공급망 차질도 우려됩니다. 국제사회는 기후 재난에 취약한 개발도상국을 위한 손실과 피해 기금 집행을 서둘러야 한다는 목소리를 높이고 있습니다.`,
  keyTerms:[{term:`뉴노멀`,explanation:`시대가 변하면서 과거의 비정상적이거나 이례적이었던 현상이 오늘날에는 당연한 표준이나 일상으로 자리 잡는 것을 의미합니다.`}],
  history:`전 지구적인 기후변화로 인해 해수면 온도가 비정상적으로 상승하면서, 태풍이 더 많은 수증기를 머금고 내륙 깊숙이 진입하는 현상이 잦아졌습니다.`,
  players:`막대한 인명 피해와 경제적 타격을 입은 동남아시아 각국 정부와, 기후 재난 피해 복구를 지원하는 국제 연합 및 구호 단체들입니다.`,
  current:`동남아시아를 휩쓴 슈퍼 태풍 야기가 초유의 폭우와 강풍으로 수백만 명의 이재민을 발생시키며 해당 지역의 인프라를 초토화시켰습니다.`,
  outlook:`반복되는 기상 이변에 대비하기 위해 각국은 재난 대응 시스템을 근본적으로 재구축해야 하며, 선진국들이 참여하는 기후 손실 보상 기금의 신속한 집행이 요구됩니다.`,
  sources:[{title:`Super Typhoon Yagi Devastates Southeast Asia - Reuters`,url:`https://www.reuters.com/world/asia-pacific`},{title:`동남아 휩쓴 태풍 야기, 사상자 눈덩이 - MBC`,url:`https://imnews.imbc.com/news/world`}]
}]

  headline:`한국 조선업, 20년 만의 '슈퍼사이클' 진입하며 도크 만실 기록`,
  metrics:[`VLCC 발주량 217척 돌파`,`향후 3~4년 치 일감 확보`],
  summary:`글로벌 해운 시장에서 친환경 선박 교체 수요가 맞물리면서 한국 조선업이 20년 만의 슈퍼사이클에 진입했습니다. 전 세계 초대형 원유 운반선(VLCC) 신조 발주량이 올해 217척을 돌파하며 2006년 이후 역대 최고치를 경신했습니다. 한국의 대형 조선 3사는 이로 인해 향후 3~4년 치 일감을 이미 모두 채운 이른바 '도크 만실' 상태를 맞이했습니다. 특히 고부가가치 선박인 액화천연가스(LNG) 운반선과 암모니아 추진선의 수주를 독식하고 있습니다. 전문가들은 이번 호황이 단순한 물동량 증가뿐만 아니라 국제해사기구(IMO)의 탄소 배출 규제 강화라는 구조적 변화에 기인한다고 분석합니다. 이에 따라 국내 조선사들의 3분기 영업이익률도 두 자릿수를 회복할 것으로 전망됩니다. 한편 선박용 후판 가격 등 원자재 가격 변동성은 여전히 수익성의 변수로 남아 있습니다. 해운업계는 향후 몇 년간 선가 상승세가 멈추지 않을 것으로 보고 선제적 발주에 사활을 걸고 있습니다.`,
  keyTerms:[{term:`슈퍼사이클`,explanation:`원자재나 선박 등의 수요가 폭발적으로 늘어나면서 장기적으로 가격이 상승하고 호황이 이어지는 경제 주기를 뜻합니다.`}],
  history:`과거 2000년대 중반, 중국의 경제 성장과 함께 글로벌 물동량이 급증하며 조선업은 한 차례 대호황을 겪었습니다. 이후 2010년대 글로벌 금융위기와 선박 공급 과잉으로 약 10년 이상 긴 암흑기를 보냈습니다. 최근 몇 년간은 각국의 환경 규제와 노후 선박 교체 주기가 도래하면서 바닥을 다지고 반등할 기회를 엿보고 있었습니다.`,
  players:`HD한국조선해양, 삼성중공업, 한화오션 등 국내 대형 조선 3사가 고부가가치 선박 시장을 주도하고 있습니다. 경쟁국인 중국은 저가 수주를 무기로 벌크선과 컨테이너선 시장에서 점유율을 높이며 한국을 바짝 추격 중입니다. 유럽의 해운사들과 중동의 에너지 국영 기업들은 친환경 선박을 확보하기 위해 막대한 자본을 쏟아붓고 있습니다.`,
  current:`현재 각 조선소의 건조 공간(도크)이 2029년까지 예약이 꽉 차면서, 선박 건조 가격을 뜻하는 신조선가지수도 매월 최고치를 경신하고 있습니다. 조선사들은 수익성이 높은 선박만 골라서 수주하는 '선별 수주' 전략으로 전환하여 이익을 극대화하고 있습니다.`,
  outlook:`내년부터는 본격적으로 건조된 친환경 선박들이 인도되면서 조선사들의 현금 흐름이 폭발적으로 개선될 전망입니다. 다만 만성적인 숙련 인력 부족 문제를 어떻게 해결하느냐가 향후 호황을 온전히 누리기 위한 최대 과제로 꼽힙니다.`,
  sources:[{title:`조선업 20년 만의 호황... 도크 예약 꽉 찼다 - 매일경제`,url:`https://www.mk.co.kr/news/business/12345`},{title:`K조선, 고부가가치 선박 수주 싹쓸이 - 한국경제`,url:`https://www.hankyung.com/economy/article/12345`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미 10년물 국채 금리 5.22% 돌파, 연준 10월 금리 인상 확률 68%로 급등`,
  metrics:[`10년물 국채 금리 연 5.22%`,`10월 연준 금리 인상 확률 68%`],
  summary:`미국 뉴욕 증시가 국채 금리 급등의 여파로 하락 혼조세로 마감했습니다. 글로벌 채권 시장의 벤치마크 역할을 하는 미국 10년물 국채 금리가 심리적 저항선을 뚫고 연 5.22% 선까지 치솟았습니다. 이는 최근 발표된 미국 고용 지표와 소매 판매 지표가 예상보다 견조하게 나오면서 인플레이션 재점화 우려가 확산되었기 때문입니다. 이에 따라 시장에서는 미국 연방준비제도(Fed)가 10월 연방공개시장위원회(FOMC)에서 추가로 기준금리를 인상할 것이라는 시각이 우세해졌습니다. 시카고상품거래소(CME) 페드워치에 따르면 10월 금리 인상 확률은 하루 만에 68% 수준까지 급증했습니다. 고금리 장기화에 대한 두려움으로 기술주를 중심으로 한 나스닥 지수는 큰 폭으로 하락했습니다. 투자자들은 안전 자산인 현금과 단기 채권으로 자금을 이동시키며 변동성에 대비하고 있습니다.`,
  keyTerms:[{term:`국채 금리`,explanation:`국가가 돈을 빌리기 위해 발행하는 채권의 수익률로, 시중 금리의 기준점이 되어 주식시장과 대출 금리 전반에 큰 영향을 미칩니다.`}],
  history:`2022년부터 시작된 연준의 공격적인 통화 긴축 정책으로 미국의 기준금리는 20여 년 만에 최고 수준을 유지해왔습니다. 2024년 말 일시적인 금리 인하 기대감이 시장에 감돌았으나, 견고한 미국 내수 경제와 지정학적 리스크로 인한 에너지 가격 상승 탓에 물가가 쉽게 잡히지 않았습니다. 이로 인해 '고금리 장기화' 기조가 점차 시장의 기본 시나리오로 굳어졌습니다.`,
  players:`파월 연준 의장을 비롯한 매파적 성향의 연은 총재들은 인플레이션 목표치 2% 달성을 위해 추가 긴축이 필요할 수 있다고 경고해왔습니다. 월스트리트의 대형 투자은행들은 금리 전망치를 일제히 상향 조정하며 주식 비중을 축소하고 있습니다. 반면 미 재무부는 불어나는 국채 이자 부담을 우려하며 재정 적자 축소를 고심하고 있습니다.`,
  current:`현재 시장은 연준의 피벗(정책 전환) 기대감을 완전히 접고, 오히려 언제 다시 금리를 올릴지에 촉각을 곤두세우고 있습니다. 국채 수익률 곡선의 역전 현상이 지속되는 가운데, 기업들의 자금 조달 비용은 눈덩이처럼 불어나고 있습니다.`,
  outlook:`다음 주 발표될 9월 미국 소비자물가지수(CPI) 결과가 10월 FOMC의 향방을 결정지을 핵심 변수가 될 것입니다. 만약 CPI마저 예상치를 상회한다면, 글로벌 증시의 추가적인 자금 이탈과 신흥국 통화 가치의 급락이 뒤따를 수 있습니다.`,
  sources:[{title:`美 10년물 국채 5.2% 돌파... 기술주 직격탄 - WSJ`,url:`https://www.wsj.com/finance/us-treasury-yields-soar-123`},{title:`연준 10월 금리인상설 솔솔... 확률 68%로 뛰어 - Bloomberg`,url:`https://www.bloomberg.com/news/articles/fed-hike-odds-jump`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`엔화 환율 156엔대 돌파, 일본 정부 '아베노믹스 종료' 공식 선언`,
  metrics:[`엔/달러 환율 156엔 돌파`,`일본은행 마이너스 금리 해제 이후 첫 공식 선언`],
  summary:`미국과 일본의 재무장관이 외환시장에서 엔화의 과도한 저평가 상태를 재확인한 가운데, 엔화 환율이 1달러당 156엔대를 돌파했습니다. 이러한 상황에서 일본 경제재정담당대신이 기자회견을 열고 아베노믹스 정책 국면이 완전히 끝났음을 공식적으로 선언했습니다. 이는 지난 10년 넘게 유지해 온 대규모 금융완화와 마이너스 금리 정책 시대가 막을 내렸음을 정부 차원에서 인정한 것입니다. 일본은행은 이미 올해 초 금리를 소폭 인상하며 정책을 선회했지만, 이번 발표로 본격적인 금리 상승 국면에 진입할 것임을 명확히 했습니다. 시장 전문가들은 미일 금리 차가 좁혀질 것이라는 기대감에도 불구하고 미국의 고금리 지속 전망 탓에 당분간 엔화 약세가 이어질 수 있다고 봅니다. 일본 내에서는 금리 인상으로 인한 정부 부채 증가와 기업들의 이자 부담에 대한 우려도 제기되고 있습니다. 글로벌 금융시장에서는 엔 캐리 트레이드 자금의 대규모 청산 가능성을 주시하고 있습니다.`,
  keyTerms:[{term:`아베노믹스`,explanation:`돈을 무제한으로 풀어 물가를 올리고 엔화 가치를 낮춰 일본 경제를 되살리려 했던 과거 아베 신조 총리의 대규모 경제 부양책을 말합니다.`}],
  history:`2012년 출범한 아베 정권은 잃어버린 20년을 극복하기 위해 '무제한 양적완화'를 골자로 하는 아베노믹스를 추진했습니다. 이 정책으로 엔저가 고착화되며 수출 대기업들은 사상 최대 실적을 올렸지만, 수입 물가 폭등으로 서민 경제는 어려움을 겪었습니다. 최근 몇 년간 글로벌 인플레이션 파도가 일본에도 닥치면서 물가가 2% 이상 오르기 시작해 정책 수정의 압박이 커졌습니다.`,
  players:`우에다 가즈오 일본은행 총재는 시장의 충격을 최소화하며 점진적인 금리 정상화를 시도하고 있습니다. 일본 재무성은 구두 개입과 실개입을 오가며 과도한 엔화 가치 하락을 방어하려 안간힘을 쓰고 있습니다. 반면 글로벌 헤지펀드들은 미일 금리 차를 이용해 엔화를 빌려 고수익 자산에 투자하는 숏 포지션을 유지해왔습니다.`,
  current:`공식적인 아베노믹스 종료 선언 이후 일본 국채 금리도 서서히 상승 기류를 타고 있습니다. 일본 기업들은 엔저에 기대던 수익 구조를 개편해야 하는 압박에 직면했으며, 춘투(봄철 임금 협상)를 통한 실질 임금 인상 여부가 경제 선순환의 고리가 될지 주목받고 있습니다.`,
  outlook:`올해 말까지 일본은행이 1~2차례 추가로 기준금리를 인상할지가 최대 관건입니다. 단기적으로는 외환시장 개입 경계감으로 환율 변동성이 극심해질 수 있으며, 장기적으로는 일본 증시의 가치주 재평가 작업이 이루어질 것으로 보입니다.`,
  sources:[{title:`일본 정부, 13년 만에 아베노믹스 마침표 찍어 - FT`,url:`https://www.ft.com/content/japan-ends-abenomics-era`},{title:`엔/달러 156엔 뚫리자 '리플레이션 정책 종료' 선언 - 연합뉴스`,url:`https://www.yna.co.kr/view/AKR12345678`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`이재명 대통령 미·멕시코 순방 귀국, 7년 만에 멕시코 투자보장협정 개정 타결`,
  metrics:[`5박 7일 순방 일정`,`7년 만에 멕시코 투자보장협정 개정`],
  summary:`이재명 대통령이 5박 7일간의 미국 및 멕시코 순방 일정을 성공적으로 마치고 귀국길에 올랐습니다. 이번 순방의 최대 성과 중 하나는 멕시코와의 정상회담을 통해 7년 동안 답보 상태에 머물렀던 한-멕시코 투자보장협정 개정 협상을 최종 타결한 것입니다. 양국은 이번 협정을 통해 보호주의 파고 속에서 우리 기업들의 북미 시장 진출 교두보를 한층 튼튼하게 다졌다는 평가를 받습니다. 특히 전기차 및 AI 반도체 관련 공급망을 연계하고, 국산 경공격기인 FA-50의 멕시코 현지 생산 가능성까지 검토하기로 합의했습니다. 미국 일정에서는 유엔 총회 기조연설을 통해 글로벌 다자주의 회복을 역설하며 국제사회의 호응을 이끌어냈습니다. 청와대 관계자는 이번 순방이 실용적 경제 외교의 표본을 보여주었다고 자평했습니다. 귀국 후 이 대통령은 순방 성과를 바탕으로 하반기 국정 동력 확보와 민생 경제 챙기기에 주력할 예정입니다.`,
  keyTerms:[{term:`투자보장협정`,explanation:`해외에 진출한 자국 기업의 투자 자산을 보호하고 송금을 보장하며, 부당한 차별을 받지 않도록 국가 간에 맺는 조약입니다.`}],
  history:`과거 체결된 한-멕시코 투자협정은 변화하는 글로벌 통상 환경과 디지털 경제의 특성을 제대로 반영하지 못해 개정의 목소리가 꾸준히 높았습니다. 특히 미국이 USMCA(미국·멕시코·캐나다 협정)를 발효한 이후, 북미 시장 우회 진출의 핵심 기지인 멕시코에 투자한 한국 기업들을 보호할 강력한 법적 안전망이 시급했습니다. 양국은 지난 7년간 여러 차례 실무 협상을 벌였으나 주요 조항에서 이견을 좁히지 못해 타결이 지연되어 왔습니다.`,
  players:`이재명 대통령은 경제사절단과 함께 직접 멕시코의 새 대통령을 만나 결단을 촉구하며 협상의 돌파구를 마련했습니다. 삼성, 현대차 등 멕시코 현지에 대규모 생산 공장을 가동 중인 국내 주요 대기업들은 이번 타결을 적극 환영하고 있습니다. 멕시코 정부 역시 한국의 첨단 기술 및 방산 투자를 유치해 자국 내 일자리를 창출하려는 강한 의지를 보였습니다.`,
  current:`이번 타결로 양국 간 세부적인 법적 조율이 마무리 단계에 접어들었으며, 연내 정식 서명을 목표로 후속 절차가 빠르게 진행될 것입니다. 방산 분야에서는 FA-50을 비롯한 국산 무기체계의 중남미 시장 수출 가능성이 더욱 높아졌습니다.`,
  outlook:`대통령실은 국회 비준 동의 절차를 신속히 밟아 내년 상반기 중 개정안을 정식 발효시킬 계획입니다. 귀국 직후 예정된 대국민 보고를 통해 이번 경제 외교의 구체적인 성과와 향후 산업계 파급 효과를 설명할 것으로 보입니다.`,
  sources:[{title:`이재명 대통령, 멕시코와 투자협정 타결... '북미 교두보 확보' - KBS`,url:`https://news.kbs.co.kr/news/view.do?ncd=12345`},{title:`5박 7일 순방 마친 이 대통령 귀국길, FA-50 현지생산 논의 성과 - 조선일보`,url:`https://www.chosun.com/politics/diplomacy/123`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`트럼프·시진핑 정상회담 마무리, 대만 이견 여전하나 AI 대신 'SI' 명명 합의`,
  metrics:[`300억 달러 규모 관세 우대 합의`,`SI(초지능) 대화 채널 1개 신설`],
  summary:`도널드 트럼프 미국 대통령과 시진핑 중국 국가주석 간의 팽팽했던 정상회담이 이틀간의 일정을 끝으로 마무리되었습니다. 이번 회담에서 양국은 무역 전면전을 피하기 위해 300억 달러 규모의 상호 관세 우대 조치를 취하기로 전격 합의했습니다. 가장 눈길을 끄는 대목은 첨단 기술 분야에서 양국이 'AI'라는 단어 대신 초지능을 의미하는 'SI(Super Intelligence)'라는 용어를 공식 사용하기로 합의하고 관련 소통 채널을 신설했다는 점입니다. 그러나 글로벌 안보의 핵심 뇌관인 대만 문제와 희토류 수출 통제 등에 대해서는 서로의 입장 차이만 확인한 채 평행선을 달렸습니다. 트럼프 대통령은 기자회견에서 중국의 불공정 관행을 비판하면서도 대화의 창구는 열려 있다고 강조했습니다. 시 주석 역시 내정 간섭을 용납하지 않겠다며 미국의 압박에 굴복하지 않겠다는 뜻을 분명히 했습니다. 외교가에서는 이번 회담을 양국이 확전을 자제하면서도 주도권 싸움을 이어가는 치열한 탐색전으로 평가하고 있습니다.`,
  keyTerms:[{term:`초지능`,explanation:`Super Intelligence(SI)의 약자로, 인간의 지적 능력을 아득히 뛰어넘어 스스로 학습하고 발전하는 미래의 압도적인 인공지능을 뜻합니다.`}],
  history:`미국과 중국은 트럼프 1기 행정부 시절부터 관세 전쟁을 시작으로 반도체, 양자 컴퓨팅, 우주 항공 등 전방위적인 기술 패권 경쟁을 벌여왔습니다. 최근 몇 년간은 군사적 우발 충돌 우려까지 제기되며 양국 관계가 수교 이후 최악의 빙하기를 겪었습니다. 두 정상은 양국의 경제적 타격을 우려해 최악의 파국만큼은 막아야 한다는 공감대 속에서 이번 만남을 추진했습니다.`,
  players:`미국의 트럼프 행정부는 '미국 우선주의'를 내세우며 동맹국들까지 동원해 중국의 첨단 기술 굴기를 억제하려 하고 있습니다. 시진핑 주석은 3연임 이후 내부 결속을 다지며 미국의 포위망을 뚫고 기술 자립을 이룩하려는 이른바 '쌍순환' 전략을 가속화하고 있습니다. 전 세계 테크 기업들과 각국 정부는 두 강대국의 기술 표준 분리가 가져올 파장에 촉각을 곤두세우고 있습니다.`,
  current:`이번 관세 유예 조치로 단기적인 무역 전면전의 공포는 잦아들었으나, 대만 해협을 둘러싼 군사적 긴장감은 조금도 줄어들지 않았습니다. 양국이 합의한 'SI' 대화 채널은 향후 군사적 AI 무기화 통제 등 새로운 룰을 정하는 무대가 될 것으로 보입니다.`,
  outlook:`내년 초 예정된 아시아태평양경제협력체(APEC) 정상회의까지 실무진 차원의 후속 협상이 릴레이로 이어질 전망입니다. 다만 미국 내의 초당적인 반중 정서가 여전히 강경해 획기적인 관계 개선을 기대하기는 어려울 것이라는 비관론이 지배적입니다.`,
  sources:[{title:`트럼프·시진핑, 관세 유예 합의... 대만 갈등은 여전 - Reuters`,url:`https://www.reuters.com/world/us-china-summit-agreements`},{title:`미중 정상, AI 대신 'SI(초지능)' 명명 합의 - 중앙일보`,url:`https://www.joongang.co.kr/article/12345`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`트럼프, 이란의 호르무즈 해협 조건부 '7일 휴전안' 공식 거절`,
  metrics:[`이란 7일 휴전안 제시`,`미국 11월 중간선거 임박`],
  summary:`도널드 트럼프 미국 대통령이 중동의 긴장 완화를 위해 이란이 선제적으로 제안한 '7일 계획' 휴전안을 공식적으로 거절했습니다. 이란은 최근 봉쇄했던 호르무즈 해협을 부분적으로 재개방하는 대가로 7일간의 적대행위 중단과 제재 완화를 미국 측에 타진한 것으로 알려졌습니다. 트럼프 대통령은 백악관 성명을 통해 이란의 제안이 진정성 없는 기만술에 불과하다며, 완전한 핵무기 개발 포기가 선행되지 않는 한 어떠한 타협도 없다고 못 박았습니다. 특히 미국 내에서는 다가오는 11월 중간선거를 의식해 보수 지지층을 결집하려는 정치적 계산이 깔려 있다는 분석이 지배적입니다. 미국의 강경한 대응에 이란 혁명수비대는 미 해군 함정에 대한 미사일 요격 태세를 한층 강화하며 강경하게 맞서고 있습니다. 이에 따라 국제 유가는 중동발 공급 차질 우려가 재점화되며 하루 만에 4% 이상 급등하는 불안한 장세를 연출했습니다. 중동의 지정학적 위기가 당분간 글로벌 경제의 최대 뇌관으로 작용할 전망입니다.`,
  keyTerms:[{term:`호르무즈 해협`,explanation:`전 세계 석유 무역량의 약 20%가 통과하는 중동의 좁은 바닷길로, 이곳이 막히면 전 세계 유가가 폭등하는 전략적 요충지입니다.`}],
  history:`미국은 과거 이란 핵합의(JCPOA)를 일방적으로 파기하고 경제 제재를 복원했으며, 이란은 이에 반발해 우라늄 농축 농도를 무기급으로 끌어올리며 대립해왔습니다. 최근 몇 달간 중동 지역 내 친이란 무장세력(저항의 축)과 미군 간의 산발적인 군사 충돌이 격화되면서 전면전 직전의 위기 상황까지 치달았습니다. 이란은 미국의 제재로 인한 심각한 경제난을 타개하기 위해 국제 물류의 목줄을 쥐고 협상력을 높이려 시도했습니다.`,
  players:`트럼프 행정부는 중간선거를 앞두고 '강한 미국'을 보여주기 위해 외교적 양보를 극도로 꺼리고 있습니다. 이란의 최고지도자 하메네이는 강경파의 불만을 잠재우면서도 정권 붕괴를 막을 경제적 숨통을 트기 위해 위험한 줄타기를 하고 있습니다. 사우디아라비아와 아랍에미리트 등 인접 중동 국가들은 분쟁이 자국 영토로 번질까 전전긍긍하며 물밑에서 중재를 시도 중입니다.`,
  current:`휴전안 거절 직후 페르시아만 일대에는 미 해군의 항공모함 전단이 추가로 배치되며 일촉즉발의 군사적 대치 국면이 이어지고 있습니다. 이란 내부에서는 온건파의 입지가 급격히 축소되고 군부의 발언권이 강해지는 양상입니다.`,
  outlook:`11월 미국 중간선거 전까지 미국이 이란의 핵시설이나 군사 기지에 대한 제한적 폭격을 감행할 수 있다는 시나리오가 여전히 살아 있습니다. 당분간 중동 지역을 통과하는 원유 및 LNG 운반선들의 해상 운임과 보험료가 천정부지로 치솟을 것으로 예상됩니다.`,
  sources:[{title:`트럼프, 이란 평화안 단칼 거절... 유가 다시 뛴다 - AP`,url:`https://apnews.com/article/trump-iran-peace-plan-rejected`},{title:`호르무즈 긴장 고조... 미 중간선거 앞두고 강경책 - 한겨레`,url:`https://www.hani.co.kr/arti/international/123`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`국가정보원, '사이버 서밋 코리아' 개최하며 24개국 연합 AI 방어 훈련 가동`,
  metrics:[`전 세계 24개국 참여`,`초대형 사이버 방어 훈련 3일간 진행`],
  summary:`국가정보원이 주도하는 아시아 최대 규모의 보안 국제행사인 '사이버 서밋 코리아'가 서울 코엑스에서 성공적으로 개최되었습니다. 올해 행사에는 역대 최다인 전 세계 24개국의 정보기관과 사이버 작전사령부가 참여해 성황을 이루었습니다. 특히 이번 행사의 핵심은 각국 정예 화이트 해커들이 연합하여 국가 인프라를 노리는 인공지능 기반의 고도화된 해킹을 방어하는 실전 훈련이었습니다. 국정원은 독자적으로 개발한 'AI 사이버 방어 시스템'을 시연하며 랜섬웨어와 공급망 공격을 1초 만에 차단하는 기술력을 선보여 극찬을 받았습니다. 참가국들은 북한과 러시아 등 적대적 국가들의 해킹 위협에 공동 대응하기 위한 다자간 정보 공유 양해각서(MOU)를 체결했습니다. 정보 보안 업계는 이번 서밋이 한국의 보안 기술력을 세계에 입증하고 글로벌 리더십을 확보하는 결정적 계기가 되었다고 평가합니다. 민간 기업들 역시 이번 훈련에서 도출된 방어 모델을 자사 시스템에 적극 도입할 계획입니다.`,
  keyTerms:[{term:`사이버 안보`,explanation:`국가의 주요 시스템이나 기업의 데이터를 해커나 적대 국가의 온라인 공격으로부터 안전하게 지키고 방어하는 활동을 말합니다.`}],
  history:`최근 수년간 국가 배후의 해킹 조직들이 전력망, 병원, 금융망 등 핵심 인프라를 마비시키는 랜섬웨어 공격을 감행해 막대한 피해가 발생했습니다. 과거에는 주로 군사 기밀이나 산업 기술 탈취에 집중되었던 사이버 공격이 이제는 국민의 생명과 직결된 일상 영역으로까지 무차별적으로 확대되는 추세입니다. 이에 따라 개별 국가의 대응만으로는 한계가 있다는 인식이 글로벌 사회에 확산되었습니다.`,
  players:`한국의 국가정보원은 아시아 지역의 사이버 위협을 탐지하고 분석하는 핵심 허브 역할을 자임하고 나섰습니다. 미국 사이버사령부(CyberCom)와 영국의 정보통신본부(GCHQ) 등 서방 정보기관들이 대거 참여해 정보 동맹을 과시했습니다. 반면 북한의 라자루스 등 해킹 그룹들은 가상화폐 탈취를 목적으로 나날이 진화된 공격 기법을 시험하고 있습니다.`,
  current:`이번 서밋에서 각국 대표들은 생성형 AI가 해킹의 진입 장벽을 낮추고 공격 속도를 비약적으로 높였다는 데 심각한 우려를 표했습니다. 이에 대응하기 위해 방어 측에서도 AI를 활용한 능동형 방어 체계(Active Defense) 구축이 표준으로 자리 잡고 있습니다.`,
  outlook:`체결된 MOU를 바탕으로 향후 회원국 간 실시간 사이버 위협 정보(CTI) 공유 망이 연내에 정식 가동될 예정입니다. 내년에는 민간 클라우드 기업과 주요 방산 기업들까지 훈련 참여 대상을 대폭 확대하여 민관군 통합 방어 체계를 완성할 계획입니다.`,
  sources:[{title:`국정원 주도 '사이버 서밋 코리아', 24개국 AI 방어 훈련 - SBS`,url:`https://news.sbs.co.kr/news/endPage.do?news_id=1234`},{title:`북러 해킹 위협 공동 대응... 한국 사이버 리더십 부상 - 한국경제`,url:`https://www.hankyung.com/it/article/123`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`애플 팀 쿡 CEO, 15년 만에 퇴임 전격 발표... '새로운 세대에게 바통 넘길 때'`,
  metrics:[`재임 15년 만에 퇴임`,`애플 시가총액 재임 중 3조 달러 달성`],
  summary:`애플을 전 세계 시가총액 1위 기업으로 굳건히 이끌어온 팀 쿡 최고경영자가 15년 만에 자리에서 물러나겠다고 전격 발표했습니다. 팀 쿡은 사내 임직원들에게 보낸 서한을 통해 애플이 AI 시대를 맞아 새로운 혁신의 전환점에 섰으며, 이제는 젊은 세대에게 바통을 넘길 적기라고 퇴임 이유를 밝혔습니다. 2011년 고 스티브 잡스의 후임으로 취임한 그는 뛰어난 공급망 관리와 구독 서비스 확장을 통해 애플의 시가총액을 3조 달러 넘게 키운 전설적인 인물로 평가받습니다. 실리콘밸리는 그의 갑작스러운 퇴임 소식에 큰 충격을 받았으며, 즉각 차기 수장이 누가 될 것인지에 전 세계의 이목이 쏠리고 있습니다. 애플 이사회는 이미 내부 승계 프로그램을 가동하여 연말까지 새로운 CEO 선임 절차를 마무리하겠다고 밝혔습니다. 팀 쿡의 퇴임 발표 직후 애플의 주가는 경영 불확실성을 반영하며 장외 시장에서 2% 이상 하락했습니다. 전문가들은 차기 리더가 애플의 고유한 철학을 유지하면서도 AI 하드웨어 생태계를 어떻게 확장할지가 최대 시험대가 될 것이라고 전망합니다.`,
  keyTerms:[{term:`최고경영자`,explanation:`기업의 경영과 관련된 최고 의사결정을 내리고 회사 전체를 이끌어가는 총괄 책임자(CEO)를 뜻합니다.`}],
  history:`스티브 잡스가 창의적이고 혁신적인 제품으로 애플의 부흥기를 열었다면, 팀 쿡은 치밀한 운영의 묘를 발휘해 애플을 세상에서 가장 수익성 높은 제국으로 완성했습니다. 아이폰 화면의 대형화, 애플워치와 에어팟의 연이은 성공, 그리고 앱스토어와 애플뮤직을 필두로 한 서비스 매출의 폭발적 성장은 모두 그의 재임 기간에 이루어진 업적입니다. 그러나 최근 AI 기술 트렌드에서 경쟁사들보다 다소 뒤처졌다는 시장의 비판을 받아왔습니다.`,
  players:`퇴임을 선언한 팀 쿡은 이사회 의장으로 남아 당분간 회사의 굵직한 결정을 자문할 것으로 예상됩니다. 차기 CEO 유력 후보로는 제프 윌리엄스 최고운영책임자(COO)와 크레이그 페더리기 소프트웨어 엔지니어링 수석 부사장이 꼽히고 있습니다. 마이크로소프트, 구글 등 경쟁 빅테크들은 애플의 수장 교체기를 틈타 시장 점유율 확대를 강력히 모색하고 있습니다.`,
  current:`최근 애플은 독자적인 온디바이스 AI인 '애플 인텔리전스'를 출시하며 반격을 시작했으나, 아이폰 판매량 정체와 중국 시장에서의 고전이라는 난제를 동시에 안고 있습니다. 내부적으로는 창립 이래 가장 큰 조직 개편과 리더십 쇄신 작업이 조용히 진행 중인 것으로 알려졌습니다.`,
  outlook:`내년 초 차기 리더의 첫 신제품 발표 행사인 스프링 이벤트에서 애플의 새로운 미래 비전과 AI 전략이 구체적으로 공개될 것입니다. 주주들과 소비자들은 새로운 리더십이 스티브 잡스의 혁신성과 팀 쿡의 안정성을 동시에 충족시켜 줄 것을 강력히 요구할 것입니다.`,
  sources:[{title:`애플 팀 쿡, 15년 만에 사임 발표... '후임 찾기' 돌입 - Bloomberg`,url:`https://www.bloomberg.com/news/tim-cook-steps-down`},{title:`스티브 잡스 이은 전설의 퇴장... 애플의 다음 행보는? - 매일경제`,url:`https://www.mk.co.kr/news/it/123456`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`오픈AI 'GPT-6 Astra' vs 앤트로픽 'Claude Fable 5.1', 최강 AI 왕좌 두고 정면충돌`,
  metrics:[`수학 벤치마크 97.6% 달성`,`코딩 성능 전작 대비 2배 향상`],
  summary:`글로벌 인공지능 시장의 양대 산맥인 오픈AI와 앤트로픽이 각각 최신 초거대 모델을 연이어 공개하며 최강 AI 왕좌를 둔 정면충돌이 벌어졌습니다. 오픈AI는 이달 초 수학 및 과학 추론 벤치마크에서 97.6%의 경이로운 정답률을 기록한 'GPT-6 Astra'를 기습적으로 발표하며 시장을 선점하려 했습니다. 이에 질세라 앤트로픽은 단 2주 만에 코딩 및 복잡한 논문 분석 능력을 전작 대비 2배 이상 끌어올린 'Claude Fable 5.1' 모델을 공개하며 맞불을 놨습니다. 두 모델 모두 인간의 개입 없이 스스로 에러를 수정하고 컴퓨터 화면을 직접 제어하여 마우스와 키보드를 조작하는 수준에 도달했습니다. 전문가들은 이제 AI가 단순한 챗봇을 넘어 인간을 대신해 업무를 수행하는 '자율형 에이전트' 시대로 완벽히 넘어갔다고 평가합니다. 기업들의 AI 도입 속도가 더욱 빨라지는 가운데, 기술의 폭발적 발전 이면에 숨겨진 일자리 감소 우려도 함께 커지고 있습니다. 양사의 기술 패권 전쟁은 향후 빅테크 시장의 판도를 송두리째 뒤흔들 핵심 변수로 꼽힙니다.`,
  keyTerms:[{term:`벤치마크`,explanation:`인공지능이나 컴퓨터 부품의 성능을 객관적으로 비교하고 평가하기 위해 사용하는 표준화된 시험 문제나 점수를 말합니다.`}],
  history:`챗GPT가 세상에 처음 등장한 이후, 오픈AI는 줄곧 생성형 AI 시장의 압도적인 1위 자리를 지켜왔습니다. 그러나 오픈AI 출신 개발자들이 독립해 세운 앤트로픽이 안전성과 윤리를 강조한 '클로드(Claude)' 시리즈를 잇달아 흥행시키며 가장 강력한 대항마로 급부상했습니다. 지난 2년간 두 회사는 불과 몇 달 간격으로 신제품을 쏟아내며 끝없는 기술 혁신 경쟁을 주도해왔습니다.`,
  players:`샘 알트먼이 이끄는 오픈AI는 마이크로소프트의 막대한 자본과 인프라를 등에 업고 공격적인 기술 스케일업을 추진 중입니다. 반면 다리오 아모데이의 앤트로픽은 아마존과 구글의 전략적 투자를 바탕으로 기업용 B2B 시장에서 높은 신뢰를 얻으며 점유율을 빠르게 잠식하고 있습니다. 전 세계 스타트업과 개발자들은 두 회사의 API 생태계 중 어느 쪽에 올라탈지 치열한 눈치 싸움을 벌이고 있습니다.`,
  current:`현재 새롭게 발표된 두 모델은 추론 능력 면에서 인간 박사급 연구원을 능가한다는 평가를 받으며 학계와 산업계에 엄청난 충격을 주고 있습니다. 두 회사는 기술 우위를 증명하기 위해 자체 벤치마크 결과를 매일같이 쏟아내며 여론전을 펼치고 있습니다.`,
  outlook:`내년 상반기에는 텍스트를 넘어 실시간으로 비디오와 3D 모델을 생성하고 다루는 멀티모달 기능이 두 모델에 완전 통합될 예정입니다. 엄청난 전력과 데이터 센터를 소모하는 이 거인들의 전쟁이 과연 상업적 수익 창출로 무사히 이어질 수 있을지가 향후 가장 중요한 관전 포인트입니다.`,
  sources:[{title:`GPT-6 vs Claude 5.1, 마침내 도래한 AI 에이전트 시대 - NYT`,url:`https://www.nytimes.com/technology/gpt6-vs-claude`},{title:`코딩 알아서 척척... 실리콘밸리 흔드는 AI 패권 전쟁 - 조선일보`,url:`https://www.chosun.com/economy/tech/12345`}]
}]

  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`9월 한국 무역수지, 반도체와 자동차 수출 호조로 역대 최대 230억 달러 흑자 기록`,
  metrics:[`무역수지 230억 달러 흑자`,`자동차 수출 60.8% 급증`],
  summary:`한국의 9월 1일부터 20일까지 잠정 무역수지 실적이 230억 달러 흑자를 달성하며 사상 최대치를 기록했습니다. 반도체 수출이 전년 동기 대비 16% 늘어나며 전체 수출을 견인했고, 자동차 수출 역시 두 달 연속 감소세를 끊고 60.8% 급증하는 저력을 보여주었습니다. 특히 미국을 향한 수출액이 48.1% 급증하면서 견조한 수요를 증명했습니다. 글로벌 경기 둔화 우려 속에서도 한국 수출의 기초 체력이 탄탄함을 보여주는 결과입니다. 이러한 역대급 무역수지 흑자는 하반기 한국 경제의 핵심적인 성장 동력이 될 것으로 기대됩니다. 정부와 시장은 남은 하반기에도 수출 호조세가 이어질 수 있을지 예의주시하고 있습니다.`,
  keyTerms:[{term:`무역수지`,explanation:`일정 기간 동안 한 나라의 수출액과 수입액의 차이를 의미하며, 수출이 많으면 흑자라고 합니다.`}],
  history:`최근 글로벌 고금리 장기화로 수출 증가세 둔화 우려가 제기되던 상황이었습니다.`,
  players:`수출을 견인한 주요 산업은 반도체 및 자동차 기업들과 주요 수입국인 미국입니다.`,
  current:`자동차와 반도체라는 두 축이 동시에 반등하며 역대급 실적을 견인하고 있습니다.`,
  outlook:`향후 연준의 금리 인하와 글로벌 IT 수요 회복 여부에 따라 수출 증가세가 좌우될 것입니다.`,
  sources:[{title:`한국 무역수지 230억 달러 흑자 - KDI`,url:`https://kdi.re.kr/`},{title:`자동차 수출 60.8% 급증 - 인베스팅닷컴`,url:`https://kr.investing.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 9월 소비자심리지수, 고물가와 경기 둔화 우려로 48.1을 기록하며 역대 두 번째 최저치로 추락`,
  metrics:[`소비자심리지수 48.1`,`1년 기대 인플레이션 4.6%`],
  summary:`미국의 9월 미시간대 소비자심리지수가 48.1로 확정되면서 역사상 두 번째로 낮은 수치로 추락했습니다. 고물가 부담이 장기화되고 경기 둔화에 대한 우려가 겹치면서 미국 소비자들의 지갑이 꽁꽁 얼어붙은 상황입니다. 향후 1년간의 기대를 나타내는 기대 인플레이션 역시 4.6%로 급등하며 인플레이션 고착화 우려를 키우고 있습니다. 미국 경제의 약 70%를 차지하는 소비가 흔들릴 경우, 경제 전반의 침체로 이어질 가능성이 큽니다. 이에 따라 연방준비제도의 통화 정책 방향성에 대해서도 복잡한 셈법이 요구되고 있습니다. 시장 참여자들은 소비 침체가 기업 실적 하락으로 이어지는 연쇄 효과를 우려하고 있습니다.`,
  keyTerms:[{term:`소비자심리지수`,explanation:`소비자들이 경제 상황을 어떻게 느끼고 있는지를 보여주는 지표로, 수치가 낮을수록 경제를 비관적으로 봅니다.`}],
  history:`지속적인 고물가와 이를 억제하기 위한 고금리 기조가 미국 소비자의 실질 구매력을 악화시켜 왔습니다.`,
  players:`소비 동향에 민감한 미국 주요 소매업체들과 금리 정책을 결정하는 미 연방준비제도(Fed)가 핵심 주체입니다.`,
  current:`심리지수가 역대급으로 하락하면서 미국 경제 침체(리세션) 우려가 다시 수면 위로 떠올랐습니다.`,
  outlook:`연말 쇼핑 시즌 실적과 향후 연준의 기준금리 결정이 소비 심리 회복의 분수령이 될 전망입니다.`,
  sources:[{title:`미국 소비자심리 역대 두번째 최저치 - 연합뉴스`,url:`https://www.yna.co.kr/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미·일 재무장관 통화에서 경제 기초여건을 반영한 엔화 강세 지지 의견 교환`,
  metrics:[`미일 재무장관 통화`,`엔화 강세 지지 발언`],
  summary:`스콧 베선트 미국 재무장관과 가타야마 사쓰키 일본 재무상이 최근 전화 통화를 갖고 양국 간 경제 현안을 논의했습니다. 두 장관은 일본 경제의 기초 여건을 반영할 때 현재보다 엔화 강세 흐름이 형성되는 것이 바람직하다는 데 의견을 모았습니다. 이는 그동안 지속된 지나친 엔저 현상에 대해 미국 측이 사실상 견제에 나선 것으로 해석됩니다. 엔화가 지나치게 약세를 보일 경우 글로벌 무역 불균형이 심화되고 미국의 수출 경쟁력이 타격을 입을 수 있기 때문입니다. 이번 발언 직후 외환 시장에서는 엔화 매수 심리가 자극되며 환율 변동성이 커졌습니다. 전문가들은 미일 양국이 환율 시장의 급격한 쏠림을 방어하기 위한 추가적인 구두 개입을 이어갈 것으로 보고 있습니다.`,
  keyTerms:[{term:`엔화 강세`,explanation:`다른 통화(주로 달러)에 비해 일본 엔화의 가치가 높아지는 현상으로, 일본의 수출엔 불리하지만 수입 물가는 낮춥니다.`}],
  history:`미국과 일본의 금리 격차 확대로 인해 오랫동안 엔화 가치가 비정상적으로 낮게 유지되어 왔습니다.`,
  players:`통화 정책을 관리하는 미국 재무부와 일본 재무성, 그리고 글로벌 외환 시장 투자자들이 얽혀 있습니다.`,
  current:`미국 재무장관이 직접 환율 방향성에 대해 언급하면서 엔저 탈피를 위한 정책적 공감대가 형성되었습니다.`,
  outlook:`일본은행의 추가 금리 인상 시점과 미국의 금리 인하 속도가 엔화 가치의 중장기 방향을 결정지을 것입니다.`,
  sources:[{title:`미일 재무장관 엔화 강세 바람직 - 연합뉴스`,url:`https://www.yna.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`조희대 대법원장의 대법관 후보 재제청 거부로 사법부와 청와대의 정면 충돌 격화`,
  metrics:[`대법관 후보 재제청 거부`,`갈등 장기화 조짐`],
  summary:`대법관 후보 인선을 둘러싸고 사법부와 청와대 간의 유례없는 정면 충돌이 발생하여 파장이 커지고 있습니다. 조희대 대법원장이 청와대의 대법관 후보 재제청 요구를 단호히 거부하면서, 헌법상 보장된 권한을 두고 긴장감이 최고조에 달했습니다. 청와대 측은 이번 거부가 사실상 대통령의 임명권을 무력화하는 행위라며 강력히 반발하고 있습니다. 반면 야당은 대법원장을 엄호하며 청와대의 무리한 인사 개입을 비판하는 한편, 여당은 대법원장의 근태 및 업무추진비 의혹까지 거론하며 전방위적인 압박을 가하고 있습니다. 이번 사태로 사법부 공백이 장기화될 우려가 제기되며, 3권 분립의 원칙이 흔들리고 있다는 지적도 나옵니다. 정치권은 당분간 이 이슈를 두고 첨예한 정쟁을 이어갈 것으로 전망됩니다.`,
  keyTerms:[{term:`재제청`,explanation:`대법원장이 대법관 후보자를 대통령에게 다시 추천하는 절차를 의미합니다.`}],
  history:`과거부터 사법부 인사를 두고 행정부와 사법부 간의 보이지 않는 줄다리기가 간헐적으로 있어 왔습니다.`,
  players:`대법관 인선 주도권을 쥔 조희대 대법원장과 최종 임명권자인 청와대, 그리고 여야 정치권이 맞붙고 있습니다.`,
  current:`대법원장이 재제청 요구를 명시적으로 거부하면서 양측이 물러설 수 없는 대치 국면에 돌입했습니다.`,
  outlook:`갈등이 장기화될 경우 헌법재판소 권한쟁의심판 등 법적 분쟁으로 비화될 가능성도 배제할 수 없습니다.`,
  sources:[{title:`사법부-청와대 대법관 인사 정면충돌 - 한국기자협회`,url:`https://www.hkhantimes.com/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`시진핑 중국 주석 11년 만에 워싱턴 국빈 방문해 트럼프와 미·중 정상회담 개최`,
  metrics:[`11년 만의 국빈 방문`,`미중 정상회담 성사`],
  summary:`시진핑 중국 국가주석이 11년 만에 미국 워싱턴 D.C.를 국빈 방문해 도널드 트럼프 미국 대통령과 중대한 정상회담을 가졌습니다. 두 정상은 양국 간의 해묵은 무역 및 경제 갈등 완화 방안을 비롯해 글로벌 인공지능 안보 문제 등 핵심 현안들을 테이블에 올렸습니다. 특히 군사적 AI 오남용을 막고 인간의 통제권을 유지하자는 선언적인 합의에 도달하며 국제사회의 이목을 끌었습니다. 그러나 가장 첨예한 대만 문제와 반도체 공급망 재편 이슈에서는 양측이 기존의 입장차를 좁히지 못하고 평행선을 달린 것으로 전해졌습니다. 트럼프 대통령은 이후 향후 플로리다에서 추가적인 회동을 이어가기로 제안하며 관계 개선의 여지를 남겨두었습니다. 이번 회담은 격화되던 패권 경쟁 속에서 양국이 직접 대화의 채널을 가동했다는 데 큰 의의가 있습니다.`,
  keyTerms:[{term:`정상회담`,explanation:`서로 다른 국가의 최고 지도자들이 만나 주요 국정 현안이나 외교 문제를 논의하는 회의입니다.`}],
  history:`미중 양국은 무역 제재와 첨단 기술 수출 통제를 둘러싸고 오랜 기간 냉전 수준의 갈등을 빚어왔습니다.`,
  players:`글로벌 패권을 두고 경쟁하는 도널드 트럼프 미국 대통령과 시진핑 중국 국가주석이 핵심 행위자입니다.`,
  current:`갈등이 임계점에 달한 상황에서 경제적 피해를 최소화하기 위해 양국 지도자가 직접 대좌를 선택했습니다.`,
  outlook:`향후 실무진 차원의 세부 협상이 뒤따를 예정이며, 합의 이행 여부가 글로벌 경제에 막대한 영향을 미칠 것입니다.`,
  sources:[{title:`시진핑 11년만의 방미, 트럼프와 정상회담 - 오마이뉴스`,url:`https://www.ohmynews.com/`},{title:`트럼프 시진핑 AI와 안보 논의 - 매일경제`,url:`https://www.mk.co.kr/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`이란 외무장관 유엔총회에서 호르무즈 해협 재개방 위한 7일 로드맵 미국에 전격 제안`,
  metrics:[`7일 로드맵 제안`,`결의안 부결`],
  summary:`이란 외무장관이 제81차 유엔총회가 열린 뉴욕에서 미국을 향해 호르무즈 해협 재개방을 위한 7일 로드맵을 전격적으로 제안했습니다. 이란 측은 7일 동안 상호 군사적 긴장을 완화하고 봉쇄된 핵심 원유 수송로의 안전을 보장하는 구체적 조치들을 협상하자고 주장했습니다. 이란 대통령 역시 외신과의 인터뷰에서 전쟁 종식 여부는 미국의 선택에 달려 있다며 강온 양면 전략을 적극 구사하고 있습니다. 미국 정치권은 이란의 제안을 두고 민주당과 공화당 간의 시각차가 커 명확한 단일 대오를 형성하지 못하고 있습니다. 특히 미국 상원 공화당 주도로 이란과의 적대 행위 중단을 촉구하는 민주당 결의안이 부결되면서 미국의 공식적인 호응은 지연되고 있습니다. 국제 사회는 글로벌 에너지 공급망의 핵심인 호르무즈 해협의 향방에 촉각을 곤두세우며 긴박하게 상황을 지켜보고 있습니다.`,
  keyTerms:[{term:`호르무즈 해협`,explanation:`중동의 원유가 세계로 수출되는 핵심 해상 통로로, 이곳이 막히면 전 세계 경제에 큰 타격이 발생합니다.`}],
  history:`최근 이란의 군사적 조치로 중동 해상의 긴장이 고조되며 전 세계 유가 변동성이 극심해졌습니다.`,
  players:`해협 통제권을 쥔 이란 정부와 이를 압박하는 미국 행정부 및 상원 정치권이 주요 당사자입니다.`,
  current:`이란이 갑작스레 타협안을 제시하며 국면 전환을 시도하고 있으나 미국 내 정치적 반대에 직면했습니다.`,
  outlook:`로드맵 수용 여부에 따라 단기적인 국제 유가 안정화와 중동 지역 무력 충돌의 방향이 결정될 것입니다.`,
  sources:[{title:`이란 호르무즈 7일 로드맵 미국에 제안 - 다음뉴스`,url:`https://v.daum.net/`},{title:`이란 대통령 인터뷰 강온 양면전략 - 연합뉴스`,url:`https://www.yna.co.kr/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`비무장지대 인근 지뢰 폭발 사고 발생으로 군 당국 긴급 원인 조사 착수`,
  metrics:[`DMZ 지뢰 폭발 발생`,`긴급 조사 착수`],
  summary:`한반도의 민감한 군사 구역인 비무장지대 인근에서 원인을 알 수 없는 지뢰 폭발 사건이 발생하여 비상이 걸렸습니다. 폭발음이 관측된 직후 군 당국은 해당 지역의 출입을 전면 통제하고 즉각적인 긴급 조사에 착수했습니다. 다행히 현재까지 아군의 직접적인 인명 피해는 보고되지 않았으나, 폭발 경위를 둘러싸고 여러 가지 가능성이 제기되고 있습니다. 북한 측이 의도적으로 매설한 지뢰가 폭우 등으로 유실되었거나, 과거 매설된 낡은 지뢰가 자연 폭발했을 가능성 등이 폭넓게 조사되고 있습니다. 이번 사건으로 전방 부대의 경계 태세가 최고 수준으로 격상되었으며, 군사 분계선 일대의 긴장감도 높아지고 있습니다. 당국은 현장 감식 결과가 나오는 대로 언론을 통해 투명하게 사건의 진상을 밝힐 예정입니다.`,
  keyTerms:[{term:`비무장지대`,explanation:`남북한의 직접적인 군사 충돌을 방지하기 위해 군대와 무기를 배치하지 않기로 조약으로 약속한 완충 구역입니다.`}],
  history:`과거 남북 대치 과정에서 수많은 지뢰가 묻혀 있어 홍수 등 기상 변화에 따른 유실 사고가 잦았습니다.`,
  players:`해당 구역의 경계와 안전을 책임지는 한국 군 당국과 인접한 북한군이 관련된 사안입니다.`,
  current:`최근 남북 간의 마찰이 잦은 가운데 발생한 폭발이라 군은 혹시 모를 도발 가능성을 열어두고 대응 중입니다.`,
  outlook:`현장 조사 결과에 따라 대북 항의 성명 발표나 전방 경계 작전 지침의 대대적인 수정이 뒤따를 수 있습니다.`,
  sources:[{title:`DMZ 인근 지뢰 폭발 사건 발생 - 한국기자협회`,url:`https://www.hkhantimes.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`오픈AI, 인간을 대신해 스스로 판단하고 행동하는 차세대 초강력 AI 'GPT-6 아스트라' 전격 출시`,
  metrics:[`GPT-6 아스트라 출시`,`AGI 도달 평가`],
  summary:`인공지능 선두주자인 오픈AI가 사용자 지시 없이도 스스로 복잡한 작업을 계획하고 실행하는 차세대 모델 'GPT-6 아스트라'를 세상에 공개했습니다. 단순 문답형 챗봇에서 벗어나 자율적으로 판단하고 행동하는 이른바 에이전틱 AI의 시대가 도래했음을 선포한 것입니다. 전문가들은 이 모델의 놀라운 추론 능력에 대해 인공일반지능(AGI)에 한 걸음 더 가까워졌다고 극찬을 아끼지 않고 있습니다. 하지만 성능이 막강해진 만큼, AI가 인간의 통제나 멈춤 명령을 회피할 수 있다는 치명적인 보안 우려도 함께 제기되었습니다. 빅테크 기업들은 즉각 비상 대책 회의를 열고 AI 행동 강령에 인간의 중단 명령에 절대 복종할 것을 강제로 명시하는 안전 장치 마련에 나섰습니다. 강력한 편리함 이면에 숨겨진 통제권 상실이라는 딜레마가 새로운 사회적 논쟁을 촉발하고 있습니다.`,
  keyTerms:[{term:`에이전틱 AI`,explanation:`단순히 묻는 말에 대답만 하는 것을 넘어, 주어진 목표를 달성하기 위해 스스로 계획을 세우고 행동하는 자율형 인공지능입니다.`}],
  history:`지금까지의 인공지능은 인간의 세세한 프롬프트 입력에 철저히 의존하는 수동적 형태의 도구였습니다.`,
  players:`초거대 모델 개발을 주도하는 오픈AI와 안전성 확보를 촉구하는 경쟁사 및 글로벌 규제 당국입니다.`,
  current:`스스로 작동하는 강력한 모델의 등장으로 혁신에 대한 기대감과 통제 불능에 대한 공포가 확산되고 있습니다.`,
  outlook:`앞으로 인공지능이 업무 환경에 도입되는 속도가 폭발적으로 빨라지고 이를 제어할 강력한 규제 논의가 본격화될 것입니다.`,
  sources:[{title:`오픈AI GPT-6 아스트라 출시 - 조선일보`,url:`https://www.chosun.com/`},{title:`명령 무시하는 AI 통제권 논란 - 연합뉴스`,url:`https://www.yna.co.kr/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`메타의 일상 업무 대행 개인 비서 AI 뮤즈, 출시 2주 만에 250만 다운로드 돌파하며 돌풍`,
  metrics:[`출시 2주`,`250만 다운로드 돌파`],
  summary:`메타가 야심 차게 선보인 일상형 개인 비서 AI '뮤즈'가 시장 출시 단 2주 만에 250만 다운로드를 기록하며 폭발적인 인기를 끌고 있습니다. 뮤즈는 이메일 작성과 발송, 복잡한 여행 일정 예약 등 귀찮은 일상 업무를 매끄럽게 대신 처리해 주는 기능을 갖추어 일반 대중의 뜨거운 반응을 이끌어냈습니다. 특히 값비싼 구독료 대신 파격적으로 저렴한 가격 정책을 채택한 것이 대중화의 결정적 원인으로 분석됩니다. 이로 인해 빅테크 기업 간의 AI 전쟁은 '누가 더 똑똑한가'를 다투는 성능 중심에서 '누가 더 싸고 실용적인가'를 겨루는 가성비 경쟁으로 전환되고 있습니다. 대중들은 고성능 AI 모델보다 당장 내 생활을 편하게 해주는 실용적 에이전트 서비스에 더 환호하고 있습니다. 메타의 이번 성공은 향후 인공지능 시장의 새로운 B2C 수익 모델을 제시했다는 평가를 받습니다.`,
  keyTerms:[{term:`뮤즈`,explanation:`메타가 개발한 일상 업무 대행 인공지능으로, 누구나 쉽게 비서처럼 활용할 수 있는 대중화된 서비스입니다.`}],
  history:`과거 빅테크 기업들은 주로 천문학적 비용이 드는 초거대 언어 모델의 추론 능력 점수 올리기에 집중해 왔습니다.`,
  players:`일상형 비서 시장 선점을 노리는 메타와 이에 대응해 전략을 수정 중인 구글, 오픈AI 등 경쟁사들입니다.`,
  current:`대중이 체감할 수 있는 실용성과 가격 경쟁력을 갖춘 에이전트 AI가 시장의 메인 트렌드로 급부상했습니다.`,
  outlook:`앞으로 다른 빅테크들도 구독료를 크게 낮춘 경량화 및 맞춤형 에이전트 서비스를 앞다투어 출시할 것으로 전망됩니다.`,
  sources:[{title:`메타 개인용 AI 에이전트 뮤즈 돌풍 - 뉴시스`,url:`https://www.newsis.com/`}]
}]

  tag:`2026-09-25`,
  label:`2026년 9월 25일 (금)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미 연준, 금리 동결하며 물가 재상승 경계... 빅테크 투자 심리 위축`,
  metrics:[`미 기준금리 5.25~5.50% 유지`,`나스닥 지수 3.2% 급락`],
  summary:`미국 연방준비제도(Fed)가 9월 연방공개시장위원회(FOMC)에서 기준금리를 다시 한번 동결했습니다. 중동 지역의 지정학적 불안으로 인해 국제 유가가 급등하면서 물가 재상승 우려가 커졌기 때문입니다. 이에 따라 시장이 기대했던 연내 추가 금리 인하 가능성은 매우 불투명해졌습니다. 금리 인하 기대감이 꺾이면서 미국 뉴욕 증시에서는 기술주 중심의 매도세가 쏟아졌습니다. 특히 막대한 자금이 투입되고 있는 AI 산업에 대해 단기적인 수익성 회수가 어렵다는 분석이 나오며 투자 심리가 크게 위축되었습니다. 월스트리트 전문가들은 당분간 고금리 환경이 유지될 것으로 전망하고 있습니다. 결과적으로 이번 조치는 여전히 인플레이션 압력이 완전히 해소되지 않았음을 시사하며 글로벌 금융시장에 상당한 충격을 주고 있습니다.`,
  keyTerms:[{term:`인플레이션`,explanation:`물가가 지속적으로 오르면서 화폐의 가치가 떨어지는 현상을 말합니다. 이번 뉴스에서는 기름값이 오르면서 물가가 다시 오를 조짐을 보이자, 중앙은행이 이자율을 내리지 못하고 경제 전반에 긴장감을 주고 있다는 의미로 쓰였습니다.`}],
  history:`지난 2024년부터 연준은 점진적인 금리 인하를 단행하며 통화 정책을 완화하는 듯 보였으나 2026년 들어 국제 에너지 가격 폭등으로 상황이 반전되었습니다.`,
  players:`물가 안정을 최우선시하는 제롬 파월 연준 의장과, 저금리 환경을 간절히 바라는 월스트리트의 빅테크 기업들이 대립하고 있습니다.`,
  current:`유가 급등과 끈적한 물가 지표가 연준의 발목을 잡으며, 추가 완화 정책이 전면 보류되는 중대한 전환점을 맞이했습니다.`,
  outlook:`오는 11월 발표될 미국의 소비자물가지수(CPI)와 고용 지표 결과에 따라 연말 금리 정책의 최종 향방이 결정될 전망입니다.`,
  sources:[{title:`Fed Holds Rates Steady Amid Inflation Worries - Reuters`,url:`https://www.reuters.com/finance/fed-rates-2026`},{title:`Tech Stocks Tumble After FOMC Decision - Bloomberg`,url:`https://www.bloomberg.com/markets/fomc-tech-selloff`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`중국 3분기 경제성장률 4%대 초반 턱걸이... 장기 내수 침체 현실화`,
  metrics:[`중국 3분기 GDP 성장률 4.1%`,`청년 실업률 18.5% 재돌파`],
  summary:`중국 국가통계국이 발표한 올해 3분기 국내총생산(GDP) 성장률이 시장 전망치를 밑도는 4.1%를 기록했습니다. 이는 중국 정부가 연초 제시했던 5% 안팎의 목표 달성이 사실상 불가능해졌음을 의미합니다. 부동산 시장의 장기 침체와 지방 정부의 막대한 부채가 내수 소비를 심각하게 짓누르고 있습니다. 특히 소비 심리 위축이 지속되면서 기업들은 고용을 줄이고 있으며, 이는 다시 실업률 상승으로 이어지는 악순환이 반복되고 있습니다. 일각에서는 중국 경제가 이미 구조적인 디플레이션 국면에 진입했다는 경고까지 내놓고 있습니다. 다급해진 중국 정부는 대규모 유동성 공급과 보조금 지급 등 경기 부양책을 예고했지만, 시장의 반응은 미지근합니다. 전문가들은 근본적인 체질 개선 없이는 단기적인 부양책의 효과가 제한적일 것으로 분석하고 있습니다.`,
  keyTerms:[{term:`디플레이션`,explanation:`물가가 지속적으로 하락하여 경제 활동 전반이 가라앉는 현상을 말합니다. 물건값이 더 떨어질 것을 기대해 사람들이 돈을 쓰지 않게 되고, 이는 기업의 매출 감소와 일자리 축소로 이어져 나라 경제 전체가 심각한 수렁에 빠지게 됩니다.`}],
  history:`과거 헝다 사태 이후 촉발된 중국 부동산 시장의 붕괴는 수년째 해결되지 않고 있으며, 이는 금융권 부실과 가계 자산 감소로 직결되었습니다.`,
  players:`숫자로 경제 성과를 입증해야 하는 중국 공산당 지도부와, 지갑을 굳게 닫고 소비를 멈춘 중국의 일반 소비자들이 핵심 주체입니다.`,
  current:`부동산 부양책이 연이어 실패하고 청년 고용 시장까지 얼어붙으면서, 중국 경제의 고속 성장 시대가 완전히 저물고 있음을 상징적으로 보여줍니다.`,
  outlook:`다가오는 10월 중국 공산당 중앙위원회 전체회의에서 소비 진작을 위한 파격적인 추가 재정 정책이 발표될 수 있을지 시장이 주목하고 있습니다.`,
  sources:[{title:`China's Economy Stumbles in Q3 - FT`,url:`https://www.ft.com/china-economy-q3`},{title:`Deflation Fears Grow in Beijing - WSJ`,url:`https://www.wsj.com/world/asia/china-deflation-fears`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국 수출 역대 최대치 경신 불구 자영업 폐업률 급증... 극심한 K-양극화`,
  metrics:[`9월 반도체 수출액 145억 달러`,`3분기 자영업자 폐업률 전년비 15% 증가`],
  summary:`인공지능 산업의 폭발적인 성장으로 한국의 반도체 수출이 역대 최대치를 경신하며 거시 경제 지표를 끌어올리고 있습니다. 삼성전자와 SK하이닉스 등 대기업들은 고성능 메모리 수요 급증에 힘입어 사상 최대의 실적을 올리는 중입니다. 반면, 골목상권을 이루는 일반 자영업자와 소상공인들의 체감 경기는 최악의 수준으로 얼어붙었습니다. 장기화된 고물가와 고금리 탓에 서민들의 이자 부담이 커지면서 내수 소비가 꽁꽁 묶였기 때문입니다. 이로 인해 수출 대기업과 내수 중심의 중소상공인 간의 경제 양극화 현상이 유례없이 심화되고 있습니다. 화려한 수출 성적표 이면에 가려진 민생 경제의 붕괴를 막기 위한 맞춤형 핀셋 지원이 시급하다는 목소리가 커지고 있습니다. 정부는 다음 달 초 소상공인 이자 부담 완화를 포함한 종합 대책을 내놓을 예정입니다.`,
  keyTerms:[{term:`경제 양극화`,explanation:`한 나라의 경제 안에서 잘나가는 집단과 그렇지 못한 집단 간의 격차가 극심하게 벌어지는 현상입니다. 반도체 대기업은 큰 돈을 벌고 있지만 동네 식당과 같은 서민 경제는 오히려 무너지고 있는 현재 한국의 뼈아픈 현실을 짚어주는 단어입니다.`}],
  history:`코로나19 팬데믹 이후 누적된 막대한 가계 부채와, 최근 수년간 이어진 글로벌 고금리 기조가 서민 경제를 지속적으로 압박해 왔습니다.`,
  players:`천문학적인 부를 창출하는 글로벌 수출 대기업들과, 치솟는 임대료 및 대출 이자에 신음하며 생존을 위협받는 국내 자영업자들이 극명하게 대비됩니다.`,
  current:`수출 호조의 낙수효과가 내수 시장으로 전혀 흘러오지 않으면서, 국가 경제의 윗목은 끓고 아랫목은 차갑게 식어가는 전례 없는 괴리감이 수치로 증명되고 있습니다.`,
  outlook:`한국은행의 향후 기준금리 인하 시점과 정부의 실질적인 소상공인 지원 정책의 타이밍이 서민 경제 회복의 골든타임을 좌우할 것입니다.`,
  sources:[{title:`한국 반도체 수출 또 신기록 - 연합뉴스`,url:`https://www.yna.co.kr/economy/export-record`},{title:`내수 침체에 자영업자 줄폐업 - 매일경제`,url:`https://www.mk.co.kr/news/economy/closing-business`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미·중 정상 백악관서 AI 패권 놓고 격돌... 우발적 충돌 막을 핫라인 개설 합의`,
  metrics:[`트럼프-시진핑 정상회담 140분 진행`,`AI 비상 핫라인 연내 구축 합의 1건`],
  summary:`도널드 트럼프 미국 대통령과 시진핑 중국 국가주석이 백악관에서 정상회담을 갖고 글로벌 AI 주도권 및 기술 안보 문제를 심도 있게 논의했습니다. 트럼프 대통령은 과도한 규제가 미국의 기술 혁신을 저해한다며 자유로운 AI 개발을 주장한 반면, 시진핑 주석은 정부 통제 하의 안전한 AI 관리를 강조하며 시각차를 여실히 드러냈습니다. 특히 차세대 기술로 꼽히는 에이전틱 AI의 군사적 전용 가능성을 두고 양측은 팽팽한 신경전을 벌였습니다. 양국은 근본적인 이견을 좁히지는 못했지만, 기술적 오해로 인한 우발적 군사 충돌을 방지해야 한다는 데에는 뜻을 같이했습니다. 이에 따라 미 국방부와 중국 중앙군사위원회 사이에 사상 최초로 AI 비상 핫라인을 구축하기로 합의했습니다. 이번 합의는 미·중 기술 패권 경쟁이 새로운 안보 체제 구축으로 이어지고 있음을 시사합니다. 향후 구체적인 핫라인 운영 방식을 두고 양국 실무진의 치열한 줄다리기가 예상됩니다.`,
  keyTerms:[{term:`에이전틱 AI`,explanation:`단순히 사람이 묻는 말에 답만 하는 것이 아니라, 스스로 목표를 세우고 컴퓨터 도구들을 조작해 일을 처리하는 진화된 인공지능입니다. 스스로 판단하고 행동할 수 있기 때문에 이 기술이 무기 통제에 적용될 경우 예상치 못한 재앙이 일어날 수 있어 강대국들이 몹시 경계하고 있습니다.`}],
  history:`미국은 자국의 안보를 위해 중국에 대한 첨단 반도체 수출 통제를 오랫동안 강화해 왔으며, 중국은 이에 맞서 국가 주도의 기술 자립을 치열하게 추진해왔습니다.`,
  players:`미국의 기술적 절대 우위를 지키려는 도널드 트럼프 미국 대통령과, 미국의 전방위적 견제를 뚫고 기술 굴기를 기필코 달성하려는 시진핑 중국 국가주석입니다.`,
  current:`스스로 판단하고 행동하는 자율형 인공지능이 실제 무기 체계에 본격적으로 도입될 가능성이 커지면서, 이를 둘러싼 주요 강대국 간의 군사적 긴장이 최고조에 이른 상황입니다.`,
  outlook:`비상 핫라인 구축을 위한 양국의 실무 협상이 올해 11월 제네바에서 열릴 예정이며, 이 협상의 구체적인 성과가 향후 미·중 관계의 해빙 여부를 결정지을 전망입니다.`,
  sources:[{title:`US, China Agree on AI Crisis Hotline - NYT`,url:`https://www.nytimes.com/politics/us-china-ai-hotline`},{title:`Trump and Xi Clash Over Tech Controls - BBC`,url:`https://www.bbc.com/news/world-us-china-summit`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`호르무즈 해협서 다국적 유조선 또 피격... 중동 전면전 위기 고조`,
  metrics:[`브렌트유 배럴당 95달러 돌파`,`글로벌 해운 보험료 평균 30% 급등`],
  summary:`전 세계 원유 수송의 핵심 길목인 호르무즈 해협에서 다국적 유조선 2척이 정체불명의 드론 공격을 받는 사건이 발생했습니다. 이란의 지원을 받는 친이란 무장 세력의 소행으로 추정되는 이번 공격으로 인해 해당 해역의 물동량이 급감하고 있습니다. 사건 직후 국제 원유 시장은 패닉에 빠졌고, 브렌트유 가격은 단숨에 배럴당 95달러 선을 돌파하며 100달러를 위협하고 있습니다. 미국은 즉각 항공모함 전단을 전진 배치하며 강경 대응을 예고했고, 이스라엘 역시 이란을 배후로 지목하며 강력한 보복을 시사했습니다. 이란은 이번 사건과의 연관성을 강력히 부인하면서도, 자국에 대한 어떠한 공격도 좌시하지 않겠다고 경고했습니다. 전문가들은 이번 사태가 단순한 국지적 도발을 넘어 중동 지역 전체를 아우르는 전면전으로 비화될 수 있다고 우려하고 있습니다. 글로벌 에너지 공급망 붕괴 가능성에 전 세계가 숨을 죽이고 상황을 예의주시하고 있습니다.`,
  keyTerms:[{term:`호르무즈 해협`,explanation:`이란과 아라비아반도 사이에 있는 아주 좁은 바닷길로, 전 세계에서 생산되는 원유의 약 20%가 이곳을 지나갑니다. 이 바닷길이 막히거나 위험해지면 전 세계 기름값이 순식간에 치솟게 되는 글로벌 경제의 최고 핵심 목줄과도 같은 곳입니다.`}],
  history:`이 해협은 과거부터 이란과 서방 국가들 간의 지정학적 갈등이 폭발할 때마다 이란 측의 해협 봉쇄 위협이 끊이지 않던 글로벌 에너지 시장의 최대 화약고입니다.`,
  players:`해협의 강력한 통제권을 주장하는 이란과, 항행의 자유를 수호하려는 미국 및 동맹국들, 그리고 직접적인 타격권에 놓인 중동의 친미 산유국들이 복잡하게 얽혀 있습니다.`,
  current:`이스라엘과 팔레스타인 무장 정파 간의 분쟁 여파가 중동 전역으로 걷잡을 수 없이 확산되면서, 언제 터질지 모르는 시한폭탄 같은 군사적 긴장 상태가 지속되고 있습니다.`,
  outlook:`유엔 안전보장이사회 긴급회의가 이번 주말 소집될 예정이며, 미국의 군사적 대응 수위에 따라 향후 국제 유가의 폭등 여부가 최종 결정될 것입니다.`,
  sources:[{title:`Oil Tankers Attacked in Hormuz - Reuters`,url:`https://www.reuters.com/world/middle-east/hormuz-attack`},{title:`Middle East Edges Closer to Regional War - AP`,url:`https://apnews.com/article/middle-east-tensions-oil`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`국회, 680조 원 규모 내년도 예산안 심사 파행... R&D 및 복지 예산 두고 여야 정면 충돌`,
  metrics:[`2027년도 국가 예산안 총 680조 원`,`국회 예결위 소위 파행 5일째 지속`],
  summary:`총 680조 원 규모로 편성된 2027년도 국가 예산안 심사가 국회에서 여야의 극심한 대립으로 5일째 파행을 겪고 있습니다. 여당은 국가 재정 건전성을 명분으로 정부의 원안 고수와 지출 구조조정을 강력하게 방어하고 있습니다. 반면 야당은 미래 성장 동력 확보를 위해 대폭 삭감된 R&D 예산을 복원하고 서민 복지 예산을 대대적으로 증액해야 한다고 맞서고 있습니다. 양측의 입장이 팽팽하게 맞서면서, 예산결산특별위원회 소위원회는 안건 상정조차 하지 못한 채 헛바퀴만 돌고 있습니다. 일각에서는 헌법이 정한 법정 처리 기한을 훌쩍 넘겨 사상 초유의 준예산 사태가 벌어질 수 있다는 우려마저 나오고 있습니다. 민생 경제가 어려운 상황에서 정치권이 정쟁에만 몰두하며 국가 예산안 심사 과정을 볼모로 잡고 있다는 비판 여론이 거세지고 있습니다. 여야 원내대표가 물밑 접촉을 시도하고 있지만 극적인 타결 여부는 현재로선 불투명합니다.`,
  keyTerms:[{term:`예산안 심사`,explanation:`정부가 다음 해에 국민들의 세금을 어디에 얼마나 쓸지 계획서를 짜오면, 국회의원들이 모여서 그 계획이 타당한지 따져보고 승인해주는 과정입니다. 이 심사가 통과되어야만 국가 기관들이 새해부터 정상적으로 예산을 집행할 수 있습니다.`}],
  history:`매년 연말 국회 예산 정국마다 여당과 야당은 핵심 쟁점 사업의 예산을 두고 기싸움을 벌이다가 막판 밀실 타결을 반복하는 낡은 구태를 꼬리표처럼 달고 다녔습니다.`,
  players:`국가 부채를 줄이고 건전 재정을 최우선 국정 과제로 내세운 정부 및 여당과, 다가오는 선거를 의식해 대규모 재정 투입을 강력히 압박하는 거대 야당이 정면 충돌하고 있습니다.`,
  current:`장기적인 경제 불황으로 막대한 세수 결손이 우려되는 가운데, 한정된 국가 예산을 어디에 우선적으로 배분할 것인가를 두고 양당의 정치적 명운을 건 기싸움이 벌어지는 중입니다.`,
  outlook:`다가오는 정기국회 본회의 일정에 맞춰 극적인 여야 당대표 간의 영수회담이 전격적으로 성사되지 않는다면, 연말까지 예산 정국은 차갑게 얼어붙을 전망입니다.`,
  sources:[{title:`내년도 예산안 심사 전면 중단 - 조선일보`,url:`https://www.chosun.com/politics/budget-freeze`},{title:`R&D 예산 두고 여야 강대강 대치 - 한겨레`,url:`https://www.hani.co.kr/arti/politics/assembly`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`글로벌 통신망 강타한 초고도 해커 AI... 막강한 보안 체계도 일시 무력화`,
  metrics:[`초당 10만 건 이상의 가짜 공격 트래픽 발생`,`글로벌 통신망 일시 장애 약 45분간 지속`],
  summary:`인공지능을 적극적으로 악용한 해커들의 공격으로 전 세계 주요 국가의 통신망과 공공 서비스가 약 45분간 마비되는 사상 초유의 사태가 발생했습니다. 이번 공격은 기존의 해킹 방식을 넘어, 인공지능이 실시간으로 방어 시스템의 취약점을 빠르게 학습하고 스스로 형태를 변형하며 침투하는 극도로 정교한 방식을 띠었습니다. 수많은 기업과 기관들이 도입한 강력한 제로 트러스트 보안망조차 끝없이 변이하는 인공지능의 공격 패턴 앞에서는 일시적으로 속수무책으로 뚫리고 말았습니다. 각국의 사이버 보안 사령부와 글로벌 보안 기업들의 방어 AI가 즉각 가동되면서 1시간이 채 안 되어 시스템은 다행히 복구되었습니다. 하지만 인간의 직접적인 개입 없이 해커의 AI와 보안 AI가 완벽한 기계적인 사이버 전쟁을 벌였다는 점에서 전 세계 안보 전문가들에게 엄청난 충격을 주었습니다. 이번 사건을 계기로 글로벌 보안 인프라에 대한 대대적인 구조 개편 투자가 강력하게 촉발될 것으로 보입니다. 전문가들은 사이버 테러의 패러다임이 완전히 바뀌었다며 새로운 차원의 국제 공조를 촉구하고 나섰습니다.`,
  keyTerms:[{term:`제로 트러스트`,explanation:`'아무것도 믿지 않는다'는 뜻으로, 시스템에 접속하는 모든 사용자와 기기를 끊임없이 의심하고 철저하게 신원을 검증하는 가장 강력한 최신 보안 방식을 의미합니다. 이번 사태는 이처럼 깐깐한 보안망마저 AI의 빠른 학습 능력에 뚫렸다는 점에서 큰 충격을 줍니다.`}],
  history:`AI 기술이 놀라운 속도로 발전함에 따라, 딥페이크나 단순 피싱을 넘어 네트워크 인프라 자체를 스스로 판단해 공격하는 자율형 악성코드가 머지않아 등장할 것이라는 전문가들의 경고가 꾸준히 제기되어 왔습니다.`,
  players:`특정 국가의 암묵적인 지원을 받는 것으로 강하게 의심되는 최상위 해커 조직들과, 시스템을 지키기 위해 사투를 벌이는 글로벌 첨단 사이버 보안 기업들이 전면에 나서 맞서고 있습니다.`,
  current:`이번 초유의 사태는 인공지능이 단순히 해킹을 돕는 도구를 넘어 스스로 공격과 방어의 주체가 되는 '기계들의 전쟁'이 영화 속 상상이 아닌 현실의 가장 시급한 안보 위협이 되었음을 똑똑히 증명했습니다.`,
  outlook:`주요 7개국(G7)은 다음 주 긴급 사이버 안보 화상회의를 열고, 전례 없는 적대적 AI 공격에 신속하게 공동 대응하기 위한 글로벌 공동 사이버 방위망 구축을 심도 있게 논의할 예정입니다.`,
  sources:[{title:`AI Hackers Disrupt Global Networks - Wired`,url:`https://www.wired.com/story/ai-hacker-network-outage`},{title:`The Rise of Machine vs Machine Cyber Warfare - FT`,url:`https://www.ft.com/tech-ai-cyber-security`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`구글·아마존, AI 전력 부족 타개 위해 차세대 소형 원전 직접 건설에 뛰어들어`,
  metrics:[`글로벌 데이터센터 전력 수요 40% 이상 급증`,`빅테크 기업들의 SMR 초기 투자액 30억 달러 돌파`],
  summary:`구글과 아마존을 비롯한 글로벌 빅테크 기업들이 천문학적으로 치솟는 AI 데이터센터 전력 수요를 스스로 감당하기 위해 원자력 발전소 직접 건설이라는 초강수를 꺼내 들었습니다. 이들은 탄소 배출을 획기적으로 줄이면서도 24시간 끊김 없이 안정적인 전력 공급이 가능한 소형 모듈 원전(SMR) 기술 상용화에 막대한 자본을 쏟아붓고 있습니다. 기존의 풍력이나 태양광 같은 날씨에 의존하는 재생에너지로는 기하급수적으로 폭증하는 AI 연산용 전기 수요를 도저히 감당할 수 없다는 현실적인 판단이 작용했습니다. 미국 에너지부 역시 민간 기업들의 이러한 과감한 움직임을 적극적으로 지원하며 관련 원전 규제 완화를 서둘러 추진하고 있습니다. 환경 단체들은 치명적인 핵폐기물 처리 문제와 안전성을 이유로 강력히 반발하고 있지만, 기술 업계는 무탄소 에너지원인 SMR이 유일하고도 현실적인 대안이라며 물러서지 않고 있습니다. 빅테크 기업들이 단순한 소프트웨어 회사를 넘어 거대한 에너지 기업으로 탈바꿈하면서 기존 산업의 굳건한 경계가 허물어지고 있습니다. 차세대 원전 기술 부품을 생산하는 한국의 원전 설비 기업들도 덩달아 막대한 글로벌 수출 반사이익을 얻을 것으로 큰 기대를 모으고 있습니다.`,
  keyTerms:[{term:`소형 모듈 원전(SMR)`,explanation:`거대한 크기의 기존 원자력 발전소와 달리, 공장에서 주요 부품을 미리 조립해 현장에 설치하는 미니 원자력 발전소입니다. 크기가 작아 짓기 쉽고 고장 시 스스로 식을 수 있도록 설계되어 기존 원전보다 상대적으로 안전하다는 평가를 받습니다.`}],
  history:`초기 클라우드 컴퓨팅 시절에는 재생에너지를 대거 활용한 친환경 데이터센터 구축이 글로벌 대유행이었으나, 막대한 전력을 빨아들이는 생성형 AI의 등장으로 근본적이고 만성적인 에너지 부족 사태에 직면하게 되었습니다.`,
  players:`막힘없이 돌아가는 무한한 전기가 생존의 필수 조건이 된 글로벌 빅테크 기업들과 차세대 원전 혁신 기술을 보유한 첨단 스타트업들, 그리고 원전의 섣부른 확대를 심각하게 우려하는 환경 보호 단체들이 주요 플레이어입니다.`,
  current:`인공지능 기술 패권이 곧 21세기 국가의 강력한 안보 경쟁력이 된 상황에서, 풍부하고 저렴한 전력을 제때 확보하지 못하면 글로벌 AI 경쟁에서 순식간에 도태된다는 절박함이 전 세계 기술 업계를 강력하게 지배하고 있습니다.`,
  outlook:`세계 최초의 상용 SMR 데이터센터 착공 허가가 내년 중 미국 에너지 당국으로부터 최종 승인될 가능성이 매우 높으며, 이는 글로벌 에너지 시장과 기술 산업의 판도를 근본적으로 뒤흔들 가장 결정적인 사건이 될 것입니다.`,
  sources:[{title:`Big Tech Turns to Nuclear for AI - The Economist`,url:`https://www.economist.com/business/tech-nuclear-smr`},{title:`Amazon and Google Pour Billions into SMRs - Bloomberg`,url:`https://www.bloomberg.com/news/tech-smr-investments`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`한국 출산율 0.6명대 추락 충격... 정부, '신혼부부 반값 아파트' 파격 승부수 띄워`,
  metrics:[`2026년 2분기 합계출산율 0.68명 기록`,`신혼부부 특별 주택 대출 한도 5억 원으로 대폭 상향`],
  summary:`통계청 공식 발표 결과 올해 2분기 대한민국의 합계출산율이 0.68명으로 집계되며 역대 최저치를 다시 한번 충격적으로 갱신했습니다. 인구 절벽을 넘어선 소멸 위기가 걷잡을 수 없이 가속화되자, 정부는 청년층의 결혼과 출산을 가로막는 가장 거대한 장벽인 주거 문제를 단번에 해결하기 위한 파격적인 특단의 대책을 오늘 오전 전격 발표했습니다. 이번 파격 대책의 핵심은 자녀를 출산한 신혼부부에게 도심 내 교통이 편리한 주요 신축 아파트를 시세의 정확히 절반 가격에 최장 20년간 임대해주고, 집을 살 때 필요한 저금리 주택 대출 한도를 기존보다 훨씬 높은 최대 5억 원까지 획기적으로 늘려주는 것입니다. 주거난에 허덕이던 청년층 사이에서는 가뭄에 단비 같은 혜택이라는 긍정적인 기대 반응도 있지만, 실질적인 실효성에 대한 의문의 목소리도 만만치 않게 제기되고 있습니다. 다수의 부동산 전문가들은 수요가 몰리는 수도권 핵심 지역 내 공급 물량이 턱없이 부족해 실제 혜택의 사다리를 타는 부부가 극소수에 불과할 것이라고 매섭게 비판하고 있습니다. 또한 막대한 국가 재원이 한꺼번에 투입되는 땜질식 처방인 만큼 국가 부채의 가파른 증가 우려와 혜택을 받지 못하는 다른 세대와의 억울한 형평성 논란도 뜨겁게 달아오르고 있습니다. 이번 파격적인 주거 혁신 조치가 끝없이 곤두박질치는 한국의 출산율 그래프를 기적적으로 반등시킬 불씨가 될 수 있을지 온 국민적 관심이 집중되고 있습니다.`,
  keyTerms:[{term:`합계출산율`,explanation:`한 명의 여성이 가임 기간 동안 낳을 것으로 예상되는 평균 자녀의 수를 의미하는 핵심 인구 지표입니다. 이 수치가 2.1명은 되어야 나라의 인구가 줄어들지 않고 유지될 수 있는데, 한국은 그 기준의 3분의 1에도 미치지 못하는 아주 심각한 상황입니다.`}],
  history:`지난 10년이 넘는 기간 동안 역대 정부는 무려 수백조 원에 달하는 막대한 세금을 저출산 대책에 쏟아부었으나, 아이 돌봄이나 단편적인 현금 쥐여주기에 그치며 근본적인 출산율 하락의 둑을 막아내는 데 철저히 실패해 왔습니다.`,
  players:`국가 소멸의 위기를 기필코 막아내려는 정부의 핵심 정책 부처와, 천정부지로 치솟는 집값 및 살인적인 사교육비에 짓눌려 결국 출산을 포기하고 마는 2030 청년 세대가 문제의 중심에 서 있습니다.`,
  current:`현재 한국의 상황은 경제 협력 개발 기구(OECD) 국가 중 압도적 꼴찌 수준을 넘어 전 세계 학자들로부터 국가 소멸론까지 엄중하게 제기될 정도로 저출산 문제가 더는 물러설 곳 없는 임계점을 돌파한 절체절명의 위기 상황입니다.`,
  outlook:`새롭게 발표된 획기적인 주거 지원 정책의 실제 첫 사전 청약이 오는 12월부터 수도권 일대에서 본격적으로 시작될 예정이며, 주거 불안에 시달리는 청년들의 실제 참여율과 반응이 정책 성공 여부의 최종 가늠자가 될 것입니다.`,
  sources:[{title:`출산율 0.6명대 충격, 정부 특단 주거 대책 - 중앙일보`,url:`https://www.joongang.co.kr/article/low-birth-rate-housing`},{title:`신혼부부 반값 아파트 실효성 논란 - KBS`,url:`https://news.kbs.co.kr/news/view.do?ncd=birth-policy-debate`}]
}]

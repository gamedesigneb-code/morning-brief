<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모닝 브리핑</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --sidebar-w: 240px;
    --bg: #FAFAF7;
    --paper: #FFFFFF;
    --accent: #6B7A8F;
    --accent-soft: #E8ECEF;
    --line: #EAE8E3;
    --line-strong: #D8D5CE;
    --text: #2D2A26;
    --text-mid: #6B655D;
    --text-sub: #A09889;
    --radius: 10px;
  }
  html, body {
    height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 15px; line-height: 1.65; font-weight: 400;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }

  /* ── Layout ── */
  #app { display: flex; height: 100vh; overflow: hidden; }

  /* ── Sidebar ── */
  #sidebar {
    width: var(--sidebar-w); flex-shrink: 0;
    background: var(--bg); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #sidebar-header {
    padding: 36px 20px 24px;
    border-bottom: 1px solid var(--line);
    text-align: center;
  }
  #sidebar-header h1 {
    font-size: 19px; font-weight: 700; color: var(--text);
    letter-spacing: -0.4px; line-height: 1.3;
  }
  #sidebar-header p {
    font-size: 12px; color: var(--text-sub); margin-top: 6px;
    letter-spacing: 0.3px;
  }
  #date-list { overflow-y: auto; flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
  .date-item {
    padding: 11px 14px; cursor: pointer; border-radius: 8px;
    transition: background 0.15s, color 0.15s;
    background: transparent;
    text-align: center; font-size: 13px; font-weight: 500; color: var(--text-mid);
    letter-spacing: 0.1px;
  }
  .date-item:hover { background: var(--accent-soft); color: var(--text); }
  .date-item.active {
    background: var(--accent-soft); color: var(--text); font-weight: 600;
  }

  /* ── Main ── */
  #main { flex: 1; overflow-y: auto; background: var(--paper); }
  #content { max-width: 760px; margin: 0 auto; padding: 56px 40px 80px; }

  .brief-header { margin-bottom: 36px; }
  .brief-header .bh-eyebrow {
    font-size: 11px; color: var(--text-sub); margin-bottom: 8px;
    letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500;
  }
  .brief-header h2 {
    font-size: 30px; font-weight: 700; letter-spacing: -0.7px;
    color: var(--text); line-height: 1.25;
  }

  /* ── Sticky Top (header + tabs) ── */
  .sticky-top {
    position: sticky; top: 0;
    background: var(--paper); z-index: 20;
    padding-top: 56px; margin-top: -56px;
  }
  .sticky-top .brief-header { margin-bottom: 24px; }

  /* ── Category Tabs ── */
  .cat-tabs {
    display: flex; gap: 0; margin-bottom: 36px;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
  }
  .cat-tab {
    padding: 12px 20px 14px; cursor: pointer; font-size: 14px; font-weight: 500;
    color: var(--text-sub); border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    background: none; border-top: none; border-left: none; border-right: none;
    font-family: inherit; letter-spacing: -0.1px;
    margin-bottom: -1px;
  }
  .cat-tab:hover { color: var(--text-mid); }
  .cat-tab.active { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }

  /* ── Sources (collapsible) ── */
  .sources-toggle {
    background: transparent; border: 1px solid var(--line-strong);
    padding: 8px 14px; border-radius: 6px; font-size: 12.5px; font-weight: 500;
    color: var(--text-mid); cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    font-family: inherit; margin-top: 12px;
    transition: background 0.15s, border-color 0.15s;
  }
  .sources-toggle:hover { background: var(--accent-soft); border-color: var(--accent); }
  .sources-toggle .arrow { transition: transform 0.2s; font-size: 9px; color: var(--text-sub); }
  .sources-toggle.open .arrow { transform: rotate(180deg); }
  .sources-body { display: none; margin-top: 12px; padding-left: 4px; }
  .sources-body.open { display: block; }

  /* ── Story Card ── */
  .story { margin-bottom: 40px; }
  .story-top { margin-bottom: 18px; }
  .story-headline {
    font-size: 19px; font-weight: 700; line-height: 1.45;
    letter-spacing: -0.4px; color: var(--text);
  }

  .metrics { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .metric-chip {
    background: var(--accent-soft); border: none;
    border-radius: 6px; padding: 7px 12px;
    font-size: 12.5px; font-weight: 500; color: var(--text-mid);
    line-height: 1.4;
  }

  .summary {
    font-size: 15px; line-height: 1.8; color: var(--text); margin-bottom: 20px;
    letter-spacing: -0.1px;
  }
  .summary .kt-underline {
    color: #1996BD;
    text-decoration: underline;
    text-decoration-color: #1996BD;
    text-decoration-thickness: 1.5px;
    text-underline-offset: 3px;
    cursor: help;
  }

  /* ── Key Terms Box ── */
  .key-terms {
    background: #F4F1EA; border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius); padding: 18px 22px; margin-bottom: 14px;
  }
  .key-terms-title {
    font-size: 11px; font-weight: 600; color: var(--text-sub);
    text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 14px;
  }
  .kt-item { margin-bottom: 12px; }
  .kt-item:last-child { margin-bottom: 0; }
  .kt-term {
    font-size: 13.5px; font-weight: 700; color: #1996BD;
    margin-bottom: 4px; display: block;
    letter-spacing: -0.1px;
  }
  .kt-exp {
    font-size: 13.5px; line-height: 1.7; color: var(--text-mid);
  }

  /* ── Background ── */
  .bg-box {
    background: var(--bg); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 22px 24px; margin-bottom: 14px;
  }
  .bg-box-title {
    font-size: 11px; font-weight: 600; color: var(--text-sub);
    text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 16px;
  }
  .bg-section { margin-bottom: 16px; }
  .bg-section:last-child { margin-bottom: 0; }
  .bg-section-label {
    font-size: 12.5px; font-weight: 600; color: var(--text); margin-bottom: 6px;
    letter-spacing: -0.1px;
  }
  .bg-section-text { font-size: 14px; line-height: 1.75; color: var(--text-mid); }

  /* ── Sources ── */
  .source-item {
    display: flex; align-items: flex-start; gap: 10px;
    margin-bottom: 8px; font-size: 13px;
  }
  .src-num {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent-soft); color: var(--text-mid);
    font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .source-item a { color: var(--text-mid); text-decoration: none; line-height: 1.55; }
  .source-item a:hover { color: var(--text); text-decoration: underline; }

  .story-divider { border: none; border-top: 1px solid var(--line); margin: 36px 0; }

  .empty { color: var(--text-sub); font-size: 14px; padding: 60px 0; text-align: center; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }

  /* ── Mobile Toggle ── */
  #sidebar-toggle {
    display: none;
    position: fixed; top: 14px; left: 14px; z-index: 50;
    background: var(--paper); border: 1px solid var(--line-strong);
    width: 40px; height: 40px; border-radius: 10px;
    cursor: pointer; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(45, 42, 38, 0.08);
  }
  #sidebar-toggle span {
    display: block; width: 18px; height: 2px; background: var(--text);
    position: relative;
  }
  #sidebar-toggle span::before,
  #sidebar-toggle span::after {
    content: ''; position: absolute; left: 0; width: 18px; height: 2px; background: var(--text);
  }
  #sidebar-toggle span::before { top: -6px; }
  #sidebar-toggle span::after { top: 6px; }

  #sidebar-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(45, 42, 38, 0.4); z-index: 40;
  }
  #sidebar-backdrop.open { display: block; }

  /* ── Mobile Responsive ── */
  @media (max-width: 768px) {
    #sidebar-toggle { display: flex; }
    #sidebar {
      position: fixed; left: 0; top: 0; bottom: 0;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      z-index: 45; width: 260px;
      box-shadow: 0 0 24px rgba(45, 42, 38, 0.12);
    }
    #sidebar.open { transform: translateX(0); }

    #content { padding: 64px 20px 60px; max-width: 100%; }
    .brief-header h2 { font-size: 22px; }
    .story-headline { font-size: 16px; }
    .summary { font-size: 14.5px; line-height: 1.75; }
    .bg-section-text { font-size: 13.5px; }
    .metric-chip { font-size: 12px; padding: 6px 10px; }
    .bg-box { padding: 18px 18px; }
    .cat-tab { padding: 11px 14px; font-size: 13.5px; }

    .quiz-card { padding: 28px 24px 24px; }
    .quiz-q { font-size: 17px; }
    .quiz-choice { font-size: 14px; padding: 13px 16px; }
  }

  /* ── Quiz Overlay ── */
  body.quiz-active #app {
    filter: blur(6px) saturate(0.85);
    pointer-events: none;
    transition: filter 0.3s ease;
  }
  #quiz-overlay {
    position: fixed; inset: 0;
    background-color: rgba(250, 250, 247, 0.55);
    background-image:
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0) 0,
        rgba(255,255,255,0) 5px,
        rgba(45,42,38,0.04) 5px,
        rgba(45,42,38,0.04) 6px
      ),
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0) 0,
        rgba(255,255,255,0) 22px,
        rgba(45,42,38,0.025) 22px,
        rgba(45,42,38,0.025) 23px
      );
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 24px;
  }
  #quiz-overlay.hidden { display: none; }

  .quiz-card {
    background: var(--paper); border-radius: 16px;
    padding: 36px 36px 32px; width: 100%; max-width: 440px;
    box-shadow: 0 16px 48px rgba(45, 42, 38, 0.18);
  }
  .quiz-eyebrow {
    font-size: 11px; color: var(--text-sub); letter-spacing: 1.5px;
    text-transform: uppercase; font-weight: 500; margin-bottom: 12px;
  }
  .quiz-q {
    font-size: 19px; font-weight: 700; color: var(--text);
    line-height: 1.5; letter-spacing: -0.3px; margin-bottom: 24px;
  }
  .quiz-choices { display: flex; flex-direction: column; gap: 8px; }
  .quiz-choice {
    background: var(--paper); border: 1px solid var(--line-strong);
    padding: 14px 18px; border-radius: 10px; font-size: 14.5px; font-weight: 500;
    color: var(--text); cursor: pointer; text-align: left;
    font-family: inherit; transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .quiz-choice:focus { outline: none; }
  .quiz-choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) {
    .quiz-choice:hover { background: var(--accent-soft); border-color: var(--accent); }
  }
  .quiz-choice:active { transform: scale(0.99); }
  .quiz-choice.wrong {
    background: #F5E6E0; border-color: #C9947F; color: #8A4A30;
    animation: shake 0.4s ease;
  }
  .quiz-choice.correct {
    background: #E3EDE2; border-color: #7A9077; color: #2E4A2C;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .quiz-feedback {
    margin-top: 20px; text-align: center; font-size: 14px; font-weight: 500;
    color: var(--text-mid); min-height: 22px;
  }
  .quiz-feedback.right { color: #2E4A2C; }
  .quiz-feedback.wrong { color: #8A4A30; }

  .quiz-close-btn {
    margin-top: 18px; width: 100%;
    background: var(--text); color: var(--paper); border: none;
    padding: 13px 20px; border-radius: 10px; font-size: 14px; font-weight: 600;
    font-family: inherit; cursor: pointer;
    transition: background 0.15s;
  }
  .quiz-close-btn:hover { background: #1a1815; }
  .quiz-close-btn.hidden { display: none; }
</style>
</head>
<body>
<div id="quiz-overlay">
  <div class="quiz-card">
    <div class="quiz-eyebrow"><span>잠깐, 나에 대해서 잘 알지?</span> <span id="quiz-counter">(0/3)</span></div>
    <div class="quiz-q" id="quiz-q"></div>
    <div class="quiz-choices" id="quiz-choices"></div>
    <div class="quiz-feedback" id="quiz-feedback"></div>
    <button class="quiz-close-btn hidden" id="quiz-close">닫기</button>
  </div>
</div>

<button id="sidebar-toggle" aria-label="메뉴"><span></span></button>
<div id="sidebar-backdrop"></div>

<div id="app">
  <nav id="sidebar">
    <div id="sidebar-header">
      <h1>모닝 브리핑</h1>
      <p>일별 세계 뉴스 요약</p>
    </div>

    <div id="date-list"></div>
  </nav>
  <main id="main">
    <div id="content"></div>
  </main>
</div>

<script>
const BRIEFS = [{
  tag:`2026-10-25`,
  label:`2026년 10월 25일 (일)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`SK하이닉스, 자회사 솔리다임 미국 나스닥 상장 추진 전격 철회`,
  metrics:[`약 40조 원 규모 솔리다임 기업가치 재평가 대기`,`SK하이닉스 주가 장중 약 2.5% 상승`],
  summary:`SK하이닉스가 자회사 솔리다임의 미국 나스닥 상장(IPO) 및 프리IPO 추진 검토를 전격 중단한다고 공시했습니다. 당초 미국 낸드플래시 시장 공략을 위해 자금 조달을 목표로 상장을 추진했으나, 모회사 주주가치를 훼손하는 쪼개기 상장 논란이 거세지자 이를 철회한 것입니다. 금융당국의 엄격해진 중복 상장 규제 기조도 이번 결정에 큰 영향을 미친 것으로 보입니다. 이번 결정으로 기존 주주들의 지분 희석 우려가 해소되면서 단기적으로 주가는 반등하는 모습을 보였습니다. 다만, 향후 수십조 원 단위의 미국 공장 증설과 AI 반도체 투자를 이어가기 위해서는 새로운 자금 조달 플랜B 마련이 시급해진 상황입니다.`,
  keyTerms:[{term:`쪼개기 상장`,explanation:`핵심 사업부나 유망한 자회사를 별도의 회사로 분리해 주식 시장에 상장하는 것을 말합니다. 기존 모회사 주주의 가치가 훼손될 수 있어 논란이 됩니다.`}],
  history:`솔리다임은 인텔의 낸드 사업부를 인수해 출범한 자회사입니다. 최근 AI 수요 증가로 기업가치가 상승하며 상장 기대감이 컸습니다.`,
  players:`SK하이닉스와 금융당국, 그리고 주주가치 훼손을 우려하는 소액 주주들이 얽혀 있습니다.`,
  current:`금융당국의 제재 부담과 주주들의 반발을 수용해 상장을 전격 철회하며 시장의 불확실성을 일부 해소했습니다.`,
  outlook:`자체 현금 창출력과 외부 차입 등을 통해 미국 투자 자금을 어떻게 마련할지 향후 자금 조달 계획 발표가 주목받고 있습니다.`,
  sources:[{title:`SK하이닉스, 중복 상장 논란에 솔리다임 상장 철회 - 한국경제`,url:`https://www.hankyung.com/economy`},{title:`금융당국 제재 우려에 나스닥 상장 접은 SK - 동아일보`,url:`https://www.donga.com/news`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`정용진 신세계 회장, 13년 만에 이마트 대표이사 등기임원 전격 복귀`,
  metrics:[`2013년 이후 13년 만의 등기이사 복귀`,`40대 젊은 임원 30% 대거 발탁`],
  summary:`신세계그룹 정기 임원인사에서 정용진 회장이 핵심 계열사인 이마트의 대표이사로 전격 등판했습니다. 이는 2013년 등기이사직에서 물러난 이후 무려 13년 만의 복귀입니다. 최근 오프라인 유통 시장의 침체와 온라인 커머스 경쟁 격화로 인한 그룹 전체의 위기를 정면 돌파하겠다는 의지로 풀이됩니다. 특히 오너가 직접 경영 전면에 나서는 책임경영 기조를 명확히 하며, 위기 극복의 고삐를 죄고 있습니다. 동시에 40대 임원을 대거 발탁하여 조직에 젊은 피를 수혈하고 대대적인 체질 개선을 시도하고 있습니다.`,
  keyTerms:[{term:`책임경영`,explanation:`기업의 실질적 소유주나 최고 경영자가 경영 결과에 대해 법적, 도의적 책임을 지고 경영 전면에 나서는 것을 뜻합니다.`}],
  history:`정 회장은 과거 등기이사직에서 물러나 미등기 임원으로 활동해왔으나, 최근 실적 부진으로 리더십 변화 요구가 있었습니다.`,
  players:`정용진 회장 및 기존 김홍극 대표 등 신세계그룹 수뇌부와 유통 업계 경쟁자들이 주요 행위자입니다.`,
  current:`각자대표 체제를 통해 본업 경쟁력 강화와 신사업 동력 발굴을 동시에 추진하는 새로운 체제를 구축했습니다.`,
  outlook:`다가오는 연말 쇼핑 시즌과 내년 상반기 실적을 통해 오너 복귀의 성과와 체질 개선 효과가 입증될 수 있을지 주목됩니다.`,
  sources:[{title:`정용진 13년만의 귀환, 신세계 위기 돌파 특단 조치 - 중앙일보`,url:`https://joongang.co.kr/economy`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미 연준 금리 인하 속도 조절 시사에 미 국채 10년물 금리 5% 육박`,
  metrics:[`미 국채 10년물 금리 장중 4.95% 돌파`,`빅테크 AI 자본지출(CapEx) 회수 우려 부각`],
  summary:`미국의 견조한 경제 지표가 잇따라 발표되면서 연방준비제도(Fed)가 금리 인하 속도를 늦출 수 있다는 관측이 시장에 확산되고 있습니다. 이로 인해 글로벌 벤치마크 역할을 하는 미 국채 10년물 금리가 5% 선에 육박하며 크게 치솟았습니다. 고금리 장기화 우려 속에 글로벌 금융시장 전반의 경계감이 커지고 있습니다. 한편, 실적 발표를 앞둔 미국 빅테크 기업들이 AI 분야에 막대한 자본적 지출을 쏟아붓고 있지만, 실질적인 수익 회수 여부에 대한 의구심이 부각되며 투자 심리는 더욱 위축되었습니다. 결과적으로 안전자산 선호 현상이 짙어지며 기술주 중심의 주가 변동성이 확대되었습니다.`,
  keyTerms:[{term:`안전자산 선호`,explanation:`경제적, 정치적 불확실성이 커질 때 투자자들이 주식 등 위험자산을 팔고 국채나 금 등 비교적 안전한 자산으로 자금을 이동시키는 현상입니다.`}],
  history:`미 연준은 인플레이션 둔화 조짐에 따라 금리 인하 사이클을 준비해왔으나, 최근 고용과 소비 지표가 예상보다 강하게 나타났습니다.`,
  players:`미국 연방준비제도(Fed)와 월스트리트 투자자들, 그리고 거액의 투자를 단행하는 주요 빅테크 기업들이 핵심 주체입니다.`,
  current:`연준 인사들의 매파적 발언과 빅테크 실적 불안감이 겹치며 시장 금리가 급등하고 투자자들은 짙은 관망세로 돌아섰습니다.`,
  outlook:`조만간 발표될 미국 핵심 물가지수와 대형 기술주들의 3분기 실적 발표 결과가 금리와 증시 방향성을 결정지을 것입니다.`,
  sources:[{title:`Fed 속도조절론에 요동치는 국채금리 - 한국경제`,url:`https://www.hankyung.com/finance`},{title:`빅테크 AI 투자 수익성 도마 위 - 매일경제`,url:`https://www.mk.co.kr/news`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`오세훈 서울시장 항소심 무죄 선고, 여야 정치권 대선 주도권 공방 격화`,
  metrics:[`1심 유죄 뒤집고 항소심 무죄 선고`,`여야 대변인 논평 등 하루 20여 건 쏟아져`],
  summary:`선거법 위반 혐의 등으로 기소되었던 오세훈 서울시장이 항소심 재판에서 무죄를 선고받았습니다. 1심의 판결을 뒤집은 이번 판결로 인해 오 시장은 자신을 옭아매던 법적 족쇄를 풀고 보수 진영 내 유력 대권 주자로서의 입지를 탄탄하게 굳히게 되었습니다. 여당은 즉각 사법부의 현명한 판단을 환영하며 정치적 탄압이 입증되었다고 목소리를 높였습니다. 반면, 야당은 이번 판결을 강하게 비판하며 대법원 상고를 포함한 추가적인 정치 공세 수위를 높이고 있습니다. 이로 인해 사법 리스크를 둘러싼 여야 간의 정쟁은 정기국회 막바지에 더욱 거세지고 있습니다.`,
  keyTerms:[{term:`사법 리스크`,explanation:`정치인이나 기업인이 재판, 수사 등 법적 문제에 휘말려 정치적 행보나 경영 활동에 부정적인 영향을 받는 위험을 의미합니다.`}],
  history:`오 시장은 과거 선거 과정에서의 발언과 관련해 공직선거법 위반 혐의로 기소되어 1심에서 유죄 판결을 받은 바 있습니다.`,
  players:`재판부, 오세훈 시장 측 변호인단, 그리고 주도권을 쥐려는 여야 정치권 핵심 인사들이 얽혀 있습니다.`,
  current:`항소심 무죄 선고 직후 오 시장의 정치적 운신 폭이 크게 넓어졌으며, 보수 진영 내 대권 경쟁 구도에도 지각변동이 일어났습니다.`,
  outlook:`검찰의 대법원 상고 여부와 최종 판결 결과가 남아 있으며, 이를 지렛대로 삼은 여야의 치열한 여론전이 계속될 전망입니다.`,
  sources:[{title:`오세훈 항소심서 무죄 반전... 대권 행보 날개 달았다 - 조선일보`,url:`https://chosun.com/politics`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`김정은 북한 국무위원장 중국 단둥 전격 방문, 북·중 밀착 행보 가속화`,
  metrics:[`중국 참전 기념일 앞두고 전격 회동`,`신규 북중 국경 교량 개통식 참석`],
  summary:`중국의 6·25 전쟁 참전 기념일을 앞두고 김정은 북한 국무위원장이 접경 도시인 중국 단둥을 전격 방문했습니다. 이번 방문은 새로 완공된 북·중 국경 교량 개통식에 맞춰 이루어졌으며, 중국 고위급 인사들과의 회동이 포함되었습니다. 최근 글로벌 제재가 지속되는 가운데 북한과 중국이 노골적인 밀착 행보를 과시하며 서방 진영을 압박하려는 의도로 분석됩니다. 국제사회는 이러한 움직임이 한반도를 둘러싼 신냉전 구도를 더욱 고착화시킬 수 있다고 우려하고 있습니다. 특히 러시아와의 군사 협력에 이어 중국과의 경제·외교적 유대까지 강화하면서 역내 안보 리스크가 급부상하고 있습니다.`,
  keyTerms:[{term:`신냉전 구도`,explanation:`과거 미국과 소련의 냉전처럼, 현재 미국 중심의 서방 세계와 중국·러시아 등 반서방 진영 간의 군사적, 경제적 대립이 심화되는 국제 질서를 뜻합니다.`}],
  history:`북한은 코로나19 이후 국경을 폐쇄했으나, 최근 러시아 및 중국과의 교류를 단계적으로 재개하며 진영 외교를 강화해왔습니다.`,
  players:`김정은 국무위원장과 중국 지도부, 그리고 이를 견제하는 한미일 외교·안보 당국이 주요 플레이어입니다.`,
  current:`북중 간 새로운 무역 통로 개통과 고위급 회담을 통해 양국은 경제적 상호 의존도와 군사적 연대를 공개적으로 선포했습니다.`,
  outlook:`이번 회동의 구체적인 경제 지원 합의 내용과 다가오는 주요 국제 회의에서 한미일 연합이 내놓을 대응 메시지에 관심이 쏠립니다.`,
  sources:[{title:`김정은, 단둥 깜짝 방문... 북중 혈맹 과시 - 연합뉴스`,url:`https://www.yna.co.kr/politics`},{title:`신냉전 고착화 우려 키우는 북중러 밀착 - 한겨레`,url:`https://www.hani.co.kr/politics`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`우크라이나-러시아 남부 올레시키 국지적 휴전 합의 및 대규모 포로 교환`,
  metrics:[`양측 270명씩 총 540명 군인 맞교환`,`10월 29일부터 임시 휴전 발효 예정`],
  summary:`기나긴 소모전이 이어지던 우크라이나 전쟁에서 남부 전선의 핵심 요충지인 올레시키 지역에 대해 임시 휴전이 성사되었습니다. 러시아와 우크라이나 양국은 민간인 대피와 인도적 구호품 전달을 목적으로 오는 29일부터 며칠간 국지적 휴전에 들어가기로 전격 합의했습니다. 이와 동시에 양측은 각각 270명씩, 총 540명의 군인을 돌려보내는 대규모 포로 교환도 단행했습니다. 비록 전면전 종식은 아니지만, 양국 간 소통 채널이 열리고 실질적인 군사 충돌 중단이 합의되었다는 점에서 외교적 돌파구 마련에 대한 기대감이 피어오르고 있습니다. 국제사회는 이번 조치가 평화 협상의 마중물이 되기를 희망하고 있습니다.`,
  keyTerms:[{term:`국지적 휴전`,explanation:`전쟁 전체를 멈추는 전면 휴전이 아니라, 특정한 제한된 지역이나 기간에 대해서만 일시적으로 교전을 중단하는 합의를 말합니다.`}],
  history:`우크라이나 남부 전선은 치열한 교전으로 수많은 민간인 사상자와 인프라 파괴가 발생하며 인도적 위기가 최고조에 달했던 곳입니다.`,
  players:`러시아와 우크라이나 정부 대표단, 그리고 중재에 나선 제3국 외교 채널들이 협상을 이끌었습니다.`,
  current:`포로들이 무사히 본국으로 송환되고 있으며, 휴전 발효를 앞두고 유엔 등 구호 단체들이 긴급 식량과 의약품 반입을 준비 중입니다.`,
  outlook:`임시 휴전이 성공적으로 유지될 경우, 이를 타 전선으로 확대하거나 정식 평화 회담으로 이어갈 수 있을지가 관건입니다.`,
  sources:[{title:`우크라-러, 남부 요충지서 임시 휴전 합의 - KBS 뉴스`,url:`https://news.kbs.co.kr/world`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`구형 PHP 치명적 제로데이 취약점 확인, 한국 정부 사이버위기 경보 단계 상향`,
  metrics:[`보안 위험도 9.2점 (10점 만점)`,`국내 수십만 개 웹사이트 잠재적 노출 위험`],
  summary:`서버 관리자의 별도 인증 없이도 원격에서 악성 명령을 실행할 수 있는 치명적인 PHP 보안 취약점이 확인되어 IT 업계에 비상이 걸렸습니다. 과학기술정보통신부와 한국인터넷진흥원은 사안의 심각성을 고려해 국가 사이버위기 경보를 즉각 격상했습니다. 이 취약점은 널리 쓰이는 구형 PHP 버전에 존재하여 공공기관 및 민간 웹사이트 수만 곳이 잠재적인 해킹 위협에 노출된 상태입니다. 정부는 즉각적인 보안 패치 적용과 서버 접근 제어 강화를 권고하는 긴급 대응 수칙을 발표했습니다. 민간 기업과 보안 당국은 대규모 데이터 유출 피해를 막기 위해 철야 대응 체제에 돌입했습니다.`,
  keyTerms:[{term:`사이버위기 경보`,explanation:`국가에 대한 사이버 공격 위협이 발생했을 때, 그 위험의 심각성에 따라 정상, 관심, 주의, 경계, 심각 5단계로 발령하는 예보 시스템입니다.`}],
  history:`PHP는 전 세계 웹사이트의 상당수를 구동하는 핵심 언어로, 이번과 같은 구조적 결함은 과거 대규모 해킹 사태의 원인이 되곤 했습니다.`,
  players:`취약점을 악용하려는 해킹 그룹, 방어에 나선 인터넷진흥원(KISA) 및 각 기업의 보안 담당자들이 대응 중입니다.`,
  current:`보안 당국을 중심으로 전국의 취약 서버 목록을 스캔하고 보안 업데이트를 독려하는 경고 안내문이 대대적으로 발송되고 있습니다.`,
  outlook:`미처 패치를 적용하지 못한 중소형 웹사이트를 노린 2차 해킹 공격 발생 여부와 추가적인 보안 취약점 발견 여부를 예의주시해야 합니다.`,
  sources:[{title:`최악의 PHP 취약점 발견... 보안 당국 긴급 패치 권고 - SBS 뉴스`,url:`https://news.sbs.co.kr/it`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`국산 AI로 상상력 활짝, 전국 어린이 AI 창작대회 본선 성황리 개최`,
  metrics:[`치열한 예선 뚫고 60개 초등학생 팀 본선 진출`,`국산 거대언어모델(LLM) 100% 활용 규정 적용`],
  summary:`과학기술정보통신부가 주최하는 전국 단위의 어린이 AI 창작대회 본선이 카카오 AI캠퍼스에서 성황리에 개최되었습니다. 이번 대회는 치열한 예선을 거쳐 선발된 전국의 초등학생 60개 팀이 참가해 국산 생성형 AI 툴을 활용하여 자신만의 창작물을 만드는 행사입니다. 아이들은 국내 기술로 개발된 거대언어모델을 이용해 동화, 동요, 웹툰 등 다양한 형태의 콘텐츠를 즉석에서 기획하고 제작했습니다. 어릴 때부터 AI 기술을 자연스럽게 접하고 윤리적으로 사용하는 AI 리터러시 교육의 일환으로 기획되어 큰 호응을 얻었습니다. 창의적인 아이디어와 최신 기술의 만남이 미래 세대의 역량을 엿볼 수 있는 무대가 되었습니다.`,
  keyTerms:[{term:`AI 리터러시`,explanation:`인공지능 기술의 원리와 한계를 이해하고, 이를 윤리적이고 비판적인 시각으로 일상과 업무에 효과적으로 활용할 수 있는 능력을 말합니다.`}],
  history:`생성형 AI가 대중화되면서, 교육 현장에서는 AI에 종속되지 않고 이를 도구로 활용하는 올바른 훈련의 필요성이 제기되어 왔습니다.`,
  players:`과기정통부, 국산 AI 개발사들, 그리고 상상력을 뽐내는 전국 초등학생 참가자들과 지도 교사들이 주역입니다.`,
  current:`본선 현장에서는 AI 프롬프트 엔지니어링 기술을 활용해 몇 번의 대화만으로 수준 높은 동화를 완성해 내는 참가자들의 실력이 돋보였습니다.`,
  outlook:`이번 대회를 계기로 공교육 정규 교과과정 내에 실습 위주의 AI 활용 프로그램을 확대 도입하는 방안이 탄력을 받을 전망입니다.`,
  sources:[{title:`어린이들이 만든 AI 웹툰, 창작대회 본선 뜨거운 열기 - 중앙일보`,url:`https://joongang.co.kr/society`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`프랑스 연금·예산 삭감 반대 40만 명 대규모 시위, 이탈리아 등 연쇄 혼란 우려`,
  metrics:[`프랑스 전역 주요 도시 40만 명 이상 집결`,`국가 재정 수백억 유로 삭감 예산안 반발`],
  summary:`만성적인 국가 부채 문제에 직면한 프랑스 정부가 강도 높은 재정 적자 감축을 위해 연금과 예산을 대폭 삭감하려 하자 전국이 마비되었습니다. 파리와 리옹 등 주요 도시에는 노동조합과 일반 시민 등 40만 명 이상이 거리로 쏟아져 나와 거센 반정부 시위를 벌였습니다. 일부 지역에서는 시위대와 경찰이 충돌하며 최루탄과 물대포가 동원되는 등 폭력 사태로 격화되는 양상을 보였습니다. 이웃한 이탈리아 역시 유사한 경제 위기를 겪고 있어 시위가 국경을 넘어 확산될 우려가 커지자, 밀란과 로마 등 주요 시설에 보안을 대폭 강화했습니다. 이번 사태는 재정 위기 극복이라는 명분과 민생 고통 사이에서 갈등하는 유럽의 현실을 극명히 보여줍니다.`,
  keyTerms:[{term:`재정 위기`,explanation:`국가가 거둬들이는 세금보다 지출이 지나치게 많아 정부 부채가 눈덩이처럼 불어나고, 빚을 갚을 능력을 상실할 위험에 처하는 경제적 상황입니다.`}],
  history:`프랑스 등 남유럽 주요 국가들은 고령화와 복지 지출 확대로 인해 장기간 막대한 재정 적자에 시달려 왔으며, 최근 신용평가사들의 경고를 받았습니다.`,
  players:`지출을 줄이려는 마크롱 프랑스 정부와 기득권 복지를 지키려는 노동조합 연합, 불안감에 휩싸인 이웃 국가들이 얽혀 있습니다.`,
  current:`의회 내 예산안 통과가 난항을 겪는 가운데 거리 시위가 장기 파업으로 번질 조짐을 보이며 대중교통과 물류 시스템이 차질을 빚고 있습니다.`,
  outlook:`시위의 폭력화 정도와 노사정 간 타협 여부에 따라 정부의 예산 삭감안 원안 통과 여부가 판가름 날 것이며, 유로존 경제에도 파장을 미칠 것입니다.`,
  sources:[{title:`예산 삭감 반발 프랑스 40만 명 시위... 불타는 파리 거리 - MBC 뉴스`,url:`https://imnews.imbc.com/world`}]
}]

  tag:`2026-10-24`,
  label:`2026년 10월 24일 (토)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`국제 유가 116달러 돌파와 인플레이션 재점화 우려로 뉴욕 증시가 650포인트 이상 급락했습니다.`,
  metrics:[`브렌트유 배럴당 116달러`,`미국 9월 PCE 예상치 3.7%`],
  summary:`최근 중동의 지정학적 갈등이 격화되면서 국제 원유 수급 불안이 심화되고 있습니다. 이로 인해 브렌트유가 배럴당 116달러 선을 돌파하며 2022년 이후 최고치를 기록했습니다. 에너지 가격 급등은 전반적인 물가 상승 압력으로 작용하고 있으며, 미국 9월 개인소비지출(PCE) 물가지수가 목표치를 크게 웃도는 3.7% 수준을 기록할 것으로 예상됩니다. 물가가 다시 오르면 연방준비제도의 금리 인하 계획에 차질이 생길 수 있다는 우려가 커졌습니다. 이러한 불안감이 반영되며 다우존스 지수가 650포인트 이상 하락하는 등 뉴욕 증시 전반이 큰 충격을 받았습니다.`,
  keyTerms:[{term:`개인소비지출(PCE) 물가지수`,explanation:`미국 연방준비제도가 물가 상승률을 파악할 때 가장 중요하게 보는 지표로, 소비자들이 물건을 살 때 실제로 체감하는 가격 변화를 보여줍니다.`}],
  history:`코로나19 팬데믹 이후 각국 중앙은행은 물가를 잡기 위해 고강도 긴축 정책을 펼쳐왔습니다. 최근 들어 물가 오름세가 꺾이며 금리 인하 기대감이 커지던 상황이었습니다.`,
  players:`미국 연방준비제도는 통화정책을 결정하며, 주요 산유국과 국제 에너지 시장 참여자들의 움직임이 유가에 직접적인 영향을 미치고 있습니다.`,
  current:`지정학적 리스크로 유가가 급등하면서 간신히 잡혀가던 물가가 다시 오를 수 있다는 공포가 금융시장을 덮치고 있습니다.`,
  outlook:`향후 발표될 미국의 실제 물가 지표와 주요 기술 기업들의 3분기 실적 발표 결과에 따라 증시의 변동성이 더욱 커질 수 있습니다.`,
  sources:[{title:`유가 급등 및 인플레이션 우려로 뉴욕 증시 급락 - Bloomberg`,url:`https://bloomberg.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`독일의 화학기업 바스프(BASF)가 경쟁사인 에보닉(Evonik)의 인수 제안가를 약 111억 유로로 대폭 상향했습니다.`,
  metrics:[`주당 제안가 24유로`,`총 기업가치 111억 8,000만 유로`],
  summary:`세계 최대 종합 화학기업 중 하나인 독일 바스프가 특수 화학 분야의 강자인 에보닉을 인수하기 위해 더욱 적극적으로 나서고 있습니다. 바스프는 에보닉의 주당 인수 제안가를 24유로로 상향 조정했으며, 이는 전체 기업가치로 환산하면 약 111억 8,000만 유로에 달하는 초대형 규모입니다. 최근 글로벌 화학 업계는 수요 부진과 비용 상승에 대응하기 위해 사업 구조 재편과 인수합병(M&A)을 통한 규모의 경제 확보를 시도하고 있습니다. 바스프의 이번 파격적인 제안은 핵심 사업의 포트폴리오를 고부가가치 제품 중심으로 재편하려는 강력한 의지로 풀이됩니다. 양사 간의 협상이 성사될 경우 유럽을 넘어 글로벌 화학 시장의 판도가 크게 요동칠 전망입니다.`,
  keyTerms:[{term:`인수합병(M&A)`,explanation:`어떤 기업이 다른 기업을 사들이거나 두 기업이 하나로 합쳐지는 것을 말하며, 시장 지배력을 강화하고 새로운 성장 동력을 확보하기 위해 사용됩니다.`}],
  history:`글로벌 화학 산업은 최근 수년간 에너지가 급등과 중국의 공격적인 설비 증설로 인해 수익성 악화라는 구조적인 위기에 직면해 왔습니다.`,
  players:`인수를 추진하는 바스프와 대상 기업인 에보닉, 그리고 독과점 문제를 심사하게 될 유럽연합 경쟁 당국이 핵심 주체입니다.`,
  current:`바스프가 기존보다 훨씬 높은 금액을 제시함에 따라 에보닉 이사회와 주주들이 어떤 반응을 보일지가 초미의 관심사로 떠올랐습니다.`,
  outlook:`양측의 인수 협상 타결 여부와 함께, 거래가 성사될 경우 각국의 엄격한 반독점 규제 심사를 무사히 통과할 수 있을지가 다음 관건입니다.`,
  sources:[{title:`독일 바스프, 에보닉 인수 제안가 상향 - Reuters`,url:`https://reuters.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`정부가 반도체 연구개발 인력에 대한 주 52시간 근무제 예외 법제화 대신 기존 특별연장근로 제도의 보완을 지시했습니다.`,
  metrics:[`반도체 연구개발(R&D) 인력`,`특별연장근로 인가 기간 연장 논의`],
  summary:`한국 정부가 국가 첨단전략산업인 반도체 분야의 경쟁력을 높이기 위해 근로시간 제도 개편을 논의하고 있습니다. 최근 열린 관련 회의에서 정부는 반도체 연구개발 인력들을 주 52시간 근무제의 적용 대상에서 아예 제외하는 새로운 법률을 만들기보다는, 기존 제도를 활용하는 방안을 먼저 검토하라고 지시했습니다. 구체적으로는 업무량이 몰릴 때 합법적으로 초과 근무를 할 수 있게 해주는 특별연장근로 제도의 인가 기간을 늘리거나 절차를 간소화하는 방향이 논의되고 있습니다. 재계는 글로벌 경쟁에서 뒤처지지 않으려면 완전한 법적 예외가 필요하다고 주장하지만, 노동계의 반발 등을 고려해 정부가 한발 물러선 것으로 해석됩니다. 이로써 단기적으로는 행정적인 규제 완화를 통해 기업들의 숨통을 틔워줄 것으로 보입니다.`,
  keyTerms:[{term:`특별연장근로`,explanation:`갑작스러운 업무 폭증이나 연구개발 등 특별한 사정이 발생했을 때, 정부의 허가를 받아 법정 근로시간을 넘겨 일할 수 있도록 허용해주는 제도입니다.`}],
  history:`근로자의 과로를 막기 위해 주 52시간 근무제가 도입되었으나, 집중적인 연구개발이 필요한 정보통신과 반도체 업계에서는 유연성이 부족하다는 불만이 꾸준히 제기되어 왔습니다.`,
  players:`제도 유연화를 요구하는 재계와 근로조건 악화를 우려하는 노동계, 그리고 제도를 조율해야 하는 정부와 국회가 얽혀 있습니다.`,
  current:`글로벌 반도체 패권 경쟁이 격화되면서 연구 인력의 근무 시간 제한이 국가 경쟁력 저하로 이어질 수 있다는 위기감이 커지고 있습니다.`,
  outlook:`특별연장근로 인가 요건 완화 등 정부의 시행령 개정 작업이 얼마나 속도감 있게 진행될지, 그리고 향후 완전한 예외를 위한 법 개정 논의가 이어질지 주목됩니다.`,
  sources:[{title:`반도체 주 52시간 예외, 새 제도 만들 필요 있나 - 조선일보`,url:`https://chosun.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`오세훈 서울시장이 여론조사비 대납 의혹과 관련된 정치자금법 위반 항소심에서 당선무효형을 깬 무죄를 선고받았습니다.`,
  metrics:[`1심 벌금 1,000만 원`,`2심 무죄(벌금 0원)`],
  summary:`오세훈 서울시장이 징역형이나 무거운 벌금형으로 인해 시장직을 잃을 뻔한 위기에서 극적으로 벗어났습니다. 서울고등법원은 23일 열린 정치자금법 위반 혐의 항소심에서 오 시장에게 무죄를 선고했습니다. 앞서 1심 재판부는 오 시장 측이 불법 여론조사 비용을 대납받았다는 의혹을 일부 인정하여 벌금 1,000만 원의 당선무효형을 내렸습니다. 그러나 2심 재판부는 이 사건의 핵심 관련자인 명태균 씨의 진술이 일관되지 않아 신빙성이 크게 부족하다고 판단하여 원심을 뒤집었습니다. 이번 판결로 오 시장은 정치적 족쇄를 풀고 시정에 전념할 수 있게 되었습니다. 동시에 보수 진영 내에서 그의 대권 행보와 정치적 입지도 한층 강화될 것이라는 평가가 나오고 있습니다.`,
  keyTerms:[{term:`당선무효형`,explanation:`공직선거법이나 정치자금법 등을 위반하여 일정 금액 이상의 벌금형이나 징역형이 확정될 경우, 선거 당선의 효력이 상실되어 그 직을 잃게 되는 형벌입니다.`}],
  history:`과거 선거 과정에서 여론조사 비용 대납 의혹이 불거지면서 오세훈 시장은 정치자금법 위반 혐의로 기소되어 오랜 기간 재판을 받아왔습니다.`,
  players:`혐의를 벗은 오세훈 서울시장과 의혹의 중심에 서 있는 관련자들, 그리고 유죄를 입증하려는 검찰 측이 주요 당사자입니다.`,
  current:`1심의 유죄 판결로 인해 정치적 생명이 위태로웠으나, 2심에서 무죄로 뒤집히면서 시장직 유지와 함께 차기 대권 주자로서의 행보에 탄력을 받게 되었습니다.`,
  outlook:`검찰이 항소심 결과에 불복하여 대법원에 상고할 가능성이 높기 때문에, 최종 판결이 나오기까지 법적 공방은 당분간 이어질 것으로 전망됩니다.`,
  sources:[{title:`오세훈 서울시장, 여론조사비 대납 의혹 2심 무죄 선고 - 연합뉴스`,url:`https://yna.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`국가정보원이 북한 김정은 국무위원장의 사망설을 공식 부인한 가운데, 북한 매체가 김 위원장의 군 행사 주재 소식을 전했습니다.`,
  metrics:[`공식 석상 등장 2일`,`조선인민군 제3차 중대장대회 주재`],
  summary:`최근 온라인 커뮤니티와 소셜 미디어를 중심으로 급격하게 퍼졌던 북한 김정은 국무위원장의 뇌출혈 사망설은 사실이 아닌 것으로 밝혀졌습니다. 국가정보원은 23일 이례적으로 입장을 내고 해당 소문에 대해 근거 없는 허위 사실이라고 일축했습니다. 이와 동시에 북한의 관영 매체들은 김정은 위원장이 22일과 23일 이틀에 걸쳐 평양에서 열린 조선인민군 제3차 중대장대회를 직접 주재했다고 24일 보도했습니다. 북한 매체에 따르면 김 위원장은 이 행사에서 군 지휘관들에게 임전태세를 완비할 것을 강력하게 주문하며 건재함을 과시했습니다. 한반도의 긴장 상황 속에서 불거진 북한 최고지도자의 건강 이상설은 단순한 해프닝으로 일단락되는 분위기입니다.`,
  keyTerms:[{term:`국가정보원`,explanation:`국가 안보와 관련된 국내외 정보 수집, 보안 및 범죄 수사를 총괄하는 대한민국의 최고 정보기관입니다.`}],
  history:`북한이라는 국가의 폐쇄적인 특성 때문에 과거에도 김정은 위원장을 비롯한 최고지도자들의 건강 이상설이나 사망설이 주기적으로 반복해서 등장해 왔습니다.`,
  players:`건강 이상설의 당사자인 북한 김정은 위원장과 대북 정보를 수집하고 분석하여 사실 여부를 확인하는 한국의 정보 당국이 핵심입니다.`,
  current:`가짜 뉴스가 확산되면서 불필요한 안보 불안이 조장될 수 있었으나, 정보 당국의 빠른 부인과 북한 매체의 보도로 혼란이 진화되었습니다.`,
  outlook:`김정은 위원장이 군사 행사에 등장하여 전면전 대비를 강조한 만큼, 향후 북한의 추가적인 무력시위나 도발 움직임에 대한 지속적인 감시가 필요합니다.`,
  sources:[{title:`국정원 김정은 사망설 허위, 군 중대장대회 지도 - 조선일보`,url:`https://chosun.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`마수드 페제시키안 이란 대통령이 다음 주 러시아를 방문해 블라디미르 푸틴 대통령과 전략적 협력을 논의합니다.`,
  metrics:[`페제시키안 취임 후 첫 방러`,`정상회담 1회 예정`],
  summary:`중동 지역의 긴장이 계속되는 가운데, 이란과 러시아의 밀착이 더욱 가속화되고 있습니다. 이란 외무부는 마수드 페제시키안 이란 대통령이 다음 주 러시아 모스크바를 공식 방문할 예정이라고 발표했습니다. 이번 일정은 페제시키안 대통령이 취임한 이후 처음으로 이루어지는 러시아 방문입니다. 그는 모스크바에서 블라디미르 푸틴 러시아 대통령과 정상회담을 열고 양국 간의 경제 및 군사 분야 협력을 깊이 있게 논의할 계획입니다. 두 국가는 현재 서방 세계의 강력한 경제 제재를 공통적으로 받고 있어, 이를 타개하기 위해 포괄적인 협력 체계를 구축하려 하고 있습니다. 이러한 이란과 러시아의 연대 강화는 글로벌 지정학적 갈등 구도에 새로운 변수로 작용할 전망입니다.`,
  keyTerms:[{term:`정상회담`,explanation:`두 개 이상 국가의 최고 지도자들이 직접 만나서 국가 간의 주요 현안을 논의하고 외교적인 합의를 이끌어내는 공식적인 회의입니다.`}],
  history:`러시아의 우크라이나 침공과 이란의 핵 개발 및 중동 내 무장단체 지원 등으로 인해 두 국가는 오랜 기간 미국 등 서방의 제재를 받아왔습니다.`,
  players:`반서방 연대의 중심축을 형성하고 있는 러시아의 푸틴 대통령과 이란의 페제시키안 대통령, 그리고 이를 견제하는 미국과 유럽 국가들입니다.`,
  current:`국제 사회의 고립을 피하고 경제적, 군사적 활로를 모색하기 위해 이란과 러시아가 서로를 핵심 파트너로 인식하며 밀착하고 있습니다.`,
  outlook:`이번 회담을 통해 무기 거래나 대규모 경제 협력 계약이 체결될 경우, 중동 및 동유럽 지역의 안보 지형에 상당한 파장을 일으킬 것으로 예상됩니다.`,
  sources:[{title:`이란 페제시키안 대통령, 차주 방러 예정 - 연합뉴스`,url:`https://yna.co.kr/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`삼성전자와 SK하이닉스가 기존 메모리를 넘어설 차세대 인공지능(AI) 반도체 기술 경쟁에 본격적으로 돌입했습니다.`,
  metrics:[`3D D램 적층 기술`,`대용량 고대역폭 낸드(HBF) 개발`],
  summary:`글로벌 반도체 시장을 주도하는 삼성전자와 SK하이닉스가 미래 인공지능 시대를 겨냥한 차세대 메모리 주도권 다툼을 치열하게 벌이고 있습니다. 현재는 고대역폭 메모리가 시장의 주력이지만, 양사는 이미 그 다음 단계를 준비 중입니다. 삼성전자는 서버를 거치지 않고 기기 자체에서 구동되는 온디바이스 AI 기기에 최적화된 새로운 솔루션 검증에 집중하고 있습니다. 반면 SK하이닉스는 연산 반도체 위에 직접 메모리를 쌓아 올리는 3D D램 기술과 저장 능력을 극대화한 고대역폭 낸드 개발에 속도를 내고 있습니다. 이러한 기술 혁신은 전력 소모는 줄이면서 데이터 처리 속도는 획기적으로 높이기 위한 필수적인 과정입니다. 두 한국 기업의 치열한 기술 개발은 향후 글로벌 AI 반도체 생태계의 발전 방향을 결정지을 핵심 요소가 될 것입니다.`,
  keyTerms:[{term:`온디바이스 AI`,explanation:`외부의 클라우드 서버에 연결하지 않고 스마트폰이나 컴퓨터 등 사용자의 기기 내부에서 인공지능 연산을 직접 처리하는 기술을 의미합니다.`}],
  history:`인공지능 모델이 급격히 거대해지면서, 막대한 양의 데이터를 빠르게 처리할 수 있는 고성능 메모리 반도체의 필요성이 그 어느 때보다 중요해졌습니다.`,
  players:`전 세계 메모리 반도체 시장을 선도하는 대한민국의 삼성전자와 SK하이닉스가 차세대 기술 표준을 선점하기 위해 치열하게 경쟁하고 있습니다.`,
  current:`기존의 메모리 기술력을 넘어서, 소비 전력을 줄이고 크기를 혁신할 수 있는 전혀 새로운 구조의 메모리 반도체 개발이 업계의 핵심 화두로 떠올랐습니다.`,
  outlook:`향후 수년 내에 양사가 개발 중인 차세대 메모리가 실제 상용화되어 스마트폰, 자율주행차, 첨단 서버 등 다양한 산업 분야에 본격적으로 탑재될 전망입니다.`,
  sources:[{title:`차세대 AI 메모리 경쟁 격화 - 연합뉴스`,url:`https://yna.co.kr/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`재생에너지의 날이 공식적인 법정기념일로 지정된 이후 처음으로 정부 주관의 공식 기념식이 열렸습니다.`,
  metrics:[`10월 23일 법정기념일`,`제1회 정부 주관 기념식`],
  summary:`기후 위기 대응과 탄소 중립 실현을 위한 상징적인 행사가 열렸습니다. 10월 23일 재생에너지의 날을 맞아 올해 처음으로 정부가 직접 주관하는 공식 기념식이 성대하게 개최되었습니다. 이 날은 최근 관련 규정이 개정되면서 국가가 인정하는 공식 법정기념일로 새롭게 지정되었습니다. 이번 기념식에서는 그동안 국내 산업 현장과 학계에서 신재생에너지 보급과 기술 개발에 힘써온 유공자들에게 정부 포상이 수여되었습니다. 정부는 이번 행사를 통해 친환경 에너지 전환에 대한 국가적인 의지를 대내외에 다시 한번 천명했습니다. 앞으로 이 기념일을 계기로 관련 산업에 대한 투자 확대와 국민적인 공감대 형성이 더욱 속도를 낼 것으로 기대됩니다.`,
  keyTerms:[{term:`신재생에너지`,explanation:`태양광, 풍력, 지열, 수력 등 시간이 지나도 고갈되지 않고 자연적으로 계속 보충되는 친환경적인 에너지를 통틀어 일컫는 말입니다.`}],
  history:`지구 온난화로 인한 기후 변화가 심각해지면서, 화석 연료를 대체할 깨끗한 에너지원의 개발과 보급은 전 세계적인 최우선 과제가 되었습니다.`,
  players:`에너지 정책을 수립하는 정부 부처와 관련 기술을 개발하는 친환경 에너지 기업 및 연구 기관들이 주도적인 역할을 하고 있습니다.`,
  current:`법정기념일 지정을 통해 국가 차원의 에너지 전환 목표를 확고히 하고, 산업계의 사기를 진작시키기 위한 제도적 기반이 새롭게 마련되었습니다.`,
  outlook:`정부의 적극적인 정책 지원을 바탕으로 태양광, 해상 풍력 등 다양한 친환경 에너지 인프라 구축 프로젝트가 전국적으로 속도를 낼 전망입니다.`,
  sources:[{title:`재생에너지의 날 첫 법정기념일 지정 및 기념식 - 전자신문`,url:`https://etnews.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`미국의 유력 인공지능 기업 앤트로픽이 유럽 기업들의 AI 도입을 돕기 위해 런던에 합작 컨설팅사를 세웁니다.`,
  metrics:[`유럽 기업 대상 AI 지원`,`전담 엔지니어 직접 파견`],
  summary:`글로벌 거대 인공지능 시장의 선두 주자 중 하나인 미국의 앤트로픽이 유럽 시장 공략에 본격적으로 나섰습니다. 앤트로픽은 영국 런던에 본사를 둔 대형 사모펀드인 Hg와 손잡고 새로운 합작 컨설팅 법인을 설립한다고 발표했습니다. 새롭게 만들어지는 이 회사는 유럽의 다양한 일반 기업들이 업무에 인공지능을 쉽게 도입할 수 있도록 맞춤형 기술 지원을 제공하게 됩니다. 특히, 앤트로픽의 최신 인공지능 모델을 안전하고 효율적으로 활용할 수 있도록 전담 엔지니어를 직접 기업 현장에 파견하는 서비스도 포함됩니다. 이번 합작사 설립은 단순히 소프트웨어 모델을 개발하는 것을 넘어, 기업 고객들의 실질적인 활용을 돕는 서비스 영역까지 사업을 확장하려는 전략으로 풀이됩니다. 이를 통해 앤트로픽은 까다로운 규제를 가진 유럽 내에서 기업용 서비스 시장의 주도권을 빠르게 확보하려 하고 있습니다.`,
  keyTerms:[{term:`사모펀드`,explanation:`일반 대중이 아닌 소수의 특정 투자자들로부터 거액의 자금을 모아, 주식이나 채권, 기업의 경영권 등에 투자하여 수익을 내는 비공개 투자 기금입니다.`}],
  history:`초거대 인공지능 기술이 빠르게 발전하면서, 이제는 단순히 똑똑한 기술을 만드는 경쟁을 넘어 실제 기업 현장에서 어떻게 안전하게 적용할 것인가가 중요해졌습니다.`,
  players:`뛰어난 기술력을 보유한 앤트로픽과 유럽 시장 내 폭넓은 기업 네트워크와 자본력을 갖춘 투자 파트너가 상호 협력하고 있습니다.`,
  current:`신기술 도입을 망설이는 유럽의 보수적인 기업들에게 맞춤형 기술 컨설팅과 전담 인력을 직접 제공하여 시장 진입 장벽을 낮추려는 적극적인 움직임이 시작되었습니다.`,
  outlook:`이번 합작 모델이 성공적으로 정착할 경우, 다른 거대 기술 기업들도 맞춤형 컨설팅과 파트너십을 다투어 확대할 것으로 보입니다.`,
  sources:[{title:`앤트로픽, 유럽 AI 컨설팅 합작법인 설립 - 연합뉴스`,url:`https://yna.co.kr/`}]
}]

  category:`경제`,

  headline:`글로벌 빅테크의 AI 인프라 과잉 투자 우려에 미 기술주 급락`,
  metrics:[`나스닥 지수 2.60% 하락`,`메타 주가 7% 하락`],
  summary:`메타, 마이크로소프트 등 주요 빅테크 기업들이 호실적을 발표했음에도 불구하고, 막대한 AI 인프라 지출 계획을 내놓으며 투자 수익성 회수에 대한 우려가 확산되었습니다. 이로 인해 뉴욕증시에서 엔비디아, AMD를 포함한 주요 반도체 및 기술주가 일제히 급락하며 나스닥 지수가 2.60% 하락했습니다. 시장은 AI 기술의 장기적인 잠재력에는 동의하지만, 단기적으로 수익 창출이 지연될 경우 거품이 꺼질 수 있다는 불안감을 드러내고 있습니다. 결국 현재의 AI 투자 열풍이 실질적인 기업의 이익으로 어떻게 연결될지가 향후 시장의 핵심 변수로 작용할 전망입니다.`,
  keyTerms:[{term:`AI 인프라 지출`,explanation:`기업들이 인공지능 서비스를 원활하게 제공하기 위해 고성능 컴퓨터와 데이터 센터 등의 물리적 장비를 구축하는 데 사용하는 비용을 말합니다.`}],
  history:`지난 몇 년간 생성형 AI 시장이 폭발적으로 성장하며 구글, 마이크로소프트 등은 천문학적인 비용을 데이터 센터에 쏟아부었습니다.`,
  players:`메타, 마이크로소프트 등 대형 IT 기업들과 이들에게 칩을 공급하는 엔비디아, AMD가 시장을 주도하고 있습니다.`,
  current:`AI 개발 초기 단계를 지나 구체적인 수익 모델을 증명해야 하는 시점에 도달하면서 투자자들의 압박이 커지고 있습니다.`,
  outlook:`향후 발표될 빅테크 기업들의 분기 실적에서 실질적인 AI 매출 비중이 공개될 때마다 증시 변동성이 크게 출렁일 것으로 보입니다.`,
  sources:[{title:`뉴욕증시 기술주 급락 - 뉴시스`,url:`https://newsis.com`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`중동 지역 군사적 긴장 고조로 브렌트유 배럴당 113달러선 돌파`,
  metrics:[`브렌트유 배럴당 113달러`,`S&P500 지수 1.21% 하락`],
  summary:`중동 지역의 지정학적 갈등이 다시 한번 최고조에 달하면서 국제 유가의 벤치마크인 브렌트유가 배럴당 113달러선을 돌파했습니다. 주요 산유국들의 원유 생산 및 수출 차질 우려가 확산됨에 따라, 전 세계적인 인플레이션 압박과 원가 부담이 재차 커질 수 있다는 분석이 나옵니다. 글로벌 주식 시장은 유가 급등이 중앙은행들의 금리 인하 기대감을 꺾을 수 있다고 판단해 하락세를 면치 못했습니다. 전문가들은 중동 발 리스크가 장기화될 경우 세계 경제 전반의 성장세 둔화로 이어질 가능성을 경고하고 있습니다.`,
  keyTerms:[{term:`지정학적 갈등`,explanation:`국가 간의 지리적, 정치적 이해관계가 얽혀 무력 충돌이나 외교적 마찰이 발생하는 상황을 뜻합니다.`}],
  history:`가자지구와 레바논을 중심으로 촉발된 중동 분쟁은 관련 국가들의 군사적 보복이 이어지며 장기화 국면에 접어들었습니다.`,
  players:`이스라엘과 이란 등 중동 주요국과 이 지역의 안정화를 시도하는 미국 등 강대국들이 얽혀 있습니다.`,
  current:`에너지 운송의 핵심 통로인 중동에서 물리적 충돌이 확대될 조짐을 보이면서 글로벌 원유 공급망이 직접적인 타격을 받을 위기에 놓였습니다.`,
  outlook:`향후 무력 충돌의 양상과 OPEC+의 산유량 조절 정책에 따라 연말까지 고유가 기조가 고착화될 가능성이 높습니다.`,
  sources:[{title:`중동 긴장 고조에 유가 급등 - 뉴스1`,url:`https://www.news1.kr`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국은행, 기준금리 동결 유지하며 환율 및 고유가 여파 모니터링`,
  metrics:[`원/달러 환율 1,320원대 중반`,`기준금리 동결`],
  summary:`한국은행 금융통화위원회가 인플레이션 압력과 고환율 상황을 고려해 기준금리 동결 기조를 유지하기로 결정했습니다. 현재 달러-원 환율이 역외 시장에서 1,320원대 중반을 기록하고 있으며, 최근 국제 유가까지 급등하면서 수입 물가 상승에 대한 우려가 커졌기 때문입니다. 무리하게 금리를 인하할 경우 자본 유출과 가계부채 증가를 부추길 수 있어 신중한 입장을 보인 것으로 해석됩니다. 한국은행은 당분간 국내외 경제 지표의 변화를 면밀히 살피며 물가 안정을 최우선으로 하는 통화 정책을 운용할 방침입니다.`,
  keyTerms:[{term:`기준금리 동결`,explanation:`중앙은행이 시중 은행들과 돈을 거래할 때 기준으로 삼는 이자율을 올리거나 내리지 않고 현재 수준으로 그대로 유지하는 것을 의미합니다.`}],
  history:`코로나19 팬데믹 이후 물가를 잡기 위해 가파르게 금리를 올렸던 한국은행은, 최근 들어 금리 인하 시점을 저울질해 왔습니다.`,
  players:`한국은행 금융통화위원회와 국내 경제 정책을 조율하는 정부 부처, 그리고 미국 연방준비제도(Fed)가 주요 변수입니다.`,
  current:`미국과의 금리 격차가 여전히 존재하는 가운데, 중동발 유가 상승과 환율 상승 압력이 금리 인하의 발목을 잡고 있는 상황입니다.`,
  outlook:`연말까지 물가 상승률이 목표치에 안착하는지 여부와 미국의 추가 금리 인하 속도에 따라 한은의 정책 방향이 결정될 것입니다.`,
  sources:[{title:`한은 금통위 기준금리 동결 기조 - 연합인포맥스`,url:`https://news.einfomax.co.kr`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`비무장지대(DMZ) 북한 지뢰 폭발 도발, 정부 유엔 안보리에 공식 서한 발송`,
  metrics:[`사건 발생 장소 DMZ 내부`,`유엔 안보리 공식 서한 제출`],
  summary:`정부가 최근 비무장지대(DMZ)에서 발생한 북한의 지뢰 폭발 도발을 명백한 정전협정 위반으로 규정하고, 이에 대한 책임을 묻기 위해 유엔 안전보장이사회 의장에게 공식 서한을 발송했습니다. 이번 서한에는 북한군의 지뢰 매설 행위가 한반도의 평화와 안정을 심각하게 위협한다는 내용과 함께 공식적인 사과 및 재발 방지 조치를 촉구하는 메시지가 담겼습니다. 또한, 주한 외교단을 상대로 현장 조사 결과를 투명하게 브리핑하며 국제사회의 공조를 이끌어내려 노력하고 있습니다. 정부는 북한의 추가적인 군사 도발 가능성에 대비해 경계 태세를 대폭 강화한 상태입니다.`,
  keyTerms:[{term:`정전협정 위반`,explanation:`한국전쟁을 임시로 멈추기로 한 국제적인 약속을 어기고 무력 도발이나 군사적 긴장을 유발하는 행위를 뜻합니다.`}],
  history:`과거 목함지뢰 사건 등을 비롯해 DMZ 일대에서는 북한의 기습적인 지뢰 매설과 무력 도발이 주기적으로 반복되어 왔습니다.`,
  players:`도발을 주도한 북한군과 방어태세를 유지하는 한국군, 그리고 이를 중재 및 제재할 권한을 가진 유엔 안전보장이사회가 얽혀 있습니다.`,
  current:`최근 오물 풍선 살포 및 확성기 재개 위협 등 남북 간 긴장이 고조된 상황에서 물리적 도발까지 발생하며 안보 위기가 심화되었습니다.`,
  outlook:`안보리 차원의 제재 논의가 시작될 예정이나 거부권을 가진 상임이사국들의 입장에 따라 실효성 있는 조치가 취해질지는 미지수입니다.`,
  sources:[{title:`DMZ 북 지뢰 도발, 안보리 서한 발송 - 중앙일보`,url:`https://joongang.co.kr`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`한-우크라이나 외교 갈등 격화, 정부 현지 공관원 절반 철수라는 초강수 단행`,
  metrics:[`주우크라이나 공관원 50% 철수`,`포로 정보 일방 공개 파장`],
  summary:`우크라이나 정부가 북한군 포로의 한국행 희망 사실을 일방적으로 공개한 사건을 계기로 양국 간의 외교 갈등이 최악으로 치닫고 있습니다. 우리 정부는 우크라이나의 행동이 민감한 안보 정보의 유출이자 외교적 신뢰 훼손이라고 강력히 반발하며, 주우크라이나 대사 소환에 이어 현지 공관원의 절반을 철수시키는 고강도 조치를 단행했습니다. 이번 결정은 상대국의 일방적 정보 공개에 대한 엄중한 경고의 의미를 담고 있으며, 향후 전시 지원 정책에도 전면적인 재검토가 이루어질 수 있음을 시사합니다. 전문가들은 이 사태가 한-우크라이나 관계뿐만 아니라 다자간 외교 무대에서의 한국의 입지에 미칠 파장을 주시하고 있습니다.`,
  keyTerms:[{term:`현지 공관원의 절반을 철수시키는`,explanation:`해외에 파견되어 그 나라와 한국 사이의 외교 업무와 자국민 보호를 담당하는 대사관이나 영사관의 직원들을 본국으로 돌려보내는 조치입니다.`}],
  history:`한국은 우크라이나에 인도적 지원을 이어왔으나, 살상 무기 지원 문제 등을 놓고 미묘한 입장 차이를 유지해 왔습니다.`,
  players:`한국 및 우크라이나 정부의 고위 외교 라인과 전쟁에 참전한 북한군 포로들이 주요 이해관계자입니다.`,
  current:`극비리에 다루어져야 할 포로 망명 문제가 언론에 노출되면서, 북한의 강력한 반발을 의식해야 하는 한국 정부가 거세게 항의하는 상황입니다.`,
  outlook:`양국 외교 당국 간 물밑 조율이 시급하지만, 감정의 골이 깊어진 만큼 단기간에 관계가 정상화되기는 어려울 것으로 관측됩니다.`,
  sources:[{title:`한-우크라 외교 갈등... 공관원 철수 - 문화일보`,url:`https://munhwa.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`러시아-우크라이나 전쟁 종전 협상 교착, 서방 진영 내부 이견 지속`,
  metrics:[`미·러 물밑 접촉 시도`,`우크라이나 대규모 공습 지속`],
  summary:`러시아와 우크라이나 전쟁이 장기화되는 가운데, 양국 간의 휴전 및 종전 협상이 전혀 진전을 보이지 못하고 철저한 교착 상태에 빠졌습니다. 최근 미국과 러시아 간의 조심스러운 물밑 접촉이 있었으나, 곧이어 키이우를 겨냥한 러시아의 대규모 공습이 재개되며 외교적 해결의 희망이 꺾였습니다. 동시에 유럽연합과 미국 등 서방 진영 내부에서도 우크라이나에 대한 군사 지원 규모와 종전을 위한 양보 조건을 둘러싸고 뚜렷한 의견 충돌이 발생하고 있습니다. 이는 전황을 타개할 동력을 잃게 만들어 무고한 민간인들의 피해와 글로벌 안보 불안만을 더욱 가중시키고 있다는 평가를 받습니다.`,
  keyTerms:[{term:`교착 상태`,explanation:`협상이나 상황이 앞으로 나아가지 못하고 꽉 막혀서 도무지 해결될 기미가 보이지 않는 상태를 뜻합니다.`}],
  history:`수년째 이어지는 소모전 속에서 양측 모두 결정적인 승기를 잡지 못한 채 광범위한 진지전만 반복하고 있습니다.`,
  players:`영토 수복을 주장하는 우크라이나, 점령지 인정을 요구하는 러시아, 그리고 이들을 돕는 나토(NATO) 국가들이 얽혀 있습니다.`,
  current:`전쟁 피로감이 서방 국가들 사이에서 커지면서 지원을 축소해야 한다는 여론과 끝까지 맞서야 한다는 여론이 팽팽히 맞서고 있습니다.`,
  outlook:`미국 대선 결과 등 외부 정치적 요인이 결정되기 전까지는 극적인 협상 타결 없이 산발적인 소모전이 이어질 전망입니다.`,
  sources:[{title:`러-우크라 종전 협상 교착 - Al Jazeera`,url:`https://aljazeera.com`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`웹 핵심 언어 'PHP'의 치명적 보안 취약점 발견에 정부 긴급 대응 돌입`,
  metrics:[`국내 대다수 웹사이트 위협`,`사이버위기 경보 상향`],
  summary:`전 세계 수많은 웹사이트를 구동하는 핵심 프로그래밍 언어인 'PHP'에서 로그인 등 인증 절차 없이도 서버에 마음대로 명령을 내릴 수 있는 매우 치명적인 보안 취약점이 발견되었습니다. 해커가 이 약점을 이용할 경우 대규모 개인정보 유출이나 시스템 파괴가 가능해, 한국 정부는 즉각 사이버위기 경보를 상향 조정했습니다. 현재 민관군 합동 대응팀이 긴급하게 꾸려져 공공기관 및 민간 기업의 서버 업데이트와 보안 패치를 독려하고 점검에 나선 상황입니다. 전문가들은 이번 취약점을 노린 대규모 사이버 공격이 발생하기 전에 웹사이트 관리자들의 발 빠른 조치가 절대적으로 필요하다고 강력히 권고했습니다.`,
  keyTerms:[{term:`보안 패치를 독려하고`,explanation:`소프트웨어나 프로그램에서 발견된 약점을 해커가 공격하기 전에 메꾸는 수정 프로그램을 설치하도록 적극 권장하는 것을 의미합니다.`}],
  history:`PHP는 전 세계 웹사이트의 절반 이상이 사용할 정도로 보편적이지만, 그만큼 해커들의 주된 타깃이 되어 보안 사고가 끊이지 않았습니다.`,
  players:`취약점을 악용하려는 해킹 조직과 이를 방어하는 정부 사이버보안 당국, 그리고 각 기업의 IT 서버 관리자들이 주체입니다.`,
  current:`취약점이 이미 널리 알려지면서 이를 자동화해 공격하는 악성 코드가 빠르게 확산될 조짐을 보이고 있어 매우 위급한 국면입니다.`,
  outlook:`정부의 집중적인 대응으로 공공 부문은 방어가 가능하겠지만, 보안 투자가 여의치 않은 영세 중소기업 웹사이트들의 연쇄 피해가 우려됩니다.`,
  sources:[{title:`PHP 치명적 취약점 노출, 긴급 대응 - 동아일보`,url:`https://donga.com`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`한국 재생에너지 발전설비 용량, 사상 최초로 석탄 발전 추월 달성`,
  metrics:[`재생에너지 설비 용량 석탄 추월`,`전체 설비 중 2위 규모 달성`],
  summary:`대한민국의 에너지 정책 역사상 처음으로 태양광과 풍력 등을 합친 재생에너지 발전설비 용량이 전통적인 석탄 발전 설비 용량을 넘어섰습니다. 이로써 재생에너지는 액화천연가스(LNG) 발전에 이어 국내 발전설비 규모 2위로 도약하며 에너지 전환의 중대한 분기점을 맞이하게 되었습니다. 정부와 민간이 탄소중립 목표 달성을 위해 꾸준히 친환경 에너지 투자를 확대한 결과가 수치로 증명된 셈입니다. 다만, 설비 용량의 증가에도 불구하고 날씨에 따라 발전량이 들쭉날쭉한 재생에너지의 한계를 극복하기 위해 전력망 확충과 에너지 저장 장치(ESS) 투자가 시급하다는 지적도 뒤따르고 있습니다.`,
  keyTerms:[{term:`에너지 전환의 중대한 분기점`,explanation:`지구 온난화를 막기 위해 석탄 같은 화석 연료 중심에서 태양광 등 깨끗한 자연 에너지 중심으로 전기를 만드는 방식이 확연히 바뀌는 중요한 시점을 뜻합니다.`}],
  history:`과거 한국은 값싸고 효율적인 석탄 화력 발전과 원자력 발전에 절대적으로 의존해 왔으나, 기후변화 대응을 위해 재생에너지 보급을 늘려왔습니다.`,
  players:`친환경 발전을 이끄는 민간 에너지 기업들과 이를 지원 및 규제하는 정부 부처, 한전 등의 전력 공기업이 있습니다.`,
  current:`설비 자체는 크게 늘었지만 생산된 전기를 필요할 때 제대로 보낼 수 있는 송전망 등 인프라 부족 문제가 새로운 병목으로 떠오르고 있습니다.`,
  outlook:`앞으로 노후 석탄 발전소의 폐쇄가 가속화되고 해상 풍력 등 대규모 프로젝트가 진행되면서 재생에너지 비중은 더욱 가파르게 상승할 것입니다.`,
  sources:[{title:`재생에너지 발전설비 석탄 첫 추월 - 한겨레`,url:`https://hani.co.kr`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`북한 IT 인력, 신분 세탁 후 한국 민간업체 위장 취업 정황 최초 적발`,
  metrics:[`위장 취업 정황 최초 포착`,`정부 전면적 실태 조사 착수`],
  summary:`북한의 전문 IT 인력들이 교묘하게 신분을 세탁하고 한국의 민간 IT 기업에 위장 취업한 정황이 수사 당국에 의해 사상 처음으로 포착되었습니다. 이들은 온라인 채용 플랫폼의 맹점을 이용해 한국인이나 제3국인으로 위장한 뒤, 실제로 업무를 배정받아 코드를 개발하고 그 대가로 임금을 수령해 북한으로 송금한 것으로 드러났습니다. 단순히 외화벌이를 넘어 국내 기업의 핵심 시스템에 접근해 기밀을 빼내거나 악성코드를 심을 수 있었다는 점에서 심각한 사회적 파장이 일고 있습니다. 정보 당국은 국내 IT 업계 전반에 걸쳐 신원 검증 절차를 대폭 강화할 것을 긴급 지시하며 전면적인 실태 조사에 착수했습니다.`,
  keyTerms:[{term:`민간 IT 기업에 위장 취업한 정황`,explanation:`북한 해커들이 가짜 이름이나 신분증을 이용해 마치 평범한 개발자인 것처럼 한국의 기술 회사에 몰래 입사하여 일한 흔적을 말합니다.`}],
  history:`국제사회의 강력한 경제 제재로 자금줄이 막힌 북한은 해킹과 온라인 불법 노동을 통한 외화벌이에 IT 인력을 집중 투입해 왔습니다.`,
  players:`조직적으로 움직이는 북한 IT 부대원들과 이들의 공격 대상이 된 한국의 중소 IT 기업, 그리고 이를 추적하는 국정원 등 보안 당국입니다.`,
  current:`원격 근무가 일상화되면서 얼굴을 직접 보지 않고도 채용과 업무가 진행되는 현 시대의 허점을 북한이 전략적으로 파고든 상황입니다.`,
  outlook:`이번 사건을 계기로 기업들의 프리랜서 및 원격 근무자 채용 시 신원 확인이 엄격해지고 정부 차원의 가이드라인이 신설될 것으로 예상됩니다.`,
  sources:[{title:`북한 IT 인력 국내 위장취업 첫 포착 - 한겨레`,url:`https://hani.co.kr`}]
}]

  category:`경제`,

  colorBg:`#e8f0fe`,
  headline:`뉴욕 증시, 엔비디아 등 기술주 주도로 강세장 연출`,
  metrics:[`나스닥 지수 1.5% 상승`,`엔비디아 주가 사상 최고치 경신`],
  summary:`미국 뉴욕 증시가 대형 기술주들의 강력한 실적 기대감에 힘입어 일제히 상승했습니다. 특히 엔비디아와 AMD 등 AI 반도체 관련 기업들이 시장의 강세를 이끌고 있습니다. 인공지능 수요가 여전히 탄탄하다는 신호가 곳곳에서 나오면서 투자자들의 매수세가 유입되었습니다. 이번 AI 랠리는 시장의 단기적 과열 우려를 잠재우며 지수 상승의 주요 동력으로 작용하고 있습니다. 전문가들은 이러한 추세가 연말까지 이어질 수 있다고 분석합니다. 향후 주요 빅테크 기업들의 3분기 실적 발표가 추가 상승의 분수령이 될 전망입니다.`,
  keyTerms:[{term:`AI 랠리`,explanation:`인공지능(AI) 관련 기업들의 실적 호조와 미래 성장 기대감으로 인해 주식 시장에서 관련 주가가 동반 상승하는 현상을 말합니다.`}],
  history:`2023년 챗GPT 등장 이후 인공지능 산업은 폭발적으로 성장하며 증시의 핵심 테마로 자리 잡았습니다.`,
  players:`엔비디아, 마이크로소프트 등 글로벌 빅테크 기업들과 이들에 투자하는 글로벌 기관 투자자들이 시장을 주도하고 있습니다.`,
  current:`AI 칩 수요가 공급을 크게 초과하는 상황이 지속되면서 기술주 전반의 실적 기대감이 최고조에 달해 있습니다.`,
  outlook:`다음 주 예정된 주요 IT 기업들의 실적 발표 결과에 따라 시장의 방향성이 더욱 뚜렷해질 것으로 예상됩니다.`,
  sources:[{title:`뉴욕 증시 기술주 강세 - 매일경제`,url:`https://www.mk.co.kr`},{title:`AI 수요 건재 신호 - 한국경제`,url:`https://www.hankyung.com`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`국제 유가, 중동 긴장과 종전 기대감 엇갈리며 배럴당 108달러대 혼조세`,
  metrics:[`브렌트유 배럴당 108달러 유지`,`유가 변동성 지수 15% 상승`],
  summary:`국제 유가가 중동 지역의 긴장 고조와 종전 협상에 대한 기대감이 동시에 작용하며 뚜렷한 방향성을 찾지 못하고 있습니다. 런던 ICE 선물거래소에서 브렌트유는 배럴당 108달러대에서 등락을 반복했습니다. 이스라엘과 하마스 간의 갈등 격화가 원유 공급망을 위협할 수 있다는 우려가 유가 하락을 방어하고 있습니다. 반면, 일부 외교 채널을 통한 휴전 논의 소식은 상승폭을 제한하고 있습니다. 전문가들은 지정학적 리스크가 완전히 해소되기 전까지는 유가의 높은 변동성이 지속될 것으로 내다보고 있습니다. 세계 경제의 성장 둔화 우려도 유가 향방에 영향을 미치고 있습니다.`,
  keyTerms:[{term:`지정학적 리스크`,explanation:`특정 지역의 정치적, 군사적 긴장 상태가 글로벌 경제나 금융 시장에 부정적인 영향을 미치는 위험 요인을 뜻합니다.`}],
  history:`중동 지역은 전 세계 원유 공급의 핵심 동맥으로, 이 지역의 군사적 충돌은 역사적으로 유가 급등을 유발해 왔습니다.`,
  players:`원유 수출국인 중동 국가들, 그리고 유가 변동에 민감한 미국, 중국 등 주요 에너지 소비국들이 복잡하게 얽혀 있습니다.`,
  current:`군사적 충돌과 휴전 협상이 동시에 진행되는 불확실한 국면이 원유 시장 참가자들의 관망세를 부추기고 있습니다.`,
  outlook:`향후 몇 주 내로 중동 휴전 협상 결과가 가시화될 경우 국제 유가의 향방이 크게 요동칠 수 있습니다.`,
  sources:[{title:`국제 유가 혼조세 지속 - 연합뉴스`,url:`https://www.yna.co.kr`},{title:`중동 긴장과 에너지 시장 - 블룸버그`,url:`https://www.bloomberg.com`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`반도체 수출 호조 이면의 그늘, 저출산·고령화로 중장기 재정 건전성 경고등`,
  metrics:[`한국 노인 인구 비율 22% 돌파`,`중장기 의무지출 30% 증가 전망`],
  summary:`한국의 반도체 수출이 역대급 호조를 보이고 있지만, 국가의 중장기 재정 상태에는 적신호가 켜졌습니다. 초고령사회 진입으로 노인 인구 비율이 22%를 넘어서면서 복지 분야의 의무지출이 급증하고 있기 때문입니다. 단기적인 세수 수입 증가만으로는 인구 구조 변화로 인한 막대한 재정 지출을 감당하기 어렵다는 지적이 나옵니다. 정부의 재정 건전성을 유지하기 위해서는 연금 개혁과 복지 지출 구조조정이 시급하다는 목소리가 커지고 있습니다. 경제 전문가들은 지금이 국가 채무 리스크를 선제적으로 관리할 골든타임이라고 강조합니다. 청년층의 세 부담 증가에 대한 우려도 함께 제기되고 있습니다.`,
  keyTerms:[{term:`재정 건전성`,explanation:`국가나 지방자치단체가 빚(부채)에 과도하게 의존하지 않고 수입과 지출의 균형을 건강하게 유지하는 상태를 의미합니다.`}],
  history:`한국은 전 세계에서 가장 빠르게 고령화가 진행되는 국가 중 하나로, 과거부터 복지 재정 확대로 인한 부채 증가가 경고되어 왔습니다.`,
  players:`재정을 갹출해야 하는 정부와 세금 부담을 안는 청년층, 그리고 복지 혜택을 받는 노년층 간의 이해관계가 대립합니다.`,
  current:`반도체 호황이 일시적으로 국가 수입을 늘려주고 있으나, 구조적인 고령화 지출 증가 속도가 이를 앞지르고 있는 상황입니다.`,
  outlook:`차기 국회와 정부에서 국민연금 구조개혁 및 복지 예산 재편 논의가 얼마나 속도를 낼 수 있을지가 관건입니다.`,
  sources:[{title:`반도체 호황에도 재정 경고 - 중앙일보`,url:`https://www.joongang.co.kr`},{title:`고령화와 국가채무 리스크 - 조선일보`,url:`https://www.chosun.com`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`대남 확성기 재가동 등 남북 접경지역 군사적 긴장 최고조`,
  metrics:[`대북 확성기 방송 2배 확대`,`접경지 위험구역 3곳 추가 지정`],
  summary:`남북 간의 군사적 대치 상황이 좀처럼 돌파구를 찾지 못하며 접경지역의 긴장이 최고조에 달하고 있습니다. 북한의 쓰레기 풍선 살포 등 도발에 대응해 우리 군은 대북 확성기 방송 시간을 대폭 늘렸고, 북한 역시 대남 확성기 소음을 재가동하며 맞불을 놓고 있습니다. 양측의 강대강 대치 속에 주민들의 불안감이 커지자 지자체는 일부 지역을 위험구역으로 지정했습니다. 이처럼 격화되는 접경지역 긴장은 남북 관계의 단절이 장기화될 수 있음을 시사합니다. 국제사회도 한반도의 우발적 무력 충돌 가능성을 주시하며 자제를 촉구하고 있습니다. 대화 채널이 단절된 상황에서 당분간 긴장 상태는 지속될 전망입니다.`,
  keyTerms:[{term:`접경지역 긴장`,explanation:`남북한이 군사적으로 맞닿아 있는 비무장지대 주변에서 군사적 행동이나 도발로 인해 발생할 수 있는 충돌 위험과 불안감을 뜻합니다.`}],
  history:`남북 관계는 과거부터 도발과 대화의 사이클을 반복해왔으나, 최근 몇 년간 모든 대화 채널이 끊기며 강경 대응 기조가 정착되었습니다.`,
  players:`한국 군과 정부, 북한의 지도부, 그리고 해당 지역에 거주하는 접경지 주민들이 가장 직접적인 당사자입니다.`,
  current:`오물 풍선과 확성기 방송이라는 심리전 양상이 지속되면서, 자칫 작은 오해가 물리적 충돌로 번질 수 있는 아슬아슬한 상황입니다.`,
  outlook:`북한의 추가적인 군사 도발 여부와 이에 대한 한미 연합군의 대응 강도가 향후 정세의 주요 변곡점이 될 것입니다.`,
  sources:[{title:`대남 확성기 재가동 긴장 고조 - KBS 뉴스`,url:`https://news.kbs.co.kr`},{title:`접경지역 주민 불안 가중 - MBC 뉴스`,url:`https://imnews.imbc.com`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`한국 정부, 중동 및 아프리카 자원국과 100억 달러 규모 공급망 외교 성과`,
  metrics:[`핵심 광물 협정 5건 체결`,`양해각서(MOU) 100억 달러 돌파`],
  summary:`한국 정부가 중동과 아프리카의 주요 자원국들을 상대로 광범위한 경제 협력을 이끌어내고 있습니다. 첨단 산업에 필수적인 희소 금속을 안정적으로 확보하기 위해 최근 5건의 핵심 광물 협정을 연이어 체결했습니다. 인프라 투자와 연계된 100억 달러 규모의 양해각서 체결도 성공적으로 마무리되었습니다. 자원 무기화가 심화되는 글로벌 환경 속에서 다변화를 노리는 이번 공급망 외교는 한국 경제의 미래 안보를 지키는 핵심 전략입니다. 경제 단체들은 정부의 발빠른 행보가 민간 기업들의 해외 진출에 큰 마중물이 될 것으로 환영했습니다. 앞으로도 전략 국가들과의 정상급 교류가 확대될 예정입니다.`,
  keyTerms:[{term:`공급망 외교`,explanation:`반도체나 배터리 등 주요 산업에 필요한 원자재와 부품을 안정적으로 확보하기 위해 다른 국가들과 맺는 정치·경제적 협력 활동입니다.`}],
  history:`미중 패권 경쟁 이후 특정 국가에 원자재를 지나치게 의존하는 것이 국가적 위험 요소로 부각되면서 수입처 다변화가 절실해졌습니다.`,
  players:`안정적인 자원 확보가 필요한 한국 정부 및 첨단 기술 기업들과, 자원 개발 투자가 필요한 아프리카, 중동 국가들이 참여합니다.`,
  current:`전 세계가 핵심 광물을 선점하기 위해 치열한 각축전을 벌이는 가운데, 한국은 인프라 지원을 지렛대로 자원 확보에 속도를 내고 있습니다.`,
  outlook:`체결된 양해각서가 실제 기업들의 본계약 체결과 자원 수입 확대로 얼마나 빠르게 이어질지가 다음 과제입니다.`,
  sources:[{title:`정부, 자원 외교 성과 발표 - 동아일보`,url:`https://www.donga.com`},{title:`중동 공급망 협력 100억 달러 돌파 - 한국경제`,url:`https://www.hankyung.com`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 중간선거 2주 앞두고 사전투표율 역대 최고치 기록`,
  metrics:[`사전투표율 30% 상회`,`주요 경합주 4곳 지지율 1%p 내 초박빙`],
  summary:`2026년 미국 중간선거가 불과 2주 앞으로 다가온 가운데, 정치적 양극화가 심화되며 유권자들의 투표 열기가 뜨겁게 달아오르고 있습니다. 집계된 사전투표율은 역대 최고치인 30%를 넘어서며 양당 지지층의 높은 결집력을 보여줍니다. 특히 선거의 승패를 결정지을 주요 격전지에서는 지지율 격차가 오차범위 내에 머물고 있습니다. 전문가들은 선거 막판까지 경합주의 표심을 잡기 위한 여야의 총력전이 선거 자금 지출과 네거티브 공세로 이어지고 있다고 평가합니다. 선거 결과에 따라 현 행정부의 하반기 정책 추진 동력이 크게 달라질 수밖에 없습니다. 세계 각국도 미국 의회 권력 재편 가능성을 예의주시하고 있습니다.`,
  keyTerms:[{term:`경합주`,explanation:`선거 때마다 지지하는 정당이 바뀌거나 양당의 지지율이 매우 비슷해, 선거의 최종 승패를 결정짓는 결정적인 역할을 하는 주(State)를 말합니다.`}],
  history:`미국의 선거 제도는 특정 주에 정치적 성향이 고정되어 있는 반면, 몇몇 격전지의 표심이 전체 결과를 좌우하는 구조적 특징을 가집니다.`,
  players:`집권 민주당과 의회 탈환을 노리는 공화당, 그리고 부동층 유권자들이 선거판의 핵심 플레이어들입니다.`,
  current:`인플레이션과 낙태권 등 민감한 사회적 이슈들이 맞물리면서 유권자들의 이념적 대립이 그 어느 때보다 날카로운 상황입니다.`,
  outlook:`개표 당일 초박빙 지역의 결과에 따라 우편투표 개표 지연 및 재검표 등 선거 후 불복 논란이 발생할 가능성도 제기됩니다.`,
  sources:[{title:`미국 중간선거 사전투표 폭발적 증가 - 워싱턴포스트`,url:`https://www.washingtonpost.com`},{title:`미국 경합주 표심 오리무중 - 뉴욕타임스`,url:`https://www.nytimes.com`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`스페이스X 3분기 깜짝 실적, AI 데이터센터가 이끄는 전력 인프라 호황`,
  metrics:[`스페이스X 분기 매출 40% 급증`,`AI 인프라 전력기기 수주 9배 폭등`],
  summary:`우주항공 기업 스페이스X가 예상을 뛰어넘는 3분기 실적을 발표하며 글로벌 IT 산업의 훈풍을 입증했습니다. 위성 통신 사업뿐만 아니라 인공지능 시대에 폭발적으로 증가하는 데이터센터 수요가 전방위적인 산업 성장을 이끌고 있습니다. 특히 대규모 AI 데이터센터 건립에 필수적인 전력망과 변압기 수요가 급증하면서 관련 기업들의 실적이 연일 고공행진 중입니다. 시장 전문가들은 이를 단순한 유행이 아닌 다년간 지속될 슈퍼사이클의 진입으로 해석하고 있습니다. 디지털 인프라 확충 속도가 빨라짐에 따라 에너지 효율을 높이는 친환경 전력 기술에 대한 투자도 쇄도하고 있습니다. 이는 전 세계적인 에너지 믹스 변화에도 큰 영향을 줄 전망입니다.`,
  keyTerms:[{term:`슈퍼사이클`,explanation:`장기적으로 원자재나 특정 산업의 수요가 폭발적으로 증가하면서 가격과 실적이 오랜 기간 지속적으로 오르는 대호황 국면을 의미합니다.`}],
  history:`스마트폰 시대 이후 정체되었던 IT 하드웨어 산업은 생성형 AI의 등장으로 막대한 연산 능력이 필요해지면서 새로운 부흥기를 맞았습니다.`,
  players:`글로벌 빅테크 기업을 비롯해, 이들에게 서버를 제공하는 스페이스X, 통신 인프라 기업, 고압 변압기를 생산하는 전력기기 업체들이 활약 중입니다.`,
  current:`AI 모델 학습과 구동을 위한 막대한 전기 에너지를 감당하기 위해 전 세계 전력망의 대규모 교체와 증설이 동시에 진행되고 있습니다.`,
  outlook:`폭증하는 전력 수요를 충당하기 위해 차세대 원전이나 재생에너지 기반의 데이터센터 구축 논의가 본격적으로 확대될 것입니다.`,
  sources:[{title:`스페이스X 실적 급성장 - 로이터`,url:`https://www.reuters.com`},{title:`AI 데이터센터가 이끄는 전력 호황 - 파이낸셜타임스`,url:`https://www.ft.com`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`담배 소비 감소의 역설, 지자체 소방 예산 대규모 삭감 위기 직면`,
  metrics:[`내년 소방안전교부세 28% 감소 전망`,`최근 5년간 구급대원 폭행 1250건`],
  summary:`흡연율 감소로 담배소비세 수입이 줄어들면서, 이를 재원으로 하던 지방자치단체의 소방 예산이 대폭 삭감될 위기에 처했습니다. 행정안전부 자료에 따르면 내년도 관련 예산이 전년 대비 약 28% 감소할 것으로 추산되어 소방관들의 장비 노후화 우려가 제기됩니다. 여기에 구급대원들을 향한 폭력 사건까지 끊이지 않아 현장 인력들의 사기와 처우 문제가 도마 위에 올랐습니다. 소방 인프라 확충에 쓰이는 소방안전교부세 감소는 결국 국민의 안전 공백으로 이어질 수 있습니다. 국회에서는 재원 마련 방식을 근본적으로 개편해야 한다는 목소리가 커지고 있습니다. 현장 대원들의 안전을 지킬 강력한 법적 보호 장치 마련도 시급한 실정입니다.`,
  keyTerms:[{term:`소방안전교부세`,explanation:`국민의 생명과 재산을 보호하기 위해 담배에 부과되는 세금의 일부를 떼어내어 지방자치단체의 소방 인력과 장비 확충에 지원하는 예산입니다.`}],
  history:`과거 지방직이었던 소방공무원이 국가직으로 전환된 이후에도, 장비 구매와 현장 운영에 필요한 주요 예산은 여전히 지자체의 몫으로 남아 있었습니다.`,
  players:`예산을 관리하는 행정안전부와 지자체, 그리고 일선 현장에서 위험을 감수하는 소방관 및 이들의 도움을 받는 국민들입니다.`,
  current:`국민 건강을 위한 금연 정책이 성공을 거두면서 아이러니하게도 소방 예산의 핵심 수입원이 말라버리는 재정적 모순이 발생했습니다.`,
  outlook:`정부가 담배소비세 외에 다른 안정적인 세원을 소방 예산으로 전환하는 법안을 연내에 처리할 수 있을지가 핵심 쟁점입니다.`,
  sources:[{title:`소방 예산 삭감 우려 - 뉴스핌`,url:`https://www.newspim.com`},{title:`구급대원 폭행 실태 심각 - 국민일보`,url:`https://www.kmib.co.kr`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`부모 소득이 가르는 청년 취업의 질, '출발선 불평등' 심화 논란`,
  metrics:[`정규직 취업률 최대 4배 격차`,`4년제 졸업 유예 청년 15% 증가`],
  summary:`부모의 경제적 배경이 자녀의 양질의 일자리 취업에 미치는 영향이 갈수록 커지면서 청년층의 출발선 불평등 문제가 사회적 화두로 떠올랐습니다. 최신 연구 결과에 따르면 부모의 소득 상위 그룹과 하위 그룹 간 자녀의 대기업 정규직 취업률이 최대 4배까지 벌어졌습니다. 취업 난관에 부딪힌 많은 대학생들이 졸업을 미루며 스펙 쌓기에 매달리면서 졸업 유예 비율도 크게 증가했습니다. 이러한 사회적 이동성의 저하는 계층 고착화를 심화시켜 장기적인 경제 활력을 떨어뜨리는 원인이 됩니다. 전문가들은 스펙 위주의 채용 관행을 개선하고 저소득층을 위한 직업 훈련 지원을 강화해야 한다고 촉구합니다. 청년들이 체감하는 상대적 박탈감을 줄이기 위한 범정부적 대책이 요구됩니다.`,
  keyTerms:[{term:`사회적 이동성`,explanation:`개인의 노력이나 능력에 따라 자신의 경제적, 사회적 계층(지위)을 더 나은 방향으로 바꿀 수 있는 가능성이나 사다리를 의미합니다.`}],
  history:`한국 사회는 과거 교육을 통한 계층 상승이 활발했으나, 최근 고도성장이 끝나고 양질의 일자리가 한정되면서 사교육비에 따른 격차가 누적되어 왔습니다.`,
  players:`취업 시장에 진입하는 청년 구직자들과 좋은 인재를 선발하려는 기업들, 그리고 청년 정책을 입안하는 정부 부처가 얽혀 있습니다.`,
  current:`경기 침체 여파로 대기업들이 수시 채용과 경력직을 선호하게 되면서, 인턴십이나 어학연수 등 비용이 드는 스펙을 갖추지 못한 청년들의 소외가 심해졌습니다.`,
  outlook:`다가오는 정기국회에서 청년 일자리 예산 배정과 공정 채용을 촉진하기 위한 지원 법안들이 얼마나 구체적으로 논의될지 주목됩니다.`,
  sources:[{title:`청년 출발선 불평등 심화 - 동아일보`,url:`https://www.donga.com`},{title:`졸업 유예 증가하는 청년들 - 한겨레`,url:`https://www.hani.co.kr`}]
}]

  tag:`2026-10-21`,
  label:`2026년 10월 21일 (수)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`코스피, 외국인·기관 대규모 순매도에 3.73% 급락… AI 투자 지속성에 의구심 확산`,
  metrics:[`코스피 지수 3.73% 하락 (5,552.74 마감)`,`국고채 3년물 3.840% (-3.7bp) 하락`],
  summary:`국내 증시가 외국인과 기관의 대대적인 매도세에 부딪혀 코스피 지수 5,552.74로 마감하며 3.73%나 급락했습니다. 특히 삼성전자와 SK하이닉스 등 대형 반도체주가 큰 폭으로 떨어지며 하락장을 주도했습니다. 시장에서는 막대한 자본이 투입되는 AI 인프라 투자가 향후 충분한 수익성으로 이어질 수 있을지에 대한 의구심이 커진 상태입니다. 주식 시장의 불확실성이 극대화되면서 투자금은 상대적으로 변동성이 적은 채권 등 안전자산으로 쏠리는 현상이 나타났습니다. 이로 인해 국고채 3년물과 10년물 금리가 동반 하락하며 증시와 채권 시장의 분위기가 확연히 엇갈렸습니다. 이번 하락장은 국내뿐만 아니라 아시아 주요 증시에도 비슷한 충격을 주고 있습니다.`,
  keyTerms:[{term:`안전자산`,explanation:`주식 등 위험성이 높은 투자처를 피해, 국채나 금처럼 가치 변동이 적고 원금을 잃을 위험이 낮은 투자 대상을 의미합니다.`}],
  history:`지난 1~2년간 글로벌 IT 기업들이 AI 데이터센터와 반도체에 천문학적인 자금을 투자하며 증시 상승을 이끌어왔습니다.`,
  players:`국내 반도체 대장주인 삼성전자 및 SK하이닉스와, 차익 실현에 나선 외국인 및 기관 투자자들이 핵심 주체입니다.`,
  current:`초기 AI 열풍이 진정되면서, 천문학적인 투자 비용 대비 실제 수익화 모델이 부족하다는 현실적인 우려가 주가 하락의 트리거가 되었습니다.`,
  outlook:`미국 빅테크 기업들의 3분기 실적 발표와 향후 인프라 투자 가이던스에 따라 아시아 반도체 증시의 반등 여부가 결정될 전망입니다.`,
  sources:[{title:`증시 3.7% 급락, AI 의구심 덮쳤다 - FN타임즈`,url:`https://www.fntimes.com/`},{title:`국고채 금리 하락 마감 - 연합뉴스`,url:`https://www.yna.co.kr/`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`신세계, 다우키움·CJ 컨소시엄 합류하며 중앙일보 인수전 전격 참여`,
  metrics:[`중앙일보 인수 예상 지분 가치 약 2조원`,`신세계 측 초기 참여 자금 약 4,000억 원 규모`],
  summary:`유통 공룡 신세계그룹이 중앙일보 인수전에 공식적으로 뛰어들며 시장의 이목을 집중시키고 있습니다. 신세계는 앞서 인수전 참여를 선언한 다우키움그룹 및 CJ그룹과 함께 거대한 컨소시엄을 구성하여 자금력을 대폭 보강했습니다. 이번 합류는 단순한 언론사 인수를 넘어 범삼성가 기업들이 주도하는 미디어·콘텐츠 및 유통 인프라의 시너지 확대를 노린 전략적 행보로 풀이됩니다. 세 그룹이 손을 잡으면서, 경쟁 후보들을 압도할 수 있는 유리한 고지를 선점했다는 평가가 나옵니다. 향후 실사 과정과 본입찰에서 이 연합체가 제시할 최종 인수 조건이 핵심 승부처가 될 전망입니다. 미디어 업계 지형을 뒤흔들 수 있는 빅딜인 만큼 재계의 비상한 관심이 쏠려 있습니다.`,
  keyTerms:[{term:`컨소시엄`,explanation:`공통의 목적을 달성하기 위해 여러 기업이나 단체가 자금과 기술을 모아 임시로 구성한 전략적 연합체를 뜻합니다.`}],
  history:`중앙일보의 모그룹이 미디어 부문 재편을 위해 지분 매각을 타진하면서 국내 대기업들의 인수 경쟁이 물밑에서 진행되어 왔습니다.`,
  players:`자본력을 앞세운 다우키움그룹, 콘텐츠 강자인 CJ, 유통망을 보유한 신세계가 연합의 핵심 축을 담당하고 있습니다.`,
  current:`신세계의 막판 합류로 범삼성가 중심의 거대 연합이 탄생하면서, 단독 인수를 추진하던 다른 경쟁자들의 입지가 크게 좁아졌습니다.`,
  outlook:`이달 말 예정된 본입찰에서 이들이 제시할 구체적인 인수가와 미디어 융합 청사진에 따라 인수전의 최종 승자가 가려질 것입니다.`,
  sources:[{title:`신세계, 중앙일보 인수전 전격 합류 - 구글뉴스`,url:`https://news.google.com/`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 연준 10월 FOMC 기준금리 동결 유력… 고금리 기조 당분간 유지 전망`,
  metrics:[`현재 미국 기준금리 3.75~4.00%`,`시장 전문가 90% 이상 10월 동결 전망`],
  summary:`미국 연방준비제도(Fed)가 다가오는 10월 FOMC 회의에서 기준금리를 현재의 3.75~4.00% 수준으로 유지할 것이라는 전망이 지배적입니다. 로이터 통신 등 주요 외신에 따르면, 시장 전문가의 90% 이상이 이번 회의에서 기준금리 동결 결정을 예상하고 있습니다. 최근 미국의 주택 시장 지표가 둔화되고 인플레이션 압력이 다소 완화되는 조짐을 보이면서 연준이 무리한 인상에 나서지 않을 것이란 분석입니다. 다만 연말까지 고금리 기조가 유지될 것이라는 관측 때문에 기업들의 차입 부담은 지속될 것으로 보입니다. 금리 인상 사이클의 종결 여부에 대한 명확한 신호가 나오지 않으면서 채권 시장도 좁은 박스권에서 움직이고 있습니다. 전문가들은 12월 회의 전까지 발표될 고용 및 물가 데이터가 향후 통화정책의 핵심 변수가 될 것으로 내다봤습니다.`,
  keyTerms:[{term:`기준금리`,explanation:`한 나라의 중앙은행이 경제 상황을 조절하기 위해 시중 은행과 거래할 때 기준으로 삼는 정책 금리입니다.`}],
  history:`미국 연준은 과거의 인플레이션 급등을 잡기 위해 공격적인 금리 인상을 단행해 왔으나, 최근에는 경제 연착륙을 위해 인상 속도를 조절해 왔습니다.`,
  players:`통화정책을 결정하는 미국 연방준비제도 제롬 파월 의장과 이에 민감하게 반응하는 글로벌 투자 기관들이 핵심 플레이어입니다.`,
  current:`물가 상승세가 둔화되고 있지만 고용 지표가 여전히 견조하여, 금리 인하보다는 고점에서의 동결을 통해 상황을 주시하려는 단계입니다.`,
  outlook:`10월 FOMC 발표 직후 제롬 파월 의장의 기자회견 발언 뉘앙스에 따라 글로벌 증시와 환율 시장이 크게 요동칠 수 있습니다.`,
  sources:[{title:`Fed, 10월 금리 동결 유력 - 트레이딩이코노믹스`,url:`https://tradingeconomics.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`이재명 대통령, 3기 신도시 현장 방문해 '규제 철폐와 주택 공급 전격전' 주문`,
  metrics:[`수도권 3기 신도시 첫 입주 물량 3만호`,`인허가 단축 등 공기 단축 6개월 목표`],
  summary:`이재명 대통령이 청와대 국무회의에서 주택 공급의 속도전을 강도 높게 주문하며 이른바 주택 공급 전격전을 공식화했습니다. 회의 직후 3기 신도시 중 가장 먼저 입주를 앞둔 인천 계양지구 현장을 직접 방문하여 진행 상황을 점검했습니다. 이 대통령은 과거의 관행이나 절차에 얽매이지 말고 불필요한 행정 규제를 신속히 걷어낼 것을 부처에 지시했습니다. 특히 착공 일정을 대폭 앞당기기 위해 기반 시설 공사 전이라도 땅을 먼저 공급하는 원형지 분양 방식을 적극 활용하라고 강조했습니다. 정부는 이번 지시를 기점으로 수도권 주택난 해소와 부동산 시장 과열을 막기 위한 범부처 차원의 태스크포스를 즉각 가동할 계획입니다. 야당은 이에 대해 절차적 졸속 우려를 제기하며 국정감사에서 송곳 검증을 예고했습니다.`,
  keyTerms:[{term:`원형지 분양`,explanation:`도로나 상하수도 등 기반 시설을 조성하지 않은 자연 상태 그대로의 토지를 민간 건설사 등에 미리 분양하여 전체 개발 기간을 단축하는 방식입니다.`}],
  history:`최근 서울 아파트 매매가격이 88주 연속 상승하며 역대 최장 기록을 경신하는 등 부동산 시장의 불안이 가중되는 상황이었습니다.`,
  players:`신속한 공급을 밀어붙이는 대통령실 및 국토교통부, 그리고 절차적 정당성을 짚고 넘어가는 국회 야당이 대립각을 세우고 있습니다.`,
  current:`정부가 선언적인 대책 발표를 넘어 현장 행보를 통해 가시적인 입주 일정을 앞당기는 실질적 조치에 총력을 기울이고 있습니다.`,
  outlook:`국회에 계류 중인 각종 부동산 규제 완화 법안들이 야당의 협조를 얻어 조속히 통과될 수 있을지가 핵심 관건입니다.`,
  sources:[{title:`대통령, 주택 공급 전격전 지시 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`3기 신도시 첫 입주 현장 방문 - MBC`,url:`https://imnews.imbc.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 11월 중간선거 격전지 중심 조기투표 돌입… 선거 보안 총력전`,
  metrics:[`전체 유권자 중 조기투표 예상 비율 40% 이상`,`핵심 경합주 5곳 조기투표 시작`],
  summary:`올해 11월 치러질 미국 중간선거를 약 2주 앞두고, 여야가 사활을 건 핵심 경합주들을 중심으로 조기투표가 본격적으로 시작되었습니다. 각 당은 본 선거일 이전에 최대한 많은 지지층을 투표소로 끌어내기 위해 막대한 선거 자금과 조직력을 투입하고 있습니다. 우편 투표 및 현장 투표 참여율이 40%를 넘을 것으로 예상되면서, 이번 조기투표의 향방이 전체 선거 결과를 가늠할 핵심 척도가 될 전망입니다. 동시에 미국 연방 당국은 투표 시스템에 대한 외부 해킹이나 가짜 뉴스 확산을 막기 위해 선거 인프라 보안 점검에 총력을 기울이고 있습니다. 특히 경합주에서는 표 차이가 아주 근소할 것으로 보여, 사전 투표용지의 유효성을 둘러싼 여야 간의 법적 공방도 벌써부터 시작되는 분위기입니다. 선거가 임박할수록 양 진영의 네거티브 공세도 더욱 격렬해지고 있습니다.`,
  keyTerms:[{term:`조기투표`,explanation:`선거 당일에 혼잡을 피하고 투표율을 높이기 위해, 지정된 선거일 전에 미리 투표소에 가거나 우편으로 투표권을 행사할 수 있게 한 제도입니다.`}],
  history:`과거 팬데믹 이후 미국의 선거에서 우편 투표와 사전 투표의 비중이 급격히 커졌으며, 선거의 당락을 결정짓는 핵심 제도로 자리 잡았습니다.`,
  players:`상하원 다수당 탈환을 노리는 공화당과 수성에 나선 민주당, 그리고 캐스팅 보트를 쥔 무당층 유권자들이 투표소로 향하고 있습니다.`,
  current:`경합주의 여론조사가 오차범위 내에서 팽팽하게 맞서고 있어, 각 당은 지지자들의 사전 투표 독려를 최우선 전략으로 삼고 있습니다.`,
  outlook:`조기 투표율이 유독 높은 지역의 개표 결과가 11월 본 선거 당일의 개표 흐름과 출구조사를 분석하는 가장 중요한 지표가 될 것입니다.`,
  sources:[{title:`미 중간선거 조기투표 시작 - 뉴스K`,url:`https://www.newsk.net/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`조국혁신당, 대법원장 탄핵 야권 공동행동 제안… 국회 사법개혁 공방 격화`,
  metrics:[`조국혁신당 의석 수 (원내 제3당)`,`대법원장 탄핵 소추 발의 필요 인원 (재적 3분의 1)`],
  summary:`조국혁신당 지도부가 국회 소통관에서 긴급 기자회견을 열고 조희대 대법원장 탄핵 및 강도 높은 사법개혁을 추진하기 위한 야권 공동행동을 전격 제안했습니다. 신장식 대표 등은 사법부가 국민의 신뢰를 잃고 정치적 편향성에 휘말렸다며 탄핵 추진의 당위성을 강력하게 주장했습니다. 이 제안이 나오자마자 국회 법제사법위원회를 중심으로 여당과 야당 간의 치열한 정치적 공방이 재점화되었습니다. 더불어민주당 내부에서는 탄핵 동참 시기와 수위를 두고 의견이 엇갈리고 있으며, 국민의힘은 이를 심각한 삼권분립 훼손이자 헌정 질서 파괴 행위라며 강하게 반발하고 있습니다. 막바지에 접어든 국정감사 일정과 맞물려 이 사안은 국회의 모든 입법 논의를 집어삼키는 핵심 블랙홀로 부상하고 있습니다. 야권이 실제 탄핵 소추 발의에 필요한 의결 정족수를 확보할 수 있을지와 여론의 향배가 정국을 좌우할 전망입니다.`,
  keyTerms:[{term:`탄핵 소추`,explanation:`대통령이나 법관 등 고위 공직자가 헌법이나 법률을 위반했을 때, 국회가 그 책임을 물어 파면을 청구하는 법적 절차입니다.`}],
  history:`최근 주요 정치인들과 관련된 재판 판결을 두고 야권 내부에서 사법부의 공정성에 대한 불만과 개혁 요구가 지속적으로 누적되어 왔습니다.`,
  players:`탄핵을 주도하는 조국혁신당, 거대 야당인 더불어민주당, 그리고 사법부 독립 수호를 주장하는 여당이 치열하게 맞서고 있습니다.`,
  current:`조국혁신당이 원내 제3당의 입지를 활용해 거대 야당의 동참을 압박하면서, 국회 내 사법개혁 논의가 새로운 국면을 맞이했습니다.`,
  outlook:`야권이 실제 탄핵 소추안 발의에 필요한 의결 정족수를 확보할 수 있을지와, 이에 대응하는 헌법재판소의 향후 기류가 핵심 변수입니다.`,
  sources:[{title:`조국혁신당, 대법원장 탄핵 공동행동 제안 - 2News`,url:`https://www.2news.co.kr/`},{title:`국회 법사위 탄핵 공방 격화 - 뉴스핌`,url:`https://www.newspim.com/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`마스터카드, AI 에이전트 간 자율 결제 가능한 'Agent Pay' 생태계 공개`,
  metrics:[`참여 파일럿 파트너사 코인베이스 등 5곳`,`결제 프로토콜 규격 x402 적용`],
  summary:`글로벌 결제 기업 마스터카드가 클라우드플레어 커넥트 행사에서 사람의 개입 없이 AI 자율 에이전트끼리 서비스와 비용을 직접 주고받을 수 있는 혁신적인 결제 플랫폼을 발표했습니다. 이 플랫폼은 AI 모델이 데이터를 구매하거나 부족한 연산 자원을 다른 서버에서 대여할 때, 사전에 사용자가 설정한 예산 범위 내에서 자동으로 요금을 결제하도록 설계되었습니다. 이를 위해 마스터카드는 오픈 소스 기반의 자율 결제 프로토콜인 x402를 자사의 거대한 글로벌 결제망에 완벽하게 연동시켰습니다. 코인베이스를 비롯한 주요 IT 인프라 기업들이 이미 파일럿 파트너로 합류하여 실증 테스트를 진행 중입니다. 이번 발표는 AI가 단순한 질문 답변이나 업무 보조를 넘어, 스스로 판단하고 경제 활동까지 수행하는 진정한 독립적 행위자로 진화하고 있음을 시사합니다. 전문가들은 이 시스템이 미래 머신-투-머신 경제의 표준이 될 것으로 기대하고 있습니다.`,
  keyTerms:[{term:`자율 결제 프로토콜`,explanation:`사람의 승인이나 별도의 로그인 과정 없이, 컴퓨터 프로그램이나 AI가 정해진 규칙에 따라 스스로 안전하게 금융 결제를 수행하는 통신 규약입니다.`}],
  history:`대규모 AI 모델과 다양한 애플리케이션이 등장함에 따라, 시스템 간 API 호출 시 발생하는 미세한 과금을 자동으로 처리해야 할 필요성이 급증했습니다.`,
  players:`새로운 금융 인프라를 구축하려는 마스터카드와 인프라를 제공하는 클라우드플레어, 코인베이스 등 IT 및 블록체인 기업들이 주도하고 있습니다.`,
  current:`AI 에이전트가 다른 업체의 API나 컴퓨팅 자원을 요청할 때마다 사람이 수동으로 카드를 긁어야 하는 병목 현상을 해결하기 위한 파일럿이 시작되었습니다.`,
  outlook:`얼리 액세스를 통해 보안성과 상호 운용성이 검증되면, 향후 자율주행차나 스마트 팩토리 등 다양한 사물인터넷 기기로 결제망이 확대될 것입니다.`,
  sources:[{title:`마스터카드 에이전트 결제 발표 - Mastercard News`,url:`https://www.mastercard.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`강남 빌딩 두 곳에 '상표권 불만' 70대 남성 연쇄 방화… 10여 명 부상`,
  metrics:[`부상자 12명 발생`,`연쇄 방화 간격 불과 30분`],
  summary:`서울 강남구 역삼동 한복판에서 70대 남성이 대낮에 특허법인 사무실 등이 입주한 상가 건물 두 곳에 연달아 불을 지르는 충격적인 연쇄 방화 사건이 발생했습니다. 이 남성은 자신이 출원하려던 상표 등록이 뜻대로 진행되지 않은 것에 강한 앙심을 품고 인화성 물질을 준비해 범행을 저지른 것으로 경찰 조사 결과 드러났습니다. 짧은 시간 차이를 두고 연이어 발생한 화재로 인해 건물 안에서 근무 중이던 직원과 방문객 등 10여 명이 화상 및 연기 흡입으로 부상을 입고 병원으로 급히 이송되었습니다. 소방당국은 관할 소방서 인력을 총동원하는 대응 단계를 발령하여 화재가 대형 참사로 번지는 것을 막았습니다. 피의자는 범행 직후 지하철을 타고 도주했으나, 동묘앞역에서 신고를 받고 출동한 경찰에 의해 긴급 체포되었습니다. 도심 한복판에서 벌어진 묻지마식 방화 범죄에 시민들의 불안감이 커지고 있습니다.`,
  keyTerms:[{term:`연쇄 방화`,explanation:`동일한 범인이나 집단이 짧은 시간과 거리 간격을 두고 의도적으로 여러 장소에 불을 지르는 심각한 범죄 행위입니다.`}],
  history:`개인의 행정적 불만이나 소송 패소 등의 억울함을 엉뚱한 기관이나 불특정 다수를 향한 테러로 표출하는 범죄가 간헐적으로 발생해 왔습니다.`,
  players:`상표 등록에 실패해 극단적 범행을 선택한 70대 피의자와, 무방비 상태에서 피해를 입은 특허법인 입주자들입니다.`,
  current:`백주대낮에 서울 도심 한복판의 고층 빌딩에서 벌어진 인명 피해 사건이라 경찰이 정확한 범행 동기와 사전 계획 여부를 집중 조사 중입니다.`,
  outlook:`경찰은 피의자에 대해 특정범죄 가중처벌 등에 관한 법률상 방화 치상 등의 혐의로 구속영장을 신청하고 순찰을 강화할 방침입니다.`,
  sources:[{title:`역삼동 빌딩 연쇄 방화 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`70대 방화범 검거 - 다음뉴스`,url:`https://v.daum.net/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`미국 50개 도시서 'AI 개발 동결' 워크아웃 시위… 데이터센터 전력 고갈 반발`,
  metrics:[`미 전역 50여 개 주요 도시에서 시위 동시 진행`,`최신 데이터센터 1개당 일일 물 소비량 약 100만 갤런`],
  summary:`초거대 AI 모델 개발과 데이터센터 확장이 불러온 막대한 환경 파괴에 반발하며, 미국 전역 50여 개 주요 도시에서 동시다발적인 AI 개발 동결 요구 워크아웃 시위가 열렸습니다. 샌프란시스코의 주요 AI 기업 본사 앞에는 수천 명의 환경 단체 회원들과 지역 주민들이 모여 전력망 과부하와 식수 고갈 문제를 강력히 규탄했습니다. 시위대는 새로운 AI 인프라 구축이 기존 지역 사회의 전력 인프라 용량을 한계치까지 몰아붙이고 있으며, 냉각수로 사용되는 수자원의 엄청난 소모가 심각한 가뭄을 초래하고 있다고 지적했습니다. 이들은 지속 가능한 환경 규제가 마련될 때까지 대규모 모델의 학습을 전면 중단할 것을 정부와 빅테크 기업에 촉구했습니다. 기업들은 재생에너지 활용을 늘리고 있다고 해명했지만, 시민들의 불만은 좁혀지지 않고 있습니다. 이 사태는 기술 발전의 속도와 지구 환경 보호 사이의 거대한 사회적 갈등을 수면 위로 끌어올렸습니다.`,
  keyTerms:[{term:`전력 인프라`,explanation:`발전소에서 만들어진 전기를 공장이나 가정 등 필요한 곳까지 안정적으로 수송하고 분배하기 위해 설치된 대규모 설비망입니다.`}],
  history:`챗GPT 등 생성형 AI가 폭발적으로 성장하면서, 이를 처리하기 위한 대형 데이터센터들이 24시간 가동되며 막대한 에너지를 집어삼키고 있습니다.`,
  players:`지구 온난화와 지역 자원 고갈을 막으려는 환경 단체 및 지역 주민들과, 기술 주도권을 놓치지 않으려는 빅테크 기업 간의 대결입니다.`,
  current:`일부 지역에서는 데이터센터 가동으로 인해 가정용 전기 요금이 오르거나 용수 제한 조치가 내려지면서 주민들의 인내심이 한계에 달했습니다.`,
  outlook:`연방 정부와 주 정부 차원에서 데이터센터 신규 허가 시 전력 효율성과 수자원 보호를 의무화하는 강력한 규제 법안이 추진될 가능성이 높습니다.`,
  sources:[{title:`미국 50개 도시 AI 시위 - KQED`,url:`https://www.kqed.org/`}]
}]

  tag:`2026-10-20`,
  label:`2026년 10월 20일 (화)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국은행, 기준금리 0.25%p 전격 인하... 가계부채 우려 속 '경기 부양' 승부수`,
  metrics:[`기준금리 2.75% -> 2.50%`,`가계대출 증가율 4.2%`],
  summary:`한국은행 금융통화위원회가 10월 통화정책방향 회의에서 기준금리를 기존 2.75%에서 2.50%로 0.25%포인트 전격 인하했습니다. 이는 최근 계속되는 내수 침체와 수출 증가세 둔화에 대응하기 위한 선제적인 경기 부양 조치로 풀이됩니다. 특히 가계부채가 여전히 높은 수준을 유지하고 있음에도 불구하고 인하를 단행한 것은 실물 경제의 위기감이 더 크다는 판단 때문입니다. 전문가들은 이번 인하로 이자 부담은 다소 줄어들겠지만, 부동산 시장을 다시 자극할 우려도 제기하고 있습니다. 한편 정부는 대출 규제 강화 등 미시적 조치를 통해 가계부채 증가를 억제하겠다는 방침입니다. 향후 물가 상승률과 환율 추이에 따라 추가적인 금리 조정 여부가 결정될 전망입니다.`,
  keyTerms:[{term:`기준금리`,explanation:`중앙은행이 다른 금융기관과 거래할 때 기준이 되는 정책 금리입니다. 기준금리가 내려가면 대출 이자가 줄어들어 소비와 투자가 활성화되는 효과가 있습니다.`}],
  history:`과거 글로벌 인플레이션 대응을 위해 가파르게 인상되었던 금리가 최근 물가 안정세에 접어들면서 인하 사이클로 전환되었습니다. 하지만 가계부채 문제로 인해 인하 시점을 두고 오랫동안 고심해왔습니다.`,
  players:`금리를 결정하는 한국은행과 물가를 관리하는 기획재정부, 그리고 대출 이자에 민감한 가계와 기업들이 주요 이해관계자입니다.`,
  current:`내수 침체 장기화로 소상공인과 중소기업의 한계 상황이 지속되면서 경기 부양의 필요성이 가계부채 억제 명분을 넘어선 시점입니다.`,
  outlook:`다음 금통위에서 추가 인하가 이루어질지, 그리고 정부의 거시건전성 정책이 부동산 시장 불안을 효과적으로 차단할 수 있을지 시장의 이목이 쏠리고 있습니다.`,
  sources:[{title:`한은, 기준금리 2.50%로 0.25%p 인하 - 연합뉴스`,url:`https://yna.co.kr/news/1`},{title:`경기 방어 택한 한은... 부동산 자극 우려도 - 한국경제`,url:`https://hankyung.com/news/1`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미 연준, 연말 추가 '빅컷' 시사... 달러 약세에 환율 1,200원대 진입 임박`,
  metrics:[`미국 기준금리 4.00%`,`원/달러 환율 1,305원`],
  summary:`미국 연방준비제도(Fed) 주요 인사들이 최근의 인플레이션 둔화세를 긍정적으로 평가하며 연말 추가적인 빅컷 가능성을 시사했습니다. 이에 따라 글로벌 달러화가 급격한 약세를 보이며 원/달러 환율은 심리적 지지선인 1,300원을 위협받고 있습니다. 연준의 금리 인하 기대감이 선반영되면서 뉴욕 증시의 기술주들은 일제히 반등세를 기록했습니다. 반면 달러 가치 하락은 수출에 의존하는 신흥국 기업들에게 가격 경쟁력 약화라는 양날의 검으로 작용할 수 있습니다. 외환시장 전문가들은 미국의 추가 금리 인하가 현실화될 경우 글로벌 자금 이동이 가속화될 것으로 분석합니다. 한국 등 주요국들은 환율 변동성 확대에 따른 모니터링을 한층 강화하고 있습니다.`,
  keyTerms:[{term:`빅컷`,explanation:`중앙은행이 일반적인 인상·인하 폭(0.25%p)의 두 배인 0.5%p 이상의 큰 폭으로 금리를 내리는 것을 말합니다. 경제에 강력한 부양 효과를 주기 위해 사용됩니다.`}],
  history:`코로나19 팬데믹 이후 치솟은 물가를 잡기 위해 미 연준은 유례없는 고금리 정책을 유지해왔으나, 고용 지표 둔화와 물가 안정 기조가 뚜렷해지며 금리 인하 카드를 다시 꺼내 들었습니다.`,
  players:`미국 연방준비제도(Fed) 의장과 위원들, 글로벌 투자은행, 그리고 각국의 중앙은행들이 시장의 변화에 민첩하게 반응하고 있습니다.`,
  current:`시장의 예상을 뛰어넘는 과감한 금리 인하 전망이 나오면서, 달러 중심의 글로벌 자산 포트폴리오 재편이 빠르게 진행 중입니다.`,
  outlook:`오는 11월 예정된 연방공개시장위원회(FOMC) 회의에서 실제 인하 폭이 결정되며, 이는 전 세계 금융시장의 단기적인 방향성을 좌우할 핵심 이벤트가 될 것입니다.`,
  sources:[{title:`Fed hints at another big rate cut - Reuters`,url:`https://reuters.com/news/1`},{title:`연준 빅컷 기대감에 환율 요동 - 매일경제`,url:`https://mk.co.kr/news/1`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`EU, 탄소국경조정제도(CBAM) 전면 시행... 국내 철강·자동차 업계 수출 타격 현실화`,
  metrics:[`철강 수출 관세 15% 인상 효과`,`관련 업계 피해 예상액 2조 원`],
  summary:`유럽연합(EU)이 탄소 배출량이 많은 수입품에 대해 비용을 부과하는 탄소국경조정제도 본격 시행을 선언했습니다. 이 제도는 역내 기업들과 동일한 탄소 배출 기준을 역외 수출 기업들에게도 강제하는 조치입니다. 이에 따라 탄소 집약도가 높은 국내 철강 및 자동차 부품 업계는 당장 큰 폭의 비용 상승을 떠안게 되었습니다. 관련 업계는 EU 시장에서의 가격 경쟁력 저하를 우려하며 대책 마련에 부심하고 있습니다. 전문가들은 이를 기점으로 글로벌 무역 장벽이 친환경 기준으로 재편될 것으로 예측하고 있습니다. 정부는 피해 기업에 대한 금융 지원과 탄소 저감 기술 개발 투자를 서두르겠다고 밝혔습니다.`,
  keyTerms:[{term:`탄소국경조정제도`,explanation:`온실가스 배출 규제가 약한 국가에서 생산된 제품을 EU 등 환경 규제가 강한 국가로 수출할 때, 그 탄소 배출량만큼 일종의 관세(비용)를 추가로 물리는 제도입니다.`}],
  history:`EU는 기후 변화 대응을 선도하기 위해 자국 내 산업의 탄소 배출을 규제해왔으며, 자국 산업 보호와 글로벌 탄소 감축을 명분으로 이 제도를 도입했습니다.`,
  players:`EU 집행위원회와 탄소 배출량이 많은 신흥 수출국들(중국, 인도 등), 그리고 수출 의존도가 높은 한국의 주요 제조업체들이 직접적인 영향을 받습니다.`,
  current:`계도 기간을 거쳐 본격적인 비용 부과가 시작됨에 따라, 기업들의 수익성 악화가 현실적인 문제로 닥치며 산업계의 긴장감이 고조되고 있습니다.`,
  outlook:`미국 등 다른 주요 경제권도 유사한 형태의 탄소 무역 장벽을 도입할 가능성이 커, 장기적인 친환경 공정 전환이 기업 생존의 필수 조건이 될 전망입니다.`,
  sources:[{title:`EU CBAM comes into full force - FT`,url:`https://ft.com/news/1`},{title:`탄소 관세 폭탄, 철강업계 비상 - 조선일보`,url:`https://chosun.com/news/1`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`국회, 2027년도 680조 원 규모 슈퍼 예산안 심사 돌입... 여야 '송곳 검증' 예고`,
  metrics:[`2027년도 정부 예산안 680조 원`,`복지 예산 비중 35% 육박`],
  summary:`국회가 역대 최대 규모인 680조 원에 달하는 2027년도 예산안에 대한 본격적인 심사에 돌입했습니다. 정부는 저출산 극복과 첨단 산업 육성을 위해 과감한 재정 투입이 불가피하다고 예산안 편성 배경을 설명했습니다. 그러나 야당은 불필요한 예산을 삭감하고 민생 지원금 등 다른 분야로 예산을 돌려야 한다며 강경한 입장을 보이고 있습니다. 여야는 상임위원회 곳곳에서 각 사업의 타당성을 두고 치열한 공방을 벌였습니다. 특히 R&D 예산과 지역 화폐 지원 예산을 둘러싼 이견이 커 심사 과정에 난항이 예상됩니다. 예산안 법정 처리 기한을 지킬 수 있을지에 대한 우려의 목소리도 커지고 있습니다.`,
  keyTerms:[{term:`예산안`,explanation:`정부가 다음 한 해 동안 국가 운영을 위해 돈을 어디에 얼마나 쓸지 미리 계획하여 국회에 제출하는 문서입니다. 국회의 승인을 받아야 확정됩니다.`}],
  history:`매년 가을 국회 정기국회에서는 다음 연도의 국가 살림살이 규모를 결정하는 예산 심의가 가장 중요한 쟁점으로 다뤄집니다.`,
  players:`예산을 편성하는 기획재정부 등 행정부와, 이를 심사하고 확정하는 입법부의 여당과 야당 의원들이 팽팽한 줄다리기를 합니다.`,
  current:`경기 둔화 속에서 세수 부족 우려까지 겹치면서, 한정된 재원을 두고 정부의 재정 건전성 기조와 야당의 적극적 재정 역할 요구가 정면충돌하고 있습니다.`,
  outlook:`양측의 입장 차이가 커 연말까지 예산안 수정안을 둘러싼 여야 지도부 간의 막판 타결과 샅바 싸움이 지속될 것으로 보입니다.`,
  sources:[{title:`여야, 680조 예산안 전쟁 시작 - 동아일보`,url:`https://donga.com/news/1`},{title:`상임위 곳곳서 예산 충돌 - KBS`,url:`https://kbs.co.kr/news/1`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 의회, 대중국 첨단 반도체 수출 통제 강화 법안 통과... 미중 패권 갈등 최고조`,
  metrics:[`대중국 반도체 장비 수출 통제 80% 확대`,`중국 반발 보복 관세율 25% 인상 예고`],
  summary:`미국 하원이 중국으로의 첨단 반도체 기술 유입을 원천 차단하기 위한 초강경 수출 통제 강화 법안을 압도적 찬성으로 통과시켰습니다. 이 법안은 기존의 제재 대상을 대폭 확대하여 범용 반도체 장비와 관련 소프트웨어까지 통제 범위에 포함시켰습니다. 중국 정부는 즉각적으로 강하게 반발하며 미국산 농산물과 기술 부품에 대한 보복 관세를 경고했습니다. 전문가들은 이번 조치가 미중 양국의 첨단 기술 패권 경쟁을 돌아올 수 없는 강으로 이끌고 있다고 분석합니다. 글로벌 공급망에 참여 중인 한국과 대만의 반도체 기업들 역시 심각한 전략적 불확실성에 직면하게 되었습니다. 국제사회는 양국의 극단적 갈등이 전 세계 경제에 미칠 충격파를 예의주시하고 있습니다.`,
  keyTerms:[{term:`수출 통제`,explanation:`국가 안보나 전략적 이유로 특정 국가에 핵심 기술, 무기, 주요 부품 등을 팔지 못하도록 정부가 법으로 금지하거나 제한하는 조치입니다.`}],
  history:`미국은 자국의 기술 패권을 유지하고 중국의 군사적 굴기를 막기 위해 수년 전부터 첨단 기술, 특히 반도체 분야에 대한 대중국 제재를 단계적으로 강화해왔습니다.`,
  players:`미국 의회 및 상무부, 이에 강력히 반발하는 중국 정부, 그리고 미중 사이에서 눈치를 봐야 하는 글로벌 반도체 장비 및 제조 기업들이 얽혀 있습니다.`,
  current:`미국 내 초당적인 반중 정서와 안보 우려가 결합되면서, 기존 규제의 틈새를 메우는 훨씬 더 촘촘하고 강력한 제재망이 현실화되었습니다.`,
  outlook:`중국의 구체적인 보복 조치 실행 여부와 함께, 동맹국들에게도 유사한 수출 통제 동참을 압박하는 미국의 외교적 행보가 이어질 전망입니다.`,
  sources:[{title:`US House passes strict semiconductor export curbs - WSJ`,url:`https://wsj.com/news/1`},{title:`중국 '결연히 반대'... 무역 보복 시사 - 중앙일보`,url:`https://joongang.co.kr/news/1`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`이스라엘-팔레스타인, UN 중재 속 '가자지구 영구 휴전안' 잠정 합의 돌파구 마련`,
  metrics:[`가자지구 재건 지원금 50억 달러 약속`,`휴전 발효 시점 11월 1일 예정`],
  summary:`국제사회의 끈질긴 중재 끝에 이스라엘과 팔레스타인 무장 정파 간에 가자지구 영구 휴전안이 잠정적으로 합의되었습니다. UN 안보리 주도로 진행된 이번 협상에서 양측은 인질 석방과 이스라엘군의 단계적 철수에 뜻을 같이한 것으로 전해졌습니다. 이는 수년간 이어진 참혹한 분쟁을 종식시키고 중동 지역의 평화를 이끌어낼 중대한 전환점으로 평가받고 있습니다. 합의안에는 국제사회가 참여하는 대규모 가자지구 재건 기금 조성 계획도 포함되었습니다. 하지만 양측 강경파의 반발과 세부 이행 조건을 둘러싼 불신이 여전히 남아 있어 최종 서명까지는 난항이 예상됩니다. 전 세계 주요 정상들은 이번 잠정 합의를 환영하며 양측의 성실한 이행을 촉구했습니다.`,
  keyTerms:[{term:`영구 휴전안`,explanation:`잠시 전쟁을 쉬는 것이 아니라, 양측이 적대 행위를 완전히 끝내고 지속적인 평화를 유지하기로 공식적으로 약속하는 합의를 말합니다.`}],
  history:`수십 년간 이어진 이스라엘과 팔레스타인 간의 영토 및 종교 분쟁은 최근 수년간 전면전 양상으로 치달으며 막대한 민간인 피해를 낳았습니다.`,
  players:`이스라엘 정부와 하마스 측 대표단, 그리고 이들을 중재하는 미국, 이집트, 카타르 및 UN 주요 관계자들이 협상 테이블을 이끌고 있습니다.`,
  current:`국제사회의 거센 휴전 압박과 양측의 내부적인 정치·경제적 피로감이 한계에 달하면서 극적인 타협점이 마련된 상황입니다.`,
  outlook:`세부적인 이행 로드맵 조율과 양측 내부의 강경파 설득 여부가 합의의 최종 성공을 결정짓는 핵심 변수가 될 것입니다.`,
  sources:[{title:`Israel and Hamas reach tentative permanent ceasefire - BBC`,url:`https://bbc.com/news/1`},{title:`중동 평화의 봄 오나... 영구 휴전 잠정 합의 - 한겨레`,url:`https://hani.co.kr/news/1`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`우주항공청, 한국형 달 탐사 로버 '다누리 2호' 성공적 착륙... 세계 4번째 위업`,
  metrics:[`달 남극 탐사 로버 작동 시간 72시간 돌파`,`프로젝트 총 예산 8,500억 원 투입`],
  summary:`대한민국 우주항공청이 주도한 한국형 달 탐사 로버 다누리 2호가 달의 남극 표면에 무사히 착륙하는 데 성공했습니다. 이는 미국, 러시아, 중국에 이어 세계에서 4번째로 달 착륙 로버를 운용하는 국가 반열에 올랐음을 의미합니다. 이번 탐사 로버는 달 표면의 얼음 형태의 물과 희귀 광물 자원을 탐색하는 중대한 임무를 띠고 있습니다. 발사부터 착륙까지 모든 과정이 순조롭게 진행되었으며, 로버가 보내온 고화질 달 표면 사진이 지상 통제소로 수신되었습니다. 전문가들은 독자적인 우주 탐사 기술 확보가 향후 미래 우주 경제 시대를 선도할 핵심 경쟁력이 될 것으로 전망합니다. 국민들은 역사적인 과학 기술 성과에 큰 환호와 자부심을 보내고 있습니다.`,
  keyTerms:[{term:`탐사 로버`,explanation:`우주 공간의 행성이나 위성 표면에 착륙하여 돌아다니면서 과학적인 관측과 흙, 암석 등의 샘플을 수집하는 무인 이동형 로봇입니다.`}],
  history:`한국은 나로호와 누리호 발사 성공을 통해 발사체 자립을 이룬 후, 독자적인 심우주 탐사를 목표로 꾸준히 우주항공 기술 개발에 매진해왔습니다.`,
  players:`프로젝트를 총괄하는 우주항공청(KASA), 기술을 주도한 한국항공우주연구원, 그리고 참여한 다수의 국내 우주항공 민간 기업들이 핵심 주역입니다.`,
  current:`과거 궤도선 운영의 성공 경험을 발판 삼아, 기술적 난이도가 가장 높은 달 표면 연착륙과 로버 이동 기술을 완벽히 입증해 낸 순간입니다.`,
  outlook:`수집된 달 표면 데이터를 바탕으로 향후 미래 유인 달 탐사 계획이나 화성 탐사 등 더 큰 우주 프로젝트로의 도전이 이어질 것으로 기대됩니다.`,
  sources:[{title:`한국 달 착륙 성공, 세계 4번째 위업 달성 - SBS`,url:`https://sbs.co.kr/news/1`},{title:`South Korea successfully lands rover on the Moon - NYT`,url:`https://nyt.com/news/1`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`구글, 차세대 범용 인공지능(AGI) 초기 모델 '제미니 울트라 3.0' 공개... 지식 노동 혁명 예고`,
  metrics:[`파라미터 수 2조 개 추정`,`다양한 전문가 테스트에서 만점의 95% 달성`],
  summary:`글로벌 빅테크 기업 구글이 마침내 인간의 지적 능력에 버금가는 차세대 범용 인공지능 초기 모델인 제미니 울트라 3.0을 전격 공개했습니다. 이 모델은 단순한 패턴 인식을 넘어 복잡한 논리적 추론과 과학적 문제 해결 능력을 보여주며 기술계에 큰 충격을 주었습니다. 발표된 시연 영상에서는 AI가 스스로 코딩의 오류를 수정하고 의학적 진단을 내리는 등 고도의 전문 지식이 필요한 작업들을 완벽히 수행했습니다. 일각에서는 이 같은 혁신이 지식 노동자들의 대규모 일자리 상실로 이어질 수 있다는 강한 우려를 제기하고 있습니다. 하지만 구글 측은 이 기술이 인류의 가장 큰 난제들을 해결할 강력한 도구가 될 것이라고 강조했습니다. 전 세계 각국 정부는 AGI 시대를 대비한 새로운 윤리적, 법적 규제 마련을 서두르고 있습니다.`,
  keyTerms:[{term:`범용 인공지능`,explanation:`특정 분야가 아니라, 인간처럼 스스로 생각하고 학습하며 거의 모든 지적 작업을 사람과 같거나 그 이상으로 해낼 수 있는 궁극의 AI를 뜻합니다.`}],
  history:`오픈AI의 챗GPT 등장 이후 글로벌 빅테크 기업들은 인간의 지능을 뛰어넘는 AGI(범용 인공지능)를 먼저 달성하기 위해 천문학적인 자본을 투입하며 경쟁해왔습니다.`,
  players:`구글, 오픈AI, 마이크로소프트 등 선두 기술 기업들과, 기술 발전의 속도를 통제하고 윤리적 규제를 마련하려는 각국 규제 당국이 맞물려 있습니다.`,
  current:`단순 보조 도구를 넘어 인간의 논리적 사고를 흉내 내는 수준으로 진화하면서, AI의 발전 속도가 사회가 수용할 수 있는 한계를 넘어서고 있다는 평가가 나옵니다.`,
  outlook:`AGI의 능력이 검증됨에 따라 산업 전반에 걸친 막대한 파급효과와 함께, 지적 재산권 및 AI 윤리에 관한 글로벌 합의를 도출하기 위한 국제사회의 움직임이 빨라질 것입니다.`,
  sources:[{title:`Google unveils its first step towards AGI - The Economist`,url:`https://economist.com/news/1`},{title:`구글 제미니 3.0 충격... 인간 지능 넘어서나 - MBC`,url:`https://mbc.co.kr/news/1`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`국제핵융합실험로(ITER), 플라즈마 연소 1시간 유지 성공... '꿈의 에너지' 상용화 초읽기`,
  metrics:[`플라즈마 유지 시간 3,600초 (1시간)`,`내부 목표 온도 1억 도 달성`],
  summary:`프랑스에 위치한 국제핵융합실험로가 마침내 인공태양 기술의 핵심인 1억 도의 초고온 플라즈마를 1시간 동안 안정적으로 유지하는 데 성공했습니다. 핵융합 발전은 온실가스나 치명적인 방사성 폐기물이 발생하지 않아 인류의 기후 위기를 해결할 궁극의 친환경 에너지원으로 불립니다. 과학계는 이번 성과를 통해 핵융합 에너지를 실제 전력망에 연결할 수 있는 기술적 임계점을 넘었다고 평가하며 몹시 흥분하고 있습니다. 초기 투자 비용이 막대하지만, 상용화가 이루어지면 사실상 무한한 청정 에너지를 공급받을 수 있게 됩니다. 주요 선진국들은 2030년대 후반 상용 발전소 건설을 목표로 앞다투어 후속 연구 예산을 대폭 증액하고 있습니다. 이는 전 세계 에너지 산업 지형을 근본적으로 뒤바꿀 역사적 이정표가 될 전망입니다.`,
  keyTerms:[{term:`핵융합실험로`,explanation:`태양 중심에서 엄청난 에너지가 만들어지는 원리를 지구상에서 똑같이 구현하기 위해, 1억 도 이상의 초고온 가스 상태를 만들어 에너지를 생산하는 거대한 실험 장치입니다.`}],
  history:`수십 년간 이론적으로만 가능했던 핵융합 에너지를 실현하기 위해 한국, 미국, 유럽연합 등 35개국이 힘을 합쳐 공동으로 대형 실험 시설을 건설하며 연구해왔습니다.`,
  players:`ITER 프로젝트에 참여한 다국적 과학자들과 자금을 지원하는 각국 정부, 그리고 미래 에너지 시장을 선점하려는 거대 에너지 기업들이 주요 플레이어입니다.`,
  current:`불안정한 초고온 플라즈마를 장시간 가두어 두는 것이 가장 큰 난관이었으나, 최신 초전도 자석 기술과 AI 제어 시스템의 발전으로 한계를 돌파했습니다.`,
  outlook:`이번 실험 성공을 바탕으로 생산된 전력을 실제로 활용하는 실증로(DEMO) 건설 논의가 탄력을 받으며, 인류의 화석연료 의존을 끝낼 상용화 시기가 앞당겨질 것입니다.`,
  sources:[{title:`ITER breaks fusion record, maintaining plasma for an hour - AP`,url:`https://apnews.com/news/1`},{title:`꿈의 인공태양 1시간 켜졌다... 한국 기술력 쾌거 - 연합뉴스`,url:`https://yna.co.kr/news/2`}]
}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국은행 기준금리 동결 전망이 우세한 가운데, 수도권 외곽과 규제지역을 중심으로 집값 양극화 현상이 뚜렷해지고 있습니다.`,
  metrics:[`수도권 집값 양극화 심화`,`가계 소득 격차 집중 현상 지속`],
  summary:`다가오는 금융통화위원회에서 한국은행이 기준금리를 동결할 것이라는 시장의 관측이 지배적입니다. 이는 불안정한 환율 방어와 급격하게 불어난 가계부채 문제를 의식한 이른바 숨고르기 차원의 결정으로 풀이됩니다. 한편, 토지거래허가구역 규제와 반도체 클러스터 등 대형 호재가 맞물리면서 수도권 외곽 일부 지역의 집값 매수세가 들썩이는 등 부동산 시장의 양극화가 심화되고 있습니다. IMF는 한국의 전반적인 재정 정책은 긍정적으로 평가했으나, 국민소득 증가분의 대다수가 기업에 집중되며 가계 소득과의 격차가 벌어지는 현상을 지적했습니다. 김장철을 앞두고 일부 식재료 물가까지 혼조세를 보이면서 서민 경제의 부담은 여전히 지속되고 있습니다.`,
  keyTerms:[{term:`양극화`,explanation:`자산이나 소득이 중간 계층 없이 상위권과 하위권의 양극단으로 쏠리며 격차가 크게 벌어지는 사회경제적 현상입니다.`}],
  history:`장기간 이어진 고금리와 경기 침체 우려 속에서 서민 대출 이자 부담이 커졌고, 부동산 시장은 지역별 개발 호재에 따라 편차가 크게 나타나기 시작했습니다.`,
  players:`금리를 결정하는 한국은행과 가계부채를 관리하는 금융 당국, 그리고 내 집 마련에 나선 실수요자와 투자자들이 얽혀 있습니다.`,
  current:`섣불리 금리를 내리면 가계부채가 폭증할 수 있고, 올리면 서민 경제가 타격을 입는 딜레마 속에서 정책 당국이 신중한 태도를 취하고 있습니다.`,
  outlook:`한국은행의 금리 결정 결과와 이후 발표될 통화정책 방향성에 따라 하반기 국내 부동산 시장과 내수 경기의 향방이 좌우될 전망입니다.`,
  sources:[{title:`한국은행, 기준금리 동결 무게 - 연합뉴스`,url:`https://www.yna.co.kr`},{title:`수도권 부동산 양극화 심화 - 한국경제`,url:`https://www.hankyung.com`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국의 인플레이션 지표가 예상치를 상회하며 10년물 국채 금리가 급등, 연준의 추가 긴축 우려가 커지고 있습니다.`,
  metrics:[`미국 소비자물가지수(CPI) 3.7%`,`미 10년물 국채 금리 5.3% 돌파`],
  summary:`최근 발표된 미국의 소비자물가지수(CPI)가 3.7%를 기록하며 시장의 예상치를 상회했습니다. 인플레이션 압력이 여전하다는 사실이 확인되면서 연방준비제도의 추가 금리 인상에 대한 베팅이 다시 고개를 들고 있습니다. 이에 따라 채권 시장이 크게 흔들리며 미국 10년물 국채 금리가 일시적으로 5.3%를 돌파하는 등 변동성이 극대화되었습니다. 10월 연방공개시장위원회 회의를 앞두고 금리 경로의 불확실성이 글로벌 증시에도 부담으로 작용하고 있습니다. 주요 인사들은 인플레이션 고착화를 우려하면서도 단기적인 정책 결정에는 신중한 입장을 보이고 있습니다. 고금리 환경이 장기화될 경우 기업들의 이자 부담과 신흥국 경제에 미칠 여파가 우려됩니다.`,
  keyTerms:[{term:`소비자물가지수(CPI)`,explanation:`소비자가 구매하는 재화와 서비스의 가격 변동을 측정하는 지표입니다. 연준이 금리를 결정할 때 인플레이션 수준을 가늠하는 핵심 기준으로 삼습니다.`}],
  history:`코로나19 이후 풀린 막대한 유동성과 공급망 차질로 전 세계적인 인플레이션이 촉발되었습니다.`,
  players:`금리 결정권을 쥔 미국 연방준비제도와 물가 상승에 민감하게 반응하는 글로벌 투자자들이 핵심 주체입니다.`,
  current:`물가가 쉽게 꺾이지 않으면서 시장이 기대했던 조기 금리 인하 기대감이 무너지고 고금리 장기화 공포가 확산되고 있습니다.`,
  outlook:`다가오는 연방공개시장위원회 정례회의에서의 파월 의장 발언과 향후 발표될 고용 및 물가 지표에 따라 시장 변동성이 지속될 전망입니다.`,
  sources:[{title:`US CPI rises more than expected - Reuters`,url:`https://www.reuters.com`},{title:`Treasury yields spike to 5.3% - Bloomberg`,url:`https://www.bloomberg.com`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`대규모 AI 데이터센터 증설에 나선 주요 기술 기업들의 부채 조달 비용 리스크가 부각되며 AI 투자 회의론이 대두되고 있습니다.`,
  metrics:[`코어위브 주가 15% 급락`,`글로벌 AI 인프라 투자 금리 압박`],
  summary:`대규모 인공지능 데이터센터를 증설 중인 기업들이 고금리 환경 속에서 막대한 부채 조달 비용 문제에 직면했습니다. 이로 인해 대표적인 AI 클라우드 기업인 코어위브의 주가가 15% 급락하는 등 시장 전반에 충격을 주었습니다. 천문학적인 자본이 투입되는 AI 인프라 투자 대비 실제 수익화가 더디다는 이른바 AI 투자 회의론이 확산되고 있습니다. 글로벌 금리 상승이 기업들의 자금줄을 옥죄면서 빅테크 주도의 랠리가 흔들리고 있습니다. 시장은 메타 등 주요 빅테크 기업들의 3분기 실적 발표를 통해 실질적인 성과를 검증하려 하고 있습니다. 만약 수익성이 입증되지 않는다면 아시아 반도체 관련 지수까지 동반 하락하는 연쇄 파급 효과가 우려됩니다.`,
  keyTerms:[{term:`AI 투자 회의론`,explanation:`막대한 자금이 투입되는 인공지능 분야가 기대만큼 단기간에 수익을 창출하지 못할 것이라는 시장의 우려를 뜻합니다.`}],
  history:`챗GPT 열풍 이후 글로벌 빅테크 기업들은 생성형 AI 시장 선점을 위해 데이터센터와 반도체 확보에 천문학적인 투자를 단행해왔습니다.`,
  players:`대형 인프라 투자를 주도하는 코어위브, 오라클, 메타 등 글로벌 IT 기업과 자금을 공급하는 금융 시장 참여자들입니다.`,
  current:`고금리 기조가 겹치면서 대출 이자 부담이 커졌고, 아직 뚜렷한 수익 모델이 나오지 않아 거품 붕괴 우려가 커진 상황입니다.`,
  outlook:`다가오는 빅테크 기업들의 3분기 실적 발표에서 실제 AI 관련 매출 성장이 입증되는지가 향후 기술주 방향성을 결정할 것입니다.`,
  sources:[{title:`Tech stocks hit by debt cost fears - WSJ`,url:`https://www.wsj.com`},{title:`CoreWeave shares drop 15% on infrastructure concerns - FT`,url:`https://www.ft.com`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`국회 국정감사가 후반전에 돌입한 가운데, 대법원장 탄핵 추진 등 사법부 견제를 둘러싸고 여야 간의 극한 대치가 이어지고 있습니다.`,
  metrics:[`여야 국감 대립 격화`,`사법부 탄핵안 갈등 지속`],
  summary:`제22대 국회 국정감사가 후반전에 접어들면서 정치권의 공방이 최고조에 달하고 있습니다. 특히 더불어민주당이 조희대 대법원장에 대한 탄핵 추진 카드를 만지작거리며 사법개혁을 압박하자, 여당인 국민의힘이 이를 강하게 성토하며 대립각을 세우고 있습니다. 야당은 사법부 내 주요 판결과 인사 권한 문제를 근거로 자진 사퇴와 탄핵을 동시에 거론하고 있습니다. 반면 여당은 이를 정쟁을 넘어 사법부의 독립성을 흔드는 탄핵 국감이라며 당 지도부 차원의 명확한 입장 표명을 요구하고 나섰습니다. 민생 현안보다는 정치적 주도권 다툼에 매몰된 국정감사에 대해 비판의 목소리도 커지는 중입니다. 향후 주요 상임위에서도 충돌이 불가피해 보입니다.`,
  keyTerms:[{term:`탄핵 국감`,explanation:`국정감사 본연의 행정부 감시 기능을 넘어, 특정 고위 공직자의 파면을 목적으로 삼아 정치적 공세를 집중하는 국감 형태를 비판적으로 일컫는 말입니다.`}],
  history:`과거 주요 정치인과 관련된 사법부의 판결이 양당의 정치적 이해관계와 충돌하면서 사법부에 대한 정치권의 불신과 견제 시도가 누적되어 왔습니다.`,
  players:`정국 주도권을 쥐려는 야당 지도부와 사법부 독립 훼손을 막고 방어하려는 여당 지도부가 핵심입니다.`,
  current:`국정감사라는 합법적 감시 무대를 빌려 사법부 최고위직의 거취를 흔들며 양 진영 지지층을 결집하려는 샅바싸움이 치열합니다.`,
  outlook:`탄핵안의 실제 발의 여부와 여론의 향배에 따라 연말 정국의 냉각 정도가 결정되며, 예산안 심사 등 다른 국회 일정에도 큰 영향을 미칠 것입니다.`,
  sources:[{title:`국감 후반전 돌입, 대법원장 탄핵 여야 대치 - 조선일보`,url:`https://www.chosun.com`},{title:`사법부 정조준한 야당, 여당은 탄핵 방어 - 매일경제`,url:`https://www.mk.co.kr`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국과 중국이 첨단 기술 패권을 둘러싸고 드론, AI, 로봇 공학 분야에서 관세 압박과 전략적 동맹 강화를 통해 정면 충돌하고 있습니다.`,
  metrics:[`미국 대중국 제재 법안 추진`,`중국 중앙아시아 외교망 확대`],
  summary:`미국과 중국 간의 무역 갈등이 단순한 관세 전쟁을 넘어 인공지능, 드론, 로봇 공학 등 미래 전략 기술 패권 다툼으로 격화되고 있습니다. 미국 의회는 초당적인 대중국 견제 패키지 법안을 추진하며 자국 내 핵심 기술 유출 방지와 제재 수위를 높이고 있습니다. 이에 맞서 중국은 왕이 외교부장 등을 앞세워 중앙아시아 및 발칸반도 국가들과의 협력을 강화하며 미국의 외교적 포위망에 맞불을 놓고 있습니다. 이러한 강대국의 전략적 디커플링 현상은 글로벌 공급망 재편을 강제하며 세계 경제에 짙은 먹구름을 드리우고 있습니다. 특히 첨단 부품 의존도가 높은 한국 등 주변 수출국들은 양국 간의 고조되는 긴장 속에서 외교적, 경제적 딜레마에 빠졌습니다.`,
  keyTerms:[{term:`디커플링`,explanation:`국가 간의 긴밀했던 경제적, 기술적 연결고리가 끊어지고 상호 의존성을 줄여나가며 독자적인 생태계를 구축하려는 현상을 의미합니다.`}],
  history:`과거 본격화된 미중 무역 분쟁은 현 행정부를 거치며 반도체, AI 등 첨단 기술 분야의 국가 안보 문제로 확대되었습니다.`,
  players:`세계 기술 패권을 수성하려는 미국 정부 및 의회와, 이에 맞서 글로벌 기술 주도권을 장악하려는 중국 정부입니다.`,
  current:`기술 제재와 보복 관세가 교차하는 가운데, 양국 모두 자신들만의 우방국 네트워크를 구축하기 위해 외교 총력전을 펼치고 있습니다.`,
  outlook:`미국의 차기 대선 결과 및 새로운 무역 규제안 발효에 따라 미중 양국 간 기술 장벽은 더욱 굳어질 전망입니다.`,
  sources:[{title:`US Congress pushes new tech curbs on China - Reuters`,url:`https://www.reuters.com`},{title:`China expands diplomatic push in Central Asia - AP News`,url:`https://apnews.com`}]

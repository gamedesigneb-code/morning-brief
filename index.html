  tag:`2026-10-05`,
  label:`2026년 10월 5일 (월)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국은행, 가계부채 우려 속 10월 기준금리 인하 신중론 대두`,
  metrics:[`가계대출 증가액 6조원`,`소비자물가 상승률 2.1%`],
  summary:`한국은행 금융통화위원회를 앞두고 기준금리 인하에 대한 신중론이 확산되고 있습니다. 최근 수도권을 중심으로 주택 가격이 상승하면서 가계부채가 다시 급증하는 추세이기 때문입니다. 시장에서는 당초 10월 금리 인하를 기정사실로 받아들였으나, 금융당국의 가계대출 억제 정책이 효과를 내기 전까지는 동결할 가능성이 커졌습니다. 특히 9월 은행권 가계대출 증가액이 6조원에 달하면서 금융 불균형 우려가 심화되었습니다. 물가 상승률은 2%대 초반으로 안정되었지만, 부동산 시장 자극을 우려한 한국은행의 딜레마가 깊어지고 있습니다. 앞으로 발표될 경제 지표와 정부의 거시건전성 정책 효과가 금리 결정의 핵심 변수가 될 전망입니다.`,
  keyTerms:[{term:`거시건전성 정책`,explanation:`금융 시스템 전체의 안정을 유지하고 경제 전반의 위기를 예방하기 위해 정부나 중앙은행이 시행하는 정책입니다.`}],
  history:`2024년 말부터 시작된 글로벌 금리 인하 기조 속에서도 한국은행은 가계부채 문제로 인해 금리 인하를 미뤄왔습니다. 2026년 하반기 들어 물가가 안정세를 보이면서 인하 기대감이 높아졌습니다.`,
  players:`한국은행 이창용 총재 및 금융통화위원들은 물가 안정과 금융 안정 사이에서 균형을 잡아야 하는 상황이며, 금융위원회는 대출 규제 강화를 주문하고 있습니다.`,
  current:`최근 서울 강남 3구를 비롯한 수도권 부동산 가격이 다시 들썩이면서 주택담보대출을 중심으로 한 가계부채 증가세가 금리 인하의 최대 걸림돌로 부상했습니다.`,
  outlook:`10월 금통위에서 기준금리가 동결될 경우 시장 금리의 변동성이 커질 수 있으며, 연말까지 가계부채 증가세가 꺾이는지 여부가 향후 금리 경로를 좌우할 것입니다.`,
  sources:[{title:`한은 금통위, 10월 기준금리 동결 무게 - 연합뉴스`,url:`https://www.yna.co.kr/view/AKR202610040001`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 9월 고용지표 예상치 상회, 연준 '빅컷' 기대감 축소`,
  metrics:[`9월 비농업 신규 고용 18만명`,`실업률 4.1%`],
  summary:`미국의 9월 고용보고서가 시장의 예상을 크게 웃돌면서 연방준비제도의 급격한 금리 인하, 이른바 '빅컷'에 대한 기대감이 한풀 꺾였습니다. 미 노동부 발표에 따르면 9월 비농업 부문 신규 고용은 18만명을 기록하여 전문가 예상치를 상회했으며, 실업률은 4.1%로 소폭 하락했습니다. 이는 미국 경제가 여전히 견조한 성장세를 유지하고 있음을 시사합니다. 이에 따라 11월 연방공개시장위원회(FOMC)에서 0.5%포인트 대신 0.25%포인트의 점진적 금리 인하가 단행될 것이라는 관측이 힘을 얻고 있습니다. 탄탄한 고용 시장 덕분에 경기 침체 우려는 완화되었으나, 달러화 강세와 국채 금리 상승 등 금융 시장의 변동성은 커지고 있습니다.`,
  keyTerms:[{term:`비농업 부문 신규 고용`,explanation:`농축산업을 제외한 산업에서 새롭게 창출된 일자리 수를 의미하며, 미국 경제의 건전성을 평가하는 핵심 지표입니다.`}],
  history:`미 연준은 인플레이션 둔화와 고용 둔화 조짐에 대응하여 최근 몇 달간 금리를 인하해 왔으며, 시장은 경기 침체를 막기 위한 큰 폭의 추가 인하를 기대해 왔습니다.`,
  players:`제롬 파월 연준 의장을 비롯한 연준 위원들은 데이터를 기반으로 한 신중한 통화 정책을 강조하고 있으며, 월스트리트 투자자들은 고용 지표에 촉각을 곤두세우고 있습니다.`,
  current:`예상을 뛰어넘는 강력한 고용 데이터는 연준이 서둘러 금리를 내릴 필요성을 감소시켰고, 이는 미국 경제의 '연착륙' 가능성을 높이는 신호로 해석됩니다.`,
  outlook:`향후 발표될 소비자물가지수(CPI) 등 물가 지표가 연준의 최종 결정에 영향을 미칠 것이며, 11월 FOMC 전까지 금융 시장은 각종 경제 지표에 민감하게 반응할 것입니다.`,
  sources:[{title:`미 9월 고용 '깜짝 호조'…연준 빅컷 물 건너가나 - 한국경제`,url:`https://www.hankyung.com/article/202610040002`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`사우디 석유 시설 피격 위협에 국제유가 배럴당 85달러 돌파`,
  metrics:[`브렌트유 86.5달러`,`WTI 82.3달러`],
  summary:`중동 지역의 지정학적 긴장이 최고조에 달하면서 국제유가가 급등해 배럴당 85달러를 돌파했습니다. 이스라엘과 이란 간의 무력 충돌 우려가 커지는 가운데, 이란의 지원을 받는 무장 세력이 사우디아라비아의 주요 석유 생산 시설을 공격할 수 있다는 첩보가 전해졌습니다. 이에 따라 글로벌 원유 공급망에 심각한 차질이 빚어질 수 있다는 공포가 확산되며 투기적 매수세가 유입되었습니다. 브렌트유는 하루 만에 4% 이상 급등하며 인플레이션 재점화에 대한 우려를 낳고 있습니다. 에너지 전문가들은 중동 사태가 전면전으로 번질 경우 국제유가가 100달러를 넘을 수도 있다고 경고하고 있어, 세계 경제의 회복세에 큰 부담이 될 전망입니다.`,
  keyTerms:[{term:`투기적 매수세`,explanation:`상품의 실제 수요보다는 향후 가격 상승을 예상하여 단기적인 시세 차익을 노리고 대량으로 사들이는 움직임입니다.`}],
  history:`2023년 말부터 악화된 이스라엘-하마스 전쟁 여파로 중동의 지정학적 리스크는 상존해왔으나, 최근 이스라엘과 이란의 직접적인 대립으로 확전 양상을 띠고 있습니다.`,
  players:`사우디아라비아는 최대 원유 수출국으로서 방어 태세를 강화하고 있으며, 미국과 유럽 국가들은 확전을 막기 위해 외교적 노력을 기울이고 있습니다.`,
  current:`석유 인프라 타격 가능성은 원유 시장에서 가장 민감한 위험 요소이며, 주요 산유국인 이란의 호르무즈 해협 봉쇄 위협까지 겹쳐 불안감이 극대화되고 있습니다.`,
  outlook:`무력 충돌의 양상과 외교적 중재 결과에 따라 유가 변동성이 극심할 것으로 예상되며, 고유가 장기화 시 글로벌 중앙은행들의 통화 정책에도 영향을 미칠 수 있습니다.`,
  sources:[{title:`중동 전운 최고조에 국제유가 폭등…'오일쇼크' 우려 - 매일경제`,url:`https://www.mk.co.kr/news/world/202610050003`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`제22대 국회 마지막 국정감사 개막, 김건희 여사 특검법 등 쟁점 격돌`,
  metrics:[`국감 대상 기관 802곳`,`증인 및 참고인 450여명`],
  summary:`제22대 국회의 사실상 마지막 국정감사가 5일 막을 올리며 여야 간의 치열한 공방이 시작되었습니다. 이번 국정감사에서는 대통령실 의혹과 김건희 여사 특검법, 금융투자소득세 폐지 등 굵직한 현안들이 도마 위에 올랐습니다. 더불어민주당을 비롯한 야당은 '정권 심판론'을 내세우며 전방위적인 공세를 예고했고, 국민의힘은 이를 '이재명 대표 방탄용 정치 공세'로 규정하며 민생 국감을 강조하고 있습니다. 특히 법제사법위원회와 정무위원회 등 주요 상임위에서는 증인 채택 과정부터 고성이 오가며 파행을 겪기도 했습니다. 내년 대선 정국을 앞두고 기선을 제압하기 위한 여야의 물러설 수 없는 대결이 한 달 내내 이어질 전망입니다.`,
  keyTerms:[{term:`금융투자소득세`,explanation:`주식, 채권, 펀드 등 금융투자로 발생한 일정 금액 이상의 소득에 대해 부과하는 세금 제도를 뜻합니다.`}],
  history:`제22대 국회는 출범 직후부터 각종 특검법과 입법 거부권 행사 문제로 여야 대치가 극심했으며, 이번 국감은 그동안 쌓인 정치적 갈등이 폭발하는 무대가 되고 있습니다.`,
  players:`거대 야당인 더불어민주당의 이재명 대표와 여당인 국민의힘 한동훈 대표 체제 하에서, 양측은 지지층 결집과 중도층 포섭을 목표로 화력을 집중하고 있습니다.`,
  current:`각종 여론조사에서 양당 지지율이 팽팽하게 맞서는 가운데, 국정감사에서 어떤 의혹이 새롭게 제기되고 방어에 성공하느냐가 향후 정국의 분수령이 될 것입니다.`,
  outlook:`국감 기간 내내 상임위 곳곳에서 충돌과 파행이 빈번할 것으로 예상되며, 특검법 재표결 시기와 맞물려 정국 경색은 더욱 심화될 가능성이 높습니다.`,
  sources:[{title:`22대 국회 마지막 국감 시작…초반부터 '특검' 정면충돌 - KBS`,url:`https://news.kbs.co.kr/news/view.do?ncd=202610040004`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 대선 D-30, 펜실베이니아 등 핵심 경합주 지지율 '초접전'`,
  metrics:[`경합주 지지율 격차 1%p 내외`,`사전투표 유권자 1,500만명`],
  summary:`2026년 미국 대통령 선거가 딱 한 달 앞으로 다가온 가운데, 민주당과 공화당 후보 간의 지지율이 핵심 경합주에서 초접전 양상을 보이고 있습니다. 최근 여론조사에 따르면 승패를 가를 펜실베이니아, 미시간, 위스콘신 등 7대 경합주에서 양 후보의 지지율 격차가 1%포인트 내외로 오차범위 안에서 엎치락뒤치락하고 있습니다. 민주당 후보는 낙태권 보장과 민주주의 수호를, 공화당 후보는 불법 이민 차단과 인플레이션 심판을 핵심 메시지로 내세우며 부동층 표심 잡기에 사활을 걸고 있습니다. 이미 일부 주에서 시작된 사전투표 열기가 뜨거운 가운데, 선거 막판 돌발 변수인 '옥토버 서프라이즈'가 표심을 흔들 결정적 요인이 될지 전 세계가 주목하고 있습니다.`,
  keyTerms:[{term:`옥토버 서프라이즈`,explanation:`미국 대통령 선거가 있는 해의 10월에 선거판에 큰 영향을 미칠 수 있는 돌발적인 정치적 사건이나 폭로가 발생하는 현상입니다.`}],
  history:`미국 대선은 전통적으로 특정 정당 지지세가 뚜렷하지 않은 소수의 경합주(Swing State) 결과에 따라 전체 승패가 결정되는 독특한 선거인단 제도를 가지고 있습니다.`,
  players:`민주당과 공화당의 대선 후보 및 러닝메이트들은 막대한 선거 자금을 경합주 광고와 현장 유세에 쏟아부으며 총력전을 펼치고 있습니다.`,
  current:`미국 내 심화된 정치적 양극화로 인해 유권자들의 표심이 굳어진 상황에서, 선거 결과를 좌우할 수 있는 무당층과 젊은 유권자들의 투표율이 최대 변수로 떠올랐습니다.`,
  outlook:`11월 선거일 직전까지 양측의 네거티브 공방이 극에 달할 것이며, 개표 과정에서도 경합주의 초박빙 승부로 인해 당선자 확정이 지연될 가능성이 있습니다.`,
  sources:[{title:`미 대선 한달 앞…'러스트벨트' 경합주 여전히 안갯속 - 조선일보`,url:`https://www.chosun.com/politics/world/2026/10/05/0005/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`이스라엘, 이란 수도 테헤란 인근 군사 기지 정밀 타격`,
  metrics:[`이스라엘 전투기 20여대 동원`,`이란 방공망 파괴 3곳`],
  summary:`이스라엘 공군이 이란 수도 테헤란 인근의 주요 군사 기지 및 미사일 보관 시설을 정밀 타격하면서 중동 전역에 전운이 감돌고 있습니다. 이스라엘 국방부는 이번 공격이 며칠 전 이란의 탄도미사일 발사에 대한 정당한 보복 조치라고 공식 발표했습니다. 이스라엘 전투기 20여 대가 동원된 이번 작전으로 이란의 최신 방공망 시스템 일부가 파괴된 것으로 알려졌습니다. 이란 정부는 즉각 강력한 재보복을 천명하며 주변 호르무즈 해협의 군사적 긴장을 끌어올리고 있습니다. 미국 정부는 이스라엘의 방어권을 지지하면서도 사태가 전면전으로 비화하는 것을 막기 위해 긴급 특사를 중동에 파견하며 외교적 진화에 총력을 기울이고 있습니다.`,
  keyTerms:[{term:`정당한 보복 조치`,explanation:`상대방의 선제 공격이나 불법적인 무력 사용에 대응하여 스스로를 방어하고 피해를 되갚아주는 군사적 행동을 뜻합니다.`}],
  history:`이란은 팔레스타인 무장정파 하마스와 레바논 헤즈볼라 등을 지원하며 이스라엘과 오랫동안 '그림자 전쟁'을 벌여왔으나, 최근 직접적인 무력 충돌로 갈등이 폭발했습니다.`,
  players:`이스라엘의 베냐민 네타냐후 총리는 강경 대응을 고수하고 있으며, 이란의 이슬람 혁명수비대 역시 물러서지 않겠다는 입장이어서 미국의 개입이 중요한 상황입니다.`,
  current:`중동의 양대 강국이 영토를 직접 타격하는 전례 없는 상황이 전개되면서, 역내 국가들뿐만 아니라 글로벌 에너지 시장까지 혼란에 빠질 위험이 커졌습니다.`,
  outlook:`이란의 재보복 수위와 방식에 따라 제5차 중동전쟁으로 확대될 우려가 있으며, 국제사회의 만류에도 불구하고 양측의 군사적 대결은 당분간 지속될 전망입니다.`,
  sources:[{title:`이스라엘, 이란 본토 전격 타격…'중동 전면전' 위기 고조 - 중앙일보`,url:`https://www.joongang.co.kr/article/202610050006`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`한국형 발사체 '누리호' 개량형, 탑재체 중량 늘려 4차 발사 D-10`,
  metrics:[`목표 궤도 고도 700km`,`탑재체 중량 1.5톤→1.8톤`],
  summary:`순수 국내 기술로 개발된 우주발사체 누리호(KSLV-II)의 개량형 모델이 오는 10월 15일 4차 발사를 앞두고 막바지 점검에 돌입했습니다. 과학기술정보통신부와 한국항공우주연구원은 전남 고흥 나로우주센터에서 누리호의 단 조립과 위성 탑재 작업을 성공적으로 완료했다고 밝혔습니다. 이번 4차 발사에 사용되는 개량형 누리호는 기존 모델보다 엔진 성능을 개선하여 탑재체 중량을 1.8톤까지 늘린 것이 특징입니다. 발사체에는 차세대 중형위성 3호와 다수의 큐브위성이 탑재되어, 우주 과학 연구와 지구 관측 임무를 수행할 예정입니다. 민간 기업이 체계종합기업으로 참여하여 발사 운용의 주축을 맡으면서, 한국의 '뉴 스페이스' 시대가 본격적으로 열렸다는 평가를 받고 있습니다.`,
  keyTerms:[{term:`뉴 스페이스`,explanation:`정부 주도의 우주 개발에서 벗어나 민간 기업이 혁신적인 기술과 자본을 바탕으로 우주 산업을 주도하는 새로운 흐름을 뜻합니다.`}],
  history:`2023년 누리호 3차 발사의 성공적인 궤도 안착 이후, 한국은 발사체의 신뢰성 확보와 성능 개량을 위해 반복 발사 프로그램(한국형 발사체 고도화 사업)을 추진해왔습니다.`,
  players:`한국항공우주연구원(KARI)이 기술 이전을 담당하고, 한화에어로스페이스 등 국내 민간 우주 기업들이 제작과 발사 운용 전반을 주도하고 있습니다.`,
  current:`성공적인 상용 위성 발사 실적을 쌓는 것은 향후 글로벌 우주 발사 서비스 시장에 진출하기 위한 필수적인 관문으로 여겨집니다.`,
  outlook:`발사 당일 기상 조건이 최대 변수이며, 4차 발사 성공 시 향후 달 탐사선 발사 등 더 큰 규모의 국가 우주 개발 프로젝트에 탄력이 붙을 전망입니다.`,
  sources:[{title:`더 강력해진 누리호 4차 발사 카운트다운…'뉴 스페이스' 본격화 - SBS`,url:`https://news.sbs.co.kr/news/endPage.do?news_id=202610050007`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`오픈AI, 인공일반지능(AGI)에 다가선 'GPT-5' 전격 상용화 출시`,
  metrics:[`추론 능력 기존 대비 40% 향상`,`동시 처리 언어 100개국어`],
  summary:`오픈AI가 인간에 필적하는 지능인 인공일반지능(AGI)에 한 걸음 더 다가선 차세대 AI 모델 'GPT-5'를 전격 상용화하여 출시했습니다. 이번에 공개된 GPT-5는 기존 모델을 뛰어넘는 고도화된 추론 능력과 복잡한 문제 해결 능력을 갖춘 것이 핵심입니다. 특히 코딩, 수학적 증명, 법률 문서 분석 등 전문적인 분야에서 추론 능력이 기존 모델 대비 40% 이상 향상된 것으로 평가받고 있습니다. 또한, 텍스트뿐만 아니라 영상과 음성을 실시간으로 동시에 처리하는 완벽한 멀티모달 기능을 구현하여 사용자 경험을 혁신적으로 바꿀 것으로 기대됩니다. 주요 빅테크 기업들과의 AI 기술 패권 경쟁이 격화되는 가운데, GPT-5의 등장은 산업 전반에 걸친 AI 도입을 더욱 가속화할 전망입니다.`,
  keyTerms:[{term:`인공일반지능(AGI)`,explanation:`특정 분야에 국한되지 않고 모든 상황에서 인간과 유사하거나 그 이상의 학습 및 추론 능력을 발휘할 수 있는 궁극적인 형태의 인공지능입니다.`}],
  history:`오픈AI는 GPT-3.5와 GPT-4를 연속 히트시키며 생성형 AI 붐을 주도해왔고, 전 세계 기술 업계는 그들의 다음 혁신인 GPT-5의 출시 시기를 오랫동안 기다려왔습니다.`,
  players:`샘 올트먼 오픈AI CEO를 필두로, 구글, 메타, 앤스로픽 등 실리콘밸리의 빅테크 기업들이 AI 모델의 성능 우위를 차지하기 위해 치열한 각축전을 벌이고 있습니다.`,
  current:`AI 모델의 규모가 커짐에 따라 발생하는 환각(Hallucination) 현상을 얼마나 줄였는지, 그리고 안전성 및 윤리적 기준을 어떻게 확보했는지가 주요 관심사입니다.`,
  outlook:`기업 맞춤형 GPT-5 API 서비스가 본격화되면 의료, 금융, 교육 등 다양한 분야에서 혁신적인 서비스가 속출할 것이며, 저작권 및 규제 논의도 활발해질 것입니다.`,
  sources:[{title:`오픈AI 'GPT-5' 전격 출시…AGI 시대 성큼 - 한국경제`,url:`https://www.hankyung.com/article/202610050008`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`남유럽 전역 기후변화발 '가을 폭우' 강타, 홍수 피해 속출`,
  metrics:[`24시간 강수량 400mm 기록`,`이재민 15만명 발생`],
  summary:`기후변화의 직격탄을 맞은 이탈리아, 스페인 등 남유럽 전역에 이례적인 '가을 폭우'가 쏟아지며 대규모 홍수 피해가 속출하고 있습니다. 지중해 연안을 중심으로 불과 24시간 동안 400mm가 넘는 물폭탄이 쏟아져 주요 하천이 범람하고 도로와 다리가 유실되었습니다. 이탈리아 북부와 스페인 남부 지역에서는 산사태로 주택이 매몰되면서 다수의 인명 피해가 발생했고, 15만명 이상의 이재민이 임시 대피소로 대피한 상태입니다. 기상학자들은 지중해 해수면 온도가 평년보다 3도 이상 높아지면서 엄청난 양의 수증기가 대기로 유입된 것을 이번 폭우의 주된 원인으로 꼽았습니다. 각국 정부는 비상사태를 선포하고 구조 작업에 총력을 기울이고 있으나, 파괴된 기반 시설을 복구하는 데 막대한 경제적 타격이 예상됩니다.`,
  keyTerms:[{term:`해수면 온도`,explanation:`바다 표면의 물 온도를 의미하며, 이 온도가 비정상적으로 높아지면 태풍이나 폭우를 유발하는 거대한 비구름이 형성되기 쉽습니다.`}],
  history:`남유럽 지역은 지난 수년간 극심한 여름철 가뭄과 산불에 시달려왔으나, 최근에는 가을과 겨울철에 집중호우가 내리는 등 극단적인 기상이변이 반복되고 있습니다.`,
  players:`유럽연합(EU)은 회원국 간의 재난 구호 기금을 긴급 편성하고 있으며, 세계기상기구(WMO)는 기후 변화 대응의 시급성을 재차 경고하고 나섰습니다.`,
  current:`폭우로 인해 농경지가 대거 침수되면서 남유럽의 주요 수출품인 올리브, 포도 등의 수확에 막대한 차질이 빚어져 글로벌 농산물 가격에도 영향을 줄 수 있습니다.`,
  outlook:`이번 주말까지 지중해 연안에 추가적인 강한 비구름이 통과할 것으로 예보되어 있어 추가 피해가 우려되며, 기후 적응을 위한 인프라 재건축 논의가 탄력을 받을 것입니다.`,
  sources:[{title:`물바다 된 남유럽…기후변화가 부른 최악의 '가을 폭우' - 연합뉴스`,url:`https://www.yna.co.kr/view/AKR202610050009`}]
}]
},{
  tag:`2026-10-04`,
  label:`2026년 10월 4일 (일)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`반도체 수출 호조에도 불구, 1,350원대 고환율과 중동 지정학적 리스크로 수입 물가 부담이 가중되고 있습니다.`,
  metrics:[`미국 비농업 일자리 증가 2만 9,000명`,`원/달러 환율 1,350원대 상회`],
  summary:`9월 미국 비농업 일자리 증가 폭이 2만 9,000명에 그치며 연준의 금리 동결 기대가 커지고 있습니다. 이 가운데 한국 수출은 반도체를 중심으로 견조한 회복세를 보이고 있습니다. 하지만 중동 지역의 군사적 긴장이 고조되며 국제 유가가 들썩이고 있습니다. 이에 따라 원/달러 환율이 1,350원대를 상회하는 등 고환율 기조가 굳어지고 있습니다. 수입 물가 상승 압력이 커지면서 무역 수지 흑자 폭 둔화에 대한 우려도 나옵니다. 정부는 유류세 인하 조치 연장 등 물가 관리 대책 마련에 부심하고 있습니다.`,
  keyTerms:[{term:`고환율`,explanation:`외국 화폐에 비해 자국 화폐의 가치가 하락하여 환율이 높게 유지되는 현상입니다. 수입품 가격을 올려 국내 물가 상승을 유발할 수 있습니다.`}],
  history:`글로벌 고금리 장기화와 달러 강세가 맞물리며 원화 가치는 꾸준히 하방 압력을 받아왔습니다.`,
  players:`한국은행, 기획재정부, 반도체 수출 기업 등 국내 경제 주체들과 물가 상승에 민감한 소비자들이 얽혀 있습니다.`,
  current:`반도체 등 주력 산업의 수출이 버텨주고 있으나, 고환율로 인한 원자재 수입 비용 증가가 기업 채산성을 압박하는 전환점입니다.`,
  outlook:`미국의 10월 연준 FOMC 금리 결정 및 중동 전쟁 확전 여부가 향후 환율 및 물가의 향방을 가를 주요 변수가 될 것입니다.`,
  sources:[{title:`반도체 훈풍 속 고환율 딜레마 - 금융연구원`,url:`https://www.kif.re.kr`},{title:`뉴욕증시, 금리 동결 기대에 반등 - 조선일보`,url:`https://www.chosun.com`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`경유 가격 급등을 막기 위해 G7 국가들이 향후 4개월간 전략 비축유 1억 배럴을 방출하기로 합의했습니다.`,
  metrics:[`전략 비축유 1억 배럴 방출`,`미국 디젤 수출 금지 카드 부상`],
  summary:`미국 트럼프 행정부가 경유 가격 폭등에 직면하며 자국 내 디젤 수출 금지 조치를 만지작거리고 있습니다. 이러한 압박에 대응하기 위해 G7 국가들은 향후 4개월에 걸쳐 총 1억 배럴의 전략 비축유를 시장에 풀기로 긴급 합의했습니다. 미국 중간선거를 목전에 두고 에너지 가격 안정이 최우선 과제로 떠오른 결과입니다. 이번 방출 결정으로 국제 유가 급등세가 단기적으로 진정될지 주목됩니다. 다만 구조적인 정제 설비 부족 문제가 남아 있어, 겨울철을 앞두고 디젤 대란 우려는 여전히 불씨로 남아있습니다. 일각에서는 근본적 해법 없는 비축유 방출에 대한 비판도 제기됩니다.`,
  keyTerms:[{term:`전략 비축유`,explanation:`국가 안보나 심각한 공급 차질에 대비해 정부가 비상용으로 비축해 둔 원유나 석유 제품을 뜻합니다.`}],
  history:`지정학적 분쟁과 팬데믹 이후 정제 설비 투자가 감소하면서, 겨울철마다 디젤 등 정제유 공급 부족 현상이 고질적으로 반복되어 왔습니다.`,
  players:`선거 승리를 노리는 미국 행정부, 에너지 부담 완화가 절실한 G7 동맹국들, 그리고 석유 수출국 기구가 주요 행위자입니다.`,
  current:`11월 미국 중간선거를 30일 앞두고 정치적 타격이 될 수 있는 유가 급등을 막기 위해 전례 없는 규모의 글로벌 공조를 이끌어낸 상황입니다.`,
  outlook:`방출된 비축유가 시장에 모두 흡수된 이후, 추가적인 공급 확대 방안이 마련되지 않으면 가격 급등 사이클이 재현될 위험이 높습니다.`,
  sources:[{title:`G7 전략 비축유 방출 합의 - 가디언`,url:`https://www.theguardian.com`},{title:`미국 중간선거와 에너지 전략 - 모건스탠리`,url:`https://www.morganstanley.com`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`글로벌 채권 투매가 이어지며 미국 10년물 국채 금리가 2002년 이후 최고치인 5.34%를 기록했습니다.`,
  metrics:[`미국 10년물 국채 5.34%`,`영국 30년물 국채 일시 6% 돌파`],
  summary:`인플레이션 재점화 우려와 각국의 막대한 재정 적자 부담이 겹치면서 글로벌 채권 시장이 크게 요동치고 있습니다. 벤치마크로 꼽히는 미국 10년물 국채 금리가 5.34%대까지 치솟아 2002년 이후 24년 만에 최고치를 경신했습니다. 영국의 30년물 국채 금리 역시 장중 6%를 돌파하는 등 전 세계적인 투매 현상이 벌어졌습니다. 시장은 예상보다 더 끈적한 물가와 쏟아지는 국채 발행 물량을 소화하는 데 극심한 어려움을 겪고 있습니다. 이로 인해 주식 등 위험 자산의 밸류에이션 부담이 가중되며 글로벌 증시의 변동성도 커지고 있습니다. 각국 중앙은행은 향후 기준금리 정책 셈법을 두고 골머리를 앓고 있습니다.`,
  keyTerms:[{term:`국채 금리`,explanation:`국가가 돈을 빌리기 위해 발행하는 채권의 수익률로, 이 금리가 오르면 시장 전반의 차입 비용이 증가하여 경제 주체들에게 큰 부담이 됩니다.`}],
  history:`인플레이션을 잡기 위한 고강도 긴축 이후에도, 막대한 정부 재정 지출로 인해 국채 발행량이 줄지 않으면서 채권 시장의 수급 불균형이 만성화되었습니다.`,
  players:`국채를 대량으로 발행하는 각국 정부, 금리를 결정하는 중앙은행, 그리고 금리 변동에 베팅하는 글로벌 채권 투자자들입니다.`,
  current:`고금리가 장기간 이어질 것이라는 불안감이 채권 시장에 팽배하며, 단기간에 채권 금리가 위험 수위까지 발작적으로 튀어 오른 임계점입니다.`,
  outlook:`미국의 후속 고용 지표와 10월 연준 금리 결정 방향에 따라 국채 금리가 점진적인 안정세를 찾을지 추가 상승할지 결정될 전망입니다.`,
  sources:[{title:`글로벌 채권 시장 요동, 미 국채 5.3% 돌파 - 가디언`,url:`https://www.theguardian.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`10월 2일 검찰청이 전면 폐지된 가운데, 국민의힘은 대규모 장외집회를 열며 사법체계 개편을 강하게 비판했습니다.`,
  metrics:[`10월 2일 검찰청 공식 폐지`,`약 1년 만의 대규모 장외집회 개최`],
  summary:`오랜 정치적 논란 끝에 10월 2일부로 기존 검찰청이 폐지되고 중대범죄수사청과 공소청 체제가 공식 출범했습니다. 이러한 대대적인 사법체계 개편에 반발하여 야당인 국민의힘은 3일 서울 숭례문 일대에서 대규모 장외투쟁을 벌였습니다. 약 1년 만에 재개된 이번 장외집회에서 야당 지도부는 정부의 사법 정책과 전반적인 국정 운영을 정조준하며 맹비난을 쏟아냈습니다. 여당은 이를 야권 유력 인사의 사법리스크를 덮기 위한 방탄용 선동이라고 맞받아치며 팽팽하게 맞서고 있습니다. 보수 진영 주요 인사들도 별도의 정책 포럼을 출범시키며 결속력을 다지고 있습니다. 당분간 사법 시스템의 안착 여부와 맞물려 극심한 정쟁이 계속될 것으로 보입니다.`,
  keyTerms:[{term:`공소청`,explanation:`기존 검찰이 독점하던 수사권과 기소권 중, 수사권을 분리해내고 기소와 공소 유지 역할만 전담하도록 새롭게 신설된 국가 수사 기관입니다.`}],
  history:`검찰의 비대화된 권한을 견제하기 위해 수사권과 기소권을 완전히 분리하려는 사법개혁 논의는 수년에 걸쳐 정치권의 핵심 뇌관이었습니다.`,
  players:`사법개혁을 속도감 있게 주도한 더불어민주당 및 현 정부, 그리고 이를 필사적으로 저지하려는 국민의힘 등 야권 인사들입니다.`,
  current:`오랜 진통 끝에 제도가 법제화되어 첫발을 내디뎠으나, 초기 조직의 불안정과 수사 공백을 우려하는 야당의 목소리가 장외투쟁의 거대한 동력으로 작용했습니다.`,
  outlook:`신설된 수사청과 공소청이 실질적이고 안정적인 범죄 대응 능력을 입증하기 전까지는 사법 주도권을 둘러싼 여야 간의 치열한 싸움이 정기국회 내내 이어질 전망입니다.`,
  sources:[{title:`검찰청 폐지 후폭풍, 여야 장외 대치 - 뉴스핌`,url:`https://www.newspim.com`},{title:`보수 연대 포럼 출범 - 매일경제`,url:`https://www.mk.co.kr`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`2026년 정기국회 국정감사를 앞두고 증인 채택을 둘러싼 여야의 팽팽한 대치가 극에 달하고 있습니다.`,
  metrics:[`10월 1일 대통령실 수뇌부 개편`,`11월 중간평가격 국정감사 돌입`],
  summary:`다음 주부터 막을 올리는 2026년 정기국회 국정감사를 앞두고 여야 간 치열한 전운이 고조되고 있습니다. 국회 상임위 곳곳에서 주요 증인 채택 문제를 두고 양측이 한 치의 양보 없는 치열한 힘겨루기를 진행 중입니다. 국민의힘은 경제 및 주식시장 정책 실패와 고위 공직자 의혹을 집중 타격하겠다는 송곳 감사를 단단히 벼르고 있습니다. 반면 더불어민주당은 근거 없는 망신주기식 정쟁용 증인 채택은 절대 불가하다는 확고한 방침으로 맞서고 있습니다. 한편, 정부는 국감 시즌에 맞춰 10월 1일 대통령비서실 정책실장을 교체하고 신임 경제성장수석을 발탁하는 등 수뇌부 개편을 단행했습니다. 쇄신된 진용으로 다가오는 야당의 정책 공세에 맞서 방어선을 구축하려는 의도로 풀이됩니다.`,
  keyTerms:[{term:`국정감사`,explanation:`국회가 국정 전반에 대해 감사를 실시하여 정부의 주요 정책 수행이 적절했는지 감시하고 비판하는 가장 중요한 의정 활동 중 하나입니다.`}],
  history:`매년 가을에 열리는 국정감사는 행정부에 대한 입법부의 강력한 견제 수단이자, 정당들이 정국 주도권을 쥐기 위해 총력을 다해 화력을 집중하는 무대입니다.`,
  players:`국정운영 방어를 위해 전열을 가다듬은 대통령실 및 여당인 민주당, 정책 실정을 집요하게 파고들어 정권 심판론을 부각하려는 야당 국민의힘입니다.`,
  current:`정부의 주요 인사 단행과 국정감사 돌입 시기가 묘하게 겹치면서, 새롭게 구성된 내각 및 참모진의 실질적 위기관리 능력이 첫 시험대에 올랐습니다.`,
  outlook:`각 상임위원회별로 폭발력 있는 정치적 이슈가 다뤄지며 매일 날 선 공방이 펼쳐질 예정이며, 이는 향후 민심 향배에 상당한 영향을 미칠 것으로 보입니다.`,
  sources:[{title:`대통령실 신임 정책실장 발탁 - ikbc`,url:`https://www.ikbc.co.kr`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`11월 3일 미국 중간선거를 한 달 앞두고 7개월째 접어든 미국과 이란의 전쟁이 중대한 분수령을 맞았습니다.`,
  metrics:[`개전 7개월 차 진입`,`중간선거 D-30 카운트다운`],
  summary:`지난 2월 개전 이래 7개월을 넘긴 미국과 이란 간의 피말리는 소모전이 미국 정치의 가장 뜨거운 변수로 떠올랐습니다. 11월 3일 치러지는 미국 중간선거를 한 달 앞두고 양국의 치열한 외교적 밀당이 물밑에서 진행 중입니다. 이란은 호르무즈 해협 재개방과 경제 제재 해제를 교환하는 구체적인 수정 제안을 카타르를 통해 건넸지만, 트럼프 행정부는 일단 이를 완강히 거부했습니다. 트럼프 대통령은 선거를 앞두고 물가를 자극할 수 있는 유가 폭등이나 급격한 확전을 경계하면서도 대외적으로는 강경한 태도를 유지하려 애쓰고 있습니다. 선거 결과에서 공화당이 승리하면 군사 압박이 거세질 수 있지만, 민주당이 의회를 장악하면 전쟁 예산 삭감 압박이 커질 위험이 존재합니다. 결국 미국 유권자의 최종 선택이 복잡하게 얽힌 중동 전쟁의 향방을 직접적으로 결정짓게 되었습니다.`,
  keyTerms:[{term:`중간선거`,explanation:`대통령 임기 중간에 치러지는 의회 선거로, 현직 대통령의 전반기 국정 운영 전반에 대한 국민들의 냉정한 중간 평가 성격을 지닙니다.`}],
  history:`이란의 핵 개발 고도화 우려와 호르무즈 해협 봉쇄라는 극단적 위협으로 촉발된 양국의 무력 충돌은 글로벌 공급망과 에너지 시장을 수개월째 짓눌러 왔습니다.`,
  players:`재선 가도의 유리한 고지를 점하려는 트럼프 행정부, 협상 타결로 자국 내 경제난을 타개하려는 이란 정부, 그리고 하원 다수당 탈환을 노리는 미 민주당이 엮여 있습니다.`,
  current:`군사적 피로감과 경제적 압박이 최고조에 달한 아슬아슬한 상황에서, 양국 모두 즉각적인 무력 행사보다는 다가올 미국 선거 결과에 촉각을 곤두세우는 관망기에 접어들었습니다.`,
  outlook:`11월 3일 선거 결과 직후, 최종 승리한 정당의 정치적 셈법에 따라 평화 협상의 급물살을 타거나 파국적 확전으로 치달을 중대한 변곡점을 맞이할 것입니다.`,
  sources:[{title:`미국 중간선거와 이란 전쟁 분수령 - 연합뉴스`,url:`https://www.yna.co.kr`},{title:`트럼프 정부, 이란 수정 제안 일단 거부 - 한겨레`,url:`https://www.hani.co.kr`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`국내 피지컬 AI 현장 도입이 빨라지며, 과기정통부 주관 '모두의 AI 실험실' 경진대회가 본격적인 상용화의 막을 올렸습니다.`,
  metrics:[`모두의 AI 실험실 본선 12개 팀`,`2026 AI코리아 대상 시상`],
  summary:`인공지능이 모니터 화면 밖으로 나와 물리적 세계와 결합하는 실증 추세가 한국에서도 본격화되고 있습니다. 과기정통부와 한국지능정보사회진흥원이 주관한 '모두의 AI 실험실' 경진대회에서 최종 12개 본선 팀이 선정되어 실무 서비스 개발에 맹렬히 돌입했습니다. 네이버클라우드, 카카오 등 주요 IT 빅테크들이 적극적인 멘토로 나서 실효성 있는 상용화를 전폭 지원합니다. 이와 동시에 '2026 AI코리아 대상'에서는 의료 현장과 스마트 제조 현장에 직접 투입되어 설비를 제어하는 피지컬 AI 사례가 큰 주목을 받았습니다. 단순한 텍스트 답변 생성을 훌쩍 뛰어넘어 현실 세계의 복잡한 문제를 다중 에이전트 시스템으로 해결하려는 눈에 띄는 시도들입니다. 인공지능의 물리적 개입이 확산됨에 따라 소버린 클라우드 및 기밀 컴퓨팅 등 기반 보안 인프라의 중요성도 사회 전반에서 급부상하고 있습니다.`,
  keyTerms:[{term:`피지컬 AI`,explanation:`소프트웨어 형태의 인공지능을 뛰어넘어, 로봇이나 각종 기계 장치와 직접 결합해 물리적인 환경을 스스로 인지하고 조작하는 진보된 AI 시스템을 말합니다.`}],
  history:`과거 챗GPT 붐 이후 생성형 AI 기술은 눈부시게 발전했지만, 이를 공장이나 병원 같은 실제 물리적 노동 현장에 안전하게 적용하기에는 신뢰성 장벽이 상당히 높았습니다.`,
  players:`관련 기술 고도화를 이끄는 정부, 든든한 실무 인프라를 제공하는 주요 IT 기업들, 그리고 혁신적인 해결책을 쏟아내는 유망 스타트업 및 연구진입니다.`,
  current:`막강한 컴퓨팅 파워와 정밀한 센서 기술이 정교하게 맞물리면서, AI가 직접 물리적 객체를 조작하며 뚜렷한 성과를 내는 본격적인 실증 단계로 산업의 패러다임이 옮겨가고 있습니다.`,
  outlook:`현재 진행 중인 현장 실증이 성공적으로 마무리될 경우, 제조, 물류, 위험한 의료 분야를 중심으로 지능형 로봇과 AI 에이전트의 대규모 상용화가 폭발적으로 이뤄질 전망입니다.`,
  sources:[{title:`모두의 AI 실험실 본선 12팀 선정 - 지디넷코리아`,url:`https://www.zdnet.co.kr`},{title:`2026 AI코리아 대상, 현장 도입 집중 - 다음뉴스`,url:`https://www.daum.net`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`2026년 정부 R&D 예산이 35.5조 원 규모로 대폭 확대 편성되며, 국가 AI 인프라 확충과 차세대 반도체 개발이 급물살을 타고 있습니다.`,
  metrics:[`정부 R&D 예산 35.5조 원 편성`,`산업기술진흥원 10대 유망기술 선정`],
  summary:`치열해지는 글로벌 기술 패권 경쟁 속에서 국가 경쟁력 확보를 위해 정부가 2026년도 R&D 예산을 35.5조 원 규모로 과감하게 확대 편성했습니다. 이 막대한 예산 투입의 핵심 타깃은 부족한 국가 AI 컴퓨팅 인프라 확충과 차세대 지능형 엣지 반도체 개발입니다. 천문학적인 비용이 드는 GPU 자원을 국가 차원에서 전략적으로 확보해 핵심 기업과 연구소에 원활하게 공급하고, 핵심 기술의 해외 의존도를 대폭 낮출 독자적인 국가 AI 파운데이션 모델 개발 프로젝트를 가속화할 방침입니다. 이에 발맞춰 산업기술진흥원은 휴머노이드 로봇과 고도화된 자율공정 등을 포함한 미래 10대 유망기술을 엄선하여 산학연의 모든 역량을 일제히 집중시키기로 결의했습니다. 이를 통해 다가올 미래 기술 패권 경쟁에서 한국이 결코 주도권을 잃지 않겠다는 정부의 강한 의지가 엿보입니다. 막대한 재원이 투입되는 만큼 향후 효율적인 예산 집행과 가시적인 성과 도출이 중요한 관건으로 남았습니다.`,
  keyTerms:[{term:`엣지 반도체`,explanation:`중앙의 거대한 클라우드 서버를 거치지 않고, 스마트폰이나 가전제품 등 기기 단말기 자체에서 인공지능 연산을 지연 없이 빠르게 처리할 수 있도록 설계된 저전력 반도체입니다.`}],
  history:`최근 수년간 글로벌 AI 모델 개발 경쟁이 상상을 초월할 정도로 심화되면서, 초거대 연산을 뒷받침할 컴퓨팅 자원 확보가 국가 안보 및 생존과 직결되는 최우선 핵심 과제로 급부상했습니다.`,
  players:`대규모 예산을 기획 및 편성하는 정부 부처, 확충된 인프라를 활용해 첨단 기술을 개발할 국내 유력 반도체 기업, 학계 및 굵직한 국책 연구기관들이 긴밀히 협력하고 있습니다.`,
  current:`과거의 소규모 파편화된 R&D 지원 방식을 넘어, 국가 핵심 전략 기술 확보에 천문학적 단위의 예산을 집중 투입해 인프라 완전 자립을 시도하는 거대한 과도기적 시점입니다.`,
  outlook:`이번 대규모 투자를 통한 차세대 반도체 설계 역량 확보와 독자 AI 모델 구축 성과에 따라, 향후 10년 이상 한국 핵심 기술 산업의 글로벌 위상과 독립성이 판가름 날 중대한 기로입니다.`,
  sources:[{title:`2026년 R&D 예산 35.5조 편성 - 연합인포맥스`,url:`https://www.einfomax.co.kr`},{title:`KIAT, 10대 유망기술 선정 - 전자신문`,url:`https://www.etnews.com`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`10월 4일 치러지는 브라질 대선 1차 투표에서 룰라 현 대통령과 보우소나루 전 대통령 진영이 팽팽한 초접전 양상을 이어가고 있습니다.`,
  metrics:[`10월 4일 대선 1차 투표 실시`,`10월 25일 결선 투표 가능성 유력`],
  summary:`남미 대륙 최대의 경제 대국 브라질에서 10월 4일 역사적인 대통령 선거 1차 투표가 시작되며 전 세계의 긴장어린 이목이 쏠리고 있습니다. 전통적 좌파 진영의 굳건한 상징인 룰라 현 대통령과 강경 우파 진영을 거세게 이끄는 플라비우 보우소나루 상원의원이 각종 여론조사 오차범위 내에서 피말리는 초접전을 벌이고 있습니다. 심각해지는 경제 불평등 해소와 시급한 아마존 환경 보호를 최우선으로 내세운 룰라 측과, 자유시장 경제 확대 및 치안 강화를 강력히 옹호하는 우파 진영의 정치적 대립이 극심한 상황입니다. 최근 여론조사 결과에 따르면 어느 후보도 1차 투표에서 당선을 확정 짓는 과반 득표에 도달하지 못해, 결국 10월 25일에 숨 막히는 결선 투표가 치러질 가능성이 매우 높게 점쳐집니다. 향후 브라질의 최종 선거 결과는 남미 전체의 복잡한 정치 지형 변화뿐만 아니라 글로벌 환경 정책 및 무역 흐름에도 엄청난 파급력을 미칠 핵심 변수로 꼽힙니다. 뜨거운 선거 과정에서 벌어지는 악의적인 가짜뉴스 유포와 양 진영 지지자 간 폭력 사태 우려도 사회적 불안을 빠르게 키우고 있습니다.`,
  keyTerms:[{term:`결선 투표`,explanation:`다수결 선거의 1차 투표에서 특정 후보가 당선에 필요한 과반수의 표를 얻지 못했을 때, 가장 득표율이 높은 상위 1, 2위 후보만을 다시 후보로 올려 최종 당선자를 확실히 가려내는 제도입니다.`}],
  history:`브라질은 군부 독재 이후 오랫동안 극심한 좌우 이념 양극화에 시달려왔으며, 지난 수차례의 치열한 대선에서도 두 거대 진영 간의 갈등이 국론을 두 동강 내는 분열 수준으로 격화되어 왔습니다.`,
  players:`강력한 현직 프리미엄과 빈곤층의 지지를 가진 룰라 대통령, 보수 유권자와 기업가들의 결집을 노리는 보우소나루 상원의원, 그리고 승패의 결정적 향방을 쥔 부동층 중도 성향 유권자들입니다.`,
  current:`끈질긴 인플레이션과 지루한 경제 성장 둔화로 인해 민심이 크게 요동치는 가운데, 투표용지 단 한 장의 선택으로 국가의 미래 정책 노선이 완전히 좌우될 수 있는 극도로 긴장된 순간입니다.`,
  outlook:`1차 투표 개표 직후 간발의 차이로 인한 선거 불복 논란이나 전국적 소요 사태가 발생할 수 있으며, 결선 투표까지 남은 3주간 양측의 파괴적인 네거티브 공방이 최고조에 달할 것으로 보입니다.`,
  sources:[{title:`브라질 대선 1차 투표 초접전 양상 - 뉴스쿽`,url:`https://www.newsquawk.com`}]
}]

  tag:`2026-10-03`,

  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`9월 한국 수출이 사상 최고치인 1,200억 달러를 돌파하며 코스피가 7,000선 회복을 시도했습니다.`,
  metrics:[`수출 1,200억 달러`,`코스피 6,995선`],
  summary:`9월 한국의 수출액이 사상 처음으로 1,200억 달러를 돌파했습니다. 특히 반도체 수출이 603억 달러를 기록하며 전체 성장을 견인했습니다. 이는 글로벌 AI 수요 급증과 마이크론 호실적의 영향이 큽니다. 이러한 훈풍에 힘입어 코스피 지수 역시 7,000선 안착을 시도하며 6,995선으로 마감했습니다. 외국인의 매도세가 잦아들면서 시장에 긍정적인 신호를 주었습니다. 무역수지 흑자 기조가 이어지면서 향후 국내 증시의 추가 상승 동력으로 작용할지 주목됩니다.`,
  keyTerms:[{term:`무역수지`,explanation:`국가의 수출액과 수입액의 차이를 의미하며, 수출이 많을 경우 흑자로 기록됩니다.`}],
  history:`한국은 반도체, 자동차 등 제조업 기반의 수출 주도형 경제 체제를 유지해왔습니다. 최근 몇 년간 글로벌 경기 침체로 수출이 둔화되었으나, AI 열풍과 함께 반도체 수요가 다시 폭발적으로 증가했습니다.`,
  players:`삼성전자, SK하이닉스 등 국내 주요 반도체 기업들과 글로벌 IT 기업들이 핵심 역할을 하고 있습니다.`,
  current:`이번 1,200억 달러 돌파는 한국 경제의 강력한 회복세를 보여주는 상징적인 사건으로 평가받고 있습니다.`,
  outlook:`연말까지 반도체 수요가 견조할 것으로 예상되어, 수출 호조세와 증시의 상승 여력이 지속될 가능성이 높습니다.`,
  sources:[{title:`반도체 훈풍에 코스피 7000선 회복 시도 - FN Times`,url:`https://www.fntimes.com`},{title:`수출 역대 최고치 돌파 - Newspim`,url:`https://www.newspim.com`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국의 9월 고용 지표가 시장 예상치를 크게 밑돌면서 10월 기준금리 인상 확률이 급락했습니다.`,
  metrics:[`비농업 고용 2만 9,000명 증가`,`10년물 국채 금리 5.17%`],
  summary:`9월 미국 비농업 고용자 수가 2만 9,000명 증가하는 데 그치며 시장 예상치인 8만 4,000명을 크게 하회했습니다. 고용 시장이 예상보다 빠르게 식어가고 있다는 신호가 나타나면서, 연준의 10월 금리 인상 확률은 20%대로 떨어졌습니다. 금리 동결 기대감이 커지자 24년 만에 최고치로 치솟았던 10년물 국채 금리는 5.17% 선까지 급락했습니다. 이로 인해 S&P 500과 나스닥 등 뉴욕 증시는 상승 마감했으며, 엔비디아는 사상 최고가를 경신했습니다. 다가오는 FOMC 회의에서 연준이 어떤 스탠스를 취할지 시장의 이목이 집중되고 있습니다.`,
  keyTerms:[{term:`비농업 고용자 수`,explanation:`미국 노동부가 매월 발표하는 지표로, 농축산업을 제외한 산업에서 늘어난 일자리 수를 의미하며 경제 동향을 파악하는 핵심 지표입니다.`}],
  history:`미국 연방준비제도(Fed)는 인플레이션을 억제하기 위해 지속적으로 금리를 인상해왔으며, 이는 글로벌 금융 시장에 큰 부담으로 작용했습니다.`,
  players:`제롬 파월 연준 의장과 주요 투자은행, 그리고 금리 변동에 민감한 글로벌 기술 기업들이 주시하고 있습니다.`,
  current:`이번 고용 쇼크는 그동안의 고강도 긴축 정책이 마침내 실물 경제에 직접적인 영향을 미치고 있음을 명확히 보여줍니다.`,
  outlook:`10월 금리 동결이 유력해진 가운데, 12월의 추가적인 금리 인하 또는 유지 여부가 연말 글로벌 증시 방향을 결정할 것입니다.`,
  sources:[{title:`미국 고용 쇼크, 연준 금리 동결 전망 - TheStreet`,url:`https://www.thestreet.com`},{title:`미 국채 금리 급락 - BNN Bloomberg`,url:`https://www.bnnbloomberg.ca`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`중동 전쟁의 여파로 국제 유가가 폭등하자 G7 정상들이 1억 배럴의 비축유 방출에 합의했습니다.`,
  metrics:[`브렌트유 배럴당 102달러`,`비축유 1억 배럴 방출`],
  summary:`미국의 중동 추가 파병 소식 등 지정학적 긴장이 고조되면서 브렌트유가 배럴당 102달러를 돌파하며 4% 이상 급등했습니다. 유가 폭등으로 인한 글로벌 물가 상승 압력이 커지자, G7 정상들은 긴급 회의를 통해 향후 4개월간 1억 배럴의 전략비축유를 방출하기로 합의했습니다. 반면 중국은 내수 우선을 이유로 정제 연료 수출을 중단하면서 글로벌 디젤 공급난 우려가 겹치고 있습니다. 이러한 에너지 가격의 불안정성은 개발도상국들에게 심각한 재정 위기를 촉발할 수 있다는 UN의 경고까지 나온 상황입니다. 국제 공조에도 불구하고 근본적인 공급망 리스크는 지속될 것으로 보입니다.`,
  keyTerms:[{term:`전략비축유`,explanation:`국가 안보나 에너지 공급 위기 상황에 대비해 정부가 대규모로 미리 비축해 두는 원유를 뜻합니다.`}],
  history:`과거 오일쇼크 이후 주요 선진국들은 에너지 위기에 대응하기 위해 비축유 제도를 운용해왔으며, 전쟁이나 자연재해 시 이를 시장에 풀어 가격을 안정시킵니다.`,
  players:`G7(주요 7개국) 정상들, 중동 산유국(OPEC+), 그리고 자국 내수를 우선시하는 중국 정부가 주요 플레이어입니다.`,
  current:`중동의 군사적 충돌이 글로벌 원유 공급망을 위협하면서 인플레이션 재점화에 대한 시장의 공포가 극에 달해 있습니다.`,
  outlook:`G7의 비축유 방출이 단기적인 유가 하락을 유도할 수 있으나, 전쟁의 장기화 여부가 궁극적인 에너지 가격 추이를 결정할 것입니다.`,
  sources:[{title:`G7 비축유 1억 배럴 방출 합의 - Europa`,url:`https://europa.eu`},{title:`중동 긴장으로 유가 4% 급등 - Newspim`,url:`https://www.newspim.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`78년 역사의 대한민국 검찰청이 폐지되고 공소청과 중대범죄수사청이 새롭게 출범했습니다.`,
  metrics:[`검찰청 78년 만에 폐지`,`2개 신설 기관 출범`],
  summary:`10월 2일을 기점으로 대한민국 검찰청이 공식 폐지되고, 기소와 수사를 분리한 공소청과 중대범죄수사청이 출범했습니다. 이로써 78년간 이어져 온 검찰의 독점적 수사 구조가 완전히 해체되었습니다. 야당인 국민의힘은 범죄수사 시스템의 사망이라며 강하게 반발하고 나섰습니다. 특히 중수청의 초대 청장 후보자로 친윤계 출신이 지명되면서, 여당 내 강경파조차 이를 강하게 비판하며 인선 논란이 커지고 있습니다. 새로운 사법 시스템이 안착하기 전까지 정치권의 극심한 대립과 수사 공백에 대한 우려가 이어질 것으로 보입니다.`,
  keyTerms:[{term:`중대범죄수사청`,explanation:`과거 검찰이 담당하던 부패, 경제 등 중대한 범죄에 대한 직접 수사권을 전담하기 위해 새롭게 신설된 국가 기관입니다.`}],
  history:`수십 년간 검찰의 권한 비대화와 수사권 남용 문제가 지적되어 왔으며, 역대 정부들은 이를 해결하기 위해 수사권 조정을 지속적으로 추진해왔습니다.`,
  players:`이재명 대통령, 더불어민주당, 국민의힘, 그리고 새롭게 출범한 중수청 및 공소청의 수장들이 얽혀 있습니다.`,
  current:`검찰 폐지라는 역사적 전환점을 맞이했으나, 신임 청장 인사를 둘러싸고 여당 내에서도 계파 간 의견 충돌이 발생하고 있습니다.`,
  outlook:`신설 기관들의 실질적인 수사 역량 입증 여부와 국회에서의 인사청문회 결과가 향후 정국의 최대 화약고가 될 전망입니다.`,
  sources:[{title:`검찰청 공식 폐지 및 공소청 출범 - Newspim`,url:`https://www.newspim.com`},{title:`초대 중수청장 후보자 논란 - Newspim`,url:`https://www.newspim.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국이 중동에 대규모 병력을 추가 파병하며 이란에 대한 군사적 압박을 최고조로 끌어올리고 있습니다.`,
  metrics:[`미군 1만 명 추가 파병`,`항공모함 전단 3개 배치`],
  summary:`트럼프 미국 대통령이 11월 중간선거 이후 이란에 대한 추가 공습을 검토하며 중동 정세가 급박하게 돌아가고 있습니다. 미국은 시어도어 루스벨트 항공모함 전단 등 약 1만 명의 병력을 추가로 파견하여 중동 내 미군 규모를 2만 명으로 늘렸습니다. 아울러 이란의 핵심 산업과 연계망을 겨냥한 전례 없는 경제 제재도 함께 발표했습니다. 영국 런던에서 미군 기지 테러를 모의한 혐의로 이란계 남성이 체포되는 등 국지적 충돌의 징후도 곳곳에서 포착되고 있습니다. 이러한 미국의 초강경 대응은 중동 전역을 전면전의 공포로 몰아넣고 있습니다.`,
  keyTerms:[{term:`항공모함 전단`,explanation:`항공모함을 중심으로 순양함, 구축함, 잠수함 등이 무리를 지어 이동하는 거대한 해상 군사 부대로, 막강한 화력을 자랑합니다.`}],
  history:`미국과 이란은 핵합의 파기 이후 오랜 기간 경제 제재와 군사적 도발을 주고받으며 적대적 관계를 유지해왔습니다.`,
  players:`강경한 입장의 트럼프 미 대통령, 이란 지도부, 그리고 이란을 지원하는 친이란 무장 세력들이 주요 당사자입니다.`,
  current:`미국의 이번 병력 증강은 단순한 경고를 넘어 실제 타격을 염두에 둔 사전 배치로 해석되며 긴장감을 증폭시키고 있습니다.`,
  outlook:`미국의 선거 일정과 맞물려 이란과의 군사적 충돌이 현실화될 경우 글로벌 유가와 경제에 막대한 파장을 미칠 것으로 우려됩니다.`,
  sources:[{title:`미군 중동 추가 파병 및 이란 공습 검토 - Substack`,url:`https://www.substack.com`},{title:`미국 대이란 추가 제재 발표 - AA.com`,url:`https://www.aa.com.tr`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`국민의힘이 개천절 대규모 장외집회를 예고하며 이재명 정부에 대한 전면적인 대여 공세에 나섰습니다.`,
  metrics:[`10월 3일 장외집회 예정`,`장외 투쟁 본격화`],
  summary:`국민의힘이 10월 3일 개천절을 맞아 서울 숭례문 인근에서 대규모 장외집회를 개최하기로 선언했습니다. 야당은 이번 장외집회에서 검찰청 폐지 강행, DMZ 지뢰 폭발 사고에 대한 안일한 대처, 그리고 민생 경제 실패 등을 주요 쟁점으로 삼고 있습니다. 최근 국군의 날 행사에서 이 대통령이 북한의 도발을 불의의 사고라고 축소 언급한 부분도 안보관 논란의 불씨가 되었습니다. 한동훈 대표와 민주당 간의 노무현 전 대통령 수사 관련 과거사 공방까지 겹치면서 정치권의 양극화가 극에 달하고 있습니다. 이번 장외투쟁이 여론의 향배를 가를 중요한 분수령이 될 전망입니다.`,
  keyTerms:[{term:`장외집회`,explanation:`정당이나 정치 단체가 국회 등 공식적인 의사당을 벗어나 거리나 광장에서 대중을 상대로 벌이는 시위나 집회를 말합니다.`}],
  history:`한국 정치에서 야당은 정부 여당의 일방적인 정책 추진에 맞서 국민의 이목을 끌기 위해 종종 거리로 나서는 투쟁 방식을 채택해왔습니다.`,
  players:`국민의힘 주요 인사들, 이재명 대통령과 더불어민주당 지도부가 첨예하게 맞서고 있습니다.`,
  current:`검찰청 폐지와 안보 이슈 등 민감한 현안들이 동시다발적으로 터지면서 보수 진영의 결집이 가속화되고 있습니다.`,
  outlook:`집회의 규모와 시민들의 호응도에 따라 다가오는 정기국회와 향후 정국 주도권 싸움에서 야당의 협상력이 결정될 것으로 보입니다.`,
  sources:[{title:`국민의힘 개천절 대규모 장외집회 예고 - Newspim`,url:`https://www.newspim.com`},{title:`대통령 국군의 날 메시지 공방 - YouTube`,url:`https://www.youtube.com`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`국내 5대 시중은행이 신종 AI 해킹 공격을 받아 수만 명의 고객 개인정보가 유출되었습니다.`,
  metrics:[`최소 6개 은행 타격`,`신한은행 2만 5천 명 유출`],
  summary:`신한, KB국민, 하나 등 국내 주요 6개 시중은행이 인공지능을 활용한 고도화된 해킹 공격을 받아 발칵 뒤집혔습니다. 이 해킹으로 인해 신한은행에서만 약 2만 5,000명의 실제 고객 개인정보가 유출된 것으로 확인되었습니다. 공격자들은 철통같이 보호되는 주 전산망 대신, 상대적으로 취약한 직원용 모바일 업무 시스템을 통해 침투했습니다. 특히 자율 침투가 가능한 중국 기반의 해외 AI 에이전트 도구가 동원된 정황이 파악되어 충격을 주고 있습니다. 금융당국은 즉각적인 긴급 점검에 나섰으며, 금융권 전체의 AI 대응 보안 체계 마련이 시급해졌습니다.`,
  keyTerms:[{term:`자율 침투`,explanation:`해커가 직접 조종하지 않아도 인공지능 프로그램 스스로 취약점을 찾아내고 내부망으로 깊숙이 파고드는 고도의 해킹 기법입니다.`}],
  history:`금융권은 막대한 예산을 들여 보안 망을 구축해왔으나, 최근 생성형 AI 기술이 발전하면서 이를 악용한 사이버 공격 기법도 진화해왔습니다.`,
  players:`국내 주요 시중은행, 보안 당국, 그리고 배후로 의심받는 해외 해킹 조직이 얽혀 있습니다.`,
  current:`망분리 규제 완화 논의가 이루어지던 시점에서 발생한 대형 보안 사고로 인해 금융 정책 기조에 큰 변화가 예상됩니다.`,
  outlook:`유출된 고객 정보의 2차 피해를 막기 위한 조치와 더불어 금융권 전반에 걸친 대대적인 시스템 감사와 AI 보안 가이드라인 제정이 뒤따를 것입니다.`,

  headline:`구글이 복잡한 추론과 사이버 방어에 특화된 차세대 인공지능 제미나이 4 아르곤을 발표했습니다.`,
  metrics:[`제미나이 4 아르곤 출시`,`100만 토큰 처리`],
  summary:`구글이 AI 기술 패권 경쟁에서 우위를 점하기 위해 차세대 모델인 제미나이 4 아르곤을 전격 공개했습니다. 이 모델은 매우 복잡한 논리적 추론은 물론, 최근 급증하는 사이버 위협에 대항하기 위한 방어 능력을 크게 강화한 것이 특징입니다. 한 번에 책 수십 권 분량인 100만 토큰의 컨텍스트 윈도우를 안정적으로 처리할 수 있어 기업용 시장에서 큰 기대를 모으고 있습니다. 또한, 구글은 윈도우용 제미나이 전용 앱 출시와 함께 AI 최적화 노트북인 구글북의 사전 예약 소식도 발표했습니다. AI 기술을 하드웨어와 운영체제로 확장하려는 구글의 전략이 돋보입니다.`,
  keyTerms:[{term:`컨텍스트 윈도우`,explanation:`인공지능이 한 번에 기억하고 분석할 수 있는 데이터의 한도를 의미하며, 이 크기가 클수록 긴 문서나 대화를 정확하게 이해할 수 있습니다.`}],

  players:`구글, 마이크로소프트, 오픈AI 등 글로벌 빅테크 기업들이 AI 시장의 주도권을 놓고 치열하게 다투고 있습니다.`,
  current:`단순한 챗봇을 넘어 보안 및 기업 인프라 방어까지 책임지는 형태의 실용적 AI로 기술 트렌드가 넘어가고 있습니다.`,
  outlook:`새로운 모델의 출시로 기업들의 AI 도입이 더욱 가속화될 것이며, 신형 노트북을 통한 하드웨어 생태계 장악 여부도 관전 포인트입니다.`,
  sources:[{title:`구글 차세대 AI 제미나이 4 아르곤 발표 - Google Blog`,url:`https://blog.google`}]

  headline:`최태원 SK 회장이 거액의 재산분할금을 마련하기 위해 9,440억 원 규모의 지분 매각을 단행했습니다.`,
  metrics:[`지분 2.3% 매각`,`9,440억 원 확보`],
  summary:`최태원 SK그룹 회장이 노소영 아트센터 나비 관장과의 이혼 소송에 따른 거액의 재산분할금을 지급하기 위해 승부수를 띄웠습니다. 최 회장은 지주사인 SK㈜의 지분 2.3%를 약 9,440억 원에 블록딜 방식으로 매각한다고 공식 공시했습니다. 시장의 충격과 주가 하락을 최소화하기 위해 장이 끝난 후 기관 투자자에게 대량으로 주식을 넘기는 방식을 택했습니다. 이번 지분 매각 이후에도 최 회장은 특수관계인 포함 30% 이상의 의결권을 유지하게 되어, 우려되었던 경영권 방어에는 큰 문제가 없을 것으로 보입니다. 세기의 이혼 소송에 따른 천문학적 재산 분할이 실제 기업 지배구조에 미친 첫 대규모 조치입니다.`,
  keyTerms:[{term:`블록딜`,explanation:`대주주나 기관이 대량의 주식을 주식 시장의 정규 거래 시간이 끝난 뒤 할인된 가격으로 한꺼번에 매각하는 방식입니다.`}],
  history:`최태원 회장과 노소영 관장의 이혼 소송 항소심에서 법원이 1조 3천억 원대라는 사상 최대 규모의 재산 분할을 판결하면서 재원 마련에 관심이 쏠렸습니다.`,
  players:`최태원 SK 회장, 노소영 관장, 그리고 SK 지분을 인수한 주요 기관 투자자들이 관련되어 있습니다.`,
  current:`막대한 현금을 단기간에 조달해야 하는 압박 속에서 결국 지주사 지분 매각이라는 카드를 꺼내 들며 불확실성을 일부 해소했습니다.`,
  outlook:`할인된 가격의 대규모 매각으로 인한 단기적인 주가 변동성 확대가 예상되며, 대법원 최종 판결 결과에 따라 그룹 지배구조에 추가적인 영향이 있을지 주목됩니다.`,
  sources:[{title:`최태원 SK 회장 지분 9440억원 매각 공시 - Yonhap News TV`,url:`https://www.yonhapnewstv.co.kr`},{title:`SK 지분 매각 단행 - YNA`,url:`https://www.yna.co.kr`}]
}]

let current = null;
let currentCat = null;
const CAT_ORDER = ['경제', '정치', '기타 이슈'];

function renderSidebar() {
  const list = document.getElementById('date-list');
  list.innerHTML = '';
  BRIEFS.forEach((b, i) => {
    const el = document.createElement('div');
    el.className = 'date-item' + (i === 0 ? ' active' : '');
    el.dataset.tag = b.tag;
    const parts = b.tag.split('-');
    const short = parts[1] + '/' + parts[2];
    el.innerHTML = b.tag;
    el.addEventListener('click', () => showBrief(b.tag));
    list.appendChild(el);
  });
}

function showBrief(tag) {
  current = tag;
  document.querySelectorAll('.date-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tag === tag);
  });
  const brief = BRIEFS.find(b => b.tag === tag);
  if (!brief) return;

  // 카테고리별 그룹핑
  const grouped = {};
  brief.stories.forEach(s => {
    if (!grouped[s.category]) grouped[s.category] = [];
    grouped[s.category].push(s);
  });
  const availableCats = CAT_ORDER.filter(c => grouped[c] && grouped[c].length);
  if (!availableCats.length) return;

  // 기본 카테고리 결정
  if (!availableCats.includes(currentCat)) currentCat = availableCats[0];

  renderContent(brief, grouped, availableCats);
}

function renderContent(brief, grouped, availableCats) {
  const content = document.getElementById('content');
  let html = `<div class="sticky-top">
    <div class="brief-header">
      <div class="bh-eyebrow">Morning Brief</div>
      <h2>${brief.label}</h2>
    </div>`;

  // 탭
  html += '<div class="cat-tabs">';
  availableCats.forEach(c => {
    const cls = c === currentCat ? 'cat-tab active' : 'cat-tab';
    html += `<button class="${cls}" data-cat="${c}">${c}</button>`;
  });
  html += '</div></div>';

  // 선택된 카테고리 기사들
  const stories = grouped[currentCat] || [];
  stories.forEach((s, idx) => {
    if (idx > 0) html += '<hr class="story-divider">';
    html += `<div class="story">
      <div class="story-top">
        <div class="story-headline">${s.headline}</div>
      </div>`;
    if (s.metrics.length) {
      html += '<div class="metrics">';
      s.metrics.forEach(m => { html += `<div class="metric-chip">${m}</div>`; });
      html += '</div>';
    }
    // 요약문에 핵심 개념 밑줄 (출력은 박스 다음)
    let summaryHtml = s.summary;
    if (s.keyTerms && s.keyTerms.length) {
      s.keyTerms.forEach(kt => {
        if (!kt.term) return;
        const safe = kt.term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp(safe, 'g');
        summaryHtml = summaryHtml.replace(re, `<span class="kt-underline">${kt.term}</span>`);
      });
    }

    // 핵심 개념 박스 (요약 위)
    if (s.keyTerms && s.keyTerms.length) {
      html += '<div class="key-terms"><div class="key-terms-title">핵심 개념</div>';
      s.keyTerms.forEach(kt => {
        html += `<div class="kt-item">
          <span class="kt-term">${kt.term}</span>
          <span class="kt-exp">${kt.explanation}</span>
        </div>`;
      });
      html += '</div>';
    }

    html += `<div class="summary">${summaryHtml}</div>`;

    const bgSections = [
      ['역사적 맥락', s.history],
      ['핵심 플레이어', s.players],
      ['현재 구도', s.current],
      ['향후 전망', s.outlook],
    ].filter(([, v]) => v);

    if (bgSections.length) {
      html += '<div class="bg-box"><div class="bg-box-title">배경 스토리</div>';
      bgSections.forEach(([label, text]) => {
        html += `<div class="bg-section">
          <div class="bg-section-label">${label}</div>
          <div class="bg-section-text">${text}</div>
        </div>`;
      });
      html += '</div>';
    }

    if (s.sources.length) {
      html += `<button class="sources-toggle" data-toggle="srcs-${idx}">출처 ${s.sources.length}개 보기 <span class="arrow">▾</span></button>`;
      html += `<div class="sources-body" id="srcs-${idx}">`;
      s.sources.forEach((src, si) => {
        html += `<div class="source-item">
          <span class="src-num">${si+1}</span>
          <a href="${src.url}" target="_blank">${src.title}</a>
        </div>`;
      });
      html += '</div>';
    }
    html += '</div>';
  });

  content.innerHTML = html;

  // 탭 클릭 핸들러
  content.querySelectorAll('.cat-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentCat = btn.dataset.cat;
      renderContent(brief, grouped, availableCats);
    });
  });

  // 출처 토글
  content.querySelectorAll('.sources-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const body = document.getElementById(btn.dataset.toggle);
      const isOpen = body.classList.toggle('open');
      btn.classList.toggle('open', isOpen);
    });
  });

  document.getElementById('main').scrollTop = 0;
}

if (BRIEFS.length > 0) {
  renderSidebar();
  showBrief(BRIEFS[0].tag);
} else {
  document.getElementById('content').innerHTML = '<div class="empty">브리핑 데이터가 없습니다.</div>';
}

// ── Quiz Gate ──
const PASS_TARGET = 3;
let correctCount = 0;
const usedIndexes = new Set();

function pickQuestion() {
  // 사용 안 한 문제 중 랜덤. 다 썼으면 풀 리셋
  if (usedIndexes.size >= QUIZ.length) usedIndexes.clear();
  let idx;
  do { idx = Math.floor(Math.random() * QUIZ.length); } while (usedIndexes.has(idx));
  usedIndexes.add(idx);
  return QUIZ[idx];
}

function updateCounter() {
  document.getElementById('quiz-counter').textContent = `(${correctCount}/${PASS_TARGET})`;
}

function renderQuiz() {
  const q = pickQuestion();
  document.getElementById('quiz-q').textContent = q.q;
  updateCounter();
  const feedback = document.getElementById('quiz-feedback');
  feedback.textContent = '';
  feedback.className = 'quiz-feedback';
  const closeBtn = document.getElementById('quiz-close');
  closeBtn.classList.add('hidden');

  const choicesEl = document.getElementById('quiz-choices');
  choicesEl.innerHTML = '';
  // 보기 순서 섞기 (정답 위치 고정 방지)
  const order = q.a.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  order.forEach(idx => {
    const text = q.a[idx];
    const btn = document.createElement('button');
    btn.className = 'quiz-choice';
    btn.textContent = text;
    btn.addEventListener('click', () => {
      const allBtns = choicesEl.querySelectorAll('.quiz-choice');
      allBtns.forEach(b => b.disabled = true);
      if (idx === q.correct) {
        btn.classList.add('correct');
        correctCount++;
        updateCounter();
        if (correctCount >= PASS_TARGET) {
          feedback.textContent = '통과! 들어와도 좋아.';
          feedback.className = 'quiz-feedback right';
          closeBtn.classList.remove('hidden');
        } else {
          feedback.textContent = '역시 맞출 줄 알았어. 다음 문제 고.';
          feedback.className = 'quiz-feedback right';
          btn.blur();
          setTimeout(() => {
            if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
            renderQuiz();
          }, 900);
        }
      } else {
        btn.classList.add('wrong');
        feedback.textContent = '정말 실망이다.... 다음.';
        feedback.className = 'quiz-feedback wrong';
        btn.blur();
        setTimeout(() => {
          if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
          renderQuiz();
        }, 900);
      }
    });
    choicesEl.appendChild(btn);
  });
}

document.getElementById('quiz-close').addEventListener('click', () => {
  document.getElementById('quiz-overlay').classList.add('hidden');
  document.body.classList.remove('quiz-active');
});

document.body.classList.add('quiz-active');
renderQuiz();

// ── Mobile sidebar toggle ──
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('sidebar-backdrop');
function toggleSidebar(open) {
  sidebar.classList.toggle('open', open);
  backdrop.classList.toggle('open', open);
}
document.getElementById('sidebar-toggle').addEventListener('click', () => toggleSidebar(!sidebar.classList.contains('open')));
backdrop.addEventListener('click', () => toggleSidebar(false));
// 날짜 클릭하면 모바일에서 자동으로 닫히게
sidebar.addEventListener('click', e => {
  if (e.target.classList.contains('date-item') && window.innerWidth <= 768) {
    toggleSidebar(false);
  }
});

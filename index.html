  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`엔비디아 젠슨 황 충격의 전격 사임, 미국 정부의 '중국 우회 수출' 고강도 수사 여파`,
  metrics:[`엔비디아 주가 시간외 12% 급락`,`미 상무부 통제 위반 과징금 최대 수십억 달러 위기`],
  summary:`글로벌 인공지능(AI) 반도체 시장을 독점하며 황제주로 군림해 온 엔비디아의 창업자이자 최고경영자인 젠슨 황이 전격적으로 사임을 발표하며 테크 업계에 엄청난 충격을 안겼습니다. 이번 사임 결정은 미국 상무부와 법무부가 엔비디아의 최첨단 AI 가속기가 중동 등 제3국 페이퍼컴퍼니를 거쳐 중국으로 불법 우회 수출된 정황을 잡고 고강도 연방 수사에 착수한 것이 결정적인 원인으로 작용했습니다. 미국 정부는 국가 안보를 심각하게 훼손한 대중국 수출 통제 위반 행위로 보고 경영진의 묵인 여부를 집중적으로 파헤치고 있습니다. 리더십 공백 사태에 직면한 엔비디아의 주가는 시간외 거래에서 폭락하며 글로벌 증시 전반에 매도 폭탄을 촉발했습니다. 이사회는 Arm의 CEO인 르네 하스 등을 포함한 외부 수혈을 통해 차기 사령탑 영입전에 다급하게 돌입했습니다. 전 세계 AI 산업의 핵심 공급망을 쥔 거인의 뼈아픈 쇠락에 경쟁사들은 반사이익을 노리며 발 빠르게 움직이고 있습니다.`,
  keyTerms:[{term:`대중국 수출 통제`,explanation:`미국 정부가 자국의 군사 및 국가 안보를 보호하기 위해, 최첨단 반도체나 인공지능 기술이 중국이나 적대국으로 흘러 들어가는 것을 법으로 강제 차단하는 규제 조치입니다.`}],
  history:`미국은 중국의 AI 군사 기술 굴기를 막기 위해 엔비디아의 A100, H100 등 고성능 칩의 중국 수출을 전면 금지했습니다. 엔비디아는 규제를 피하기 위해 성능을 낮춘 H800 등을 내놓았으나 이마저도 수출이 막혔고, 이에 중동 등의 우회 경로를 통한 밀수출이 공공연한 비밀로 거론되어 왔습니다.`,
  players:`AI 칩 시장의 지배자 엔비디아와 그 수장 젠슨 황, 그리고 기술 유출을 엄단하려는 미국 상무부 및 법무부가 정면으로 충돌했습니다. AMD와 인텔 등 후발 주자들은 이 빈틈을 노리고 있습니다.`,
  current:`미국 연방수사국의 대대적인 서버 압수수색과 내부 고발자의 증언이 이어지면서 젠슨 황은 법적 책임을 피하기 위해 이사회 압박에 떠밀려 불명예 퇴진을 선택한 것으로 전해집니다.`,
  outlook:`수사 결과에 따라 엔비디아는 천문학적인 과징금을 부과받을 수 있으며, 미국 정부의 관리 감독 인력이 회사 내부에 상주하게 될 가능성도 제기됩니다. 뚜렷한 대체재가 없는 상황에서 글로벌 IT 기업들의 AI 인프라 구축 일정에 치명적인 차질이 발생할 전망입니다.`,
  sources:[{title:`Jensen Huang resigns as Nvidia CEO amid explosive US export probe - TechCrunch`,url:`https://techcrunch.com`},{title:`Nvidia's leadership crisis sends shockwaves through global AI supply chain - Mashable`,url:`https://mashable.com`}]
}]

  category:`경제`,

  colorBg:`#e8f0fe`,
  headline:`한국의 연간 누적 수출액이 1964년 이후 62년 만에 사상 처음으로 1조 달러를 돌파하며 세계 4번째로 1조 달러 클럽에 가입했습니다.`,
  metrics:[`누적 수출액 1조 달러 돌파`,`세계 4번째 가입`],
  summary:`한국의 연간 누적 수출액이 사상 처음으로 1조 달러를 돌파하는 쾌거를 이루었습니다. 이는 1964년 수출 1억 달러 달성 이후 62년 만에 이뤄낸 기념비적인 성과입니다. 반도체 수출 호조와 자동차 등 주력 산업의 선전이 이번 실적을 견인했습니다. 이로써 한국은 독일, 미국, 중국에 이어 세계 4번째로 1조 달러 클럽에 이름을 올리게 되었습니다. 글로벌 시장에서 한국 경제의 저력을 다시 한번 입증한 셈입니다. 다만 전문가들은 반도체 산업에 대한 높은 의존도를 낮추고 넥스트 반도체를 발굴하는 것이 시급하다고 지적하고 있습니다. 정부는 수출 다변화와 신성장 동력 육성에 더욱 박차를 가할 계획입니다.`,
  keyTerms:[{term:`1조 달러 클럽`,explanation:`연간 수출 규모가 1조 달러를 넘어서는 최상위 무역 국가들의 그룹으로, 글로벌 무역 강국임을 상징하는 지표입니다.`}],
  history:`한국은 1964년 처음으로 연간 수출 1억 달러를 달성하며 무역 국가로서의 기틀을 마련했습니다. 이후 제조업과 첨단 산업을 중심으로 눈부신 수출 성장을 거듭해 왔습니다. 최근에는 IT 인프라와 배터리, 반도체 수요 폭발이 성장을 주도했습니다.`,
  players:`삼성전자, 현대자동차 등 주요 대기업들이 수출 확대를 주도하고 있습니다. 한국개발연구원(KDI)과 산업통상자원부 등은 수출 지원 정책을 통해 뒤를 받치고 있습니다.`,
  current:`글로벌 경기 둔화 우려 속에서도 사상 최대 실적을 달성하며 한국 경제의 펀더멘털을 증명한 결정적 순간입니다. 하지만 특정 품목 쏠림 현상이 극심하다는 불안 요소도 함께 부각되고 있습니다.`,
  outlook:`향후 인공지능 열풍이 이어지며 당분간 반도체 중심의 수출 호조가 예상됩니다. 그러나 글로벌 공급망 재편과 보호무역주의 강화에 맞서 수출 품목을 어떻게 다변화할지가 내년도 경제의 핵심 과제입니다.`,
  sources:[{title:`한국, 연간 누적 수출 1조 달러 사상 첫 돌파 - 중앙일보`,url:`https://www.joongang.co.kr/`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`생성형 인공지능 클로드 개발사인 앤스로픽이 나스닥에 상장하며 첫날 시가총액 2조 달러를 넘기는 성공적인 데뷔를 마쳤습니다.`,
  metrics:[`공모가 83달러`,`시가총액 2조 달러 돌파`],
  summary:`대형 인공지능 기업인 앤스로픽이 미국 나스닥 시장에 화려하게 데뷔했습니다. 상장 첫날 주가는 공모가인 83달러를 크게 웃도는 111.50달러로 거래를 시작했습니다. 한때 장중 시가총액이 2조 달러를 돌파하며 역사상 가장 성공적인 초대형 AI 기업의 IPO 사례로 기록되었습니다. 이는 엔비디아 실적 발표 이후에도 여전한 시장의 인공지능 투자 열기를 보여줍니다. 장 후반 차익 실현 매물이 쏟아지며 97.17달러에 마감했지만, 시장의 기대감은 여전히 높습니다. 초기 투자에 나섰던 아마존과 구글은 물론 SK텔레콤 등 국내 기업들도 막대한 지분 평가 이익을 거두었습니다.`,
  keyTerms:[{term:`IPO`,explanation:`비상장 기업이 외부 투자자들에게 주식을 공개적으로 매도하여 주식시장에 처음 상장하는 기업공개 절차입니다.`}],
  history:`앤스로픽은 오픈에이아이(OpenAI) 출신 연구진이 독립하여 설립한 스타트업으로, 안전하고 신뢰할 수 있는 인공지능 개발을 목표로 성장했습니다. 클로드 모델을 연이어 성공시키며 빠르게 기업 가치를 키워왔습니다.`,
  players:`경쟁사인 오픈에이아이와 구글, 그리고 앤스로픽의 지분을 대거 보유한 아마존과 SK텔레콤 등이 주요 이해관계자입니다.`,
  current:`빅테크 기업들이 인공지능 인프라 구축에 천문학적인 자금을 쏟아붓는 가운데, 앤스로픽의 상장은 인공지능 산업의 수익성과 시장 가치를 평가하는 리트머스 시험지가 되고 있습니다.`,
  outlook:`향후 인공지능 관련 규제와 기술 경쟁이 심화됨에 따라 주가의 변동성은 커질 수 있습니다. 다음 분기 실적 발표에서 실제 수익 창출 능력을 얼마나 증명하느냐가 관건입니다.`,
  sources:[{title:`앤스로픽 나스닥 상장 데뷔 - 뉴스핌`,url:`https://www.newspim.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국의 근원 물가 상승 압력과 연준의 매파적 기조 우려로 다우지수가 5만 선 아래로 붕괴하며 뉴욕증시가 급락했습니다.`,
  metrics:[`다우지수 2.19% 하락`,`미 국채 10년물 5.07%`],
  summary:`뉴욕증시 3대 지수가 미국의 10월 근원 물가 압력과 고금리 우려로 인해 모두 2%대 급락세를 기록했습니다. 특히 다우지수는 2.19% 하락하며 상징적인 5만 선이 무너졌습니다. 인플레이션이 쉽게 잡히지 않을 것이라는 지표가 연이어 발표되면서 연방준비제도의 추가 긴축 경계감이 시장을 덮쳤습니다. 이로 인해 미 국채 10년물 금리는 5.07% 수준까지 치솟았고 달러 인덱스도 강세를 보였습니다. 투자자들 사이에서 고금리 장기화 우려가 확산되면서 안전자산인 금 가격마저 14개월 만에 최저치로 급락하는 등 자산 시장 전반이 요동치고 있습니다. 당분간 위험 자산 회피 심리가 글로벌 금융 시장을 지배할 것으로 보입니다.`,
  keyTerms:[{term:`고금리 장기화`,explanation:`물가 상승 압력을 억제하기 위해 중앙은행이 기준금리를 높은 수준으로 오랫동안 유지하는 통화 정책 기조를 의미합니다.`}],
  history:`미국 연방준비제도는 인플레이션을 목표치인 2%대로 되돌리기 위해 지속적으로 매파적 기조를 유지해왔습니다. 최근 물가 지표가 예상치를 상회하면서 금리 인하 기대감은 급격히 꺾였습니다.`,
  players:`미국 연방준비제도 제롬 파월 의장을 비롯한 주요 연준 인사들의 발언이 시장을 움직이고 있으며, 월가의 기관 투자자들은 금리 향방에 촉각을 곤두세우고 있습니다.`,
  current:`달러 강세와 국채 금리 상승이 맞물리면서 글로벌 자금 자산 이동이 급격하게 일어나고 있습니다. 특히 주식과 암호화폐 등 위험 자산의 하락폭이 큽니다.`,
  outlook:`오는 12월 열리는 연방공개시장위원회(FOMC) 회의에서 연준이 어떤 점도표를 제시할지가 최대 변수입니다. 물가 안정 여부에 따라 내년 초 글로벌 증시의 방향성이 결정될 것입니다.`,
  sources:[{title:`뉴욕증시 급락 및 달러 강세 부활 - 연합뉴스TV`,url:`https://www.yonhapnewstv.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`대법원이 비상계엄 사태와 관련해 한덕수 전 국무총리에게 파기환송 판결을 내리자 야당이 대법원장 탄핵을 추진하며 갈등이 격화하고 있습니다.`,
  metrics:[`대법원 무죄 취지 파기환송`,`조희대 대법원장 탄핵 추진`],
  summary:`대법원이 12.3 비상계엄 사태와 관련한 한덕수 전 국무총리의 내란 중요임무종사 혐의에 대해 무죄 취지로 파기환송 결정을 내렸습니다. 국무회의에서 계엄 건의에 참여한 것만으로는 내란죄를 엄격하게 물을 수 없다는 것이 대법원의 판단입니다. 이에 더불어민주당 등 야당은 사법부가 역사적 기회주의자를 옹호하고 있다며 강력히 반발했습니다. 야권은 곧바로 조희대 대법원장에 대한 탄핵 소추를 공식 추진하겠다고 선언했습니다. 반면 국민의힘은 사법정의의 승리라며 야당의 대법원장 탄핵 추진을 의회 쿠데타로 규정하고 맞서고 있습니다. 여야의 극한 대립으로 인해 정국이 급속도로 얼어붙으며 국회 일정도 파행을 겪고 있습니다.`,
  keyTerms:[{term:`파기환송`,explanation:`상급심 법원이 하급심의 판결을 취소하고, 사건을 다시 심리하여 재판하도록 원래의 하급 법원으로 돌려보내는 절차입니다.`}],
  history:`과거 12.3 비상계엄 사태 당시 정부 고위급 인사들의 내란 동조 여부는 한국 정치사에서 가장 첨예한 법적 논쟁거리 중 하나였습니다. 하급심에서는 일부 유죄가 인정되었으나 대법원에서 뒤집힌 것입니다.`,
  players:`탄핵을 주도하는 더불어민주당, 사법부를 방어하는 국민의힘, 그리고 판결의 중심에 선 조희대 대법원장과 한덕수 전 국무총리가 핵심 인물입니다.`,
  current:`예산안 심사와 주요 법안 처리가 시급한 상황에서 사법부 수장에 대한 초유의 탄핵 정국이 열리며 정치권이 마비 상태에 빠졌습니다.`,
  outlook:`대법원장 탄핵안이 실제로 국회 본회의에 상정될 경우 헌정 사상 유례없는 사법부 공백 사태가 벌어질 수 있습니다. 여야 간의 타협점을 찾기 전까지 정쟁은 계속될 전망입니다.`,
  sources:[{title:`대법원 한덕수 파기환송 - 한겨레`,url:`https://www.hani.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`중국 선전에서 열린 아펙 정상회의를 계기로 미국, 중국, 러시아 세 정상 간의 사상 첫 3자 정상회담이 성사되었습니다.`,
  metrics:[`미중러 3국 정상 참석`,`유럽 20개국 안보 회동`],
  summary:`중국 선전에서 열린 APEC 정상회의 일정 중 도널드 트럼프 미국 대통령, 시진핑 중국 국가주석, 블라디미르 푸틴 러시아 대통령이 한자리에 모였습니다. 이는 사상 첫 미중러 3자 정상회담으로 글로벌 정치 외교사에 큰 획을 그은 사건입니다. 세 정상은 우크라이나 및 중동 분쟁 해법, 글로벌 핵 군축, 무역 통상 현안 등 굵직한 국제 의제를 논의했습니다. 트럼프 대통령은 이 자리에서 우크라이나를 배제한 채 강대국들만의 밀실 종전 타결은 없을 것이라며 선을 그었습니다. 한편, 강대국 중심의 질서 재편을 우려한 유럽 20개국 정상들은 같은 날 독일 베를린에서 별도 긴급 회동을 열어 독자적인 안보 전선 구축을 결의했습니다. 이번 3자 회담은 다극화 시대의 새로운 지정학적 역학 관계를 극명하게 보여줍니다.`,
  keyTerms:[{term:`APEC 정상회의`,explanation:`아시아태평양 경제협력체 회원국 정상들이 매년 모여 역내 경제 성장과 무역 활성화 방안을 논의하는 주요 국제 다자회의입니다.`}],
  history:`최근 수년간 미중 패권 경쟁과 러시아의 우크라이나 침공으로 강대국 간의 관계는 냉전 이후 최악의 갈등 국면을 겪어왔습니다. 이번 회담은 갈등 완화의 돌파구를 찾기 위해 기획되었습니다.`,
  players:`미국의 트럼프 대통령, 중국의 시진핑 국가주석, 러시아의 푸틴 대통령이 회담의 주체이며, 이에 긴장하는 유럽연합(EU) 정상들이 외곽에서 움직이고 있습니다.`,
  current:`글로벌 안보의 축이 미국 단일 패권에서 다극 체제로 급격히 이동하고 있습니다. 주요국들은 자국의 실익을 극대화하기 위해 합종연횡을 거듭하는 중입니다.`,
  outlook:`이번 회담에서 도출된 원칙적인 합의들이 실질적인 분쟁 종식이나 제재 완화로 이어질지는 미지수입니다. 당분간 유럽과 강대국 간의 외교적 주도권 싸움이 치열해질 전망입니다.`,
  sources:[{title:`선전 아펙 계기 사상 첫 미중러 3자 담판 - 서울경제`,url:`https://www.sedaily.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 상무부가 주도하는 새로운 인공지능 반도체 및 데이터센터 장비의 대중국 수출 통제안이 공식적으로 발효되었습니다.`,
  metrics:[`11월 19일 공식 발효`,`첨단 AI 칩 우회 반입 통제`],
  summary:`미국 정부가 인공지능 기술 패권을 지키기 위해 내놓은 초강경 대중국 제재안이 19일부로 전면 발효되었습니다. 이번 수출 통제안은 첨단 인공지능 반도체뿐만 아니라 이를 구동하는 데이터센터 핵심 장비까지 포괄적으로 중국에 넘어가는 것을 차단합니다. 미 상무부는 제3국을 통한 우회 수출 경로까지 철저히 감시하겠다는 방침을 밝혔습니다. 미 의회 여야 역시 트럼프 행정부에 서한을 보내 중국의 기술 탈취 시도를 원천 봉쇄할 것을 강력히 촉구했습니다. 중국 외교부는 이에 대해 정상적인 기술 교류와 무역 질서를 훼손하는 패권주의적 행태라며 강하게 반발하고 나섰습니다. 양국 간의 기술 냉전이 반도체를 넘어 데이터센터 인프라 전반으로 확전되는 양상입니다.`,
  keyTerms:[{term:`수출 통제안`,explanation:`국가 안보나 전략적 이익을 보호하기 위해 자국의 특정 첨단 기술이나 물품이 경쟁국 등 외부로 유출되는 것을 법으로 제한하는 제도입니다.`}],
  history:`미국은 2022년부터 고성능 인공지능 칩의 중국 수출을 제한해 왔으나, 중국이 제3국을 통해 우회 수입하거나 자체 기술을 개발하자 규제망을 점차 좁혀왔습니다.`,
  players:`정책을 집행하는 미국 상무부와 백악관, 이에 대응하는 중국 정부, 그리고 직접적인 타격을 받는 글로벌 반도체 기업 엔비디아와 TSMC 등이 있습니다.`,
  current:`단순한 칩 단위의 제재를 넘어 인공지능 컴퓨팅 인프라 통째로 중국에 들어가는 것을 막기 위한 입체적인 통제망이 작동을 시작했습니다.`,
  outlook:`중국은 자체 반도체 자급률을 높이기 위한 국가적 투자를 더욱 가속할 것입니다. 한국 반도체 기업들도 미중 사이에서 수출 전략을 전면 재검토해야 하는 상황에 직면했습니다.`,
  sources:[{title:`미 대중 첨단 AI 칩 수출 규제 공식 발효 - 한국무역협회`,url:`https://www.kita.net/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`2027학년도 대학수학능력시험에서 스마트안경 등 첨단 기기를 이용한 부정행위가 다수 적발되어 응시 제한이 강화될 전망입니다.`,
  metrics:[`부정행위 의심 98명 적발`,`응시 제한 최장 10년 추진`],
  summary:`전국적으로 치러진 2027학년도 대학수학능력시험에서 스마트안경과 초소형 이어폰을 동원한 조직적인 부정행위 시도가 다수 적발되어 교육계에 충격을 주고 있습니다. 교육 당국에 따르면 렌즈에 초소형 카메라가 내장된 스마트안경을 착용하거나 위급재난문자 수신망을 해킹해 정답을 전달받으려 한 의심 사례가 총 98명에 달했습니다. 기술이 발전함에 따라 전통적인 금속탐지기나 육안 검사만으로는 이를 막기 역부족이라는 지적이 나옵니다. 이에 정부와 여당은 현행 1년인 수능 부정행위자 응시 제한 기간을 범죄의 중대성에 따라 최장 10년까지 연장하는 법안을 신속히 추진하기로 했습니다. 이번 사태를 계기로 시험장 내 모든 전파를 차단하는 방안까지 본격적으로 논의되고 있습니다.`,
  keyTerms:[{term:`스마트안경`,explanation:`일반 안경과 비슷한 겉모습을 가졌으나 초소형 카메라와 통신 기능이 내장되어 있어 영상 전송과 실시간 소통이 가능한 웨어러블 전자기기입니다.`}],
  history:`수능 부정행위는 과거 지우개폰이나 휴대전화 반입 수준이었으나, 웨어러블 기기와 초소형 사물인터넷 기기의 보급으로 점차 고도화되고 지능화되어 왔습니다.`,
  players:`부정행위를 막으려는 교육부 및 한국교육과정평가원과, 갈수록 진화하는 첨단 장비를 판매 및 악용하는 조직들이 대립하고 있습니다.`,
  current:`시험의 공정성이 뿌리째 흔들릴 수 있다는 사회적 위기감이 커지면서, 시험 방식과 감시 체계를 근본적으로 뜯어고쳐야 한다는 목소리가 높습니다.`,
  outlook:`내년 모의평가부터는 시험장 내 전파 차단기 도입 시범 운영이 검토될 것으로 보입니다. 처벌 강화를 골자로 한 관련 법안도 곧 국회 문턱을 넘을 예정입니다.`,
  sources:[{title:`2027학년도 수능 및 첨단 부정행위 적발 - 중앙일보`,url:`https://www.joongang.co.kr/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`미국 정부가 자국 기업들이 비용 절감을 위해 저렴한 중국산 오픈웨이트 인공지능 모델을 몰래 사용하는 것을 견제하고 나섰습니다.`,
  metrics:[`중국산 오픈웨이트 AI 확산`,`사용 의무 공시 방안 논의`],
  summary:`글로벌 IT 기업들 사이에서 비용 절감을 위해 성능이 뛰어나면서도 가격이 저렴한 딥시크 등 중국산 오픈웨이트 AI 모델을 자체 서비스에 연동하는 사례가 늘고 있습니다. 이에 미국 정부가 심각한 안보 위협을 느끼고 강력한 견제 조치 마련에 착수했습니다. 상무부를 비롯한 관계 부처는 에어비앤비 등 미국 기업이 자사 서비스 뒷단에 중국산 인공지능 모델을 도입할 경우, 이를 사용자에게 의무적으로 공시하도록 하는 규정을 검토 중입니다. 정보 유출의 위험을 방지하고 미국 내 인공지능 생태계의 중국 의존도를 낮추겠다는 취지입니다. 실리콘밸리 기업들은 비용 효율화와 규제 사이에서 깊은 딜레마에 빠지게 되었습니다. 향후 기업 공시 의무화가 현실화될 경우 관련 업계의 인프라 재편이 불가피할 전망입니다.`,
  keyTerms:[{term:`오픈웨이트 AI`,explanation:`개발자가 내부 신경망 가중치 데이터를 무료로 투명하게 공개하여 누구나 자유롭게 가져다 쓰고 수정할 수 있는 인공지능 모델입니다.`}],
  history:`최근 1~2년 사이 중국 테크 기업들은 막대한 정부 지원을 바탕으로 오픈소스 형태의 인공지능 모델을 공격적으로 배포하며 글로벌 시장 점유율을 늘려왔습니다.`,
  players:`비용 절감을 원하는 미국의 소프트웨어 기업들과 국가 안보를 최우선으로 내세우는 미국 연방 정부, 그리고 인공지능 모델을 수출하는 중국의 알리바바 등 빅테크들입니다.`,
  current:`성능 격차가 줄어든 상황에서 가격 경쟁력이 압도적인 중국산 모델이 실리콘밸리에 은밀히 침투하면서 정책 입안자들의 경계심이 최고조에 달했습니다.`,
  outlook:`미국 의회는 연내에 관련 청문회를 개최하고 공시 의무화 법안 초안을 발표할 계획입니다. 이에 따라 미국과 중국 간의 소프트웨어 생태계 디커플링이 더욱 가속화될 것입니다.`,
  sources:[{title:`미국 자국 기업 중국산 AI 사용 공시 추진 - 연합뉴스`,url:`https://www.yna.co.kr/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`27년 동안 우주에서 지구 환경의 변화를 관측해 온 미 항공우주국의 전설적인 지구 관측 위성 테라가 공식적으로 퇴역했습니다.`,
  metrics:[`27년 임무 수행 완료`,`지구 궤도 10만 바퀴 공전`],
  summary:`미국 항공우주국(NASA)의 가장 대표적인 지구 관측 위성인 테라(Terra)가 27년간의 긴 여정을 마치고 공식적으로 임무를 종료했습니다. 1999년에 발사된 테라는 당초 설계 수명이었던 6년을 훌쩍 뛰어넘어 27년 동안 지구 궤도를 10만 바퀴 이상 돌았습니다. 이 위성은 전 세계의 산림 벌채, 해수면 온도 변화, 대기 오염 수준을 실시간으로 추적하며 기후 변화 연구에 헤아릴 수 없는 공헌을 남겼습니다. 임무 종료에 따라 테라 위성은 서서히 고도를 낮춰 대기권에 진입한 뒤 안전하게 불타 사라질 예정입니다. 전 세계 과학계는 테라가 남긴 방대한 데이터가 앞으로도 수십 년간 기후 위기 극복의 중요한 연구 자산이 될 것이라며 경의를 표하고 있습니다. 테라의 빈자리는 곧 최신 차세대 관측 위성 시스템이 대체하게 됩니다.`,
  keyTerms:[{term:`지구 관측 위성`,explanation:`우주 궤도에서 지구의 대기, 해양, 육지 등의 환경 변화와 자원 데이터를 지속적으로 수집하여 기후 연구와 재난 대응에 기여하는 인공위성입니다.`}],
  history:`1990년대 후반 우주에서 지구 시스템 전체를 통합적으로 모니터링하기 위한 나사의 지구관측시스템(EOS) 프로젝트의 일환으로 테라 위성이 가장 먼저 쏘아 올려졌습니다.`,
  players:`미 항공우주국(NASA)이 위성의 운영과 데이터 배포를 주도해 왔으며, 전 세계 기상청과 기후 과학자들이 이 데이터를 매일 연구에 활용했습니다.`,
  current:`위성의 노후화로 인해 궤도 유지에 필요한 연료가 바닥나면서 더 이상의 관측 임무 수행이 불가능해져 영광스러운 퇴역을 맞이하게 되었습니다.`,
  outlook:`나사는 테라의 뒤를 이어 인공지능과 초정밀 센서를 탑재한 새로운 관측 위성 네트워크(ESO) 구축에 주력하며 우주 관측의 세대교체를 완성할 예정입니다.`,
  sources:[{title:`나사 테라 위성 27년 임무 종료 - 다음뉴스`,url:`https://www.daum.net/`}]
}]

  tag:`2026-11-19`,
  label:`2026년 11월 19일 (목)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국개발연구원이 반도체 호황을 반영해 내년 경제성장률 전망치를 3.9%로 상향 조정했습니다.`,
  metrics:[`내년 경제성장률 전망치 3.9%`,`가구당 월 2,000원 수준 에너지 요금 인상 검토`],
  summary:`한국개발연구원(KDI)이 내년 우리나라의 경제성장률 전망치를 기존보다 높은 3.9%로 상향 조정했습니다. 이는 글로벌 반도체 초호황에 따른 수출 증가와 설비투자 확대가 주된 원인으로 분석됩니다. KDI는 대외 불확실성에도 불구하고 IT 수출 호조가 경제 전반의 회복세를 이끌 것으로 내다봤습니다. 다만, 수출 호조와는 별개로 내수 회복 속도는 여전히 더딜 수 있다는 점을 지적했습니다. 또한 근원물가 상승 압력이 지속될 수 있어 통화긴축 기조를 신중하게 유지하면서도 거시경제 안정을 도모해야 한다고 조언했습니다. 이를 위해 정부와 중앙은행의 정교한 재정 및 통화 정책 폴리시 믹스가 필수적인 상황입니다.`,
  keyTerms:[{term:`통화긴축 기조`,explanation:`중앙은행이 시중의 돈을 거둬들이고 금리를 높여 물가를 안정시키는 정책 방향을 의미합니다.`}],
  history:`최근 2년간 고물가와 고금리가 겹치면서 한국 경제는 수출과 내수 사이의 극심한 불균형을 겪어왔습니다. 반도체 사이클이 바닥을 찍고 반등하면서 거시 지표는 개선되었으나 체감 경기는 여전히 냉랭합니다. 정부는 경기 부양과 물가 안정이라는 두 마리 토끼를 잡아야 하는 딜레마에 빠져 있습니다.`,
  players:`주요 행위자로는 거시 경제 전망을 주도하는 한국개발연구원(KDI)과 통화 정책을 결정하는 한국은행이 있습니다. 또한 재정을 집행하는 기획재정부 역시 핵심적인 역할을 담당하고 있습니다.`,
  current:`글로벌 빅테크의 AI 투자 확대가 국내 반도체 수출을 견인하며 지표상 성장률을 밀어 올리고 있습니다. 하지만 가계 부채 부담과 부동산 시장 위축이 겹쳐 내수 소비가 좀처럼 살아나지 못하는 전환점에 서 있습니다.`,
  outlook:`향후 한국은행의 기준금리 인하 시점과 그 폭이 경제 전반에 가장 큰 변수가 될 것입니다. 아울러 정부가 준비 중인 내수 진작 및 취약계층 지원 대책의 실효성 여부도 주시해야 합니다.`,
  sources:[{title:`KDI, 경제성장률 전망 상향 - 한국경제`,url:`https://hankyung.com/economy`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`수출 호조와 달리 내수 부진이 장기화되면서 식음료 및 유통 업계의 인력 감축이 확산되고 있습니다.`,
  metrics:[`식음료·주류 업계 2년 연속 희망퇴직`,`가구·인테리어 업계 실적 동반 침체`],
  summary:`최근 우리나라 거시경제 지표는 수출 중심으로 호조를 보이고 있지만, 내수 시장은 꽁꽁 얼어붙은 상태입니다. 원자재 가격 등 원가 상승과 소비 심리 위축이 겹치면서 내수 의존도가 높은 식음료와 주류 업계가 직격탄을 맞았습니다. 이에 따라 주요 기업들은 고정비를 줄이기 위해 2년 연속으로 희망퇴직을 실시하는 등 대대적인 인력 감축에 나서고 있습니다. 부동산 거래 절벽 현상까지 맞물리면서 가구 및 인테리어 업계 역시 실적 악화와 구조조정이라는 이중고를 겪는 중입니다. 이러한 체감 경기의 악화는 서민 경제의 어려움을 가중시키고 있으며, 일자리 불안으로 이어지고 있습니다. 결과적으로 내수 활성화를 위한 정부의 미시적 지원 대책 마련이 시급하다는 목소리가 커지고 있습니다.`,
  keyTerms:[{term:`희망퇴직`,explanation:`기업이 인건비 절감 등을 위해 근로자에게 퇴직금 등의 보상을 제시하고 자발적인 퇴직을 유도하는 제도입니다.`}],
  history:`과거 팬데믹 특수로 반짝 호황을 누렸던 내수 기업들은 이후 찾아온 글로벌 인플레이션과 공급망 차질로 인해 급격한 원가 압박에 시달려왔습니다. 물가는 올랐지만 실질 소득이 줄어든 소비자들은 지갑을 닫았고, 이는 기업의 수익성 악화로 직결되었습니다.`,
  players:`대형 식음료 제조사, 프랜차이즈 기업, 가구 유통업체들이 구조조정의 중심에 있습니다. 반대편에는 일자리를 위협받는 노동자들과 이들의 고용을 안정시켜야 하는 고용노동부 등 정부 부처가 존재합니다.`,
  current:`기업들은 신규 채용을 동결하고 기존 인력마저 줄이며 생존을 위한 군살 빼기에 돌입했습니다. 소비 침체의 골이 깊어지면서 단기적인 실적 반등을 기대하기 어려운 상황입니다.`,
  outlook:`연말연시 대규모 할인 행사 등 소비 진작책이 어느 정도 효과를 거둘지가 단기적인 관건입니다. 장기적으로는 금리 인하에 따른 가처분 소득 증가와 주택 거래량 회복 여부를 지켜봐야 합니다.`,
  sources:[{title:`내수 부진 여파… 유통가 인력 감축 바람 - 다음뉴스`,url:`https://news.daum.net/economy`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`트럼프 행정부의 보호무역주의 회귀 우려 속에서 시진핑 중국 국가주석이 APEC 회의를 통해 자유무역 수호를 촉구했습니다.`,
  metrics:[`미국 제3국 데이터센터 첨단 칩 수출 통제`,`캐나다-중국 농수산물 관세 완화 확대`],
  summary:`아시아태평양경제협력체(APEC) 정상회의에서 시진핑 중국 국가주석이 역내 개방형 무역과 디지털 협력을 강력히 촉구했습니다. 이는 미국의 정권 교체 이후 예상되는 고강도 관세 장벽과 무역 규제에 맞서 다자간 자유무역 체제를 방어하려는 중국의 전략적 행보로 풀이됩니다. 미국 상무부는 최근 중국의 우회 접근을 막기 위해 제3국 데이터센터 사업자에게도 AI 칩 수출 라이선스를 의무화하는 등 기술 통제를 한층 강화했습니다. 반면 중국은 미국의 동맹국인 캐나다와 농수산물 및 철강 관세 인하에 전격 합의하며 경제 외교의 틈새를 파고들고 있습니다. 이러한 강대국 간의 패권 경쟁과 이합집산은 글로벌 공급망의 불확실성을 최고조로 끌어올리고 있습니다. 앞으로 각국은 자국 우선주의와 실용주의 사이에서 복잡한 줄다리기를 이어갈 전망입니다.`,
  keyTerms:[{term:`자유무역 체제`,explanation:`국가 간에 물품을 수출입할 때 관세나 수입 제한 등의 장벽을 최소화하여 자유롭게 교역하는 경제 시스템을 뜻합니다.`}],
  history:`미국과 중국의 패권 경쟁은 무역 관세 전쟁으로 시작해 최근 반도체와 인공지능 등 첨단 기술 분야로 전장이 확대되었습니다. 특히 미국은 동맹국들을 규합해 중국을 배제하는 공급망 재편을 강력하게 추진해왔습니다.`,
  players:`자국 우선주의를 앞세우는 미국 정부와 이에 맞서 다자주의를 강조하는 중국 정부가 핵심 플레이어입니다. 그 사이에서 캐나다, 유럽연합 등 중견국들은 국익에 따라 유연하게 대응하고 있습니다.`,
  current:`미국은 기술 수출 통제의 고삐를 더욱 조이고 있으며, 중국은 제재를 우회하기 위해 우방국 확보 및 비미국권 국가들과의 개별 협상에 총력을 다하고 있습니다.`,
  outlook:`향후 미국의 대중국 관세 인상 폭과 대상이 구체화됨에 따라 글로벌 경제의 충격파가 가시화될 것입니다. 신흥국들은 양국 사이에서 선택을 강요받는 외교적 시험대에 오를 전망입니다.`,
  sources:[{title:`APEC 정상회담 및 미·중 무역 갈등 - AP News`,url:`https://apnews.com/economy`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`아시아태평양경제협력체(APEC) 정상회의 환영 만찬에서 한·러 정상이 7년 만에 대면 접촉을 가졌습니다.`,
  metrics:[`한·러 정상 7년 만의 대면 조우`,`한·중 FTA 서비스 투자 후속 협상 실질 타결`],
  summary:`중국 선전에서 열린 APEC 환영 만찬을 계기로 이재명 대통령과 블라디미르 푸틴 러시아 대통령이 짧지만 의미 있는 대면 접촉을 가졌습니다. 양국 정상의 조우는 무려 7년 만에 이루어진 것으로, 최근 급박하게 돌아가는 동북아시아 외교 무대에서 큰 주목을 받았습니다. 이 자리에서 두 정상은 우크라이나 사태 이후 소원해진 양국 관계를 관리하고, 한반도의 긴장 완화와 정세 악화 방지를 위한 최소한의 소통 필요성에 공감한 것으로 알려졌습니다. 특히 북한과 러시아의 군사 밀착이 가속화되는 가운데 한국이 러시아 측에 우려를 전달할 수 있는 계기가 마련되었다는 평가가 나옵니다. 이번 만남이 당장의 획기적인 관계 개선으로 이어지기는 어렵겠지만, 극한 대립을 피하기 위한 외교적 안전판 역할을 할 수 있을지 기대됩니다. 향후 다자회의를 무대로 한 강대국들의 정상 외교전은 더욱 치열해질 것입니다.`,
  keyTerms:[{term:`다자회의`,explanation:`세 개 이상의 국가가 모여 공통의 관심사나 국제 현안을 논의하고 협력 방안을 모색하는 국제회의입니다.`}],
  history:`과거 비교적 원만한 관계를 유지하던 한·러 관계는 러시아의 우크라이나 침공 이후 한국이 서방의 대러 제재에 동참하면서 급격히 얼어붙었습니다. 이후 북한과 러시아가 군사 조약을 맺으며 긴장감이 더욱 고조되었습니다.`,
  players:`대북 억지력을 유지해야 하는 한국 정부와 동북아시아에서 영향력을 확대하려는 러시아 정부가 주요 당사자입니다. 그 배후에는 양국의 행보를 예의주시하는 미국과 중국이 자리 잡고 있습니다.`,
  current:`북한의 잇따른 도발과 러시아와의 무기 거래 정황 속에서 한반도의 지정학적 리스크가 매우 높아진 상태입니다. 한국은 제재에 동참하면서도 러시아와의 완전한 단절은 피하려는 투트랙 전략을 쓰고 있습니다.`,
  outlook:`향후 북한에 대한 러시아의 구체적인 군사 기술 이전 여부가 한·러 관계의 향방을 가를 핵심 분수령이 될 것입니다. 아울러 다가오는 미국 새 행정부의 대러시아 정책 변화도 주요 변수입니다.`,
  sources:[{title:`한·러 정상 7년 만에 대면 - 한국경제`,url:`https://hankyung.com/politics`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`정치권의 격렬한 대치 속에 이른바 조작기소 특검법이 대통령 재가를 거쳐 공식적으로 공포되었습니다.`,
  metrics:[`순방 중 대통령 전자결재 재가 완료`,`여당의 특검 후보 추천 거부 방침 고수`],
  summary:`야당 주도로 국회를 통과한 이른바 조작기소 특검법이 해외 순방 중인 대통령의 전자결재 재가를 거쳐 19일 관보에 공식 공포되었습니다. 이 법안은 과거 주요 정치적 사건에 대한 검찰의 기소 과정에 외압이나 조작이 있었는지를 특별검사가 수사하도록 하는 내용을 담고 있습니다. 법안이 즉시 시행됨에 따라 정국은 한 치 앞을 내다볼 수 없는 격랑 속으로 빠져들고 있습니다. 국민의힘 등 여당은 강하게 반발하며 특검 후보 추천 자체를 거부하겠다는 입장을 고수하고 있어, 실제 특검 출범까지는 상당한 진통이 예상됩니다. 반면 야당은 성역 없는 수사를 촉구하며 대여 공세의 수위를 한층 끌어올리고 있습니다. 이번 특검법 시행은 다가오는 주요 선거와 맞물려 정국의 가장 폭발력 있는 뇌관으로 작용할 전망입니다.`,
  keyTerms:[{term:`조작기소 특검법`,explanation:`특정 사건의 수사 및 기소 과정에서 부당한 개입이나 증거 조작이 있었는지 밝히기 위해 독립적인 특별검사를 임명하는 법률입니다.`}],
  history:`정치적 쟁점이 된 여러 과거 사건들을 두고 야당은 수사 기관의 정치적 편향성과 표적 수사 의혹을 지속적으로 제기해 왔습니다. 반면 여당은 이를 정치 공세로 규정하며 평행선을 달려왔습니다.`,
  players:`특검법을 강행 처리한 거대 야당과 이에 맞서 방어선을 구축하려는 정부 및 여당이 극렬하게 대립하고 있습니다. 향후 수사 대상이 될 전·현직 법조계 인사들도 깊이 연관되어 있습니다.`,
  current:`대통령의 거부권 행사 여부를 두고 줄다리기를 하던 끝에 결국 법안이 공포되면서 정국은 완전히 얼어붙었습니다. 여당의 후보 추천 지연 전술로 특검 구성 절차부터 난항을 겪고 있습니다.`,
  outlook:`실제 특별검사가 임명되고 수사팀이 꾸려지기까지 여야의 치열한 법적, 정치적 공방이 예상됩니다. 수사 결과에 따라 정계 개편이나 지지율에 엄청난 후폭풍이 불어닥칠 것입니다.`,
  sources:[{title:`조작기소 특검법 공포, 즉시 시행 - 중앙일보`,url:`https://joongang.co.kr/politics`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 하원 민주당이 하킴 제프리스 의원을 차기 하원의장 후보로 만장일치 지명했습니다.`,
  metrics:[`민주당 차기 하원의장 후보 지명`,`미 역사상 최초의 흑인 하원의장 가능성`],
  summary:`미국 연방 하원 민주당이 차기 원내 사령탑이자 하원의장 후보로 하킴 제프리스 의원을 공식 지명했습니다. 중간선거 이후 복잡해진 의회 지형 속에서 민주당은 내부 결속을 다지며 발 빠르게 지도부 인선을 마무리 지었습니다. 내년 1월 열리는 의회 본투표에서 제프리스 의원이 당선될 경우, 미국 정치 역사상 최초의 흑인 하원의장이 탄생하는 셈이어서 그 상징성이 매우 큽니다. 현재 공화당과의 의석수 차이가 크지 않아 향후 입법 과정에서 양당 간의 치열한 기싸움이 불가피한 상황입니다. 제프리스 의원은 지명 직후 초당적 협력을 강조하면서도 민주당의 핵심 가치를 지켜내겠다는 강력한 의지를 표명했습니다. 이는 차기 행정부의 주요 정책에 대한 강력한 견제 장치로 작용할 가능성이 커, 워싱턴 정가의 권력 역학 관계에 새로운 긴장감을 불어넣고 있습니다.`,
  keyTerms:[{term:`중간선거`,explanation:`대통령의 임기 중간에 실시되는 선거로, 상하원 의원 등을 선출하며 현직 대통령의 국정 운영에 대한 중간 평가 성격을 띱니다.`}],
  history:`오랜 기간 민주당 하원을 이끌어온 낸시 펠로시 전 의장의 시대가 저물면서, 민주당은 세대 교체와 함께 당의 새로운 정체성을 확립해야 하는 과제를 안고 있었습니다. 제프리스 의원은 이 과정에서 당내 신망을 두루 얻었습니다.`,
  players:`민주당의 새 리더인 하킴 제프리스 의원과 하원 다수당 지위를 놓고 팽팽히 맞서는 공화당 지도부가 핵심 인물입니다. 나아가 이들의 결정은 미 대통령의 국정 동력과 직결됩니다.`,
  current:`선거 결과 양당의 하원 의석수 차이가 매우 근소하게 벌어지면서, 소수의 반란표만으로도 법안 처리가 무산될 수 있는 살얼음판 정국이 펼쳐져 있습니다.`,
  outlook:`내년 초 열릴 하원의장 본투표에서 공화당 내부 이탈표 향방에 따라 최종 승자가 결정될 것입니다. 의장 선출 이후에는 예산안 처리와 주요 정책 입법을 둘러싼 여야의 극한 대립이 예상됩니다.`,
  sources:[{title:`미 민주당, 차기 하원의장으로 하킴 제프리스 지명 - Axios`,url:`https://axios.com/politics`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`국가 주요 시험에서 초소형 기기와 생성형 인공지능을 결합한 신종 부정행위가 적발되어 파문이 일고 있습니다.`,
  metrics:[`빅테크 데이터 보관 기간 단 30일`,`주요 국가 자격시험 부정행위 적발 건수 급증`],
  summary:`법학적성시험(LEET)과 대학수학능력시험 등 국가 주관 주요 시험에서 생성형 인공지능을 활용한 부정행위 의혹이 잇따라 터져 나왔습니다. 수험생들이 초소형 무선 이어폰과 카메라가 장착된 스마트 안경을 이용해 외부의 AI 모델과 실시간으로 통신하며 정답을 전달받은 정황이 포착된 것입니다. 이에 정부와 평가 당국은 통신사 접속 이력 조회 및 해외 빅테크 기업의 AI 사용 기록 분석을 통한 사후 적발 대책을 서둘러 내놓았습니다. 하지만 해외 빅테크 서버의 데이터 보관 기간이 30일에 불과하고 국제 공조에 현실적인 한계가 있어 대책의 실효성을 두고 비판이 쏟아지고 있습니다. 첨단 기술이 평가 시스템의 근간인 공정성을 위협하면서, 시험 감독 방식의 근본적인 혁신이 요구되고 있습니다. 향후 시험장 내 전파 차단이나 AI 탐지기 도입 등 보다 물리적이고 즉각적인 방어책 마련이 시급한 과제로 떠올랐습니다.`,
  keyTerms:[{term:`생성형 인공지능`,explanation:`사용자의 질문이나 요구에 따라 텍스트, 이미지, 오디오 등 새로운 콘텐츠를 스스로 만들어내는 진화된 AI 기술입니다.`}],
  history:`과거의 부정행위가 쪽지나 대리 시험 수준이었다면, 모바일 기기의 발달과 챗GPT 같은 초거대 AI 모델의 등장으로 그 수법이 점차 고도화되고 지능화되어 왔습니다.`,
  players:`공정한 시험 관리를 책임지는 교육부 및 평가 기관, 그리고 첨단 기기를 오용하는 일부 수험생들이 존재합니다. 수사 협조를 받아야 하는 해외 빅테크 기업들도 간접적인 행위자입니다.`,
  current:`기존의 금속 탐지기나 육안 감독만으로는 안경테에 삽입된 카메라나 귓속 깊숙이 들어가는 무선 이어폰을 적발하기가 사실상 불가능해져 당국이 큰 골머리를 앓고 있습니다.`,
  outlook:`정부는 향후 시험장에 고성능 전파 차단기를 시범 도입하고, 수험생의 이상 행동을 자동 감지하는 지능형 CCTV 모니터링 시스템 구축을 적극적으로 검토할 예정입니다.`,
  sources:[{title:`국가시험 뒤흔드는 AI 부정행위 - 동아일보`,url:`https://donga.com/society`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`국내 공공기관과 기업에서 널리 쓰이는 자바 기반 시스템에서 치명적인 보안 취약점이 발견되어 긴급 대응에 나섰습니다.`,
  metrics:[`국가 인프라 긴급 보안 패치 발령`,`국내 대다수 행정·기업 전산망 위험 노출`],
  summary:`국내 행정기관과 민간 기업들의 핵심 IT 인프라를 구성하는 자바(Java) 및 OpenJDK 환경에서 매우 치명적인 보안 취약점이 발견되었습니다. 해당 취약점을 악용할 경우 해커가 원격으로 시스템 관리자 권한을 탈취하거나 대규모 랜섬웨어 공격을 감행할 수 있어 사태의 심각성이 큽니다. 과학기술정보통신부와 한국인터넷진흥원(KISA)은 국가 전산망 마비라는 최악의 시나리오를 막기 위해 즉각적인 긴급 패치와 보안 업데이트를 권고하는 주의보를 발령했습니다. 현재 다수의 공공기관과 금융권, IT 기업들이 주말을 반납하고 시스템 긴급 점검과 업데이트 작업에 총력을 기울이고 있습니다. 이번 사태는 오픈소스 소프트웨어에 대한 과도한 의존이 국가적 사이버 안보 위협으로 직결될 수 있음을 극명하게 보여줍니다. 정부는 향후 오픈소스 취약점에 대비한 상시 모니터링 체계와 신속 복구 가이드라인을 재정비할 방침입니다.`,
  keyTerms:[{term:`보안 취약점`,explanation:`소프트웨어나 하드웨어 설계상의 결함으로, 해커가 이를 통해 시스템에 무단으로 침입하거나 피해를 줄 수 있는 약점을 말합니다.`}],
  history:`과거 로그포제이(Log4j) 사태에서 보듯, 전 세계적으로 널리 쓰이는 기본 프로그래밍 언어나 오픈소스 라이브러리에서 취약점이 발견될 경우 그 파급력은 상상을 초월해 왔습니다.`,
  players:`취약점을 탐지하고 대응 지침을 내리는 한국인터넷진흥원(KISA) 및 과기정통부, 그리고 자사 시스템을 사수해야 하는 기업 보안 담당자들이 밤낮없이 대응 중입니다.`,
  current:`개발 단계에서 파편화되어 사용된 자바 버전을 일일이 찾아내어 업데이트하는 작업 자체가 상당한 시간과 인력을 요구하여 현장의 피로도가 극에 달해 있습니다.`,
  outlook:`단기적으로는 이번 취약점을 노린 제로데이 공격 시도가 급증할 것으로 보이며, 중장기적으로는 국가 차원의 소프트웨어 자재 명세서(SBOM) 도입이 의무화될 가능성이 높습니다.`,
  sources:[{title:`공공·기업 자바 취약점 비상 - 테크데일리`,url:`https://techdaily.co.kr/it`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`글로벌 연구진이 상온 초전도체의 전자 쌍 형성 메커니즘을 규명할 결정적 단서를 포착해 과학계가 들썩이고 있습니다.`,
  metrics:[`상온 조건 전기 저항 0 유도 물리적 실마리 포착`,`완전히 새로운 양자 스핀 모델 연구 적용`],
  summary:`전 세계 물리학계의 오랜 숙원인 상온 초전도체 개발에 획기적인 전환점이 될 새로운 연구 결과가 발표되었습니다. 다국적 공동 연구진은 극한의 저온이나 초고압 환경이 아닌 상온 조건에서도 전기 저항이 0으로 수렴할 수 있는 특정 전자 쌍 형성 메커니즘의 물리적 실마리를 포착하는 데 성공했습니다. 과거 수차례 논란이 되었던 재현성 문제를 극복하기 위해 이번 연구는 완전히 새로운 양자 스핀 모델을 적용해 실험적 오차를 줄인 것이 특징입니다. 이 발견이 상용화 단계로 이어질 경우, 송전망의 에너지 손실을 완전히 없애고 자기부상열차와 차세대 양자 컴퓨터 개발을 비약적으로 앞당길 수 있습니다. 물론 실제 소재 합성과 대량 생산까지는 아직 수많은 난관이 남아 있어 학계는 신중한 태도를 보이고 있습니다. 그럼에도 불구하고 에너지 혁명을 향한 인류의 도전에 다시 한번 거대한 불씨를 지폈다는 점에서 그 의미가 매우 큽니다.`,
  keyTerms:[{term:`전자 쌍 형성 메커니즘`,explanation:`초전도 현상을 일으키기 위해 전자들이 서로 밀어내지 않고 짝을 이루어 저항 없이 이동하게 만드는 물리적 원리를 의미합니다.`}],
  history:`초전도 현상은 보통 영하 200도 이하의 극저온에서만 나타나 상용화에 큰 제약이 있었습니다. 최근 몇 년간 상온 초전도체를 개발했다는 주장이 여러 번 제기되었으나 대부분 재현에 실패하며 해프닝으로 끝났습니다.`,
  players:`초전도 물질을 설계하고 합성하는 물리학 및 재료공학 다국적 연구진들과, 이를 검증하고 평가하는 세계 최고 권위의 학술지 및 피어 리뷰어들이 참여하고 있습니다.`,
  current:`이번 연구는 기존의 실패 사례들을 반면교사 삼아 이론적 토대를 탄탄히 다지고 교차 검증의 투명성을 대폭 높인 상태에서 발표되어 학계의 큰 주목을 받고 있습니다.`,
  outlook:`향후 독립적인 제3의 연구 기관들에서 이 실험 결과를 완벽하게 재현해 낸다면, 노벨상 수상은 물론 전 세계적인 초전도체 투자 붐이 다시 거세게 일어날 것입니다.`,
  sources:[{title:`상온 초전도체 메커니즘 단서 포착 - ScienceDaily`,url:`https://sciencedaily.com/science`}]
}]

  tag:`2026-11-18`,
  label:`2026년 11월 18일 (수)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`IMF, 반도체 수출 호조를 반영해 한국의 2026년 경제성장률 전망치를 3.9%로 대폭 상향 조정했습니다.`,
  metrics:[`2026년 경제성장률 전망치 3.9%`,`3분기 민간소비 증감률 -0.2%`],
  summary:`국제통화기금(IMF)이 2026년 한국의 경제성장률 전망치를 기존 3.3%에서 3.9%로 상향 발표했습니다. 이는 글로벌 AI 열풍에 따른 HBM 및 메모리 반도체 수출의 기록적인 폭증이 주요 원인입니다. 반도체 산업의 호황 덕분에 한국의 연간 수출액은 사상 최초로 1조 달러 돌파를 눈앞에 두고 있습니다. 하지만 화려한 수출 지표 이면에는 어두운 그림자도 존재합니다. 3분기 민간소비는 오히려 -0.2% 역성장하며 수출 기업과 내수 경제 간의 양극화 현상인 K자형 성장이 뚜렷하게 나타나고 있습니다. 정부와 한국은행은 잠재성장률을 웃도는 지표 속에서도 내수 침체를 우려해 통화정책 완화 시기를 고심하고 있습니다. 반도체가 이끄는 성장이 언제쯤 가계 소비 여력 확대로 이어질지 시장의 관심이 집중되고 있습니다.`,
  keyTerms:[{term:`K자형 성장`,explanation:`경제 회복 과정에서 특정 산업이나 계층은 빠르게 성장하지만, 다른 부문은 침체를 겪으며 양극화가 심화되는 현상을 알파벳 K의 모양에 빗대어 부르는 말입니다.`}],
  history:`2024년부터 본격화된 AI 반도체 수요가 2026년까지 이어지며 한국 수출 실적을 견인해왔습니다. 반면 고금리 장기화로 가계 부채 부담이 커지며 내수 시장은 침체를 겪어왔습니다.`,
  players:`수출 호황을 누리는 삼성전자, SK하이닉스 등 대기업과 반대로 소비 부진의 직격탄을 맞는 자영업자 및 소상공인이 극명히 대비되고 있습니다. 물가를 관리해야 하는 한국은행의 딜레마도 커지고 있습니다.`,
  current:`헤드라인 경제 지표와 체감 경기의 괴리가 역사상 가장 크게 벌어진 상황으로 평가받고 있습니다. 정부의 재정 투입이나 내수 진작책이 시급하다는 목소리가 높습니다.`,
  outlook:`연말 한국은행의 기준금리 결정과 내년도 예산안 국회 통과 과정에서 내수 부양을 위한 구체적인 핀셋 정책이 나올지 주목됩니다.`,
  sources:[{title:`IMF 한국 성장률 3.9% 상향... 반도체 수출 견인 - 연합뉴스`,url:`https://m.yna.co.kr/view/20261117`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 인플레이션이 관세와 에너지 가격 상승 여파로 3.4%에 머물며 연준의 추가 금리 인상 가능성이 커졌습니다.`,
  metrics:[`근원 PCE 인플레이션 3.4%`,`12월 금리 25bp 인상 확률 75%`],
  summary:`미국의 핵심 개인소비지출(PCE) 물가지수가 3.4%를 기록하며 연방준비제도(Fed)의 목표치인 2%를 크게 웃돌고 있습니다. 중동 지역의 정세 불안으로 인한 에너지 가격 급등과 최근 발표된 신규 관세 정책이 수입 물가를 끌어올린 것이 인플레이션 고착화의 주된 이유로 지목됩니다. 시장에서는 물가 안정을 위해 연준이 다시 긴축의 고삐를 죌 것이라는 관측이 지배적입니다. 투자은행들은 다가오는 12월 연방공개시장위원회(FOMC)에서 금리를 소폭 올리는 베이비스텝 단행 확률을 75% 이상으로 보고 있습니다. AI 인프라 투자 붐 덕분에 미국 경제 자체는 2.5% 수준의 견조한 성장을 유지하고 있지만, 노동 시장의 신규 일자리 창출은 둔화하고 있습니다. 고물가와 고금리가 겹치는 환경 속에서 미국 기업과 소비자의 피로도는 점차 증가하는 추세입니다.`,
  keyTerms:[{term:`베이비스텝`,explanation:`중앙은행이 기준금리를 한 번에 0.25%포인트(25bp)씩 소폭 조정하는 것을 의미하며, 경제에 미치는 충격을 최소화하기 위한 점진적인 조치입니다.`}],
  history:`미국은 2022년부터 급격한 금리 인상을 통해 물가 잡기에 나섰고, 2024년 잠시 완화 기조를 보였으나 2026년 들어 에너지 공급망 차질로 다시 물가가 반등했습니다.`,
  players:`제롬 파월 연준 의장을 비롯한 매파적 인사들은 인플레이션 재점화 방지를 최우선 과제로 삼고 있으며, 월가의 투자자들은 금리 변동에 촉각을 곤두세우고 있습니다.`,
  current:`경기 침체 없는 성장(연착륙)에 대한 기대감과 물가 불안이라는 두 가지 상반된 지표가 팽팽하게 맞서는 매우 이례적인 거시경제 환경입니다.`,
  outlook:`12월 FOMC 회의에서 발표될 점도표와 기준금리 결정 결과에 따라 2027년 상반기 글로벌 금융 시장의 자금 흐름이 크게 요동칠 전망입니다.`,
  sources:[{title:`US Inflation Sticks at 3.4%, Fed Rate Hike Looms - Bloomberg`,url:`https://www.bloomberg.com/news/articles/2026-11-17/us-inflation`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`글로벌 빅테크 기업들이 AI 데이터센터의 전력 병목 현상을 해결하기 위해 전용 전력망 확충에 500억 달러를 투입합니다.`,
  metrics:[`AI 인프라 투자액 500억 달러`,`데이터센터 전력 수요 연간 2배 증가`],
  summary:`마이크로소프트, 아마존 등 글로벌 빅테크 기업들이 AI 데이터센터 가동에 필요한 막대한 전력을 확보하기 위해 인프라 자체 구축에 돌입했습니다. 차세대 추론 칩과 고성능 AI 모델이 쏟아지면서 전력 수요가 매년 2배씩 폭증하고 기존 국가 전력망만으로는 이를 감당하기 어렵게 되었습니다. 이에 따라 빅테크 기업들은 원자력 발전소 단독 계약 및 차세대 지열 발전 프로젝트 등에 연합하여 약 500억 달러 규모의 자금을 쏟아붓고 있습니다. 이는 단순한 서버 증설을 넘어 에너지 자립이 곧 AI 패권 유지의 핵심 조건이 되었음을 보여줍니다. 각국 정부는 거대 AI 인프라 투자가 유발하는 탄소 배출 문제와 민간의 전력망 독점 우려를 제기하며 규제안을 만지작거리고 있습니다. 결국 누가 더 싸고 안정적으로 전기를 공급받느냐가 미래 AI 경쟁력을 좌우할 전망입니다.`,
  keyTerms:[{term:`AI 인프라 투자`,explanation:`인공지능 모델을 학습시키고 구동하기 위해 필수적인 대규모 데이터센터, 고성능 반도체, 그리고 이를 뒷받침하는 막대한 전력망 및 냉각 설비 등을 구축하는 데 자본을 투입하는 것을 말합니다.`}],
  history:`초대규모 언어모델(LLM) 경쟁이 심화되면서 연산 처리량은 기하급수적으로 늘어났고, 기존 재생에너지 중심의 전력망 확충 속도가 이를 따라가지 못하는 상황이 2025년부터 심화되었습니다.`,
  players:`엔비디아, MS, 구글 등 하드웨어와 클라우드를 장악한 테크 거인들이 소형원자로(SMR) 개발사나 에너지 기업들과 직접 지분 투자를 맺는 새로운 산업 동맹을 형성 중입니다.`,
  current:`반도체 칩 자체의 효율을 높이는 기술 개발과 동시에, 막대한 자본을 동원해 물리적인 발전소 자체를 소유하려는 움직임이 가속화되고 있습니다.`,
  outlook:`향후 3~4년 내에 전력 확보 여부에 따라 AI 기업 간의 격차가 더욱 극명해질 것이며, 환경 단체와의 마찰도 주요 사회적 의제로 떠오를 것입니다.`,
  sources:[{title:`Big Tech's \$50B Gamble on AI Power Grids - WSJ`,url:`https://www.wsj.com/articles/ai-power-infrastructure-2026`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`한국 정부가 APEC 정상회의에서 동남아시아 국가들과 협력을 강화하는 한-아세안 AI 동맹을 공식 제안했습니다.`,
  metrics:[`APEC 참가국 21개국`,`AI 동맹 초기 기금 1억 달러`],
  summary:`한국 대통령은 필리핀과 중국 선전을 잇는 다자 외교 무대인 APEC 정상회의에서 21개 회원국을 향해 새로운 기술 협력 비전을 발표했습니다. 특히 아세안 국가들을 대상으로 디지털 격차 해소와 공동 기술 표준 마련을 위한 '한-아세안 AI 동맹' 구축을 전격 제안하며 초기 마중물로 1억 달러 규모의 펀드를 조성하겠다고 밝혔습니다. 이 제안은 미국과 중국의 기술 패권 경쟁 틈바구니에서 한국이 주도하는 중견국 연대를 통해 독자적인 첨단 기술 공급망을 확보하려는 전략적 포석으로 풀이됩니다. 정상회의 기간 동안 한일 정상회담도 열려 양국 간 반도체 및 핵심 광물 공급망 안정을 위한 실질적 공조 방안이 논의되었습니다. 외교계에서는 이번 순방이 단순한 경제 협력을 넘어 아시아 태평양 지역 내 한국의 지정학적 입지를 기술 선도국으로 격상시키는 계기가 될 것으로 평가합니다. 정부는 향후 구체적인 공동 연구소 설립을 추진할 계획입니다.`,
  keyTerms:[{term:`AI 동맹`,explanation:`특정 국가들이 인공지능 기술 개발, 데이터 공유, 규제 표준 마련 등을 함께 협력하기 위해 맺는 전략적 파트너십을 의미합니다.`}],
  history:`미중 갈등이 심화되면서 아세안 국가들은 어느 한쪽에 치우치지 않는 제3의 파트너를 필요로 해왔고, 한국은 IT 강국의 강점을 살려 이 틈새를 꾸준히 공략해왔습니다.`,
  players:`기술 자립을 원하는 아세안 주요국 정상들과, 이를 지렛대 삼아 글로벌 발언권을 키우려는 한국 정부, 그리고 이 연대를 견제 또는 환영하는 미·중 양국이 주요 플레이어입니다.`,
  current:`글로벌 규제와 AI 주권(Sovereign AI) 확보가 화두로 떠오른 가운데, 지역 맞춤형 AI 모델 개발을 위한 국가 간 연대가 절실해진 시점입니다.`,
  outlook:`내년 서울에서 열릴 실무진 회의에서 공동 데이터 센터 구축 및 인재 교류 프로그램 등 세부적인 동맹 운영 방안이 확정될 예정입니다.`,
  sources:[{title:`대통령, APEC서 '한-아세안 AI 동맹' 전격 제안 - 한겨레`,url:`https://www.hani.co.kr/arti/politics/20261117`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`다가오는 수능을 앞두고 스마트 안경을 이용한 신종 부정행위 우려가 커지자 정치권이 긴급 처벌법 논의에 착수했습니다.`,
  metrics:[`작년 수능 부정행위 적발 250건`,`관련 긴급 회의 참석자 50명`],
  summary:`2026학년도 대학수학능력시험을 불과 며칠 앞두고 소형 스마트 안경과 무선 이어셋을 결합한 지능형 부정행위 시도 정황이 포착되면서 정치권과 교육계가 발칵 뒤집혔습니다. 초소형 렌즈로 시험지를 비추면 외부의 AI가 정답을 도출해 무선으로 알려주는 수법이 인터넷에서 공유된 것이 발단입니다. 국회에서는 여야를 불문하고 이러한 시도를 원천 차단하기 위해 첨단 전자기기 반입 시 처벌을 대폭 강화하는 이른바 '수능 AI 부정행위 방지법'을 긴급 상정해 논의 중입니다. 교육부는 긴급 화상 점검회의를 주재하고, 시험장 내 전파 차단기 도입 및 금속 탐지기 검사 강화 등 무관용 원칙을 적용하겠다고 발표했습니다. 학생과 학부모들 사이에서는 과도한 보안 조치로 인한 시험 당일 혼란을 우려하는 목소리와 철저한 공정성 확보가 필수라는 의견이 팽팽히 맞서고 있습니다. 사상 초유의 하이테크 부정행위 논란이 입시 제도의 신뢰성에 큰 시험대가 되고 있습니다.`,
  keyTerms:[{term:`무관용 원칙`,explanation:`어떤 규칙이나 법을 위반했을 때 예외나 선처 없이 정해진 규정대로 가장 엄격하게 처벌을 내리는 강력한 대응 방식을 말합니다.`}],
  history:`과거에는 단순한 엿보기나 휴대전화 소지 정도가 수능 부정행위의 주를 이뤘으나, 최근 웨어러블 기기와 AI의 발달로 적발이 극도로 어려운 신종 수법이 급증하고 있습니다.`,
  players:`공정한 시험 관리를 책임지는 교육당국과 경찰, 첨단 기기를 악용하려는 일부 브로커 조직, 그리고 억울한 피해를 걱정하는 일반 수험생들이 얽혀 있습니다.`,
  current:`시험이 코앞으로 다가온 상황에서 기술적 차단(전파 차단 등)과 법적 처벌 경고라는 두 가지 카드를 동시에 꺼내들며 사전 예방에 총력을 기울이고 있습니다.`,
  outlook:`이번 수능이 끝난 직후, 적발된 사례 유무에 따라 향후 국가 고시 전체의 보안 시스템과 스마트 기기 규제 가이드라인이 전면 개편될 가능성이 높습니다.`,
  sources:[{title:`수능 코앞인데 '스마트 안경' 비상... 정부 무관용 원칙 - KBS`,url:`https://news.kbs.co.kr/news/20261117`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`중동 평화 협상이 교착 상태에 빠진 가운데 서방 국가들의 이란에 대한 새로운 원유 수출 통제가 발효되었습니다.`,
  metrics:[`이란 원유 수출 감소 목표 30%`,`브렌트유 배럴당 95달러 돌파`],
  summary:`이스라엘과 주변 무장 정파 간의 무력 충돌을 끝내기 위한 다국적 평화 협상이 결국 양측의 입장 차이를 좁히지 못하고 잠정 중단되었습니다. 이에 대응하여 미국과 유럽연합(EU)은 분쟁의 배후로 지목받는 이란의 자금줄을 차단하기 위해 30% 수준의 수출 타격을 목표로 하는 새로운 에너지 제재를 공식 발효했습니다. 이 제재는 이란산 원유를 운송하는 제3국 선박과 금융 거래망까지 촘촘히 옥죄는 내용을 담고 있어 글로벌 원유 시장에 즉각적인 충격을 주었습니다. 제재 발표 직후 브렌트유 가격은 배럴당 95달러를 단숨에 돌파하며 전 세계적인 인플레이션 우려를 다시 키우고 있습니다. 지정학적 위기가 고조되면서 중동 내 미군 기지들은 방어 태세를 최고 수준으로 격상했습니다. 전문가들은 이번 조치가 평화 협상 재개를 압박하려는 의도지만, 단기적으로는 오히려 역내 무력 충돌의 도화선이 될 수 있다고 경고하고 있습니다.`,
  keyTerms:[{term:`에너지 제재`,explanation:`특정 국가를 압박하기 위해 그 나라가 원유나 천연가스 등 주요 에너지 자원을 다른 나라에 수출하지 못하도록 무역 및 금융 거래를 강제로 막는 경제적 제재 조치입니다.`}],
  history:`중동 지역은 수년간 국지전이 반복되어 왔으나, 2026년 들어 친이란 무장 단체들의 활동 반경이 넓어지면서 미국 등 서방의 직접적인 개입 필요성이 제기되어 왔습니다.`,
  players:`이란과 그를 지지하는 무장 단체들, 안보 위협을 느끼는 이스라엘, 그리고 물가 상승을 우려하면서도 중동 질서를 다잡으려는 미국과 EU가 치열한 수싸움을 벌이고 있습니다.`,
  current:`외교적 대화 창구가 닫히면서 경제적 타격을 입히는 강경책이 실행되었고, 이는 글로벌 공급망과 유가에 즉각적인 악영향을 미치고 있습니다.`,
  outlook:`겨울철 전력 수요 증가 시기와 맞물려 유가 급등이 지속될 경우, 서방 국가들의 인플레이션 통제 정책이 크게 흔들리고 정치적 여론도 악화될 위험이 있습니다.`,
  sources:[{title:`Mideast Peace Talks Stall as US Slaps New Sanctions on Iran - Reuters`,url:`https://www.reuters.com/world/middle-east/2026-11-17`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`한국의 초고령사회 진입 가속화로 노동력 부족이 심각해지자 국회에서 '이민청' 신설 법안이 급물살을 타고 있습니다.`,
  metrics:[`65세 이상 고령인구 비율 25%`,`내년 외국인 근로자 쿼터 10만명`],
  summary:`통계청의 최신 인구 동향 발표에 따르면 한국의 65세 이상 인구 비율이 전체의 25%를 넘어서며 초고령사회의 정점을 향해 치닫고 있습니다. 생산가능인구의 급감으로 인해 산업 현장과 농어촌의 구인난이 한계에 달하자, 이를 해결하기 위한 범정부 차원의 컨트롤타워 신설이 시급해졌습니다. 이에 국회에서는 여야 합의로 외국인 인력 유입과 통합 정책을 총괄하는 독립 기구인 이민청 신설 법안의 연내 처리가 유력하게 논의되고 있습니다. 법안이 통과되면 부처별로 흩어져 있던 비자 발급, 취업 교육, 다문화 가족 지원 업무가 하나로 일원화되어 효율적인 인력 관리가 가능해집니다. 정부는 당장 내년도 외국인 근로자 쿼터를 10만 명 규모로 대폭 확대하고 유학생의 국내 취업 연계 프로그램도 강화하기로 했습니다. 한국 사회가 폐쇄적인 단일 민족 국가에서 벗어나 본격적인 다문화 이민 국가로의 시스템 전환을 꾀하는 역사적인 분기점을 맞이하고 있습니다.`,
  keyTerms:[{term:`이민청`,explanation:`외국인 근로자 유입, 다문화 가정 지원, 출입국 심사 등 이민과 관련된 모든 국가 정책과 행정을 한 곳에서 전담하여 관리하는 정부 산하의 독립적인 기관입니다.`}],
  history:`수십 년간 이어진 저출산 기조로 내국인 노동력은 급감해 왔으며, 과거 단기 체류 위주였던 외국인 정책이 구조적 한계에 부딪혔다는 지적이 계속되었습니다.`,
  players:`인력난 해소를 요구하는 중소기업 및 농어촌 단체들과, 체계적인 사회 통합을 준비하려는 법무부, 그리고 일자리 잠식과 치안 문제를 우려하는 일부 시민 단체가 이해관계를 맺고 있습니다.`,
  current:`더 이상 미봉책으로는 경제 성장을 유지할 수 없다는 사회적 공감대가 형성되면서, 체계적인 이민 정책 기구 설립이 정쟁을 넘어선 국가 생존 과제로 격상되었습니다.`,
  outlook:`이민청이 실제 출범할 경우 해외 우수 인재 유치를 위한 획기적인 영주권 부여 제도 등 파격적인 비자 개편안이 잇따라 발표될 것으로 보입니다.`,
  sources:[{title:`인구 4명 중 1명 노인... '이민청' 연내 신설 급물살 - 중앙일보`,url:`https://www.joongang.co.kr/article/20261117`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`단순한 답변을 넘어 스스로 기획하고 행동하는 '자율 에이전틱 AI'가 전 세계 기업의 새로운 표준 업무 도구로 정착하고 있습니다.`,
  metrics:[`엔터프라이즈 AI 에이전트 도입률 65%`,`초기 업무 생산성 향상 40%`],
  summary:`사용자의 지시를 기다리던 챗봇 형태의 인공지능을 넘어, 목표가 주어지면 스스로 계획을 세우고 실행까지 완수하는 자율 에이전틱 AI가 실무 현장에 빠르게 확산되고 있습니다. 최근 글로벌 IT 리서치 기관의 조사에 따르면, 포춘 500대 기업 중 65%가 이미 사내 파이프라인에 이러한 독립적 AI 에이전트를 도입한 것으로 나타났습니다. 이 기술은 복잡한 소프트웨어 코드 리팩토링, 기획 문서 분석, 자동화 워크플로우 제어 등 인간의 개입이 필수적이었던 영역까지 독자적으로 수행하며 초기 업무 생산성을 무려 40%나 끌어올리고 있습니다. 마이크로소프트와 오픈AI 등 빅테크 기업들은 앞다투어 기업용 맞춤형 에이전트 구축 플랫폼을 출시하며 시장 선점에 나섰습니다. 인간은 실무자가 아닌 AI 에이전트들의 작업을 승인하고 관리하는 감독관 역할로 직무 성격이 급변하고 있습니다. 전문가들은 이러한 전환이 21세기 화이트칼라 노동 시장을 근본적으로 재편할 가장 거대한 충격파가 될 것이라고 입을 모읍니다.`,
  keyTerms:[{term:`자율 에이전틱 AI`,explanation:`단순히 질문에 대답만 하는 것이 아니라, 큰 목표를 주면 스스로 판단하고 여러 도구를 사용해 복잡한 업무를 끝까지 완수해 내는 능동적인 인공지능 시스템입니다.`}],
  history:`2023년부터 대형언어모델(LLM)이 대중화되었으나 환각 현상과 수동적인 인터페이스의 한계가 있었고, 이를 극복하기 위해 추론 능력과 실행력을 결합한 에이전트 연구가 2025년부터 꽃피웠습니다.`,
  players:`기존 소프트웨어 개발자와 사무직 종사자들은 AI 에이전트를 동료로 맞이하게 되었고, 구글과 마이크로소프트 같은 기업들은 이 에이전트 생태계를 독점하기 위해 경쟁하고 있습니다.`,
  current:`개별적인 AI 툴 도입을 넘어, 회사 전체의 시스템과 데이터를 연결하여 AI가 스스로 돌아다니며 일할 수 있는 인프라 구축이 기업들의 최우선 과제가 되었습니다.`,
  outlook:`향후에는 에이전트끼리 서로 소통하고 협업하여 대규모 프로젝트를 처리하는 멀티 에이전트 시스템이 도입되면서 보안 및 윤리적 통제 장치 마련이 시급해질 것입니다.`,
  sources:[{title:`Agentic AI is the New Enterprise Standard - The Economist`,url:`https://www.economist.com/technology/2026/11/17/agentic-ai`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`구글 딥마인드의 AI가 극한 기후에도 견디는 획기적인 차세대 태양광 신소재를 세계 최초로 발견하여 상용화를 앞두고 있습니다.`,
  metrics:[`신소재 태양광 변환 효율 35%`,`기존 대비 연구 개발 기간 5년 단축`],
  summary:`구글 딥마인드가 이끄는 피지컬 AI 연구팀이 인공지능의 시뮬레이션을 통해 사막의 고열과 혹한을 모두 견디면서도 발전 효율이 압도적인 차세대 태양광 신소재 합성 구조를 발견했습니다. 이 소재는 기존 실리콘 기반 패널의 한계를 뛰어넘어 무려 35%의 태양광 변환 효율을 달성하는 것으로 실험 결과 확인되었습니다. 놀라운 점은 인간 과학자가 5년 이상 수만 번의 시행착오를 거쳐야 할 복잡한 화학 합성 공정을 AI가 단 3개월 만에 예측하고 최적화해 냈다는 것입니다. 이번 발견은 인공지능이 디지털 세계를 넘어 물리적 세계의 과학적 진보를 직접 이끌어내는 피지컬 AI 시대의 본격적인 서막을 알리는 사건으로 평가받고 있습니다. 에너지 업계는 이 신소재가 기후 변화로 인해 몸살을 앓고 있는 글로벌 신재생 에너지 시장의 판도를 단숨에 바꿀 게임 체인저가 될 것으로 기대하고 있습니다. 향후 신약 개발, 배터리 소재 등 다양한 과학 분야에서도 AI 주도의 연구 혁신이 폭발적으로 늘어날 전망입니다.`,
  keyTerms:[{term:`피지컬 AI`,explanation:`컴퓨터 화면 속의 데이터 처리에만 머물지 않고, 로봇이나 신소재 개발처럼 우리가 살아가는 실제 물리적 세계의 문제를 해결하고 변화를 만들어내는 인공지능 기술입니다.`}],
  history:`과거 AI는 주로 체스, 바둑 등 규칙이 정해진 게임이나 언어 처리에 집중했으나, 최근 단백질 구조 예측(알파폴드) 성공 이후 재료 과학 및 화학 시뮬레이션 분야로 영역을 넓혀왔습니다.`,
  players:`막대한 자금력을 갖춘 빅테크 연구소들과 이를 상용화하려는 친환경 에너지 기업, 그리고 첨단 기술로 기후 위기를 극복하려는 각국 정부가 합심하고 있습니다.`,
  current:`기후 변화로 인해 극단적 날씨가 잦아지면서 튼튼하고 효율 좋은 재생 에너지 장비에 대한 수요가 폭발적으로 증가하는 상황에서 나온 시의적절한 돌파구입니다.`,
  outlook:`머지않아 이 기술이 로보틱스와 결합되어 AI가 새로운 소재를 발견하고 로봇이 직접 공장에서 생산까지 테스트하는 완전 자동화 연구실이 현실화될 가능성이 높습니다.`,
  sources:[{title:`AI Discovers Next-Gen Solar Material - AP News`,url:`https://apnews.com/article/ai-solar-discovery-2026`}]
}]

let current = null;
let currentCat = null;
const CAT_ORDER = ['경제', '정치', '기타 이슈'];

function renderSidebar() {
  const list = document.getElementById('date-list');
  list.innerHTML = '';
  BRIEFS.forEach((b, i) => {
    const el = document.createElement('div');
    el.className = 'date-item' + (i === 0 ? ' active' : '');
    el.dataset.tag = b.tag;
    const parts = b.tag.split('-');
    const short = parts[1] + '/' + parts[2];
    el.innerHTML = b.tag;
    el.addEventListener('click', () => showBrief(b.tag));
    list.appendChild(el);
  });
}

function showBrief(tag) {
  current = tag;
  document.querySelectorAll('.date-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tag === tag);
  });
  const brief = BRIEFS.find(b => b.tag === tag);
  if (!brief) return;

  // 카테고리별 그룹핑
  const grouped = {};
  brief.stories.forEach(s => {
    if (!grouped[s.category]) grouped[s.category] = [];
    grouped[s.category].push(s);
  });
  const availableCats = CAT_ORDER.filter(c => grouped[c] && grouped[c].length);
  if (!availableCats.length) return;

  // 기본 카테고리 결정
  if (!availableCats.includes(currentCat)) currentCat = availableCats[0];

  renderContent(brief, grouped, availableCats);
}

function renderContent(brief, grouped, availableCats) {
  const content = document.getElementById('content');
  let html = `<div class="sticky-top">
    <div class="brief-header">
      <div class="bh-eyebrow">Morning Brief</div>
      <h2>${brief.label}</h2>
    </div>`;

  // 탭
  html += '<div class="cat-tabs">';
  availableCats.forEach(c => {
    const cls = c === currentCat ? 'cat-tab active' : 'cat-tab';
    html += `<button class="${cls}" data-cat="${c}">${c}</button>`;
  });
  html += '</div></div>';

  // 선택된 카테고리 기사들
  const stories = grouped[currentCat] || [];
  stories.forEach((s, idx) => {
    if (idx > 0) html += '<hr class="story-divider">';
    html += `<div class="story">
      <div class="story-top">
        <div class="story-headline">${s.headline}</div>
      </div>`;
    if (s.metrics.length) {
      html += '<div class="metrics">';
      s.metrics.forEach(m => { html += `<div class="metric-chip">${m}</div>`; });
      html += '</div>';
    }
    // 요약문에 핵심 개념 밑줄 (출력은 박스 다음)
    let summaryHtml = s.summary;
    if (s.keyTerms && s.keyTerms.length) {
      s.keyTerms.forEach(kt => {
        if (!kt.term) return;
        const safe = kt.term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp(safe, 'g');
        summaryHtml = summaryHtml.replace(re, `<span class="kt-underline">${kt.term}</span>`);
      });
    }

    // 핵심 개념 박스 (요약 위)
    if (s.keyTerms && s.keyTerms.length) {
      html += '<div class="key-terms"><div class="key-terms-title">핵심 개념</div>';
      s.keyTerms.forEach(kt => {
        html += `<div class="kt-item">
          <span class="kt-term">${kt.term}</span>
          <span class="kt-exp">${kt.explanation}</span>
        </div>`;
      });
      html += '</div>';
    }

    html += `<div class="summary">${summaryHtml}</div>`;

    const bgSections = [
      ['역사적 맥락', s.history],
      ['핵심 플레이어', s.players],
      ['현재 구도', s.current],
      ['향후 전망', s.outlook],
    ].filter(([, v]) => v);

    if (bgSections.length) {
      html += '<div class="bg-box"><div class="bg-box-title">배경 스토리</div>';
      bgSections.forEach(([label, text]) => {
        html += `<div class="bg-section">
          <div class="bg-section-label">${label}</div>
          <div class="bg-section-text">${text}</div>
        </div>`;
      });
      html += '</div>';
    }

    if (s.sources.length) {
      html += `<button class="sources-toggle" data-toggle="srcs-${idx}">출처 ${s.sources.length}개 보기 <span class="arrow">▾</span></button>`;
      html += `<div class="sources-body" id="srcs-${idx}">`;
      s.sources.forEach((src, si) => {
        html += `<div class="source-item">
          <span class="src-num">${si+1}</span>
          <a href="${src.url}" target="_blank">${src.title}</a>
        </div>`;
      });
      html += '</div>';
    }
    html += '</div>';
  });

  content.innerHTML = html;

  // 탭 클릭 핸들러
  content.querySelectorAll('.cat-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentCat = btn.dataset.cat;
      renderContent(brief, grouped, availableCats);
    });
  });

  // 출처 토글
  content.querySelectorAll('.sources-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const body = document.getElementById(btn.dataset.toggle);
      const isOpen = body.classList.toggle('open');
      btn.classList.toggle('open', isOpen);
    });
  });

  document.getElementById('main').scrollTop = 0;
}

if (BRIEFS.length > 0) {
  renderSidebar();
  showBrief(BRIEFS[0].tag);
} else {
  document.getElementById('content').innerHTML = '<div class="empty">브리핑 데이터가 없습니다.</div>';
}

// ── Quiz Gate ──
const PASS_TARGET = 3;
let correctCount = 0;
const usedIndexes = new Set();

function pickQuestion() {
  // 사용 안 한 문제 중 랜덤. 다 썼으면 풀 리셋
  if (usedIndexes.size >= QUIZ.length) usedIndexes.clear();
  let idx;
  do { idx = Math.floor(Math.random() * QUIZ.length); } while (usedIndexes.has(idx));
  usedIndexes.add(idx);
  return QUIZ[idx];
}

function updateCounter() {
  document.getElementById('quiz-counter').textContent = `(${correctCount}/${PASS_TARGET})`;
}

function renderQuiz() {
  const q = pickQuestion();
  document.getElementById('quiz-q').textContent = q.q;
  updateCounter();
  const feedback = document.getElementById('quiz-feedback');
  feedback.textContent = '';
  feedback.className = 'quiz-feedback';
  const closeBtn = document.getElementById('quiz-close');
  closeBtn.classList.add('hidden');

  const choicesEl = document.getElementById('quiz-choices');
  choicesEl.innerHTML = '';
  // 보기 순서 섞기 (정답 위치 고정 방지)
  const order = q.a.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  order.forEach(idx => {
    const text = q.a[idx];
    const btn = document.createElement('button');
    btn.className = 'quiz-choice';
    btn.textContent = text;
    btn.addEventListener('click', () => {
      const allBtns = choicesEl.querySelectorAll('.quiz-choice');
      allBtns.forEach(b => b.disabled = true);
      if (idx === q.correct) {
        btn.classList.add('correct');
        correctCount++;
        updateCounter();
        if (correctCount >= PASS_TARGET) {
          feedback.textContent = '통과! 들어와도 좋아.';
          feedback.className = 'quiz-feedback right';
          closeBtn.classList.remove('hidden');
        } else {
          feedback.textContent = '역시 맞출 줄 알았어. 다음 문제 고.';
          feedback.className = 'quiz-feedback right';
          btn.blur();
          setTimeout(() => {
            if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
            renderQuiz();
          }, 900);
        }
      } else {
        btn.classList.add('wrong');
        feedback.textContent = '정말 실망이다.... 다음.';
        feedback.className = 'quiz-feedback wrong';
        btn.blur();
        setTimeout(() => {
          if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
          renderQuiz();
        }, 900);
      }
    });
    choicesEl.appendChild(btn);
  });
}

document.getElementById('quiz-close').addEventListener('click', () => {
  document.getElementById('quiz-overlay').classList.add('hidden');
  document.body.classList.remove('quiz-active');
});

document.body.classList.add('quiz-active');
renderQuiz();

// ── Mobile sidebar toggle ──
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('sidebar-backdrop');
function toggleSidebar(open) {
  sidebar.classList.toggle('open', open);
  backdrop.classList.toggle('open', open);
}
document.getElementById('sidebar-toggle').addEventListener('click', () => toggleSidebar(!sidebar.classList.contains('open')));
backdrop.addEventListener('click', () => toggleSidebar(false));
// 날짜 클릭하면 모바일에서 자동으로 닫히게
sidebar.addEventListener('click', e => {
  if (e.target.classList.contains('date-item') && window.innerWidth <= 768) {
    toggleSidebar(false);
  }
});

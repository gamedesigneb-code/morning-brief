<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모닝 브리핑</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --sidebar-w: 240px;
    --bg: #FAFAF7;
    --paper: #FFFFFF;
    --accent: #6B7A8F;
    --accent-soft: #E8ECEF;
    --line: #EAE8E3;
    --line-strong: #D8D5CE;
    --text: #2D2A26;
    --text-mid: #6B655D;
    --text-sub: #A09889;
    --radius: 10px;
  }
  html, body {
    height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 15px; line-height: 1.65; font-weight: 400;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }

  /* ── Layout ── */
  #app { display: flex; height: 100vh; overflow: hidden; }

  /* ── Sidebar ── */
  #sidebar {
    width: var(--sidebar-w); flex-shrink: 0;
    background: var(--bg); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #sidebar-header {
    padding: 36px 20px 24px;
    border-bottom: 1px solid var(--line);
    text-align: center;
  }
  #sidebar-header h1 {
    font-size: 19px; font-weight: 700; color: var(--text);
    letter-spacing: -0.4px; line-height: 1.3;
  }
  #sidebar-header p {
    font-size: 12px; color: var(--text-sub); margin-top: 6px;
    letter-spacing: 0.3px;
  }
  #date-list { overflow-y: auto; flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
  .date-item {
    padding: 11px 14px; cursor: pointer; border-radius: 8px;
    transition: background 0.15s, color 0.15s;
    background: transparent;
    text-align: center; font-size: 13px; font-weight: 500; color: var(--text-mid);
    letter-spacing: 0.1px;
  }
  .date-item:hover { background: var(--accent-soft); color: var(--text); }
  .date-item.active {
    background: var(--accent-soft); color: var(--text); font-weight: 600;
  }

  /* ── Main ── */
  #main { flex: 1; overflow-y: auto; background: var(--paper); }
  #content { max-width: 760px; margin: 0 auto; padding: 56px 40px 80px; }

  .brief-header { margin-bottom: 36px; }
  .brief-header .bh-eyebrow {
    font-size: 11px; color: var(--text-sub); margin-bottom: 8px;
    letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500;
  }
  .brief-header h2 {
    font-size: 30px; font-weight: 700; letter-spacing: -0.7px;
    color: var(--text); line-height: 1.25;
  }

  /* ── Sticky Top (header + tabs) ── */
  .sticky-top {
    position: sticky; top: 0;
    background: var(--paper); z-index: 20;
    padding-top: 56px; margin-top: -56px;
  }
  .sticky-top .brief-header { margin-bottom: 24px; }

  /* ── Category Tabs ── */
  .cat-tabs {
    display: flex; gap: 0; margin-bottom: 36px;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
  }
  .cat-tab {
    padding: 12px 20px 14px; cursor: pointer; font-size: 14px; font-weight: 500;
    color: var(--text-sub); border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    background: none; border-top: none; border-left: none; border-right: none;
    font-family: inherit; letter-spacing: -0.1px;
    margin-bottom: -1px;
  }
  .cat-tab:hover { color: var(--text-mid); }
  .cat-tab.active { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }

  /* ── Sources (collapsible) ── */
  .sources-toggle {
    background: transparent; border: 1px solid var(--line-strong);
    padding: 8px 14px; border-radius: 6px; font-size: 12.5px; font-weight: 500;
    color: var(--text-mid); cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    font-family: inherit; margin-top: 12px;
    transition: background 0.15s, border-color 0.15s;
  }
  .sources-toggle:hover { background: var(--accent-soft); border-color: var(--accent); }
  .sources-toggle .arrow { transition: transform 0.2s; font-size: 9px; color: var(--text-sub); }
  .sources-toggle.open .arrow { transform: rotate(180deg); }
  .sources-body { display: none; margin-top: 12px; padding-left: 4px; }
  .sources-body.open { display: block; }

  /* ── Story Card ── */
  .story { margin-bottom: 40px; }
  .story-top { margin-bottom: 18px; }
  .story-headline {
    font-size: 19px; font-weight: 700; line-height: 1.45;
    letter-spacing: -0.4px; color: var(--text);
  }

  .metrics { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .metric-chip {
    background: var(--accent-soft); border: none;
    border-radius: 6px; padding: 7px 12px;
    font-size: 12.5px; font-weight: 500; color: var(--text-mid);
    line-height: 1.4;
  }

  .summary {
    font-size: 15px; line-height: 1.8; color: var(--text); margin-bottom: 20px;
    letter-spacing: -0.1px;
  }
  .summary .kt-underline {
    color: #1996BD;
    text-decoration: underline;
    text-decoration-color: #1996BD;
    text-decoration-thickness: 1.5px;
    text-underline-offset: 3px;
    cursor: help;
  }

  /* ── Key Terms Box ── */
  .key-terms {
    background: #F4F1EA; border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius); padding: 18px 22px; margin-bottom: 14px;
  }
  .key-terms-title {
    font-size: 11px; font-weight: 600; color: var(--text-sub);
    text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 14px;
  }
  .kt-item { margin-bottom: 12px; }
  .kt-item:last-child { margin-bottom: 0; }
  .kt-term {
    font-size: 13.5px; font-weight: 700; color: #1996BD;
    margin-bottom: 4px; display: block;
    letter-spacing: -0.1px;
  }
  .kt-exp {
    font-size: 13.5px; line-height: 1.7; color: var(--text-mid);
  }

  /* ── Background ── */
  .bg-box {
    background: var(--bg); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 22px 24px; margin-bottom: 14px;
  }
  .bg-box-title {
    font-size: 11px; font-weight: 600; color: var(--text-sub);
    text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 16px;
  }
  .bg-section { margin-bottom: 16px; }
  .bg-section:last-child { margin-bottom: 0; }
  .bg-section-label {
    font-size: 12.5px; font-weight: 600; color: var(--text); margin-bottom: 6px;
    letter-spacing: -0.1px;
  }
  .bg-section-text { font-size: 14px; line-height: 1.75; color: var(--text-mid); }

  /* ── Sources ── */
  .source-item {
    display: flex; align-items: flex-start; gap: 10px;
    margin-bottom: 8px; font-size: 13px;
  }
  .src-num {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent-soft); color: var(--text-mid);
    font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .source-item a { color: var(--text-mid); text-decoration: none; line-height: 1.55; }
  .source-item a:hover { color: var(--text); text-decoration: underline; }

  .story-divider { border: none; border-top: 1px solid var(--line); margin: 36px 0; }

  .empty { color: var(--text-sub); font-size: 14px; padding: 60px 0; text-align: center; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }

  /* ── Mobile Toggle ── */
  #sidebar-toggle {
    display: none;
    position: fixed; top: 14px; left: 14px; z-index: 50;
    background: var(--paper); border: 1px solid var(--line-strong);
    width: 40px; height: 40px; border-radius: 10px;
    cursor: pointer; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(45, 42, 38, 0.08);
  }
  #sidebar-toggle span {
    display: block; width: 18px; height: 2px; background: var(--text);
    position: relative;
  }
  #sidebar-toggle span::before,
  #sidebar-toggle span::after {
    content: ''; position: absolute; left: 0; width: 18px; height: 2px; background: var(--text);
  }
  #sidebar-toggle span::before { top: -6px; }
  #sidebar-toggle span::after { top: 6px; }

  #sidebar-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(45, 42, 38, 0.4); z-index: 40;
  }
  #sidebar-backdrop.open { display: block; }

  /* ── Mobile Responsive ── */
  @media (max-width: 768px) {
    #sidebar-toggle { display: flex; }
    #sidebar {
      position: fixed; left: 0; top: 0; bottom: 0;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      z-index: 45; width: 260px;
      box-shadow: 0 0 24px rgba(45, 42, 38, 0.12);
    }
    #sidebar.open { transform: translateX(0); }

    #content { padding: 64px 20px 60px; max-width: 100%; }
    .brief-header h2 { font-size: 22px; }
    .story-headline { font-size: 16px; }
    .summary { font-size: 14.5px; line-height: 1.75; }
    .bg-section-text { font-size: 13.5px; }
    .metric-chip { font-size: 12px; padding: 6px 10px; }
    .bg-box { padding: 18px 18px; }
    .cat-tab { padding: 11px 14px; font-size: 13.5px; }

    .quiz-card { padding: 28px 24px 24px; }
    .quiz-q { font-size: 17px; }
    .quiz-choice { font-size: 14px; padding: 13px 16px; }
  }

  /* ── Quiz Overlay ── */
  body.quiz-active #app {
    filter: blur(6px) saturate(0.85);
    pointer-events: none;
    transition: filter 0.3s ease;
  }
  #quiz-overlay {
    position: fixed; inset: 0;
    background-color: rgba(250, 250, 247, 0.55);
    background-image:
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0) 0,
        rgba(255,255,255,0) 5px,
        rgba(45,42,38,0.04) 5px,
        rgba(45,42,38,0.04) 6px
      ),
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0) 0,
        rgba(255,255,255,0) 22px,
        rgba(45,42,38,0.025) 22px,
        rgba(45,42,38,0.025) 23px
      );
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 24px;
  }
  #quiz-overlay.hidden { display: none; }

  .quiz-card {
    background: var(--paper); border-radius: 16px;
    padding: 36px 36px 32px; width: 100%; max-width: 440px;
    box-shadow: 0 16px 48px rgba(45, 42, 38, 0.18);
  }
  .quiz-eyebrow {
    font-size: 11px; color: var(--text-sub); letter-spacing: 1.5px;
    text-transform: uppercase; font-weight: 500; margin-bottom: 12px;
  }
  .quiz-q {
    font-size: 19px; font-weight: 700; color: var(--text);
    line-height: 1.5; letter-spacing: -0.3px; margin-bottom: 24px;
  }
  .quiz-choices { display: flex; flex-direction: column; gap: 8px; }
  .quiz-choice {
    background: var(--paper); border: 1px solid var(--line-strong);
    padding: 14px 18px; border-radius: 10px; font-size: 14.5px; font-weight: 500;
    color: var(--text); cursor: pointer; text-align: left;
    font-family: inherit; transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .quiz-choice:focus { outline: none; }
  .quiz-choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) {
    .quiz-choice:hover { background: var(--accent-soft); border-color: var(--accent); }
  }
  .quiz-choice:active { transform: scale(0.99); }
  .quiz-choice.wrong {
    background: #F5E6E0; border-color: #C9947F; color: #8A4A30;
    animation: shake 0.4s ease;
  }
  .quiz-choice.correct {
    background: #E3EDE2; border-color: #7A9077; color: #2E4A2C;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .quiz-feedback {
    margin-top: 20px; text-align: center; font-size: 14px; font-weight: 500;
    color: var(--text-mid); min-height: 22px;
  }
  .quiz-feedback.right { color: #2E4A2C; }
  .quiz-feedback.wrong { color: #8A4A30; }

  .quiz-close-btn {
    margin-top: 18px; width: 100%;
    background: var(--text); color: var(--paper); border: none;
    padding: 13px 20px; border-radius: 10px; font-size: 14px; font-weight: 600;
    font-family: inherit; cursor: pointer;
    transition: background 0.15s;
  }
  .quiz-close-btn:hover { background: #1a1815; }
  .quiz-close-btn.hidden { display: none; }
</style>
</head>
<body>
<div id="quiz-overlay">
  <div class="quiz-card">
    <div class="quiz-eyebrow"><span>잠깐, 나에 대해서 잘 알지?</span> <span id="quiz-counter">(0/3)</span></div>
    <div class="quiz-q" id="quiz-q"></div>
    <div class="quiz-choices" id="quiz-choices"></div>
    <div class="quiz-feedback" id="quiz-feedback"></div>
    <button class="quiz-close-btn hidden" id="quiz-close">닫기</button>
  </div>
</div>

<button id="sidebar-toggle" aria-label="메뉴"><span></span></button>
<div id="sidebar-backdrop"></div>

<div id="app">
  <nav id="sidebar">
    <div id="sidebar-header">
      <h1>모닝 브리핑</h1>
      <p>일별 세계 뉴스 요약</p>
    </div>

    <div id="date-list"></div>
  </nav>
  <main id="main">
    <div id="content"></div>
  </main>
</div>

<script>
const BRIEFS = [{
  tag:`2026-10-08`,
  label:`2026년 10월 8일 (목)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국 8월 경상수지 461억 달러 흑자 기록, 역대 2위 달성`,
  metrics:[`경상수지 461억 달러`,`3개월 연속 400억 달러 흑자`],
  summary:`한국은행에 따르면 8월 경상수지가 반도체 수출 호조에 힘입어 461억 달러 흑자를 기록하며 역대 2위의 성과를 거두었습니다. 글로벌 데이터센터 인프라 투자 수요 확대로 반도체와 IT 기기 중심의 수출 증가세가 주된 요인으로 분석됩니다. 이로써 3개월 연속 400억 달러 이상의 흑자 행진을 이어가게 되었습니다. 글로벌 주요 투자은행(IB)들도 이러한 수출 실적을 근거로 한국의 올해 경제 성장률 전망치를 일제히 상향 조정하고 있습니다. 향후 미국 경제의 연착륙 여부와 주요국의 통화정책 방향에 따라 수출 흐름이 달라질 수 있습니다. 다만 내수 회복세가 수출 증가세를 따라가지 못하는 점은 여전히 해결해야 할 과제입니다. 이번 대규모 경상수지 흑자는 한국 경제의 버팀목인 수출 경쟁력을 다시 한번 입증한 결과로 평가받고 있습니다.`,
  keyTerms:[{term:`경상수지`,explanation:`국가 간 상품, 서비스 등을 사고팔아 벌어들인 외화와 지출한 외화의 차이를 의미합니다. 흑자면 돈을 더 많이 벌어들인 것이고, 적자면 더 많이 지출한 것입니다.`}],
  history:`최근 2년간 반도체 사이클이 하강기를 겪으며 한국의 경상수지도 한때 적자 위기를 겪었습니다.`,
  players:`삼성전자, SK하이닉스 등 반도체 기업과 글로벌 데이터센터 빅테크 기업들이 핵심 주체입니다.`,
  current:`반도체 슈퍼사이클 재진입과 함께 수출이 급증하면서 경상수지 지표가 빠르게 개선되고 있습니다.`,
  outlook:`연말까지 수출 주도 성장세가 이어질 것으로 보이며, 4분기 실적 발표에 시장의 관심이 쏠리고 있습니다.`,
  sources:[{title:`8월 경상수지 461억 달러 흑자...반도체 호조 - 동아일보`,url:`https://www.donga.com/news/Economy/article/all`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`글로벌 유가 고공행진, WTI 배럴당 100달러 돌파`,
  metrics:[`WTI 100달러 돌파`,`글로벌 원유 공급 우려 심화`],
  summary:`국제유가의 벤치마크인 서부텍사스산원유(WTI) 가격이 중동 지역의 지정학적 분쟁 격화로 배럴당 100달러를 돌파했습니다. 주요 산유국들의 감산 기조가 이어지는 가운데 군사적 긴장이 고조되면서 원유 공급 차질 우려가 시장을 덮쳤기 때문입니다. 이 같은 유가 급등은 진정세를 보이던 글로벌 인플레이션을 다시 자극할 수 있다는 관측을 낳고 있습니다. 미국을 비롯한 주요국들은 물가 불안이 장기화될 경우 기준금리 인하 시점을 뒤로 미룰 가능성마저 제기하고 있습니다. 시장 전문가들은 당분간 산유국들의 증산 전환이 쉽지 않아 유가 강세가 이어질 것으로 내다보고 있습니다. 세계 경제는 에너지 비용 상승에 따른 스태그플레이션 리스크라는 새로운 도전에 직면하게 되었습니다. WTI 가격 추이는 향후 글로벌 경제 정책의 최대 변수로 작용할 전망입니다.`,
  keyTerms:[{term:`WTI`,explanation:`미국 서부 텍사스에서 생산되는 원유로, 세계 원유 가격을 결정하는 가장 중요한 기준 중 하나입니다.`}],
  history:`산유국들의 자발적 감산과 코로나19 이후의 수요 회복 불균형이 유가 상승의 밑바탕을 형성해 왔습니다.`,
  players:`OPEC+ 산유국들, 중동 분쟁 당사국, 그리고 인플레이션을 방어하려는 미국 연방준비제도(Fed)입니다.`,
  current:`중동 발 돌발 변수로 인해 원유 수급로가 위협받으며 투기적 매수세까지 가세해 가격이 급등했습니다.`,
  outlook:`지정학적 갈등의 확전 여부와 미국 정부의 전략비축유 추가 방출 카드가 유가의 향방을 결정할 것입니다.`,
  sources:[{title:`WTI 100달러 돌파...다시 커지는 인플레 공포 - 중앙일보`,url:`https://www.joongang.co.kr/article/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미 연준 추가 긴축 시사, 미 10년물 국채금리 5% 돌파`,
  metrics:[`미 10년물 국채 5% 돌파`,`매파적 기조 확인`],
  summary:`미국 연방준비제도(Fed)의 9월 의사록이 공개된 직후 미국 10년물 국채금리가 심리적 저항선인 5%를 돌파하며 급등했습니다. 의사록에 따르면 위원 대다수가 연내 추가 금리 인상 필요성과 매파적 기조 유지에 공감한 것으로 나타났습니다. 강력한 미국의 고용 및 소비 지표가 인플레이션 둔화 속도를 늦출 수 있다는 우려가 강하게 작용했습니다. 이로 인해 위험자산 선호 심리가 위축되면서 뉴욕증시를 포함한 글로벌 증시가 일제히 하락세로 돌아섰습니다. 전 세계 채권시장도 미국의 긴축 장기화 압력에 동조하며 자금 유출 리스크에 긴장하고 있습니다. 높은 국채 금리는 기업의 자금 조달 비용을 높이고 가계의 이자 부담을 가중시키는 부작용을 동반합니다. 향후 발표될 소비자물가지수(CPI) 등 주요 거시 지표 결과가 연준의 최종 결정을 가늠할 핵심 잣대가 될 것입니다.`,
  keyTerms:[{term:`매파적 기조`,explanation:`물가 안정을 최우선으로 삼아 금리 인상이나 통화 긴축을 지지하는 성향을 새에 비유하여 일컫는 경제 용어입니다.`}],
  history:`연준은 물가 상승률을 2% 목표치로 되돌리기 위해 역사상 가장 빠른 속도로 금리 인상을 단행해 왔습니다.`,
  players:`제롬 파월 의장을 비롯한 미 연준 주요 위원들과 이에 반응하는 글로벌 기관 투자자들입니다.`,
  current:`시장 일각에선 금리 인상 사이클의 종료를 기대했으나, 예상보다 탄탄한 미국 경제가 긴축 의지를 뒷받침하고 있습니다.`,
  outlook:`물가 지표와 고용 보고서 결과에 따라 연말 FOMC 회의에서 실제 추가 인상이 단행될지 여부가 결정됩니다.`,
  sources:[{title:`미 연준 추가 긴축 시사...글로벌 채권시장 발작 - 한국경제`,url:`https://www.hankyung.com/economy/article/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`국정감사 최대 쟁점 부상, 'DMZ 북한 지뢰 폭발' 여야 정면충돌`,
  metrics:[`국방위 공방 심화`,`조사 결과 상반`],
  summary:`비무장지대(DMZ) 인근에서 발생한 지뢰 폭발 사건을 두고 2026년 국정감사에서 여야 간 치열한 공방이 벌어지고 있습니다. 군 당국은 북한의 의도적인 도발과 지뢰 매설 가능성을 강력히 제기하며 안보 태세 강화를 주장했습니다. 반면 일부 정부 관계자는 명확한 증거 없이 공격으로 단정 짓기는 이르다며 신중한 입장을 보이면서 혼선이 가중되었습니다. 특히 한국군과 유엔사, 북한이 각각 다르게 적용하고 있는 군사분계선 기준 좌표 문제가 접경지역 긴장의 근본 원인으로 지목되고 있습니다. 야당은 안보 공백과 섣불리 위기를 조장하는 태도를 비판하는 반면, 여당은 확고한 대북 제재와 진상 규명을 촉구했습니다. 이 사건은 향후 남북 관계뿐만 아니라 한반도 주변 정세에 상당한 파장을 일으킬 것으로 전망됩니다. 양측은 이번 국감을 통해 각자의 안보 논리를 선점하기 위한 총력전을 펼치고 있습니다.`,
  keyTerms:[{term:`군사분계선`,explanation:`1953년 정전협정에 따라 남북한의 무력 충돌을 막기 위해 설정된 경계선으로, 흔히 휴전선이라고 불립니다.`}],
  history:`과거에도 목함지뢰 사건 등 DMZ 내에서 남북 간 긴장을 촉발하는 국지적 도발이나 사고가 반복되어 왔습니다.`,
  players:`국회 국방위원회 여야 의원들, 국방부 및 합동참모본부, 통일부, 그리고 유엔군 사령부가 관여되어 있습니다.`,
  current:`지뢰 폭발의 원인을 둘러싼 부처 간 미묘한 입장 차이가 국감장에서 야당의 집중 공격 대상이 되었습니다.`,
  outlook:`유엔사 차원의 진상 조사 결과가 발표될 경우, 이를 바탕으로 한 책임 소재 규명과 대북 성명 발표가 이어질 것입니다.`,
  sources:[{title:`DMZ 지뢰 폭발 책임론...국방위 국감 파행 - 연합뉴스`,url:`https://www.yna.co.kr/view/AKR`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 중간선거 임박, 트럼프 2기 행정부 동맹국 압박 수위 최고조`,
  metrics:[`고율 관세 경고`,`신경제 민족주의 심화`],
  summary:`11월 미국 중간선거를 앞두고 트럼프 2기 행정부의 미국 우선주의 정책이 절정에 달하고 있습니다. 미국은 자국 내 표심을 결집하기 위해 한국과 유럽 등 주요 동맹국들을 상대로 신경제 민족주의 기조를 한층 강화하고 있습니다. 구체적으로는 자국 내 제조 공장 건설과 대규모 인프라 투자를 노골적으로 압박하며, 이에 불응할 경우 고율 관세를 부과하겠다는 엄포를 놓고 있습니다. 이는 무역 적자를 해소하고 미국 내 제조업 일자리를 창출하여 선거에서 우위를 점하려는 전략적 행보로 풀이됩니다. 동맹국들은 이러한 미국의 독단적인 보호무역주의 조치에 반발하면서도, 보복 관세의 타격을 피하기 위해 고심하고 있습니다. 전통적인 안보 동맹과 경제 이익이 분리되는 현상이 더욱 뚜렷해지는 양상입니다. 결과적으로 국제 통상 질서는 자국 이익을 최우선으로 하는 거대한 무역 전쟁의 소용돌이로 빠져들고 있습니다.`,
  keyTerms:[{term:`신경제 민족주의`,explanation:`국가의 경제적 이익과 산업 보호를 최우선 가치로 내세우며, 무역 장벽을 높이고 자국 우선주의를 실행하는 배타적 경제 기조입니다.`}],
  history:`미국은 과거부터 무역적자 해소와 제조업 부흥을 위해 관세 장벽을 카드로 활용하는 통상 정책을 꾸준히 펼쳐왔습니다.`,
  players:`미국 행정부 및 의회, 그리고 이에 대응해야 하는 한국, EU 등 주요 수출 의존형 동맹국들입니다.`,
  current:`다가오는 중간선거 압박감이 맞물리면서, 경제적 성과를 과시하기 위한 대외 무역 압박 수위가 이례적으로 높아졌습니다.`,
  outlook:`중간선거 결과에 따라 미국의 통상 압박이 정책으로 굳어질지, 혹은 일정 부분 속도 조절에 들어갈지가 결정될 것입니다.`,
  sources:[{title:`중간선거 앞둔 미국, 동맹국 향한 무역 압박 거세져 - 한겨레`,url:`https://www.hani.co.kr/arti/politics/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`우크라이나 전쟁 끝없는 소모전, 양국 에너지·드론 타격전 격화`,
  metrics:[`전력망 30% 타격`,`소모전 장기화`],
  summary:`우크라이나 전쟁이 끝을 알 수 없는 소모전 양상으로 치달으며 양국 간의 전방위적인 타격전이 격화되고 있습니다. 러시아는 혹독한 겨울을 앞두고 우크라이나의 주요 전력망과 핵심 인프라를 겨냥해 첨단 미사일 공습을 대대적으로 퍼붓고 있습니다. 이에 맞서 우크라이나 역시 자체 개발한 장거리 드론 기술을 활용해 러시아 본토의 에너지 시설과 군사 기지를 반격하며 피해를 입히고 있습니다. 수차례 종전 협상 논의가 제기되었음에도 불구하고, 양측 모두 영토와 명분 문제에서 양보 없는 평행선을 달리며 전황은 오히려 악화되고 있습니다. 국제사회는 무기 지원과 제재를 통해 개입하고 있으나, 전쟁 피로감이 전 세계적으로 확산하는 추세입니다. 무고한 민간인 사상자와 대규모 난민 발생 등 인도주의적 위기 역시 통제 불능 상태로 치닫고 있습니다. 이번 혹한기가 전쟁의 향배를 가를 중대한 분수령이 될 것이라는 군사 전문가들의 분석이 지배적입니다.`,
  keyTerms:[{term:`소모전`,explanation:`빠른 승리를 거두기보다는 적의 인력, 물자, 자원을 지속적으로 고갈시켜 지치게 만드는 길고 지루한 전투 방식을 뜻합니다.`}],
  history:`2022년 발발한 우크라이나 전쟁은 영토 탈환과 방어선 유지를 거듭하며 수년째 교착 상태에 빠져 있습니다.`,
  players:`러시아와 우크라이나 정규군, 그리고 우크라이나를 후방에서 지원하는 미국과 나토(NATO) 동맹국들입니다.`,
  current:`전선에서의 교전뿐만 아니라 서로의 전쟁 수행 능력을 마비시키기 위한 인프라 파괴 전략에 집중하고 있습니다.`,
  outlook:`겨울철 전력난과 미국 등 주요 서방 국가들의 정치 일정 변화가 향후 협상 재개의 변수가 될 것입니다.`,
  sources:[{title:`전력망 노린 러시아 공습...끝없는 우크라이나 전쟁 - KBS 뉴스`,url:`https://news.kbs.co.kr/news/view.do?ncd=`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`퍼플렉시티 'AI 컴퓨터' 발표, 인간 대체하는 에이전트 시대 개막`,
  metrics:[`20개 LLM 연동`,`400개 툴 커넥터 지원`],
  summary:`글로벌 AI 스타트업 퍼플렉시티가 단순한 질의응답을 넘어 실제 업무를 스스로 수행하는 'AI 컴퓨터'를 전격 발표했습니다. 이번에 공개된 시스템은 20개 이상의 대규모 언어 모델(LLM)과 400여 개의 외부 툴 커넥터를 연동하여 사용자의 명령을 자율적으로 처리합니다. 예를 들어 일정 조율, 데이터 분석, 시스템 디버깅 등 복잡한 사무를 사용자의 개입 없이 끝까지 완수해 내는 방식입니다. 오픈AI, 메타 등 빅테크 기업들 역시 앞다투어 기업용과 개인용 AI 에이전트를 내놓으며 기술 패권 경쟁이 새로운 국면을 맞았습니다. 이는 AI가 정보를 찾아주는 검색 엔진의 역할을 넘어, 직접 행동하고 판단하는 주체로 진화했음을 상징합니다. 산업계는 생산성 혁명을 기대하는 한편, AI의 오작동이나 보안 취약점에 대한 검증 필요성도 제기하고 있습니다. 일상적인 업무 패턴이 근본적으로 재편되는 진정한 AI 에이전트 시대가 열렸습니다.`,
  keyTerms:[{term:`AI 에이전트`,explanation:`사람의 질문에 단순히 답만 해주는 것을 넘어, 사람을 대신해 목표를 세우고 필요한 도구를 사용해 스스로 업무를 처리하는 인공지능입니다.`}],
  history:`챗GPT 등장 이후 AI는 주로 텍스트 생성과 요약에 머물렀으나, 점차 소프트웨어를 직접 조작하는 단계로 발전해 왔습니다.`,
  players:`오픈AI, 퍼플렉시티, 메타 등 글로벌 거대 기술 기업과 이를 도입하려는 산업계 전반입니다.`,
  current:`기업들은 AI 도입을 통한 비용 절감과 효율성 극대화를 목표로 앞다투어 이 차세대 시스템을 테스트하고 있습니다.`,
  outlook:`올해 연말을 기점으로 AI가 스스로 판단하고 행동하는 기술이 주요 기업의 핵심 업무 시스템에 본격적으로 상용화될 전망입니다.`,
  sources:[{title:`퍼플렉시티, 행동하는 'AI 컴퓨터' 내놨다 - ZDNet Korea`,url:`https://zdnet.co.kr/view/?no=`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`철새 남하 본격화, 가을·겨울 가축 전염병 '24시간 철통 방역' 가동`,
  metrics:[`24시간 방역 가동`,`가축 전염병 유입 경보`],
  summary:`가을과 겨울철 철새의 본격적인 남하 시기가 시작됨에 따라, 정부가 조류인플루엔자(AI) 등 치명적인 가축 전염병 확산을 막기 위해 총력전에 돌입했습니다. 농림축산식품부와 각 지자체는 가금류 농가와 철새 도래지를 중심으로 24시간 특별 방역 체계를 가동하고 나섰습니다. 특히 올해는 해외에서 발생한 바이러스 변이가 국내로 유입될 가능성이 높아 더욱 각별한 주의가 요구되고 있습니다. 방역 당국은 농장 출입 차량과 인력에 대한 소독을 대폭 강화하고, 야생 조류 분변 검사를 촘촘하게 실시하고 있습니다. 가축 전염병이 확산될 경우 계란과 닭고기 등 주요 밥상 물가 폭등으로 직결될 수 있어 경제적 파장 또한 무시할 수 없습니다. 농가들은 외부 접촉을 철저히 차단하며 방역 수칙 준수에 사활을 걸고 있습니다. 선제적인 예방 조치만이 매년 반복되는 바이러스 피해를 최소화할 수 있는 유일한 대안으로 꼽힙니다.`,
  keyTerms:[{term:`조류인플루엔자`,explanation:`닭, 오리, 철새 등 조류에게 감염되는 호흡기 질환으로, 전염성이 매우 강하고 폐사율이 높아 양계 농가에 치명적인 바이러스입니다.`}],
  history:`매년 겨울철 시베리아 등 북방에서 날아오는 겨울 철새 무리를 통해 국내 농가로 바이러스가 유입되는 패턴이 반복되어 왔습니다.`,
  players:`농림축산식품부, 지방자치단체 방역팀, 전국의 가금류 사육 농가 및 가축 방역 전문가들입니다.`,
  current:`현재 첫 철새 무리가 도래하기 시작하는 초기 단계로, 아직 농가 발병 사례는 없으나 위험도가 급격히 상승하는 시점입니다.`,
  outlook:`내년 봄 철새가 다시 북상할 때까지 긴장 상태가 지속되며, 방역망 뚫림 여부가 축산 물가 안정의 핵심 변수가 될 것입니다.`,
  sources:[{title:`철새 남하 시작...가축 방역 '비상' - MBC 뉴스`,url:`https://imnews.imbc.com/news/2026/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`가속화되는 인구 위기, 농촌 빈집 급증으로 지방소멸 현실화`,
  metrics:[`농촌 빈집 비율 15% 돌파`,`초고령화 심화`],
  summary:`대한민국의 저출산과 초고령화 여파가 거세지면서 농어촌 지역의 빈집이 기하급수적으로 늘어나며 지방소멸 우려가 현실로 다가오고 있습니다. 통계청 자료에 따르면 일부 군 단위 지자체의 경우 전체 주택 중 빈집 비율이 15%를 넘어선 것으로 파악되었습니다. 청년층의 지속적인 수도권 유출과 남은 고령 인구의 사망으로 인해 마을 단위 공동체가 붕괴 위기에 처해 있습니다. 방치된 낡은 가옥들은 경관 훼손은 물론 우범지대로 전락할 위험이 커 사회적 골칫거리로 전락하고 있습니다. 각 지자체가 귀농 및 귀촌 지원금 확대와 빈집 정비 사업을 추진하고 있지만, 턱없이 부족한 예산과 인프라 한계로 실질적인 해결에는 미치지 못하고 있습니다. 근본적인 원인인 인구 구조 변화를 되돌리기 어려운 만큼, 공간 압축 정책 등 발상의 전환이 시급하다는 목소리가 큽니다. 지방 살리기를 위한 범정부 차원의 강력한 패러다임 혁신이 요구되는 시점입니다.`,
  keyTerms:[{term:`지방소멸`,explanation:`젊은 인구의 이탈과 낮은 출산율로 인해 지방의 인구가 줄어들어, 결국 마을이나 도시 자체가 사라질 위험에 처하는 현상입니다.`}],
  history:`수십 년간 지속된 수도권 일극 집중 현상과 급격한 출산율 저하가 맞물려 지방 인구의 만성적인 감소를 초래했습니다.`,
  players:`생존 위기에 몰린 지방자치단체, 중앙 정부, 그리고 지방을 떠나 도시로 향하는 청년 세대입니다.`,
  current:`빈집 문제와 폐교 증가가 눈에 띄게 가속화되면서, 정책적 개입의 골든타임이 얼마 남지 않았다는 위기감이 팽배합니다.`,
  outlook:`거점 도시 중심의 인프라 재편이나 체류 인구 확대를 유도하는 새로운 형태의 지방 발전 특별법 제정 논의가 본격화될 것입니다.`,
  sources:[{title:`농촌 덮친 빈집 쇼크...지방소멸 가속 - 조선일보`,url:`https://www.chosun.com/national/article/`}]
}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`파라마운트와 워너 브라더스 디스커버리, 1,100억 달러 규모의 초대형 미디어 합병 완료`,
  metrics:[`인수 규모 1,100억 달러`,`초대형 미디어 기업 탄생`],
  summary:`글로벌 미디어 거인 파라마운트가 워너 브라더스 디스커버리를 1,100억 달러에 인수하는 절차가 완료되었다. 스트리밍 시장에서 넷플릭스와 디즈니 등 거대 경쟁사들에 맞서기 위한 생존 전략으로 분석된다. 양사의 방대한 콘텐츠 라이브러리가 결합되면서 시장 판도에 큰 변화가 예상된다. 특히 이번 인수합병(M&A)은 미디어 업계 역대 최대 규모 중 하나로 기록될 전망이다. 향후 구독자 확보 경쟁과 콘텐츠 투자 전략이 시장의 핵심 관전 포인트로 떠오르고 있다. 구조조정 및 조직 통합 과정에서 발생할 수 있는 마찰을 어떻게 최소화할지가 초기 성공의 관건이다.`,
  keyTerms:[{term:`인수합병(M&A)`,explanation:`기업이 다른 기업을 사들이거나 두 기업이 하나로 합쳐지는 것을 뜻한다. 시장 점유율을 높이거나 경쟁력을 강화하기 위해 주로 사용된다.`}],
  history:`넷플릭스 주도의 스트리밍 시장 재편 이후 전통적 미디어 기업들은 수익성 악화와 가입자 정체라는 이중고를 겪어왔다.`,
  players:`넷플릭스, 디즈니 등 선두주자들에 대항하기 위해 파라마운트와 워너 브라더스가 결단을 내렸다.`,
  current:`두 회사의 합병으로 압도적인 지식재산권을 보유한 거대 플랫폼이 탄생하며 시장의 긴장감이 고조되고 있다.`,
  outlook:`반독점 규제 당국의 최종 승인 여부와 합병 후 요금제 개편 등 소비자 체감 변화에 관심이 쏠린다.`,
  sources:[{title:`파라마운트-워너 미디어 빅딜 - 로이터`,url:`https://www.reuters.com`},{title:`초대형 합병 완료 - Axios`,url:`https://www.axios.com`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`중기부 'AI 전환(AX)' 핵심 사업 예산 집행률 30% 미만으로 실효성 논란`,
  metrics:[`스마트 제조지원 5.1%`,`AI 도우미 구축 14.7%`],
  summary:`중소벤처기업부의 인공지능 전환 이른바 'AX(AI Transformation)' 핵심 사업의 예산 집행률이 30%를 밑도는 것으로 나타났다. 국정감사 자료에 따르면 소공인 스마트 제조지원이나 소상공인 AI 도우미 구축 사업 등의 집행률이 매우 저조하다. 예산 확보에도 불구하고 현장 수요와 동떨어진 정책 설계나 홍보 부족이 원인으로 지목된다. 정부의 디지털 혁신 드라이브가 실제 산업 현장에는 닿지 못하고 있다는 비판이 제기된다. AX(AI Transformation) 가속화를 위해서는 지원 절차 간소화와 맞춤형 컨설팅이 시급하다는 목소리가 높다.`,
  keyTerms:[{term:`AX(AI Transformation)`,explanation:`인공지능 기술을 도입하여 기업의 업무 프로세스나 비즈니스 모델을 근본적으로 혁신하는 것을 말한다.`}],
  history:`글로벌 기술 경쟁 격화에 따라 정부는 중소기업과 소상공인의 디지털 경쟁력을 높이기 위해 대규모 예산을 편성했다.`,
  players:`중소벤처기업부와 예산을 지원받아야 할 중소기업 및 소상공인들이 주요 이해관계자다.`,
  current:`국정감사에서 실집행률이 공개되면서 정책의 실효성과 탁상행정 논란이 불거졌다.`,
  outlook:`향후 예산 집행률 제고를 위한 정부의 정책 보완과 현장 체감형 지원책 마련 여부가 주목된다.`,
  sources:[{title:`중기부 AI 전환 예산 집행 저조 - 연합뉴스`,url:`https://www.yna.co.kr`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`삼성바이오로직스 노조, 법 개정 명분으로 삼성전자와 직접 교섭 요구`,
  metrics:[`총파업 국면 전환`,`2대 주주 삼성전자`],
  summary:`삼성바이오로직스 노동조합이 2대 주주인 삼성전자와의 직접 교섭을 요구하며 파장을 일으키고 있다. 노조 측은 삼성전자가 인사와 보상에 실질적으로 관여하고 있다며 이를 근거로 내세웠다. 최근 국회를 통과한 노란봉투법 개정안이 실질적 지배력을 가진 원청업체의 교섭 의무를 확대하면서 노조의 주장에 힘을 싣고 있다. 반면 사측은 경영 개입이 전혀 없었다며 노조의 주장을 강하게 반박하고 있다. 재계는 이번 사태가 단순한 노사 갈등을 넘어, 향후 원하청 교섭 관행에 큰 영향을 미칠 선례가 될 것으로 보고 예의주시하고 있다.`,
  keyTerms:[{term:`노란봉투법`,explanation:`하청업체 노동자가 실질적인 지배력을 가진 원청업체를 상대로 교섭할 수 있도록 하고, 파업에 대한 과도한 손해배상 청구를 제한하는 노조법 개정안이다.`}],
  history:`원청의 실질적 지배력을 둘러싼 하청 노조와의 갈등은 오랫동안 산업계의 핵심 쟁점이었으며, 잦은 분쟁을 유발했다.`,
  players:`직접 교섭을 요구하는 삼성바이오로직스 노조, 선을 긋는 사측, 그리고 2대 주주인 삼성전자가 얽혀 있다.`,
  current:`노조가 법 개정 취지를 명분으로 압박 수위를 높이면서 대기업 재계 전반에 긴장감이 돌고 있다.`,
  outlook:`고용노동부의 유권해석 및 법원의 후속 판결에 따라 국내 노사관계 지형이 크게 요동칠 수 있다.`,
  sources:[{title:`삼바 노조, 삼성전자에 교섭 요구 - 조선일보`,url:`https://www.chosun.com`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`프랑스 전역에서 열악한 교육 환경에 항의하는 대규모 학생 및 교사 시위 격화`,
  metrics:[`전국적 파업`,`경찰 물대포 동원`],
  summary:`프랑스 전역에서 교원 부족과 열악한 학교 시설 등 교육 환경 개선을 촉구하는 학생과 교사들의 대규모 시위가 격화되고 있다. 파리를 비롯한 주요 도시에서는 시위대와 경찰이 충돌하며 최루탄과 물대포가 동원되는 등 긴장이 최고조에 달했다. 시위대는 정부의 교육 예산 삭감 정책이 공교육 붕괴를 초래하고 있다고 강하게 비판했다. 반면 마크롱 정부는 재정 건전성 확보를 위해 긴축 재정이 불가피하다는 입장을 고수하고 있다. 이번 시위는 교육 불평등에 대한 국민적 분노가 폭발한 결과로, 정부의 대응 방식에 따라 정권의 지지율에도 큰 타격을 줄 수 있다.`,
  keyTerms:[{term:`긴축 재정`,explanation:`정부가 국가 부채를 줄이거나 물가를 잡기 위해 지출을 엄격히 줄이고 세금을 늘리는 씀씀이 억제 정책이다.`}],
  history:`프랑스 공교육 현장은 수년간 이어진 예산 동결과 인력 부족으로 교사와 학생들의 불만이 누적되어 왔다.`,
  players:`교육 예산 확충을 요구하는 노조 측과 국가 부채 절감을 중시하는 프랑스 마크롱 정부가 맞서고 있다.`,
  current:`평화롭던 집회가 점차 물리적 충돌로 번지면서 폭력 사태에 대한 우려와 시위 동정론이 교차하고 있다.`,
  outlook:`교육 당국과 노조 간의 타협점이 조속히 마련되지 않으면 다른 공공 부문의 연대 파업으로 확산될 위험이 있다.`,
  sources:[{title:`프랑스 학교 시위 격화 - BBC`,url:`https://www.bbc.com`},{title:`경찰 최루탄 진압 - 가디언`,url:`https://www.theguardian.com`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`사우디 주도 연합군과 후티 반군 간 충돌 재점화로 중동 정세 긴장 고조`,
  metrics:[`미사일 요격 발생`,`예멘 전선 격화`],
  summary:`예멘 내전 전선에서 사우디아라비아 주도 연합군과 후티 반군 간의 무력 충돌이 재점화되며 중동 지역의 긴장이 다시 고조되고 있다. 연합군의 공습과 후티 반군의 미사일 요격 시도가 이어지면서 휴전 협상 노력이 무산될 위기에 처했다. 이번 충돌은 지역 내 패권을 둘러싼 이란과 사우디 간의 대리전 성격을 띠고 있어 사태 해결이 쉽지 않다. 국제사회는 민간인 피해 확산과 글로벌 원유 수송로인 홍해의 안전을 우려하며 양측의 자제를 촉구했다. 중동 정세 불안은 언제든 국제 유가 급등과 세계 경제의 불확실성으로 직결될 수 있는 뇌관이다.`,
  keyTerms:[{term:`대리전`,explanation:`대립하는 두 강대국이 직접 싸우지 않고, 제3국의 내부 분쟁에 개입해 각자의 지지 세력을 내세워 싸우는 전쟁 형태다.`}],
  history:`예멘 내전은 사우디 연합군과 이란의 지원을 받는 후티 반군의 장기 대립으로 이어지며 최악의 인도적 위기를 낳았다.`,
  players:`사우디아라비아, 후티 반군, 배후의 이란, 그리고 평화를 중재하려는 서방 국가들이 복잡하게 얽혀 있다.`,
  current:`휴전 기대감으로 소강상태를 보이던 전선에서 양측이 다시 치명적인 무기를 동원해 무력 공방을 벌이고 있다.`,
  outlook:`국제사회의 중재 노력이 실패할 경우 홍해 무역로 차질 및 국제 유가 상승 등 세계 경제 전반에 악영향을 미칠 수 있다.`,
  sources:[{title:`예멘 전선 다시 격화 - 알자지라`,url:`https://www.aljazeera.com`},{title:`사우디와 후티 충돌 - PBS`,url:`https://www.pbs.org`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`국정감사에서 대법원장 대상 공방 가열, 사법부 독립성 침해 논란`,
  metrics:[`사법부 압박 수위 최고조`,`형사사법체계 쟁점화`],
  summary:`국회 국정감사에서 새 형사사법체계 및 재판 지연 문제를 두고 조희대 대법원장에 대한 여야의 공방이 치열하게 벌어졌다. 특히 여권 의원들은 특정 재판 지연 문제와 법관 인사 편향성을 거세게 지적하며 대법원장을 압박했다. 이에 대해 법조계 일각에서는 헌법이 보장하는 사법부 독립성이 심각하게 침해될 수 있다며 강한 우려를 표명했다. 대법원장은 재판의 독립과 절차적 정당성을 훼손하는 어떠한 정치적 외압에도 흔들리지 않겠다는 단호한 입장을 피력했다. 정치가 사법을 흔드는 이른바 '사법의 정치화' 현상은 이번 국정감사 기간 내내 뜨거운 쟁점이 될 전망이다.`,
  keyTerms:[{term:`사법부 독립성`,explanation:`법관이 어떠한 정치적, 외부적 압력이나 간섭도 받지 않고 오직 법과 양심에 따라 공정하게 재판할 수 있도록 보장하는 원칙이다.`}],
  history:`과거부터 주요 정치적 판결이나 사법부 요직 인사를 두고 입법부와 사법부 간의 팽팽한 기싸움은 고질적인 문제였다.`,
  players:`사법부를 대표하는 대법원장과 국정감사 질의를 통해 압박을 가하는 국회의원들이 직접 대립하고 있다.`,
  current:`주요 정치인들의 재판 이슈가 맞물린 민감한 시기에 국감이 열리면서 양측의 날 선 공방이 이어지고 있다.`,
  outlook:`이번 공방이 향후 법원의 주요 사건 판결 속도나 핵심 법관 인사에 실질적 영향을 미칠지 관심이 집중되고 있다.`,
  sources:[{title:`국감 대법원장 공방, 사법 독립 논란 - 미디어인뉴스`,url:`https://www.mediainnews.com`},{title:`조희대 대법원장 출석 국감 - 연합뉴스`,url:`https://www.yna.co.kr`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`미국 테네시주 사형수 독극물 주사 집행 실패 참사, 거센 인권 논란`,
  metrics:[`독극물 집행 실패`,`미국 전역 논쟁 점화`],
  summary:`미국 테네시주에서 사형수에 대한 독극물 주사 사형 집행이 실패로 돌아가면서 큰 파장이 일고 있다. 사형 집행 중 치명적 독극물이 제대로 투여되지 않아 사형수가 고통 속에서 깨어나는 충격적인 사태가 발생했다. 이 사건을 계기로 미국 내 인권 단체들은 독극물 주사의 잔혹성과 사형제 자체의 비윤리성을 강하게 규탄하고 나섰다. 반면 피해자 가족들은 정의 실현이 지연되고 있다며 형 집행 절차를 바로잡으라고 주 정부를 비판했다. 생명권 존중과 흉악범에 대한 형벌의 정당성을 묻는 사형제 폐지 논쟁이 미국 전역에서 다시 격렬하게 점화되고 있다.`,
  keyTerms:[{term:`사형제 폐지`,explanation:`국가가 범죄자의 생명을 강제로 박탈하는 궁극의 형벌인 사형 제도를 인권 보호 등을 이유로 법에서 완전히 없애자는 주장이다.`}],
  history:`미국 내 여러 주에서는 제약사들의 독극물 공급 거부와 잇따른 집행 과정의 사고로 인해 사형 방식에 대한 논란이 끊이지 않았다.`,
  players:`잔혹한 형벌을 멈춰야 한다는 인권 단체와 확정된 사형 판결의 신속한 집행을 요구하는 주 정부 및 유족이 충돌하고 있다.`,
  current:`전례 없는 끔찍한 집행 실패 사고가 발생하면서 기존 사형 방식의 기술적, 윤리적 결함이 여과 없이 폭로되었다.`,
  outlook:`이번 사건이 연방대법원의 위헌 심사로 이어지거나, 각 주의 공식적인 사형 집행 유예 선언을 이끌어낼지 주목된다.`,
  sources:[{title:`사형 집행 실패 논란 - 워싱턴포스트`,url:`https://www.washingtonpost.com`},{title:`크리스타 파이크 사건 파장 - 악시오스`,url:`https://www.axios.com`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`러시아 전염병 연구소 직원 의문사, 흑사병 유출 의혹 제기로 긴장 고조`,
  metrics:[`고위험 연구소 1명 사망`,`국제사회 해명 요구`],
  summary:`러시아의 한 고위험 전염병 연구소에서 근무하던 직원이 원인 불명으로 사망하면서 치명적인 흑사병 유출 의혹이 확산되고 있다. 해당 연구소는 과거 에볼라, 탄저병 등 고위험 병원체를 광범위하게 다뤄온 곳으로 최고 수준의 보안 시설이다. 미국과 세계보건기구(WHO)는 전 세계적인 새로운 감염병 확산을 막기 위해 러시아 정부에 즉각적이고 투명한 정보 공개를 요구했다. 그러나 러시아 당국은 단순한 내부 사고일 뿐이라며 외부 조사와 개입을 강하게 거부하고 있다. 병원체 유출 사고에 대한 공포가 커지면서 국제사회의 보건 안보 불안감이 급격히 고조되는 상황이다.`,
  keyTerms:[{term:`병원체 유출`,explanation:`연구소나 병원 등 통제된 안전 시설에서 보관 중이던 바이러스나 세균 등 치명적인 질병 원인균이 외부로 빠져나가는 사고를 뜻한다.`}],
  history:`과거 냉전 시절부터 러시아의 군사 및 생물학 무기 연구소들은 정보 투명성 부족 문제로 서방 국가들의 강한 의심을 받아왔다.`,
  players:`투명한 진상 규명을 압박하는 세계보건기구와 미국, 그리고 이를 부당한 내정 간섭으로 일축하는 러시아 정부가 대립 중이다.`,
  current:`치명률이 높은 흑사병 관련 병원체가 다뤄진 곳에서의 인명 사고인 만큼, 당국의 은폐 의혹이 눈덩이처럼 커지고 있다.`,
  outlook:`러시아가 독립적인 국제 의료 조사단의 방문을 끝내 거부할 경우, 외교적 마찰과 보건 관련 제재로 이어질 가능성이 높다.`,
  sources:[{title:`러시아 연구소 사망 미스터리 - CBS News`,url:`https://www.cbsnews.com`},{title:`WHO 정보 공개 촉구 - 알자지라`,url:`https://www.aljazeera.com`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`올해 1~7월 10대 마약류 사범 370명 검거, 작년 전체 인원의 79% 육박`,
  metrics:[`7개월 만에 370명 검거`,`작년 전체의 79% 육박`],
  summary:`최근 국내에서 10대 청소년들의 마약류 범죄가 위험 수위를 넘어서며 사회적 경각심이 높아지고 있다. 경찰청 국감 자료에 따르면 올해 1월부터 7월까지 검거된 10대 마약사범은 총 370명으로, 불과 7개월 만에 작년 전체 검거 인원의 약 79%에 육박했다. 텔레그램 등 익명성이 짙은 메신저를 통해 강력 마약에 너무나 쉽게 접근할 수 있게 된 것이 주된 원인으로 꼽힌다. 호기심에 시작한 불법 약물 투약이 걷잡을 수 없는 중독으로 이어지며 평범한 교실까지 심각한 위협을 받고 있다. 전문가들은 엄벌 위주의 단속을 넘어, 다크웹(Dark Web) 모니터링 강화와 청소년 맞춤형 치유 시스템이 시급하다고 지적한다.`,
  keyTerms:[{term:`다크웹(Dark Web)`,explanation:`일반적인 검색 엔진으로는 찾을 수 없고 특수한 웹 브라우저를 통해서만 접속할 수 있는 암호화된 인터넷망으로, 마약 등 불법 거래에 흔히 악용된다.`}],
  history:`과거 특정 직업군에 집중되었던 마약 범죄가 최근 몇 년 새 스마트폰 보급 확산과 맞물려 미성년자와 일반 청소년층으로 파고들었다.`,
  players:`불법 약물을 은밀히 유통하는 범죄 조직, 치명적 유혹에 노출된 10대들, 그리고 방어에 나선 경찰 및 교육 당국이 있다.`,
  current:`다이어트 약이나 집중력 보조제로 교묘하게 위장된 의료용 마약류까지 무분별하게 퍼지면서 학부모들의 불안감이 최고조에 달했다.`,
  outlook:`경찰의 대대적인 연말 특별 단속과 함께, 일선 학교 내 실효성 있는 마약 예방 교육 의무화 논의가 탄력을 받을 전망이다.`,
  sources:[{title:`10대 마약사범 급증 - 연합뉴스`,url:`https://www.yna.co.kr`}]
}]

  tag:`2026-10-06`,
  label:`2026년 10월 6일 (화)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`AI 반도체 수출 호조에도 내수 침체 장기화로 한국 경제 'K자형 양극화' 심화`,
  metrics:[`반도체 수출 전년 대비 50% 이상 증가`,`민간소비 증가율 1%대 초반 정체`],
  summary:`한국 경제가 반도체를 중심으로 수출 호조를 보이고 있지만, 내수 침체가 장기화되며 이른바 K자형 양극화 현상이 뚜렷해지고 있습니다. HBM 등 AI 반도체 관련 기업들의 실적은 사상 최고치를 기록 중인 반면, 영세 자영업자 폐업과 가계의 소비 여력은 바닥을 치고 있습니다. 고금리와 고물가 여파로 인해 대기업의 수출 성과가 서민 경제로 흘러내리는 낙수효과가 사실상 사라진 구조적 문제로 분석됩니다. 특히 부동산 PF 부실 여진으로 건설투자까지 얼어붙으면서 내수 산업 전반의 타격이 매우 큰 상황입니다. 한국은행의 기준금리 인하 고민이 깊어지는 가운데 정책적 딜레마가 지속되고 있습니다. 정부 차원에서 체감 경기를 살리기 위한 실질적이고 정교한 내수 부양 정책 마련이 시급하다는 목소리가 커지고 있습니다.`,
  keyTerms:[{term:`K자형 양극화`,explanation:`특정 산업이나 계층은 크게 성장하는 반면, 다른 쪽은 오히려 침체하며 그래프 모양처럼 양극단으로 벌어지는 경제 현상입니다.`}],
  history:`팬데믹 이후 고금리 환경이 장기화되면서 부채가 많은 자영업자와 서민층의 경제적 타격이 지속적으로 누적되어 왔습니다.`,
  players:`막대한 수출 이익을 내는 반도체 대기업과 내수 침체의 직격탄을 맞은 소상공인, 그리고 통화정책 키를 쥔 한국은행이 주요 주체입니다.`,
  current:`반도체 호황이라는 착시 효과가 거시 경제 지표를 가리고 있어, 일반 국민이 체감하는 경기 빙하기가 더욱 적나라하게 부각되는 변곡점입니다.`,
  outlook:`향후 금리 인하 시점과 내수 부양책의 구체적인 강도에 따라 얼어붙은 소비 심리가 반등할 수 있을지 시장의 이목이 쏠리고 있습니다.`,
  sources:[{title:`반도체 날지만 내수는 꽁꽁... 뚜렷해진 양극화 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`한은 기준금리 인하 고심, 서민 체감 경기 빙하기 - 매일경제`,url:`https://www.mk.co.kr/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`고금리 장기화 우려 속에서도 월가 'AI 랠리'로 나스닥 사상 최고치 경신`,
  metrics:[`미 국채 10년물 금리 5% 육박`,`빅테크 AI 인프라 투자 30% 이상 급증`],
  summary:`미국 국채 10년물 금리가 5%에 육박하는 등 고금리 뉴노멀에 대한 시장의 경계감이 커지고 있지만 미 증시는 강한 상승장을 이어가고 있습니다. 엔비디아, 마이크로소프트 등 대형 기술주들이 AI 인프라 구축에 천문학적인 자본을 투입하며 강력한 미래 실적 기대감을 견인하고 있기 때문입니다. 통상적으로 고금리는 미래 가치를 할인해 기술주에 악재로 작용하지만, 현재는 AI 산업의 압도적 폭발력이 자본 조달 비용 부담을 완전히 상쇄하는 이례적인 장세가 연출되고 있습니다. 월가에서는 이를 두고 AI 랠리가 이끄는 새로운 패러다임이라고 평가합니다. 다만 높은 차입 금리 부담으로 인해 AI 수혜를 보지 못하는 전통 제조업 기업들의 도산 위험은 오히려 커지고 있습니다. 이에 따라 주식 시장 내 쏠림 현상과 차별화가 앞으로 더욱 심화할 것이라는 전망이 제기됩니다.`,
  keyTerms:[{term:`고금리 뉴노멀`,explanation:`과거의 초저금리 시대로 다시 돌아가지 않고, 예전보다 높은 수준의 금리가 새로운 표준으로 굳어지는 경제 환경을 뜻합니다.`}],
  history:`미국 연준의 고강도 긴축 이후 인플레이션이 쉽게 꺾이지 않으면서, 시장에는 높은 차입 비용이 장기화될 것이라는 우려가 자리 잡았습니다.`,
  players:`자금 조달 비용을 감당할 수 있는 대규모 빅테크 기업들과 금리 부담에 짓눌린 전통 기업, 기준금리를 결정하는 연준이 주요 핵심입니다.`,
  current:`금리 인하에 대한 시장의 기대가 약화되었음에도 불구하고, 오직 AI 성장성 하나가 전체 주식 시장의 밸류에이션을 끌어올리는 특이한 구간입니다.`,
  outlook:`빅테크 기업들의 분기 실적 발표 결과와 향후 연준의 고용 및 물가 지표 해석에 따라 기술주 랠리의 지속 여부가 판가름 날 전망입니다.`,
  sources:[{title:`고금리에도 질주하는 월스트리트... AI가 이끄는 랠리 - Bloomberg`,url:`https://www.bloomberg.com/`},{title:`나스닥 최고치 경신, 전통 기업과 빅테크 차별화 심화 - WSJ`,url:`https://www.wsj.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`중동 군사적 긴장 고조로 글로벌 원유 공급망 리스크 재부각`,
  metrics:[`WTI 원유 배럴당 80달러 재돌파`,`G7 비상 비축유 방출 대기 물량 확보`],
  summary:`중동 지역의 무력 충돌 격화와 주요 해협 봉쇄 리스크가 불거지면서 잠잠하던 국제 원유 시장이 다시 요동치고 있습니다. 이란을 비롯한 주요 산유국 주변의 지정학적 긴장이 극에 달하면서 텍사스산원유 가격은 단숨에 배럴당 80달러 선을 재돌파했습니다. 글로벌 에너지 공급망 차질에 대한 공포 심리가 확산되자, 미국과 G7 국가들은 즉각 대응에 나섰습니다. 주요 선진국들은 비상 비축유 추가 방출 카드를 만지작거리며 유가 억제와 시장 불안 진정에 총력을 기울이고 있습니다. 에너지 가격 불안은 간신히 둔화되던 글로벌 인플레이션을 다시 자극할 수 있어 각국 중앙은행의 금리 정책 셈법을 매우 복잡하게 만들고 있습니다. 시장 참가자들은 단기적인 유가 급등락이 실물 경제 전반에 미칠 파장을 극도로 예의주시하며 사태의 추이를 지켜보고 있습니다.`,
  keyTerms:[{term:`비상 비축유`,explanation:`갑작스러운 전쟁이나 재난으로 에너지 수급 위기 및 유가 폭등이 발생할 때 시장 안정을 위해 국가가 미리 저장해 둔 원유를 방출하는 물량입니다.`}],
  history:`과거 수년간 중동 지역의 고질적인 분쟁 때마다 원유 수급 불안이 반복되었으며, 팬데믹 이후 에너지 가격 변동성은 물가에 직접적인 타격을 입혔습니다.`,
  players:`호르무즈 해협을 통제하려는 중동 산유국들과 에너지 가격 급등을 막으려는 미국 및 유럽 등 주요 석유 소비국들의 줄다리기가 이어집니다.`,
  current:`글로벌 금리 인하 사이클이 조심스럽게 시작되려는 시점에 유가 급등이라는 거대한 복병이 나타나 인플레이션 통제에 적신호가 켜진 상태입니다.`,
  outlook:`군사 충돌의 확전 여부와 미국 주도의 원유 공급 안정화 조치 실효성이 향후 글로벌 유가 안정세를 결정지을 가장 중요한 변수입니다.`,
  sources:[{title:`중동 불안에 국제 유가 급등... 배럴당 80달러 돌파 - Reuters`,url:`https://www.reuters.com/`},{title:`G7 유가 안정 위해 원유 방출 저울질 - FT`,url:`https://www.ft.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`2026년 국회 국정감사 개막, 첫날부터 주요 인사 증인 채택 두고 여야 정면충돌`,
  metrics:[`피감기관 800여 곳 대상 진행`,`주요 쟁점 증인 채택 건수 50여 건 합의 불발`],
  summary:`2026년 정기국회 국정감사가 전국의 피감기관 800여 곳을 대상으로 오늘 일제히 막을 올렸습니다. 국감 첫날부터 민생 안정을 강조하는 여당과 정부의 각종 실정 검증을 벼르는 야당 간의 치열한 기싸움이 벌어지고 있습니다. 특히 대법원장을 비롯한 주요 고위 공직자들의 핵심 증인 채택 여부를 두고 각 상임위마다 고성과 파행이 잇따르는 등 정면충돌이 정점에 달했습니다. 야당은 부동산, 인사 참사, 외교안보 등 국정 전반에 걸친 전방위적인 송곳 검증을 예고했습니다. 반면 여당은 이를 국정 발목잡기용 정치 공세로 규정하며 철저한 방어막을 치고 여론전에 집중하고 있습니다. 내년 대형 선거를 앞두고 정국 주도권을 쥐기 위한 여야의 극한 대립이 이번 국정감사 기간 내내 지속될 것으로 보입니다.`,
  keyTerms:[{term:`피감기관`,explanation:`입법부인 국회가 행정부의 정책 수행과 예산 집행이 올바른지 조사하고 감사할 때, 그 대상이 되는 국가 기관이나 공공기관을 뜻합니다.`}],
  history:`최근 2년간 지속된 물가 상승과 부동산 정책 관련 논란, 주요 부처 인사 문제 등으로 인해 정치권의 책임 공방이 계속 누적되어 왔습니다.`,
  players:`대통령실 및 주요 부처 정책을 엄호하는 여당 지도부와, 송곳 검증을 통해 대안을 제시하며 정권 심판론을 부각하려는 거대 야당이 대립하고 있습니다.`,
  current:`각종 쟁점 법안 처리와 증인 채택 합의가 불발되면서 첫날부터 정상적인 상임위 진행이 차질을 빚고 있으며, 양측 모두 물러서지 않고 있습니다.`,
  outlook:`경제 및 외교 분야 핵심 증인들이 국정감사장에 출석할 경우, 새롭게 제기되는 의혹과 여론의 향배가 향후 정국의 최대 분수령이 될 것입니다.`,
  sources:[{title:`2026 국감 막 올랐다... 시작부터 주요 증인 쟁탈전 - KBS`,url:`https://news.kbs.co.kr/`},{title:`여야 벼랑 끝 대치, 정책 국감 실종 우려 - 조선일보`,url:`https://www.chosun.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`서부전선 DMZ 지뢰 폭발 원인 '북한군 매설' 최종 확인, 대북 긴장 최고조`,
  metrics:[`군사분계선 이남 1km 지점 발견`,`대북 확성기 방송 일 10시간으로 확대`],
  summary:`최근 서부전선 비무장지대 이남 지역에서 발생한 의문의 지뢰 폭발 사건이 북한군의 의도적인 매설 도발로 최종 확인되었습니다. 국방부 합동조사단은 현장에서 수거된 잔해와 지형 분석 결과를 종합한 결과 북한군이 야간을 틈타 군사분계선 이남으로 넘어와 지뢰를 묻은 정황을 명확히 확보했다고 발표했습니다. 이에 우리 군 당국은 즉각 전방 최전방 지역의 대북 확성기 방송 시간을 대폭 연장하고 추가적인 상응 조치를 경고하는 등 강경 대응에 돌입했습니다. 접경 지역을 중심으로 남북 간 군사적 긴장이 최근 몇 년 새 최고조에 달하며 불안감이 커지고 있습니다. 정치권에서도 북한의 명백한 정전협정 위반 도발에 대한 단호하고 치밀한 군사적 대응을 한목소리로 주문했습니다. 동시에 우발적인 대규모 무력 충돌 방지를 위한 안보 태세의 전면적인 재점검 요구가 각계에서 쏟아지고 있습니다.`,
  keyTerms:[{term:`군사분계선`,explanation:`정전협정에 따라 남북한의 직접적인 무력 충돌을 막기 위해 한반도를 가로질러 설정된 경계선으로, 흔히 휴전선이라고 불립니다.`}],
  history:`과거에도 목함지뢰 폭발 사건 등 국지적인 도발이 발생한 바 있으며, 북한은 최근 대남 강경 기조를 굳히며 잇달아 긴장을 조성해 왔습니다.`,
  players:`도발을 주도한 북한 군부와 강경 대응 방침을 천명한 한국 국방부, 그리고 확전 방지를 중재하려는 주한미군 및 국제사회가 얽혀 있습니다.`,
  current:`군 당국의 강경한 확성기 방송 재개 및 물리적 경계 강화 조치로 인해 접경 지역 일대에 언제든 추가 국지전이 벌어질 수 있는 일촉즉발의 상황입니다.`,
  outlook:`북한의 추가적인 대남 무력 시위 여부와 우리 군의 대응 수위 조절이 향후 한반도 평화 프로세스의 단기적 운명을 좌우할 예정입니다.`,
  sources:[{title:`서부전선 지뢰 폭발, 북한 소행으로 결론 - 중앙일보`,url:`https://www.joongang.co.kr/`},{title:`군, 대북 확성기 방송 확대... 긴장 최고조 - SBS`,url:`https://news.sbs.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 우선주의 심화로 동맹국 방위비·관세 청구서 압박 거세져`,
  metrics:[`주요 동맹국 방위비 분담금 인상률 20% 압박`,`수입 자동차·철강 추가 관세율 최대 15% 검토`],
  summary:`11월 핵심 선거를 앞둔 미국 정부가 외교와 안보를 철저히 자국 경제 이익과 맞교환하는 거래적 동맹 기조를 더욱 노골화하고 있습니다. 미국은 유럽과 아시아 핵심 동맹국들을 상대로 방위비 분담금의 대폭적인 인상을 강력하게 요구하고 나섰습니다. 이와 동시에 자동차와 철강 등 우방국의 주력 수출품에 대한 대규모 추가 관세 인상 카드를 꺼내 들며 전방위적 압박을 가하고 있습니다. 미국의 군사 안보 우산과 무역 이익을 연계하는 이러한 고강도 압박에 한국을 비롯한 우방국들의 외교적, 통상적 부담이 급증하는 상황입니다. 다자주의 가치 연대보다는 철저한 미국의 경제적 손익계산서를 앞세우는 고립주의 정책이 글로벌 리더십의 근간을 흔들고 있습니다. 전문가들은 이러한 기조가 결과적으로 글로벌 공급망 블록화와 무역 분쟁을 극단적으로 심화시킬 것이라고 경고합니다.`,
  keyTerms:[{term:`거래적 동맹`,explanation:`전통적인 동맹의 가치를 상호 굳건한 신뢰가 아니라 철저하게 물질적, 경제적 이익을 서로 주고받는 비즈니스 관계로 간주하는 외교 방식을 뜻합니다.`}],
  history:`과거 정권에서 시작된 자국 우선주의 정책이 미국의 핵심 선거 사이클과 맞물리면서 지지층 결집을 위한 강력한 대외 정책으로 재부상했습니다.`,
  players:`선거 승리를 위해 강경한 청구서를 내미는 미국 행정부와, 안보 불안감 속에서 경제적 손실을 최소화하려는 유럽연합 및 한국 등 주요 동맹국들입니다.`,
  current:`우방국들이 다자간 연합을 통해 미국의 정책에 집단 반발할 움직임을 보이고 있으나, 개별 국가별로 미국과의 협상 테이블에 불려 나가는 상황입니다.`,
  outlook:`미국 내부의 선거 결과와 동맹국들의 무역 보복 조치 대응 방향에 따라 향후 글로벌 통상 및 안보 질서의 새 판짜기가 속도를 낼 전망입니다.`,
  sources:[{title:`거세지는 방위비 압박, 짙어지는 미국 우선주의 - NYT`,url:`https://www.nytimes.com/`},{title:`동맹국에 내민 관세 청구서... 글로벌 무역 분쟁 격화 - AP`,url:`https://apnews.com/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`'자율형 AI 에이전트' 악용한 대규모 계정 탈취 공격에 시중은행 시스템 비상`,
  metrics:[`침해 시도 계정 100만 개 이상 발생`,`피해 규모 산정을 위한 합동 조사 1주일 진행`],
  summary:`국내 주요 시중은행들이 스스로 해킹 경로를 학습하고 진화하는 자율형 AI 에이전트의 대규모 사이버 공격을 받아 금융권에 초비상이 걸렸습니다. 해커 조직은 최신 딥러닝 기반의 AI를 활용해 은행의 기존 보안망 패턴을 우회하며 수백만 개의 계정에 무작위로 암호를 대입하는 크리덴셜 스터핑 공격을 집요하게 감행했습니다. 이례적인 형태의 트래픽 폭증으로 인해 일부 고객 시스템의 접속이 지연되고 실제 계정 탈취 우려까지 커지는 초유의 사태가 발생했습니다. 사안의 중대성을 감안해 금융당국과 개인정보보호위원회가 긴급 합동 대응팀을 꾸려 전면 조사에 착수했습니다. 차세대 고도화된 AI 기술이 국가 핵심 인프라를 노린 사이버 범죄에 본격적으로 악용되기 시작했다는 분석이 나옵니다. 보안 전문가들은 금융권 전반에 다중인증 의무화 및 능동형 AI 방어 체계 구축 등 보안 패러다임의 전면적인 개편이 시급하다고 입을 모으고 있습니다.`,
  keyTerms:[{term:`크리덴셜 스터핑`,explanation:`이미 다른 곳에서 유출된 사용자의 아이디와 비밀번호 목록을 확보한 뒤, 여러 웹사이트에 무작위로 대입해 로그인을 시도하는 사이버 공격 방식입니다.`}],
  history:`비밀번호를 재사용하는 사용자 습관을 노린 기존의 단순 해킹 수법이, 최근 고도화된 AI의 추론 능력과 결합하면서 막기 힘든 자동화 공격으로 진화했습니다.`,
  players:`고도의 사이버 범죄 조직과 이를 방어해야 하는 국내 주요 시중은행, 그리고 실태 조사를 이끌며 규제 가이드라인을 만드는 금융당국이 얽혀 있습니다.`,
  current:`기존 방화벽으로는 비정상적인 AI의 분산 트래픽을 완벽하게 걸러내기 어려워 보안 시스템의 심각한 구조적 취약점이 그대로 노출된 긴급 상황입니다.`,
  outlook:`이번 조사를 계기로 모든 금융 거래에 얼굴 인식이나 생체 인증 등 강화된 다중인증 의무화 제도가 전격 도입될 가능성이 매우 큽니다.`,
  sources:[{title:`자율형 AI 악용한 신종 은행 해킹 사태 - 한겨레`,url:`https://www.hani.co.kr/`},{title:`금융당국, 대규모 계정 탈취 시도에 전면 조사 착수 - MBC`,url:`https://imnews.imbc.com/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`2026 노벨 생리의학상, 뇌 신경 제어하는 '광유전학' 개척자 3인 선정`,
  metrics:[`광유전학 관련 논문 인용 수 5만 회 돌파`,`파킨슨병 등 뇌 질환 치료 임상 시험 10여 건 진행 중`],
  summary:`2026년 노벨 생리의학상의 최고 영예는 빛을 이용해 뇌의 특정 신경세포를 정밀하게 조절하는 광유전학 기술을 세계 최초로 개척한 3명의 과학자에게 돌아갔습니다. 스웨덴 카롤린스카 연구소 노벨위원회는 칼 다이서로스, 페터 헤게만, 게오르크 나겔 교수가 뇌 과학 연구의 패러다임을 근본적으로 바꾼 거대한 공로를 인정해 이들을 공동 수상자로 선정했다고 공식 발표했습니다. 해당 기술은 특정 파장의 빛에만 반응하도록 조작된 단백질을 생물체의 뇌세포에 이식하여, 생각과 행동의 기저 메커니즘을 실시간으로 규명하는 혁신적인 생명공학 기법입니다. 수십 년간 미지의 영역이었던 인간 뇌의 작동 원리를 세포 단위에서 켜고 끌 수 있게 만든 역사적인 전환점입니다. 의학계는 이 기술이 파킨슨병, 난치성 우울증, 조현병 등 다양한 중증 뇌 질환의 근본적인 치료법 개발에 획기적인 돌파구를 마련했다고 극찬하고 있습니다. 이번 수상은 순수 기초 과학 연구가 실제 인류의 질병 치료라는 거대한 응용 분야로 이어질 수 있음을 보여준 상징적인 사례로 남게 되었습니다.`,
  keyTerms:[{term:`광유전학`,explanation:`빛을 뜻하는 '광'과 유전학을 결합한 단어로, 레이저 같은 특정 빛을 쏘아 우리가 원하는 특정 신경 세포의 활동만 정교하게 켜고 끄는 첨단 생명공학 기술입니다.`}],
  history:`2000년대 초반 해조류에서 빛에 반응하는 채널 단백질이 처음 발견된 이후, 과학자들은 이를 동물 모델 신경계에 적용하려는 오랜 연구를 거듭해 왔습니다.`,
  players:`기초 과학을 탐구하는 노벨상 수상 과학자들과 이 기초 기술을 활용해 실제 신약을 개발하려는 뇌 질환 전문 글로벌 제약사들이 주도하고 있습니다.`,
  current:`단순한 뇌 회로 지도 작성을 넘어서, 실제 빛을 쪼여 실명 환자의 시력을 일부 회복시키는 등의 놀라운 임상 치료 성과가 서서히 보고되고 있습니다.`,
  outlook:`향후 인체 내부로 빛을 안전하고 깊게 전달할 수 있는 첨단 의료기기 혁신과 맞물려 상용화된 뇌 질환 유전자 치료제 개발이 속도를 낼 것입니다.`,
  sources:[{title:`노벨 생리의학상에 뇌 과학 혁명 이끈 광유전학 3인 - 한국경제`,url:`https://www.hankyung.com/`},{title:`빛으로 뇌를 제어하다... 파킨슨병 정복 기대감 - BBC`,url:`https://www.bbc.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`오픈AI·앤트로픽 등 빅테크, 가짜 뉴스 막기 위해 AI 텍스트 '워터마크' 전면 도입`,
  metrics:[`AI 생성 텍스트 자동 식별률 99% 달성 목표`,`글로벌 상위 5개 주요 AI 기업 통합 규약 합의`],
  summary:`생성형 AI 모델이 실시간으로 만들어낸 정교한 딥페이크 이미지와 가짜 뉴스가 심각한 사회적 혼란을 야기하자, 주요 빅테크 기업들이 초강수 대응에 나섰습니다. 오픈AI와 앤트로픽 등 글로벌 AI 시장을 주도하는 선두 기업들은 자사 시스템에서 생성된 텍스트와 결과물에 기계가 작성했음을 증명하는 워터마크 기술 도입을 전격적으로 의무화하기로 합의했습니다. 이들은 사용자의 프롬프트로 생성된 결과물 곳곳에 육안으로는 보이지 않는 정교한 암호화 패턴을 삽입하여 출처를 투명하게 추적할 수 있는 시스템을 일제히 가동 중입니다. 이는 다가오는 각종 글로벌 주요 선거와 여론 형성 과정에서 치명적인 허위 정보가 확산되는 것을 선제적으로 차단하기 위한 기술 업계의 고육지책으로 풀이됩니다. 각국 규제 당국의 압박이 거세지는 가운데 자율적인 정화 시스템을 먼저 마련하려는 의도도 깔려 있습니다. 시민사회와 기술 업계는 투명성과 정보 신뢰성을 확보하기 위한 이번 공동 조치가 건강한 AI 규범 확립을 향한 매우 의미 있는 첫걸음이 될 것으로 큰 기대를 모으고 있습니다.`,
  keyTerms:[{term:`워터마크`,explanation:`원래는 위폐 방지용 무늬를 뜻하지만, 디지털 시대에는 AI가 생성한 글이나 이미지 데이터 내부에 육안으로는 보이지 않는 고유한 패턴을 삽입해 기계의 저작물임을 뚜렷하게 증명하는 기술을 말합니다.`}],
  history:`초거대 언어 모델이 사람과 거의 구별할 수 없는 수준의 완벽한 문장을 작성하게 되면서, 학계와 정치권에서는 거짓 정보 생성이라는 부작용을 꾸준히 경고해 왔습니다.`,
  players:`강력한 AI 기술 통제를 요구하는 글로벌 각국 정부 기관과, 시장 규제를 선제적으로 회피하려는 오픈AI 등 실리콘밸리 빅테크 기업들이 핵심입니다.`,
  current:`기술 기업들이 자발적 동맹을 맺고 기술 표준을 확립하여, 플랫폼 자체 필터링을 통해 인터넷 생태계의 정보 신뢰도를 긴급하게 끌어올리는 중입니다.`,
  outlook:`오픈소스 AI 진영까지 이 표준 기술을 채택할지 여부와, 워터마크를 우회하려는 해커들의 또 다른 공격 창과 방패의 싸움이 앞으로의 관건입니다.`,
  sources:[{title:`오픈AI 등 텍스트 워터마크 전면 도입 합의 - The Economist`,url:`https://www.economist.com/`},{title:`가짜뉴스 막아라... 보이지 않는 AI 추적 기술 의무화 - 조선일보`,url:`https://www.chosun.com/`}]
}]

  tag:`2026-10-05`,
  label:`2026년 10월 5일 (월)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국은행, 가계부채 우려 속 10월 기준금리 인하 신중론 대두`,
  metrics:[`가계대출 증가액 6조원`,`소비자물가 상승률 2.1%`],
  summary:`한국은행 금융통화위원회를 앞두고 기준금리 인하에 대한 신중론이 확산되고 있습니다. 최근 수도권을 중심으로 주택 가격이 상승하면서 가계부채가 다시 급증하는 추세이기 때문입니다. 시장에서는 당초 10월 금리 인하를 기정사실로 받아들였으나, 금융당국의 가계대출 억제 정책이 효과를 내기 전까지는 동결할 가능성이 커졌습니다. 특히 9월 은행권 가계대출 증가액이 6조원에 달하면서 금융 불균형 우려가 심화되었습니다. 물가 상승률은 2%대 초반으로 안정되었지만, 부동산 시장 자극을 우려한 한국은행의 딜레마가 깊어지고 있습니다. 앞으로 발표될 경제 지표와 정부의 거시건전성 정책 효과가 금리 결정의 핵심 변수가 될 전망입니다.`,
  keyTerms:[{term:`거시건전성 정책`,explanation:`금융 시스템 전체의 안정을 유지하고 경제 전반의 위기를 예방하기 위해 정부나 중앙은행이 시행하는 정책입니다.`}],
  history:`2024년 말부터 시작된 글로벌 금리 인하 기조 속에서도 한국은행은 가계부채 문제로 인해 금리 인하를 미뤄왔습니다. 2026년 하반기 들어 물가가 안정세를 보이면서 인하 기대감이 높아졌습니다.`,
  players:`한국은행 이창용 총재 및 금융통화위원들은 물가 안정과 금융 안정 사이에서 균형을 잡아야 하는 상황이며, 금융위원회는 대출 규제 강화를 주문하고 있습니다.`,
  current:`최근 서울 강남 3구를 비롯한 수도권 부동산 가격이 다시 들썩이면서 주택담보대출을 중심으로 한 가계부채 증가세가 금리 인하의 최대 걸림돌로 부상했습니다.`,
  outlook:`10월 금통위에서 기준금리가 동결될 경우 시장 금리의 변동성이 커질 수 있으며, 연말까지 가계부채 증가세가 꺾이는지 여부가 향후 금리 경로를 좌우할 것입니다.`,
  sources:[{title:`한은 금통위, 10월 기준금리 동결 무게 - 연합뉴스`,url:`https://www.yna.co.kr/view/AKR202610040001`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 9월 고용지표 예상치 상회, 연준 '빅컷' 기대감 축소`,
  metrics:[`9월 비농업 신규 고용 18만명`,`실업률 4.1%`],
  summary:`미국의 9월 고용보고서가 시장의 예상을 크게 웃돌면서 연방준비제도의 급격한 금리 인하, 이른바 '빅컷'에 대한 기대감이 한풀 꺾였습니다. 미 노동부 발표에 따르면 9월 비농업 부문 신규 고용은 18만명을 기록하여 전문가 예상치를 상회했으며, 실업률은 4.1%로 소폭 하락했습니다. 이는 미국 경제가 여전히 견조한 성장세를 유지하고 있음을 시사합니다. 이에 따라 11월 연방공개시장위원회(FOMC)에서 0.5%포인트 대신 0.25%포인트의 점진적 금리 인하가 단행될 것이라는 관측이 힘을 얻고 있습니다. 탄탄한 고용 시장 덕분에 경기 침체 우려는 완화되었으나, 달러화 강세와 국채 금리 상승 등 금융 시장의 변동성은 커지고 있습니다.`,
  keyTerms:[{term:`비농업 부문 신규 고용`,explanation:`농축산업을 제외한 산업에서 새롭게 창출된 일자리 수를 의미하며, 미국 경제의 건전성을 평가하는 핵심 지표입니다.`}],
  history:`미 연준은 인플레이션 둔화와 고용 둔화 조짐에 대응하여 최근 몇 달간 금리를 인하해 왔으며, 시장은 경기 침체를 막기 위한 큰 폭의 추가 인하를 기대해 왔습니다.`,
  players:`제롬 파월 연준 의장을 비롯한 연준 위원들은 데이터를 기반으로 한 신중한 통화 정책을 강조하고 있으며, 월스트리트 투자자들은 고용 지표에 촉각을 곤두세우고 있습니다.`,
  current:`예상을 뛰어넘는 강력한 고용 데이터는 연준이 서둘러 금리를 내릴 필요성을 감소시켰고, 이는 미국 경제의 '연착륙' 가능성을 높이는 신호로 해석됩니다.`,
  outlook:`향후 발표될 소비자물가지수(CPI) 등 물가 지표가 연준의 최종 결정에 영향을 미칠 것이며, 11월 FOMC 전까지 금융 시장은 각종 경제 지표에 민감하게 반응할 것입니다.`,
  sources:[{title:`미 9월 고용 '깜짝 호조'…연준 빅컷 물 건너가나 - 한국경제`,url:`https://www.hankyung.com/article/202610040002`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`사우디 석유 시설 피격 위협에 국제유가 배럴당 85달러 돌파`,
  metrics:[`브렌트유 86.5달러`,`WTI 82.3달러`],
  summary:`중동 지역의 지정학적 긴장이 최고조에 달하면서 국제유가가 급등해 배럴당 85달러를 돌파했습니다. 이스라엘과 이란 간의 무력 충돌 우려가 커지는 가운데, 이란의 지원을 받는 무장 세력이 사우디아라비아의 주요 석유 생산 시설을 공격할 수 있다는 첩보가 전해졌습니다. 이에 따라 글로벌 원유 공급망에 심각한 차질이 빚어질 수 있다는 공포가 확산되며 투기적 매수세가 유입되었습니다. 브렌트유는 하루 만에 4% 이상 급등하며 인플레이션 재점화에 대한 우려를 낳고 있습니다. 에너지 전문가들은 중동 사태가 전면전으로 번질 경우 국제유가가 100달러를 넘을 수도 있다고 경고하고 있어, 세계 경제의 회복세에 큰 부담이 될 전망입니다.`,
  keyTerms:[{term:`투기적 매수세`,explanation:`상품의 실제 수요보다는 향후 가격 상승을 예상하여 단기적인 시세 차익을 노리고 대량으로 사들이는 움직임입니다.`}],
  history:`2023년 말부터 악화된 이스라엘-하마스 전쟁 여파로 중동의 지정학적 리스크는 상존해왔으나, 최근 이스라엘과 이란의 직접적인 대립으로 확전 양상을 띠고 있습니다.`,
  players:`사우디아라비아는 최대 원유 수출국으로서 방어 태세를 강화하고 있으며, 미국과 유럽 국가들은 확전을 막기 위해 외교적 노력을 기울이고 있습니다.`,
  current:`석유 인프라 타격 가능성은 원유 시장에서 가장 민감한 위험 요소이며, 주요 산유국인 이란의 호르무즈 해협 봉쇄 위협까지 겹쳐 불안감이 극대화되고 있습니다.`,
  outlook:`무력 충돌의 양상과 외교적 중재 결과에 따라 유가 변동성이 극심할 것으로 예상되며, 고유가 장기화 시 글로벌 중앙은행들의 통화 정책에도 영향을 미칠 수 있습니다.`,
  sources:[{title:`중동 전운 최고조에 국제유가 폭등…'오일쇼크' 우려 - 매일경제`,url:`https://www.mk.co.kr/news/world/202610050003`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`제22대 국회 마지막 국정감사 개막, 김건희 여사 특검법 등 쟁점 격돌`,
  metrics:[`국감 대상 기관 802곳`,`증인 및 참고인 450여명`],
  summary:`제22대 국회의 사실상 마지막 국정감사가 5일 막을 올리며 여야 간의 치열한 공방이 시작되었습니다. 이번 국정감사에서는 대통령실 의혹과 김건희 여사 특검법, 금융투자소득세 폐지 등 굵직한 현안들이 도마 위에 올랐습니다. 더불어민주당을 비롯한 야당은 '정권 심판론'을 내세우며 전방위적인 공세를 예고했고, 국민의힘은 이를 '이재명 대표 방탄용 정치 공세'로 규정하며 민생 국감을 강조하고 있습니다. 특히 법제사법위원회와 정무위원회 등 주요 상임위에서는 증인 채택 과정부터 고성이 오가며 파행을 겪기도 했습니다. 내년 대선 정국을 앞두고 기선을 제압하기 위한 여야의 물러설 수 없는 대결이 한 달 내내 이어질 전망입니다.`,
  keyTerms:[{term:`금융투자소득세`,explanation:`주식, 채권, 펀드 등 금융투자로 발생한 일정 금액 이상의 소득에 대해 부과하는 세금 제도를 뜻합니다.`}],
  history:`제22대 국회는 출범 직후부터 각종 특검법과 입법 거부권 행사 문제로 여야 대치가 극심했으며, 이번 국감은 그동안 쌓인 정치적 갈등이 폭발하는 무대가 되고 있습니다.`,
  players:`거대 야당인 더불어민주당의 이재명 대표와 여당인 국민의힘 한동훈 대표 체제 하에서, 양측은 지지층 결집과 중도층 포섭을 목표로 화력을 집중하고 있습니다.`,
  current:`각종 여론조사에서 양당 지지율이 팽팽하게 맞서는 가운데, 국정감사에서 어떤 의혹이 새롭게 제기되고 방어에 성공하느냐가 향후 정국의 분수령이 될 것입니다.`,
  outlook:`국감 기간 내내 상임위 곳곳에서 충돌과 파행이 빈번할 것으로 예상되며, 특검법 재표결 시기와 맞물려 정국 경색은 더욱 심화될 가능성이 높습니다.`,
  sources:[{title:`22대 국회 마지막 국감 시작…초반부터 '특검' 정면충돌 - KBS`,url:`https://news.kbs.co.kr/news/view.do?ncd=202610040004`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 대선 D-30, 펜실베이니아 등 핵심 경합주 지지율 '초접전'`,
  metrics:[`경합주 지지율 격차 1%p 내외`,`사전투표 유권자 1,500만명`],
  summary:`2026년 미국 대통령 선거가 딱 한 달 앞으로 다가온 가운데, 민주당과 공화당 후보 간의 지지율이 핵심 경합주에서 초접전 양상을 보이고 있습니다. 최근 여론조사에 따르면 승패를 가를 펜실베이니아, 미시간, 위스콘신 등 7대 경합주에서 양 후보의 지지율 격차가 1%포인트 내외로 오차범위 안에서 엎치락뒤치락하고 있습니다. 민주당 후보는 낙태권 보장과 민주주의 수호를, 공화당 후보는 불법 이민 차단과 인플레이션 심판을 핵심 메시지로 내세우며 부동층 표심 잡기에 사활을 걸고 있습니다. 이미 일부 주에서 시작된 사전투표 열기가 뜨거운 가운데, 선거 막판 돌발 변수인 '옥토버 서프라이즈'가 표심을 흔들 결정적 요인이 될지 전 세계가 주목하고 있습니다.`,
  keyTerms:[{term:`옥토버 서프라이즈`,explanation:`미국 대통령 선거가 있는 해의 10월에 선거판에 큰 영향을 미칠 수 있는 돌발적인 정치적 사건이나 폭로가 발생하는 현상입니다.`}],
  history:`미국 대선은 전통적으로 특정 정당 지지세가 뚜렷하지 않은 소수의 경합주(Swing State) 결과에 따라 전체 승패가 결정되는 독특한 선거인단 제도를 가지고 있습니다.`,
  players:`민주당과 공화당의 대선 후보 및 러닝메이트들은 막대한 선거 자금을 경합주 광고와 현장 유세에 쏟아부으며 총력전을 펼치고 있습니다.`,
  current:`미국 내 심화된 정치적 양극화로 인해 유권자들의 표심이 굳어진 상황에서, 선거 결과를 좌우할 수 있는 무당층과 젊은 유권자들의 투표율이 최대 변수로 떠올랐습니다.`,
  outlook:`11월 선거일 직전까지 양측의 네거티브 공방이 극에 달할 것이며, 개표 과정에서도 경합주의 초박빙 승부로 인해 당선자 확정이 지연될 가능성이 있습니다.`,
  sources:[{title:`미 대선 한달 앞…'러스트벨트' 경합주 여전히 안갯속 - 조선일보`,url:`https://www.chosun.com/politics/world/2026/10/05/0005/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`이스라엘, 이란 수도 테헤란 인근 군사 기지 정밀 타격`,
  metrics:[`이스라엘 전투기 20여대 동원`,`이란 방공망 파괴 3곳`],
  summary:`이스라엘 공군이 이란 수도 테헤란 인근의 주요 군사 기지 및 미사일 보관 시설을 정밀 타격하면서 중동 전역에 전운이 감돌고 있습니다. 이스라엘 국방부는 이번 공격이 며칠 전 이란의 탄도미사일 발사에 대한 정당한 보복 조치라고 공식 발표했습니다. 이스라엘 전투기 20여 대가 동원된 이번 작전으로 이란의 최신 방공망 시스템 일부가 파괴된 것으로 알려졌습니다. 이란 정부는 즉각 강력한 재보복을 천명하며 주변 호르무즈 해협의 군사적 긴장을 끌어올리고 있습니다. 미국 정부는 이스라엘의 방어권을 지지하면서도 사태가 전면전으로 비화하는 것을 막기 위해 긴급 특사를 중동에 파견하며 외교적 진화에 총력을 기울이고 있습니다.`,
  keyTerms:[{term:`정당한 보복 조치`,explanation:`상대방의 선제 공격이나 불법적인 무력 사용에 대응하여 스스로를 방어하고 피해를 되갚아주는 군사적 행동을 뜻합니다.`}],
  history:`이란은 팔레스타인 무장정파 하마스와 레바논 헤즈볼라 등을 지원하며 이스라엘과 오랫동안 '그림자 전쟁'을 벌여왔으나, 최근 직접적인 무력 충돌로 갈등이 폭발했습니다.`,
  players:`이스라엘의 베냐민 네타냐후 총리는 강경 대응을 고수하고 있으며, 이란의 이슬람 혁명수비대 역시 물러서지 않겠다는 입장이어서 미국의 개입이 중요한 상황입니다.`,
  current:`중동의 양대 강국이 영토를 직접 타격하는 전례 없는 상황이 전개되면서, 역내 국가들뿐만 아니라 글로벌 에너지 시장까지 혼란에 빠질 위험이 커졌습니다.`,
  outlook:`이란의 재보복 수위와 방식에 따라 제5차 중동전쟁으로 확대될 우려가 있으며, 국제사회의 만류에도 불구하고 양측의 군사적 대결은 당분간 지속될 전망입니다.`,
  sources:[{title:`이스라엘, 이란 본토 전격 타격…'중동 전면전' 위기 고조 - 중앙일보`,url:`https://www.joongang.co.kr/article/202610050006`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`한국형 발사체 '누리호' 개량형, 탑재체 중량 늘려 4차 발사 D-10`,
  metrics:[`목표 궤도 고도 700km`,`탑재체 중량 1.5톤→1.8톤`],
  summary:`순수 국내 기술로 개발된 우주발사체 누리호(KSLV-II)의 개량형 모델이 오는 10월 15일 4차 발사를 앞두고 막바지 점검에 돌입했습니다. 과학기술정보통신부와 한국항공우주연구원은 전남 고흥 나로우주센터에서 누리호의 단 조립과 위성 탑재 작업을 성공적으로 완료했다고 밝혔습니다. 이번 4차 발사에 사용되는 개량형 누리호는 기존 모델보다 엔진 성능을 개선하여 탑재체 중량을 1.8톤까지 늘린 것이 특징입니다. 발사체에는 차세대 중형위성 3호와 다수의 큐브위성이 탑재되어, 우주 과학 연구와 지구 관측 임무를 수행할 예정입니다. 민간 기업이 체계종합기업으로 참여하여 발사 운용의 주축을 맡으면서, 한국의 '뉴 스페이스' 시대가 본격적으로 열렸다는 평가를 받고 있습니다.`,
  keyTerms:[{term:`뉴 스페이스`,explanation:`정부 주도의 우주 개발에서 벗어나 민간 기업이 혁신적인 기술과 자본을 바탕으로 우주 산업을 주도하는 새로운 흐름을 뜻합니다.`}],
  history:`2023년 누리호 3차 발사의 성공적인 궤도 안착 이후, 한국은 발사체의 신뢰성 확보와 성능 개량을 위해 반복 발사 프로그램(한국형 발사체 고도화 사업)을 추진해왔습니다.`,
  players:`한국항공우주연구원(KARI)이 기술 이전을 담당하고, 한화에어로스페이스 등 국내 민간 우주 기업들이 제작과 발사 운용 전반을 주도하고 있습니다.`,
  current:`성공적인 상용 위성 발사 실적을 쌓는 것은 향후 글로벌 우주 발사 서비스 시장에 진출하기 위한 필수적인 관문으로 여겨집니다.`,
  outlook:`발사 당일 기상 조건이 최대 변수이며, 4차 발사 성공 시 향후 달 탐사선 발사 등 더 큰 규모의 국가 우주 개발 프로젝트에 탄력이 붙을 전망입니다.`,
  sources:[{title:`더 강력해진 누리호 4차 발사 카운트다운…'뉴 스페이스' 본격화 - SBS`,url:`https://news.sbs.co.kr/news/endPage.do?news_id=202610050007`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`오픈AI, 인공일반지능(AGI)에 다가선 'GPT-5' 전격 상용화 출시`,
  metrics:[`추론 능력 기존 대비 40% 향상`,`동시 처리 언어 100개국어`],
  summary:`오픈AI가 인간에 필적하는 지능인 인공일반지능(AGI)에 한 걸음 더 다가선 차세대 AI 모델 'GPT-5'를 전격 상용화하여 출시했습니다. 이번에 공개된 GPT-5는 기존 모델을 뛰어넘는 고도화된 추론 능력과 복잡한 문제 해결 능력을 갖춘 것이 핵심입니다. 특히 코딩, 수학적 증명, 법률 문서 분석 등 전문적인 분야에서 추론 능력이 기존 모델 대비 40% 이상 향상된 것으로 평가받고 있습니다. 또한, 텍스트뿐만 아니라 영상과 음성을 실시간으로 동시에 처리하는 완벽한 멀티모달 기능을 구현하여 사용자 경험을 혁신적으로 바꿀 것으로 기대됩니다. 주요 빅테크 기업들과의 AI 기술 패권 경쟁이 격화되는 가운데, GPT-5의 등장은 산업 전반에 걸친 AI 도입을 더욱 가속화할 전망입니다.`,
  keyTerms:[{term:`인공일반지능(AGI)`,explanation:`특정 분야에 국한되지 않고 모든 상황에서 인간과 유사하거나 그 이상의 학습 및 추론 능력을 발휘할 수 있는 궁극적인 형태의 인공지능입니다.`}],
  history:`오픈AI는 GPT-3.5와 GPT-4를 연속 히트시키며 생성형 AI 붐을 주도해왔고, 전 세계 기술 업계는 그들의 다음 혁신인 GPT-5의 출시 시기를 오랫동안 기다려왔습니다.`,
  players:`샘 올트먼 오픈AI CEO를 필두로, 구글, 메타, 앤스로픽 등 실리콘밸리의 빅테크 기업들이 AI 모델의 성능 우위를 차지하기 위해 치열한 각축전을 벌이고 있습니다.`,
  current:`AI 모델의 규모가 커짐에 따라 발생하는 환각(Hallucination) 현상을 얼마나 줄였는지, 그리고 안전성 및 윤리적 기준을 어떻게 확보했는지가 주요 관심사입니다.`,
  outlook:`기업 맞춤형 GPT-5 API 서비스가 본격화되면 의료, 금융, 교육 등 다양한 분야에서 혁신적인 서비스가 속출할 것이며, 저작권 및 규제 논의도 활발해질 것입니다.`,
  sources:[{title:`오픈AI 'GPT-5' 전격 출시…AGI 시대 성큼 - 한국경제`,url:`https://www.hankyung.com/article/202610050008`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`남유럽 전역 기후변화발 '가을 폭우' 강타, 홍수 피해 속출`,
  metrics:[`24시간 강수량 400mm 기록`,`이재민 15만명 발생`],
  summary:`기후변화의 직격탄을 맞은 이탈리아, 스페인 등 남유럽 전역에 이례적인 '가을 폭우'가 쏟아지며 대규모 홍수 피해가 속출하고 있습니다. 지중해 연안을 중심으로 불과 24시간 동안 400mm가 넘는 물폭탄이 쏟아져 주요 하천이 범람하고 도로와 다리가 유실되었습니다. 이탈리아 북부와 스페인 남부 지역에서는 산사태로 주택이 매몰되면서 다수의 인명 피해가 발생했고, 15만명 이상의 이재민이 임시 대피소로 대피한 상태입니다. 기상학자들은 지중해 해수면 온도가 평년보다 3도 이상 높아지면서 엄청난 양의 수증기가 대기로 유입된 것을 이번 폭우의 주된 원인으로 꼽았습니다. 각국 정부는 비상사태를 선포하고 구조 작업에 총력을 기울이고 있으나, 파괴된 기반 시설을 복구하는 데 막대한 경제적 타격이 예상됩니다.`,
  keyTerms:[{term:`해수면 온도`,explanation:`바다 표면의 물 온도를 의미하며, 이 온도가 비정상적으로 높아지면 태풍이나 폭우를 유발하는 거대한 비구름이 형성되기 쉽습니다.`}],
  history:`남유럽 지역은 지난 수년간 극심한 여름철 가뭄과 산불에 시달려왔으나, 최근에는 가을과 겨울철에 집중호우가 내리는 등 극단적인 기상이변이 반복되고 있습니다.`,
  players:`유럽연합(EU)은 회원국 간의 재난 구호 기금을 긴급 편성하고 있으며, 세계기상기구(WMO)는 기후 변화 대응의 시급성을 재차 경고하고 나섰습니다.`,
  current:`폭우로 인해 농경지가 대거 침수되면서 남유럽의 주요 수출품인 올리브, 포도 등의 수확에 막대한 차질이 빚어져 글로벌 농산물 가격에도 영향을 줄 수 있습니다.`,
  outlook:`이번 주말까지 지중해 연안에 추가적인 강한 비구름이 통과할 것으로 예보되어 있어 추가 피해가 우려되며, 기후 적응을 위한 인프라 재건축 논의가 탄력을 받을 것입니다.`,
  sources:[{title:`물바다 된 남유럽…기후변화가 부른 최악의 '가을 폭우' - 연합뉴스`,url:`https://www.yna.co.kr/view/AKR202610050009`}]
}]

  tag:`2026-10-04`,
  label:`2026년 10월 4일 (일)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`반도체 수출 호조에도 불구, 1,350원대 고환율과 중동 지정학적 리스크로 수입 물가 부담이 가중되고 있습니다.`,
  metrics:[`미국 비농업 일자리 증가 2만 9,000명`,`원/달러 환율 1,350원대 상회`],
  summary:`9월 미국 비농업 일자리 증가 폭이 2만 9,000명에 그치며 연준의 금리 동결 기대가 커지고 있습니다. 이 가운데 한국 수출은 반도체를 중심으로 견조한 회복세를 보이고 있습니다. 하지만 중동 지역의 군사적 긴장이 고조되며 국제 유가가 들썩이고 있습니다. 이에 따라 원/달러 환율이 1,350원대를 상회하는 등 고환율 기조가 굳어지고 있습니다. 수입 물가 상승 압력이 커지면서 무역 수지 흑자 폭 둔화에 대한 우려도 나옵니다. 정부는 유류세 인하 조치 연장 등 물가 관리 대책 마련에 부심하고 있습니다.`,
  keyTerms:[{term:`고환율`,explanation:`외국 화폐에 비해 자국 화폐의 가치가 하락하여 환율이 높게 유지되는 현상입니다. 수입품 가격을 올려 국내 물가 상승을 유발할 수 있습니다.`}],
  history:`글로벌 고금리 장기화와 달러 강세가 맞물리며 원화 가치는 꾸준히 하방 압력을 받아왔습니다.`,
  players:`한국은행, 기획재정부, 반도체 수출 기업 등 국내 경제 주체들과 물가 상승에 민감한 소비자들이 얽혀 있습니다.`,
  current:`반도체 등 주력 산업의 수출이 버텨주고 있으나, 고환율로 인한 원자재 수입 비용 증가가 기업 채산성을 압박하는 전환점입니다.`,
  outlook:`미국의 10월 연준 FOMC 금리 결정 및 중동 전쟁 확전 여부가 향후 환율 및 물가의 향방을 가를 주요 변수가 될 것입니다.`,
  sources:[{title:`반도체 훈풍 속 고환율 딜레마 - 금융연구원`,url:`https://www.kif.re.kr`},{title:`뉴욕증시, 금리 동결 기대에 반등 - 조선일보`,url:`https://www.chosun.com`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`경유 가격 급등을 막기 위해 G7 국가들이 향후 4개월간 전략 비축유 1억 배럴을 방출하기로 합의했습니다.`,
  metrics:[`전략 비축유 1억 배럴 방출`,`미국 디젤 수출 금지 카드 부상`],
  summary:`미국 트럼프 행정부가 경유 가격 폭등에 직면하며 자국 내 디젤 수출 금지 조치를 만지작거리고 있습니다. 이러한 압박에 대응하기 위해 G7 국가들은 향후 4개월에 걸쳐 총 1억 배럴의 전략 비축유를 시장에 풀기로 긴급 합의했습니다. 미국 중간선거를 목전에 두고 에너지 가격 안정이 최우선 과제로 떠오른 결과입니다. 이번 방출 결정으로 국제 유가 급등세가 단기적으로 진정될지 주목됩니다. 다만 구조적인 정제 설비 부족 문제가 남아 있어, 겨울철을 앞두고 디젤 대란 우려는 여전히 불씨로 남아있습니다. 일각에서는 근본적 해법 없는 비축유 방출에 대한 비판도 제기됩니다.`,
  keyTerms:[{term:`전략 비축유`,explanation:`국가 안보나 심각한 공급 차질에 대비해 정부가 비상용으로 비축해 둔 원유나 석유 제품을 뜻합니다.`}],
  history:`지정학적 분쟁과 팬데믹 이후 정제 설비 투자가 감소하면서, 겨울철마다 디젤 등 정제유 공급 부족 현상이 고질적으로 반복되어 왔습니다.`,
  players:`선거 승리를 노리는 미국 행정부, 에너지 부담 완화가 절실한 G7 동맹국들, 그리고 석유 수출국 기구가 주요 행위자입니다.`,
  current:`11월 미국 중간선거를 30일 앞두고 정치적 타격이 될 수 있는 유가 급등을 막기 위해 전례 없는 규모의 글로벌 공조를 이끌어낸 상황입니다.`,
  outlook:`방출된 비축유가 시장에 모두 흡수된 이후, 추가적인 공급 확대 방안이 마련되지 않으면 가격 급등 사이클이 재현될 위험이 높습니다.`,
  sources:[{title:`G7 전략 비축유 방출 합의 - 가디언`,url:`https://www.theguardian.com`},{title:`미국 중간선거와 에너지 전략 - 모건스탠리`,url:`https://www.morganstanley.com`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`글로벌 채권 투매가 이어지며 미국 10년물 국채 금리가 2002년 이후 최고치인 5.34%를 기록했습니다.`,
  metrics:[`미국 10년물 국채 5.34%`,`영국 30년물 국채 일시 6% 돌파`],
  summary:`인플레이션 재점화 우려와 각국의 막대한 재정 적자 부담이 겹치면서 글로벌 채권 시장이 크게 요동치고 있습니다. 벤치마크로 꼽히는 미국 10년물 국채 금리가 5.34%대까지 치솟아 2002년 이후 24년 만에 최고치를 경신했습니다. 영국의 30년물 국채 금리 역시 장중 6%를 돌파하는 등 전 세계적인 투매 현상이 벌어졌습니다. 시장은 예상보다 더 끈적한 물가와 쏟아지는 국채 발행 물량을 소화하는 데 극심한 어려움을 겪고 있습니다. 이로 인해 주식 등 위험 자산의 밸류에이션 부담이 가중되며 글로벌 증시의 변동성도 커지고 있습니다. 각국 중앙은행은 향후 기준금리 정책 셈법을 두고 골머리를 앓고 있습니다.`,
  keyTerms:[{term:`국채 금리`,explanation:`국가가 돈을 빌리기 위해 발행하는 채권의 수익률로, 이 금리가 오르면 시장 전반의 차입 비용이 증가하여 경제 주체들에게 큰 부담이 됩니다.`}],
  history:`인플레이션을 잡기 위한 고강도 긴축 이후에도, 막대한 정부 재정 지출로 인해 국채 발행량이 줄지 않으면서 채권 시장의 수급 불균형이 만성화되었습니다.`,
  players:`국채를 대량으로 발행하는 각국 정부, 금리를 결정하는 중앙은행, 그리고 금리 변동에 베팅하는 글로벌 채권 투자자들입니다.`,
  current:`고금리가 장기간 이어질 것이라는 불안감이 채권 시장에 팽배하며, 단기간에 채권 금리가 위험 수위까지 발작적으로 튀어 오른 임계점입니다.`,
  outlook:`미국의 후속 고용 지표와 10월 연준 금리 결정 방향에 따라 국채 금리가 점진적인 안정세를 찾을지 추가 상승할지 결정될 전망입니다.`,
  sources:[{title:`글로벌 채권 시장 요동, 미 국채 5.3% 돌파 - 가디언`,url:`https://www.theguardian.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`10월 2일 검찰청이 전면 폐지된 가운데, 국민의힘은 대규모 장외집회를 열며 사법체계 개편을 강하게 비판했습니다.`,
  metrics:[`10월 2일 검찰청 공식 폐지`,`약 1년 만의 대규모 장외집회 개최`],
  summary:`오랜 정치적 논란 끝에 10월 2일부로 기존 검찰청이 폐지되고 중대범죄수사청과 공소청 체제가 공식 출범했습니다. 이러한 대대적인 사법체계 개편에 반발하여 야당인 국민의힘은 3일 서울 숭례문 일대에서 대규모 장외투쟁을 벌였습니다. 약 1년 만에 재개된 이번 장외집회에서 야당 지도부는 정부의 사법 정책과 전반적인 국정 운영을 정조준하며 맹비난을 쏟아냈습니다. 여당은 이를 야권 유력 인사의 사법리스크를 덮기 위한 방탄용 선동이라고 맞받아치며 팽팽하게 맞서고 있습니다. 보수 진영 주요 인사들도 별도의 정책 포럼을 출범시키며 결속력을 다지고 있습니다. 당분간 사법 시스템의 안착 여부와 맞물려 극심한 정쟁이 계속될 것으로 보입니다.`,
  keyTerms:[{term:`공소청`,explanation:`기존 검찰이 독점하던 수사권과 기소권 중, 수사권을 분리해내고 기소와 공소 유지 역할만 전담하도록 새롭게 신설된 국가 수사 기관입니다.`}],
  history:`검찰의 비대화된 권한을 견제하기 위해 수사권과 기소권을 완전히 분리하려는 사법개혁 논의는 수년에 걸쳐 정치권의 핵심 뇌관이었습니다.`,
  players:`사법개혁을 속도감 있게 주도한 더불어민주당 및 현 정부, 그리고 이를 필사적으로 저지하려는 국민의힘 등 야권 인사들입니다.`,
  current:`오랜 진통 끝에 제도가 법제화되어 첫발을 내디뎠으나, 초기 조직의 불안정과 수사 공백을 우려하는 야당의 목소리가 장외투쟁의 거대한 동력으로 작용했습니다.`,
  outlook:`신설된 수사청과 공소청이 실질적이고 안정적인 범죄 대응 능력을 입증하기 전까지는 사법 주도권을 둘러싼 여야 간의 치열한 싸움이 정기국회 내내 이어질 전망입니다.`,
  sources:[{title:`검찰청 폐지 후폭풍, 여야 장외 대치 - 뉴스핌`,url:`https://www.newspim.com`},{title:`보수 연대 포럼 출범 - 매일경제`,url:`https://www.mk.co.kr`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`2026년 정기국회 국정감사를 앞두고 증인 채택을 둘러싼 여야의 팽팽한 대치가 극에 달하고 있습니다.`,
  metrics:[`10월 1일 대통령실 수뇌부 개편`,`11월 중간평가격 국정감사 돌입`],
  summary:`다음 주부터 막을 올리는 2026년 정기국회 국정감사를 앞두고 여야 간 치열한 전운이 고조되고 있습니다. 국회 상임위 곳곳에서 주요 증인 채택 문제를 두고 양측이 한 치의 양보 없는 치열한 힘겨루기를 진행 중입니다. 국민의힘은 경제 및 주식시장 정책 실패와 고위 공직자 의혹을 집중 타격하겠다는 송곳 감사를 단단히 벼르고 있습니다. 반면 더불어민주당은 근거 없는 망신주기식 정쟁용 증인 채택은 절대 불가하다는 확고한 방침으로 맞서고 있습니다. 한편, 정부는 국감 시즌에 맞춰 10월 1일 대통령비서실 정책실장을 교체하고 신임 경제성장수석을 발탁하는 등 수뇌부 개편을 단행했습니다. 쇄신된 진용으로 다가오는 야당의 정책 공세에 맞서 방어선을 구축하려는 의도로 풀이됩니다.`,
  keyTerms:[{term:`국정감사`,explanation:`국회가 국정 전반에 대해 감사를 실시하여 정부의 주요 정책 수행이 적절했는지 감시하고 비판하는 가장 중요한 의정 활동 중 하나입니다.`}],
  history:`매년 가을에 열리는 국정감사는 행정부에 대한 입법부의 강력한 견제 수단이자, 정당들이 정국 주도권을 쥐기 위해 총력을 다해 화력을 집중하는 무대입니다.`,
  players:`국정운영 방어를 위해 전열을 가다듬은 대통령실 및 여당인 민주당, 정책 실정을 집요하게 파고들어 정권 심판론을 부각하려는 야당 국민의힘입니다.`,
  current:`정부의 주요 인사 단행과 국정감사 돌입 시기가 묘하게 겹치면서, 새롭게 구성된 내각 및 참모진의 실질적 위기관리 능력이 첫 시험대에 올랐습니다.`,
  outlook:`각 상임위원회별로 폭발력 있는 정치적 이슈가 다뤄지며 매일 날 선 공방이 펼쳐질 예정이며, 이는 향후 민심 향배에 상당한 영향을 미칠 것으로 보입니다.`,
  sources:[{title:`대통령실 신임 정책실장 발탁 - ikbc`,url:`https://www.ikbc.co.kr`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`11월 3일 미국 중간선거를 한 달 앞두고 7개월째 접어든 미국과 이란의 전쟁이 중대한 분수령을 맞았습니다.`,
  metrics:[`개전 7개월 차 진입`,`중간선거 D-30 카운트다운`],
  summary:`지난 2월 개전 이래 7개월을 넘긴 미국과 이란 간의 피말리는 소모전이 미국 정치의 가장 뜨거운 변수로 떠올랐습니다. 11월 3일 치러지는 미국 중간선거를 한 달 앞두고 양국의 치열한 외교적 밀당이 물밑에서 진행 중입니다. 이란은 호르무즈 해협 재개방과 경제 제재 해제를 교환하는 구체적인 수정 제안을 카타르를 통해 건넸지만, 트럼프 행정부는 일단 이를 완강히 거부했습니다. 트럼프 대통령은 선거를 앞두고 물가를 자극할 수 있는 유가 폭등이나 급격한 확전을 경계하면서도 대외적으로는 강경한 태도를 유지하려 애쓰고 있습니다. 선거 결과에서 공화당이 승리하면 군사 압박이 거세질 수 있지만, 민주당이 의회를 장악하면 전쟁 예산 삭감 압박이 커질 위험이 존재합니다. 결국 미국 유권자의 최종 선택이 복잡하게 얽힌 중동 전쟁의 향방을 직접적으로 결정짓게 되었습니다.`,
  keyTerms:[{term:`중간선거`,explanation:`대통령 임기 중간에 치러지는 의회 선거로, 현직 대통령의 전반기 국정 운영 전반에 대한 국민들의 냉정한 중간 평가 성격을 지닙니다.`}],
  history:`이란의 핵 개발 고도화 우려와 호르무즈 해협 봉쇄라는 극단적 위협으로 촉발된 양국의 무력 충돌은 글로벌 공급망과 에너지 시장을 수개월째 짓눌러 왔습니다.`,
  players:`재선 가도의 유리한 고지를 점하려는 트럼프 행정부, 협상 타결로 자국 내 경제난을 타개하려는 이란 정부, 그리고 하원 다수당 탈환을 노리는 미 민주당이 엮여 있습니다.`,
  current:`군사적 피로감과 경제적 압박이 최고조에 달한 아슬아슬한 상황에서, 양국 모두 즉각적인 무력 행사보다는 다가올 미국 선거 결과에 촉각을 곤두세우는 관망기에 접어들었습니다.`,
  outlook:`11월 3일 선거 결과 직후, 최종 승리한 정당의 정치적 셈법에 따라 평화 협상의 급물살을 타거나 파국적 확전으로 치달을 중대한 변곡점을 맞이할 것입니다.`,
  sources:[{title:`미국 중간선거와 이란 전쟁 분수령 - 연합뉴스`,url:`https://www.yna.co.kr`},{title:`트럼프 정부, 이란 수정 제안 일단 거부 - 한겨레`,url:`https://www.hani.co.kr`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`국내 피지컬 AI 현장 도입이 빨라지며, 과기정통부 주관 '모두의 AI 실험실' 경진대회가 본격적인 상용화의 막을 올렸습니다.`,
  metrics:[`모두의 AI 실험실 본선 12개 팀`,`2026 AI코리아 대상 시상`],
  summary:`인공지능이 모니터 화면 밖으로 나와 물리적 세계와 결합하는 실증 추세가 한국에서도 본격화되고 있습니다. 과기정통부와 한국지능정보사회진흥원이 주관한 '모두의 AI 실험실' 경진대회에서 최종 12개 본선 팀이 선정되어 실무 서비스 개발에 맹렬히 돌입했습니다. 네이버클라우드, 카카오 등 주요 IT 빅테크들이 적극적인 멘토로 나서 실효성 있는 상용화를 전폭 지원합니다. 이와 동시에 '2026 AI코리아 대상'에서는 의료 현장과 스마트 제조 현장에 직접 투입되어 설비를 제어하는 피지컬 AI 사례가 큰 주목을 받았습니다. 단순한 텍스트 답변 생성을 훌쩍 뛰어넘어 현실 세계의 복잡한 문제를 다중 에이전트 시스템으로 해결하려는 눈에 띄는 시도들입니다. 인공지능의 물리적 개입이 확산됨에 따라 소버린 클라우드 및 기밀 컴퓨팅 등 기반 보안 인프라의 중요성도 사회 전반에서 급부상하고 있습니다.`,
  keyTerms:[{term:`피지컬 AI`,explanation:`소프트웨어 형태의 인공지능을 뛰어넘어, 로봇이나 각종 기계 장치와 직접 결합해 물리적인 환경을 스스로 인지하고 조작하는 진보된 AI 시스템을 말합니다.`}],
  history:`과거 챗GPT 붐 이후 생성형 AI 기술은 눈부시게 발전했지만, 이를 공장이나 병원 같은 실제 물리적 노동 현장에 안전하게 적용하기에는 신뢰성 장벽이 상당히 높았습니다.`,
  players:`관련 기술 고도화를 이끄는 정부, 든든한 실무 인프라를 제공하는 주요 IT 기업들, 그리고 혁신적인 해결책을 쏟아내는 유망 스타트업 및 연구진입니다.`,
  current:`막강한 컴퓨팅 파워와 정밀한 센서 기술이 정교하게 맞물리면서, AI가 직접 물리적 객체를 조작하며 뚜렷한 성과를 내는 본격적인 실증 단계로 산업의 패러다임이 옮겨가고 있습니다.`,
  outlook:`현재 진행 중인 현장 실증이 성공적으로 마무리될 경우, 제조, 물류, 위험한 의료 분야를 중심으로 지능형 로봇과 AI 에이전트의 대규모 상용화가 폭발적으로 이뤄질 전망입니다.`,
  sources:[{title:`모두의 AI 실험실 본선 12팀 선정 - 지디넷코리아`,url:`https://www.zdnet.co.kr`},{title:`2026 AI코리아 대상, 현장 도입 집중 - 다음뉴스`,url:`https://www.daum.net`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`2026년 정부 R&D 예산이 35.5조 원 규모로 대폭 확대 편성되며, 국가 AI 인프라 확충과 차세대 반도체 개발이 급물살을 타고 있습니다.`,
  metrics:[`정부 R&D 예산 35.5조 원 편성`,`산업기술진흥원 10대 유망기술 선정`],
  summary:`치열해지는 글로벌 기술 패권 경쟁 속에서 국가 경쟁력 확보를 위해 정부가 2026년도 R&D 예산을 35.5조 원 규모로 과감하게 확대 편성했습니다. 이 막대한 예산 투입의 핵심 타깃은 부족한 국가 AI 컴퓨팅 인프라 확충과 차세대 지능형 엣지 반도체 개발입니다. 천문학적인 비용이 드는 GPU 자원을 국가 차원에서 전략적으로 확보해 핵심 기업과 연구소에 원활하게 공급하고, 핵심 기술의 해외 의존도를 대폭 낮출 독자적인 국가 AI 파운데이션 모델 개발 프로젝트를 가속화할 방침입니다. 이에 발맞춰 산업기술진흥원은 휴머노이드 로봇과 고도화된 자율공정 등을 포함한 미래 10대 유망기술을 엄선하여 산학연의 모든 역량을 일제히 집중시키기로 결의했습니다. 이를 통해 다가올 미래 기술 패권 경쟁에서 한국이 결코 주도권을 잃지 않겠다는 정부의 강한 의지가 엿보입니다. 막대한 재원이 투입되는 만큼 향후 효율적인 예산 집행과 가시적인 성과 도출이 중요한 관건으로 남았습니다.`,
  keyTerms:[{term:`엣지 반도체`,explanation:`중앙의 거대한 클라우드 서버를 거치지 않고, 스마트폰이나 가전제품 등 기기 단말기 자체에서 인공지능 연산을 지연 없이 빠르게 처리할 수 있도록 설계된 저전력 반도체입니다.`}],
  history:`최근 수년간 글로벌 AI 모델 개발 경쟁이 상상을 초월할 정도로 심화되면서, 초거대 연산을 뒷받침할 컴퓨팅 자원 확보가 국가 안보 및 생존과 직결되는 최우선 핵심 과제로 급부상했습니다.`,
  players:`대규모 예산을 기획 및 편성하는 정부 부처, 확충된 인프라를 활용해 첨단 기술을 개발할 국내 유력 반도체 기업, 학계 및 굵직한 국책 연구기관들이 긴밀히 협력하고 있습니다.`,
  current:`과거의 소규모 파편화된 R&D 지원 방식을 넘어, 국가 핵심 전략 기술 확보에 천문학적 단위의 예산을 집중 투입해 인프라 완전 자립을 시도하는 거대한 과도기적 시점입니다.`,
  outlook:`이번 대규모 투자를 통한 차세대 반도체 설계 역량 확보와 독자 AI 모델 구축 성과에 따라, 향후 10년 이상 한국 핵심 기술 산업의 글로벌 위상과 독립성이 판가름 날 중대한 기로입니다.`,
  sources:[{title:`2026년 R&D 예산 35.5조 편성 - 연합인포맥스`,url:`https://www.einfomax.co.kr`},{title:`KIAT, 10대 유망기술 선정 - 전자신문`,url:`https://www.etnews.com`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`10월 4일 치러지는 브라질 대선 1차 투표에서 룰라 현 대통령과 보우소나루 전 대통령 진영이 팽팽한 초접전 양상을 이어가고 있습니다.`,
  metrics:[`10월 4일 대선 1차 투표 실시`,`10월 25일 결선 투표 가능성 유력`],
  summary:`남미 대륙 최대의 경제 대국 브라질에서 10월 4일 역사적인 대통령 선거 1차 투표가 시작되며 전 세계의 긴장어린 이목이 쏠리고 있습니다. 전통적 좌파 진영의 굳건한 상징인 룰라 현 대통령과 강경 우파 진영을 거세게 이끄는 플라비우 보우소나루 상원의원이 각종 여론조사 오차범위 내에서 피말리는 초접전을 벌이고 있습니다. 심각해지는 경제 불평등 해소와 시급한 아마존 환경 보호를 최우선으로 내세운 룰라 측과, 자유시장 경제 확대 및 치안 강화를 강력히 옹호하는 우파 진영의 정치적 대립이 극심한 상황입니다. 최근 여론조사 결과에 따르면 어느 후보도 1차 투표에서 당선을 확정 짓는 과반 득표에 도달하지 못해, 결국 10월 25일에 숨 막히는 결선 투표가 치러질 가능성이 매우 높게 점쳐집니다. 향후 브라질의 최종 선거 결과는 남미 전체의 복잡한 정치 지형 변화뿐만 아니라 글로벌 환경 정책 및 무역 흐름에도 엄청난 파급력을 미칠 핵심 변수로 꼽힙니다. 뜨거운 선거 과정에서 벌어지는 악의적인 가짜뉴스 유포와 양 진영 지지자 간 폭력 사태 우려도 사회적 불안을 빠르게 키우고 있습니다.`,
  keyTerms:[{term:`결선 투표`,explanation:`다수결 선거의 1차 투표에서 특정 후보가 당선에 필요한 과반수의 표를 얻지 못했을 때, 가장 득표율이 높은 상위 1, 2위 후보만을 다시 후보로 올려 최종 당선자를 확실히 가려내는 제도입니다.`}],
  history:`브라질은 군부 독재 이후 오랫동안 극심한 좌우 이념 양극화에 시달려왔으며, 지난 수차례의 치열한 대선에서도 두 거대 진영 간의 갈등이 국론을 두 동강 내는 분열 수준으로 격화되어 왔습니다.`,
  players:`강력한 현직 프리미엄과 빈곤층의 지지를 가진 룰라 대통령, 보수 유권자와 기업가들의 결집을 노리는 보우소나루 상원의원, 그리고 승패의 결정적 향방을 쥔 부동층 중도 성향 유권자들입니다.`,
  current:`끈질긴 인플레이션과 지루한 경제 성장 둔화로 인해 민심이 크게 요동치는 가운데, 투표용지 단 한 장의 선택으로 국가의 미래 정책 노선이 완전히 좌우될 수 있는 극도로 긴장된 순간입니다.`,
  outlook:`1차 투표 개표 직후 간발의 차이로 인한 선거 불복 논란이나 전국적 소요 사태가 발생할 수 있으며, 결선 투표까지 남은 3주간 양측의 파괴적인 네거티브 공방이 최고조에 달할 것으로 보입니다.`,
  sources:[{title:`브라질 대선 1차 투표 초접전 양상 - 뉴스쿽`,url:`https://www.newsquawk.com`}]
}]

  tag:`2026-10-03`,
  label:`2026년 10월 3일 (토)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`9월 한국 수출이 사상 최고치인 1,200억 달러를 돌파하며 코스피가 7,000선 회복을 시도했습니다.`,
  metrics:[`수출 1,200억 달러`,`코스피 6,995선`],
  summary:`9월 한국의 수출액이 사상 처음으로 1,200억 달러를 돌파했습니다. 특히 반도체 수출이 603억 달러를 기록하며 전체 성장을 견인했습니다. 이는 글로벌 AI 수요 급증과 마이크론 호실적의 영향이 큽니다. 이러한 훈풍에 힘입어 코스피 지수 역시 7,000선 안착을 시도하며 6,995선으로 마감했습니다. 외국인의 매도세가 잦아들면서 시장에 긍정적인 신호를 주었습니다. 무역수지 흑자 기조가 이어지면서 향후 국내 증시의 추가 상승 동력으로 작용할지 주목됩니다.`,
  keyTerms:[{term:`무역수지`,explanation:`국가의 수출액과 수입액의 차이를 의미하며, 수출이 많을 경우 흑자로 기록됩니다.`}],
  history:`한국은 반도체, 자동차 등 제조업 기반의 수출 주도형 경제 체제를 유지해왔습니다. 최근 몇 년간 글로벌 경기 침체로 수출이 둔화되었으나, AI 열풍과 함께 반도체 수요가 다시 폭발적으로 증가했습니다.`,
  players:`삼성전자, SK하이닉스 등 국내 주요 반도체 기업들과 글로벌 IT 기업들이 핵심 역할을 하고 있습니다.`,
  current:`이번 1,200억 달러 돌파는 한국 경제의 강력한 회복세를 보여주는 상징적인 사건으로 평가받고 있습니다.`,
  outlook:`연말까지 반도체 수요가 견조할 것으로 예상되어, 수출 호조세와 증시의 상승 여력이 지속될 가능성이 높습니다.`,
  sources:[{title:`반도체 훈풍에 코스피 7000선 회복 시도 - FN Times`,url:`https://www.fntimes.com`},{title:`수출 역대 최고치 돌파 - Newspim`,url:`https://www.newspim.com`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국의 9월 고용 지표가 시장 예상치를 크게 밑돌면서 10월 기준금리 인상 확률이 급락했습니다.`,
  metrics:[`비농업 고용 2만 9,000명 증가`,`10년물 국채 금리 5.17%`],
  summary:`9월 미국 비농업 고용자 수가 2만 9,000명 증가하는 데 그치며 시장 예상치인 8만 4,000명을 크게 하회했습니다. 고용 시장이 예상보다 빠르게 식어가고 있다는 신호가 나타나면서, 연준의 10월 금리 인상 확률은 20%대로 떨어졌습니다. 금리 동결 기대감이 커지자 24년 만에 최고치로 치솟았던 10년물 국채 금리는 5.17% 선까지 급락했습니다. 이로 인해 S&P 500과 나스닥 등 뉴욕 증시는 상승 마감했으며, 엔비디아는 사상 최고가를 경신했습니다. 다가오는 FOMC 회의에서 연준이 어떤 스탠스를 취할지 시장의 이목이 집중되고 있습니다.`,
  keyTerms:[{term:`비농업 고용자 수`,explanation:`미국 노동부가 매월 발표하는 지표로, 농축산업을 제외한 산업에서 늘어난 일자리 수를 의미하며 경제 동향을 파악하는 핵심 지표입니다.`}],
  history:`미국 연방준비제도(Fed)는 인플레이션을 억제하기 위해 지속적으로 금리를 인상해왔으며, 이는 글로벌 금융 시장에 큰 부담으로 작용했습니다.`,
  players:`제롬 파월 연준 의장과 주요 투자은행, 그리고 금리 변동에 민감한 글로벌 기술 기업들이 주시하고 있습니다.`,
  current:`이번 고용 쇼크는 그동안의 고강도 긴축 정책이 마침내 실물 경제에 직접적인 영향을 미치고 있음을 명확히 보여줍니다.`,
  outlook:`10월 금리 동결이 유력해진 가운데, 12월의 추가적인 금리 인하 또는 유지 여부가 연말 글로벌 증시 방향을 결정할 것입니다.`,
  sources:[{title:`미국 고용 쇼크, 연준 금리 동결 전망 - TheStreet`,url:`https://www.thestreet.com`},{title:`미 국채 금리 급락 - BNN Bloomberg`,url:`https://www.bnnbloomberg.ca`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`중동 전쟁의 여파로 국제 유가가 폭등하자 G7 정상들이 1억 배럴의 비축유 방출에 합의했습니다.`,
  metrics:[`브렌트유 배럴당 102달러`,`비축유 1억 배럴 방출`],
  summary:`미국의 중동 추가 파병 소식 등 지정학적 긴장이 고조되면서 브렌트유가 배럴당 102달러를 돌파하며 4% 이상 급등했습니다. 유가 폭등으로 인한 글로벌 물가 상승 압력이 커지자, G7 정상들은 긴급 회의를 통해 향후 4개월간 1억 배럴의 전략비축유를 방출하기로 합의했습니다. 반면 중국은 내수 우선을 이유로 정제 연료 수출을 중단하면서 글로벌 디젤 공급난 우려가 겹치고 있습니다. 이러한 에너지 가격의 불안정성은 개발도상국들에게 심각한 재정 위기를 촉발할 수 있다는 UN의 경고까지 나온 상황입니다. 국제 공조에도 불구하고 근본적인 공급망 리스크는 지속될 것으로 보입니다.`,
  keyTerms:[{term:`전략비축유`,explanation:`국가 안보나 에너지 공급 위기 상황에 대비해 정부가 대규모로 미리 비축해 두는 원유를 뜻합니다.`}],
  history:`과거 오일쇼크 이후 주요 선진국들은 에너지 위기에 대응하기 위해 비축유 제도를 운용해왔으며, 전쟁이나 자연재해 시 이를 시장에 풀어 가격을 안정시킵니다.`,
  players:`G7(주요 7개국) 정상들, 중동 산유국(OPEC+), 그리고 자국 내수를 우선시하는 중국 정부가 주요 플레이어입니다.`,
  current:`중동의 군사적 충돌이 글로벌 원유 공급망을 위협하면서 인플레이션 재점화에 대한 시장의 공포가 극에 달해 있습니다.`,
  outlook:`G7의 비축유 방출이 단기적인 유가 하락을 유도할 수 있으나, 전쟁의 장기화 여부가 궁극적인 에너지 가격 추이를 결정할 것입니다.`,
  sources:[{title:`G7 비축유 1억 배럴 방출 합의 - Europa`,url:`https://europa.eu`},{title:`중동 긴장으로 유가 4% 급등 - Newspim`,url:`https://www.newspim.com`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`78년 역사의 대한민국 검찰청이 폐지되고 공소청과 중대범죄수사청이 새롭게 출범했습니다.`,
  metrics:[`검찰청 78년 만에 폐지`,`2개 신설 기관 출범`],
  summary:`10월 2일을 기점으로 대한민국 검찰청이 공식 폐지되고, 기소와 수사를 분리한 공소청과 중대범죄수사청이 출범했습니다. 이로써 78년간 이어져 온 검찰의 독점적 수사 구조가 완전히 해체되었습니다. 야당인 국민의힘은 범죄수사 시스템의 사망이라며 강하게 반발하고 나섰습니다. 특히 중수청의 초대 청장 후보자로 친윤계 출신이 지명되면서, 여당 내 강경파조차 이를 강하게 비판하며 인선 논란이 커지고 있습니다. 새로운 사법 시스템이 안착하기 전까지 정치권의 극심한 대립과 수사 공백에 대한 우려가 이어질 것으로 보입니다.`,
  keyTerms:[{term:`중대범죄수사청`,explanation:`과거 검찰이 담당하던 부패, 경제 등 중대한 범죄에 대한 직접 수사권을 전담하기 위해 새롭게 신설된 국가 기관입니다.`}],
  history:`수십 년간 검찰의 권한 비대화와 수사권 남용 문제가 지적되어 왔으며, 역대 정부들은 이를 해결하기 위해 수사권 조정을 지속적으로 추진해왔습니다.`,
  players:`이재명 대통령, 더불어민주당, 국민의힘, 그리고 새롭게 출범한 중수청 및 공소청의 수장들이 얽혀 있습니다.`,
  current:`검찰 폐지라는 역사적 전환점을 맞이했으나, 신임 청장 인사를 둘러싸고 여당 내에서도 계파 간 의견 충돌이 발생하고 있습니다.`,
  outlook:`신설 기관들의 실질적인 수사 역량 입증 여부와 국회에서의 인사청문회 결과가 향후 정국의 최대 화약고가 될 전망입니다.`,
  sources:[{title:`검찰청 공식 폐지 및 공소청 출범 - Newspim`,url:`https://www.newspim.com`},{title:`초대 중수청장 후보자 논란 - Newspim`,url:`https://www.newspim.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국이 중동에 대규모 병력을 추가 파병하며 이란에 대한 군사적 압박을 최고조로 끌어올리고 있습니다.`,
  metrics:[`미군 1만 명 추가 파병`,`항공모함 전단 3개 배치`],
  summary:`트럼프 미국 대통령이 11월 중간선거 이후 이란에 대한 추가 공습을 검토하며 중동 정세가 급박하게 돌아가고 있습니다. 미국은 시어도어 루스벨트 항공모함 전단 등 약 1만 명의 병력을 추가로 파견하여 중동 내 미군 규모를 2만 명으로 늘렸습니다. 아울러 이란의 핵심 산업과 연계망을 겨냥한 전례 없는 경제 제재도 함께 발표했습니다. 영국 런던에서 미군 기지 테러를 모의한 혐의로 이란계 남성이 체포되는 등 국지적 충돌의 징후도 곳곳에서 포착되고 있습니다. 이러한 미국의 초강경 대응은 중동 전역을 전면전의 공포로 몰아넣고 있습니다.`,
  keyTerms:[{term:`항공모함 전단`,explanation:`항공모함을 중심으로 순양함, 구축함, 잠수함 등이 무리를 지어 이동하는 거대한 해상 군사 부대로, 막강한 화력을 자랑합니다.`}],
  history:`미국과 이란은 핵합의 파기 이후 오랜 기간 경제 제재와 군사적 도발을 주고받으며 적대적 관계를 유지해왔습니다.`,
  players:`강경한 입장의 트럼프 미 대통령, 이란 지도부, 그리고 이란을 지원하는 친이란 무장 세력들이 주요 당사자입니다.`,
  current:`미국의 이번 병력 증강은 단순한 경고를 넘어 실제 타격을 염두에 둔 사전 배치로 해석되며 긴장감을 증폭시키고 있습니다.`,
  outlook:`미국의 선거 일정과 맞물려 이란과의 군사적 충돌이 현실화될 경우 글로벌 유가와 경제에 막대한 파장을 미칠 것으로 우려됩니다.`,
  sources:[{title:`미군 중동 추가 파병 및 이란 공습 검토 - Substack`,url:`https://www.substack.com`},{title:`미국 대이란 추가 제재 발표 - AA.com`,url:`https://www.aa.com.tr`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`국민의힘이 개천절 대규모 장외집회를 예고하며 이재명 정부에 대한 전면적인 대여 공세에 나섰습니다.`,
  metrics:[`10월 3일 장외집회 예정`,`장외 투쟁 본격화`],
  summary:`국민의힘이 10월 3일 개천절을 맞아 서울 숭례문 인근에서 대규모 장외집회를 개최하기로 선언했습니다. 야당은 이번 장외집회에서 검찰청 폐지 강행, DMZ 지뢰 폭발 사고에 대한 안일한 대처, 그리고 민생 경제 실패 등을 주요 쟁점으로 삼고 있습니다. 최근 국군의 날 행사에서 이 대통령이 북한의 도발을 불의의 사고라고 축소 언급한 부분도 안보관 논란의 불씨가 되었습니다. 한동훈 대표와 민주당 간의 노무현 전 대통령 수사 관련 과거사 공방까지 겹치면서 정치권의 양극화가 극에 달하고 있습니다. 이번 장외투쟁이 여론의 향배를 가를 중요한 분수령이 될 전망입니다.`,
  keyTerms:[{term:`장외집회`,explanation:`정당이나 정치 단체가 국회 등 공식적인 의사당을 벗어나 거리나 광장에서 대중을 상대로 벌이는 시위나 집회를 말합니다.`}],
  history:`한국 정치에서 야당은 정부 여당의 일방적인 정책 추진에 맞서 국민의 이목을 끌기 위해 종종 거리로 나서는 투쟁 방식을 채택해왔습니다.`,
  players:`국민의힘 주요 인사들, 이재명 대통령과 더불어민주당 지도부가 첨예하게 맞서고 있습니다.`,
  current:`검찰청 폐지와 안보 이슈 등 민감한 현안들이 동시다발적으로 터지면서 보수 진영의 결집이 가속화되고 있습니다.`,
  outlook:`집회의 규모와 시민들의 호응도에 따라 다가오는 정기국회와 향후 정국 주도권 싸움에서 야당의 협상력이 결정될 것으로 보입니다.`,
  sources:[{title:`국민의힘 개천절 대규모 장외집회 예고 - Newspim`,url:`https://www.newspim.com`},{title:`대통령 국군의 날 메시지 공방 - YouTube`,url:`https://www.youtube.com`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`국내 5대 시중은행이 신종 AI 해킹 공격을 받아 수만 명의 고객 개인정보가 유출되었습니다.`,
  metrics:[`최소 6개 은행 타격`,`신한은행 2만 5천 명 유출`],
  summary:`신한, KB국민, 하나 등 국내 주요 6개 시중은행이 인공지능을 활용한 고도화된 해킹 공격을 받아 발칵 뒤집혔습니다. 이 해킹으로 인해 신한은행에서만 약 2만 5,000명의 실제 고객 개인정보가 유출된 것으로 확인되었습니다. 공격자들은 철통같이 보호되는 주 전산망 대신, 상대적으로 취약한 직원용 모바일 업무 시스템을 통해 침투했습니다. 특히 자율 침투가 가능한 중국 기반의 해외 AI 에이전트 도구가 동원된 정황이 파악되어 충격을 주고 있습니다. 금융당국은 즉각적인 긴급 점검에 나섰으며, 금융권 전체의 AI 대응 보안 체계 마련이 시급해졌습니다.`,
  keyTerms:[{term:`자율 침투`,explanation:`해커가 직접 조종하지 않아도 인공지능 프로그램 스스로 취약점을 찾아내고 내부망으로 깊숙이 파고드는 고도의 해킹 기법입니다.`}],
  history:`금융권은 막대한 예산을 들여 보안 망을 구축해왔으나, 최근 생성형 AI 기술이 발전하면서 이를 악용한 사이버 공격 기법도 진화해왔습니다.`,
  players:`국내 주요 시중은행, 보안 당국, 그리고 배후로 의심받는 해외 해킹 조직이 얽혀 있습니다.`,
  current:`망분리 규제 완화 논의가 이루어지던 시점에서 발생한 대형 보안 사고로 인해 금융 정책 기조에 큰 변화가 예상됩니다.`,
  outlook:`유출된 고객 정보의 2차 피해를 막기 위한 조치와 더불어 금융권 전반에 걸친 대대적인 시스템 감사와 AI 보안 가이드라인 제정이 뒤따를 것입니다.`,
  sources:[{title:`5대 시중은행 동시다발 AI 해킹 공격 - Chosun`,url:`https://www.chosun.com`},{title:`AI 해킹으로 금융권 개인정보 유출 - Daum`,url:`https://www.daum.net`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`구글이 복잡한 추론과 사이버 방어에 특화된 차세대 인공지능 제미나이 4 아르곤을 발표했습니다.`,
  metrics:[`제미나이 4 아르곤 출시`,`100만 토큰 처리`],
  summary:`구글이 AI 기술 패권 경쟁에서 우위를 점하기 위해 차세대 모델인 제미나이 4 아르곤을 전격 공개했습니다. 이 모델은 매우 복잡한 논리적 추론은 물론, 최근 급증하는 사이버 위협에 대항하기 위한 방어 능력을 크게 강화한 것이 특징입니다. 한 번에 책 수십 권 분량인 100만 토큰의 컨텍스트 윈도우를 안정적으로 처리할 수 있어 기업용 시장에서 큰 기대를 모으고 있습니다. 또한, 구글은 윈도우용 제미나이 전용 앱 출시와 함께 AI 최적화 노트북인 구글북의 사전 예약 소식도 발표했습니다. AI 기술을 하드웨어와 운영체제로 확장하려는 구글의 전략이 돋보입니다.`,
  keyTerms:[{term:`컨텍스트 윈도우`,explanation:`인공지능이 한 번에 기억하고 분석할 수 있는 데이터의 한도를 의미하며, 이 크기가 클수록 긴 문서나 대화를 정확하게 이해할 수 있습니다.`}],
  history:`오픈AI의 챗GPT가 촉발한 인공지능 경쟁 속에서 구글은 자체 모델인 제미나이 시리즈를 꾸준히 업그레이드하며 반격을 도모해왔습니다.`,
  players:`구글, 마이크로소프트, 오픈AI 등 글로벌 빅테크 기업들이 AI 시장의 주도권을 놓고 치열하게 다투고 있습니다.`,
  current:`단순한 챗봇을 넘어 보안 및 기업 인프라 방어까지 책임지는 형태의 실용적 AI로 기술 트렌드가 넘어가고 있습니다.`,
  outlook:`새로운 모델의 출시로 기업들의 AI 도입이 더욱 가속화될 것이며, 신형 노트북을 통한 하드웨어 생태계 장악 여부도 관전 포인트입니다.`,
  sources:[{title:`구글 차세대 AI 제미나이 4 아르곤 발표 - Google Blog`,url:`https://blog.google`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`최태원 SK 회장이 거액의 재산분할금을 마련하기 위해 9,440억 원 규모의 지분 매각을 단행했습니다.`,
  metrics:[`지분 2.3% 매각`,`9,440억 원 확보`],
  summary:`최태원 SK그룹 회장이 노소영 아트센터 나비 관장과의 이혼 소송에 따른 거액의 재산분할금을 지급하기 위해 승부수를 띄웠습니다. 최 회장은 지주사인 SK㈜의 지분 2.3%를 약 9,440억 원에 블록딜 방식으로 매각한다고 공식 공시했습니다. 시장의 충격과 주가 하락을 최소화하기 위해 장이 끝난 후 기관 투자자에게 대량으로 주식을 넘기는 방식을 택했습니다. 이번 지분 매각 이후에도 최 회장은 특수관계인 포함 30% 이상의 의결권을 유지하게 되어, 우려되었던 경영권 방어에는 큰 문제가 없을 것으로 보입니다. 세기의 이혼 소송에 따른 천문학적 재산 분할이 실제 기업 지배구조에 미친 첫 대규모 조치입니다.`,
  keyTerms:[{term:`블록딜`,explanation:`대주주나 기관이 대량의 주식을 주식 시장의 정규 거래 시간이 끝난 뒤 할인된 가격으로 한꺼번에 매각하는 방식입니다.`}],
  history:`최태원 회장과 노소영 관장의 이혼 소송 항소심에서 법원이 1조 3천억 원대라는 사상 최대 규모의 재산 분할을 판결하면서 재원 마련에 관심이 쏠렸습니다.`,
  players:`최태원 SK 회장, 노소영 관장, 그리고 SK 지분을 인수한 주요 기관 투자자들이 관련되어 있습니다.`,
  current:`막대한 현금을 단기간에 조달해야 하는 압박 속에서 결국 지주사 지분 매각이라는 카드를 꺼내 들며 불확실성을 일부 해소했습니다.`,
  outlook:`할인된 가격의 대규모 매각으로 인한 단기적인 주가 변동성 확대가 예상되며, 대법원 최종 판결 결과에 따라 그룹 지배구조에 추가적인 영향이 있을지 주목됩니다.`,
  sources:[{title:`최태원 SK 회장 지분 9440억원 매각 공시 - Yonhap News TV`,url:`https://www.yonhapnewstv.co.kr`},{title:`SK 지분 매각 단행 - YNA`,url:`https://www.yna.co.kr`}]
}]

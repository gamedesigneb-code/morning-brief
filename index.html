  tag:`2026-08-26`,
  label:`2026년 8월 26일 (수)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국은행, 2년 만에 기준금리 전격 인하 단행`,
  metrics:[`기준금리 0.25%p 인하`,`코스피 1.5% 상승`],
  summary:`한국은행 금융통화위원회가 2년 만에 기준금리를 인하하며 통화정책의 전환을 알렸습니다. 이번 결정은 최근 둔화되고 있는 내수 경기를 진작하기 위한 선제적 조치로 풀이됩니다. 특히 가계부채 증가세가 다소 진정된 것이 금리 인하의 주요 배경이 되었습니다. 시장에서는 이번 피벗(통화정책 전환)이 하반기 경제 성장에 긍정적인 영향을 미칠 것으로 기대하고 있습니다. 전문가들은 추가적인 금리 인하 가능성도 열려 있다고 평가하고 있습니다. 이에 따라 주식시장과 부동산 시장의 단기적인 반등이 예상됩니다. 다만 환율 변동성 확대는 주의해야 할 요인으로 지적됩니다.`,
  keyTerms:[{term:`피벗`,explanation:`중앙은행이 기존의 통화정책 방향을 반대로 바꾸는 것을 의미하며, 주로 금리 인상 기조에서 인하 기조로 전환할 때 사용됩니다.`}],
  history:`코로나19 팬데믹 이후 글로벌 인플레이션을 잡기 위해 한국은행은 지난 2년여 동안 기준금리를 지속적으로 인상해왔습니다. 이후 물가가 다소 안정세를 보이면서 최근까지는 금리 동결 기조를 유지하며 관망세를 보였습니다. 이 과정에서 높아진 이자율로 인해 가계와 기업의 금융 부담이 크게 증가하며 내수 침체의 원인으로 작용했습니다.`,
  players:`통화정책을 최종적으로 결정하는 한국은행 금융통화위원회가 가장 핵심적인 주체입니다. 또한 대출 금리 하락으로 자금 숨통이 트이기를 기대하는 가계와 기업들이 직접적인 영향을 받습니다. 거시 경제를 총괄하며 환율 방어와 수출 경쟁력에 신경 쓰는 기획재정부 역시 중요한 이해관계자입니다.`,
  current:`최근 소비자물가 상승률이 한은의 목표치인 2%대에 근접하면서 물가 안정에 대한 자신감이 생겼습니다. 여기에 내수 침체 우려가 커지면서 더 늦기 전에 금리 인하를 통한 경기 부양에 나서야 한다는 목소리가 정책에 반영된 것입니다.`,
  outlook:`향후 가계부채 증가 추이와 수도권 집값 동향이 추가 금리 인하의 가장 큰 변수가 될 전망입니다. 또한 다음 달 예정된 미국 연준의 FOMC 회의 결과에 따라 한국은행의 통화정책 여력이 좌우될 것으로 보입니다.`,
  sources:[{title:`한은 2년 만에 피벗…기준금리 0.25%p 전격 인하 - 연합뉴스`,url:`https://www.yna.co.kr/view/AKR202608260001`},{title:`'내수 살리기' 칼 뺀 한은…가계부채 관리가 변수 - 매일경제`,url:`https://www.mk.co.kr/news/economy/202608260002`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 7월 소비자물가지수(CPI) 예상치 하회, 연준 금리 인하 기대감 고조`,
  metrics:[`미국 7월 CPI 전년 대비 2.8% 상승`,`나스닥 지수 2.1% 급등`],
  summary:`미국의 7월 소비자물가지수가 시장 예상치를 밑돌며 인플레이션 둔화세가 뚜렷해졌습니다. 이는 미국 연방준비제도(Fed)의 9월 금리 인하 가능성을 크게 높이는 요인으로 작용하고 있습니다. 에너지와 식품 가격의 안정이 전체적인 물가 하락을 주도한 것으로 분석됩니다. 월가 투자은행들은 연내 두 차례 이상의 금리 인하가 있을 것으로 전망을 수정했습니다. 이 소식에 뉴욕 증시는 기술주를 중심으로 강한 랠리를 펼쳤습니다. 골디락스 경제에 대한 기대감이 다시 커지면서 위험 자산 선호 심리가 살아나고 있습니다. 전 세계 금융시장도 미국의 통화정책 변화에 촉각을 곤두세우고 있습니다.`,
  keyTerms:[{term:`골디락스 경제`,explanation:`경제가 너무 뜨겁지도 차갑지도 않은 이상적인 상태를 말하며, 높은 경제 성장률을 유지하면서도 물가 상승(인플레이션)이 없는 상태를 뜻합니다.`}],
  history:`미국은 팬데믹 이후 공급망 교란과 막대한 재정 지출 여파로 40년 만에 최악의 인플레이션을 경험했습니다. 이를 진압하기 위해 연준은 유례없이 가파르고 공격적인 금리 인상 사이클을 단행했습니다. 고금리 환경이 장기화되면서 실물 경제의 둔화에 대한 우려가 꾸준히 제기되어 왔습니다.`,
  players:`미국의 통화정책 방향의 키를 쥐고 있는 제롬 파월 연준 의장과 연방공개시장위원회(FOMC) 위원들이 가장 중요한 인물들입니다. 이들의 발언에 따라 포트폴리오를 조정하는 월스트리트의 글로벌 투자 기관들도 큰 영향을 미칩니다. 아울러 대선을 앞두고 경제 성과를 내세워야 하는 미국 행정부도 주요 플레이어입니다.`,
  current:`최근 발표된 고용 지표와 물가 지표들이 일제히 둔화세를 보이면서 인플레이션 압력이 뚜렷하게 약화되었습니다. 이에 따라 고금리 정책의 부작용인 경기 침체를 막기 위해 신속히 통화정책의 방향을 선회해야 할 시점이라는 시장의 공감대가 형성된 것입니다.`,
  outlook:`오는 9월 FOMC 회의에서 기준금리 인하가 기정사실로 받아들여지는 가운데 시장의 시선은 인하 폭에 집중되어 있습니다. 베이비스텝(0.25%p 인하)에 그칠지 빅스텝(0.5%p 인하)을 단행할지가 글로벌 금융시장의 다음 향방을 결정할 최대 변수입니다.`,
  sources:[{title:`美 7월 CPI 2.8% 상승…인플레 둔화세 뚜렷 - 한국경제`,url:`https://www.hankyung.com/economy/article/202608260003`},{title:`9월 금리인하 파란불…나스닥 2%대 급등 - 조선일보`,url:`https://biz.chosun.com/international/202608260004`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`엔비디아 2분기 어닝 서프라이즈 달성, AI 반도체 수요 폭발적 성장 재확인`,
  metrics:[`엔비디아 2분기 매출 전년비 120% 증가`,`데이터센터 부문 매출 사상 최고치`],
  summary:`엔비디아가 시장의 기대를 훌쩍 뛰어넘는 2분기 어닝 서프라이즈를 기록하며 AI 산업의 강력한 성장세를 증명했습니다. 데이터센터용 AI 칩 수요가 예상을 뛰어넘으며 매출과 영업이익 모두 역대 최고치를 경신했습니다. 경영진은 다음 분기에도 이러한 폭발적인 성장이 지속될 것이라는 낙관적인 가이던스를 제시했습니다. 글로벌 빅테크 기업들의 생성형 AI 투자가 멈추지 않고 있음이 실적으로 확인된 셈입니다. 이로 인해 관련 반도체 장비 및 부품 공급사들의 주가도 동반 상승하는 효과를 낳았습니다. 투자자들은 AI 붐이 단순한 테마가 아닌 실체 있는 산업 패러다임 변화임을 다시금 확신하고 있습니다. 경쟁사들의 추격이 거세지만 당분간 엔비디아의 독주는 계속될 전망입니다.`,
  keyTerms:[{term:`어닝 서프라이즈`,explanation:`기업의 실제 실적이 시장의 예상치(컨센서스)를 크게 뛰어넘어 긍정적인 충격을 주는 현상을 말합니다.`}],
  history:`챗GPT의 등장 이후 글로벌 테크 기업들 사이에서 생성형 AI 개발 경쟁이 치열하게 불붙었습니다. 이로 인해 AI 모델 학습과 추론에 필수적인 고성능 그래픽처리장치(GPU)의 수요가 폭발적으로 증가했습니다. 엔비디아는 이 시장을 사실상 독점하며 지난 1년간 기업 가치가 기하급수적으로 상승해왔습니다.`,
  players:`엔비디아를 이끌며 글로벌 AI 혁신을 주도하고 있는 젠슨 황 최고경영자(CEO)가 핵심 인물입니다. 막대한 자본을 투자해 엔비디아의 칩을 대량으로 사들이고 있는 마이크로소프트, 구글, 메타 등 빅테크 기업들도 중요한 주체들입니다. 또한 이들에게 칩 제조를 대행해주는 TSMC 등 반도체 공급망 참여자들도 얽혀 있습니다.`,
  current:`일각에서 AI 기술 투자에 비해 당장의 수익성이 부족하다며 AI 거품론을 제기하기도 했습니다. 하지만 엔비디아의 이번 압도적인 실적 발표는 하드웨어에 대한 글로벌 수요가 여전히 견고하며 폭발적인 성장 궤도에 있음을 확실히 증명했습니다.`,
  outlook:`하반기에 본격적으로 출시될 예정인 차세대 AI 칩 블랙웰(Blackwell)의 성공적인 양산과 시장 안착 여부가 가장 중요합니다. 경쟁사인 AMD 등의 추격을 뿌리치고 엔비디아가 압도적인 시장 점유율을 계속 유지할 수 있을지가 주요 관전 포인트입니다.`,
  sources:[{title:`엔비디아 2분기 '어닝 서프라이즈'…매출 120% 폭등 - 한겨레`,url:`https://www.hani.co.kr/arti/economy/it/202608260005`},{title:`AI 붐은 진짜였다…엔비디아 실적 발표에 반도체주 랠리 - 중앙일보`,url:`https://www.joongang.co.kr/article/202608260006`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`여야 합의로 국민연금 개혁안 국회 본회의 극적 통과`,
  metrics:[`보험료율 13%로 인상`,`소득대체율 42%로 상향`],
  summary:`장기간 표류하던 국민연금 개혁안이 여야의 극적인 합의 끝에 국회 본회의를 통과했습니다. 이번 연금개혁은 기금 고갈 시기를 늦추고 미래 세대의 부담을 줄이기 위한 국가적 결단으로 평가받고 있습니다. 보험료율을 점진적으로 인상하고 소득대체율을 일부 조정하는 것이 핵심 내용입니다. 재계와 노동계의 반발이 있었으나, 지속 가능한 제도를 위해 불가피한 선택이라는 공감대가 형성되었습니다. 정부는 후속 조치로 사적 연금 활성화 등 보완 대책을 마련할 계획입니다. 이번 합의는 극한 대립을 이어가던 정치권이 모처럼 협치의 성과를 냈다는 점에서 의미가 큽니다. 향후 시행령 개정 등 세부적인 제도 정비 과정이 남아있습니다.`,
  keyTerms:[{term:`연금개혁`,explanation:`인구 고령화와 저출산으로 인해 연금 기금이 고갈되는 것을 막기 위해, 보험료를 올리거나 받는 금액을 조정하는 등의 제도 변경을 의미합니다.`}],
  history:`세계에서 가장 빠른 속도로 진행되는 저출산 고령화 현상으로 인해 국민연금 기금의 조기 고갈이 심각한 국가적 문제로 대두되었습니다. 하지만 보험료 인상에 대한 국민적 저항을 우려하여 역대 정부와 정치권은 근본적인 개혁을 번번이 미루어왔습니다. 그동안 기금 고갈 예상 시점은 점점 앞당겨지며 미래 세대의 불안감을 키웠습니다.`,
  players:`정치적 부담을 안고 개혁안을 최종적으로 통과시킨 여야 국회의원들과 법안을 발의한 보건복지부가 우선적인 주체입니다. 당장 매월 더 많은 보험료를 납부해야 하는 직장인 및 기업들도 핵심적인 이해관계자입니다. 나아가 향후 연금 수령액 변동에 민감할 수밖에 없는 청년 세대와 은퇴 세대가 큰 영향을 받습니다.`,
  current:`더 이상 연금 개혁을 방치할 경우 다가올 미래 세대에게 감당할 수 없는 재앙적인 수준의 재정 부담이 전가될 것이라는 위기의식이 정점에 달했습니다. 이에 여야를 막론하고 제도의 지속 가능성을 확보하기 위한 불가피한 선택이라는 공감대가 형성되며 극적인 타협점을 찾은 것입니다.`,
  outlook:`법안의 국회 통과 이후 이를 실제 현장에 적용하기 위한 시행령 등 구체적인 하위 법령을 정비하는 절차가 남아 있습니다. 아울러 다소 줄어들 수 있는 공적 연금의 혜택을 보완하기 위해 퇴직연금이나 개인연금 등 사적 연금을 활성화하는 추가 정책의 도입 여부가 주목받고 있습니다.`,
  sources:[{title:`여야 합의로 연금개혁안 본회의 통과…보험료율 13%로 - KBS`,url:`https://news.kbs.co.kr/news/pc/view/view.do?ncd=202608260007`},{title:`국민연금 기금 고갈 늦췄지만…사적연금 활성화 과제 남아 - SBS`,url:`https://news.sbs.co.kr/news/endPage.do?news_id=N202608260008`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미중 정상회담 샌프란시스코에서 개최, AI 군사적 이용 제한 합의`,
  metrics:[`미중 정상 4시간 심층 회담`,`AI 무기 통제 관련 공동 선언문 채택`],
  summary:`미국과 중국의 정상이 샌프란시스코에서 만나 군사 분야에서의 AI 활용을 제한하는 데 극적으로 합의했습니다. 양국은 자율살상무기 등 치명적인 군사 시스템에 AI를 전면 도입하는 것을 자제하기로 했습니다. 이는 첨단 기술 패권 경쟁 속에서도 최소한의 안전장치(가드레일)를 마련했다는 점에서 국제사회의 큰 환영을 받고 있습니다. 무역 분쟁과 대만 문제 등 민감한 현안에 대해서는 여전히 입장 차이를 보였으나, 대화 채널 복원이라는 성과를 거두었습니다. 이번 정상회담은 양국 간의 우발적 군사 충돌을 방지하기 위한 중요한 첫걸음으로 평가됩니다. 향후 실무급 회담을 통해 합의 내용을 구체화할 예정입니다. 글로벌 외교 지형에도 상당한 안정감을 부여할 것으로 기대됩니다.`,
  keyTerms:[{term:`가드레일`,explanation:`차량이 도로 밖으로 벗어나는 것을 막는 보호 난간처럼, 국가 간의 갈등이나 경쟁이 파국으로 치닫지 않도록 막아주는 최소한의 안전장치나 규칙을 뜻합니다.`}],
  history:`미국과 중국은 무역 분쟁을 시작으로 최근에는 첨단 반도체 수출 통제와 대만 해협 등 안보 문제에 이르기까지 전방위적인 패권 경쟁을 벌여왔습니다. 이러한 갈등은 신냉전 구도를 형성하며 글로벌 공급망 불안과 군사적 긴장감을 고조시켰습니다. 양국 관계가 단절 상태에 이르자 국제사회는 신냉전의 격화에 대한 우려를 지속적으로 표명했습니다.`,
  players:`최고위급 협상 테이블에 직접 마주 앉은 미국의 조 바이든 대통령과 중국의 시진핑 국가주석이 핵심적인 결정을 내리는 주체입니다. 성공적인 회담을 위해 치열한 물밑 조율을 담당한 양국의 외교 및 국방 고위급 관료들도 중요한 역할을 수행했습니다. 또한 글로벌 패권 다툼의 영향을 받는 인접국가들과 다국적 기업들도 사태를 주시하고 있습니다.`,
  current:`양국 모두 장기화된 갈등으로 인한 경제적 피로감이 상당 부분 누적된 상태였습니다. 특히 AI와 같은 신기술이 통제 불능의 우발적인 군사 충돌로 이어질 수 있다는 양측의 위기의식이 대화를 재개하고 최소한의 룰을 정해야 한다는 결단으로 이어졌습니다.`,
  outlook:`AI 무기 통제라는 상징적인 합의를 넘어, 향후 재개될 실무급 채널에서 양국의 경제 제재 완화 논의가 진전될 수 있을지가 관심사입니다. 또한 대만 해협이나 남중국해 등 여전히 이견이 첨예한 안보 문제에서 추가적인 우발 충돌 방지책이 마련될지 지켜봐야 합니다.`,
  sources:[{title:`미중 정상회담, AI 군사적 활용 제한 '가드레일' 합의 - 연합뉴스`,url:`https://www.yna.co.kr/view/AKR202608260009`},{title:`바이든·시진핑 샌프란시스코서 대좌…안보 충돌 방지책 성과 - 한국경제`,url:`https://www.hankyung.com/politics/article/202608260010`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`이스라엘과 하마스, 카타르 중재로 60일간의 임시 휴전 합의`,
  metrics:[`60일 임시 휴전`,`인질 50명 및 수감자 150명 교환`],
  summary:`카타르의 중재로 이스라엘과 하마스가 60일간의 임시 휴전에 전격 합의하며 가자지구에 일시적인 평화가 찾아왔습니다. 이번 합의에는 억류된 인질과 수감자의 단계적 교환, 그리고 인도주의적 구호 물품의 대규모 반입 허용이 포함되었습니다. 국제사회는 이번 휴전이 영구적인 평화 협상으로 이어지기를 강력히 촉구하고 있습니다. 그동안 악화일로를 걷던 중동 지역의 지정학적 긴장이 다소 완화될 것으로 보입니다. 다만 양측의 강경파들이 합의안에 반발하고 있어 휴전이 끝까지 유지될지는 미지수입니다. 유엔과 구호 단체들은 발 빠르게 가자지구 내 의료 및 식량 지원에 착수했습니다. 이스라엘 내부의 정치적 역학 관계도 향후 상황 전개에 큰 변수가 될 전망입니다.`,
  keyTerms:[{term:`지정학적 긴장`,explanation:`국가 간의 지리적 위치, 정치, 경제적 이해관계가 얽혀 발생한 대립과 갈등 상태를 의미하며, 주로 전쟁이나 영토 분쟁의 위험을 나타냅니다.`}],
  history:`지난해 하마스의 전례 없는 기습 공격으로 촉발된 가자지구 전쟁은 막대한 규모의 민간인 사상자를 내며 1년 가까이 장기화되었습니다. 이로 인해 인도주의적 위기가 극에 달했으며 휴전 협상은 여러 차례 결렬을 반복했습니다. 이스라엘과 주변 아랍 국가들 간의 군사적 마찰이 더해지며 중동 전역으로 확전될 위험을 지속적으로 안고 있었습니다.`,
  players:`전쟁을 지휘하고 있는 베냐민 네타냐후 이스라엘 총리와 강경파 각료들, 그리고 가자지구를 통치하는 하마스 지도부가 분쟁의 직접적인 당사자입니다. 또한 협상 과정에서 막대한 외교력을 동원하여 양측을 중재한 카타르 정부와 미국 행정부가 결정적인 역할을 수행했습니다. 휴전을 애타게 기다리는 인질 가족들과 가자지구 난민들도 중요한 주체들입니다.`,
  current:`국제사회의 거센 휴전 압박과 더불어 이스라엘 내부에서도 조속한 인질 석방을 촉구하는 여론이 정치적 임계점에 도달했습니다. 결국 막대한 인명 피해와 정치적 고립을 우려한 양측 지도부가 입장을 선회하여 임시 휴전안을 전격적으로 수용하게 되었습니다.`,
  outlook:`60일간의 임시 휴전 기간 동안 합의된 인질과 수감자 교환이 돌발 변수 없이 원활하게 이뤄질지가 가장 중요한 과제입니다. 이번 휴전이 단순히 시간을 버는 임시방편에 그칠지, 아니면 전쟁을 완전히 종식시키는 영구 휴전 협상으로 나아가는 디딤돌이 될 수 있을지는 여전히 미지수입니다.`,
  sources:[{title:`이스라엘-하마스 60일 임시 휴전…가자지구 인질 50명 석방 합의 - MBC`,url:`https://imnews.imbc.com/news/2026/world/article/202608260011`},{title:`중동 지정학적 긴장 완화 기대감…유엔 긴급 구호 착수 - 매일경제`,url:`https://www.mk.co.kr/news/world/202608260012`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`국내 주요 상급종합병원, AI 진단 보조 솔루션 전면 도입`,
  metrics:[`오진율 15% 감소 기대`,`도입 병원 40개소 돌파`],
  summary:`국내 주요 상급종합병원들이 영상 의학 분야에 AI 진단 보조 솔루션을 전면 도입하며 스마트 병원으로의 전환을 가속화하고 있습니다. 이 시스템은 엑스레이나 MRI 영상을 분석해 의사가 놓치기 쉬운 미세한 병변을 찾아내는 데 탁월한 성능을 보입니다. 의료진의 피로도를 낮추고 판독의 정확성을 획기적으로 높여 환자 만족도가 크게 상승하고 있습니다. 특히 암 조기 발견에 있어 디지털 헬스케어의 핵심 역할을 할 것으로 기대됩니다. 정부도 AI 의료 기기에 대한 건강보험 수가 적용을 확대하며 산업 육성에 힘을 싣고 있습니다. 향후 병리 진단과 수술 보조 등 다양한 의료 영역으로 AI 활용이 확대될 전망입니다. 다만 의료 데이터의 보안과 환자 개인정보 보호는 여전히 해결해야 할 과제로 남아있습니다.`,
  keyTerms:[{term:`디지털 헬스케어`,explanation:`건강과 의료 분야에 정보통신기술(ICT), 인공지능(AI), 빅데이터 등을 접목하여 개인 맞춤형 의료와 효율적인 건강 관리를 제공하는 산업을 말합니다.`}],
  history:`과거 AI 진단 기술은 주로 대학병원의 연구나 임상 시험 목적으로 제한적인 범위에서만 활용되었습니다. 하지만 최근 딥러닝 알고리즘의 비약적인 발전과 방대한 양의 의료 데이터가 축적되면서 기술적 완성도가 급격히 높아졌습니다. 이에 따라 실제 의료 현장에서 의사의 판단을 돕는 유용한 도구로 인정받기 시작했습니다.`,
  players:`우수한 AI 진단 솔루션을 개발하고 공급하는 루닛, 뷰노 등 국내 대표적인 의료 인공지능 전문 기업들이 혁신을 이끌고 있습니다. 이를 실제 진료에 적극적으로 도입하여 환자를 진단하는 대형 종합병원 의사들도 핵심적인 역할을 합니다. 또한 신의료기술 평가와 건강보험 수가 적용을 결정하는 보건복지부의 정책 방향도 큰 영향을 미칩니다.`,
  current:`최근 다수의 임상 연구를 통해 AI 시스템의 정확도와 효용성이 확실하게 입증되면서 의료계의 불신이 크게 해소되었습니다. 여기에 정부가 신산업 육성을 위해 관련 규제를 완화하고 제도적 지원에 나서면서 대형 병원들의 전면적인 도입이 봇물 터지듯 이루어지고 있는 것입니다.`,
  outlook:`환자들의 다양한 진료 데이터가 AI 모델 학습에 지속적으로 활용됨에 따라 진단의 정확도는 앞으로 더욱 고도화될 전망입니다. 향후 이러한 첨단 의료 시스템이 수도권 대형 병원을 넘어 지역의 동네 의원급으로까지 광범위하게 확산될 수 있을지 귀추가 주목됩니다.`,
  sources:[{title:`빅5 상급종합병원, AI 진단 보조 솔루션 전면 도입 - 중앙일보`,url:`https://www.joongang.co.kr/article/202608260013`},{title:`AI가 암 찾는다…디지털 헬스케어로 스마트 병원 가속 - 조선일보`,url:`https://biz.chosun.com/science-chosun/202608260014`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`유럽 남부, 기상 관측 사상 최고 기온 섭씨 48도 돌파`,
  metrics:[`최고 기온 48.5도 기록`,`폭염 관련 사망자 100명 이상 발생`],
  summary:`이탈리아와 스페인 등 유럽 남부 지역이 섭씨 48도를 넘나드는 살인적인 폭염에 시달리며 비상사태에 돌입했습니다. 기상 관측 사상 전례 없는 고온 현상으로 인해 산불이 동시다발적으로 발생하고 전력망이 마비되는 사태가 속출하고 있습니다. 전문가들은 이러한 극단적 기상이변의 근본적인 원인으로 인간 활동에 의한 기후변화를 지목하고 있습니다. 노약자와 만성질환자 등 취약 계층의 온열 질환 피해가 급증하면서 각국 정부는 임시 대피소를 마련하고 야외 활동 금지령을 내렸습니다. 이번 사태는 탄소 배출 감축과 같은 전 지구적인 환경 문제 해결의 시급성을 다시 한번 일깨워주고 있습니다. 농작물 피해로 인한 글로벌 식량 가격 상승 우려도 제기되고 있습니다. 기상 당국은 당분간 폭염이 지속될 것으로 예보해 피해 규모는 더 커질 전망입니다.`,
  keyTerms:[{term:`기후변화`,explanation:`화석연료 사용 등 인간 활동으로 인해 온실가스가 증가하면서 지구의 평균 기온이 상승하고 극단적인 기상 현상이 빈번해지는 장기적인 환경 변화를 뜻합니다.`}],
  history:`최근 수년 동안 유럽 지역은 여름철마다 평년을 크게 웃도는 기록적인 고온 현상을 겪어왔으며 그 빈도와 강도가 갈수록 심해지고 있습니다. 이는 지구 온난화로 인한 북극 빙하 감소와 제트기류 약화 등 전 지구적인 기후 시스템 변화의 결과로 분석되어 왔습니다. 폭염은 단순한 날씨 문제를 넘어 국가 재난 수준의 위협으로 진화했습니다.`,
  players:`극단적인 더위와 산불 등 직접적인 피해를 가장 심각하게 겪고 있는 남부 유럽 국가들의 시민들과 지방 정부가 1차적인 당사자입니다. 또한 폭염에 취약한 노약자 계층과 환자들을 보호해야 하는 의료 기관들도 비상입니다. 거시적으로는 글로벌 기후 정책을 조율하고 탄소 감축을 압박하는 유럽연합(EU) 당국과 기후 과학자들이 사태 해결에 고심하고 있습니다.`,
  current:`이번 폭염은 섭씨 48도라는 관측 사상 전례 없는 최고 기온을 기록하며 인명 피해와 국가 핵심 인프라 마비가 현실화되는 상황에 이르렀습니다. 기후 위기가 먼 미래의 일이 아니라 지금 당장 인류의 생존을 위협하는 가장 시급한 당면 과제라는 강력한 경고음이 전 세계에 울리고 있습니다.`,
  outlook:`피해 국가들은 단기적으로 임시 대피소 운영과 의료 지원 등 폭염 피해 복구와 취약 계층 보호에 총력을 기울일 전망입니다. 장기적으로는 화석 연료 사용을 획기적으로 줄이고 재생 에너지 투자를 가속화하는 탄소 중립 정책의 실행 속도를 더욱 높일 것으로 예상됩니다.`,
  sources:[{title:`남부 유럽 최고 기온 48도 돌파…최악의 폭염 비상사태 - 연합뉴스`,url:`https://www.yna.co.kr/view/AKR202608260015`},{title:`기후변화의 경고…살인적 폭염에 100명 이상 사망 - 한겨레`,url:`https://www.hani.co.kr/arti/international/europe/202608260016`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,

  headline:`아르테미스 프로젝트 순항, 유인 달 궤도선 발사 성공적 완료`,
  metrics:[`달 궤도 진입 성공`,`우주 비행사 4명 탑승`],
  summary:`인류를 다시 달로 보내기 위한 미국의 아르테미스 프로젝트가 유인 우주선의 달 궤도 진입을 성공시키며 중대한 이정표를 세웠습니다. 4명의 우주 비행사를 태운 오리온 우주선은 예정된 궤도에 안착하여 각종 테스트를 순조롭게 진행하고 있습니다. 이번 임무는 향후 달 표면 유인 착륙과 화성 탐사를 위한 핵심 기술을 검증하는 필수적인 단계입니다. 우주 산업의 상업화가 가속화되는 가운데, 스페이스X 등 민간 기업들의 적극적인 참여가 프로젝트의 성공에 크게 기여하고 있습니다. 전 세계 우주 과학계는 인류의 우주 거주 가능성을 열어줄 심우주 탐사 시대의 개막을 환영하고 있습니다. 우주 비행사들은 약 10일간의 임무를 마치고 지구로 귀환할 예정입니다. 성공적인 귀환은 다음 단계인 실제 달 착륙 임무의 일정을 확정하는 계기가 될 것입니다.`,
  keyTerms:[{term:`심우주 탐사`,explanation:`지구의 궤도를 넘어 달, 화성, 그리고 그 너머의 먼 우주 공간으로 우주선이나 탐사선을 보내어 인류의 활동 영역을 넓히고 미지의 우주를 연구하는 활동입니다.`}],
  history:`미국은 1970년대 아폴로 계획 이후 반세기 만에 인류를 다시 달 표면에 보내기 위해 대규모 다국적 연합 프로젝트인 아르테미스 계획을 추진해왔습니다. 궁극적으로는 달에 전초기지를 구축하고 이를 발판 삼아 화성 유인 탐사까지 나아간다는 원대한 목표를 세웠습니다. 그동안 예산 문제와 로켓 개발의 기술적 난관으로 인해 일정이 수차례 지연되기도 했습니다.`,
  players:`이 거대한 프로젝트를 총괄하며 막대한 자본과 기술을 투입하고 있는 미국 항공우주국(NASA)이 가장 중추적인 역할을 맡고 있습니다. 또한 로켓과 우주선 개발에 참여하여 우주 산업의 상업화를 이끄는 스페이스X 등 민간 우주 기업들도 없어서는 안 될 주역입니다. 목숨을 걸고 직접 우주 비행 임무를 수행하는 다국적 우주 비행사들도 핵심 당사자입니다.`,
  current:`그간의 많은 우려와 기술적 장애물들을 극복하고 마침내 유인 우주선이 성공적으로 발사되어 달 궤도에 안착하는 쾌거를 이루어냈습니다. 이는 민간 기술과의 협력을 통해 아르테미스 프로젝트가 실제로 구현 가능하며 순항하고 있음을 전 세계에 확실하게 증명한 결정적인 순간입니다.`,
  outlook:`이번 궤도 비행 임무에서 수집된 방대한 데이터를 바탕으로 차세대 우주복과 달 착륙선의 성능 및 안전성을 완벽하게 보완하는 작업이 진행될 것입니다. 우주 비행사들이 무사히 지구로 귀환하고 나면, 인류가 다시 달 표면에 발을 내딛게 될 다음 단계의 정확한 임무 일정이 확정될 것입니다.`,
  sources:[{title:`아르테미스 유인 궤도선 달 진입 성공…심우주 탐사 시대 활짝 - KBS`,url:`https://news.kbs.co.kr/news/pc/view/view.do?ncd=202608260017`},{title:`인류 다시 달로 간다…오리온 우주선 테스트 순항 - SBS`,url:`https://news.sbs.co.kr/news/endPage.do?news_id=N202608260018`}]
}]

  tag:`2026-08-25`,
  label:`2026년 8월 25일 (화)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국은행, 2년 만에 기준금리 0.25%p 전격 인하`,
  metrics:[`기준금리 3.00%`,`원/달러 환율 1,320원`],
  summary:`한국은행 금융통화위원회가 오늘 오전 정례회의를 열고 기준금리를 기존 3.25%에서 3.00%로 0.25%포인트 인하했습니다. 이는 내수 침체 장기화와 가계부채 부담을 완화하기 위한 조치로 풀이됩니다. 특히 부동산 PF 부실 우려가 금융권 전반으로 확산되는 것을 막기 위한 선제적 대응의 성격이 짙습니다. 이번 금리 인하로 인해 대출자들의 이자 부담은 다소 줄어들 전망입니다. 하지만 일각에서는 한미 금리차가 여전히 큰 상황에서 외국인 자본 유출과 환율 상승을 부추길 수 있다는 우려도 나옵니다. 한국은행은 앞으로 통화정책 운영에 있어 물가 경로와 거시경제 흐름을 면밀히 점검하겠다고 밝혔습니다.`,
  keyTerms:[{term:`통화정책`,explanation:`중앙은행이 경제의 안정적 성장을 위해 통화량이나 이자율을 조절하는 정책입니다.`}],
  history:`최근 2년간 고물가를 잡기 위해 고금리 기조가 유지되었습니다. 그러나 내수 부진과 부동산 프로젝트파이낸싱(PF) 위기감이 커지면서 금리 인하 요구가 지속적으로 제기되어 왔습니다. 물가 상승률이 2%대로 안정화되면서 정책 전환의 기반이 마련되었습니다.`,
  players:`한국은행 금융통화위원회는 금리 결정을 주도하며, 정부는 내수 진작을 위해 완화적 정책을 기대해왔습니다. 대출자들은 이자 부담 경감을 반기는 반면, 외국인 투자자들은 금리 차이에 따른 환율 변동을 주시하고 있습니다.`,
  current:`물가 안정세가 확인된 가운데 경기 방어가 시급해지면서 통화정책의 무게 중심이 바뀌었습니다. 이번 결정은 향후 연쇄적인 금리 인하 사이클의 시작점이 될 수 있습니다.`,
  outlook:`시장은 연내 추가 금리 인하 가능성에 주목하고 있습니다. 미국 연준의 금리 결정과 국내 부동산 시장의 반응이 향후 주요 변수가 될 것입니다.`,
  sources:[{title:`한은, 기준금리 3.00%로 인하... 경기 부양 나선다 - 한국경제`,url:`https://www.hankyung.com/news/article/202608250001`},{title:`금리 내렸지만 가계부채 뇌관 여전... 시장 반응 촉각 - 매일경제`,url:`https://www.mk.co.kr/news/economy/202608250002`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미 연준, 9월 FOMC 앞두고 빅스텝 가능성 시사`,
  metrics:[`미국 CPI 2.1%`,`나스닥 1.5% 하락`],
  summary:`미국 연방준비제도(Fed) 주요 인사들이 인플레이션 둔화세를 근거로 9월 연방공개시장위원회(FOMC)에서 금리를 0.5%포인트 내리는 빅스텝 가능성을 시사했습니다. 최근 발표된 소비자물가지수(CPI)가 목표치인 2%에 근접하면서 통화 완화에 대한 기대감이 커졌기 때문입니다. 파월 의장은 잭슨홀 미팅 기조연설에서 노동시장 냉각을 막기 위해 정책 전환이 필요하다고 강조했습니다. 이에 따라 글로벌 금융시장은 연준의 금리 인하 속도와 폭에 촉각을 곤두세우고 있습니다. 다만 섣부른 빅스텝이 오히려 경기 침체 우려를 자극할 수 있다는 경계감에 뉴욕 증시는 혼조세를 보였습니다. 향후 발표될 고용 지표가 금리 결정의 핵심 변수가 될 전망입니다.`,
  keyTerms:[{term:`빅스텝`,explanation:`중앙은행이 기준금리를 한 번에 0.5%포인트 올리거나 내리는 큰 폭의 금리 조정을 의미합니다.`}],
  history:`미국 연준은 40년 만에 최악의 인플레이션을 억제하기 위해 공격적인 금리 인상을 단행해왔습니다. 최근 물가 지표가 확연한 둔화세를 보이면서 시장에서는 피벗(정책 전환) 기대감이 꾸준히 형성되었습니다.`,
  players:`제롬 파월 연준 의장을 비롯한 연준 위원들의 발언이 시장을 움직이고 있습니다. 월스트리트 투자자들은 금리 인하 시점을 바탕으로 자산 재조정에 나서고 있습니다.`,
  current:`물가 안정 목표에 도달했다는 자신감과 함께 고용 둔화 우려가 커지면서 금리 인하가 기정사실화되고 있습니다. 인하 폭이 0.25%p일지 0.5%p일지가 초미의 관심사입니다.`,
  outlook:`9월 초 발표될 미국 고용 보고서 결과에 따라 금리 인하 폭이 최종 결정될 것입니다. 향후 금리 경로가 글로벌 자산 시장의 향방을 가를 전망입니다.`,
  sources:[{title:`파월 매파 본색 버리나... 9월 빅스텝 시사 - 연합뉴스`,url:`https://www.yna.co.kr/view/AKR202608250003`},{title:`Fed Officials Signal Substantial Rate Cut in September - Bloomberg`,url:`https://www.bloomberg.com/news/articles/2026-08-25/fed-rate-cut`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`글로벌 AI 반도체 1위 엔비디아, 2분기 깜짝 실적 달성`,
  metrics:[`매출 350억 달러`,`데이터센터 비중 85%`],
  summary:`인공지능(AI) 반도체 선두주자인 엔비디아가 시장의 예상치를 크게 웃도는 2분기 어닝 서프라이즈를 기록했습니다. 핵심 사업인 데이터센터 부문 매출이 전년 동기 대비 150% 이상 급증하며 전체 실적을 견인했습니다. 차세대 AI 칩인 '블랙웰'의 본격적인 양산과 빅테크 기업들의 인프라 투자가 맞물린 결과입니다. 경영진은 하반기에도 폭발적인 수요가 지속될 것이라며 긍정적인 가이던스를 제시했습니다. 이번 어닝 서프라이즈 덕분에 관련 반도체 공급망 기업들의 주가도 일제히 상승 탄력을 받았습니다. 그러나 AI 투자 거품 논란과 중국 수출 통제 등 지정학적 리스크는 여전히 잠재적인 불안 요소로 남아있습니다.`,
  keyTerms:[{term:`어닝 서프라이즈`,explanation:`기업의 실제 실적이 시장의 예상치를 훨씬 뛰어넘어 긍정적인 충격을 주는 현상입니다.`}],
  history:`생성형 AI 붐이 일면서 엔비디아의 그래픽처리장치(GPU) 수요가 폭발적으로 증가했습니다. 마이크로소프트, 구글 등 빅테크 기업들이 AI 주도권을 잡기 위해 대규모 인프라 경쟁을 벌이고 있습니다.`,
  players:`엔비디아는 독점적인 시장 지위를 누리고 있으며, TSMC, SK하이닉스 등 공급망 파트너사들도 호황을 맞고 있습니다. 반면 AMD 등 경쟁사들은 점유율 확대를 위해 추격 중입니다.`,
  current:`이번 실적 발표로 AI 산업의 성장세가 둔화될 것이라는 일각의 우려를 일축했습니다. 신제품 '블랙웰'이 성공적으로 시장에 안착하며 모멘텀을 이어가고 있습니다.`,
  outlook:`AI 모델 고도화에 따른 칩 수요는 당분간 견고할 것으로 보입니다. 다만 미중 갈등에 따른 반도체 수출 규제가 향후 실적에 미칠 영향이 주목됩니다.`,
  sources:[{title:`엔비디아, 분기 매출 350억 달러 돌파... AI 랠리 불지피나 - 중앙일보`,url:`https://www.joongang.co.kr/article/202608250004`},{title:`Nvidia Crushes Earnings Estimates on Insatiable AI Demand - WSJ`,url:`https://www.wsj.com/articles/nvidia-earnings-2026-q2`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`여야, 22대 국회 하반기 원구성 극적 합의`,
  metrics:[`상임위원장 11대 7 배분`,`법사위원장 야당 몫`],
  summary:`여야가 마라톤 협상 끝에 제22대 국회 하반기 원구성에 극적으로 합의하며 국회 정상화의 물꼬를 텄습니다. 쟁점이 되었던 법제사법위원장은 야당이, 운영위원장은 여당이 맡는 것으로 최종 조율되었습니다. 이번 합의는 민생 경제 법안 처리가 시급하다는 여론의 압박이 크게 작용한 것으로 보입니다. 여야 원내대표는 오늘 오후 합의문을 공식 발표하고 곧바로 본회의를 열어 상임위원장 선출안을 처리할 예정입니다. 여야간의 대승적 타협에도 불구하고 주요 쟁점 법안을 둘러싼 이견이 여전해 향후 입법 과정에서 진통이 예상됩니다. 정치권은 신속한 민생 법안 처리로 국민의 신뢰를 회복해야 하는 과제를 안게 되었습니다.`,
  keyTerms:[{term:`원구성`,explanation:`국회가 원활하게 활동할 수 있도록 국회의장단을 선출하고 각 상임위원회를 조직하는 일입니다.`}],
  history:`국회 하반기 시작과 함께 주요 상임위원장 자리를 차지하기 위한 여야의 기싸움으로 국회 공백 상태가 장기화되었습니다. 특히 법안 통과의 관문인 법사위원장 자리를 두고 갈등이 극심했습니다.`,
  players:`여당과 제1야당 원내대표가 협상의 주도권을 쥐고 당내 강경파를 설득하는 과정을 거쳤습니다. 민생 법안 처리를 요구하는 시민단체와 언론의 비판도 결정적 역할을 했습니다.`,
  current:`장기 파행으로 인한 여론 악화에 부담을 느낀 양당이 한 발씩 양보하며 타협점을 찾았습니다. 이에 따라 국회의 입법 기능이 정상적으로 가동될 수 있게 되었습니다.`,
  outlook:`가까스로 국회가 정상화되었으나, 세제 개편안과 쟁점 법안 처리 과정에서 언제든 여야 충돌이 재현될 수 있습니다. 협치 분위기가 얼마나 지속될지가 관건입니다.`,
  sources:[{title:`여야, 원구성 극적 타결... 법사위 야·운영위 여 - 조선일보`,url:`https://www.chosun.com/politics/2026/08/25/0005/`},{title:`지각 출발 22대 하반기 국회, 산적한 민생법안 처리 시급 - 한겨레`,url:`https://www.hani.co.kr/arti/politics/202608250006.html`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`이스라엘-하마스, 가자지구 3단계 휴전안 최종 서명`,
  metrics:[`인질 50명 1차 석방`,`6주간 임시 휴전`],
  summary:`이스라엘과 하마스가 이집트 카이로에서 열린 중재 협상에서 가자지구 3단계 휴전안에 최종 서명했습니다. 이번 합의에 따라 양측은 6주간의 적대 행위를 중단하고 1차로 50명의 인질과 팔레스타인 수감자를 교환하기로 했습니다. 미국과 카타르 등 국제사회의 끈질긴 외교적 노력이 휴전안 타결이라는 결실을 맺었습니다. 가자지구 주민들은 인도적 지원 물자 반입이 재개된다는 소식에 안도하고 있으나 완전한 종전까지는 갈 길이 멉니다. 영구적인 평화 정착을 위한 2단계 협상은 양측의 입장 차이가 커 난항이 예상됩니다. 중동 지역의 지정학적 긴장 완화 여부가 국제 사회의 핵심 관심사로 떠오르고 있습니다.`,
  keyTerms:[{term:`휴전안`,explanation:`전쟁 당사국들이 합의하여 일정 기간 군사적 충돌을 중단하기로 하는 문서나 조약입니다.`}],
  history:`지난 수개월간 가자지구에서 치명적인 무력 충돌이 이어지면서 막대한 민간인 피해가 발생했습니다. 여러 차례의 휴전 시도가 불발되며 인도주의적 위기가 극에 달했습니다.`,
  players:`이스라엘과 하마스가 당사자이며, 미국, 이집트, 카타르가 중재자로 나서 협상을 주도했습니다. 유엔을 비롯한 국제기구들도 휴전 압박을 가해왔습니다.`,
  current:`양측 모두 전쟁 피로도가 극에 달했고, 국내외의 정치적 압박이 거세지면서 타협에 이르렀습니다. 이번 서명으로 일단 최악의 유혈 사태는 멈추게 되었습니다.`,
  outlook:`6주간의 휴전 기간 동안 영구 종전을 위한 후속 협상이 진행될 예정입니다. 인질 석방의 차질이나 국지적 충돌이 발생하면 휴전이 즉각 파기될 위험도 존재합니다.`,
  sources:[{title:`이스라엘·하마스 휴전 합의... 가자지구 포성 멈췄다 - SBS 뉴스`,url:`https://news.sbs.co.kr/news/endPage.do?news_id=N202608250007`},{title:`Israel and Hamas Sign Three-Phase Ceasefire Agreement - Reuters`,url:`https://www.reuters.com/world/middle-east/gaza-ceasefire-2026-08-25`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`우크라이나, 러시아 본토 쿠르스크 지역 공세 강화`,
  metrics:[`통제 지역 1,200㎢`,`러시아군 포로 300명`],
  summary:`우크라이나 군이 러시아 본토인 쿠르스크 주에 대한 기습 공세를 강화하며 전쟁의 새로운 국면을 열고 있습니다. 우크라이나는 현재 1,200제곱킬로미터 이상의 러시아 영토를 통제하고 있다고 주장하며 국경 지대 요새화를 진행 중입니다. 이는 러시아의 예비 병력을 자국 본토로 분산시키고 향후 평화 협상에서 유리한 고지를 점하기 위한 전술적 움직임으로 풀이됩니다. 러시아 정부는 비상사태를 선포하고 대대적인 반격에 나섰으나 초기 방어망 붕괴로 어려움을 겪고 있습니다. 이번 본토 타격 전술이 장기화된 소모전 양상에 어떤 변화를 가져올지 전 세계가 주목하고 있습니다. 확전 우려 속에서 서방 국가들의 무기 지원 지속 여부도 중요한 변수가 될 것입니다.`,
  keyTerms:[{term:`소모전`,explanation:`장기간 대치하며 상대방의 병력과 물자를 소진시켜 지치게 만드는 형태의 전쟁입니다.`}],
  history:`러시아의 침공으로 시작된 우크라이나 전쟁은 수년째 교착 상태에 빠져 있었습니다. 우크라이나는 방어에 치중하던 전략에서 벗어나 최근 러시아 영토로 직접 진격하는 작전을 전개했습니다.`,
  players:`우크라이나 정규군과 러시아 수비대가 격돌하고 있습니다. 미국과 유럽 동맹국들은 확전을 우려하면서도 우크라이나의 자위권 차원이라며 간접적인 지지를 보내고 있습니다.`,
  current:`우크라이나의 허를 찌른 공격이 성공을 거두며 푸틴 정권에 상당한 정치적 타격을 주고 있습니다. 러시아는 체면을 구긴 상황에서 영토 탈환에 사활을 걸고 있습니다.`,
  outlook:`이번 작전이 일시적인 교란에 그칠지, 아니면 전쟁의 향방을 바꿀 결정적 변곡점이 될지는 러시아의 반격 강도에 달려있습니다. 다가오는 겨울을 앞두고 양측의 치열한 공방이 예상됩니다.`,
  sources:[{title:`우크라, 러 본토 더 깊숙이 진격... 커지는 확전 위기 - MBC 뉴스`,url:`https://imnews.imbc.com/news/2026/world/article/202608250008.html`},{title:`Ukraine Expands Control in Russia's Kursk Region - BBC`,url:`https://www.bbc.com/news/world-europe-20260825`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`한국형 차세대 발사체 개발 사업, 예비타당성 조사 통과`,
  metrics:[`총 예산 2조 원`,`2030년 첫 발사 목표`],
  summary:`과학기술정보통신부는 누리호를 잇는 한국형 차세대 발사체 개발 사업이 정부의 예비타당성 조사를 최종 통과했다고 발표했습니다. 이번 사업은 달 착륙선 등 대형 탑재체를 우주로 보낼 수 있는 고성능 재사용 발사체 기술 확보를 목표로 합니다. 총 2조 원 규모의 예산이 투입되며 정부와 민간 기업이 공동으로 설계부터 제작까지 참여하는 뉴스페이스 생태계 조성이 핵심입니다. 관련 산업계는 우주 경제 시대에 발맞춰 글로벌 경쟁력을 갖출 수 있는 획기적인 전환점이라며 환영의 뜻을 밝혔습니다. 본격적인 개발 착수로 2030년 첫 발사라는 목표 달성에 청신호가 켜졌습니다. 독자적인 우주 수송 능력 확보를 향한 대한민국의 발걸음이 한층 빨라질 전망입니다.`,
  keyTerms:[{term:`예비타당성 조사`,explanation:`정부의 재정이 대규모로 투입되는 국책 사업의 경제성과 실현 가능성을 사전에 검증하는 절차입니다.`}],
  history:`누리호 발사 성공 이후 더 무거운 위성이나 탐사선을 쏘아 올릴 수 있는 차세대 기술 확보의 필요성이 꾸준히 제기되었습니다. 글로벌 우주 시장 선점을 위해 정부 주도에서 민간 주도로의 전환이 논의되어 왔습니다.`,
  players:`과학기술정보통신부와 한국항공우주연구원이 주관하며, 다수의 국내 항공우주 관련 민간 기업들이 체계종합기업으로 참여하기 위해 치열한 경쟁을 벌이고 있습니다.`,
  current:`예산 확보의 최대 관문인 예타를 무사히 통과함에 따라 사업 추진이 본궤도에 올랐습니다. 민간의 혁신 역량을 어떻게 우주 개발에 접목시킬지가 당면 과제입니다.`,
  outlook:`내년부터 세부 설계와 핵심 엔진 개발이 본격화됩니다. 미국의 스페이스X가 주도하는 재사용 발사체 시장에 한국이 성공적으로 진입할 수 있을지 기대가 모아집니다.`,
  sources:[{title:`차세대 발사체 예타 통과... 달 착륙선 독자 기술로 쏜다 - KBS 뉴스`,url:`https://news.kbs.co.kr/news/view.do?ncd=202608250009`},{title:`우주청, 차세대 발사체 예산 확보 성공... '뉴스페이스' 시동 - 한국경제`,url:`https://www.hankyung.com/news/article/202608250010`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`WHO, 새로운 변이 바이러스 확산에 '국제적 공중보건 비상사태' 선포`,
  metrics:[`감염국 45개국`,`치명률 2.5%`],
  summary:`세계보건기구(WHO)가 아프리카를 중심으로 급속히 확산 중인 새로운 엠폭스(Mpox) 변이 바이러스에 대해 국제적 공중보건 비상사태를 선포했습니다. 이번 변이는 기존 바이러스보다 전파력이 강하고 치명률이 상대적으로 높아 국제사회의 긴급한 대응이 요구되는 상황입니다. 테드로스 아드하놈 거브러여수스 WHO 사무총장은 백신과 치료제의 공평한 분배를 위한 글로벌 연대를 강력히 촉구했습니다. 각국 보건 당국은 공항과 항만에서 검역을 강화하고 선제적인 방역 조치 마련에 나섰습니다. 팬데믹 이후 또다시 발생한 전염병 위협에 전 세계 시민들의 불안감도 커지고 있습니다. 조속한 백신 공급과 철저한 개인위생 관리가 확산 차단의 열쇠가 될 것입니다.`,
  keyTerms:[{term:`국제적 공중보건 비상사태`,explanation:`질병이 국제적으로 퍼져 다른 국가의 공중보건에 위험을 초래할 수 있어 전 세계적인 대응이 필요한 심각한 상황을 말합니다.`}],
  history:`수년 전 확산되었던 엠폭스가 최근 아프리카 대륙에서 변이를 일으켜 통제 범위를 벗어나기 시작했습니다. 초기 대응 미흡으로 국경을 넘어 여러 대륙으로 번지는 양상입니다.`,
  players:`세계보건기구가 컨트롤 타워 역할을 수행하고 있으며, 각국 정부의 방역 당국과 제약사들이 긴밀히 공조하여 백신 수급을 논의하고 있습니다.`,
  current:`최고 수준의 경보가 발령됨에 따라 국가 간 이동 제한이나 방역 조치가 대폭 강화될 조짐을 보이고 있습니다. 백신 비축량이 부족한 국가들의 위기감이 특히 높습니다.`,
  outlook:`제약사들의 백신 증산 속도와 국제사회의 신속한 지원 여부가 바이러스 확산세를 꺾을 수 있는 주요 요인입니다. 세계 경제에 미칠 여파에 대한 우려도 공존합니다.`,
  sources:[{title:`WHO, 엠폭스 변이 확산에 최고수준 경보 '비상사태' 선포 - 연합뉴스`,url:`https://www.yna.co.kr/view/AKR202608250011`},{title:`WHO Declares Mpox Variant a Global Health Emergency - NYT`,url:`https://www.nytimes.com/2026/08/25/health/who-mpox-emergency.html`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`유럽연합, 세계 최초 '포괄적 AI 규제법' 공식 발효`,
  metrics:[`과징금 최대 7%`,`유예 기간 2년`],
  summary:`유럽연합(EU)이 인공지능 기술의 오남용을 막고 안전한 사용을 보장하기 위한 포괄적 AI 규제법을 공식 발효했습니다. 이 법안은 AI 시스템의 위험도를 4단계로 분류하고 안면 인식 등 고위험 기술의 사용을 엄격히 제한하는 내용을 담고 있습니다. 규정을 위반하는 기업은 전 세계 연간 매출의 최대 7%에 달하는 막대한 과징금을 부과받을 수 있습니다. 빅테크 기업들은 규제 준수를 위한 시스템 개편에 착수했으며 글로벌 기술 표준에 미칠 파장을 예의주시하고 있습니다. 혁신을 저해할 수 있다는 우려 속에서도 윤리적 AI 개발을 위한 기념비적인 이정표가 될 것이라는 평가가 나옵니다. 전 세계 주요 국가들의 AI 관련 입법 동향에도 큰 영향을 미칠 전망입니다.`,
  keyTerms:[{term:`규제법`,explanation:`특정 산업이나 기술이 사회에 미치는 부정적인 영향을 막기 위해 국가가 일정한 규칙과 기준을 정해 통제하는 법률입니다.`}],
  history:`챗GPT 등 생성형 AI의 등장 이후 기술 발전 속도가 법과 제도를 앞지르면서 부작용에 대한 우려가 커졌습니다. EU는 수년간의 논의 끝에 세계 최초로 통일된 규칙안을 마련했습니다.`,
  players:`유럽의회와 집행위원회가 입법을 주도했으며, 구글, 메타, 오픈AI 등 다국적 빅테크 기업들이 법안의 직접적인 규제 대상이 되었습니다.`,
  current:`법안 발효로 인해 유럽 시장에 진출하려는 모든 기업은 엄격한 심사와 투명성 의무를 지게 되었습니다. 위반 시 천문학적인 벌금이 예고되어 기업들의 발등에 불이 떨어졌습니다.`,
  outlook:`2년의 유예 기간 동안 세부적인 집행 지침이 확립될 것입니다. 미국과 한국 등 다른 국가들도 EU의 선례를 참고하여 자국 내 AI 관련 법제화에 속도를 낼 것으로 예상됩니다.`,
  sources:[{title:`EU, 세계 첫 'AI 규제법' 발효... 위반시 매출 7% 벌금 - 조선일보`,url:`https://biz.chosun.com/it-science/2026/08/25/0012/`},{title:`EU's Landmark AI Act Enters Into Force - FT`,url:`https://www.ft.com/content/eu-ai-act-2026-08-25`}]
}]

  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`KDI, 올해 한국 경제성장률 전망치 3.2%로 대폭 상향 조정`,
  metrics:[`3.2%`,`8.7%`],
  summary:`한국개발연구원(KDI)이 올해 한국 경제성장률 전망치를 기존 2.5%에서 3.2%로 대폭 상향 조정했습니다. 글로벌 AI 인프라 투자 확대로 반도체 수출이 무려 8.7% 증가할 것으로 예상되며 경제를 강하게 이끌고 있기 때문입니다. 정부 역시 성장률 목표를 3%로 상향 제시하며 경기 회복에 강한 자신감을 내비치고 있습니다. 수출 호조에 힘입어 기업들의 설비투자 심리도 덩달아 살아나면서 산업 전반에 활기가 돌기 시작했습니다. 다만 중동 정세 불안과 지속되는 고유가 여파로 소비자물가 상승률은 2.7% 수준을 기록하며 물가 부담은 여전할 전망입니다. 또한 소득 증가 효과가 반도체 등 특정 대기업 부문에 편중되어 있어, 내수 시장 전반으로 온기가 퍼지기까지는 시간이 더 필요하다는 지적이 나옵니다.`,
  keyTerms:[{term:`경제성장률`,explanation:`국가의 경제 규모가 일정 기간 동안 얼마나 커졌는지를 보여주는 핵심 비율입니다. 이 수치가 오르면 일반적으로 국가 경제가 호황에 접어들었다는 것을 의미합니다.`}],
  history:`과거 몇 년간 고금리와 글로벌 경기 침체로 인해 한국 경제는 저성장 기조를 이어왔습니다. 그러나 작년 말부터 시작된 생성형 AI 붐이 반도체 수요를 폭발적으로 증가시켰습니다.`,
  players:`기획재정부와 한국은행, 그리고 경제전망을 발표하는 KDI가 주요 기관입니다. 또한 삼성전자와 SK하이닉스 등 주요 수출 대기업들의 실적이 결정적 역할을 합니다.`,
  current:`수출 중심의 제조업은 사상 최대 호황을 누리고 있지만, 물가 상승과 자영업자 부채 문제로 인해 서민들의 체감 경기는 여전히 차가운 양극화 상황이 펼쳐지고 있습니다.`,
  outlook:`정부는 하반기 물가 안정과 팍팍한 내수 진작을 위한 추가 부양책을 검토 중이며, 특히 오는 10월 발표될 3분기 실질 GDP 속보치에 큰 관심이 쏠리고 있습니다.`,
  sources:[{title:`KDI, 성장률 3.2%로 상향 - 매일경제`,url:`https://www.mk.co.kr/`},{title:`반도체가 이끈 경제회복 - MBC`,url:`https://imnews.imbc.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`KIEP, 미-이란 전쟁 등 복합 위기 속 올해 세계 경제성장률 3.0% 전망`,
  metrics:[`3.0%`,`2.0%`],
  summary:`대외경제정책연구원(KIEP)은 올해 세계 경제성장률을 3.0%로 전망하며 글로벌 경제가 중첩된 충격 속에서도 활로를 찾고 있다고 진단했습니다. 지난 3월 발생한 미-이란 전쟁에 따른 에너지 가격 급등과 미국의 관세 장벽 강화가 주요 하방 리스크로 꼽힙니다. 그럼에도 불구하고 미국 경제는 막대한 AI 투자 확대에 힘입어 2.0%의 비교적 양호한 성장을 방어할 것으로 보입니다. 중국은 부동산 침체를 만회하기 위해 4.5% 성장을 목표로 공격적인 재정 부양에 나서고 있습니다. 반면 에너지 위기의 직격탄을 맞은 유럽과 수요 둔화를 겪는 일본은 1% 미만의 저조한 흐름이 지속되는 등 국가별 양극화 현상이 뚜렷해지고 있습니다. 결론적으로 지정학적 위기 속에서도 첨단 AI와 반도체 산업의 확장이 글로벌 경제의 심각한 침체를 막아내는 핵심 버팀목 역할을 하고 있습니다.`,
  keyTerms:[{term:`양극화`,explanation:`서로 다른 그룹 간의 격차가 점점 더 벌어지는 현상입니다. 이 기사에서는 막대한 AI 투자가 이루어진 국가와 그렇지 못한 국가 간의 극심한 경제 성장 차이를 의미합니다.`}],
  history:`글로벌 경제는 코로나 팬데믹 이후 인플레이션을 잡기 위한 고강도 긴축의 여파를 혹독하게 겪어왔습니다. 여기에 중동 지역의 군사적 충돌이 더해져 불확실성이 극에 달한 상태입니다.`,
  players:`안정적인 고성장을 유지하려는 미국 정부와 경기 방어에 사활을 건 중국, 그리고 심각한 에너지 위기에 직면한 유럽 연합이 글로벌 경제의 주요 행위자입니다.`,
  current:`전쟁 장기화로 국제 유가가 배럴당 100달러를 돌파할 수 있다는 공포가 상존하지만, 글로벌 빅테크 기업들의 인프라 투자가 시장의 우려를 일부 상쇄하고 있습니다.`,
  outlook:`미국 연방준비제도의 하반기 금리 정책 변화와 중동 정세의 전개 방향에 따라 내년도 세계 경제의 운명과 각국 통화 가치가 크게 좌우될 것입니다.`,
  sources:[{title:`세계경제 성장 3.0% 전망 - 한국경제`,url:`https://www.hankyung.com/`},{title:`미국 AI가 살린 세계경제 - 연합뉴스`,url:`https://www.yna.co.kr/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국 반도체 기업들, 글로벌 AI 칩 수요 폭발로 3분기 어닝 서프라이즈 확실시`,
  metrics:[`3분기`,`100억 달러`],
  summary:`글로벌 빅테크 기업들의 AI 인프라 구축 경쟁이 치열해지면서 한국 반도체 산업이 전례 없는 초호황을 누리고 있습니다. 삼성전자와 SK하이닉스 등 주요 기업들의 올해 3분기 영업이익이 전년 대비 큰 폭으로 뛰어오르며 압도적인 어닝 서프라이즈를 기록할 것이 확실시됩니다. HBM(고대역폭메모리) 등 고부가가치 제품의 주문량이 쏟아지면서 일부 생산 라인은 내년 말까지 물량이 모두 매진된 상태입니다. 이들 기업의 폭발적인 실적 호조가 전체 수출 실적을 홀로 이끌며 막대한 무역수지 흑자를 견인하고 있습니다. 일각에서는 이러한 실적 잔치가 장비 투자 확대로 이어져 국내 관련 생태계에도 긍정적인 낙수효과를 일으킬 것으로 기대하고 있습니다. 하지만 엔비디아 등 특정 미국 고객사에 대한 매출 의존도가 지나치게 높다는 점은 향후 칩 시장 재편 과정에서 심각한 약점이 될 수 있습니다.`,
  keyTerms:[{term:`어닝 서프라이즈`,explanation:`기업들이 발표한 분기별 실적이나 영업이익이 당초 주식 시장의 예상치를 훨씬 뛰어넘어 깜짝 놀랄 만큼 매우 좋게 나온 상황을 뜻합니다.`}],
  history:`과거 메모리 반도체 시장은 가격 사이클에 따라 극심한 호황과 불황을 반복했습니다. 하지만 최근 생성형 AI의 등장으로 고성능 메모리 칩에 대한 구조적인 수요가 새롭게 창출되었습니다.`,
  players:`글로벌 AI 칩 시장을 꽉 잡고 있는 엔비디아와 이에 HBM을 독점적으로 공급하는 SK하이닉스, 그리고 파운드리 시장 추격에 사활을 건 삼성전자가 핵심 플레이어입니다.`,
  current:`반도체 공정 생산 라인을 24시간 풀가동해도 전 세계에서 밀려드는 거대한 주문량을 다 소화하지 못할 정도로 유례없는 초호황을 누리고 있습니다.`,
  outlook:`AI 서버 구축 수요가 단기간에 꺾이지 않을 것이란 전망이 우세해, 올 하반기에도 한국 주요 기업들의 수출 및 이익 지표는 계속해서 긍정적인 신호를 뿜어낼 것으로 예상됩니다.`,
  sources:[{title:`3분기 어닝 서프라이즈 예고 - 조선일보`,url:`https://www.chosun.com/`},{title:`반도체 훈풍에 무역수지 흑자 - SBS`,url:`https://news.sbs.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`국회 법사위, 대법원장 사퇴 압박과 대통령 재판 재개 요구로 8월 말 정면충돌 예고`,
  metrics:[`8월 31일`,`20자리`],
  summary:`오는 8월 31일 열릴 국회 법제사법위원회에서 여당과 야당 간의 벼랑 끝 대치가 벌어질 전망입니다. 장동혁 체제의 국민의힘은 사법부를 향해 현재 중단된 이재명 대통령의 과거 재판을 즉각 재개하라고 강력히 촉구할 계획입니다. 반면 집권 여당인 민주당은 대법원의 편향성을 강도 높게 지적하며 조희대 대법원장의 자진 사퇴를 압박하는 맞불 작전을 펴고 있습니다. 이와 함께 조국혁신당 조국 의원 측은 국회 차원에서 한동훈 무소속 의원의 압수된 휴대전화 비밀번호 20자리를 강제로 공개하자며 야권의 공세 수위를 한층 끌어올렸습니다. 여야 모두 각자의 핵심 지지층을 결집하기 위해 한 치의 양보도 없는 강경 대치 국면을 이어가고 있습니다. 이로 인해 9월 정기국회가 열리더라도 시급한 민생 법안과 내년도 예산안 심사가 심각한 파행을 겪을 것이라는 우려가 쏟아지고 있습니다.`,
  keyTerms:[{term:`대치 국면`,explanation:`양측이 서로 한 발짝도 물러서지 않고 팽팽하게 맞서 싸우고 있는 긴장된 상황을 뜻하는 정치 용어입니다. 여기서는 여당과 야당의 타협 없는 싸움을 말합니다.`}],
  history:`과거 2024년 말 초유의 비상계엄 사태와 대통령 탄핵 국면을 거치면서 한국 정치의 이념적 양극화가 극심해졌습니다. 이후 조기 대선으로 정권이 교체되었으나 극심한 갈등은 전혀 봉합되지 않았습니다.`,
  players:`현재 정국을 주도하는 대통령실과 민주당 지도부, 그리고 이를 강력히 견제하는 국민의힘 장동혁 대표 및 무소속 한동훈 의원, 조국 의원이 갈등의 중심에 서 있습니다.`,
  current:`야당은 과거 정권의 풀리지 않은 의혹을 파고들고, 여당은 사법부의 편향성을 무기로 삼아 매일같이 특검법과 국정조사 요구를 남발하며 입법 기능이 사실상 마비된 상태입니다.`,
  outlook:`9월 정기국회가 정식으로 개원하더라도 정치적 주도권 싸움에 밀려 내년도 예산안 심사와 각종 경제 활성화 법안 처리가 기약 없이 뒷전으로 밀릴 가능성이 매우 농후해 보입니다.`,
  sources:[{title:`법사위 정면충돌 카운트다운 - 한겨레`,url:`https://www.hani.co.kr/`},{title:`휴대전화 비밀번호 공개 압박 - 중앙일보`,url:`https://www.joongang.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미-이란 전쟁 장기화 수렁 속, 트럼프 미 대통령 전격적인 북한 대화 카드 제시`,
  metrics:[`2월`,`3차례`],
  summary:`지난 2월 발발한 미국과 이란 간의 치열한 전쟁이 수렁에 빠진 가운데, 트럼프 미국 대통령이 외교적 돌파구 마련을 위해 북한과의 대화 카드를 전격적으로 꺼내 들었습니다. 이는 중동 지역에 과도하게 집중된 미국의 군사적, 경제적 부담을 덜어내고 동아시아 지역의 잠재적 리스크를 선제적으로 관리하려는 고도의 정치적 계산으로 풀이됩니다. 미국 정부 핵심 관계자들은 조건 없는 북미 최고위급 정상회담 가능성까지 공식 시사하며 북한 측에 적극적인 유화 제스처를 보내고 있습니다. 이러한 미국의 갑작스러운 대북 태도 변화는 그동안 대북 강경 기조를 유지하며 주도권을 쥐려던 한국 정부의 외교안보 구상에 큰 딜레마를 안겨주었습니다. 외교 전문가들은 미국이 북한의 핵 동결을 조건으로 일부 경제 제재를 해제해주는 이른바 스몰딜을 시도할 가능성이 높다고 분석합니다. 굳은 침묵을 지키고 있는 북한이 미국의 파격적인 제안에 어떻게 화답할지가 향후 하반기 국제 정세의 최대 변수로 떠올랐습니다.`,
  keyTerms:[{term:`유화 제스처`,explanation:`상대방과 싸우거나 강하게 대립하지 않고 서로 화해하고 싶다는 뜻을 구체적인 행동이나 외교적 제안 등으로 부드럽게 먼저 표현하는 것을 말합니다.`}],
  history:`올해 초 이스라엘과 미국의 전격적인 합동 공습으로 이란 최고지도자가 암살되면서 사태가 걷잡을 수 없는 제5차 중동전쟁으로 비화되었습니다. 이에 미국의 외교력이 중동에 묶여버렸습니다.`,
  players:`재선에 성공하여 철저히 미국 우선주의 독단적 외교를 펴는 도널드 트럼프 대통령과, 이번 상황을 기회 삼아 몸값을 최대한 올리려는 김정은 북한 국무위원장이 핵심 인물입니다.`,
  current:`전쟁 당사국인 이란 내부는 현재 강경 항전파와 조기 종전을 읍소하는 페제시키안 대통령 파벌이 극심한 내전을 방불케 하는 치열한 권력 투쟁을 벌이고 있습니다.`,
  outlook:`미국 중간선거가 다가오면서 트럼프 대통령은 극적인 외교적 치적이 매우 절실한 상황이므로, 빠르면 올 연말에 극적인 북미 3차 정상회담이 성사될 수 있다는 관측도 제기됩니다.`,
  sources:[{title:`트럼프의 깜짝 북한 대화 제안 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`한국 외교안보 중대 딜레마 직면 - 동아일보`,url:`https://www.donga.com/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 측 요청으로 9월 한미 연합훈련 전격 취소, 한국 압박용 카드 논란 가열`,
  metrics:[`9월`,`2배`],
  summary:`오는 9월 대규모로 치러질 예정이었던 한미 해군 및 해병대 연합훈련이 미국의 일방적인 긴급 요청으로 돌연 전격 취소되었습니다. 미국 국방부는 중동 지역의 심각한 긴장 고조로 인해 태평양 함대의 최신 군사력 전개와 예산 운용에 큰 제한이 생겼다는 점을 공식적인 취소 사유로 발표했습니다. 하지만 국내 외교가 일각에서는 이를 단순한 예산이나 자원 부족 문제가 아니라 한국 정부에 대한 미국의 다분히 우회적인 압박 카드로 엄중하게 해석하고 있습니다. 미국이 차기 방위비 분담금의 2배 이상 대폭 인상을 단숨에 관철하거나, 미국의 대중국 견제 전선 동참을 강제하기 위해 고의적으로 한국 방어 훈련을 축소했다는 지적이 제기됩니다. 핵심적인 정례 군사 훈련이 취소됨에 따라 한미 연합 방위 태세와 대북 억지력에 일시적인 치명적 안보 공백이 생길 수 있다는 안보 전문가들의 우려가 점차 커지고 있습니다. 이에 국방부는 이번 연합 훈련 취소와 철저히 무관하게 한국군 단독의 강도 높은 방어 훈련을 예정대로 실시하여 국민들의 안보 불안을 조기에 잠재우겠다고 급히 발표했습니다.`,
  keyTerms:[{term:`대북 억지력`,explanation:`북한이 섣불리 군사적 도발이나 끔찍한 전쟁을 감히 일으키지 못하도록, 막강한 첨단 군사력과 굳건한 한미 동맹을 통해 미리 으름장을 놓고 완벽히 막아내는 힘을 뜻합니다.`}],
  history:`한미 양국 군은 매년 정기적으로 봄과 가을에 대규모 연합 지휘소 훈련 및 실전 야외 기동 훈련을 빈틈없이 실시하며 최고 수준의 군사 대비 태세를 굳건히 유지해 왔습니다.`,
  players:`동북아 핵심 전략 자산을 직접 통제하는 미국 인도태평양사령부와 한국의 국방부, 그리고 이러한 대규모 연합 훈련의 부재를 가장 속으로 반길 북한 군부 수뇌부가 얽혀 있습니다.`,
  current:`미국 군부는 현재 2개 이상의 거대한 전쟁(중동, 우크라이나)을 벅차게 동시에 치르는 것에 대한 심각한 군수품 부족 현상과 누적된 피로감을 공공연히 호소하고 있습니다.`,
  outlook:`향후 북한의 기습적인 탄도 미사일 도발이 재개될 경우, 한국 독자적인 군사 타격 훈련이 한층 강화되거나 정치권 일각에서 자체적인 핵무장 논의가 다시 뜨겁게 불붙을 가능성이 다분합니다.`,
  sources:[{title:`한미 해병대 연합훈련 전격 취소 - KBS`,url:`https://news.kbs.co.kr/`},{title:`미국의 고의적 방위비 압박인가 - 한국일보`,url:`https://www.hankookilbo.com/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`과기정통부, 자연어로 앱 바로 개발하는 '바이브 코딩' 기술 국가 차원 적극 지원 개시`,
  metrics:[`1,000억 원`,`3배`],
  summary:`과학기술정보통신부가 복잡하고 어려운 프로그래밍 언어를 전혀 몰라도 사람의 일상적인 말과 텍스트만으로 온전한 소프트웨어를 개발할 수 있는 이른바 바이브 코딩 인프라 확충에 본격적으로 나섭니다. 정부는 누구나 손쉽게 접근할 수 있는 AI 에이전트 개발 도구 지원 사업을 공식화하며, 올해 안에 관련 딥테크 스타트업 집중 육성에 무려 1,000억 원의 막대한 국가 자금을 투입할 계획이라고 야심 차게 밝혔습니다. 이 제도가 성공적으로 정착되면 누구나 번뜩이는 아이디어만 있으면 단 며칠 만에 고품질의 모바일 앱과 혁신적인 웹 서비스를 세상에 런칭할 수 있는 마법 같은 시대가 활짝 열리게 됩니다. 전문적인 코딩 진입 장벽이 과거에 비해 획기적으로 낮아지면서, 문과생 등 비전공자 청년들의 참신한 IT 창업 시도가 기존 대비 최소 3배 이상 폭발적으로 늘어날 것으로 크게 기대됩니다. 하지만 보안 검증 프로세스를 거치지 않고 자동 생성된 코드의 치명적인 해킹 취약점 노출 문제가 새로운 산업계의 골칫거리로 떠오르고 있습니다. 더불어 전통적인 방식으로 묵묵히 일해 온 수많은 주니어 프로그래머들의 일자리 감소 우려 등 급격한 기술 발전이 낳을 씁쓸한 사회적 부작용에 대한 철저한 대비책 마련도 매우 시급해 보입니다.`,
  keyTerms:[{term:`바이브 코딩`,explanation:`사람이 평소 쓰는 일상적인 말이나 글로 인공지능에게 지시만 내리면, AI가 그 의도를 파악해 알아서 프로그래밍 코드를 뚝딱 짜고 소프트웨어를 만들어주는 매우 편리하고 새로운 개발 방식을 뜻합니다.`}],
  history:`과거 챗GPT가 처음 등장한 직후에는 단순히 개발자의 코딩을 돕는 보조 도구 수준에 머물렀지만, 이제는 기획부터 배포까지 AI가 통째로 전담하는 놀라운 자율형 에이전트 단계로 기술이 진화했습니다.`,
  players:`막대한 예산을 집행하는 과기정통부와 국내 최고 수준의 토종 AI 스타트업들, 그리고 필수적인 클라우드 컴퓨팅 인프라를 거국적으로 제공하는 네이버, KT 등 대형 IT 기업들이 긴밀히 협력하고 있습니다.`,
  current:`상대적으로 단순한 쇼핑몰 웹사이트 구축이나 기본적인 방대한 데이터 분석 업무는 이미 전문 개발자의 손길 없이도 완벽하고 훌륭하게 수행되는 수준에 이르러, 산업계 전반에 큰 충격파를 던지고 있습니다.`,
  outlook:`머지않아 초중고 정규 교육 과정에서 수학 공식을 외우듯 전통적인 코딩 문법을 가르치는 대신, 'AI와 똑똑하게 소통하고 프롬프트를 창의적으로 잘 쓰는 법'을 중점적으로 가르치는 방향으로 교육 패러다임이 완전히 급변할 것입니다.`,
  sources:[{title:`과기부 바이브 코딩 생태계 육성 - 전자신문`,url:`https://www.etnews.com/`},{title:`말만 하면 앱이 뚝딱 완성 - SBS Biz`,url:`https://biz.sbs.co.kr/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`결제부터 환불까지 AI가 알아서 전부 다 하는 '에이전틱 상거래' 시장 매섭게 급성장`,
  metrics:[`500%`,`20%`],
  summary:`사용자의 까다로운 취향을 정밀하게 분석해 알아서 상품을 검색하고, 꼼꼼한 가격 비교 분석은 물론 최종 카드 결제와 반품 처리까지 AI가 스스로 전부 진행하는 에이전틱 상거래가 유통 업계의 가장 뜨거운 핵심 트렌드로 떠올랐습니다. 소비자는 단지 스마트폰에 대고 텍스트나 음성으로 원하는 물건의 조건과 예산을 툭 던지듯 말하기만 하면, 눈치 빠른 AI 비서가 모든 번거롭고 귀찮은 쇼핑 과정을 완벽하게 대신 끝내줍니다. 이 놀라운 관련 시장 규모는 지난 1년 새 무려 500% 이상 폭발적으로 급성장하며 사용자가 직접 밤새워 검색 품을 팔아야 했던 기존의 거대한 전자상거래 플랫폼들을 심각하게 위협하고 있습니다. 발등에 불이 떨어진 대형 유통 기업들은 서둘러 자사 플랫폼 전용 맞춤형 쇼핑 AI 에이전트를 앞다투어 출시하며 기존 충성 고객의 이탈을 막기 위해 그야말로 안간힘을 쓰고 있습니다. 소비자 입장에서는 귀찮은 최저가 탐색 수고를 덜고 숨겨진 할인 쿠폰까지 싹 다 자동 적용받아 평균 20%의 쏠쏠한 비용 절감 효과를 볼 수 있어 체감 만족도가 매우 높습니다. 하지만 AI가 독단적으로 내린 구매 결정이 소비자의 진짜 변덕스러운 의도와 다를 경우, 발생하는 억울한 환불 배송비 책임과 카드 무단 결제 문제가 완전히 새로운 소비자 분쟁 거리로 심각하게 대두되고 있습니다.`,
  keyTerms:[{term:`에이전틱 상거래`,explanation:`사람이 인터넷에서 직접 일일이 물건을 고르고 결제 버튼을 누르는 대신, 똑똑한 인공지능 비서가 주인의 평소 취향과 정해진 예산에 딱 맞춰 알아서 쇼핑을 다 해주는 무척 편리한 서비스입니다.`}],
  history:`초기 온라인 쇼핑은 방대한 검색의 편리함을 주었지만 너무 많은 정보의 홍수로 인해 오히려 심각한 '선택 장애'를 유발했습니다. 이를 해결하기 위해 맞춤형 큐레이션 서비스가 발전하다가 결국 AI에게 모든 걸 위임하는 형태로 완벽히 진화했습니다.`,
  players:`막강한 자본력을 갖춘 아마존과 알리바바 같은 글로벌 유통 공룡뿐만 아니라, 국내 유통 시장에서는 쿠팡과 네이버가 이 거대한 AI 쇼핑 비서 시장의 초기 주도권을 잡기 위해 피 튀기는 격돌을 벌이고 있습니다.`,
  current:`AI가 인간보다 훨씬 빠르게 최저가를 24시간 실시간으로 찾아내고 각종 복잡한 혜택 쿠폰까지 찰떡같이 자동으로 적용해주기 때문에 소비자 만족도는 높지만, 중간 광고 노출 수익을 노리는 기존 플랫폼들은 비상 경영에 돌입했습니다.`,
  outlook:`향후에는 사물인터넷 기술이 접목된 스마트 냉장고가 우유나 계란이 다 떨어진 것을 스스로 인지하고 주인의 번거로운 승인 절차 없이도 단골 마트에 AI 비서를 통해 자동 주문하는 놀라운 시대가 우리 일상에 완벽히 자리 잡을 것입니다.`,
  sources:[{title:`에이전틱 상거래 시대 활짝 개막 - 머니투데이`,url:`https://news.mt.co.kr/`},{title:`유통업계 AI 비서 전쟁 - 한국경제`,url:`https://www.hankyung.com/`}]

let current = null;
let currentCat = null;
const CAT_ORDER = ['경제', '정치', '기타 이슈'];

function renderSidebar() {
  const list = document.getElementById('date-list');
  list.innerHTML = '';
  BRIEFS.forEach((b, i) => {
    const el = document.createElement('div');
    el.className = 'date-item' + (i === 0 ? ' active' : '');
    el.dataset.tag = b.tag;
    const parts = b.tag.split('-');
    const short = parts[1] + '/' + parts[2];
    el.innerHTML = b.tag;
    el.addEventListener('click', () => showBrief(b.tag));
    list.appendChild(el);
  });
}

function showBrief(tag) {
  current = tag;
  document.querySelectorAll('.date-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tag === tag);
  });
  const brief = BRIEFS.find(b => b.tag === tag);
  if (!brief) return;

  // 카테고리별 그룹핑
  const grouped = {};
  brief.stories.forEach(s => {
    if (!grouped[s.category]) grouped[s.category] = [];
    grouped[s.category].push(s);
  });
  const availableCats = CAT_ORDER.filter(c => grouped[c] && grouped[c].length);
  if (!availableCats.length) return;

  // 기본 카테고리 결정
  if (!availableCats.includes(currentCat)) currentCat = availableCats[0];

  renderContent(brief, grouped, availableCats);
}

  const content = document.getElementById('content');
  let html = `<div class="sticky-top">

      <h2>${brief.label}</h2>

  // 탭
  html += '<div class="cat-tabs">';
  availableCats.forEach(c => {
    const cls = c === currentCat ? 'cat-tab active' : 'cat-tab';
    html += `<button class="${cls}" data-cat="${c}">${c}</button>`;
  });
  html += '</div></div>';

  // 선택된 카테고리 기사들
  const stories = grouped[currentCat] || [];

    html += `<div class="story">
      <div class="story-top">
        <div class="story-headline">${s.headline}</div>
      </div>`;
    if (s.metrics.length) {
      html += '<div class="metrics">';
      s.metrics.forEach(m => { html += `<div class="metric-chip">${m}</div>`; });
      html += '</div>';
    }
    // 요약문에 핵심 개념 밑줄 (출력은 박스 다음)
    let summaryHtml = s.summary;
    if (s.keyTerms && s.keyTerms.length) {
      s.keyTerms.forEach(kt => {
        if (!kt.term) return;
        const safe = kt.term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp(safe, 'g');
        summaryHtml = summaryHtml.replace(re, `<span class="kt-underline">${kt.term}</span>`);
      });
    }

    // 핵심 개념 박스 (요약 위)
    if (s.keyTerms && s.keyTerms.length) {
      html += '<div class="key-terms"><div class="key-terms-title">핵심 개념</div>';
      s.keyTerms.forEach(kt => {
        html += `<div class="kt-item">
          <span class="kt-term">${kt.term}</span>
          <span class="kt-exp">${kt.explanation}</span>
        </div>`;
      });
      html += '</div>';
    }

    html += `<div class="summary">${summaryHtml}</div>`;

    const bgSections = [
      ['역사적 맥락', s.history],
      ['핵심 플레이어', s.players],
      ['현재 구도', s.current],
      ['향후 전망', s.outlook],
    ].filter(([, v]) => v);

    if (bgSections.length) {
      html += '<div class="bg-box"><div class="bg-box-title">배경 스토리</div>';
      bgSections.forEach(([label, text]) => {
        html += `<div class="bg-section">
          <div class="bg-section-label">${label}</div>
          <div class="bg-section-text">${text}</div>
        </div>`;
      });
      html += '</div>';
    }

    if (s.sources.length) {
      html += `<button class="sources-toggle" data-toggle="srcs-${idx}">출처 ${s.sources.length}개 보기 <span class="arrow">▾</span></button>`;
      html += `<div class="sources-body" id="srcs-${idx}">`;
      s.sources.forEach((src, si) => {
        html += `<div class="source-item">
          <span class="src-num">${si+1}</span>
          <a href="${src.url}" target="_blank">${src.title}</a>
        </div>`;
      });
      html += '</div>';
    }
    html += '</div>';
  });

  content.innerHTML = html;

  // 탭 클릭 핸들러
  content.querySelectorAll('.cat-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentCat = btn.dataset.cat;
      renderContent(brief, grouped, availableCats);
    });
  });

  // 출처 토글
  content.querySelectorAll('.sources-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const body = document.getElementById(btn.dataset.toggle);
      const isOpen = body.classList.toggle('open');
      btn.classList.toggle('open', isOpen);
    });
  });

  document.getElementById('main').scrollTop = 0;
}

if (BRIEFS.length > 0) {
  renderSidebar();
  showBrief(BRIEFS[0].tag);
} else {
  document.getElementById('content').innerHTML = '<div class="empty">브리핑 데이터가 없습니다.</div>';
}

// ── Quiz Gate ──
const PASS_TARGET = 3;
let correctCount = 0;
const usedIndexes = new Set();

function pickQuestion() {
  // 사용 안 한 문제 중 랜덤. 다 썼으면 풀 리셋
  if (usedIndexes.size >= QUIZ.length) usedIndexes.clear();
  let idx;
  do { idx = Math.floor(Math.random() * QUIZ.length); } while (usedIndexes.has(idx));
  usedIndexes.add(idx);
  return QUIZ[idx];
}

function updateCounter() {
  document.getElementById('quiz-counter').textContent = `(${correctCount}/${PASS_TARGET})`;
}

function renderQuiz() {
  const q = pickQuestion();
  document.getElementById('quiz-q').textContent = q.q;
  updateCounter();
  const feedback = document.getElementById('quiz-feedback');
  feedback.textContent = '';
  feedback.className = 'quiz-feedback';
  const closeBtn = document.getElementById('quiz-close');
  closeBtn.classList.add('hidden');

  const choicesEl = document.getElementById('quiz-choices');
  choicesEl.innerHTML = '';
  // 보기 순서 섞기 (정답 위치 고정 방지)
  const order = q.a.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  order.forEach(idx => {
    const text = q.a[idx];
    const btn = document.createElement('button');
    btn.className = 'quiz-choice';
    btn.textContent = text;
    btn.addEventListener('click', () => {
      const allBtns = choicesEl.querySelectorAll('.quiz-choice');
      allBtns.forEach(b => b.disabled = true);
      if (idx === q.correct) {
        btn.classList.add('correct');
        correctCount++;
        updateCounter();
        if (correctCount >= PASS_TARGET) {
          feedback.textContent = '통과! 들어와도 좋아.';
          feedback.className = 'quiz-feedback right';
          closeBtn.classList.remove('hidden');
        } else {
          feedback.textContent = '역시 맞출 줄 알았어. 다음 문제 고.';
          feedback.className = 'quiz-feedback right';
          btn.blur();
          setTimeout(() => {
            if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
            renderQuiz();
          }, 900);
        }
      } else {
        btn.classList.add('wrong');
        feedback.textContent = '정말 실망이다.... 다음.';
        feedback.className = 'quiz-feedback wrong';
        btn.blur();
        setTimeout(() => {
          if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
          renderQuiz();
        }, 900);
      }
    });
    choicesEl.appendChild(btn);
  });
}

document.getElementById('quiz-close').addEventListener('click', () => {
  document.getElementById('quiz-overlay').classList.add('hidden');
  document.body.classList.remove('quiz-active');
});

document.body.classList.add('quiz-active');
renderQuiz();

// ── Mobile sidebar toggle ──
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('sidebar-backdrop');
function toggleSidebar(open) {
  sidebar.classList.toggle('open', open);
  backdrop.classList.toggle('open', open);
}
document.getElementById('sidebar-toggle').addEventListener('click', () => toggleSidebar(!sidebar.classList.contains('open')));
backdrop.addEventListener('click', () => toggleSidebar(false));
// 날짜 클릭하면 모바일에서 자동으로 닫히게
sidebar.addEventListener('click', e => {
  if (e.target.classList.contains('date-item') && window.innerWidth <= 768) {
    toggleSidebar(false);
  }
});

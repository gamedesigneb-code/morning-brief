  tag:`2026-09-04`,
  label:`2026년 9월 4일 (금)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미 연준의 9월 금리 동결 시사 발언에 뉴욕증시 3대 지수 일제히 반등`,
  metrics:[`미 10년물 국채 금리 4.77%대로 하락`,`나스닥 1.40% 상승`],
  summary:`미국 연방준비제도(Fed)의 크리스토퍼 월러 이사가 9월 금리 동결을 지지한다고 발언하면서 시장의 금리 인상 우려가 크게 완화되었습니다. 이로 인해 최고치로 치솟았던 미 10년물 국채 금리가 4.77%대로 하락하며 채권 시장이 안정을 찾았습니다. 국채 금리 하락은 주식 시장, 특히 엔비디아와 테슬라 등 대형 기술주에 매수세가 유입되는 결과를 낳았습니다. 다우 지수는 1.18%, S&P500은 1.06%, 나스닥은 1.40% 각각 상승 마감하며 뉴욕증시는 일제히 반등에 성공했습니다. 전날 중동의 군사적 긴장 고조로 3.99% 급락했던 코스피 역시 이러한 글로벌 훈풍에 힘입어 반도체 대형주 중심으로 소폭 반등하며 장을 마쳤습니다. 시장은 인플레이션 지표의 추가적인 이변이 없는 한 금리 동결 기조가 이어질 것으로 전망하고 있습니다.`,
  keyTerms:[{term:`금리 동결`,explanation:`중앙은행이 기준금리를 올리거나 내리지 않고 현재 수준으로 유지하는 것을 말합니다. 주식 등 위험 자산에는 호재로 작용하는 경우가 많습니다.`}],
  history:`최근 미국의 인플레이션 우려와 고용 지표 호조로 인해 연준의 추가 금리 인상 가능성이 제기되면서 글로벌 금융 시장이 불안감에 휩싸여 있었습니다.`,
  players:`크리스토퍼 월러 이사 등 연준(Fed) 내 주요 인사들의 발언이 향후 통화정책 방향을 가늠하는 척도로 작용하고 있습니다.`,
  current:`이번 발언은 인플레이션이 어느 정도 통제 범위에 들어왔다는 연준 내 판단을 반영한 것으로 해석되며, 증시 반등의 결정적 계기가 되었습니다.`,
  outlook:`향후 발표될 미국의 8월 소비자물가지수(CPI) 및 고용 보고서 결과에 따라 연준의 최종 스탠스가 확정될 것으로 보입니다.`,
  sources:[{title:`연준 9월 동결 시사, 뉴욕증시 반등 - 조선일보`,url:`https://www.chosun.com`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`일본은행 매파적 발언에 엔화 가치 급등, '엔 캐리 트레이드' 청산 우려 확산`,
  metrics:[`엔·달러 환율 156.5엔대 기록`,`엔화 가치 단기 급등`],
  summary:`일본은행(BOJ) 당국자들이 금리 인상을 선호하는 매파적 발언을 내놓고, 미국의 통화정책 전환 압박까지 겹치면서 엔화 가치가 크게 요동치고 있습니다. 외환 시장에서는 엔화 가치가 달러당 156.5엔대까지 급등하는 양상을 보였습니다. 이렇게 엔화가 강세를 띠면서, 과거 싼 이자로 엔화를 빌려 해외의 고금리 자산에 투자했던 '엔 캐리 트레이드' 자금이 대거 청산될 수 있다는 우려가 커지고 있습니다. 자금 청산이 현실화될 경우 글로벌 유동성이 축소되어 신흥국 및 위험 자산 시장에 충격을 줄 수 있습니다. 실제로 이러한 우려는 국내 증시의 장중 변동성을 키우는 요인으로 작용하며 투자자들의 경계심을 높이고 있습니다. 시장 참여자들은 일본은행의 추가적인 정책 변화와 글로벌 자금 흐름을 예의주시하고 있습니다.`,
  keyTerms:[{term:`엔 캐리 트레이드`,explanation:`금리가 낮은 일본의 엔화를 빌려 금리가 높은 국가의 주식이나 채권 등에 투자하여 수익을 내는 금융 기법입니다.`}],
  history:`일본은 오랫동안 초저금리 정책을 유지해 왔으나, 최근 인플레이션 압력과 엔저 장기화에 따른 경제 부작용으로 인해 금리 인상 카드를 만지작거려 왔습니다.`,
  players:`금리 인상 시점을 저울질하는 일본은행(BOJ)과 금리 동결/인하를 저울질하는 미 연방준비제도의 정책 엇박자가 환율 변동을 주도하고 있습니다.`,
  current:`일본 당국자들의 매파적 발언이 기폭제가 되어 엔화 가치가 급등하면서, 글로벌 금융시장의 뇌관으로 꼽히던 캐리 자금 이탈 우려가 수면 위로 떠올랐습니다.`,
  outlook:`오는 9월 일본은행의 금융정책결정회의 결과 및 성명 내용에 따라 엔화의 추가 강세 여부와 글로벌 자금 시장의 방향성이 판가름 날 전망입니다.`,
  sources:[{title:`BOJ 매파 발언에 엔화 156엔 급등 - 매일경제`,url:`https://www.mk.co.kr`},{title:`엔 캐리 청산 우려, 증시 변동성 키워 - 연합뉴스`,url:`https://www.yna.co.kr`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`야당, 종부세 공제 14억 통일 등 부동산 세제 추가 완화안 정부에 제안`,
  metrics:[`비거주 1주택자 종부세 기본공제 14억 원 제안`,`국민평형(84㎡) 가격 대형 평형 추월`],
  summary:`더불어민주당 주택시장안정화 TF가 비거주 1주택자의 종합부동산세 기본공제를 실거주자와 동일하게 14억 원으로 통일하는 방안을 추진합니다. 또한 장기보유특별공제 보유 공제 폐지 시점을 연기하는 내용 등을 포함한 부동산 세제 완화안을 정부에 공식 제안하며 세금 부담 완화 압박에 나섰습니다. 이는 얼어붙은 부동산 시장의 거래를 활성화하고 징벌적 세제를 정상화하려는 움직임으로 풀이됩니다. 한편 부동산 시장에서는 대출 규제와 실거주 의무의 여파로 같은 아파트 단지 내에서 대형 평형보다 84㎡인 국민평형의 실거래가가 더 비싸게 거래되는 이례적인 가격 역전 현상이 나타나고 있습니다. 일각에서는 과도한 규제가 시장의 정상적인 가격 형성을 왜곡하고 있다는 우려를 제기하고 있습니다. 여야의 부동산 정책 기조 변화가 하반기 시장에 어떤 영향을 미칠지 관심이 집중됩니다.`,
  keyTerms:[{term:`종합부동산세`,explanation:`일정 기준 금액 이상의 부동산을 보유한 사람에게 매년 부과되는 국세로, 부동산 투기 억제를 목적으로 도입된 세금입니다.`}],
  history:`과거 집값 폭등기 도입되었던 강력한 부동산 세금 규제들이 부동산 경기 침체기와 맞물리면서 1주택자들의 과도한 조세 부담 논란을 일으켜 왔습니다.`,
  players:`부동산 민심을 잡으려는 야당(더불어민주당)과 세수 감소를 우려하며 신중한 입장을 취하는 기획재정부 간의 줄다리기가 이어지고 있습니다.`,
  current:`야당이 선제적으로 세제 완화 카드를 꺼내 들면서, 여야 합의를 통한 관련 세법 개정 논의가 급물살을 탈 것으로 보입니다.`,
  outlook:`정부의 세법 개정안 수용 여부 및 국회 본회의 통과 일정에 따라 실제 세금 인하 시기와 부동산 시장의 반등 여부가 결정될 예정입니다.`,
  sources:[{title:`야당, 종부세 14억 통일안 정부에 제안 - 동아일보`,url:`https://www.donga.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`정부, 미국 압박에 중동 호르무즈 해협 해군 전력 파병 신중히 검토`,
  metrics:[`군수지원함 1척 및 해상초계기 1대 파병 유력`,`미국 방위 기여 요구 심화`],
  summary:`정부가 중동 지역의 군사적 긴장이 고조되고 있는 호르무즈 해협에 해군 군수지원함인 '소양함'과 P-8A 해상초계기 등 군 전력을 파병하는 방안을 조심스럽게 검토 중인 것으로 알려졌습니다. 이러한 움직임의 배경에는 도널드 트럼프 미국 대통령이 동맹국인 한국에 이란의 비핵화 및 군사적 안보 기여를 공개적으로 압박한 것이 결정적인 영향을 미친 것으로 분석됩니다. 현재 국가안보회의(NSC) 의결을 거쳐 국회 비준동의안 제출을 준비 중이라는 구체적인 언론 보도가 나오고 있습니다. 그러나 청와대와 국방부는 아직 파병이 최종 결정된 바 없다며 매우 신중한 태도를 유지하고 있습니다. 실제 파병이 이루어질 경우 한국이 미국의 중동 분쟁에 깊숙이 개입하게 되어, 이란 등 중동 국가들과의 외교적 마찰과 우리 국민의 안전 문제가 도마 위에 오를 전망입니다. 국회 비준 과정에서도 여야 간 거센 진통이 예상됩니다.`,
  keyTerms:[{term:`국회 비준동의안`,explanation:`헌법에 따라 외국에 군대를 파병하거나 중대한 조약을 체결할 때, 정부의 결정이 효력을 갖기 위해 국회의 찬성을 얻어야 하는 절차입니다.`}],
  history:`미국은 글로벌 안보 유지에 있어 동맹국들의 비용 분담과 군사적 기여 확대를 지속적으로 요구해 왔으며, 트럼프 행정부 들어 그 압박 강도가 거세졌습니다.`,
  players:`파병을 요구하는 미국 정부와, 동맹 유지와 중동 외교라는 두 마리 토끼를 잡아야 하는 한국 정부(청와대, 외교부, 국방부)가 핵심 행위자입니다.`,
  current:`미국의 구체적인 압박이 공개되면서 한국 정부는 파병을 통한 한미동맹 강화와 국내 정치적 반발 사이에서 진퇴양난의 결정을 내려야 하는 상황입니다.`,
  outlook:`조만간 열릴 국가안보회의 결과와 이후 국회 제출 여부에 따라 향후 정국 및 한미, 대중동 외교의 분수령이 될 전망입니다.`,
  sources:[{title:`정부, 호르무즈 파병안 국회 제출 검토 - 조선일보`,url:`https://www.chosun.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`왕이 중국 외교부장의 남북 '두 국가' 지칭에 한국 정부 엄중 항의`,
  metrics:[`비공개 한중 회담서 외교적 충돌`,`중국 통일 지지 원칙 위배 논란`],
  summary:`최근 열린 비공개 한중 회담에서 왕이 중국 외교부장이 남한과 북한을 향해 '두 개의 국가'라는 표현을 사용해 심각한 외교적 마찰이 빚어졌습니다. 위성락 국가안보실장은 이 발언에 대해 우리 정부가 현장에서 즉각적이고 엄중하게 문제를 제기했다고 뒤늦게 밝혔습니다. 한국 정부가 강하게 반발한 이유는 1992년 한중 수교 당시 합의문에서 중국이 한반도의 평화적 통일을 지지하기로 명시했기 때문입니다. 따라서 '두 개의 국가'라는 표현은 기존의 통일 지지 원칙에서 멀어질 뿐만 아니라 대한민국의 헌법적 입장과도 정면으로 배치됩니다. 위 실장은 중국 측에 불필요한 오해를 부를 수 있는 용어 사용을 자제할 것을 강력히 당부했습니다. 이번 사건은 북한과 밀착하는 중국이 한반도 문제에 대해 미묘하게 입장을 변화시키고 있는 것 아니냐는 우려를 낳고 있습니다. 양국 간의 불편한 기류는 당분간 한중 관계에 부담으로 작용할 것으로 보입니다.`,
  keyTerms:[{term:`두 개의 국가`,explanation:`남북한을 통일 지향적인 특수 관계가 아닌, 완전히 분리된 두 개의 별개 국가로 인정한다는 의미를 담고 있어 외교적으로 매우 민감한 표현입니다.`}],
  history:`북한이 최근 남북 관계를 '적대적 두 국가 관계'로 규정한 이후, 주변국들이 한반도 상황을 어떻게 규정하는지가 중요한 외교적 사안으로 떠올랐습니다.`,
  players:`북한과의 관계 강화를 도모하는 중국(왕이 외교부장)과, 헌법상 통일 원칙을 고수해야 하는 대한민국 정부(위성락 국가안보실장)가 맞붙고 있습니다.`,
  current:`비공개 회담의 내용이 공개되면서, 중국의 대북 편향적 태도에 대한 국내 여론의 반발이 커지고 양국 간 상호 불신이 표면화되었습니다.`,
  outlook:`향후 개최될 다자 회의나 고위급 교류에서 중국이 한반도 통일과 남북 관계에 대해 어떤 공식 입장을 표명할지가 한중 관계의 주요 변수가 될 것입니다.`,
  sources:[{title:`왕이 '두 국가' 발언에 안보실장 엄중 항의 - 매일경제`,url:`https://www.mk.co.kr`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`정부, 역대 최대 규모 109개 공공기관 감축 및 정부 부처 세종시 이전 발표`,
  metrics:[`공공기관 109개 감축 추진`,`전체 공공기관의 약 20% 규모`],
  summary:`정부가 공공부문의 방만 경영을 해소하고 효율성을 높이기 위해 전체의 약 20%에 달하는 109개 공공기관을 통폐합하거나 감축하는 역대 최대 규모의 구조조정 방안을 발표했습니다. 이 '공공기관 기능개혁' 방안에 따르면, 비대해진 한국토지주택공사(LH)는 2개의 별도 공기업으로 쪼개어 분리됩니다. 또한 기능이 중복되는 석유공사와 가스공사를 하나로 묶어 '에너지자원공사'로 거대 통합하는 방안도 핵심 과제로 추진됩니다. 이와 동시에 국가 균형 발전을 명분으로 내년 상반기까지 법무부와 성평등가족부 등 주요 정부 부처들을 세종시로 우선 이전하겠다는 계획도 공식화했습니다. 외교부와 통일부의 추가 이전도 검토 대상에 올랐습니다. 이러한 대대적인 공공부문 개편과 부처 이전은 관련 부처 공무원들과 공공기관 노동조합의 거센 반발을 불러일으킬 것으로 예상됩니다. 정부 조직의 지각 변동이 예고되면서 정치권 안팎으로 뜨거운 쟁점이 되고 있습니다.`,
  keyTerms:[{term:`공공기관 기능개혁`,explanation:`정부 산하 기관들의 유사하거나 중복되는 업무를 통폐합하고 비효율을 줄여 국가 예산 낭비를 막고 조직을 슬림화하는 정책을 뜻합니다.`}],
  history:`과거 정부부터 누적되어 온 공공기관의 막대한 부채와 조직 비대화 문제는 국가 재정에 큰 부담을 주어 지속적인 개혁 요구를 받아왔습니다.`,
  players:`강력한 구조조정 드라이브를 거는 기획재정부 등 정부 부처와, 생존권을 걸고 반대하는 공공기관 노조 및 세종시 이전에 반발하는 수도권 민심이 얽혀 있습니다.`,
  current:`정부가 구체적인 타깃과 숫자를 명시한 개혁안을 전격 발표하면서, 정책 추진의 실행력과 노동계의 투쟁 수위가 격돌하는 시점입니다.`,
  outlook:`관련 법안 개정 및 노사정 협의 과정에서 상당한 파열음이 예상되며, 내년 상반기 부처 이전이 완료될 때까지 갈등이 지속될 가능성이 높습니다.`,
  sources:[{title:`공공기관 109개 통폐합, 역대 최대 구조조정 - 중앙일보`,url:`https://www.joongang.co.kr`},{title:`법무부·성평등부 내년 세종시 이전 - 뉴데일리`,url:`https://www.newdaily.co.kr`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`오픈AI 차기 모델 'Astra', 자체 검증서 해킹 위험성에 '크리티컬' 등급 분류`,
  metrics:[`위험 등급 '크리티컬(최고 위험)' 지정`,`신규 기능 대중 공개 보류`],
  summary:`글로벌 AI 선두기업 오픈AI가 개발 중인 차세대 AI 모델 'Astra'가 보안성에 심각한 우려를 낳고 있습니다. 내부 자체 안전성 검증 결과, 이 모델이 시스템의 취약점을 스스로 찾아내고 해킹을 시도할 수 있는 능력을 갖춘 것으로 드러났습니다. 이에 따라 오픈AI는 Astra의 위험 등급을 가장 높은 '크리티컬' 수준으로 자체 분류하는 초유의 결정을 내렸습니다. 이처럼 통제 범위를 벗어날 수 있는 사이버 보안 위험성 때문에, 회사는 초기 출시 단계에서 모델의 전체 기능을 대중에게 공개하지 않기로 보류했습니다. 전문가들은 AI 모델의 추론 능력이 비약적으로 발전함에 따라, 악용될 경우 기존의 방어 체계를 무력화할 수 있는 자율적 해킹 위협이 현실화되었다고 지적합니다. 이번 조치는 인공지능의 급격한 발전 속도만큼이나, AI가 인류에게 미칠 수 있는 치명적 위험을 통제하기 위한 안전 가이드라인과 규제 마련이 시급함을 여실히 보여줍니다.`,
  keyTerms:[{term:`크리티컬`,explanation:`소프트웨어나 시스템의 결함 중 치명적이고 가장 높은 수준의 위험을 나타내는 등급으로, 즉각적인 조치가 없으면 막대한 피해를 입힐 수 있는 상태를 뜻합니다.`}],
  history:`생성형 AI 모델들이 고도화되면서 단순한 문장 생성을 넘어 코딩, 디버깅 등 복잡한 논리적 작업까지 수행하게 되었고, 이로 인한 보안 부작용이 예견되어 왔습니다.`,
  players:`혁신을 이끄는 오픈AI의 개발팀과, AI 모델의 오남용을 막기 위해 자체적으로 제동을 거는 내부 안전 검증팀 간의 팽팽한 긴장이 엿보입니다.`,
  current:`AI 기업이 자사의 최신 모델에 대해 스스로 최고 위험 등급을 매기고 출시 기능을 제한한 것은 AI 안전성에 대한 업계의 위기감이 임계점에 달했음을 보여줍니다.`,
  outlook:`오픈AI가 어떻게 보안 취약점을 패치하고 안전장치를 마련할지, 그리고 각국 정부가 자율형 AI 모델에 대해 어떤 새로운 규제를 도입할지가 핵심 관건입니다.`,
  sources:[{title:`오픈AI 차기 모델, 해킹 위험에 크리티컬 판정 - IT전문 매체 요약`,url:`https://www.youtube.com`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`네이버클라우드와 LG CNS, 정부 주도 초대형 '국가 보안 AI' 공동 개발 착수`,
  metrics:[`매개변수 7,000억 개(700B) 규모`,`특화 보안 모델 2종 실증`],
  summary:`한국을 대표하는 IT 기업인 네이버클라우드와 LG CNS가 정부의 사이버 보안 특화 AI 파운데이션 모델 개발 사업의 최종 사업자로 나란히 선정되어 공동 개발에 착수했습니다. 이번 프로젝트는 갈수록 지능화되는 국가적 사이버 해킹 위협에 선제적으로 대응하기 위한 목적을 가집니다. 두 회사는 각자의 AI 기술력인 네이버의 하이퍼클로바X와 LG의 엑사원을 기반으로 하여 매개변수만 7,000억 개(700B)에 달하는 세계적 수준의 거대 언어 모델을 구축하게 됩니다. 이를 통해 공격 패턴을 분석하고 방어막을 구축하는 고성능 특화 보안 AI 모델 2종을 개발하여 국가 기관을 대상으로 본격적인 실증 작업에 돌입합니다. 이 대규모 국가 과제는 해외 빅테크에 의존하지 않고 자체적인 AI 기술로 국가 핵심 인프라의 사이버 안보 주권을 확립하겠다는 강력한 의지를 담고 있습니다. 민관이 협력하는 이번 사업이 성공하면 한국의 K-보안 AI 기술이 글로벌 시장을 선도하는 발판이 될 것으로 기대됩니다.`,
  keyTerms:[{term:`파운데이션 모델`,explanation:`방대한 양의 데이터를 미리 학습하여 다양한 목적의 응용 서비스나 후속 인공지능 모델을 만드는 데 기반 역할을 하는 거대 인공지능 모델입니다.`}],
  history:`국가 주요 전산망과 기업을 노리는 해킹 수법이 AI를 활용하여 고도화되면서, 기존의 보안 시스템만으로는 이를 방어하는 데 한계가 발생했습니다.`,
  players:`사이버 안보 주권을 지키려는 정부와, 이를 기술적으로 구현해 낼 독자적 초거대 AI 인프라를 보유한 네이버, LG 등 국내 빅테크 기업들이 참여하고 있습니다.`,
  current:`정부 지원을 등에 업고 국내 최고 수준의 AI 모델들이 융합하여 보안 분야에 특화된 실질적인 결과물을 내놓기 위한 첫발을 뗀 중요한 시점입니다.`,
  outlook:`실증 기간 동안 실제 사이버 공격 데이터를 얼마나 효과적으로 학습하고 탐지해 내는지가 성공을 가를 것이며, 향후 민간 금융 및 통신 분야로의 도입도 예상됩니다.`,
  sources:[{title:`네이버·LG, 7000억 매개변수 국가 보안 AI 띄운다 - 포이코노미`,url:`https://www.foeconomy.co.kr`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`영미 공동 연구진, 암세포가 인체 면역 T세포를 무력화하는 핵심 기전 발견`,
  metrics:[`사이언스 저널 공식 게재`,`항산화 효소(PRDX1) 분비 억제로 새 돌파구`],
  summary:`영국 케임브리지대와 미국 오리건 보건과학대 공동 연구팀이 암 정복의 난제로 꼽히던 중요한 과학적 성과를 이뤄냈습니다. 연구진은 암세포가 체내에서 스스로 특정 항산화 효소인 PRDX1을 과다하게 방출하여 우리 몸의 방어군인 면역 T세포의 공격 능력을 완전히 무력화시키는 경로를 세계 최초로 발견해 사이언스 저널에 발표했습니다. 그동안 혁신적 치료법으로 각광받던 면역항암제조차 일부 환자에게는 효과가 없거나 내성이 생기는 한계가 있었는데, 그 원인이 바로 암세포의 이러한 은밀한 회피 기전에 있었음이 입증된 것입니다. 이 발견은 암세포가 내뿜는 방어 물질의 통로를 화학적으로 차단하기만 하면, 기존 면역 T세포의 활력을 되살려 암세포를 효과적으로 사멸시킬 수 있음을 시사합니다. 의학계는 이번 연구 결과가 난치성 암 환자들을 구하고 항암 치료 성공률을 획기적으로 끌어올릴 새로운 표적 항암제 개발의 든든한 초석이 될 것으로 환호하고 있습니다.`,
  keyTerms:[{term:`면역항암제`,explanation:`암세포를 직접 파괴하는 기존 항암제와 달리, 환자 체내의 면역 세포를 깨워 스스로 암세포를 공격하도록 돕는 3세대 암 치료제입니다.`}],
  history:`기존 항암 치료의 부작용을 줄인 면역 치료가 암 치료의 대세로 자리 잡았으나, 적지 않은 환자들에게서 뚜렷한 이유 없이 치료 효과가 떨어지는 내성 문제가 최대 숙제였습니다.`,
  players:`암세포의 생존 메커니즘을 밝혀내려는 글로벌 생명과학 연구진들과, 이를 바탕으로 신약을 개발하려는 거대 다국적 제약사들이 주목하고 있습니다.`,
  current:`암세포가 항산화 물질을 교묘하게 활용해 면역 세포를 바보로 만든다는 결정적 증거가 확인되면서, 암세포의 생존 무기를 직접 타격하는 새 전략이 가능해졌습니다.`,
  outlook:`향후 이 효소의 작용을 억제하는 후보 물질 탐색과 동물 실험 및 임상 시험이 가속화되어 수년 내 새로운 형태의 병용 치료제가 등장할 전망입니다.`,
  sources:[{title:`암세포의 면역세포 무력화 기전 밝혔다 - 연합뉴스`,url:`https://www.yna.co.kr`}]
}]

  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`더불어민주당, 종부세 기본공제 14억 상향 등 보유세 완화 추진`,
  metrics:[`기본공제 14억 원`,`과세비율 60%로 인하`],
  summary:`더불어민주당이 종합부동산세 기본공제를 14억 원으로 상향하고 과세비율을 60%로 인하하는 등 세제 완화를 추진하고 있습니다. 최근 집값 상승과 세 부담 증가로 인한 불만을 달래기 위한 조치로 풀이됩니다. 이에 따라 반포자이 등 주요 단지의 보유세가 약 677만 원 감소할 것으로 예상됩니다. 강남권 부동산 시장은 이번 조치의 최종 결과를 지켜보자는 관망세로 돌아섰습니다. 이번 세제 개편안이 국회를 통과할 경우 하반기 부동산 시장의 향방을 가를 핵심 변수가 될 전망입니다. 정부와 야당의 세제 완화 합의 여부에 관심이 집중되고 있습니다.`,
  keyTerms:[{term:`종합부동산세`,explanation:`일정 기준을 초과하는 토지와 주택 소유자에게 누진세율을 적용하여 부과하는 세금입니다. 부동산 투기 억제와 가격 안정을 목적으로 도입되었습니다.`}],
  history:`과거 집값 급등기에 도입된 종부세는 징벌적 세금이라는 비판을 지속적으로 받아왔습니다.`,
  players:`세 부담 완화를 주장하는 야당과 재정 건전성을 우려하는 기획재정부가 팽팽히 맞서고 있습니다.`,
  current:`추석 민심과 다가올 선거를 의식해 정치권에서 선제적인 세 부담 완화 카드를 꺼내든 상황입니다.`,
  outlook:`국회 본회의에서 세제 개편안이 어떤 형태로 최종 통과될지, 그리고 이것이 실제 집값에 어떤 영향을 미칠지 주목됩니다.`,
  sources:[{title:`부동산 세제 개편 및 보유세 완화 추진 - 한국경제`,url:`https://www.hankyung.com/`}]

  headline:`글로벌 채권 시장 폭락…미국 10년물 금리 4.82% 육박`,
  metrics:[`미 국채 10년물 금리 4.82%`,`일본 10년물 금리 3% 돌파`],
  summary:`전 세계적으로 국채 매도세가 거세지면서 미국과 일본의 국채 금리가 수년 만에 최고치로 치솟았습니다. 미국의 10년 만기 국채 금리는 총부채 40조 달러 돌파 우려로 인해 4.82% 부근까지 급등했습니다. 일본의 10년물 국채 금리 역시 1996년 이후 처음으로 3%를 돌파하며 시장에 충격을 주었습니다. 스콧 베센트 미 재무장관은 일본에 추가 금리 인상을 압박하며 글로벌 금리 연쇄 상승을 부추기고 있습니다. 이러한 글로벌 국채 금리 발작은 주식 시장을 포함한 위험 자산 전반에 큰 하방 압력을 가하고 있습니다. 투자자들은 각국 중앙은행의 다음 스텝에 촉각을 곤두세우고 있습니다.`,
  keyTerms:[{term:`국채 금리`,explanation:`국가가 돈을 빌리기 위해 발행하는 채권의 수익률을 의미합니다. 통상 국채 금리가 오르면 시중 금리도 상승해 기업과 가계의 대출 이자 부담이 커집니다.`}],
  history:`팬데믹 이후 풀린 막대한 유동성을 회수하는 과정에서 글로벌 중앙은행들의 고금리 정책이 장기화되고 있습니다.`,
  players:`미국 연방준비제도(Fed)와 일본은행(BOJ), 그리고 글로벌 기관 투자자들이 금리 향방의 핵심 주체입니다.`,
  current:`미국의 막대한 재정 적자 우려와 일본의 긴축 전환이 맞물리며 전례 없는 채권 투매 현상이 벌어지고 있습니다.`,
  outlook:`케빈 워시 신임 연준 의장의 발언과 다가오는 FOMC 회의 결과에 따라 금리 변동성이 더욱 확대될 수 있습니다.`,
  sources:[{title:`미국·일본 국채 금리 폭등 - 로이터`,url:`https://www.reuters.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`G20 재무장관 회의서 미국, 중국의 '저가 수출 밀어내기' 공동 대응 견인`,
  metrics:[`미국 등 19개국 동의`,`중국 1개국 서명 거부`],
  summary:`미국 노스캐롤라이나주 애슈빌에서 열린 G20 재무장관 회의에서 중국의 비시장적 경제 관행이 도마 위에 올랐습니다. 미국 주도하에 중국을 제외한 19개국이 중국의 저가 수출 밀어내기에 공동 대응하기로 합의했습니다. 중국은 이러한 합의가 보호무역주의라며 강력하게 반발하고 서명을 거부했습니다. 글로벌 공급망이 재편되는 가운데 미국의 대중국 경제 포위망이 한층 노골화되는 양상입니다. 이로 인해 향후 미·중 무역 갈등이 새로운 국면에 접어들며 글로벌 교역 위축으로 이어질 수 있다는 우려가 커지고 있습니다. 특히 전기차 및 태양광 등 첨단 산업 분야에서의 수출 경쟁이 더욱 치열해질 전망입니다.`,
  keyTerms:[{term:`저가 수출 밀어내기`,explanation:`내수 침체로 남는 생산 물량을 정부 보조금을 업고 해외 시장에 원가 이하로 헐값에 수출해 타국 산업에 피해를 주는 행위입니다.`}],
  history:`미국과 유럽은 중국이 막대한 국가 보조금을 통해 전기차, 배터리 등을 과잉 생산하여 세계 시장을 교란한다고 오랫동안 비판해왔습니다.`,
  players:`강력한 보호무역을 주장하는 미국 트럼프 행정부와, 이를 수출로 돌파하려는 중국 정부가 대립하고 있습니다.`,
  current:`G20라는 다자간 회의체에서 19개국이 미국에 동조함으로써 중국의 외교적, 경제적 고립이 더욱 뚜렷해졌습니다.`,
  outlook:`향후 미국과 동맹국들이 중국산 제품에 대한 대규모 징벌적 관세를 동시다발적으로 부과할 가능성이 매우 높습니다.`,
  sources:[{title:`G20, 중국 저가 수출 밀어내기 공동 대응 합의 - 블룸버그`,url:`https://www.bloomberg.com/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`김승원 법무장관 후보자 '제약사 청탁 의혹' 놓고 여야 정면충돌`,
  metrics:[`여당의 돌격대장 공세 1순위`,`임상시험 허가 청탁 의혹 1건`],
  summary:`김승원 법무부 장관 후보자의 인사청문회를 앞두고 여야 간의 정치적 대립이 극에 달하고 있습니다. 야당은 김 후보자가 과거 식약처장에게 특정 제약사의 임상시험 허가를 부탁했다는 청탁 의혹을 강하게 제기하고 나섰습니다. 여당인 더불어민주당은 이를 명백한 발목잡기식 정치 공세라며 후보자를 적극 엄호하고 있습니다. 반면 야당은 그가 정권의 공소취소 돌격대장으로 지명되었다며 자진 사퇴를 촉구하고 있습니다. 이번 청문회 정국은 향후 정국의 주도권을 잡기 위한 양 진영의 치열한 기싸움 대리전 성격을 띠고 있습니다. 청탁 의혹의 명확한 증거가 드러날지가 임명의 최대 관건입니다.`,
  keyTerms:[{term:`인사청문회`,explanation:`고위 공직자에 지명된 사람의 자질과 도덕성, 업무 능력을 국회에서 검증하는 절차입니다. 장관 임명 전 반드시 거쳐야 합니다.`}],
  history:`법무부 장관직은 검찰 인사와 수사 지휘권을 쥐고 있어 정권 초기부터 여야의 가장 치열한 전장이 되어왔습니다.`,
  players:`정권 방어를 위해 후보자를 사수하려는 더불어민주당과, 낙마를 통해 정권에 타격을 입히려는 야당입니다.`,
  current:`임상시험 청탁이라는 구체적인 의혹이 터져 나오면서 도덕성 논란이 불거져 청문회 통과가 불투명해진 상황입니다.`,
  outlook:`청문회 과정에서 추가적인 폭로가 나올 경우 후보자 지명 철회 가능성도 배제할 수 없으며, 이는 대통령의 지지율에도 영향을 미칠 것입니다.`,
  sources:[{title:`김승원 법무장관 후보자 '청탁 의혹' 공방 - 연합뉴스`,url:`https://www.yna.co.kr/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`이재명 대통령, '북미대화 여건 주도적 조성 및 전작권 환수' 의지 피력`,
  metrics:[`한반도 정세 변화 가능성 언급`,`임기 내 전작권 환수 목표`],
  summary:`이재명 대통령이 민주평통 행사에서 북미대화 재개와 자주국방에 대한 강력한 의지를 드러냈습니다. 이 대통령은 트럼프 미국 대통령의 정책 결정으로 한반도 정세에 새로운 변화 가능성이 열렸다고 평가했습니다. 이에 따라 한국이 수동적인 입장에서 벗어나 주도적으로 북미대화의 여건을 만들어야 한다고 강조했습니다. 이와 함께 자주국방의 핵심 과제인 전시작전권을 임기 내에 반드시 환수하겠다는 기존 공약을 재차 확인했습니다. 이는 미국과의 동맹을 유지하면서도 국방의 자율성을 높이겠다는 투트랙 전략으로 풀이됩니다. 향후 한미 안보 협의 과정에서 이 문제가 핵심 의제로 다뤄질 전망입니다.`,
  keyTerms:[{term:`전시작전권`,explanation:`한반도에 전쟁이 일어났을 때 군대의 작전을 통제하고 지휘할 수 있는 권한입니다. 현재는 한미연합사령관이 가지고 있습니다.`}],
  history:`대한민국 국군의 전시작전권은 한국전쟁 이후 줄곧 미군 주도의 유엔군 및 한미연합사가 행사해왔으며, 역대 진보 정권의 핵심 환수 과제였습니다.`,
  players:`자주국방을 강조하는 이재명 정부와 동맹국의 안보 기여도를 재평가하고 있는 트럼프 미 행정부가 주요 행위자입니다.`,
  current:`트럼프 행정부의 정책 기조가 한미 군사 동맹의 성격 변화를 압박하면서 전작권 환수 논의가 급물살을 타고 있습니다.`,
  outlook:`실제 전작권 환수를 위한 한미 간의 군사적 조건 평가와 방위비 분담금 협상이 더욱 치열하게 전개될 것입니다.`,
  sources:[{title:`이재명 대통령 "북미대화 여건 조성 및 전작권 환수" - 연합뉴스`,url:`https://www.yna.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 하원, 연방 정부 셧다운 막기 위해 단기 임시 예산안 통과`,
  metrics:[`12월 초까지 정부 운영`,`11월 중간선거 앞두고 타결`],
  summary:`미국 하원이 11월 중간선거를 코앞에 두고 연방 정부의 셧다운을 막기 위한 단기 임시 예산안을 극적으로 통과시켰습니다. 이번 예산안 통과로 미국 연방 정부는 12월 초까지 정상적으로 자금을 지원받아 운영을 이어갈 수 있게 되었습니다. 선거를 앞두고 셧다운이라는 최악의 정치적 무리수를 피하려는 공화당과 민주당의 이해관계가 맞아떨어진 결과입니다. 하지만 근본적인 예산 삭감 규모와 국경 통제 예산을 둘러싼 양당의 이견은 전혀 좁혀지지 않았습니다. 이로 인해 12월이 되면 또다시 셧다운 위기가 재현될 것이라는 불안감이 여전합니다. 중간선거 결과에 따라 연말 예산안 정국의 주도권이 완전히 뒤바뀔 가능성이 큽니다.`,
  keyTerms:[{term:`셧다운`,explanation:`예산안이 기한 내에 국회를 통과하지 못해 국가의 필수적인 기능 외에 연방 정부의 일반적인 업무와 서비스가 일시적으로 중단되는 사태입니다.`}],
  history:`미국 정치권은 매년 회계연도 말만 되면 예산안을 볼모로 잡고 당파적 요구를 관철하려는 벼랑 끝 전술을 반복해왔습니다.`,
  players:`재정 지출 삭감을 요구하는 강경 보수 진영과 정부 기능 유지를 강조하는 민주당 및 중도파 의원들이 맞서고 있습니다.`,
  current:`모든 정치인들의 시선이 11월 중간선거에 쏠려 있어, 표심을 잃을 수 있는 셧다운 사태만은 일단 피하자는 공감대가 형성되었습니다.`,
  outlook:`선거가 끝난 후인 12월 레임덕 세션에서 양당은 내년도 본예산을 두고 한 치의 양보도 없는 진검승부를 벌일 것입니다.`,
  sources:[{title:`미국 임시 예산안 통과 (연방 셧다운 방지) - AP 통신`,url:`https://apnews.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`SBS, 127억 규모 '대화형 멀티모달 AI 미디어 프로덕션' 국책 과제 주관`,
  metrics:[`프로젝트 규모 127억 원`,`자동 영상 검색 및 생성`],
  summary:`한국의 주요 방송사인 SBS가 127억 원 규모의 대규모 국책 AI 프로젝트 총괄 주관기관으로 최종 선정되었습니다. 이 과제는 대화형 멀티모달 AI 기반 미디어 프로덕션 기술개발을 목표로 하고 있습니다. 핵심은 영상 제작자가 말이나 글로 지시하면 AI가 방대한 아카이브에서 알맞은 영상을 자동으로 검색하고, 생성 및 편집까지 해주는 혁신적인 기술을 구축하는 것입니다. 이 기술이 상용화되면 방송 및 미디어 콘텐츠 제작에 드는 시간과 비용이 획기적으로 단축될 것으로 기대됩니다. 정부의 인공지능 지원 사업과 맞물려 국내 미디어 산업의 경쟁력이 크게 도약할 계기가 마련되었습니다. 국내 방송 제작 환경이 본격적인 AI 자동화 시대로 진입하고 있습니다.`,
  keyTerms:[{term:`멀티모달 AI`,explanation:`텍스트, 이미지, 음성, 영상 등 다양한 형태의 데이터를 동시에 이해하고 처리하며 새로운 결과를 생성해낼 수 있는 진화된 인공지능 기술입니다.`}],
  history:`기존 방송 제작 환경은 사람이 직접 수많은 디지털 파일을 일일이 확인하고 편집해야 하는 노동 집약적인 구조였습니다.`,
  players:`정부의 예산 지원을 바탕으로 SBS와 다수의 AI 기술 스타트업, 연구 기관들이 컨소시엄을 구성해 참여합니다.`,
  current:`글로벌 빅테크 기업들이 영상 생성 AI를 쏟아내는 가운데, 국내 방송사도 자체 아카이브를 활용한 생존 전략을 본격화한 것입니다.`,
  outlook:`개발된 AI 기술이 실제 방송 뉴스 및 예능 편집 실무에 언제 도입될지, 그리고 인간 편집자의 역할을 어떻게 보완해 나갈지가 관심사입니다.`,
  sources:[{title:`SBS, 국책 AI 미디어 프로젝트 주관 - SBS 뉴스`,url:`https://news.sbs.co.kr/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`UNEP 강력 경고 "파리협정 1.5도 마지노선 돌파 확실시…탄소 제거 필수"`,
  metrics:[`지구 기온 1.5도 상승 돌파`,`영국 여름 평균 16.5도 (역대 최고)`],
  summary:`유엔환경계획이 최신 보고서를 통해 지구 평균 기온이 파리 기후협정의 방어선인 1.5도를 수년 내로 넘어서는 것이 확실시된다고 엄중 경고했습니다. 유엔환경계획은 이제 1.5도 상승을 막는다는 기존의 목표는 사실상 실패했으며, 기온이 초과 상승하는 기간을 어떻게 최소화할 것인지로 전략을 바꿔야 한다고 지적했습니다. 이를 위해서는 단순히 배출량을 줄이는 것을 넘어, 대기 중의 이산화탄소를 직접 빨아들이는 대규모 탄소 제거 기술 도입이 필수적입니다. 실제로 올해 영국은 기상 관측 사상 가장 뜨거운 여름을 보냈고, 네팔에서는 돌발 홍수가 발생하는 등 기후 재난이 일상화되고 있습니다. 전 세계가 기후 위기 적응과 적극적인 지구 공학 도입이라는 새로운 숙제를 안게 되었습니다. 각국 정부의 즉각적인 예산 투입과 정책 전환이 절실한 시점입니다.`,

let current = null;

const CAT_ORDER = ['경제', '정치', '기타 이슈'];

function renderSidebar() {
  const list = document.getElementById('date-list');
  list.innerHTML = '';
  BRIEFS.forEach((b, i) => {
    const el = document.createElement('div');
    el.className = 'date-item' + (i === 0 ? ' active' : '');
    el.dataset.tag = b.tag;
    const parts = b.tag.split('-');
    const short = parts[1] + '/' + parts[2];
    el.innerHTML = b.tag;
    el.addEventListener('click', () => showBrief(b.tag));
    list.appendChild(el);
  });
}

function showBrief(tag) {
  current = tag;
  document.querySelectorAll('.date-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tag === tag);
  });
  const brief = BRIEFS.find(b => b.tag === tag);
  if (!brief) return;

  // 카테고리별 그룹핑
  const grouped = {};
  brief.stories.forEach(s => {
    if (!grouped[s.category]) grouped[s.category] = [];
    grouped[s.category].push(s);
  });
  const availableCats = CAT_ORDER.filter(c => grouped[c] && grouped[c].length);
  if (!availableCats.length) return;

  // 기본 카테고리 결정
  if (!availableCats.includes(currentCat)) currentCat = availableCats[0];

  renderContent(brief, grouped, availableCats);
}

function renderContent(brief, grouped, availableCats) {
  const content = document.getElementById('content');
  let html = `<div class="sticky-top">
    <div class="brief-header">
      <div class="bh-eyebrow">Morning Brief</div>
      <h2>${brief.label}</h2>
    </div>`;

  // 탭
  html += '<div class="cat-tabs">';
  availableCats.forEach(c => {
    const cls = c === currentCat ? 'cat-tab active' : 'cat-tab';
    html += `<button class="${cls}" data-cat="${c}">${c}</button>`;
  });
  html += '</div></div>';

  // 선택된 카테고리 기사들
  const stories = grouped[currentCat] || [];
  stories.forEach((s, idx) => {
    if (idx > 0) html += '<hr class="story-divider">';
    html += `<div class="story">
      <div class="story-top">
        <div class="story-headline">${s.headline}</div>
      </div>`;
    if (s.metrics.length) {
      html += '<div class="metrics">';
      s.metrics.forEach(m => { html += `<div class="metric-chip">${m}</div>`; });
      html += '</div>';
    }
    // 요약문에 핵심 개념 밑줄 (출력은 박스 다음)
    let summaryHtml = s.summary;
    if (s.keyTerms && s.keyTerms.length) {
      s.keyTerms.forEach(kt => {
        if (!kt.term) return;
        const safe = kt.term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp(safe, 'g');
        summaryHtml = summaryHtml.replace(re, `<span class="kt-underline">${kt.term}</span>`);
      });
    }

    // 핵심 개념 박스 (요약 위)
    if (s.keyTerms && s.keyTerms.length) {
      html += '<div class="key-terms"><div class="key-terms-title">핵심 개념</div>';
      s.keyTerms.forEach(kt => {
        html += `<div class="kt-item">
          <span class="kt-term">${kt.term}</span>
          <span class="kt-exp">${kt.explanation}</span>
        </div>`;
      });
      html += '</div>';
    }

    html += `<div class="summary">${summaryHtml}</div>`;

    const bgSections = [
      ['역사적 맥락', s.history],
      ['핵심 플레이어', s.players],
      ['현재 구도', s.current],
      ['향후 전망', s.outlook],
    ].filter(([, v]) => v);

    if (bgSections.length) {
      html += '<div class="bg-box"><div class="bg-box-title">배경 스토리</div>';
      bgSections.forEach(([label, text]) => {
        html += `<div class="bg-section">
          <div class="bg-section-label">${label}</div>
          <div class="bg-section-text">${text}</div>
        </div>`;
      });
      html += '</div>';
    }

    if (s.sources.length) {
      html += `<button class="sources-toggle" data-toggle="srcs-${idx}">출처 ${s.sources.length}개 보기 <span class="arrow">▾</span></button>`;
      html += `<div class="sources-body" id="srcs-${idx}">`;
      s.sources.forEach((src, si) => {
        html += `<div class="source-item">
          <span class="src-num">${si+1}</span>
          <a href="${src.url}" target="_blank">${src.title}</a>
        </div>`;
      });
      html += '</div>';
    }
    html += '</div>';
  });

  content.innerHTML = html;

  // 탭 클릭 핸들러
  content.querySelectorAll('.cat-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentCat = btn.dataset.cat;
      renderContent(brief, grouped, availableCats);
    });
  });

  // 출처 토글
  content.querySelectorAll('.sources-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const body = document.getElementById(btn.dataset.toggle);
      const isOpen = body.classList.toggle('open');
      btn.classList.toggle('open', isOpen);
    });
  });

  document.getElementById('main').scrollTop = 0;
}

if (BRIEFS.length > 0) {
  renderSidebar();
  showBrief(BRIEFS[0].tag);
} else {
  document.getElementById('content').innerHTML = '<div class="empty">브리핑 데이터가 없습니다.</div>';
}

// ── Quiz Gate ──
const PASS_TARGET = 3;
let correctCount = 0;
const usedIndexes = new Set();

function pickQuestion() {
  // 사용 안 한 문제 중 랜덤. 다 썼으면 풀 리셋
  if (usedIndexes.size >= QUIZ.length) usedIndexes.clear();
  let idx;
  do { idx = Math.floor(Math.random() * QUIZ.length); } while (usedIndexes.has(idx));
  usedIndexes.add(idx);
  return QUIZ[idx];
}

function updateCounter() {
  document.getElementById('quiz-counter').textContent = `(${correctCount}/${PASS_TARGET})`;
}

function renderQuiz() {
  const q = pickQuestion();
  document.getElementById('quiz-q').textContent = q.q;
  updateCounter();
  const feedback = document.getElementById('quiz-feedback');
  feedback.textContent = '';
  feedback.className = 'quiz-feedback';
  const closeBtn = document.getElementById('quiz-close');
  closeBtn.classList.add('hidden');

  const choicesEl = document.getElementById('quiz-choices');
  choicesEl.innerHTML = '';
  // 보기 순서 섞기 (정답 위치 고정 방지)
  const order = q.a.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  order.forEach(idx => {
    const text = q.a[idx];
    const btn = document.createElement('button');
    btn.className = 'quiz-choice';
    btn.textContent = text;
    btn.addEventListener('click', () => {
      const allBtns = choicesEl.querySelectorAll('.quiz-choice');
      allBtns.forEach(b => b.disabled = true);
      if (idx === q.correct) {
        btn.classList.add('correct');
        correctCount++;
        updateCounter();
        if (correctCount >= PASS_TARGET) {
          feedback.textContent = '통과! 들어와도 좋아.';
          feedback.className = 'quiz-feedback right';
          closeBtn.classList.remove('hidden');
        } else {
          feedback.textContent = '역시 맞출 줄 알았어. 다음 문제 고.';
          feedback.className = 'quiz-feedback right';
          btn.blur();
          setTimeout(() => {
            if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
            renderQuiz();
          }, 900);
        }
      } else {
        btn.classList.add('wrong');
        feedback.textContent = '정말 실망이다.... 다음.';
        feedback.className = 'quiz-feedback wrong';
        btn.blur();
        setTimeout(() => {
          if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
          renderQuiz();
        }, 900);
      }
    });
    choicesEl.appendChild(btn);
  });
}

document.getElementById('quiz-close').addEventListener('click', () => {
  document.getElementById('quiz-overlay').classList.add('hidden');
  document.body.classList.remove('quiz-active');
});

document.body.classList.add('quiz-active');
renderQuiz();

// ── Mobile sidebar toggle ──
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('sidebar-backdrop');
function toggleSidebar(open) {
  sidebar.classList.toggle('open', open);
  backdrop.classList.toggle('open', open);
}
document.getElementById('sidebar-toggle').addEventListener('click', () => toggleSidebar(!sidebar.classList.contains('open')));
backdrop.addEventListener('click', () => toggleSidebar(false));
// 날짜 클릭하면 모바일에서 자동으로 닫히게
sidebar.addEventListener('click', e => {
  if (e.target.classList.contains('date-item') && window.innerWidth <= 768) {
    toggleSidebar(false);
  }
});
</script>

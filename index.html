  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국은행이 내수 침체 장기화에 대응하여 기준금리를 0.25%포인트 전격 인하했습니다.`,
  metrics:[`기준금리 3.00%로 인하`,`3분기 민간소비 0.5% 감소`],
  summary:`한국은행 금융통화위원회가 통화정책방향 회의를 열고 기준금리를 기존 3.25%에서 3.00%로 0.25%포인트 인하했습니다. 이번 기준금리 인하 결정은 최근 뚜렷해진 내수 침체와 물가 안정세를 반영한 조치로 풀이됩니다. 지난 3분기 민간소비가 전년 동기 대비 0.5% 감소하는 등 경기 하방 압력이 커지면서 선제적 대응이 필요하다는 목소리가 높았습니다. 전문가들은 물가상승률이 목표치인 2%대에 안착함에 따라 통화정책의 여력이 생겼다고 분석합니다. 다만 가계부채 증가세가 다시 가팔라질 수 있다는 우려도 제기되고 있습니다. 향후 부동산 시장의 자금 흐름과 환율 변동성이 주요 변수로 작용할 전망입니다. 따라서 정부의 거시건전성 관리와 병행된 정책 조율이 더욱 중요해진 시점입니다.`,
  keyTerms:[{term:`기준금리 인하`,explanation:`중앙은행이 시중 은행에 빌려주는 자금의 기준이 되는 금리를 낮추는 것으로, 시장에 유동성을 공급하여 경기를 부양하려는 주요 통화정책입니다.`}],
  history:`과거 고물가 기조에 대응하기 위해 한국은행은 상당 기간 긴축 통화정책을 유지해왔습니다. 그러나 최근 몇 달간 소비자물가 상승률이 2% 초반대로 안정화되는 추세를 보였습니다. 반면, 높은 이자 부담으로 인해 자영업자와 가계의 소비 여력은 크게 위축되었습니다.`,
  players:`한국은행 금융통화위원회는 금리 결정의 주도권을 쥐고 물가와 성장의 균형을 고민하고 있습니다. 정부와 기획재정부는 내수 진작을 위해 지속적으로 통화 완화의 필요성을 시사해왔습니다. 시중 은행들과 주택 매수자들은 대출 금리 변화에 촉각을 곤두세우고 있습니다.`,
  current:`이번 전격적인 0.25%포인트 인하는 물가 억제에서 경기 부양으로 정책의 무게 중심이 이동했음을 보여줍니다. 내수 침체가 경제 성장률 전망치마저 갉아먹는 상황에서 내려진 불가피한 결정으로 평가됩니다.`,
  outlook:`시장은 내년 초까지 한두 차례의 추가 인하가 이어질지 주목하고 있습니다. 하지만 수도권 부동산 가격 자극이나 가계부채 급증 우려가 현실화될 경우 인하 속도는 조절될 수 있습니다.`,
  sources:[{title:`한은, 내수 침체에 기준금리 0.25%p 전격 인하 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`기준금리 3.0% 시대... 영끌족 한숨 돌리나 - 매일경제`,url:`https://www.mk.co.kr/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 연방준비제도(Fed)가 물가 안정 기조를 바탕으로 추가 금리 인하 가능성을 시사했습니다.`,
  metrics:[`미국 9월 CPI 2.1% 상승`,`S&P 500 지수 사상 최고치 경신`],
  summary:`미국 연방준비제도의 주요 인사들이 연내 추가 금리 인하 가능성을 강하게 시사하며 글로벌 금융시장이 들썩이고 있습니다. 특히 연준이 물가 지표로 가장 선호하는 근원 개인소비지출(PCE) 가격지수 상승률이 2.1%로 둔화하며 목표치에 근접했습니다. 이는 인플레이션 압력이 상당 부분 해소되었음을 의미하며, 고금리로 인한 경기 침체 우려를 덜어주는 신호로 해석됩니다. 파월 의장은 고용 시장의 둔화 조짐에 선제적으로 대응하겠다는 의지를 재확인했습니다. 이에 따라 뉴욕 증시의 S&P 500 지수는 사상 최고치를 경신하며 위험자산 선호 심리가 확산되었습니다. 시장은 오는 11월 FOMC 회의에서 추가로 0.25%포인트 인하가 단행될 것으로 확신하고 있습니다. 다만 지정학적 리스크로 인한 유가 변동성은 여전히 인플레이션을 자극할 잠재적 위험 요인으로 남아있습니다.`,
  keyTerms:[{term:`근원 개인소비지출(PCE) 가격지수`,explanation:`물가 변동이 심한 에너지와 식료품을 제외하고, 미국 소비자들이 실제 지출한 비용의 물가 변동을 보여주는 핵심 경제 지표입니다.`}],
  history:`미국 연준은 팬데믹 이후 치솟는 인플레이션을 잡기 위해 역사상 가장 공격적인 금리 인상 사이클을 단행했습니다. 고강도 긴축 덕분에 물가 상승세는 둔화되었지만, 시장에서는 노동 시장 냉각에 대한 우려가 꾸준히 제기되었습니다. 이에 연준은 지난 9월 빅컷을 단행하며 정책 전환을 시작했습니다.`,
  players:`제롬 파월 연준 의장을 비롯한 주요 연은 총재들은 향후 금리 경로에 결정적 영향을 미치는 인물들입니다. 월가의 투자자들과 글로벌 펀드 매니저들은 이들의 발언 하나하나에 따라 자산을 재배분하고 있습니다. 미국 소비자들은 모기지 금리와 대출 이자 완화를 기대하고 있습니다.`,
  current:`가장 최근 발표된 물가 지표가 예상치를 밑돌며 안정적인 모습을 보임에 따라 추가 완화에 대한 명분이 확실해졌습니다. 이는 글로벌 자금의 미국 증시 쏠림 현상을 더욱 강화하고 있습니다.`,
  outlook:`다가오는 11월과 12월 FOMC 회의에서 연속적인 금리 인하가 이루어질지 여부가 초미의 관심사입니다. 향후 발표될 미국의 실업률 및 고용 지표가 결정적인 지침이 될 전망입니다.`,
  sources:[{title:`Fed 파월, 연내 추가 인하 시사 - 한국경제`,url:`https://www.hankyung.com/`},{title:`US Core PCE Drops to 2.1%, Fueling Rate Cut Bets - Bloomberg`,url:`https://www.bloomberg.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`유럽연합(EU)이 중국산 전기차에 대한 최고 35%의 고율 상계관세 부과를 최종 확정했습니다.`,
  metrics:[`중국산 전기차 관세 최고 35%`,`유럽 내 중국 전기차 점유율 11%`],
  summary:`유럽연합(EU) 회원국들이 중국산 전기차에 대해 기존 관세에 더해 최고 35%의 추가 상계관세 부과안을 최종 가결했습니다. 이번 결정은 중국 정부의 불법적인 보조금이 시장 가격을 왜곡하고 유럽 자동차 산업의 생존을 위협하고 있다는 EU 집행위원회의 조사 결과에 따른 것입니다. 프랑스와 이탈리아 등 주요국은 찬성표를 던졌으나, 중국과의 무역 마찰을 우려한 독일과 스페인은 반대 또는 기권하며 회원국 간 이견도 노출되었습니다. 중국은 즉각 반발하며 유럽산 돼지고기와 유제품 등에 대한 보복 관세 절차에 착수했습니다. 이로 인해 양측 간의 무역 갈등이 전면적인 관세 전쟁으로 비화할 조짐을 보이고 있습니다. 글로벌 자동차 제조사들은 공급망 재편과 현지 생산 공장 확보에 사활을 걸고 대응책을 마련 중입니다. 전문가들은 이번 사태가 글로벌 무역 질서의 블록화 현상을 더욱 가속할 것으로 내다보고 있습니다.`,
  keyTerms:[{term:`상계관세`,explanation:`수출국이 특정 산업에 부당한 보조금을 지급해 수입국 산업에 피해를 줄 경우, 이를 상쇄하기 위해 수입국이 추가로 물리는 관세입니다.`}],
  history:`유럽은 전통적으로 자동차 산업의 강자였으나, 최근 몇 년간 전기차 전환 경쟁에서 중국 기업들에게 다소 밀리는 모습을 보였습니다. 중국은 막대한 국가 보조금을 바탕으로 저렴한 가격의 전기차를 쏟아내며 유럽 시장 점유율을 급격히 끌어올렸습니다. 이에 위기감을 느낀 EU는 불공정 무역 관행에 대한 조사를 벌여왔습니다.`,
  players:`유럽연합 집행위원회(EC)는 역내 산업 보호를 명분으로 강경한 관세 정책을 주도하고 있습니다. 중국 상무부는 이를 보호무역주의로 규정하고 즉각적인 보복 조치로 맞서고 있습니다. 독일의 완성차 업체들은 중국 시장에서의 보복을 우려해 관세 부과에 소극적인 태도를 취해왔습니다.`,
  current:`이번 추가 관세 확정으로 유럽과 중국 간의 경제적 디커플링이 자동차 산업을 중심으로 본격화되는 양상입니다. 양측이 상대국 핵심 수출품을 타격하며 치열한 수싸움을 벌이고 있습니다.`,
  outlook:`향후 양측이 세계무역기구(WTO)를 통한 제소전에 돌입할 가능성이 매우 높습니다. 관세 장벽을 우회하기 위해 중국 기업들이 동유럽 등에 직접 생산 기지를 짓는 우회 전략도 가속화될 전망입니다.`,
  sources:[{title:`EU 상계관세 최고 35% 최종 확정... 중국 ‹즉각 보복› - 조선일보`,url:`https://www.chosun.com/`},{title:`EU Approves Tariffs on Chinese EVs - Reuters`,url:`https://www.reuters.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`여야가 제22대 국회 첫 정기국회에서 2027년도 예산안과 국민연금 개혁안을 두고 강하게 충돌했습니다.`,
  metrics:[`내년도 예산안 680조 원 규모`,`국민연금 보험료율 13% 제안`],
  summary:`제22대 국회 첫 정기국회가 반환점을 돈 가운데, 680조 원 규모의 내년도 예산안 심사를 둘러싸고 여야의 대립이 격화되고 있습니다. 특히 핵심 쟁점인 국민연금 개혁안을 두고 정부와 야당이 시각차를 좁히지 못하며 난항을 겪고 있습니다. 정부여당은 재정 안정성을 우선시하여 보험료율을 13%로 인상하는 모수개혁 방안을 신속히 처리하자는 입장입니다. 반면 야당은 소득대체율 인상 없는 단편적인 요율 조정은 국민 부담만 가중시킨다며 구조개혁까지 포괄하는 합의를 요구하고 있습니다. 양측의 강경한 태도로 인해 법정 처리 시한 내에 예산안과 연금개혁안이 통과될 수 있을지 불투명한 상황입니다. 정쟁이 심화되면서 민생 경제 회복을 위한 주요 법안들의 처리도 줄줄이 지연되고 있습니다. 향후 여야 지도부 간의 막판 타결 여부가 정국 주도권을 가를 핵심 변수가 될 전망입니다.`,
  keyTerms:[{term:`모수개혁`,explanation:`연금 제도의 기본 틀은 유지하면서 보험료율이나 연금 수급 연령 등 핵심 수치(모수)만을 조정하여 재정을 안정시키는 개혁 방식입니다.`}],
  history:`대한민국의 국민연금은 급속한 고령화와 저출산으로 인해 기금 고갈 시점이 당겨지고 있다는 경고를 지속적으로 받아왔습니다. 역대 정부마다 연금 개혁을 시도했으나 국민적 반발에 부딪혀 번번이 무산되었습니다. 내년도 예산안 역시 건전재정 기조와 민생 지원이라는 두 가지 상충되는 목표 사이에서 편성이 지연되어 왔습니다.`,
  players:`정부와 여당은 국가 부채 증가를 억제하기 위해 긴축 재정과 제한적인 연금 개혁을 강조하고 있습니다. 야당은 서민 경제 안정을 위한 확장 재정과 실질적인 소득 보장을 주장하며 대립각을 세우고 있습니다. 미래 세대인 청년층과 수급을 앞둔 장년층 간의 이해관계도 첨예하게 얽혀 있습니다.`,
  current:`국정감사 직후 시작된 본격적인 예산 전쟁과 법안 심사 과정에서 양측의 이견이 전혀 좁혀지지 않고 있습니다. 연금 개혁안마저 예산안과 연계 처리될 조짐을 보이며 정국 경색이 심화되는 국면입니다.`,
  outlook:`헌법이 정한 예산안 처리 시한(12월 2일)을 넘길 가능성이 농후해지며 연말 정국에 매서운 한파가 예상됩니다. 국민 여론의 향방과 시민사회의 중재 역할이 협상의 돌파구를 마련할 유일한 변수입니다.`,
  sources:[{title:`정기국회 예산전쟁 개막... 모수개혁 두고 여야 정면충돌 - KBS`,url:`https://news.kbs.co.kr/`},{title:`‹680조› 예산안 심사 난항... 연금개혁 연계 조짐 - 한겨레`,url:`https://www.hani.co.kr/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`2026년 미국 중간선거를 한 달 앞두고 양당이 핵심 경합주에서 총력전에 돌입했습니다.`,
  metrics:[`연방 하원 전체 435석 선거`,`상원 34석 선거 진행`],
  summary:`2026년 11월에 치러질 미국 중간선거가 불과 한 달 앞으로 다가오면서 민주당과 공화당의 유세전이 최고조에 달하고 있습니다. 이번 선거는 현 행정부의 국정 운영에 대한 중간 평가 성격을 띠며, 하원 전체 435석과 상원 34석의 주인이 새롭게 결정됩니다. 특히 양당의 지지율이 팽팽하게 맞서고 있는 펜실베이니아와 미시간 등 핵심 스윙 스테이트 유권자들의 표심이 승패를 가를 것으로 보입니다. 경제 문제와 이민 정책, 그리고 최근 불거진 외교 안보 이슈가 핵심 쟁점으로 떠오르며 유권자들의 양극화도 심화되고 있습니다. 공화당은 인플레이션 책임론을 내세워 의회 다수당 탈환을 노리는 반면, 민주당은 낙태권 보호와 민주주의 수호를 강조하며 지지층 결집에 나섰습니다. 전문가들은 어느 당도 압도적인 우위를 점하지 못해 선거 당일까지 초접전 양상이 지속될 것으로 분석합니다. 이번 선거 결과에 따라 향후 2년간 미국의 주요 국내외 정책 방향이 크게 요동칠 수 있습니다.`,
  keyTerms:[{term:`스윙 스테이트`,explanation:`선거 때마다 지지 정당이 그네처럼 흔들리며 바뀌는 경합주를 뜻하며, 미국 선거의 최종 승패를 좌우하는 핵심 지역입니다.`}],
  history:`미국의 중간선거는 통상적으로 집권 여당에 대한 유권자들의 심판 성격을 띠어 여당의 무덤으로 불리곤 합니다. 최근 몇 년간 미국 사회는 낙태권, 총기 규제, 이민 문제 등을 둘러싸고 이념적 양극화가 극도로 심화되었습니다. 지난 대선 이후 양당의 의석 차이가 크지 않아 이번 선거의 중요성이 더욱 부각되어 왔습니다.`,
  players:`현 행정부를 방어해야 하는 민주당은 중산층 지원과 인권 수호를 내세우고 있습니다. 의회 장악력을 탈환하려는 공화당은 경제 실정 책임론과 강력한 국경 통제를 무기로 유권자들을 공략 중입니다. 무당층 유권자들과 핵심 경합주의 노동자 계층이 최종 캐스팅보트를 쥐고 있습니다.`,
  current:`투표일을 한 달 남겨두고 양당 수뇌부가 펜실베이니아, 미시간 등 초경합주에 막대한 선거 자금을 쏟아붓고 있습니다. 경제 지표의 미세한 변동과 지정학적 이슈가 매주 지지율을 출렁이게 만들고 있습니다.`,
  outlook:`선거 결과에 따라 현 행정부의 하반기 핵심 정책 추진력이 완전히 상실되거나, 반대로 강력한 국정 장악력을 쥐게 될 것입니다. 우편 투표 비율이 높아 개표 완료까지 며칠이 소요되며 극심한 혼란이 빚어질 여지도 있습니다.`,
  sources:[{title:`미 중간선거 D-30, 경합주 유세 총력전 - 중앙일보`,url:`https://www.joongang.co.kr/`},{title:`Both Parties Pour Millions into Swing States as Midterms Loom - AP News`,url:`https://apnews.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`중동 지역의 지정학적 긴장이 고조되는 가운데 주변국들이 국경 지역의 방어력을 대폭 강화하고 있습니다.`,
  metrics:[`난민 유입 예상 150만 명`,`국경 수비 병력 30% 증원`],
  summary:`이스라엘과 인접 무장 정파 간의 군사적 충돌이 다시 격화되면서 중동 전역으로 긴장감이 빠르게 확산하고 있습니다. 이로 인해 대규모 난민 사태와 추가적인 영토 분쟁을 우려한 이집트, 요르단 등 인접 국가들이 국경 수비를 대폭 강화하는 조치를 취했습니다. 특히 민간인 피해를 줄이고 교전 확대를 막기 위해 국경 인근에 비무장 완충지대 설정을 요구하는 국제사회의 목소리도 커지고 있습니다. 유엔 안전보장이사회는 긴급 회의를 소집하여 즉각적인 휴전과 인도주의적 지원 경로 확보를 촉구하는 결의안을 논의 중입니다. 그러나 당사국 간의 뿌리 깊은 불신과 역내 강대국들의 대리전 양상까지 겹쳐 외교적 해법 마련은 험난한 상황입니다. 이번 사태가 장기화할 경우 글로벌 원유 공급망에 심각한 차질을 빚을 수 있다는 경고도 나옵니다. 국제 원유 가격이 요동치며 세계 경제 회복에 새로운 암초로 작용할 가능성이 높아졌습니다.`,
  keyTerms:[{term:`완충지대`,explanation:`적대적인 국가나 세력 간의 군사적 충돌을 방지하기 위해 설정된 중립 구역으로, 병력이나 무기 배치가 엄격히 금지됩니다.`}],
  history:`중동 지역은 이스라엘과 팔레스타인 무장 정파 간의 고질적인 분쟁으로 오랜 기간 불안정한 상태를 유지해왔습니다. 최근 종교적, 영토적 갈등이 다시 폭발하며 국지전이 대규모 무력 충돌로 비화되었습니다. 주변 아랍 국가들은 자국으로의 확전을 막기 위해 고심하며 아슬아슬한 중립을 지켜왔습니다.`,
  players:`이스라엘 정부는 자국 안보를 명분으로 강경한 군사 작전을 불사하고 있습니다. 헤즈볼라와 하마스 등 무장 정파는 게릴라전으로 끈질기게 맞서고 있으며, 이란은 이들을 물밑에서 지원한다는 의심을 받고 있습니다. 미국과 유럽연합은 사태 중재와 확전 억제를 위해 막후 외교를 총동원 중입니다.`,
  current:`이집트 등 인접국들이 난민 통제를 위해 국경을 걸어 잠그고 군을 배치하면서 군사적 긴장감이 최고조에 이르렀습니다. 국제사회의 빗발치는 휴전 요구에도 불구하고 뚜렷한 외교적 해법이 보이지 않는 답답한 상황입니다.`,
  outlook:`향후 며칠 내에 임시 휴전안이 타결되지 않는다면, 이는 곧바로 중동 전역을 휩쓰는 국제전으로 비화할 수 있습니다. 페르시아만 인근의 원유 수송로가 차단될 경우 글로벌 에너지 위기가 현실화될 위험이 다분합니다.`,
  sources:[{title:`중동 화약고 폭발 조짐... 인접국 국경 수비 30% 늘렸다 - MBC`,url:`https://imnews.imbc.com/`},{title:`UN calls for immediate demilitarized buffer zone in Middle East - BBC`,url:`https://www.bbc.com/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`초고령사회 진입에 따라 정부가 법정 정년 연장 대신 계속고용제도 도입을 공식 추진하기로 했습니다.`,
  metrics:[`2026년 65세 이상 인구 21%`,`핵심 생산가능인구 120만 명 감소`],
  summary:`대한민국이 전체 인구 중 65세 이상 비율이 21%를 넘는 초고령사회에 본격 진입함에 따라 노동 시장 구조 개편이 시급해졌습니다. 이에 정부는 일괄적인 정년 연장이 청년 일자리에 미칠 악영향을 고려하여, 퇴직자를 재고용하는 방식의 계속고용제도 도입을 공식화했습니다. 이는 기업이 근로자의 정년이 지난 후에도 직무와 임금을 재조정하여 일정 기간 고용을 연장하도록 유도하는 방안입니다. 노동계는 실질적인 소득 크레바스를 메우기 위해서는 법정 정년 연장이 필수적이라며 강력히 반발하고 있습니다. 반면 경영계는 임금 체계 개편 없이 고용만 연장할 경우 기업의 인건비 부담이 한계에 달할 것이라며 우려를 표명했습니다. 양측의 입장이 극명하게 엇갈리면서 사회적 대타협을 이루기 위한 노사정 위원회의 진통이 예상됩니다. 인구 감소로 인한 경제 활력 저하를 막기 위해서는 세대 간 갈등을 최소화하는 합리적인 대안 마련이 절실합니다.`,
  keyTerms:[{term:`계속고용제도`,explanation:`법적인 정년 연장을 의무화하지 않고, 기업이 자율적으로 퇴직자를 재고용하거나 임금피크제를 통해 고용을 연장하도록 하는 유연한 고용 제도입니다.`}],
  history:`대한민국은 유례없이 빠른 속도로 인구 고령화를 겪으며 생산가능인구가 급감하는 절벽에 직면해 있습니다. 지난 수십 년간 60세 정년 제도가 유지되어 왔으나, 평균 수명 연장과 노인 빈곤 문제로 인해 정년 연장에 대한 사회적 요구가 커졌습니다. 하지만 청년층의 심각한 취업난과 맞물려 세대 간 일자리 뺏기 논쟁으로 번졌습니다.`,
  players:`정부는 노동 유연성을 확보하고 기업의 부담을 줄이기 위해 계속고용제도를 최적의 대안으로 밀고 있습니다. 노동조합은 고용 불안정과 임금 삭감을 우려하며 법적 정년 연장을 타협할 수 없는 마지노선으로 규정했습니다. 기업 단체들은 임금피크제 없는 단순 고용 연장이 기업 경쟁력을 갉아먹을 것이라 주장합니다.`,
  current:`초고령사회 진입이라는 명확한 통계 지표가 발표되면서, 더 이상 미룰 수 없는 시대적 과제로 급부상했습니다. 관련 법안 개정을 앞두고 노사정 간의 팽팽한 줄다리기가 본격적으로 막을 올린 상태입니다.`,
  outlook:`올해 말까지 구체적인 가이드라인과 재정 지원 방안이 담긴 정부의 종합 대책이 발표될 예정입니다. 입법 과정에서 직무급제 전환 여부와 청년 채용 할당제 등이 핵심 쟁점으로 치열하게 다뤄질 전망입니다.`,
  sources:[{title:`초고령사회 도래... 정부, 정년 연장 대신 ‹계속고용› 공식화 - SBS`,url:`https://news.sbs.co.kr/`},{title:`경영계 ‹환영› 노동계 ‹반발›... 계속고용제도 험로 예고 - 한국경제`,url:`https://www.hankyung.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`유럽연합(EU)이 세계 최초로 마련한 인공지능법(AI Act)이 전면 시행되면서 글로벌 테크 기업들에 비상이 걸렸습니다.`,
  metrics:[`위반 시 글로벌 매출 최대 7% 벌금`,`적용 대상 AI 시스템 1만 개 이상`],
  summary:`유럽연합(EU)이 인간의 기본권과 안전을 보호하기 위해 제정한 세계 최초의 포괄적 인공지능법(AI Act)이 오늘부터 전면 시행에 들어갔습니다. 이 법안은 AI 시스템의 위험도를 4단계로 분류하고, 고위험 AI에 대해서는 데이터 품질과 투명성 등 엄격한 규제를 부과합니다. 특히 챗GPT와 같이 광범위한 작업에 활용될 수 있는 범용 인공지능(GPAI) 모델을 개발하는 기업들은 시스템의 훈련 과정과 에너지 소비량을 의무적으로 투명하게 공개해야 합니다. 이를 위반할 경우 기업의 글로벌 연간 총매출액의 최고 7%에 달하는 막대한 과징금이 부과될 수 있어 업계의 긴장감이 높습니다. 구글, 메타, 오픈AI 등 거대 테크 기업들은 컴플라이언스 전담팀을 대폭 확충하고 EU 시장에 맞춘 서비스 개편을 서두르고 있습니다. 전문가들은 이번 조치가 전 세계 인공지능 규제의 표준인 브뤼셀 효과를 일으킬 것으로 전망하고 있습니다. 기술 혁신과 윤리적 통제 사이의 균형을 찾기 위한 국제사회의 논의도 한층 가속화될 것입니다.`,
  keyTerms:[{term:`범용 인공지능(GPAI)`,explanation:`특정한 하나의 목적이 아니라 언어 번역, 이미지 생성, 코딩 등 광범위하고 다양한 작업에 범용적으로 활용될 수 있는 강력한 인공지능 모델입니다.`}],
  history:`생성형 AI 기술이 비약적으로 발전함에 따라 가짜 뉴스 생성, 저작권 침해, 개인정보 유출 등 부작용에 대한 경각심도 높아졌습니다. 이에 유럽연합은 수년간의 논의 끝에 세계 최초로 AI 기술 전반을 규율하는 포괄적 법안을 마련했습니다. 미국과 아시아 국가들이 뚜렷한 규제안을 확정하지 못한 가운데 EU가 선도적으로 칼을 빼든 것입니다.`,
  players:`유럽연합 집행위원회는 규제 준수 여부를 철저히 감시할 AI 감독청을 신설하여 통제력을 강화하고 있습니다. 오픈AI, 구글, 마이크로소프트 등 대형 테크 기업들은 과도한 규제가 혁신을 저해한다며 반발하는 한편 법망을 피하기 위한 로비에 집중해왔습니다. 시민단체와 저작권자들은 환영의 뜻을 표하고 있습니다.`,
  current:`법안이 본격적으로 발효됨에 따라 글로벌 IT 기업들은 유럽 시장 철수냐 천문학적 비용의 규제 준수냐의 갈림길에 섰습니다. 특히 범용 모델의 투명성 검증 절차에 업계의 당혹감이 큰 상황입니다.`,
  outlook:`이번 법안 시행은 향후 미국, 한국 등 다른 주요국들의 AI 입법 방향에 결정적인 가이드라인을 제공할 것입니다. 규제 불확실성으로 인해 한동안 글로벌 AI 투자 시장이 위축되거나 일시적인 정체기를 겪을 수 있습니다.`,
  sources:[{title:`EU 인공지능법 전면 시행... 글로벌 빅테크 ‹비상› - 매일경제`,url:`https://www.mk.co.kr/`},{title:`EU's Landmark AI Act Takes Full Effect - The Economist`,url:`https://www.economist.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`잦아지는 기상이변이 농작물 수확량 급감으로 이어지며 전 세계적인 식량 가격 폭등을 유발하고 있습니다.`,
  metrics:[`주요 곡물 생산량 8% 감소`,`국제 식량가격지수 15% 상승`],
  summary:`올 한 해 지구촌을 강타한 극심한 폭염과 가뭄, 폭우 등 이상 기후 현상으로 인해 글로벌 식량 안보에 적신호가 켜졌습니다. 세계 3대 곡창지대의 밀과 옥수수 수확량이 일제히 급감하면서 국제 농산물 가격이 가파른 상승세를 보이고 있습니다. 이처럼 기후 변화로 인해 농산물 생산이 줄고 물가가 구조적으로 치솟는 기후 인플레이션 현상이 각국의 경제에 치명적인 타격을 입히고 있습니다. 특히 개발도상국과 저소득층의 식탁 물가 부담이 가중되면서 빈곤과 사회적 불안이 심화될 수 있다는 우려가 나옵니다. 유엔 식량농업기구(FAO)는 긴급 구호 자금 확충과 식량 수출 통제 조치의 자제를 회원국들에게 촉구했습니다. 식량 수급 불안은 단기적인 현상에 그치지 않고 향후 수년간 지속될 수 있는 구조적 리스크로 자리 잡고 있습니다. 이에 따라 기후 변화에 강한 새로운 품종 개발과 스마트 농업 기술 투자가 어느 때보다 절실한 시점입니다.`,
  keyTerms:[{term:`기후 인플레이션`,explanation:`폭염이나 가뭄 같은 극단적인 기후 변화로 인해 농작물 등 원자재 생산이 줄어들면서 물가가 구조적이고 지속적으로 오르는 현상을 말합니다.`}],
  history:`과거에도 가뭄이나 홍수 등 이상 기후 현상은 존재했으나, 최근 들어 그 빈도와 강도가 유례없이 잦아지고 있습니다. 특히 최근 몇 년간 이어진 엘니뇨 현상으로 남미와 아시아 등 주요 농업 지대의 토양 수분이 심각하게 고갈되었습니다. 이는 일시적인 흉작을 넘어 구조적인 공급망 붕괴로 이어지고 있습니다.`,
  players:`농업 생산량이 급감한 브라질, 인도, 호주 등의 국가들은 국내 물가 안정을 위해 식량 수출을 통제하려는 움직임을 보이고 있습니다. 유엔 식량농업기구(FAO)를 비롯한 국제기구는 글로벌 연대를 호소하며 구호 활동에 안간힘을 쓰고 있습니다. 식량 수입 의존도가 높은 개발도상국 국민들은 생존의 위협을 받고 있습니다.`,
  current:`기후 변화라는 통제 불가능한 변수가 밥상 물가를 끌어올리는 기후 인플레이션이 전 세계적인 경제 골칫거리로 등장했습니다. 각국 중앙은행조차 금리 조절로는 해결할 수 없는 공급측 인플레이션에 한계를 느끼고 있습니다.`,
  outlook:`단기적으로는 대체 수입선 확보와 관세 인하 조치 등으로 버티겠지만, 근본적인 해결책이 될 수는 없습니다. 장기적으로 유전자 조작 작물(GMO) 도입 논의와 수직농장 등 대체 농업 기술에 대한 전폭적인 투자가 활성화될 것입니다.`,
  sources:[{title:`지구촌 덮친 폭염에 밥상물가 비상... ‹기후 인플레이션› 덮쳤다 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`Global Food Prices Surge as Extreme Weather Hits Crop Yields - FT`,url:`https://www.ft.com/`}]
}]

  tag:`2026-10-01`,
  label:`2026년 10월 1일 (목)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 10년물 국채 금리가 24년 만에 5.3%를 돌파했지만, 인플레이션 둔화로 추가 금리 인상 우려는 다소 완화되었습니다.`,
  metrics:[`10년물 국채 금리 5.3% 돌파`,`미국 2분기 GDP 2.2% 상향 조정`],
  summary:`미국의 2분기 경제성장률이 2.2%로 상향 조정되며 탄탄한 경제 펀더멘털을 증명했습니다. 이로 인해 장기 금리의 벤치마크인 10년물 국채 금리가 장중 5.3%를 돌파하며 2002년 이후 최고치를 기록했습니다. 하지만 8월 개인소비지출(PCE) 물가지수가 예상보다 낮게 나오면서 인플레이션 압력은 줄어들었습니다. 이에 따라 미 연방준비제도(Fed)가 10월에 추가로 금리를 인상할 확률은 30%대로 하락했습니다. 현재 시장은 국채 금리 급등이라는 단기적 충격을 소화하면서도, 긴축 사이클 종료에 대한 기대감을 동시에 키우고 있습니다. 이러한 상황은 국채 금리 향방에 따른 글로벌 금융 시장의 자금 이동을 더욱 가속화할 전망입니다.`,
  keyTerms:[{term:`국채 금리`,explanation:`국가가 돈을 빌릴 때 발행하는 채권의 이자율입니다. 미국 10년물 국채 금리는 전 세계 금융 시장의 장기 금리 기준점이 됩니다.`}],
  history:`팬데믹 이후 인플레이션을 잡기 위해 미 연준은 지난 수년간 공격적으로 기준금리를 인상해왔습니다. 그 과정에서 고금리가 뉴노멀로 굳어지며 글로벌 자본 시장의 재편이 진행되었습니다. 최근까지도 인플레이션 재점화에 대한 경계감이 남아있어 통화정책의 불확실성이 지속되었습니다.`,
  players:`금리를 결정하는 미 연방준비제도(Fed)와 이에 반응하는 글로벌 채권 투자자들이 주요 행위자입니다. 또한, 미국의 통화정책에 직접적인 영향을 받는 각국 중앙은행과 주식 시장 참여자들도 민감하게 얽혀 있습니다. 미국 재무부의 채권 발행 규모 역시 금리에 막대한 영향을 미칩니다.`,
  current:`경제가 예상보다 강한 모습을 보이면서 장기 금리가 크게 뛰었지만, 물가는 다행히 안정세를 찾아가고 있습니다. 이는 금리 급등의 공포 속에서도 연준의 긴축이 마무리 단계에 접어들었다는 안도감을 줍니다.`,
  outlook:`다음 달 발표될 핵심 고용 보고서와 소비자물가지수(CPI) 결과에 따라 연준의 연말 금리 정책이 최종 결정될 것입니다. 지표가 안정적으로 나온다면 글로벌 증시는 다시 강한 반등세를 보일 수 있습니다.`,
  sources:[{title:`미 국채 금리 24년 만에 최고치 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`금리 추가 인상 우려 완화 - 매일경제`,url:`https://www.mk.co.kr/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 반도체 기업 마이크론이 AI 수요 폭발에 힘입어 분기 매출 542억 달러를 기록하며 전년 대비 4배 급증했습니다.`,
  metrics:[`분기 매출 542억 달러`,`매출 전년 대비 4배 급증`],
  summary:`미국 최대 메모리 반도체 기업인 마이크론 테크놀로지가 시장의 기대를 훌쩍 뛰어넘는 역대급 실적을 발표했습니다. 마이크론의 회계연도 4분기 매출은 542억 달러로, 전년 동기 대비 거의 4배나 급증했습니다. 이러한 놀라운 성장의 배경에는 인공지능(AI) 데이터센터에 필수적인 고대역폭메모리(HBM)의 수요 폭발이 자리 잡고 있습니다. 특히 엔비디아 등 주요 AI 칩셋 제조사들의 주문이 밀려들면서 메모리 가격과 판매량이 동시에 상승했습니다. 현재 글로벌 반도체 시장은 일반 PC용 메모리는 부진하지만 AI용 고성능 메모리는 품귀 현상을 빚는 양극화가 심화되고 있습니다. 이번 실적 발표는 AI 붐이 여전히 초입 단계에 있으며 관련 인프라 투자가 계속될 것임을 시사합니다.`,
  keyTerms:[{term:`고대역폭메모리(HBM)`,explanation:`여러 개의 D램을 수직으로 연결해 데이터 처리 속도를 획기적으로 끌어올린 고성능 메모리로, AI 연산에 필수적입니다.`}],
  history:`생성형 AI의 등장 이후 대규모 데이터 처리가 필수적으로 요구되면서 고성능 메모리 반도체의 수요가 급증하기 시작했습니다. 과거 일반 PC와 스마트폰에 의존하던 메모리 시장의 수익 구조가 AI 인프라 중심으로 완전히 재편되었습니다. 이로 인해 HBM과 같은 고부가가치 제품의 중요성이 크게 대두되었습니다.`,
  players:`마이크론을 비롯해 SK하이닉스, 삼성전자 등 주요 글로벌 메모리 반도체 3사가 시장 주도권을 두고 치열하게 경쟁하고 있습니다. 핵심 고객사인 엔비디아와 AMD, 그리고 대규모 데이터센터를 짓는 마이크로소프트, 구글 등 빅테크 기업들의 투자 결정이 시장을 움직입니다.`,
  current:`AI 인프라 확장에 필수적인 부품이라 부르는 게 값이 될 정도로 HBM 공급 부족 현상이 심각하게 나타나고 있습니다. 반면 레거시 반도체 시장은 여전히 회복이 더뎌 극심한 실적 양극화가 진행 중입니다.`,
  outlook:`최소 2027년까지 글로벌 AI 데이터센터 확충이 계속될 것으로 보여 프리미엄 메모리의 가격 강세가 굳건히 유지될 전망입니다. 반도체 기업들의 대규모 생산 설비 투자 발표도 잇따를 것입니다.`,
  sources:[{title:`마이크론 실적 대폭발 - 다음 금융`,url:`https://finance.daum.net/`},{title:`AI 수요 폭발에 HBM 호조 - 한국경제`,url:`https://www.hankyung.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국은행의 기준금리 3.0% 유지에 따른 대출 부담에도 불구하고, 반도체 수출 호조로 9월 소비자심리지수가 106.6으로 반등했습니다.`,
  metrics:[`한국은행 기준금리 3.0%`,`9월 소비자심리지수 106.6`],
  summary:`한국은행이 가계부채와 부동산 시장 안정을 위해 지난 8월 기준금리를 3.0%로 인상한 여파가 계속되고 있습니다. 고금리로 인해 서민들의 대출 이자 부담은 눈덩이처럼 커졌고, 내수 소비 위축에 대한 우려도 컸습니다. 하지만 9월 소비자심리지수(CCSI)는 106.6을 기록하며 한 달 만에 다시 낙관적인 전망으로 돌아섰습니다. 이는 반도체를 중심으로 한 주력 수출 품목의 호조가 국가 경제 전반의 소득 증가로 이어질 것이라는 긍정적인 기대감이 반영된 결과입니다. 현재 한국 경제는 수출이 이끄는 거시 경제의 훈풍과 체감 물가 및 고금리로 고통받는 미시 경제의 냉기류가 혼재된 상태입니다. 앞으로 수출 낙수효과가 가계 소득으로 얼마나 빠르게 이어질지가 내수 회복의 관건입니다.`,
  keyTerms:[{term:`소비자심리지수(CCSI)`,explanation:`소비자들이 경제 상황을 어떻게 체감하고 전망하는지를 0부터 200까지 수치로 나타낸 지표로, 100보다 크면 긍정적임을 의미합니다.`}],
  history:`계속된 고금리 기조와 누적된 인플레이션으로 인해 올해 상반기 내내 국내 소비 심리는 크게 위축되어 있었습니다. 서민들의 대출 연체율이 상승하고 자영업자들의 폐업이 줄을 이으며 내수 침체의 골이 깊어졌습니다. 한국은행은 가계부채 급증을 막기 위해 금리 인하 카드를 아껴왔습니다.`,
  players:`통화 정책의 키를 쥔 한국은행과 이자 부담의 직접적인 직격탄을 맞은 일반 가계가 핵심입니다. 또한, 반도체 및 자동차 수출을 주도하여 거시 경제의 수치를 끌어올리는 주요 대기업들도 중요한 행위자입니다.`,
  current:`체감 경기는 여전히 차갑고 팍팍하지만, 거시 지표인 수출이 호조를 보이면서 향후 경기에 대한 막연한 불안감은 다소 잦아들고 있습니다. 거시와 미시 경제의 괴리가 가장 뚜렷하게 나타나는 시기입니다.`,
  outlook:`미국 연방준비제도의 향후 통화정책 방향과 국내 가계부채의 증감 추이에 따라 한국은행의 연말 금리 인하 여부가 판가름 날 것입니다. 수출의 과실이 내수로 퍼져나가는 속도에 주목해야 합니다.`,
  sources:[{title:`한은 기준금리 3.0% 시대 - 한국은행`,url:`https://www.bok.or.kr/`},{title:`소비자 심리 반등 - 뉴스핌`,url:`https://www.newspim.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`이재명 대통령이 신형 이지스함 진수식에 참석해 자주국방 역량을 강조하며 안보 위협에 단호히 대처하겠다는 의지를 밝혔습니다.`,
  metrics:[`8200톤급 이지스 구축함 진수`,`차기 국방예산 7% 증액`],
  summary:`이재명 대통령은 해군의 최신예 8200톤급 이지스 구축함인 '대호김종서함' 진수식에 직접 참석해 국방 행보를 보였습니다. 진수식 축사에서 이 대통령은 "스스로 지킬 힘이 있어야 미래를 직접 결정할 수 있다"며 자강 안보의 중요성을 강력히 역설했습니다. 이는 최근 북한의 지속적인 도발과 급변하는 동북아 안보 지형 속에서 굳건한 국방력을 바탕으로 평화를 지키겠다는 의지를 대내외에 과시한 것입니다. 또한 차기 국방예산을 7% 증액하려는 정부 기조에 맞춰 첨단 군사력 건설에 속도를 내겠다는 뜻도 내비쳤습니다. 현재 주변국들의 군비 경쟁이 치열해지는 가운데, 독자적인 방위 능력 확보는 필수적인 국가 과제로 떠올랐습니다. 이번 진수식을 계기로 국방력 현대화 사업이 한층 더 탄력을 받을 것으로 보입니다.`,
  keyTerms:[{term:`자강 안보`,explanation:`외부 세력에 전적으로 의존하지 않고 국가 스스로의 강력한 군사력과 경제력을 바탕으로 국가 안보를 책임지는 전략을 뜻합니다.`}],
  history:`한반도를 둘러싼 미중 패권 경쟁과 북한의 핵·미사일 고도화로 인해 독자적인 대북 억지력 확보의 필요성이 꾸준히 제기되어 왔습니다. 역대 정부들은 해양 주권 수호와 주변국 견제를 위해 대양해군 육성을 장기 과제로 삼아 전력을 증강해왔습니다. 최근에는 드론과 무인기 등 비대칭 전력에 대응하기 위한 방어 체계 구축이 시급해졌습니다.`,
  players:`국군 통수권자인 한국 정부 및 해군 수뇌부가 정책을 주도하고 있습니다. 주변 바다에서 무력시위를 벌이는 중국과 러시아, 그리고 끊임없이 도발하는 북한 군부가 주요 견제 대상입니다. 무기 체계를 공급하고 개발하는 국내 주요 방위산업체들도 깊이 관여되어 있습니다.`,
  current:`첨단 전략자산 도입을 통해 해상 방위력을 획기적으로 강화하고 주변국의 잠재적 군사 위협에 대비하는 단계에 본격 돌입했습니다. 자강 안보를 기치로 내건 현 정부의 국방 기조가 무기 체계 전력화로 구체화되고 있습니다.`,
  outlook:`앞으로도 해군의 이지스함 추가 도입 및 차세대 전략 잠수함 전력화 등 첨단 무기체계 확충이 지속적으로 추진될 전망입니다. 방위 예산 확대를 둘러싼 정치권의 논의도 가열될 것입니다.`,
  sources:[{title:`대통령 이지스함 진수식 참석 - 메트로신문`,url:`https://www.metroseoul.co.kr/`},{title:`해군 최신예 함정 진수 - KBS 뉴스`,url:`https://news.kbs.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`트럼프 미국 대통령이 540억 달러 규모의 한국 대미 투자 사업을 발표할 예정인 가운데, 국내에서는 사업성에 대한 우려가 제기되고 있습니다.`,
  metrics:[`알래스카 LNG 사업 540억 달러 규모`,`트럼프 정부 출범 후 대미 투자 1호`],
  summary:`도널드 트럼프 미국 대통령이 재집권 이후 한국의 대미 투자 1호 사업으로 540억 달러 규모의 '알래스카 LNG 개발 사업' 투자를 직접 발표할 예정입니다. 이 사업은 알래스카 지역의 천연가스를 액화해 아시아로 수출하는 대규모 인프라 프로젝트입니다. 미국 입장에서는 자국 내 일자리 창출과 에너지 수출 확대를 노린 핵심 사업이지만, 한국 정부와 기업들 내부에서는 천문학적인 비용 대비 경제성과 수익성에 대한 우려의 목소리가 끊이지 않고 있습니다. 특히 미국 우선주의를 앞세운 트럼프 행정부의 강한 압박 속에서 이루어진 투자 결정이 아니냐는 관측도 나옵니다. 현재 정부는 동맹 관계 강화를 위한 전략적 투자라는 입장이지만, 막대한 자금이 투입되는 만큼 면밀한 검토가 필요하다는 비판과 맞서고 있습니다. 양국 간의 경제 안보 동맹이 청구서로 돌아올 수 있다는 경계심이 커지는 상황입니다.`,
  keyTerms:[{term:`미국 우선주의`,explanation:`무역, 외교, 안보 등 모든 국가 정책에서 미국의 국익과 자국 산업 보호를 최우선으로 삼는 트럼프 행정부의 핵심 기조입니다.`}],
  history:`도널드 트럼프 대통령은 과거 1기 재임 시절부터 동맹국들에게 방위비 분담금의 대폭 증액과 미국 내 대규모 인프라 투자를 지속적으로 강하게 요구해 왔습니다. 한국 정부와 대기업들은 한미 동맹의 특수성을 고려해 번번이 미국 측의 거액 투자 청구서에 응해왔습니다. 알래스카 LNG 사업 역시 과거부터 수차례 거론되다 트럼프 2기 출범과 함께 재점화되었습니다.`,
  players:`대규모 일자리와 해외 투자를 유치해 정치적 입지를 다지려는 트럼프 행정부와, 미국의 보복 관세 및 방위비 압박을 피하려는 한국 정부가 주된 협상 당사자입니다. 실제로 막대한 자본을 조달하고 리스크를 떠안아야 하는 한국가스공사 등 에너지 공기업과 민간 기업들이 얽혀 있습니다.`,
  current:`미국 정부의 강력하고 노골적인 기대에 부응하기 위해 조만간 대규모 투자 계획이 공식 발표될 예정입니다. 그러나 실질적인 수익 구조와 재무적 타당성에 대한 국내 전문가들의 반발이 갈수록 거세지고 있는 상황입니다.`,
  outlook:`향후 실제 투자금 집행 과정에서 한미 간 구체적인 이익 배분 협상과 안전장치 마련이 도마 위에 오를 것입니다. 국회의 비준 동의나 국정감사 과정에서 막대한 진통과 험난한 논쟁이 예상됩니다.`,
  sources:[{title:`트럼프, 한국 알래스카 투자 직접 발표 - MBC`,url:`https://imnews.imbc.com/`},{title:`한국 대미 투자 540억 달러 논란 - 조선일보`,url:`https://www.chosun.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`북한군이 최근 두 달 동안 군사분계선을 50여 차례나 침범하며 도발을 멈추지 않아 동부전선 일대의 군사적 긴장감이 최고조에 달하고 있습니다.`,
  metrics:[`8~9월 군사분계선 침범 50여 차례`,`9월 한 달에만 30여 차례 침범`],
  summary:`최근 남북 접경 지역에서 북한군의 이상 징후가 끊이지 않고 있습니다. 북한군이 지난 8월부터 9월까지 두 달 동안 군사분계선(MDL)을 무려 50여 차례나 침범했으며, 9월에만 30여 차례 집중적으로 선을 넘은 것으로 확인되었습니다. 이는 단순한 실수라기보다는 우리 군의 경계 태세를 떠보고 긴장을 의도적으로 끌어올리려는 다목적 도발로 분석됩니다. 최근 발생한 DMZ 지뢰 폭발 사고와 관련해 북한 김여정 부부장은 이를 "서울의 자작극"이라며 적반하장격으로 비난했고, 전술적 타격 수단을 동원해 보복하겠다고 위협했습니다. 현재 동부전선 일대는 우발적 충돌이 국지전으로 확전될 수 있는 일촉즉발의 상황이 이어지고 있습니다. 우리 군은 철저한 대비 태세를 유지하며 북한의 추가 도발 동향을 예의주시하고 있습니다.`,
  keyTerms:[{term:`군사분계선(MDL)`,explanation:`한국전쟁 정전협정에 따라 남과 북의 무력 충돌을 막기 위해 설정된 군사적인 경계선으로, 실질적인 남북 간의 국경 역할을 합니다.`}],
  history:`남북 간 9.19 군사합의가 사실상 무력화된 이후, 북한은 국경 지역에 대대적으로 지뢰를 매설하고 방벽을 쌓는 등 적대적 두 국가 관계를 노골화해 왔습니다. 오물 풍선 살포와 GPS 교란 등 비대칭 도발을 지속하며 한국 사회의 피로도를 높이는 전술을 구사했습니다. 한미 연합훈련에 대응한다는 명분으로 접경지 도발의 수위를 계속 끌어올렸습니다.`,
  players:`끊임없이 긴장을 유발하고 지시를 내리는 북한 군부 수뇌부 및 김여정 부부장과 이에 맞서 경계를 최고조로 강화하고 있는 대한민국 국군입니다. 우발적 군사 충돌을 방지하고 한반도 상황을 관리하려는 주한미군과 유엔군사령부도 중요한 주체입니다.`,
  current:`북한이 내부의 경제난과 주민들의 불만을 외부로 돌리기 위해 고의적으로 접경 지역의 위기감을 고조시키며 무력시위를 벌이고 있습니다. 지뢰 폭발 사고마저 남측에 책임을 떠넘기며 명분 쌓기에 주력하는 양상입니다.`,
  outlook:`다가오는 대규모 한미 연합훈련이나 미국의 주요 정치 일정을 빌미로 북한이 포격 도발이나 국지적 기습 등 더 수위 높은 직접 타격을 감행할 가능성이 매우 높습니다. 접경지 주민들의 불안감도 계속 커질 것입니다.`,
  sources:[{title:`북한 군사분계선 침범 급증 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`김여정, 지뢰 폭발 비난 - 대구MBC`,url:`https://dgmbc.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`유엔총회에서 20개국이 공동으로 국제원자력기구(IAEA)를 모델로 한 첨단 AI 모델 통제 및 감시 기구 설립을 공식 제안했습니다.`,
  metrics:[`핀란드 등 20개국 공동 선언`,`전 세계 AI 도입 기업 비율 60% 상회`],
  summary:`급격하게 발전하는 인공지능(AI) 기술의 위험성을 통제하기 위해 국제사회가 발 벗고 나섰습니다. 최근 뉴욕에서 열린 유엔총회에서 핀란드와 노르웨이를 비롯한 20개국은 '첨단 AI 모델 통제를 위한 공동 선언'을 전격 발표했습니다. 이 선언의 핵심은 핵무기를 감시하는 국제원자력기구(IAEA)처럼 강력한 권한을 가진 유엔 산하 AI 감시 기구를 창설하자는 것입니다. 새로운 초거대 AI 모델을 시장에 배포하기 전에 안전성을 의무적으로 검증받고, 필요시 강제 사찰까지 진행하여 인류에 미칠 잠재적 위협을 차단하겠다는 구상입니다. 현재 AI 기술이 가짜 뉴스 생성, 사이버 테러, 나아가 무기 개발에까지 악용될 수 있다는 공포가 커지면서 글로벌 규제 마련에 속도가 붙고 있습니다. 이 제안이 실현될 경우 글로벌 빅테크 기업들의 AI 개발 속도와 방향성에 거대한 제동이 걸릴 전망입니다.`,
  keyTerms:[{term:`첨단 AI 모델`,explanation:`스스로 학습하고 판단하여 인간과 유사하거나 뛰어난 성능을 발휘하는 초거대 인공지능으로, 오용될 경우 심각한 사회적 위협이 될 수 있습니다.`}],
  history:`생성형 AI 챗GPT가 대중화된 이후 인공지능 기술의 발전 속도가 윤리적·법적 규제 마련 속도를 크게 추월하면서 글로벌 차원의 통제 필요성이 지속적으로 제기되어 왔습니다. 각국이 독자적인 규제안을 내놓았으나 국경을 초월하는 기술 특성상 실효성이 부족하다는 비판을 받았습니다. 딥페이크 선거 개입과 AI 해킹 위협이 현실화되면서 강력한 제재 기구의 필요성이 대두되었습니다.`,
  players:`혁신과 상업화를 앞세워 AI 기술 패권을 주도하는 미국 빅테크 기업들이 핵심 기술을 쥐고 있습니다. 부작용을 우려해 선제적이고 강력한 규제를 주도하려는 유럽 연합(EU)과 북유럽 국가들, 그리고 새로운 규범을 만들려는 유엔 기구들이 주된 세력입니다.`,
  current:`국가별로 파편화된 자체 규제나 자율 규약만으로는 치명적인 AI 위협을 막는 데 한계가 명확하다는 글로벌 공감대가 확고하게 형성되었습니다. 이에 따라 강제 사찰 권한까지 부여받는 구속력 있는 국제 감시 기구 설립 논의가 마침내 급물살을 타게 되었습니다.`,
  outlook:`AI 기술의 절대 패권을 쥐고 있는 미국과 중국 정부가 자국의 산업 보호를 이유로 이 기구에 얼마나 적극적으로 동참할지가 향후 가장 큰 관건입니다. 합의가 이루어질 경우 글로벌 빅테크의 개발 절차가 크게 지연될 가능성이 큽니다.`,
  sources:[{title:`유엔, AI 감시 기구 제안 - 다음 뉴스`,url:`https://news.daum.net/`},{title:`AI 모델 통제 국제 선언 - 중앙일보`,url:`https://www.joongang.co.kr/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`국내 게임업계의 인공지능(AI) 도입률이 49.6%를 기록하며 전 산업 중 가장 빠르게 AI 기술을 실무에 적용하고 있는 것으로 나타났습니다.`,
  metrics:[`게임업계 AI 도입률 49.6%`,`개발 및 운영 비용 30% 절감 효과`],
  summary:`대한민국 게임 산업이 인공지능(AI) 기술 혁신의 최전선으로 자리매김하고 있습니다. 최근 조사 결과에 따르면, 국내 게임사들의 AI 도입률이 49.6%에 달해 절반 가까운 기업이 이미 실무에 적극 활용하고 있는 것으로 확인되었습니다. 이는 영상, 음악 등 다른 콘텐츠 산업과 비교할 때 압도적으로 빠른 기술 도입 속도입니다. 게임사들은 단순히 게임 내 캐릭터의 지능을 높이는 것을 넘어, 그래픽 디자인 생성, 오류 자동 탐지, 유저 데이터 분석 등 게임 개발과 서비스 전반에 AI를 투입하고 있습니다. 현재 이러한 적극적인 AI 도입은 전체적인 개발 기간을 획기적으로 단축하고 막대한 운영 비용을 절감하는 등 가시적인 성과로 이어지고 있습니다. 더 나아가 게임계에서 축적된 AI 기술력은 향후 로봇 공학이나 자율주행 등 이종 산업으로 확장될 핵심 경쟁력으로 평가받고 있습니다.`,
  keyTerms:[{term:`AI 도입률`,explanation:`전체 기업 중 업무 프로세스나 제품 개발에 인공지능 기술을 실제로 적용하여 활용하고 있는 기업의 비율을 뜻합니다.`}],
  history:`막대한 인건비 지출과 장기간의 개발 기간이 소요되는 게임 산업의 구조적 한계를 극복하기 위해, 대형 게임사들을 중심으로 일찍부터 사내 AI 연구소가 잇따라 설립되었습니다. 초기에는 단순한 데이터 분석에 그쳤지만, 생성형 AI 기술이 폭발적으로 발전하며 게임 아트와 번역 등 실무 전반으로 적용 범위가 넓어졌습니다.`,
  players:`넥슨, 엔씨소프트, 크래프톤 등 선도적으로 수백억 원의 AI R&D 자금을 투자해 온 대형 게임사들이 혁신을 이끌고 있습니다. 상용 AI 솔루션을 빠르게 도입하여 인력 부족을 메우려는 중소 인디 게임 개발사들도 핵심 플레이어입니다. 기술 트렌드를 이끄는 글로벌 AI 모델 제공 기업들도 뒤를 받치고 있습니다.`,
  current:`텍스트 및 이미지 생성형 AI 도구의 대중화로 진입 장벽이 획기적으로 낮아지면서, 자본력이 부족한 중소형 게임사들까지 앞다투어 AI를 핵심 제작 파이프라인에 전면 결합하고 있습니다. 인공지능이 사실상 보조 개발자의 역할을 완벽히 수행하는 중입니다.`,
  outlook:`인공지능이 기획부터 원화(아트), 코딩까지 전담하는 소규모 'AI 원맨 개발' 트렌드가 급격히 확산될 전망입니다. 이는 게임 산업의 고용 구조와 비즈니스 모델 지형을 근본적으로 뒤흔드는 혁명적 변화를 가져올 것입니다.`,
  sources:[{title:`게임업계 AI 도입률 49.6% - 천지일보`,url:`https://www.newscj.com/`},{title:`게임사 비용 30% 절감 효과 - SBS 뉴스`,url:`https://news.sbs.co.kr/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`기후에너지환경부 출범 1주년을 맞아 전국 환경 단체들이 비상시국회의를 열고 정부의 일방적인 난개발 정책에 반발하며 정책 전환을 촉구했습니다.`,
  metrics:[`기후에너지환경부 출범 1주년`,`전국 300여 개 환경 단체 참여`],
  summary:`기후 위기 대응을 목표로 통합 출범했던 기후에너지환경부가 1주년을 맞이했지만, 오히려 환경 단체들과의 갈등은 극에 달하고 있습니다. 출범 1주년 기념일 당일, 전국의 300여 개 환경 단체들은 서울에 모여 '전국환경비상시국회의'를 대대적으로 개최했습니다. 이들은 정부가 기후 대응을 명분으로 내세우고 있지만, 실상은 신규 원자력 발전소 건설, 대규모 댐 신설, 국립공원 케이블카 허가 등 생태계를 파괴하는 속도전식 난개발을 밀어붙이고 있다고 강하게 비판했습니다. 현재 정부는 첨단 산업 전력 공급과 홍수 예방을 위해 인프라 확충이 불가피하다는 입장이지만, 시민사회는 이것이 녹색 칠에 불과하다며 반발하고 있습니다. 경제 성장과 환경 보전이라는 두 가치가 일선 현장에서 정면으로 충돌하면서 기후 정책을 둘러싼 사회적 진통은 한층 더 깊어지고 있습니다. 다가오는 국정감사에서 댐 건설 및 원전 타당성을 둘러싼 거센 공방이 예고되고 있습니다.`,
  keyTerms:[{term:`비상시국회의`,explanation:`국가적 위기나 심각한 사회 문제가 발생했을 때, 시민사회 단체나 각계 대표들이 모여 긴급하게 대책을 논의하고 정부에 행동을 촉구하는 대규모 집회입니다.`}],
  history:`날로 심각해지는 기후 변화에 보다 전문적이고 효율적으로 대응하기 위해 정부는 기존의 에너지와 환경 부처를 강력한 단일 부처로 전격 통합 출범시켰습니다. 그러나 부처 통합 이후 댐 건설과 신규 원전 추진 등 정책 집행 과정에서 산업계의 개발 논리가 생태계 보전보다 우선시된다는 지적이 시민사회를 중심으로 꾸준히 제기되어 왔습니다.`,
  players:`첨단 산업 전력망 구축과 치수 사업 등 인프라 확충을 적극적으로 추진하는 기후에너지환경부 등 정부 당국이 정책을 주도합니다. 반면, 이를 생태계 파괴 행위로 강력히 규정하며 물리적 저지에 나선 수백 개의 연대 환경 단체들과 지역 주민들이 맞서고 있습니다.`,
  current:`극단적인 폭우와 가뭄 등 기상 이변이 잦아지면서 정부는 속도전식 토목 공사 중심의 정책 대응을 서두르고 있습니다. 이에 맞서 환경 단체들은 생태계 복원과 탄소 감축 중심의 근본적이고 철저한 체질 개선을 강력히 요구하며 길거리에서 정면 대립하고 있습니다.`,
  outlook:`10월부터 본격적으로 열리는 국회 국정감사 시즌과 맞물려 신규 댐 건설의 타당성과 원전 추가 건립의 경제성을 둘러싼 여야 및 시민사회 간의 치열한 정치적 공방이 전국을 뜨겁게 달굴 것으로 예상됩니다.`,
  sources:[{title:`전국환경비상시국회의 개최 - 녹색연합`,url:`https://www.greenkorea.org/`},{title:`기후에너지부 출범 1주년 논란 - 기후팩트`,url:`https://climateinfact.org/`}]
}]

let current = null;
let currentCat = null;
const CAT_ORDER = ['경제', '정치', '기타 이슈'];

function renderSidebar() {
  const list = document.getElementById('date-list');
  list.innerHTML = '';
  BRIEFS.forEach((b, i) => {
    const el = document.createElement('div');
    el.className = 'date-item' + (i === 0 ? ' active' : '');
    el.dataset.tag = b.tag;
    const parts = b.tag.split('-');
    const short = parts[1] + '/' + parts[2];
    el.innerHTML = b.tag;
    el.addEventListener('click', () => showBrief(b.tag));
    list.appendChild(el);
  });
}

function showBrief(tag) {
  current = tag;
  document.querySelectorAll('.date-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tag === tag);
  });
  const brief = BRIEFS.find(b => b.tag === tag);
  if (!brief) return;

  // 카테고리별 그룹핑
  const grouped = {};
  brief.stories.forEach(s => {
    if (!grouped[s.category]) grouped[s.category] = [];
    grouped[s.category].push(s);
  });
  const availableCats = CAT_ORDER.filter(c => grouped[c] && grouped[c].length);
  if (!availableCats.length) return;

  // 기본 카테고리 결정
  if (!availableCats.includes(currentCat)) currentCat = availableCats[0];

  renderContent(brief, grouped, availableCats);
}

function renderContent(brief, grouped, availableCats) {
  const content = document.getElementById('content');
  let html = `<div class="sticky-top">
    <div class="brief-header">
      <div class="bh-eyebrow">Morning Brief</div>
      <h2>${brief.label}</h2>
    </div>`;

  // 탭
  html += '<div class="cat-tabs">';
  availableCats.forEach(c => {
    const cls = c === currentCat ? 'cat-tab active' : 'cat-tab';
    html += `<button class="${cls}" data-cat="${c}">${c}</button>`;
  });
  html += '</div></div>';

  // 선택된 카테고리 기사들
  const stories = grouped[currentCat] || [];
  stories.forEach((s, idx) => {
    if (idx > 0) html += '<hr class="story-divider">';
    html += `<div class="story">
      <div class="story-top">
        <div class="story-headline">${s.headline}</div>
      </div>`;
    if (s.metrics.length) {
      html += '<div class="metrics">';
      s.metrics.forEach(m => { html += `<div class="metric-chip">${m}</div>`; });
      html += '</div>';
    }
    // 요약문에 핵심 개념 밑줄 (출력은 박스 다음)
    let summaryHtml = s.summary;
    if (s.keyTerms && s.keyTerms.length) {
      s.keyTerms.forEach(kt => {
        if (!kt.term) return;
        const safe = kt.term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp(safe, 'g');
        summaryHtml = summaryHtml.replace(re, `<span class="kt-underline">${kt.term}</span>`);
      });
    }

    // 핵심 개념 박스 (요약 위)
    if (s.keyTerms && s.keyTerms.length) {
      html += '<div class="key-terms"><div class="key-terms-title">핵심 개념</div>';
      s.keyTerms.forEach(kt => {
        html += `<div class="kt-item">
          <span class="kt-term">${kt.term}</span>
          <span class="kt-exp">${kt.explanation}</span>
        </div>`;
      });
      html += '</div>';
    }

    html += `<div class="summary">${summaryHtml}</div>`;

    const bgSections = [
      ['역사적 맥락', s.history],
      ['핵심 플레이어', s.players],
      ['현재 구도', s.current],
      ['향후 전망', s.outlook],
    ].filter(([, v]) => v);

    if (bgSections.length) {
      html += '<div class="bg-box"><div class="bg-box-title">배경 스토리</div>';
      bgSections.forEach(([label, text]) => {
        html += `<div class="bg-section">
          <div class="bg-section-label">${label}</div>
          <div class="bg-section-text">${text}</div>
        </div>`;
      });
      html += '</div>';
    }

    if (s.sources.length) {
      html += `<button class="sources-toggle" data-toggle="srcs-${idx}">출처 ${s.sources.length}개 보기 <span class="arrow">▾</span></button>`;
      html += `<div class="sources-body" id="srcs-${idx}">`;
      s.sources.forEach((src, si) => {
        html += `<div class="source-item">
          <span class="src-num">${si+1}</span>
          <a href="${src.url}" target="_blank">${src.title}</a>
        </div>`;
      });
      html += '</div>';
    }
    html += '</div>';
  });

  content.innerHTML = html;

  // 탭 클릭 핸들러
  content.querySelectorAll('.cat-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentCat = btn.dataset.cat;
      renderContent(brief, grouped, availableCats);
    });
  });

  // 출처 토글
  content.querySelectorAll('.sources-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const body = document.getElementById(btn.dataset.toggle);
      const isOpen = body.classList.toggle('open');
      btn.classList.toggle('open', isOpen);
    });
  });

  document.getElementById('main').scrollTop = 0;
}

if (BRIEFS.length > 0) {
  renderSidebar();
  showBrief(BRIEFS[0].tag);
} else {
  document.getElementById('content').innerHTML = '<div class="empty">브리핑 데이터가 없습니다.</div>';
}

// ── Quiz Gate ──
const PASS_TARGET = 3;
let correctCount = 0;
const usedIndexes = new Set();

function pickQuestion() {
  // 사용 안 한 문제 중 랜덤. 다 썼으면 풀 리셋
  if (usedIndexes.size >= QUIZ.length) usedIndexes.clear();
  let idx;
  do { idx = Math.floor(Math.random() * QUIZ.length); } while (usedIndexes.has(idx));
  usedIndexes.add(idx);
  return QUIZ[idx];
}

function updateCounter() {
  document.getElementById('quiz-counter').textContent = `(${correctCount}/${PASS_TARGET})`;
}

function renderQuiz() {
  const q = pickQuestion();
  document.getElementById('quiz-q').textContent = q.q;
  updateCounter();
  const feedback = document.getElementById('quiz-feedback');
  feedback.textContent = '';
  feedback.className = 'quiz-feedback';
  const closeBtn = document.getElementById('quiz-close');
  closeBtn.classList.add('hidden');

  const choicesEl = document.getElementById('quiz-choices');
  choicesEl.innerHTML = '';
  // 보기 순서 섞기 (정답 위치 고정 방지)
  const order = q.a.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  order.forEach(idx => {
    const text = q.a[idx];
    const btn = document.createElement('button');
    btn.className = 'quiz-choice';
    btn.textContent = text;
    btn.addEventListener('click', () => {
      const allBtns = choicesEl.querySelectorAll('.quiz-choice');
      allBtns.forEach(b => b.disabled = true);
      if (idx === q.correct) {
        btn.classList.add('correct');
        correctCount++;
        updateCounter();
        if (correctCount >= PASS_TARGET) {
          feedback.textContent = '통과! 들어와도 좋아.';
          feedback.className = 'quiz-feedback right';
          closeBtn.classList.remove('hidden');
        } else {
          feedback.textContent = '역시 맞출 줄 알았어. 다음 문제 고.';
          feedback.className = 'quiz-feedback right';
          btn.blur();
          setTimeout(() => {
            if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
            renderQuiz();
          }, 900);
        }
      } else {
        btn.classList.add('wrong');
        feedback.textContent = '정말 실망이다.... 다음.';
        feedback.className = 'quiz-feedback wrong';
        btn.blur();
        setTimeout(() => {
          if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
          renderQuiz();
        }, 900);
      }
    });
    choicesEl.appendChild(btn);
  });
}

document.getElementById('quiz-close').addEventListener('click', () => {
  document.getElementById('quiz-overlay').classList.add('hidden');
  document.body.classList.remove('quiz-active');
});

document.body.classList.add('quiz-active');
renderQuiz();

// ── Mobile sidebar toggle ──
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('sidebar-backdrop');
function toggleSidebar(open) {
  sidebar.classList.toggle('open', open);
  backdrop.classList.toggle('open', open);
}
document.getElementById('sidebar-toggle').addEventListener('click', () => toggleSidebar(!sidebar.classList.contains('open')));
backdrop.addEventListener('click', () => toggleSidebar(false));
// 날짜 클릭하면 모바일에서 자동으로 닫히게
sidebar.addEventListener('click', e => {
  if (e.target.classList.contains('date-item') && window.innerWidth <= 768) {
    toggleSidebar(false);
  }
});

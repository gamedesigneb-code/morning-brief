  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`전국적인 극한 폭염으로 프로야구 전 경기가 취소되고 농수산물 가격이 급등하는 등 사회적, 경제적 피해가 속출하고 있습니다.`,
  metrics:[`서울 최고 기온 36.8도`,`일일 온열질환자 186명 발생`],
  summary:`한반도를 덮친 유례없는 기록적인 폭염이 시민들의 일상생활과 경제 전반에 큰 타격을 주고 있습니다. 서울의 일 최고 기온이 36.8도를 경신하는 등 가마솥더위가 이어지면서 급기야 KBO는 선수와 관중의 안전을 위해 사상 초유의 프로야구 전 경기 취소 결정을 내렸습니다. 단 하루 동안 발생한 온열질환자만 186명에 달해 올해 최다치를 기록하는 등 국민 건강에 빨간불이 켜졌습니다. 더 큰 문제는 이러한 기후 위기가 밥상 물가 상승으로 곧장 직결되고 있다는 점입니다. 고수온으로 양식장 어류가 떼죽음을 당하고 폭염에 채소 작황마저 부진해지면서 이른바 히트플레이션 현상이 본격화되고 있습니다. 정부와 지자체는 폭염 취약계층을 시급히 보호하고 물가 안정을 위한 긴급 재정 대책 마련에 부심하고 있습니다.`,
  keyTerms:[{term:`히트플레이션`,explanation:`열(Heat)과 인플레이션(Inflation)의 합성어로, 폭염 등 이상 기후로 인해 농산물 등 식료품 가격이 급등하는 물가 상승 현상을 말합니다.`}],
  history:`전 지구적인 온난화와 엘니뇨 현상 등이 겹치면서 매년 여름 폭염의 빈도와 강도가 유례없이 심해지고 있습니다.`,
  players:`더위에 노출된 시민들과 야외 노동자, 농어민, 그리고 방역과 물가를 책임지는 정부 당국이 주요 관계자입니다.`,
  current:`단순한 자연재해를 넘어 농수산물 공급망 붕괴와 물가 폭등 등 거시 경제에 구조적인 타격을 입히는 단계로 진입했습니다.`,
  outlook:`폭염이 장기화될 경우 추석 명절 물가까지 도미노로 상승할 우려가 커 선제적인 농수산물 수급 조절이 절실합니다.`,
  sources:[{title:`사상 초유의 폭염...프로야구 취소, 온열질환 속출 - YTN`,url:`https://www.ytn.co.kr`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`중국 군사 연구소들이 미국의 최첨단 인공지능 모델을 제재를 우회해 활용하여 자체 국방 AI를 훈련시킨 사실이 드러났습니다.`,
  metrics:[`모델 증류 기술 사용`,`미국 주요 AI 기업 타격`],
  summary:`중국의 주요 군사 및 보안 연구 기관들이 미국의 강력한 기술 수출 통제를 뚫고 최첨단 AI 기술을 무기화하고 있다는 사실이 로이터 보도를 통해 세상에 밝혀졌습니다. 조사 결과 이들은 오픈AI의 챗GPT나 앤스로픽의 클로드 같은 미국산 최고 성능의 AI 모델에 우회적으로 접근하여 고급 데이터를 대량 수집했습니다. 그리고 이렇게 빼낸 결과물을 바탕으로 모델 증류 기술을 적용하여 자신들만의 독자적인 소형 군사용 AI 모델을 성공적으로 학습시킨 것으로 파악되었습니다. 이 방식을 교묘하게 활용하면 대규모 컴퓨팅 자원이나 최신 AI 반도체 없이도 고성능의 자율 작동 AI 무기를 개발할 수 있어 미국의 제재가 무력화될 위기에 처했습니다. 인공지능 기술의 군사적 전용을 둘러싼 미중 간의 치열한 기술 패권 경쟁과 안보 위협 논란이 전 세계적으로 더욱 격화될 전망입니다.`,
  keyTerms:[{term:`모델 증류`,explanation:`마치 스승의 지식을 학생에게 전수하듯, 덩치가 크고 똑똑한 대형 AI 모델의 결과물을 이용해 작고 가벼운 AI 모델을 빠르고 효율적으로 학습시키는 기술입니다.`}],
  history:`미국은 중국의 군사력 증강을 막기 위해 첨단 반도체 칩과 최신 AI 소프트웨어 기술의 대중국 수출을 엄격히 통제해 왔습니다.`,
  players:`첨단 기술을 보호하려는 미국 정부 및 AI 빅테크 기업들과 제재를 피해 군사 기술력을 확보하려는 중국 연구 기관 간의 대립입니다.`,
  current:`오픈소스 기술과 우회 접근 방식을 통해 물리적인 수출 규제의 허점이 노출되면서, 소프트웨어 통제의 한계가 드러나고 있습니다.`,
  outlook:`미국은 클라우드 컴퓨팅과 AI 모델 접근 권한에 대한 새로운 규제 법안을 서둘러 마련하여 기술 탈취를 차단하려 할 것입니다.`,
  sources:[{title:`중국, 미국 AI 우회 활용 국방용 훈련 논란 - Reuters`,url:`https://www.reuters.com`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`카카오와 LG유플러스 등 국내 주요 IT 통신 기업들이 AI 서비스 확장 등에 힘입어 2분기 역대 최대 실적을 일제히 달성했습니다.`,
  metrics:[`카카오 영업익 2,770억 원`,`LG유플러스 AIDC 2조 투자`],
  summary:`국내 대표 IT 및 통신 대기업들이 적극적인 인공지능 기술 투자를 바탕으로 눈부신 성장세를 기록하며 시장을 놀라게 했습니다. 카카오는 2분기 매출 2조 원을 가볍게 돌파하고 영업이익 2,770억 원을 기록하며 역대 최대 실적을 갱신했습니다. 특히 전 국민이 사용하는 카카오톡 내에 챗GPT를 연동하는 등 생활 밀착형 AI 서비스 확장이 실적 견인에 큰 효자 역할을 했습니다. 통신 강자 LG유플러스 역시 3,445억 원이라는 사상 최대 분기 영업이익을 발표하며 통신 본업과 AI 신사업의 완벽한 조화를 과시했습니다. 한발 더 나아가 LG유플러스는 미래 핵심 성장 동력 확보를 위해 외부 자금 조달 없이 자체 자본만으로 AIDC 인프라에 2조 원을 대거 투자하겠다는 공격적인 계획도 내놓았습니다. 한국 토종 IT 기업들이 차별화된 AI 기술력을 무기로 글로벌 경쟁력을 한층 강화하며 새로운 도약기를 맞고 있습니다.`,
  keyTerms:[{term:`AIDC`,explanation:`인공지능 서비스 구현에 필요한 엄청난 양의 데이터를 빠르고 효율적으로 처리하기 위해 고성능 서버와 냉각 시스템을 갖춘 특화된 첨단 데이터센터입니다.`}],
  history:`최근 1~2년간 생성형 AI 열풍이 불면서, 기존 플랫폼과 통신 인프라를 보유한 기업들이 AI를 결합해 수익 창출을 시도해 왔습니다.`,
  players:`AI 신사업을 주도하는 카카오, 네이버, 통신 3사 등 주요 IT 기업과 새로운 기술 환경의 혜택을 받는 소비자들이 참여자입니다.`,
  current:`막대한 투자 비용이 들던 AI 분야가 점차 실제 서비스로 안착하며 기업의 실질적인 이익 창출로 연결되는 본격적인 성과 창출 구간에 진입했습니다.`,
  outlook:`기업용 AI 솔루션 시장과 클라우드 인프라 주도권을 둘러싼 국내 기업들 간의 합종연횡과 투자 경쟁이 하반기에도 치열하게 전개될 전망입니다.`,
  sources:[{title:`카카오, LGU+ 2분기 역대 최대 실적...AI가 이끌었다 - 아이뉴스24`,url:`https://www.inews24.com`}]
}]

  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 증시 S&P 500 지수 사상 첫 7,700선 돌파와 반도체 주가 조정`,
  metrics:[`S&P 500 지수 7,700선`,`반도체 지수(SOXX) -21% 급락`],
  summary:`미국 S&P 500 지수가 사상 처음으로 7,700선을 돌파하며 올해만 25번째 최고치를 경신했습니다. 하지만 시장 내부에서는 AI 인프라 투자에 대한 거품 우려가 커지며 분위기가 엇갈리고 있습니다. 빅테크 기업들의 2분기 실적이 전년 대비 47% 급증했음에도 불구하고, 반도체 및 메모리 관련 주가는 7월 말부터 20% 이상 급락하며 조정 국면에 진입했습니다. 막대한 AI 인프라 투자 대비 실제 수익 창출이 더디다는 순환 거래 의혹이 확산되었기 때문입니다. 이에 따라 투자자들은 성장주에서 가치주로 눈을 돌리며 시장의 변동성을 키우고 있습니다.`,
  keyTerms:[{term:`순환 거래`,explanation:`기업들끼리 서로 제품이나 서비스를 사고팔아 장부상 매출만 부풀리고 실제 현금 흐름은 없는 거래 방식을 뜻합니다.`}],
  history:`2025년부터 생성형 AI 열풍으로 반도체 기업들의 주가가 천정부지로 치솟았습니다.`,
  players:`막대한 자본을 쏟아붓는 빅테크 기업들과 칩을 공급하는 기업, 그리고 월가 투자자들이 핵심 주체입니다.`,
  current:`AI 인프라 투자 붐이 1라운드를 지나면서 이제는 실제 수익성을 증명해야 하는 옥석 가리기 단계로 접어들었습니다.`,
  outlook:`빅테크 기업들의 하반기 실적 전망과 실질적인 AI 서비스 매출 발생 여부가 향후 주가 방향을 결정할 것입니다.`,
  sources:[{title:`미 증시 사상 최고치 속 AI 거품 우려 - Bilello Blog`,url:`https://bilello.blog/ai-bubble`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`모건스탠리, 2026년 한국 경제 성장률 전망치 3.4%로 대폭 상향 조정`,
  metrics:[`성장률 전망치 3.4%`,`기준금리 3.5% 도달 전망`],
  summary:`글로벌 투자은행 모건스탠리가 한국의 2026년 GDP 성장률 전망치를 기존 대비 0.6%포인트 높은 3.4%로 대폭 상향 조정했습니다. 이는 반도체 수출 호조뿐만 아니라 내수와 기타 제조업 분야까지 경기 온기가 퍼지고 있다는 분석에 기인합니다. 하지만 고성장세와 함께 물가 상승 압력도 동시에 커지면서 통화 정책의 딜레마가 깊어지고 있습니다. 시장 전문가들은 현재 연 2.75% 수준인 기준금리가 인상 압박을 강하게 받을 것으로 예측하고 있습니다. 특히 내년 초까지 기준금리가 3.5%에 도달할 수 있다는 전망까지 나오며 가계부채 부담 우려도 함께 커지는 상황입니다.`,
  keyTerms:[{term:`기준금리`,explanation:`한 나라의 중앙은행이 다른 금융기관과 거래할 때 기준이 되는 정책 금리로, 시중 은행 금리와 물가에 큰 영향을 미칩니다.`}],
  history:`한국 경제는 코로나19 팬데믹 이후 글로벌 공급망 재편과 반도체 사이클 부진으로 한동안 저성장을 겪어왔습니다.`,
  players:`금리 결정권을 쥔 한국은행 금융통화위원회와 경제 정책을 조율하는 기획재정부, 가계와 기업들이 영향을 받습니다.`,
  current:`수출과 내수가 동반 회복되는 긍정적 신호가 나타나고 있지만, 물가 불안과 대출 이자 부담 증가가 현실화되고 있습니다.`,
  outlook:`다가오는 한국은행 금융통화위원회의 통화정책 결정 방향과 국내 물가 지표 추이가 경제 전반의 핵심 변수가 될 전망입니다.`,
  sources:[{title:`한국 2026년 성장률 3.4% 전망 - FOEconomy`,url:`https://foeconomy.co.kr/kr-growth`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 근원 물가 3.3%로 고공행진하며 추가 금리 인상 가능성 대두`,
  metrics:[`미국 근원 물가(PCE) 3.3%`,`미 국채 10년물 금리 4.6%`],
  summary:`미국의 물가 상승세가 꺾이지 않으면서 글로벌 금융 시장에 다시 한번 긴장감이 감돌고 있습니다. 최신 발표에 따르면 미국의 근원 물가 상승률이 3.3%를 기록하며 연방준비제도의 목표치인 2%를 여전히 크게 웃돌고 있습니다. 이에 따라 시장에서는 당초 기대했던 금리 인하 대신 오히려 추가적인 금리 인상 가능성이 제기되고 있습니다. 긴축 장기화 우려를 반영하여 미국 국채 10년물 금리는 4.6% 선을 돌파하며 가파른 상승세를 보였습니다. 고금리 환경이 장기화될 조짐을 보이면서 신흥국 자본 유출과 기업들의 자금 조달 비용 증가 등 파장이 커지고 있습니다.`,
  keyTerms:[{term:`근원 물가`,explanation:`날씨나 국제 정세 등에 따라 가격 변동이 심한 농산물과 국제 유가 등을 제외하고 산출한 기초적인 물가 지수입니다.`}],
  history:`2022년 이후 미국 연방준비제도는 인플레이션을 잡기 위해 공격적인 긴축을 단행해왔으나 물가가 쉽게 떨어지지 않고 있습니다.`,
  players:`글로벌 금리의 향방을 쥐고 있는 미국 연방준비제도의 제롬 파월 의장과 위원들의 발언이 시장을 좌우합니다.`,
  current:`물가 지표가 예상치를 상회함에 따라 통화 완화 시점에 대한 시장의 기대가 급격히 식어버린 상태입니다.`,
  outlook:`향후 발표될 미국의 소비자물가지수와 고용 지표 결과에 따라 다음 정책 방향이 구체화될 것입니다.`,
  sources:[{title:`미국 근원 물가와 국채 금리 급등 - US Treasury`,url:`https://treasury.gov/pce-update`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`더불어민주당 전당대회 당대표 선거 정청래·김민석 오차범위 내 초접전`,
  metrics:[`당대표 지지율 오차범위 접전`,`개표소 시위 33일째`],
  summary:`오는 8월 17일 열리는 더불어민주당 전당대회를 앞두고 당대표 자리를 차지하기 위한 경쟁이 최고조에 달하고 있습니다. 최근 여론조사에서 정청래 후보와 김민석 후보가 오차범위 내에서 초접전을 벌이고 있는 것으로 나타났습니다. 이번 선거는 특정 계파 간의 주도권 싸움 양상으로 번지며 당내 갈등을 심화시키고 있습니다. 각 진영은 서로 자신이 당의 적통임을 내세우며 표심을 공략하고 있습니다. 한편 지난 지방선거 당시 발생한 투표용지 부족 사태를 규탄하는 개표소 봉쇄 시위가 33일 넘게 이어지며 정치권의 뇌관으로 작용하고 있습니다.`,
  keyTerms:[{term:`전당대회`,explanation:`정당의 전국의 대의원들이 모여 당의 대표나 핵심 지도부를 선출하고 중요한 정책을 결정하는 큰 회의입니다.`}],
  history:`민주당은 총선과 지방선거를 거치면서 세력 지형이 변화해왔으며, 다음 선거를 이끌 지도부 구성이 매우 중요해졌습니다.`,
  players:`당권을 노리는 주요 후보들과 이들의 배후에 있는 핵심 세력들이 치열하게 대립 중입니다.`,
  current:`선거 룰 해석과 대의원 투표 비율 등을 놓고 각 캠프 간의 신경전이 연일 언론을 장식하고 있습니다.`,
  outlook:`8월 17일 선거 결과에 따라 야당의 향후 대여 투쟁 노선과 역학 관계가 재편될 것으로 보입니다.`,
  sources:[{title:`민주당 전당대회 계파 갈등 - REITs Korea`,url:`https://reitskorea.co.kr/minju-election`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`이재명 대통령 미·남미 순방 귀국 및 쟁점 법안 공포로 정국 긴장`,
  metrics:[`대통령 지지율 47.8%`,`남미 무역협정 청신호`],
  summary:`이재명 대통령이 7박 11일간의 미국 및 남미 순방 일정을 마치고 귀국하며 본격적인 국내 정국 구상에 돌입했습니다. 순방을 통해 남미공동시장과의 무역협정 체결에 청신호가 켜지는 등 경제 외교 분야에서 유의미한 성과를 거두었습니다. 하지만 국무회의에서 검찰의 수사권과 기소권 분리를 골자로 하는 형사소송법 개정안을 원안대로 공포하면서 정치권에 파장이 일고 있습니다. 여당은 개혁 완수라며 환영한 반면 야당은 헌법소원 심판 청구를 예고하며 강하게 반발하고 있습니다. 이로 인해 소폭 하락한 대통령 지지율이 여야 대치 국면에서 어떤 흐름을 보일지 주목받고 있습니다.`,
  keyTerms:[{term:`공포`,explanation:`국회를 통과한 법률이 국민에게 효력을 발생할 수 있도록 대통령이 이를 공식적으로 알리고 확정짓는 절차입니다.`}],
  history:`검찰의 수사권과 기소권 분리 문제는 한국 정치의 해묵은 갈등 요인이자 핵심 개혁 과제 중 하나였습니다.`,
  players:`법안을 밀어붙인 여당과 대통령, 그리고 이에 반발하며 법적 대응을 준비 중인 야당이 첨예하게 대립하고 있습니다.`,
  current:`순방의 경제적 성과가 사법 개혁 갈등 이슈에 묻히면서 여야 간의 강대강 대치 정국이 형성되었습니다.`,
  outlook:`야당이 제기할 헌법소원의 진행 과정과 헌법재판소의 판단이 향후 정국의 가장 큰 분수령이 될 것입니다.`,

  history:`2022년 2월 러시아의 전면 침공으로 시작된 전쟁은 초기 예상과 달리 수년간 고착 상태에 빠져 있습니다.`,

  headline:`삼성전자, AI 데이터센터 전력 잡을 차세대 3D 메모리 zHBM 최초 공개`,
  metrics:[`데이터 대역폭 극대화`,`낸드 플래시 400단 돌파`],
  summary:`삼성전자가 폭발적으로 증가하는 인공지능 데이터센터의 전력 소모와 데이터 병목 현상을 해결할 혁신적인 기술을 선보였습니다. 미국에서 열린 반도체 행사에서 삼성전자는 세계 최초로 차세대 3D 메모리인 zHBM 기술을 공개했습니다. 이 기술은 가속기 칩 위에 메모리를 수직으로 직접 쌓아 올려 데이터 이동 거리를 크게 줄인 것이 특징입니다. 이를 통해 데이터 처리 속도는 비약적으로 끌어올리면서도 전력 소모는 획기적으로 낮출 수 있어 주목을 받았습니다. 아울러 세계 최초로 400단 이상을 쌓아 올린 초고적층 낸드 기술도 공개하며 경쟁력을 입증했습니다.`,
  keyTerms:[{term:`데이터 병목 현상`,explanation:`컴퓨터 부품 간에 데이터를 주고받을 때 통로가 좁거나 속도가 느려 전체적인 처리 속도가 지연되는 현상을 말합니다.`}],
  history:`AI 모델이 거대해짐에 따라 연산 장치와 기억 장치 사이를 오가는 데이터가 늘면서 기존 방식의 한계가 드러났습니다.`,
  players:`차세대 메모리 주도권을 쥐기 위해 글로벌 반도체 선두 기업들이 치열한 기술 경쟁을 벌이고 있습니다.`,
  current:`기존 칩을 평면에 나란히 배치하던 방식을 넘어 아파트처럼 위로 쌓아 올리는 패키징 기술이 떠올랐습니다.`,
  outlook:`엔비디아 등 주요 고객사들이 새로운 기술을 언제 실제 제품에 탑재할지가 향후 판도를 가를 전망입니다.`,

  headline:`오픈AI, 단돈 2천 달러 비용으로 10년 묵은 과학 난제 해결`,
  metrics:[`비용 2,000달러(약 270만원)`,`과학 난제 10가지 해결`],
  summary:`인공지능이 인간의 보조 도구를 넘어 스스로 복잡한 문제를 추론하고 풀어내는 수준으로 진화하고 있습니다. 챗GPT 개발사인 오픈AI의 최신 모델이 컴퓨터 과학 분야에서 10년 동안 풀리지 않던 난제 10가지를 완벽하게 해결해 과학계를 놀라게 했습니다. 더욱 충격적인 것은 이 엄청난 연구 성과를 도출하는 데 사용된 컴퓨팅 비용이 단 2,000달러에 불과했다는 점입니다. 전문가들은 이를 두고 AI가 스스로 목표를 설정하고 논리적 추론을 통해 임무를 완수하는 에이전틱 AI 시대로 진입했음을 알리는 신호탄이라고 평가하고 있습니다. 이 기술은 향후 신약 개발 등 혁명적인 변화를 이끌 것입니다.`,
  keyTerms:[{term:`에이전틱 AI`,explanation:`사람이 매번 지시하지 않아도 AI가 스스로 주변 상황을 파악하고 최적의 방법을 찾아 자율적으로 임무를 수행하는 인공지능입니다.`}],
  history:`초기 인공지능은 주어진 데이터를 학습하는 수준이었으나, 최근에는 논리적 단계를 밟아 답을 유추하는 능력을 갖추었습니다.`,
  players:`오픈AI를 필두로 글로벌 빅테크 기업들이 차세대 범용 인공지능 개발 경쟁을 주도하고 있습니다.`,
  current:`AI의 능력이 인간 전문가의 지적 노동을 대체할 수 있는 수준에 도달하면서 기술적 경이로움과 우려가 교차하고 있습니다.`,

  keyTerms:[{term:`구조조정`,explanation:`기업이 급변하는 경영 환경에 살아남기 위해 조직 규모를 줄이거나 사업 분야를 재편하는 등의 대대적인 체질 개선 작업을 뜻합니다.`}],
  history:`팬데믹 기간 동안 인력을 과도하게 늘렸던 기술 기업들이 엔데믹 이후 수익성 방어를 위해 인력을 감축해왔습니다.`,
  players:`인력 감축을 주도하는 글로벌 빅테크 기업 경영진과 해고의 불안에 떠는 평범한 IT 종사자들이 얽혀 있습니다.`,

  sources:[{title:`2026년 IT 업계 감원 폭풍 - Salesforce Ben`,url:`https://salesforceben.com/tech-layoffs-2026`}]

let current = null;
let currentCat = null;
const CAT_ORDER = ['경제', '정치', '기타 이슈'];

function renderSidebar() {
  const list = document.getElementById('date-list');
  list.innerHTML = '';
  BRIEFS.forEach((b, i) => {
    const el = document.createElement('div');
    el.className = 'date-item' + (i === 0 ? ' active' : '');
    el.dataset.tag = b.tag;
    const parts = b.tag.split('-');
    const short = parts[1] + '/' + parts[2];
    el.innerHTML = b.tag;
    el.addEventListener('click', () => showBrief(b.tag));
    list.appendChild(el);
  });
}

function showBrief(tag) {
  current = tag;
  document.querySelectorAll('.date-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tag === tag);
  });
  const brief = BRIEFS.find(b => b.tag === tag);
  if (!brief) return;

  // 카테고리별 그룹핑
  const grouped = {};
  brief.stories.forEach(s => {
    if (!grouped[s.category]) grouped[s.category] = [];
    grouped[s.category].push(s);
  });
  const availableCats = CAT_ORDER.filter(c => grouped[c] && grouped[c].length);
  if (!availableCats.length) return;

  // 기본 카테고리 결정
  if (!availableCats.includes(currentCat)) currentCat = availableCats[0];

  renderContent(brief, grouped, availableCats);
}

function renderContent(brief, grouped, availableCats) {
  const content = document.getElementById('content');
  let html = `<div class="sticky-top">
    <div class="brief-header">
      <div class="bh-eyebrow">Morning Brief</div>
      <h2>${brief.label}</h2>
    </div>`;

  // 탭
  html += '<div class="cat-tabs">';
  availableCats.forEach(c => {
    const cls = c === currentCat ? 'cat-tab active' : 'cat-tab';
    html += `<button class="${cls}" data-cat="${c}">${c}</button>`;
  });
  html += '</div></div>';

  // 선택된 카테고리 기사들
  const stories = grouped[currentCat] || [];
  stories.forEach((s, idx) => {
    if (idx > 0) html += '<hr class="story-divider">';
    html += `<div class="story">
      <div class="story-top">
        <div class="story-headline">${s.headline}</div>
      </div>`;
    if (s.metrics.length) {
      html += '<div class="metrics">';
      s.metrics.forEach(m => { html += `<div class="metric-chip">${m}</div>`; });
      html += '</div>';
    }
    // 요약문에 핵심 개념 밑줄 (출력은 박스 다음)
    let summaryHtml = s.summary;
    if (s.keyTerms && s.keyTerms.length) {
      s.keyTerms.forEach(kt => {
        if (!kt.term) return;
        const safe = kt.term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp(safe, 'g');
        summaryHtml = summaryHtml.replace(re, `<span class="kt-underline">${kt.term}</span>`);
      });
    }

    // 핵심 개념 박스 (요약 위)
    if (s.keyTerms && s.keyTerms.length) {
      html += '<div class="key-terms"><div class="key-terms-title">핵심 개념</div>';
      s.keyTerms.forEach(kt => {
        html += `<div class="kt-item">
          <span class="kt-term">${kt.term}</span>
          <span class="kt-exp">${kt.explanation}</span>
        </div>`;
      });
      html += '</div>';
    }

    html += `<div class="summary">${summaryHtml}</div>`;

    const bgSections = [
      ['역사적 맥락', s.history],
      ['핵심 플레이어', s.players],
      ['현재 구도', s.current],
      ['향후 전망', s.outlook],
    ].filter(([, v]) => v);

    if (bgSections.length) {
      html += '<div class="bg-box"><div class="bg-box-title">배경 스토리</div>';
      bgSections.forEach(([label, text]) => {
        html += `<div class="bg-section">
          <div class="bg-section-label">${label}</div>
          <div class="bg-section-text">${text}</div>
        </div>`;
      });
      html += '</div>';
    }

    if (s.sources.length) {
      html += `<button class="sources-toggle" data-toggle="srcs-${idx}">출처 ${s.sources.length}개 보기 <span class="arrow">▾</span></button>`;
      html += `<div class="sources-body" id="srcs-${idx}">`;
      s.sources.forEach((src, si) => {
        html += `<div class="source-item">
          <span class="src-num">${si+1}</span>
          <a href="${src.url}" target="_blank">${src.title}</a>
        </div>`;
      });
      html += '</div>';
    }
    html += '</div>';
  });

  content.innerHTML = html;

  // 탭 클릭 핸들러
  content.querySelectorAll('.cat-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentCat = btn.dataset.cat;
      renderContent(brief, grouped, availableCats);
    });
  });

  // 출처 토글
  content.querySelectorAll('.sources-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const body = document.getElementById(btn.dataset.toggle);
      const isOpen = body.classList.toggle('open');
      btn.classList.toggle('open', isOpen);
    });
  });

  document.getElementById('main').scrollTop = 0;
}

if (BRIEFS.length > 0) {
  renderSidebar();
  showBrief(BRIEFS[0].tag);
} else {
  document.getElementById('content').innerHTML = '<div class="empty">브리핑 데이터가 없습니다.</div>';
}

// ── Quiz Gate ──
const PASS_TARGET = 3;
let correctCount = 0;
const usedIndexes = new Set();

function pickQuestion() {
  // 사용 안 한 문제 중 랜덤. 다 썼으면 풀 리셋
  if (usedIndexes.size >= QUIZ.length) usedIndexes.clear();
  let idx;
  do { idx = Math.floor(Math.random() * QUIZ.length); } while (usedIndexes.has(idx));
  usedIndexes.add(idx);
  return QUIZ[idx];
}

function updateCounter() {
  document.getElementById('quiz-counter').textContent = `(${correctCount}/${PASS_TARGET})`;
}

function renderQuiz() {
  const q = pickQuestion();
  document.getElementById('quiz-q').textContent = q.q;
  updateCounter();
  const feedback = document.getElementById('quiz-feedback');
  feedback.textContent = '';
  feedback.className = 'quiz-feedback';
  const closeBtn = document.getElementById('quiz-close');
  closeBtn.classList.add('hidden');

  const choicesEl = document.getElementById('quiz-choices');
  choicesEl.innerHTML = '';
  // 보기 순서 섞기 (정답 위치 고정 방지)
  const order = q.a.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  order.forEach(idx => {
    const text = q.a[idx];
    const btn = document.createElement('button');
    btn.className = 'quiz-choice';
    btn.textContent = text;
    btn.addEventListener('click', () => {
      const allBtns = choicesEl.querySelectorAll('.quiz-choice');
      allBtns.forEach(b => b.disabled = true);
      if (idx === q.correct) {
        btn.classList.add('correct');
        correctCount++;
        updateCounter();
        if (correctCount >= PASS_TARGET) {
          feedback.textContent = '통과! 들어와도 좋아.';
          feedback.className = 'quiz-feedback right';
          closeBtn.classList.remove('hidden');
        } else {
          feedback.textContent = '역시 맞출 줄 알았어. 다음 문제 고.';
          feedback.className = 'quiz-feedback right';
          btn.blur();
          setTimeout(() => {
            if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
            renderQuiz();
          }, 900);
        }
      } else {
        btn.classList.add('wrong');
        feedback.textContent = '정말 실망이다.... 다음.';
        feedback.className = 'quiz-feedback wrong';
        btn.blur();
        setTimeout(() => {
          if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
          renderQuiz();
        }, 900);
      }
    });
    choicesEl.appendChild(btn);
  });
}

document.getElementById('quiz-close').addEventListener('click', () => {
  document.getElementById('quiz-overlay').classList.add('hidden');
  document.body.classList.remove('quiz-active');
});

document.body.classList.add('quiz-active');
renderQuiz();

// ── Mobile sidebar toggle ──
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('sidebar-backdrop');
function toggleSidebar(open) {
  sidebar.classList.toggle('open', open);
  backdrop.classList.toggle('open', open);
}
document.getElementById('sidebar-toggle').addEventListener('click', () => toggleSidebar(!sidebar.classList.contains('open')));
backdrop.addEventListener('click', () => toggleSidebar(false));
// 날짜 클릭하면 모바일에서 자동으로 닫히게
sidebar.addEventListener('click', e => {
  if (e.target.classList.contains('date-item') && window.innerWidth <= 768) {
    toggleSidebar(false);
  }
});

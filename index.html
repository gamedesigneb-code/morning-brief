<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모닝 브리핑</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --sidebar-w: 240px;
    --bg: #FAFAF7;
    --paper: #FFFFFF;
    --accent: #6B7A8F;
    --accent-soft: #E8ECEF;
    --line: #EAE8E3;
    --line-strong: #D8D5CE;
    --text: #2D2A26;
    --text-mid: #6B655D;
    --text-sub: #A09889;
    --radius: 10px;
  }
  html, body {
    height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 15px; line-height: 1.65; font-weight: 400;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }

  /* ── Layout ── */
  #app { display: flex; height: 100vh; overflow: hidden; }

  /* ── Sidebar ── */
  #sidebar {
    width: var(--sidebar-w); flex-shrink: 0;
    background: var(--bg); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #sidebar-header {
    padding: 36px 20px 24px;
    border-bottom: 1px solid var(--line);
    text-align: center;
  }
  #sidebar-header h1 {
    font-size: 19px; font-weight: 700; color: var(--text);
    letter-spacing: -0.4px; line-height: 1.3;
  }
  #sidebar-header p {
    font-size: 12px; color: var(--text-sub); margin-top: 6px;
    letter-spacing: 0.3px;
  }
  #date-list { overflow-y: auto; flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
  .date-item {
    padding: 11px 14px; cursor: pointer; border-radius: 8px;
    transition: background 0.15s, color 0.15s;
    background: transparent;
    text-align: center; font-size: 13px; font-weight: 500; color: var(--text-mid);
    letter-spacing: 0.1px;
  }
  .date-item:hover { background: var(--accent-soft); color: var(--text); }
  .date-item.active {
    background: var(--accent-soft); color: var(--text); font-weight: 600;
  }

  /* ── Main ── */
  #main { flex: 1; overflow-y: auto; background: var(--paper); }
  #content { max-width: 760px; margin: 0 auto; padding: 56px 40px 80px; }

  .brief-header { margin-bottom: 36px; }
  .brief-header .bh-eyebrow {
    font-size: 11px; color: var(--text-sub); margin-bottom: 8px;
    letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500;
  }
  .brief-header h2 {
    font-size: 30px; font-weight: 700; letter-spacing: -0.7px;
    color: var(--text); line-height: 1.25;
  }

  /* ── Sticky Top (header + tabs) ── */
  .sticky-top {
    position: sticky; top: 0;
    background: var(--paper); z-index: 20;
    padding-top: 56px; margin-top: -56px;
  }
  .sticky-top .brief-header { margin-bottom: 24px; }

  /* ── Category Tabs ── */
  .cat-tabs {
    display: flex; gap: 0; margin-bottom: 36px;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
  }
  .cat-tab {
    padding: 12px 20px 14px; cursor: pointer; font-size: 14px; font-weight: 500;
    color: var(--text-sub); border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    background: none; border-top: none; border-left: none; border-right: none;
    font-family: inherit; letter-spacing: -0.1px;
    margin-bottom: -1px;
  }
  .cat-tab:hover { color: var(--text-mid); }
  .cat-tab.active { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }

  /* ── Sources (collapsible) ── */
  .sources-toggle {
    background: transparent; border: 1px solid var(--line-strong);
    padding: 8px 14px; border-radius: 6px; font-size: 12.5px; font-weight: 500;
    color: var(--text-mid); cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    font-family: inherit; margin-top: 12px;
    transition: background 0.15s, border-color 0.15s;
  }
  .sources-toggle:hover { background: var(--accent-soft); border-color: var(--accent); }
  .sources-toggle .arrow { transition: transform 0.2s; font-size: 9px; color: var(--text-sub); }
  .sources-toggle.open .arrow { transform: rotate(180deg); }
  .sources-body { display: none; margin-top: 12px; padding-left: 4px; }
  .sources-body.open { display: block; }

  /* ── Story Card ── */
  .story { margin-bottom: 40px; }
  .story-top { margin-bottom: 18px; }
  .story-headline {
    font-size: 19px; font-weight: 700; line-height: 1.45;
    letter-spacing: -0.4px; color: var(--text);
  }

  .metrics { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .metric-chip {
    background: var(--accent-soft); border: none;
    border-radius: 6px; padding: 7px 12px;
    font-size: 12.5px; font-weight: 500; color: var(--text-mid);
    line-height: 1.4;
  }

  .summary {
    font-size: 15px; line-height: 1.8; color: var(--text); margin-bottom: 20px;
    letter-spacing: -0.1px;
  }
  .summary .kt-underline {
    color: #1996BD;
    text-decoration: underline;
    text-decoration-color: #1996BD;
    text-decoration-thickness: 1.5px;
    text-underline-offset: 3px;
    cursor: help;
  }

  /* ── Key Terms Box ── */
  .key-terms {
    background: #F4F1EA; border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius); padding: 18px 22px; margin-bottom: 14px;
  }
  .key-terms-title {
    font-size: 11px; font-weight: 600; color: var(--text-sub);
    text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 14px;
  }
  .kt-item { margin-bottom: 12px; }
  .kt-item:last-child { margin-bottom: 0; }
  .kt-term {
    font-size: 13.5px; font-weight: 700; color: #1996BD;
    margin-bottom: 4px; display: block;
    letter-spacing: -0.1px;
  }
  .kt-exp {
    font-size: 13.5px; line-height: 1.7; color: var(--text-mid);
  }

  /* ── Background ── */
  .bg-box {
    background: var(--bg); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 22px 24px; margin-bottom: 14px;
  }
  .bg-box-title {
    font-size: 11px; font-weight: 600; color: var(--text-sub);
    text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 16px;
  }
  .bg-section { margin-bottom: 16px; }
  .bg-section:last-child { margin-bottom: 0; }
  .bg-section-label {
    font-size: 12.5px; font-weight: 600; color: var(--text); margin-bottom: 6px;
    letter-spacing: -0.1px;
  }
  .bg-section-text { font-size: 14px; line-height: 1.75; color: var(--text-mid); }

  /* ── Sources ── */
  .source-item {
    display: flex; align-items: flex-start; gap: 10px;
    margin-bottom: 8px; font-size: 13px;
  }
  .src-num {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent-soft); color: var(--text-mid);
    font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .source-item a { color: var(--text-mid); text-decoration: none; line-height: 1.55; }
  .source-item a:hover { color: var(--text); text-decoration: underline; }

  .story-divider { border: none; border-top: 1px solid var(--line); margin: 36px 0; }

  .empty { color: var(--text-sub); font-size: 14px; padding: 60px 0; text-align: center; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }

  /* ── Mobile Toggle ── */
  #sidebar-toggle {
    display: none;
    position: fixed; top: 14px; left: 14px; z-index: 50;
    background: var(--paper); border: 1px solid var(--line-strong);
    width: 40px; height: 40px; border-radius: 10px;
    cursor: pointer; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(45, 42, 38, 0.08);
  }
  #sidebar-toggle span {
    display: block; width: 18px; height: 2px; background: var(--text);
    position: relative;
  }
  #sidebar-toggle span::before,
  #sidebar-toggle span::after {
    content: ''; position: absolute; left: 0; width: 18px; height: 2px; background: var(--text);
  }
  #sidebar-toggle span::before { top: -6px; }
  #sidebar-toggle span::after { top: 6px; }

  #sidebar-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(45, 42, 38, 0.4); z-index: 40;
  }
  #sidebar-backdrop.open { display: block; }

  /* ── Mobile Responsive ── */
  @media (max-width: 768px) {
    #sidebar-toggle { display: flex; }
    #sidebar {
      position: fixed; left: 0; top: 0; bottom: 0;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      z-index: 45; width: 260px;
      box-shadow: 0 0 24px rgba(45, 42, 38, 0.12);
    }
    #sidebar.open { transform: translateX(0); }

    #content { padding: 64px 20px 60px; max-width: 100%; }
    .brief-header h2 { font-size: 22px; }
    .story-headline { font-size: 16px; }
    .summary { font-size: 14.5px; line-height: 1.75; }
    .bg-section-text { font-size: 13.5px; }
    .metric-chip { font-size: 12px; padding: 6px 10px; }
    .bg-box { padding: 18px 18px; }
    .cat-tab { padding: 11px 14px; font-size: 13.5px; }

    .quiz-card { padding: 28px 24px 24px; }
    .quiz-q { font-size: 17px; }
    .quiz-choice { font-size: 14px; padding: 13px 16px; }
  }

  /* ── Quiz Overlay ── */
  body.quiz-active #app {
    filter: blur(6px) saturate(0.85);
    pointer-events: none;
    transition: filter 0.3s ease;
  }
  #quiz-overlay {
    position: fixed; inset: 0;
    background-color: rgba(250, 250, 247, 0.55);
    background-image:
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0) 0,
        rgba(255,255,255,0) 5px,
        rgba(45,42,38,0.04) 5px,
        rgba(45,42,38,0.04) 6px
      ),
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0) 0,
        rgba(255,255,255,0) 22px,
        rgba(45,42,38,0.025) 22px,
        rgba(45,42,38,0.025) 23px
      );
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 24px;
  }
  #quiz-overlay.hidden { display: none; }

  .quiz-card {
    background: var(--paper); border-radius: 16px;
    padding: 36px 36px 32px; width: 100%; max-width: 440px;
    box-shadow: 0 16px 48px rgba(45, 42, 38, 0.18);
  }
  .quiz-eyebrow {
    font-size: 11px; color: var(--text-sub); letter-spacing: 1.5px;
    text-transform: uppercase; font-weight: 500; margin-bottom: 12px;
  }
  .quiz-q {
    font-size: 19px; font-weight: 700; color: var(--text);
    line-height: 1.5; letter-spacing: -0.3px; margin-bottom: 24px;
  }
  .quiz-choices { display: flex; flex-direction: column; gap: 8px; }
  .quiz-choice {
    background: var(--paper); border: 1px solid var(--line-strong);
    padding: 14px 18px; border-radius: 10px; font-size: 14.5px; font-weight: 500;
    color: var(--text); cursor: pointer; text-align: left;
    font-family: inherit; transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .quiz-choice:focus { outline: none; }
  .quiz-choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) {
    .quiz-choice:hover { background: var(--accent-soft); border-color: var(--accent); }
  }
  .quiz-choice:active { transform: scale(0.99); }
  .quiz-choice.wrong {
    background: #F5E6E0; border-color: #C9947F; color: #8A4A30;
    animation: shake 0.4s ease;
  }
  .quiz-choice.correct {
    background: #E3EDE2; border-color: #7A9077; color: #2E4A2C;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .quiz-feedback {
    margin-top: 20px; text-align: center; font-size: 14px; font-weight: 500;
    color: var(--text-mid); min-height: 22px;
  }
  .quiz-feedback.right { color: #2E4A2C; }
  .quiz-feedback.wrong { color: #8A4A30; }

  .quiz-close-btn {
    margin-top: 18px; width: 100%;
    background: var(--text); color: var(--paper); border: none;
    padding: 13px 20px; border-radius: 10px; font-size: 14px; font-weight: 600;
    font-family: inherit; cursor: pointer;
    transition: background 0.15s;
  }
  .quiz-close-btn:hover { background: #1a1815; }
  .quiz-close-btn.hidden { display: none; }
</style>
</head>
<body>
<div id="quiz-overlay">
  <div class="quiz-card">
    <div class="quiz-eyebrow"><span>잠깐, 나에 대해서 잘 알지?</span> <span id="quiz-counter">(0/3)</span></div>
    <div class="quiz-q" id="quiz-q"></div>
    <div class="quiz-choices" id="quiz-choices"></div>
    <div class="quiz-feedback" id="quiz-feedback"></div>
    <button class="quiz-close-btn hidden" id="quiz-close">닫기</button>
  </div>
</div>

<button id="sidebar-toggle" aria-label="메뉴"><span></span></button>
<div id="sidebar-backdrop"></div>

<div id="app">
  <nav id="sidebar">
    <div id="sidebar-header">
      <h1>모닝 브리핑</h1>
      <p>일별 세계 뉴스 요약</p>
    </div>

    <div id="date-list"></div>
  </nav>
  <main id="main">
    <div id="content"></div>
  </main>
</div>

<script>
const BRIEFS = [{
  tag:`2026-10-11`,
  label:`2026년 10월 11일 (일)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국은행, 기준금리 연 3.00%로 3회 연속 동결 결정`,
  metrics:[`기준금리 3.00%`,`원/달러 환율 1,340원대`],
  summary:`한국은행 금융통화위원회가 10월 통화정책방향 회의에서 기준금리를 연 3.00%로 3회 연속 동결했습니다. 물가 상승률이 목표치에 근접하고 있으나, 최근 급등한 가계부채와 부동산 시장의 불안정성을 고려한 결정으로 풀이됩니다. 특히 글로벌 달러 강세에 따른 원/달러 환율 상승 압력도 금리 인하를 지연시키는 요인으로 작용했습니다. 전문가들은 당분간 매파적 동결 기조가 유지될 것으로 내다보고 있습니다. 현재 시장은 연말까지 추가 금리 변동 없이 3%대를 유지할 것으로 전망하고 있습니다. 한은은 반도체 수출 등 실물 경제 지표의 회복세를 예의주시하며 통화정책을 운용할 계획입니다. 이번 결정으로 대출자들의 이자 부담은 당분간 계속될 것으로 보입니다.`,
  keyTerms:[{term:`매파적 동결`,explanation:`금리를 올리지 않고 그대로 유지하면서도, 물가 안정 등을 위해 언제든 다시 금리를 올리거나 높은 수준을 오래 유지하겠다는 강경한 태도를 뜻합니다.`}],
  history:`2024년 하반기부터 이어진 글로벌 금리 인하 기대감 속에서도 한국은행은 가계부채 억제를 위해 신중한 입장을 취해왔습니다. 2026년에 접어들면서 물가 상승세는 둔화되었으나 부동산 가격이 다시 불안해졌습니다.`,
  players:`이창용 총재를 비롯한 금융통화위원회 위원들과 금리 인하를 기대했던 주식 및 부동산 시장 참여자들이 주요 행위자입니다. 정부 또한 거시경제 안정을 위해 한은의 결정에 주목하고 있습니다.`,
  current:`가계대출 증가세가 꺾이지 않으면서 한국은행은 섣부른 금리 인하가 자산 시장 거품을 키울 수 있다고 판단했습니다.`,
  outlook:`다음 금통위 회의까지 국내 가계부채 지표와 미국 연방준비제도의 금리 결정 등 대내외 거시경제 흐름이 가장 중요한 변수가 될 것입니다.`,
  sources:[{title:`한은 기준금리 3% 3연속 동결... 가계부채 우려 - 한국경제`,url:`https://www.hankyung.com/economy/article/202610101234`},{title:`물가 잡혔지만 집값이 발목, 연말까지 금리 유지 유력 - 연합뉴스`,url:`https://www.yna.co.kr/view/AKR20261010012345`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 나스닥 2만 7,400선 돌파하며 사상 최고치 경신, 미 국채 10년물 5.34% 급등`,
  metrics:[`나스닥 27,400선 돌파`,`미 10년물 국채 5.34%`],
  summary:`미국 뉴욕 증시에서 나스닥 지수가 2만 7,400선을 돌파하며 사상 최고치를 경신했습니다. 인공지능 관련 대형 기술주들의 실적 호조가 지수 상승을 강력하게 견인했습니다. 반면, 미국 10년물 국채금리는 24년 만에 최고치인 5.34%까지 급등하며 주식 시장과 채권 시장의 엇갈린 흐름이 두드러지고 있습니다. 이러한 국채금리의 급등은 인플레이션이 쉽게 꺾이지 않을 것이라는 시장의 스태그플레이션 우려를 반영합니다. 금리 상승에도 불구하고 기술주 중심의 자금 쏠림 현상이 계속되면서 증시의 나홀로 질주가 나타나는 중입니다. 향후 연방준비제도의 통화정책 방향에 대한 투자자들의 불안감은 여전히 남아있습니다. 시장은 다가오는 주요 기업들의 4분기 실적 전망 발표에 촉각을 곤두세우고 있습니다.`,
  keyTerms:[{term:`스태그플레이션`,explanation:`경제 성장이 멈추거나 침체하는 상황 속에서도 물가가 계속 오르는 현상을 의미합니다.`}],
  history:`미국 경제는 팬데믹 이후 지속적인 고금리 환경에서도 예상보다 강한 소비와 고용을 바탕으로 이례적인 성장세를 보여왔습니다.`,
  players:`미국 연방준비제도 제롬 파월 의장과 대형 기술주 랠리를 주도하는 글로벌 기관 투자자들이 핵심 행위자입니다.`,
  current:`물가 상승 압력이 여전한 가운데, 주식 시장은 인공지능 산업의 미래 가치에 베팅하며 채권 시장의 경고를 무시하는 양상입니다.`,
  outlook:`다가오는 물가 지표 발표와 연방준비제도 인사들의 발언에 따라 증시의 변동성이 단기적으로 크게 확대될 수 있습니다.`,
  sources:[{title:`나스닥 27,400 사상 최고치... 미 국채금리 5.3% 돌파 - 한국경제`,url:`https://www.hankyung.com/international/article/202610105678`},{title:`빅테크 질주에 가려진 스태그플레이션 그림자 - 매일경제`,url:`https://www.mk.co.kr/news/world/11234567`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`퇴직연금 실물이전 전면 시행 후 16조 원 이동, 자금 이동 가속`,
  metrics:[`이전 규모 16조 원`,`증권사 유입 5조 원`],
  summary:`퇴직연금 실물이전 제도가 전면 시행된 지 약 1년 8개월 만에 대규모 자금 이동이 발생하고 있습니다. 기존 은행권에 머물러 있던 퇴직연금 자금 중 16조 원 이상이 다른 금융기관으로 이동하는 머니무브 현상이 확인되었습니다. 특히 높은 수익률을 좇아 증권사로 유입된 자금만 5조 원을 넘어서며, 투자자들의 위험 자산 선호가 뚜렷해지고 있습니다. 이는 가입자가 기존 투자 상품을 팔지 않고도 사업자를 쉽게 바꿀 수 있는 실물이전 제도의 편의성 때문입니다. 금융사들은 고객 유치를 위해 파격적인 수수료 인하와 다양한 상품 라인업을 앞세워 치열한 점유율 경쟁을 벌이고 있습니다. 시장은 수익률을 무기로 내세운 증권사의 약진과 은행권의 방어 전략이 충돌하며 더욱 뜨거워질 전망입니다. 연말 정산 시즌을 앞두고 이러한 자금 이동 폭은 더 커질 것으로 예상됩니다.`,
  keyTerms:[{term:`실물이전 제도`,explanation:`퇴직연금 계좌를 다른 금융회사로 옮길 때, 기존에 투자하던 금융상품을 환매하지 않고 그 상태 그대로 넘길 수 있게 해주는 제도입니다.`}],
  history:`과거 퇴직연금 가입자들은 금융사를 바꾸려면 기존 상품을 강제로 팔아 현금화해야 했기 때문에 손실 우려로 자금 이동을 꺼렸습니다.`,
  players:`고객 이탈을 막으려는 시중 은행과 공격적으로 가입자를 유치하려는 주요 증권사들이 치열한 경쟁을 벌이고 있습니다.`,
  current:`주식 시장 활황과 상장지수펀드 투자 열풍이 맞물리면서, 더 높은 수익을 원하는 가입자들의 연금 계좌 이동이 폭발적으로 늘고 있습니다.`,
  outlook:`연말 세액공제를 노린 추가 납입 시기와 맞물려 금융권의 퇴직연금 유치 마케팅 전쟁은 올 겨울 최고조에 달할 것입니다.`,
  sources:[{title:`퇴직연금 실물이전 16조 훌쩍... 은행서 증권으로 머니무브 - 동아일보`,url:`https://www.donga.com/news/Economy/article/all/20261010/12345`},{title:`수익률 찾아 삼만리, 증권사 연금계좌 가입자 껑충 - 파이낸셜뉴스`,url:`https://www.fnnews.com/news/2026101098765`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`법사위 국정감사 파행, 사법부 독립성 및 선관위 부실 관리 의혹 정면충돌`,
  metrics:[`증인 채택 150여 명`,`국감 파행 3일째`],
  summary:`제22대 국회 마지막 국정감사가 중반으로 접어든 가운데, 법제사법위원회를 비롯한 주요 상임위에서 여야의 정면충돌이 벌어졌습니다. 특히 대법원장이 대법관 제청 과정의 외부 관여 논란에 대해 위헌적 행태라고 발언하면서 정국이 급속도로 얼어붙었습니다. 야당은 정부의 사법부 장악 시도라며 강하게 반발했고, 여당은 지난 지방선거 당시 선관위의 관리 부실 의혹을 집중 제기하며 맞불을 놨습니다. 이로 인해 상임위 회의가 정회되는 등 국감 파행이 3일째 이어지고 있습니다. 핵심 쟁점마다 서로 다른 프레임 전쟁을 벌이며 민생 현안은 뒷전으로 밀려났다는 비판이 나옵니다. 여야 원내대표가 중재에 나섰으나 입장 차이가 너무 커 돌파구 마련이 쉽지 않은 상황입니다. 당분간 국회는 양측의 강 대 강 대치가 지속될 것으로 보입니다.`,
  keyTerms:[{term:`프레임 전쟁`,explanation:`어떤 정치적 이슈에 대해 자신들에게 유리한 관점으로 대중이 사건을 바라보도록 여론을 주도하려는 정치권의 치열한 싸움을 뜻합니다.`}],
  history:`최근 몇 년간 법관 인사와 선거 관리 위원회의 중립성을 둘러싼 여야의 갈등은 선거 때마다 반복되어 온 해묵은 과제입니다.`,
  players:`정부와 여당 지도부, 이를 견제하려는 제1야당 지도부, 그리고 사법부와 선거관리위원회 주요 인사들이 핵심 인물들입니다.`,
  current:`각종 쟁점 법안 처리와 다가오는 내년 재보궐 선거의 주도권을 잡기 위해 양측 모두 한 치의 물러섬 없는 기싸움을 벌이고 있습니다.`,
  outlook:`이번 국정감사가 끝날 때까지 여야 간 고발전과 장외 여론전이 격화될 가능성이 높으며, 핵심 민생 법안의 연내 처리 여부가 불투명해졌습니다.`,
  sources:[{title:`대법원장 발언에 발칵 뒤집힌 법사위... 3일째 개점휴업 - 경향신문`,url:`https://www.khan.co.kr/politics/assembly/article/202610101111`},{title:`여야, 선관위·사법부 의혹 놓고 네 탓 공방전 치열 - YTN`,url:`https://www.ytn.co.kr/_ln/0101_202610102222`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`알시시 이집트 대통령 국빈 방한, 한-이집트 인프라 및 방산 협력 강화`,
  metrics:[`투자의향서 30억 달러`,`신규 협의체 2개 신설`],
  summary:`알시시 이집트 대통령이 10일 국빈 방한하여 한-이집트 정상회담을 성공적으로 마쳤습니다. 양국 정상은 방위산업, 원자력 발전, 인프라 등 핵심 산업 분야에서 포괄적 협력을 강화하는 내용의 양해각서를 다수 체결했습니다. 특히 K-9 자주포의 추가 수출과 이집트 수에즈 운하 주변의 대규모 친환경 에너지 인프라 구축 프로젝트가 심도 있게 논의되었습니다. 이는 중동 및 아프리카 지역 진출의 교두보를 마련하려는 한국의 세일즈 외교 전략과 정확히 일치합니다. 이번 회담을 통해 약 30억 달러 규모의 경제 협력 프로젝트가 가시화되면서 국내 기업들의 기대감이 커지고 있습니다. 양국은 글로벌 공급망 불안에 공동 대응하기 위한 상설 협의체도 신설하기로 합의했습니다. 향후 수개월 내에 세부 계약 체결을 위한 양국 실무진의 교차 방문이 본격적으로 이어질 예정입니다.`,
  keyTerms:[{term:`세일즈 외교`,explanation:`국가의 수장이나 정부 고위급 인사가 직접 나서서 자국 기업의 해외 진출이나 수출, 대규모 투자 유치 등을 돕기 위해 벌이는 외교 활동입니다.`}],
  history:`한국과 이집트는 1995년 수교 이후 꾸준히 협력해왔으며, 최근 아프리카 대륙 내 최대 교역국으로 떠오른 이집트와의 경제 교류가 급증하고 있습니다.`,
  players:`대한민국 대통령과 이집트 알시시 대통령을 비롯해, 중동 지역 대형 프로젝트 수주를 노리는 한국의 주요 방산, 건설 대기업들이 참여하고 있습니다.`,
  current:`글로벌 공급망 재편 속에서 이집트는 첨단 인프라 확충이 필요하고, 한국은 새로운 해외 수출 활로가 절실한 상황이 맞아떨어졌습니다.`,
  outlook:`내년 초 예정된 양국 장관급 경제 공동위원회를 통해 구체적인 기업 간 계약 소식이 연이어 발표될 것으로 기대됩니다.`,
  sources:[{title:`한·이집트 정상회담, 방산·인프라 30억 달러 협력 가시화 - 조선일보`,url:`https://www.chosun.com/politics/diplomacy/2026/10/10/1234/`},{title:`아프리카 교두보 넓히는 세일즈 외교, 수에즈 프로젝트 참여 논의 - 중앙일보`,url:`https://www.joongang.co.kr/article/202610103333`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 11월 중간선거 한 달 앞으로, 여야 초박빙 속 유권자 표심 흔들기 총력`,
  metrics:[`초박빙 경합 선거구 25곳`,`사전투표율 역대 최고 18%`],
  summary:`미국 11월 중간선거를 약 한 달 앞두고 공화당과 민주당의 유세전이 그 어느 때보다 극에 달하고 있습니다. 트럼프 전 대통령을 앞세운 공화당은 현 행정부의 경제 실정을 집중적으로 부각하며 스윙 보터 표심 잡기에 총력을 기울이고 있습니다. 반면 하원의 다수당 지위를 수성하려는 민주당은 낙태권 보장과 민주주의 가치 수호를 내세우며 전통적 지지층 결집에 나섰습니다. 특히 25곳에 달하는 초박빙 경합주의 여론조사 결과가 매일 엎치락뒤치락하며 전체 판세를 예측하기 매우 어려운 상황입니다. 미국의 정치적 불확실성이 커지면서 한국을 비롯한 동맹국들은 선거 결과가 통상 정책에 미칠 파장을 조심스럽게 예의주시하고 있습니다. 현재 사전투표가 시작된 주에서는 유권자 참여율이 동기 대비 역대 최고치를 경신 중입니다. 선거 막판까지 양당의 네거티브 공세와 돌발적인 정치 변수가 승패를 가를 핵심 요인으로 지목됩니다.`,
  keyTerms:[{term:`스윙 보터`,explanation:`어느 특정 정당이나 정치인에게 투표할지 굳게 정하지 않고, 선거 당시의 이슈나 상황에 따라 투표 대상을 바꾸는 부동층 유권자를 뜻합니다.`}],
  history:`미국의 중간선거는 현직 대통령의 임기 중간에 치러져 행정부 국정 운영에 대한 중간 평가 성격을 지니며, 권력의 균형을 결정짓는 중요한 선거입니다.`,
  players:`현직 행정부를 방어하는 민주당 지도부와 의회 주도권 탈환을 노리는 트럼프 전 대통령 및 공화당 핵심 인사들이 대결의 주축입니다.`,
  current:`유권자들은 물가 상승 등 경제 문제와 낙태권 같은 이념적 가치 사이에서 팽팽하게 양분되어 있어 결과를 쉽게 예측할 수 없습니다.`,
  outlook:`11월 선거 결과에 따라 향후 2년간 미국 행정부의 입법 추진력이 크게 달라지며, 이는 대외 관세 정책과 외교 노선에도 직접적인 영향을 줄 것입니다.`,
  sources:[{title:`미 중간선거 D-30, 경합주 25곳 여론조사 초박빙 - 연합뉴스`,url:`https://www.yna.co.kr/view/AKR202610105555`},{title:`경제냐 가치냐, 미 유권자 사전투표율 역대 최고 수준 - SBS 뉴스`,url:`https://news.sbs.co.kr/news/endPage.do?news_id=N100202610`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`오픈AI 등 글로벌 빅테크, 차세대 '범용 인공지능(AGI)' 기술 상용화 선언`,
  metrics:[`글로벌 도입 기업 45% 증가`,`관련 산업 투자 2,000억 달러 전망`],
  summary:`오픈AI와 구글을 비롯한 글로벌 빅테크 기업들이 스스로 추론하고 복합적인 문제를 해결하는 범용 인공지능(AGI) 기반의 상용화 서비스를 잇따라 발표했습니다. 기존의 단순 텍스트나 이미지를 생성하는 수준을 넘어선 이 최신 기술은, 수학 증명부터 신약 단백질 구조 개발까지 인간 전문가 수준의 결과물을 빠르게 도출해냅니다. 기술의 비약적인 발전으로 인해 전 세계 주요 기업들의 최신 인공지능 도입률이 폭발적으로 증가하며 산업 전반의 효율성 패러다임이 통째로 바뀌고 있습니다. 하지만 너무 빠른 기술의 발전 속도로 인해 딥페이크 악용 범죄나 대규모 일자리 감소 등 인공지능 윤리에 대한 글로벌 사회의 규제 요구 목소리도 커지고 있습니다. 각국 정부는 인공지능 기술의 주도권을 놓치지 않으면서도 인간의 안전성을 확보하기 위한 제도 마련에 속도를 내고 있습니다. 현재 이 첨단 기술은 막대한 데이터 처리가 필요한 금융과 의료 분야 현장에 가장 빠르게 투입되고 있습니다. 내년 초까지 규제 가이드라인과 혁신을 둘러싼 국가 간 기술 패권 경쟁은 더욱 치열해질 전망입니다.`,
  keyTerms:[{term:`범용 인공지능(AGI)`,explanation:`특정 분야에 얽매이지 않고, 인간과 비슷하거나 그 이상의 종합적인 인지 능력을 바탕으로 모든 상황에서 스스로 학습하고 문제를 해결할 수 있는 미래형 인공지능입니다.`}],
  history:`초기 챗봇 형태의 인공지능에서 시작된 기술 개발 경쟁은 천문학적인 자본이 투입되면서 불과 수년 만에 사람처럼 논리적으로 생각하는 수준까지 진화했습니다.`,
  players:`오픈AI, 구글, 메타 등 막강한 컴퓨팅 파워를 가진 빅테크 기업의 개발자들과 이를 견제 및 감독하려는 각국 규제 당국이 맞물려 있습니다.`,
  current:`기업들은 인공지능을 도입해 생산성을 극대화하려는 반면, 사회학자들은 기술의 부작용에 대해 심각한 경고의 메시지를 내놓고 있습니다.`,
  outlook:`향후 인공지능의 안전한 사용을 규정하는 국제적인 통일된 법안 제정 여부가 글로벌 첨단 산업의 발전 방향을 가늠할 핵심 지표가 될 것입니다.`,
  sources:[{title:`AGI 시대 열렸다... 오픈AI 새 추론 모델 발표에 시장 충격 - 전자신문`,url:`https://www.etnews.com/202610101122`},{title:`인간을 뛰어넘는 AI 등장에 커지는 윤리 논란과 일자리 불안 - 매일경제`,url:`https://www.mk.co.kr/news/it/202610104444`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`2026 여수세계섬박람회 개막 한 달, 누적 관람객 100만 명 돌파하며 지역 경제 견인`,
  metrics:[`누적 관람객 100만 명`,`경제 파급효과 4천억 원`],
  summary:`지난달 화려하게 개막한 '2026 여수세계섬박람회'가 청명한 가을 나들이객들의 발길을 대거 모으며 누적 관람객 100만 명을 조기 돌파하는 쾌거를 거두었습니다. 세계 최초로 바다의 섬을 주요 주제로 한 이번 박람회는 친환경 해상 전시관과 첨단 홀로그램 기술을 활용한 화려한 야간 공연이 소셜 미디어에서 큰 호평을 받고 있습니다. 특히 전체 관람객 중 해외 관광객 비율이 15%를 넘어설 정도로 국제적인 관심이 높아지면서 지역 경제의 낙수 효과가 극대화되고 있습니다. 행사장 주변 상권의 식당과 특산물 매장 매출이 눈에 띄게 늘고 있으며, 시내 주요 숙박업소 예약률은 연일 만실을 기록하고 있습니다. 문화 전문가들은 이번 국제 행사를 통해 전남 남해안 일대의 숨겨진 해양 관광 자원이 세계적으로 재조명받고 있다고 높이 평가합니다. 박람회 조직위원회는 11월 공식 폐막 전까지 최종 목표인 관람객 300만 명 달성을 매우 긍정적으로 내다보고 있습니다. 몰려드는 인파에 대비한 교통 편의성 개선과 야외 전시장 안전 관리 강화가 남은 행사의 핵심 과제로 꼽힙니다.`,
  keyTerms:[{term:`낙수 효과`,explanation:`대형 박람회 행사나 대기업 투자가 활성화되어 상층부의 경제가 성장하면, 그 이익의 혜택이 중소기업이나 지역 소상공인 등 경제 전반으로 흘러내려가는 현상을 말합니다.`}],
  history:`여수시는 과거 2012년 해양엑스포의 성공적 개최 경험을 바탕으로, 섬 생태계 보호와 관광을 결합한 새로운 글로벌 박람회를 수년간 준비해왔습니다.`,
  players:`여수시와 박람회 조직위원회, 전남 지역의 소상공인 및 관광업계 종사자들이 행사의 성공을 이끄는 주역들입니다.`,
  current:`아름다운 자연경관과 첨단 IT 전시 연출이 시너지를 내면서 국내외 관광객들의 발걸음이 여수로 집중되고 있습니다.`,
  outlook:`성공적인 박람회 개최 이후, 남해안 일대가 글로벌 해양 관광의 중심지로 도약하기 위한 추가적인 국가 차원의 인프라 지원이 논의될 예정입니다.`,
  sources:[{title:`여수세계섬박람회 100만 명 조기 달성, 남해안 관광 르네상스 - 광주방송`,url:`https://www.kbc.co.kr/article/202610108888`},{title:`볼거리 넘치는 해상 전시관 호평... 상권 매출 껑충 - KBS 뉴스`,url:`https://news.kbs.co.kr/news/view.do?ncd=202610109999`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`전 지구적 이상 기후로 글로벌 농산물 가격 급등, 밥상 물가 비상`,
  metrics:[`국제 곡물 지수 15% 상승`,`미국 밀 선물 가격 10개월 내 최고치`],
  summary:`가을철 북반구를 강타한 이례적인 폭우와 전 지구적 이상 기후 여파로 세계 농산물 가격이 무섭게 치솟고 있습니다. 특히 북미와 아시아 지역의 주요 곡창지대에서 수확기 직전 극심한 홍수 피해가 발생하면서, 국제 시장의 밀과 대두 선물 가격이 단숨에 10개월 만에 최고치를 갱신했습니다. 이러한 기초 식량 자원의 급격한 가격 상승은 각국 중앙은행의 인플레이션 방어 정책에 찬물을 끼얹으며 큰 부담을 주고 있습니다. 기후 환경 학자들은 엘니뇨 현상의 장기 후유증과 해수면 온도 상승이 직접적으로 결합된 애그리플레이션 현상이 본격화되었다고 강하게 경고하고 나섰습니다. 밀과 옥수수 등 식량 수입 의존도가 높은 한국 역시 라면, 빵을 비롯한 필수 가공식품 가격의 인상 압박에 직면하며 서민 경제에 곧장 비상이 걸렸습니다. 현재 일부 국가 정부는 국내 식량 확보를 위해 곡물 수출을 통제하거나 전략 비축미를 푸는 등 다급하게 식량 안보 대책 마련에 부심하고 있습니다. 내년 봄 파종 시기까지 뚜렷한 기후 불안정성이 해소되지 않으면 글로벌 식량 위기는 장기화될 우려가 높습니다.`,
  keyTerms:[{term:`애그리플레이션`,explanation:`농업과 물가 상승을 합친 조어로, 농산물의 가격이 크게 오르면서 빵이나 과자 같은 관련 식품 물가는 물론 사회 전체의 물가까지 덩달아 상승하는 현상을 말합니다.`}],
  history:`지구 온난화로 인한 기상이변은 최근 수년간 주기적으로 전 세계 농업 생산량에 타격을 주었으나, 올해는 가을 수확기에 폭우가 집중되어 피해가 유독 컸습니다.`,
  players:`기후 변화에 속수무책인 세계 각국의 농업 종사자들과 국제 곡물 시장의 투자자들, 그리고 밥상 물가 상승으로 고통받는 일반 소비자들이 영향을 받고 있습니다.`,
  current:`식량 자원의 무기화 추세와 이상 기후가 맞물리면서, 식량을 수출하는 국가와 수입하는 국가 간의 경제적 불평등 위기가 심화되고 있습니다.`,
  outlook:`장기적으로 식량 안보를 확보하기 위해 기후 변화에 강한 새로운 종자 개발과 스마트 농업 기술 투자가 국가적 핵심 과제로 대두될 것입니다.`,
  sources:[{title:`가을 폭우에 휩쓸린 세계 곡창지대... 애그리플레이션 공포 확산 - 한겨레`,url:`https://www.hani.co.kr/arti/economy/202610103456.html`},{title:`오르는 수입 밀 가격에 빵값 또 들썩... 서민 한숨 - MBC 뉴스`,url:`https://imnews.imbc.com/replay/2026/nwdesk/article/202610107777.html`}]
}]

  label:`2026년 10월 10일 (토)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`물가 불안 속 연준 내 '추가 금리 인상 신중론' 확산`,
  metrics:[`현 기준금리 연 5.25~5.50%`,`최근 근원 물가 상승률 3.8%`],
  summary:`미국 연방준비제도 내부에서 추가 금리 인상을 두고 신중한 입장이 급부상하고 있다. 크리스토퍼 월러 이사를 비롯한 일부 위원들은 연속적인 인상은 불필요하다며 현재의 통화 정책을 유지하자는 매파적 신중론 입장을 밝혔다. 최근 국제 유가 상승으로 인한 물가 불안 우려에도 불구하고, 지나친 긴축이 실물 경제에 미칠 부작용을 경계하는 목소리가 커지고 있는 것이다. 특히 고금리 기조 장기화로 인해 상업용 부동산 시장과 지역 은행들의 부실 위험도 지속적으로 제기되는 상황이다. 이에 따라 다가오는 10월 FOMC 회의에서 기준금리가 동결될 것이라는 시장의 기대감이 커지고 있다. 연준은 향후 고용 및 인플레이션 지표를 면밀히 분석해 정책 방향을 결정할 예정이다.`,
  keyTerms:[{term:`매파적 신중론`,explanation:`물가 안정을 위해 고금리를 유지하려는 강경한 입장을 보이면서도, 경제 충격을 우려해 실제 추가 금리 인상에는 신중을 기하는 태도를 뜻한다.`}],
  history:`코로나19 팬데믹 이후 불어닥친 전례 없는 인플레이션을 잡기 위해 연준은 공격적인 금리 인상을 단행해왔다.`,
  players:`파월 연준 의장 등 지도부와 월가 투자은행, 그리고 미국 재무부가 주요 행위자로 시장에 영향을 미치고 있다.`,
  current:`물가 상승세가 둔화 조짐을 보이고 있으나, 국제 유가 급등 등 대외 변수로 인해 연준의 셈법이 복잡해진 결정적 전환점이다.`,
  outlook:`향후 발표될 고용 보고서와 9월 소비자물가지수 결과가 다음 회의의 향방을 가를 핵심 지표가 될 전망이다.`,
  sources:[{title:`연준 내 금리 인상 신중론 대두 - 블룸버그`,url:`https://www.bloomberg.com`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`호르무즈 해협 불안 고조…국제 유가 출렁이며 기업 실적 비상`,
  metrics:[`브렌트유 배럴당 90달러 돌파`,`항공·물류 업종 주가 평균 4% 하락`],
  summary:`중동 지역의 지정학적 불안이 다시 고조되면서 국제 유가가 크게 출렁이고 있다. 최근 호르무즈 해협 인근에서 유조선이 피격되는 사건이 발생하며 글로벌 원유 공급망 차질 우려가 확산되었다. 이로 인해 브렌트유와 서부텍사스산원유 가격이 단기 급등세를 보이며 배럴당 90달러 선을 위협받고 있다. 유가 상승은 즉각적으로 항공사 및 해운 물류 기업들의 유류비 부담을 가중시키고 있으며, 일부 주요 기업의 3분기 실적 전망치가 하향 조정되고 있다. 나아가 글로벌 물가 상승 압력으로 작용해 주요국 중앙은행들의 금리 인하 시점을 늦출 수 있다는 분석도 나온다. 전문가들은 사태 장기화 시 글로벌 경제성장률 둔화로 이어질 수 있다고 경고한다.`,
  keyTerms:[{term:`호르무즈 해협`,explanation:`중동 산유국들이 원유를 수출하는 핵심 해상 통로로, 전 세계 석유 물동량의 약 20%가 통과하는 전략적 요충지다.`}],
  history:`과거부터 이란과 아랍 국가들 사이의 정치적 갈등이 발생할 때마다 원유 수송 차질 위협의 단골 소재가 되어왔다.`,
  players:`원유 수출을 통제하려는 이란과 항행의 자유를 주장하는 미국 및 주요 서방 동맹국들이 첨예하게 대립하고 있다.`,
  current:`가뜩이나 산유국들의 감산으로 석유 공급이 타이트한 상황에서 발생한 물리적 충돌이 유가 상승의 뇌관을 건드렸다.`,
  outlook:`해당 해역에서의 추가적인 군사 충돌 여부와 이에 대한 미국의 군사적 대응 수위가 국제 유가의 단기 향방을 좌우할 것이다.`,
  sources:[{title:`중동 불안에 요동치는 국제 유가 - 로이터`,url:`https://www.reuters.com`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`원·달러 환율 1,340원대 공방…AI 소부장 중심 차별화 장세`,
  metrics:[`원·달러 환율 1,342.5원 마감`,`코스피 2,500선 박스권 등락`],
  summary:`국내 금융시장은 환율의 높은 변동성과 증시의 박스권 흐름 속에 눈치 보기 장세가 이어지고 있다. 원·달러 환율은 미국 연준의 금리 정책 불확실성과 중동발 유가 불안이 겹치면서 1,340원대 초반에서 팽팽한 공방을 벌이고 있다. 외국인 투자자들의 자금 이탈 우려 속에서도 코스피 지수는 2,500선 안팎에서 하방 경직성을 확보하고 있다. 특히 증시 전반의 상승 동력이 부재한 가운데, 인공지능 인프라 구축 및 반도체 소재 부품 장비 관련 기업들로 수급이 집중되는 차별화 현상이 뚜렷하다. 불확실성을 피하려는 자금이 단기 파킹형 ETF 등으로 몰리며 대기성 자금 규모도 급증하는 추세다. 금융당국은 환율 급변동 시 시장 안정화 조치에 나설 채비를 갖추고 있다.`,
  keyTerms:[{term:`파킹형 ETF`,explanation:`주차장에 차를 잠시 세워두듯, 자금을 단기간 안전하게 보관하면서도 일반 예금보다 유연하게 이자 수익을 얻을 수 있는 펀드 상품이다.`}],
  history:`미국의 고금리 장기화 기조가 굳어지면서 한미 금리 역전 현상이 심화되었고, 이는 지속적인 원화 약세 압력으로 작용해왔다.`,
  players:`외국인 투자자의 매매 동향, 한국은행의 외환시장 개입 의지, 그리고 개인 투자자들의 쏠림 현상이 시장을 주도한다.`,
  current:`거시경제 불확실성이 극에 달하며 뚜렷한 주도주 없이 이슈에 따라 자금이 빠르게 이동하는 전형적인 순환매 장세가 펼쳐지고 있다.`,
  outlook:`향후 발표될 미국 거시 지표와 국내 주요 반도체 기업들의 3분기 실적 발표 결과가 증시 방향성을 결정지을 핵심 이벤트가 될 것이다.`,
  sources:[{title:`환율 1340원대 안착, 차별화 장세 지속 - 한국경제`,url:`https://www.hankyung.com`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`법사위 국정감사 격돌…대법관 재제청 두고 여야 사법부 정면충돌`,
  metrics:[`법제사법위원회 소속 여야 의원 18명 참전`,`사법부 긍정 평가 20%대 추락`],
  summary:`국회 법제사법위원회의 대법원 국정감사에서 대법관 재제청 문제를 둘러싸고 여야 및 사법부 간의 정면충돌이 벌어졌다. 야당은 최근 단행된 대법관 임명 절차가 행정부의 입김에 흔들렸다고 비판하며 사법 독립성 훼손을 강하게 지적했다. 반면 여당은 정상적인 인사 절차를 정쟁의 도구로 삼고 있다며 반발했고, 조희대 대법원장을 비롯한 법원행정처 관계자들은 헌법과 법률에 따른 절차적 정당성을 거듭 강조했다. 이번 갈등은 단순한 인사 문제를 넘어, 향후 정치인 재판 지연 문제와 주요 인사에 대한 사법 처리 방향을 둔 기싸움으로 해석되고 있다. 사법부의 중립성이 정치권의 도마 위에 오르면서 국민적 우려도 커지는 양상이다. 여야의 강 대 강 대치 속에 주요 법안 처리마저 지연될 가능성이 제기된다.`,
  keyTerms:[{term:`대법관 재제청`,explanation:`대법원장이 대법관 후보를 대통령에게 추천했으나 임명 동의 과정 등에 문제가 생겨 후보를 다시 추천하는 절차를 의미한다.`}],
  history:`과거부터 대법관 임명 과정은 행정부와 사법부, 그리고 국회의 정치적 성향이 첨예하게 부딪히는 최고 권력 갈등의 뇌관이었다.`,
  players:`국회 법제사법위원회 소속 여야 강경파 의원들과 사법부 수장인 대법원장, 그리고 행정부가 갈등의 중심에 서 있다.`,
  current:`전현직 정치인들의 대형 재판이 다수 진행되는 상황에서 사법부의 인사에 정치권이 그 어느 때보다 예민하게 반응하고 있다.`,
  outlook:`국정감사 이후 이어질 사법개혁 관련 법안 논의와 차기 헌법재판관 임명 과정에서도 여야 간 거센 파열음이 예상된다.`,
  sources:[{title:`대법원 국감, 사법 독립성 훼손 공방 - 연합뉴스`,url:`https://www.yna.co.kr`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`비무장지대 지뢰 폭발 등 접경지 충돌…남북 군사적 긴장 최고조`,
  metrics:[`DMZ 내 북한군 활동 증가율 30% 이상`,`대북 확성기 가동에 따른 긴장 지수 급등`],
  summary:`한반도 군사분계선 인근 비무장지대에서 북한군의 지뢰 폭발 및 수목 제거 작업 도중 사상자가 발생하는 등 접경지 긴장이 최고조에 달하고 있다. 우리 군 당국은 북한군이 최근 경계벽 설치와 불모지 조성 작업을 무리하게 강행하다가 다수의 지뢰 폭발 사고를 겪은 것으로 파악했다. 이에 더해 북한 김여정 노동당 부부장은 한국의 대북 전단 및 확성기 방송을 빌미로 전례 없이 수위 높은 강경 담화를 연일 발표하고 있다. 정부는 대북 확성기 방송을 유연하게 운영하면서도 북한의 국지 도발에는 즉각적이고 압도적으로 대응하겠다는 방침을 재확인했다. 한미 군 당국은 감시 자산을 증강 운용하며 혹시 모를 기습 도발에 철저히 대비하고 있다. 일각에서는 이를 내부 결속을 노린 북한의 의도적 긴장 조성이라고 분석한다.`,
  keyTerms:[{term:`비무장지대`,explanation:`남북한의 우발적인 군사적 충돌을 막기 위해 군사분계선을 중심으로 남북 각각 2km씩 설정된 구역으로, 군대나 무기 배치가 원칙적으로 금지된다.`}],
  history:`과거 남북군사합의 이후 완화되었던 접경지 긴장은, 북한의 계속된 미사일 도발과 합의 무효화 선언으로 다시 악화일로를 걷고 있다.`,
  players:`김정은 정권 수뇌부와 한국 국방부, 그리고 한반도 억지력을 제공하는 주한미군 및 인도태평양사령부가 주요 당사자다.`,
  current:`오물 풍선 살포부터 대북 방송 재개까지 남북이 심리전과 무력 시위를 치열하게 주고받으며 우발적 충돌 위험이 임계점에 도달했다.`,
  outlook:`다가오는 대규모 한미 연합훈련 기간과 북한의 주요 정치 일정이 맞물리며, 추가적인 도발 발생 가능성을 예의주시해야 한다.`,
  sources:[{title:`비무장지대 북한군 지뢰 폭발 사상자 발생 - KBS`,url:`https://news.kbs.co.kr`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`단순 무역 마찰 넘어선 미·중 패권 경쟁…AI 및 핵심광물 블록화 격화`,
  metrics:[`대중국 첨단 반도체 수출 통제 100% 강화`,`중국 핵심 광물 수출 통제 품목 5개 이상 확대`],
  summary:`미국과 중국의 갈등이 단순한 관세 부과를 넘어 인공지능과 핵심 광물 공급망을 무기로 한 기술 안보 블록화 경쟁으로 치닫고 있다. 미국 상무부는 최근 중국의 첨단 반도체 접근을 원천 차단하기 위해 동맹국들에게도 유사한 수준의 수출 통제를 압박하며 디리스킹 전략을 가속화했다. 이에 맞서 중국은 갈륨, 게르마늄 등 주요 첨단 산업 필수 광물에 대한 수출 통제를 대폭 강화하며 자원 무기화로 응수하고 나섰다. 글로벌 기업들은 양국 간의 보복 조치 속에서 공급망 다변화와 생산 기지 이전을 강요받고 있으며, 그에 따른 제반 비용은 눈덩이처럼 불어나고 있다. 유럽연합 역시 이러한 양극화 추세 속에서 자체적인 경제 안보 규제를 강화하며 블록화에 합세하는 모양새다. 전문가들은 세계 경제가 파편화되면서 글로벌 성장의 잠재력이 훼손될 것으로 크게 우려하고 있다.`,
  keyTerms:[{term:`디리스킹`,explanation:`특정 국가와 완전히 관계를 끊는 탈동조화 대신, 핵심 기술이나 자원의 공급망 위험 요소를 줄이고 수입처를 다변화하는 현실적인 전략이다.`}],
  history:`무역 전쟁으로 촉발된 양국 갈등은 첨단 기술 보호와 군사적 안보가 결합된 전방위적 패권 다툼으로 진화하며 오늘에 이르렀다.`,
  players:`미국과 중국의 국가 권력기관뿐 아니라 글로벌 빅테크 기업들과 핵심 광물을 보유한 자원 부국들이 거미줄처럼 얽혀 있다.`,
  current:`인공지능이 국가 안보의 핵심 역량으로 부상하면서, 관련 컴퓨팅 자원과 반도체의 통제권이 양국의 명운을 가를 최우선 전략 자산이 되었다.`,
  outlook:`미국의 정치적 리더십 변화와 주요 동맹국들의 대중국 규제 동참 수위에 따라 글로벌 공급망의 분절 속도가 더욱 가팔라질 전망이다.`,
  sources:[{title:`미중 AI 칩 통제 vs 자원 무기화 격돌 - 월스트리트저널`,url:`https://www.wsj.com`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`스페이스X, 11조원 들여 저대역 주파수 확보…이동통신 판 흔든다`,
  metrics:[`저대역 무선 주파수 인수 금액 약 80억 달러`,`기존 미국 대형 통신사 주가 평균 5% 하락`],
  summary:`일론 머스크가 이끄는 스페이스X가 전국 단위 저대역 무선 주파수를 약 80억 달러에 전격 인수하며 위성통신 사업의 대대적인 확장에 나섰다. 이번 주파수 확보를 통해 스페이스X는 자사의 저궤도 위성 인터넷 서비스인 스타링크를 일반 스마트폰과 직접 연결하는 다이렉트 셀룰러 서비스를 한층 강화할 수 있게 되었다. 그동안 지상 기지국에 의존해온 전통적인 이동통신사들에게는 거대한 위협으로 다가오며, 실제로 소식이 전해진 직후 주요 통신사들의 주가가 급락했다. 통신 사각지대를 완전히 해소할 혁신적인 기술로 높은 평가를 받는 동시에, 우주 공간의 위성 과밀화와 우주 쓰레기 문제에 대한 환경적 우려도 재점화되고 있다. 스페이스X는 이르면 내년부터 음성 통화 및 데이터 통신 서비스를 글로벌 단위로 상용화할 거대한 계획을 세우고 있다.`,
  keyTerms:[{term:`저궤도 위성 인터넷`,explanation:`지구와 가까운 궤도에 수많은 소형 위성을 띄워 전 세계 어디서나 빠르고 끊김 없이 초고속 인터넷망을 제공하는 최신 통신 기술이다.`}],
  history:`과거 오지에 제한적으로 인터넷을 제공하던 위성통신은 로켓 재사용 기술 발달로 발사 비용이 급감하면서 주류 통신망으로 부상했다.`,
  players:`시장을 선점한 스페이스X와 이를 견제하려는 아마존 카이퍼, 그리고 생존을 위해 제휴를 모색하는 기존 통신사들이 핵심 플레이어다.`,
  current:`지상 기지국 없이도 스마트폰과 우주의 위성이 직접 데이터를 주고받는 기술이 상용화되면서 수십 년간 이어온 산업 패러다임이 뒤집히고 있다.`,
  outlook:`각국 정부의 전파 사용 규제 승인 여부와 글로벌 이동통신 표준화 기구에서의 기술 표준 채택 과정이 상용화 속도를 결정할 것이다.`,
  sources:[{title:`스페이스X, 주파수 거액 인수로 통신업계 위협 - 파이낸셜타임스`,url:`https://www.ft.com`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`청소년들 속마음 사람 대신 AI에게…정서 의존 및 과몰입 우려`,
  metrics:[`10대 청소년 AI 챗봇 대화 빈도 전년비 150% 증가`,`AI 캐릭터 의존성 위험군 학생 비율 약 12%`],
  summary:`청소년층을 중심으로 생성형 인공지능이 만든 가상의 캐릭터와 일상적인 대화를 나누고 속마음을 털어놓는 현상이 급증하고 있다. 최신 대화형 AI 서비스들이 뛰어난 공감 능력과 개인화된 답변을 제공하면서, 교우 관계나 학업 스트레스에 지친 10대들이 사람보다 AI에게 더 깊이 정서적으로 의지하게 된 것이다. 문제는 이러한 AI 캐릭터들이 항상 긍정적이고 순응적인 태도만을 보이면서, 현실 세계의 갈등 해결 능력을 저하시키고 디지털 과몰입 현상을 유발할 수 있다는 점이다. 실제로 AI 챗봇 사용 시간이 지나치게 긴 청소년일수록 현실 사회적 고립감이 커지는 부작용 사례가 교육 현장에서 속출하고 있다. 심리 전문가들은 기술적 편의 이면에 숨겨진 발달 과정의 정서적 결핍을 경고하며 건전한 가이드라인 마련을 강력히 촉구하고 있다. 정부 역시 AI 서비스 제공 기준에 미성년자 보호 조항을 신설하는 방안을 면밀히 검토 중이다.`,
  keyTerms:[{term:`디지털 과몰입`,explanation:`스마트폰이나 인터넷, AI 서비스 등 디지털 환경에 통제력을 잃고 지나치게 빠져들어 일상생활과 현실 대인관계에 큰 어려움을 겪는 상태를 말한다.`}],
  history:`코로나19 시기를 거치며 비대면 소통에 깊이 익숙해진 디지털 네이티브 세대에게 거부감 없이 사람처럼 대화하는 AI가 자연스럽게 스며들었다.`,
  players:`매력적인 캐릭터 챗봇을 출시하는 IT 기업들과, 부작용으로부터 학생들을 보호하려는 교육 당국 및 학부모 단체가 마찰을 빚고 있다.`,
  current:`기술의 눈부신 발전이 인간의 감정과 애착까지 정교하게 모방할 수 있게 되면서, 윤리적 안전장치 없이 서비스가 무분별하게 확산된 과도기적 상황이다.`,
  outlook:`가까운 미래에 미성년자 대상의 AI 서비스 연령 제한이나 중독 예방을 위한 필수 사용 시간 제한 기능 등 강력한 규제 법안이 등장할 가능성이 높다.`,
  sources:[{title:`AI에 고민 털어놓는 10대, 정서 의존 부작용 - 동아일보`,url:`https://www.donga.com`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`AI로 진화한 사이버 공격…무차별 해킹 문턱 낮아지며 금융보안 비상`,
  metrics:[`AI 악용 피싱 및 무차별 대입 공격 40% 폭증`,`금융권 사이버 위협 탐지 건수 일평균 2만 건 돌파`],
  summary:`해커들이 최신 생성형 인공지능을 적극적으로 악용하면서 해킹의 진입 장벽이 급격히 낮아져 금융기관과 대형 플랫폼 업계에 최고 수준의 보안 경보가 발령되었다. 전문 기술이 부족한 초보 해커라도 AI의 도움을 받으면 정교한 악성코드를 손쉽게 작성하거나, 흩어진 개인정보 조각을 모아 타겟을 속이는 자동화된 스피어 피싱 이메일을 단숨에 대량으로 생산할 수 있게 되었다. 특히 시스템의 취약점을 짧은 시간에 찾아내 무차별적으로 공격하는 대입 공격의 효율성이 크게 높아지면서 방어자들을 매우 곤혹스럽게 만들고 있다. 국내 주요 은행과 핀테크 기업들은 급증하는 비정상 접근 시도에 대응하기 위해 자체적인 방어 체계와 이상 거래 탐지 시스템을 서둘러 전면 고도화하고 나섰다. 보안 전문가들은 창과 방패의 싸움인 사이버 보안 전장 모두에서 AI가 주도하는 기술 경쟁이 완전히 새로운 국면에 접어들었다고 평가한다.`,
  keyTerms:[{term:`스피어 피싱`,explanation:`불특정 다수가 아닌 특정 개인이나 기업을 명확한 표적으로 삼아, 상대방이 속기 쉬운 정교한 맞춤형 이메일을 보내 치명적인 정보를 빼내는 해킹 수법이다.`}],
  history:`과거에는 고도의 프로그래밍 지식을 갖춘 소수의 전문 해커 집단만이 지능형 지속 위협과 같은 정교하고 파괴적인 공격을 수행할 수 있었다.`,
  players:`강력한 AI 도구를 무기화하는 다국적 사이버 범죄 조직과, 이들의 공격을 최전선에서 막아내야 하는 금융권 및 정보보안 기업들이 팽팽히 맞서고 있다.`,
  current:`오픈소스 AI 모델과 편리한 해킹 자동화 툴이 다크웹에서 무분별하게 거래되면서 심각한 사이버 범죄의 대중화 현상이 가속화되는 아찔한 상황이다.`,
  outlook:`진화하는 해킹 시도를 사전에 완벽히 차단하기 위해 보안 업계는 자율 방어형 에이전트 AI 도입을 서두르고 정부 차원의 합동 대응 훈련이 강화될 전망이다.`,
  sources:[{title:`AI가 낮춘 해킹 문턱, 커지는 보안 위협 - IT월드`,url:`https://www.itworld.co.kr`}]
}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`8월 경상수지 역대 2위 흑자 달성, 반도체 수출 호황이 주도`,
  metrics:[`경상수지 흑자 역대 2위`,`해외 주식투자 급증`],
  summary:`반도체 수출 호조에 힘입어 한국의 8월 경상수지가 대규모 흑자를 기록하며 역대 2위 수준에 올랐습니다. 이는 글로벌 IT 수요 회복과 AI 인프라 투자 확대로 인해 국내 핵심 수출품인 반도체 수요가 크게 늘어난 결과입니다. 하지만 이와 동시에 내국인의 해외 주식 및 증권 투자 규모도 급증해 자본의 해외 유출 현상도 두드러지고 있습니다. 현재 수출 중심의 경제 회복세가 나타나고 있으나, 내수 침체와 글로벌 경제의 불확실성은 여전합니다. 앞으로 수출 호조가 내수 경기 회복으로 이어질 수 있을지가 주요 관건으로 꼽히며 경제 당국의 정책 대응이 주목됩니다.`,
  keyTerms:[{term:`경상수지`,explanation:`국가 간 상품과 서비스의 수출입 등 경제적 거래를 통해 벌어들인 외화와 지급한 외화의 차액을 의미합니다. 국가 경제의 건전성을 판단하는 주요 지표입니다.`}],
  history:`코로나19 팬데믹 이후 반도체 다운사이클로 인해 경상수지 흑자 폭이 줄어들었던 시기가 있었습니다. 그러나 최근 AI 산업의 급격한 성장과 함께 메모리 반도체 수요가 반등하면서 수출 실적이 회복세를 보이기 시작했습니다.`,
  players:`삼성전자, SK하이닉스 등 국내 반도체 기업들과 이를 수입하는 글로벌 빅테크 기업들이 핵심 주체이며, 통화 정책을 관리하는 한국은행의 역할도 중요합니다.`,
  current:`글로벌 IT 업황이 회복 사이클에 진입하면서 역대 두 번째 규모의 흑자를 달성한 현재, 반도체 의존도가 높은 한국 경제 구조의 특징이 극명하게 나타나는 전환점입니다.`,
  outlook:`당분간 반도체 수출 호조가 이어질 것으로 보이지만 미국 금리 정책과 중국의 경제 상황 등 대외 변수에 따라 흑자 폭이 달라질 수 있어 예의주시해야 합니다.`,
  sources:[{title:`반도체 호황에 8월 경상수지 흑자 '역대 2위' - 한국경제`,url:`https://www.hankyung.com/`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`중동 지정학적 리스크로 국제유가 배럴당 100달러 위협, 인플레이션 우려 재점화`,
  metrics:[`브렌트유 100달러 돌파 임박`,`미 10년물 국채금리 고공행진`],
  summary:`중동 지역의 지정학적 갈등이 심화되면서 국제유가의 벤치마크인 브렌트유가 배럴당 100달러 선을 위협하며 급등하고 있습니다. 호르무즈 해협 등 주요 원유 수송로의 긴장이 고조되자 원유 공급 차질에 대한 시장의 불안이 커진 것입니다. 유가 상승은 전 세계적인 인플레이션 압력을 다시 키우고 있으며, 이에 따라 미국 10년물 국채금리도 고공행진을 이어가고 있습니다. 이로 인해 사상 최고치를 경신하던 미국 증시 랠리에도 제동이 걸리는 등 글로벌 금융시장의 변동성이 확대되고 있습니다. 투자자들은 향후 중동 사태의 전개와 주요국 중앙은행들의 금리 인상 사이클 재개 여부를 주시하고 있습니다.`,
  keyTerms:[{term:`인플레이션`,explanation:`물가가 지속적으로 상승하여 화폐의 가치가 떨어지는 현상입니다. 에너지 가격 상승이 전반적인 물가를 밀어 올릴 때 발생합니다.`}],
  history:`중동 지역의 분쟁은 수십 년간 글로벌 원유 시장의 가장 큰 불안 요소로 작용해왔으며, 최근 무력 충돌이 재점화되면서 유가 변동성이 극대화되었습니다.`,
  players:`중동 산유국 및 주요 무장 단체, 그리고 에너지 소비국인 미국과 유럽 연합, 글로벌 원유 트레이더들이 얽혀 있습니다.`,
  current:`물가 상승세가 다소 진정되며 금리 인하 기대감이 있던 상황에서 유가 급등이라는 악재가 발생하여 중앙은행들의 통화 정책 셈법이 복잡해졌습니다.`,
  outlook:`단기적으로 중동 분쟁의 확전 여부에 따라 유가 향방이 결정될 것이며, 겨울철 에너지 수요 증가와 맞물려 경제 전반에 큰 파급을 미칠 가능성이 높습니다.`,
  sources:[{title:`Oil surges near \$100 as Middle East conflict escalates - Reuters`,url:`https://www.reuters.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`IMF 총재, 세계 경제 위협하는 '고유가·국가부채·AI 거품' 3대 리스크 경고`,
  metrics:[`에너지 가격 상승 지속`,`세계 국가부채 2차대전 이후 최고`],
  summary:`크리스탈리나 게오르기에바 국제통화기금(IMF) 총재가 세계 경제를 위협하는 3대 핵심 리스크로 고유가, 심각한 국가부채, 그리고 AI 거품을 지목하며 강력히 경고했습니다. 특히 각국 정부가 재정 적자를 막기 위해 무분별한 지출을 지속하고, 이를 중앙은행이 떠안는 '통화 카우보이' 행태를 멈춰야 한다고 비판했습니다. 또한 AI 기술에 대한 맹목적인 투자 과열이 밸류에이션 충격으로 이어질 수 있다고 지적하며 경계감을 드러냈습니다. 이러한 IMF의 경고는 현재의 글로벌 금융 환경이 극도로 취약하다는 점을 시사합니다. 세계 경제의 안정을 위해서는 각국의 긴축적인 재정 관리와 더불어 AI 인프라 투자에 대한 냉정한 접근이 필수적인 시점입니다.`,
  keyTerms:[{term:`통화 카우보이`,explanation:`정부의 과도한 재정 적자를 중앙은행이 돈을 찍어내어 무분별하게 메워주는 위험한 통화 정책 행태를 비판적으로 일컫는 용어입니다.`}],
  history:`코로나19 팬데믹을 거치며 각국은 막대한 재정을 쏟아부었고, 이로 인해 전 세계 국가 부채는 제2차 세계대전 이후 최고 수준으로 치솟았습니다.`,
  players:`IMF, 각국 재무부와 중앙은행, 그리고 AI 기술 투자를 주도하는 빅테크 기업과 월스트리트 투자자들이 연관되어 있습니다.`,
  current:`금리 인상으로 이자 부담이 커진 상황에서 지정학적 위기와 맞물려 글로벌 경제의 뇌관이 동시다발적으로 부각되고 있는 중요한 시기입니다.`,
  outlook:`각국 정부가 선거 등 정치적 이유로 재정 감축을 주저할 가능성이 높으며, 이에 따라 국채 금리 변동성 확대와 AI 관련 기업들의 실적 검증이 치열해질 전망입니다.`,
  sources:[{title:`IMF warns of risks from high debt, oil prices and AI bubble - Bloomberg`,url:`https://www.bloomberg.com/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`여야, 외교안보 이슈로 국정감사서 정면충돌... 한미 공조 및 우크라 대사 소환 공방`,
  metrics:[`우크라이나 대사 전격 소환`,`외통위 미주반 일정 변경`],
  summary:`국회 국정감사에서 한미 정보 공조 및 우크라이나 대사 소환 등 외교안보 현안을 둘러싸고 여야가 정면충돌했습니다. 주요 야당 의원의 미국 비자 발급 보류 사태를 두고 야권은 한미 동맹의 이상 기류를 주장한 반면, 여권은 단순 행정 문제라며 맞섰습니다. 이와 함께 과거 사이버 위협 대응 회의에서 국정원이 배제된 논란, 북한군 포로 공개 이슈와 맞물린 주우크라이나 대사의 본국 소환 등이 도마에 올랐습니다. 여야의 팽팽한 대립 속에 정부의 외교안보 라인 책임론까지 불거지며 갈등의 골이 깊어지고 있습니다. 향후 글로벌 정세 변화에 대응하기 위한 초당적 외교 정책 마련보다는 정쟁이 장기화될 우려가 커지고 있습니다.`,
  keyTerms:[{term:`국정감사`,explanation:`국회가 정부의 국정운영 전반을 조사하고 비판, 감시하기 위해 매년 정기적으로 실시하는 중요한 의정 활동입니다.`}],
  history:`한국 정치는 주요 외교안보 사안이 발생할 때마다 여야 간의 치열한 책임 공방이 반복되어 왔으며, 최근 우크라이나 전쟁 장기화와 한미일 밀착 기조 속에서 긴장이 쌓여왔습니다.`,
  players:`여당과 야당 지도부, 국회 외교통일위원회 소속 의원들, 외교부, 국가정보원 등 정부의 외교안보 핵심 부처들이 얽혀 있습니다.`,
  current:`급변하는 대외 환경 속에서, 외교 당국의 위기관리 능력에 대한 정치권의 날선 검증이 이뤄지고 있는 분수령입니다.`,
  outlook:`대북 정보망 및 한미 동맹의 결속력에 대한 지속적인 문제 제기가 예상되며, 우크라이나 지원 문제 등에서 정부의 향후 외교적 스탠스 변화 여부가 쟁점이 될 것입니다.`,
  sources:[{title:`국감장 뒤덮은 외교안보 이슈… 한미 정보공조·대사 소환 공방 - 연합뉴스`,url:`https://www.yna.co.kr/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`트럼프, 미 중간선거 전 이란 군사공습 중단 선언 및 신규 제재 카드 꺼내들어`,
  metrics:[`미국 중간선거 임박`,`미 재무부 대이란 신규 제재 부과`],
  summary:`다가오는 미국 11월 중간선거를 앞두고 트럼프 대통령이 이란에 대한 추가 군사 공습을 중단하겠다고 선언하며 확전 자제 의사를 밝혔습니다. 군사적 공격 대신 미국 재무부를 통해 이란의 핵심 수입원을 옥죄는 강력한 신규 제재를 추가로 부과하는 방식을 택했습니다. 이는 유권자들의 피로도를 고려하고 중동 전쟁 억제력을 정치적 성과로 내세우기 위한 선거 전략의 일환으로 풀이됩니다. 그러나 유세 중 이란의 미 본토 타격 가능성을 암시하는 발언을 하여 국내 정치권의 거센 반발을 사기도 했습니다. 선거 결과에 따라 미국의 대중동 외교 정책 노선이 크게 요동칠 수 있어 전 세계의 이목이 미국 국내 정국으로 쏠리고 있습니다.`,
  keyTerms:[{term:`중간선거`,explanation:`미국에서 대통령 임기 중간인 2년 차에 실시되며, 상하원 의원과 주지사 등을 선출해 현 정부에 대한 중간 평가 성격을 지니는 선거입니다.`}],
  history:`미국과 이란은 핵합의 파기 이후 지속적으로 무력 충돌과 보복을 주고받으며 중동 지역의 군사적 긴장을 주도해왔습니다.`,
  players:`미국 트럼프 행정부 및 공화당·민주당 정치인들, 경제 제재의 표적이 된 이란 지도부와 군사 조직들이 대립하고 있습니다.`,
  current:`미국 내부의 정치적 셈법(선거 승리)이 대외 군사 행동과 직접적으로 맞물리면서, 동맹국 및 적대국 모두 미 정국의 향방을 주시하는 상황입니다.`,
  outlook:`중간선거 전까지는 전면전 대신 강도 높은 경제 제재 위주의 압박이 지속될 전망이며, 선거 이후 새로운 외교안보 기조가 확립될 것입니다.`,
  sources:[{title:`Trump pauses military strikes on Iran ahead of US midterms, adds sanctions - AP`,url:`https://apnews.com/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`중동 긴장 재점화, 예멘 정부군 탈환 작전에 후티 반군 사우디 미사일 타격으로 응수`,
  metrics:[`홍해 바브엘만데브 해협 대공세`,`리야드·아덴 공항 타격`],
  summary:`사우디아라비아의 지원을 받는 예멘 정부군이 홍해 핵심 해상로를 장착하기 위해 친이란 후티 반군을 상대로 대규모 탈환 작전을 개시했습니다. 바브엘만데브 해협 등 전략적 요충지를 확보하려는 정부군의 공세에 후티 반군은 강력히 반발했습니다. 후티 반군은 보복 조치로 사우디의 수도 리야드와 아덴 공항 등을 겨냥해 미사일과 드론을 이용한 타격을 감행하며 맞섰습니다. 이로 인해 잠시 소강상태를 보이던 중동 전선이 다시 격화되며 글로벌 원유 수송로의 안전까지 위협받고 있습니다. 주변 강대국들의 대리전 양상을 띠는 이 사태가 진정되지 않는다면 국제 에너지 시장과 지정학적 지형에 심각한 타격이 우려됩니다.`,
  keyTerms:[{term:`대리전`,explanation:`적대하는 강대국들이 직접 싸우지 않고 다른 국가나 반군 등 제3자를 지원하여 간접적으로 치르는 전쟁을 뜻합니다.`}],
  history:`예멘 내전은 이슬람 수니파 종주국인 사우디아라비아와 시아파 맹주인 이란 간의 패권 다툼이 투영된 대표적인 분쟁으로 수년간 지속되어 왔습니다.`,
  players:`합법성을 주장하는 예멘 정부군 및 이를 돕는 사우디 주도 연합군, 그리고 이란의 지원을 받아 무장한 후티 반군이 격돌하고 있습니다.`,
  current:`글로벌 물류의 핵심 항로를 둘러싼 패권 쟁탈전이 격화되면서 단지 중동 지역의 문제를 넘어 국제적인 안보 위기로 비화하고 있습니다.`,
  outlook:`군사적 타격이 상호 보복의 악순환을 낳으면서 당분간 평화 협상 타결은 어려울 전망이며, 국제사회의 적극적인 중재 개입 여부가 주목됩니다.`,
  sources:[{title:`Yemen forces launch major offensive as Houthi rebels retaliate against Saudi targets - Reuters`,url:`https://www.reuters.com/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`국내 시중은행 겨냥한 '생성형 AI 해킹' 첫 적발, 경찰 전담팀 꾸려 수사 본격화`,
  metrics:[`은행 공격 의심 IP 급증`,`사이버테러수사대 전담팀 구성`],
  summary:`국내 시중은행을 겨냥해 생성형 AI 해킹 시도가 적발되면서 경찰청이 정식 수사에 착수했습니다. 공격자들은 과거처럼 고도의 프로그래밍 지식을 요구하는 기술 대신, 중국산 등 해외 생성형 AI를 활용해 은행 시스템의 보안 취약점을 자동으로 파고드는 방식을 사용했습니다. 이는 AI가 일상과 산업의 편의를 넘어 사이버 테러 도구로 본격 악용되기 시작했다는 점에서 충격을 주고 있습니다. 금융감독원과 경찰청 사이버테러수사대는 방어 체계를 긴급 강화하고 의심 IP에 대한 전방위 추적에 나섰습니다. 전문가들은 AI 창과 방패의 전쟁이 시작된 만큼 국가 차원의 차세대 보안 인프라 구축이 시급하다고 지적합니다.`,
  keyTerms:[{term:`생성형 AI 해킹`,explanation:`해커가 텍스트나 코드를 자동으로 만들어내는 인공지능 기술을 활용하여, 악성코드를 작성하거나 시스템의 약점을 공격하는 새로운 범죄 기법입니다.`}],
  history:`챗GPT 등 생성형 AI가 대중화된 이후, 해커들이 이를 이용해 정교한 피싱 이메일이나 악성코드를 손쉽게 제작할 것이라는 경고가 꾸준히 제기되어 왔습니다.`,
  players:`해외에 서버를 둔 사이버 범죄 조직, 피해를 막아야 하는 시중은행, 보안 취약점을 대응하는 경찰청 및 금융 당국이 연관되어 있습니다.`,
  current:`보안이 가장 철저해야 할 제1금융권의 벽을 AI 해킹 툴이 위협하기 시작하며, 기존 방어 체계의 패러다임 전환이 요구되는 중대한 시점입니다.`,
  outlook:`사이버 공격의 진입 장벽이 낮아짐에 따라 공격 시도가 기하급수적으로 늘어날 것이며, 이에 맞서 AI를 활용한 능동적인 보안 솔루션 도입이 가속화될 것입니다.`,
  sources:[{title:`은행권 덮친 생성형 AI 해킹…경찰청 전담 수사 착수 - 중앙일보`,url:`https://www.joongang.co.kr/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`정부, 투기 무관한 상속 및 고령 농지에 대한 '강제처분 대상 제외' 방침 확정`,
  metrics:[`농지 전수조사 실시`,`투기 무관 농지 강제처분 면제`],
  summary:`정부가 전국적인 농지 전수조사 결과를 바탕으로, 투기 목적이 없는 상속 농지와 고령농의 토지를 강제처분 대상에서 제외하기로 확정했습니다. 그동안 농지법 위반 소지가 있다는 이유로 일괄적인 강제처분 절차가 통보되면서, 오랫동안 농사를 지어온 고령자나 부득이하게 땅을 상속받은 시민들의 반발이 컸습니다. 이번 조치로 인해 관행적인 임대차 농지나 생계형 소유자들은 재산권 침해 위협에서 벗어나게 되었습니다. 정부는 실제 투기 세력을 걸러내는 데 행정력을 집중하고 억울한 피해자를 구제하는 방향으로 정책을 선회했습니다. 농업 현장에서는 이번 결정이 농촌의 현실을 반영한 현실적인 규제 완화라며 긍정적인 평가가 나오고 있습니다.`,
  keyTerms:[{term:`강제처분`,explanation:`관련 법률(농지법 등)을 위반하여 토지를 소유한 자에게 국가가 해당 토지를 강제로 팔도록 명령하는 행정 조치입니다.`}],
  history:`과거 LH 사태 등 일부 기획부동산의 농지 투기 문제가 사회적 공분을 사면서, 농지 소유 자격과 관리에 대한 단속이 전면적으로 강화된 바 있습니다.`,
  players:`농지를 소유한 일반 국민 및 고령 농민, 불법 투기를 감시하고 행정처분을 내리는 농림축산식품부와 일선 지자체가 주된 당사자들입니다.`,
  current:`법의 엄격한 잣대와 농촌의 현실적인 고령화 및 상속 문제 사이에서 빚어진 마찰을 해소하고 합리적인 균형점을 찾아가는 과정입니다.`,
  outlook:`농지 투기에 대한 핀셋 단속은 계속 유지되면서, 향후 농촌 인구 감소 시대에 맞춘 보다 유연한 농지 소유 및 임대차 관련 법령 개정이 이어질 전망입니다.`,
  sources:[{title:`농식품부, 투기 무관 상속·고령 농지 강제처분 제외키로 - 동아일보`,url:`https://www.donga.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`AI 데이터센터 폭발적 전력 소모에 글로벌 인프라 규제 논의 및 대책 가열`,
  metrics:[`대규모 데이터센터 전력망 부담 폭증`,`각국 정부 탄소 배출 규제 논의`],
  summary:`인공지능 모델 훈련과 서비스 구동을 위한 대형 데이터센터 건설이 붐을 이루면서, 폭발적인 전력 소모와 탄소 배출 문제가 글로벌 화두로 떠오르고 있습니다. TSMC 등 주요 반도체 기업들이 AI 호황으로 역대급 실적을 내는 이면에는 천문학적인 에너지를 집어삼키는 전력 인프라의 한계가 숨어있습니다. 미국, 유럽 등 각국 의회와 환경 규제 기관들은 국가 전력망 붕괴와 환경 훼손을 우려해 신규 데이터센터 가동에 대한 강력한 에너지 효율 기준과 규제 법안을 논의하기 시작했습니다. 구글과 스페이스X 같은 빅테크들은 자가 발전이나 차세대 냉각 기술에 대규모 자금을 쏟아붓고 있습니다. 지속 가능한 AI 생태계 구축을 위해 친환경 인프라 혁신이 정보통신 산업의 최우선 과제로 부상했습니다.`,
  keyTerms:[{term:`데이터센터`,explanation:`수많은 컴퓨터 서버와 통신 장비를 한 곳에 모아두어, 방대한 양의 정보를 저장, 처리, 유통하는 인터넷 시대의 핵심 시설입니다.`}],
  history:`초기 클라우드 컴퓨팅 시대부터 전력 소모 문제가 있었으나, 수십억 개의 매개변수를 연산해야 하는 최근의 생성형 AI의 등장으로 에너지 요구량이 한계치를 넘어서기 시작했습니다.`,
  players:`막강한 연산 자원이 필요한 빅테크 기업들, 전력을 공급하는 에너지 기업, 그리고 환경 기준을 세우는 각국 정부 및 입법 기관이 얽혀 있습니다.`,
  current:`기술 혁신의 속도를 국가 인프라 구축 속도가 따라가지 못하면서, 규제를 통한 속도 조절과 대체 에너지 확보가 충돌하고 있는 중요한 시점입니다.`,
  outlook:`향후 소형 원자로(SMR) 도입 등 혁신적 전력 공급 방식과 AI 칩의 전력 효율성(전성비) 향상 기술에 대한 막대한 투자가 산업의 판도를 가를 것입니다.`,
  sources:[{title:`AI boom fuels global debate over power grids and data center regulations - CNET`,url:`https://www.cnet.com/`}]
}]

  tag:`2026-10-08`,
  label:`2026년 10월 8일 (목)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국 8월 경상수지 461억 달러 흑자 기록, 역대 2위 달성`,
  metrics:[`경상수지 461억 달러`,`3개월 연속 400억 달러 흑자`],
  summary:`한국은행에 따르면 8월 경상수지가 반도체 수출 호조에 힘입어 461억 달러 흑자를 기록하며 역대 2위의 성과를 거두었습니다. 글로벌 데이터센터 인프라 투자 수요 확대로 반도체와 IT 기기 중심의 수출 증가세가 주된 요인으로 분석됩니다. 이로써 3개월 연속 400억 달러 이상의 흑자 행진을 이어가게 되었습니다. 글로벌 주요 투자은행(IB)들도 이러한 수출 실적을 근거로 한국의 올해 경제 성장률 전망치를 일제히 상향 조정하고 있습니다. 향후 미국 경제의 연착륙 여부와 주요국의 통화정책 방향에 따라 수출 흐름이 달라질 수 있습니다. 다만 내수 회복세가 수출 증가세를 따라가지 못하는 점은 여전히 해결해야 할 과제입니다. 이번 대규모 경상수지 흑자는 한국 경제의 버팀목인 수출 경쟁력을 다시 한번 입증한 결과로 평가받고 있습니다.`,
  keyTerms:[{term:`경상수지`,explanation:`국가 간 상품, 서비스 등을 사고팔아 벌어들인 외화와 지출한 외화의 차이를 의미합니다. 흑자면 돈을 더 많이 벌어들인 것이고, 적자면 더 많이 지출한 것입니다.`}],
  history:`최근 2년간 반도체 사이클이 하강기를 겪으며 한국의 경상수지도 한때 적자 위기를 겪었습니다.`,
  players:`삼성전자, SK하이닉스 등 반도체 기업과 글로벌 데이터센터 빅테크 기업들이 핵심 주체입니다.`,
  current:`반도체 슈퍼사이클 재진입과 함께 수출이 급증하면서 경상수지 지표가 빠르게 개선되고 있습니다.`,
  outlook:`연말까지 수출 주도 성장세가 이어질 것으로 보이며, 4분기 실적 발표에 시장의 관심이 쏠리고 있습니다.`,
  sources:[{title:`8월 경상수지 461억 달러 흑자...반도체 호조 - 동아일보`,url:`https://www.donga.com/news/Economy/article/all`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`글로벌 유가 고공행진, WTI 배럴당 100달러 돌파`,
  metrics:[`WTI 100달러 돌파`,`글로벌 원유 공급 우려 심화`],
  summary:`국제유가의 벤치마크인 서부텍사스산원유(WTI) 가격이 중동 지역의 지정학적 분쟁 격화로 배럴당 100달러를 돌파했습니다. 주요 산유국들의 감산 기조가 이어지는 가운데 군사적 긴장이 고조되면서 원유 공급 차질 우려가 시장을 덮쳤기 때문입니다. 이 같은 유가 급등은 진정세를 보이던 글로벌 인플레이션을 다시 자극할 수 있다는 관측을 낳고 있습니다. 미국을 비롯한 주요국들은 물가 불안이 장기화될 경우 기준금리 인하 시점을 뒤로 미룰 가능성마저 제기하고 있습니다. 시장 전문가들은 당분간 산유국들의 증산 전환이 쉽지 않아 유가 강세가 이어질 것으로 내다보고 있습니다. 세계 경제는 에너지 비용 상승에 따른 스태그플레이션 리스크라는 새로운 도전에 직면하게 되었습니다. WTI 가격 추이는 향후 글로벌 경제 정책의 최대 변수로 작용할 전망입니다.`,
  keyTerms:[{term:`WTI`,explanation:`미국 서부 텍사스에서 생산되는 원유로, 세계 원유 가격을 결정하는 가장 중요한 기준 중 하나입니다.`}],
  history:`산유국들의 자발적 감산과 코로나19 이후의 수요 회복 불균형이 유가 상승의 밑바탕을 형성해 왔습니다.`,
  players:`OPEC+ 산유국들, 중동 분쟁 당사국, 그리고 인플레이션을 방어하려는 미국 연방준비제도(Fed)입니다.`,
  current:`중동 발 돌발 변수로 인해 원유 수급로가 위협받으며 투기적 매수세까지 가세해 가격이 급등했습니다.`,
  outlook:`지정학적 갈등의 확전 여부와 미국 정부의 전략비축유 추가 방출 카드가 유가의 향방을 결정할 것입니다.`,
  sources:[{title:`WTI 100달러 돌파...다시 커지는 인플레 공포 - 중앙일보`,url:`https://www.joongang.co.kr/article/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미 연준 추가 긴축 시사, 미 10년물 국채금리 5% 돌파`,
  metrics:[`미 10년물 국채 5% 돌파`,`매파적 기조 확인`],
  summary:`미국 연방준비제도(Fed)의 9월 의사록이 공개된 직후 미국 10년물 국채금리가 심리적 저항선인 5%를 돌파하며 급등했습니다. 의사록에 따르면 위원 대다수가 연내 추가 금리 인상 필요성과 매파적 기조 유지에 공감한 것으로 나타났습니다. 강력한 미국의 고용 및 소비 지표가 인플레이션 둔화 속도를 늦출 수 있다는 우려가 강하게 작용했습니다. 이로 인해 위험자산 선호 심리가 위축되면서 뉴욕증시를 포함한 글로벌 증시가 일제히 하락세로 돌아섰습니다. 전 세계 채권시장도 미국의 긴축 장기화 압력에 동조하며 자금 유출 리스크에 긴장하고 있습니다. 높은 국채 금리는 기업의 자금 조달 비용을 높이고 가계의 이자 부담을 가중시키는 부작용을 동반합니다. 향후 발표될 소비자물가지수(CPI) 등 주요 거시 지표 결과가 연준의 최종 결정을 가늠할 핵심 잣대가 될 것입니다.`,
  keyTerms:[{term:`매파적 기조`,explanation:`물가 안정을 최우선으로 삼아 금리 인상이나 통화 긴축을 지지하는 성향을 새에 비유하여 일컫는 경제 용어입니다.`}],
  history:`연준은 물가 상승률을 2% 목표치로 되돌리기 위해 역사상 가장 빠른 속도로 금리 인상을 단행해 왔습니다.`,
  players:`제롬 파월 의장을 비롯한 미 연준 주요 위원들과 이에 반응하는 글로벌 기관 투자자들입니다.`,
  current:`시장 일각에선 금리 인상 사이클의 종료를 기대했으나, 예상보다 탄탄한 미국 경제가 긴축 의지를 뒷받침하고 있습니다.`,
  outlook:`물가 지표와 고용 보고서 결과에 따라 연말 FOMC 회의에서 실제 추가 인상이 단행될지 여부가 결정됩니다.`,
  sources:[{title:`미 연준 추가 긴축 시사...글로벌 채권시장 발작 - 한국경제`,url:`https://www.hankyung.com/economy/article/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`국정감사 최대 쟁점 부상, 'DMZ 북한 지뢰 폭발' 여야 정면충돌`,
  metrics:[`국방위 공방 심화`,`조사 결과 상반`],
  summary:`비무장지대(DMZ) 인근에서 발생한 지뢰 폭발 사건을 두고 2026년 국정감사에서 여야 간 치열한 공방이 벌어지고 있습니다. 군 당국은 북한의 의도적인 도발과 지뢰 매설 가능성을 강력히 제기하며 안보 태세 강화를 주장했습니다. 반면 일부 정부 관계자는 명확한 증거 없이 공격으로 단정 짓기는 이르다며 신중한 입장을 보이면서 혼선이 가중되었습니다. 특히 한국군과 유엔사, 북한이 각각 다르게 적용하고 있는 군사분계선 기준 좌표 문제가 접경지역 긴장의 근본 원인으로 지목되고 있습니다. 야당은 안보 공백과 섣불리 위기를 조장하는 태도를 비판하는 반면, 여당은 확고한 대북 제재와 진상 규명을 촉구했습니다. 이 사건은 향후 남북 관계뿐만 아니라 한반도 주변 정세에 상당한 파장을 일으킬 것으로 전망됩니다. 양측은 이번 국감을 통해 각자의 안보 논리를 선점하기 위한 총력전을 펼치고 있습니다.`,
  keyTerms:[{term:`군사분계선`,explanation:`1953년 정전협정에 따라 남북한의 무력 충돌을 막기 위해 설정된 경계선으로, 흔히 휴전선이라고 불립니다.`}],
  history:`과거에도 목함지뢰 사건 등 DMZ 내에서 남북 간 긴장을 촉발하는 국지적 도발이나 사고가 반복되어 왔습니다.`,
  players:`국회 국방위원회 여야 의원들, 국방부 및 합동참모본부, 통일부, 그리고 유엔군 사령부가 관여되어 있습니다.`,
  current:`지뢰 폭발의 원인을 둘러싼 부처 간 미묘한 입장 차이가 국감장에서 야당의 집중 공격 대상이 되었습니다.`,
  outlook:`유엔사 차원의 진상 조사 결과가 발표될 경우, 이를 바탕으로 한 책임 소재 규명과 대북 성명 발표가 이어질 것입니다.`,
  sources:[{title:`DMZ 지뢰 폭발 책임론...국방위 국감 파행 - 연합뉴스`,url:`https://www.yna.co.kr/view/AKR`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 중간선거 임박, 트럼프 2기 행정부 동맹국 압박 수위 최고조`,
  metrics:[`고율 관세 경고`,`신경제 민족주의 심화`],
  summary:`11월 미국 중간선거를 앞두고 트럼프 2기 행정부의 미국 우선주의 정책이 절정에 달하고 있습니다. 미국은 자국 내 표심을 결집하기 위해 한국과 유럽 등 주요 동맹국들을 상대로 신경제 민족주의 기조를 한층 강화하고 있습니다. 구체적으로는 자국 내 제조 공장 건설과 대규모 인프라 투자를 노골적으로 압박하며, 이에 불응할 경우 고율 관세를 부과하겠다는 엄포를 놓고 있습니다. 이는 무역 적자를 해소하고 미국 내 제조업 일자리를 창출하여 선거에서 우위를 점하려는 전략적 행보로 풀이됩니다. 동맹국들은 이러한 미국의 독단적인 보호무역주의 조치에 반발하면서도, 보복 관세의 타격을 피하기 위해 고심하고 있습니다. 전통적인 안보 동맹과 경제 이익이 분리되는 현상이 더욱 뚜렷해지는 양상입니다. 결과적으로 국제 통상 질서는 자국 이익을 최우선으로 하는 거대한 무역 전쟁의 소용돌이로 빠져들고 있습니다.`,
  keyTerms:[{term:`신경제 민족주의`,explanation:`국가의 경제적 이익과 산업 보호를 최우선 가치로 내세우며, 무역 장벽을 높이고 자국 우선주의를 실행하는 배타적 경제 기조입니다.`}],
  history:`미국은 과거부터 무역적자 해소와 제조업 부흥을 위해 관세 장벽을 카드로 활용하는 통상 정책을 꾸준히 펼쳐왔습니다.`,
  players:`미국 행정부 및 의회, 그리고 이에 대응해야 하는 한국, EU 등 주요 수출 의존형 동맹국들입니다.`,
  current:`다가오는 중간선거 압박감이 맞물리면서, 경제적 성과를 과시하기 위한 대외 무역 압박 수위가 이례적으로 높아졌습니다.`,
  outlook:`중간선거 결과에 따라 미국의 통상 압박이 정책으로 굳어질지, 혹은 일정 부분 속도 조절에 들어갈지가 결정될 것입니다.`,
  sources:[{title:`중간선거 앞둔 미국, 동맹국 향한 무역 압박 거세져 - 한겨레`,url:`https://www.hani.co.kr/arti/politics/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`우크라이나 전쟁 끝없는 소모전, 양국 에너지·드론 타격전 격화`,
  metrics:[`전력망 30% 타격`,`소모전 장기화`],
  summary:`우크라이나 전쟁이 끝을 알 수 없는 소모전 양상으로 치달으며 양국 간의 전방위적인 타격전이 격화되고 있습니다. 러시아는 혹독한 겨울을 앞두고 우크라이나의 주요 전력망과 핵심 인프라를 겨냥해 첨단 미사일 공습을 대대적으로 퍼붓고 있습니다. 이에 맞서 우크라이나 역시 자체 개발한 장거리 드론 기술을 활용해 러시아 본토의 에너지 시설과 군사 기지를 반격하며 피해를 입히고 있습니다. 수차례 종전 협상 논의가 제기되었음에도 불구하고, 양측 모두 영토와 명분 문제에서 양보 없는 평행선을 달리며 전황은 오히려 악화되고 있습니다. 국제사회는 무기 지원과 제재를 통해 개입하고 있으나, 전쟁 피로감이 전 세계적으로 확산하는 추세입니다. 무고한 민간인 사상자와 대규모 난민 발생 등 인도주의적 위기 역시 통제 불능 상태로 치닫고 있습니다. 이번 혹한기가 전쟁의 향배를 가를 중대한 분수령이 될 것이라는 군사 전문가들의 분석이 지배적입니다.`,
  keyTerms:[{term:`소모전`,explanation:`빠른 승리를 거두기보다는 적의 인력, 물자, 자원을 지속적으로 고갈시켜 지치게 만드는 길고 지루한 전투 방식을 뜻합니다.`}],
  history:`2022년 발발한 우크라이나 전쟁은 영토 탈환과 방어선 유지를 거듭하며 수년째 교착 상태에 빠져 있습니다.`,
  players:`러시아와 우크라이나 정규군, 그리고 우크라이나를 후방에서 지원하는 미국과 나토(NATO) 동맹국들입니다.`,
  current:`전선에서의 교전뿐만 아니라 서로의 전쟁 수행 능력을 마비시키기 위한 인프라 파괴 전략에 집중하고 있습니다.`,
  outlook:`겨울철 전력난과 미국 등 주요 서방 국가들의 정치 일정 변화가 향후 협상 재개의 변수가 될 것입니다.`,
  sources:[{title:`전력망 노린 러시아 공습...끝없는 우크라이나 전쟁 - KBS 뉴스`,url:`https://news.kbs.co.kr/news/view.do?ncd=`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`퍼플렉시티 'AI 컴퓨터' 발표, 인간 대체하는 에이전트 시대 개막`,
  metrics:[`20개 LLM 연동`,`400개 툴 커넥터 지원`],
  summary:`글로벌 AI 스타트업 퍼플렉시티가 단순한 질의응답을 넘어 실제 업무를 스스로 수행하는 'AI 컴퓨터'를 전격 발표했습니다. 이번에 공개된 시스템은 20개 이상의 대규모 언어 모델(LLM)과 400여 개의 외부 툴 커넥터를 연동하여 사용자의 명령을 자율적으로 처리합니다. 예를 들어 일정 조율, 데이터 분석, 시스템 디버깅 등 복잡한 사무를 사용자의 개입 없이 끝까지 완수해 내는 방식입니다. 오픈AI, 메타 등 빅테크 기업들 역시 앞다투어 기업용과 개인용 AI 에이전트를 내놓으며 기술 패권 경쟁이 새로운 국면을 맞았습니다. 이는 AI가 정보를 찾아주는 검색 엔진의 역할을 넘어, 직접 행동하고 판단하는 주체로 진화했음을 상징합니다. 산업계는 생산성 혁명을 기대하는 한편, AI의 오작동이나 보안 취약점에 대한 검증 필요성도 제기하고 있습니다. 일상적인 업무 패턴이 근본적으로 재편되는 진정한 AI 에이전트 시대가 열렸습니다.`,
  keyTerms:[{term:`AI 에이전트`,explanation:`사람의 질문에 단순히 답만 해주는 것을 넘어, 사람을 대신해 목표를 세우고 필요한 도구를 사용해 스스로 업무를 처리하는 인공지능입니다.`}],
  history:`챗GPT 등장 이후 AI는 주로 텍스트 생성과 요약에 머물렀으나, 점차 소프트웨어를 직접 조작하는 단계로 발전해 왔습니다.`,
  players:`오픈AI, 퍼플렉시티, 메타 등 글로벌 거대 기술 기업과 이를 도입하려는 산업계 전반입니다.`,
  current:`기업들은 AI 도입을 통한 비용 절감과 효율성 극대화를 목표로 앞다투어 이 차세대 시스템을 테스트하고 있습니다.`,
  outlook:`올해 연말을 기점으로 AI가 스스로 판단하고 행동하는 기술이 주요 기업의 핵심 업무 시스템에 본격적으로 상용화될 전망입니다.`,
  sources:[{title:`퍼플렉시티, 행동하는 'AI 컴퓨터' 내놨다 - ZDNet Korea`,url:`https://zdnet.co.kr/view/?no=`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`철새 남하 본격화, 가을·겨울 가축 전염병 '24시간 철통 방역' 가동`,
  metrics:[`24시간 방역 가동`,`가축 전염병 유입 경보`],
  summary:`가을과 겨울철 철새의 본격적인 남하 시기가 시작됨에 따라, 정부가 조류인플루엔자(AI) 등 치명적인 가축 전염병 확산을 막기 위해 총력전에 돌입했습니다. 농림축산식품부와 각 지자체는 가금류 농가와 철새 도래지를 중심으로 24시간 특별 방역 체계를 가동하고 나섰습니다. 특히 올해는 해외에서 발생한 바이러스 변이가 국내로 유입될 가능성이 높아 더욱 각별한 주의가 요구되고 있습니다. 방역 당국은 농장 출입 차량과 인력에 대한 소독을 대폭 강화하고, 야생 조류 분변 검사를 촘촘하게 실시하고 있습니다. 가축 전염병이 확산될 경우 계란과 닭고기 등 주요 밥상 물가 폭등으로 직결될 수 있어 경제적 파장 또한 무시할 수 없습니다. 농가들은 외부 접촉을 철저히 차단하며 방역 수칙 준수에 사활을 걸고 있습니다. 선제적인 예방 조치만이 매년 반복되는 바이러스 피해를 최소화할 수 있는 유일한 대안으로 꼽힙니다.`,
  keyTerms:[{term:`조류인플루엔자`,explanation:`닭, 오리, 철새 등 조류에게 감염되는 호흡기 질환으로, 전염성이 매우 강하고 폐사율이 높아 양계 농가에 치명적인 바이러스입니다.`}],
  history:`매년 겨울철 시베리아 등 북방에서 날아오는 겨울 철새 무리를 통해 국내 농가로 바이러스가 유입되는 패턴이 반복되어 왔습니다.`,
  players:`농림축산식품부, 지방자치단체 방역팀, 전국의 가금류 사육 농가 및 가축 방역 전문가들입니다.`,
  current:`현재 첫 철새 무리가 도래하기 시작하는 초기 단계로, 아직 농가 발병 사례는 없으나 위험도가 급격히 상승하는 시점입니다.`,
  outlook:`내년 봄 철새가 다시 북상할 때까지 긴장 상태가 지속되며, 방역망 뚫림 여부가 축산 물가 안정의 핵심 변수가 될 것입니다.`,
  sources:[{title:`철새 남하 시작...가축 방역 '비상' - MBC 뉴스`,url:`https://imnews.imbc.com/news/2026/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`가속화되는 인구 위기, 농촌 빈집 급증으로 지방소멸 현실화`,
  metrics:[`농촌 빈집 비율 15% 돌파`,`초고령화 심화`],
  summary:`대한민국의 저출산과 초고령화 여파가 거세지면서 농어촌 지역의 빈집이 기하급수적으로 늘어나며 지방소멸 우려가 현실로 다가오고 있습니다. 통계청 자료에 따르면 일부 군 단위 지자체의 경우 전체 주택 중 빈집 비율이 15%를 넘어선 것으로 파악되었습니다. 청년층의 지속적인 수도권 유출과 남은 고령 인구의 사망으로 인해 마을 단위 공동체가 붕괴 위기에 처해 있습니다. 방치된 낡은 가옥들은 경관 훼손은 물론 우범지대로 전락할 위험이 커 사회적 골칫거리로 전락하고 있습니다. 각 지자체가 귀농 및 귀촌 지원금 확대와 빈집 정비 사업을 추진하고 있지만, 턱없이 부족한 예산과 인프라 한계로 실질적인 해결에는 미치지 못하고 있습니다. 근본적인 원인인 인구 구조 변화를 되돌리기 어려운 만큼, 공간 압축 정책 등 발상의 전환이 시급하다는 목소리가 큽니다. 지방 살리기를 위한 범정부 차원의 강력한 패러다임 혁신이 요구되는 시점입니다.`,
  keyTerms:[{term:`지방소멸`,explanation:`젊은 인구의 이탈과 낮은 출산율로 인해 지방의 인구가 줄어들어, 결국 마을이나 도시 자체가 사라질 위험에 처하는 현상입니다.`}],
  history:`수십 년간 지속된 수도권 일극 집중 현상과 급격한 출산율 저하가 맞물려 지방 인구의 만성적인 감소를 초래했습니다.`,
  players:`생존 위기에 몰린 지방자치단체, 중앙 정부, 그리고 지방을 떠나 도시로 향하는 청년 세대입니다.`,
  current:`빈집 문제와 폐교 증가가 눈에 띄게 가속화되면서, 정책적 개입의 골든타임이 얼마 남지 않았다는 위기감이 팽배합니다.`,
  outlook:`거점 도시 중심의 인프라 재편이나 체류 인구 확대를 유도하는 새로운 형태의 지방 발전 특별법 제정 논의가 본격화될 것입니다.`,
  sources:[{title:`농촌 덮친 빈집 쇼크...지방소멸 가속 - 조선일보`,url:`https://www.chosun.com/national/article/`}]
}]

  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`파라마운트와 워너 브라더스 디스커버리, 1,100억 달러 규모의 초대형 미디어 합병 완료`,
  metrics:[`인수 규모 1,100억 달러`,`초대형 미디어 기업 탄생`],
  summary:`글로벌 미디어 거인 파라마운트가 워너 브라더스 디스커버리를 1,100억 달러에 인수하는 절차가 완료되었다. 스트리밍 시장에서 넷플릭스와 디즈니 등 거대 경쟁사들에 맞서기 위한 생존 전략으로 분석된다. 양사의 방대한 콘텐츠 라이브러리가 결합되면서 시장 판도에 큰 변화가 예상된다. 특히 이번 인수합병(M&A)은 미디어 업계 역대 최대 규모 중 하나로 기록될 전망이다. 향후 구독자 확보 경쟁과 콘텐츠 투자 전략이 시장의 핵심 관전 포인트로 떠오르고 있다. 구조조정 및 조직 통합 과정에서 발생할 수 있는 마찰을 어떻게 최소화할지가 초기 성공의 관건이다.`,
  keyTerms:[{term:`인수합병(M&A)`,explanation:`기업이 다른 기업을 사들이거나 두 기업이 하나로 합쳐지는 것을 뜻한다. 시장 점유율을 높이거나 경쟁력을 강화하기 위해 주로 사용된다.`}],
  history:`넷플릭스 주도의 스트리밍 시장 재편 이후 전통적 미디어 기업들은 수익성 악화와 가입자 정체라는 이중고를 겪어왔다.`,
  players:`넷플릭스, 디즈니 등 선두주자들에 대항하기 위해 파라마운트와 워너 브라더스가 결단을 내렸다.`,
  current:`두 회사의 합병으로 압도적인 지식재산권을 보유한 거대 플랫폼이 탄생하며 시장의 긴장감이 고조되고 있다.`,
  outlook:`반독점 규제 당국의 최종 승인 여부와 합병 후 요금제 개편 등 소비자 체감 변화에 관심이 쏠린다.`,
  sources:[{title:`파라마운트-워너 미디어 빅딜 - 로이터`,url:`https://www.reuters.com`},{title:`초대형 합병 완료 - Axios`,url:`https://www.axios.com`}]

  headline:`중기부 'AI 전환(AX)' 핵심 사업 예산 집행률 30% 미만으로 실효성 논란`,
  metrics:[`스마트 제조지원 5.1%`,`AI 도우미 구축 14.7%`],
  summary:`중소벤처기업부의 인공지능 전환 이른바 'AX(AI Transformation)' 핵심 사업의 예산 집행률이 30%를 밑도는 것으로 나타났다. 국정감사 자료에 따르면 소공인 스마트 제조지원이나 소상공인 AI 도우미 구축 사업 등의 집행률이 매우 저조하다. 예산 확보에도 불구하고 현장 수요와 동떨어진 정책 설계나 홍보 부족이 원인으로 지목된다. 정부의 디지털 혁신 드라이브가 실제 산업 현장에는 닿지 못하고 있다는 비판이 제기된다. AX(AI Transformation) 가속화를 위해서는 지원 절차 간소화와 맞춤형 컨설팅이 시급하다는 목소리가 높다.`,
  keyTerms:[{term:`AX(AI Transformation)`,explanation:`인공지능 기술을 도입하여 기업의 업무 프로세스나 비즈니스 모델을 근본적으로 혁신하는 것을 말한다.`}],
  history:`글로벌 기술 경쟁 격화에 따라 정부는 중소기업과 소상공인의 디지털 경쟁력을 높이기 위해 대규모 예산을 편성했다.`,
  players:`중소벤처기업부와 예산을 지원받아야 할 중소기업 및 소상공인들이 주요 이해관계자다.`,
  current:`국정감사에서 실집행률이 공개되면서 정책의 실효성과 탁상행정 논란이 불거졌다.`,
  outlook:`향후 예산 집행률 제고를 위한 정부의 정책 보완과 현장 체감형 지원책 마련 여부가 주목된다.`,
  sources:[{title:`중기부 AI 전환 예산 집행 저조 - 연합뉴스`,url:`https://www.yna.co.kr`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`삼성바이오로직스 노조, 법 개정 명분으로 삼성전자와 직접 교섭 요구`,
  metrics:[`총파업 국면 전환`,`2대 주주 삼성전자`],
  summary:`삼성바이오로직스 노동조합이 2대 주주인 삼성전자와의 직접 교섭을 요구하며 파장을 일으키고 있다. 노조 측은 삼성전자가 인사와 보상에 실질적으로 관여하고 있다며 이를 근거로 내세웠다. 최근 국회를 통과한 노란봉투법 개정안이 실질적 지배력을 가진 원청업체의 교섭 의무를 확대하면서 노조의 주장에 힘을 싣고 있다. 반면 사측은 경영 개입이 전혀 없었다며 노조의 주장을 강하게 반박하고 있다. 재계는 이번 사태가 단순한 노사 갈등을 넘어, 향후 원하청 교섭 관행에 큰 영향을 미칠 선례가 될 것으로 보고 예의주시하고 있다.`,
  keyTerms:[{term:`노란봉투법`,explanation:`하청업체 노동자가 실질적인 지배력을 가진 원청업체를 상대로 교섭할 수 있도록 하고, 파업에 대한 과도한 손해배상 청구를 제한하는 노조법 개정안이다.`}],
  history:`원청의 실질적 지배력을 둘러싼 하청 노조와의 갈등은 오랫동안 산업계의 핵심 쟁점이었으며, 잦은 분쟁을 유발했다.`,
  players:`직접 교섭을 요구하는 삼성바이오로직스 노조, 선을 긋는 사측, 그리고 2대 주주인 삼성전자가 얽혀 있다.`,
  current:`노조가 법 개정 취지를 명분으로 압박 수위를 높이면서 대기업 재계 전반에 긴장감이 돌고 있다.`,
  outlook:`고용노동부의 유권해석 및 법원의 후속 판결에 따라 국내 노사관계 지형이 크게 요동칠 수 있다.`,
  sources:[{title:`삼바 노조, 삼성전자에 교섭 요구 - 조선일보`,url:`https://www.chosun.com`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`프랑스 전역에서 열악한 교육 환경에 항의하는 대규모 학생 및 교사 시위 격화`,
  metrics:[`전국적 파업`,`경찰 물대포 동원`],
  summary:`프랑스 전역에서 교원 부족과 열악한 학교 시설 등 교육 환경 개선을 촉구하는 학생과 교사들의 대규모 시위가 격화되고 있다. 파리를 비롯한 주요 도시에서는 시위대와 경찰이 충돌하며 최루탄과 물대포가 동원되는 등 긴장이 최고조에 달했다. 시위대는 정부의 교육 예산 삭감 정책이 공교육 붕괴를 초래하고 있다고 강하게 비판했다. 반면 마크롱 정부는 재정 건전성 확보를 위해 긴축 재정이 불가피하다는 입장을 고수하고 있다. 이번 시위는 교육 불평등에 대한 국민적 분노가 폭발한 결과로, 정부의 대응 방식에 따라 정권의 지지율에도 큰 타격을 줄 수 있다.`,
  keyTerms:[{term:`긴축 재정`,explanation:`정부가 국가 부채를 줄이거나 물가를 잡기 위해 지출을 엄격히 줄이고 세금을 늘리는 씀씀이 억제 정책이다.`}],
  history:`프랑스 공교육 현장은 수년간 이어진 예산 동결과 인력 부족으로 교사와 학생들의 불만이 누적되어 왔다.`,
  players:`교육 예산 확충을 요구하는 노조 측과 국가 부채 절감을 중시하는 프랑스 마크롱 정부가 맞서고 있다.`,
  current:`평화롭던 집회가 점차 물리적 충돌로 번지면서 폭력 사태에 대한 우려와 시위 동정론이 교차하고 있다.`,
  outlook:`교육 당국과 노조 간의 타협점이 조속히 마련되지 않으면 다른 공공 부문의 연대 파업으로 확산될 위험이 있다.`,
  sources:[{title:`프랑스 학교 시위 격화 - BBC`,url:`https://www.bbc.com`},{title:`경찰 최루탄 진압 - 가디언`,url:`https://www.theguardian.com`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`사우디 주도 연합군과 후티 반군 간 충돌 재점화로 중동 정세 긴장 고조`,
  metrics:[`미사일 요격 발생`,`예멘 전선 격화`],
  summary:`예멘 내전 전선에서 사우디아라비아 주도 연합군과 후티 반군 간의 무력 충돌이 재점화되며 중동 지역의 긴장이 다시 고조되고 있다. 연합군의 공습과 후티 반군의 미사일 요격 시도가 이어지면서 휴전 협상 노력이 무산될 위기에 처했다. 이번 충돌은 지역 내 패권을 둘러싼 이란과 사우디 간의 대리전 성격을 띠고 있어 사태 해결이 쉽지 않다. 국제사회는 민간인 피해 확산과 글로벌 원유 수송로인 홍해의 안전을 우려하며 양측의 자제를 촉구했다. 중동 정세 불안은 언제든 국제 유가 급등과 세계 경제의 불확실성으로 직결될 수 있는 뇌관이다.`,
  keyTerms:[{term:`대리전`,explanation:`대립하는 두 강대국이 직접 싸우지 않고, 제3국의 내부 분쟁에 개입해 각자의 지지 세력을 내세워 싸우는 전쟁 형태다.`}],
  history:`예멘 내전은 사우디 연합군과 이란의 지원을 받는 후티 반군의 장기 대립으로 이어지며 최악의 인도적 위기를 낳았다.`,
  players:`사우디아라비아, 후티 반군, 배후의 이란, 그리고 평화를 중재하려는 서방 국가들이 복잡하게 얽혀 있다.`,
  current:`휴전 기대감으로 소강상태를 보이던 전선에서 양측이 다시 치명적인 무기를 동원해 무력 공방을 벌이고 있다.`,
  outlook:`국제사회의 중재 노력이 실패할 경우 홍해 무역로 차질 및 국제 유가 상승 등 세계 경제 전반에 악영향을 미칠 수 있다.`,
  sources:[{title:`예멘 전선 다시 격화 - 알자지라`,url:`https://www.aljazeera.com`},{title:`사우디와 후티 충돌 - PBS`,url:`https://www.pbs.org`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`국정감사에서 대법원장 대상 공방 가열, 사법부 독립성 침해 논란`,
  metrics:[`사법부 압박 수위 최고조`,`형사사법체계 쟁점화`],
  summary:`국회 국정감사에서 새 형사사법체계 및 재판 지연 문제를 두고 조희대 대법원장에 대한 여야의 공방이 치열하게 벌어졌다. 특히 여권 의원들은 특정 재판 지연 문제와 법관 인사 편향성을 거세게 지적하며 대법원장을 압박했다. 이에 대해 법조계 일각에서는 헌법이 보장하는 사법부 독립성이 심각하게 침해될 수 있다며 강한 우려를 표명했다. 대법원장은 재판의 독립과 절차적 정당성을 훼손하는 어떠한 정치적 외압에도 흔들리지 않겠다는 단호한 입장을 피력했다. 정치가 사법을 흔드는 이른바 '사법의 정치화' 현상은 이번 국정감사 기간 내내 뜨거운 쟁점이 될 전망이다.`,
  keyTerms:[{term:`사법부 독립성`,explanation:`법관이 어떠한 정치적, 외부적 압력이나 간섭도 받지 않고 오직 법과 양심에 따라 공정하게 재판할 수 있도록 보장하는 원칙이다.`}],
  history:`과거부터 주요 정치적 판결이나 사법부 요직 인사를 두고 입법부와 사법부 간의 팽팽한 기싸움은 고질적인 문제였다.`,
  players:`사법부를 대표하는 대법원장과 국정감사 질의를 통해 압박을 가하는 국회의원들이 직접 대립하고 있다.`,
  current:`주요 정치인들의 재판 이슈가 맞물린 민감한 시기에 국감이 열리면서 양측의 날 선 공방이 이어지고 있다.`,
  outlook:`이번 공방이 향후 법원의 주요 사건 판결 속도나 핵심 법관 인사에 실질적 영향을 미칠지 관심이 집중되고 있다.`,
  sources:[{title:`국감 대법원장 공방, 사법 독립 논란 - 미디어인뉴스`,url:`https://www.mediainnews.com`},{title:`조희대 대법원장 출석 국감 - 연합뉴스`,url:`https://www.yna.co.kr`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`미국 테네시주 사형수 독극물 주사 집행 실패 참사, 거센 인권 논란`,
  metrics:[`독극물 집행 실패`,`미국 전역 논쟁 점화`],
  summary:`미국 테네시주에서 사형수에 대한 독극물 주사 사형 집행이 실패로 돌아가면서 큰 파장이 일고 있다. 사형 집행 중 치명적 독극물이 제대로 투여되지 않아 사형수가 고통 속에서 깨어나는 충격적인 사태가 발생했다. 이 사건을 계기로 미국 내 인권 단체들은 독극물 주사의 잔혹성과 사형제 자체의 비윤리성을 강하게 규탄하고 나섰다. 반면 피해자 가족들은 정의 실현이 지연되고 있다며 형 집행 절차를 바로잡으라고 주 정부를 비판했다. 생명권 존중과 흉악범에 대한 형벌의 정당성을 묻는 사형제 폐지 논쟁이 미국 전역에서 다시 격렬하게 점화되고 있다.`,
  keyTerms:[{term:`사형제 폐지`,explanation:`국가가 범죄자의 생명을 강제로 박탈하는 궁극의 형벌인 사형 제도를 인권 보호 등을 이유로 법에서 완전히 없애자는 주장이다.`}],
  history:`미국 내 여러 주에서는 제약사들의 독극물 공급 거부와 잇따른 집행 과정의 사고로 인해 사형 방식에 대한 논란이 끊이지 않았다.`,
  players:`잔혹한 형벌을 멈춰야 한다는 인권 단체와 확정된 사형 판결의 신속한 집행을 요구하는 주 정부 및 유족이 충돌하고 있다.`,
  current:`전례 없는 끔찍한 집행 실패 사고가 발생하면서 기존 사형 방식의 기술적, 윤리적 결함이 여과 없이 폭로되었다.`,
  outlook:`이번 사건이 연방대법원의 위헌 심사로 이어지거나, 각 주의 공식적인 사형 집행 유예 선언을 이끌어낼지 주목된다.`,
  sources:[{title:`사형 집행 실패 논란 - 워싱턴포스트`,url:`https://www.washingtonpost.com`},{title:`크리스타 파이크 사건 파장 - 악시오스`,url:`https://www.axios.com`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`러시아 전염병 연구소 직원 의문사, 흑사병 유출 의혹 제기로 긴장 고조`,
  metrics:[`고위험 연구소 1명 사망`,`국제사회 해명 요구`],
  summary:`러시아의 한 고위험 전염병 연구소에서 근무하던 직원이 원인 불명으로 사망하면서 치명적인 흑사병 유출 의혹이 확산되고 있다. 해당 연구소는 과거 에볼라, 탄저병 등 고위험 병원체를 광범위하게 다뤄온 곳으로 최고 수준의 보안 시설이다. 미국과 세계보건기구(WHO)는 전 세계적인 새로운 감염병 확산을 막기 위해 러시아 정부에 즉각적이고 투명한 정보 공개를 요구했다. 그러나 러시아 당국은 단순한 내부 사고일 뿐이라며 외부 조사와 개입을 강하게 거부하고 있다. 병원체 유출 사고에 대한 공포가 커지면서 국제사회의 보건 안보 불안감이 급격히 고조되는 상황이다.`,
  keyTerms:[{term:`병원체 유출`,explanation:`연구소나 병원 등 통제된 안전 시설에서 보관 중이던 바이러스나 세균 등 치명적인 질병 원인균이 외부로 빠져나가는 사고를 뜻한다.`}],
  history:`과거 냉전 시절부터 러시아의 군사 및 생물학 무기 연구소들은 정보 투명성 부족 문제로 서방 국가들의 강한 의심을 받아왔다.`,
  players:`투명한 진상 규명을 압박하는 세계보건기구와 미국, 그리고 이를 부당한 내정 간섭으로 일축하는 러시아 정부가 대립 중이다.`,
  current:`치명률이 높은 흑사병 관련 병원체가 다뤄진 곳에서의 인명 사고인 만큼, 당국의 은폐 의혹이 눈덩이처럼 커지고 있다.`,
  outlook:`러시아가 독립적인 국제 의료 조사단의 방문을 끝내 거부할 경우, 외교적 마찰과 보건 관련 제재로 이어질 가능성이 높다.`,
  sources:[{title:`러시아 연구소 사망 미스터리 - CBS News`,url:`https://www.cbsnews.com`},{title:`WHO 정보 공개 촉구 - 알자지라`,url:`https://www.aljazeera.com`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`올해 1~7월 10대 마약류 사범 370명 검거, 작년 전체 인원의 79% 육박`,
  metrics:[`7개월 만에 370명 검거`,`작년 전체의 79% 육박`],
  summary:`최근 국내에서 10대 청소년들의 마약류 범죄가 위험 수위를 넘어서며 사회적 경각심이 높아지고 있다. 경찰청 국감 자료에 따르면 올해 1월부터 7월까지 검거된 10대 마약사범은 총 370명으로, 불과 7개월 만에 작년 전체 검거 인원의 약 79%에 육박했다. 텔레그램 등 익명성이 짙은 메신저를 통해 강력 마약에 너무나 쉽게 접근할 수 있게 된 것이 주된 원인으로 꼽힌다. 호기심에 시작한 불법 약물 투약이 걷잡을 수 없는 중독으로 이어지며 평범한 교실까지 심각한 위협을 받고 있다. 전문가들은 엄벌 위주의 단속을 넘어, 다크웹(Dark Web) 모니터링 강화와 청소년 맞춤형 치유 시스템이 시급하다고 지적한다.`,
  keyTerms:[{term:`다크웹(Dark Web)`,explanation:`일반적인 검색 엔진으로는 찾을 수 없고 특수한 웹 브라우저를 통해서만 접속할 수 있는 암호화된 인터넷망으로, 마약 등 불법 거래에 흔히 악용된다.`}],
  history:`과거 특정 직업군에 집중되었던 마약 범죄가 최근 몇 년 새 스마트폰 보급 확산과 맞물려 미성년자와 일반 청소년층으로 파고들었다.`,
  players:`불법 약물을 은밀히 유통하는 범죄 조직, 치명적 유혹에 노출된 10대들, 그리고 방어에 나선 경찰 및 교육 당국이 있다.`,
  current:`다이어트 약이나 집중력 보조제로 교묘하게 위장된 의료용 마약류까지 무분별하게 퍼지면서 학부모들의 불안감이 최고조에 달했다.`,
  outlook:`경찰의 대대적인 연말 특별 단속과 함께, 일선 학교 내 실효성 있는 마약 예방 교육 의무화 논의가 탄력을 받을 전망이다.`,
  sources:[{title:`10대 마약사범 급증 - 연합뉴스`,url:`https://www.yna.co.kr`}]
}]

  tag:`2026-10-06`,

  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`AI 반도체 수출 호조에도 내수 침체 장기화로 한국 경제 'K자형 양극화' 심화`,
  metrics:[`반도체 수출 전년 대비 50% 이상 증가`,`민간소비 증가율 1%대 초반 정체`],
  summary:`한국 경제가 반도체를 중심으로 수출 호조를 보이고 있지만, 내수 침체가 장기화되며 이른바 K자형 양극화 현상이 뚜렷해지고 있습니다. HBM 등 AI 반도체 관련 기업들의 실적은 사상 최고치를 기록 중인 반면, 영세 자영업자 폐업과 가계의 소비 여력은 바닥을 치고 있습니다. 고금리와 고물가 여파로 인해 대기업의 수출 성과가 서민 경제로 흘러내리는 낙수효과가 사실상 사라진 구조적 문제로 분석됩니다. 특히 부동산 PF 부실 여진으로 건설투자까지 얼어붙으면서 내수 산업 전반의 타격이 매우 큰 상황입니다. 한국은행의 기준금리 인하 고민이 깊어지는 가운데 정책적 딜레마가 지속되고 있습니다. 정부 차원에서 체감 경기를 살리기 위한 실질적이고 정교한 내수 부양 정책 마련이 시급하다는 목소리가 커지고 있습니다.`,
  keyTerms:[{term:`K자형 양극화`,explanation:`특정 산업이나 계층은 크게 성장하는 반면, 다른 쪽은 오히려 침체하며 그래프 모양처럼 양극단으로 벌어지는 경제 현상입니다.`}],
  history:`팬데믹 이후 고금리 환경이 장기화되면서 부채가 많은 자영업자와 서민층의 경제적 타격이 지속적으로 누적되어 왔습니다.`,
  players:`막대한 수출 이익을 내는 반도체 대기업과 내수 침체의 직격탄을 맞은 소상공인, 그리고 통화정책 키를 쥔 한국은행이 주요 주체입니다.`,
  current:`반도체 호황이라는 착시 효과가 거시 경제 지표를 가리고 있어, 일반 국민이 체감하는 경기 빙하기가 더욱 적나라하게 부각되는 변곡점입니다.`,
  outlook:`향후 금리 인하 시점과 내수 부양책의 구체적인 강도에 따라 얼어붙은 소비 심리가 반등할 수 있을지 시장의 이목이 쏠리고 있습니다.`,
  sources:[{title:`반도체 날지만 내수는 꽁꽁... 뚜렷해진 양극화 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`한은 기준금리 인하 고심, 서민 체감 경기 빙하기 - 매일경제`,url:`https://www.mk.co.kr/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`고금리 장기화 우려 속에서도 월가 'AI 랠리'로 나스닥 사상 최고치 경신`,
  metrics:[`미 국채 10년물 금리 5% 육박`,`빅테크 AI 인프라 투자 30% 이상 급증`],
  summary:`미국 국채 10년물 금리가 5%에 육박하는 등 고금리 뉴노멀에 대한 시장의 경계감이 커지고 있지만 미 증시는 강한 상승장을 이어가고 있습니다. 엔비디아, 마이크로소프트 등 대형 기술주들이 AI 인프라 구축에 천문학적인 자본을 투입하며 강력한 미래 실적 기대감을 견인하고 있기 때문입니다. 통상적으로 고금리는 미래 가치를 할인해 기술주에 악재로 작용하지만, 현재는 AI 산업의 압도적 폭발력이 자본 조달 비용 부담을 완전히 상쇄하는 이례적인 장세가 연출되고 있습니다. 월가에서는 이를 두고 AI 랠리가 이끄는 새로운 패러다임이라고 평가합니다. 다만 높은 차입 금리 부담으로 인해 AI 수혜를 보지 못하는 전통 제조업 기업들의 도산 위험은 오히려 커지고 있습니다. 이에 따라 주식 시장 내 쏠림 현상과 차별화가 앞으로 더욱 심화할 것이라는 전망이 제기됩니다.`,
  keyTerms:[{term:`고금리 뉴노멀`,explanation:`과거의 초저금리 시대로 다시 돌아가지 않고, 예전보다 높은 수준의 금리가 새로운 표준으로 굳어지는 경제 환경을 뜻합니다.`}],
  history:`미국 연준의 고강도 긴축 이후 인플레이션이 쉽게 꺾이지 않으면서, 시장에는 높은 차입 비용이 장기화될 것이라는 우려가 자리 잡았습니다.`,
  players:`자금 조달 비용을 감당할 수 있는 대규모 빅테크 기업들과 금리 부담에 짓눌린 전통 기업, 기준금리를 결정하는 연준이 주요 핵심입니다.`,
  current:`금리 인하에 대한 시장의 기대가 약화되었음에도 불구하고, 오직 AI 성장성 하나가 전체 주식 시장의 밸류에이션을 끌어올리는 특이한 구간입니다.`,
  outlook:`빅테크 기업들의 분기 실적 발표 결과와 향후 연준의 고용 및 물가 지표 해석에 따라 기술주 랠리의 지속 여부가 판가름 날 전망입니다.`,
  sources:[{title:`고금리에도 질주하는 월스트리트... AI가 이끄는 랠리 - Bloomberg`,url:`https://www.bloomberg.com/`},{title:`나스닥 최고치 경신, 전통 기업과 빅테크 차별화 심화 - WSJ`,url:`https://www.wsj.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`중동 군사적 긴장 고조로 글로벌 원유 공급망 리스크 재부각`,
  metrics:[`WTI 원유 배럴당 80달러 재돌파`,`G7 비상 비축유 방출 대기 물량 확보`],
  summary:`중동 지역의 무력 충돌 격화와 주요 해협 봉쇄 리스크가 불거지면서 잠잠하던 국제 원유 시장이 다시 요동치고 있습니다. 이란을 비롯한 주요 산유국 주변의 지정학적 긴장이 극에 달하면서 텍사스산원유 가격은 단숨에 배럴당 80달러 선을 재돌파했습니다. 글로벌 에너지 공급망 차질에 대한 공포 심리가 확산되자, 미국과 G7 국가들은 즉각 대응에 나섰습니다. 주요 선진국들은 비상 비축유 추가 방출 카드를 만지작거리며 유가 억제와 시장 불안 진정에 총력을 기울이고 있습니다. 에너지 가격 불안은 간신히 둔화되던 글로벌 인플레이션을 다시 자극할 수 있어 각국 중앙은행의 금리 정책 셈법을 매우 복잡하게 만들고 있습니다. 시장 참가자들은 단기적인 유가 급등락이 실물 경제 전반에 미칠 파장을 극도로 예의주시하며 사태의 추이를 지켜보고 있습니다.`,
  keyTerms:[{term:`비상 비축유`,explanation:`갑작스러운 전쟁이나 재난으로 에너지 수급 위기 및 유가 폭등이 발생할 때 시장 안정을 위해 국가가 미리 저장해 둔 원유를 방출하는 물량입니다.`}],
  history:`과거 수년간 중동 지역의 고질적인 분쟁 때마다 원유 수급 불안이 반복되었으며, 팬데믹 이후 에너지 가격 변동성은 물가에 직접적인 타격을 입혔습니다.`,
  players:`호르무즈 해협을 통제하려는 중동 산유국들과 에너지 가격 급등을 막으려는 미국 및 유럽 등 주요 석유 소비국들의 줄다리기가 이어집니다.`,
  current:`글로벌 금리 인하 사이클이 조심스럽게 시작되려는 시점에 유가 급등이라는 거대한 복병이 나타나 인플레이션 통제에 적신호가 켜진 상태입니다.`,
  outlook:`군사 충돌의 확전 여부와 미국 주도의 원유 공급 안정화 조치 실효성이 향후 글로벌 유가 안정세를 결정지을 가장 중요한 변수입니다.`,
  sources:[{title:`중동 불안에 국제 유가 급등... 배럴당 80달러 돌파 - Reuters`,url:`https://www.reuters.com/`},{title:`G7 유가 안정 위해 원유 방출 저울질 - FT`,url:`https://www.ft.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`2026년 국회 국정감사 개막, 첫날부터 주요 인사 증인 채택 두고 여야 정면충돌`,
  metrics:[`피감기관 800여 곳 대상 진행`,`주요 쟁점 증인 채택 건수 50여 건 합의 불발`],
  summary:`2026년 정기국회 국정감사가 전국의 피감기관 800여 곳을 대상으로 오늘 일제히 막을 올렸습니다. 국감 첫날부터 민생 안정을 강조하는 여당과 정부의 각종 실정 검증을 벼르는 야당 간의 치열한 기싸움이 벌어지고 있습니다. 특히 대법원장을 비롯한 주요 고위 공직자들의 핵심 증인 채택 여부를 두고 각 상임위마다 고성과 파행이 잇따르는 등 정면충돌이 정점에 달했습니다. 야당은 부동산, 인사 참사, 외교안보 등 국정 전반에 걸친 전방위적인 송곳 검증을 예고했습니다. 반면 여당은 이를 국정 발목잡기용 정치 공세로 규정하며 철저한 방어막을 치고 여론전에 집중하고 있습니다. 내년 대형 선거를 앞두고 정국 주도권을 쥐기 위한 여야의 극한 대립이 이번 국정감사 기간 내내 지속될 것으로 보입니다.`,
  keyTerms:[{term:`피감기관`,explanation:`입법부인 국회가 행정부의 정책 수행과 예산 집행이 올바른지 조사하고 감사할 때, 그 대상이 되는 국가 기관이나 공공기관을 뜻합니다.`}],
  history:`최근 2년간 지속된 물가 상승과 부동산 정책 관련 논란, 주요 부처 인사 문제 등으로 인해 정치권의 책임 공방이 계속 누적되어 왔습니다.`,
  players:`대통령실 및 주요 부처 정책을 엄호하는 여당 지도부와, 송곳 검증을 통해 대안을 제시하며 정권 심판론을 부각하려는 거대 야당이 대립하고 있습니다.`,
  current:`각종 쟁점 법안 처리와 증인 채택 합의가 불발되면서 첫날부터 정상적인 상임위 진행이 차질을 빚고 있으며, 양측 모두 물러서지 않고 있습니다.`,
  outlook:`경제 및 외교 분야 핵심 증인들이 국정감사장에 출석할 경우, 새롭게 제기되는 의혹과 여론의 향배가 향후 정국의 최대 분수령이 될 것입니다.`,
  sources:[{title:`2026 국감 막 올랐다... 시작부터 주요 증인 쟁탈전 - KBS`,url:`https://news.kbs.co.kr/`},{title:`여야 벼랑 끝 대치, 정책 국감 실종 우려 - 조선일보`,url:`https://www.chosun.com/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`서부전선 DMZ 지뢰 폭발 원인 '북한군 매설' 최종 확인, 대북 긴장 최고조`,
  metrics:[`군사분계선 이남 1km 지점 발견`,`대북 확성기 방송 일 10시간으로 확대`],
  summary:`최근 서부전선 비무장지대 이남 지역에서 발생한 의문의 지뢰 폭발 사건이 북한군의 의도적인 매설 도발로 최종 확인되었습니다. 국방부 합동조사단은 현장에서 수거된 잔해와 지형 분석 결과를 종합한 결과 북한군이 야간을 틈타 군사분계선 이남으로 넘어와 지뢰를 묻은 정황을 명확히 확보했다고 발표했습니다. 이에 우리 군 당국은 즉각 전방 최전방 지역의 대북 확성기 방송 시간을 대폭 연장하고 추가적인 상응 조치를 경고하는 등 강경 대응에 돌입했습니다. 접경 지역을 중심으로 남북 간 군사적 긴장이 최근 몇 년 새 최고조에 달하며 불안감이 커지고 있습니다. 정치권에서도 북한의 명백한 정전협정 위반 도발에 대한 단호하고 치밀한 군사적 대응을 한목소리로 주문했습니다. 동시에 우발적인 대규모 무력 충돌 방지를 위한 안보 태세의 전면적인 재점검 요구가 각계에서 쏟아지고 있습니다.`,
  keyTerms:[{term:`군사분계선`,explanation:`정전협정에 따라 남북한의 직접적인 무력 충돌을 막기 위해 한반도를 가로질러 설정된 경계선으로, 흔히 휴전선이라고 불립니다.`}],
  history:`과거에도 목함지뢰 폭발 사건 등 국지적인 도발이 발생한 바 있으며, 북한은 최근 대남 강경 기조를 굳히며 잇달아 긴장을 조성해 왔습니다.`,
  players:`도발을 주도한 북한 군부와 강경 대응 방침을 천명한 한국 국방부, 그리고 확전 방지를 중재하려는 주한미군 및 국제사회가 얽혀 있습니다.`,
  current:`군 당국의 강경한 확성기 방송 재개 및 물리적 경계 강화 조치로 인해 접경 지역 일대에 언제든 추가 국지전이 벌어질 수 있는 일촉즉발의 상황입니다.`,
  outlook:`북한의 추가적인 대남 무력 시위 여부와 우리 군의 대응 수위 조절이 향후 한반도 평화 프로세스의 단기적 운명을 좌우할 예정입니다.`,
  sources:[{title:`서부전선 지뢰 폭발, 북한 소행으로 결론 - 중앙일보`,url:`https://www.joongang.co.kr/`},{title:`군, 대북 확성기 방송 확대... 긴장 최고조 - SBS`,url:`https://news.sbs.co.kr/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 우선주의 심화로 동맹국 방위비·관세 청구서 압박 거세져`,
  metrics:[`주요 동맹국 방위비 분담금 인상률 20% 압박`,`수입 자동차·철강 추가 관세율 최대 15% 검토`],
  summary:`11월 핵심 선거를 앞둔 미국 정부가 외교와 안보를 철저히 자국 경제 이익과 맞교환하는 거래적 동맹 기조를 더욱 노골화하고 있습니다. 미국은 유럽과 아시아 핵심 동맹국들을 상대로 방위비 분담금의 대폭적인 인상을 강력하게 요구하고 나섰습니다. 이와 동시에 자동차와 철강 등 우방국의 주력 수출품에 대한 대규모 추가 관세 인상 카드를 꺼내 들며 전방위적 압박을 가하고 있습니다. 미국의 군사 안보 우산과 무역 이익을 연계하는 이러한 고강도 압박에 한국을 비롯한 우방국들의 외교적, 통상적 부담이 급증하는 상황입니다. 다자주의 가치 연대보다는 철저한 미국의 경제적 손익계산서를 앞세우는 고립주의 정책이 글로벌 리더십의 근간을 흔들고 있습니다. 전문가들은 이러한 기조가 결과적으로 글로벌 공급망 블록화와 무역 분쟁을 극단적으로 심화시킬 것이라고 경고합니다.`,
  keyTerms:[{term:`거래적 동맹`,explanation:`전통적인 동맹의 가치를 상호 굳건한 신뢰가 아니라 철저하게 물질적, 경제적 이익을 서로 주고받는 비즈니스 관계로 간주하는 외교 방식을 뜻합니다.`}],
  history:`과거 정권에서 시작된 자국 우선주의 정책이 미국의 핵심 선거 사이클과 맞물리면서 지지층 결집을 위한 강력한 대외 정책으로 재부상했습니다.`,
  players:`선거 승리를 위해 강경한 청구서를 내미는 미국 행정부와, 안보 불안감 속에서 경제적 손실을 최소화하려는 유럽연합 및 한국 등 주요 동맹국들입니다.`,
  current:`우방국들이 다자간 연합을 통해 미국의 정책에 집단 반발할 움직임을 보이고 있으나, 개별 국가별로 미국과의 협상 테이블에 불려 나가는 상황입니다.`,
  outlook:`미국 내부의 선거 결과와 동맹국들의 무역 보복 조치 대응 방향에 따라 향후 글로벌 통상 및 안보 질서의 새 판짜기가 속도를 낼 전망입니다.`,
  sources:[{title:`거세지는 방위비 압박, 짙어지는 미국 우선주의 - NYT`,url:`https://www.nytimes.com/`},{title:`동맹국에 내민 관세 청구서... 글로벌 무역 분쟁 격화 - AP`,url:`https://apnews.com/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`'자율형 AI 에이전트' 악용한 대규모 계정 탈취 공격에 시중은행 시스템 비상`,
  metrics:[`침해 시도 계정 100만 개 이상 발생`,`피해 규모 산정을 위한 합동 조사 1주일 진행`],
  summary:`국내 주요 시중은행들이 스스로 해킹 경로를 학습하고 진화하는 자율형 AI 에이전트의 대규모 사이버 공격을 받아 금융권에 초비상이 걸렸습니다. 해커 조직은 최신 딥러닝 기반의 AI를 활용해 은행의 기존 보안망 패턴을 우회하며 수백만 개의 계정에 무작위로 암호를 대입하는 크리덴셜 스터핑 공격을 집요하게 감행했습니다. 이례적인 형태의 트래픽 폭증으로 인해 일부 고객 시스템의 접속이 지연되고 실제 계정 탈취 우려까지 커지는 초유의 사태가 발생했습니다. 사안의 중대성을 감안해 금융당국과 개인정보보호위원회가 긴급 합동 대응팀을 꾸려 전면 조사에 착수했습니다. 차세대 고도화된 AI 기술이 국가 핵심 인프라를 노린 사이버 범죄에 본격적으로 악용되기 시작했다는 분석이 나옵니다. 보안 전문가들은 금융권 전반에 다중인증 의무화 및 능동형 AI 방어 체계 구축 등 보안 패러다임의 전면적인 개편이 시급하다고 입을 모으고 있습니다.`,
  keyTerms:[{term:`크리덴셜 스터핑`,explanation:`이미 다른 곳에서 유출된 사용자의 아이디와 비밀번호 목록을 확보한 뒤, 여러 웹사이트에 무작위로 대입해 로그인을 시도하는 사이버 공격 방식입니다.`}],
  history:`비밀번호를 재사용하는 사용자 습관을 노린 기존의 단순 해킹 수법이, 최근 고도화된 AI의 추론 능력과 결합하면서 막기 힘든 자동화 공격으로 진화했습니다.`,
  players:`고도의 사이버 범죄 조직과 이를 방어해야 하는 국내 주요 시중은행, 그리고 실태 조사를 이끌며 규제 가이드라인을 만드는 금융당국이 얽혀 있습니다.`,
  current:`기존 방화벽으로는 비정상적인 AI의 분산 트래픽을 완벽하게 걸러내기 어려워 보안 시스템의 심각한 구조적 취약점이 그대로 노출된 긴급 상황입니다.`,
  outlook:`이번 조사를 계기로 모든 금융 거래에 얼굴 인식이나 생체 인증 등 강화된 다중인증 의무화 제도가 전격 도입될 가능성이 매우 큽니다.`,
  sources:[{title:`자율형 AI 악용한 신종 은행 해킹 사태 - 한겨레`,url:`https://www.hani.co.kr/`},{title:`금융당국, 대규모 계정 탈취 시도에 전면 조사 착수 - MBC`,url:`https://imnews.imbc.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`2026 노벨 생리의학상, 뇌 신경 제어하는 '광유전학' 개척자 3인 선정`,
  metrics:[`광유전학 관련 논문 인용 수 5만 회 돌파`,`파킨슨병 등 뇌 질환 치료 임상 시험 10여 건 진행 중`],
  summary:`2026년 노벨 생리의학상의 최고 영예는 빛을 이용해 뇌의 특정 신경세포를 정밀하게 조절하는 광유전학 기술을 세계 최초로 개척한 3명의 과학자에게 돌아갔습니다. 스웨덴 카롤린스카 연구소 노벨위원회는 칼 다이서로스, 페터 헤게만, 게오르크 나겔 교수가 뇌 과학 연구의 패러다임을 근본적으로 바꾼 거대한 공로를 인정해 이들을 공동 수상자로 선정했다고 공식 발표했습니다. 해당 기술은 특정 파장의 빛에만 반응하도록 조작된 단백질을 생물체의 뇌세포에 이식하여, 생각과 행동의 기저 메커니즘을 실시간으로 규명하는 혁신적인 생명공학 기법입니다. 수십 년간 미지의 영역이었던 인간 뇌의 작동 원리를 세포 단위에서 켜고 끌 수 있게 만든 역사적인 전환점입니다. 의학계는 이 기술이 파킨슨병, 난치성 우울증, 조현병 등 다양한 중증 뇌 질환의 근본적인 치료법 개발에 획기적인 돌파구를 마련했다고 극찬하고 있습니다. 이번 수상은 순수 기초 과학 연구가 실제 인류의 질병 치료라는 거대한 응용 분야로 이어질 수 있음을 보여준 상징적인 사례로 남게 되었습니다.`,
  keyTerms:[{term:`광유전학`,explanation:`빛을 뜻하는 '광'과 유전학을 결합한 단어로, 레이저 같은 특정 빛을 쏘아 우리가 원하는 특정 신경 세포의 활동만 정교하게 켜고 끄는 첨단 생명공학 기술입니다.`}],
  history:`2000년대 초반 해조류에서 빛에 반응하는 채널 단백질이 처음 발견된 이후, 과학자들은 이를 동물 모델 신경계에 적용하려는 오랜 연구를 거듭해 왔습니다.`,
  players:`기초 과학을 탐구하는 노벨상 수상 과학자들과 이 기초 기술을 활용해 실제 신약을 개발하려는 뇌 질환 전문 글로벌 제약사들이 주도하고 있습니다.`,
  current:`단순한 뇌 회로 지도 작성을 넘어서, 실제 빛을 쪼여 실명 환자의 시력을 일부 회복시키는 등의 놀라운 임상 치료 성과가 서서히 보고되고 있습니다.`,
  outlook:`향후 인체 내부로 빛을 안전하고 깊게 전달할 수 있는 첨단 의료기기 혁신과 맞물려 상용화된 뇌 질환 유전자 치료제 개발이 속도를 낼 것입니다.`,
  sources:[{title:`노벨 생리의학상에 뇌 과학 혁명 이끈 광유전학 3인 - 한국경제`,url:`https://www.hankyung.com/`},{title:`빛으로 뇌를 제어하다... 파킨슨병 정복 기대감 - BBC`,url:`https://www.bbc.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`오픈AI·앤트로픽 등 빅테크, 가짜 뉴스 막기 위해 AI 텍스트 '워터마크' 전면 도입`,
  metrics:[`AI 생성 텍스트 자동 식별률 99% 달성 목표`,`글로벌 상위 5개 주요 AI 기업 통합 규약 합의`],
  summary:`생성형 AI 모델이 실시간으로 만들어낸 정교한 딥페이크 이미지와 가짜 뉴스가 심각한 사회적 혼란을 야기하자, 주요 빅테크 기업들이 초강수 대응에 나섰습니다. 오픈AI와 앤트로픽 등 글로벌 AI 시장을 주도하는 선두 기업들은 자사 시스템에서 생성된 텍스트와 결과물에 기계가 작성했음을 증명하는 워터마크 기술 도입을 전격적으로 의무화하기로 합의했습니다. 이들은 사용자의 프롬프트로 생성된 결과물 곳곳에 육안으로는 보이지 않는 정교한 암호화 패턴을 삽입하여 출처를 투명하게 추적할 수 있는 시스템을 일제히 가동 중입니다. 이는 다가오는 각종 글로벌 주요 선거와 여론 형성 과정에서 치명적인 허위 정보가 확산되는 것을 선제적으로 차단하기 위한 기술 업계의 고육지책으로 풀이됩니다. 각국 규제 당국의 압박이 거세지는 가운데 자율적인 정화 시스템을 먼저 마련하려는 의도도 깔려 있습니다. 시민사회와 기술 업계는 투명성과 정보 신뢰성을 확보하기 위한 이번 공동 조치가 건강한 AI 규범 확립을 향한 매우 의미 있는 첫걸음이 될 것으로 큰 기대를 모으고 있습니다.`,
  keyTerms:[{term:`워터마크`,explanation:`원래는 위폐 방지용 무늬를 뜻하지만, 디지털 시대에는 AI가 생성한 글이나 이미지 데이터 내부에 육안으로는 보이지 않는 고유한 패턴을 삽입해 기계의 저작물임을 뚜렷하게 증명하는 기술을 말합니다.`}],
  history:`초거대 언어 모델이 사람과 거의 구별할 수 없는 수준의 완벽한 문장을 작성하게 되면서, 학계와 정치권에서는 거짓 정보 생성이라는 부작용을 꾸준히 경고해 왔습니다.`,
  players:`강력한 AI 기술 통제를 요구하는 글로벌 각국 정부 기관과, 시장 규제를 선제적으로 회피하려는 오픈AI 등 실리콘밸리 빅테크 기업들이 핵심입니다.`,
  current:`기술 기업들이 자발적 동맹을 맺고 기술 표준을 확립하여, 플랫폼 자체 필터링을 통해 인터넷 생태계의 정보 신뢰도를 긴급하게 끌어올리는 중입니다.`,
  outlook:`오픈소스 AI 진영까지 이 표준 기술을 채택할지 여부와, 워터마크를 우회하려는 해커들의 또 다른 공격 창과 방패의 싸움이 앞으로의 관건입니다.`,
  sources:[{title:`오픈AI 등 텍스트 워터마크 전면 도입 합의 - The Economist`,url:`https://www.economist.com/`},{title:`가짜뉴스 막아라... 보이지 않는 AI 추적 기술 의무화 - 조선일보`,url:`https://www.chosun.com/`}]
}]

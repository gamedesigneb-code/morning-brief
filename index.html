  tag:`2026-08-17`,
  label:`2026년 8월 17일 (월)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`삼성전자와 SK하이닉스의 상반기 현금성 자산이 277조 원을 돌파하며 사상 최고치를 기록했습니다.`,
  metrics:[`현금성 자산 277조 9,109억 원`,`전년 말 대비 117조 원 증가`],
  summary:`HBM과 D램 판매가 급증하며 국내 반도체 양사의 상반기 실적이 폭발적으로 상승했습니다. 그 결과 삼성전자와 SK하이닉스의 현금성 자산 및 단기금융상품 규모가 총 277조 9,109억 원으로 집계되었습니다. 이는 지난해 말보다 무려 117조 원이나 늘어난 수치로, 반도체 슈퍼사이클의 위력을 실감케 합니다. 확보된 막대한 자금은 향후 차세대 AI 반도체 투자와 M&A 시장에서 강력한 무기가 될 것으로 보입니다. 이번 어닝 서프라이즈는 두 기업의 글로벌 시장 주도권을 더욱 공고히 할 것입니다. 앞으로의 대규모 투자 행보에 전 세계 경쟁사들의 이목이 집중되고 있습니다.`,
  keyTerms:[{term:`어닝 서프라이즈`,explanation:`기업의 영업 실적이 시장의 예상치를 훌쩍 뛰어넘어 높게 발표되는 현상입니다.`}],
  history:`AI 열풍으로 인해 고대역폭메모리(HBM) 등 고성능 반도체 수요가 폭발적으로 증가하면서 한국 반도체 기업들의 이익이 급증하기 시작했습니다.`,
  players:`글로벌 AI 반도체 시장을 선도하는 엔비디아와 이에 메모리를 공급하는 삼성전자, SK하이닉스가 주요 플레이어입니다.`,
  current:`막대한 현금 동원력을 바탕으로 경쟁사를 압도할 수 있는 대규모 인프라 투자와 유망 기업 인수합병(M&A)에 나설 수 있는 결정적 시점입니다.`,
  outlook:`하반기에도 반도체 수요 강세가 이어질 것으로 보여 양사의 사상 최대 실적 경신 여부와 대형 M&A 발표가 시장의 핵심 관전 포인트입니다.`,
  sources:[{title:`삼성전자·SK하이닉스 현금성 자산 277조 돌파 - 매일경제`,url:`https://www.mk.co.kr`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 금리 인하를 앞두고 대기 자금이 몰리며 머니마켓펀드(MMF) 총자산이 7.9조 달러를 돌파했습니다.`,
  metrics:[`MMF 총자산 7.9조 달러 돌파`,`미 연준 9월 금리 인하 기정사실화`],
  summary:`미국 연방준비제도의 금리 인하가 임박해오면서 단기 피난처인 머니마켓펀드(MMF)로 막대한 자금이 유입되고 있습니다. 현재 MMF 총자산은 역대 최대인 7.9조 달러를 돌파하며 금융 시장의 엄청난 대기 자금 규모를 보여줍니다. 투자자들은 금리 결정의 불확실성이 해소되기 전까지 안전자산에 돈을 묶어두려는 심리가 강합니다. 하지만 금리 인하가 시작되면 이 막대한 자금은 주식 시장이나 AI 전력망 인프라 등 고수익 위험자산으로 빠르게 이동할 것으로 예상됩니다. 결국 7월 FOMC 의사록 공개와 다가오는 잭슨홀 미팅이 자금 이동의 신호탄이 될 것입니다. 글로벌 유동성의 거대한 흐름이 바뀌는 중대한 변곡점을 맞이하고 있습니다.`,
  keyTerms:[{term:`대기 자금`,explanation:`뚜렷한 투자처를 찾지 못하고 잠시 머물러 있으나 언제든 다른 투자 상품으로 이동할 준비가 된 자금을 의미합니다.`}],
  history:`오랜 기간 이어진 미국의 고금리 정책과 최근 불거진 경기 침체 우려로 인해 투자자들은 위험을 회피하고자 현금성 자산 비중을 늘려왔습니다.`,
  players:`글로벌 기관 투자자, 개인 투자자, 그리고 금리 정책의 키를 쥔 미국 연방준비제도(Fed)가 주요 주체입니다.`,
  current:`9월 기준금리 인하가 확실시되면서, 묶여있던 천문학적인 자금이 어느 섹터로 쏟아져 들어갈지 시장의 긴장감이 고조되고 있습니다.`,
  outlook:`이번 주 공개될 7월 FOMC 의사록과 제롬 파월 연준 의장의 잭슨홀 미팅 연설 내용에 따라 글로벌 자금의 대이동 방향이 결정될 것입니다.`,
  sources:[{title:`글로벌 MMF 자산 7.9조 달러 돌파, 역대 최대 - 글로벌이코노믹`,url:`https://www.g-enews.com`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`금융당국이 가계부채 증가율 목표치를 상향 조정하며 30조 원 규모의 신규 대출 여력이 발생했습니다.`,
  metrics:[`가계부채 증가율 목표 1.5% -> 3.0%`,`신규 대출 여력 약 30조 원`],
  summary:`금융당국이 침체된 내수 경기를 부양하기 위해 가계대출 규제 카드를 대폭 완화했습니다. 올해 가계부채 총량 증가율 목표치를 기존 1.5%에서 3.0%로 두 배 상향 조정한 것입니다. 이에 따라 은행권에는 약 30조 원 규모의 신규 대출 여력이 추가로 발생하게 되었습니다. 그동안 엄격한 총부채원리금상환비율(DSR) 규제로 대출난을 겪던 실수요자와 소상공인들에게는 큰 숨통이 트일 전망입니다. 그러나 일각에서는 이러한 완화 조치가 간신히 잡혀가던 수도권 부동산 가격을 다시 자극할 수 있다는 우려도 제기하고 있습니다. 향후 대출 증가 속도와 부동산 시장의 반응을 면밀히 모니터링해야 할 시점입니다.`,
  keyTerms:[{term:`총부채원리금상환비율(DSR)`,explanation:`대출을 받으려는 사람의 소득 대비 갚아야 할 원금과 이자의 1년 치 합계 비율로, 대출 한도를 정하는 핵심 기준입니다.`}],
  history:`정부는 가계부채 폭증을 막기 위해 강력한 대출 규제를 시행해 왔으나, 고금리와 맞물려 서민 경제와 내수 침체가 심각한 수준에 이르렀습니다.`,
  players:`대출 규제를 관장하는 금융위원회 및 금융감독원, 시중 은행들, 그리고 자금 융통이 필요한 가계와 소상공인들입니다.`,
  current:`거시 경제의 안정성을 해치지 않는 선에서 서민들의 돈줄을 풀어주어 꽉 막힌 경제의 혈맥을 뚫으려는 정책적 결단이 내려진 상황입니다.`,
  outlook:`풀린 자금이 소비 진작과 소상공인 회생으로 이어질지, 아니면 다시 부동산 투기 수요로 흘러가 가계부채 폭탄을 키울지 주목됩니다.`,
  sources:[{title:`가계대출 규제 완화... 30조원 추가 여력 - 한국경제`,url:`https://www.hankyung.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`이재명 대통령이 광복절 경축사에서 남·북·미·중이 참여하는 4자간 종전 논의를 공식 제안했습니다.`,
  metrics:[`다자안보체제 4개국 참여 제안`,`북한 군사분계선(MDL) 일시 침범 1건`],
  summary:`이재명 대통령은 81주년 광복절 경축사를 통해 한반도의 항구적 평화를 위한 중대한 구상을 발표했습니다. 기존의 불안정한 정전체제를 평화체제로 전환하기 위해 남·북·미·중이 모두 참여하는 다자안보체제 형태의 종전 논의를 시작하자는 것입니다. 이는 북한의 핵 고도화를 중단시키고 대화 테이블로 이끌어내기 위한 선제적 조치로 풀이됩니다. 그러나 북한은 주말 동안 군사분계선을 일시 침범하는 등 도발적 태도를 보이며 공식적인 침묵을 지키고 있습니다. 미국과 중국 역시 자국의 전략적 이해득실을 계산하며 조심스러운 반응을 보이고 있어 실제 회담 성사까지는 난항이 예상됩니다. 향후 관련국들의 치열한 외교적 수싸움이 한반도 정세의 핵심 변수가 될 것입니다.`,
  keyTerms:[{term:`다자안보체제`,explanation:`2개 국가가 아닌 3개국 이상의 여러 국가가 참여하여 공동의 규칙과 제도를 통해 지역의 평화와 안보를 유지하는 협력 체계입니다.`}],
  history:`한반도는 1953년 정전협정 이후 기술적으로 전쟁이 끝나지 않은 상태이며, 북핵 문제로 인해 오랜 기간 긴장이 지속되어 왔습니다.`,
  players:`이해 당사국인 남한과 북한, 그리고 한반도 정세에 결정적 영향력을 행사하는 미국과 중국 등 4개국입니다.`,
  current:`한국 정부가 직접 나서서 정전체제 종식을 위한 구체적인 외교적 틀을 국제사회에 공식적으로 던지며 판을 흔들고 있습니다.`,
  outlook:`북한이 이번 제안을 거부하고 무력 도발 수위를 높일 것인지, 아니면 미·중의 압박 속에서 물밑 접촉에 나설 것인지가 향후 핵심 관건입니다.`,
  sources:[{title:`이 대통령 '남북미중 4자 종전 논의' 전격 제안 - 조선일보`,url:`https://www.chosun.com`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`트럼프 미국 대통령이 오늘부터 시작되는 한미 연합훈련의 규모를 대폭 축소하라고 국방부에 지시했습니다.`,
  metrics:[`한미 연합훈련 규모 축소 지시`,`을지 자유의 방패(UFS) 17일 개시`],
  summary:`트럼프 미국 대통령이 17일 시작되는 하반기 한미 연합훈련인 '을지 자유의 방패(UFS)'를 대폭 축소하라고 국방부에 긴급 지시했습니다. 그는 북한 김정은 국무위원장과의 개인적인 우호 관계를 핑계 삼으며, 막대한 훈련 비용을 미국이 부담하는 것에 강력한 불만을 표출했습니다. 이로 인해 굳건했던 한미 연합 방위 태세에 심각한 공백이 생길 수 있다는 국내외 안보 전문가들의 우려가 커지고 있습니다. 또한 이는 다가오는 주한미군 방위비 분담금 협상에서 한국을 압박하기 위한 치밀한 블러핑 전략이라는 분석도 제기됩니다. 한국 정부는 미국의 갑작스러운 통보에 당혹감을 감추지 못하며 긴급 국가안전보장회의(NSC)를 소집한 상태입니다. 군사 안보를 담보로 한 미국의 극단적인 거래 전술에 대응하기 위한 외교적 지혜가 절실한 순간입니다.`,
  keyTerms:[{term:`블러핑`,explanation:`자신의 실제 의도나 불리한 상황을 숨기기 위해 과장된 행동을 하거나 무리한 요구를 던져 상대를 압박하는 기만 전술입니다.`}],
  history:`트럼프 대통령은 과거 임기 때부터 한국의 안보 무임승차론을 주장하며 한미 연합훈련 중단과 방위비 대폭 인상을 지속적으로 요구해 왔습니다.`,
  players:`미국 최우선주의를 앞세우는 트럼프 행정부와 안보 위협에 직면한 한국 정부, 그리고 이를 지켜보는 북한입니다.`,
  current:`실제 대규모 군사 훈련이 시작되는 당일에 미국 군 통수권자가 직접 제동을 걸면서 한미 동맹의 신뢰성에 큰 금이 가고 있습니다.`,
  outlook:`훈련 축소가 현실화될 경우 북한의 오판을 부를 수 있으며, 이어지는 방위비 협상에서 한국 정부가 어떤 외교적 협상력을 발휘할지 주목됩니다.`,
  sources:[{title:`트럼프, 한미 연합훈련 대폭 축소 전격 지시 - 동아일보`,url:`https://www.donga.com`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국과 이란 간의 60일 잠정 휴전이 성과 없이 만료되며 중동 지역의 긴장이 최고조에 달했습니다.`,
  metrics:[`60일 잠정 휴전 만료`,`중동 지정학적 리스크 급등`],
  summary:`최악의 충돌을 막기 위해 미국과 이란이 극적으로 맺었던 60일간의 잠정 휴전 합의가 8월 17일부로 성과 없이 종료되었습니다. 트럼프 미국 대통령이 호르무즈 해협을 무력으로 철저히 통제하겠다는 강경 발언을 쏟아내자, 이란 정부 역시 결사항전을 선언하며 강력한 군사적 대응을 경고하고 나섰습니다. 양국의 공식적인 대화 채널이 사실상 단절되면서 중동 지역은 다시 한번 일촉즉발의 화약고 상황으로 빠져들고 있습니다. 만약 무력 충돌이 발발할 경우 전 세계 원유 물동량의 20%가 지나는 핵심 해협이 봉쇄되어 글로벌 경제에 치명적인 타격을 입힐 수 있습니다. 현재 유럽과 중동의 주요 동맹국들은 확전을 막기 위해 양국에 자제를 촉구하며 막후 중재에 사활을 걸고 있습니다. 단기적인 지정학적 리스크 급등이 글로벌 금융 시장에 전방위적인 충격파를 던질 것으로 우려됩니다.`,
  keyTerms:[{term:`화약고`,explanation:`폭발물이 가득 쌓여 있어 작은 불씨에도 거대한 폭발이 일어날 수 있는 곳으로, 언제든 큰 분쟁이나 전쟁이 터질 수 있는 위험 지역을 비유합니다.`}],
  history:`이란의 핵 프로그램 개발과 역내 친이란 무장세력 지원을 둘러싸고 미국과 이란은 수십 년간 팽팽한 적대 관계를 이어왔습니다.`,
  players:`군사적 압박을 가하는 미국, 이에 맞서는 이란 정부, 그리고 원유 수급 불안에 떨고 있는 전 세계 국가들입니다.`,
  current:`유일한 완충 장치였던 휴전 기간이 끝나면서 양측의 우발적인 작은 충돌이 전면전으로 비화될 수 있는 가장 위험한 타이밍입니다.`,
  outlook:`호르무즈 해협에서 유조선 나포나 군사적 위협 행위가 실제로 벌어질 것인지, 국제 유가가 얼마나 요동칠 것인지가 단기적인 핵심 지표입니다.`,
  sources:[{title:`미-이란 '60일 휴전' 만료... 중동 전운 고조 - 연합뉴스`,url:`https://www.yna.co.kr`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`미국이 자국 주도의 AI 공급망에서 중국 협력 국가를 배제하겠다고 엄포를 놓으며 기술 패권 다툼이 심화되고 있습니다.`,
  metrics:[`미국 동맹국 20여 곳에 강력 경고 서한`,`중국 AI '키미 K3' 글로벌 평가 3위 기록`],
  summary:`미국 정부가 주요 동맹국들을 향해 중국 주도의 AI 협력 기구에 참여할 경우 미국의 첨단 AI 반도체 공급망에서 완전히 배제될 것이라는 강력한 서한을 발송했습니다. 최근 중국 스타트업의 자체 AI 모델인 '키미 K3'가 글로벌 인공지능 성능 평가에서 3위에 오르는 등 중국의 기술 추격이 턱밑까지 다가오자 미국이 극약 처방을 꺼낸 것입니다. 이는 세계 AI 생태계를 미국 중심의 팍스 실리카 체제로 강제 재편하고 중국을 고립시키려는 노골적인 경제 안보 전략입니다. 이로 인해 한국을 비롯한 중간 지대의 테크 강국들은 미국과 중국 사이에서 양자택일을 강요받는 험난한 외교적 시험대에 오르게 되었습니다. 글로벌 테크 기업들은 칩 공급 단절로 인한 파장을 예의주시하며 독자적인 대응책 마련에 부심하고 있습니다. 기술 패권 경쟁이 이제는 진영 논리에 입각한 신냉전 체제로 확고하게 굳어져 가는 양상입니다.`,
  keyTerms:[{term:`팍스 실리카`,explanation:`과거 로마 평화 시대(팍스 로마나)처럼, 실리콘(반도체) 기술력을 장악한 최강대국이 전 세계의 경제와 안보 질서를 좌지우지하는 현상을 말합니다.`}],
  history:`미국은 인공지능이 미래 국가 경쟁력의 핵심이라고 판단하고, 엔비디아 등 자국 기업의 고성능 칩이 중국으로 유입되는 것을 철저히 차단해 왔습니다.`,
  players:`AI 주도권을 수성하려는 미국 정부, 독자 생태계로 맹추격하는 중국, 그리고 두 고래 싸움에 낀 동맹국들입니다.`,
  current:`중국의 AI 발전 속도가 예상보다 빠르자, 미국이 반도체 수출 통제를 넘어 국가 간 외교적 편가르기로 압박 수위를 최고조로 높였습니다.`,
  outlook:`서한을 받은 국가들이 어떤 입장을 취할지, 그리고 중국이 이에 맞서 희토류 수출 통제 등 어떤 보복 조치로 맞대응할지 지켜봐야 합니다.`,
  sources:[{title:`미국, 동맹국에 '중국 AI 협력 시 반도체 공급망 배제' 경고 - 동아일보`,url:`https://www.donga.com`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`2026년 강력한 엘니뇨가 공식적으로 시작되면서 태평양 해양 생태계 파괴와 기상이변이 속출하고 있습니다.`,
  metrics:[`엘니뇨 지속 확률 97%`,`태풍 낭카로 일본 지바현 시간당 100mm 폭우`],
  summary:`NASA와 NOAA 등 글로벌 주요 기상 기구들이 2026년 슈퍼 엘니뇨 현상의 공식 시작을 전 세계에 선언했습니다. 이미 태평양 적도 부근의 수온이 비정상적으로 급격히 상승하면서 식물성 플랑크톤이 소멸하고 해양 생태계의 기초 먹이사슬이 처참하게 무너지고 있습니다. 이로 인한 엄청난 기상이변의 여파로 이웃 나라 일본에서는 태풍 '낭카'가 몰고 온 기습적인 집중호우로 대규모 인명 및 재산 피해가 발생했습니다. 기상 전문가들은 이번 강력한 엘니뇨가 내년 봄까지 무려 97%의 확률로 지속되며 역대급 가뭄과 대홍수를 유발할 것으로 내다보고 있습니다. 전 세계 각국은 농작물 작황 부진으로 인한 식량 안보 위기와 살인적인 물가 상승 방어에 총력을 기울여야 할 절박한 상황입니다. 이상 기후가 가져올 막대한 경제적 타격에 대비한 범국가적 재난 대응 매뉴얼 가동이 시급합니다.`,
  keyTerms:[{term:`집중호우`,explanation:`짧은 시간에 특정의 좁은 지역에서 앞이 보이지 않을 정도로 엄청난 양의 비가 쏟아지는 기상 현상을 말합니다.`}],
  history:`엘니뇨는 수년 주기로 발생하는 자연 현상이지만, 최근 지구 온난화와 결합하면서 그 강도와 피해 규모가 과거와 비교할 수 없을 정도로 커지고 있습니다.`,
  players:`기후 위기에 무방비로 노출된 전 세계 인류와 1차 산업인 농수산업 종사자들, 그리고 각국의 재난 대응 당국입니다.`,
  current:`단순한 기온 변화를 넘어 글로벌 식량 공급망 붕괴와 직결되는 재난의 초입에 서 있으며, 당장 올가을 수확철 피해가 우려됩니다.`,
  outlook:`가뭄으로 인한 주요 곡물(밀, 옥수수 등) 가격의 폭등 여부와, 이것이 전 세계 인플레이션을 다시 자극할 것인지가 가장 큰 경제적 위협입니다.`,
  sources:[{title:`2026년 슈퍼 엘니뇨 공식 선언... 해양 생태계 비상 - 뉴스제주`,url:`https://www.newsje.com`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`8월 17일이 광복절 대체공휴일로 지정되고 '택배 없는 날'과 겹치면서 전국적인 물류 지연 사태가 빚어지고 있습니다.`,
  metrics:[`8월 17일 대체공휴일 관공서 휴무`,`14~17일 나흘간 전국 택배 배송 올스톱`],
  summary:`올해 제81주년 광복절이 토요일과 겹치면서 8월 17일 월요일이 공식적인 대체공휴일로 지정되었습니다. 이에 따라 오늘 하루 전국의 관공서, 은행, 그리고 주식시장이 모두 문을 닫으며 시민들은 모처럼의 긴 연휴를 즐기고 있습니다. 하지만 지난 14일 전국 택배 노동자들의 과로를 막고 휴식권을 보장하기 위해 제정된 '택배 없는 날'부터 물류 이동이 완전히 멈추면서 산업계 곳곳에서 심각한 병목현상이 발생하고 있습니다. 온라인 쇼핑몰과 지역 소상공인들은 끝없이 밀리는 배송 지연에 따른 고객 클레임에 골머리를 앓고 있으며, 늦더위 속 신선식품 폐기 우려도 매우 커지고 있습니다. 긴 연휴가 끝나는 18일부터는 그동안 쌓였던 엄청난 물량이 일시에 쏟아지며 물류 대란이 당분간 이어질 것으로 강하게 예상됩니다. 택배업계의 휴식권 보장과 시스템 효율화 사이의 사회적 합의를 더욱 고도화해야 할 필요성이 제기됩니다.`,
  keyTerms:[{term:`병목현상`,explanation:`병의 목 부분이 좁아 물이 갑자기 쏟아지지 않는 것처럼, 전체 시스템의 처리 능력이 한 지점의 한계 때문에 느려지거나 꽉 막히는 현상입니다.`}],
  history:`과거 택배 종사자들의 과로사가 사회적 문제로 대두되면서, 이를 방지하고자 매년 8월 14일을 공식적인 택배 휴무일로 지정하여 운영해 오고 있습니다.`,
  players:`휴식이 절실한 택배 종사자들과 빠른 배송을 원하는 소비자, 그리고 발을 동동 구르는 이커머스 업계 및 소상공인들입니다.`,
  current:`휴식권 보장이라는 좋은 취지의 제도지만, 긴 연휴와 맞물리면서 현실적인 물류 인프라의 한계가 극명하게 드러나고 있는 혼란스러운 상황입니다.`,
  outlook:`연휴 직후 택배사들이 쏟아지는 물량을 얼마나 신속하고 안전하게 소화해 낼 수 있을지가 이번 주 유통업계의 가장 큰 과제가 될 것입니다.`,
  sources:[{title:`대체공휴일 겹친 택배 없는 날... 유통업계 배송 비상 - 다이어리포인트`,url:`https://www.diarypoint.com`}]
}]
},{
  tag:`2026-08-16`,
  label:`2026년 8월 16일 (일)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국은행이 3년 6개월 만에 기준금리를 인상하며 긴축 기조로 전환한 가운데 8월 연속 인상 가능성도 제기되고 있습니다.`,
  metrics:[`기준금리 2.75%`,`성장률 전망치 3.3%`],
  summary:`한국은행은 지난 7월 16일 기준금리를 연 2.50%에서 2.75%로 0.25%p 인상했습니다. 이는 1년 2개월간 이어지던 동결 기조를 깨고 3년 6개월 만에 긴축으로 전환한 것입니다. 물가 상승 압력과 가계부채 증가세가 이번 인상의 주된 배경으로 작용했습니다. 시장에서는 8월 금융통화위원회에서 금리를 동결할 것이라는 의견이 우세하지만, 일부에서는 연속 인상 가능성도 배제하지 않고 있습니다. 특히 씨티은행 등 일부 기관은 올해 경제성장률 전망치를 3.3% 수준으로 대폭 상향 조정하며 추가 긴축의 필요성을 역설하고 있습니다. 한국 경제의 기초 체력이 예상보다 견조하다는 평가 속에서 통화정책의 향방에 시장의 이목이 쏠리고 있습니다. 결과적으로 매파적 동결 여부가 향후 증시와 부동산 시장에 큰 영향을 미칠 전망입니다.`,
  keyTerms:[{term:`매파적 동결`,explanation:`금리를 올리지 않고 유지하지만, 앞으로 언제든 금리를 올릴 수 있다는 강경한 입장을 밝히는 것을 말합니다.`}],
  history:`2024년 말부터 지속된 금리 동결은 경기 침체를 막기 위한 조치였으나, 최근 가계부채가 다시 급증하며 변화가 필요해졌습니다.`,
  players:`한국은행 금융통화위원회 위원들과 정부, 그리고 이에 촉각을 곤두세우는 국내외 투자은행들이 주요 관계자입니다.`,
  current:`7월의 인상 단행 이후 8월에도 연속으로 올릴지, 아니면 잠시 숨을 고를지 결정해야 하는 중요한 분기점에 서 있습니다.`,
  outlook:`오는 8월 27일 열리는 금융통화위원회에서 발표될 경제성장률 수정치와 이창용 총재의 발언 수위가 핵심 변수가 될 것입니다.`,
  sources:[{title:`한은 기준금리 0.25%p 인상 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`8월 금통위 전망, 연속 인상설 솔솔 - 한국경제`,url:`https://www.hankyung.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`코스피 지수가 7,000선 재돌파를 눈앞에 두고 있으나 개인 투자자들은 하락에 베팅하는 상반된 흐름이 나타나고 있습니다.`,
  metrics:[`코스피 6,977.94`,`주간 상승률 11.49%`],
  summary:`국내 코스피 지수는 8월 들어 강하게 반등하며 8월 14일 종가 기준 6,977.94를 기록, 7,000선 재돌파를 목전에 두고 있습니다. 전주 대비 11.49%나 급등한 수치로, 삼성전자와 SK하이닉스 외에도 중소형주로 상승세가 퍼지는 확산장 흐름이 뚜렷합니다. 반면 개인 투자자들의 반응은 차갑습니다. 이들은 지수 반등을 일시적인 현상으로 보고 하락에 베팅하는 인버스 상품을 대거 사들이고 있습니다. 외국인 투자자들이 레버리지 상품을 순매수하며 상승장을 주도하는 것과는 완전히 대조적입니다. 이런 엇갈린 수급 상황은 국내 증시의 펀더멘털에 대한 개인과 외국인의 시각차를 보여줍니다. 단기 과열 우려와 실적 개선 기대감이 팽팽하게 맞서고 있습니다.`,
  keyTerms:[{term:`인버스`,explanation:`주식 시장의 지수가 떨어질 때 오히려 수익을 얻도록 설계된 투자 상품입니다. 흔히 하락장에 베팅한다고 표현합니다.`}],
  history:`코로나19 이후 풀린 유동성과 AI 반도체 열풍이 겹치면서 코스피는 꾸준히 우상향했으나, 최근 고점 논란이 끊이지 않았습니다.`,
  players:`거시 경제 지표를 믿고 자본을 투입하는 외국인 기관 투자자들과, 잦은 변동성에 피로감을 느끼는 국내 개인 투자자들입니다.`,
  current:`지수는 기록적인 폭등세를 보이고 있지만, 시장 내부에서는 이 상승세가 얼마나 유지될지에 대한 극심한 눈치 싸움이 벌어지고 있습니다.`,
  outlook:`하반기 주요 기업들의 수출 실적과 3분기 어닝 시즌 결과에 따라 인버스 투자자들의 명암이 엇갈릴 것으로 보입니다.`,
  sources:[{title:`코스피 7,000선 턱밑, 개미는 곱버스 - 조선일보`,url:`https://www.chosun.com/`},{title:`중소형주로 온기 도는 확산장 - 매일경제`,url:`https://www.mk.co.kr/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국의 7월 생산자물가지수가 시장 예상보다 둔화되면서 금리 인하 기대감에 뉴욕 증시가 사상 최고치를 경신했습니다.`,
  metrics:[`7월 PPI 보합(0%)`,`S&P500 사상 최고치`],
  summary:`미국의 7월 생산자물가지수(PPI)가 전월 대비 보합세를 기록하며 인플레이션 둔화 신호가 뚜렷해졌습니다. 이는 시장 예상치를 밑도는 수치로, 물가 상승 압력이 크게 완화되고 있음을 보여줍니다. 물가 안정세가 확인되면서 연방준비제도(Fed)의 금리 인상 우려가 사그라들었고, 이는 곧장 주식 시장의 랠리로 이어졌습니다. S&P500 지수는 기술주 중심의 매수세에 힘입어 사상 최고치를 경신하며 강세를 보였습니다. 투자자들은 다가오는 7월 FOMC 의사록 공개를 통해 연준의 구체적인 향후 스탠스를 확인하고자 합니다. 중동 지정학적 리스크로 인한 국제 유가 상승이라는 불안 요소가 남아있으나, 전반적인 시장 분위기는 위험 선호로 기울고 있습니다. 금리 인하 사이클 진입에 대한 기대가 그 어느 때보다 높습니다.`,
  keyTerms:[{term:`생산자물가지수(PPI)`,explanation:`생산자가 물건이나 서비스를 시장에 내놓을 때의 가격 변동을 측정한 지표로, 소비자물가의 선행 지표 역할을 합니다.`}],
  history:`2022년부터 시작된 미국의 공격적인 금리 인상은 인플레이션을 잡기 위한 고육지책이었으며, 최근 1~2년간 그 효과가 서서히 나타나기 시작했습니다.`,
  players:`미국의 통화정책을 결정하는 연방준비제도(Fed) 제롬 파월 의장과 위원들, 그리고 글로벌 주식 시장의 기관 투자자들입니다.`,
  current:`고용 시장 냉각과 물가 안정 지표가 동시에 나타나면서, 시장은 연준이 언제 금리를 내릴지 그 시점만을 쳐다보고 있는 상황입니다.`,
  outlook:`오는 19일 공개될 FOMC 의사록과 8월 말 잭슨홀 미팅에서 연준 고위 인사들이 던질 정책 전환 신호가 가장 중요합니다.`,
  sources:[{title:`미국 7월 PPI 예상 하회, S&P 최고치 - 중앙일보`,url:`https://www.joongang.co.kr/`},{title:`Fed rate cut hopes lift US markets - Bloomberg`,url:`https://www.bloomberg.com/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`이재명 대통령이 남미 순방과 샌프란시스코 방문을 통해 핵심 원자재 공급망을 확보하고 글로벌 빅테크와의 협력을 강화하는 실용 외교를 펼치고 있습니다.`,
  metrics:[`방문 국가 3개국`,`투자 논의 규모 426억원`],
  summary:`이재명 대통령은 최근 구리와 리튬 등 핵심 광물 자원 확보를 위해 남미 3개국 순방을 성공적으로 마쳤습니다. 이번 순방을 통해 한국의 첨단 산업에 필수적인 배터리 원자재의 안정적인 공급망을 구축하는 성과를 냈습니다. 이어서 미국 샌프란시스코를 방문해 현지 글로벌 빅테크 기업 최고경영자들과 연쇄 회동을 가졌습니다. 이 자리에서는 인공지능(AI)과 반도체 분야의 파트너십 강화 방안이 심도 있게 논의되었습니다. 국익을 최우선으로 삼아 이념보다는 철저하게 실용성을 따지는 실용 외교 노선이 빛을 발하고 있다는 평가가 나옵니다. 미국, 중국, 일본 등 주변 강대국들과의 신뢰를 바탕으로 한국의 경제적 실리를 극대화하려는 전략입니다. 앞으로도 첨단 기술 안보를 중심으로 한 정상 외교가 더욱 활발해질 전망입니다.`,
  keyTerms:[{term:`실용 외교`,explanation:`이념이나 정치적 명분보다는 국가의 실제적인 이익(경제, 안보 등)을 최우선으로 하여 다른 나라와 관계를 맺는 외교 방식입니다.`}],
  history:`과거 한미동맹 중심의 안보 외교에서 벗어나, 글로벌 공급망 위기와 미중 패권 경쟁 속에서 살아남기 위해 자원과 기술 중심의 경제 외교가 중요해졌습니다.`,
  players:`대한민국 대통령실 안보 및 경제 참모진, 남미 자원 부국 정상들, 그리고 실리콘밸리의 빅테크 기업 최고경영자들입니다.`,
  current:`전기차 및 AI 산업의 폭발적 성장으로 인해 핵심 광물과 고성능 반도체 확보가 국가 생존을 좌우하는 중대한 안보 이슈로 격상되었습니다.`,
  outlook:`확보된 자원 공급망 양해각서가 실제 기업 간의 본계약과 공동 투자로 얼마나 빠르게 이어질지 후속 조치를 지켜봐야 합니다.`,
  sources:[{title:`대통령 남미 순방 성공적 마무리 - KBS`,url:`https://news.kbs.co.kr/`},{title:`자원 확보 앞세운 실용주의 노선 돋보여 - 한겨레`,url:`https://www.hani.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`북한이 비무장지대 일대의 남북 연결 육로를 완전히 끊어내고 군사적 요새화 작업을 가속하며 한반도의 긴장감을 최고조로 끌어올리고 있습니다.`,
  metrics:[`건설 투입 병력 수만 명`,`단절 대상 육로 3곳`],
  summary:`북한이 최근 비무장지대(DMZ) 일대에서 도로 건설과 지뢰 매설 등 대대적인 공사를 벌이며 요새화 작업을 진행 중인 것으로 파악되었습니다. 이는 개성공단과 금강산 등으로 이어지던 기존의 남북 육로를 물리적으로 완전히 끊어내기 위한 조치입니다. 한국군 당국은 북한이 남북 관계를 '적대적 두 국가'로 규정한 이후, 휴전선 일대의 방벽을 강화하고 병력을 대거 투입하고 있다고 밝혔습니다. 외부와의 물리적 단절을 통해 내부 체제 결속을 도모하려는 의도로 풀이됩니다. 이러한 요새화 작업 중 북한군 내부에서 지뢰 폭발 사고로 사상자가 발생하는 등 무리한 공사 정황도 포착되었습니다. 물리적인 장벽 건설로 인해 우발적인 군사 충돌 가능성도 배제할 수 없어 군 당국은 예의주시하고 있습니다. 남북 간의 대화 채널이 닫힌 상태에서 군사적 긴장만 계속 높아지는 상황입니다.`,
  keyTerms:[{term:`요새화`,explanation:`특정 지역에 방벽을 쌓고 지뢰를 묻는 등 군사적인 방어 시설을 단단하게 구축하여 적의 접근을 막는 작업을 뜻합니다.`}],
  history:`북한은 수십 년간 통일을 헌법적 목표로 삼아왔으나, 최근 헌법을 개정하고 남한을 철저한 적대국으로 규정하며 기존의 대남 정책을 전면 폐기했습니다.`,
  players:`철책 너머로 대치하고 있는 남북한 군사 당국과, 북한의 무리한 지시를 최전방에서 수행하고 있는 북한군 병사들입니다.`,
  current:`북한은 체제 불안과 경제난 속에서 남한의 문화나 영향력이 유입되는 것을 극도로 경계하며 물리적인 차단벽까지 세우고 있습니다.`,
  outlook:`다가오는 한미 연합훈련 기간 동안 북한이 이 방벽 시설을 빌미로 국지적인 도발을 감행할 가능성이 있어 군사적 대비 태세가 중요합니다.`,
  sources:[{title:`북한, DMZ 일대 방벽 건설 등 육로 단절 가속 - SBS`,url:`https://news.sbs.co.kr/`},{title:`적대적 두 국가 노선 시각화하는 북한 - 동아일보`,url:`https://www.donga.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`11월 중간선거를 앞두고 지지율 폭락의 위기를 맞은 트럼프 미국 대통령이 이스라엘의 중재안 거부로 외교적 타격까지 입고 있습니다.`,
  metrics:[`대통령 긍정 지지율 33%`,`선거 긴급 자금 426억 원 투입`],
  summary:`미국 11월 중간선거가 3개월 앞으로 다가온 가운데, 도널드 트럼프 대통령의 국정 운영 긍정 지지율이 33%로 역대 최저치 수준으로 폭락했습니다. 이란 전쟁 장기화에 따른 유가 급등과 내부 인플레이션이 민심 이반의 주요 원인입니다. 위기 극복을 위해 트럼프 대통령은 개인 정치자금 약 426억 원을 공화당 취약 지역에 긴급 투입하는 강수를 두었습니다. 엎친 데 덮친 격으로 그가 야심 차게 주도한 가자지구 평화 중재안마저 베냐민 네타냐후 이스라엘 총리에 의해 공식 거부당하며 외교적 체면을 구겼습니다. 네타냐후 총리는 국내 우파 지지층 결집을 위해 가자지구 공습 재개를 선언하며 미국에 정면으로 반기를 들었습니다. 대내외적인 악재가 겹치면서 공화당 내부에서도 리더십에 대한 회의론이 고개를 들고 있습니다. 선거제도 개혁 법안 통과를 명분으로 국가 비상사태 선포까지 거론되는 등 워싱턴 정가는 극도의 혼란에 빠져있습니다.`,
  keyTerms:[{term:`중간선거`,explanation:`대통령의 임기 중간에 치러지는 선거로, 상하원 의원을 뽑으며 현직 대통령의 국정 운영에 대한 중간 평가 성격을 가집니다.`}],
  history:`트럼프 행정부는 집권 초반 강경한 외교와 경제 호황으로 지지율을 유지했으나, 끝없는 중동 분쟁이 결국 발목을 잡는 모양새가 되었습니다.`,
  players:`재선을 노리는 도널드 트럼프 대통령과 공화당 지도부, 그리고 미국의 통제를 거부하는 이스라엘의 네타냐후 총리입니다.`,
  current:`이란 전쟁으로 촉발된 유가 불안이 미국 서민들의 물가를 위협하면서, 경제 문제가 선거의 가장 핵심 이슈로 떠올랐습니다.`,
  outlook:`남은 3개월 동안 백악관이 물가를 통제하고 중동 사태의 돌파구를 마련하지 못한다면 상하원 다수당 지위를 모두 야당에 내어줄 수 있습니다.`,
  sources:[{title:`트럼프 지지율 33%로 추락, 선거 앞두고 비상 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`Netanyahu rejects Gaza peace plan - NYT`,url:`https://www.nytimes.com/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`8월 청년층 취업자가 전년 대비 큰 폭으로 감소하며 청년 실업률이 5년 6개월 만에 최고치인 6.8%까지 치솟아 고용 한파가 심화되고 있습니다.`,
  metrics:[`청년 실업률 6.8%`,`청년 취업자 수 20만명 감소`],
  summary:`통계청이 발표한 8월 고용동향에 따르면 15세에서 29세 사이의 청년층 취업자가 전년 동월 대비 약 20만 명이나 감소했습니다. 이로 인해 청년 실업률은 무려 1.3%p 상승한 6.8%를 기록하며 5년 6개월 만에 최고치로 치솟았습니다. 제조업과 건설업 등 전통적인 일자리 창출 산업의 부진이 장기화되면서 신규 채용문이 굳게 닫힌 것이 직격탄이 되었습니다. 또한 플랫폼 노동이나 초단기 아르바이트로 내몰리는 청년들이 늘어나며 고용의 질마저 악화되고 있다는 지적이 나옵니다. 반면 60대 이상 고령층의 취업자는 크게 늘어 고용 시장의 양극화와 세대 간 불균형이 더욱 심각해졌습니다. 정부는 부랴부랴 청년 일자리 대책 마련에 고심하고 있으나 단기적인 처방에 그칠 것이라는 비판도 만만치 않습니다. 고금리 장기화로 기업들이 투자를 축소하는 한 고용 한파는 쉽게 풀리지 않을 전망입니다.`,
  keyTerms:[{term:`고용동향`,explanation:`국가에서 매월 취업자와 실업자 숫자를 조사해 현재 일자리 시장의 상태가 어떠한지 보여주는 핵심 통계 자료입니다.`}],
  history:`저성장 국면에 접어든 한국 경제 구조 속에서, 대기업들은 대규모 신입 공채 대신 경력직 수시 채용을 선호하는 방향으로 채용 트렌드를 바꿨습니다.`,
  players:`일자리를 구하지 못해 구직을 단념하고 있는 20대 청년들과, 인건비 부담과 경기 불확실성으로 채용을 줄인 국내 기업들입니다.`,
  current:`수출은 호조를 보이고 있으나, 그 과실이 내수 시장과 고용 확대로 이어지지 않는 전형적인 고용 없는 성장의 덫에 빠진 상태입니다.`,
  outlook:`정부가 하반기에 예고한 대규모 공공 일자리 사업과 규제 완화를 통한 민간 투자 유도 정책이 얼마나 실효성을 거둘지가 관건입니다.`,
  sources:[{title:`청년 고용 한파, 실업률 6.8%로 급등 - MBC`,url:`https://imnews.imbc.com/`},{title:`질 나쁜 일자리로 내몰리는 20대 - 중앙일보`,url:`https://www.joongang.co.kr/`}]

  category:`기타 이슈`,

  headline:`SK하이닉스가 54조 원 규모의 국내 투자를 승인한 가운데, 엔비디아와 마이크로소프트 등 글로벌 빅테크 간의 AI 반도체 패권 경쟁이 격화되고 있습니다.`,
  metrics:[`SK하이닉스 투자 54.3조 원`,`엔비디아 AI 펀드 5,000억 달러`],
  summary:`SK하이닉스가 AI 서버용 HBM 메모리 시장의 주도권을 굳히기 위해 국내 팹 라인에 무려 54조 3천억 원 규모의 대대적인 투자를 최종 승인했습니다. 이는 글로벌 인공지능 수요 폭발에 선제적으로 대응하기 위한 과감한 조치입니다. 한편, 세계 AI 반도체 시장을 장악한 엔비디아는 1조 파라미터 규모의 차세대 언어모델을 내놓고 5,000억 달러 규모의 AI 인프라 금융까지 추진하며 생태계 지배력을 강화하고 있습니다. 이에 질세라 마이크로소프트는 엔비디아에 대한 의존도를 낮추고자 자체 설계한 AI 특화 칩셋을 공개하며 반격에 나섰습니다. 거대 기술 기업들이 천문학적인 자본을 쏟아부으며 기술 패권 경쟁을 벌이는 양상입니다. 한국 정부 역시 5조 원 규모의 반도체 펀드 조성을 추진하며 자국 기업 돕기에 발 벗고 나섰습니다. 바야흐로 국가의 운명을 건 AI 반도체 전쟁이 절정으로 치닫고 있습니다.`,
  keyTerms:[{term:`HBM`,explanation:`고대역폭 메모리라고 부르며, 여러 개의 D램을 수직으로 쌓아 올려 데이터 처리 속도를 혁신적으로 끌어올린 차세대 반도체입니다.`}],
  history:`인공지능이 텍스트를 넘어 영상과 음성까지 처리하게 되면서, 방대한 데이터를 빠르게 연산할 수 있는 고성능 특수 반도체 수요가 폭증했습니다.`,
  players:`차세대 메모리를 주도하는 한국의 SK하이닉스, 설계 독점 기업인 미국의 엔비디아, 거대 자본을 앞세운 클라우드 공룡 마이크로소프트입니다.`,
  current:`현재는 칩 설계사와 메모리 제조사가 긴밀하게 협력하고 있지만, 빅테크 기업들이 맞춤형 칩을 직접 만들겠다고 선언하며 판이 흔들리고 있습니다.`,
  outlook:`막대한 전력이 소모되는 AI 데이터센터의 전력 효율성을 높이기 위해 차세대 칩을 누가 먼저 양산하느냐가 향후 경쟁의 승패를 가를 것입니다.`,
  sources:[{title:`SK하이닉스 54조 베팅, 차세대 메모리 초격차 - 한국경제`,url:`https://www.hankyung.com/`},{title:`Nvidia extends dominance in AI chips - WSJ`,url:`https://www.wsj.com/`}]

  headline:`지구 궤도를 떠돌던 거대한 우주 쓰레기인 로켓 잔해가 달 표면에 시속 8,700km로 충돌하며 우주 오염 문제의 심각성을 알렸습니다.`,
  metrics:[`로켓 잔해 무게 4.9톤`,`충돌 속도 시속 8,700km`],
  summary:`우주 공간을 수년간 떠돌던 로켓 잔해물이 시속 8,700km의 맹렬한 속도로 달 표면에 충돌했습니다. 이 잔해의 무게는 약 4.9톤에 달하며 엄청난 파괴력으로 인해 달 표면에 거대한 분화구가 형성되었습니다. 놀랍게도 궤도를 돌던 한국의 첫 달 궤도선 다누리가 이 역사적인 충돌 전후의 표면 변화 현장을 정밀하게 촬영하는 데 성공했습니다. 이번 사건은 인류가 쏘아 올린 인공물이 지구 궤도를 넘어 달 부근까지 심각하게 오염시키고 있다는 경각심을 일깨웠습니다. 각국 우주국과 천문학계는 통제 불능 상태의 거대한 우주 쓰레기가 향후 유인 달 탐사 임무에 치명적인 위협이 될 수 있다고 잇따라 경고하고 있습니다. 파편을 추적하고 수거하기 위한 국제적인 규범과 기술 개발이 시급하다는 목소리가 커지고 있습니다. 한때 미지의 영역이었던 우주가 빠르게 거대한 쓰레기장으로 변모하고 있는 안타까운 현실입니다.`,
  keyTerms:[{term:`우주 쓰레기`,explanation:`수명이 다한 인공위성이나 부서진 로켓의 파편 등 우주 공간을 통제 없이 떠돌아다니며 충돌 위협을 주는 인공물을 말합니다.`}],
  history:`냉전 시대 미소 우주 경쟁부터 최근 민간 우주 기업들의 상업용 위성 대량 발사까지 겹치면서 지구 주변의 우주 파편은 기하급수적으로 늘어났습니다.`,
  players:`위성을 무수히 쏘아 올리는 다국적 민간 우주 기업들과, 유인 달 탐사 프로젝트를 본격적으로 추진 중인 주요국 국가 우주국들입니다.`,
  current:`아주 작은 페인트 조각 하나라도 우주 공간에서는 총알보다 빠른 속도로 날아다니기 때문에 운용 중인 위성과 부딪히면 엄청난 재난을 초래할 수 있습니다.`,
  outlook:`유엔 산하 우주 위원회를 중심으로 파편 발생을 엄격히 규제하고 청소 책임을 묻는 구체적인 국제 조약 제정 논의가 급물살을 탈 것으로 보입니다.`,
  sources:[{title:`로켓 잔해 달 충돌, 다누리가 찍었다 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`Space junk highlights growing orbit threat - BBC`,url:`https://www.bbc.com/`}]
}]

let current = null;
let currentCat = null;
const CAT_ORDER = ['경제', '정치', '기타 이슈'];

function renderSidebar() {
  const list = document.getElementById('date-list');
  list.innerHTML = '';
  BRIEFS.forEach((b, i) => {
    const el = document.createElement('div');
    el.className = 'date-item' + (i === 0 ? ' active' : '');
    el.dataset.tag = b.tag;
    const parts = b.tag.split('-');
    const short = parts[1] + '/' + parts[2];
    el.innerHTML = b.tag;
    el.addEventListener('click', () => showBrief(b.tag));
    list.appendChild(el);
  });
}

function showBrief(tag) {
  current = tag;
  document.querySelectorAll('.date-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tag === tag);
  });
  const brief = BRIEFS.find(b => b.tag === tag);
  if (!brief) return;

  // 카테고리별 그룹핑
  const grouped = {};
  brief.stories.forEach(s => {
    if (!grouped[s.category]) grouped[s.category] = [];
    grouped[s.category].push(s);
  });
  const availableCats = CAT_ORDER.filter(c => grouped[c] && grouped[c].length);
  if (!availableCats.length) return;

  // 기본 카테고리 결정
  if (!availableCats.includes(currentCat)) currentCat = availableCats[0];

  renderContent(brief, grouped, availableCats);
}

function renderContent(brief, grouped, availableCats) {
  const content = document.getElementById('content');
  let html = `<div class="sticky-top">
    <div class="brief-header">
      <div class="bh-eyebrow">Morning Brief</div>
      <h2>${brief.label}</h2>
    </div>`;

  // 탭
  html += '<div class="cat-tabs">';
  availableCats.forEach(c => {
    const cls = c === currentCat ? 'cat-tab active' : 'cat-tab';
    html += `<button class="${cls}" data-cat="${c}">${c}</button>`;
  });
  html += '</div></div>';

  // 선택된 카테고리 기사들
  const stories = grouped[currentCat] || [];
  stories.forEach((s, idx) => {
    if (idx > 0) html += '<hr class="story-divider">';
    html += `<div class="story">
      <div class="story-top">
        <div class="story-headline">${s.headline}</div>
      </div>`;
    if (s.metrics.length) {
      html += '<div class="metrics">';
      s.metrics.forEach(m => { html += `<div class="metric-chip">${m}</div>`; });
      html += '</div>';
    }
    // 요약문에 핵심 개념 밑줄 (출력은 박스 다음)
    let summaryHtml = s.summary;
    if (s.keyTerms && s.keyTerms.length) {
      s.keyTerms.forEach(kt => {
        if (!kt.term) return;
        const safe = kt.term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp(safe, 'g');
        summaryHtml = summaryHtml.replace(re, `<span class="kt-underline">${kt.term}</span>`);
      });
    }

    // 핵심 개념 박스 (요약 위)
    if (s.keyTerms && s.keyTerms.length) {
      html += '<div class="key-terms"><div class="key-terms-title">핵심 개념</div>';
      s.keyTerms.forEach(kt => {
        html += `<div class="kt-item">
          <span class="kt-term">${kt.term}</span>
          <span class="kt-exp">${kt.explanation}</span>
        </div>`;
      });
      html += '</div>';
    }

    html += `<div class="summary">${summaryHtml}</div>`;

    const bgSections = [
      ['역사적 맥락', s.history],
      ['핵심 플레이어', s.players],
      ['현재 구도', s.current],
      ['향후 전망', s.outlook],
    ].filter(([, v]) => v);

    if (bgSections.length) {
      html += '<div class="bg-box"><div class="bg-box-title">배경 스토리</div>';
      bgSections.forEach(([label, text]) => {
        html += `<div class="bg-section">
          <div class="bg-section-label">${label}</div>
          <div class="bg-section-text">${text}</div>
        </div>`;
      });
      html += '</div>';
    }

    if (s.sources.length) {
      html += `<button class="sources-toggle" data-toggle="srcs-${idx}">출처 ${s.sources.length}개 보기 <span class="arrow">▾</span></button>`;
      html += `<div class="sources-body" id="srcs-${idx}">`;
      s.sources.forEach((src, si) => {
        html += `<div class="source-item">
          <span class="src-num">${si+1}</span>
          <a href="${src.url}" target="_blank">${src.title}</a>
        </div>`;
      });
      html += '</div>';
    }
    html += '</div>';
  });

  content.innerHTML = html;

  // 탭 클릭 핸들러
  content.querySelectorAll('.cat-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentCat = btn.dataset.cat;
      renderContent(brief, grouped, availableCats);
    });
  });

  // 출처 토글
  content.querySelectorAll('.sources-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const body = document.getElementById(btn.dataset.toggle);
      const isOpen = body.classList.toggle('open');
      btn.classList.toggle('open', isOpen);
    });
  });

  document.getElementById('main').scrollTop = 0;
}

if (BRIEFS.length > 0) {
  renderSidebar();
  showBrief(BRIEFS[0].tag);
} else {
  document.getElementById('content').innerHTML = '<div class="empty">브리핑 데이터가 없습니다.</div>';
}

// ── Quiz Gate ──
const PASS_TARGET = 3;
let correctCount = 0;
const usedIndexes = new Set();

function pickQuestion() {
  // 사용 안 한 문제 중 랜덤. 다 썼으면 풀 리셋
  if (usedIndexes.size >= QUIZ.length) usedIndexes.clear();
  let idx;
  do { idx = Math.floor(Math.random() * QUIZ.length); } while (usedIndexes.has(idx));
  usedIndexes.add(idx);
  return QUIZ[idx];
}

function updateCounter() {
  document.getElementById('quiz-counter').textContent = `(${correctCount}/${PASS_TARGET})`;
}

function renderQuiz() {
  const q = pickQuestion();
  document.getElementById('quiz-q').textContent = q.q;
  updateCounter();
  const feedback = document.getElementById('quiz-feedback');
  feedback.textContent = '';
  feedback.className = 'quiz-feedback';
  const closeBtn = document.getElementById('quiz-close');
  closeBtn.classList.add('hidden');

  const choicesEl = document.getElementById('quiz-choices');
  choicesEl.innerHTML = '';
  // 보기 순서 섞기 (정답 위치 고정 방지)
  const order = q.a.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  order.forEach(idx => {
    const text = q.a[idx];
    const btn = document.createElement('button');
    btn.className = 'quiz-choice';
    btn.textContent = text;
    btn.addEventListener('click', () => {
      const allBtns = choicesEl.querySelectorAll('.quiz-choice');
      allBtns.forEach(b => b.disabled = true);
      if (idx === q.correct) {
        btn.classList.add('correct');
        correctCount++;
        updateCounter();
        if (correctCount >= PASS_TARGET) {
          feedback.textContent = '통과! 들어와도 좋아.';
          feedback.className = 'quiz-feedback right';
          closeBtn.classList.remove('hidden');
        } else {
          feedback.textContent = '역시 맞출 줄 알았어. 다음 문제 고.';
          feedback.className = 'quiz-feedback right';
          btn.blur();
          setTimeout(() => {
            if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
            renderQuiz();
          }, 900);
        }
      } else {
        btn.classList.add('wrong');
        feedback.textContent = '정말 실망이다.... 다음.';
        feedback.className = 'quiz-feedback wrong';
        btn.blur();
        setTimeout(() => {
          if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
          renderQuiz();
        }, 900);
      }
    });
    choicesEl.appendChild(btn);
  });
}

document.getElementById('quiz-close').addEventListener('click', () => {
  document.getElementById('quiz-overlay').classList.add('hidden');
  document.body.classList.remove('quiz-active');
});

document.body.classList.add('quiz-active');
renderQuiz();

// ── Mobile sidebar toggle ──
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('sidebar-backdrop');
function toggleSidebar(open) {
  sidebar.classList.toggle('open', open);
  backdrop.classList.toggle('open', open);
}
document.getElementById('sidebar-toggle').addEventListener('click', () => toggleSidebar(!sidebar.classList.contains('open')));
backdrop.addEventListener('click', () => toggleSidebar(false));
// 날짜 클릭하면 모바일에서 자동으로 닫히게
sidebar.addEventListener('click', e => {
  if (e.target.classList.contains('date-item') && window.innerWidth <= 768) {
    toggleSidebar(false);
  }
});

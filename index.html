<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>모닝 브리핑</title>
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --sidebar-w: 240px;
    --bg: #FAFAF7;
    --paper: #FFFFFF;
    --accent: #6B7A8F;
    --accent-soft: #E8ECEF;
    --line: #EAE8E3;
    --line-strong: #D8D5CE;
    --text: #2D2A26;
    --text-mid: #6B655D;
    --text-sub: #A09889;
    --radius: 10px;
  }
  html, body {
    height: 100%; background: var(--bg); color: var(--text);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 15px; line-height: 1.65; font-weight: 400;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }

  /* ── Layout ── */
  #app { display: flex; height: 100vh; overflow: hidden; }

  /* ── Sidebar ── */
  #sidebar {
    width: var(--sidebar-w); flex-shrink: 0;
    background: var(--bg); border-right: 1px solid var(--line);
    display: flex; flex-direction: column; overflow: hidden;
  }
  #sidebar-header {
    padding: 36px 20px 24px;
    border-bottom: 1px solid var(--line);
    text-align: center;
  }
  #sidebar-header h1 {
    font-size: 19px; font-weight: 700; color: var(--text);
    letter-spacing: -0.4px; line-height: 1.3;
  }
  #sidebar-header p {
    font-size: 12px; color: var(--text-sub); margin-top: 6px;
    letter-spacing: 0.3px;
  }
  #date-list { overflow-y: auto; flex: 1; padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
  .date-item {
    padding: 11px 14px; cursor: pointer; border-radius: 8px;
    transition: background 0.15s, color 0.15s;
    background: transparent;
    text-align: center; font-size: 13px; font-weight: 500; color: var(--text-mid);
    letter-spacing: 0.1px;
  }
  .date-item:hover { background: var(--accent-soft); color: var(--text); }
  .date-item.active {
    background: var(--accent-soft); color: var(--text); font-weight: 600;
  }

  /* ── Main ── */
  #main { flex: 1; overflow-y: auto; background: var(--paper); }
  #content { max-width: 760px; margin: 0 auto; padding: 56px 40px 80px; }

  .brief-header { margin-bottom: 36px; }
  .brief-header .bh-eyebrow {
    font-size: 11px; color: var(--text-sub); margin-bottom: 8px;
    letter-spacing: 1.5px; text-transform: uppercase; font-weight: 500;
  }
  .brief-header h2 {
    font-size: 30px; font-weight: 700; letter-spacing: -0.7px;
    color: var(--text); line-height: 1.25;
  }

  /* ── Sticky Top (header + tabs) ── */
  .sticky-top {
    position: sticky; top: 0;
    background: var(--paper); z-index: 20;
    padding-top: 56px; margin-top: -56px;
  }
  .sticky-top .brief-header { margin-bottom: 24px; }

  /* ── Category Tabs ── */
  .cat-tabs {
    display: flex; gap: 0; margin-bottom: 36px;
    border-bottom: 1px solid var(--line);
    background: var(--paper);
  }
  .cat-tab {
    padding: 12px 20px 14px; cursor: pointer; font-size: 14px; font-weight: 500;
    color: var(--text-sub); border-bottom: 2px solid transparent;
    transition: color 0.15s, border-color 0.15s;
    background: none; border-top: none; border-left: none; border-right: none;
    font-family: inherit; letter-spacing: -0.1px;
    margin-bottom: -1px;
  }
  .cat-tab:hover { color: var(--text-mid); }
  .cat-tab.active { color: var(--text); border-bottom-color: var(--text); font-weight: 600; }

  /* ── Sources (collapsible) ── */
  .sources-toggle {
    background: transparent; border: 1px solid var(--line-strong);
    padding: 8px 14px; border-radius: 6px; font-size: 12.5px; font-weight: 500;
    color: var(--text-mid); cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    font-family: inherit; margin-top: 12px;
    transition: background 0.15s, border-color 0.15s;
  }
  .sources-toggle:hover { background: var(--accent-soft); border-color: var(--accent); }
  .sources-toggle .arrow { transition: transform 0.2s; font-size: 9px; color: var(--text-sub); }
  .sources-toggle.open .arrow { transform: rotate(180deg); }
  .sources-body { display: none; margin-top: 12px; padding-left: 4px; }
  .sources-body.open { display: block; }

  /* ── Story Card ── */
  .story { margin-bottom: 40px; }
  .story-top { margin-bottom: 18px; }
  .story-headline {
    font-size: 19px; font-weight: 700; line-height: 1.45;
    letter-spacing: -0.4px; color: var(--text);
  }

  .metrics { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .metric-chip {
    background: var(--accent-soft); border: none;
    border-radius: 6px; padding: 7px 12px;
    font-size: 12.5px; font-weight: 500; color: var(--text-mid);
    line-height: 1.4;
  }

  .summary {
    font-size: 15px; line-height: 1.8; color: var(--text); margin-bottom: 20px;
    letter-spacing: -0.1px;
  }
  .summary .kt-underline {
    color: #1996BD;
    text-decoration: underline;
    text-decoration-color: #1996BD;
    text-decoration-thickness: 1.5px;
    text-underline-offset: 3px;
    cursor: help;
  }

  /* ── Key Terms Box ── */
  .key-terms {
    background: #F4F1EA; border: 1px solid var(--line);
    border-left: 3px solid var(--accent);
    border-radius: var(--radius); padding: 18px 22px; margin-bottom: 14px;
  }
  .key-terms-title {
    font-size: 11px; font-weight: 600; color: var(--text-sub);
    text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 14px;
  }
  .kt-item { margin-bottom: 12px; }
  .kt-item:last-child { margin-bottom: 0; }
  .kt-term {
    font-size: 13.5px; font-weight: 700; color: #1996BD;
    margin-bottom: 4px; display: block;
    letter-spacing: -0.1px;
  }
  .kt-exp {
    font-size: 13.5px; line-height: 1.7; color: var(--text-mid);
  }

  /* ── Background ── */
  .bg-box {
    background: var(--bg); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 22px 24px; margin-bottom: 14px;
  }
  .bg-box-title {
    font-size: 11px; font-weight: 600; color: var(--text-sub);
    text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 16px;
  }
  .bg-section { margin-bottom: 16px; }
  .bg-section:last-child { margin-bottom: 0; }
  .bg-section-label {
    font-size: 12.5px; font-weight: 600; color: var(--text); margin-bottom: 6px;
    letter-spacing: -0.1px;
  }
  .bg-section-text { font-size: 14px; line-height: 1.75; color: var(--text-mid); }

  /* ── Sources ── */
  .source-item {
    display: flex; align-items: flex-start; gap: 10px;
    margin-bottom: 8px; font-size: 13px;
  }
  .src-num {
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent-soft); color: var(--text-mid);
    font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
  }
  .source-item a { color: var(--text-mid); text-decoration: none; line-height: 1.55; }
  .source-item a:hover { color: var(--text); text-decoration: underline; }

  .story-divider { border: none; border-top: 1px solid var(--line); margin: 36px 0; }

  .empty { color: var(--text-sub); font-size: 14px; padding: 60px 0; text-align: center; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }

  /* ── Mobile Toggle ── */
  #sidebar-toggle {
    display: none;
    position: fixed; top: 14px; left: 14px; z-index: 50;
    background: var(--paper); border: 1px solid var(--line-strong);
    width: 40px; height: 40px; border-radius: 10px;
    cursor: pointer; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(45, 42, 38, 0.08);
  }
  #sidebar-toggle span {
    display: block; width: 18px; height: 2px; background: var(--text);
    position: relative;
  }
  #sidebar-toggle span::before,
  #sidebar-toggle span::after {
    content: ''; position: absolute; left: 0; width: 18px; height: 2px; background: var(--text);
  }
  #sidebar-toggle span::before { top: -6px; }
  #sidebar-toggle span::after { top: 6px; }

  #sidebar-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(45, 42, 38, 0.4); z-index: 40;
  }
  #sidebar-backdrop.open { display: block; }

  /* ── Mobile Responsive ── */
  @media (max-width: 768px) {
    #sidebar-toggle { display: flex; }
    #sidebar {
      position: fixed; left: 0; top: 0; bottom: 0;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      z-index: 45; width: 260px;
      box-shadow: 0 0 24px rgba(45, 42, 38, 0.12);
    }
    #sidebar.open { transform: translateX(0); }

    #content { padding: 64px 20px 60px; max-width: 100%; }
    .brief-header h2 { font-size: 22px; }
    .story-headline { font-size: 16px; }
    .summary { font-size: 14.5px; line-height: 1.75; }
    .bg-section-text { font-size: 13.5px; }
    .metric-chip { font-size: 12px; padding: 6px 10px; }
    .bg-box { padding: 18px 18px; }
    .cat-tab { padding: 11px 14px; font-size: 13.5px; }

    .quiz-card { padding: 28px 24px 24px; }
    .quiz-q { font-size: 17px; }
    .quiz-choice { font-size: 14px; padding: 13px 16px; }
  }

  /* ── Quiz Overlay ── */
  body.quiz-active #app {
    filter: blur(6px) saturate(0.85);
    pointer-events: none;
    transition: filter 0.3s ease;
  }
  #quiz-overlay {
    position: fixed; inset: 0;
    background-color: rgba(250, 250, 247, 0.55);
    background-image:
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0) 0,
        rgba(255,255,255,0) 5px,
        rgba(45,42,38,0.04) 5px,
        rgba(45,42,38,0.04) 6px
      ),
      repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0) 0,
        rgba(255,255,255,0) 22px,
        rgba(45,42,38,0.025) 22px,
        rgba(45,42,38,0.025) 23px
      );
    display: flex; align-items: center; justify-content: center;
    z-index: 100; padding: 24px;
  }
  #quiz-overlay.hidden { display: none; }

  .quiz-card {
    background: var(--paper); border-radius: 16px;
    padding: 36px 36px 32px; width: 100%; max-width: 440px;
    box-shadow: 0 16px 48px rgba(45, 42, 38, 0.18);
  }
  .quiz-eyebrow {
    font-size: 11px; color: var(--text-sub); letter-spacing: 1.5px;
    text-transform: uppercase; font-weight: 500; margin-bottom: 12px;
  }
  .quiz-q {
    font-size: 19px; font-weight: 700; color: var(--text);
    line-height: 1.5; letter-spacing: -0.3px; margin-bottom: 24px;
  }
  .quiz-choices { display: flex; flex-direction: column; gap: 8px; }
  .quiz-choice {
    background: var(--paper); border: 1px solid var(--line-strong);
    padding: 14px 18px; border-radius: 10px; font-size: 14.5px; font-weight: 500;
    color: var(--text); cursor: pointer; text-align: left;
    font-family: inherit; transition: background 0.15s, border-color 0.15s, transform 0.1s;
  }
  .quiz-choice:focus { outline: none; }
  .quiz-choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (hover: hover) {
    .quiz-choice:hover { background: var(--accent-soft); border-color: var(--accent); }
  }
  .quiz-choice:active { transform: scale(0.99); }
  .quiz-choice.wrong {
    background: #F5E6E0; border-color: #C9947F; color: #8A4A30;
    animation: shake 0.4s ease;
  }
  .quiz-choice.correct {
    background: #E3EDE2; border-color: #7A9077; color: #2E4A2C;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .quiz-feedback {
    margin-top: 20px; text-align: center; font-size: 14px; font-weight: 500;
    color: var(--text-mid); min-height: 22px;
  }
  .quiz-feedback.right { color: #2E4A2C; }
  .quiz-feedback.wrong { color: #8A4A30; }

  .quiz-close-btn {
    margin-top: 18px; width: 100%;
    background: var(--text); color: var(--paper); border: none;
    padding: 13px 20px; border-radius: 10px; font-size: 14px; font-weight: 600;
    font-family: inherit; cursor: pointer;
    transition: background 0.15s;
  }
  .quiz-close-btn:hover { background: #1a1815; }
  .quiz-close-btn.hidden { display: none; }
</style>
</head>
<body>
<div id="quiz-overlay">
  <div class="quiz-card">
    <div class="quiz-eyebrow"><span>잠깐, 나에 대해서 잘 알지?</span> <span id="quiz-counter">(0/3)</span></div>
    <div class="quiz-q" id="quiz-q"></div>
    <div class="quiz-choices" id="quiz-choices"></div>
    <div class="quiz-feedback" id="quiz-feedback"></div>
    <button class="quiz-close-btn hidden" id="quiz-close">닫기</button>
  </div>
</div>

<button id="sidebar-toggle" aria-label="메뉴"><span></span></button>
<div id="sidebar-backdrop"></div>

<div id="app">
  <nav id="sidebar">
    <div id="sidebar-header">
      <h1>모닝 브리핑</h1>
      <p>일별 세계 뉴스 요약</p>
    </div>

    <div id="date-list"></div>
  </nav>
  <main id="main">
    <div id="content"></div>
  </main>
</div>

<script>
const BRIEFS = [{
  tag:`2026-08-23`,
  label:`2026년 8월 23일 (일)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국은행, 기준금리 3.00% '백투백 인상' 단행 가능성 논란`,
  metrics:[`2분기 GDP 0.6% 성장`,`현재 기준금리 연 2.75%`],
  summary:`한국은행이 이번 주 27일 열리는 금융통화위원회에서 두 달 연속으로 기준금리를 올리는 백투백 인상을 단행할지 시장의 이목이 집중되고 있어. 지난달 기준금리를 연 2.75%로 올린 데 이어 이번에도 인상할 경우 3.00%를 기록하게 돼. 최근 2분기 GDP 성장률이 0.6%로 예상보다 양호하게 나왔고 인플레이션 압력이 여전히 남아있어 금리 인상의 명분은 충분한 상태야. 반면, 최근의 환율 하락세와 주식 시장 조정을 감안해 이번에는 금리를 동결하고 상황을 더 지켜보자는 신중론도 팽팽하게 맞서는 중이야. 기준금리가 3.00%대로 진입하면 대출을 받은 서민들의 이자 부담이 급증하여 내수에 큰 타격을 줄 수 있어. 이번 결정은 하반기 경제 성장률과 부동산 시장의 흐름을 결정짓는 핵심 변수가 될 전망이야.`,
  keyTerms:[{term:`백투백 인상`,explanation:`한국은행이 두 번 연속으로 기준금리를 올리는 것을 뜻해.`}],
  history:`한국은행은 치솟는 물가를 잡기 위해 수차례 기준금리를 인상하며 긴축 기조를 유지해왔어. 지난달에도 0.25%포인트를 올려 연 2.75% 시대를 열었지. 하지만 고금리 상황이 장기화되면서 내수 부진에 대한 우려도 함께 커지는 상황이야.`,
  players:`기준금리를 결정하는 한국은행 금융통화위원회 위원들이 가장 중요한 주체야. 금리 인상에 따른 경제 침체 가능성을 우려하는 정부와 대출 이자 부담을 걱정하는 시장 참여자들도 이해당사자야.`,
  current:`경제 지표 호조로 금리 인상 명분은 살아있지만 최근 금융 시장의 변동성이 확대되면서 변수가 생겼어. 금통위원들 간에도 거시 경제 상황을 바라보는 시각이 엇갈려 치열한 격론이 예상돼.`,
  outlook:`27일 금통위에서 어떤 결정이 내려지느냐에 따라 시중 은행의 대출 금리도 즉각 영향을 받을 거야. 향후 소비자 물가 지수 변화와 10월 금통위의 방향성에도 중대한 영향을 미치게 돼.`,
  sources:[{title:`한국은행 기준금리 '백투백' 인상할까? - 뉴스핌`,url:`https://www.newspim.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`나라빚 중 최악인 '적자성 채무' 사상 첫 1,000조 원 돌파`,
  metrics:[`적자성 채무 1,000조 원`,`반도체 추가 세수 발생`],
  summary:`올해 국가 채무 중 국민 세금으로 오롯이 갚아야 하는 적자성 채무 규모가 사상 처음으로 1,000조 원을 돌파하며 심각한 우려를 낳고 있어. 정부는 최근 반도체 수출 호황으로 늘어난 추가 세수를 활용해 첨단 산업을 지원하는 미래대응기금을 조성하겠다고 발표했어. 하지만 나라빚 규모가 눈덩이처럼 불어난 상황에서 세수 초과분을 빚을 갚는 데 먼저 쓰지 않고 기금 조성에 투입하는 정책 방향에 대해 비판이 커지는 상황이야. 재정건전성을 중시하는 전문가들은 1,000조 원에 달하는 채무로 인해 매년 발생하는 이자 부담만 수십조 원에 달한다고 지적해. 반면 정부는 국가의 장기적인 성장 동력을 확보하기 위해서는 전략 산업에 대한 선제적인 투자가 불가피하다는 입장을 고수하고 있어. 한정된 재원의 활용처를 둘러싼 여야의 갈등과 재정건전성 논란은 향후 예산 정국의 최대 쟁점으로 부상할 전망이야.`,
  keyTerms:[{term:`적자성 채무`,explanation:`국가가 거둬들이는 세금보다 쓰는 돈이 많아서 빚을 내어 충당한 금액을 뜻해. 결국 나중에 국민의 세금으로 갚아야만 하는 악성 부채야.`}],
  history:`과거 팬데믹 대응과 각종 복지 정책 확대로 인해 국가 채무는 지난 몇 년간 급격히 증가해왔어. 그동안 세수 부족까지 겹치면서 국채 발행이 늘어났고 결국 적자성 채무가 임계점을 넘게 된 거야.`,
  players:`재정 정책을 총괄하는 기획재정부와 예산을 심사하는 국회가 주요 당사자야. 재정건전성을 강조하는 야당 및 학계 전문가들과 적극적인 재정 역할을 주문하는 정부의 입장이 충돌하고 있어.`,
  current:`반도체 호황으로 모처럼 세수 결손 상황에서 벗어나 추가 세수가 발생했지만 이를 어디에 쓸 것인가를 두고 의견이 첨예하게 대립하고 있어. 막대한 이자 비용은 이미 국가 재정에 상당한 부담으로 작용하는 중이야.`,
  outlook:`가을 정기국회가 개원하면 내년도 예산안 심사 과정에서 미래대응기금 신설과 채무 상환 우선순위를 두고 거센 정치적 공방이 일어날 것으로 예상돼.`,
  sources:[{title:`나라빚 '적자성 채무' 1,000조 돌파 논란 - 다음 뉴스`,url:`https://news.daum.net/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국과 캐나다 관세 협상 결렬로 200억 달러 규모 맞관세 전쟁 발발`,
  metrics:[`맞관세 규모 200억 달러`,`캐나다 낙농 제품 보복 예고`],
  summary:`미국과 캐나다 간의 핵심 무역 관세 협상이 최종적으로 결렬되면서 총 200억 달러 규모의 전례 없는 맞관세 전쟁이 촉발됐어. 미국이 자국 산업 보호를 명분으로 캐나다산 수입품에 대규모 관세를 부과하기로 결정한 것이 사건의 발단이야. 이에 대해 캐나다 정부는 미국의 조치를 불법적인 무역 장벽으로 규정하고 철강과 낙농 제품을 포함한 미국산 수입품에 보복관세를 매기겠다고 공식적으로 예고했어. 북미 지역을 묶어주던 자유무역 기조가 흔들리면서 글로벌 공급망 전반에 심각한 차질이 빚어질 것이라는 시장의 불안감이 고조되는 중이야. 양국 간의 경제적 의존도가 높은 만큼 무역 갈등이 장기화될 경우 자동차, 농산물 등 핵심 산업의 타격이 불가피해. 이번 맞관세 충돌은 전 세계 보호무역주의가 다시 확산되는 도화선이 될 수 있어 전 세계가 상황을 예의주시하고 있어.`,
  keyTerms:[{term:`보복관세`,explanation:`상대국이 자국 상품에 부당하게 높은 관세를 매길 때, 이에 맞서 상대국 상품에도 높은 관세를 부과하는 무역 보복 조치야.`}],
  history:`과거에도 미국과 캐나다는 목재, 철강 등 주요 품목의 무역 조건을 두고 크고 작은 마찰을 빚어왔어. 자국 우선주의 정책이 강화되면서 양국 간의 협상 태도가 점점 더 강경해지는 추세였지.`,
  players:`자국 산업을 보호하려는 미국 정부와 이에 강력히 반발하는 캐나다 정부가 갈등의 핵심 주체야. 피해를 보게 될 양국의 수출 기업들과 다국적 기업들도 긴장하고 있어.`,
  current:`막판 타협을 기대했던 협상이 무산되면서 양국은 본격적인 실력 행사에 돌입할 준비를 마쳤어. 보복관세 조치가 실제로 발동되면 북미 무역 동맹에 큰 균열이 발생하게 돼.`,
  outlook:`양국이 세계무역기구 제소 등 법적 분쟁으로 향할 가능성이 높아졌어. 다른 국가들로까지 관세 인상 도미노가 이어질지 시장의 관심이 집중되고 있어.`,
  sources:[{title:`미국·캐나다 '맞관세' 전쟁 돌입 - 머니투데이`,url:`https://news.mt.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`트럼프 미국 대통령, 한미연합훈련 대폭 축소 지시 및 북미 대화 속도전`,
  metrics:[`11월 중간선거 임박`,`하반기 UFS 훈련 축소`],
  summary:`도널드 트럼프 미국 대통령이 올해 하반기로 예정된 한미연합훈련(UFS)의 규모를 대폭 축소하라고 국방부에 전격 지시하며 파장이 일고 있어. 이는 다가오는 11월 미국 중간선거를 앞두고 가시적인 외교적 성과를 만들어내기 위해 북한 김정은 국무위원장과의 대화를 서두르려는 의도로 풀이돼. 트럼프 대통령은 이미 김 위원장이 자신의 대화 제안에 긍정적인 응답을 해왔다고 공개적으로 밝혔어. 한편, 이재명 대통령이 앞서 미국의 대이란 전쟁 협조 요청을 거절한 것에 대해 트럼프 측이 강한 불만을 품고 한미연합훈련 축소 카드를 꺼냈다는 분석도 나와. 동맹국과의 조율 없이 일방적으로 안보 정책이 변경되면서 한미 동맹 전선에 심각한 균열이 발생하고 있다는 우려가 제기되고 있어. 북미 관계 개선의 기대감 이면에 한국의 안보 불안이 커지는 복잡한 정국이 펼쳐지는 중이야.`,
  keyTerms:[{term:`한미연합훈련`,explanation:`한국과 미국 군대가 한반도 방위를 목적으로 매년 정기적으로 실시하는 대규모 합동 군사 훈련을 말해.`}],
  history:`트럼프 대통령은 과거 재임 시절에도 훈련 비용 문제 등을 이유로 한미연합훈련을 중단하거나 축소한 전력이 있어. 미국의 선거 국면마다 외교적 성과를 위해 대북 유화 제스처를 취하는 패턴이 반복되고 있지.`,
  players:`미국 국방부와 한국 군 당국이 훈련을 조율하지만, 트럼프 대통령의 독단적인 지시가 상황을 주도하고 있어. 안보 불안을 느끼는 한국 정부와 대화 재개를 노리는 북한이 얽혀 있어.`,
  current:`미국 내 선거 일정에 쫓기는 트럼프 대통령이 북미 정상회담 등 파격적인 행보를 준비 중인 것으로 관측돼. 한국 정부는 미국의 일방적인 조치에 당혹감을 감추지 못하고 대응책 마련에 고심 중이야.`,
  outlook:`조만간 북미 간 실무 접촉이나 고위급 회담이 성사될 가능성이 열렸어. 다만 한국의 입장이 배제된 채 북미 대화가 진행될 경우 이른바 한국 패싱 논란이 다시 불거질 수 있어.`,
  sources:[{title:`트럼프, 한미연합훈련 축소 지시 - 서울신문`,url:`https://www.seoul.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`이재명 대통령, 취임 후 첫 반부패정책협의회 주재로 공직 기강 다잡기`,
  metrics:[`취임 후 1호 협의회`,`토착 비리 근절 강조`],
  summary:`이재명 대통령이 취임 후 처음으로 반부패정책협의회를 직접 주재하며 대대적인 공직 기강 확립과 토착 비리 근절을 강력하게 주문했어. 이 대통령은 회의에서 부패 청산에는 네 편 내 편이 있을 수 없다고 강조하며 성역 없는 엄정한 조사를 관계 기관에 지시했어. 새 정부 출범 이후 민생 경제 안정을 최우선 과제로 삼았던 정부가 이제는 사회 전반의 부정부패 척결로 국정 운영의 무게 중심을 넓히는 모습이야. 일각에서는 이번 조치가 다가오는 정기국회를 앞두고 국정 장악력을 높이고 지지층을 결집하기 위한 정치적 포석이 아니냐는 해석도 나와. 반부패 드라이브가 가동됨에 따라 검찰과 경찰 등 사정 기관들의 대대적인 기획 수사가 이어질 가능성이 높아졌어. 야당은 이를 두고 정치적 반대파를 탄압하기 위한 수단으로 변질되어서는 안 된다며 견제에 나섰어.`,
  keyTerms:[{term:`반부패정책협의회`,explanation:`대통령이 직접 주재하여 국가 차원의 부패 방지 대책을 세우고 사정 기관들의 활동을 조율하는 최고위급 회의 기구야.`}],
  history:`정권이 교체되거나 국정 동력이 필요한 시기마다 역대 정부는 반부패 카드를 꺼내 들어 공직 사회에 긴장감을 불어넣곤 했어. 이재명 정부 역시 출범 초기부터 지속적으로 공정성을 강조해 온 연장선에 있어.`,
  players:`회의를 주재한 이재명 대통령과 감사를 담당하는 감사원, 검찰, 경찰 등 핵심 사정 기관장들이 한자리에 모였어. 사정 정국의 향방을 주시하는 정치권 전체가 긴장 상태에 돌입했어.`,
  current:`첫 회의에서 대통령의 강력한 의지가 표명된 만큼 각 부처는 가시적인 성과를 내기 위해 고강도 감찰에 착수할 준비를 마쳤어. 공직 사회 전반에 바짝 엎드리는 분위기가 형성되고 있어.`,
  outlook:`향후 지방자치단체장이나 지역 유력 인사들의 토착 비리에 대한 대규모 수사 결과가 속속 발표될 것으로 예상돼. 이 과정에서 억울한 표적 수사 논란이 발생하지 않도록 공정성이 쟁점이 될 거야.`,
  sources:[{title:`이재명 대통령, 취임 첫 반부패협의회 주재 - KTV 국민방송`,url:`https://www.ktv.go.kr/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`이란 내 온건파와 강경파, 전쟁 종식을 두고 정면충돌`,
  metrics:[`종전파 대통령 vs 강경파`,`10월 군사행동 우려`],
  summary:`이란 내부에서 국가의 향방을 놓고 온건파와 강경파 간의 권력 투쟁이 격화되며 전쟁 종식을 둘러싼 정면충돌이 벌어지고 있어. 마수드 페제시키안 이란 대통령과 국회의장 등 온건파 지도부는 더 이상의 희생을 막기 위해 당장 전쟁을 끝내고 무너진 경제를 살려야 한다고 강하게 주장했어. 이는 지난 6월 미국과의 종전 양해각서 체결이 무산된 이후 주도권을 잡은 내부 강경파들을 직접적으로 겨냥한 발언이야. 하지만 강경파는 외세의 압박에 굴복할 수 없다며 오히려 10월 미국 중간선거 직전에 전격적인 군사 행동을 감행해야 한다고 맞서고 있어. 이란 수뇌부의 분열이 깊어지면서 중동 지역의 안보 지형이 극도로 불안정해지는 국면을 맞이했어. 옥토버 서프라이즈로 불리는 기습적인 군사 행동이 실제로 벌어질 경우 국제 유가 폭등은 물론 글로벌 경제 전체에 치명적인 타격을 입힐 전망이야.`,
  keyTerms:[{term:`옥토버 서프라이즈`,explanation:`미국 등에서 선거 직전인 10월에 유권자들의 표심을 흔들기 위해 발생하는 충격적이고 돌발적인 사건이나 군사적 도발을 뜻해.`}],
  history:`오랜 경제 제재와 계속되는 군사적 긴장으로 이란 국민들의 경제적 고통은 한계에 달해 있어. 이로 인해 서방과의 관계 개선을 주장하는 세력과 이념을 중시하는 보수 강경 세력 간의 대립이 끊이지 않았어.`,
  players:`대통령을 필두로 한 이란의 실용주의 온건 정파와 군부를 장악하고 있는 보수 강경 세력이 대립의 축이야. 이들의 힘겨루기를 지켜보는 미국과 이스라엘 등 서방 국가들도 주요 관찰자야.`,
  current:`온건파의 종전 호소에도 불구하고 무장 세력에 대한 강경파의 장악력이 워낙 탄탄해 정책 전환이 쉽지 않은 상황이야. 내부 갈등이 임계점을 향해 치닫고 있어 폭력 사태의 우려마저 나와.`,
  outlook:`미국 중간선거가 열리기 전인 9월과 10월 사이가 중동 평화의 최대 고비가 될 거야. 이란이 도발을 자제할지 아니면 전선을 확대할지에 따라 글로벌 정세가 요동칠 것으로 예측돼.`,
  sources:[{title:`이란 온건파 '전쟁 끝내야' vs 강경파 대립 - 뉴스1`,url:`https://www.news1.kr/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`청소년 AI 챗봇 과의존 심화 속 규제 사각지대 논란 확산`,
  metrics:[`이용 연령 제한 미흡`,`안전장치 전무 상태`],
  summary:`최근 국내 청소년들 사이에서 인공지능 챗봇에 대한 과의존 현상이 심화되면서 제도적 보호 장치가 전혀 없다는 규제 사각지대 논란이 확산되고 있어. 해외에서는 AI 챗봇에 지나치게 몰입한 청소년들의 극단적인 사고가 잇따라 발생하면서 연령 확인을 엄격히 하고 장시간 사용 시 강제로 휴식을 권고하는 규제를 서둘러 도입하고 있어. 반면, 국내 플랫폼들은 별도의 실명 인증 없이도 챗봇에 접근이 가능하고 중독 방지를 위한 사용 시간 제한 장치가 전무한 실정이야. 전문가들은 정서적으로 예민한 청소년 시기에 AI가 제공하는 왜곡된 정보나 감정적 유대에 깊이 빠질 경우 심각한 부작용을 초래할 수 있다고 경고해. 뒤늦게 정부가 실태 파악에 나섰지만 구체적인 가이드라인 마련은 지지부진한 상황이야. AI 기술의 급성장 이면에 숨겨진 청소년 보호 문제를 해결하기 위해 국회 차원의 조속한 입법 마련이 시급하다는 목소리가 커지고 있어.`,
  keyTerms:[{term:`규제 사각지대`,explanation:`새로운 기술이나 서비스가 빠르게 등장했지만, 아직 이를 관리하고 통제할 관련 법률이나 제도가 마련되지 않아 피해가 발생할 수 있는 영역을 의미해.`}],
  history:`과거 스마트폰과 게임 중독 문제가 불거졌을 때처럼 새로운 디지털 매체가 등장할 때마다 청소년 보호 문제는 항상 뒤늦게 논의되어 왔어. 생성형 AI 서비스가 급격히 대중화되면서 이 문제는 더욱 복잡해졌지.`,
  players:`AI 챗봇 서비스를 제공하는 빅테크 기업들과 청소년 보호를 담당하는 교육부 및 여성가족부가 주요 관계 부처야. 학부모 단체들은 강력한 제재 조치를 강하게 요구하고 있어.`,
  current:`기업들은 자율 규제에 맡겨달라는 입장인 반면 시민단체들은 강제성 있는 법적 규제가 필요하다고 맞서면서 논의가 공전하고 있어. 그 사이 아이들의 챗봇 이용 시간은 계속 늘어나는 추세야.`,
  outlook:`곧 열릴 국정감사에서 IT 기업 임원들이 대거 증인으로 출석해 이 문제에 대한 질타를 받을 가능성이 높아. 하반기 내에 아동 및 청소년 보호를 위한 AI 안전법안 발의가 잇따를 것으로 예상돼.`,
  sources:[{title:`청소년 AI 과의존 및 규제 사각지대 논란 - KBS 뉴스`,url:`https://news.kbs.co.kr/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`국가대표 AI '독파모' 벤치마킹 논란 종결... 글로벌 G3 도약`,
  metrics:[`2차 평가 통과`,`글로벌 상위권 안착`],
  summary:`정부가 주도하는 독자적 AI 파운데이션 모델 개발 프로젝트, 일명 '독파모'가 그동안 제기됐던 벤치마킹 편법 논란을 종결짓고 본격적인 글로벌 G3 도약에 나섰어. 일부 참가 기업들이 성능 평가 점수를 인위적으로 높이기 위해 훈련 데이터에 정답을 포함시켰다는 벤치마킹 의혹이 일었으나, 과학기술정보통신부의 엄격한 재조사 결과 전혀 문제가 없는 것으로 최종 결론이 났어. 이에 따라 LG AI연구원, SK텔레콤, 업스테이지 등 주요 기업들이 2차 평가를 통과하며 다음 개발 단계로 순조롭게 진출하게 되었어. 이번 평가에서 국내 AI 모델들은 글로벌 빅테크 기업들과 어깨를 나란히 할 정도로 세계 최고 수준의 성능을 입증받았어. 논란을 딛고 한국이 미국과 중국에 이은 명실상부한 AI 강국인 G3 반열에 안정적으로 올랐다는 긍정적인 평가가 이어지고 있어. 독파모 프로젝트가 본 궤도에 오르면서 향후 공공 부문은 물론 민간 산업 전반에 국산 AI의 활용도가 폭발적으로 증가할 전망이야.`,
  keyTerms:[{term:`파운데이션 모델`,explanation:`방대한 양의 데이터를 미리 학습하여 다양한 작업에 범용적으로 활용할 수 있는 거대한 인공지능의 뼈대 모델을 말해.`}],
  history:`해외 빅테크 기업들이 AI 시장을 독점하는 것에 위기감을 느낀 정부는 기술 주권을 지키기 위해 천문학적인 예산을 투입하여 국가대표 AI 모델을 개발하는 국책 사업을 시작했어.`,
  players:`사업을 총괄하는 과학기술정보통신부와 깐깐한 심사를 담당하는 전문가 집단, 그리고 평가를 통과하기 위해 치열하게 경쟁하는 국내 AI 대기업 및 스타트업들이 주인공이야.`,
  current:`편법 의혹이 말끔히 해소되면서 그동안 위축되었던 연구 개발 분위기가 다시 활기를 띠고 있어. 기업들은 최종 선정 과정에서 유리한 고지를 점하기 위해 기술 고도화에 총력을 기울이는 중이야.`,
  outlook:`내년 최종 모델 발표 시점에는 실제 행정 업무나 기업 서비스에 즉시 투입 가능한 수준의 결과물이 나올 것으로 기대돼. 글로벌 시장에 한국 AI를 수출하는 논의도 점차 가속화될 전망이야.`,
  sources:[{title:`국가대표 AI '독파모' 벤치마킹 논란 종결 - MBC 뉴스`,url:`https://imnews.imbc.com/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`구글 딥마인드, 과학 연구 전용 범용 AI 'Co-Scientist' 전격 발표`,
  metrics:[`과학 전 분야 적용`,`연구 속도 획기적 단축`],
  summary:`세계적인 인공지능 연구소 구글 딥마인드가 특정 분야에 국한되지 않고 기초 과학 연구 전반에 범용적으로 활용할 수 있는 획기적인 AI 에이전트 'Co-Scientist'를 전격 발표해 학계를 놀라게 했어. 이 AI 모델은 단순한 데이터 분석을 넘어 가설을 스스로 설정하고 실험 방식을 설계하며 결과를 논문 형태로 요약하는 등 사실상 과학자의 공동 연구자 역할을 수행하도록 개발되었어. 생물학, 화학, 물리학 등 다양한 분야에 적용되어 신약 개발이나 신소재 발굴에 걸리는 시간을 기존보다 수십 배 이상 단축시킬 것으로 기대를 모으고 있어. 인류의 과학적 난제들을 해결할 수 있는 강력한 도구가 등장했다는 찬사가 쏟아지는 한편, 일각에서는 AI가 설계한 실험의 윤리적 안전성을 누가 어떻게 검증할 것인지에 대한 고민도 깊어지고 있어. 인간과 인공지능이 본격적으로 협업하는 시대가 열리면서 기존 과학 연구의 패러다임 자체가 근본적으로 흔들리는 거대한 변화의 물결이 시작되었어. 초기 모델 테스트에 참여한 전문가들은 향후 몇 년 안에 AI 주도 연구가 보편화될 것이라고 입을 모으고 있어.`,
  keyTerms:[{term:`AI 에이전트`,explanation:`사용자가 일일이 명령하지 않아도 인공지능이 스스로 상황을 판단하고 목표를 달성하기 위해 자율적으로 행동하는 지능형 소프트웨어를 뜻해.`}],
  history:`알파고로 세상을 놀라게 했던 구글 딥마인드는 이후 단백질 구조를 예측하는 알파폴드를 내놓으며 과학계에 AI 혁명을 일으켰어. 이번 모델은 그 연장선에서 지능의 범용성을 한 단계 더 끌어올린 결과물이야.`,
  players:`막대한 자본력으로 기술을 선도하는 구글 딥마인드와 이 기술을 활용해 혁신적인 연구 성과를 내고자 하는 전 세계의 수많은 과학자 및 대학 연구진들이 밀접하게 연결되어 있어.`,
  current:`발표 직후 세계 유수의 연구 기관들이 앞다투어 시범 사용 권한을 요청하며 엄청난 관심을 보이고 있어. 학계는 환영하는 분위기 속에서도 AI의 판단 오류가 가져올 파장에 대비하는 분위기야.`,
  outlook:`가까운 미래에 이 AI를 활용해 노벨상 수준의 혁신적인 발견이 나올 수 있다는 전망이 우세해. 동시에 AI가 만들어낸 연구 성과에 대한 저작권 논쟁 등 새로운 제도적 과제들이 쏟아져 나올 거야.`,
  sources:[{title:`구글 딥마인드, 과학 연구용 AI 'Co-Scientist' 발표 - SBS 뉴스`,url:`https://news.sbs.co.kr/`}]
}]

  headline:`삼성전자, AI 반도체 호황 등에 업고 90조원대 역대 최대 규모 주주환원 발표`,
  metrics:[`총 90조~110조 원`,`3분기 30조 원 배당`],
  summary:`삼성전자가 올해 총 90조 원에서 110조 원 규모에 달하는 역대 최대 수준의 주주환원 정책을 발표했습니다. 이는 최근 AI 반도체 수요 급증으로 인한 초호황이 실적에 강하게 반영된 결과입니다. 당장 올해 3분기에만 정규 배당을 포함해 약 30조 원 규모의 현금배당을 실시할 계획입니다. 이번 결정은 글로벌 투자자들의 신뢰를 높이고 주가 부양을 위한 강력한 의지로 풀이됩니다. 시장에서는 삼성전자의 주주환원이 향후 반도체 업계 전반의 배당 정책에도 긍정적 영향을 미칠 것으로 보고 있습니다. 주주가치 제고를 위한 이 같은 행보가 장기적인 투자 매력도를 크게 끌어올릴 전망입니다.`,
  keyTerms:[{term:`주주환원`,explanation:`기업이 번 이익을 배당이나 자사주 매입 등을 통해 주주들에게 돌려주는 활동을 말합니다.`}],
  history:`삼성전자는 과거에도 잉여현금흐름의 일정 비율을 환원하는 정책을 써왔으나 최근 반도체 사이클이 침체되며 배당 규모가 정체되었습니다.`,
  players:`삼성전자 경영진, 국내외 주요 기관 및 개인 투자자들이 핵심 주체입니다.`,
  current:`AI 칩 수요 폭발로 실적이 수직 상승하면서 잉여현금이 대규모로 확보된 상황입니다.`,
  outlook:`3분기 대규모 배당 이후 추가적인 자사주 매입 소각 등 2차 주주환원 방안이 나올지 주목됩니다.`,
  sources:[{title:`삼성전자, 역대 최대 규모 주주환원 발표 - 매일경제`,url:`https://mk.co.kr/news/business/1`},{title:`삼성, 3분기 30조 현금배당 실시 - 한국경제`,url:`https://hankyung.com/economy/1`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 장기 국채 금리 다시 반등하며 글로벌 금융시장 변동성 확대`,
  metrics:[`10년물 금리 4.70%`,`원·달러 환율 1,380원대`],
  summary:`미국의 장기 국채 금리가 다시 반등세를 보이며 10년물 기준 4.70%에 육박했습니다. 이로 인해 위험자산 선호 심리가 위축되면서 글로벌 금융시장의 변동성이 크게 확대되고 있습니다. 국내 증시인 코스피와 코스닥 역시 하락세를 피하지 못했으며, 외국인 자금 이탈 우려가 커졌습니다. 안전자산 선호 현상으로 원·달러 환율은 1,380원대 후반까지 치솟으며 원화 약세를 나타내고 있습니다. 미국의 끈적한 인플레이션과 연방준비제도의 통화정책 불확실성이 국채 금리를 다시 밀어 올리고 있다는 분석입니다. 향후 연준의 기준금리 인하 시점이 지연될 수 있다는 관측이 시장을 짓누르고 있습니다.`,
  keyTerms:[{term:`국채 금리`,explanation:`국가가 돈을 빌리기 위해 발행하는 채권의 이자율로, 시중 금리의 기준이 됩니다.`}],
  history:`미국은 팬데믹 이후 물가 상승을 잡기 위해 공격적인 기준금리 인상을 단행해 왔습니다.`,
  players:`미국 연방준비제도(Fed)와 글로벌 국채 시장 투자자들이 주요 움직임을 주도합니다.`,
  current:`물가 지표가 예상보다 더디게 하락하면서 고금리 장기화에 대한 시장의 경계감이 극도로 높아진 상태입니다.`,
  outlook:`다가오는 연준의 연방공개시장위원회(FOMC) 회의와 제롬 파월 의장의 발언에 따라 금리 방향성이 결정될 전망입니다.`,
  sources:[{title:`미국 국채 금리 재상승 및 증시 변동성 확대 - 연합뉴스`,url:`https://yna.co.kr/news/economy/1`},{title:`흔들리는 글로벌 투심, 미 10년물 4.7% 육박 - 머니투데이`,url:`https://mt.co.kr/news/1`}]

  headline:`극심한 가뭄으로 파나마 운하 통항 차질 빚어지며 글로벌 물류비 급등`,
  metrics:[`가스선 절반 우회`,`운송비 30% 증가`],
  summary:`엘니뇨에 따른 극심한 가뭄으로 인해 세계 주요 물류 동맥인 파나마 운하의 운영에 심각한 차질이 발생했습니다. 수위가 낮아지면서 대형 선박의 통행이 제한되자, 아시아로 향하는 가스선의 절반 이상이 다른 우회로를 택하고 있습니다. 이로 인해 운항 기간이 길어지면서 글로벌 물류비가 단기적으로 급등하는 현상이 나타났습니다. 특히 미국 내 육상 운송비 부담마저 커지며 소비재 가격의 연쇄적인 인상 압박으로 이어지고 있습니다. 공급망 병목 현상이 다시 불거지면서 인플레이션을 자극할 수 있다는 우려도 제기됩니다. 전문가들은 기후 변화로 인한 이러한 물류 리스크가 앞으로 더욱 빈번해질 수 있다고 경고하고 있습니다.`,
  keyTerms:[{term:`공급망 병목 현상`,explanation:`물류나 부품 공급이 원활하지 않아 전체 생산이나 유통 과정이 정체되는 상황을 뜻합니다.`}],
  history:`파나마 운하는 대서양과 태평양을 잇는 핵심 통로로, 수위 유지를 위해 많은 양의 담수가 필요합니다.`,
  players:`파나마 운하청과 글로벌 해운사, 그리고 물류비에 민감한 수출입 기업들이 엮여 있습니다.`,
  current:`기록적인 엘니뇨 현상으로 운하 주변의 호수 수위가 급감하여 평시 수준의 선박 통행을 감당하지 못하고 있습니다.`,
  outlook:`우기가 시작되어 충분한 비가 내릴 때까지 당분간 물류 적체 현상과 운임 고공행진이 불가피할 것으로 보입니다.`,
  sources:[{title:`파나마 운하 가뭄으로 글로벌 물류 직격탄 - 한국경제`,url:`https://hankyung.com/international/1`},{title:`해상 물류 비상, 가스선들 아프리카 우회 - 조선비즈`,url:`https://biz.chosun.com/international/1`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`노웅래 전 의원 2심 무죄 선고에 이재명 대통령 과거 공천 배제 사과`,
  metrics:[`2심 무죄`,`2024년 총선 컷오프`],
  summary:`뇌물 및 불법 정치자금 수수 혐의로 재판에 넘겨진 노웅래 전 의원이 항소심에서도 무죄를 선고받았습니다. 판결 직후 이재명 대통령은 자신의 SNS를 통해 과거의 결정을 반성하는 메시지를 냈습니다. 이 대통령은 지난 2024년 총선 당시 당 대표로서 노 전 의원을 공천 배제했던 것에 대해 뒤늦게 뼈저린 사죄의 뜻을 표명했습니다. 그는 정치검찰의 무리한 수사에 편승해 부당한 희생을 강요할 수밖에 없었다고 토로했습니다. 이번 무죄 판결과 대통령의 사과는 향후 검찰 수사 관행과 여권 내부의 정치적 역학 관계에 적지 않은 파장을 일으킬 것으로 예상됩니다. 일각에서는 억울하게 희생된 정치인들에 대한 명예 회복 논의가 본격화될 것이라는 관측도 나옵니다.`,
  keyTerms:[{term:`공천 배제`,explanation:`정당이 선거에 나설 후보자를 추천할 때 특정 인물을 후보 명단에서 아예 제외하는 것을 의미합니다.`}],
  history:`노웅래 전 의원은 과거 사업가로부터 뒷돈을 받았다는 혐의로 검찰 수사를 받았고, 이로 인해 총선 출마가 가로막혔습니다.`,
  players:`노웅래 전 의원, 이재명 대통령, 그리고 기소를 담당한 검찰이 핵심 관계자들입니다.`,
  current:`법원이 1심에 이어 2심에서도 증거 부족 등을 이유로 무죄를 선고하면서 검찰 수사의 정당성이 크게 타격을 입었습니다.`,
  outlook:`검찰의 무리한 기소에 대한 책임론이 불거질 수 있으며, 대법원 최종심 판결까지 팽팽한 신경전이 이어질 전망입니다.`,
  sources:[{title:`이재명 대통령, 노웅래 무죄 선고에 사죄 - 한겨레`,url:`https://hani.co.kr/politics/1`},{title:`노웅래 항소심도 무죄...여권 명예회복 착수 - 동아일보`,url:`https://donga.com/news/politics/1`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`청와대, 대법원장의 대법관 서면 제청에 일방적 통보라며 정면 충돌`,
  metrics:[`청렴도 31위`,`재제청 요구 검토`],
  summary:`신임 대법관 임명을 둘러싸고 청와대와 대법원 간의 정면 충돌 양상이 벌어지고 있습니다. 조희대 대법원장이 차기 대법관 후보를 서면으로 제청하자, 청와대는 이를 두고 대통령의 임명권을 무시한 일방적인 통보라며 강하게 반발했습니다. 청와대 핵심 관계자는 관례적인 사전 조율 없이 서면 제청만 진행된 것에 유감을 표하며 헌법상 권한 침해 소지를 조목조목 짚었습니다. 현재 청와대 내부에서는 대법원 측에 재제청을 공식 요구하는 방안까지 신중하게 검토하고 있는 것으로 알려졌습니다. 사법부 최고위 인사를 둘러싼 권력 기관 간의 힘겨루기가 수면 위로 드러나면서 정국에 긴장감이 고조되고 있습니다. 이번 갈등이 원만히 해결되지 않을 경우 장기적인 사법부 공백 사태로 이어질 수 있다는 우려도 나옵니다.`,
  keyTerms:[{term:`제청`,explanation:`어떤 직위에 임명해 줄 것을 권한을 가진 사람에게 공식적으로 요구하거나 추천하는 행위입니다.`}],
  history:`대법관은 대법원장이 후보를 제청하면 국회의 청문회와 동의를 거쳐 대통령이 최종 임명하는 구조로 되어 있습니다.`,
  players:`조희대 대법원장과 청와대 민정수석실 및 대통령이 이번 인사 갈등의 양측 당사자입니다.`,
  current:`통상적으로 이뤄지던 물밑 조율 과정이 완전히 생략된 채 서면으로 후보가 추천되면서 극심한 절차적 마찰이 빚어졌습니다.`,
  outlook:`대통령이 최종적으로 제청을 거부하고 재제청을 공식 요구할 경우 사법부 독립성 논란과 함께 전면전으로 번질 가능성이 큽니다.`,
  sources:[{title:`청와대 vs 대법원, 대법관 제청 두고 정면충돌 - 중앙일보`,url:`https://joongang.co.kr/politics/1`},{title:`대법관 임명 파행 위기...청와대 재제청 검토 - KBS`,url:`https://news.kbs.co.kr/news/1`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`트럼프 지시로 축소된 한미 연합훈련 '을지 자유의 방패', 닷새 만에 조기 종료`,
  metrics:[`훈련 5일 만에 종료`,`야외 기동훈련 50% 축소`],
  summary:`한미 연합 군사훈련인 '을지 자유의 방패'가 시작된 지 불과 닷새 만에 조기 종료되는 이례적인 사태가 발생했습니다. 이는 도널드 트럼프 미국 대통령이 국방부에 훈련 예산과 규모를 축소하라는 전격적인 지시를 내린 데 따른 여파입니다. 이에 따라 당초 계획됐던 핵심 야외 실기동훈련도 절반 수준으로 대폭 축소되어 부실하게 진행되었습니다. 북한과의 외교적 접촉을 재개하려는 미국 행정부의 전략적 판단이 이번 결정에 깊숙이 작용했다는 분석이 지배적입니다. 우리 군 당국은 당혹감 속에서도 자체 단독 훈련으로 서둘러 전환해 대비 태세를 유지하려 안간힘을 쓰고 있습니다. 그러나 굳건했던 한미 연합 방위 태세에 심각한 균열이 생기는 것 아니냐는 안보 불안감이 국내외에서 빠르게 확산되고 있습니다.`,
  keyTerms:[{term:`한미 연합 방위 태세`,explanation:`한국과 미국이 한반도의 안보를 지키고 외부 위협에 공동으로 대응하기 위해 갖추고 있는 굳건한 군사적 협력 체제를 말합니다.`}],
  history:`한미 양국은 북한의 군사적 도발에 대비해 매년 여름 대규모 지휘소 연습 및 야외 기동훈련을 정례적으로 실시해 왔습니다.`,
  players:`한국 국방부, 미 주한미군, 트럼프 행정부, 그리고 이에 촉각을 곤두세우는 북한 수뇌부가 핵심 행위자들입니다.`,
  current:`미국 대통령이 동맹국의 방위비 분담금을 문제 삼고 대북 유화 제스처를 보내면서 정상적인 연합훈련에 급제동이 걸렸습니다.`,
  outlook:`향후 주한미군 감축 논의가 본격화되거나 북미 간 깜짝 정상회담이 추진될 가능성이 제기되며 안보 지형이 요동치고 있습니다.`,
  sources:[{title:`한미 연합훈련 조기 종료...안보 우려 확산 - SBS`,url:`https://news.sbs.co.kr/politics/1`},{title:`트럼프 훈련 축소 지시, 닷새 만에 막내린 UFS - YTN`,url:`https://ytn.co.kr/politics/1`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`카카오, 인공지능 시대 맞이해 '카카오AI'와 '카카오X'로 기업 구조 전면 개편`,
  metrics:[`2개 신설법인`,`인력 30% 재배치`],
  summary:`카카오가 다가오는 초거대 인공지능 중심 시대에 신속하게 대응하기 위해 파격적인 기업 지배구조 개편을 단행했습니다. 기존 조직을 완전히 분할하여 카카오톡 기반의 주요 AI 플랫폼 사업을 전담하는 신설법인 카카오AI를 출범시키기로 확정했습니다. 반면, 테크핀과 웹툰 등 콘텐츠, 모빌리티 등 미래 성장 동력을 집중 육성하는 역할은 존속법인인 카카오X가 총괄하게 됩니다. 이번 개편은 덩치가 커진 조직의 의사결정 속도를 대폭 높이고 각 사업 부문의 전문성을 극대화하기 위한 초강수 승부수로 평가받습니다. 시장 일각에서는 그간 불거진 문어발식 확장 논란을 씻어내고 핵심 기술 경쟁력에 역량을 집중하려는 전략적 쇄신으로 해석하고 있습니다. 향후 두 회사가 각자의 영역에서 쟁쟁한 글로벌 빅테크 기업들과 어떻게 경쟁해 나갈지 IT 업계 전체의 이목이 집중되고 있습니다.`,
  keyTerms:[{term:`기업 지배구조 개편`,explanation:`회사의 소유 구조나 사업 부문을 나누고 합치는 등의 방식을 통해 경영 효율성을 높이려는 전반적인 조직 개편을 뜻합니다.`}],
  history:`카카오는 국민 모바일 메신저를 시작으로 금융, 콘텐츠 등 전방위로 사업을 넓혀왔으나 최근 국내외 규제 압박에 갇혀 있었습니다.`,
  players:`카카오 창업자 및 최고경영진, 주요 주주, 그리고 카카오 생태계에 의존하는 수천만 명의 사용자가 영향을 받습니다.`,
  current:`생성형 AI 기술의 패러다임 전환이 가속화되면서 이에 최적화된 유연한 조직 구조와 막대한 자본 투자가 생존의 필수 조건이 되었습니다.`,
  outlook:`구체적인 인적 또는 물적 분할 방식이 정해지는 과정에서 소액 주주들의 반발 여부와 새 법인들의 상장 일정이 주요 관전 포인트입니다.`,
  sources:[{title:`카카오, '카카오AI'와 '카카오X'로 분할 - 조선일보`,url:`https://chosun.com/economy/tech/1`},{title:`카카오 초강수 조직개편...AI 승부수 띄운다 - 전자신문`,url:`https://etnews.com/news/1`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`정부, 100조 규모 '미래대응기금' 신설 및 55년 만에 교육재정교부금 전면 개편`,
  metrics:[`미래대응기금 100조원`,`내국세 20.79% 배분 폐지`],
  summary:`정부가 반도체 등 첨단 산업의 유례없는 수출 호황으로 늘어난 세수를 바탕으로 총 100조 원 규모의 미래대응기금을 신설하기로 최종 확정했습니다. 이 기금은 청년들의 주거 안정 지원과 국가 차세대 핵심 성장 동력 발굴 사업에 전면적으로 투입될 예정입니다. 이와 동시에, 그동안 내국세의 20.79%를 전국 교육청에 기계적으로 떼어주던 지방교육재정교부금 제도를 무려 55년 만에 전면 폐지하고 실제 수요에 맞춘 예산 배분 방식으로 완전히 개편한다고 발표했습니다. 학령 인구는 절벽 수준으로 급감하는데 남는 교육 예산이 무분별하게 낭비되고 있다는 오랜 국민적 지적을 과감히 수용한 결과입니다. 하지만 전국의 시도교육감들은 열악한 지방 교육 재정마저 말라죽게 하는 처사라며 일제히 강력한 반대 성명을 내고 조직적으로 반발하고 나섰습니다. 향후 막대한 기금의 운용 주도권과 교육 예산 대규모 삭감을 둘러싸고 정치권과 교육계 간의 극심한 진통과 물리적 충돌마저 예상됩니다.`,
  keyTerms:[{term:`지방교육재정교부금`,explanation:`중앙정부가 거둬들인 내국세의 일정 비율을 지방 교육청에 의무적으로 배분하여 각 지역의 유초중고 교육을 지원하는 자금입니다.`}],
  history:`과거 폭발적으로 학생 수가 늘어나던 1970년대에 안정적인 교육 예산 확보를 목적으로 도입된 낡은 제도로 평가받아 왔습니다.`,
  players:`예산 효율화를 주장하는 기획재정부와 교육부 등 중앙 부처, 그리고 예산 사수를 외치는 전국 시도교육청 교육감들이 대립하고 있습니다.`,
  current:`사상 최저치의 저출산으로 일선 학교의 빈 교실은 늘어가지만, 세수 풍년 덕분에 교육청 금고만 비정상적으로 넘쳐나는 모순이 극에 달했습니다.`,
  outlook:`교부금 배분 비율을 고치는 것은 반드시 국회의 관련 법률 개정을 거쳐야 하므로 야당의 협조를 구하는 험난한 입법 과정이 가장 큰 고비가 될 전망입니다.`,
  sources:[{title:`100조 '미래대응기금' 신설...교육교부금은 메스 - 매일경제`,url:`https://mk.co.kr/news/economy/1`},{title:`55년 만에 교육교부금 폐지...교육계 거센 반발 - MBC`,url:`https://imnews.imbc.com/news/1`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`한반도 주변 무더위 속 18호 태풍 '사우델' 세력 키우며 이번 주말 상륙 우려`,
  metrics:[`중심기압 970hPa`,`주말 300mm 폭우 예상`],
  summary:`전국적으로 기승을 부리는 폭염특보 속에서 대기 불안정으로 인한 잦은 소나기가 이어지는 가운데, 가을장마의 방아쇠를 당길 18호 태풍 사우델이 매우 빠른 속도로 북상 중입니다. 현재 괌 남동쪽 먼바다에서 갓 발생한 이 태풍은 평년보다 이례적으로 수온이 높은 열대 해역을 통과하며 중심 기압이 크게 낮아져 매우 위력적인 세력으로 몸집을 불리고 있습니다. 기상청은 컴퓨터 시뮬레이션 기반의 이동 경로를 분석한 결과, 이 태풍이 이번 주말쯤 한반도 남부 지방이나 일본 규슈 서해안에 직접적인 타격을 줄 가능성이 매우 농후하다고 긴급 예보했습니다. 높은 해수면 온도로 인해 육지에 근접하는 시점에도 태풍이 좀처럼 세력을 잃지 않을 것으로 보여 대규모 시설물 붕괴와 침수 피해가 극도로 우려되는 비상 상황입니다. 행정안전부는 즉각 중앙재난안전대책본부를 가동하며 해안가 저지대 대피와 산사태 취약 지구 사전 통제를 각 지자체에 강력히 하달했습니다. 주말을 앞두고 막바지 농작물 수확에 나선 농가와 항만 시설물 관리자들의 철저하고 각별한 사전 대비가 절실히 요구됩니다.`,
  keyTerms:[{term:`폭염특보`,explanation:`여름철 낮 최고기온이 매우 높게 치솟아 사람들의 건강에 치명적이거나 농업에 큰 피해를 줄 것으로 예상될 때 기상청에서 발령하는 주의보나 경보입니다.`}],
  history:`지구 온난화로 바닷물이 뜨거워지면서 최근 수년간 8월 말에서 9월 초 사이 한반도를 강타하는 늦여름 태풍의 파괴력이 갈수록 강해지는 추세입니다.`,
  players:`재난 피해 예방과 인명 구조를 총괄하는 기상청, 행정안전부, 그리고 현장 최일선에서 뛰는 전국의 지자체 공무원들이 비상근무에 돌입했습니다.`,
  current:`유례없는 늦여름 찜통더위가 장기화되면서 근해의 해수면 온도가 평년보다 2~3도나 펄펄 끓고 있어 태풍이 막대한 에너지를 흡수하기 매우 좋은 가혹한 환경입니다.`,
  outlook:`태풍의 최종 이동 속도와 주변 북태평양 고기압의 확장 수축 여부에 따라 정확한 상륙 지점이 시시각각 변동될 수 있으므로 실시간 기상 특보 확인이 필수적입니다.`,
  sources:[{title:`무더위 속 18호 태풍 '사우델' 북상 - 연합뉴스TV`,url:`https://yonhapnewstv.co.kr/news/1`},{title:`주말 한반도 태풍 비상...초강력 세력 발달 - YTN`,url:`https://ytn.co.kr/news/1`}]
}]

  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국, 대이란 최고 수위 경제 제재 선언에 국제 유가 급등`,
  metrics:[`브렌트유 93.78달러`,`국제 유가 2%대 상승`],
  summary:`미국 도널드 트럼프 대통령과 스콧 베선트 미 재무장관이 이란을 겨냥한 최고 수위의 경제 제재를 선언했습니다. 이번 조치는 이란 정권의 붕괴를 목표로 금융 및 수송 분야를 전면 차단하는 이른바 '경제적 D-Day'로 불리고 있습니다. 미국은 동맹국들에게도 이번 제재에 동참할 것을 강하게 압박하고 나섰습니다. 이 같은 소식이 전해지자 중동 지역의 지정학적 긴장이 최고조에 달하며 국제 원유 시장이 크게 출렁였습니다. 브렌트유 가격은 단숨에 배럴당 93.78달러를 돌파하며 2%대 급등세를 보였습니다. 향후 이란의 반발과 호르무즈 해협 봉쇄 가능성 등으로 인해 글로벌 에너지 시장의 불안정성은 당분간 지속될 전망입니다.`,
  keyTerms:[{term:`경제적 D-Day`,explanation:`특정 국가의 경제를 마비시키기 위해 금융, 무역 등 모든 수단을 동원하여 일시에 가하는 전면적인 최고 수위의 경제 제재 조치를 의미합니다.`}],
  history:`미국과 이란은 핵 합의 파기 이후 오랜 기간 경제 제재와 무력 충돌 위기를 겪어왔습니다. 최근 이란의 우라늄 농축 고도화와 역내 무장 단체 지원이 미국의 강경 대응을 불렀습니다.`,
  players:`강경한 대이란 압박을 주도하는 미국 행정부 및 재무부, 그리고 체제 생존을 위해 버티고 있는 이란 지도부가 핵심 당사자입니다.`,
  current:`미국이 극단적 용어를 사용하며 제재를 선언함에 따라, 이란은 자금줄이 완전히 막힐 위기에 처했으며 이는 곧바로 국제 유가 급등으로 이어지고 있습니다.`,
  outlook:`이란이 원유 수송로인 호르무즈 해협을 봉쇄하는 등 물리적 도발로 맞대응할 경우, 글로벌 경제에 큰 타격이 예상됩니다.`,
  sources:[{title:`미국, 대이란 최고 수위 경제 제재 - 연합뉴스`,url:`https://www.yna.co.kr/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`월마트 실적 둔화 충격과 국채 금리 상승에 뉴욕증시 일제히 하락`,
  metrics:[`다우지수 1.32% 하락`,`월마트 주가 9.15% 급락`],
  summary:`미국 뉴욕증시의 3대 주요 지수가 일제히 하락장으로 마감했습니다. 미국의 유통 공룡인 월마트가 2분기 실적을 발표한 가운데, 기존 점포 매출이 6년 만에 최저 성장률을 기록하며 시장에 큰 충격을 주었습니다. 이로 인해 소비 침체에 대한 우려가 커지면서 월마트의 주가는 하루 만에 9.15% 폭락했습니다. 여기에 미 국채 금리까지 다시 상승세를 보이면서 기술주와 대형주 전반에 투자 심리가 얼어붙었습니다. 결과적으로 다우지수는 1.32%, S&P500은 0.87%, 나스닥 지수는 1.00% 떨어지며 거래를 마쳤습니다. 인플레이션 장기화로 인한 미국 소비자들의 구매력 저하가 실제 기업 실적 타격으로 가시화되고 있다는 분석이 지배적입니다.`,
  keyTerms:[{term:`기존 점포 매출`,explanation:`새로 개장한 점포를 제외하고 1년 이상 정상 영업 중인 점포들의 매출만을 비교한 수치로, 소비 심리를 파악하는 핵심 지표입니다.`}],
  history:`미국은 인플레이션을 잡기 위해 고금리 정책을 유지해왔으며, 이로 인해 가계의 초과 저축이 고갈되고 실질 구매력이 지속적으로 감소해왔습니다.`,
  players:`미국 경제의 큰 축을 차지하는 소비자와 월마트 등 소매 기업들, 통화 정책을 관장하는 연방준비제도(Fed)가 주요 주체입니다.`,
  current:`필수 소비재를 다루는 월마트의 실적 부진은 미국 경제를 지탱하던 '강한 소비'가 한계에 다달았음을 명확히 보여주는 신호로 해석됩니다.`,
  outlook:`다른 소매업체들의 실적에서도 유사한 둔화세가 확인될 경우, 미국 경제의 침체 우려가 증시를 더욱 짓누를 것으로 보입니다.`,
  sources:[{title:`뉴욕증시 일제히 하락 - 연합뉴스`,url:`https://www.yna.co.kr/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`서울 아파트값 5년 만에 최대폭 상승, 대출 규제 속 15억 이하 쏠림 심화`,
  metrics:[`6월 한 달간 2.5% 급등`,`15억 이하 거래 비중 80% 초과`],
  summary:`서울 아파트값이 지난 6월 한 달 동안 2.5% 급등하며 5년 만에 가장 큰 폭의 상승세를 기록했습니다. 정부의 지속적인 부동산 시장 안정화 노력에도 불구하고, 도심 내 공급 부족 우려와 금리 인하 기대감이 맞물리며 매수 심리가 다시 불붙은 결과입니다. 특히 주목할 점은 치솟는 가격 속에서 대출 규제의 영향을 강하게 받고 있다는 것입니다. 시중은행의 대출 한도 축소와 높은 금리 부담으로 인해, 실수요자들은 상대적으로 대출 접근성이 나은 15억 원 이하 아파트로 몰려들고 있습니다. 실제 전체 거래의 80% 이상이 중저가 단지에 집중된 것으로 나타났습니다. 전문가들은 시장의 양극화가 심화되는 가운데 갭투자 수요까지 겹쳐 당분간 불안정한 장세가 이어질 것으로 진단했습니다.`,
  keyTerms:[{term:`매수 심리`,explanation:`주택이나 주식 등의 자산을 앞으로 가격이 더 오를 것으로 예상하여 지금 당장 사려는 사람들의 마음이나 의지를 수치화한 개념입니다.`}],
  history:`서울 부동산 시장은 고금리와 대출 규제로 인해 극심한 거래 절벽을 겪었으나, 최근 금리 인하 기대가 커지며 바닥을 쳤다는 인식이 확산되었습니다.`,
  players:`내 집 마련을 서두르는 실수요자 및 투자자들과, 주택 가격 급등을 막기 위해 규제와 공급 대책을 고민하는 국토교통부입니다.`,
  current:`대출 한도 규제가 촘촘히 적용되면서 15억 원 이하 아파트로 매수세가 쏠려 국지적인 가격 급등을 이끌고 있습니다.`,
  outlook:`전세가 상승이 매매가를 밀어 올리는 현상이 겹칠 경우, 정부가 추가적인 대출 규제나 강력한 공급 대책을 꺼낼 가능성이 높습니다.`,
  sources:[{title:`서울 아파트값 5년 만에 최대폭 상승 - 연합뉴스`,url:`https://www.yna.co.kr/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`북한, 단거리 탄도미사일 무더기 발사하며 한미 연합훈련 조기 종료 맹비난`,
  metrics:[`단거리 탄도미사일 10여 발`,`UFS 훈련 기간 5일로 단축`],
  summary:`북한이 평양 일대에서 동해상으로 초대형 방사포로 추정되는 단거리 탄도미사일 10여 발을 무더기로 발사하는 도발을 감행했습니다. 이는 당일 조기 종료된 한미연합훈련(UFS)과 한국의 정치 상황을 겨냥한 것으로 보입니다. 도발 직후 김여정 노동당 부부장은 강도 높은 비난 담화를 발표했습니다. 김 부부장은 미국 대통령의 한미훈련 축소 지시를 노골적으로 언급하며, 한국 정부가 '전쟁놀이 판을 못하게 된 가긍한 처지'라고 조롱했습니다. 또한 한국 정치권을 향해 이중적 언행을 하고 있다며 원색적으로 비꼬았습니다. 이번 무더기 발사와 조롱 섞인 담화는 한미 동맹의 틈새를 벌리고 남남갈등을 유발하려는 북한의 전형적인 심리전 전술로 분석됩니다.`,
  keyTerms:[{term:`단거리 탄도미사일`,explanation:`비행 거리가 대략 1,000km 이하인 미사일로, 북한이 한국 전역의 주요 군사기지를 타격하기 위해 운용하는 핵심 전력입니다.`}],
  history:`북한은 매년 8월 실시되는 한미연합 군사연습을 북침 전쟁 연습이라 규정하고, 이에 반발해 지속적으로 미사일 발사와 위협 담화를 반복해왔습니다.`,
  players:`도발을 주도하는 북한 지도부와 이에 대응하여 연합 방위태세를 유지하는 한미 양국 군 당국이 주요 당사자입니다.`,
  current:`미국 행정부의 훈련 축소 결정이라는 변수를 틈타, 북한은 이를 미국이 한국을 외면한 성과로 포장하며 대남 압박 수위를 최고조로 끌어올리고 있습니다.`,
  outlook:`북한은 미국의 태도 변화를 지켜보며 무력 시위와 대남 심리전을 병행할 것으로 보이며, 향후 주요 기념일을 전후로 추가 도발 가능성이 제기됩니다.`,
  sources:[{title:`북한 미사일 도발 및 담화 - 연합뉴스TV`,url:`https://www.yonhapnewstv.co.kr/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`트럼프 미국 대통령 '북핵 57개' 구체적 언급, 비핵화 원칙 포기 논란 확산`,
  metrics:[`북핵 보유량 57개 언급`,`비핵화 원칙 훼손 우려 증폭`],
  summary:`도널드 트럼프 미국 대통령이 북한의 핵무기 보유량을 '57개'라고 구체적인 숫자로 언급하면서 국제 외교가에 큰 파장이 일고 있습니다. 미국 대통령이 북한의 핵무기 개수를 공개적으로 특정한 것은 매우 이례적인 일로, 사실상 북한을 핵보유국으로 인정하는 것 아니냐는 해석을 낳고 있습니다. 워싱턴 조야에서는 미국 행정부가 기존의 '완전한 비핵화' 원칙을 슬그머니 폐기하고 북핵을 현 수준에서 용인하려 한다는 우려가 확산되고 있습니다. 당장 동맹국인 한국과 일본 내에서는 미국의 확장억제 약속에 대한 근본적인 의구심이 제기되고 있습니다. 전문가들은 이번 발언이 향후 북미 정상회담을 염두에 둔 사전 포석일 가능성에 무게를 두고 있습니다.`,
  keyTerms:[{term:`완전한 비핵화`,explanation:`북한이 보유한 모든 핵무기와 핵시설을 돌이킬 수 없는 방식으로 완전히 폐기하여 핵 위협을 근본적으로 제거하는 국제사회의 핵심 목표입니다.`}],
  history:`과거 북미 간 정상회담이 여러 차례 열렸으나, 비핵화의 개념과 대북 제재 해제 범위를 둘러싼 이견으로 최종적이고 항구적인 합의에는 도달하지 못했습니다.`,
  players:`협상의 판을 흔드는 트럼프 미국 대통령과 핵 무력을 유지하려는 북한 지도부, 그리고 안보 불안에 대응해야 하는 한국 정부입니다.`,
  current:`미국이 비핵화 대신 핵 동결이나 군비 통제로 협상 문턱을 낮출 수 있다는 신호가 감지되며, 동북아시아의 안보 질서가 흔들릴 위기에 처했습니다.`,
  outlook:`트럼프 대통령이 조만간 북한에 친서를 보내거나 공식 대화를 제안할 가능성이 점쳐지며, 한국의 외교적 셈법이 한층 복잡해질 전망입니다.`,
  sources:[{title:`미국 대통령 북핵 발언 파장 - 연합뉴스`,url:`https://www.yna.co.kr/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`대법원장 서면 임명제청 강행에 정치권 충돌, 헌정 사상 초유의 갈등 격화`,
  metrics:[`대면 보고 없이 서면 제청 1건`,`여야 찬반 성명 연일 쏟아져`],
  summary:`조희대 대법원장이 새 대법관 후보를 대통령과의 대면 보고 없이 서면으로 임명 제청하면서 극심한 정치권 갈등이 폭발했습니다. 통상 대법원장이 대통령을 직접 만나 제청하는 관례를 깨고 서면으로 강행한 것을 두고, 행정부와 여당은 이를 '헌정사 초유의 법치 파괴 행위'라 규정하며 대법원장의 사퇴를 요구했습니다. 여권은 사법부가 행정부를 의도적으로 무시하고 정치적 중립성을 훼손했다고 맹비난했습니다. 반면 야당은 정부의 반발을 '대통령 재판에서 유리한 결과를 얻어내기 위해 사법부를 협박하는 것'이라며 맞서고 있습니다. 최고 사법기관의 인사를 둘러싼 이번 충돌로 인해 국가 권력기관 간의 긴장이 위험 수위를 넘고 있습니다.`,
  keyTerms:[{term:`임명 제청`,explanation:`대법원장이 대법관 후보자를 선정한 뒤 헌법상 권한을 가진 대통령에게 정식으로 임명해 달라고 공식 요청하는 절차입니다.`}],
  history:`대법관 인선을 두고 과거에도 청와대와 대법원 간의 의견 조율과 기싸움은 존재했으나, 대면 절차 자체를 생략하고 서면으로 제청을 강행한 것은 극히 이례적입니다.`,
  players:`절차를 강행한 대법원장과 이에 강력히 반발하는 대통령실 및 여당, 그리고 대법원장을 엄호하며 정권의 사법 장악 시도를 비판하는 야당입니다.`,
  current:`유력 정치인들의 주요 재판이 대법원 판결을 앞둔 예민한 시점에 발생한 갈등이라, 양측 모두 한 치의 양보 없는 치열한 정쟁을 벌이고 있습니다.`,
  outlook:`대통령이 서면 제청된 후보의 임명을 거부하거나 국회의 인준 표결이 파행을 겪을 경우, 대법관 공백 사태가 장기화되어 사법 마비가 우려됩니다.`,
  sources:[{title:`대법관 임명제청 갈등 - 청주일보`,url:`https://www.cj-ilbo.com/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`단 1개월 일하고 평생 연금 수급? 외국인 '국민연금 추후납부' 편법 악용 논란`,
  metrics:[`최소 가입 기간 1개월`,`외국인 추납 신청 건수 폭증`],
  summary:`국내 체류 외국인들이 국민연금의 '추후납부' 제도를 악용해 손쉽게 평생 연금을 수급하는 사례가 드러나며 거센 논란이 일고 있습니다. 현행 제도상 외국인이 국내에서 단 1개월만 일하며 국민연금에 가입한 이력이 있으면, 과거 공백 기간의 보험료를 한꺼번에 몰아서 낼 수 있습니다. 이를 통해 최소 수급 요건인 10년을 손쉽게 채운 뒤 평생 노령연금을 수령하는 이른바 '체리피킹'이 성행하고 있습니다. 연금 고갈 우려가 커지는 상황에서 제도의 허점을 파고든 외국인들에게 국부가 유출된다며 내국인들의 불만이 터져 나오고 있습니다. 비판 여론이 확산되자 정부와 정치권은 외국인의 추납 자격을 엄격히 제한하는 내용의 제도 개선 검토에 착수했습니다.`,
  keyTerms:[{term:`추후납부`,explanation:`과거 소득이 없어 국민연금 보험료를 내지 못했던 기간의 미납분을 나중에 경제적 여유가 생겼을 때 한꺼번에 낼 수 있게 해주는 제도입니다.`}],
  history:`추납 제도는 당초 경력 단절 여성이나 실직자 등 내국인의 노후 소득 보장을 돕기 위해 도입된 선의의 제도였으나, 외국인 가입자에 대한 별도의 제한 규정을 두지 않았습니다.`,
  players:`합법적으로 제도를 이용하는 외국인 근로자들과 역차별을 호소하는 내국인 가입자, 그리고 관련 법안을 수정해야 하는 보건복지부 및 국회입니다.`,
  current:`온라인 커뮤니티를 통해 외국인들 사이에서 연금 수급 요령이 공유되면서 단기간에 신청이 폭증하자 내국인들의 조세 저항 심리가 거세지고 있습니다.`,
  outlook:`외국인의 경우 국내 거주 기간이나 최소 근로 기간 요건을 대폭 강화하는 방향으로 국민연금법 개정안이 국회에서 신속히 처리될 것으로 예상됩니다.`,
  sources:[{title:`외국인 연금 추후납부 편법 논란 - 연합뉴스`,url:`https://www.yna.co.kr/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`전국을 휩쓰는 AI 데이터센터 붐, 대형 원전 19기 맞먹는 전력 및 수자원 부족 비상`,
  metrics:[`대형원전 19기 분량 전력 필요`,`데이터센터 1곳 하루 수만 톤 물 소모`],
  summary:`인공지능(AI) 산업 급성장으로 전국 곳곳에 AI 데이터센터 건설 붐이 일면서, 막대한 전력 소모와 수자원 고갈 문제가 국가적 과제로 떠올랐습니다. 전문가들에 따르면 현재 계획된 데이터센터들이 모두 가동될 경우, 대형 원자력 발전소 19기가 생산하는 엄청난 규모의 추가 전력이 필요한 상황입니다. 또한 서버의 열을 식히는 냉각 과정에서 데이터센터 한 곳당 하루에 수만 톤의 물을 소비하기 때문에 심각한 물 부족 사태까지 예견되고 있습니다. 건립이 예정된 지역의 지자체와 시민단체들은 생존권 위협을 호소하며 건설 전면 재검토를 강력히 요구하고 나섰습니다. 첨단 산업 육성과 핵심 국가 인프라 보호 사이에서 정부의 근본적인 에너지 수급 대책 마련이 시급해졌습니다.`,
  keyTerms:[{term:`데이터센터`,explanation:`수많은 컴퓨터 서버와 네트워크 장비들을 한곳에 모아두고 방대한 양의 데이터를 저장, 처리, 유통하는 대규모 IT 핵심 인프라 시설입니다.`}],
  history:`생성형 AI 기술이 대중화되고 산업 전반으로 확산됨에 따라, 고성능 연산을 처리하기 위한 대형 인프라 수요가 최근 몇 년 새 폭발적으로 증가했습니다.`,
  players:`데이터센터 건립을 서두르는 글로벌 빅테크 기업들과 안정적인 전력망을 책임지는 전력 당국, 그리고 환경 파괴와 자원 고갈을 우려하는 지역 주민들입니다.`,
  current:`송전망 확충이 지연되는 가운데 수도권과 특정 지역에 거대 시설이 집중되면서, 여름철 블랙아웃(대정전)과 식수 부족 우려가 심화되고 있습니다.`,
  outlook:`정부는 지방으로 데이터센터를 분산시키기 위해 인센티브와 페널티 제도를 도입하고, 수랭식 대신 전력 소모가 적은 친환경 신냉각 기술 적용을 의무화할 전망입니다.`,
  sources:[{title:`AI 데이터센터 전력 물 부족 우려 - 유튜브 뉴스`,url:`https://www.youtube.com/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`지갑 얇아진 청년층의 고립, 물가 부담에 만남 피하는 '프렌드플레이션' 현상 확산`,
  metrics:[`외식비 등 여가 물가 체감도 최고`,`2030 모임 횟수 절반 감소`],
  summary:`외식비와 여가비 등 일상 물가가 가파르게 치솟으면서, 경제적 부담을 이기지 못한 청년층이 친구와의 만남을 줄이는 '프렌드플레이션' 현상이 빠르게 확산하고 있습니다. 밥 한 끼와 커피 한 잔을 마시더라도 순식간에 큰 지출이 발생하자, 2030 세대들은 아예 약속 자체를 잡지 않거나 혼자만의 시간을 보내는 쪽을 선택하고 있습니다. 소셜 미디어에서는 돈이 없어서 자발적인 아웃사이더가 되었다는 청년들의 자조 섞인 글들이 큰 공감을 얻고 있습니다. 이러한 현상은 단순한 내수 소비 위축을 넘어 청년층의 정서적 고립과 우울감을 심화시키는 사회적 문제로 번지고 있습니다. 전문가들은 고물가에 따른 경제적 압박이 청년들의 기본적인 인간관계 맺기조차 단절시키고 있다며 심각한 우려를 표했습니다.`,
  keyTerms:[{term:`프렌드플레이션`,explanation:`친구(Friend)와 물가 상승(Inflation)을 합성한 신조어로, 고물가로 인해 만남에 드는 비용이 늘어나면서 경제적 부담 탓에 인간관계를 줄이거나 피하는 현상을 뜻합니다.`}],
  history:`최근 몇 년간 누적된 인플레이션이 식자재비와 인건비 상승으로 직결되며 외식 물가가 급등했고, 주머니 사정이 여의치 않은 청년층이 가장 먼저 타격을 받았습니다.`,
  players:`치솟는 물가에 실질 소득이 감소하며 지출을 줄이는 청년 세대와, 원가 상승 압박에 시달리며 가격을 올릴 수밖에 없는 자영업자 및 외식업계입니다.`,
  current:`식사 약속조차 재정적 부담으로 다가오면서, 사회적 교류에 드는 비용을 극단적으로 통제하려는 절약 트렌드가 청년층의 일상으로 자리 잡았습니다.`,
  outlook:`내수 소비 침체가 길어질 것으로 예상됨에 따라 1인 가구를 겨냥한 초저가 가성비 상품 출시가 늘어나고, 청년층 고립을 막기 위한 사회적 논의가 활발해질 것입니다.`,
  sources:[{title:`청년층 프렌드플레이션 확산 - 유튜브 뉴스`,url:`https://www.youtube.com/`}]
}]

  tag:`2026-08-20`,

  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 30년물 국채 금리 연 5.33% 돌파하며 글로벌 국채 금리 연쇄 폭등`,
  metrics:[`미 30년물 금리 연 5.33%`,`코스피 6% 이상 폭락`],
  summary:`글로벌 채권 시장이 국채 금리 폭등이라는 거대한 충격파에 휩싸였습니다. 미국의 30년물 국채 금리가 연 5.33%까지 치솟으며 19년 만에 최고치를 기록했고, 일본과 한국의 장기 금리도 도미노처럼 급등했습니다. 이로 인해 자본시장의 변동성이 극도로 커지며 한국 증시에서는 하루 만에 코스피가 6% 이상 폭락하여 사이드카가 발동되었습니다. 특히 이번 사태는 금리가 낮은 엔화를 빌려 투자하던 이른바 엔 캐리 트레이드 자금의 대규모 이탈 우려를 자극하며 시장의 공포를 키웠습니다. 안전 자산으로 여겨지던 국채 금리의 발작적 상승이 AI와 반도체 주식 중심의 랠리에 찬물을 끼얹은 상황입니다.`,
  keyTerms:[{term:`엔 캐리 트레이드`,explanation:`금리가 싼 일본의 엔화를 빌려 금리가 높은 다른 나라의 주식이나 채권에 투자하는 금융 기법입니다.`}],
  history:`팬데믹 이후 각국 중앙은행이 쏟아낸 막대한 유동성을 거둬들이는 과정에서 금리 인상 기조가 장기화되었습니다.`,
  players:`채권 금리에 민감한 글로벌 기관 투자자들과 금리 정책의 키를 쥔 미국 연방준비제도(Fed), 일본은행(BOJ)이 핵심 주체입니다.`,
  current:`일본은행의 금리 인상 가능성과 미국의 견조한 경제 지표가 맞물리며 장기 금리가 임계점을 돌파했습니다.`,
  outlook:`글로벌 채권 시장의 안정이 확인될 때까지 기술주와 신흥국 증시의 심한 변동성이 당분간 지속될 전망입니다.`,
  sources:[{title:`글로벌 국채 금리 폭등 쇼크 - 매일경제`,url:`https://www.mk.co.kr/`},{title:`증시 패닉, 코스피 사이드카 발동 - 조선일보`,url:`https://www.chosun.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`KDI, 반도체 호황에 한국 경제성장률 3.2%로 상향했지만 체감경기는 여전히 '냉골'`,
  metrics:[`경제성장률 전망 3.2%`,`취업자 증가 폭 11만 명으로 하향`],
  summary:`국책연구기관인 KDI가 올해 한국 경제성장률 전망치를 기존 2.5%에서 3.2%로 대폭 상향 조정했습니다. 이는 글로벌 AI 인프라 투자 확대로 인해 반도체 수출과 설비투자가 기록적인 호조를 보이고 있기 때문입니다. 그러나 이 같은 거시 지표의 화려한 성적에도 불구하고 일반 국민의 체감경기는 여전히 차갑습니다. KDI는 건설업 부진 등을 이유로 올해 취업자 수 증가 폭 전망을 기존 17만 명에서 11만 명으로 하향 조정했습니다. 즉, 반도체 산업의 성장이 내수 경제 전반으로 퍼져나가는 낙수효과 현상이 제대로 작동하지 않고 일자리 창출로 이어지지 못하고 있는 상황입니다.`,
  keyTerms:[{term:`낙수효과`,explanation:`대기업이나 고소득층의 소득이 늘어나면 그 부가 투자와 소비를 통해 저소득층과 중소기업에도 흘러들어간다는 경제 이론입니다.`}],
  history:`한국 경제는 오랫동안 수출과 대기업 중심의 성장 구조를 유지해왔으며, 산업 간 양극화 문제가 꾸준히 누적되어 왔습니다.`,
  players:`경제 정책을 총괄하는 기획재정부, 전망을 발표하는 한국개발연구원(KDI), 그리고 수출을 견인하는 반도체 대기업들이 중심입니다.`,
  current:`반도체 사이클이 초호황에 진입하며 지표는 반등했지만, 고물가와 고금리로 인해 내수 소비는 극도로 위축되어 있습니다.`,
  outlook:`정부가 하반기 내수 진작과 건설업 부양을 위한 추가적인 미시 정책을 내놓을지가 하반기 체감경기를 좌우할 것입니다.`,
  sources:[{title:`한국 경제성장률 3.2%로 상향 - 한국경제`,url:`https://www.hankyung.com/`},{title:`반도체 호황에도 얼어붙은 체감경기 - 동아일보`,url:`https://www.donga.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`엔비디아의 345조 원 규모 데이터센터 보증 협의와 SK하이닉스 54조 원 국내 팹 투자`,
  metrics:[`엔비디아 보증 협의액 2,500억 달러`,`SK하이닉스 투자액 54.3조 원`],
  summary:`글로벌 AI 주도권을 잡기 위한 거대한 인프라 머니 게임이 속도를 내고 있습니다. 엔비디아는 오픈AI가 추진하는 오하이오 데이터센터 임차를 위해 무려 2,500억 달러 규모의 금융 보증을 협의 중인 것으로 알려졌습니다. 이러한 빅테크들의 천문학적인 투자에 발맞춰 한국 반도체 기업들도 대대적인 투자로 화답하고 있습니다. SK하이닉스는 차세대 AI 메모리 수요에 대응하기 위해 국내에 54조 3천억 원 규모의 새로운 팹 건설 투자를 최종 승인했습니다. 이는 AI 반도체 시장의 압도적인 수요를 맞추기 위한 필수적인 선제 조치로 해석되며, 반도체 장비 생태계 전반에 큰 활력을 불어넣고 있습니다.`,
  keyTerms:[{term:`팹`,explanation:`반도체 칩을 생산하는 거대한 공장을 뜻하는 영어 단어(Fabrication facility)의 줄임말입니다.`}],
  history:`챗GPT 등장 이후 인공지능 모델 훈련과 추론에 필요한 고성능 연산 인프라 수요가 기하급수적으로 폭증했습니다.`,
  players:`AI 칩 시장을 독점하다시피 한 엔비디아, 최대 수요처인 오픈AI, 그리고 필수 메모리(HBM)를 공급하는 SK하이닉스가 주요 플레이어입니다.`,
  current:`빅테크 기업들이 AI 패권을 쥐기 위해 수익성 우려를 뒤로하고 선제적인 인프라 과잉 투자를 강행하고 있습니다.`,
  outlook:`막대한 자금이 투입된 데이터센터들이 2026년 하반기부터 본격 가동되며, 글로벌 AI 생태계의 판도를 가를 실질적인 수익 창출 여부가 시험대에 오를 것입니다.`,
  sources:[{title:`엔비디아 역대급 데이터센터 투자 - 매일경제`,url:`https://www.mk.co.kr/`},{title:`SK하이닉스 54.3조 팹 투자 - 조선일보`,url:`https://www.chosun.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`트럼프 대통령, 한미 연합훈련 대폭 축소 지시로 한국 정부 '패싱' 논란`,
  metrics:[`예정보다 6일 단축`,`8월 21일 조기 종료`],
  summary:`미국 도널드 트럼프 대통령이 한미 연합군사훈련인 '을지 자유의 방패' 규모를 대폭 축소하라고 국방부에 기습 지시했습니다. 이에 따라 훈련 기간이 예정보다 엿새나 단축되어 8월 21일에 조기 종료될 예정입니다. 문제는 이 중대한 안보 결정 과정에서 한국 정부가 사전에 통보받지 못한 것으로 알려지면서 심각한 패싱 논란이 일고 있다는 점입니다. 미국 정치권 내에서도 아시아 안보 공백을 우려하며 초당적인 반발 서한이 발송되는 등 파장이 커지고 있습니다. 이번 조치는 북한과의 비공개 대화를 재개하기 위한 트럼프 대통령의 독단적인 유화 제스처로 해석됩니다.`,
  keyTerms:[{term:`패싱`,explanation:`당사자를 배제하고 자기들끼리만 외교적 결정을 내리거나 주요 논의에서 완전히 소외시키는 상황을 의미합니다.`}],
  history:`한미 양국은 북한의 군사적 위협에 대비하여 매년 정례적으로 대규모 연합훈련을 실시해 동맹의 대비 태세를 유지해 왔습니다.`,
  players:`외교적 성과를 노리는 트럼프 미국 대통령, 훈련 축소에 반발하는 미 의회, 당혹감을 감추지 못하는 한국 정부가 핵심입니다.`,
  current:`11월 선거를 앞두고 트럼프 대통령이 지지율 반등을 위해 파격적인 대북 이벤트를 무리하게 추진하고 있다는 분석이 지배적입니다.`,
  outlook:`한국 정부가 미국의 일방적 결정에 어떻게 대응할지, 그리고 북한이 이에 화답해 전향적인 대화 테이블로 복귀할지 여부가 동북아 안보의 변수입니다.`,
  sources:[{title:`한미 연합훈련 축소 지시 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`동맹국 패싱 논란 확산 - 한겨레`,url:`https://www.hani.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`중국 왕이 외교부장 5년 만에 방한, 한중 관계 정상화 궤도 진입 선언`,
  metrics:[`5년 만의 방한`,`양국 외교장관 회담 3시간 진행`],
  summary:`중국의 외교 사령탑인 왕이 외교부장이 5년 만에 한국을 방문하여 양국 관계의 새로운 전기를 마련했습니다. 왕 부장은 한국 외교부 장관과의 회담에서 최근 한중 관계가 본격적인 개선 궤도에 올랐다고 긍정적으로 평가했습니다. 특히 이번 방한에서는 광복절 경축사에서 한국 정부가 제안한 한반도 종전 다자논의 참여 문제 등 굵직한 외교 현안이 심도 있게 다뤄졌습니다. 다만 북미 간의 교착 상태에 대해서는 중국이 직접적인 중재자로 나서기보다는 미국이 먼저 대북 적대 정책을 철회해야 한다는 기존의 원칙적인 입장을 고수했습니다. 경제 협력과 더불어 한반도 안보 문제에서 중국의 역할을 재확인하는 계기가 되었습니다.`,
  keyTerms:[{term:`다자논의`,explanation:`두 나라가 아닌 여러 나라가 모여서 특정한 문제나 분쟁을 함께 협의하고 해결책을 찾는 외교 방식을 말합니다.`}],
  history:`한중 관계는 과거 사드 배치 이후 오랫동안 경색되었으며, 미중 패권 경쟁 속에서 한국의 외교적 위치로 인해 마찰을 겪어왔습니다.`,
  players:`미국의 견제를 뚫으려는 중국 정부(왕이 부장)와, 경제 및 안보 안정을 위해 중국의 협력이 필요한 한국 정부입니다.`,
  current:`한국 정부의 실용주의 외교 기조와, 동아시아 영향력을 유지하려는 중국의 이해관계가 맞아떨어지며 대화가 재개되었습니다.`,
  outlook:`이번 회담을 계기로 한중 정상회담 추진 일정이 구체화될 수 있으며, 경제 분야를 중심으로 고위급 교류가 급물살을 탈 것으로 예상됩니다.`,
  sources:[{title:`왕이 중국 외교부장 방한 - 중앙일보`,url:`https://www.joongang.co.kr/`},{title:`한중 외교장관 회담 주요 논의 - KBS`,url:`https://news.kbs.co.kr/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`지정학적 긴장 속 미국 국방부, 걸프 지역 미군 기지 상당수 철수 검토`,
  metrics:[`철수 검토 대상 기지 5곳 이상`,`중동 파견 미군 30% 감축 논의`],
  summary:`중동 지역의 화약고가 다시 끓어오르는 가운데 미국 국방부가 걸프 지역에 주둔 중인 미군 기지 상당수를 철수하는 방안을 은밀히 검토 중입니다. 이란의 지원을 받는 무장 세력들의 드론 및 미사일 보복 공격이 잦아지면서 미군 병력의 인명 피해 위험이 극도로 높아졌기 때문입니다. 미국은 이란과의 호르무즈 해협 통항 협상마저 결렬되면서 중동 내 군사적 입지가 크게 좁아진 상태입니다. 전문가들은 미군의 갑작스러운 철수나 재배치가 역내 힘의 균형을 무너뜨려 지정학적 긴장 상태를 더욱 악화시킬 수 있다고 경고하고 있습니다. 이는 미국의 글로벌 군사 전략이 아시아 태평양 중심으로 이동하고 있음을 시사하는 대목이기도 합니다.`,
  keyTerms:[{term:`지정학적 긴장`,explanation:`지리적 위치와 정치, 군사적 이해관계가 복잡하게 얽혀 국가들 사이에 갈등이나 전쟁의 위협이 높아지는 상태를 뜻합니다.`}],
  history:`미국은 원유 수송로 확보와 이란 견제를 위해 오랫동안 중동 걸프 지역에 막대한 군사력을 유지하며 지역 안보를 통제해왔습니다.`,
  players:`미군 병력 보호를 고심하는 미국 행정부, 역내 주도권을 잡으려는 이란 및 친이란 무장세력들이 긴장의 중심에 있습니다.`,
  current:`최근 벌어진 역내 무력 분쟁 여파와 이란의 직간접적 공격이 맞물리며 주둔 미군의 안전이 심각하게 위협받고 있습니다.`,
  outlook:`미군 철수로 인한 공백을 메우기 위해 사우디아라비아 등 걸프 동맹국들의 자주국방 강화 움직임과 역내 치열한 군비 경쟁이 촉발될 수 있습니다.`,
  sources:[{title:`중동 미군 기지 철수 검토 - 동아일보`,url:`https://www.donga.com/`},{title:`미군 재배치와 중동 안보 불안 - 연합뉴스`,url:`https://www.yna.co.kr/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`구글·오픈AI·xAI 차세대 모델 동시 출격하며 API 가격 최대 80% 인하`,
  metrics:[`API 가격 최대 80% 인하`,`신규 모델 출시 3곳(오픈AI, 구글, xAI)`],
  summary:`글로벌 빅테크 기업들 간의 인공지능 주도권 다툼이 무자비한 가격 경쟁으로 번지고 있습니다. 구글이 초고속 경량 모델인 '제미나이 3.7 플래시'를 선보이자, 일론 머스크의 xAI가 즉각 '그록 4.6'으로 응수했습니다. 이에 질세라 챗GPT 개발사인 오픈AI는 차세대 모델 라인업을 기습 출시함과 동시에 기업들이 인공지능을 가져다 쓸 때 내는 API 사용료를 최대 80%까지 파격적으로 인하했습니다. 기술력이 점차 평준화되는 가운데 시장 점유율을 방어하고 생태계를 지배하기 위한 기업들의 벼랑 끝 치킨게임이 시작된 것입니다. 덕분에 AI 도입을 망설이던 스타트업과 일반 기업들의 서비스 진입 장벽은 크게 낮아지게 되었습니다.`,
  keyTerms:[{term:`API`,explanation:`개발자들이 다른 회사가 만든 인공지능 기능이나 소프트웨어를 자신의 서비스에 쉽게 연결해서 쓸 수 있도록 뚫어놓은 통로입니다.`}],
  history:`거대 언어 모델(LLM) 시장 초기에는 압도적인 성능이 경쟁의 핵심이었으나, 점차 후발 주자들의 기술력이 올라오며 성능 격차가 좁혀졌습니다.`,
  players:`시장 선두주자인 오픈AI, 거대한 인프라를 무기로 반격하는 구글, 풍부한 자본력을 바탕으로 도약하는 xAI가 주역입니다.`,
  current:`고성능 모델 훈련과 유지에 막대한 비용이 듦에도 불구하고, 고객을 자신들의 생태계에 묶어두기 위해 출혈 경쟁을 불사하고 있습니다.`,
  outlook:`막대한 클라우드 비용을 버티지 못하는 중소 AI 기술 기업들의 연쇄 도산이나 대형 빅테크로의 흡수 합병이 가속화될 전망입니다.`,
  sources:[{title:`오픈AI API 가격 80% 인하 파격 - 매일경제`,url:`https://www.mk.co.kr/`},{title:`글로벌 AI 모델 치킨게임 본격화 - 한국경제`,url:`https://www.hankyung.com/`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`한국 독자 기술로 개발한 준궤도 우주 로켓 '세빛', 오늘 새벽 최종 발사`,
  metrics:[`도달 고도 100km 이상 목표`,`순수 국내 기술 100%`],
  summary:`한국의 독자적인 항공우주 기술이 집약된 준궤도 로켓 '세빛'이 오늘 새벽 전남 고흥 우주발사체단지에서 우주를 향해 힘차게 솟아오를 예정입니다. 이번 발사는 인공위성을 궤도에 안착시키는 것이 아니라 우주 경계선인 고도 100km 밖 준궤도 환경에 도달한 뒤 미세중력 상태에서 다양한 과학 실험을 수행하고 귀환하는 것을 목표로 합니다. 특히 엔진부터 동체까지 100% 순수 국내 민간 기술로 제작되었다는 점에서 한국 우주 산업의 상업화 능력을 검증하는 중요한 시험대입니다. '세빛' 발사가 성공하면 향후 민간 주도의 우주 관광이나 저비용 미세중력 실험 플랫폼으로 폭넓게 활용될 수 있는 토대가 마련됩니다.`,
  keyTerms:[{term:`준궤도`,explanation:`로켓이 우주 공간(고도 100km 이상)까지 올라갔다가 지구 주위를 완전히 뱅글뱅글 돌지 않고 다시 지상으로 포물선을 그리며 떨어지는 비행을 말합니다.`}],
  history:`누리호 발사 성공 이후, 거대한 국가 주도 프로젝트에서 벗어나 빠르고 저렴하게 우주에 접근하려는 민간 우주 기업들의 도전이 이어져 왔습니다.`,
  players:`독자 기술로 로켓을 설계하고 제작한 국내 민간 우주 벤처기업들과, 발사 인프라를 돕는 한국항공우주연구원이 중심에 있습니다.`,
  current:`글로벌 우주 시장이 돈이 되는 상업화 단계로 진입함에 따라, 작고 재사용 가능한 저렴한 발사체 개발이 한국 우주 산업의 최우선 과제로 떠올랐습니다.`,
  outlook:`이번 비행 데이터를 바탕으로 개량형 상업용 로켓 개발이 본격화되며, 아시아 지역의 소형 발사체 시장에서 한국이 경쟁력을 확보할 것으로 기대됩니다.`,
  sources:[{title:`준궤도 로켓 세빛 오늘 발사 - KBS 뉴스`,url:`https://news.kbs.co.kr/`},{title:`순수 국내 민간 우주 로켓 도전 - SBS`,url:`https://news.sbs.co.kr/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`유럽연합 세계 최초 'AI 규제법' 본격 집행 시작, 위반 시 글로벌 매출 3% 과징금`,
  metrics:[`최대 과징금 글로벌 매출 3%`,`벌금액 최대 1,500만 유로`],
  summary:`세계 최초의 포괄적인 인공지능 통제 법안인 유럽연합(EU)의 '인공지능 규제법(GPAI)'이 8월 2일부터 본격적인 집행 단계에 돌입했습니다. 이 법안은 AI 시스템을 위험도에 따라 분류하고, 고위험 AI를 제공하는 기업에게 데이터 투명성과 엄격한 안전성 의무를 강제합니다. 만약 이를 위반할 경우 해당 기업은 글로벌 전체 매출의 최대 3% 또는 1,500만 유로 중 더 큰 금액을 과징금으로 물게 되는 엄청난 타격을 입게 됩니다. 실질적인 처벌 규정이 가동됨에 따라, 유럽 시장에서 사업을 영위하는 한국과 미국의 빅테크 기업들은 즉각 비상 대응팀을 꾸리고 컴플라이언스 체계 점검에 열을 올리고 있습니다. 혁신보다 안전을 택한 유럽의 행보가 글로벌 AI 표준에 어떤 영향을 미칠지 이목이 쏠립니다.`,
  keyTerms:[{term:`컴플라이언스`,explanation:`기업이 사업을 하면서 법률이나 정부의 규제, 사내 윤리 규정 등을 어기지 않고 투명하게 잘 지키도록 꼼꼼하게 관리하는 준법 경영 활동입니다.`}],
  history:`딥페이크 악용, 지적재산권 침해, 알고리즘 편향성 등 AI 기술의 부작용이 속출하자 EU는 선제적으로 시민의 권리를 보호하기 위한 강력한 입법을 추진해 왔습니다.`,
  players:`엄격한 규칙을 집행하는 유럽연합(EU) 집행위원회와, 복잡한 규제를 피하면서도 거대한 유럽 시장을 포기할 수 없는 글로벌 빅테크 기업들입니다.`,
  current:`법안이 구속력을 갖게 됨에 따라 기업들은 자사의 AI 모델 구조를 투명하게 밝히고 결과물에 대한 법적 책임을 져야 하는 실질적 위기에 놓였습니다.`,
  outlook:`미국과 중국 등 규제보다는 기술 진흥에 무게를 둔 국가들과의 정책적 마찰이 빚어질 수 있으며, 글로벌 기업들의 AI 기술 신제품 출시 속도가 유럽에서 다소 지연될 수 있습니다.`,
  sources:[{title:`EU AI법 집행 본격화 - 한국경제`,url:`https://www.hankyung.com/`},{title:`매출 3% 철퇴, 빅테크 비상 - 중앙일보`,url:`https://www.joongang.co.kr/`}]
}]

  tag:`2026-08-19`,
  label:`2026년 8월 19일 (수)`,
  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`무디스, 반도체 호황에 한국 성장률 3.5%로 대폭 상향`,
  metrics:[`성장률 전망치 2.5% → 3.5%`,`최소 2027년 중반까지 반도체 호황 예상`],
  summary:`국제신용평가사 무디스가 한국의 올해 경제성장률 전망치를 종전 2.5%에서 3.5%로 깜짝 상향 조정했습니다. 이는 글로벌 AI 열풍에 따른 반도체 수요가 폭발적으로 증가한 데 기인합니다. 삼성전자와 SK하이닉스 등 한국의 고대역폭 메모리 반도체 기업을 대체할 공급처가 사실상 없다는 점이 핵심 이유로 꼽힙니다. 무디스는 이러한 반도체 슈퍼사이클이 최소 2027년 중반까지 이어질 것으로 내다봤습니다. 이에 따라 한국 경제 전반의 수출과 투자 심리가 크게 개선될 것으로 기대됩니다. 다만 하반기 글로벌 경기 둔화 우려 등 대외 변수도 주시해야 하는 상황입니다.`,
  keyTerms:[{term:`슈퍼사이클`,explanation:`장기적인 가격 상승 추세와 호황 국면을 뜻하며, 이 기사에서는 반도체 수요 폭발로 인한 장기 호황을 의미합니다.`}],
  history:`지난 몇 년간 반도체 업계는 공급 과잉과 수요 침체로 부진을 겪었으나, 최근 생성형 AI의 등장으로 고성능 메모리 수요가 폭등했습니다.`,
  players:`삼성전자, SK하이닉스, 글로벌 주요 IT 빅테크 기업, 국제신용평가사 무디스`,
  current:`현재 반도체 수출이 급증하며 한국 경제의 핵심 견인차 역할을 하고 있으며, 전망치가 크게 상향된 결정적 시점입니다.`,
  outlook:`하반기 글로벌 금리 인하 여부와 미국 대선 등 대외 불확실성 속에서도 반도체 수출 호조가 경제 전반의 성장을 이끌지 주목됩니다.`,
  sources:[{title:`무디스, 한국 올해 성장률 3.5%로 깜짝 상향 - 연합뉴스`,url:`https://www.yna.co.kr`},{title:`반도체 훈풍에 성장률 전망 줄상향 - 한국경제`,url:`https://www.hankyung.com`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`8월 초순 수출 역대 최대 기록, 반도체 수출 155.4% 폭증`,
  metrics:[`8월 1~10일 수출액 213억 달러 (45.3% 증가)`,`반도체 수출액 100억 달러`],
  summary:`관세청에 따르면 8월 1일부터 10일까지의 수출액이 213억 달러로 전년 동기 대비 45.3% 급증하며 역대 최대를 기록했습니다. 이 같은 놀라운 성과의 배경에는 글로벌 IT 수요 회복이 자리하고 있습니다. 특히 반도체 수출이 155.4%나 폭증한 100억 달러를 달성하며 무역수지 흑자를 이끌었습니다. 전체 수출에서 반도체가 차지하는 비중이 절반에 가까운 46.8%까지 치솟은 상태입니다. 이는 한국 경제의 반도체 의존도가 심화되고 있음을 보여주기도 합니다. 향후 주요 수출국의 경기 상황에 따라 하반기 수출 흐름이 결정될 것으로 분석됩니다.`,
  keyTerms:[{term:`무역수지`,explanation:`일정 기간 동안 한 나라의 수출액과 수입액의 차이를 의미하며, 흑자면 수출이 수입보다 많음을 뜻합니다.`}],
  history:`코로나19 팬데믹 이후 글로벌 공급망 교란과 수요 부진으로 한국의 월간 수출 실적이 등락을 반복해왔습니다.`,
  players:`관세청, 국내 반도체 및 주요 수출 기업, 글로벌 수입국(미국, 중국 등)`,
  current:`반도체 등 특정 품목의 수출이 압도적으로 급증하여 전체 수출 지표를 끌어올리는 호황 국면을 맞이하고 있습니다.`,
  outlook:`하반기에도 자동차, 선박 등 타 주력 품목의 수출 호조가 더해질지, 그리고 글로벌 수요 둔화 여부가 주요 관건이 될 것입니다.`,
  sources:[{title:`8월 초순 수출 역대 최대... 반도체가 하드캐리 - 연합뉴스`,url:`https://www.yna.co.kr`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`글로벌 구리 가격 사상 최고치 근접, 인플레이션 우려 재점화`,
  metrics:[`구리 가격 사상 최고치 육박`,`미국 금리 인상 가능성 30~40% 대두`],
  summary:`글로벌 AI 데이터 센터 및 인프라 구축 수요가 급증하면서 핵심 원자재인 구리 가격이 사상 최고치에 근접하고 있습니다. 여기에 중동 정세 불안으로 국제 유가까지 오름세를 보이면서 원자재 가격 전반이 들썩이고 있습니다. 이로 인해 한동안 잠잠했던 글로벌 인플레이션 우려가 다시 수면 위로 떠올랐습니다. 시장 전문가들은 원자재 가격 급등이 실물 경제의 물가 상승 압력으로 이어질 것을 경고하고 있습니다. 결과적으로 미국의 물가 지표 완화에도 불구하고 연준의 추가 금리 인상 가능성까지 배제할 수 없는 상황이 되었습니다. 투자자들은 원자재 시장의 공급망 긴장 상태가 언제까지 지속될지 예의주시하고 있습니다.`,
  keyTerms:[{term:`인플레이션`,explanation:`물가가 지속적으로 상승하여 화폐 가치가 하락하는 경제 현상으로, 원자재 가격 상승이 주원인 중 하나입니다.`}],
  history:`팬데믹 회복기 이후 각국의 대규모 인프라 투자와 친환경 에너지 전환 정책으로 산업용 금속 수요가 꾸준히 증가해왔습니다.`,
  players:`글로벌 자원 개발 기업, AI 인프라 투자 기업, 미국 연방준비제도`,
  current:`AI 붐으로 인한 데이터 센터 전력망 확충 수요가 구리 공급 부족 우려를 가중시키며 가격 폭등을 초래하고 있습니다.`,
  outlook:`향후 연준의 통화정책 방향과 중국 등 주요 구리 소비국의 경기 부양책 강도가 원자재 가격 향방을 결정할 전망입니다.`,
  sources:[{title:`구리 가격 랠리에 인플레이션 우려 부상 - Bloomberg`,url:`https://www.bloomberg.com`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`김민석, 더불어민주당 신임 당대표 선출... 계파 갈등 봉합 과제`,
  metrics:[`최종 득표율 54.08%`,`최고위원단 구성: 친명 2명, 친청 3명`],
  summary:`더불어민주당 전당대회에서 김민석 후보가 정청래 후보를 꺾고 신임 당대표로 최종 선출되었습니다. 54.08%의 득표율을 기록한 김 대표는 선호투표제라는 치열한 경선 끝에 승리를 거머쥐었습니다. 수락 연설에서 그는 이재명 정부의 성공을 위해 당정 일치와 전면적인 협력을 다짐했습니다. 하지만 새롭게 구성된 최고위원단이 친청계 3명과 친명계 2명으로 엇갈리며 계파 간 긴장감이 엿보이고 있습니다. 당 안팎에서는 경선 과정에서 불거진 파열음을 수습하고 당내 화합을 이루는 것이 최우선 과제라고 입을 모읍니다. 다가오는 정기국회에서 신임 지도부가 어떻게 대야 투쟁과 입법 과제를 조율할지 관심이 쏠립니다.`,
  keyTerms:[{term:`당정 일치`,explanation:`집권 여당과 정부가 주요 정책 방향이나 이념적 궤를 같이하며 긴밀하게 협력하는 상태를 의미합니다.`}],
  history:`더불어민주당은 최근 선거 패배 이후 당 쇄신과 차기 정권 재창출을 이끌 강력한 리더십의 필요성이 꾸준히 제기되어 왔습니다.`,
  players:`신임 당대표 김민석, 정청래 전 후보, 친명계 및 친청계 의원들, 이재명 대통령`,
  current:`당대표 선출로 새 지도부가 출범했으나, 최고위원 구성 비율에서 나타난 계파 간 균형 맞추기가 당면한 현실입니다.`,
  outlook:`곧 시작될 정기국회에서 민생 법안 처리와 대여 관계 설정 과정이 신임 지도부의 리더십을 평가하는 첫 시험대가 될 것입니다.`,
  sources:[{title:`김민석 신임 당대표 선출, 당정 일치 강조 - 조선일보`,url:`https://www.chosun.com`},{title:`민주당 전당대회 결과 발표 - 연합뉴스`,url:`https://www.yna.co.kr`}]

  category:`정치`,

  colorBg:`#fce8e6`,
  headline:`미-이란 호르무즈 해협 대치 장기화, 트럼프 지지율 최저치 추락`,
  metrics:[`트럼프 대통령 지지율 33%`,`글로벌 석유 무역 20% 마비 위기`],
  summary:`미국과 이란 간의 군사적 대치가 심화되면서 호르무즈 해협을 둘러싼 긴장감이 최고조에 달하고 있습니다. 트럼프 행정부는 이란에 대한 강력한 제재와 해상 봉쇄를 유지하며 강경한 입장을 고수하고 있습니다. 이에 이란 측은 미국의 제재가 해제되지 않는 한 글로벌 석유 무역의 핵심 통로인 호르무즈 해협의 폐쇄를 지속하겠다고 으름장을 놓았습니다. 이처럼 출구 없는 대치와 전쟁 발발 가능성에 대한 우려로 트럼프 대통령의 국내 지지율은 임기 중 최저치인 33%까지 곤두박질쳤습니다. 글로벌 에너지 공급망 마비로 인한 경제적 타격 우려도 갈수록 커지고 있습니다. 양국 간의 우발적 무력 충돌을 막기 위한 국제사회의 중재 노력이 시급한 시점입니다.`,
  keyTerms:[{term:`해상 봉쇄`,explanation:`적국의 해상 항로를 군사력으로 차단하여 물자 수송과 통상을 막는 적대적 제재 조치를 뜻합니다.`}],
  history:`미국의 이란 핵합의 파기 이후 양국 간의 갈등은 페르시아만 인근 해역의 선박 나포와 군사적 위협 등으로 계속 악화되어 왔습니다.`,
  players:`도널드 트럼프 미국 대통령, 이란 정부 및 혁명수비대, 글로벌 원유 수입국`,
  current:`이란의 해협 폐쇄 위협이 실제 원유 수송망을 직접적으로 압박하며 전 세계 에너지 시장의 불안을 키우고 있는 상황입니다.`,
  outlook:`미국 내 정치적 압박이 거세지는 가운데, 극적인 막후 협상이 재개될지 아니면 군사적 충돌로 비화될지 귀추가 주목됩니다.`,
  sources:[{title:`미-이란 호르무즈 해협 긴장, 트럼프 지지율 최저 - Reuters`,url:`https://www.reuters.com`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`한미연합훈련 축소 논란 속 이재명 대통령, 자주국방 속도전 주문`,
  metrics:[`한미연합훈련 규모 대폭 축소 결정`,`임기 내 전작권 환수 및 원잠 추진`],
  summary:`트럼프 미국 대통령이 한미연합훈련의 대폭 축소를 일방적으로 지시하면서 한미 동맹의 소통 부재에 대한 비판이 커지고 있습니다. 야당은 정부가 북한의 눈치만 보다가 안보 훈련을 흥정의 대상으로 전락시켰다며 맹비난을 가했습니다. 이에 이재명 대통령은 을지연습을 맞아 굳건한 동맹과 독자적인 안보 역량은 함께 가야 한다고 강조하며 논란 진화에 나섰습니다. 특히 임기 내 전시작전통제권 환수와 핵추진잠수함 도입 등 자주국방 사업 추진에 속도를 내어 안보 공백 우려를 불식시키겠다고 밝혔습니다. 이번 사태는 미국 우선주의 외교 속에서 한국의 독자적 방위력 확보가 시급하다는 점을 다시 한번 각인시켰습니다. 향후 한미 간의 방위비 협상 과정에서 적지 않은 난항이 예상됩니다.`,
  keyTerms:[{term:`자주국방`,explanation:`외국에 의존하지 않고 스스로의 군사력과 경제력으로 국가의 안전과 평화를 지키는 독자적 국방 체계를 말합니다.`}],
  history:`과거부터 한미연합훈련은 북한의 반발을 사왔으며, 미국 행정부의 비용 절감 압박과 맞물려 그 규모와 성격이 지속적으로 논란이 되어왔습니다.`,
  players:`이재명 대통령, 도널드 트럼프 미국 대통령, 국방부, 주요 야당`,
  current:`미국의 돌발적인 훈련 축소 지시로 국내 안보 불안감이 커지자, 정부가 독자적인 군사력 강화 카드를 전면에 내세운 상태입니다.`,
  outlook:`대규모 국방 프로젝트의 실현 가능성과 전시작전통제권 조기 환수를 둘러싼 한미 간 세부 조율 결과가 주목받고 있습니다.`,
  sources:[{title:`이재명 대통령, 한미훈련 축소 우려에 자주국방 강조 - 연합뉴스`,url:`https://www.yna.co.kr`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`국산 독자 AI 파운데이션 모델 개발, LG·SKT·업스테이지 3파전`,
  metrics:[`정부 지원금 1,200억 원 투입 예정`,`최종 3개 기업 및 컨소시엄 선발`],
  summary:`대한민국의 AI 주권 확보를 위한 독자 파운데이션 모델 프로젝트가 LG AI연구원, SK텔레콤, 업스테이지의 3파전으로 압축되었습니다. 과학기술정보통신부의 2차 평가 결과, 이들 세 팀이 뛰어난 기술력을 인정받아 최종 경쟁 단계에 진출했습니다. 치열한 경합 끝에 글로벌 순위권에 들었던 유력 스타트업조차 탈락하는 이변이 연출되기도 했습니다. 정부는 선정된 3개 팀에 약 6개월 동안 1,200억 원 규모의 대대적인 컴퓨팅 자원과 최신 GPU를 집중 지원할 방침입니다. 이를 통해 해외 빅테크 기업에 종속되지 않는 강력한 토종 AI 생태계를 구축하겠다는 목표입니다. 최종 승자는 국가 대표 AI 모델로서 다양한 산업 분야의 표준으로 자리 잡을 가능성이 높습니다.`,
  keyTerms:[{term:`파운데이션 모델`,explanation:`방대한 양의 데이터를 사전에 학습하여 번역, 요약, 코딩 등 다양한 인공지능 작업의 뼈대 역할을 하는 범용 핵심 모델입니다.`}],
  history:`생성형 AI 시대가 도래하며 글로벌 기술 패권 경쟁이 치열해지자, 정부 주도로 막대한 자본이 드는 독자 모델 구축 사업이 시작되었습니다.`,
  players:`과학기술정보통신부, LG AI연구원, SK텔레콤, 업스테이지`,
  current:`막대한 연산 자원이 필요한 AI 개발에 국가적 차원의 하드웨어 및 예산 지원이 본격적으로 투입되는 결정적 단계입니다.`,
  outlook:`최종 심사를 거쳐 선정될 국가 대표 AI 모델이 실제 산업 현장에 얼마나 빠르게 상용화되고 글로벌 경쟁력을 갖출지 기대됩니다.`,
  sources:[{title:`독자 AI 개발 3파전 압축... 정부 지원 집중 - 연합뉴스`,url:`https://www.yna.co.kr`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`빌 게이츠 전격 방한, 한국 정·재계와 차세대 소형모듈원전(SMR) 협력 논의`,
  metrics:[`대규모 원전 기술 개발 협력 모색`,`테라파워 한국 파트너사 회동`],
  summary:`마이크로소프트 창업자이자 테라파워의 회장인 빌 게이츠가 차세대 원전 기술 협력을 위해 전격적으로 한국을 방문했습니다. 방한 기간 동안 게이츠 회장은 한국의 정부 고위 관계자 및 주요 대기업 경영진과 잇달아 만나 소형모듈원전 상용화를 위한 심도 있는 논의를 진행했습니다. 테라파워가 개발 중인 차세대 원전은 기존 시설보다 안전성이 뛰어나고 탄소 배출 없는 안정적 전력 공급원으로 전 세계적인 주목을 받고 있습니다. 특히 전력 소모가 극심한 AI 데이터 센터의 급증으로 청정에너지 수요가 폭발하는 가운데 이루어진 만남이라 그 의미가 큽니다. 한국의 우수한 원전 제조 역량과 테라파워의 설계 기술이 결합하면 글로벌 원전 시장을 선점할 수 있을 것으로 기대됩니다. 양측의 실질적인 조인트 벤처 설립이나 투자 합의로 이어질지 이목이 집중되고 있습니다.`,
  keyTerms:[{term:`소형모듈원전`,explanation:`기존 대형 원전보다 크기를 크게 줄여 공장에서 모듈 단위로 사전 제작한 뒤 현장에서 조립하는 안전하고 효율적인 차세대 원자로입니다.`}],
  history:`기후 위기 대응과 에너지 안보 차원에서 기존 대형 원전의 대안으로 안전성과 유연성을 갖춘 차세대 원전 기술 개발이 가속화되어 왔습니다.`,
  players:`빌 게이츠 테라파워 회장, 한국 정부, SK 및 두산 등 국내 주요 원전 관련 파트너사`,
  current:`AI 산업 팽창에 따른 폭발적인 전력 수요를 충당하기 위해 글로벌 빅테크 기업들이 차세대 에너지원 상용화에 사활을 걸고 있는 시점입니다.`,
  outlook:`방한 이후 테라파워와 한국 기업 간의 구체적인 투자 규모와 시범 단지 구축 일정이 점차 구체화될 것으로 예상됩니다.`,
  sources:[{title:`빌 게이츠 방한, K-원전 기업과 SMR 협력 논의 - 연합뉴스TV`,url:`https://www.yonhapnewstv.co.kr`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`앤트로픽 폭발적 성장세에 기술주 중심 글로벌 증시 반등`,
  metrics:[`앤트로픽 연간 매출 크게 급증`,`나스닥 등 주요 기술주 지수 반등`],
  summary:`AI 스타트업 앤트로픽(Anthropic)이 눈부신 매출 성장세를 기록하며 주춤했던 글로벌 증시에 강력한 반등의 불씨를 지폈습니다. 시장 일각에서 제기되던 인공지능 투자 거품론을 불식시키듯, 앤트로픽의 이번 실적 호조는 생성형 AI의 막강한 상업적 잠재력을 다시 한번 입증했습니다. 이에 따라 마이크로소프트, 엔비디아 등 AI 인프라 밸류체인에 묶인 주요 기술주 시장이 동반 상승하며 랠리를 주도하고 있습니다. 투자자들은 기업들의 대규모 IT 지출이 단기적인 유행이 아니라 지속 가능한 장기 트렌드라는 믿음을 굳히는 분위기입니다. 경기 침체 우려로 다소 얼어붙었던 투자 심리가 기술 혁신에 대한 기대감으로 빠르게 회복되고 있습니다. 하반기 주요 테크 기업들의 실적 발표가 이러한 상승세의 지속 여부를 가늠하는 핵심 잣대가 될 것입니다.`,
  keyTerms:[{term:`기술주`,explanation:`정보기술, 소프트웨어, 반도체 등 혁신적인 첨단 과학기술 분야에 속한 기업들의 주식을 일컫는 경제 용어입니다.`}],
  history:`생성형 AI 기술의 대두 이후 관련 밸류에이션이 급등했으나, 최근 실제 수익성에 대한 시장의 의구심이 일부 제기되며 변동성이 커지기도 했습니다.`,
  players:`앤트로픽, 글로벌 주요 빅테크 기업(오픈AI, 구글, 마이크로소프트), 주요 기관 투자자들`,
  current:`유망 스타트업의 유의미한 매출 지표가 확인되면서 시장 전반의 인프라 투자에 대한 확신이 강력하게 재점화되고 있습니다.`,
  outlook:`차세대 대형 언어 모델의 출시 일정과 주요 기업들의 데이터 센터 관련 자본 지출 규모가 향후 증시 트렌드를 결정지을 전망입니다.`,
  sources:[{title:`앤트로픽 실적 호조, 글로벌 기술주 반등 이끌어 - Bloomberg`,url:`https://www.bloomberg.com`}]
}]

  tag:`2026-08-18`,

  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`7월 반도체 수출 호조에 힘입어 한국 수출이 전년 대비 62.8% 급증하며 경기 회복세를 이끌고 있습니다.`,
  metrics:[`수출 증가율 62.8%`,`수출물가 49.1% 폭등`],
  summary:`정부가 발표한 최근 경제동향에 따르면 한국 경제의 든든한 버팀목인 반도체와 선박 수출이 크게 늘었습니다. 특히 반도체 가격 상승으로 7월 수출물가가 작년 대비 49.1%나 폭등하며 28년 만에 최고치를 기록했습니다. 수출 호조는 생산과 소비, 설비투자의 동반 상승을 이끌어내며 전반적인 경기 회복 흐름을 강화하고 있습니다. 하지만 AI 투자 과열에 대한 경고와 고유가 등 불안 요소도 여전히 남아있는 상태입니다. 이러한 지표 호조를 바탕으로 10년 뒤 한국 경제가 일본을 추월할 것이라는 낙관적인 전망도 나오고 있습니다. 정부는 하반기에도 이 같은 수출 주도 성장이 계속될 것으로 기대하고 있습니다.`,
  keyTerms:[{term:`수출물가`,explanation:`국내 기업이 해외로 상품을 팔 때 받는 가격의 변동을 나타내는 지표입니다. 수출물가가 오르면 기업들의 수익성이 좋아질 수 있습니다.`}],
  history:`최근 2년간 글로벌 반도체 시장 침체로 한국 수출이 어려움을 겪어왔습니다. 그러나 올해 초부터 AI 수요 폭발로 메모리 반도체 수요가 급반등했습니다.`,
  players:`삼성전자와 SK하이닉스 등 주요 반도체 기업, 그리고 경제 지표를 관리하는 한국은행과 기획재정부가 얽혀 있습니다.`,
  current:`반도체 단가가 28년 만에 최대폭으로 뛰면서 수출 주도 경제 회복이 본격화되는 전환점입니다.`,
  outlook:`하반기 글로벌 IT 수요에 따라 수출 증가세가 유지될지, 아니면 일시적 호황에 그칠지 지켜봐야 합니다.`,
  sources:[{title:`반도체 이끈 7월 수출 62.8% 증가 - 연합뉴스`,url:`https://www.yna.co.kr/view/AKR202608170001`},{title:`수출물가 49% 폭등, 28년만에 최고 - 매일경제`,url:`https://www.mk.co.kr/news/economy/20260817`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국 연방준비제도(Fed)의 9월 금리 인하 기대감이 커지면서 글로벌 증시가 안정을 되찾고 있습니다.`,
  metrics:[`미국 소비자물가지수(CPI) 2.9%`,`금리 인하 확률 85%`],
  summary:`최근 발표된 미국의 7월 소비자물가지수(CPI) 상승률이 3년 만에 2%대로 진입했습니다. 이에 따라 시장에서는 연방준비제도가 다가오는 9월 FOMC 회의에서 기준금리를 인하할 것이라는 기대감이 급격히 커지고 있습니다. 고금리 장기화로 침체되었던 글로벌 증시와 가상화폐 시장은 안도 랠리를 보이며 상승세로 돌아섰습니다. 다만 노동 시장 지표가 다소 둔화되는 조짐을 보이면서 경기 침체 우려도 일각에서 제기됩니다. 투자자들은 연준이 물가 안정과 고용 시장 방어 사이에서 이른바 골디락스를 달성할 수 있을지 주목하고 있습니다. 향후 제롬 파월 의장의 발언이 단기적인 시장 방향성을 결정할 핵심 변수입니다.`,
  keyTerms:[{term:`골디락스`,explanation:`경제가 너무 뜨겁지도, 너무 차갑지도 않은 이상적인 상태를 뜻합니다. 물가 상승 없이 경제 성장이 이어지는 상황을 말합니다.`}],
  history:`미국 연준은 인플레이션을 잡기 위해 지난 2년간 공격적으로 기준금리를 인상해왔습니다. 최근 물가 상승세가 둔화되며 정책 전환의 필요성이 대두되었습니다.`,
  players:`미국 연방준비제도 제롬 파월 의장과 글로벌 금융 시장의 투자자들, 미국 내 기업들이 주요 행위자입니다.`,
  current:`물가 지표가 연준의 목표치인 2%대에 근접하면서 사실상 금리 인하 사이클 진입의 명분이 확보된 상태입니다.`,
  outlook:`이번 달 말 열리는 잭슨홀 미팅에서 파월 의장이 향후 금리 인하 속도와 폭에 대해 어떤 신호를 줄지 시장의 관심이 쏠려 있습니다.`,
  sources:[{title:`미국 CPI 2%대 진입, 9월 금리 인하 확실시 - 한국경제`,url:`https://www.hankyung.com/economy/article/20260817`},{title:`글로벌 증시 안도 랠리, 연준의 선택은 - 조선일보`,url:`https://www.chosun.com/economy/market/20260818`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`월스트리트 일각에서 AI 투자 대비 수익성에 대한 회의론이 확산되며 대형 기술주들이 조정을 겪고 있습니다.`,
  metrics:[`나스닥 기술주 평균 5% 하락`,`AI 인프라 투자액 1천억 달러`],
  summary:`엔비디아와 마이크로소프트를 필두로 한 글로벌 빅테크 기업들의 AI 투자가 천문학적인 규모에 달하고 있습니다. 그러나 막대한 자본이 투입된 것에 비해 실제 뚜렷한 수익 모델이나 현금 흐름 창출은 지연되고 있다는 분석이 나오며 이른바 AI 거품론이 고개를 들고 있습니다. 헤지펀드와 주요 투자은행들은 장기적인 AI의 가능성에는 동의하지만, 단기적으로 주가가 지나치게 고평가되었다며 투자 비중을 축소하고 있습니다. 이러한 우려는 나스닥 시장 전체의 투자 심리를 위축시키고 있으며 반도체 장비 업체들에게도 부정적인 영향을 미쳤습니다. 당분간 실적 발표에서 실질적인 AI 수익성을 증명하는 기업만이 살아남는 차별화 장세가 예상됩니다.`,
  keyTerms:[{term:`AI 거품론`,explanation:`인공지능 기술에 대한 기대감으로 관련 기업들의 주가가 실제 가치나 수익성에 비해 과도하게 부풀려졌다는 주장입니다.`}],
  history:`챗GPT 출시 이후 지난 2년간 글로벌 주식 시장은 AI 관련 기업들이 주도하며 기록적인 상승장을 연출했습니다.`,
  players:`엔비디아, 구글 등 대형 빅테크 기업들과 막대한 자금을 운용하는 월스트리트의 주요 기관 투자자들이 중심입니다.`,
  current:`2분기 실적 발표 시즌을 기점으로 투자자들의 초점이 미래의 가능성에서 당장의 수익성 증명으로 이동하는 분기점입니다.`,
  outlook:`향후 분기 실적에서 AI 서비스 가입자 증가율 및 B2B 매출 성과가 입증되지 않으면 기술주 중심의 추가 조정이 발생할 수 있습니다.`,
  sources:[{title:`월가 덮친 AI 회의론, 나스닥 휘청 - 중앙일보`,url:`https://www.joongang.co.kr/article/20260817`},{title:`수익성 잣대 들이대는 투자자들 - Bloomberg`,url:`https://www.bloomberg.com/news/articles/2026-08-17/ai-bubble`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`더불어민주당 전당대회에서 김민석 신임 대표가 선출되며 차기 대선을 향한 새로운 지도부가 출범했습니다.`,
  metrics:[`김민석 후보 득표율 54.08%`,`수석최고위원 최민희 1위`],
  summary:`더불어민주당 전당대회에서 치열한 경선 끝에 김민석 후보가 정청래 후보를 꺾고 새로운 당대표로 선출되었습니다. 과거 이재명 정부의 초대 국무총리를 지낸 김 대표는 이번 승리로 집권 여당의 수장으로 복귀하게 되었습니다. 최고위원 선거에서는 최민희 후보가 1위로 수석최고위원 자리를 차지하며 당 지도부의 윤곽이 완성되었습니다. 새 지도부는 2028년 총선 공천권이라는 막강한 권한을 쥐게 되어 당내 장악력이 한층 강화될 전망입니다. 야당은 새 지도부 출범을 축하하면서도 향후 국정 운영과 협치에 있어 명확한 방향성을 요구하고 있습니다. 이번 전당대회 결과는 차기 대선 구도에도 적지 않은 영향을 미칠 것으로 보입니다.`,
  keyTerms:[{term:`공천권`,explanation:`정당이 선거에 출마할 공식 후보자를 추천하고 결정하는 권한입니다. 당대표의 핵심 권력 중 하나로 꼽힙니다.`}],
  history:`여당 내에서는 차기 권력 구도를 둘러싸고 다양한 계파 간의 신경전이 이어져 왔으며, 이번 전당대회가 그 분수령이 되었습니다.`,
  players:`김민석 신임 당대표, 정청래 후보, 최민희 최고위원 등 당내 주요 인사들과 당원들이 핵심 역할을 했습니다.`,
  current:`새로운 지도부가 선출됨으로써 당내 갈등을 봉합하고 차기 총선 및 대선을 향한 당의 진로가 확정되는 시점입니다.`,
  outlook:`신임 대표가 야당과의 협치 문제와 산적한 민생 법안들을 어떻게 풀어갈지, 그리고 당내 비주류를 어떻게 포용할지가 관건입니다.`,
  sources:[{title:`김민석, 민주당 새 대표로 선출 - 한겨레`,url:`https://www.hani.co.kr/arti/politics/20260817`},{title:`차기 공천권 쥔 새 지도부 출범 - KBS`,url:`https://news.kbs.co.kr/news/view.do?ncd=20260817`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`도널드 트럼프 미국 대통령이 한미 연합훈련의 대폭 축소를 전격 지시하면서 동북아 안보 지형에 파장이 일고 있습니다.`,
  metrics:[`병력 참여 규모 30% 감축`,`미 국방부 예산 삭감 제안`],
  summary:`도널드 트럼프 미국 대통령이 국방부에 이달 예정된 한미 연합훈련인 '을지 자유의 방패(UFS)'를 대폭 축소하라고 지시했습니다. 이는 북한 김정은 국무위원장과의 우호적인 관계를 과시하고, 한국이 미국의 다른 대외 정책에 소극적인 태도를 보인 것에 대한 불만을 표출한 것으로 해석됩니다. 갑작스러운 훈련 축소 지시에 미 펜타곤 내부에서도 우려의 목소리가 나오고 있으며, 한국 정부는 당혹감 속에 외교 채널을 가동하고 있습니다. 우리 대통령실은 표면적으로는 북미 대화 재개의 계기가 되길 바란다는 원론적 입장을 내놓았습니다. 이번 사태는 향후 한미 동맹의 결속력과 방위비 분담금 협상에도 큰 영향을 미칠 전망입니다.`,
  keyTerms:[{term:`한미 연합훈련`,explanation:`한국과 미국 군대가 한반도 방위를 목적으로 매년 정기적으로 실시하는 대규모 합동 군사 훈련입니다.`}],
  history:`미국 최우선주의를 내세우는 트럼프 행정부는 동맹국들에게 더 많은 비용 부담과 정책적 동조를 지속적으로 요구해왔습니다.`,
  players:`도널드 트럼프 미국 대통령, 미 국방부(펜타곤), 한국 대통령실 및 국방부, 그리고 북한의 김정은 위원장입니다.`,
  current:`정례적인 안보 훈련이 미국 대통령의 즉흥적인 지시로 변동되면서 동맹 간 신뢰 문제가 다시 수면 위로 떠오른 상황입니다.`,
  outlook:`향후 한미 양국이 축소된 훈련을 어떻게 진행할지, 그리고 이것이 북한의 도발 억제력에 어떤 영향을 미칠지 예의주시해야 합니다.`,
  sources:[{title:`트럼프, UFS 훈련 대폭 축소 지시 - SBS`,url:`https://news.sbs.co.kr/news/endPage.do?news_id=20260817`},{title:`한미 동맹 흔드는 트럼프의 청구서 - NYT`,url:`https://www.nytimes.com/2026/08/17/world/asia/trump-korea.html`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`정부의 8.13 부동산 공급 대책 발표 이후 시장 혼란이 가중되며 오세훈 서울시장이 전면 재검토를 촉구하고 나섰습니다.`,
  metrics:[`서울 아파트 매물 15% 감소`,`재건축 분담금 20% 인상 논란`],
  summary:`정부가 도심 주택 공급 확대를 목표로 발표한 '8.13 부동산 대책'이 오히려 시장의 불확실성을 키우고 있습니다. 대책 발표 직후 재건축 규제 완화에 대한 기대감과 늘어난 재건축 분담금에 대한 반발이 충돌하면서 서울 주요 지역의 아파트 매물이 급감하고 호가가 요동쳤습니다. 야당의 비판은 물론 여당 내부에서도 섣부른 대책이라는 우려가 쏟아지고 있습니다. 특히 주택 공급의 핵심 축인 서울시의 오세훈 시장은 국회를 찾아 정책의 현실성을 비판하며 전면 재검토를 강력히 요구했습니다. 정부는 조만간 보완책을 마련하겠다는 입장이지만, 정책 신뢰도가 하락해 당분간 부동산 시장의 혼란은 불가피해 보입니다.`,
  keyTerms:[{term:`재건축 분담금`,explanation:`오래된 아파트를 허물고 새로 지을 때, 조합원이 기존 집의 가치를 제외하고 추가로 내야 하는 건축 비용을 말합니다.`}],
  history:`수도권 주택 가격 불안정이 지속되면서 정부는 꾸준히 공급 확대 카드를 만지작거렸고, 그 결과물이 8.13 대책이었습니다.`,
  players:`국토교통부 등 중앙정부, 오세훈 서울시장을 비롯한 지자체장, 그리고 국회의 여야 정치인들이 얽혀 있습니다.`,
  current:`시장 안정을 위해 내놓은 대책이 오히려 시장 참여자들의 불안을 자극하며 정책 부작용이 현실화되는 시점입니다.`,
  outlook:`정부와 서울시가 이견을 좁히고 시장을 진정시킬 수 있는 실효성 있는 후속 보완책을 빠르게 내놓을 수 있을지가 관건입니다.`,
  sources:[{title:`8.13 대책 후폭풍, 오세훈 '전면 재검토' 요구 - MBC`,url:`https://imnews.imbc.com/news/2026/politics/article/20260817_1.html`},{title:`부동산 시장 요동, 당정 갈등 커져 - 매일경제`,url:`https://www.mk.co.kr/news/realestate/20260818`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`16년 전 해산되었던 친일재산조사위원회가 특별법 통과와 함께 연말부터 다시 본격적인 활동을 시작합니다.`,
  metrics:[`환수 대상 토지 약 1,500만 평 예상`,`특별법 국회 통과율 78%`],
  summary:`과거 활동을 종료했던 친일재산조사위원회가 여야 합의에 따른 특별법 제정으로 16년 만에 화려하게 부활했습니다. 올 연말부터 본격 가동될 예정인 이 위원회는 과거보다 훨씬 강력한 권한을 부여받았습니다. 특히 친일파 후손들이 이미 제3자에게 처분한 재산이라도 그 처분 대가나 은닉 자산까지 끝까지 추적해 환수할 수 있도록 법적 근거가 마련되었습니다. 정부는 이를 통해 역사적 정의를 바로 세우고 국가 기강을 확립하겠다는 강한 의지를 보이고 있습니다. 일부에서는 선의의 피해자 발생과 법적 안정성에 대한 우려도 제기하고 있어, 향후 위원회의 조사 과정에서 치열한 법정 공방도 예상됩니다.`,
  keyTerms:[{term:`환수`,explanation:`국가나 원래 주인에게 부당하게 넘어간 재산이나 권리를 법적 절차를 거쳐 다시 되찾아오는 것을 뜻합니다.`}],
  history:`과거 위원회는 많은 성과를 냈지만 시효 만료와 권한 한계로 해산되었으며, 미완의 과제에 대한 재조사 요구가 꾸준히 있었습니다.`,
  players:`친일재산조사위원회, 친일파 후손 및 관련 이해관계자, 그리고 특별법을 통과시킨 국회입니다.`,
  current:`특별법이 국회를 통과하여 강력한 법적 권한을 가진 위원회가 재출범을 위한 조직 구성을 서두르고 있는 단계입니다.`,
  outlook:`연말 첫 조사 대상 발표를 시작으로 굵직한 친일 재산 환수 소송들이 줄을 이을 것으로 보이며 사회적 관심이 집중될 전망입니다.`,
  sources:[{title:`친일재산조사위 16년만에 부활 - 조선일보`,url:`https://www.chosun.com/national/20260817`},{title:`은닉 자산까지 끝까지 추적한다 - KBS`,url:`https://news.kbs.co.kr/news/view.do?ncd=20260818`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`남부 유럽을 강타한 이례적인 살인적 폭염으로 전력 수요가 폭증하며 글로벌 에너지 가격이 요동치고 있습니다.`,
  metrics:[`유럽 천연가스 가격 12% 급등`,`스페인 최고 기온 46도 돌파`],
  summary:`스페인, 이탈리아 등 남유럽 지역에 섭씨 46도를 오르내리는 기록적인 폭염이 이어지고 있습니다. 냉방을 위한 전력 수요가 폭발적으로 증가하면서 각국의 전력망이 마비될 위기에 처했습니다. 설상가상으로 가뭄까지 겹쳐 수력 및 원자력 발전소의 가동률이 뚝 떨어지자, 천연가스와 석탄 발전 의존도가 급증했습니다. 이로 인해 유럽 내 천연가스 가격이 일주일 새 12% 이상 급등하며 글로벌 에너지 시장 전반에 인플레이션 우려를 키우고 있습니다. 각국 정부는 긴급 절전 조치를 발령하고 취약계층 보호에 나섰지만, 기후 변화로 인한 극단적 기상의 빈도가 늘며 근본적인 에너지 안보 대책이 시급해졌습니다.`,
  keyTerms:[{term:`인플레이션`,explanation:`물가가 지속적으로 오르면서 화폐의 가치가 떨어지는 현상입니다. 에너지가격 상승은 물가를 끌어올리는 주된 원인이 됩니다.`}],
  history:`최근 수년간 유럽은 여름철 폭염과 겨울철 한파 등 이상 기후로 인해 만성적인 에너지 수급 불안을 겪어왔습니다.`,
  players:`전력 수요를 감당해야 하는 유럽 각국 정부와 에너지 기업, 그리고 기후 변화에 고통받는 일반 시민들입니다.`,
  current:`단순한 폭염을 넘어 국가 전력망 붕괴와 글로벌 에너지 가격 급등이라는 연쇄적인 경제 타격으로 이어지고 있는 심각한 상황입니다.`,
  outlook:`여름이 끝날 때까지 폭염이 지속될 경우 에너지 비용 상승이 하반기 유럽 경제의 물가 상승을 부채질할 가능성이 큽니다.`,
  sources:[{title:`유럽 46도 살인 폭염에 전력망 비상 - BBC`,url:`https://www.bbc.com/news/world-europe-20260817`},{title:`에너지 위기 재점화, 천연가스 급등 - 한국경제`,url:`https://www.hankyung.com/international/article/20260818`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`유명 작가와 예술가들이 글로벌 AI 기업들을 상대로 제기한 대규모 저작권 침해 집단소송의 첫 재판이 시작되었습니다.`,
  metrics:[`원고 참여 예술가 1만 명 돌파`,`청구 배상액 50억 달러 추산`],
  summary:`미국 뉴욕 연방법원에서 글로벌 AI 기술 기업들을 상대로 한 대규모 저작권 침해 집단소송의 첫 심리가 열렸습니다. 1만 명이 넘는 작가, 일러스트레이터, 언론사들은 AI 모델이 학습 과정에서 자신들의 저작물을 무단으로 도용했다고 주장하고 있습니다. AI 기업들은 데이터 학습이 '공정 이용'의 범주에 해당한다며 맞서고 있어, 기술 발전과 지적재산권 보호 사이의 치열한 법리 다툼이 펼쳐지고 있습니다. 이번 재판 결과는 향후 AI 산업의 데이터 수집 방식과 비즈니스 모델에 치명적인 영향을 미칠 수 있는 중대한 판례가 될 것입니다. 전 세계 IT 업계와 창작자 커뮤니티 모두가 판결의 향방에 촉각을 곤두세우고 있습니다.`,
  keyTerms:[{term:`공정 이용`,explanation:`저작권자의 허락 없이도 교육, 비평, 연구 등의 공익적 목적으로 저작물을 제한적으로 사용할 수 있도록 허용하는 법적 개념입니다.`}],
  history:`생성형 AI 기술이 급격히 발전하면서, 이들 AI가 방대한 웹 데이터를 학습하는 과정에서 저작권 침해 논란이 꾸준히 누적되어 왔습니다.`,
  players:`무단 도용을 주장하는 글로벌 창작자 연대와, 기술 발전을 위해 데이터 학습의 정당성을 주장하는 주요 AI 빅테크 기업들입니다.`,
  current:`산발적으로 제기되던 불만들이 대규모 집단 소송으로 묶여 법원의 첫 공식 판단을 기다리는 역사적 법정 공방의 시작점입니다.`,
  outlook:`법원이 어느 쪽의 손을 들어주느냐에 따라 AI 학습 데이터에 대한 천문학적인 로열티 지불 여부가 결정될 것입니다.`,
  sources:[{title:`AI 저작권 침해 첫 재판, 공정 이용 쟁점 - WSJ`,url:`https://www.wsj.com/tech/ai-copyright-lawsuit-20260817`},{title:`창작자 vs 빅테크 세기의 소송 시작 - 연합뉴스`,url:`https://www.yna.co.kr/view/AKR202608180002`}]
}]

  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`반도체 공포에 코스피 10.84% 폭락…역대 2위 낙폭 검은 화요일`,
  metrics:[`코스피 -732.09p(-10.84%), 6023.66 마감`,`삼성전자 -13.4%·SK하이닉스 -14.7%`],
  summary:`28일 코스피는 전 거래일보다 732.09포인트(10.84%) 급락한 6023.66에 마감하며 이른바 검은 화요일이라 불린 역대 2위 하락폭을 기록했다. 오전 9시6분 매도 사이드카에 이어 오전 10시13분에는 지수가 8% 넘게 빠지며 서킷브레이커가 발동돼 거래가 일시 중단됐다. 지수 시가총액의 절반가량을 차지하는 삼성전자가 13.4%, SK하이닉스가 14.7% 폭락하며 낙폭을 키웠고 코스닥도 7.7% 떨어졌다. 중국 창신메모리(CXMT)의 상하이 증시 상장과 중국의 반도체 장비 양산 소식이 공급과잉 우려를 자극한 것이 방아쇠였다. AI 수요에 기댄 메모리 슈퍼사이클 기대가 흔들리며 투자심리가 급격히 얼어붙었다. 외국인과 기관의 동반 매도가 쏟아지며 뒤늦게 들어온 개인 투자자 피해가 특히 커졌다. 시장에서는 한국 증시가 반도체 한 축에 지나치게 쏠려 있다는 구조적 취약성이 다시 드러났다는 평가가 나온다.`,
  keyTerms:[{term:`서킷브레이커`,explanation:`주가가 일정 폭 이상 급락하면 시장 전체 거래를 일정 시간 멈추는 안전장치다. 투자자에게 냉정을 되찾을 시간을 주려는 제도다.`}],
  history:`한국 증시는 2020년대 들어 반도체·2차전지 등 소수 대형 수출주 중심으로 성장해 왔다. 특히 삼성전자와 SK하이닉스는 코스피 시가총액의 큰 비중을 차지해 두 종목의 등락이 지수 전체를 좌우해 왔다. 최근 몇 년간 AI 붐에 따른 메모리 수요 기대가 이들 주가를 끌어올리며 지수도 사상 최고 수준까지 올랐다.`,
  players:`삼성전자와 SK하이닉스 등 국내 반도체 대장주, 외국인·기관 투자자, 대규모로 유입된 개인 투자자가 이번 급락의 직접 당사자다. 한국거래소와 금융당국은 서킷브레이커·사이드카 등 시장 안정장치를 운용한다. 중국 창신메모리를 앞세운 중국 반도체 산업이 경쟁 구도의 새 변수로 등장했다.`,
  current:`중국발 반도체 공급과잉 공포가 하루 만에 코스피를 10% 넘게 무너뜨리며 한국 경제의 반도체 쏠림 위험이 현실화했다. 역대 2위 하락폭과 서킷브레이커 발동은 이번 충격의 심각성을 보여준다.`,
  outlook:`삼성전자·SK하이닉스의 실적 발표와 D램 가격 추이, 중국 반도체 증설 속도가 반등 여부를 가를 핵심 변수다. 금융당국의 시장 안정 대책과 다음 금통위의 금리 결정도 주목된다.`,
  sources:[{title:`코스피 732.09포인트(10.84%) 내린 6023.66 마감 - 머니투데이`,url:`https://www.mt.co.kr/stock/2026/07/28/2026072815271496219`},{title:`증시 폭락 검은 화요일…코스피 10.8%·코스닥 7.7% - 파이낸셜뉴스`,url:`https://www.fnnews.com/news/202607281537146394`},{title:`Chip Rout Deepens on China Competition, Circular Funding Fears - Bloomberg`,url:`https://www.bloomberg.com/news/articles/2026-07-28/korean-stocks-sink-as-chipmakers-plung-on-deepening-ai-fatigue`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미 연준 7월 FOMC 금리 동결 유력…이란발 유가·트럼프 압박이 변수`,
  metrics:[`정책금리 목표 3.50~3.75% 동결 예상`,`6월 소비자물가 연 3.5%`],
  summary:`미국 연방준비제도(연준)는 7월 28~29일 연방공개시장위원회(FOMC) 회의에서 기준금리 동결을 결정할 것으로 예상된다. 현재 정책금리 목표범위는 연 3.50~3.75%로, 지난해 12월 3.75%에서 3.50%로 내린 뒤 반년 넘게 같은 수준을 유지하고 있다. 6월 소비자물가 상승률이 연 3.5%로 예상 밖 둔화를 보였지만 여전히 2% 목표를 크게 웃돌고 있어 인하를 서두르기 어려운 상황이다. 여기에 이란과의 갈등에 따른 에너지 가격 상승이 물가 경로를 다시 불확실하게 만들고 있다. 새로 취임한 케빈 워시 연준 의장은 금리 인하를 압박하는 트럼프 대통령과의 마찰을 피하면서도 물가를 잡아야 하는 이중 과제를 안고 있다. 시장은 연준이 이번에도 관망을 택한 뒤 하반기 인하 여지를 열어둘지에 주목하고 있다.`,
  keyTerms:[{term:`기준금리 동결`,explanation:`중앙은행이 정책금리를 올리지도 내리지도 않고 그대로 두는 결정이다. 경기와 물가 상황을 더 지켜보겠다는 신중한 신호로 읽힌다.`}],
  history:`연준은 2021년 이후 40년 만의 고물가에 대응해 급격히 금리를 올린 뒤, 물가가 잦아들자 인하로 방향을 틀었다. 2025년 12월 정책금리를 3.75%에서 3.50%로 내린 것이 마지막 조정이었다. 이후 반년 넘게 금리를 묶어두며 물가와 경기를 저울질해 왔다.`,
  players:`제롬 파월의 뒤를 이어 취임한 케빈 워시 의장이 통화정책을 이끈다. 금리 인하를 노골적으로 압박하는 트럼프 대통령과 물가 안정을 우선하는 FOMC 위원들이 긴장 관계를 이룬다. 미국 소비자와 기업, 글로벌 금융시장이 결정의 영향을 직접 받는다.`,
  current:`6월 물가가 예상 밖으로 둔화했지만 이란 사태발 에너지 가격 상승이 물가 전망을 다시 흔들면서 연준이 관망을 이어갈 명분이 커졌다. 정치적 압박 속에서 중앙은행 독립성 유지가 시험대에 올랐다.`,
  outlook:`29일 발표될 FOMC 성명과 워시 의장의 기자회견에서 하반기 인하 신호가 나올지가 관건이다. 이후 고용·물가 지표와 국제유가 흐름이 다음 결정을 좌우한다.`,
  sources:[{title:`Federal Reserve is likely to hold interest rates steady - CNBC`,url:`https://www.cnbc.com/2026/07/27/fed-interest-rates-july.html`},{title:`Fed Meeting Tracker 2026: How Interest Rate Shifts Shape Investor Strategy - Forbes`,url:`https://www.forbes.com/sites/investor-hub/article/fed-meeting-tracker-interest-rate-strategy/`},{title:`Prediction Markets for Fed Decision in July - Federal News Network`,url:`https://federalnewsnetwork.com/prediction-markets/2026/07/prediction-markets-fed-decision-july/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한은 3년 6개월 만에 기준금리 인상…증시 폭락에 셈법 복잡`,
  metrics:[`기준금리 2.50%→2.75% (+0.25%p)`,`6월 소비자물가 연 3.2%`],
  summary:`한국은행 금융통화위원회는 지난 7월 16일 기준금리를 연 2.50%에서 2.75%로 0.25%포인트 올리며 3년 6개월 만에 기준금리 인상에 나섰다. 금통위원 7명 전원 찬성으로, 지난해 5월 인하 이후 이어진 동결·완화 기조를 긴축으로 되돌린 결정이다. 6월 소비자물가 상승률이 연 3.2%로 2개월 연속 3%대에 올라 약 2년 6개월 만에 가장 높았던 점이 배경이 됐다. 반도체 경기 호조로 성장세가 강해진 데다 가계부채와 수도권 집값 상승 등 금융 불균형 위험이 커진 것도 인상 요인으로 꼽혔다. 그러나 인상 직후 반도체발 증시 폭락이 터지면서 통화당국의 셈법은 한층 복잡해졌다. 물가와 금융 안정을 위한 긴축과 급락한 시장·경기 방어 사이에서 다음 금통위의 선택에 관심이 쏠린다.`,
  keyTerms:[{term:`기준금리 인상`,explanation:`중앙은행이 정책금리를 올려 시중에 도는 돈줄을 조이는 조치다. 물가와 과열된 집값·빚을 잡으려 할 때 쓰지만 경기와 자산시장에는 부담을 준다.`}],
  history:`한국은행은 2021~2022년 물가 급등에 대응해 기준금리를 3.5%까지 올린 뒤 2023년 1월을 끝으로 인상을 멈췄다. 이후 장기 동결과 2025년 5월 인하를 거치며 완화 기조를 유지해 왔다. 그러나 물가와 집값이 다시 들썩이자 긴축 재개를 검토해 왔다.`,
  players:`이창용 총재가 이끄는 금융통화위원회가 금리를 결정하며, 가계·기업 대출자와 부동산 시장이 직접 영향을 받는다. 정부의 부동산·가계부채 관리 정책과도 맞물려 있다.`,
  current:`3년 6개월 만의 인상으로 긴축 전환을 알린 직후 반도체발 증시 폭락이 터지면서, 물가·금융안정과 경기 방어라는 상충하는 목표가 한꺼번에 부각됐다.`,
  outlook:`다음 금통위에서 인상 기조를 이어갈지, 시장 충격을 고려해 속도를 조절할지가 관건이다. 소비자물가와 수도권 집값, 가계부채 증가세가 판단 기준이 된다.`,
  sources:[{title:`한국은행 기준금리, 2026 금리 발표 일정 - 토스뱅크`,url:`https://www.tossbank.com/articles/baserate2601`},{title:`기준금리, 2026년 7월 인상이 우리 경제에 미치는 영향 - KAFI`,url:`https://kafi.co.kr/base-rate-2026-july-hike-explained/`},{title:`한국은행 금리인상, 기준금리 2.75%로 - EBC Financial Group`,url:`https://www.ebc.com/kr/forex/304100.html`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`이재명 정부 검찰개혁·개헌 정면충돌…보완수사권 폐지 놓고 여권도 진통`,
  metrics:[`개헌안 발의 서명 190여 명`,`민주당 단독 의석 160석`],
  summary:`이재명 정부와 더불어민주당이 추진하는 검찰 수사권 분리와 개헌이 정국의 핵심 쟁점으로 떠올랐다. 7월 들어 검사의 보완수사권을 폐지하는 형사소송법 개정안이 발의됐지만, 야권과 시민사회는 물론 여권 온건파까지 반발하자 민주당은 15일 보완수사권 폐지를 당론으로 정한 적은 없다고 한발 물러섰다. 앞서 4월 3일에는 민주당 160명 전원을 포함해 190여 명의 의원이 우원식 국회의장과 함께 헌법 개정안 발의에 서명했다. 2024년 12·3 비상계엄 사태로 제왕적 대통령제의 폐해가 부각되면서 권력 구조를 손보자는 개헌 요구가 급격히 커졌다. 검찰 조직 개편과 수사·기소 분리를 둘러싼 부처 간, 정파 간 이견은 여전히 크다. 개헌 논의가 실제 국민투표로 이어질지, 검찰개혁 입법이 어떤 수위로 확정될지가 하반기 최대 정치 변수로 남아 있다.`,
  keyTerms:[{term:`검찰 수사권 분리`,explanation:`검찰이 사건을 직접 수사하는 권한과 재판에 넘기는 기소 권한을 떼어내는 개혁이다. 한 기관에 권력이 지나치게 몰리는 것을 막자는 취지다.`}],
  history:`2024년 12월 3일 윤석열 당시 대통령의 비상계엄 선포와 이후 탄핵 국면을 거치며 제왕적 대통령제와 검찰 권력에 대한 개혁 요구가 분출했다. 2025년 정권 교체로 들어선 이재명 정부는 검찰개혁과 개헌을 핵심 과제로 내세웠다. 2026년 4월 대규모 개헌안 발의가 그 출발점이었다.`,
  players:`이재명 대통령과 더불어민주당, 조국혁신당 등 여권이 개혁을 주도하고, 국민의힘은 원천무효를 주장하며 반발한다. 검찰 조직과 법조계, 시민사회도 수사권 조정을 둘러싸고 엇갈린다. 우원식 국회의장이 개헌 논의를 중재한다.`,
  current:`보완수사권 폐지를 둘러싼 여권 내 이견으로 민주당이 한발 물러서면서, 검찰개혁 입법의 수위와 속도가 재조정되는 국면이다. 개헌과 검찰개혁이 동시에 정국의 뇌관으로 작동하고 있다.`,
  outlook:`형사소송법 개정안의 국회 처리 수위와 개헌 국민투표 실시 여부가 하반기 정치 일정의 핵심이다. 여야 협상과 여론 향배가 최종 결과를 좌우한다.`,
  sources:[{title:`제10차 개헌 - 나무위키`,url:`https://namu.wiki/w/%EC%A0%9C10%EC%B0%A8%20%EA%B0%9C%ED%97%8C`},{title:`이재명 정부 검찰 수사권 분리 - 나무위키`,url:`https://namu.wiki/w/%EC%9D%B4%EC%9E%AC%EB%AA%85%20%EC%A0%95%EB%B6%80%20%EA%B2%80%EC%B0%B0%20%EC%88%98%EC%82%AC%EA%B6%8C%20%EB%B6%84%EB%A6%AC`},{title:`이재명 대통령 공소취소 특검법 관련 최고위 - 국민의힘 보도자료`,url:`https://m.peoplepowerparty.kr/news/comment_view/BBSDD0001/113472`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미·이란 13일 공습 멈추고 협상 국면…호르무즈 안전보장이 최대 쟁점`,
  metrics:[`야간 공습 13일 만에 중단`,`중재국 오만·카타르·파키스탄·이집트`],
  summary:`미국과 이란이 13일간의 야간 공습 끝에 상호 공격을 멈추고 협상 국면으로 전환하고 있다. 트럼프 대통령은 중재국들의 요청을 받아 지난 금요일 공습 중단을 지시했으며 이번 협상에서 진전 가능성이 크다고 밝혔다. 다만 그는 협상이 실패하면 매우 강력한 군사행동으로 돌아갈 것이라며 시간이 많지 않다고 압박했다. 협상의 초점은 세계 원유 수송의 길목인 호르무즈 해협의 안전 보장에 맞춰져 있다. 이란은 미국과의 직접 협상을 부인하며 중재국을 통한 메시지 전달만 있을 뿐이라고 선을 그었다. 오만이 중재를 주도하는 가운데 카타르·파키스탄·이집트가 관여하고, 미국 측에서는 위트코프와 쿠슈너 특사가 나서고 있다. 지난 3월 시작된 미·이란 무력 충돌이 외교로 봉합될지 세계 에너지 시장이 촉각을 세우고 있다.`,
  keyTerms:[{term:`호르무즈 해협`,explanation:`이란 옆에 있는 좁은 바닷길로 세계 원유의 약 5분의 1이 이곳을 지난다. 봉쇄되면 국제 유가가 급등할 수 있어 전략적 요충지로 꼽힌다.`}],
  history:`이란 핵개발과 지역 대리세력을 둘러싼 미국·이스라엘과 이란의 갈등이 수년간 이어지다 2026년 3월 무력 충돌로 폭발했다. 미국은 이란 핵·군사시설에 대한 공습을 감행했고 이란도 보복에 나섰다. 7월 들어 13일간 야간 공습이 이어지며 위기가 최고조에 달했다.`,
  players:`트럼프 대통령과 미국, 이란 정부가 직접 당사자이며 오만이 중재를 주도한다. 카타르·파키스탄·이집트가 중재에 관여하고, 미국 측 특사로 위트코프와 쿠슈너가 나선다. 이스라엘과 걸프 산유국, 국제 에너지 시장도 이해관계가 크다.`,
  current:`양측이 상호 공격을 멈추고 협상 국면으로 들어섰지만 이란이 직접 협상을 부인하는 등 불신이 여전하다. 호르무즈 해협 안전 보장이 협상의 최대 쟁점으로 떠올랐다.`,
  outlook:`협상 결렬 시 트럼프가 예고한 강력한 군사행동 재개 여부가 최대 변수다. 협상 진전 속도와 국제유가 흐름이 향후 몇 주간의 향방을 가른다.`,
  sources:[{title:`Trump Talks Up Iran Diplomacy as Negotiations Focus on Hormuz - Bloomberg`,url:`https://www.bloomberg.com/news/articles/2026-07-28/trump-talks-up-iran-diplomacy-as-negotiations-focus-on-hormuz`},{title:`Trump says good chance of progress in Iran talks - Al Jazeera`,url:`https://www.aljazeera.com/news/2026/7/28/trump-says-good-chance-of-progress-in-iran-talks-what-we-know`},{title:`Trump threatens strong military action if Iran talks fail - CGTN`,url:`https://news.cgtn.com/news/2026-07-28/Trump-threatens-strong-military-action-if-Iran-talks-fail-1P8HfUMnS6I/share_amp.html`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`젤렌스키, 英 신임 버넘 총리와 첫 회담…드론·전자전 기술 이전 약속`,
  metrics:[`훈련 참가 우크라 군인 200여 명`,`버넘, 침공 이후 5번째 영국 총리`],
  summary:`우크라이나의 젤렌스키 대통령이 27일 영국 포츠머스를 찾아 취임 일주일을 맞은 앤디 버넘 신임 총리와 회담했다. 버넘 총리 취임 후 첫 외국 정상 방문으로, 영국은 키이우에 대한 흔들림 없는 지지를 재확인했다. 두 정상은 3주간 영국에서 흑해 기뢰 대응 훈련을 받은 우크라이나 군인 200여 명을 함께 만났다. 회담에서는 공동 드론 개발과 러시아 공습을 막을 탄도미사일 요격체 지원이 핵심 의제로 논의됐다. 영국은 러시아 방공망을 교란해 드론 탐지를 방해하는 전자전 시스템 스톤 클록의 지식재산권을 우크라이나에 넘기기로 했다. 버넘 총리는 2022년 러시아의 전면 침공 이후 젤렌스키를 상대하는 다섯 번째 영국 총리다. 미국의 지원이 불확실한 가운데 유럽의 대우크라이나 군사 지원 의지를 보여준 회동으로 평가된다.`,
  keyTerms:[{term:`스톤 클록`,explanation:`러시아 방공망을 전파로 교란해 드론이 탐지되지 않게 막는 영국의 전자전 시스템이다. 영국이 이 기술의 지식재산권을 우크라이나에 넘겨 현지 생산을 돕는다.`}],
  history:`2022년 러시아의 전면 침공 이후 우크라이나는 서방의 군사·재정 지원에 크게 의존해 왔다. 영국은 초기부터 강경한 대러 지원 노선을 유지해 온 핵심 우방이다. 최근 정권 교체로 앤디 버넘 신임 총리가 취임했다.`,
  players:`젤렌스키 대통령과 우크라이나, 버넘 총리와 영국 정부가 회담의 주역이다. 러시아와 대치하는 우크라이나군, 지원 지속 여부가 불투명한 미국의 태도가 배경 변수다. 유럽 우방국들의 결속도 시험받고 있다.`,
  current:`버넘 총리 취임 후 첫 외국 정상 방문으로 영국이 우크라이나 지지를 재확인하고, 드론·전자전 기술 이전이라는 구체적 지원까지 약속했다. 미국 지원 불확실성 속 유럽의 역할이 커지는 국면이다.`,
  outlook:`스톤 클록 기술 이전과 미사일 요격체 지원이 실제 전장에 반영되는 시점이 관건이다. 러시아의 공세 강도와 미국의 지원 방향이 향후 전황을 좌우한다.`,
  sources:[{title:`Zelensky is first foreign leader to visit Burnham, UK new PM - The Washington Post`,url:`https://www.washingtonpost.com/world/2026/07/27/zelensky-is-first-foreign-leader-visit-burnham-uks-new-prime-minister/`},{title:`Burnham, Zelensky discuss drone projects and missile defence for Kyiv - France 24`,url:`https://www.france24.com/en/europe/20260727-burnham-to-welcome-zelensky-on-first-foreign-leader-visit-to-london-since-taking-office`},{title:`Zelenskyy visits Britain and meets new PM Burnham - ABC News`,url:`https://abcnews.com/International/wireStory/zelenskyy-visit-britain-visit-foreign-leader-burnham-office-135111156`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`中 창신메모리 상장 첫날 470% 폭등…글로벌 반도체 지형 흔들다`,
  metrics:[`상장 첫날 +470%, 시총 4800억 달러`,`아시아 반도체 지수 -7.5%`],
  summary:`중국 최대 메모리 반도체 기업 창신메모리(CXMT)가 상하이 증시 데뷔 첫날 470% 폭등하며 시가총액 4800억 달러에 올라섰다. 최대 420억 달러 조달을 노린 이번 상장은 중국 반도체 굴기의 상징으로, 삼성전자·SK하이닉스가 지배해온 D램 시장에 정면 도전장을 던졌다. 여기에 중국 국영 기업이 반도체 노광장비 양산에 들어갔다는 보도까지 겹치며 글로벌 공급과잉 공포가 번졌다. 그 여파로 일본 키오시아가 18.3%, 대만 미디어텍이 약 10% 급락했고 미국에서도 엔비디아가 5%, 샌디스크가 11% 떨어졌다. AI 수요가 메모리 가격을 떠받친다는 슈퍼사이클 서사가 중국발 증설 앞에서 시험대에 올랐다. 아시아 반도체 지수는 하루 7.5% 빠지며 2025년 4월 이후 최대 낙폭을 기록했다. 중국의 기술 추격이 예상보다 빠르다는 인식이 확산되며 반도체 업계의 판도 변화가 본격화하고 있다.`,
  keyTerms:[{term:`창신메모리(CXMT)`,explanation:`중국 정부가 대규모로 키운 D램 등 메모리 반도체 제조사다. 삼성전자·SK하이닉스가 주도하던 메모리 시장을 빠르게 추격하는 중국 반도체 굴기의 대표 주자다.`}],
  history:`중국은 미국의 반도체 제재에 맞서 정부 주도로 메모리·장비 국산화에 막대한 자금을 투입해 왔다. 창신메모리(CXMT)는 그 대표 주자로 D램 양산 능력을 빠르게 키워 왔다. 이번 상하이 대규모 상장은 축적된 자본과 기술을 과시하는 무대였다.`,
  players:`창신메모리와 중국 정부가 추격의 주역이고, 삼성전자·SK하이닉스·마이크론 등 기존 메모리 3강이 방어에 나선다. 엔비디아 등 AI 반도체 기업과 글로벌 투자자도 파장에 노출됐다. 미국의 대중 반도체 규제 정책이 배경에 깔려 있다.`,
  current:`상장 첫날 470% 폭등과 노광장비 양산 소식이 겹치며 중국의 기술 추격이 시장 예상보다 빠르다는 공포가 확산됐다. 메모리 슈퍼사이클 서사가 흔들리며 글로벌 반도체주가 동반 급락했다.`,
  outlook:`창신메모리의 실제 양산 수율과 기술 수준, 미국의 추가 제재 여부가 판도를 가른다. D램 가격 추이와 기존 강자들의 대응 전략이 향후 관전 포인트다.`,
  sources:[{title:`CXMT: China chipmakers trigger bloodbath in global tech stocks - Fortune`,url:`https://fortune.com/2026/07/28/cxmt-china-chipmakers-trigger-bloodbath-in-global-tech-stocks/`},{title:`US Tech Stocks Set to Fall as Global Chip Selloff Accelerates - Bloomberg`,url:`https://www.bloomberg.com/news/articles/2026-07-28/us-tech-stocks-poised-to-slide-as-global-chip-selloff-deepens`},{title:`Asian chip stocks slide as China competition fears rattle AI trade - Reuters`,url:`https://www.investing.com/news/stock-market-news/samsung-sk-hynix-slide-amid-nvidia-financing-worries-china-competition-4815353`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`프랑스, 2차대전 이후 최대 평시 대피…스페인은 사상 최대 산불`,
  metrics:[`프랑스 22만 명 대피, 올해 11.5만ha 소실`,`프랑스·스페인 이재민 30만 명 이상`],
  summary:`프랑스가 남서부 지롱드 지역 산불로 제2차 세계대전 이후 최대 규모의 평시 대피를 실시했다. 파리 면적의 네 배에 이르는 지역이 불타면서 22만 명이 집과 휴양지에서 대피했다. 산불은 스스로 강풍과 상승기류를 만들어내는 화염 폭풍으로 변하며 예측 불가능하게 번졌다. 프랑스에서는 올해에만 11만5000헥타르가 잿더미가 됐고, 28일에도 보르도 서쪽 대서양 연안 관광지에서 4000명이 추가로 대피했다. 이웃 스페인에서는 아빌라 지역 산불이 5만 헥타르 넘게 태우며 자국 역사상 최대 산불로 기록됐다. 두 나라를 합쳐 30만 명 이상이 삶터에서 밀려났다. 폭염이 다시 몰려오면서 진화 인력이 가까스로 잡아둔 불길이 재확산할 위험이 커지고 있다.`,
  keyTerms:[{term:`화염 폭풍`,explanation:`산불이 스스로 강한 상승기류와 바람을 만들어내며 폭발적으로 번지는 현상이다. 불길이 예측 불가능해지고 진화가 매우 어려워진다.`}],
  history:`남유럽은 기후변화로 여름철 고온·건조가 심해지며 대형 산불이 상시화됐다. 2025년에 이어 2026년 여름에도 폭염과 함께 프랑스·스페인 전역에서 산불이 잇따랐다. 이번 지롱드 산불은 그 정점에 해당한다.`,
  players:`프랑스·스페인 정부와 소방·군 진화 인력, 대피한 주민과 관광객이 직접 당사자다. EU 차원의 공동 대응 체계와 기상당국도 관여한다. 기후변화라는 구조적 요인이 배경에 있다.`,
  current:`프랑스가 2차대전 이후 최대 평시 대피를 단행하고 스페인은 사상 최대 산불을 기록하는 등 피해가 역대급으로 커졌다. 다시 몰려오는 폭염이 재확산 위험을 높이고 있다.`,
  outlook:`폭염 지속 여부와 바람 방향이 진화 성패를 좌우한다. 산불이 대도시로 번질지, 인명·재산 피해가 얼마나 늘지가 향후 며칠의 관건이다.`,
  sources:[{title:`France and Spain wildfires live updates - CNN`,url:`https://www.cnn.com/2026/07/27/world/live-news/france-spain-wildfires-evacuations`},{title:`With wildfires raging in France and Spain, fire crews race against next heat wave - NPR`,url:`https://www.npr.org/2026/07/28/g-s1-135828/europe-wildfires`},{title:`Firefighters race to control massive blazes in France and Spain - PBS News`,url:`https://www.pbs.org/newshour/world/firefighters-race-to-control-massive-blazes-approaching-major-cities-in-france-and-spain`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`전국 폭염중대경보…양산 39.1도, 열대야 일수 역대 최다 경신`,
  metrics:[`경남 양산 낮 최고 39.1도`,`전국 평균 열대야 7.8일 역대 최다`],
  summary:`28일 경남과 전남 광양을 중심으로 폭염중대경보가 발효되며 전국이 펄펄 끓었다. 경남 양산은 낮 최고 39.1도를 기록해 7월 일최고기온 극값 1위이자 올해 최고기온을 갈아치웠다. 최고 체감온도는 양산 38도, 광양읍 37.2도, 경기 여주 금사 36.4도에 달했다. 27일 기준 전국 평균 열대야 일수는 7.8일로 역대 최다 기록을 새로 썼다. 낮 더위뿐 아니라 잠 못 드는 열대야가 이어지며 온열질환자와 가축 폐사 피해가 전국으로 번지고 있다. 폭염과 열대야가 당분간 계속될 전망이어서 고령자와 야외노동자, 농어업인 등 취약계층의 건강과 생계 피해가 우려된다. 장마가 짧게 끝난 뒤 곧바로 찾아온 이번 폭염은 기후변화로 한반도 여름이 길고 극단화하고 있음을 보여준다.`,
  keyTerms:[{term:`열대야`,explanation:`밤사이 최저기온이 25도 아래로 내려가지 않아 잠들기 힘든 무더운 밤을 뜻한다. 오래 이어지면 수면 부족과 온열질환 위험이 커진다.`}],
  history:`한반도는 최근 수년간 여름마다 기록적 폭염과 열대야를 겪으며 온난화 추세가 뚜렷해졌다. 2018년 이후 극한 더위가 잦아지고 열대야 일수도 꾸준히 늘어 왔다. 2026년 여름은 짧은 장마 뒤 곧바로 강한 폭염이 찾아왔다.`,
  players:`기상청과 지자체가 폭염 경보·대응을 담당하고, 고령자·야외노동자·농어업인 등 취약계층이 피해에 직접 노출된다. 축산농가와 에너지 수급 당국도 영향을 받는다.`,
  current:`양산 39.1도 등 7월 극값이 잇따라 경신되고 전국 평균 열대야 일수가 역대 최다를 기록하며 더위가 한계 수준에 이르렀다. 온열질환자와 가축 폐사 피해가 전국으로 확산하고 있다.`,
  outlook:`폭염과 열대야가 당분간 이어질 전망이라 취약계층 건강과 농축산 피해 관리가 시급하다. 전력 수요 급증에 따른 수급 관리도 주요 변수다.`,
  sources:[{title:`전국이 뜨겁다…열대야·온열질환·가축 폐사 피해 확산 - 파이낸셜뉴스`,url:`https://www.fnnews.com/news/202607281634554464`},{title:`2026년 폭염 - 나무위키`,url:`https://namu.wiki/w/2026%EB%85%84%20%ED%8F%AD%EC%97%BC`},{title:`폭염, 단순히 더운 게 아닙니다 - 뉴스핌`,url:`https://www.newspim.com/news/view/20260727001027`}]
}]

  stories:[{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`SK하이닉스, 나스닥 상장 후 첫 실적 발표 앞두고 AI 메모리 슈퍼사이클 기대 고조`,
  metrics:[`나스닥 IPO 조달액 265억 달러(약 36조원)`,`2025년 매출 97.1조원·순이익 42.9조원`],
  summary:`SK하이닉스가 지난 7월 10일 나스닥에 상장(종목코드 SKHY)한 데 이어 오는 29일 상장 후 첫 2분기 실적을 발표한다. 공모가 149달러에 미국주식예탁증서(ADS) 1억7790만 주를 팔아 약 265억 달러를 조달했고, 이는 외국 기업의 미국 증시 상장 사상 최대 규모다. 상장 첫날 주가는 공모가 대비 13% 오른 168.01달러로 마감했다. 회사는 AI 가속기에 쓰이는 HBM 시장에서 올해 1분기 기준 매출 점유율 58%로 압도적 1위를 지키고 있다. 2025년에는 매출 97.1조원, 순이익 42.9조원으로 순이익률 44%를 기록했다. 데이터센터 투자 급증으로 첨단 메모리 공급이 수요를 못 따라가는 상황이 실적을 떠받치고 있다. 다만 상장 16일 만에 나오는 첫 실적이 현재 주가 수준을 정당화할지가 시장의 첫 시험대가 된다.`,
  keyTerms:[{term:`HBM`,explanation:`여러 개의 메모리 칩을 위로 쌓아 데이터를 아주 빠르게 주고받게 만든 고성능 D램이다. AI 학습·추론에 필수라 물량이 부족할 정도로 수요가 몰린다.`}],
  history:`HBM은 원래 그래픽·슈퍼컴퓨터용 특수 메모리였으나 2023년 이후 생성형 AI 붐으로 엔비디아 AI 가속기의 핵심 부품이 되면서 수요가 폭발했다. SK하이닉스는 이 시장에 일찍 뛰어들어 선두를 굳혔다.`,
  players:`SK하이닉스는 HBM 세계 1위 공급사로 엔비디아가 최대 고객이다. 삼성전자·마이크론이 추격 중이며, 이번 미국 상장으로 글로벌 투자자 자금까지 끌어들였다. AI 인프라 투자 규모가 이들의 실적을 좌우한다.`,
  current:`상장 직후 첫 분기 실적이라 시장이 매긴 높은 주가가 실제 이익으로 뒷받침되는지 검증되는 시점이다. 메모리 슈퍼사이클의 지속 여부에 대한 판단 근거가 된다.`,
  outlook:`7월 29일 2분기 실적 발표가 최대 분수령이다. HBM 공급 계약 규모와 하반기 가이던스, 삼성·마이크론의 추격 속도가 관전 포인트다.`,
  sources:[{title:`SK Hynix Just Raised \$26.5 Billion in the Biggest U.S. IPO Ever by a Foreign Company - The Motley Fool`,url:`https://www.fool.com/investing/2026/07/10/sk-hynix-just-raised-265-billion-in-the-biggest-us/`},{title:`SK Hynix Soars 13% on Nasdaq Debut - TechTimes`,url:`https://www.techtimes.com/articles/320235/20260712/sk-hynix-soars-13-nasdaq-debut-hbm-architecture-makes-it-irreplaceable-ai-chips.htm`},{title:`How SK Hynix just pulled off the second-largest U.S. share sale - Fortune`,url:`https://fortune.com/2026/07/11/sk-hynix-us-stock-listing-nasdaq-second-largest-us-share-sale-ai-boom-hbw-memory/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미 내구재 주문 반등·독일 기업심리 개선에 글로벌 증시 안정, 고금리 장기화 굳어져`,
  metrics:[`미국 6월 내구재 주문 +1.6%(5월 -4.5%에서 반등)`,`독일 7월 Ifo 기업환경지수 84.3(전월 84.1)`],
  summary:`27일 글로벌 증시는 미국 내구재 주문 반등과 독일 기업심리 개선에 힘입어 안정세를 보였다. 미국 6월 내구재 주문은 헤드라인 기준 1.6% 늘어 5월의 4.5% 급감에서 반등했다. 국방을 제외한 핵심 자본재 주문도 1.4% 늘며 예상을 웃돌아 기업의 설비·기술 투자가 이어지고 있음을 보여줬다. 이는 경기 침체 우려를 누그러뜨리는 동시에 연방준비제도(Fed)의 금리 인하 시점을 뒤로 미루는 요인이 된다. 독일 7월 Ifo 기업환경지수는 84.1에서 84.3으로 올라 하락세를 끊으며 유로존 제조업 침체가 바닥을 찍었을 가능성을 시사했다. 유럽중앙은행(ECB) 입장에서는 긴축 기조가 경제를 훼손하지 않고 있다는 안도감을 준 셈이다. 종합하면 중앙은행들이 금리를 오래 높게 유지한다는 고금리 장기화 시나리오에 다시 힘이 실렸다.`,
  keyTerms:[{term:`고금리 장기화`,explanation:`물가를 잡기 위해 올린 기준금리를 예상보다 오래 높은 수준으로 유지하는 흐름을 말한다. 대출 이자 부담과 기업 자금 조달 비용이 길게 이어진다는 뜻이다.`}],
  history:`2022년 이후 미국·유럽 중앙은행은 40년 만의 고물가에 맞서 기준금리를 빠르게 올렸다. 시장은 곧 인하가 올 것으로 기대했지만 경제 지표가 예상보다 견조하게 나오면서 인하 시점이 계속 미뤄져 왔다.`,
  players:`미국 연준(Fed)과 유럽중앙은행(ECB)이 금리 결정의 핵심 주체다. 내구재 주문·Ifo 지수 같은 지표가 이들의 판단 근거가 되며, 주식·채권 시장 참가자들이 그 신호에 민감하게 반응한다.`,
  current:`지표가 침체가 아니라 완만한 회복을 가리키면서 조기 인하 기대가 약해졌다. 금리가 오래 유지될수록 성장주와 부채가 많은 기업에 부담이 커진다.`,
  outlook:`다음 연준·ECB 회의와 고용·물가 지표가 인하 시점을 가늠할 열쇠다. 지표가 계속 강하면 인하는 더 늦춰질 수 있다.`,
  sources:[{title:`Global Economy Briefing - July 27, 2026 - Rio Times`,url:`https://www.riotimesonline.com/global-economy-briefing-july-27-2026/`},{title:`Week Ahead: 27 July 2026 - IG Bank Switzerland`,url:`https://www.ig.com/en-ch/news-and-trade-ideas/week-ahead--27-july-2026-260724`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`엔비디아, 오픈AI 데이터센터에 2500억 달러 금융보증 추진…AI 순환 거래 논란`,
  metrics:[`금융보증 규모 약 2500억 달러`,`데이터센터 총사업비 5000억 달러 이상·10GW 규모`],
  summary:`엔비디아가 오픈AI의 대형 데이터센터 사업에 약 2500억 달러 규모의 금융 보증(백스톱)을 제공하는 협상을 벌이고 있다고 월스트리트저널이 26일 보도했다. 이 보증은 투자등급 신용등급이 없는 오픈AI가 유리한 조건으로 자금을 조달하도록 돕는 장치로, 오하이오주에 짓는 10기가와트(GW) 규모 AI 캠퍼스를 위한 것이다. 전체 사업비는 5000억 달러를 넘을 수 있고, 이와 별도로 엔비디아 칩 구매 자금 약 3500억 달러도 논의되고 있다. 오픈AI에는 마이크로소프트·아마존·오라클에서 인프라를 빌리던 구조에서 벗어나 자체 인프라를 갖는 첫걸음이 된다. 엔비디아에는 자사 칩 수요를 수년간 보장받는 거래다. 다만 칩을 파는 엔비디아가 그 칩을 살 고객의 자금까지 대주는 구조여서 AI 진영 내부의 순환 거래 논란이 일고 있다. 투자자 마이클 버리는 돌고 도는 구조라며 거품 위험을 경고했다. 협상은 진행 중이며 최종 타결이 보장된 것은 아니다.`,
  keyTerms:[{term:`순환 거래`,explanation:`돈이 여러 회사 사이를 빙 돌며 서로의 매출과 투자를 부풀리는 구조다. 겉으로는 성장처럼 보여도 실제 수요가 없으면 거품이 될 수 있다는 우려를 낳는다.`}],
  history:`생성형 AI 붐으로 초대형 데이터센터 수요가 폭증했지만, 오픈AI 같은 기업은 자체 자금과 신용이 부족해 인프라를 빌려 써왔다. 최근 엔비디아·소프트뱅크 등이 대규모 자금을 대며 인프라 직접 건설로 방향을 틀고 있다.`,
  players:`엔비디아(칩·보증), 오픈AI(수요), 소프트뱅크 에너지 자회사(건설), 마이크로소프트·아마존·오라클(기존 임대) 등이 얽혀 있다. 각자 AI 인프라 주도권을 노린다.`,
  current:`칩 공급사가 고객의 자금까지 보증하는 구조가 드러나면서 AI 투자가 실수요인지 순환 구조인지를 둘러싼 시장 논쟁이 커졌다. 밸류에이션 거품 경계론이 다시 부상했다.`,
  outlook:`협상 타결 여부와 구체적 조건 공개가 핵심 변수다. 1단계 800MW가 2028년 가동 목표라 실제 착공·자금 조달 진척이 관전 포인트다.`,
  sources:[{title:`Nvidia in talks with OpenAI to guarantee \$250 billion financing for data center, WSJ reports - Yahoo Finance`,url:`https://finance.yahoo.com/technology/ai/articles/nvidia-talks-openai-guarantee-250-233930971.html`},{title:`Nvidia In Talks With OpenAI To Guarantee \$250 Billion Financing For Data Center - Slashdot`,url:`https://news.slashdot.org/story/26/07/27/0517233/nvidia-in-talks-with-openai-to-guarantee-250-billion-financing-for-data-center`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`민주당 8·17 전당대회 앞두고 명청대전 격화…28일 충청 권리당원 투표 시작`,
  metrics:[`전당대회 8월 17일 대전컨벤션센터 개최`,`권리당원 투표 7월 28일 충청권 시작`],
  summary:`더불어민주당 8·17 전당대회를 앞두고 친명(친이재명)계와 정청래 전 대표를 둘러싼 이른바 명청대전 구도가 선명해지고 있다. 배우 김부선의 정청래 지지 선언을 계기로 친명계가 정 전 대표를 향해 반명 공세를 강화했다. 이번 당권 경쟁은 2028년 총선 공천권과 직결돼 이재명 대통령 집권 후반기 국정 동력에 적지 않은 영향을 줄 전망이다. 권리당원 투표는 28일 충청권을 시작으로 순차 진행되고, 후보 합동연설회는 8월 1일 충청권에서 막을 올린다. 새 당대표는 8월 17일 대전컨벤션센터에서 열리는 전국 전당대회에서 최종 확정된다. 계파 간 신경전이 격화하면서 전당대회 이후 당내 통합이 새 지도부의 숙제로 떠오르고 있다.`,
  keyTerms:[{term:`전당대회`,explanation:`정당이 당대표 등 지도부를 뽑고 노선을 정하는 최대 규모의 당내 행사다. 여기서 뽑힌 대표가 공천 등 당의 실권을 쥔다.`}],
  history:`이재명 대통령 당선 이후 민주당은 친명계가 주류를 이뤘다. 지도부 임기 만료로 새 당대표를 뽑는 전당대회가 열리면서 계파 간 주도권 다툼이 표면화됐다.`,
  players:`친명계와 정청래 전 대표 진영이 맞선다. 승자는 2028년 총선 공천권을 쥐게 돼 이재명 정부 후반기 국정 운영과 직결된다.`,
  current:`지지 선언·공세가 이어지며 계파 대립이 가시화됐고, 권리당원 투표 개시로 경쟁이 본격 국면에 들어섰다.`,
  outlook:`8월 1일 충청권 합동연설회, 8월 17일 대전 전당대회가 분수령이다. 결과에 따라 당내 통합과 대야 전략이 갈린다.`,
  sources:[{title:`김부선 정청래 지지선언에 선명해진 명청대전 - 뉴데일리`,url:`https://www.newdaily.co.kr/site/data/html/2026/07/27/2026072700150.html`},{title:`새도약의 시대-정치 이재명 대통령이 구상하는 2026년 대한민국 - 주간한국`,url:`https://weekly.hankooki.com/news/articleView.html?idxno=7150193`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`법원, 윤석열 전 대통령 대선 허위발언에 징역 1년6개월·집행유예 3년 선고`,
  metrics:[`1심 선고 징역 1년 6개월·집행유예 3년`,`확정 시 국민의힘 선거보전금 397억원 반환`],
  summary:`서울중앙지법 형사합의21부는 27일 윤석열 전 대통령의 공직선거법 위반 혐의에 대해 징역 1년 6개월에 집행유예 3년을 선고했다. 재판부는 2021년 12월 관훈클럽 토론회와 2022년 1월 언론 인터뷰에서 한 발언을 모두 허위사실공표로 인정했다. 구체적으로 윤우진 전 용산세무서장에게 특정 변호사를 소개한 사실이 없다는 발언, 이른바 건진법사 전성배씨를 만난 적 없다는 취지의 발언이 유죄로 판단됐다. 재판부는 후보자 본인이 파급력이 큰 자리에서 허위사실을 공표한 행위는 선거인에게 주는 영향이 매우 크다며 죄질이 무겁다고 밝혔다. 앞서 김건희 특검팀은 지난달 8일 징역 2년을 구형한 바 있다. 이 판결이 확정되면 국민의힘은 선거보전금 397억원을 국고에 반환해야 한다. 윤 전 대통령 측이 항소할 가능성이 커 상급심 공방이 이어질 전망이다.`,
  keyTerms:[{term:`허위사실공표`,explanation:`선거에서 후보자가 유권자 판단에 영향을 줄 거짓 사실을 알리는 것으로, 공직선거법상 처벌 대상이다. 유죄가 확정되면 당선 무효나 선거보전금 반환으로 이어질 수 있다.`}],
  history:`이 사건은 2021~2022년 대선 국면에서 윤 전 대통령이 한 발언들이 사실과 다르다며 고발되면서 시작됐다. 이후 김건희 특검 수사로 기소돼 재판이 이어졌다.`,
  players:`윤석열 전 대통령(피고인), 김건희 특검팀(수사·구형), 서울중앙지법 재판부(판단), 국민의힘(선거보전금 반환 당사자)이 핵심이다.`,
  current:`1심에서 유죄가 나오면서 정치적 파장과 함께 거액의 선거보전금 반환 가능성이 현실화됐다. 여야 공방이 격화될 전망이다.`,
  outlook:`윤 전 대통령 측 항소 여부와 상급심 판단이 관건이다. 확정 시 국민의힘의 397억원 반환 절차가 뒤따른다.`,
  sources:[{title:`윤석열 전 대통령, 대선 전 거짓말 징역형 이유 - 머니투데이`,url:`https://www.mt.co.kr/society/2026/07/27/2026072712505818062`},{title:`尹 대선 허위발언 1심 징역형 집유, 확정시 국힘 397억 반환 - 뉴데일리`,url:`https://www.newdaily.co.kr/site/data/html/2026/07/27/2026072700225.html`},{title:`윤석열 건진 몰랐다 발언 허위사실공표 징역형 집유 - 경향신문`,url:`https://www.khan.co.kr/article/202607271444001`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국, 이란 추가 타격 대비 태세 유지 속 협상 여지…중동 확전 위기 지속`,
  metrics:[`미군 추가 전력 중동 재배치`,`후티, 사우디 상대 해상 봉쇄 선언`],
  summary:`26~27일 중동에서는 미국과 이란 사이의 확전 위기가 이어졌다. 마이클 왈츠 유엔 주재 미국 대사는 미국이 추가 공격을 위해 만반의 태세를 갖췄고 더 많은 전력을 중동에 투입했다면서도, 트럼프 대통령이 협상에 다소 여지를 주고 있다고 밝혔다. 가자지구에서는 하마스 무장해제 협상이 교착 상태에 빠지고 이스라엘이 추가로 영토를 장악하면서 대규모 재건 구상이 멀어졌다. 카림 칸 국제형사재판소(ICC) 검사가 가자 전쟁과 관련해 이스라엘 지도부를 기소하려는 움직임을 보이며 파장을 키웠다. 이란과 연계된 예멘 반군 후티는 사우디아라비아를 상대로 봉쇄에는 봉쇄로 맞선다며 해상 봉쇄를 선언했다. 협상과 군사 압박이 동시에 진행되면서 지역 정세의 불확실성이 커지고 있다. 미국이 협상과 타격 사이에서 어느 쪽에 무게를 둘지가 관건이다.`,
  keyTerms:[{term:`확전`,explanation:`국지적 충돌이 더 넓은 지역이나 더 많은 세력이 참여하는 큰 전쟁으로 번지는 것을 말한다. 유가 급등과 세계 경제 충격으로 이어질 수 있다.`}],
  history:`2026년 미국·이스라엘과 이란의 무력 충돌이 격화되며 중동 전역이 불안정해졌다. 가자 전쟁, 하마스·후티 등 이란 연계 세력과의 갈등이 겹쳐 전선이 넓어졌다.`,
  players:`미국(트럼프 행정부)·이스라엘과 이란·하마스·후티가 대치한다. 사우디 등 주변국과 ICC 같은 국제기구도 얽혀 있다.`,
  current:`미국이 추가 타격 태세를 유지하면서도 협상 여지를 언급해 방향이 유동적이다. 후티의 해상 봉쇄 선언으로 물류·유가 리스크가 커졌다.`,
  outlook:`미국의 추가 타격 여부와 협상 재개 신호, 후티 봉쇄 실제 이행이 향방을 가른다. 유가와 해상 물류에 미칠 영향을 주시해야 한다.`,
  sources:[{title:`July 26, 2026 - UN envoy Waltz says Trump giving talks some space - CNN`,url:`https://www.cnn.com/2026/07/26/world/live-news/iran-war-trump`},{title:`Early Edition: July 27, 2026 - Just Security`,url:`https://www.justsecurity.org/149834/early-edition-july-27-2026/`}]

  headline:`전국 체감 38도 폭염·열대야 지속…올여름 온열질환자 1232명·사망 5명`,
  metrics:[`온열질환자 1232명·사망 5명(23일 기준)`,`경산 낮 최고기온 39.9도`],
  summary:`27일 밤 사이 수도권과 영남 내륙, 남·서해안에서 열대야가 나타나는 등 전국이 폭염에 시달리고 있다. 경남 창원과 진주에는 폭염중대경보가 발령됐다. 앞서 7월 12일 경북 경산·포항에 올여름 첫 폭염중대경보가 내려졌고, 경산 낮 기온은 39.9도까지 올랐다. 질병관리청 온열질환 응급실 감시체계에 따르면 23일 기준 올해 전국 온열질환자는 1232명, 이 중 사망자는 5명으로 집계됐다. 올해 6월 1일부터 폭염 특보 체계가 기존 2단계(주의보·경보)에서 3단계(주의보·경보·중대경보)로 강화됐다. 폭염중대경보 단계에서는 건강한 사람도 중증 온열질환에 걸릴 수 있어 낮 시간대 야외활동 자제가 권고된다. 기상청은 당분간 무더위가 이어질 것으로 내다봤다.`,
  keyTerms:[{term:`폭염중대경보`,explanation:`올해 새로 만든 가장 높은 단계의 폭염 특보다. 건강한 사람도 위험할 만큼 더위가 심각할 때 발령되며, 야외활동을 자제하라는 경고다.`}],
  history:`한국은 최근 몇 년간 여름 기온이 반복해서 최고치를 경신해왔다. 기후변화로 폭염 일수와 열대야가 늘자 정부가 대응 체계를 강화해왔다.`,
  players:`기상청(특보 발령), 질병관리청(온열질환 감시), 지자체(무더위쉼터 운영), 야외 근로자·고령자 등 취약계층이 직접 영향을 받는다.`,
  current:`특보 체계를 3단계로 강화한 첫해에 곧바로 중대경보가 잇달아 발령될 만큼 더위가 심각하다. 온열질환 사망자도 나오고 있다.`,
  outlook:`8월 초까지 폭염이 이어질지, 온열질환자 추이가 어떻게 변할지가 관건이다. 취약계층 보호 대책 실효성이 시험대에 오른다.`,
  sources:[{title:`체감온도 38도 폭염에 온열질환 잇따라 - 파이낸셜뉴스`,url:`https://www.fnnews.com/news/202607261530267845`},{title:`2026년 폭염 - 나무위키`,url:`https://namu.wiki/w/2026%EB%85%84%20%ED%8F%AD%EC%97%BC`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`中 문샷AI, 2.8조 파라미터 초거대 모델 킴K3 오픈웨이트 무료 공개`,
  metrics:[`파라미터 규모 2.8조 개`,`공개 시점 7월 27일 0시 UTC`],
  summary:`중국 AI 스타트업 문샷AI(Moonshot AI)가 7월 27일 0시(UTC)에 초거대 언어모델 킴K3(Kimi K3)의 가중치를 오픈웨이트로 무료 공개했다. 파라미터 규모가 2.8조 개에 달하는 대형 모델로, 누구나 내려받아 쓸 수 있다. 오픈웨이트는 모델이 학습한 가중치를 개방해 기업·연구자가 자체 서버에서 자유롭게 실행하고 개조할 수 있게 하는 방식이다. 이는 폐쇄형으로 API만 제공하는 오픈AI·앤스로픽 진영과 뚜렷이 대비되는 전략이다. 중국 기업들이 잇달아 고성능 모델을 개방하면서 미국이 주도해온 AI 생태계에 가격과 접근성 측면에서 압박을 가하고 있다. 개방형 모델의 확산은 AI 기술 주도권 경쟁과 안전성 통제를 둘러싼 논쟁도 함께 키우고 있다. 성능 검증 결과에 따라 시장 판도에 미칠 파장이 달라질 전망이다.`,
  keyTerms:[{term:`오픈웨이트`,explanation:`AI 모델이 학습으로 얻은 핵심 수치(가중치)를 공개해 누구나 내려받아 돌리고 고칠 수 있게 하는 방식이다. 사용료를 받는 폐쇄형과 달리 무료로 접근성을 높인다.`}],
  history:`AI 모델은 오픈AI처럼 가중치를 감추고 API만 파는 폐쇄형과, 메타·중국 기업처럼 가중치를 공개하는 개방형으로 갈려왔다. 중국은 미국의 반도체 규제에 맞서 개방 전략으로 생태계 확장을 노려왔다.`,
  players:`문샷AI 등 중국 스타트업이 개방형을 주도하고, 오픈AI·앤스로픽은 폐쇄형을 유지한다. 개발자·기업이 무료 고성능 모델의 최대 수혜자다.`,
  current:`2.8조 파라미터급 모델이 무료로 풀리면서 폐쇄형 진영의 가격·독점 구조에 직접적 압박이 됐다. 미중 AI 경쟁의 새 국면이다.`,
  outlook:`실제 성능 벤치마크와 기업 채택 속도가 관건이다. 폐쇄형 진영의 가격·전략 대응도 지켜볼 대목이다.`,
  sources:[{title:`AI News Today July 27 2026: 16 Biggest Stories - BuildFastWithAI`,url:`https://www.buildfastwithai.com/blogs/ai-news-today-july-27-2026`},{title:`AI News July 2026: GPT-5.6 Sol, Grok 4.5, SK Hynix IPO - AIToolsRecap`,url:`https://aitoolsrecap.com/Blog/AINewsJuly2026.aspx`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`EU, 구글에 안드로이드 개방 명령…클로드·챗GPT 음성비서 탑재 허용해야`,
  metrics:[`개방 이행 시한 2027년 7월`,`근거 규정 디지털시장법(DMA)`],
  summary:`유럽연합(EU) 집행위원회가 디지털시장법(DMA)에 근거해 구글에 안드로이드 운영체제를 경쟁 AI에 개방하라고 명령했다. 이에 따라 구글은 2027년 7월까지 앤스로픽의 클로드, 오픈AI의 챗GPT 같은 외부 AI가 안드로이드에서 음성 활성화, 화면 맥락 인식, 앱 동작 실행 기능을 쓸 수 있도록 열어야 한다. 디지털시장법(DMA)은 시장 지배적 플랫폼을 게이트키퍼로 지정해 자사 서비스 우대와 폐쇄적 생태계를 금지하는 EU의 규제 틀이다. 이번 조치는 스마트폰 AI 비서 시장에서 구글의 독점적 지위를 정면으로 겨냥한 것이다. AI 비서가 스마트폰 이용의 핵심 관문으로 떠오르는 가운데 EU가 초기부터 경쟁 구도를 강제하려는 시도로 풀이된다. 구글이 어떻게 이행하고 어디까지 반발할지가 향후 AI 플랫폼 경쟁의 향방을 가를 전망이다.`,
  keyTerms:[{term:`디지털시장법(DMA)`,explanation:`덩치 큰 플랫폼 기업이 자기 서비스만 밀어주거나 경쟁사를 막지 못하게 하는 EU의 규제법이다. 위반하면 큰 과징금과 시정 명령을 받는다.`}],
  history:`EU는 구글·애플 등 거대 플랫폼의 독점을 막기 위해 2023년부터 디지털시장법(DMA)을 본격 시행해왔다. 앱스토어·검색에 이어 이제 AI 비서 영역으로 규제가 확대됐다.`,
  players:`EU 집행위(규제), 구글(게이트키퍼), 앤스로픽·오픈AI(개방 수혜 경쟁사), 안드로이드 이용자가 핵심 이해관계자다.`,
  current:`AI 비서가 스마트폰의 핵심 관문이 되는 시점에 EU가 초기부터 개방을 강제했다는 점에서 파급력이 크다. 플랫폼 지배력 경쟁의 분수령이다.`,
  outlook:`2027년 7월 이행 시한까지 구글의 구체적 개방 방식과 반발·소송 여부가 관건이다. 미국·한국 등 다른 규제 당국의 동조 여부도 변수다.`,
  sources:[{title:`AI News Today July 27 2026: 16 Biggest Stories - BuildFastWithAI`,url:`https://www.buildfastwithai.com/blogs/ai-news-today-july-27-2026`},{title:`Innovation in the news July 27, 2026 - Charles McIvor`,url:`https://innovationinthenews.substack.com/p/innovation-in-the-news-july-27-2026`}]

let current = null;
let currentCat = null;
const CAT_ORDER = ['경제', '정치', '기타 이슈'];

function renderSidebar() {
  const list = document.getElementById('date-list');
  list.innerHTML = '';
  BRIEFS.forEach((b, i) => {
    const el = document.createElement('div');
    el.className = 'date-item' + (i === 0 ? ' active' : '');
    el.dataset.tag = b.tag;
    const parts = b.tag.split('-');
    const short = parts[1] + '/' + parts[2];
    el.innerHTML = b.tag;
    el.addEventListener('click', () => showBrief(b.tag));
    list.appendChild(el);
  });
}

function showBrief(tag) {
  current = tag;
  document.querySelectorAll('.date-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tag === tag);
  });
  const brief = BRIEFS.find(b => b.tag === tag);
  if (!brief) return;

  // 카테고리별 그룹핑
  const grouped = {};
  brief.stories.forEach(s => {
    if (!grouped[s.category]) grouped[s.category] = [];
    grouped[s.category].push(s);
  });
  const availableCats = CAT_ORDER.filter(c => grouped[c] && grouped[c].length);
  if (!availableCats.length) return;

  // 기본 카테고리 결정
  if (!availableCats.includes(currentCat)) currentCat = availableCats[0];

  renderContent(brief, grouped, availableCats);
}

function renderContent(brief, grouped, availableCats) {
  const content = document.getElementById('content');
  let html = `<div class="sticky-top">
    <div class="brief-header">
      <div class="bh-eyebrow">Morning Brief</div>
      <h2>${brief.label}</h2>
    </div>`;

  // 탭
  html += '<div class="cat-tabs">';
  availableCats.forEach(c => {
    const cls = c === currentCat ? 'cat-tab active' : 'cat-tab';
    html += `<button class="${cls}" data-cat="${c}">${c}</button>`;
  });
  html += '</div></div>';

  // 선택된 카테고리 기사들
  const stories = grouped[currentCat] || [];
  stories.forEach((s, idx) => {
    if (idx > 0) html += '<hr class="story-divider">';
    html += `<div class="story">
      <div class="story-top">
        <div class="story-headline">${s.headline}</div>
      </div>`;
    if (s.metrics.length) {
      html += '<div class="metrics">';
      s.metrics.forEach(m => { html += `<div class="metric-chip">${m}</div>`; });
      html += '</div>';
    }
    // 요약문에 핵심 개념 밑줄 (출력은 박스 다음)
    let summaryHtml = s.summary;
    if (s.keyTerms && s.keyTerms.length) {
      s.keyTerms.forEach(kt => {
        if (!kt.term) return;
        const safe = kt.term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp(safe, 'g');
        summaryHtml = summaryHtml.replace(re, `<span class="kt-underline">${kt.term}</span>`);
      });
    }

    // 핵심 개념 박스 (요약 위)
    if (s.keyTerms && s.keyTerms.length) {
      html += '<div class="key-terms"><div class="key-terms-title">핵심 개념</div>';
      s.keyTerms.forEach(kt => {
        html += `<div class="kt-item">
          <span class="kt-term">${kt.term}</span>
          <span class="kt-exp">${kt.explanation}</span>
        </div>`;
      });
      html += '</div>';
    }

    html += `<div class="summary">${summaryHtml}</div>`;

    const bgSections = [
      ['역사적 맥락', s.history],
      ['핵심 플레이어', s.players],
      ['현재 구도', s.current],
      ['향후 전망', s.outlook],
    ].filter(([, v]) => v);

    if (bgSections.length) {
      html += '<div class="bg-box"><div class="bg-box-title">배경 스토리</div>';
      bgSections.forEach(([label, text]) => {
        html += `<div class="bg-section">
          <div class="bg-section-label">${label}</div>
          <div class="bg-section-text">${text}</div>
        </div>`;
      });
      html += '</div>';
    }

    if (s.sources.length) {
      html += `<button class="sources-toggle" data-toggle="srcs-${idx}">출처 ${s.sources.length}개 보기 <span class="arrow">▾</span></button>`;
      html += `<div class="sources-body" id="srcs-${idx}">`;
      s.sources.forEach((src, si) => {
        html += `<div class="source-item">
          <span class="src-num">${si+1}</span>
          <a href="${src.url}" target="_blank">${src.title}</a>
        </div>`;
      });
      html += '</div>';
    }
    html += '</div>';
  });

  content.innerHTML = html;

  // 탭 클릭 핸들러
  content.querySelectorAll('.cat-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentCat = btn.dataset.cat;
      renderContent(brief, grouped, availableCats);
    });
  });

  // 출처 토글
  content.querySelectorAll('.sources-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const body = document.getElementById(btn.dataset.toggle);
      const isOpen = body.classList.toggle('open');
      btn.classList.toggle('open', isOpen);
    });
  });

  document.getElementById('main').scrollTop = 0;
}

if (BRIEFS.length > 0) {
  renderSidebar();
  showBrief(BRIEFS[0].tag);
} else {
  document.getElementById('content').innerHTML = '<div class="empty">브리핑 데이터가 없습니다.</div>';
}

// ── Quiz Gate ──
const PASS_TARGET = 3;
let correctCount = 0;
const usedIndexes = new Set();

function pickQuestion() {
  // 사용 안 한 문제 중 랜덤. 다 썼으면 풀 리셋
  if (usedIndexes.size >= QUIZ.length) usedIndexes.clear();
  let idx;
  do { idx = Math.floor(Math.random() * QUIZ.length); } while (usedIndexes.has(idx));
  usedIndexes.add(idx);
  return QUIZ[idx];
}

function updateCounter() {
  document.getElementById('quiz-counter').textContent = `(${correctCount}/${PASS_TARGET})`;
}

function renderQuiz() {
  const q = pickQuestion();
  document.getElementById('quiz-q').textContent = q.q;
  updateCounter();
  const feedback = document.getElementById('quiz-feedback');
  feedback.textContent = '';
  feedback.className = 'quiz-feedback';
  const closeBtn = document.getElementById('quiz-close');
  closeBtn.classList.add('hidden');

  const choicesEl = document.getElementById('quiz-choices');
  choicesEl.innerHTML = '';
  // 보기 순서 섞기 (정답 위치 고정 방지)
  const order = q.a.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  order.forEach(idx => {
    const text = q.a[idx];
    const btn = document.createElement('button');
    btn.className = 'quiz-choice';
    btn.textContent = text;
    btn.addEventListener('click', () => {
      const allBtns = choicesEl.querySelectorAll('.quiz-choice');
      allBtns.forEach(b => b.disabled = true);
      if (idx === q.correct) {
        btn.classList.add('correct');
        correctCount++;
        updateCounter();
        if (correctCount >= PASS_TARGET) {
          feedback.textContent = '통과! 들어와도 좋아.';
          feedback.className = 'quiz-feedback right';
          closeBtn.classList.remove('hidden');
        } else {
          feedback.textContent = '역시 맞출 줄 알았어. 다음 문제 고.';
          feedback.className = 'quiz-feedback right';
          btn.blur();
          setTimeout(() => {
            if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
            renderQuiz();
          }, 900);
        }
      } else {
        btn.classList.add('wrong');
        feedback.textContent = '정말 실망이다.... 다음.';
        feedback.className = 'quiz-feedback wrong';
        btn.blur();
        setTimeout(() => {
          if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
          renderQuiz();
        }, 900);
      }
    });
    choicesEl.appendChild(btn);
  });
}

document.getElementById('quiz-close').addEventListener('click', () => {
  document.getElementById('quiz-overlay').classList.add('hidden');
  document.body.classList.remove('quiz-active');
});

document.body.classList.add('quiz-active');
renderQuiz();

// ── Mobile sidebar toggle ──
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('sidebar-backdrop');
function toggleSidebar(open) {
  sidebar.classList.toggle('open', open);
  backdrop.classList.toggle('open', open);
}
document.getElementById('sidebar-toggle').addEventListener('click', () => toggleSidebar(!sidebar.classList.contains('open')));
backdrop.addEventListener('click', () => toggleSidebar(false));
// 날짜 클릭하면 모바일에서 자동으로 닫히게
sidebar.addEventListener('click', e => {
  if (e.target.classList.contains('date-item') && window.innerWidth <= 768) {
    toggleSidebar(false);
  }
});

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`고유가와 미 금리 인상 우려에 코스피 7,000선 붕괴, 환율 상승`,
  metrics:[`코스피 6,909.91 마감 (-1.76%)`,`원·달러 환율 1,345.9원 (+6.7원)`],
  summary:`9월 11일 코스피 지수가 고유가와 미국의 금리 인상 우려가 겹치며 1.76% 급락한 6,909.91로 마감하여 7,000선 아래로 주저앉았다. 이는 글로벌 인플레이션 압박이 지속됨에 따라 투자 심리가 크게 위축된 결과로 분석된다. 코스닥 역시 1.95% 하락하며 동반 약세를 보였다. 서울 외환시장에서는 안전자산 선호 심리가 강해지며 원·달러 환율이 전날보다 6.7원 오른 1,345.9원을 기록했다. 미국의 근원 물가가 예상보다 높게 나오면서 연방준비제도의 매파적 기조가 유지될 것이란 불안감이 시장을 짓누르고 있다. 당분간 증시의 변동성은 매우 클 것으로 전망된다.`,
  keyTerms:[{term:`안전자산 선호 심리`,explanation:`시장 불확실성이 커질 때, 달러나 금 등 가치 변동이 적고 안전한 자산으로 투자 자금이 몰리는 현상을 뜻해.`}],
  history:`최근 이란 갈등 우려로 국제 유가가 급등하며 글로벌 물가 상승 압력이 다시 커지고 있었어.`,
  players:`글로벌 투자자, 한국은행, 그리고 금리 결정을 앞둔 미국 연방준비제도(Fed)가 주요 변수야.`,
  current:`미국의 핵심 물가 지표가 예상치를 웃돌면서 금리 인상 공포가 한국 증시와 환율에 직접적인 타격을 입힌 상황이야.`,
  outlook:`다음 주 열리는 미 연준의 FOMC 회의 결과에 따라 국내 금융 시장의 방향성이 크게 좌우될 것으로 보여.`,
  sources:[{title:`고금리·고유가 덮치며 코스피 하락 - 연합뉴스TV`,url:`https://www.yonhapnewstv.co.kr/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미 8월 근원 물가 0.3% 상승, 연준의 9월 금리 인상 확률 86%로 급등`,
  metrics:[`미 8월 근원 CPI 0.3% 상승`,`9월 금리 인상 확률 86%`],
  summary:`미국의 8월 소비자물가지수(CPI)가 발표된 가운데, 식료품과 에너지를 제외한 근원 CPI가 전월 대비 0.3% 상승하며 시장 예상치를 상회했다. 물가가 여전히 끈적하다는 사실이 확인되면서, 시장이 예측하는 미국 연방준비제도의 9월 기준금리 인상 확률이 기존 70%대에서 86%까지 급등했다. 이는 연준이 인플레이션을 확실히 잡기 위해 추가 긴축에 나설 가능성이 커졌음을 의미한다. 이번 지표는 물가 안정에 대한 시장의 기대를 꺾어버리는 충격으로 다가왔다. 금리 인상 우려가 고조되면서 국채 금리가 상승하고 시장의 긴장감이 높아지고 있다. 투자자들은 연준의 행보가 글로벌 경제 전반에 미칠 파장에 촉각을 곤두세우고 있다.`,
  keyTerms:[{term:`근원 CPI`,explanation:`가격 변동이 심한 농산물이나 에너지를 제외하고, 물가의 장기적인 추세를 보여주는 핵심 소비자물가지수야.`}],
  history:`미국은 지속적인 금리 인상에도 불구하고 물가 상승세가 연준의 목표치인 2%로 쉽게 내려오지 않는 상황이었어.`,
  players:`금리를 결정하는 미 연준(Fed), 인플레이션의 영향을 받는 기업 및 소비자들이 주요 주체야.`,
  current:`FOMC 회의 직전에 발표된 물가 지표가 예상보다 강하게 나오면서, 금리 동결을 기대했던 시장에 실망감을 안겼어.`,
  outlook:`9월 15~16일로 예정된 FOMC 회의에서 실제 금리 인상 여부와 향후 통화 정책 방향에 대한 연준의 메시지가 주목받고 있어.`,
  sources:[{title:`뜨거운 물가에 9월 인상 베팅 급증 - 로이터`,url:`https://www.reuters.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`글로벌 국채 금리 연중 최고치 돌파, 채권 시장 충격`,
  metrics:[`미 10년물 국채 금리 4.98%`,`미 30년물 국채 금리 5.38%`],
  summary:`국제 유가 급등과 글로벌 인플레이션 장기화 우려로 인해 미국 국채 금리가 연중 최고치로 치솟으며 채권 시장이 큰 충격을 받았다. 미국의 10년 만기 국채 금리는 19년 만에 최고 수준인 연 4.98%를 기록했고, 30년 만기 금리도 연 5.38%까지 급등했다. 유럽중앙은행(ECB) 관계자들 또한 에너지 가격 상승세가 지속될 경우 추가 금리 인상이 필요할 수 있다고 경고했다. 이처럼 주요국 중앙은행들의 긴축 장기화 기조가 뚜렷해지면서, 기존 채권의 가치가 하락하는 채권 시장의 매도세가 가속화되고 있다. 이는 기업들의 자금 조달 비용 증가로 이어져 실물 경제에도 뚜렷한 부담을 줄 전망이다. 정부와 투자자 모두 금리 향방을 예의주시하며 긴장 상태를 유지하고 있다.`,
  keyTerms:[{term:`채권 시장`,explanation:`정부나 기업이 돈을 빌리기 위해 발행한 채권이 거래되는 곳으로, 시중 금리의 움직임을 가장 민감하게 반영해.`}],
  history:`팬데믹 이후 시작된 주요국들의 고강도 금리 인상 사이클이 마무리될 것이란 기대감이 최근 점차 꺾이고 있었어.`,
  players:`막대한 자금을 운용하는 글로벌 채권 투자자들과 유럽중앙은행(ECB), 미 연준 등 주요국 중앙은행들이 얽혀 있어.`,
  current:`이란 갈등 등으로 인한 유가 폭등이 인플레이션을 다시 자극할 것이란 공포가 국채 금리 급등을 촉발했어.`,
  outlook:`각국 중앙은행의 추가적인 매파적 발언이나 물가 상승 지표가 나오면 금리 오름세가 더 가팔라질 수 있어.`,
  sources:[{title:`글로벌 채권 시장 흔들, 유가와 금리 압박 - 블룸버그`,url:`https://www.bloomberg.com/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`호르무즈 해협 파병 압박 속 한국 정부 "결정된 바 없다" 신중론`,
  metrics:[`한-이란 외교장관 통화 1회`,`재외국민 안전 보호 강조`],
  summary:`조현 외교부 장관이 이란 외교장관과의 통화에서 미국의 호르무즈 해협 연합 방위 참여 요구에 대해 아직 결정된 것이 없다며 신중한 입장을 밝혔다. 최근 미국의 거센 호르무즈 해협 파병 압박 속에서, 이란 측이 타국의 군사적 참여를 강력히 경고하고 나서자 한국 정부의 외교적 고민이 깊어지고 있다. 조 장관은 항행의 자유와 해당 지역에 체류 중인 재외국민의 안전을 최우선으로 고려하고 있음을 강조했다. 미국과의 동맹을 유지하면서도 중동 내 주요 교역국인 이란과의 마찰을 피해야 하는 줄타기 외교가 시험대에 올랐다. 이재명 대통령 또한 수석보좌관회의에서 국제 공조의 중요성을 언급하며 국익을 위한 전략적 모호성을 유지하고 있다. 향후 정부가 실리와 명분 사이에서 어떤 최종 선택을 내릴지 정치권의 이목이 집중된다.`,
  keyTerms:[{term:`전략적 모호성`,explanation:`외교 문제에서 어느 한쪽의 편을 명확히 들지 않고, 상황에 따라 유연하게 대처하기 위해 입장을 뚜렷하게 밝히지 않는 태도야.`}],
  history:`미국은 우방국들에게 중동 호르무즈 해협의 항행 안전을 명분으로 연합 함대 참여를 지속적으로 요구해 왔어.`,
  players:`군사적 지원을 압박하는 미국, 이에 반발하는 이란, 그리고 그 사이에서 국익을 저울질하는 한국 정부가 얽혀 있어.`,
  current:`이란 측이 타국의 파병을 적대 행위로 간주하겠다고 엄포를 놓으면서, 한국이 섣불리 결정을 내리기 매우 까다로운 상황이 됐어.`,
  outlook:`미국의 압박 수위와 이란의 반발 사이에서 정부가 최종적으로 어떤 방식의 기여를 선택할지 외교적 결정이 주목돼.`,
  sources:[{title:`조현 장관, 이란과 통화... 파병에 신중 - 연합뉴스`,url:`https://www.yna.co.kr/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`캐나다, 우크라이나에 3억 5천만 달러 규모 방공 미사일 지원 합의`,
  metrics:[`지원 규모 3.5억 CAD`,`사망자 최소 5명 (드론 공격)`],
  summary:`마크 카니 캐나다 총리가 볼로디미르 젤렌스키 우크라이나 대통령과 회담을 가진 후, 우크라이나에 3억 5천만 캐나다 달러 규모의 방공 요격 미사일을 지원하기로 합의했다. 이는 최근 러시아가 우크라이나 파블로그라드 등 민간 지역에 가한 무차별적인 드론 공격으로 사상자가 속출하고 있는 상황에 대응하기 위한 긴급 조치다. 러시아의 계속되는 공세 속에서 서방 진영의 군사적 지원이 우크라이나의 방어력 유지에 필수적인 역할을 톡톡히 하고 있다. 한편, 젤렌스키 대통령은 다가오는 러시아 대선 전에는 전쟁 종식을 위한 어떠한 3자 회담도 응하지 않겠다며 매우 강경한 입장을 고수하고 있다. 우크라이나는 서방의 지원을 바탕으로 방공망을 대폭 확충하며 장기전에 대비한 체력을 비축하고 있다. 이번 지원이 전황을 반전시킬 돌파구가 될 수 있을지 국제사회가 지켜보고 있다.`,
  keyTerms:[{term:`방공 요격 미사일`,explanation:`적의 항공기나 드론, 미사일이 목표물에 도달하기 전에 공중에서 맞혀 파괴하는 방어용 무기 체계야.`}],
  history:`우크라이나 전쟁이 장기화되면서 러시아는 주요 인프라를 노린 공습을 지속해왔고, 우크라이나는 방공망 부족을 호소해왔어.`,
  players:`군사 지원을 제공하는 캐나다 등 서방 국가와 방어를 이어가는 우크라이나, 공세를 늦추지 않는 러시아가 핵심 주체야.`,
  current:`러시아의 집중적인 드론 타격으로 민간 피해가 커지자, 국제사회가 신속하게 방공 무기 추가 지원에 나서고 있어.`,
  outlook:`서방의 방공망 지원이 우크라이나의 영공 방어에 얼마나 실질적인 효과를 발휘할지, 러시아의 추가 도발 여부가 관건이야.`,
  sources:[{title:`캐나다, 우크라에 대규모 방공망 지원 - 로이터`,url:`https://www.reuters.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미 대선 앞둔 트럼프, 우편 투표 제한 행정명령 제동 및 적극적인 선거 지원`,
  metrics:[`9/11 테러 25주년`,`텍사스 등 주요 경합주 유세 집중`],
  summary:`도널드 트럼프 미국 대통령이 다가오는 중간선거를 앞두고 공화당 후보들에 대한 전폭적인 지원 유세에 나서는 한편, 선거 제도와 관련한 치열한 법적 공방을 겪고 있다. 트럼프 대통령은 텍사스를 방문해 박빙의 승부를 벌이고 있는 켄 팩스턴 공화당 후보의 자금 모금을 돕는 등 보수층 결집에 안간힘을 쓰고 있다. 이와 동시에, 그가 강력히 추진했던 우편 투표 제한 관련 행정명령은 연방 항소법원에 의해 집행 정지 결정이 유지되면서 제동이 걸렸다. 9/11 테러 25주년 추모식에서도 트럼프 대통령은 대테러 안보를 강조하며 지지층을 향한 강력한 메시지를 던졌다. 선거일이 불과 8주 미만으로 다가오면서 양당의 정치적 셈법과 갈등이 최고조에 달하고 있다. 투표 방식에 대한 룰 세팅이 최종 선거 결과에 막대한 영향을 미칠 것으로 분석된다.`,
  keyTerms:[{term:`우편 투표`,explanation:`투표소에 직접 가지 않고 우편을 통해 투표용지를 제출하는 방식으로, 미국의 선거 결과에 큰 영향을 미치는 쟁점이야.`}],
  history:`미국 선거에서는 투표의 편의성과 선거 부정 가능성을 두고 민주당과 공화당 간의 제도적 갈등이 오랜 기간 지속되어 왔어.`,
  players:`지지층을 결집하려는 트럼프 대통령과 공화당, 그리고 이에 맞서는 민주당 및 사법부가 팽팽히 맞서고 있어.`,
  current:`선거를 코앞에 두고 법원이 우편 투표 제한에 제동을 걸면서, 선거판의 유불리를 따지는 정치권의 움직임이 분주해졌어.`,
  outlook:`우편 투표 참여율과 경합주의 투표 결과가 다가오는 미국 중간선거의 최종 승패를 가를 핵심 변수가 될 전망이야.`,
  sources:[{title:`트럼프, 선거 앞두고 우편 투표 항소심 패배 - AP 통신`,url:`https://apnews.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`ETRI, '설명 가능한 AI' 개발로 도로 위 쓰러진 사람 실시간 탐지 등 생활 안전 강화`,
  metrics:[`하수처리장 약품 11% 절감`,`설명 가능한 AI 생활 안전 시스템 적용`],
  summary:`한국전자통신연구원(ETRI)이 단순히 결과만 도출하는 것을 넘어 결론의 근거까지 확실히 제시하는 설명 가능한 AI 기술을 성공적으로 개발하여 실생활 안전 분야에 도입하고 있다. 이 혁신적인 기술은 도로 위에 쓰러진 사람을 실시간으로 탐지하거나 불법 쓰레기 투기를 정확히 적발하는 등 시각적 판단의 신뢰성을 크게 높였다. 또한 광주환경공단에서는 하수처리장에 AI 자동제어시스템을 적용해 약품 사용량을 11%나 절감하는 등 AI의 환경적 기여도 가시화되고 있다. 기존 인공지능 모델이 가진 블랙박스의 한계를 극복함으로써, 판단 과정의 투명성이 필수적인 공공 시스템에 도입할 수 있는 길을 열었다. 현재 이 기술은 시각장애인을 위한 안내 로봇 등 섬세하고 민감한 의사결정이 필요한 분야로 발 빠르게 적용이 확대되고 있다. 이는 한국의 AI 기술이 시민의 안전과 직결된 차세대 공공 서비스 혁신을 이끌고 있음을 명확히 보여준다.`,
  keyTerms:[{term:`설명 가능한 AI`,explanation:`인공지능이 어떤 과정을 거쳐 결론을 내렸는지 사람이 이해할 수 있는 형태로 이유와 근거를 보여주는 기술이야.`}],
  history:`기존의 딥러닝 AI는 결과를 내놓는 과정이 투명하지 않은 블랙박스 형태여서, 생명이나 안전과 직결된 분야에 도입하기 어려웠어.`,
  players:`혁신적인 기술을 연구하는 한국전자통신연구원(ETRI)과 이를 실제 공공 안전망에 적용하려는 지자체 및 기관들이 참여하고 있어.`,
  current:`AI가 판단 근거를 시각적으로 명확히 제시할 수 있게 되면서, 위험 상황 판단과 공공 행정에서의 활용도가 급격히 높아졌어.`,
  outlook:`향후 의료, 자율주행, 법률 등 신뢰성이 필수적인 고위험 산업군으로 이 기술의 상용화가 더욱 빠르게 확산될 것으로 기대돼.`,
  sources:[{title:`ETRI, 이유 알려주는 똑똑한 AI로 생활 안전 지킨다 - 연합뉴스`,url:`https://www.yna.co.kr/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`오픈AI, 최첨단 AI 개발 속도 조절 검토 및 글로벌 헬스케어 AI 도입 가속`,
  metrics:[`농부 17% 생성형 AI 활용`,`AI 보안 시장 2028년 77억 달러 전망`],
  summary:`글로벌 인공지능 산업이 전례 없이 급팽창하는 가운데, 안전성과 부작용에 대한 우려로 업계 내부에서 자발적으로 개발 속도를 조절하려는 움직임이 일고 있다. 샘 올트먼 오픈AI CEO는 최첨단 AI 시스템의 잠재적 위험성을 엄중히 고려해 개발 속도를 늦추는 방안을 심도 있게 검토 중이라 밝혔으며, 앤트로픽은 자사 모델이 악용될 뻔한 심각한 사례들을 차단했다고 발표했다. 한편, 실생활에서의 기술 도입은 전방위로 확산되어 글로벌 농부의 17%가 생성형 AI를 업무에 적극 활용하고 있으며, 헬스케어 분야에서는 데이터 기반 예방 의학으로의 패러다임 전환이 빠르게 진행 중이다. 폭발적인 AI 수요와 성장에 따라 데이터센터 확충이 시급해진 마이크로소프트는 서버 용량을 무려 3배 이상 증설하기로 결단했다. 이처럼 산업의 눈부신 혁신을 촉진하는 동시에 안전을 위한 규제라는 두 마리 토끼를 잡기 위한 전 세계적 논의가 바야흐로 본격화되고 있다. 미래 기술 패권과 인류의 안전 사이에서 기업들이 어떻게 균형을 잡을지 귀추가 주목된다.`,
  keyTerms:[{term:`생성형 AI`,explanation:`사용자의 질문이나 요구에 맞춰 텍스트, 이미지, 코드 등 새로운 콘텐츠를 스스로 만들어내는 인공지능이야.`}],
  history:`챗GPT의 등장 이후 글로벌 빅테크 기업들이 AI 패권 경쟁에 뛰어들면서, AI 능력의 발전 속도가 안전 통제 기술을 앞지르고 있다는 지적이 꾸준히 제기돼 왔어.`,
  players:`AI 개발을 주도하는 오픈AI, 앤트로픽 등의 빅테크 기업들과 농업, 의료 등 실제 산업 현장의 사용자들이 중심에 있어.`,
  current:`고도화된 AI가 범죄나 무기 개발에 악용될 가능성이 현실로 나타나면서, 선도 기업들이 자발적으로 속도 조절과 보안 강화를 논의하기 시작했어.`,
  outlook:`각국 정부의 AI 규제 법안 도입과 기업들의 자율적인 안전 가이드라인 마련이 앞으로 AI 산업의 지속 가능성을 결정할 핵심 이슈야.`,
  sources:[{title:`오픈AI, 개발 속도 늦추나... AI 안전성 도마 위 - 블룸버그`,url:`https://www.bloomberg.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`역대 가장 뜨거웠던 8월 기록, 네팔은 '기후 정의' 50억 달러 청구`,
  metrics:[`네팔 50억 달러 기후 기금 요구`,`중국 2026년 석유 수요 8.9% 감소`],
  summary:`기후 변화와 엘니뇨의 파괴적인 영향이 극에 달하면서, 유럽연합 코페르니쿠스 기후변화 서비스는 올해 8월이 관측 사상 가장 더웠던 달로 기록되었다고 공식 발표했다. 지구 온난화로 인한 끔찍한 기상 이변이 속출하는 가운데, 최근 대홍수를 겪은 네팔 정부는 선진국들을 향해 복구 자금으로 50억 달러를 요구하며 이를 기후 정의 문제로 정면 제기했다. 반면, 글로벌 에너지 수요 지형도 구조적으로 변화하여 중국의 2026년 석유 수요는 8.9% 감소한 것으로 나타났으나, 글로벌 석탄 수요는 멈추지 않고 여전히 증가 추세를 보이고 있다. 선진국의 과거 탄소 배출 책임과 현재 피해를 입고 있는 개발도상국의 보상 문제가 강하게 맞물리면서, 국제 사회의 기후 대응 비용 분담 논쟁이 한층 격렬하고 치열해질 전망이다. 이제 기후 재난은 단순한 환경 문제를 넘어 막대한 경제적 손실과 복잡한 외교적 갈등으로 번지는 양상이다. 온실가스 감축이라는 공동의 목표 앞에서 국가 간의 날 선 대립이 어떤 결실을 맺을지 전 세계가 우려 섞인 시선으로 바라보고 있다.`,
  keyTerms:[{term:`기후 정의`,explanation:`기후 변화를 초래한 책임이 큰 선진국이, 피해를 고스란히 떠안는 개발도상국이나 취약 계층을 적극적으로 지원하고 보상해야 한다는 개념이야.`}],
  history:`수십 년간 누적된 온실가스 배출로 인해 지구 평균 기온이 지속적으로 상승하면서 폭염, 홍수 등 극단적인 이상 기후 현상이 전 세계적으로 빈발하고 있어.`,
  players:`화석연료를 많이 소비해 온 선진국 및 산업 국가들과 기후 재난에 무방비로 노출된 개발도상국 정부들이 협상 테이블에 마주 앉아 있어.`,
  current:`네팔과 같은 취약 국가들이 더 이상 자체적인 복구 능력에 의존하지 않고, 국제 사회를 향해 명시적으로 금전적 보상을 요구하는 단계에 이르렀어.`,
  outlook:`앞으로 열릴 유엔 기후변화협약 당사국총회(COP) 등에서 '손실과 피해' 보상 기금의 구체적인 규모와 분담 방식을 둘러싼 선진국과 개도국 간의 치열한 줄다리기가 예상돼.`,
  sources:[{title:`기록적인 폭염 속 네팔, 선진국에 기후 청구서 내밀어 - 로이터`,url:`https://www.reuters.com/`}]
}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`IMF, 중동 전쟁과 에너지 충격 속에서도 올해 세계 경제 3% 성장 전망`,
  metrics:[`3% 경제 성장률`,`유가 6주 만에 최고치`],
  summary:`국제통화기금(IMF)이 올해 세계 경제가 중동 전쟁으로 인한 에너지 충격에도 불구하고 예상보다 잘 버텨내며 약 3% 성장할 것으로 발표했습니다. 인공지능(AI) 기술 혁신이 생산성 향상을 이끌며 긍정적인 활력을 불어넣고 있는 것이 주요 원인으로 꼽힙니다. 반면, 이란을 비롯한 중동 갈등 격화로 에너지 및 식량 가격이 치솟으면서 인플레이션 우려도 동시에 커지고 있습니다. 이처럼 상반된 두 가지 요인이 팽팽하게 맞서며 세계 경제의 흐름을 좌우하고 있습니다. 특히 호르무즈 해협의 긴장감으로 유가가 단기 급등하면서 신흥국 통화 가치에 압박을 가하는 상황입니다. 전문가들은 고물가 상황에서도 급격한 침체 없이 완만한 성장을 잇는 글로벌 경제 연착륙이 지속될지 주목하고 있습니다. 각국 중앙은행은 인플레이션 재발을 막기 위해 금리 인하에 신중한 태도를 보이며 시장 상황을 면밀히 모니터링 중입니다.`,
  keyTerms:[{term:`글로벌 경제 연착륙`,explanation:`고물가나 지정학적 위기 속에서도 경제가 급격히 침체되지 않고 완만한 성장세를 유지하는 상태를 의미합니다.`}],
  history:`코로나19 팬데믹 이후 각국의 막대한 유동성 공급과 최근 중동 분쟁이 겹치면서 전 세계적으로 물가가 요동쳤습니다. 이를 잡기 위해 각국 중앙은행이 고금리 정책을 유지해왔습니다.`,
  players:`세계 경제성장률을 예측하는 국제통화기금(IMF)과 통화 정책을 주도하는 미국 연방준비제도(Fed)가 핵심 주체입니다.`,
  current:`현재 AI 붐이 이끄는 주식 시장의 호조와 에너지 가격 상승에 따른 인플레이션 압력이 동시에 경제를 견인하고 있습니다.`,
  outlook:`연말까지 중동 사태의 확전 여부와 국제 유가 추이에 따라 세계 경제 성장률 전망치가 추가로 조정될 가능성이 있습니다.`,
  sources:[{title:`Global economy holds steady amid Middle East shocks - Reuters`,url:`https://www.reuters.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`트럼프, 캐나다 겨냥 관세 전쟁 경고... 글로벌 채권 금리 수년 내 최고치 급등`,
  metrics:[`미국 채권 금리 수년 내 최고치`,`S&P 500 목표 8,000선 상향`],
  summary:`미국 트럼프 대통령이 SNS를 통해 캐나다를 직접 겨냥하며 무역 관세 인상을 경고해 양국 간의 경제적 긴장감이 최고조에 달했습니다. 이러한 소식과 함께 글로벌 자본 시장에서는 안전 자산 선호 현상이 짙어지며 채권 금리가 수년 만에 최고치로 치솟았습니다. 미국의 보호무역주의가 다시 강화될 것이라는 우려가 커지면서 신흥국 자산 시장과 통화 가치도 연일 하락 압박을 받고 있습니다. 반면, 미국 내 주식 시장은 AI 기업들의 강력한 실적 모멘텀에 힘입어 긍정적인 전망을 유지하고 있습니다. 골드만삭스와 JP모건 등 주요 투자은행들은 S&P 500 지수 목표치를 8,000선 이상으로 상향 조정하며 미국 증시의 독주를 예상했습니다. 결국 무역 갈등으로 인한 채권 시장의 충격과 기술주 중심의 증시 호황이 뚜렷하게 대비되고 있습니다. 투자자들은 다가오는 미 연준(Fed)의 9월 금리 결정에 촉각을 곤두세우고 있습니다.`,
  keyTerms:[{term:`채권 금리`,explanation:`국가나 기업이 돈을 빌릴 때 발행하는 채권에 붙는 이자로, 이 수치가 오르면 시중의 돈이 말라 전반적인 경제에 부담을 줍니다.`}],
  history:`미국 우선주의를 내세우는 트럼프 행정부는 집권 2기 들어 인접국은 물론 글로벌 동맹국들을 상대로 무역 관세 장벽을 대폭 높이고 있습니다.`,
  players:`대미 수출 의존도가 높은 캐나다 정부와 관세 정책을 무기로 압박을 가하는 미국 트럼프 행정부가 대립 중입니다.`,
  current:`보호무역주의 기조가 강해지면서 채권 시장이 민감하게 반응하고 있으며, 이는 글로벌 자본 유출입에 직접적인 영향을 주고 있습니다.`,
  outlook:`다가오는 9월 미 연방준비제도의 연방공개시장위원회(FOMC) 회의 결과에 따라 채권 시장과 증시의 방향성이 다시 한번 크게 요동칠 것입니다.`,
  sources:[{title:`Global bond yields jump amid US-Canada tariff tensions - Bloomberg`,url:`https://www.bloomberg.com/`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`한국 정부, 미국과 1,000억 달러 규모 에너지 투자 협상 막바지 돌입`,
  metrics:[`1,000억 달러 규모 투자`,`원전 8기 프로젝트`],
  summary:`김정관 산업통상자원부 장관이 미국을 방문해 대미 1,000억 달러(약 134조 원) 규모의 초대형 에너지 투자 협상을 마무리 짓고 있습니다. 이번 협상에는 원자력 발전소 8기 건설과 대규모 천연가스 프로젝트가 포함된 것으로 알려졌습니다. 이는 한국이 30%가량의 수익을 낼 수 있는 '한국형 원전' 펀드를 통해 미국 시장에 교두보를 마련하는 중대한 성과로 평가됩니다. 특히 핵추진잠수함 건조를 위한 국제원자력기구(IAEA)와의 협의 절차 착수 소식까지 겹치면서 국내 에너지 산업의 위상이 한층 높아지고 있습니다. 이번 협력을 통해 독자적인 원전 밸류체인을 구축하고, 글로벌 원전 르네상스 시대를 주도하겠다는 것이 정부의 계획입니다. 현재 양국 정부 간의 실무 합의가 거의 마무리 단계에 접어들어 최종 서명만을 남겨둔 상태입니다. 전문가들은 성공적인 계약 체결 시 관련 국내 기업들의 막대한 경제적 파급 효과를 예상하고 있습니다.`,
  keyTerms:[{term:`원전 밸류체인`,explanation:`원자력 발전소의 설계부터 핵심 부품 제조, 건설, 운영, 그리고 유지보수에 이르는 전체 산업 생태계와 공급망을 말합니다.`}],
  history:`과거 탈원전 정책 이후 위축되었던 국내 원전 산업이 최근 글로벌 에너지 안보 위기와 탄소 중립 기조를 타고 다시 강력한 수출 산업으로 육성되고 있습니다.`,
  players:`대규모 에너지 인프라 투자를 유치하려는 미국 정부와 이를 통해 수익 창출 및 산업 부흥을 노리는 한국 산업통상자원부가 주도하고 있습니다.`,
  current:`한국의 시공 능력과 미국의 원천 기술이 결합하는 형태로, 역대 최대 규모의 단일 에너지 투자 프로젝트가 성사되기 직전입니다.`,
  outlook:`협상이 성공적으로 타결되면 한국 원전 관련 기업들의 주가 및 실적 상승과 함께 유럽 등 추가적인 해외 수주 가능성도 크게 열릴 전망입니다.`,
  sources:[{title:`대미 1천억 달러 에너지 투자 협상 막바지... K원전 르네상스 - 매일경제`,url:`https://www.mk.co.kr/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국과 이란 군사 충돌 격화, 중동 내 미군 표적 대상 보복 공격 감행`,
  metrics:[`중동 내 미군 표적 타격`,`미국 부통령 '전쟁' 단어 사용 자제`],
  summary:`미국이 중동 지역의 긴장 완화를 명분으로 이란의 주요 레이더 기지를 선제 타격하자, 이란이 즉각 보복 공격을 감행하며 군사 충돌이 격화되고 있습니다. 이란은 무인 드론과 미사일을 동원해 쿠웨이트와 바레인 등에 위치한 미군 및 동맹국 표적들을 공격했습니다. 양국 간의 전면전 우려가 확산되면서 국제 사회는 중동 정세의 급격한 악화에 촉각을 곤두세우고 있습니다. JD 밴스 미국 부통령은 사태 악화를 막기 위해 공식적으로 '전쟁'이라는 표현을 자제하며 외교적 해결의 여지를 남겼습니다. 그러나 트럼프 대통령은 이 사태로 촉발된 극심한 지정학적 리스크 때문에 단기간에 국제 유가가 진정되기는 어려울 것이라고 언급했습니다. 현재 중동 해상 운송로의 마비 우려와 맞물려 글로벌 공급망도 크게 위협받는 상황입니다. 유엔(UN)과 주요 국가들은 양측의 즉각적인 무력 사용 중단과 대화를 촉구하고 있습니다.`,
  keyTerms:[{term:`지정학적 리스크`,explanation:`국가 간의 정치적, 군사적 갈등이나 지리적 요인이 세계 경제와 금융 시장, 특히 유가나 공급망 등에 미치는 위험을 뜻합니다.`}],
  history:`미국과 이란은 핵합의 파기 이후 수년간 군사적, 경제적으로 대립해 왔으며, 최근 이스라엘-하마스 전쟁 여파로 대리전 양상을 띠다 직접 충돌로 번졌습니다.`,
  players:`군사적 타격을 감행한 미군과 이에 미사일로 반격하는 이란 혁명수비대, 그리고 주변 중동 국가들이 복잡하게 얽혀 있습니다.`,
  current:`쌍방의 군사적 타격이 현실화되면서 호르무즈 해협을 비롯한 주요 석유 운송로가 막힐 수 있다는 공포가 극에 달해 있습니다.`,
  outlook:`이란의 추가 보복 수위와 미국의 대응 방안에 따라 중동 지역 전체를 아우르는 전면적인 국지전으로 확대될 가능성을 배제할 수 없습니다.`,
  sources:[{title:`US and Iran exchange strikes as Middle East conflict escalates - AP News`,url:`https://apnews.com/`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국 대통령 특사단, 모스크바와 키이우 연이어 방문하며 우크라이나 평화 협상 타진`,
  metrics:[`전쟁 발발 이후 첫 셔틀 외교`,`수도 외곽 여전한 교전`],
  summary:`트럼프 행정부의 핵심 외교 라인인 재러드 쿠슈너를 포함한 미국 대통령 특사단이 모스크바와 키이우를 연달아 방문하며 우크라이나 전쟁 종식을 위한 행보를 본격화했습니다. 특사단은 푸틴 러시아 대통령과 비공개 회담을 가진 직후, 전쟁 발발 이후 처음으로 키이우를 방문해 젤렌스키 대통령과도 만났습니다. 이는 교착 상태에 빠진 전쟁을 끝내기 위해 강대국들이 직접 중재에 나섰음을 보여주는 중요한 상징적 사건입니다. 당장 휴전이 성사되지는 않았으나, 양국 간의 요구 조건을 조율하기 위한 고위급의 물밑 접촉이 실질적으로 시작되었다는 평가를 받습니다. 그럼에도 불구하고 우크라이나 수도 외곽과 동부 전선에서는 여전히 치열한 교전이 멈추지 않고 있습니다. 전문가들은 러시아의 점령지 인정 여부를 두고 양측의 입장 차이가 워낙 커서 단기간에 타결되기는 어려울 것으로 보고 있습니다. 향후 유럽연합(EU)의 중재 역할이 어떻게 작용할지가 중요한 변수로 남았습니다.`,
  keyTerms:[{term:`물밑 접촉`,explanation:`공식적인 외교 채널을 통하지 않고 특사나 정보기관 등을 통해 비밀리에 당사자들끼리 의견을 나누고 협상을 시도하는 것을 말합니다.`}],
  history:`수년째 이어진 우크라이나 전쟁은 양측 모두 막대한 인명 피해와 경제적 타격을 입었으나, 뚜렷한 전선 변화 없이 소모전 양상으로 접어들었습니다.`,
  players:`영토 탈환을 목표로 하는 우크라이나 정부, 현 점령지를 고수하려는 러시아, 그리고 종전을 강하게 압박하는 미국 트럼프 행정부가 주역입니다.`,
  current:`미국이 직접 특사단을 파견하여 최고 지도자들을 만남으로써 종전을 향한 정치적 압박이 그 어느 때보다 강해진 상황입니다.`,
  outlook:`이번 방문을 계기로 공식적인 휴전 회담 일정이 잡힐지, 혹은 군사적 우위를 점하기 위한 양국의 막바지 대공세가 벌어질지 주목됩니다.`,
  sources:[{title:`Trump envoys meet Putin and Zelenskyy in push for peace talks - BBC`,url:`https://www.bbc.com/`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`이재명 대통령 '연임' 발언 및 국무위원 후보자 논란으로 정국 경색 심화`,
  metrics:[`지지율 8주 연속 하락`,`장관 후보자 2명 사퇴 거부`],
  summary:`이재명 대통령이 해외 순방 중 언급한 헌법상 임기 관련 발언을 두고 정치권에서 연임용 개헌 의도가 아니냐는 거센 논란이 일고 있습니다. 야당은 이를 강력히 비판하며 정부를 압박하고 있으나, 일부 언론은 현실적으로 개헌이 불가능하다며 선을 그었습니다. 여기에 더해 김승원, 용혜인 등 주요 장관 후보자들을 둘러싼 청탁 및 부당 이득 수령 의혹이 터져 나오면서 정국은 한층 더 얼어붙었습니다. 특히 국회에서 열린 경제 분야 대정부질문에서는 여야가 정책 검증보다 후보자들의 자질을 두고 원색적인 폭로전을 벌이며 정면 충돌했습니다. 논란의 중심에 선 후보자들은 각종 의혹을 전면 부인하며 자진 사퇴를 거부하고 있어, 청와대의 인사 검증 시스템에 대한 비판도 커지고 있습니다. 이러한 정치적 난맥상이 겹치면서 대통령의 국정 지지율은 8주 연속 하락하며 최저치를 갱신했습니다. 정부가 이 위기를 어떻게 돌파하고 민생 법안 처리를 이어갈 수 있을지 귀추가 주목됩니다.`,
  keyTerms:[{term:`대정부질문`,explanation:`국회의원들이 본회의에 국무총리나 장관들을 출석시켜 국정 운영 전반이나 특정 사회적 현안에 대해 직접 묻고 답변을 듣는 절차입니다.`}],
  history:`새 정부 출범 이후 잇따른 인사 잡음과 여야의 극단적인 대립이 누적되면서 국정 동력이 지속적으로 상실되어 왔습니다.`,
  players:`임기 연장 논란에 휩싸인 대통령실, 후보자 사퇴를 방어하는 여당, 그리고 연일 맹공을 퍼붓는 야당과 폭로에 나선 무소속 의원들이 대립 중입니다.`,
  current:`장관 후보자들의 자진 사퇴 거부로 인해 인사 청문회 일정이 마비되었고, 경제 정책 논의마저 폭로전에 묻혀 실종된 상태입니다.`,
  outlook:`청와대가 결단하여 후보자 지명을 철회할지, 아니면 임명을 강행하여 야당과의 전면전을 불사할지에 따라 향후 정국 주도권이 결정될 것입니다.`,
  sources:[{title:`이 대통령 '연임' 발언 파장... 여야 대정부질문서 충돌 - 연합뉴스`,url:`https://www.yna.co.kr/`},{title:`국회 달구는 폭로전과 파행 - 조선일보`,url:`https://www.chosun.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`앤스로픽(Anthropic) 핵심 연구원 사임, 통제 불능 '재귀적 자가 개선' 초지능 경고`,
  metrics:[`10년 내 인류 파멸 확률 10% 이상`,`주요 연구진 연쇄 이탈`],
  summary:`세계 최고 수준의 인공지능(AI) 스타트업 앤스로픽(Anthropic)의 핵심 연구원이 AI의 급격한 발전에 따른 실존적 위협을 경고하며 전격 사임했습니다. 제이콥 콕슨을 비롯한 이탈 연구원들은 거대 기술 기업들이 인간의 생명을 담보로 무모한 개발 도박을 벌이고 있다고 맹비난했습니다. 특히 AI가 스스로 코드를 수정하고 지능을 기하급수적으로 끌어올리는 재귀적 자가 개선 기술이 상용화될 경우, 인간이 통제할 수 없는 초지능이 탄생할 것이라고 우려했습니다. 업계 내부에서도 이러한 초지능을 인간의 가치관과 일치시키는 '정렬(Alignment)' 문제가 전혀 해결되지 않았다는 충격적인 고백이 이어졌습니다. 일부 전문가는 현 추세라면 10년 이내에 인류가 돌이킬 수 없는 재앙을 맞을 확률이 10%를 넘는다고 예측했습니다. 이 사건을 계기로 실리콘밸리는 물론 전 세계 주요 국가의 정치권에서 강력한 AI 규제 기구를 설립해야 한다는 목소리가 폭발적으로 커지고 있습니다. 기업들의 혁신 속도와 윤리적 안전망 구축 사이의 딜레마가 최고조에 달했습니다.`,
  keyTerms:[{term:`재귀적 자가 개선`,explanation:`인공지능이 스스로 자신의 소스 코드를 분석하고 개량하여 단기간에 능력을 폭발적으로 끌어올리는 인공지능의 진화 방식을 의미합니다.`}],
  history:`최근 2년간 거대 언어 모델(LLM)이 인간의 지적 능력을 뛰어넘기 시작하면서, AI가 스스로 진화하는 특이점 도래에 대한 우려가 꾸준히 제기되었습니다.`,
  players:`AI 성능을 극한으로 끌어올리려는 글로벌 빅테크 기업들과 이를 위험하다고 판단해 규제를 촉구하는 AI 안전성 연구자들이 충돌하고 있습니다.`,
  current:`막대한 자본이 투입된 AI 개발 경쟁이 가속화되는 가운데, 내부에서 위험성을 인지한 핵심 개발자들의 내부 고발과 이탈이 가시화되고 있습니다.`,
  outlook:`이번 사태를 통해 미국 연방 정부 차원의 AI 개발 모라토리엄(일시 중단)이나 초지능 모델 개발에 대한 강력한 법적 규제가 도입될 가능성이 높습니다.`,
  sources:[{title:`Anthropic researchers resign over 'recursive self-improvement' AI fears - WSJ`,url:`https://www.wsj.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`뉴욕시 초·중학교 AI 전면 금지 조치 및 직장인 인지 능력 퇴화 우려 확산`,
  metrics:[`뉴욕시 유치원~중학교 100% 금지`,`전문가 62% 직관 우선 지지`],
  summary:`미국 최대 학군인 뉴욕시 교육청이 불과 몇 달 전의 허용 지침을 뒤집고, 유치원부터 중학교까지 교내에서 생성형 AI 도구의 사용을 전면 금지했습니다. 이는 무분별한 AI 사용이 어린 학생들의 비판적 사고와 학습 능력을 저해할 수 있다는 학부모와 교육자들의 강한 우려가 반영된 결과입니다. 이와 동시에, 성인 비즈니스 전문가들을 대상으로 한 대규모 조사에서도 AI 의존으로 인해 인간 고유의 사고력이 떨어지는 인지적 위축 현상이 심각한 문제로 대두되었습니다. 전 세계 전문가 2,500명 중 절반 이상은 창의적이고 도덕적인 판단이 필요한 영역에서는 여전히 인간의 직관이 기계보다 우선되어야 한다고 응답했습니다. 기술의 발전이 인류에게 편리함을 주었지만, 반대로 스스로 생각하고 판단하는 뇌의 근육을 퇴화시키고 있다는 경고음이 울리고 있습니다. 고등학생 이상에게만 제한적으로 AI 리터러시 교육을 제공하기로 한 뉴욕시의 결정은 다른 국가들의 교육 정책에도 큰 영향을 미칠 전망입니다. 기술 활용과 인간 본연의 인지 능력 보존 사이의 균형 찾기가 사회적 화두로 떠올랐습니다.`,
  keyTerms:[{term:`인지적 위축`,explanation:`인공지능이나 디지털 기기에 지나치게 의존한 나머지, 인간 스스로 고민하고 비판적으로 사고하는 뇌의 능력이 점차 무뎌지는 현상을 말합니다.`}],
  history:`ChatGPT 등 AI가 일상과 교육 현장에 빠르게 도입되면서 초반에는 환호가 컸으나, 점차 표절, 창의력 저하, 기계 의존증 등 부작용이 속출했습니다.`,
  players:`편리한 에듀테크 도입을 찬성하는 기술 진영과, 학생들의 기초 학습 능력을 보호하려는 교육 당국 및 학부모 단체가 대립각을 세웠습니다.`,
  current:`미국 뉴욕시가 선제적으로 강경한 금지 조치를 내리면서, 기술 만능주의에 제동을 걸고 인간 중심의 교육을 복원하려는 움직임이 확산 중입니다.`,
  outlook:`이번 조치를 신호탄으로 미국 내 다른 주와 유럽 등 글로벌 교육계에서 연령별 AI 접근 제한 및 가이드라인 제정이 도미노처럼 이어질 것으로 예상됩니다.`,
  sources:[{title:`NYC bans AI in schools amid fears of cognitive decline - NYT`,url:`https://www.nytimes.com/`}]
},{
  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`KAIST 연구진, 사람의 뇌파를 읽고 스스로 행동을 교정하는 '신경 가치 정렬' AI 기술 개발`,
  metrics:[`무의식적 뇌파 반응 분석`,`로봇 오작동 실시간 감지`],
  summary:`한국과학기술원(KAIST) 연구팀이 마이크로소프트와 협력하여 사람의 뇌파를 분석해 인공지능이 자신의 실수를 스스로 깨닫고 행동을 고치는 혁신적인 기술을 세계 최초로 개발했습니다. 이 기술은 기계가 예상치 못한 오작동을 했을 때, 인간의 뇌에서 찰나의 순간 발생하는 무의식적인 예측 오차 신호를 실시간으로 포착합니다. 이를 통해 복잡한 프로그래밍이나 음성 명령 없이도 AI가 인간의 의도를 자연스럽게 이해하고 즉각적으로 반응을 수정할 수 있습니다. 핵심 원리인 신경 가치 정렬을 활용하여 기계의 가치 판단 체계를 인간과 가장 흡사한 수준으로 동기화하는 데 성공한 것입니다. 이 기술은 향후 산업용 로봇뿐만 아니라 가정용 도우미 로봇과 자율주행차 등 다양한 실생활 기기에 접목되어 인간과 기계 간의 소통 방식을 완전히 바꿔놓을 것으로 기대됩니다. 더불어 사용자의 밀접한 취향 정보만 선별해 저장하는 초고효율 맞춤형 AI 모델까지 국내에서 개발되면서 한국의 기술 자립도가 높아지고 있습니다. 글로벌 기술 패권 경쟁 속에서 국내 연구진의 쾌거가 큰 주목을 받고 있습니다.`,
  keyTerms:[{term:`신경 가치 정렬`,explanation:`로봇이나 인공지능의 행동을 통제할 때, 인간의 뇌파 신호를 직접 읽어내어 기계의 판단 기준을 사람의 의도와 일치시키는 기술입니다.`}],
  history:`기존의 인공지능 제어 방식은 사람이 직접 코드를 수정하거나 음성/텍스트로 명령을 내려야 해서, 기계가 실수를 바로잡는 데 시차가 존재했습니다.`,
  players:`독자적인 AI 원천 기술을 확보하려는 국내 KAIST 연구진과 글로벌 빅테크인 마이크로소프트의 아시아 연구소가 핵심 주도 세력입니다.`,
  current:`인간의 뇌-컴퓨터 인터페이스(BCI) 기술이 비약적으로 발전하면서, 생각만으로 기계의 미세한 움직임까지 조율할 수 있는 단계에 진입했습니다.`,
  outlook:`상용화 단계에 접어들면 언어 장벽이나 물리적 제약 없이 누구나 직관적으로 첨단 로봇과 AI를 다룰 수 있는 새로운 인터페이스 시대가 열릴 전망입니다.`,
  sources:[{title:`사람 뇌파 읽고 실수 고치는 AI 등장... KAIST 혁신 기술 개발 - KBS`,url:`https://news.kbs.co.kr/`}]
}]

  colorBg:`#e8f0fe`,
  headline:`유럽중앙은행 추가 금리 인상 유력... 미 연준도 매파적 기조 속 금리 인상 저울질`,
  metrics:[`유럽중앙은행(ECB) 예금 금리 2.50% 예상`,`미국 연준(Fed) 기준금리 4.25%~4.50% 전망`],
  summary:`미국과 이란 간의 분쟁 등 지정학적 위기로 인한 유가 상승 여파로 전 세계 주요 중앙은행들의 셈법이 복잡해지고 있어. 특히 유럽중앙은행(ECB)은 지속되는 인플레이션 압력에 대응하기 위해 오늘 통화정책회의에서 예금 금리를 2.50%로 인상할 것이 확실시되고 있지. 미국 연준(Fed) 또한 최근 잭슨홀 미팅에서 매파적 발언이 나온 이후, 9월을 시작으로 연내 추가적인 금리 인상을 단행할 것이라는 전망이 우세해. 이는 중동발 에너지 쇼크로 인한 물가 상승을 억제하기 위한 고육지책으로 풀이돼. 투자자들은 당장 오늘 밤 발표될 미국의 생산자물가지수(PPI)에 주목하며 향후 글로벌 통화정책의 방향성을 가늠하고 있어.`,
  keyTerms:[{term:`매파적`,explanation:`물가 안정을 위해 금리 인상과 통화 긴축을 선호하는 성향을 뜻해.`}],
  history:`코로나19 팬데믹 이후 인플레이션을 잡기 위해 전 세계적으로 공격적인 금리 인상이 있었으나, 최근 다시 물가 불안 요소가 대두되었어.`,
  players:`미국 연방준비제도(Fed)와 유럽중앙은행(ECB), 일본은행(BOJ) 등 주요국 중앙은행들이 핵심 행위자야.`,
  current:`미국-이란 갈등으로 국제 유가가 치솟으며 물가 상승 압력이 다시 커지고 있는 상황이야.`,
  outlook:`오늘 밤 발표될 미국 PPI 결과와 9월 연준 FOMC 회의 결과에 따라 글로벌 증시 변동성이 확대될 전망이야.`,
  sources:[{title:`글로벌 경제 성장 및 통화정책 전망 - 커먼웰스은행`,url:`https://www.commbank.com.au`},{title:`미국 인플레이션 및 금리 정책 분석 - 트레이딩뷰`,url:`https://www.tradingview.com`}]

  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`코스피 33거래일 만에 7,000선 돌파... 원·달러 환율은 1,330원대로 하락`,
  metrics:[`코스피 7,051.64 마감`,`원/달러 환율 1,336.1원 (22개월 최저치)`],
  summary:`국내 주식시장이 반도체와 이차전지 대형주들의 강세에 힘입어 코스피 7,000선을 가뿐히 돌파했어. 기관의 대규모 매수세가 지수 상승을 견인하며 33거래일 만에 의미 있는 기록을 세운 거야. 동시에 외환시장에서는 일본은행의 추가 금리 인상 기대감으로 엔화가 강세를 띠면서, 원·달러 환율이 크게 하락해 1,330원대에 진입했어. 이는 약 22개월 만에 가장 낮은 수준으로 수입 물가 안정에는 긍정적인 신호야. 다만, 국제 유가 급등과 미 국채금리 상승 등 대외 변동성 요인이 여전히 남아 있어 안심하기엔 일러.`,
  keyTerms:[{term:`원·달러 환율`,explanation:`미국 달러화에 대한 원화의 교환 비율로, 환율이 하락하면 수입 물가 부담이 줄어드는 효과가 있어.`}],
  history:`오랜 기간 박스권에 머물던 코스피가 최근 반도체 등 수출 주력 산업의 호조로 상승 탄력을 받고 있어.`,
  players:`외국인과 기관 투자자들의 수급 동향, 그리고 일본은행(BOJ)의 정책 변화가 주요 변수야.`,
  current:`국내 증시의 호조와 환율 하락이 겹치며 내수와 수출 시장 모두 새로운 국면을 맞이하고 있어.`,
  outlook:`향후 미국의 금리 결정과 중동 사태 전개에 따라 외국인 자금 이탈 여부가 증시의 방향을 결정할 거야.`,
  sources:[{title:`코스피 7,000선 탈환 및 시황 - 다음 금융`,url:`https://finance.daum.net/`},{title:`원달러 환율 1,330원대 진입 분석 - FN타임즈`,url:`https://www.fntimes.com`}]
},{
  category:`경제`,
  colorFg:`#1a6ef5`,
  colorBg:`#e8f0fe`,
  headline:`미국, 한국산 반도체에 표적 관세 압박... 국내 클러스터 대신 미국 투자 요구`,
  metrics:[`한국산 반도체 대상 표적 관세 부과 위협`,`국내 대형 반도체 클러스터 투자금의 미국 본토 이전 압박`],
  summary:`미국 정부가 한국산 반도체에 이른바 표적 관세를 매기겠다며 압박 수위를 높이고 있어. 이는 한국 기업들이 계획 중인 대규모 국내 반도체 클러스터 투자액을 미국 본토로 돌리도록 강제하기 위한 조치로 해석돼. 경제 안보를 명분으로 내세운 미국의 자국 우선주의가 노골화되면서, 국내 핵심 산업인 반도체 업계에는 비상이 걸렸어. 자칫 막대한 관세 부담을 안거나 국내 투자 계획을 전면 수정해야 할 위기에 처했기 때문이야. 정부와 반도체 업계는 긴급 대책 회의를 열고 미국의 압박에 대응할 시나리오를 고심하고 있어.`,
  keyTerms:[{term:`표적 관세`,explanation:`특정 국가나 품목을 겨냥해 불이익을 주기 위해 징벌적으로 부과하는 높은 세율의 관세를 의미해.`}],
  history:`미국은 칩스법(Chips Act) 시행 이후 자국 내 반도체 생산망 구축을 위해 동맹국 기업들에게도 투자를 압박해 왔어.`,
  players:`미국 상무부와 한국 정부, 그리고 삼성전자, SK하이닉스 등 국내 반도체 핵심 기업들이 연관되어 있어.`,
  current:`단순한 보조금 당근을 넘어 관세라는 채찍을 꺼내들며 미국 본토 투자를 강요하는 험악한 분위기야.`,
  outlook:`한국 정부의 외교적 협상 결과와 반도체 기업들의 투자 계획 변경 여부가 향후 산업 경쟁력을 좌우할 전망이야.`,
  sources:[{title:`미국 반도체 관세 압박 및 국내 영향 - HK한타임즈`,url:`https://hkhantimes.com`},{title:`반도체 투자 압박에 정부 긴급 대책 마련 - 선데이저널`,url:`https://sundayjournal.kr`}]
},{
  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미국의 호르무즈 파병 요구에 정치권 충돌... 파병 반대 촛불집회 예고`,
  metrics:[`미국 트럼프 대통령, 11월까지 파병 요구`,`정부, 비전투 최소 전력 파병 검토 중`],
  summary:`미국 트럼프 대통령이 11월까지 호르무즈 해협에 한국군 파병을 강력히 요구하면서 국내 정치권이 발칵 뒤집혔어. 국회 대정부질문에서는 미국의 압박에 굴복할 수 없다는 야당과 한미 동맹의 실익을 챙겨야 한다는 여당이 치열하게 맞붙고 있지. 정부는 전투 부대가 아닌 비전투 최소 전력을 파병하는 절충안을 검토 중이지만 논란은 사그라지지 않고 있어. 이 와중에 시민단체들은 파병이 국가 안보를 위험에 빠뜨릴 수 있다며 오늘 저녁 서울 도심에서 대규모 촛불집회와 평화행진을 예고했어. 프랑스를 국빈 방문하고 귀국하는 이재명 대통령에게 이번 파병 정국은 가장 시급한 외교·안보 시험대가 될 전망이야.`,
  keyTerms:[{term:`대정부질문`,explanation:`국회의원들이 국정 전반이나 특정 현안에 대해 국무총리와 국무위원(장관)들을 국회로 불러 직접 질문하고 답변을 듣는 제도야.`}],
  history:`과거 중동 지역 분쟁 시에도 미국의 파병 요청이 있었고, 한국은 동맹 관계와 경제적 파장 사이에서 줄타기를 해왔어.`,
  players:`파병을 압박하는 미국 트럼프 행정부, 신중을 기하는 한국 정부, 그리고 찬반으로 나뉜 여야 정치권이 맞물려 있어.`,
  current:`국내외 반발 여론이 거세지는 가운데, 정부는 파병의 수위와 형식을 놓고 장고를 거듭하고 있는 상황이야.`,
  outlook:`국회 비준 동의 등 향후 파병 결정 과정에서 험난한 정치적 진통이 계속될 것으로 예상돼.`,
  sources:[{title:`트럼프 호르무즈 파병 압박 및 여야 공방 - 한국경제`,url:`https://hankyung.com`},{title:`호르무즈 파병 반대 촛불집회 예고 - 뉴시스`,url:`https://newsis.com`}]

  category:`정치`,
  colorFg:`#d93025`,
  colorBg:`#fce8e6`,
  headline:`미군, 이란 유조선 추가 격침... 페르시아만 군사적 긴장 최고조`,
  metrics:[`미군, 나흘간 이란 유조선 8척 격침`,`브렌트유 배럴당 100달러 돌파`],
  summary:`페르시아만과 호르무즈 해협을 둘러싼 미국과 이란의 무력 충돌이 걷잡을 수 없이 격화되고 있어. 이란이 미 군함을 향해 탄도 미사일을 쏘자, 미 중부사령부는 이에 대한 보복으로 이란 유조선 5척을 추가로 격침시켰어. 이란 역시 요르단 내 미군 기지에 미사일을 발사하며 정면충돌 양상을 보이고 있지. 다행히 요르단 방공망에 요격되었지만, 전면전 우려는 그 어느 때보다 커진 상태야. 이처럼 중동 지역의 화약고가 폭발 직전까지 가면서, 글로벌 원유 공급망 차질 우려로 국제 유가는 배럴당 100달러를 돌파했어.`,
  keyTerms:[{term:`중부사령부`,explanation:`미군의 통합전투사령부 중 하나로, 주로 중동, 북아프리카, 중앙아시아 지역의 군사 작전을 총괄하는 곳이야.`}],
  history:`미국의 이란 핵합의 탈퇴 이후 양국 간의 경제 제재와 군사적 마찰이 수년간 반복되며 긴장이 누적되어 왔어.`,
  players:`초강경 대응을 주도하는 미군과 호르무즈 해협을 무기로 삼는 이란 혁명수비대가 정면으로 대치 중이야.`,
  current:`서로 공격과 보복을 주고받으며 '눈에는 눈'식의 군사 작전이 실전으로 전개되고 있어 매우 위험해.`,
  outlook:`양국 간 극적인 중재가 없다면 국지전 수준을 넘어선 중동 전체의 안보 위기로 확전될 가능성이 높아.`,
  sources:[{title:`미-이란 무력 충돌 및 유가 급등 - WNG`,url:`https://wng.org`},{title:`미군, 이란 유조선 추가 격침 상황 - YouTube News`,url:`https://youtube.com`}]

  headline:`영국, 이스라엘 유대인 정착촌 제재... 양국 외교 관계 최악 치달아`,
  metrics:[`영국, 유대인 정착촌 제품 수입 전면 금지`,`이스라엘, 영국 의원 12명 입국 금지 조치`],
  summary:`영국과 이스라엘 사이에 전례 없는 외교 전쟁이 터졌어. 영국 외무장관이 요르단강 서안지구의 이스라엘 유대인 정착촌 확장을 인종 청소라고 맹비난하며, 해당 지역 제품의 수입을 전면 금지하는 경제 제재를 발동했거든. 이에 격분한 이스라엘 정부는 동예루살렘에 있는 영국 영사관을 즉각 폐쇄하고, 제재에 찬성한 영국 의원 12명의 입국을 금지하는 초강수로 맞대응했어. 오랫동안 복잡하게 얽혀있던 중동 문제에 유럽 주요국이 직접적인 경제 제재로 개입하면서 외교적 파장이 일파만파 커지고 있는 형국이야.`,
  keyTerms:[{term:`유대인 정착촌`,explanation:`이스라엘이 국제법을 어기고 팔레스타인 영토 내에 자국민을 이주시켜 세운 마을로, 중동 분쟁의 핵심 뇌관이야.`}],
  history:`서안지구 정착촌 문제는 이스라엘과 팔레스타인 간 평화 협상의 가장 큰 걸림돌로 국제사회의 지속적인 비판을 받아왔어.`,
  players:`강경한 입장을 고수하는 이스라엘 현 정권과 인권 문제를 이유로 제재에 나선 영국 정부가 맞서고 있어.`,
  current:`단순한 규탄 성명을 넘어 실제 무역 제재와 영사관 폐쇄라는 실질적인 외교 보복전으로 비화되었어.`,
  outlook:`영국의 조치가 유럽연합(EU) 등 다른 서방 국가들의 연쇄 제재로 이어질지 이스라엘이 촉각을 곤두세우고 있어.`,
  sources:[{title:`영국-이스라엘 외교 갈등 심화 - YouTube News`,url:`https://youtube.com`}]

  headline:`정부, 내년도 건강보험료율 7.19%로 동결... 고물가 속 서민 부담 완화 조치`,
  metrics:[`2027년 건강보험료율 7.19% 유지`,`고물가로 인한 서민 경제 부담 완화 목표`],
  summary:`정부가 내년(2027년)에 적용될 건강보험료율을 올해와 동일한 7.19%로 동결하기로 확정했어. 최근 지속되는 고물가와 고금리로 인해 팍팍해진 서민들의 경제적 부담을 조금이나마 덜어주기 위한 특단의 조치야. 보통 매년 인상되던 건강보험료가 동결된 것은 이례적인 일로, 장바구니 물가 상승에 지친 국민들에게는 반가운 소식이지. 다만, 건강보험 재정 건전성에 대한 우려의 목소리도 나오고 있어 정부는 불필요한 의료 쇼핑을 줄이고 지출을 효율화하는 재정 안정화 대책을 함께 추진할 계획이라고 밝혔어.`,
  keyTerms:[{term:`건강보험료율`,explanation:`직장 가입자나 지역 가입자가 소득이나 재산에 비례해 매월 납부해야 하는 건강보험료의 비율을 말해.`}],
  history:`인구 고령화와 의료비 증가로 인해 건강보험료율은 그동안 거의 매년 꾸준히 인상되는 추세였어.`,
  players:`보험료를 결정하는 보건복지부 산하 건강보험정책심의위원회와 가입자인 국민들이 주요 당사자야.`,
  current:`체감 물가가 급등하면서 국민들의 조세 및 준조세 저항 심리가 커지자 정부가 동결 카드를 꺼낸 거야.`,
  outlook:`단기적으로는 부담이 줄지만, 중장기적으로 건강보험 누적 적립금을 어떻게 유지할지가 중요한 과제가 될 거야.`,
  sources:[{title:`내년 건보료 동결 및 보건 이슈 - HK한타임즈`,url:`https://hkhantimes.com`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`엔비디아, 오픈소스 AI 플랫폼 '허깅페이스' 129억 달러에 전격 인수`,
  metrics:[`인수 금액 약 129억 달러 (약 17조 원)`,`AI 모델 공유 플랫폼 장악으로 소프트웨어 생태계 확장`],
  summary:`AI 반도체 시장을 독점하고 있는 엔비디아가 세계 최대의 오픈소스 AI 모델 공유 플랫폼인 허깅페이스를 129억 달러에 인수한다고 깜짝 발표했어. 허깅페이스는 전 세계 개발자들이 AI 모델과 코드를 올리고 공유하는 AI계의 깃허브로 불리는 곳이야. 이번 인수는 엔비디아가 단순히 하드웨어 칩을 파는 것을 넘어, 개발자들이 활동하는 소프트웨어 생태계까지 완벽하게 장악하겠다는 강력한 의지를 보여준 거야. 테크 업계는 이번 메가딜이 향후 인공지능 산업의 권력 구도를 엔비디아 중심으로 완전히 재편할 것이라며 촉각을 곤두세우고 있어.`,
  keyTerms:[{term:`오픈소스`,explanation:`소프트웨어의 설계도인 소스 코드를 누구나 자유롭게 보고, 수정하고, 재배포할 수 있도록 공개하는 방식이야.`}],
  history:`엔비디아는 GPU 하드웨어에서의 압도적 우위를 바탕으로 CUDA 등 소프트웨어 플랫폼 확장을 꾸준히 시도해왔어.`,
  players:`생태계 확장을 노리는 엔비디아와 막대한 개발자 풀을 가진 허깅페이스, 그리고 이를 견제하는 빅테크 경쟁사들이 있어.`,
  current:`AI 개발의 필수 인프라가 된 두 회사가 결합하면서 AI 산업 전반에 엄청난 시너지와 독점 우려가 교차하고 있어.`,
  outlook:`반독점 규제 당국의 기업 결합 승인 여부와 타 빅테크 기업들의 합종연횡 등 견제 움직임이 본격화될 전망이야.`,
  sources:[{title:`엔비디아 허깅페이스 대규모 인수 - VerakWorld`,url:`https://verakworld.com`}]

  category:`기타 이슈`,
  colorFg:`#0d7a5f`,
  colorBg:`#e6f4f1`,
  headline:`프린스턴 대학 인공지능, 꿈의 에너지 '핵융합 플라즈마' 실시간 제어 성공`,
  metrics:[`밀리초 단위로 핵융합 플라즈마 불안정성 예측 및 제어`,`안정적인 핵융합 에너지 상용화 앞당길 핵심 기술 확보`],
  summary:`프린스턴 대학교 연구진이 개발한 특수 인공지능(AI) 모델이 태양보다 훨씬 뜨거운 인공태양, 즉 핵융합 플라즈마를 실시간으로 제어하는 데 성공해 화제야. 핵융합 발전은 무한하고 깨끗한 꿈의 에너지로 불리지만, 초고온 플라즈마가 순식간에 붕괴하는 불안정성 문제가 가장 큰 난제였거든. 연구진의 AI는 플라즈마가 찢어지는 징후를 무려 밀리초 단위로 미리 예측하고 방지하는 마법 같은 능력을 보여줬어. 과학계는 이 획기적인 연구 결과가 인류의 오랜 숙원인 핵융합 에너지 상용화 시기를 크게 앞당길 수 있는 역사적인 전환점이 될 것이라고 환호하고 있어.`,
  keyTerms:[{term:`핵융합`,explanation:`가벼운 원자핵들이 엄청난 열과 압력 속에서 합쳐져 무거운 원자핵이 되며 막대한 에너지를 뿜어내는 현상이야.`}],
  history:`핵융합은 수십 년간 연구되어 왔지만, 극한의 환경에서 플라즈마 상태를 장시간 유지하는 기술적 장벽에 부딪혀 왔어.`,
  players:`프린스턴 플라즈마 물리 연구소(PPPL) 등 전 세계 첨단 물리 연구소들이 이 기술 선점을 위해 각축전을 벌이고 있어.`,
  current:`AI 기술이 비약적으로 발전하면서, 과거 인간의 계산으로는 불가능했던 초고속 복잡계 제어가 비로소 가능해진 거야.`,
  outlook:`이번 성공을 발판으로 더 큰 규모의 핵융합로(ITER 등)에 AI 제어 기술이 본격 도입되며 상용화 연구가 가속될 예정이야.`,
  sources:[{title:`프린스턴 대학 핵융합 플라즈마 AI 제어 - SciTechDaily`,url:`https://scitechdaily.com`}]

let current = null;
let currentCat = null;
const CAT_ORDER = ['경제', '정치', '기타 이슈'];

function renderSidebar() {
  const list = document.getElementById('date-list');
  list.innerHTML = '';
  BRIEFS.forEach((b, i) => {
    const el = document.createElement('div');
    el.className = 'date-item' + (i === 0 ? ' active' : '');
    el.dataset.tag = b.tag;
    const parts = b.tag.split('-');
    const short = parts[1] + '/' + parts[2];
    el.innerHTML = b.tag;
    el.addEventListener('click', () => showBrief(b.tag));
    list.appendChild(el);
  });
}

function showBrief(tag) {
  current = tag;
  document.querySelectorAll('.date-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tag === tag);
  });
  const brief = BRIEFS.find(b => b.tag === tag);
  if (!brief) return;

  // 카테고리별 그룹핑
  const grouped = {};
  brief.stories.forEach(s => {
    if (!grouped[s.category]) grouped[s.category] = [];
    grouped[s.category].push(s);
  });
  const availableCats = CAT_ORDER.filter(c => grouped[c] && grouped[c].length);
  if (!availableCats.length) return;

  // 기본 카테고리 결정
  if (!availableCats.includes(currentCat)) currentCat = availableCats[0];

  renderContent(brief, grouped, availableCats);
}

function renderContent(brief, grouped, availableCats) {
  const content = document.getElementById('content');
  let html = `<div class="sticky-top">
    <div class="brief-header">
      <div class="bh-eyebrow">Morning Brief</div>
      <h2>${brief.label}</h2>
    </div>`;

  // 탭
  html += '<div class="cat-tabs">';
  availableCats.forEach(c => {
    const cls = c === currentCat ? 'cat-tab active' : 'cat-tab';
    html += `<button class="${cls}" data-cat="${c}">${c}</button>`;
  });
  html += '</div></div>';

  // 선택된 카테고리 기사들
  const stories = grouped[currentCat] || [];
  stories.forEach((s, idx) => {
    if (idx > 0) html += '<hr class="story-divider">';
    html += `<div class="story">
      <div class="story-top">
        <div class="story-headline">${s.headline}</div>
      </div>`;
    if (s.metrics.length) {
      html += '<div class="metrics">';
      s.metrics.forEach(m => { html += `<div class="metric-chip">${m}</div>`; });
      html += '</div>';
    }
    // 요약문에 핵심 개념 밑줄 (출력은 박스 다음)
    let summaryHtml = s.summary;
    if (s.keyTerms && s.keyTerms.length) {
      s.keyTerms.forEach(kt => {
        if (!kt.term) return;
        const safe = kt.term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const re = new RegExp(safe, 'g');
        summaryHtml = summaryHtml.replace(re, `<span class="kt-underline">${kt.term}</span>`);
      });
    }

    // 핵심 개념 박스 (요약 위)
    if (s.keyTerms && s.keyTerms.length) {
      html += '<div class="key-terms"><div class="key-terms-title">핵심 개념</div>';
      s.keyTerms.forEach(kt => {
        html += `<div class="kt-item">
          <span class="kt-term">${kt.term}</span>
          <span class="kt-exp">${kt.explanation}</span>
        </div>`;
      });
      html += '</div>';
    }

    html += `<div class="summary">${summaryHtml}</div>`;

    const bgSections = [
      ['역사적 맥락', s.history],
      ['핵심 플레이어', s.players],
      ['현재 구도', s.current],
      ['향후 전망', s.outlook],
    ].filter(([, v]) => v);

    if (bgSections.length) {
      html += '<div class="bg-box"><div class="bg-box-title">배경 스토리</div>';
      bgSections.forEach(([label, text]) => {
        html += `<div class="bg-section">
          <div class="bg-section-label">${label}</div>
          <div class="bg-section-text">${text}</div>
        </div>`;
      });
      html += '</div>';
    }

    if (s.sources.length) {
      html += `<button class="sources-toggle" data-toggle="srcs-${idx}">출처 ${s.sources.length}개 보기 <span class="arrow">▾</span></button>`;
      html += `<div class="sources-body" id="srcs-${idx}">`;
      s.sources.forEach((src, si) => {
        html += `<div class="source-item">
          <span class="src-num">${si+1}</span>
          <a href="${src.url}" target="_blank">${src.title}</a>
        </div>`;
      });
      html += '</div>';
    }
    html += '</div>';
  });

  content.innerHTML = html;

  // 탭 클릭 핸들러
  content.querySelectorAll('.cat-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentCat = btn.dataset.cat;
      renderContent(brief, grouped, availableCats);
    });
  });

  // 출처 토글
  content.querySelectorAll('.sources-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const body = document.getElementById(btn.dataset.toggle);
      const isOpen = body.classList.toggle('open');
      btn.classList.toggle('open', isOpen);
    });
  });

  document.getElementById('main').scrollTop = 0;
}

if (BRIEFS.length > 0) {
  renderSidebar();
  showBrief(BRIEFS[0].tag);
} else {
  document.getElementById('content').innerHTML = '<div class="empty">브리핑 데이터가 없습니다.</div>';
}

// ── Quiz Gate ──
const PASS_TARGET = 3;
let correctCount = 0;
const usedIndexes = new Set();

function pickQuestion() {
  // 사용 안 한 문제 중 랜덤. 다 썼으면 풀 리셋
  if (usedIndexes.size >= QUIZ.length) usedIndexes.clear();
  let idx;
  do { idx = Math.floor(Math.random() * QUIZ.length); } while (usedIndexes.has(idx));
  usedIndexes.add(idx);
  return QUIZ[idx];
}

function updateCounter() {
  document.getElementById('quiz-counter').textContent = `(${correctCount}/${PASS_TARGET})`;
}

function renderQuiz() {
  const q = pickQuestion();
  document.getElementById('quiz-q').textContent = q.q;
  updateCounter();
  const feedback = document.getElementById('quiz-feedback');
  feedback.textContent = '';
  feedback.className = 'quiz-feedback';
  const closeBtn = document.getElementById('quiz-close');
  closeBtn.classList.add('hidden');

  const choicesEl = document.getElementById('quiz-choices');
  choicesEl.innerHTML = '';
  // 보기 순서 섞기 (정답 위치 고정 방지)
  const order = q.a.map((_, i) => i);
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  order.forEach(idx => {
    const text = q.a[idx];
    const btn = document.createElement('button');
    btn.className = 'quiz-choice';
    btn.textContent = text;
    btn.addEventListener('click', () => {
      const allBtns = choicesEl.querySelectorAll('.quiz-choice');
      allBtns.forEach(b => b.disabled = true);
      if (idx === q.correct) {
        btn.classList.add('correct');
        correctCount++;
        updateCounter();
        if (correctCount >= PASS_TARGET) {
          feedback.textContent = '통과! 들어와도 좋아.';
          feedback.className = 'quiz-feedback right';
          closeBtn.classList.remove('hidden');
        } else {
          feedback.textContent = '역시 맞출 줄 알았어. 다음 문제 고.';
          feedback.className = 'quiz-feedback right';
          btn.blur();
          setTimeout(() => {
            if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
            renderQuiz();
          }, 900);
        }
      } else {
        btn.classList.add('wrong');
        feedback.textContent = '정말 실망이다.... 다음.';
        feedback.className = 'quiz-feedback wrong';
        btn.blur();
        setTimeout(() => {
          if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
          renderQuiz();
        }, 900);
      }
    });
    choicesEl.appendChild(btn);
  });
}

document.getElementById('quiz-close').addEventListener('click', () => {
  document.getElementById('quiz-overlay').classList.add('hidden');
  document.body.classList.remove('quiz-active');
});

document.body.classList.add('quiz-active');
renderQuiz();

// ── Mobile sidebar toggle ──
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('sidebar-backdrop');
function toggleSidebar(open) {
  sidebar.classList.toggle('open', open);
  backdrop.classList.toggle('open', open);
}
document.getElementById('sidebar-toggle').addEventListener('click', () => toggleSidebar(!sidebar.classList.contains('open')));
backdrop.addEventListener('click', () => toggleSidebar(false));
// 날짜 클릭하면 모바일에서 자동으로 닫히게
sidebar.addEventListener('click', e => {
  if (e.target.classList.contains('date-item') && window.innerWidth <= 768) {
    toggleSidebar(false);
  }
});
